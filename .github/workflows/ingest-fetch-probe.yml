# TEMPORARY — tests article fetching (direct + relay) from a GitHub runner.
# Remove before merging the ingest-fetch-fallbacks PR.
name: Ingest fetch probe (temporary)
on:
  push:
    branches: [ingest-fetch-fallbacks]
    paths: ['.github/workflows/ingest-fetch-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          INGEST_RELAY_URL: https://2fc31f27.worldmachines-2rd.pages.dev/api/ingest-relay
          INGEST_RELAY_TOKEN: ${{ secrets.INGEST_RELAY_TOKEN }}
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, 'scripts')
          import article_fetch
          URLS = [
              'https://aneeshsathe.com/nakatomi-drift/',
              'https://aneeshsathe.com/not-my-lever/',
              'https://open.substack.com/pub/seanstevenson/p/circular-error?r=yrsx',
              'https://open.substack.com/pub/seanstevenson/p/la-selva-oscura',
              'https://substack.com/inbox/post/201072921',
              'https://notefields.substack.com/p/wrestling-with-eels',
              'https://seanstevenson.substack.com/p/the-art-of-nature',
              'https://www.hopefulmons.com/p/a-song-of-proto-industrialization',
          ]
          for u in URLS:
              print(f'\n{u}')
              t, d, text, ok = article_fetch.fetch_and_extract(u)
              print(f'  RESULT ok={ok} title={t!r} date={d!r} chars={len(text or "")}')
          print('\npasted (bogus key, expect None):', article_fetch.fetch_pasted('00000000-0000-0000-0000-000000000000.txt'))
          PY
