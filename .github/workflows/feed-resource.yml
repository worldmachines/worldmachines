# Run one already-uploaded resource through wm-feeder and commit its reading
# notes. Called by ingest.yml (web form) and inbox.yml (writing inbox) after
# they upload the text to R2 at raw/resources/<slug>.txt.
#
# Essay/paper resources: run wm-feeder (Gemma on Workers AI) for L1 reading
# notes. Only notes/*.md are committed (raw-notes/commons/reading/<slug>/);
# sidecars/ (verbatim quotes, plan.json) and diagnostics stay in R2, listed
# by the manifest at resource-runs/<slug>.json. On failure the article JSON
# simply stays ingest_status: queued; re-run with scripts/feed_resource.py.
name: Feed resource

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      FEEDER_URL: ${{ vars.FEEDER_URL }}
      FEEDER_BUCKET: ${{ vars.FEEDER_BUCKET }}
      FEEDER_TOKEN: ${{ secrets.FEEDER_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SLUG: ${{ inputs.slug }}

    steps:
      # main, not the triggering SHA: the caller's job pushed the article JSON.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run feeder and fetch notes
        working-directory: website
        run: |
          python scripts/feed_resource.py "content/articles/$SLUG.json" \
            --skip-upload --defer-manifest "$RUNNER_TEMP/manifest.json"

      - name: Commit notes to main
        run: |
          set -euo pipefail
          git config user.name  "worldmachines-bot"
          git config user.email "bot@worldmachines.org"
          git add "raw-notes/commons/reading/$SLUG/" "website/content/articles/$SLUG.json"
          if git diff --staged --quiet; then
            echo "::error::no reading notes to commit for $SLUG"
            exit 1
          fi
          git commit -m "Reading notes: $SLUG (wm-feeder) [trivial]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed; retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push reading notes for $SLUG"
          exit 1

      - name: Upload run manifest
        working-directory: website
        run: python scripts/feed_resource.py put-manifest "$RUNNER_TEMP/manifest.json"
