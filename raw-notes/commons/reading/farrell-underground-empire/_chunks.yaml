source: farrell-underground-empire
units:
- nn: 1
  unit_id: introduction
  note_id: farrell-underground-empire-introduction
  span: 38:30311
  chunks:
  - id: farrell-underground-empire#u01-c1
    label: c1
    heading: The Underground Empire as Roman Roads
    char_start: 38
    char_end: 1605
    why: 'Establishes the book''s governing metaphor: modern network infrastructure functions like Roman
      roads and aqueducts, carrying both commerce and imperial power.'
  - id: farrell-underground-empire#u01-c2
    label: c2
    heading: The Plumbing Is Political
    char_start: 3564
    char_end: 4193
    why: 'States the book''s central thesis in its most compressed form: ostensibly technical infrastructure
      is a lever of geopolitical coercion.'
  - id: farrell-underground-empire#u01-c3
    label: c3
    heading: 'Two False Narratives: Putin''s Conspiracy and Friedman''s Flat World'
    char_start: 10514
    char_end: 13158
    why: Stages the argument by negation, rejecting both the conspiratorial and the end-of-geopolitics
      readings of globalization that the book's path-dependence account supersedes.
  - id: farrell-underground-empire#u01-c4
    label: c4
    heading: 'Path Dependence: The NSA''s One Percent'
    char_start: 15577
    char_end: 16420
    why: Supplies the concrete evidence (bandwidth routing, SWIFT's board and data center, dollar clearing,
      semiconductor IP) for the claim that global networks froze in place America's Cold War-era centrality.
  - id: farrell-underground-empire#u01-c5
    label: c5
    heading: Weaponizing SWIFT and Dollar Clearing After 9/11
    char_start: 19577
    char_end: 20668
    why: Documents the precise historical hinge — Treasury's post-9/11 pivot to SWIFT and dollar clearing
      against Iran — by which emergency improvisation became permanent policy infrastructure.
  - id: farrell-underground-empire#u01-c6
    label: c6
    heading: Hidden Power Cannot Survive Exposure
    char_start: 29611
    char_end: 30282
    why: 'Delivers the introduction''s normative payoff and forecast: an empire that depended on concealment
      is now exposed and will erode or provoke retaliation.'
- nn: 2
  unit_id: ch01-wriston-world
  note_id: farrell-underground-empire-ch01-wriston-world
  span: 30311:85868
  chunks:
  - id: farrell-underground-empire#u02-c1
    label: c1
    heading: Wriston's decentralization thesis
    char_start: 30759
    char_end: 31182
    why: States Wriston's founding thesis in his own terms before the chapter spends its length inverting
      it.
  - id: farrell-underground-empire#u02-c2
    label: c2
    heading: 'The book''s central irony: centralizers by nature'
    char_start: 35802
    char_end: 36844
    why: 'The chapter''s thesis statement: business leaders who believed they were dissolving state power
      instead built the chokepoints that state power would later exploit.'
  - id: farrell-underground-empire#u02-c3
    label: c3
    heading: Herstatt crisis exposes the hidden system
    char_start: 44660
    char_end: 45634
    why: Shows the Eurodollar clearing system's latent fragility becoming suddenly visible in crisis,
      revealing private banks as the world's de facto payments mechanism.
  - id: farrell-underground-empire#u02-c4
    label: c4
    heading: SWIFT becomes an obligatory passage point
    char_start: 50287
    char_end: 51092
    why: Demonstrates that even a consortium built to prevent single-bank capture still produced a mandatory
      global chokepoint.
  - id: farrell-underground-empire#u02-c5
    label: c5
    heading: The Internet's accidental centralization
    char_start: 70489
    char_end: 71509
    why: States directly that the Internet's centerless founding myth is untrue, and frames its concentration
      as an unplanned emergent outcome rather than a design choice.
  - id: farrell-underground-empire#u02-c6
    label: c6
    heading: TSMC and the double-edged semiconductor chokepoint
    char_start: 82916
    char_end: 84500
    why: Sets up the book's weaponized-interdependence argument by showing the same global supply chain
      as both a U.S. vulnerability and a U.S. lever of control.
- nn: 3
  unit_id: ch02-stormbrew-map
  note_id: farrell-underground-empire-ch02-stormbrew-map
  span: 85868:149495
  chunks:
  - id: farrell-underground-empire#u03-c1
    label: c1
    heading: Maps as instruments of sovereign claim
    char_start: 86417
    char_end: 86916
    why: States the chapter's governing thesis that maps don't just describe territory but manufacture
      the legal basis for dominion over it.
  - id: farrell-underground-empire#u03-c2
    label: c2
    heading: Hayden's Niagara Falls hypothetical
    char_start: 92815
    char_end: 93028
    why: Hayden's own pre-9/11 example of the U.S./non-U.S. legal line, later inverted, shows how the
      same fact pattern licenses opposite policies depending on political will.
  - id: farrell-underground-empire#u03-c3
    label: c3
    heading: Room 641A and the fiber-optic splitter
    char_start: 103977
    char_end: 104533
    why: The concrete mechanics of how a legal claim over surveillance depended on a physical, corporate-enabled
      tap into the internet backbone.
  - id: farrell-underground-empire#u03-c4
    label: c4
    heading: SWIFT as the financial Rosetta Stone
    char_start: 118865
    char_end: 119322
    why: 'Names the financial-mapping analogue to STORMBREW: SWIFT data as the legible substrate that
      let Treasury translate global money flows into targetable intelligence.'
  - id: farrell-underground-empire#u03-c5
    label: c5
    heading: Banco Delta Asia's disproportionate shock
    char_start: 132246
    char_end: 132577
    why: The clearest evidence that dollar-clearing designation's power comes from contagion and reputational
      fear rather than the sums directly frozen.
  - id: farrell-underground-empire#u03-c6
    label: c6
    heading: Jack Lew's warning against overreach
    char_start: 147308
    char_end: 147542
    why: The chapter's own closing caution that the centrality enabling U.S. financial coercion is also
      what overreach risks eroding, setting up the pivot to rival maps.
- nn: 4
  unit_id: ch03-war-without-gunsmoke
  note_id: farrell-underground-empire-ch03-war-without-gunsmoke
  span: 149495:212162
  chunks:
  - id: farrell-underground-empire#u04-c1
    label: c1
    heading: The empire's real stakes in Huawei
    char_start: 154714
    char_end: 155340
    why: 'States the chapter''s central thesis: this is imperial struggle over the underground empire,
      not a commercial dispute.'
  - id: farrell-underground-empire#u04-c2
    label: c2
    heading: Wolves devouring the lion
    char_start: 159787
    char_end: 160276
    why: The guerrilla/predator metaphor that structures the whole chapter's account of Huawei's rise
      and eventual reversal.
  - id: farrell-underground-empire#u04-c3
    label: c3
    heading: The footnote that reeled in TSMC
    char_start: 195140
    char_end: 195851
    why: The technical mechanism—an obscure export-control footnote—that converted U.S. IP dominance into
      a chokepoint capable of crippling Huawei's chip supply.
  - id: farrell-underground-empire#u04-c4
    label: c4
    heading: The arrest at gate 65
    char_start: 181383
    char_end: 181923
    why: The concrete human moment where financial-empire leverage over HSBC translates into a physical
      detention.
  - id: farrell-underground-empire#u04-c5
    label: c5
    heading: The empire as means, not just rationale
    char_start: 186120
    char_end: 186773
    why: Directly names how dollar-clearing dependency compelled HSBC's cooperation, the mechanism underlying
      the whole arrest.
  - id: farrell-underground-empire#u04-c6
    label: c6
    heading: Scale versus control
    char_start: 211110
    char_end: 211834
    why: The chapter's closing thesis on the asymmetry between economic size and control over global economic
      chokepoints.
- nn: 5
  unit_id: ch04-waking-into-winter
  note_id: farrell-underground-empire-ch04-waking-into-winter
  span: 212162:276988
  chunks:
  - id: farrell-underground-empire#u05-c1
    label: c1
    heading: 'Von der Leyen''s speech: the EU wakes'
    char_start: 213585
    char_end: 214554
    why: Names the chapter's Sleeping-Beauty conceit at the exact moment the EU's sweeping 2022 sanctions
      package is announced, framing everything before it as slumber.
  - id: farrell-underground-empire#u05-c2
    label: c2
    heading: The flatland of commercial exchange
    char_start: 220869
    char_end: 221376
    why: 'States the chapter''s core diagnosis: Europe''s entire strategic vocabulary made underground
      power (American, Russian, Chinese) literally imperceptible.'
  - id: farrell-underground-empire#u05-c3
    label: c3
    heading: From ally to outlying province
    char_start: 233584
    char_end: 234143
    why: Marks the emotional pivot from complacency to fear that predates Russia's invasion, locating
      the real shock in Trump's treatment of Europe as a subject rather than an ally.
  - id: farrell-underground-empire#u05-c4
    label: c4
    heading: The ECFR report's quiet radicalism
    char_start: 239651
    char_end: 240474
    why: Shows how a jointly commissioned think-tank report seeded ideas — coercive EU instruments, reverse-dependency
      mapping — that were shelved in 2019 but became mainstream Commission thinking after 2022, a paradigm
      assembling in the dark before it lurches into visibility.
  - id: farrell-underground-empire#u05-c5
    label: c5
    heading: 'Vestager: ''we were just greedy'''
    char_start: 275789
    char_end: 276253
    why: 'The chapter''s own retrospective gloss on its thesis, in the words of a sitting Commission vice
      president: Europe''s exposure to weaponized interdependence was self-inflicted, not merely imposed.'
  - id: farrell-underground-empire#u05-c6
    label: c6
    heading: Cold and alone on a bare hillside
    char_start: 276672
    char_end: 276959
    why: The chapter's closing inversion of its own fairy-tale frame, denying Europe both the disenchanted
      safety it hoped for and any easy resolution to what it discovered.
- nn: 6
  unit_id: ch05-hooks-captain
  note_id: farrell-underground-empire-ch05-hooks-captain
  span: 276988:362045
  chunks:
  - id: farrell-underground-empire#u06-c1
    label: c1
    heading: Hook's blackmail of the tanker captain
    char_start: 278231
    char_end: 279407
    why: The chapter's controlling image of coercion via a mapped commercial network, giving the chapter
      its title.
  - id: farrell-underground-empire#u06-c2
    label: c2
    heading: Networks as vulnerability, not neutrality
    char_start: 279820
    char_end: 280985
    why: 'States the chapter''s thesis directly: global commercial networks have become sources of corporate
      vulnerability rather than escape.'
  - id: farrell-underground-empire#u06-c3
    label: c3
    heading: Hayden's invisible boundary
    char_start: 292371
    char_end: 292870
    why: Identifies the exact mechanism — a legal/territorial line drawn by the NSA — that later trapped
      Microsoft and other US multinationals.
  - id: farrell-underground-empire#u06-c4
    label: c4
    heading: Buterin on base-layer centralization
    char_start: 329215
    char_end: 330166
    why: Buterin's diagnosis of how infrastructure networks concentrate power motivates crypto's entire
      attempt at capture-resistant design.
  - id: farrell-underground-empire#u06-c5
    label: c5
    heading: 'Chang: the world is not flat anymore'
    char_start: 326232
    char_end: 326984
    why: Chang's rebuttal to Friedman marks TSMC's recognition that its founding premise of apolitical
      globalization has ended.
  - id: farrell-underground-empire#u06-c6
    label: c6
    heading: Tornado Cash as unstoppable, alegal code
    char_start: 355916
    char_end: 356573
    why: The clearest test case of whether capture-resistance can be engineered into code itself rather
      than claimed as corporate posture.
- nn: 7
  unit_id: ch06-empire-of-wind-and-light
  note_id: farrell-underground-empire-ch06-empire-of-wind-and-light
  span: 362045:412890
  chunks:
  - id: farrell-underground-empire#u07-c1
    label: c1
    heading: The widening gyre of mutual misperception
    char_start: 365634
    char_end: 366114
    why: 'States the chapter''s core diagnosis: as the empire becomes visible to its targets, US power
      persists but predictability collapses because both sides misread each other''s actions.'
  - id: farrell-underground-empire#u07-c2
    label: c2
    heading: An accidental empire, not a master plan
    char_start: 368005
    char_end: 368935
    why: The book's key historiographical claim -- the empire is emergent bureaucratic improvisation rather
      than grand design, directly resonant with a history-machine reading of infrastructure.
  - id: farrell-underground-empire#u07-c3
    label: c3
    heading: 'Mulder''s warning: sanctions fear can cause the war it''s meant to prevent'
    char_start: 392146
    char_end: 393465
    why: Introduces the interwar analogy (League of Nations sanctions helping precipitate WWII) that reframes
      US-China economic warfare as a possible re-run of a war-causing dynamic, not just a Cold War rerun.
  - id: farrell-underground-empire#u07-c4
    label: c4
    heading: The Axis-power analogy for China
    char_start: 393467
    char_end: 394153
    why: The chapter's starkest, most quotable rhetorical move -- explicitly analogizing a paranoid, economically
      encircled China to interwar Axis powers and posing the open question of whether it turns to war.
  - id: farrell-underground-empire#u07-c5
    label: c5
    heading: Needing a Schelling for economic warfare
    char_start: 399754
    char_end: 400593
    why: 'States the book''s prescriptive thesis: economic statecraft needs the kind of systematic strategic
      theory Schelling gave nuclear deterrence, since no one currently understands the shape of the board.'
  - id: farrell-underground-empire#u07-c6
    label: c6
    heading: No visible exit -- bending empire toward the sun
    char_start: 412147
    char_end: 412889
    why: 'The book''s closing passage and title-resolving image: empire cannot be escaped, only redirected
      -- the final, load-bearing statement of the whole argument.'
