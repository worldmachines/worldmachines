units:
- nn: 1
  unit_id: ch01-the-hague-1676
  note_id: stewart-courtier-and-heretic-ch01-the-hague-1676
  span: 3:13019
  chunks:
  - id: stewart-courtier-and-heretic#u01-c1
    label: c1
    heading: Public denunciation, private courtship
    char_start: 708
    char_end: 1544
    why: Establishes the chapter's central irony — Leibniz's public condemnation of Spinoza masking a
      secret, sustained intellectual pursuit that culminates in the 1676 visit.
  - id: stewart-courtier-and-heretic#u01-c2
    label: c2
    heading: Puncturing Leibniz's cover story
    char_start: 7096
    char_end: 7703
    why: Gives the documentary core of the meeting itself, showing Stewart's method of reading against
      Leibniz's own later denials.
  - id: stewart-courtier-and-heretic#u01-c3
    label: c3
    heading: The belated confession
    char_start: 8228
    char_end: 8893
    why: Stewart's strongest direct textual warrant for the book's organizing claim that the Hague meeting
      was the defining event of Leibniz's life.
  - id: stewart-courtier-and-heretic#u01-c4
    label: c4
    heading: Spinoza as first observer of modernity
    char_start: 9756
    char_end: 10662
    why: States the book's thesis about Spinoza as the archetypal active, affirming response to the modern
      condition — the load-bearing claim for the whole double-biography.
  - id: stewart-courtier-and-heretic#u01-c5
    label: c5
    heading: Leibniz as the reactive response
    char_start: 11324
    char_end: 12012
    why: The mirror-image thesis statement casting Leibniz's philosophy as a reactive answer to modernity,
      completing the book's core interpretive frame.
- nn: 2
  unit_id: ch02-bento
  note_id: stewart-courtier-and-heretic-ch02-bento
  span: 13019:59058
  chunks:
  - id: stewart-courtier-and-heretic#u02-c1
    label: c1
    heading: Freak or world-historical figure
    char_start: 13026
    char_end: 14008
    why: States the chapter's organizing tension between reading Spinoza as an aberration and as a history-changing
      individual, framing how Leibniz (and the reader) will approach him.
  - id: stewart-courtier-and-heretic#u02-c2
    label: c2
    heading: Tolerance as commercial self-interest
    char_start: 23085
    char_end: 23524
    why: Grounds Amsterdam's celebrated religious freedom in mercantile calculation rather than pure idealism,
      the material precondition that made Spinoza's heresy survivable.
  - id: stewart-courtier-and-heretic#u02-c3
    label: c3
    heading: 'The confession: a corporeal God, a mortal soul'
    char_start: 41249
    char_end: 41921
    why: The verbatim reported confession that constitutes the chapter's only direct exposition of Spinoza's
      actual early heresies, and the proximate cause of his excommunication.
  - id: stewart-courtier-and-heretic#u02-c4
    label: c4
    heading: The double exile as vantage point
    char_start: 54817
    char_end: 55632
    why: States Stewart's thesis that Spinoza's marginality was epistemically productive, letting him
      perceive the old theocratic order dying and conceive a secular remedy.
  - id: stewart-courtier-and-heretic#u02-c5
    label: c5
    heading: Self-sufficiency and the rejection of external authority
    char_start: 56131
    char_end: 57056
    why: Links Spinoza's temperament to a philosophical principle of authority emanating entirely from
      within, prefiguring the doctrine of conatus before it is named.
  - id: stewart-courtier-and-heretic#u02-c6
    label: c6
    heading: Serene departure, compared to the Exodus
    char_start: 51742
    char_end: 52201
    why: Captures Spinoza's own self-understanding at the moment of expulsion, framing his departure as
      a righteous exodus rather than a defeat.
- nn: 3
  unit_id: ch03-gottfried
  note_id: stewart-courtier-and-heretic-ch03-gottfried
  span: 59058:92692
  chunks:
  - id: stewart-courtier-and-heretic#u03-c1
    label: c1
    heading: The demographic catastrophe of the Thirty Years War
    char_start: 59896
    char_end: 60616
    why: Establishes the scale of civilizational collapse that forms the negative backdrop against which
      Leibniz's entire psychology and career are framed.
  - id: stewart-courtier-and-heretic#u03-c2
    label: c2
    heading: The universal characteristic
    char_start: 72355
    char_end: 72861
    why: The earliest seed of Leibniz's symbolic-logic project, a total-legibility ambition for philosophical
      thought itself.
  - id: stewart-courtier-and-heretic#u03-c3
    label: c3
    heading: The Leipzig rejection and its aftermath
    char_start: 74689
    char_end: 75580
    why: 'The chapter''s psychological hinge: Leibniz''s formative rupture and his diametrically opposite
      response to Spinoza''s excommunication.'
  - id: stewart-courtier-and-heretic#u03-c4
    label: c4
    heading: The Egypt Plan on the Rhine
    char_start: 88047
    char_end: 89058
    why: The vivid set-piece revealing Leibniz's compulsion to solve every problem at a single totalizing
      stroke.
  - id: stewart-courtier-and-heretic#u03-c5
    label: c5
    heading: Restlessness as the principle of the soul
    char_start: 90460
    char_end: 91495
    why: Directly links Leibniz's youthful itinerancy to the mature metaphysical doctrine that activity
      is the essence of the soul, seeding the monadology.
  - id: stewart-courtier-and-heretic#u03-c6
    label: c6
    heading: The insatiable need for affirmation
    char_start: 92055
    char_end: 92687
    why: The chapter's closing thesis statement, explicitly tying Leibniz's psychological neediness to
      the 1676 meeting with Spinoza around which the book is built.
- nn: 4
  unit_id: ch04-life-of-the-mind
  note_id: stewart-courtier-and-heretic-ch04-life-of-the-mind
  span: 92692:139120
  chunks:
  - id: stewart-courtier-and-heretic#u04-c1
    label: c1
    heading: Vanitas as the origin of philosophy
    char_start: 95204
    char_end: 95866
    why: States the existential crisis Stewart treats as the generative core of Spinoza's entire philosophical
      project.
  - id: stewart-courtier-and-heretic#u04-c2
    label: c2
    heading: Blessedness as the sole purpose of the Ethics
    char_start: 98608
    char_end: 99368
    why: Names the goal that Spinoza's ascetic rules of living were designed to serve, framing his rationalism
      in explicitly soteriological terms.
  - id: stewart-courtier-and-heretic#u04-c3
    label: c3
    heading: The materialist paradox of a life of the mind
    char_start: 114558
    char_end: 115432
    why: The chapter's clearest statement of desire-as-essence-of-man, the doctrine World Machines recognizes
      as conatus, posed as a paradox shared with Leibniz.
  - id: stewart-courtier-and-heretic#u04-c4
    label: c4
    heading: Man is a God to Man
    char_start: 120543
    char_end: 121435
    why: Lays out Spinoza's theory of philosophical fellowship as an inner circle set apart from ordinary
      humanity, the ideal his actual friendships repeatedly failed to match.
  - id: stewart-courtier-and-heretic#u04-c5
    label: c5
    heading: The underground sensibility of the de Vries circle
    char_start: 124030
    char_end: 124793
    why: Captures the quasi-clandestine, thicket-like intimacy of Spinoza's actual fellowship of reason,
      in tension with his official doctrine of it.
  - id: stewart-courtier-and-heretic#u04-c6
    label: c6
    heading: Leibniz would know too much
    char_start: 138466
    char_end: 139115
    why: The chapter's closing image converts the biographical detail into what Leibniz will personally
      witness, hinging directly into the book's central meeting.
- nn: 5
  unit_id: ch05-gods-attorney
  note_id: stewart-courtier-and-heretic-ch05-gods-attorney
  span: 139120:183616
  chunks:
  - id: stewart-courtier-and-heretic#u05-c1
    label: c1
    heading: Justice is the charity of the wise
    char_start: 141404
    char_end: 142316
    why: States Leibniz's instrumental, altruistic conception of philosophy directly against Spinoza's
      personal quest, the chapter's foundational contrast.
  - id: stewart-courtier-and-heretic#u05-c2
    label: c2
    heading: The universal characteristic and "Let's calculate!"
    char_start: 146926
    char_end: 147987
    why: Leibniz's fantasy of reducing all philosophical dispute to mechanical calculation, a striking
      anticipation of legibility as a machine's core drive.
  - id: stewart-courtier-and-heretic#u05-c3
    label: c3
    heading: Philosophy as legal brief
    char_start: 157428
    char_end: 158169
    why: The passage that supplies the chapter's title, making explicit that Leibniz judged arguments
      by believability rather than truth.
  - id: stewart-courtier-and-heretic#u05-c4
    label: c4
    heading: Monomaniac versus omnimaniac
    char_start: 174945
    char_end: 175803
    why: Crystallizes the book's structural contrast between Spinoza's single compressed volume and Leibniz's
      scattering across hundreds of projects.
  - id: stewart-courtier-and-heretic#u05-c5
    label: c5
    heading: The Egypt Plan's convenient concordance
    char_start: 178761
    char_end: 179932
    why: Shows Leibniz's recurring pattern of discovering that the general good and his personal ambition
      coincide, epitomized by the Egypt Plan.
  - id: stewart-courtier-and-heretic#u05-c6
    label: c6
    heading: A philosophy defined by its enemy
    char_start: 160860
    char_end: 161647
    why: 'Names the chapter''s hinge to the rest of the book: Leibniz''s system as reactive, ultimately
      legible only against Spinoza.'
- nn: 6
  unit_id: ch06-hero-of-the-people
  note_id: stewart-courtier-and-heretic-ch06-hero-of-the-people
  span: 183616:212563
  chunks:
  - id: stewart-courtier-and-heretic#u06-c1
    label: c1
    heading: The Masaniello self-portrait
    char_start: 187409
    char_end: 188119
    why: Establishes the chapter's organizing conceit — Spinoza secretly identifying himself with the
      martyred revolutionary Masaniello — which frames his turn toward political action.
  - id: stewart-courtier-and-heretic#u06-c2
    label: c2
    heading: Religion as the prop of despotism
    char_start: 195578
    char_end: 195915
    why: The TTP's programmatic statement, quoted verbatim, that organized religion functions to make
      oppressed people complicit in their own subjugation.
  - id: stewart-courtier-and-heretic#u06-c3
    label: c3
    heading: The purpose of the state is freedom
    char_start: 198460
    char_end: 199199
    why: Lays out Spinoza's constructive social-contract theory and its culminating formula in a single
      self-contained paragraph.
  - id: stewart-courtier-and-heretic#u06-c4
    label: c4
    heading: Self-preservation as the root virtue, and its limit
    char_start: 211098
    char_end: 212031
    why: States the conatus doctrine in Spinoza's own words and then shows him exceeding it in practice,
      the chapter's central philosophical paradox.
  - id: stewart-courtier-and-heretic#u06-c5
    label: c5
    heading: Can a liberal be a hero?
    char_start: 212033
    char_end: 212558
    why: The chapter's closing thesis question, explicitly set up as the dilemma that will confront Leibniz's
      rival political theory.
- nn: 7
  unit_id: ch07-many-faces-of-leibniz
  note_id: stewart-courtier-and-heretic-ch07-many-faces-of-leibniz
  span: 212563:237733
  chunks:
  - id: stewart-courtier-and-heretic#u07-c1
    label: c1
    heading: The optics pretext to Spinoza
    char_start: 218002
    char_end: 218389
    why: Shows Leibniz manufacturing a technical pretext to secretly open contact with the man he was
      publicly denouncing, the chapter's central act of duplicity.
  - id: stewart-courtier-and-heretic#u07-c2
    label: c2
    heading: The Wedderkopf letter on sufficient reason
    char_start: 227784
    char_end: 228455
    why: Leibniz's own necessitarian logic, reached independently the same month he read Spinoza, revealing
      the hidden convergence between the two philosophers' rationalism.
  - id: stewart-courtier-and-heretic#u07-c3
    label: c3
    heading: Against motive-hunting
    char_start: 231924
    char_end: 233051
    why: 'States Stewart''s core interpretive claim: Leibniz''s behavior cannot be explained by any single
      stable motive, however deeply one digs.'
  - id: stewart-courtier-and-heretic#u07-c4
    label: c4
    heading: Defining multiplicity
    char_start: 233053
    char_end: 234047
    why: The chapter's explicit thesis statement, coining “multiplicity” as the concept that supersedes
      simple duplicity in explaining Leibniz.
  - id: stewart-courtier-and-heretic#u07-c5
    label: c5
    heading: The monad's irony
    char_start: 234573
    char_end: 235042
    why: Crystallizes the chapter's irony that the philosopher of indivisible unity was himself biographically
      fragmented and multiple.
- nn: 8
  unit_id: ch08-friends-of-friends
  note_id: stewart-courtier-and-heretic-ch08-friends-of-friends
  span: 237733:261948
  chunks:
  - id: stewart-courtier-and-heretic#u08-c1
    label: c1
    heading: The de Witt massacre and Spinoza's placard
    char_start: 240836
    char_end: 241723
    why: Leibniz's own secondhand anecdote about Spinoza's near-fatal political gesture is the chapter's
      most vivid evidence of the violent context surrounding Spinoza's late work.
  - id: stewart-courtier-and-heretic#u08-c2
    label: c2
    heading: Van den Enden's execution
    char_start: 245987
    char_end: 246512
    why: The execution of Spinoza's former mentor for enacting radical political theory establishes the
      real stakes behind the caution that shapes Spinoza's later dealings with France and strangers.
  - id: stewart-courtier-and-heretic#u08-c3
    label: c3
    heading: Spinoza entrusts manuscripts to Tschirnhaus
    char_start: 249828
    char_end: 250731
    why: This is the concrete transmission event—Spinoza handing over unpublished Ethics material—that
      sets in motion the chain of introductions leading to Leibniz.
  - id: stewart-courtier-and-heretic#u08-c4
    label: c4
    heading: The Resurrection exchange with Oldenburg
    char_start: 260066
    char_end: 260658
    why: The closing doctrinal exchange exposes the gap between personal friendship and philosophical
      agreement that Stewart reads as an inversion of Spinoza's own ideal of rational friendship.
  - id: stewart-courtier-and-heretic#u08-c5
    label: c5
    heading: The Limborch dinner-party accusation
    char_start: 257503
    char_end: 258052
    why: This anecdote captures how Spinoza's reputation for impiety was as much a projection of others'
      anxieties as anything he actually did.
- nn: 9
  unit_id: ch09-leibniz-in-love
  note_id: stewart-courtier-and-heretic-ch09-leibniz-in-love
  span: 261948:314483
  chunks:
  - id: stewart-courtier-and-heretic#u09-c1
    label: c1
    heading: Colbert's legible Paris
    char_start: 264689
    char_end: 265693
    why: Depicts Colbert's administrators engineering sanitation, transport, and security into a legible
      urban system, a concrete instance of the modernity machine's core operation at the moment of its
      emergence.
  - id: stewart-courtier-and-heretic#u09-c2
    label: c2
    heading: Snare the world in the trap
    char_start: 275236
    char_end: 275716
    why: Leibniz's own maxim, quoted verbatim, is the chapter's diagnostic key to his blend of showmanship,
      benevolence, and dissembling.
  - id: stewart-courtier-and-heretic#u09-c3
    label: c3
    heading: Two lives of the mind
    char_start: 279016
    char_end: 280161
    why: States explicitly the book's structural comparison between Spinoza's inward, anti-social life
      of the mind and Leibniz's socially constituted one.
  - id: stewart-courtier-and-heretic#u09-c4
    label: c4
    heading: The Leibniz Unit
    char_start: 296003
    char_end: 296823
    why: Stewart's comic arithmetic converts the philosophers' differing conceptions of a sufficient life
      into a vivid, quotable ratio.
  - id: stewart-courtier-and-heretic#u09-c5
    label: c5
    heading: Is Leibniz a spy?
    char_start: 311492
    char_end: 312505
    why: 'Quotes Spinoza''s same-day reply refusing to let his writings go to Leibniz so hastily, and
      Stewart''s reading of it (wariness toward Paris after van den Enden''s execution): the real stakes
      behind the refusal.'
  - id: stewart-courtier-and-heretic#u09-c6
    label: c6
    heading: The first note on Spinoza's book
    char_start: 313401
    char_end: 314477
    why: The chapter's closing line, marking the small, private origin of the correspondence and encounter
      that will dominate the rest of Leibniz's life.
- nn: 10
  unit_id: ch10-secret-philosophy
  note_id: stewart-courtier-and-heretic-ch10-secret-philosophy
  span: 314483:373794
  chunks:
  - id: stewart-courtier-and-heretic#u10-c1
    label: c1
    heading: God is Nature (not in conflict with it)
    char_start: 318655
    char_end: 319288
    why: States the chapter's organizing claim—God, or Nature—that all subsequent doctrine unpacks.
  - id: stewart-courtier-and-heretic#u10-c2
    label: c2
    heading: Immanent versus transitive cause
    char_start: 320433
    char_end: 321195
    why: The precise technical move that lets Spinoza call God the cause of everything while denying a
      creator outside creation.
  - id: stewart-courtier-and-heretic#u10-c3
    label: c3
    heading: Parallelism of mind and body
    char_start: 342622
    char_end: 342972
    why: Names and quotes the exact proposition by which Spinoza dissolves the Cartesian mind-body problem
      rather than solving it.
  - id: stewart-courtier-and-heretic#u10-c4
    label: c4
    heading: The stone that thinks it flies freely
    char_start: 347400
    char_end: 348045
    why: The chapter's plainest statement of Spinoza's determinism, paired with Leibniz's own contemporaneous
      gloss on it.
  - id: stewart-courtier-and-heretic#u10-c5
    label: c5
    heading: The conatus as foundation of the emotions
    char_start: 355631
    char_end: 356631
    why: Defines the conatus, the single drive from which Spinoza derives his entire theory of emotion,
      virtue, and self-interest.
  - id: stewart-courtier-and-heretic#u10-c6
    label: c6
    heading: A God that will not love you back
    char_start: 367319
    char_end: 368635
    why: 'Two Ethics propositions (God does not love mankind; whoever loves God cannot want to be loved
      back), and Stewart''s summary of the human cost of Spinoza''s system: intelligibility and awe without
      providence or comfort.'
  - id: stewart-courtier-and-heretic#u10-c7
    label: c7
    heading: Man is no kingdom within a kingdom
    char_start: 339185
    char_end: 340640
    why: Gives, in Spinoza's own words, both the Cartesian premise he rejects (man as a kingdom within
      a kingdom) and his counter-creed that man is a part of Nature bound by its laws, the move Stewart
      calls a stake through two millennia of philosophy.
  - id: stewart-courtier-and-heretic#u10-c8
    label: c8
    heading: One Substance under Thought and Extension
    char_start: 341501
    char_end: 342620
    why: 'Spinoza''s own statements that thinking and extended substance are one thing, and that a mental
      decision and a bodily state are the same event under two attributes: the mechanism behind parallelism.'
  - id: stewart-courtier-and-heretic#u10-c9
    label: c9
    heading: Nobody yet knows what the body can do
    char_start: 342974
    char_end: 344372
    why: Spinoza's reply to the objection that matter cannot think (that nobody yet knows what the body
      can do), which Stewart reads as anticipating neuroscience by three centuries.
- nn: 11
  unit_id: ch11-approaching-spinoza
  note_id: stewart-courtier-and-heretic-ch11-approaching-spinoza
  span: 373794:400607
  chunks:
  - id: stewart-courtier-and-heretic#u11-c1
    label: c1
    heading: 'The February 11 notebook: God and the universe made lexically indistinguishable'
    char_start: 376204
    char_end: 377417
    why: Stewart's line-by-line gloss shows Leibniz's own phrasing already encoding Spinoza's identification
      of God with the one Substance, before Leibniz has fully admitted it to himself.
  - id: stewart-courtier-and-heretic#u11-c2
    label: c2
    heading: The recantation on the same page
    char_start: 377504
    char_end: 377770
    why: Shows the recoil-after-lapse pattern that structures the whole chapter, Leibniz insisting on
      a personal, agential God moments after writing in Spinozist terms.
  - id: stewart-courtier-and-heretic#u11-c3
    label: c3
    heading: The shipboard draft breaks off mid-word
    char_start: 396179
    char_end: 396684
    why: 'The dramatic and evidentiary centerpiece of the unit: Leibniz''s own hand stops mid-sentence
      at the exact point his argument arrives at Spinoza''s definition of substance.'
  - id: stewart-courtier-and-heretic#u11-c4
    label: c4
    heading: 'Stewart''s verdict: Leibniz knew, and censored himself'
    char_start: 397573
    char_end: 398210
    why: The chapter's explicit interpretive thesis, naming the concealment strategy that the rest of
      the unit's evidence is assembled to demonstrate.
  - id: stewart-courtier-and-heretic#u11-c5
    label: c5
    heading: Tipping off Spinoza while serving Huet
    char_start: 384153
    char_end: 385003
    why: Extends the pattern of double-dealing from private metaphysics to real political risk, showing
      the same concealment operating in Leibniz's alliances.
  - id: stewart-courtier-and-heretic#u11-c6
    label: c6
    heading: From the principle of sufficient reason to Spinoza's monism
    char_start: 393686
    char_end: 394656
    why: Demonstrates the precise logical mechanism—Leibniz's own commitment to sufficient reason—by which
      his independent reasoning arrives at Spinoza's substance monism.
- nn: 12
  unit_id: ch12-point-of-contact
  note_id: stewart-courtier-and-heretic-ch12-point-of-contact
  span: 400607:414264
  chunks:
  - id: stewart-courtier-and-heretic#u12-c1
    label: c1
    heading: Descartes's rules of motion — a shared critique with opposite aims
    char_start: 402812
    char_end: 403923
    why: Shows the two men's apparent agreement on physics concealing a deeper, unstated metaphysical
      divergence over the reality of mind.
  - id: stewart-courtier-and-heretic#u12-c2
    label: c2
    heading: The one surviving document
    char_start: 406917
    char_end: 407781
    why: Establishes the sole primary-source anchor for the entire chapter's reconstruction of the meeting.
  - id: stewart-courtier-and-heretic#u12-c3
    label: c3
    heading: Was Spinoza's God a God at all
    char_start: 407783
    char_end: 408232
    why: States the chapter's central theological question in Stewart's own analytical voice.
  - id: stewart-courtier-and-heretic#u12-c4
    label: c4
    heading: Vanity as starved need for love
    char_start: 410462
    char_end: 411616
    why: Gives Stewart's psychological diagnosis of Leibniz that the chapter uses to explain his behavior
      toward Spinoza.
  - id: stewart-courtier-and-heretic#u12-c5
    label: c5
    heading: 'Unmoved versus pacing: the staged climax'
    char_start: 412898
    char_end: 413660
    why: The chapter's dramatic set-piece, visually encoding the temperamental contrast between the two
      philosophers.
  - id: stewart-courtier-and-heretic#u12-c6
    label: c6
    heading: Did Spinoza actually approve?
    char_start: 413842
    char_end: 414258
    why: The chapter's closing move, casting doubt on the reliability of the only direct evidence just
      presented.
- nn: 13
  unit_id: ch13-surviving-spinoza
  note_id: stewart-courtier-and-heretic-ch13-surviving-spinoza
  span: 414264:477779
  chunks:
  - id: stewart-courtier-and-heretic#u13-c1
    label: c1
    heading: The December 12, 1676 note
    char_start: 423760
    char_end: 424085
    why: This note, dated December 12, 1676 and written either on arrival in Hanover or in the carriage
      from Holland, shows his rejection of Spinoza's God forming essentially instantly rather than after
      years of reflection.
  - id: stewart-courtier-and-heretic#u13-c2
    label: c2
    heading: Spinoza's death and the missing valuables
    char_start: 428988
    char_end: 430816
    why: The eyewitness account of Spinoza's final hours, ending with the attending doctor's suspicious
      flight with cash and a silver knife, sets up the chapter's revelation that the doctor was Leibniz's
      own contact Schuller.
  - id: stewart-courtier-and-heretic#u13-c3
    label: c3
    heading: The underground publication of the Opera Posthuma
    char_start: 442535
    char_end: 444175
    why: Depicts the clandestine, distributed effort that smuggled Spinoza's final works into print against
      organized Vatican suppression, a vivid case of a paradigm assembling itself invisibly until it breaks
      into view.
  - id: stewart-courtier-and-heretic#u13-c4
    label: c4
    heading: Leibniz's private marginalia on the Ethics
    char_start: 452110
    char_end: 453087
    why: Notes Leibniz never intended anyone to read reveal the depth and bitterness of his private disagreement
      with Spinoza, treated by Stewart as his most sincere statement on the subject.
  - id: stewart-courtier-and-heretic#u13-c5
    label: c5
    heading: Theophile and Polidore
    char_start: 459205
    char_end: 459768
    why: Identifies Leibniz's most heartfelt declaration of purpose as voiced by his doubting alter-ego
      rather than his idealized one, the chapter's key to his divided psychology.
  - id: stewart-courtier-and-heretic#u13-c6
    label: c6
    heading: Weighing whether Spinoza deserved to burn
    char_start: 469479
    char_end: 471156
    why: 'Shows Leibniz talking himself toward endorsing corporal punishment for Spinoza and then, in
      his own quoted words, not daring to decide: the clearest single passage of his unresolved ambivalence
      toward the man he met in 1676.'
  - id: stewart-courtier-and-heretic#u13-c7
    label: c7
    heading: Schuller offers the Ethics manuscript for sale
    char_start: 436804
    char_end: 438850
    why: Schuller's two letters, first offering Leibniz the Ethics manuscript for sale and then withdrawing
      the offer, show Leibniz ready to buy a dead heretic's manuscript on his employer's budget.
  - id: stewart-courtier-and-heretic#u13-c8
    label: c8
    heading: The precipice confession in On Freedom
    char_start: 453089
    char_end: 454366
    why: Leibniz's own private admission that he came very close to Spinoza's necessitarianism before
      being pulled back from the precipice, the evidence Stewart uses to prove the earlier rapprochement
      was real.
  - id: stewart-courtier-and-heretic#u13-c9
    label: c9
    heading: Polidore's closing creed
    char_start: 457249
    char_end: 459203
    why: The full text of the life-creed Leibniz wrote into the 1678 dialogue, which Stewart then shows
      is voiced by the recovering Spinozist Polidore.
  - id: stewart-courtier-and-heretic#u13-c10
    label: c10
    heading: Descartes as a proxy for Spinoza
    char_start: 459770
    char_end: 461414
    why: The 1680 passage in which Leibniz says outright that the Cartesian doctrine he attacked is what
      Spinoza explained more clearly, and names it the first lie and foundation of the atheistic philosophy.
  - id: stewart-courtier-and-heretic#u13-c11
    label: c11
    heading: Leibniz writes Spinoza down to Ernst
    char_start: 471158
    char_end: 473536
    why: Leibniz's 1683 dismissal of Spinoza (truly an atheist, a mediocre geometer best at making lenses,
      met for a few hours), with Stewart's reading of its sarcasm as evidence of an abiding obsession.
- nn: 14
  unit_id: ch14-antidote-to-spinozism
  note_id: stewart-courtier-and-heretic-ch14-antidote-to-spinozism
  span: 477779:531889
  chunks:
  - id: stewart-courtier-and-heretic#u14-c1
    label: c1
    heading: 'The excised word: "the Spinozists"'
    char_start: 483641
    char_end: 484607
    why: Shows the philological evidence that Leibniz's Discourse was privately conceived as a direct
      rebuttal to Spinoza before public caution softened the language.
  - id: stewart-courtier-and-heretic#u14-c2
    label: c2
    heading: Immanent versus transcendent God
    char_start: 494711
    char_end: 495783
    why: The chapter's most condensed statement of the core theological fork between the two philosophers'
      concepts of God.
  - id: stewart-courtier-and-heretic#u14-c3
    label: c3
    heading: Windowless monads
    char_start: 503191
    char_end: 503903
    why: States the defining property of Leibniz's substances, engineered precisely to block the kind
      of dissolution of mind into matter that Spinoza's Substance permits.
  - id: stewart-courtier-and-heretic#u14-c4
    label: c4
    heading: The doctrine of pre-established harmony
    char_start: 513579
    char_end: 514196
    why: Introduces Leibniz's signature solution to the mind-body problem his own monadology creates,
      replacing Spinoza's parallelism with a single divine synchronization at creation.
  - id: stewart-courtier-and-heretic#u14-c5
    label: c5
    heading: Loving God versus being loved by God
    char_start: 526591
    char_end: 527177
    why: Distills the chapter's account of the two philosophers' opposed routes to salvation into a single
      memorable formula.
  - id: stewart-courtier-and-heretic#u14-c6
    label: c6
    heading: Metaphysics as autobiography
    char_start: 529406
    char_end: 529998
    why: States Stewart's interpretive thesis that the entire monadology functions as a psychological
      confession and a metaphysics of reassurance, not disinterested inquiry.
- nn: 15
  unit_id: ch15-the-haunting
  note_id: stewart-courtier-and-heretic-ch15-the-haunting
  span: 531889:583922
  chunks:
  - id: stewart-courtier-and-heretic#u15-c1
    label: c1
    heading: The permanent anxiety named
    char_start: 542639
    char_end: 543587
    why: 'States the chapter''s organizing thesis: forty years of Leibniz''s frenetic activity trace back
      to one unresolved anxiety about Spinoza.'
  - id: stewart-courtier-and-heretic#u15-c2
    label: c2
    heading: Stop Spinoza
    char_start: 564758
    char_end: 565667
    why: Compresses Leibniz's entire political career, including his opposition to Louis XIV, into a single
      anti-Spinozist motive.
  - id: stewart-courtier-and-heretic#u15-c3
    label: c3
    heading: Locke as feeble Spinozist
    char_start: 557496
    char_end: 558218
    why: Demonstrates the precise inferential chain by which Stewart shows Leibniz's refutation of Locke
      is really a proxy war with Spinoza.
  - id: stewart-courtier-and-heretic#u15-c4
    label: c4
    heading: Newton's Trojan horse
    char_start: 572765
    char_end: 573357
    why: Shows the identical Spinozist-inference pattern applied to Newton, revealing the calculus priority
      dispute as another displaced battle with Spinoza.
  - id: stewart-courtier-and-heretic#u15-c5
    label: c5
    heading: Bad philosophy in China
    char_start: 576961
    char_end: 578107
    why: Extends the pattern globally, showing Leibniz projecting the same feared monism onto Chinese
      philosophy as a cautionary mirror of Europe's fate.
  - id: stewart-courtier-and-heretic#u15-c6
    label: c6
    heading: Mistaking the tint in his own spectacles
    char_start: 582924
    char_end: 583916
    why: 'The chapter''s closing psychological verdict: Leibniz''s ubiquitous sightings of Spinoza may
      reflect his own suppressed proximity to the doctrine.'
- nn: 16
  unit_id: ch16-return-of-the-repressed
  note_id: stewart-courtier-and-heretic-ch16-return-of-the-repressed
  span: 583922:615199
  chunks:
  - id: stewart-courtier-and-heretic#u16-c1
    label: c1
    heading: The two-friends analogy
    char_start: 583951
    char_end: 585135
    why: 'States the chapter''s governing method: testing whether Leibniz and Spinoza describe different
      universes or the same one narrated differently.'
  - id: stewart-courtier-and-heretic#u16-c2
    label: c2
    heading: Spinoza's 1674 pre-emptive critique of a choosing God
    char_start: 585340
    char_end: 585808
    why: Shows Spinoza rejecting the core premise of Leibniz's Theodicy two years before their meeting,
      establishing the convergence as structural rather than a matter of influence.
  - id: stewart-courtier-and-heretic#u16-c3
    label: c3
    heading: Leibniz's private determinism, in Spinoza's own words
    char_start: 595015
    char_end: 595560
    why: 'The chapter''s key piece of textual evidence: Leibniz''s private notebook language on free will
      is nearly interchangeable with a passage from Spinoza''s Ethics.'
  - id: stewart-courtier-and-heretic#u16-c4
    label: c4
    heading: Is God a monad? Both answers are heresy
    char_start: 605454
    char_end: 606826
    why: The chapter's central formal dilemma, showing that Leibniz's monadology cannot consistently answer
      the question of God's relation to the monads without collapsing into Spinozism or atheism.
  - id: stewart-courtier-and-heretic#u16-c5
    label: c5
    heading: Conatus and perfection in Leibniz's ethics
    char_start: 609002
    char_end: 609376
    why: Direct textual evidence that Leibniz's ethics of self-realization reproduces Spinoza's conatus
      doctrine almost word for word.
  - id: stewart-courtier-and-heretic#u16-c6
    label: c6
    heading: The door Leibniz could not close
    char_start: 614502
    char_end: 615193
    why: 'The book''s central closing image: Leibniz''s entire philosophy as a lifelong, failed attempt
      to shut a door onto a disenchanted world he had already stepped through.'
- nn: 17
  unit_id: ch17-leibniz-end
  note_id: stewart-courtier-and-heretic-ch17-leibniz-end
  span: 615199:642719
  chunks:
  - id: stewart-courtier-and-heretic#u17-c1
    label: c1
    heading: Exile from every court
    char_start: 625473
    char_end: 625845
    why: Compresses the chapter's political-decline narrative into a single summary sentence of Leibniz's
      fall from favor everywhere.
  - id: stewart-courtier-and-heretic#u17-c2
    label: c2
    heading: The monadology reread as elegy
    char_start: 628910
    char_end: 629699
    why: States Stewart's interpretive thesis that Leibniz's late optimism is a wistful, self-aware fiction
      rather than a literal metaphysical claim.
  - id: stewart-courtier-and-heretic#u17-c3
    label: c3
    heading: A self that must fight to persist
    char_start: 632388
    char_end: 633730
    why: Reads Leibniz's vanity and status-seeking as compensations by a self secretly convinced of its
      own fragility, the chapter's clearest resonance with a Spinozist conatus.
  - id: stewart-courtier-and-heretic#u17-c4
    label: c4
    heading: Acted like a Spinozist
    char_start: 635915
    char_end: 636881
    why: The chapter's explicit thesis sentence, naming the double biography's central irony in Stewart's
      own words.
  - id: stewart-courtier-and-heretic#u17-c5
    label: c5
    heading: The deathbed refusal
    char_start: 639043
    char_end: 640145
    why: Dramatizes Leibniz's final, characteristic refusal to perform contrition, ending the deathbed
      scene on his own terms.
  - id: stewart-courtier-and-heretic#u17-c6
    label: c6
    heading: An unattended funeral
    char_start: 641430
    char_end: 642713
    why: Closes the chapter by contrasting Leibniz's unmarked grave and unremarked death with Spinoza's
      funeral, returning to the windowless-monad image as final judgment.
- nn: 18
  unit_id: ch18-aftermath
  note_id: stewart-courtier-and-heretic-ch18-aftermath
  span: 642719:655323
  chunks:
  - id: stewart-courtier-and-heretic#u18-c1
    label: c1
    heading: The injustice of intellectual history
    char_start: 642730
    char_end: 643200
    why: States the chapter's opening claim that Spinoza's real historical influence was suppressed and
      unacknowledged, framing everything that follows about distorted reception.
  - id: stewart-courtier-and-heretic#u18-c2
    label: c2
    heading: Lessing's mystical Spinoza replaces the political revolutionary
    char_start: 646002
    char_end: 646533
    why: Shows the specific mechanism by which Spinoza's dangerous political theology was overwritten
      by a domesticated mystical-pantheist image that still dominates his public reputation.
  - id: stewart-courtier-and-heretic#u18-c3
    label: c3
    heading: The thesis in one sentence
    char_start: 649496
    char_end: 649915
    why: This is the book's culminating thesis statement, reframing the entire double biography as an
      account of modernity's two enduring poles.
  - id: stewart-courtier-and-heretic#u18-c4
    label: c4
    heading: Active versus reactive modernity
    char_start: 649917
    char_end: 651146
    why: Lays out Stewart's central argument that Spinoza's active response and Leibniz's reactive response
      are the two lineages structuring all subsequent modern philosophy, from Kant to postmodernism.
  - id: stewart-courtier-and-heretic#u18-c5
    label: c5
    heading: Two philosophical personality types
    char_start: 652955
    char_end: 653896
    why: Universalizes the two philosophers into permanent human types, and states Spinoza's ethical position
      in terms that directly echo his concept of conatus without naming it.
  - id: stewart-courtier-and-heretic#u18-c6
    label: c6
    heading: The book's closing verdict on Spinoza
    char_start: 654494
    char_end: 655322
    why: The book's final passage and closing line, delivering Stewart's last assessment of Spinoza's
      philosophy as demanding but ultimately sufficient unto itself.
