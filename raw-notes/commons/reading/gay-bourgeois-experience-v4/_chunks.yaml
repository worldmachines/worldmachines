source: gay-bourgeois-experience-v4
units:
- nn: 1
  unit_id: introduction
  note_id: gay-bourgeois-experience-v4-introduction
  span: 0:22254
  chunks:
  - id: gay-bourgeois-experience-v4#u01-c1
    heading: 'The naked heart as a mass bourgeois pursuit'
    span: 14:848
    why: 'States the book''s thesis and title-conceit in miniature: introspection as a widespread bourgeois practice, not a rare literary pose.'
  - id: gay-bourgeois-experience-v4#u01-c2
    heading: 'Critics of introspection, and Disraeli''s vow of silence'
    span: 6743:7742
    why: 'Shows both the external attack on bourgeois inwardness and the internal worry that self-disclosure itself needed rationing, the chapter''s central ambivalence.'
  - id: gay-bourgeois-experience-v4#u01-c3
    heading: 'Inwardness before the Victorians'
    span: 9097:10268
    why: 'Grounds Gay''s real claim: the Victorians did not invent self-scrutiny but democratized a much older, elite tradition of inwardness.'
  - id: gay-bourgeois-experience-v4#u01-c4
    heading: 'Defining an indefinable class'
    span: 10344:11278
    why: 'Establishes the conceptual instability of Gay''s central category, which the book''s argument has to survive.'
  - id: gay-bourgeois-experience-v4#u01-c5
    heading: 'Against the self as pure invention'
    span: 14975:16656
    why: 'Gay''s explicit methodological stake — the self is knowable, not merely constructed in the act of recording it — that licenses the whole book''s Freudian approach.'
- nn: 2
  unit_id: art-of-listening-1
  note_id: gay-bourgeois-experience-v4-art-of-listening-1
  span: 22254:54029
  chunks:
  - id: gay-bourgeois-experience-v4#u02-c1
    heading: 'Reading The Power of Music'
    span: 23562:24312
    why: 'States the unit''s thesis directly: the painting''s staged silence stands for the Victorian ascent of inwardness that the whole chapter documents.'
  - id: gay-bourgeois-experience-v4#u02-c2
    heading: 'The 1760s storm of sensibility'
    span: 26899:27781
    why: 'Names Rousseau''s La Nouvelle Héloïse as a source of the sentimental culture that elevated music into a vehicle of inward feeling.'
  - id: gay-bourgeois-experience-v4#u02-c3
    heading: 'Eighteenth-century music as social backdrop'
    span: 31326:32393
    why: 'Establishes the baseline against which the Victorian achievement of silent listening is measured: music as mere accompaniment to flirtation and gossip.'
  - id: gay-bourgeois-experience-v4#u02-c4
    heading: 'Hoffmann''s polemic against bourgeois chatter'
    span: 38066:38871
    why: 'Shows the romantic critic of bourgeois philistinism functioning, ironically, as an educator in the very listening manners he despises.'
  - id: gay-bourgeois-experience-v4#u02-c5
    heading: 'Goethe''s 1803 decorum edict'
    span: 42573:43380
    why: 'Concrete, dated evidence of a named historical figure actively legislating the new silent-listening decorum into institutional existence.'
  - id: gay-bourgeois-experience-v4#u02-c6
    heading: 'Silent listening as sublimation'
    span: 52257:53301
    why: 'The chapter''s clearest Freud-inflected statement of its argument: disciplined silent listening is a sublimation of primitive bodily impulse, not a natural response.'
- nn: 3
  unit_id: art-of-listening-2
  note_id: gay-bourgeois-experience-v4-art-of-listening-2
  span: 54029:92660
  chunks:
  - id: gay-bourgeois-experience-v4#u03-c1
    heading: 'The discipline of decorous listening'
    span: 54029:55093
    why: 'Establishes the unit''s opening claim that Romantic listening required silent self-control, and that violations of that silence were felt as literal interference with an inward, regressive experience.'
  - id: gay-bourgeois-experience-v4#u03-c2
    heading: 'Schopenhauer''s metaphysics of music'
    span: 57065:57775
    why: 'Gives the philosophical high point of music''s revaluation, where it is said to disclose ''the will itself'' rather than mere appearance, underwriting the entire ''religion of music'' argument.'
  - id: gay-bourgeois-experience-v4#u03-c3
    heading: 'Fuller and Emerson: ''It is religion.'''
    span: 59459:60317
    why: 'The Fuller/Emerson exchange is the unit''s most quotable statement of the shift from aesthetic pleasure to explicit religious language, and the Germania Music Society anecdote shows the ideology reaching a mass American audience.'
  - id: gay-bourgeois-experience-v4#u03-c4
    heading: 'Genius and craftsmanship in Beethoven'
    span: 71911:72895
    why: 'States the unit''s key analytic claim about Romantic inwardness: genius combines unconscious inspiration with schooled self-criticism, not raw spontaneity alone.'
  - id: gay-bourgeois-experience-v4#u03-c5
    heading: 'The Festspielhaus as an architecture of absorption'
    span: 89466:90855
    why: 'Describes Bayreuth''s deliberate architectural engineering (darkness, hidden orchestra, no boxes) as the literal infrastructure built to enforce the religion of listening at its most extreme.'
  - id: gay-bourgeois-experience-v4#u03-c6
    heading: 'Bayreuth''s politics and the loss of selfhood'
    span: 90857:91528
    why: 'Names the unit''s most explicit turn from aesthetic religion toward nationalist politics and the surrender of individual selfhood to the collective, the passage the WMP resonance on romanticism and political danger depends on.'
- nn: 4
  unit_id: ch1-imagination-unleashed
  note_id: gay-bourgeois-experience-v4-ch1-imagination-unleashed
  span: 92660:140476
  chunks:
  - id: gay-bourgeois-experience-v4#u04-c1
    heading: 'The historic mission to re-enchant the world'
    span: 92706:93661
    why: 'States the unit''s organizing thesis in one paragraph: the romantics'' return to wonder was a conscious countermove to Enlightenment disenchantment.'
  - id: gay-bourgeois-experience-v4#u04-c2
    heading: 'Novalis and Hegel define romantic inwardness'
    span: 94557:95178
    why: 'Gives Gay''s two defining formulas for romantic inwardness, the closest the unit comes to a definition of the movement''s common thread.'
  - id: gay-bourgeois-experience-v4#u04-c3
    heading: 'Hartley''s associationism: the Enlightenment''s Newton of the mind'
    span: 114750:115905
    why: 'Lays out the lawful, mechanistic Enlightenment psychology of mind that the romantic imagination was built to refute.'
  - id: gay-bourgeois-experience-v4#u04-c4
    heading: 'Schlegel''s Lucinde converts a life into a manifesto-novel'
    span: 123801:124826
    why: 'Shows a romantic literally constructing the self through the act of writing, converting a real affair into fiction rather than merely reporting it.'
  - id: gay-bourgeois-experience-v4#u04-c5
    heading: 'Coleridge proposes his own nature as a problem'
    span: 135897:136741
    why: 'Coleridge''s self-description as an explorer of ''the mind''s self-experience in the act of thinking'' is Gay''s clearest bridge from romanticism to the Freudian self-analysis framing the chapter.'
  - id: gay-bourgeois-experience-v4#u04-c6
    heading: 'Shelley: the poet displaces the priest'
    span: 139742:140474
    why: 'Closes the unit with its political payload: poetic genius rather than birth becomes the ground of authority, a secularizing and democratizing twist on re-enchantment.'
- nn: 5
  unit_id: ch1-self-in-politics
  note_id: gay-bourgeois-experience-v4-ch1-self-in-politics
  span: 140476:186132
  chunks:
  - id: gay-bourgeois-experience-v4#u05-c1
    heading: 'Romantics defect into a higher inwardness'
    span: 140501:141519
    why: 'States the unit''s opening thesis: romantics played at radical politics but defected toward inward vocation, with Hugo''s exceptional claim that literary work is political act.'
  - id: gay-bourgeois-experience-v4#u05-c2
    heading: 'Politics transformed into autobiography'
    span: 145148:146082
    why: 'Names the unit''s central mechanism directly: the romantic cult of the self converts public events into autobiography rather than reformist or revolutionary action.'
  - id: gay-bourgeois-experience-v4#u05-c3
    heading: 'Hazlitt''s diagnosis of romantic egotism'
    span: 148036:148549
    why: 'Hazlitt''s 1818 lecture is the unit''s key period diagnosis of the romantic style as a self-centered offshoot of the French Revolution''s political ferment.'
  - id: gay-bourgeois-experience-v4#u05-c4
    heading: 'German retreat to the holy quiet domains of the heart'
    span: 164278:165202
    why: 'Pairs Schiller''s despairing flight to inwardness with Schlegel''s programmatic renunciation of politics for art and religion, the unit''s clearest German case.'
  - id: gay-bourgeois-experience-v4#u05-c5
    heading: 'Bliss was it in that dawn: the romantic self in politics'
    span: 180203:181185
    why: 'Contains the unit''s title phrase and Gay''s own explicit gloss on Wordsworth''s most famous line as exemplifying the romantic self processing politics as feeling.'
  - id: gay-bourgeois-experience-v4#u05-c6
    heading: 'The sustained cultivation of the responsive self'
    span: 185401:186130
    why: 'The unit''s closing synthesis, using Keats''s rejection of the egotistical sublime to state what distinguished romantic political engagement from all earlier politically idealistic thought.'
- nn: 6
  unit_id: ch1-heart-religion
  note_id: gay-bourgeois-experience-v4-ch1-heart-religion
  span: 186132:232936
  chunks:
  - id: gay-bourgeois-experience-v4#u06-c1
    heading: 'The Egotistical Sublime and Self-Enchantment'
    span: 186151:187015
    why: 'States the unit''s master thesis fusing romantic subjectivity and re-enchantment, and supplies the wording (''re-enchantment of the world'') this note builds on.'
  - id: gay-bourgeois-experience-v4#u06-c2
    heading: 'Beautiful Therefore True: Chateaubriand''s Aesthetic Apologetics'
    span: 196905:198322
    why: 'The unit''s clearest formulation of religion justified by beauty rather than truth, the throughline of the whole chapter.'
  - id: gay-bourgeois-experience-v4#u06-c3
    heading: 'Schleiermacher''s Herzreligion as Erotic Surrender'
    span: 209706:210555
    why: 'Gives the section''s title concept, Herzreligion, its fullest and most explicit erotic-devotional expression.'
  - id: gay-bourgeois-experience-v4#u06-c4
    heading: 'Novalis: Eros, Death, and the Cult of Sophie'
    span: 205436:206785
    why: 'The most extreme and best-documented case of the fusion of eros and piety, drawn from Novalis''s own journal and poems.'
  - id: gay-bourgeois-experience-v4#u06-c5
    heading: 'From Plausible Atheist to Secular Saint: Rehabilitating Spinoza'
    span: 220266:221552
    why: 'Traces the pivot that makes pantheism theologically respectable and feeds directly into Schelling''s Naturphilosophie.'
  - id: gay-bourgeois-experience-v4#u06-c6
    heading: 'Goethe Against the Instruments: Unmediated Nature'
    span: 226446:227346
    why: 'Crystallizes the chapter''s Enlightenment-versus-romantic quarrel over Nature in a single vivid image of instruments as obstacles to revelation.'
- nn: 7
  unit_id: ch1-bourgeois-egotistical-sublime
  note_id: gay-bourgeois-experience-v4-ch1-bourgeois-egotistical-sublime
  span: 232936:273654
  chunks:
  - id: gay-bourgeois-experience-v4#u07-c1
    heading: 'The unintended bequest'
    span: 232974:234434
    why: 'States the chapter''s central irony directly: romantics who despised and were despised by the bourgeoisie become, via Hegel''s cunning of history, the unwitting source of its inner life.'
  - id: gay-bourgeois-experience-v4#u07-c2
    heading: 'Stendhal''s crystallization'
    span: 236023:236887
    why: 'Gives the chapter''s clearest theoretical account of romantic love as a self-deceiving mental operation the lover performs on the beloved.'
  - id: gay-bourgeois-experience-v4#u07-c3
    heading: 'Shelley against marriage'
    span: 237547:238434
    why: 'Shows the anti-institutional radicalism of romantic love theory that bourgeois culture would later have to strip away even as it kept the underlying sentiment.'
  - id: gay-bourgeois-experience-v4#u07-c4
    heading: 'Lucinde and the Victorian afterlife'
    span: 244549:245694
    why: 'Connects Schlegel''s scandalous roman à clef directly to the Victorian inward life the chapter argues romantics unwittingly created.'
  - id: gay-bourgeois-experience-v4#u07-c5
    heading: 'Narcissism for two'
    span: 268434:270246
    why: 'Lays out the chapter''s psychological core: romantic love''s demand for total mutual transparency between lovers, revealed as a plea for reassurance rather than a quest for information.'
  - id: gay-bourgeois-experience-v4#u07-c6
    heading: 'Re-enchanting the world through love'
    span: 272193:272724
    why: 'Gay''s most explicit naming of romantic love as a secular surrogate for waning religious enchantment, without simply replacing devotion with desire.'
- nn: 8
  unit_id: ch2-in-rousseaus-shadow
  note_id: gay-bourgeois-experience-v4-ch2-in-rousseaus-shadow
  span: 273654:302146
  chunks:
  - id: gay-bourgeois-experience-v4#u08-c1
    heading: 'Autobiography as pre-Freudian sounding of the inner life'
    span: 273697:274658
    why: 'States the unit''s premise that autobiography was the Victorians'' functional substitute for psychoanalysis, and situates the genre against its ancient antecedents.'
  - id: gay-bourgeois-experience-v4#u08-c2
    heading: 'Goethe''s confession as self-concealment (Freud''s verdict)'
    span: 277331:277919
    why: 'Crystallizes the book''s central dialectic between self-revelation and self-concealment through Freud''s own reading of Goethe.'
  - id: gay-bourgeois-experience-v4#u08-c3
    heading: 'Samuel Smiles on autobiography as disguise'
    span: 278644:279216
    why: 'Gives the vernacular Victorian-era version of Freudian suspicion toward autobiographical truth-claims, predating psychoanalysis proper.'
  - id: gay-bourgeois-experience-v4#u08-c4
    heading: 'Rousseau''s claim to unprecedented, unrepeatable honesty'
    span: 285720:286616
    why: 'The Confessions''s founding rhetorical gesture, which Gay treats as the decisive break from Augustinian confession and the model the whole nineteenth century wrote against.'
  - id: gay-bourgeois-experience-v4#u08-c5
    heading: 'The delicate calculus of frankness'
    span: 301292:302144
    why: 'Closes the unit by naming explicitly the bind between self-exposure and reserve that structures the whole chapter''s argument.'
- nn: 9
  unit_id: ch2-between-probes-and-poses
  note_id: gay-bourgeois-experience-v4-ch2-between-probes-and-poses
  span: 302146:329015
  chunks:
  - id: gay-bourgeois-experience-v4#u09-c1
    heading: 'The perennial problem of self-exposure'
    span: 302175:303475
    why: 'States the unit''s governing thesis and illustrates it with the paired cases of Harriette Wilson''s teasing evasion and Wilhelm Busch''s reluctant candor.'
  - id: gay-bourgeois-experience-v4#u09-c2
    heading: 'Autobiography as performance'
    span: 303477:304568
    why: 'Gay''s central methodological claim: the decision to write a life at all is itself a form of special pleading, whatever the content.'
  - id: gay-bourgeois-experience-v4#u09-c3
    heading: 'Stendhal writes to discover himself'
    span: 307273:308027
    why: 'The clearest textual instance of writing as a generative technology of self-knowledge rather than transcription of a prior self, directly supporting the self-construction-through-writing link.'
  - id: gay-bourgeois-experience-v4#u09-c4
    heading: 'Dichtung und Wahrheit''s contract with the reader'
    span: 309493:310863
    why: 'Introduces the chapter''s central comparison and shows Gay reading the autobiography''s very title as a calculated mixture of promise and defense.'
  - id: gay-bourgeois-experience-v4#u09-c5
    heading: 'Rousseau''s headlong candor versus Goethe''s canny indiscretion'
    span: 310865:311950
    why: 'Names the unit''s title concept directly ("canny indiscretion") and stages a contemporary reviewer''s failed attempt to certify one autobiographer as more honest than the other.'
  - id: gay-bourgeois-experience-v4#u09-c6
    heading: 'Andersen: pose overwhelming probe'
    span: 328455:329013
    why: 'The unit''s closing diagnosis, which supplies the exact probe/pose vocabulary of the section''s own title as its final verdict on Andersen''s autobiography.'
- nn: 10
  unit_id: ch2-road-from-damascus
  note_id: gay-bourgeois-experience-v4-ch2-road-from-damascus
  span: 329015:366659
  chunks:
  - id: gay-bourgeois-experience-v4#u10-c1
    heading: 'An unfinished war between science and faith'
    span: 329042:330578
    why: 'States the unit''s governing premise: religious crisis autobiography flourished because secularization was a live, unresolved contest, not a completed Enlightenment victory.'
  - id: gay-bourgeois-experience-v4#u10-c2
    heading: 'Public frankness gated by private manuscript'
    span: 332228:332749
    why: 'Gay''s explicit publicity/privacy distinction — the passage that motivates why Darwin and others concealed their doubts in print but not in private writing.'
  - id: gay-bourgeois-experience-v4#u10-c3
    heading: 'Jouffroy''s night of unveiled unbelief'
    span: 341538:343147
    why: 'The unit''s most sustained first-person account of loss of faith as a traumatic, involuntary rupture rather than a gradual drift — the load-bearing case for the ''sudden crisis'' pattern.'
  - id: gay-bourgeois-experience-v4#u10-c4
    heading: 'Renan''s re-enchantment on the Acropolis'
    span: 350978:352303
    why: 'Shows the romantic re-enchantment impulse surviving decades past scientific disillusionment, in Gay''s paradigmatic instance of a Victorian seeker''s substitute devotion.'
  - id: gay-bourgeois-experience-v4#u10-c5
    heading: 'Gosse''s discovery of an inner companion'
    span: 360374:361339
    why: 'The unit''s clearest depiction of self-consciousness being born as a private, individuated interior — the passage Gay stages as an event in the century''s search for self.'
  - id: gay-bourgeois-experience-v4#u10-c6
    heading: 'The family triangle behind every confession'
    span: 365557:366657
    why: 'The unit''s concluding thesis, explicitly naming Freud''s Oedipus complex as the hidden structure behind the century''s religious-crisis autobiographies.'
- nn: 11
  unit_id: ch2-second-thoughts
  note_id: gay-bourgeois-experience-v4-ch2-second-thoughts
  span: 366659:405830
  chunks:
  - id: gay-bourgeois-experience-v4#u11-c1
    heading: 'Rousseau names the double consciousness of autobiography'
    span: 366679:367377
    why: 'States the chapter''s organizing premise—autobiography''s structural split between the remembering and the remembered self—in Rousseau''s own words before tracing how later writers handled it less calmly.'
  - id: gay-bourgeois-experience-v4#u11-c2
    heading: 'Hebbel''s capitulation to Goethe''s harmonizing model'
    span: 370150:370829
    why: 'Shows idealizing self-revision following an explicit literary model, with Gay ranking Hebbel''s falsification as worse than the master''s own harmonizing practice.'
  - id: gay-bourgeois-experience-v4#u11-c3
    heading: 'Sainte-Beuve''s diagnosis: re-vision spoiled vision'
    span: 373193:374443
    why: 'The unit''s sharpest theoretical formulation of how decades of revision let the sentiments of writing-time displace the sentiments of the lived moment.'
  - id: gay-bourgeois-experience-v4#u11-c4
    heading: 'Mill''s excised passage on his mother'
    span: 381199:382647
    why: 'Central evidence for the chapter''s Freudian method—what Mill cut from print, blaming his mother to shield his father, is read as more diagnostic than what he published.'
  - id: gay-bourgeois-experience-v4#u11-c5
    heading: 'Fontane''s last visit to his father'
    span: 399977:401075
    why: 'Shows hindsight deployed deliberately for reconciliation rather than defense, the unit''s counter-case to Hebbel''s and Chateaubriand''s self-serving revisions.'
  - id: gay-bourgeois-experience-v4#u11-c6
    heading: 'A self speaking to other selves'
    span: 404660:405828
    why: 'The chapter''s closing generalization, arguing that autobiography''s value lies in emotional rather than factual truth—the payoff of the whole double-consciousness argument.'
- nn: 12
  unit_id: ch3-biographic-appetite
  note_id: gay-bourgeois-experience-v4-ch3-biographic-appetite
  span: 405830:425352
  chunks:
  - id: gay-bourgeois-experience-v4#u12-c1
    heading: 'The usable past as contested self-image'
    span: 405859:406938
    why: 'States the chapter''s governing claim: reading the past was a contested search for self-flattering usability, not a disinterested pursuit.'
  - id: gay-bourgeois-experience-v4#u12-c2
    heading: 'Discipline as displaced self-control, the historian as cultural psychoanalyst'
    span: 408277:409400
    why: 'Gay''s key interpretive move: professional historical ''discipline'' is itself a bourgeois trait, and its practitioners anticipate the psychoanalyst''s excavation of repressed truth.'
  - id: gay-bourgeois-experience-v4#u12-c3
    heading: 'Naming the biographic appetite'
    span: 409743:410358
    why: 'Supplies the section''s title phrase and periodizes the century''s hunger for lives from Coleridge''s ''age of personality'' to Carlyle''s ''Biographic appetite.'''
  - id: gay-bourgeois-experience-v4#u12-c4
    heading: 'The Dictionary of National Biography as legibility infrastructure'
    span: 420503:421575
    why: 'Concretizes the biographic appetite as an industrial-scale, standardized archive of lives — the clearest legibility-infrastructure passage in the unit.'
  - id: gay-bourgeois-experience-v4#u12-c5
    heading: 'The turn to disenchanted, debunking biography'
    span: 421887:423218
    why: 'Marks the late-century counter-current in which biography turns from celebration to indictment of the very bourgeois class that consumed it.'
  - id: gay-bourgeois-experience-v4#u12-c6
    heading: 'Propriety''s mid-century peak and its recession'
    span: 423996:425350
    why: 'Dates and relativizes the reveal/conceal tension central to Gay''s method, tying it to concrete 1848-1857 events (obscenity trials, Dickens''s self-censorship).'
- nn: 13
  unit_id: ch3-heroes-and-antiheroes
  note_id: gay-bourgeois-experience-v4-ch3-heroes-and-antiheroes
  span: 425352:461698
  chunks:
  - id: gay-bourgeois-experience-v4#u13-c1
    heading: 'Carlyle''s Great Man Thesis'
    span: 426550:427085
    why: 'States, in Carlyle''s own words, the classic nineteenth-century formulation of the Great Man theory that the whole unit takes as its point of departure.'
  - id: gay-bourgeois-experience-v4#u13-c2
    heading: 'A Heroless, Scandalous Generation'
    span: 427597:428408
    why: 'Shows hero-worship as Carlyle''s own anxious, compensatory response to what he felt was a diminished, unheroic present, the diagnosis Gay builds the unit around.'
  - id: gay-bourgeois-experience-v4#u13-c3
    heading: 'Possessing Shakespeare'
    span: 429610:430213
    why: 'Illustrates the psychological mechanism of hero-worship as vicarious possession of genius compensating for bourgeois unheroism.'
  - id: gay-bourgeois-experience-v4#u13-c4
    heading: 'Character Could Be Learned'
    span: 434212:434606
    why: 'Captures the didactic core of Victorian biography: exemplary lives as pedagogy in character, believed to be transmissible through emulation.'
  - id: gay-bourgeois-experience-v4#u13-c5
    heading: 'Mahan''s Inner Nelson'
    span: 450424:450762
    why: 'Marks biography''s historical turn toward treating a subject''s interior life as a legitimate, even scientific, object of inquiry rather than something to conceal.'
  - id: gay-bourgeois-experience-v4#u13-c6
    heading: 'The Neglected Childhood'
    span: 454180:454820
    why: 'Shows the limit of Victorian psychological candor: biographers sensed childhood''s formative power but lacked the interpretive tools to analyze it.'
- nn: 14
  unit_id: ch3-conflicting-claims
  note_id: gay-bourgeois-experience-v4-ch3-conflicting-claims
  span: 461698:503317
  chunks:
  - id: gay-bourgeois-experience-v4#u14-c1
    heading: 'Privacy as an incomplete conquest'
    span: 463163:464436
    why: 'States Gay''s historical argument for privacy''s rise, culminating in the secret ballot as resistance to state legibility of the citizen''s political choices.'
  - id: gay-bourgeois-experience-v4#u14-c2
    heading: 'Bagehot and Trollope defend the private room'
    span: 465866:466870
    why: 'Gives the era''s own articulation, via Bagehot and Trollope, of privacy as an asserted right and dignity rather than mere secretiveness.'
  - id: gay-bourgeois-experience-v4#u14-c3
    heading: 'Repression surfaces as symptom'
    span: 467661:468532
    why: 'The unit''s Freud-anticipating diagnosis of what excessive Victorian reticence produced, central to Gay''s Freud-informed method.'
  - id: gay-bourgeois-experience-v4#u14-c4
    heading: 'The love that dared not speak its name'
    span: 478206:479300
    why: 'Establishes why homosexuality was the era''s hardest case for biographical candor, setting up Justi''s exceptional treatment of Winckelmann.'
  - id: gay-bourgeois-experience-v4#u14-c5
    heading: 'Froude driven to sound Carlyle''s secret'
    span: 493015:493986
    why: 'The unit''s central case study: the biographer''s mandate to reveal colliding with the ''Damocles'' sword of Respectability.'''
  - id: gay-bourgeois-experience-v4#u14-c6
    heading: 'Why bourgeois readers wanted biographies'
    span: 502006:503315
    why: 'Closes the unit by explaining biography''s mass appeal as relief from anxieties of isolation and ignorance, not mere voyeurism.'
- nn: 15
  unit_id: ch3-price-of-professionalism
  note_id: gay-bourgeois-experience-v4-ch3-price-of-professionalism
  span: 503317:538460
  chunks:
  - id: gay-bourgeois-experience-v4#u15-c1
    heading: 'The historian''s ambiguous task: writing the autobiography of a culture'
    span: 503350:503729
    why: 'States the unit''s organizing claim: historians'' professional tensions arose from their ambiguous role writing their culture''s collective self-account.'
  - id: gay-bourgeois-experience-v4#u15-c2
    heading: 'The professionalization paradox'
    span: 507962:508738
    why: 'Gives the unit''s central thesis in a single passage: professional rigor rose exactly as historians'' broader cultural influence waned.'
  - id: gay-bourgeois-experience-v4#u15-c3
    heading: 'Assembling the discipline: chairs, journals, congresses'
    span: 512523:513479
    why: 'Documents the concrete institutional infrastructure — professorships and four national journals founded in succession — through which the new professional paradigm locked into place.'
  - id: gay-bourgeois-experience-v4#u15-c4
    heading: 'From self-display to self-concealment: Macaulay versus Adams'
    span: 518668:520017
    why: 'The unit''s clearest textual evidence for Gay''s reveal/conceal frame, contrasting Macaulay''s confiding first person with Adams''s impersonal statistical opening.'
  - id: gay-bourgeois-experience-v4#u15-c5
    heading: 'Bury''s inaugural: history as science, not literature'
    span: 513481:514586
    why: 'Stages the science-versus-literature quarrel at its most combative, the episode that provoked Trevelyan''s decade-later rejoinder.'
  - id: gay-bourgeois-experience-v4#u15-c6
    heading: 'Identification defined'
    span: 524693:525922
    why: 'Supplies Gay''s Freud-informed definition of identification as the profession''s central psychological mechanism, setting up the Fustel, Michelet, and Motley cases that follow.'
- nn: 16
  unit_id: ch3-ranke
  note_id: gay-bourgeois-experience-v4-ch3-ranke
  span: 538460:571710
  chunks:
  - id: gay-bourgeois-experience-v4#u16-c1
    heading: 'The historicist creed: "how it really was"'
    span: 541909:542639
    why: 'States Ranke''s founding historicist dictum and its canonical gloss, the single passage the rest of the unit''s argument orbits.'
  - id: gay-bourgeois-experience-v4#u16-c2
    heading: 'Self-obliteration as the price of empathy'
    span: 542641:543406
    why: 'Names Ranke''s own term for the self-erasing empathetic method that underwrites his claim to objectivity.'
  - id: gay-bourgeois-experience-v4#u16-c3
    heading: 'Acton''s "colourless" eulogy'
    span: 543952:544528
    why: 'Captures how contemporaries received and praised the Rankean ideal of a historian who suppresses his own convictions.'
  - id: gay-bourgeois-experience-v4#u16-c4
    heading: 'God manifest in history'
    span: 546286:546655
    why: 'Shows the undogmatic Lutheran faith Gay argues actually powered Ranke''s supposedly value-free historical science.'
  - id: gay-bourgeois-experience-v4#u16-c5
    heading: 'The archive as a beloved'
    span: 553604:553967
    why: 'The vivid personal letter revealing the emotional, almost erotic charge behind Ranke''s archival empiricism.'
  - id: gay-bourgeois-experience-v4#u16-c6
    heading: 'Individuals as social products'
    span: 570086:570918
    why: 'Summarizes Ranke''s own social-psychological view of how individuals and historical moments make each other, the unit''s closing argument.'
- nn: 17
  unit_id: ch3-agendas-high-and-low
  note_id: gay-bourgeois-experience-v4-ch3-agendas-high-and-low
  span: 571710:603614
  chunks:
  - id: gay-bourgeois-experience-v4#u17-c1
    heading: 'Why the Victorians read history'
    span: 571735:572388
    why: 'Opens the chapter by cataloguing the non-epistemic uses—moral formation, national self-flattery, narrative pleasure—that made history-reading a bourgeois habit in the first place.'
  - id: gay-bourgeois-experience-v4#u17-c2
    heading: 'Acton''s defense of the partisan historian'
    span: 577853:578843
    why: 'Acton''s paradox is the chapter''s thesis in miniature: an historian''s declared political passion can be the very instrument that uncovers what dispassionate scholarship misses.'
  - id: gay-bourgeois-experience-v4#u17-c3
    heading: 'Bernstein''s Marxist spectacles find the Diggers'
    span: 578845:579866
    why: 'A concrete case of Acton''s paradox: Bernstein''s socialist commitment functioned as a search heuristic that made a genuinely invisible seventeenth-century group visible for the first time.'
  - id: gay-bourgeois-experience-v4#u17-c4
    heading: 'Burckhardt and Turner: history as mirror, not telescope'
    span: 581441:581869
    why: 'States most starkly the danger Gay has been building toward: historians may unwittingly write their own age''s self-image rather than the past''s reality.'
  - id: gay-bourgeois-experience-v4#u17-c5
    heading: 'Jäger''s ‘complete objectivity’ against Wilhelm II''s ‘national Germans’'
    span: 594054:595473
    why: 'Sets the chapter''s title in direct opposition: Jäger''s ‘high’ agenda of disinterested truth against Wilhelm II''s ‘low’ agenda of manufacturing patriotic schoolchildren.'
  - id: gay-bourgeois-experience-v4#u17-c6
    heading: 'August 1914: the popular history exacts its due'
    span: 602794:603612
    why: 'The chapter''s payoff: the simplified, nationalist history absorbed in classrooms, not the demanding scholarly ideal, is what actually mobilized Europe''s publics for war.'
- nn: 18
  unit_id: ch4-toward-the-terrible-core
  note_id: gay-bourgeois-experience-v4-ch4-toward-the-terrible-core
  span: 603614:618235
  chunks:
  - id: gay-bourgeois-experience-v4#u18-c1
    heading: 'The novel''s climb to bourgeois respectability'
    span: 603680:604850
    why: 'Establishes the chapter''s premise — fiction''s rise from suspect diversion to prestige vehicle — via the Austen/Goethe/Scott/Disraeli sequence that frames everything that follows.'
  - id: gay-bourgeois-experience-v4#u18-c2
    heading: 'Stendhal''s mirror, Hawthorne''s terrible core, Tolstoy''s psychological history'
    span: 605724:606615
    why: 'States the chapter''s central claim in the novelists'' own words: fiction as a truth-telling instrument for the bourgeoisie''s inner life.'
  - id: gay-bourgeois-experience-v4#u18-c3
    heading: 'The formalist objection: narrative serving psychology, or the reverse'
    span: 606863:607670
    why: 'Carries the strongest counter-argument Gay must answer — that fictional psychology is an artifact of narrative craft, not evidence of real inner life.'
  - id: gay-bourgeois-experience-v4#u18-c4
    heading: 'James and Chekhov against the separation of art and life'
    span: 607821:608584
    why: 'Gay''s historical rebuttal to the formalist/aestheticist objection, anchoring his method''s warrant in the era''s own dominant view.'
  - id: gay-bourgeois-experience-v4#u18-c5
    heading: 'The "statistical invention": stratifying the reading public'
    span: 613356:614190
    why: 'Shows fiction''s audience as a manufactured, unequally literate, commercially targeted population, complicating any simple claim that ''the novel'' spoke for ''the bourgeoisie.'''
  - id: gay-bourgeois-experience-v4#u18-c6
    heading: 'Freud on daydream and the wish-fulfillment of fiction'
    span: 617222:618233
    why: 'Supplies the chapter''s deepest-layer explanation — the psychoanalytic root Gay''s whole method depends on — for why fiction moved bourgeois readers at all.'
- nn: 19
  unit_id: ch4-regression-to-polarities
  note_id: gay-bourgeois-experience-v4-ch4-regression-to-polarities
  span: 618235:653682
  chunks:
  - id: gay-bourgeois-experience-v4#u19-c1
    heading: 'Karl May''s diagnosis of fiction as psychological salve'
    span: 618905:619468
    why: 'States, in the author''s own words, the compensatory-daydream thesis that organizes Gay''s whole psychoanalytic reading of popular fiction.'
  - id: gay-bourgeois-experience-v4#u19-c2
    heading: 'Reading as collusion between author and reader'
    span: 620287:621200
    why: 'Establishes Gay''s claim that popular fiction was co-authored by its readers, evidenced by Dickens''s audience-driven revision of Great Expectations.'
  - id: gay-bourgeois-experience-v4#u19-c3
    heading: 'Fiction as a return to infantile polarity'
    span: 629200:630396
    why: 'This is the unit''s psychoanalytic core, deriving the fiction''s black-and-white moral world from the infant''s undifferentiated perceptual field.'
  - id: gay-bourgeois-experience-v4#u19-c4
    heading: 'Rodolphe as omnipotent avenging father'
    span: 643218:643873
    why: 'Gives the paradigm case—Sue''s Rodolphe—for the polarized, wish-fulfilling hero-type Gay is diagnosing, and states the chapter''s thesis in its closing clause.'
  - id: gay-bourgeois-experience-v4#u19-c5
    heading: 'Karl May''s confession: ''I myself... had to become a fairy tale'''
    span: 644671:645200
    why: 'The unit''s climactic turn, where the author of escapist fiction admits to having fictionalized his own life, collapsing reader-psychology and author-psychology into one case.'
  - id: gay-bourgeois-experience-v4#u19-c6
    heading: 'Freud on the refusal to give up a pleasure'
    span: 653302:653680
    why: 'Closes the unit by naming the Freudian frame explicitly, tying adult readers'' persistence in childish reading pleasures to psychoanalytic regression.'
- nn: 20
  unit_id: ch4-immediacy
  note_id: gay-bourgeois-experience-v4-ch4-immediacy
  span: 653682:674966
  chunks:
  - id: gay-bourgeois-experience-v4#u20-c1
    heading: 'The first-person contract with the reader'
    span: 653696:654716
    why: 'Opens the unit''s central claim that the first-person narrator is a deliberate technical convention for manufacturing reader intimacy, not simply a transparent report of the self.'
  - id: gay-bourgeois-experience-v4#u20-c2
    heading: 'Chekhov: self-effacement as the price of the naked heart'
    span: 658409:659521
    why: 'States the unit''s title theme directly: Chekhov''s paradox that authorial self-effacement, not confession, is what secures access to "the naked heart."'
  - id: gay-bourgeois-experience-v4#u20-c3
    heading: 'Chekhov as impartial witness'
    span: 660993:661601
    why: 'Chekhov''s explicit manifesto for artistic objectivity shows the promise of first-person immediacy being deliberately withheld rather than exploited for confession.'
  - id: gay-bourgeois-experience-v4#u20-c4
    heading: 'The narrator watching himself grieve'
    span: 668925:669330
    why: 'Tolstoy''s narrator catches himself performing grief for observers even as he grieves — the ambivalent self-scrutiny Gay reads as Freudian evidence of the bourgeois self''s defenses.'
  - id: gay-bourgeois-experience-v4#u20-c5
    heading: 'The adult hand inside the child''s voice'
    span: 670912:671806
    why: 'Demonstrates that Childhood''s "immediacy" is retrospectively constructed — the adult author''s hand inside the boy''s voice — grounding the unit''s argument that first-person confession is authored, not simply confessed.'
- nn: 21
  unit_id: ch4-strains-of-complexity
  note_id: gay-bourgeois-experience-v4-ch4-strains-of-complexity
  span: 674966:714871
  chunks:
  - id: gay-bourgeois-experience-v4#u21-c1
    heading: 'Hawthorne''s despair at the market'
    span: 675392:675796
    why: 'Sets up the unit''s central tension—serious fiction''s commercial defeat by popular sensation—in Hawthorne''s own bitter words.'
  - id: gay-bourgeois-experience-v4#u21-c2
    heading: 'Eliot''s charter for mapping the interior'
    span: 680639:681387
    why: 'Eliot''s own maxims are the unit''s clearest statement of the naked-heart project as a deliberate program of making interior life legible.'
  - id: gay-bourgeois-experience-v4#u21-c3
    heading: 'The demand for a veil'
    span: 679915:680380
    why: 'Shows the bourgeois public''s reflex against Eliot''s candor, the reveal/conceal tension that structures Gay''s whole volume.'
  - id: gay-bourgeois-experience-v4#u21-c4
    heading: 'Ambivalence as the source of Dostoevsky''s realism'
    span: 691004:691871
    why: 'Gay''s direct argument for why Dostoevsky''s psychology persuades: characters riven by simultaneous, contradictory wills rather than single-minded villainy.'
  - id: gay-bourgeois-experience-v4#u21-c5
    heading: 'Golyadkin''s double as the key to Dostoevsky''s method'
    span: 691873:693051
    why: 'Identifies the split-self figure Dostoevsky returns to across his career, treated by Gay as the clearest clue to his psychological project.'
  - id: gay-bourgeois-experience-v4#u21-c6
    heading: 'James''s editor diagnoses deliberate difficulty'
    span: 700033:700575
    why: 'A contemporary insider''s verdict that James''s psychological subtlety was commercially disqualifying in real time, not just in retrospect.'
- nn: 22
  unit_id: ch4-dickens
  note_id: gay-bourgeois-experience-v4-ch4-dickens
  span: 714871:754032
  chunks:
  - id: gay-bourgeois-experience-v4#u22-c1
    heading: 'Dickens as the bourgeoisie''s own novelist'
    span: 717935:718542
    why: 'States Gay''s framing claim that Dickens''s mass readership was centered on, and defined by, the bourgeoisie, setting up the chapter''s argument that his psychology is bourgeois self-understanding in mass form.'
  - id: gay-bourgeois-experience-v4#u22-c2
    heading: 'The generational verdict turns against Dickens''s pathos'
    span: 726439:727187
    why: 'Captures the critical reversal—from Lord Jeffrey''s tears to Wilde''s ''heart of stone'' quip—that Gay uses to isolate the specific charge his Freudian reading of Dickens must overturn.'
  - id: gay-bourgeois-experience-v4#u22-c3
    heading: 'Freud''s warrant: Oedipus Rex and enduring fictional power'
    span: 731517:732191
    why: 'The chapter''s pivot: Freud''s 1897 letter supplies the theoretical test (universal unconscious material plus literary craft) that licenses Gay''s claim that Dickens is more than a superficial entertainer.'
  - id: gay-bourgeois-experience-v4#u22-c4
    heading: 'The blacking warehouse: confession displaced into fiction'
    span: 741510:742636
    why: 'Shows the direct mechanism by which Dickens''s own childhood shame was transplanted into David Copperfield, grounding Gay''s oedipal reading in documented autobiography.'
  - id: gay-bourgeois-experience-v4#u22-c5
    heading: 'Agnes Wickfield''s goodness as defense against guilt'
    span: 747560:748510
    why: 'Gay''s most granular Freudian close reading: a supporting character''s saintliness is decoded as a symptom of internalized parental guilt rather than simple virtue.'
  - id: gay-bourgeois-experience-v4#u22-c6
    heading: 'The novel''s license to reveal and duty to conceal'
    span: 752961:754030
    why: 'The chapter''s closing thesis statement, generalizing Dickens''s case into the volume''s central argument about fiction''s regulated trespass on private, inward experience.'
- nn: 23
  unit_id: ch5-ego
  note_id: gay-bourgeois-experience-v4-ch5-ego
  span: 754032:783523
  chunks:
  - id: gay-bourgeois-experience-v4#u23-c1
    heading: 'Corinth''s 1913 "Ego" self-portrait'
    span: 756929:757927
    why: 'Gay''s paradigm image of a self-portrait that both discloses and conceals — cheerful tourist garb over a glowering, fearful face, capped by the single legible word ''Ego.'''
  - id: gay-bourgeois-experience-v4#u23-c2
    heading: 'Hiding the suffering soul, revealing the naked heart'
    span: 758746:759558
    why: 'States outright the concealment/disclosure tension driving the section, and uses the volume''s own title phrase (''naked heart'') to describe a painted rather than written confession.'
  - id: gay-bourgeois-experience-v4#u23-c3
    heading: '"Every picture is a self-portrait"'
    span: 762768:763527
    why: 'Gives the era''s own theoretical generalization — via Carderera and Friedrich — that a painter''s whole output, not just formal self-portraits, counts as autobiographical confession.'
  - id: gay-bourgeois-experience-v4#u23-c4
    heading: 'Self-portraiture as coded performance, not raw transparency'
    span: 768219:768905
    why: 'Gay''s key methodological qualification: self-portraits are addressed, rule-bound pictorial speech, not unmediated windows into the sitter''s interior.'
  - id: gay-bourgeois-experience-v4#u23-c5
    heading: 'Friedrich: landscape as religious autobiography'
    span: 780399:781219
    why: 'The fullest statement of the section''s closing argument that landscape painting, via Friedrich''s pantheistic identification with Nature, becomes a second confessional medium.'
- nn: 24
  unit_id: ch5-icons-to-dream-by
  note_id: gay-bourgeois-experience-v4-ch5-icons-to-dream-by
  span: 783523:809644
  chunks:
  - id: gay-bourgeois-experience-v4#u24-c1
    heading: 'Kitsch as a defense against inwardness'
    span: 787723:788583
    why: 'States explicitly the volume''s key distinction — between viewers who can ''probe beneath surfaces'' and kitsch consumers who cannot — and names kitsch as ''a defense against inwardness.'''
  - id: gay-bourgeois-experience-v4#u24-c2
    heading: 'Millet''s manufactured martyrdom'
    span: 790444:791193
    why: 'Shows Gay debunking the myth of Millet''s poverty and rejection, revealing it as a biographer''s fabrication aimed at pious bourgeois collectors.'
  - id: gay-bourgeois-experience-v4#u24-c3
    heading: 'Dresdner''s call for re-enchantment'
    span: 797390:798333
    why: 'Contains the unit''s most explicit disenchantment/re-enchantment statement, directly resonant with WMP''s re-enchantment concept.'
  - id: gay-bourgeois-experience-v4#u24-c4
    heading: 'Böcklin''s self as the only home of his art'
    span: 800841:801254
    why: 'Captures contemporaries'' framing of Böcklin''s art as continuous self-construction rather than a single act of expression.'
  - id: gay-bourgeois-experience-v4#u24-c5
    heading: 'Projections onto the Isle of the Dead'
    span: 804782:805573
    why: 'Catalogs the incompatible readings bourgeois viewers projected onto Böcklin''s deliberately ambiguous painting.'
  - id: gay-bourgeois-experience-v4#u24-c6
    heading: 'Viewers'' own inner needs, not the artist''s message'
    span: 809213:809642
    why: 'Gay''s closing thesis sentence for the unit, stating outright that bourgeois art-viewing was an act of self-projection.'
- nn: 25
  unit_id: ch5-teutonic-mirrors
  note_id: gay-bourgeois-experience-v4-ch5-teutonic-mirrors
  span: 809644:842540
  chunks:
  - id: gay-bourgeois-experience-v4#u25-c1
    heading: 'Political impotence into metaphysical grandiosity'
    span: 809665:811000
    why: 'States the chapter''s central thesis: Germans converted exclusion from political citizenship into a compensatory claim of superior inwardness.'
  - id: gay-bourgeois-experience-v4#u25-c2
    heading: 'Death as a shared painterly convention'
    span: 812334:813000
    why: 'Establishes the mortality motif running through German self-portraiture as a Romantic inheritance, quoting Caspar David Friedrich in his own words.'
  - id: gay-bourgeois-experience-v4#u25-c3
    heading: 'Dürer''s 1500 self-portrait canonized'
    span: 824001:824946
    why: 'Shows the specific mechanism by which one image became a fixed national icon, endlessly reproduced and read as proof of German character.'
  - id: gay-bourgeois-experience-v4#u25-c4
    heading: 'Langbehn''s Rembrandt als Erzieher'
    span: 836675:838161
    why: 'Documents the cult''s curdling into explicit ethno-nationalist and antisemitic ideology, the unit''s clearest case of Romantic inwardness weaponized politically.'
  - id: gay-bourgeois-experience-v4#u25-c5
    heading: '"Unser Rembrandt": annexing a foreigner'
    span: 829605:830655
    why: 'Makes explicit that the inwardness claim functioned as competitive national possession, extended even to a painter of a different nationality.'
- nn: 26
  unit_id: ch6-spirit-of-the-letter-1
  note_id: gay-bourgeois-experience-v4-ch6-spirit-of-the-letter-1
  span: 842540:871212
  chunks:
  - id: gay-bourgeois-experience-v4#u26-c1
    heading: 'Self-concealment and self-revelation, the chapter''s thesis'
    span: 842571:843179
    why: 'States the chapter''s governing dialectic — letters as sites of both self-protection and self-revelation — that every later passage in the unit illustrates.'
  - id: gay-bourgeois-experience-v4#u26-c2
    heading: 'The ancient letter as social document'
    span: 846485:846812
    why: 'Establishes the pre-romantic baseline (letters as quasi-public documents) against which Gay measures the nineteenth-century turn to intimacy.'
  - id: gay-bourgeois-experience-v4#u26-c3
    heading: 'The romantic letter as revelation of self'
    span: 851627:852723
    why: 'Carries the volume''s central claim in miniature via Novalis''s aphorism and Byron''s self-description — the letter as deliberate, principled self-baring.'
  - id: gay-bourgeois-experience-v4#u26-c4
    heading: 'Technology as the democratizing ally of romanticism'
    span: 855579:856694
    why: 'Names the infrastructural (not merely cultural) cause of Victorian letter-writing''s scale, the pivot point of the unit''s second half.'
  - id: gay-bourgeois-experience-v4#u26-c5
    heading: 'Chonon Wengeroff''s letter to Pauline'
    span: 868845:870101
    why: 'The unit''s most vivid primary illustration of confessional intimacy achieved even within an arranged-marriage culture, treasured for half a century by its recipient.'
- nn: 27
  unit_id: ch6-spirit-of-the-letter-2
  note_id: gay-bourgeois-experience-v4-ch6-spirit-of-the-letter-2
  span: 871212:900948
  chunks:
  - id: gay-bourgeois-experience-v4#u27-c1
    heading: 'The state, the sealed letter, and the limits of legibility'
    span: 874158:875749
    why: 'Shows privacy of correspondence explicitly defended against a legibility-seeking state (the Mazzini mail-opening scandal), the unit''s clearest resonance with WMP legibility.'
  - id: gay-bourgeois-experience-v4#u27-c2
    heading: 'The manuals'' unresolved demand for scripted naturalness'
    span: 881606:882555
    why: 'States plainly the letter-writing industry''s central, unnoticed contradiction between prescribed artifice and claimed spontaneity.'
  - id: gay-bourgeois-experience-v4#u27-c3
    heading: 'Disregard of the manuals as the guarantee of authenticity'
    span: 886691:887780
    why: 'The unit''s thesis sentence: unscripted correspondence produces either genuine self-revelation or genuine self-concealment, Gay''s Freud-informed pairing.'
  - id: gay-bourgeois-experience-v4#u27-c4
    heading: 'Letter-writing as an exercise in self-definition'
    span: 897893:898710
    why: 'Gay''s explicit claim that writing letters constructs rather than merely reports the self, the core evidence for self-construction-through-writing.'
  - id: gay-bourgeois-experience-v4#u27-c5
    heading: 'Balzac''s letters: the man in dressing gown and slippers'
    span: 898712:899778
    why: 'Barbey D''Aurevilly''s contemporary verdict that private letters disclose the true self against the public, published persona, reinforcing the self-construction theme from outside the manuals.'
  - id: gay-bourgeois-experience-v4#u27-c6
    heading: 'The Bahr correspondence as displaced autobiography'
    span: 892476:893545
    why: 'Gay''s fullest documented case of a father-son letter-duel functioning as autobiography, aggression voiced through piety and self-pity.'
- nn: 28
  unit_id: ch6-discreet-best-friend-1
  note_id: gay-bourgeois-experience-v4-ch6-discreet-best-friend-1
  span: 900948:923602
  chunks:
  - id: gay-bourgeois-experience-v4#u28-c1
    heading: 'The diary as a living confidant'
    span: 901143:902199
    why: 'States Gay''s central thesis: Victorian diarists, unlike earlier diarists such as Pepys or Boswell, invented an independent, humanized personage to receive their confidences.'
  - id: gay-bourgeois-experience-v4#u28-c2
    heading: 'De Guérin apostrophizes his cahier'
    span: 902280:902712
    why: 'The era''s most vivid literalization of the diary-as-confidant, addressed as a being with a soul, love, and compassion the writer could not find among people.'
  - id: gay-bourgeois-experience-v4#u28-c3
    heading: 'Privacy as precondition, glancing toward posterity'
    span: 905279:906683
    why: 'Shows confession''s dependence on assumed secrecy colliding with Hebbel''s undisguised hope for future biographers, the tension Gay reads as Freudian ''protesting too much.'''
  - id: gay-bourgeois-experience-v4#u28-c4
    heading: 'Letts & Co. and the industry of self-record'
    span: 909722:911133
    why: 'Documents the commercial infrastructure that scaled private diary-keeping into a standardized, mass-manufactured bourgeois institution.'
  - id: gay-bourgeois-experience-v4#u28-c5
    heading: 'Emily Shore''s diary changes character'
    span: 922326:922753
