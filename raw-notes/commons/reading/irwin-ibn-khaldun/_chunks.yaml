# sha256 edb80b2b53899c11c702589347c62680e65a192faeafd30a57b35a9593c2170b
# (461442 chars; PyMuPDF text of the born-digital PDF, Preface + Chapters 1-11 only -- front
# matter, chronology, endnotes, bibliography and index removed, running heads and note numerals
# stripped -- BEFORE offsets were resolved; the spans are meaningless against any other
# extraction). Chunk ids
# match each reading note's `cites:` field.
source: irwin-ibn-khaldun
units:
- nn: 1
  unit_id: preface
  note_id: irwin-ibn-khaldun-preface
  span: 0:14290
  chunks:
  - id: irwin-ibn-khaldun#u01-c1
    heading: 'Modern acclaim and Ibn Khaldun''s own claim to originality'
    span: 9:1722
    why: 'Assembles the twentieth-century superlatives (Toynbee, Trevor-Roper, Hodgson, Gellner) and Ibn Khaldun''s own claim to an original, God-inspired science, the reputation Irwin sets out to reassess.'
  - id: irwin-ibn-khaldun#u01-c2
    heading: 'Why historians make mistakes: zahir and batin'
    span: 4050:4610
    why: 'Irwin''s compact statement of the Muqaddima''s critique of credulous historiography, with the three causes of error and the outer/inner meaning distinction.'
  - id: irwin-ibn-khaldun#u01-c3
    heading: 'The questions modern commentators ask'
    span: 5396:6168
    why: 'Lists the contested interpretive questions (sociologist, Sufi, rationalist, cyclical model''s scope, nomads, prophecy) that structure the whole book.'
  - id: irwin-ibn-khaldun#u01-c4
    heading: 'Against modernizing and Westernizing Ibn Khaldun'
    span: 7766:9154
    why: 'Irwin''s central thesis that scholars have selectively abridged, modernized and Westernized Ibn Khaldun, with the Darwin and Marx examples.'
  - id: irwin-ibn-khaldun#u01-c5
    heading: 'Irrelevance as the source of interest'
    span: 9156:10563
    why: 'Irwin''s methodological manifesto: he declines to make Ibn Khaldun relevant and treats his alien quality as the point, with Crone''s warning about thinking away modernity.'
  - id: irwin-ibn-khaldun#u01-c6
    heading: 'A premodern frame: God''s will, salvation, angels and demons'
    span: 10565:11387
    why: 'States what the premodern frame consists of and why contrast rather than comparison is the payoff of reading Ibn Khaldun.'
- nn: 2
  unit_id: ch01-ruins-black-death
  note_id: irwin-ibn-khaldun-ch01-ruins-black-death
  span: 14290:31880
  chunks:
  - id: irwin-ibn-khaldun#u02-c1
    heading: 'The City of Brass and its tablets of warning'
    span: 14987:16334
    why: 'The frame story of ruins that speak as warnings, which Irwin uses as a prefiguration of Ibn Khaldun''s whole theme.'
  - id: irwin-ibn-khaldun#u02-c2
    heading: 'Ruins in the Muqaddima and North Africa'
    span: 17841:18910
    why: 'Connects the tale to Ibn Khaldun''s own landscape of Roman ruins and his evidence for earlier prosperity.'
  - id: irwin-ibn-khaldun#u02-c3
    heading: '''Ibra: ruins as messages and the Qur''anic vocabulary of warning'
    span: 21478:22902
    why: 'Explains the title Kitab al-''Ibar and the religious concept of historical lesson-taking that Irwin sets against modernizing readings.'
  - id: irwin-ibn-khaldun#u02-c4
    heading: 'History as a book of warnings, not archaeology'
    span: 24353:25338
    why: 'States the religious purpose of the Muqaddima and Irwin''s explicit limit on how modern Ibn Khaldun''s treatment of ruins and sources should be read.'
  - id: irwin-ibn-khaldun#u02-c5
    heading: 'Garcin: the City of Brass as reflection on the Black Death'
    span: 28063:29014
    why: 'Links the story''s fourteenth-century form and Ibn Khaldun''s project to the 1348 plague, carrying Garcin''s argument and Irwin''s hedged extension.'
  - id: irwin-ibn-khaldun#u02-c6
    heading: 'The plague in Ibn Khaldun''s own words'
    span: 30469:31878
    why: 'Biographical shock (loss of parents and teachers) plus Ibn Khaldun''s own account of dynasties in senility and civilization contracting with population.'
- nn: 3
  unit_id: ch01-masudi-iram-weird-science
  note_id: irwin-ibn-khaldun-ch01-masudi-iram-weird-science
  span: 31880:54910
  chunks:
  - id: irwin-ibn-khaldun#u03-c1
    heading: 'Ibn Khaldun''s admiration for al-Mas‘udi and the nomad cult'
    span: 35727:36722
    why: 'Establishes al-Mas‘udi as Ibn Khaldun''s model and the probable source of his valorization of desert life over urban settlement.'
  - id: irwin-ibn-khaldun#u03-c2
    heading: 'The City of Brass: Ibn Khaldun''s critique and Irwin''s rebuttal'
    span: 37258:38543
    why: 'Shows Ibn Khaldun''s credulity-critique in action and Irwin''s argument that he misread marvel literature as literal history.'
  - id: irwin-ibn-khaldun#u03-c3
    heading: 'Giants, monuments and social organization'
    span: 46317:47476
    why: 'Ibn Khaldun''s most modern-sounding argument, explaining vast ruins by social organization and machinery rather than giants.'
  - id: irwin-ibn-khaldun#u03-c4
    heading: 'Weird science: the sun that is neither hot nor cold'
    span: 47478:49364
    why: 'Irwin''s explicit limit on reading Ibn Khaldun as modern, with a concrete example of his physics.'
  - id: irwin-ibn-khaldun#u03-c5
    heading: 'Ruins as evidence of bad government or God''s decree'
    span: 50846:51783
    why: 'States the Muqaddima''s ambivalence between natural or social causes of ruin and divine decree.'
  - id: irwin-ibn-khaldun#u03-c6
    heading: 'Overdetermined dynastic fall: social cause and divine judgment'
    span: 52562:54152
    why: 'Irwin''s resolution of the natural-versus-divine tension, with a compact summary of the ‘asabiyya decay mechanism.'
- nn: 4
  unit_id: ch02-topography-early-career
  note_id: irwin-ibn-khaldun-ch02-topography-early-career
  span: 54910:81069
  chunks:
  - id: irwin-ibn-khaldun#u04-c1
    heading: 'The three-cornered post-Almohad struggle'
    span: 54979:56671
    why: 'Sets out the dynastic geography, gold-route stakes, unreliable tribal levies and absent primogeniture that frame the whole career narrative.'
  - id: irwin-ibn-khaldun#u04-c2
    heading: 'Borrowed geography from al-Idrisi'
    span: 56685:58322
    why: 'Irwin''s direct judgment that parts of the Muqaddima are encyclopedic borrowing, not the analytic thesis moderns admire.'
  - id: irwin-ibn-khaldun#u04-c3
    heading: 'Gog and Magog accepted, City of Brass doubted'
    span: 58324:58746
    why: 'Shows the scriptural, apocalyptic limit of Ibn Khaldun''s skepticism, with Irwin''s hedged explanation.'
  - id: irwin-ibn-khaldun#u04-c4
    heading: 'The scribe as bureaucratic condottiere'
    span: 63435:64228
    why: 'Compact characterization of Ibn Khaldun''s political life and the risks of court service.'
  - id: irwin-ibn-khaldun#u04-c5
    heading: 'Scholars at court as insignia of royalty'
    span: 67852:68579
    why: 'Explains the Maghribi-Andalusian use of learned men as a marker of royal legitimacy, contrasted with the Mamluks.'
  - id: irwin-ibn-khaldun#u04-c6
    heading: 'Imprisonment, desertion by levies, and Merinid decline'
    span: 76889:77995
    why: 'Combines Ibn Khaldun''s plotting and jail term with tribal desertion and the murder of Abu ‘Inan that starts Merinid decline.'
- nn: 5
  unit_id: ch02-ibn-al-khatib-spain-return
  note_id: irwin-ibn-khaldun-ch02-ibn-al-khatib-spain-return
  span: 81069:95277
  chunks:
  - id: irwin-ibn-khaldun#u05-c1
    heading: 'Ibn al-Khatib''s historiography: exemplary, individual, cyclical'
    span: 82610:83698
    why: 'Contrasts Ibn al-Khatib''s moralizing, personality-centred history and his doomed-dynasties cycle with Ibn Khaldun''s search for general laws.'
  - id: irwin-ibn-khaldun#u05-c2
    heading: 'Ibn al-Khatib''s heresy trial and death'
    span: 90356:90878
    why: 'Shows Sufi heterodoxy turned into a political weapon at the courts of Granada and Fez, and Ibn Khaldun''s response to his friend''s death.'
  - id: irwin-ibn-khaldun#u05-c3
    heading: 'Embassy to Pedro the Cruel and suspicion at Granada'
    span: 86327:87565
    why: 'Records Ibn Khaldun''s refusal of conversion, the rivalry with Ibn al-Khatib, and Irwin''s doubt about the philosopher-king reading.'
  - id: irwin-ibn-khaldun#u05-c4
    heading: 'Biskra: the half-hearted retirement'
    span: 88698:89186
    why: 'Ibn Khaldun''s own words on renouncing office for scholarship, set against the tribal politics of the Zab region.'
  - id: irwin-ibn-khaldun#u05-c5
    heading: 'Crone on weak and oppressive government, and the Muqaddima''s silence'
    span: 92635:93403
    why: 'Gives the violent political background of the Maghrib and Irwin''s observation that the Muqaddima largely omits it.'
  - id: irwin-ibn-khaldun#u05-c6
    heading: 'The nomad historian and the Muqaddima as reflection on failure'
    span: 93405:94891
    why: 'Presents the hedged Mahdi/Crone hypothesis that the Muqaddima explains political failure, the Machiavelli comparison, and Ibn Khaldun''s argument about scholars and politics.'
- nn: 6
  unit_id: ch03-nomads-asabiyya
  note_id: irwin-ibn-khaldun-ch03-nomads-asabiyya
  span: 95277:117607
  chunks:
  - id: irwin-ibn-khaldun#u06-c1
    heading: 'Retreat as khalwa and claimed originality'
    span: 98373:100089
    why: 'Shows the Muqaddima composed as religiously framed reflection on God working through social processes, with Ibn Khaldun''s own claim to originality.'
  - id: irwin-ibn-khaldun#u06-c2
    heading: 'Nomad health claim in the Muqaddima'
    span: 104036:105080
    why: 'States Ibn Khaldun''s humoral argument that scarcity makes desert people healthier and better in character than the well-fed.'
  - id: irwin-ibn-khaldun#u06-c3
    heading: 'Later observers contradict the healthy-nomad thesis'
    span: 106512:107636
    why: 'Irwin''s evidential check on the nomad-virtue thesis, against the romantic reception represented by Chatwin.'
  - id: irwin-ibn-khaldun#u06-c4
    heading: '‘Asabiyya as ethnographic blind spot and divine tool'
    span: 110480:111534
    why: 'Irwin''s qualified account of what ‘asabiyya is for Ibn Khaldun: dynamic, power-seeking, and an instrument of God, not a general ethnography.'
  - id: irwin-ibn-khaldun#u06-c5
    heading: 'Dynasty formation, religion, and the three-to-four generation decay'
    span: 111536:113466
    why: 'The compact statement of the cycle: ‘asabiyya, mulk, religious coloring, luxury, taxation, collapse and replacement.'
  - id: irwin-ibn-khaldun#u06-c6
    heading: 'Where the cyclical model does not fit'
    span: 115937:116807
    why: 'Irwin bounds the theory, noting Ibn Khaldun''s own exceptions and the long-lived dynasties that contradict the four-generation rule.'
- nn: 7
  unit_id: ch03-bedouin-berbers-genealogy
  note_id: irwin-ibn-khaldun-ch03-bedouin-berbers-genealogy
  span: 117607:139044
  chunks:
  - id: irwin-ibn-khaldun#u07-c1
    heading: 'Ascetic cameos and the moralizing trope'
    span: 119258:119846
    why: 'States Irwin''s thesis that a chroniclers'' moralizing trope, more than a new sociology, inspired Ibn Khaldun''s engine of history.'
  - id: irwin-ibn-khaldun#u07-c2
    heading: 'Bedouins closer to good; sedentary life as decay'
    span: 121851:122639
    why: 'Gives the badawa/hadara moral contrast and its Qur''anic and prophetic background.'
  - id: irwin-ibn-khaldun#u07-c3
    heading: 'Who is a Bedouin? Slippery terms'
    span: 123599:125279
    why: 'Shows that badawi and desert life are not a clean nomad/sedentary binary in Ibn Khaldun.'
  - id: irwin-ibn-khaldun#u07-c4
    heading: 'The legend of the Banu Hilal'
    span: 126137:128114
    why: 'Presents Ibn Khaldun''s locust-swarm narrative and the modern revision of it, plus its later colonial use.'
  - id: irwin-ibn-khaldun#u07-c5
    heading: 'Genealogy and ‘asabiyya'
    span: 132184:133231
    why: 'Links genealogy to ‘asabiyya and gives his critical test for fabricated lineages.'
  - id: irwin-ibn-khaldun#u07-c6
    heading: 'Genealogies as continuously redrafted fictions'
    span: 137313:138014
    why: 'Summarizes the functional, fictional character of tribal genealogy and doubts about Ibn Khaldun''s own.'
- nn: 8
  unit_id: ch03-wisdom-literature-ibar
  note_id: irwin-ibn-khaldun-ch03-wisdom-literature-ibar
  span: 139044:151959
  chunks:
  - id: irwin-ibn-khaldun#u08-c1
    heading: 'The Muqaddima as mirror for princes'
    span: 139081:140391
    why: 'Establishes that parts of the Muqaddima belong to the Persian and Islamic advice-literature tradition, with a religious rather than secular frame for rulership.'
  - id: irwin-ibn-khaldun#u08-c2
    heading: 'Pseudo-Aristotle and the Circle of Justice'
    span: 140393:142486
    why: 'Shows Ibn Khaldun''s reliance on a misattributed occult-encyclopedic text and quotes the Circle of Justice metaphor that later impressed the Turks.'
  - id: irwin-ibn-khaldun#u08-c3
    heading: 'The ‘Ibar judged conventional'
    span: 144736:145615
    why: 'Gathers the scholarly verdict that the history fails to live up to the Muqaddima''s theoretical promise, with the qualification that this was perhaps unavoidable.'
  - id: irwin-ibn-khaldun#u08-c4
    heading: 'Weak chronology and the Muqaddima as afterthoughts'
    span: 147481:148522
    why: 'Gives Irwin''s carefully hedged reconstruction of how the Muqaddima and ‘Ibar relate and why the narrative never illustrates the theory.'
  - id: irwin-ibn-khaldun#u08-c5
    heading: 'Laws implicit in a colourless narrative'
    span: 148524:149068
    why: 'States that the ‘Ibar treats broad causes and ‘asabiyya implicitly, leaving the reader to find the laws of history.'
  - id: irwin-ibn-khaldun#u08-c6
    heading: 'Froissart and the delusive appearance of modernity'
    span: 151006:151676
    why: 'Irwin''s sharpest contrast, warning that Ibn Khaldun''s analytic habit only seems modern while his values remained religious and anti-heroic.'
- nn: 9
  unit_id: ch04-philosophy-cyclical-history
  note_id: irwin-ibn-khaldun-ch04-philosophy-cyclical-history
  span: 151959:176844
  chunks:
  - id: irwin-ibn-khaldun#u09-c1
    heading: 'Ibn Khaldun denies being a philosopher'
    span: 157478:158003
    why: 'States Irwin''s thesis that Ibn Khaldun repudiated philosophy, with Ibn Khaldun''s own disavowals of Aristotle and the philosophers.'
  - id: irwin-ibn-khaldun#u09-c2
    heading: 'Averroes''s city versus Ibn Khaldun''s desert and mountains'
    span: 160778:161460
    why: 'Contrasts city-bound Greek-Averroist political philosophy with a theory grounded in ‘asabiyya and nomadic life.'
  - id: irwin-ibn-khaldun#u09-c3
    heading: 'A shared mood of pessimism and the slide into mulk'
    span: 162818:164460
    why: 'Irwin''s claim that the inheritance was pessimism, with Ibn Khaldun''s account of luxury and indolence turning caliphate into kingship.'
  - id: irwin-ibn-khaldun#u09-c4
    heading: 'Dawla and the Arabic vocabulary of turns'
    span: 164950:165851
    why: 'Shows the cyclical, limited-duration view of dynasties embedded in the word for dynasty, with Irwin''s and Lewis''s hedges.'
  - id: irwin-ibn-khaldun#u09-c5
    heading: 'Crone on Confucian versus Khaldunian cycles'
    span: 167260:168226
    why: 'Isolates the inversion of value between two tribal-conquest cycle theories, with tribal conquest as the peak rather than the bottom.'
  - id: irwin-ibn-khaldun#u09-c6
    heading: 'Vico as a Western parallel'
    span: 168903:170905
    why: 'Irwin''s most detailed comparison of Ibn Khaldun with a cyclical Western theorist, including luxury, barbarian renewal and religious motive.'
- nn: 10
  unit_id: ch04-aristotle-theology-maliki-law
  note_id: irwin-ibn-khaldun-ch04-aristotle-theology-maliki-law
  span: 176844:194394
  chunks:
  - id: irwin-ibn-khaldun#u10-c1
    heading: 'Neoplatonist philosophy, logic and Aristotle at second hand'
    span: 176874:177805
    why: 'States Ibn Khaldun''s stance toward speculative philosophy versus logic and ties it to his denunciations of alchemy and divination.'
  - id: irwin-ibn-khaldun#u10-c2
    heading: 'Philosophy as a science of the ancients'
    span: 179318:180074
    why: 'Shows philosophy classed with astrology and alchemy as a suspect science and subordinated to religious law, in Ibn Khaldun''s own words.'
  - id: irwin-ibn-khaldun#u10-c3
    heading: 'Ash‘arite occasionalism and the limits of causal inquiry'
    span: 183135:184825
    why: 'Lays out occasionalism and Ibn Khaldun''s qualified, not fully consistent, agreement, which bears on what kind of causal science of history he could have held.'
  - id: irwin-ibn-khaldun#u10-c4
    heading: 'Maliki jurisprudence as the model for the principles of history'
    span: 189839:191340
    why: 'Irwin''s central methodological claim that the ‘usul al-ta’rikh was modeled on ‘usul al-fiqh.'
  - id: irwin-ibn-khaldun#u10-c5
    heading: 'Malikism, desert simplicity and a strict Islam'
    span: 191504:192604
    why: 'Connects his legal allegiance to his idealization of desert life and records the severity of his religious and moral views.'
  - id: irwin-ibn-khaldun#u10-c6
    heading: 'Gibb: pessimism that is moral and religious, not sociological'
    span: 192606:193672
    why: 'Irwin''s endorsement of Gibb reframes the Muqaddima''s cyclical rise and fall as a consequence of violating the Sharia, the book''s core anti-anachronism point in this unit.'
- nn: 11
  unit_id: ch05-arrival-in-egypt
  note_id: irwin-ibn-khaldun-ch05-arrival-in-egypt
  span: 194394:215761
  chunks:
  - id: irwin-ibn-khaldun#u11-c1
    heading: 'Mamluks as a providential gift and imported ‘asabiyya'
    span: 201806:202827
    why: 'Ibn Khaldun''s own ‘Ibar passage applying nomadic virtue and ‘asabiyya to the mamluk institution as divine providence.'
  - id: irwin-ibn-khaldun#u11-c2
    heading: 'Why Mamluk emirs built waqfs'
    span: 199893:200654
    why: 'Ibn Khaldun''s explanation of the endowment economy that made Cairo a scholarly magnet, rooted in fear of royal confiscation.'
  - id: irwin-ibn-khaldun#u11-c3
    heading: 'The Muqaddima''s tribe-free Egypt versus the 1389 civil war'
    span: 208363:209224
    why: 'Irwin''s clearest case of Ibn Khaldun''s theory contradicted by the Mamluk facts he lived through and never corrected.'
  - id: irwin-ibn-khaldun#u11-c4
    heading: 'Signing the fatwa against Barquq'
    span: 209629:210216
    why: 'Shows Ibn Khaldun''s political opportunism and the selectivity of his memoir.'
  - id: irwin-ibn-khaldun#u11-c5
    heading: 'Winners over losers: elite focus and ignored plagues'
    span: 211267:212560
    why: 'Irwin''s judgment on the limits of Ibn Khaldun''s Egyptian history, with the hedged suggestion that flattery motivated it.'
  - id: irwin-ibn-khaldun#u11-c6
    heading: 'How the Muqaddima and ‘Ibar grew in Egypt'
    span: 213772:214676
    why: 'Documents what was added in Egypt (universal scope, hadith/fiqh material, occult matter) and that the work stayed unfinished.'
- nn: 12
  unit_id: ch05-office-holding-timur
  note_id: irwin-ibn-khaldun-ch05-office-holding-timur
  span: 215761:231325
  chunks:
  - id: irwin-ibn-khaldun#u12-c1
    heading: 'Shifting powers of viziers and other offices'
    span: 215802:217006
    why: 'States how Ibn Khaldun found offices varying by regime and over time, with the Egyptian vizier''s decline as the worked example.'
  - id: irwin-ibn-khaldun#u12-c2
    heading: 'The caliphate emptied of group feeling'
    span: 219736:220782
    why: 'Gives Ibn Khaldun''s view that later caliphs were really kings and that the title could no longer draw on ‘asabiyya.'
  - id: irwin-ibn-khaldun#u12-c3
    heading: 'Timur as nomad conqueror and the laboratory-rat comparison'
    span: 225297:226014
    why: 'Irwin links Ibn Khaldun''s nomad and dynastic-cycle ideas to the actual encounter with Timur.'
  - id: irwin-ibn-khaldun#u12-c4
    heading: 'Prophecy, astrology, and flattery'
    span: 226594:228208
    why: 'Shows the occult and prophetic frame around the meeting and Irwin''s hedged reading of Ibn Khaldun''s real belief.'
  - id: irwin-ibn-khaldun#u12-c5
    heading: 'Ibn ‘Arabshah''s speeches as unreliable'
    span: 229677:230339
    why: 'Irwin''s source criticism separates the hostile chronicler''s account from Ibn Khaldun''s likely conduct.'
  - id: irwin-ibn-khaldun#u12-c6
    heading: 'Ibn Khaldun''s own verdict on Timur'
    span: 228210:228727
    why: 'Preserves Ibn Khaldun''s first-hand judgment of Timur, rejecting rumors of heresy and sorcery.'
- nn: 13
  unit_id: ch05-autobiography-outsider
  note_id: irwin-ibn-khaldun-ch05-autobiography-outsider
  span: 231325:246925
  chunks:
  - id: irwin-ibn-khaldun#u13-c1
    heading: 'A remarkably unrevealing autobiography'
    span: 231868:232406
    why: 'States Irwin''s core claim that the Ta‘rif gives almost nothing of the man, which cuts against modernizing biographical readings.'
  - id: irwin-ibn-khaldun#u13-c2
    heading: 'Biography as genealogy of authority'
    span: 233288:233779
    why: 'Gives the genre and oral-transmission context that explains why the Ta‘rif lists teachers rather than inner life.'
  - id: irwin-ibn-khaldun#u13-c3
    heading: 'Why he wrote the Ta‘rif: hedged motives'
    span: 234471:235671
    why: 'Irwin''s hedged reading of purpose (illustrating how history worked, understanding his reverses, emulating Ibn al-Khatib) and the political role of poetry.'
  - id: irwin-ibn-khaldun#u13-c4
    heading: 'Al-Maqrizi''s partial inheritance'
    span: 239030:240087
    why: 'Shows the best disciple taking up Ibn Khaldun''s interest in economic forces while missing his methodology and ‘asabiyya, an early reception case.'
  - id: irwin-ibn-khaldun#u13-c5
    heading: 'Ibn Hajar''s mixed verdict'
    span: 241576:242879
    why: 'Records the hostile Cairene view (eloquent liar, ill-tempered judge, non-conformist dress) and Irwin''s caveats about its sources.'
  - id: irwin-ibn-khaldun#u13-c6
    heading: 'Rancorous Cairo and the purposes of history'
    span: 244338:245487
    why: 'Places the slanders in a culture of scholarly rivalry and contrasts al-Sakhawi''s narrow view of history with Ibn Khaldun''s.'
- nn: 14
  unit_id: ch06-sufi-mystic
  note_id: irwin-ibn-khaldun-ch06-sufi-mystic
  span: 246925:268483
  chunks:
  - id: irwin-ibn-khaldun#u14-c1
    heading: 'Tariqas as a social force, and Ibn Khaldun''s silence'
    span: 249719:250417
    why: 'Establishes how pervasive Sufism was in fourteenth-century North Africa and flags Irwin''s point that Ibn Khaldun omits its social role.'
  - id: irwin-ibn-khaldun#u14-c2
    heading: 'The Shifa'' al-sa''il and the need for a murshid'
    span: 252827:254156
    why: 'Irwin''s key piece of circumstantial evidence that Ibn Khaldun was a Sufi, with his caution about unveiling without a guide.'
  - id: irwin-ibn-khaldun#u14-c3
    heading: 'The faqih of the hearts'
    span: 254158:255410
    why: 'Shows Ibn Khaldun approaching mysticism as a jurist wanting policing of monism, tajalli and letter mysticism.'
  - id: irwin-ibn-khaldun#u14-c4
    heading: 'Miracles, karamat and holy fools'
    span: 258272:259584
    why: 'Documents Ibn Khaldun''s sincere belief in the supernatural and his qualified endorsement of ascetic Sufism as moral renewal.'
  - id: irwin-ibn-khaldun#u14-c5
    heading: 'The Egyptian fatwa against Ibn al-''Arabi and Ibn Sab''in'
    span: 262320:263752
    why: 'Records the hardening of Ibn Khaldun''s stance into a call to burn texts, with Irwin''s hedged explanation.'
  - id: irwin-ibn-khaldun#u14-c6
    heading: 'Irwin''s rebuttal of a Sufi philosophy of history'
    span: 266505:268028
    why: 'The unit''s central argument: Irwin''s point-by-point refusal of Fromherz''s reading of cycles, zahir/batin and hidden meaning as Sufi.'
- nn: 15
  unit_id: ch07-supernatural-occult
  note_id: irwin-ibn-khaldun-ch07-supernatural-occult
  span: 268483:289533
  chunks:
  - id: irwin-ibn-khaldun#u15-c1
    heading: 'A different and darker world'
    span: 270416:271162
    why: 'Irwin''s programmatic contrast between the modernizing reception of Ibn Khaldun and the enchanted, spirit-haunted world he actually lived in.'
  - id: irwin-ibn-khaldun#u15-c2
    heading: 'Sorcery is real though forbidden; sorcery versus Sufi miracles'
    span: 272718:273992
    why: 'Collects Ibn Khaldun''s own claims of experience and belief in sorcery, the evil eye and lion seals, and his moral test separating karamat from magic.'
  - id: irwin-ibn-khaldun#u15-c3
    heading: 'How sorcery works and why it cannot touch history'
    span: 276378:277763
    why: 'States the typology of occult means, the classification of sorcery as infidelity, the claim that it cannot interfere with historical processes, and the sciences-of-the-ancients framing.'
  - id: irwin-ibn-khaldun#u15-c4
    heading: 'Alchemy as puzzle, fraud and social hazard'
    span: 280066:281278
    why: 'Shows Ibn Khaldun''s reasoning against alchemy (obscurity, and destabilizing economies via istislah) and Irwin''s account of pseudonymous occult authorship.'
  - id: irwin-ibn-khaldun#u15-c5
    heading: 'Letter magic and astrology: credited yet unfathomable'
    span: 283125:283700
    why: 'Documents the occult science he accepted outright and his admitted difficulty with it, illustrating selective credulity.'
  - id: irwin-ibn-khaldun#u15-c6
    heading: 'Why Ibn Khaldun attended to sorcery: Barquq''s court'
    span: 288282:289531
    why: 'Irwin''s hedged explanation of the occult digression in terms of social danger and Mamluk court politics.'
- nn: 16
  unit_id: ch07-future-last-days
  note_id: irwin-ibn-khaldun-ch07-future-last-days
  span: 289533:319763
  chunks:
  - id: irwin-ibn-khaldun#u16-c1
    heading: 'The future resembles the past; no progress, and the End near'
    span: 293302:294113
    why: 'States Ibn Khaldun''s non-progressive view of the future and his belief in the approaching End of Time, with Hume as foil.'
  - id: irwin-ibn-khaldun#u16-c2
    heading: 'The Mahdi would need ‘asabiyya'
    span: 304861:305287
    why: 'Shows Ibn Khaldun subordinating messianic expectation to his theory of group feeling and state-building.'
  - id: irwin-ibn-khaldun#u16-c3
    heading: 'The Little Jafr as Almohad propaganda'
    span: 302850:303144
    why: 'Ibn Khaldun''s critical test of a prophetic text against historical fit, and Mahdist claims as dynasty-founding.'
  - id: irwin-ibn-khaldun#u16-c4
    heading: 'Malahim: skepticism about dynastic prophecy'
    span: 306722:307435
    why: 'Defines the malahim genre and Ibn Khaldun''s mixed skepticism and fascination toward forecasting dynasties.'
  - id: irwin-ibn-khaldun#u16-c5
    heading: 'The za’iraja and Ibn Khaldun''s inconsistent skepticism'
    span: 314609:315563
    why: 'Irwin''s clearest demonstration that Ibn Khaldun''s rationalism about divination was hedged and shot through with Sufi and occult assumptions.'
  - id: irwin-ibn-khaldun#u16-c6
    heading: 'Asimov''s psychohistory as a distant Khaldunian echo'
    span: 316986:319085
    why: 'Irwin''s hedged claim about the Muqaddima''s ghostly influence on Foundation via Toynbee, with Gibbon as the stronger influence.'
- nn: 17
  unit_id: ch08-economics
  note_id: irwin-ibn-khaldun-ch08-economics
  span: 319763:339190
  chunks:
  - id: irwin-ibn-khaldun#u17-c1
    heading: 'Reagan, the Laffer curve, and Ibn Khaldun as no economist'
    span: 319824:320650
    why: 'States the chapter''s anti-anachronism thesis and the two modern retrofittings (Marx lineage, Reagan''s supply-side reading) it will dismantle.'
  - id: irwin-ibn-khaldun#u17-c2
    heading: 'Economic need as the origin of society and the division of labor'
    span: 321166:321835
    why: 'Compresses Ibn Khaldun''s account of how economic need, cooperation and surplus underpin ‘umran and all history.'
  - id: irwin-ibn-khaldun#u17-c3
    heading: 'Density, luxury, corruption and divine destruction of cities'
    span: 329171:330559
    why: 'Shows prosperity turning by the logic of sedentary luxury into moral decay and God''s judgment, the moral core of his urban economics.'
  - id: irwin-ibn-khaldun#u17-c4
    heading: 'The dynastic tax cycle versus the Laffer reading'
    span: 333266:335026
    why: 'Irwin''s corrective: fiscal decline follows from the dynasty''s moral and political decay, tying taxation to the dynastic cycle and the loss of desert virtues.'
  - id: irwin-ibn-khaldun#u17-c5
    heading: 'The qadi''s wine tax and economics as occult science'
    span: 335256:336004
    why: 'A vivid illustration of Irwin''s thesis that apparently modern economic reasoning rests on a supernatural, religious frame.'
  - id: irwin-ibn-khaldun#u17-c6
    heading: 'Engels''s Orientalist reading and Irwin''s reply'
    span: 336188:337864
    why: 'Records how the nomad/townsman cycle was recast as Oriental stagnation against Western progress, with Irwin''s rebuttal on Ibn Khaldun''s own terms.'
- nn: 18
  unit_id: ch09-teaching-writing
  note_id: irwin-ibn-khaldun-ch09-teaching-writing
  span: 339190:358196
  chunks:
  - id: irwin-ibn-khaldun#u18-c1
    heading: 'Ibn Khaldun''s own education and the culture of transmission'
    span: 340232:341389
    why: 'Establishes the ijaza, dictation and sanad culture in which Ibn Khaldun was formed, against any image of him as a free-floating original.'
  - id: irwin-ibn-khaldun#u18-c2
    heading: 'Books as a veil: too many commentaries'
    span: 342920:343676
    why: 'States his preference for oral teaching and his complaint about textual proliferation, with Irwin''s note that he wrote handbooks himself.'
  - id: irwin-ibn-khaldun#u18-c3
    heading: 'The virtue of rote learning'
    span: 345966:346898
    why: 'Gives the pedagogical premise that one is what one has memorized, which shapes how the Muqaddima''s learned culture should be understood.'
  - id: irwin-ibn-khaldun#u18-c4
    heading: 'Poetry subject to rise and decline like regimes'
    span: 348830:349733
    why: 'The one place in the unit where a cultural form is given a cyclical rise-and-fall, alongside Irwin''s parenthetical skepticism about Ibn Khaldun''s romanticized Bedouin.'
  - id: irwin-ibn-khaldun#u18-c5
    heading: 'Ibn Khaldun''s use of language compared with Gibbon'
    span: 354184:355218
    why: 'Irwin''s core assessment of style, and the contrast between psychological narrative history and Ibn Khaldun''s social-forces abstraction.'
  - id: irwin-ibn-khaldun#u18-c6
    heading: 'Qur''anic invocations as punctuation'
    span: 356915:357414
    why: 'Evidence for Irwin''s thesis that the Muqaddima''s religious frame is structural, not decorative, and is easily missed by modern readers.'
- nn: 19
  unit_id: ch10-afterlife-french-germans
  note_id: irwin-ibn-khaldun-ch10-afterlife-french-germans
  span: 358196:380641
  chunks:
  - id: irwin-ibn-khaldun#u19-c1
    heading: 'Ottoman readers: regime life cycles and imperial old age'
    span: 359802:360764
    why: 'Documents the first serious reception of the Muqaddima, applied to Ottoman decline, and the Turkish refusal of Khaldunian fatalism.'
  - id: irwin-ibn-khaldun#u19-c2
    heading: 'The Arab Montesquieu'
    span: 362923:364477
    why: 'Origin and assessment of the most durable modernizing label attached to Ibn Khaldun, with Irwin''s hedged endorsement.'
  - id: irwin-ibn-khaldun#u19-c3
    heading: 'De Slane, the Ministry of War, and ''asabiyya as esprit de corps'
    span: 370929:371283
    why: 'Shows how the central concept was bent under translation into a vitalist life force by later French commentators.'
  - id: irwin-ibn-khaldun#u19-c4
    heading: 'Gautier: Arab as nomad, Ibn Khaldun as a Frenchman'
    span: 373596:374300
    why: 'Irwin''s clearest case of colonial scholarship stripping Ibn Khaldun of his medieval Arab identity to serve empire.'
  - id: irwin-ibn-khaldun#u19-c5
    heading: 'Monteil: precursor of everything, and a Gemini'
    span: 376504:377305
    why: 'Shows the precursor habit persisting even in an anti-colonial retranslator, with Irwin''s dry scepticism.'
  - id: irwin-ibn-khaldun#u19-c6
    heading: 'Von Kremer, Hegel, and the Comte comparison'
    span: 379008:380639
    why: 'Captures the German Hegelian reading, its dislike of cyclical pessimism, and Irwin''s rejection of Ibn Khaldun as a secular positivist.'
- nn: 20
  unit_id: ch10-toynbee-rosenthal
  note_id: irwin-ibn-khaldun-ch10-toynbee-rosenthal
  span: 380641:402066
  chunks:
  - id: irwin-ibn-khaldun#u20-c1
    heading: 'Irwin''s automata caricature of Toynbee''s model'
    span: 385229:386005
    why: 'Irwin''s own (admittedly unsympathetic) compact statement of Toynbee''s cyclical challenge-and-response schema that is then applied to Ibn Khaldun.'
  - id: irwin-ibn-khaldun#u20-c2
    heading: 'Ibn Khaldun fitted to Toynbee''s laws'
    span: 386802:387862
    why: 'Shows the mechanism by which Ibn Khaldun''s life and work were retrofitted to a modern cyclical scheme, and Toynbee''s mediated sources and criticisms.'
  - id: irwin-ibn-khaldun#u20-c3
    heading: 'Toynbee on asabiyya, nomads and God'
    span: 387864:388896
    why: 'Toynbee''s generalization of `asabiyya` beyond nomads and his reversal of the nomad-causes-decline picture, set against Ibn Khaldun''s religious dimension.'
  - id: irwin-ibn-khaldun#u20-c4
    heading: 'Gibb''s 1933 Shari`a reading'
    span: 391726:393203
    why: 'Presents the counter-reading of Ibn Khaldun as a jurist whose cycle stems from mankind''s refusal of the Shari`a, with Irwin''s hedged endorsement.'
  - id: irwin-ibn-khaldun#u20-c5
    heading: 'Rosenthal''s translation as substitute for a missing edition'
    span: 396878:397251
    why: 'Irwin''s case for the value and textual basis of the standard English Muqaddima.'
  - id: irwin-ibn-khaldun#u20-c6
    heading: 'Hodgson''s philosopher Ibn Khaldun'
    span: 400792:401564
    why: 'Irwin''s diagnosis of why Hodgson wanted a secular philosopher Ibn Khaldun and his rejection of the unevidenced philosopher-king story.'
- nn: 21
  unit_id: ch10-colonialist-mahdi-gellner
  note_id: irwin-ibn-khaldun-ch10-colonialist-mahdi-gellner
  span: 402066:421693
  chunks:
  - id: irwin-ibn-khaldun#u21-c1
    heading: 'Lacoste''s Marxist Ibn Khaldun'
    span: 403655:405070
    why: 'States Lacoste''s materialist, anti-colonial reading (Asiatic mode of production, pre-colonial underdevelopment) that Irwin then judges anachronistic.'
  - id: irwin-ibn-khaldun#u21-c2
    heading: 'Mahdi''s Straussian philosopher'
    span: 407651:408365
    why: 'Sets out Mahdi''s esoteric-philosopher thesis and its Strauss/al-Farabi lineage, the reading Irwin and Lacoste reject.'
  - id: irwin-ibn-khaldun#u21-c3
    heading: 'Gellner as tourist in a foreign country'
    span: 412135:412836
    why: 'Irwin''s direct rebuttal of the secularized, value-free Ibn Khaldun, insisting piety and religious warning were the primary impetus.'
  - id: irwin-ibn-khaldun#u21-c4
    heading: 'Sheep, sheepdogs, wolves and the circulation of elites'
    span: 412838:413833
    why: 'Presents Gellner''s three-ring cyclical model and Irwin''s evidence-based counterexample.'
  - id: irwin-ibn-khaldun#u21-c5
    heading: 'Crone: cycles from the barbarians'' point of view'
    span: 417242:418031
    why: 'Contrasts Confucian and Khaldunian cyclical theories on where the peak of the cycle lies and whose viewpoint it takes.'
  - id: irwin-ibn-khaldun#u21-c6
    heading: 'Arab rediscovery as a Western re-export'
    span: 418778:419230
    why: 'Frames the modern Arab reception of Ibn Khaldun as mediated by European publications, leading into the Nahda material.'
- nn: 22
  unit_id: ch10-arab-american-novels-orientalism
  note_id: irwin-ibn-khaldun-ch10-arab-american-novels-orientalism
  span: 421693:451025
  chunks:
  - id: irwin-ibn-khaldun#u22-c1
    heading: 'Taha Husayn''s Sorbonne thesis denies Ibn Khaldun modernity'
    span: 422528:423841
    why: 'Shows the earliest major Arab intellectual rejecting the proto-sociologist label, setting the tone for Irwin''s own anti-anachronism.'
  - id: irwin-ibn-khaldun#u22-c2
    heading: 'Why Ibn Khaldun is not Machiavelli'
    span: 426738:428969
    why: 'Irwin''s systematic dismantling of a common comparison, showing what ‘asabiyya and the religious-moral frame do that virtu and fortuna do not.'
  - id: irwin-ibn-khaldun#u22-c3
    heading: 'Deduction and induction in the Muqaddima'
    span: 440045:441004
    why: 'States how the dynastic cycle itself must have been induced from history, cutting against a purely Aristotelian deductive reading.'
  - id: irwin-ibn-khaldun#u22-c4
    heading: 'Limits of Ibn Khaldun''s rationality; Maliki law as model'
    span: 441006:441740
    why: 'Irwin''s own summary verdict on the philosophy debate, tying it to the book''s central thesis.'
  - id: irwin-ibn-khaldun#u22-c5
    heading: 'Frank Herbert''s Dune as Khaldunian novel'
    span: 444401:446012
    why: 'Documents the explicit Khaldunian structure (desert people, rise, luxury and corruption) and the Kitab al-Ibar in the best-known science-fiction cycle.'
  - id: irwin-ibn-khaldun#u22-c6
    heading: 'Many agendas, many Ibn Khalduns'
    span: 448940:449605
    why: 'Irwin''s central reception-history claim: scholars remake Ibn Khaldun in their own image, including himself possibly.'
- nn: 23
  unit_id: ch11-ending-up
  note_id: irwin-ibn-khaldun-ch11-ending-up
  span: 451025:461442
  chunks:
  - id: irwin-ibn-khaldun#u23-c1
    heading: 'Fisher''s confession of plotless history'
    span: 451179:451710
    why: 'The Fisher foil against which Irwin frames Ibn Khaldun''s attempt to derive laws from contingent politics.'
  - id: irwin-ibn-khaldun#u23-c2
    heading: 'Modernizing Ibn Khaldun denatures him'
    span: 455528:456495
    why: 'Irwin''s central methodological claim: sociologist, Marxist and Straussian readings exaggerate rationality and discard Maliki law and the occult.'
  - id: irwin-ibn-khaldun#u23-c3
    heading: 'Audience and inconsistencies'
    span: 457065:457991
    why: 'Irwin denies the Muqaddima is a systematic treatise and lists its internal contradictions, including on the cycle''s scope and the Mamluks.'
  - id: irwin-ibn-khaldun#u23-c4
    heading: '‘Asabiyya reborn: Arab Human Development Report and Zuckerberg'
    span: 458985:460156
    why: 'Shows the reception history of ‘asabiyya and Irwin''s verdict that the models are powerful but cannot apply to modern societies.'
  - id: irwin-ibn-khaldun#u23-c5
    heading: 'Last Judgment, austerity, ordinary belief'
    span: 460158:461155
    why: 'Irwin''s hedged closing interpretation: the religious purpose of the Muqaddima and Ibn Khaldun''s conventional piety alongside his genius.'
  - id: irwin-ibn-khaldun#u23-c6
    heading: 'Fisher''s hidden Whig plot'
    span: 452753:454351
    why: 'Irwin shows the supposedly patternless history smuggles in progress and Eurocentrism, sharpening the contrast with Ibn Khaldun''s explicit laws.'
