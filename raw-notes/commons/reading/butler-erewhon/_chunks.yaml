    char_end: 163701
    start_quote: '“We shall have,” said the judge, “these crude and subversionary books'
    end_quote: 'should be allowed to be unlucky to more than a very moderate extent.”'
    why: 'A satirised judge states the moral economy of Erewhon: luck is venerated and its distribution is settled by the market and brute force.'
  - id: butler-erewhon#u12-c2
    label: c2
    heading: 'The sentence opens: the great crime of consumption'
    char_start: 168174
    char_end: 168848
    start_quote: '“Prisoner at the bar, you have been accused of the great crime of'
    end_quote: 'which I can only regard as radically vicious; but yours is no case for compassion'
    why: 'Presents the formal, impartial register in which illness is tried as crime and the constitution is judged vicious.'
  - id: butler-erewhon#u12-c3
    label: c3
    heading: 'Refusing questions of origin'
    char_start: 169391
    char_end: 170072
    start_quote: '“It is all very well for you to say that you came of unhealthy parents,'
    end_quote: 'There is no question of how you came to be wicked, but only this—namely, are you wicked or not?'
    why: 'The judge rules out causal and parentage explanations, both parodying legal indifference to causes and raising a real puzzle about responsibility.'
  - id: butler-erewhon#u12-c4
    label: c4
    heading: 'The hidden physicians and the repression of disease'
    char_start: 171580
    char_end: 172774
