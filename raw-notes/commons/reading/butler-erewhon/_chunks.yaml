  - id: butler-erewhon#u15-c3
    label: c3
    heading: 'The circular storm of gossip'
    char_start: 208686
    char_end: 209438
    start_quote: 'And so they went on for half an hour and more'
    end_quote: 'going round and round and round and round till one could never say where it began nor where it ended'
