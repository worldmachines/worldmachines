    end_quote: 'made manifest to the eye of the law.'
    why: 'Gives the institutional rationale: the regime suppresses illness to prevent a medical class from capturing social and political power.'
  - id: butler-erewhon#u12-c5
    label: c5
    heading: '“It is your crime to be unfortunate”'
    char_start: 173388
    char_end: 173666
    start_quote: 'whether your being in a consumption is your fault or no, it is a fault in you'
    end_quote: 'it is your crime to be unfortunate.'
    why: 'The chapter''s inversion at its sharpest, equating misfortune with guilt.'
  - id: butler-erewhon#u12-c6
    label: c6
    heading: 'Hard labour for life and castor oil'
    char_start: 174091
    char_end: 174857
    start_quote: '“I do not hesitate therefore to sentence you to imprisonment, with hard'
    end_quote: 'two tablespoonfuls of castor oil daily, until the'
    why: 'The closing sentence undercuts its own majesty with bathos and shows the three official remedies as the only mercy permitted.'
- nn: 13
  unit_id: ch12-malcontents
  note_id: butler-erewhon-ch12-malcontents
  span: 175579:190750
  chunks:
  - id: butler-erewhon#u13-c1
