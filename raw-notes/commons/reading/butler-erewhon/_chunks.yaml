    end_quote: 'death, like life, is an affair of being more frightened than hurt.'
    why: 'The chapter''s main argument that death is a bugbear because its moment can never be certainly known.'
  - id: butler-erewhon#u14-c3
    label: c3
    heading: 'An art is better dead than dying'
    char_start: 196374
    char_end: 196865
    start_quote: 'I know not why, but all the noblest arts hold in perfection but for a'
    end_quote: 'working out its own salvation from effort to effort in all fear and trembling.'
    why: 'The narrator''s general claim about the rise and decline of arts, framed by an organism metaphor.'
  - id: butler-erewhon#u14-c4
    label: c4
