    char_start: 198880
    char_end: 200636
    start_quote: 'On this the same evils recurred.'
    end_quote: 'on condition that he did not make it.'
    why: 'Gives the institutional fix for statue-clutter and its perverse result, the core of the statue satire.'
  - id: butler-erewhon#u14-c5
    label: c5
    heading: 'Birth as offence, condoned by blessed inconsistency'
    char_start: 202817
    char_end: 203615
    start_quote: 'When the offence is over and done with, it is condoned by the common want of'
    end_quote: 'except in such flagrant cases as force themselves on the public notice.'
    why: 'Explains how Erewhonian custom lives with contradictory rules through inconsistency, and links to the birth-formula material.'
  - id: butler-erewhon#u14-c6
    label: c6
    heading: 'The child over seventy-five years old'
    char_start: 204368
    char_end: 204629
    start_quote: 'Should the child unhappily die, a coroner’s inquest is inevitable'
    end_quote: 'died from the decay of nature.'
    why: 'A compact example of the legal fiction used to protect respectability.'
- nn: 15
  unit_id: ch14-mahaina
  note_id: butler-erewhon-ch14-mahaina
  span: 204633:212664
  chunks:
  - id: butler-erewhon#u15-c1
    label: c1
