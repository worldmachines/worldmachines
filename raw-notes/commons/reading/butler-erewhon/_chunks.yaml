source: butler-erewhon
units:
- nn: 1
  unit_id: prefaces
  note_id: butler-erewhon-prefaces
  span: 2245:14605
  chunks:
  - id: butler-erewhon#u01-c1
    label: c1
    heading: 'Not a laugh at Darwin; the specious misuse of analogy'
    char_start: 4080
    char_end: 5022
    start_quote: 'I regret that reviewers have in some cases been inclined to treat the chapters on Machines'
    end_quote: 'I should fancy that the hint given will suffice.'
    why: 'Butler''s own statement of how the Machines chapters should and should not be read, including his hint that analogy-misuse is the real target.'
  - id: butler-erewhon#u01-c2
    label: c2
    heading: 'Denying that men are not responsible'
    char_start: 5024
    char_end: 5370
    start_quote: 'I have been held by some whose opinions I respect to have denied men’s'
    end_quote: 'which will, I think, serve to render further mistake impossible.'
    why: 'Butler rules out a reading of the book''s inversions of illness and crime as denying moral responsibility.'
  - id: butler-erewhon#u01-c3
    label: c3
    heading: 'The Erewhonians'' indifference to inconsistency'
    char_start: 6562
    char_end: 7318
    start_quote: 'For the inconsistencies in the book, and I am aware that there are not'
    end_quote: 'and they said it was quite true, but that it did not matter.'
    why: 'Butler''s account of the Erewhonian mind, a compact portrait of a society untroubled by anomaly unless it costs money or pain.'
  - id: butler-erewhon#u01-c4
    label: c4
    heading: 'Darwin among the Machines: first part written'
    char_start: 7806
    char_end: 8843
    start_quote: 'The first part of “Erewhon” written was an article headed “Darwin among'
    end_quote: 'into the mouth of an Erewhonian philosopher in Chapter XXVII. of this book.'
    why: 'Dates and places the origin of the machine idea (Upper Rangitata, 1863) and links it forward to Life and Habit.'
  - id: butler-erewhon#u01-c5
    label: c5
    heading: 'Four detached papers strung into a book'
    char_start: 9272
    char_end: 10355
    start_quote: 'The next part of “Erewhon” that I wrote was the “World of the Unborn,”'
    end_quote: 'should add somewhat to the articles I had already written, and string them together into a book.'
    why: 'Records which parts of the book were written when and how it was assembled from separate articles.'
  - id: butler-erewhon#u01-c6
    label: c6
    heading: 'No central idea underlying Erewhon'
    char_start: 13888
    char_end: 14333
    start_quote: 'There is no central idea underlying “Erewhon,” whereas the attempt to realise'
    end_quote: '“Erewhon Revisited” may fairly claim to be one.'
    why: 'Butler''s retrospective verdict that Erewhon has no central idea and is not an organic whole, a caution against single-thesis readings.'
- nn: 2
  unit_id: ch01-waste-lands
  note_id: butler-erewhon-ch01-waste-lands
  span: 14605:26353
  chunks:
  - id: butler-erewhon#u02-c1
    label: c1
    heading: 'The narrator''s motives, secrecy and appeal for money'
    char_start: 14630
    char_end: 16448
    start_quote: 'If the reader will excuse me, I will say nothing of my antecedents,'
    end_quote: 'No one who is himself honest will doubt my being so.'
    why: 'Establishes the narrator as a self-interested, secretive, self-certifying witness, which is the lens for everything reported later.'
  - id: butler-erewhon#u02-c2
    label: c2
    heading: 'The colony and the inland tide of squatters'
    char_start: 17504
    char_end: 19039
    start_quote: 'With this bay of land, however, the case was different.'
    end_quote: 'and it was wonderful how successfully it turned out.'
    why: 'Describes the expansion of pastoral settlement to the foot of the ranges and the pattern of objections overturned by experiment.'
  - id: butler-erewhon#u02-c3
    label: c3
    heading: 'Shepherding by seeing enough sheep'
    char_start: 19541
    char_end: 20497
    start_quote: 'I was delighted with the country and the manner of life.'
    end_quote: 'It is surprising how soon the eye becomes accustomed to missing twenty sheep out of two or three hundred.'
    why: 'Shows the narrator''s job and the tolerant, sampling-based oversight of the flock.'
  - id: butler-erewhon#u02-c4
    label: c4
    heading: 'The lost lamb and the mistaken ewe'
    char_start: 23557
    char_end: 24169
    start_quote: 'Then there comes some lean and withered old ewe, with deep'
    end_quote: 'But this is mere dreaming, and I must proceed.'
    why: 'The chapter''s sentimental set piece, showing the narrator''s register and a miniature of mistaken kinship.'
  - id: butler-erewhon#u02-c5
    label: c5
    heading: 'Resolve to go and see for himself'
    char_start: 24171
    char_end: 25342
    start_quote: 'I could not help speculating upon what might lie farther up the river'
    end_quote: 'and go and see for myself.'
    why: 'States the capital-and-precedent reasoning that turns speculation into the decision to explore beyond the pastoral limit.'
  - id: butler-erewhon#u02-c6
    label: c6
    heading: 'The great range and the lure of gold'
    char_start: 25344
    char_end: 26349
    start_quote: 'But over and above these thoughts came that of the great range itself.'
    end_quote: 'These thoughts filled my head, and I could not banish them.'
    why: 'Poses the unexplored range as an unknown threshold and shows the narrator''s mix of ambition and wishful prospecting.'
- nn: 3
  unit_id: ch02-in-the-wool-shed
  note_id: butler-erewhon-ch02-in-the-wool-shed
  span: 26353:34788
  chunks:
  - id: butler-erewhon#u03-c1
    label: c1
    heading: 'Chowbok evades questions about the main range'
    char_start: 26384
    char_end: 28153
    start_quote: 'At last shearing came; and with the shearers there was an old native,'
    end_quote: 'letting me kick him pretty hard and never budging.'
    why: 'Introduces Chowbok, the narrator''s bribery, and the sharp change in Chowbok''s manner at the mention of the main range.'
  - id: butler-erewhon#u03-c2
    label: c2
    heading: 'The wool-shed as cathedral'
    char_start: 28759
    char_end: 29210
    start_quote: 'A wool-shed is a roomy place, built somewhat on the same plan as'
    end_quote: 'while this was only two.'
    why: 'Gives the narrator''s cathedral comparison and his admission that its antiquity is a semblance, an early ironic note on borrowed authority.'
  - id: butler-erewhon#u03-c3
    label: c3
    heading: 'Churning and Chowbok''s pantomime'
    char_start: 30220
    char_end: 31222
    start_quote: 'On a sudden, without a word of warning, he rolled two bales of wool'
    end_quote: 'his forehead was contracted with a most malevolent scowl.'
    why: 'The central scene: Chowbok''s wordless performance that substitutes for information about the range.'
  - id: butler-erewhon#u03-c4
    label: c4
    heading: 'A meaning he could not read'
    char_start: 32724
    char_end: 33183
    start_quote: 'Of his meaning I had no conception. How could I?'
    end_quote: 'be something well worth discovering.'
    why: 'Shows how the narrator converts an uninterpreted fear into the motive for the expedition.'
- nn: 4
  unit_id: ch03-up-the-river
  note_id: butler-erewhon-ch03-up-the-river
  span: 34788:45142
  chunks:
  - id: butler-erewhon#u04-c1
    label: c1
    heading: 'The camp at the mouth of the gorge'
    char_start: 36535
    char_end: 37086
    start_quote: 'The beauty of the scene cannot be conveyed in language.'
    end_quote: 'could there be a more delightful and exhilarating combination?'
    why: 'A conventional sublime landscape that establishes the narrator''s rapturous, picturesque voice before the satire turns.'
  - id: butler-erewhon#u04-c2
    label: c2
    heading: 'We next to never know when we are well off'
    char_start: 38613
    char_end: 39227
    start_quote: 'We next to never know when we are well off: but this cuts two ways'
    end_quote: 'Let us be grateful to the mirror for revealing to us our appearance only.'
    why: 'The narrator''s reflection on ignorance as a protection from knowing what we truly are, the chapter''s one near-philosophical passage.'
  - id: butler-erewhon#u04-c3
    label: c3
    heading: 'No money in the country above the gorge'
    char_start: 42622
    char_end: 43386
    start_quote: 'but it was plain at a glance that there was no available sheep'
    end_quote: 'of which I saw no more signs than lower down.'
    why: 'Shows the narrator judging land purely by its commercial value.'
  - id: butler-erewhon#u04-c4
    label: c4
    heading: 'Resolve to follow the river and prospect'
    char_start: 43388
    char_end: 43994
    start_quote: 'However, I resolved that I would follow the river up, and not return'
    end_quote: 'he had made up his mind what to do if he saw me getting too near it.'
    why: 'Gives the narrator''s pretext for the crossing and foreshadows Chowbok''s secret intention.'
  - id: butler-erewhon#u04-c5
    label: c5
    heading: 'The last stream and Chowbok''s desertion'
    char_start: 44518
    char_end: 45122
    start_quote: 'I had long ago discovered that he was a great liar'
    end_quote: 'he had turned back, and was going down the valley as hard as he could.'
    why: 'The turning point where the narrator sees a possible pass into the range and is abandoned by his guide.'
- nn: 5
  unit_id: ch04-the-saddle
  note_id: butler-erewhon-ch04-the-saddle
  span: 45142:60121
  chunks:
  - id: butler-erewhon#u05-c1
    label: c1
    heading: 'First sight of the pass and the plains'
    char_start: 48561
    char_end: 49125
    start_quote: 'A glance. I was not on the main range.'
    end_quote: 'a glimpse of an immeasurable extent of blue and distant plains.'
    why: 'The threshold moment: the narrator sees the easy pass and the distant plains that mark the way into the unknown country.'
  - id: butler-erewhon#u05-c2
    label: c2
    heading: 'Sheep country, fame and the decision to go on'
    char_start: 51554
    char_end: 52356
    start_quote: 'These were serious considerations, but the hope of finding an immense tract'
    end_quote: 'at the possible profits therefrom.'
    why: 'Shows the narrator’s mercenary, self-dramatising motive for entering the unknown, the basis of the book’s satire of its narrator.'
  - id: butler-erewhon#u05-c3
    label: c3
    heading: 'Cut off from all one’s kind'
    char_start: 55966
    char_end: 56304
    start_quote: 'It is a dreadful feeling that of being cut off from all one’s kind.'
    end_quote: 'One begins doubting one’s own identity.'
    why: 'The chapter’s reflective statement on isolation and the instability of identity without companions.'
  - id: butler-erewhon#u05-c4
    label: c4
    heading: 'The organ dream'
    char_start: 56992
    char_end: 57922
    start_quote: 'I dreamed that there was an organ placed in my master’s wool-shed:'
    end_quote: 'dazzled with the vividness and distinctness of the dream.'
    why: 'Introduces the organ and Handel as a vision of a golden mountain-city, the first appearance of the book’s music motif.'
  - id: butler-erewhon#u05-c5
    label: c5
    heading: 'The faint music on the wind'
    char_start: 58388
    char_end: 58872
    start_quote: 'I held my breath and waited, and then I heard—was it fancy?'
    end_quote: 'Yes; it was that.'
    why: 'The ambiguous, rationalised sound of music that foreshadows what lies beyond the range.'
- nn: 6
  unit_id: ch05-the-river-and-the-range
  note_id: butler-erewhon-ch05-the-river-and-the-range
  span: 60121:75921
  chunks:
  - id: butler-erewhon#u06-c1
    label: c1
    heading: 'Chowbok and the plan to convert him'
    char_start: 65190
    char_end: 66492
    start_quote: 'I thought of Chowbok, and felt how useful he had been to me'
    end_quote: 'had been more than once unpleasant to me during my recent experiences.'
    why: 'Reveals the narrator''s self-interested piety, which makes him a target of the satire rather than Butler''s mouthpiece.'
  - id: butler-erewhon#u06-c2
    label: c2
    heading: 'The baptism from a pannikin'
    char_start: 66494
    char_end: 67471
    start_quote: 'Indeed, on one occasion I had even gone so far as to baptize him'
    end_quote: 'not only in name, but in heart a Christian.'
    why: 'A comic set piece of mechanical ritual that shows the narrator''s religion as a matter of procedure and risk-management.'
  - id: butler-erewhon#u06-c3
    label: c3
    heading: 'Chowbok''s prayer-book'
    char_start: 67473
    char_end: 68230
    start_quote: 'It is true that I might not have succeeded, for Chowbok was very hard'
    end_quote: 'though in a less degree.'
    why: 'Shows what the supposed conversion actually amounts to, and the narrator''s blindness to it.'
  - id: butler-erewhon#u06-c4
    label: c4
    heading: 'Doubt about identity on the summit'
    char_start: 69909
    char_end: 70368
    start_quote: 'Each moment I felt increasing upon me that dreadful doubt as to my own'
    end_quote: 'my power of collecting myself was beginning to be impaired.'
    why: 'The narrator''s fear of losing continuity of self, a rare moment of serious psychology amid the satire.'
  - id: butler-erewhon#u06-c5
    label: c5
    heading: 'The circle of statues'
    char_start: 72739
    char_end: 73927
    start_quote: 'I then advanced timidly forward, and in another moment I saw that my'
    end_quote: 'their heads had been hollowed.'
    why: 'Describes the Stonehenge-like statues that mark the threshold of Erewhon, terrible and ludicrous at once.'
  - id: butler-erewhon#u06-c6
    label: c6
    heading: 'The statues sing in the wind'
    char_start: 74322
    char_end: 75460
    start_quote: 'Then came a gust of howling wind, accompanied with a moan from one of'
    end_quote: 'grip me in his hand and throttle me.'
    why: 'The hollow heads become organ-pipes and the narrator flees in panic, the unit''s climactic image.'
- nn: 7
  unit_id: ch06-into-erewhon
  note_id: butler-erewhon-ch06-into-erewhon
  span: 75921:91910
  chunks:
  - id: butler-erewhon#u07-c1
    label: c1
    heading: 'Descent and the view of the promised land'
    char_start: 76662
    char_end: 78236
    start_quote: 'I hurried onward—down, down, down. More streams came in;'
    end_quote: 'feeling warmed by the sun, and quieted, I fell off into a profound sleep.'
    why: 'Sets the arrival scene: the bridge as sign of civilisation, the Sinai comparison and the first sight of Erewhon''s towns and villages.'
  - id: butler-erewhon#u07-c2
    label: c2
    heading: 'The men of the valley and the narrator''s colouring'
    char_start: 79797
    char_end: 81189
    start_quote: 'Both the girls and the men were very dark in colour, but not more so'
    end_quote: 'the more they looked the less they seemed able to make me out.'
    why: 'First portrait of the Erewhonians as courteous, magnificent and baffled by the narrator, with his self-regard in view.'
  - id: butler-erewhon#u07-c3
    label: c3
    heading: 'Quasi-European household, hundreds of years behind'
    char_start: 86712
    char_end: 87876
    start_quote: 'The more I looked at everything in the house, the more I was struck with its'
    end_quote: 'but this is the case in many an Italian village.'
    why: 'Shows the uncanny mix of familiarity and difference, and the narrator''s note about primitive appliances.'
  - id: butler-erewhon#u07-c4
    label: c4
    heading: 'The lost ten tribes and the missionary dream'
    char_start: 87878
    char_end: 90291
    start_quote: 'All the time that I was eating my breakfast I kept speculating as to'
    end_quote: 'I would certainly convert them.'
    why: 'The narrator''s vain, pious and self-serving conversion fantasy, the chapter''s main satire on the narrator himself.'
  - id: butler-erewhon#u07-c5
    label: c5
    heading: 'Excitement cools: money and captivity'
    char_start: 91353
    char_end: 91906
    start_quote: 'But already my excitement had begun to cool and I reflected that these'
    end_quote: 'in spite of all their goodness.'
    why: 'Reveals the narrator''s mercenary motive and the sense of being a kept guest.'
- nn: 8
  unit_id: ch07-first-impressions
  note_id: butler-erewhon-ch07-first-impressions
  span: 91910:105355
  chunks:
  - id: butler-erewhon#u08-c1
    label: c1
    heading: 'Paley''s watch and the magistrate''s look'
    char_start: 100572
    char_end: 101234
    start_quote: 'I remember that when they first found it I had thought of Paley,'
    end_quote: 'or as at any rate one of the great first causes of all things.'
    why: 'The narrator''s design-argument prediction and his misreading of the magistrate''s reaction to the watch frame the book''s treatment of machines and reasoning by analogy.'
  - id: butler-erewhon#u08-c2
    label: c2
    heading: 'The museum of broken machinery'
    char_start: 101899
    char_end: 102884
    start_quote: 'It was filled with cases containing all manner of curiosities—such as'
    end_quote: 'As I said before, all were marred and broken.'
    why: 'The first evidence that machines once existed in Erewhon and are now kept only as broken curiosities.'
  - id: butler-erewhon#u08-c3
    label: c3
    heading: 'The medical examination'
    char_start: 98888
    char_end: 99466
    start_quote: 'Then they took me into an inner room, and the two fresh arrivals stripped me'
    end_quote: 'being in the most perfect health, and very robust to boot.'
    why: 'The stranger is first judged by his bodily health, which sets up the book''s later inversion of illness and crime.'
  - id: butler-erewhon#u08-c4
    label: c4
    heading: 'The watch is set beside the old clocks'
    char_start: 102886
    char_end: 103426
    start_quote: 'We passed many cases, and at last came to one in which there were'
    end_quote: 'that he had better take my watch and put it with the others.'
    why: 'The magistrate treats the watch as belonging with the banned machines, and the narrator''s misunderstanding of the offence shows his mercenary, customs-minded frame.'
  - id: butler-erewhon#u08-c5
    label: c5
    heading: 'The beauty of the people'
    char_start: 94460
    char_end: 95161
    start_quote: 'Lastly, I should say that the people were of a physical beauty which'
    end_quote: 'I forgot all thoughts of their conversion in feelings that were far more earthly.'
    why: 'Establishes the healthy, handsome baseline of Erewhonian society and undercuts the narrator''s missionary pretensions.'
- nn: 9
  unit_id: ch08-in-prison
  note_id: butler-erewhon-ch08-in-prison
  span: 105355:120226
  chunks:
  - id: butler-erewhon#u09-c1
    label: c1
    heading: 'Why so little machinery? The narrator''s wrong theory'
    char_start: 105824
    char_end: 107092
    start_quote: 'What was the meaning of that room full of old machinery'
    end_quote: 'I felt quite sure then that it must be the right one.'
    why: 'Establishes the Erewhonians as having once had advanced machinery, now preserved and ticketed, and shows the narrator confidently misreading it, setting up the later Book of the Machines.'
  - id: butler-erewhon#u09-c2
    label: c2
    heading: 'The watch as damaging feature'
    char_start: 111267
    char_end: 111680
    start_quote: 'My having had a watch, he said, was the only damaging feature in the case.'
    end_quote: 'But he said he thought my light hair would save me.'
    why: 'Shows a mechanical object treated as a grave offence, comparable to typhus fever, while body traits like light hair count in a person''s favour.'
  - id: butler-erewhon#u09-c3
    label: c3
    heading: 'The Sabbath read as sulkiness'
    char_start: 113713
    char_end: 114521
    start_quote: 'I had one or two discussions with them because I never would sing on'
    end_quote: 'though I pretended to take it quite as a matter of course.'
    why: 'Satirises both the narrator''s pious observance and the Erewhonian tendency to treat low spirits as a condition to be referred to someone.'
  - id: butler-erewhon#u09-c4
    label: c4
    heading: 'Yram''s anger: illness is a crime'
    char_start: 114523
    char_end: 116689
    start_quote: 'Once only did Yram treat me in a way that was unkind and'
    end_quote: 'an announcement which struck me dumb with astonishment.'
    why: 'The first explicit statement of the central Erewhonian inversion that illness is criminal and immoral and punishable by imprisonment.'
  - id: butler-erewhon#u09-c5
    label: c5
    heading: 'The prisoners behind the wall'
    char_start: 117390
    char_end: 118285
    start_quote: 'This little affair explained much which had hitherto puzzled me.'
    end_quote: 'but I seldom saw him, and Yram and I generally found other things to talk about.'
    why: 'Reveals that the other prisoners are serving hard labour for ill health, tying the cold episode back to the magistrates'' hearing.'
  - id: butler-erewhon#u09-c6
    label: c6
    heading: 'Government conditions and the recovered embezzler'
    char_start: 119030
    char_end: 120222
    start_quote: 'At the end of the third month the jailor and my instructor came'
    end_quote: 'you are sure to like him.”'
    why: 'Sets out the state''s bodily criteria for release and ends with the straighteners'' medical language applied to embezzlement, the mirror image of illness-as-crime.'
- nn: 10
  unit_id: ch09-to-the-metropolis
  note_id: butler-erewhon-ch09-to-the-metropolis
  span: 120226:140353
  chunks:
  - id: butler-erewhon#u10-c1
    label: c1
    heading: 'Wealth measured in horse-power'
    char_start: 121432
    char_end: 121763
    start_quote: 'Mr. Nosnibor, he continued, “is a man of at least 500,000 horse-power”'
    end_quote: 'his two daughters are among the most beautiful women in Erewhon.”'
    why: 'Social rank is expressed in a mechanical unit, and the narrator''s hesitation turns on his host''s standing, not his guilt.'
  - id: butler-erewhon#u10-c2
    label: c2
    heading: 'Embezzlement versus poverty'
    char_start: 122396
    char_end: 123259
    start_quote: '“Ill or poor!” interrupted the interpreter, with a face of great alarm.'
    end_quote: 'or he would be sure to cancel it.”'
    why: 'States the inversion of vice and misfortune in a dialogue where the narrator''s own poverty was the offence.'
  - id: butler-erewhon#u10-c3
    label: c3
    heading: 'Asking after temper, not health'
    char_start: 127765
    char_end: 128976
    start_quote: 'They never once asked after my health, or even whether I was fatigued with my journey;'
    end_quote: 'which is smooth enough generally.'
    why: 'Shows the everyday practice of treating moral state as a condition for care, with the narrator preferring to hide his true temper.'
  - id: butler-erewhon#u10-c4
    label: c4
    heading: 'Statues, sacrifice and professional borees'
    char_start: 130491
    char_end: 131225
    start_quote: 'I had the curiosity to inquire what would be done to any of Chowbok’s'
    end_quote: 'they would be kept as professional borees.'
    why: 'Gives the Erewhonian view of outsiders and a satirical institution that explains Chowbok''s terror.'
  - id: butler-erewhon#u10-c5
    label: c5
    heading: 'The abolition of the machines, first report'
    char_start: 131483
    char_end: 132734
    start_quote: 'I also questioned them about the museum of old machines, and the cause'
    end_quote: 'by an avowed legal fiction.'
    why: 'First account of the 271-year clean sweep, the professor''s prediction of machine life, and the legal fiction treating invention as typhus.'
  - id: butler-erewhon#u10-c6
    label: c6
    heading: 'Nosnibor weeps while the family dines'
    char_start: 138944
    char_end: 139587
    start_quote: 'But I noticed that my host was uneasy during the whole meal,'
