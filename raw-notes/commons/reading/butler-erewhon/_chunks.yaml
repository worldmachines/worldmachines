- nn: 14
  unit_id: ch13-views-concerning-death
  note_id: butler-erewhon-ch13-views-concerning-death
  span: 190750:204633
  chunks:
  - id: butler-erewhon#u14-c1
    label: c1
    heading: 'Death less abhorred than disease; the unborn'
    char_start: 190812
    char_end: 191524
    start_quote: 'The Erewhonians regard death with less abhorrence than disease.'
    end_quote: 'And they say that this does not matter so much as we think it does.'
    why: 'States the Erewhonian ranking of death below disease and the odd claim that most people never truly reach the unseen world.'
  - id: butler-erewhon#u14-c2
    label: c2
    heading: 'The condemned man and the bugbear of death'
    char_start: 192392
    char_end: 193309
