source: clark-revolutionary-spring
units:
- nn: 1
  unit_id: introduction
  note_id: clark-revolutionary-spring-introduction
  span: 0:31400
  chunks:
  - id: clark-revolutionary-spring#u01-c1
    heading: 'The only truly European revolution'
    span: 14:757
    why: 'States the book''s core framing of 1848 as a simultaneous transcontinental cascade unlike earlier or later revolutions.'
  - id: clark-revolutionary-spring#u01-c2
    heading: 'Nationalized in retrospect'
    span: 3110:4463
    why: 'Argues that the national ''failure'' narratives fragmented a European event and shows the framing power of the nation-state.'
  - id: clark-revolutionary-spring#u01-c3
    heading: 'Not a failure: the particle collision chamber'
    span: 7999:8987
    why: 'Clark''s positive case against the failure verdict, with his collision-chamber image and the revolution in government.'
  - id: clark-revolutionary-spring#u01-c4
    heading: 'Revolution and counter-revolution blurred'
    span: 18524:19448
    why: 'Introduces counter-revolutionaries as executors of the revolution and the long march of ex-radicals into post-1848 administrations.'
  - id: clark-revolutionary-spring#u01-c5
    heading: 'Fear of the lower orders'
    span: 21532:22176
    why: 'Explains how fear of the lower orders paralysed the revolution and let authorities split liberals from radicals.'
  - id: clark-revolutionary-spring#u01-c6
    heading: 'Historical awareness and the template of 1789'
    span: 29662:30394
    why: 'Shows that actors read 1848 against 1789 within a heavily historicized consciousness, a distinctive feature of the revolutions.'
- nn: 2
  unit_id: ch01-politics-of-description
  note_id: clark-revolutionary-spring-ch01-politics-of-description
  span: 31400:76237
  chunks:
  - id: clark-revolutionary-spring#u02-c1
    heading: 'Distress as backdrop, the Social Question as a way of seeing'
    span: 31653:32278
    why: 'States Clark’s thesis on the relation between social distress and revolution and introduces the politics of description.'
  - id: clark-revolutionary-spring#u02-c2
    heading: 'Nantes: mortality gradient by street'
    span: 43360:44049
    why: 'Concrete example of how statistics turned class inequality into measurable, politically potent fact.'
  - id: clark-revolutionary-spring#u02-c3
    heading: 'The statistical turn and Quetelet'
    span: 54914:56098
    why: 'Explains the shared ‘period eye’ of the genre and the paradigm shift in social understanding driven by large-number statistics.'
  - id: clark-revolutionary-spring#u02-c4
    heading: 'Same facts, rival politics: Engels versus Guépin'
    span: 60656:61779
    why: 'Shows that descriptions of the Social Question carried opposed political diagnoses and predictions, with Engels’s revolutionary forecast as one pole.'
  - id: clark-revolutionary-spring#u02-c5
    heading: 'Buret: poverty as a phenomenon of civilisation'
    span: 68089:68766
    why: 'Gives the systemic, anti-moralizing reading of poverty that contrasts with Frégier’s blame of the poor.'
  - id: clark-revolutionary-spring#u02-c6
    heading: 'Gaps in the new field of vision'
    span: 73946:74934
    why: 'Clark’s critical reflection on what the politics of description made legible and what it left illegible.'
- nn: 3
  unit_id: ch01-precarity-and-crisis
  note_id: clark-revolutionary-spring-ch01-precarity-and-crisis
  span: 76237:123828
  chunks:
  - id: clark-revolutionary-spring#u03-c1
    heading: 'Pauperism as a new, structural poverty'
    span: 76259:76855
    why: 'Defines the neologism and why contemporaries saw it as collective, permanent and spreading to formerly secure groups.'
  - id: clark-revolutionary-spring#u03-c2
    heading: 'Scarcity seen as produced by power relations'
    span: 87890:88396
    why: 'Gives the mechanism by which hardship became a political threat: sufferers read it as human-made, not natural.'
  - id: clark-revolutionary-spring#u03-c3
    heading: 'Feudalism abolished, use rights unsettled'
    span: 90172:91545
    why: 'Explains why changing property law drove Europe-wide social conflict, with the key point about ownership versus use.'
  - id: clark-revolutionary-spring#u03-c4
    heading: 'Overlayered crises close the scissors'
    span: 110752:111626
    why: 'Shows how food, industrial and credit shocks compounded to hit landless piece-workers, the structure of the 1845–7 crisis.'
  - id: clark-revolutionary-spring#u03-c5
    heading: 'Hunger as a political phenomenon'
    span: 114546:115033
    why: 'States Clark''s interpretive claim, via Sen, that the subsistence crisis was political and shaped by official decisions.'
  - id: clark-revolutionary-spring#u03-c6
    heading: 'Prussia prefers the riot'
    span: 120032:121311
    why: 'Contrasts state responses and shows how fear of empowering the bourgeoisie shaped crisis management on the eve of 1848.'
- nn: 4
  unit_id: ch01-weavers
  note_id: clark-revolutionary-spring-ch01-weavers
  span: 123828:165357
  chunks:
  - id: clark-revolutionary-spring#u04-c1
    heading: 'The Lyons Mutual Aid Society and the asymmetry of association'
    span: 126510:127869
    why: 'Describes the weavers'' cellular organization and the legal asymmetry (Le Chapelier Law) that motivated association.'
  - id: clark-revolutionary-spring#u04-c2
    heading: 'An uprising of hunger, or a world saturated with politics?'
    span: 130289:131458
    why: 'Clark''s rebuttal of the purely-social reading of the canuts, contrasting it with the contemporary middle-class description.'
  - id: clark-revolutionary-spring#u04-c3
    heading: 'Republican politics and weaver activism converge without intertwining'
    span: 139306:140466
    why: 'Evidence that the 1834 revolt kept its own moral economy and that radicals described workers in stereotyped terms.'
  - id: clark-revolutionary-spring#u04-c4
    heading: 'Prague women and the gendered exclusions of associational culture'
    span: 153336:154751
    why: 'Clark''s argument that working-class association excluded women from its benefits and its schooling in collective action.'
  - id: clark-revolutionary-spring#u04-c5
    heading: 'Ruge and Marx dispute the meaning of Silesia'
    span: 163221:164442
    why: 'Shows how radical intellectuals used the weavers'' revolt to define their own positions, with attribution to each man.'
  - id: clark-revolutionary-spring#u04-c6
    heading: 'Negative energy and the cultural afterlife of the weavers'
    span: 164444:165355
    why: 'Closing statement of the chapter''s thesis on political differentiation and the long memory of the revolts.'
- nn: 5
  unit_id: ch01-galicia-1846-conclusions
  note_id: clark-revolutionary-spring-ch01-galicia-1846-conclusions
  span: 165357:219428
  chunks:
  - id: clark-revolutionary-spring#u05-c1
    heading: 'Two uprisings, not one'
    span: 170032:170479
    why: 'States the double structure of the Galician events: an elite national uprising and the peasant counter-insurrection that broke it.'
  - id: clark-revolutionary-spring#u05-c2
    heading: 'A consensus never reached'
    span: 188352:190001
    why: 'Shows how every element of the events is contested between Austrian and Polish narratives, illustrating the politics of description.'
  - id: clark-revolutionary-spring#u05-c3
    heading: 'Multi-vectoral upheaval'
    span: 193090:193695
    why: 'Clark''s own generalization: social and political grievances may fail to align, converge or cancel, as in 1848.'
  - id: clark-revolutionary-spring#u05-c4
    heading: 'Schwarzenberg''s imperial peasants'
    span: 193697:195831
    why: 'The peasants-as-resource-for-order lesson, with Clark''s hedge, foreshadowing counter-revolutionary strategy.'
  - id: clark-revolutionary-spring#u05-c5
    heading: 'Hunger and revolution have different geographies'
    span: 209248:210653
    why: 'Core Conclusions argument that distress does not directly cause revolution and that politics is autonomous.'
  - id: clark-revolutionary-spring#u05-c6
    heading: 'Fear as part of the revolution'
    span: 218301:219426
    why: 'Argues that fear of subaltern violence shaped the whole course of revolution, empowering then constraining liberals.'
- nn: 6
  unit_id: ch02-its-a-mans-world
  note_id: clark-revolutionary-spring-ch02-its-a-mans-world
  span: 219428:255904
  chunks:
  - id: clark-revolutionary-spring#u06-c1
    heading: 'Ideologies before parties'
    span: 220358:221247
    why: 'States Clark''s framing that pre-1848 political categories were fuzzy, partyless and unstable, which governs how the whole chapter''s conjectures should be read.'
  - id: clark-revolutionary-spring#u06-c2
    heading: 'Démar and the power of the father'
    span: 222956:224302
    why: 'Presents the radical argument that patriarchal power underlies every other structure of inequality and pervades every institution.'
  - id: clark-revolutionary-spring#u06-c3
    heading: 'A slower, deeper revolution of mores'
    span: 227198:228668
    why: 'Sets out Démar''s vision of emancipation as a diffuse cultural transformation, unlike the three-day political revolution of 1830, and links women''s liberation to that of all groups.'
  - id: clark-revolutionary-spring#u06-c4
    heading: 'The Gazette des Femmes and liberal hypocrisy'
    span: 240758:242436
    why: 'Shows dissenters exposing the gap between the Charter''s official principle of equality and the Civil Code''s legal reality.'
  - id: clark-revolutionary-spring#u06-c5
    heading: 'Tristan and the politics of naming private suffering'
    span: 248421:249163
    why: 'Captures how making private, dispersed servitude visible as systematic oppression became a new political method and form of authority.'
  - id: clark-revolutionary-spring#u06-c6
    heading: 'Gender order as constructed and resistant'
    span: 254270:255902
    why: 'Clark''s concluding judgement that sexual inequality was the most resistant structure and would survive the revolutions of 1848 intact.'
- nn: 7
  unit_id: ch02-partisans-of-liberty-radicals
  note_id: clark-revolutionary-spring-ch02-partisans-of-liberty-radicals
  span: 255904:290711
  chunks:
  - id: clark-revolutionary-spring#u07-c1
    heading: 'The liberal middle path'
    span: 257546:258141
    why: 'Compactly defines liberalism as a set of paired affirmations and rejections between old regime and Jacobin terror.'
  - id: clark-revolutionary-spring#u07-c2
    heading: 'Liberalism as metapolitics'
    span: 258494:258981
    why: 'States Clark''s reading of liberalism as a procedural kit rather than an ideology, with its strength and weakness.'
  - id: clark-revolutionary-spring#u07-c3
    heading: 'Falling between the stools'
    span: 267461:268033
    why: 'Martinez de la Rosa''s case shows the moderate liberal squeezed from both sides and foreshadows 1848.'
  - id: clark-revolutionary-spring#u07-c4
    heading: 'Reluctant revolutionaries'
    span: 274775:276045
    why: 'Explains liberals'' stance towards revolution and constitutions as containment of popular upheaval.'
  - id: clark-revolutionary-spring#u07-c5
    heading: 'Harmony versus managed conflict'
    span: 280815:282294
    why: 'Draws the central contrast between radical harmony-seeking and liberal conflict-mediation, with constitutions as peace treaties.'
  - id: clark-revolutionary-spring#u07-c6
    heading: 'Stein reads socialism as a symptom'
    span: 288896:290709
    why: 'Presents the argument that ''society'' had become the subject of politics and the idea of a science of society for state pacification.'
- nn: 8
  unit_id: ch02-conservatives-religion
  note_id: clark-revolutionary-spring-ch02-conservatives-religion
  span: 290711:334481
  chunks:
  - id: clark-revolutionary-spring#u08-c1
    heading: 'Conservatives in opposition to the state'
    span: 290726:292450
    why: 'Establishes that pre-1848 conservatism was often oppositional rather than pro-state, with Savigny, Baden, legitimists and La Esperanza as cases.'
  - id: clark-revolutionary-spring#u08-c2
    heading: 'Adam Müller on the nested natural order'
    span: 297599:299425
    why: 'Compact conservative case for particularist, non-standardized, nested authority against the universal state and its fictional rights.'
  - id: clark-revolutionary-spring#u08-c3
    heading: 'Lancizolle on contagion and the fragility of liberal order'
    span: 304335:305451
    why: 'A conservative''s diagnosis of revolutionary contagion and of liberalism''s dependence on the masses it excludes, judged by Clark hostile but not stupid.'
  - id: clark-revolutionary-spring#u08-c4
    heading: 'Religion as a spiritual power surge'
    span: 310331:310963
    why: 'Clark''s thesis that the Great Disruption loosened religion from its institutions and let it energize new political combinations.'
  - id: clark-revolutionary-spring#u08-c5
    heading: 'Religious sentiment got unstuck from religious authority'
    span: 322993:323982
    why: 'Synthesizes the French religious left and Constant''s free versus sacerdotal religion into the section''s central analytic claim.'
  - id: clark-revolutionary-spring#u08-c6
    heading: 'Not an age of secularization'
    span: 332459:333645
    why: 'Clark''s summarizing evidence and conclusion that revival and secularization reinforced one another across Europe.'
- nn: 9
  unit_id: ch02-patriots-and-nations
  note_id: clark-revolutionary-spring-ch02-patriots-and-nations
  span: 334481:377317
  chunks:
  - id: clark-revolutionary-spring#u09-c1
    heading: 'Amari and history as delegitimation'
    span: 338297:339449
    why: 'Shows how patriotic historians re-narrated the past to make insurrection look deep and dynasties shallow, and why states censored them.'
  - id: clark-revolutionary-spring#u09-c2
    heading: 'Neither primordial nor invented from nothing'
    span: 341927:343009
    why: 'Clark''s position on the constructivist versus primordialist debate, with the invented national costume examples.'
  - id: clark-revolutionary-spring#u09-c3
    heading: 'The radical charge of the nation and rival mental maps'
    span: 356568:358039
    why: 'States that national feeling implied popular sovereignty and that incompatible territorial visions set up the revolution-era conflicts.'
  - id: clark-revolutionary-spring#u09-c4
    heading: 'A very tiny patriotic cosmos'
    span: 373414:374075
    why: 'Ties nationalism''s reach to print and literacy and gives a concrete measure of its narrow social base.'
  - id: clark-revolutionary-spring#u09-c5
    heading: 'What patriotism offered women: Jarnević'
    span: 370843:371534
    why: 'Clark''s interpretive claim about patriotism''s inclusiveness, grounded in the chapter''s central individual case study.'
  - id: clark-revolutionary-spring#u09-c6
    heading: 'Nationalism as an evolving field of awareness'
    span: 376541:377315
    why: 'The chapter''s concluding thesis: national feeling was plural, situational and contested, dominant only under pressure.'
- nn: 10
  unit_id: ch02-free-and-unfree-places-in-history
  note_id: clark-revolutionary-spring-ch02-free-and-unfree-places-in-history
  span: 377317:406460
  chunks:
  - id: clark-revolutionary-spring#u10-c1
    heading: 'Slavery as root metaphor'
    span: 377334:379334
    why: 'Establishes that slavery was a ubiquitous political metaphor across factions and causes.'
  - id: clark-revolutionary-spring#u10-c2
    heading: 'Weitling, Hegel and Haiti in invisible ink'
    span: 381612:383103
    why: 'Clark''s core argument that European thought used slavery abstractly while averting its eyes from actual slavery and Haiti.'
  - id: clark-revolutionary-spring#u10-c3
    heading: 'Why continental abolitionism stalled'
    span: 384797:386264
    why: 'Explains national-interest and elite-narrowness obstacles to abolition on the Continent.'
  - id: clark-revolutionary-spring#u10-c4
    heading: 'Abolitionism on the eve of revolution'
    span: 394263:395111
    why: 'Shows how February 1848 acted as a discontinuity that joined abolitionist argument to political power.'
  - id: clark-revolutionary-spring#u10-c5
    heading: 'Even the conservatives feel the current'
    span: 399888:401443
    why: 'Documents the shared cross-spectrum intuition of irreversible historical motion in the spirit-of-the-age discourse.'
  - id: clark-revolutionary-spring#u10-c6
    heading: 'Stabilization versus flux'
    span: 405782:406458
    why: 'Clark''s periodizing frame for the 1830s-40s as an age of flux with unpredictable enmeshing of identities and commitments.'
- nn: 11
  unit_id: ch03-glorious-days-liberal-revolution
  note_id: clark-revolutionary-spring-ch03-glorious-days-liberal-revolution
  span: 406460:437765
  chunks:
  - id: clark-revolutionary-spring#u11-c1
    heading: 'The ordinances and the threat of a coup'
    span: 406516:407220
    why: 'States the trigger of the July Revolution: a unilateral royal coup by ordinance against a freshly victorious liberal opposition.'
  - id: clark-revolutionary-spring#u11-c2
    heading: '‘No chambers, no workshops!’: press freedom as economic fact'
    span: 408706:409768
    why: 'Shows how political closure of the press instantly propagated into unemployment and pushed workers into the streets.'
  - id: clark-revolutionary-spring#u11-c3
    heading: 'The editors’ declaration and its narrow legalism'
    span: 424911:426469
    why: 'Documents the rule-of-law framing of the protest and Clark’s reading of it as narrowly calibrated to the government’s breach.'
  - id: clark-revolutionary-spring#u11-c4
    heading: 'Why workers joined a liberal revolution'
    span: 427536:429969
    why: 'Clark’s core argument about the social depth of liberal culture among Parisian workers, against Louis Blanc’s contagion account.'
  - id: clark-revolutionary-spring#u11-c5
    heading: 'Civic unanimity and the co-opted barricade'
    span: 432217:433120
    why: 'Shows the liberal press and the new monarchy folding armed workers into a reassuring origin story.'
  - id: clark-revolutionary-spring#u11-c6
    heading: 'A European media event'
    span: 434797:436214
    why: 'Illustrates the speed with which print carried news of Paris across Europe and how it was received (Heine on Heligoland).'
  - id: clark-revolutionary-spring#u11-c7
    heading: '1830 as rehearsal for the cascade of 1848'
    span: 436656:437763
    why: 'States Clark’s claim that 1830 already displayed revolutionary contagion, while marking its limited scale.'
- nn: 12
  unit_id: ch03-unfinished-business-social-revolutionaries
  note_id: clark-revolutionary-spring-ch03-unfinished-business-social-revolutionaries
  span: 437765:465911
  chunks:
  - id: clark-revolutionary-spring#u12-c1
    heading: 'The story of a paving stone'
    span: 437786:439617
    why: 'The fable that frames the unit''s argument about 1830 as a revolution that changed the regime''s occupant but not its distance from the people.'
  - id: clark-revolutionary-spring#u12-c2
    heading: 'Liberal achievements, social silence'
    span: 442851:444145
    why: 'Clark''s judgement on the class character of the July settlement and the strikes and Lyons rising that followed.'
  - id: clark-revolutionary-spring#u12-c3
    heading: 'The cellular hierarchy of the Society of Seasons'
    span: 452552:453782
    why: 'Shows how a hard-left conspiracy organized itself against police infiltration and the Law on Associations.'
  - id: clark-revolutionary-spring#u12-c4
    heading: 'Mérilhou: a social revolution, a return to 1793'
    span: 453784:454700
    why: 'Captures the liberal establishment''s re-description of the left as regressive, and the turncoat irony of the prosecutor.'
  - id: clark-revolutionary-spring#u12-c5
    heading: 'Trials as theatre and order as force'
    span: 457079:458802
    why: 'Blanqui''s and Barbès''s refusals to plead and Clark''s claim about political order as raw force.'
  - id: clark-revolutionary-spring#u12-c6
    heading: 'Pellico and Bernard: two revolutionary selves'
    span: 462962:464242
    why: 'Clark''s argument that the left invented a new political temperament, recognized by contemporaries as more dangerous.'
- nn: 13
  unit_id: ch03-clandestinity-national-insurrection
  note_id: clark-revolutionary-spring-ch03-clandestinity-national-insurrection
  span: 465911:503554
  chunks:
  - id: clark-revolutionary-spring#u13-c1
    heading: 'Networks as compensatory emotion'
    span: 470892:471665
    why: 'Clark''s interpretive claim that clandestine networks mattered as emotional structures for the stranded rather than as effective instruments.'
  - id: clark-revolutionary-spring#u13-c2
    heading: 'The Hessian Courier as political futility'
    span: 474787:475785
    why: 'Shows the gap between the absence of means of persuasion or coercion and the imagined threat, ending in martyrdom.'
  - id: clark-revolutionary-spring#u13-c3
    heading: 'Mazzini''s moral people versus Buonarroti''s equality'
    span: 484982:485927
    why: 'Draws the sharp contrast between a moral-national and a social conception of revolution.'
  - id: clark-revolutionary-spring#u13-c4
    heading: 'Failure as education and martyrdom'
    span: 491889:493033
    why: 'States the logic of insurrection-as-pedagogy: disasters yield martyrs who overcome the nation''s inertia.'
  - id: clark-revolutionary-spring#u13-c5
    heading: 'Failed conspirator, unparalleled propagandist'
    span: 493035:494620
    why: 'Clark''s central verdict on Mazzini, locating his real achievement in print, networks and myth-making.'
  - id: clark-revolutionary-spring#u13-c6
    heading: 'Duties over rights and the fascist afterlife'
    span: 497133:498340
    why: 'Clark''s critical assessment of Mazzini''s unitary, duty-based nation against complex liberal models of interests and rights.'
- nn: 14
  unit_id: ch03-political-ferment-in-germany
  note_id: clark-revolutionary-spring-ch03-political-ferment-in-germany
  span: 503554:540542
  chunks:
  - id: clark-revolutionary-spring#u14-c1
    heading: 'Kassel 1830: the liberal use of plebeian threat'
    span: 507497:508732
    why: 'Shows the liberal strategy of leveraging popular disorder that later structures the liberal-radical fissure.'
  - id: clark-revolutionary-spring#u14-c2
    heading: 'Metternich''s Mainz police and adaptive learning'
    span: 508734:510599
    why: 'Describes the pan-Confederal censorship and secret-service apparatus that mimicked dissident networks.'
  - id: clark-revolutionary-spring#u14-c3
    heading: 'Newspapers, songs and peep-shows: the texture of politicization'
    span: 515232:517406
    why: 'Catalogues the oral, printed and performative media through which dissent spread before 1848.'
  - id: clark-revolutionary-spring#u14-c4
    heading: 'Offenburg versus Heppenheim'
    span: 520979:522588
    why: 'Contrasts radical and moderate programmes of autumn 1847, especially on the social question.'
  - id: clark-revolutionary-spring#u14-c5
    heading: 'Blum''s politics of unity'
    span: 529431:530764
    why: 'Sets out Blum''s linked concepts of unity, democracy and divide-and-rule, with Clark''s note on gender exclusion.'
  - id: clark-revolutionary-spring#u14-c6
    heading: 'Leipzig, 13 August 1845: Blum urges restraint'
    span: 533264:535423
    why: 'Core episode of a radical leader steering a crowd into municipal channels, a template for 1848.'
- nn: 15
  unit_id: ch03-swiss-culture-wars-hungary
  note_id: clark-revolutionary-spring-ch03-swiss-culture-wars-hungary
  span: 540542:564045
  chunks:
  - id: clark-revolutionary-spring#u15-c1
    heading: 'Zurich committees of faith and the Züriputsch'
    span: 543893:544973
    why: 'Shows a religious controversy turning improvised committees into insurrectionary organizations and a near-unanimous popular mandate.'
  - id: clark-revolutionary-spring#u15-c2
    heading: 'Religion widens the abyss'
    span: 548205:548447
    why: 'Clark''s general lesson from the Swiss cases about sacred commitments and the collapse of dialogue.'
  - id: clark-revolutionary-spring#u15-c3
    heading: 'Széchenyi''s Hitel and the gradualist programme'
    span: 550813:551937
    why: 'Sets out the moderate reformist baseline against which Hungarian radicalization is measured.'
  - id: clark-revolutionary-spring#u15-c4
    heading: 'Getting richer but feeling poorer'
    span: 556160:557411
    why: 'Clark''s socio-economic explanation for why the lower nobility abandoned appeals to ancient liberties.'
  - id: clark-revolutionary-spring#u15-c5
    heading: 'Kossuth''s samizdat reports and the martyr function'
    span: 558277:559651
    why: 'Documents how hand-copied reporting and imprisonment built a national oppositional public.'
  - id: clark-revolutionary-spring#u15-c6
    heading: 'Metternich''s gamble and Pesti Hírlap'
    span: 561169:561805
    why: 'Shows the newspaper as clearing house for national opinion and the unintended consequences of Austrian management of dissent.'
- nn: 16
  unit_id: ch03-bourgeois-monarchy-moderates-italy
  note_id: clark-revolutionary-spring-ch03-bourgeois-monarchy-moderates-italy
  span: 564045:596988
  chunks:
  - id: clark-revolutionary-spring#u16-c1
    heading: 'Guizot: ''enrich yourselves'''
    span: 569083:570030
    why: 'Captures the regime''s philosophy of arresting change at the optimal moment and how its slogan became its indictment.'
  - id: clark-revolutionary-spring#u16-c2
    heading: 'Philipon''s pear and the power of representation'
    span: 578421:579557
    why: 'Shows how prosecution amplified caricature and how a sign detached from the king''s person attacked the principle of power.'
  - id: clark-revolutionary-spring#u16-c3
    heading: 'The banquet campaign radicalizes'
    span: 585623:587263
    why: 'Explains why the banquets were unsuppressable, how they radicalized toward social questions, and how they set up the February 1848 trigger.'
  - id: clark-revolutionary-spring#u16-c4
    heading: 'Was Gioberti a liberal?'
    span: 591421:592559
    why: 'Clark''s analysis of Giobertian moderation as anti-conflictual, distinct from liberalism and the dialectic.'
  - id: clark-revolutionary-spring#u16-c5
    heading: 'Minghetti''s turn from conspiracy'
    span: 587298:588142
    why: 'A contemporary account of why Italian elites abandoned sects and insurrection for gradual reform.'
  - id: clark-revolutionary-spring#u16-c6
    heading: 'The futurity of moderatism'
    span: 595869:596986
    why: 'Clark''s thesis that elitist, technocratic, counter-revolutionary moderatism prefigured post-1848 European centrism.'
- nn: 17
  unit_id: ch03-rock-of-order-cracks-avalanche
  note_id: clark-revolutionary-spring-ch03-rock-of-order-cracks-avalanche
  span: 596988:636719
  chunks:
  - id: clark-revolutionary-spring#u17-c1
    heading: 'Policing conspiracies, missing the real threat'
    span: 597007:598614
    why: 'Clark''s claim that transnational policing targeted underground networks while 1848 arose from mass protest and economic dislocation, and that reform was the neglected remedy.'
  - id: clark-revolutionary-spring#u17-c2
    heading: 'Metternich, a rock of order'
    span: 602732:603802
    why: 'Explains Metternich''s conception of a European order linking inter-state peace to domestic stability, in his own summing-up.'
  - id: clark-revolutionary-spring#u17-c3
    heading: 'Kissinger''s conservative dilemma'
    span: 603804:604682
    why: 'The analytic frame for why defence of order produces rigidity and a breakdown of communication, which Clark then applies to Metternich.'
  - id: clark-revolutionary-spring#u17-c4
    heading: 'Pius IX and the volatility of popular enthusiasm'
    span: 611236:612916
    why: 'Shows popular adulation acquiring political and anti-Austrian meaning and alarming Vienna, an example of pressure from below shaping the institutional order.'
  - id: clark-revolutionary-spring#u17-c5
    heading: 'The Prussian United Diet as political culture'
    span: 627125:628162
    why: 'Argues that a public, published assembly exhausted the monarch''s containment strategy even though it changed nothing constitutionally.'
  - id: clark-revolutionary-spring#u17-c6
    heading: 'The Swiss war: binary image, hidden fissures'
    span: 634769:636717
    why: 'Contrasts the progress-versus-reaction image that gave the war European resonance with the many cross-cutting conflicts it masked.'
- nn: 18
  unit_id: ch04-i-predict-a-riot
  note_id: clark-revolutionary-spring-ch04-i-predict-a-riot
  span: 636719:672129
  chunks:
  - id: clark-revolutionary-spring#u18-c1
    heading: 'Poster, crowd and happenstance'
    span: 637949:639429
    why: 'Shows a revolution triggered by the anticipation of one, with an invented committee and curious crowds, and Lamartine as a parallel witness.'
  - id: clark-revolutionary-spring#u18-c2
    heading: 'Too little too late'
    span: 640659:640921
    why: 'Compact statement of the threshold after which incremental reform emboldens opposition.'
  - id: clark-revolutionary-spring#u18-c3
    heading: 'Regime confidence collapses'
    span: 652484:653859
    why: 'Clark''s clearest causal claim for why an apparently better-armed regime lost.'
  - id: clark-revolutionary-spring#u18-c4
    heading: 'Consuls and war steamers'
    span: 655228:655954
    why: 'Establishes the international dimension of the revolt through consular tribunals and extra-territorial gunboats.'
  - id: clark-revolutionary-spring#u18-c5
    heading: 'Land reform and peasant violence'
    span: 666381:668015
    why: 'Explains how state land reform undermined deference and unleashed peasant violence.'
  - id: clark-revolutionary-spring#u18-c6
    heading: 'Elites fear the mob'
    span: 668664:669164
    why: 'Early evidence of moderate elites fearing popular victory, foreshadowing the liberal-radical split.'
- nn: 19
  unit_id: ch04-nouvelles-diverses-february
  note_id: clark-revolutionary-spring-ch04-nouvelles-diverses-february
  span: 672129:715481
  chunks:
  - id: clark-revolutionary-spring#u19-c1
    heading: 'Critique of the ''wave'' metaphor'
    span: 672912:674370
    why: 'States Clark''s core claim that 1848''s revolutions were cognate and synchronous rather than caused by a single origin, using both spatial and temporal axes.'
  - id: clark-revolutionary-spring#u19-c2
    heading: 'News and a shared present'
    span: 687799:688716
    why: 'Explains how fragmentary, translated newspaper copy produced a Europe-wide sense of a shared present, dissolving the Palermo-or-Paris question.'
  - id: clark-revolutionary-spring#u19-c3
    heading: 'Metternich and Guizot look at the European horizon'
    span: 688718:690073
    why: 'Contrasts the diplomatic, treaty-based Europe of the ministers with the radicals'' networked Europe and records Guizot''s refusal to reform.'
  - id: clark-revolutionary-spring#u19-c4
    heading: 'Guizot on autopilot'
    span: 702453:704207
    why: 'Vivid case of a regime locked in an illusion of normality while its own capital rises around it.'
  - id: clark-revolutionary-spring#u19-c5
    heading: 'Preparing for the wrong revolution'
    span: 709424:711065
    why: 'Clark''s diagnosis of why the state misread the threat and how the juste milieu lost its meaning.'
  - id: clark-revolutionary-spring#u19-c6
    heading: 'The intermediate ''time of politics'''
    span: 712228:712991
    why: 'Introduces a plane of causation between remote and proximate causes that structures Clark''s account of every 1848 crisis.'
- nn: 20
  unit_id: ch04-we-are-dead-shall-we-be-slaves
  note_id: clark-revolutionary-spring-ch04-we-are-dead-shall-we-be-slaves
  span: 715481:757288
  chunks:
  - id: clark-revolutionary-spring#u20-c1
    heading: 'Protest framed to save the system'
    span: 721250:723060
    why: 'States Clark''s reading that early bourgeois protest sought to rescue the monarchy and target ministers, not overthrow the institution.'
  - id: clark-revolutionary-spring#u20-c2
    heading: 'Targets of suburban working-class violence'
    span: 727714:728711
    why: 'Analyses what workers attacked (machines, bad employers, police and tax offices) and the state''s administrative response.'
  - id: clark-revolutionary-spring#u20-c3
    heading: 'Simultaneity and separateness of political and social revolt'
    span: 731579:732763
    why: 'Clark''s explicit thesis that the political and social revolutions ran side by side without solidarity, anticipating the later fissuring of the coalition.'
  - id: clark-revolutionary-spring#u20-c4
    heading: 'Metternich, improvised reform and the dual speed of revolution'
    span: 734844:736522
    why: 'Shows the regime''s internal divisions, Metternich''s argument that reconstruction cannot be improvised, and the moment of his fall.'
  - id: clark-revolutionary-spring#u20-c5
    heading: 'Pest, 15 March: Twelve Demands and the National Song'
    span: 741936:743684
    why: 'Illustrates contagion of news from Vienna to Pest, direct action overtaking petition, and the national-memory structure of Petőfi''s song.'
  - id: clark-revolutionary-spring#u20-c6
    heading: 'Revolution as theatre and the discovery of public voice'
    span: 755498:757286
    why: 'Clark''s argument that theatricality, stage fright and improvised pageantry were constitutive of how people experienced and drove the revolution.'
- nn: 21
  unit_id: ch04-soldiers-out-five-days-of-milan
  note_id: clark-revolutionary-spring-ch04-soldiers-out-five-days-of-milan
  span: 757288:798166
  chunks:
  - id: clark-revolutionary-spring#u21-c1
    heading: 'News of Paris shocks Berlin'
    span: 757303:758041
    why: 'Shows news of the French revolution reaching a second capital and producing an immediate, informational shock.'
  - id: clark-revolutionary-spring#u21-c2
    heading: 'Crowd and soldiery: ritual and provocation'
    span: 763287:764609
    why: 'Captures the ritualized, mutually legible confrontation between crowd and army that the crowd learned to game.'
  - id: clark-revolutionary-spring#u21-c3
    heading: 'The Schlossplatz on 18 March'
    span: 769234:771059
    why: 'Combines the class geography of the crowd, the chant ''Soldiers out!'' and the confused military response at the tipping point.'
  - id: clark-revolutionary-spring#u21-c4
    heading: 'Two accidental shots and the linen banner'
    span: 771061:771916
    why: 'A vivid case of contingency and misinformation triggering the barricade fighting, and of the state failing to control the narrative.'
  - id: clark-revolutionary-spring#u21-c5
    heading: 'Barricades, houses and the division of labour'
    span: 773724:774607
    why: 'Boerner''s account of how workers and the bourgeoisie divided the insurrection, anticipating later class fissures.'
  - id: clark-revolutionary-spring#u21-c6
    heading: 'Cattaneo, rumour and the revolution that made revolutionaries'
    span: 790965:792763
    why: 'Clark''s clearest argument that Milan''s uprising rested on rumour and improvisation, and that revolutionaries were produced by the revolution.'
- nn: 22
  unit_id: ch04-dogs-that-didnt-bark-end-of-beginning
  note_id: clark-revolutionary-spring-ch04-dogs-that-didnt-bark-end-of-beginning
  span: 798166:831904
  chunks:
  - id: clark-revolutionary-spring#u22-c1
    heading: 'The Dutch king caves'
    span: 800090:801361
    why: 'Shows a pre-emptive, contingent concession by a monarch confident days earlier that revolution had no chance.'
  - id: clark-revolutionary-spring#u22-c2
    heading: 'What the Dutch events show'
    span: 806527:807747
    why: 'Clark''s own lesson: diverse channels of connection, and the Netherlands absorbed rather than avoided revolution.'
  - id: clark-revolutionary-spring#u22-c3
    heading: 'Belgium: counter-cyclical spending and isolating the radicals'
    span: 810613:811834
    why: 'A concrete case of a state managing revolutionary threat by economic policy and franchise politics.'
  - id: clark-revolutionary-spring#u22-c4
    heading: 'Revolutionaries were not the authors of revolution'
    span: 815352:815795
    why: 'States Clark''s central claim about agency in 1848 against conspiracy and great-man accounts.'
  - id: clark-revolutionary-spring#u22-c5
    heading: 'British policing and the Prussian study visit'
    span: 817041:818675
    why: 'Establishes force and surveillance, not contentment, as the explanation for British calm.'
  - id: clark-revolutionary-spring#u22-c6
    heading: 'The commonalities and the unsolved problems'
    span: 827010:829023
    why: 'Names the shared liberal vernacular and the list of open problems that seed the later fracturing of the revolutions.'
- nn: 23
  unit_id: ch05-revolutionary-space-honour-your-dead
  note_id: clark-revolutionary-spring-ch05-revolutionary-space-honour-your-dead
  span: 831904:878660
  chunks:
  - id: clark-revolutionary-spring#u23-c1
    heading: 'The city turned inside out'
    span: 837978:839106
    why: 'Captures how the withdrawal of troops inverted who controlled public space, with Tocqueville''s fearful reading attributed to him.'
  - id: clark-revolutionary-spring#u23-c2
    heading: 'Twofold function of the revolutionized city'
    span: 846598:847502
    why: 'States Clark''s argument that cafés differentiated while streets de-differentiated, a compact model of how factions and solidarity form.'
  - id: clark-revolutionary-spring#u23-c3
    heading: 'Erasing revolutionary space afterwards'
    span: 848444:849305
    why: 'Links spatial experience of revolution to the counter-revolution''s deliberate redesign and policing of that space, from Haussmann to Vienna and Berlin.'
  - id: clark-revolutionary-spring#u23-c4
    heading: 'Insurgents into revolutionaries'
    span: 856189:856919
    why: 'Clark''s central claim about how funeral ritual retroactively creates the legitimacy of a new state.'
  - id: clark-revolutionary-spring#u23-c5
    heading: 'Berlin''s humbled king'
    span: 862753:863987
    why: 'Contrasts Paris and Berlin on the moral economy of monarchy and shows the king''s rapid recovery and improvisation.'
  - id: clark-revolutionary-spring#u23-c6
    heading: 'Self-historicizing revolutionaries'
    span: 866354:867295
    why: 'Identifies the contemporaries'' habit of apprehending the present as history and re-enacting it almost at once.'
  - id: clark-revolutionary-spring#u23-c7
    heading: 'Jung against reconciliation'
    span: 868394:869671
    why: 'Shows the democratic challenge to the liberal ritual of reconciliation, an early fault line in the revolutionary coalition.'
- nn: 24
  unit_id: ch05-establish-a-government
  note_id: clark-revolutionary-spring-ch05-establish-a-government
  span: 878660:917936
  chunks:
  - id: clark-revolutionary-spring#u24-c1
    heading: 'Hiatus rather than transition'
    span: 878684:879784
    why: 'States the chapter''s central claim that a provisional authority emerges in a rule-less hiatus and is not a mechanical transition.'
  - id: clark-revolutionary-spring#u24-c2
    heading: 'The civilization of the journal'
    span: 883339:884182
    why: 'Explains how newspapers served as switchboards that channelled the legitimation of new governments in 1830 and 1848.'
  - id: clark-revolutionary-spring#u24-c3
    heading: 'Belgioioso on the self-assigned Milanese ministers'
    span: 888526:889330
    why: 'A contemporary insider testimony that printed lists concealed a process of self-appointment under fire.'
  - id: clark-revolutionary-spring#u24-c4
    heading: 'Inheritors, not authors, of revolution'
    span: 912759:913402
    why: 'Contrasts the improvised leadership seen almost everywhere with the pre-planned Wallachian case and gives Regnault''s line.'
  - id: clark-revolutionary-spring#u24-c5
    heading: 'Political biodiversity and the routes to restabilization'
    span: 915203:916363
    why: 'Clark''s typology of how provisional authority formed across Europe and his explanation of the diversity.'
  - id: clark-revolutionary-spring#u24-c6
    heading: 'Why every new structure was fragile'
    span: 916365:917934
    why: 'Summarizes the shared weaknesses of the new governments and the unresolved question of power.'
- nn: 25
  unit_id: ch05-elect-a-parliament
  note_id: clark-revolutionary-spring-ch05-elect-a-parliament
  span: 917936:963883
  chunks:
  - id: clark-revolutionary-spring#u25-c1
    heading: 'La Farina''s template for insurgency to orderly government'
    span: 920615:921291
    why: 'Clark''s framing image of the parliament as the ritual conversion of insurgent power into legal authority, before the chapter complicates it.'
  - id: clark-revolutionary-spring#u25-c2
    heading: 'Parliaments turned out predominantly conservative'
    span: 933330:934598
    why: 'The chapter''s central empirical claim: expanded suffrage consolidated old elites rather than displacing them.'
  - id: clark-revolutionary-spring#u25-c3
    heading: 'The left''s problem: a revolution generating its own negation'
    span: 944672:946363
    why: 'States the strategic dilemma and three courses open to radicals, setting up the later splitting of liberals and radicals.'
  - id: clark-revolutionary-spring#u25-c4
    heading: 'Dissension about the parliament itself'
    span: 950364:951754
    why: 'Clark''s analytical point on why uncertainty over a parliament''s own status and powers was corrosive.'
  - id: clark-revolutionary-spring#u25-c5
    heading: 'Parliaments, print feedback loops and the materialized nation'
    span: 956231:957987
    why: 'Shows how parliaments nationalized discourse through newspapers and petitions and anticipated infrastructure-based unity.'
  - id: clark-revolutionary-spring#u25-c6
    heading: 'Modern parliamentary stenography'
    span: 957989:959435
    why: 'A concrete example of institution-building that made debate near-simultaneously legible to a wider public.'
- nn: 26
  unit_id: ch05-draft-a-constitution
  note_id: clark-revolutionary-spring-ch05-draft-a-constitution
  span: 963883:990442
  chunks:
  - id: clark-revolutionary-spring#u26-c1
    heading: 'Every state issued a constitution: three types'
    span: 966013:966882
    why: 'Gives Clark''s typology of preventive, stabilizing and counter-revolutionary constitutions and the claim of their versatility.'
  - id: clark-revolutionary-spring#u26-c2
    heading: 'Piedmont: fury, terror and a strengthened crown'
    span: 967722:969236
    why: 'Shows a pre-emptive constitution produced by panic and by the argument that representation would strengthen the monarchy.'
  - id: clark-revolutionary-spring#u26-c3
    heading: 'France: capturing the revolution in something cool and inert'
    span: 971668:972415
    why: 'Illustrates the stabilizing purpose of assembly-drafted constitutions and the gap between drafters and the street.'
  - id: clark-revolutionary-spring#u26-c4
    heading: 'Austria: preventive, revolutionary and counter-revolutionary texts'
    span: 978367:980089
    why: 'A single empire exhibits all three types and the counter-revolution''s use of the constitutional form against itself.'
  - id: clark-revolutionary-spring#u26-c5
    heading: 'The apogee of liberal politics and the conservative conversion'
    span: 988074:989605
    why: 'Clark''s argument that constitutions delegitimated the left and were absorbed by conservatives as stabilization tools.'
  - id: clark-revolutionary-spring#u26-c6
    heading: 'Emptiness: from constitution to administration'
    span: 989607:990440
    why: 'The section''s concluding thesis on constitutions as means rather than ends and Stein''s epochal formulation.'
- nn: 27
  unit_id: ch06-abolitionist-black-1848
  note_id: clark-revolutionary-spring-ch06-abolitionist-black-1848
  span: 990442:1027252
  chunks:
  - id: clark-revolutionary-spring#u27-c1
    heading: 'Heine and the inflation of ''emancipation'''
    span: 990468:991480
    why: 'Sets the chapter''s frame: emancipation as a totalizing concept of history that the revolution then fails to deliver linearly.'
  - id: clark-revolutionary-spring#u27-c2
    heading: 'Legitimacy of the revolution and property in a man'
    span: 997751:998367
    why: 'Shows the argument that revolutionary legitimacy licenses abolition against colonists'' claims about property and government authority.'
  - id: clark-revolutionary-spring#u27-c3
    heading: 'Shifting perspective: abolition versus emancipation'
    span: 1003534:1004346
    why: 'Clark''s thesis for the section: the enslaved seized freedom first, and abolition in law differed from emancipation in fact.'
  - id: clark-revolutionary-spring#u27-c4
    heading: 'The Caribbean cascade of 1848'
    span: 1010323:1011897
    why: 'Best statement of how metropolitan news, local self-organization and island-to-island signalling interacted across empires.'
  - id: clark-revolutionary-spring#u27-c5
    heading: 'Perrinon''s contracts and the rebuilt labour regime'
    span: 1019413:1021187
    why: 'Documents how legal freedom was bound back to plantation labour through contracts, restrictions on provision grounds and later vagrancy law.'
  - id: clark-revolutionary-spring#u27-c6
    heading: 'Emancipation absorbed into the imperial project'
    span: 1022651:1023404
    why: 'Clark''s verdict that 1848 abolition and colonial expansion were compatible, with no serious revolutionary challenge to empire.'
- nn: 28
  unit_id: ch06-waving-from-windows
  note_id: clark-revolutionary-spring-ch06-waving-from-windows
  span: 1027252:1065342
  chunks:
  - id: clark-revolutionary-spring#u28-c1
    heading: 'A male-authored archive and the Vesuviennes hoax'
    span: 1032106:1033430
    why: 'Explains why evidence for women''s participation is distorted, with the invented armed militia as the emblem of male fantasy standing in for record.'
  - id: clark-revolutionary-spring#u28-c2
    heading: 'Pest women: duties without rights'
    span: 1038394:1039315
    why: 'Shows women''s advocacy absorbed by nation and class, contrasting sharply with the Paris programme.'
  - id: clark-revolutionary-spring#u28-c3
    heading: 'Excluded from institutions, spectators in parliament'
    span: 1046564:1048537
    why: 'Documents women''s exclusion from clubs, parliaments and speech, and links the nation embodied by women to the men who represented it.'
  - id: clark-revolutionary-spring#u28-c4
    heading: 'Tocqueville and the hateful gaze'
    span: 1051677:1052849
    why: 'Clark''s analysis of contempt felt as natural as a weapon of the patriarchal order, internalized even by activists.'
  - id: clark-revolutionary-spring#u28-c5
    heading: 'The immovable patriarchal structure'
    span: 1052851:1054130
    why: 'States Clark''s central claim that direct challenges to patriarchy achieved little, with the polarized-gender-norms explanation and the long legal timeline.'
  - id: clark-revolutionary-spring#u28-c6
    heading: 'Seeing politicians as men'
    span: 1064270:1065340
    why: 'Offers, with hedges, an account of why women writers made distinctive witnesses, and reports Deroin''s contrast of men''s and women''s political perception.'
- nn: 29
  unit_id: ch06-liberty-and-risk
  note_id: clark-revolutionary-spring-ch06-liberty-and-risk
  span: 1065342:1111426
  chunks:
  - id: clark-revolutionary-spring#u29-c1
    heading: 'Real relief and new dangers'
    span: 1069740:1070814
    why: 'States the unit''s double thesis: emancipation hopes and factional, popular and lasting hostility arrived together in 1848.'
  - id: clark-revolutionary-spring#u29-c2
    heading: 'Emancipation as meandering paths'
    span: 1081299:1082721
    why: 'Clark''s explicit rejection of teleological narratives of liberation, with the ''earn it'' logic that could delay rights indefinitely.'
  - id: clark-revolutionary-spring#u29-c3
    heading: 'Alsace tumults and the new Republic'
    span: 1090307:1092041
    why: 'Analyses who the rioters were, why Vive la République! alongside pogrom is unsettling, and how the violence embarrassed the new government.'
  - id: clark-revolutionary-spring#u29-c4
    heading: 'Frameworks that focus anger on Jews'
    span: 1095037:1096499
    why: 'Shows how available interpretive frameworks (Toussenel, Leroux) channelled economic distress into anti-Jewish violence.'
  - id: clark-revolutionary-spring#u29-c5
    heading: 'Violence as protest against a policy'
    span: 1096501:1097837
    why: 'Establishes the causal nexus between emancipation measures and violence, beyond economic explanations.'
  - id: clark-revolutionary-spring#u29-c6
    heading: 'Emancipation from the Jews'
    span: 1110451:1111173
    why: 'Identifies the modern anti-capitalist anti-Semitic trope bridging left and right that emerges from 1848.'
- nn: 30
  unit_id: ch06-roma-slaves-time-of-emancipation
  note_id: clark-revolutionary-spring-ch06-roma-slaves-time-of-emancipation
  span: 1111426:1128896
  chunks:
  - id: clark-revolutionary-spring#u30-c1
    heading: 'Roma slavery in the Principalities: scale and categories'
    span: 1112015:1113296
    why: 'Gives the numbers, ownership categories and the missing cadastral record that frame the 1848 abolition.'
  - id: clark-revolutionary-spring#u30-c2
    heading: 'Liberation tickets and the Commission'
    span: 1114591:1115924
    why: 'Shows an improvised administrative apparatus for emancipation, including tickets that doubled as identity cards and named the former owner.'
  - id: clark-revolutionary-spring#u30-c3
    heading: 'Proclamation versus implementation, and the Ottoman reversal'
    span: 1117636:1119178
    why: 'Names the recurring questions of compensation, pace and integration and records the annulment of all revolutionary manumissions in September 1848.'
  - id: clark-revolutionary-spring#u30-c4
    heading: 'Culture rehearses emancipation without swallowing it'
    span: 1121545:1123510
    why: 'Clark''s compact account of how print, stage and opera carried the four emancipations as imaginative material.'
  - id: clark-revolutionary-spring#u30-c5
    heading: 'Expansion, narrowing, and the long tail'
    span: 1124642:1126961
    why: 'Carries the comparative claim that all four emancipations were rolled back after 1848 and traces the aftermath through 1866, 1914 and 1933.'
  - id: clark-revolutionary-spring#u30-c6
    heading: 'Why the emancipations never merged'
    span: 1127628:1128894
    why: 'States Clark''s thesis that the emancipations rested on irreducible separate rationales and rejects the label of 1848 as mere failure.'
- nn: 31
  unit_id: ch07-vagabond-sovereignty
  note_id: clark-revolutionary-spring-ch07-vagabond-sovereignty
  span: 1128896:1181482
  chunks:
  - id: clark-revolutionary-spring#u31-c1
    heading: 'Liberal and radical understandings of the revolution drift apart'
    span: 1136962:1137598
    why: 'States Clark''s core framing of the liberal–radical schism (tricolour versus red flag, accomplished event versus ongoing process) that drives the chapter.'
  - id: clark-revolutionary-spring#u31-c2
    heading: 'Marche, the decree and vagabond sovereignty'
    span: 1138204:1139084
    why: 'Coins and illustrates ''vagabond sovereignty'', the condition of authority dispersed after the July Monarchy fell and not yet recaptured by a single institution.'
  - id: clark-revolutionary-spring#u31-c3
    heading: 'The National Workshops as palliation'
    span: 1139847:1141293
    why: 'Shows moderates converting a structural demand for the organization of labour into a mechanism for neutralizing unemployed workers.'
  - id: clark-revolutionary-spring#u31-c4
    heading: 'Rumour, forgery and the 16 April demonstration'
    span: 1152867:1153861
    why: 'Captures how rumour and misinformation helped turn a pre-approved demonstration into a confrontation, with Clark''s careful hedge on who manipulated whom.'
  - id: clark-revolutionary-spring#u31-c5
    heading: 'Held''s balcony about-turn and the missing radical leadership'
    span: 1168010:1168377
    why: 'Clark''s explanation of the collapse of the 14 May Berlin demonstration by structural weakness in radical leadership rather than by betrayal.'
  - id: clark-revolutionary-spring#u31-c6
    heading: 'The court''s flight as a sign of Habsburg strength'
    span: 1179080:1181480
    why: 'Argues that the Habsburg monarchy''s multi-front, peripatetic structure made the radicals'' apparent victory in Vienna compatible with a growing capacity for counter-revolution.'
- nn: 32
  unit_id: ch07-radical-breakaway
  note_id: clark-revolutionary-spring-ch07-radical-breakaway
  span: 1181482:1204159
  chunks:
  - id: clark-revolutionary-spring#u32-c1
    heading: 'Two scenarios for the German revolution'
    span: 1184674:1186518
    why: 'Sets out the liberal model of building with the old order against the radical demand for a permanent executive on the 1789 template, the core of the liberal–radical split.'
  - id: clark-revolutionary-spring#u32-c2
    heading: 'How radically must a regime break with the past'
    span: 1186520:1187679
    why: 'Clark frames the pre-parliament dispute as a question of how far an administration must break with the past to qualify as new, with liberals favoring holdovers and radicals a purge.'
  - id: clark-revolutionary-spring#u32-c3
    heading: 'The First Baden Uprising and Kandern'
    span: 1189373:1191229
    why: 'Explains why Baden was fertile ground, how the republican network seemed all-encompassing to Hecker, and how the rising was quickly crushed.'
  - id: clark-revolutionary-spring#u32-c4
    heading: 'From washout to golden chapter of radical memory'
    span: 1195091:1196443
    why: 'Shows how memoirs converted military failure into lasting radical memory that outshines the liberal revolution, bearing on Clark''s point that the verdict of failure misleads.'
  - id: clark-revolutionary-spring#u32-c5
    heading: 'Radical celebrity and its caricature'
    span: 1198951:1200679
    why: 'Clark argues celebrity was integral to political mobilization and that opponents fought it by targeting persons rather than issues.'
  - id: clark-revolutionary-spring#u32-c6
    heading: 'Blum breaks with Hecker'
    span: 1202567:1204157
    why: 'Shows a radical who kept faith with representative procedure and condemned the insurrection as a betrayal of the People, so the split ran within radicalism too.'
- nn: 33
  unit_id: ch07-town-and-country
  note_id: clark-revolutionary-spring-ch07-town-and-country
  span: 1204159:1245432
  chunks:
  - id: clark-revolutionary-spring#u33-c1
    heading: 'Peasantries as the black box'
    span: 1204177:1206069
    why: 'States the chapter''s thesis about the rural majority''s opacity and internal stratification, with the key statistics and the rebuttal of homogeneous ''peasants''.'
  - id: clark-revolutionary-spring#u33-c2
    heading: 'The forty-five centimes'
    span: 1219683:1221342
    why: 'Clark''s central example of an urban revolutionary policy that alienated the peasantry, with the Belgian contrast and Garnier-Pagès''s reasoning.'
  - id: clark-revolutionary-spring#u33-c3
    heading: 'Hungary: legal act versus social process'
    span: 1226073:1228004
    why: 'Shows how the April 1848 emancipation left grey areas and states the general gap between decree and social emancipation.'
  - id: clark-revolutionary-spring#u33-c4
    heading: 'Wallachia''s Property Commission'
    span: 1235561:1237416
    why: 'Describes a unique improvised deliberative institution, the confrontation between landowners and peasants over property, and the repentant landowner''s speech.'
  - id: clark-revolutionary-spring#u33-c5
    heading: 'Anthropologists, not evangelists'
    span: 1242568:1243459
    why: 'Clark''s diagnosis of why revolutionary commissars misread rural politics and how the counter-revolution exploited the failure.'
  - id: clark-revolutionary-spring#u33-c6
    heading: 'Kudlich on the peasants'
    span: 1244883:1245429
    why: 'Closes the chapter with Kudlich''s insider verdict that the revolution''s leaders had ignored the peasantry''s liberation.'
- nn: 34
  unit_id: ch07-national-questions-1
  note_id: clark-revolutionary-spring-ch07-national-questions-1
  span: 1245432:1275643
  chunks:
  - id: clark-revolutionary-spring#u34-c1
    heading: 'Nationalism presses on 1848: shocking but never surprising'
    span: 1249858:1251269
    why: 'States Clark''s method for handling nationalism in 1848 and his idea of its binary temporality.'
  - id: clark-revolutionary-spring#u34-c2
    heading: 'The mismatch between ethnic settlement and the political map'
    span: 1251271:1253095
    why: 'Explains why national projects were structurally bound to compete over the same institutions, with concrete cases.'
  - id: clark-revolutionary-spring#u34-c3
    heading: 'Who belonged to which nation?'
    span: 1253097:1255011
    why: 'Shows the instability of national categories and the role of regional, social and religious loyalties and the nationally indifferent.'
  - id: clark-revolutionary-spring#u34-c4
    heading: 'Nationalism as a first principle that displaces other demands'
    span: 1257341:1259087
    why: 'Clark''s account of when nationalism outranked social and radical politics, with Lombard, Hungarian and Galician examples.'
  - id: clark-revolutionary-spring#u34-c5
    heading: 'Charles Albert: a dynastic rather than national war'
    span: 1265766:1266645
    why: 'Shows how the Piedmontese intervention exposed the split between dynastic annexation and republican nationalism.'
  - id: clark-revolutionary-spring#u34-c6
    heading: 'Cattaneo, Dandolo and the fractured Italian future'
    span: 1274576:1275641
    why: 'Closes the Italian case by locating the failure in rival visions (monarchy, unitary republic, city federalism) rather than a lack of national feeling.'
- nn: 35
  unit_id: ch07-national-questions-2
  note_id: clark-revolutionary-spring-ch07-national-questions-2
  span: 1275643:1324059
  chunks:
  - id: clark-revolutionary-spring#u35-c1
    heading: 'Palacký declines Frankfurt'
    span: 1291673:1293476
    why: 'Palacký''s defence of a multinational Austria as Europe''s shield against Russia is the emblematic small-nation counter-position to German nationalism.'
  - id: clark-revolutionary-spring#u35-c2
    heading: 'Nation against history: Ukrainians and Poles'
    span: 1303343:1306379
    why: 'Shows how national claims are argued, including the survival narrative and Clark''s primordialist-versus-constructivist quip.'
  - id: clark-revolutionary-spring#u35-c3
    heading: 'Jordan and the right of conquest'
    span: 1306381:1307985
    why: 'Radical democracy turns national egoism into a principle, complicating the Mazzinian picture of fraternal nations.'
  - id: clark-revolutionary-spring#u35-c4
    heading: 'The national experience of 1848'
    span: 1300532:1302025
    why: 'Clark''s general characterization of nationalism''s speed, contagion, centre-periphery reversal and inward turn of solidarity.'
  - id: clark-revolutionary-spring#u35-c5
    heading: 'Phantom, heroin, and geopolitics'
    span: 1320178:1324057
    why: 'States the unit''s evaluative argument: nationalism both energized and fragmented the revolutions and led into a geopolitical trap.'
  - id: clark-revolutionary-spring#u35-c6
    heading: 'Stojanović becomes a Croat'
    span: 1287368:1288830
    why: 'A single life shows how parliament, museum and press make a national identity out of a composite frontier population.'
- nn: 36
  unit_id: ch07-revolution-shuts-itself-down
  note_id: clark-revolutionary-spring-ch07-revolution-shuts-itself-down
  span: 1324059:1364931
  chunks:
  - id: clark-revolutionary-spring#u36-c1
    heading: 'The workshops dilemma'
    span: 1337547:1338454
    why: 'Falloux''s dilemma and Lamartine''s reflation plan show why the government could neither keep nor close the institution it had improvised.'
  - id: clark-revolutionary-spring#u36-c2
    heading: '15 May as a claim on sovereignty'
    span: 1332142:1333009
    why: 'Clark reinterprets the invasion of the assembly as a bid to reclaim revolutionary sovereignty, amid leaders divided by feuds.'
  - id: clark-revolutionary-spring#u36-c3
    heading: 'Cavaignac, Algeria and the June repression'
    span: 1344748:1346492
    why: 'Ties the suppression of the June insurrection to colonial warfare and its imagery, in both directions.'
  - id: clark-revolutionary-spring#u36-c4
    heading: 'Marx''s reading of June, in his defence'
    span: 1356499:1357944
    why: 'Clark separates Marx''s class-struggle claim from his sharper point that the February myth rested on the threat of force.'
  - id: clark-revolutionary-spring#u36-c5
    heading: 'Heat, engines and the naming of entropy'
    span: 1357974:1359853
    why: 'Introduces the thermodynamic frame that Clark uses for the dissipation of the revolutions.'
  - id: clark-revolutionary-spring#u36-c6
    heading: 'Asynchrony and the failure of convergence'
    span: 1362217:1364168
    why: 'Gives Clark''s concrete account of how uneven timing blocked the continental convergence of revolutionary impulses.'
  - id: clark-revolutionary-spring#u36-c7
    heading: 'Order-making, not only entropy'
    span: 1364170:1364929
    why: 'Clark''s own hedge against a purely entropic reading, pointing to competing new forms of order-making and their futures.'
- nn: 37
  unit_id: ch08-naples-in-summer
  note_id: clark-revolutionary-spring-ch08-naples-in-summer
  span: 1364931:1412170
  chunks:
  - id: clark-revolutionary-spring#u37-c1
    heading: 'Polarization without a plot'
    span: 1380659:1381418
    why: 'Clark''s explicit claim that revolution and counter-revolution emerged from mutual suspicion and disinhibited politics rather than conspiracy.'
  - id: clark-revolutionary-spring#u37-c2
    heading: 'The disequilibrium of two fears, and control of timing'
    span: 1398247:1400199
    why: 'States the chapter''s central mechanism: fear broke, and counter-revolutionaries could then choose the time and manner of action.'
  - id: clark-revolutionary-spring#u37-c3
    heading: 'Armed force needs a popular anchorage'
    span: 1400201:1402070
    why: 'Argues that the revolution and popular opinion had drifted apart, with lazzaroni allying with the monarchy on 15 May.'
  - id: clark-revolutionary-spring#u37-c4
    heading: 'Petitions against the constitution'
    span: 1402072:1403688
    why: 'Primary-source imagery of the constitution as contagion, and the problem of speaking for the illiterate, in the popular counter-revolutionary petition campaign.'
  - id: clark-revolutionary-spring#u37-c5
    heading: 'Naples was not alone: conservative resurgence'
    span: 1406193:1407474
    why: 'Generalizes from Naples to Bavaria, Prussia and France, showing conservatism organizing as a mass movement.'
  - id: clark-revolutionary-spring#u37-c6
    heading: 'The conservative myth of the loyal countryside'
    span: 1411690:1412168
    why: 'Shows conservatives pairing a wishful image of the rural masses with franchise restriction, carrying the 1848 lesson to Bismarck in 1866.'
- nn: 38
  unit_id: ch08-empire-strikes-back-1
  note_id: clark-revolutionary-spring-ch08-empire-strikes-back-1
  span: 1412170:1448875
  chunks:
  - id: clark-revolutionary-spring#u38-c1
    heading: 'Instability wired into Prague''s revolution'
    span: 1416642:1418408
    why: 'Lays out the national, class and moderate-radical fault lines already present in the first revolutionary institutions in Prague.'
  - id: clark-revolutionary-spring#u38-c2
    heading: 'Windischgrätz and the semi-acephalous empire'
    span: 1426114:1427539
    why: 'Clark''s claim that the Habsburg system kept functioning without a functioning centre, plus the casualty profile of the June Uprising.'
  - id: clark-revolutionary-spring#u38-c3
    heading: 'Radetzky, terror and concession as counter-revolutionary tools'
    span: 1435610:1437298
    why: 'States the tactical blend of atrocity and concession by which the Austrians recovered Lombardy-Venetia.'
  - id: clark-revolutionary-spring#u38-c4
    heading: 'Internal ailments and the Papal Allocution'
    span: 1437519:1439211
    why: 'Diagnoses why the Italian coalition fractured: republican-monarchist and social divisions, popular tribunes, and the Pope''s withdrawal.'
  - id: clark-revolutionary-spring#u38-c5
    heading: 'Vienna''s wage cuts and the Social Question'
    span: 1442831:1444050
    why: 'Shows Viennese moderates disavowing plebeian radicalism over public-works wages, paralleling the Paris workshops.'
  - id: clark-revolutionary-spring#u38-c6
    heading: '23 August: a breach in the structure of the revolution'
    span: 1446449:1448042
    why: 'Clark''s interpretation of the Praterstern violence as decoupling the radical leadership from workers and as a muted echo of the Paris June Days.'
- nn: 39
  unit_id: ch08-empire-strikes-back-2
  note_id: clark-revolutionary-spring-ch08-empire-strikes-back-2
  span: 1448875:1493422
  chunks:
  - id: clark-revolutionary-spring#u39-c1
    heading: 'Kulmer''s warning and Jelačić crosses the Drava'
    span: 1453755:1454653
    why: 'Shows the court pushing a proxy into an unsanctioned invasion, with sanction promised only after the fact, and the atrocities that followed.'
  - id: clark-revolutionary-spring#u39-c2
    heading: 'The Lamberg lynching and the end of equivocation'
    span: 1455931:1458426
    why: 'Clark''s account of how Vienna''s incoherent policy produced Lamberg''s murder and the decision for armed intervention that triggered the October rising.'
  - id: clark-revolutionary-spring#u39-c3
    heading: 'Bach: the executive will tolerate no interference'
    span: 1462659:1463651
    why: 'Captures the schism between ministers and parliament and introduces Bach''s trajectory toward the neo-absolutist regime.'
  - id: clark-revolutionary-spring#u39-c4
    heading: 'Contested meanings of Latour''s murder'
    span: 1468761:1471115
    why: 'Shows how conservatives and Kudlich attributed the violence differently, with lethal legal consequences and a revenge-fuelling effect.'
  - id: clark-revolutionary-spring#u39-c5
    heading: 'The optical illusion of the loyal countryside'
    span: 1474415:1475138
    why: 'States Clark''s argument about the rural gap as a structural strength of the old order.'
  - id: clark-revolutionary-spring#u39-c6
    heading: 'Blum''s letter and heroism in a bourgeois key'
    span: 1491114:1492164
    why: 'Clark''s interpretation of Blum''s farewell letter and of Blum as the embodiment of the German revolution.'
- nn: 40
  unit_id: ch08-iron-net-very-small-place
  note_id: clark-revolutionary-spring-ch08-iron-net-very-small-place
  span: 1493422:1526735
  chunks:
  - id: clark-revolutionary-spring#u40-c1
    heading: 'Proudhon''s proposal and the 600-to-2 jeering'
    span: 1494156:1495405
    why: 'Shows how far the assembly had moved right and how fragmented the left remained, even towards an apolitical radical scheme for the social question.'
  - id: clark-revolutionary-spring#u40-c2
    heading: 'Bonaparte''s peasants: Marx''s potatoes and Clark''s correction'
    span: 1498986:1500049
    why: 'Sets Marx''s contemptuous reading of the peasant vote against the fuller picture Clark gives in the next paragraph of a cross-class, culturally prepared Napoleonic vote.'
  - id: clark-revolutionary-spring#u40-c3
    heading: 'Berlin: the disequilibrium of two fears'
    span: 1505501:1506372
    why: 'Clark''s compact explanation of why the Prussian court moved to break the assembly, linking Berlin to Naples and Vienna.'
  - id: clark-revolutionary-spring#u40-c4
    heading: 'The Rhineland tax boycott and the iron net'
    span: 1507595:1509249
    why: 'Shows the depth and the political limits of provincial democratic mobilization once the assembly was dissolved, and supplies the unit''s title image.'
  - id: clark-revolutionary-spring#u40-c5
    heading: 'Ward, the Ionians and the European ''racial other'''
    span: 1523633:1525469
    why: 'Carries Clark''s thesis that the Cephalonian reprisals were liberal elite behaviour towards plebeian Europeans, not re-imported colonial practice.'
  - id: clark-revolutionary-spring#u40-c6
    heading: 'Courts-martial, floggings and deportation to Cerigo'
    span: 1519526:1521805
    why: 'The evidentiary core of the Ionian case: numbers, methods and exile that make the comparison with Austrian and Neapolitan repression concrete.'
  - id: clark-revolutionary-spring#u40-c7
    heading: 'Schwarzenberg''s what-aboutery'
    span: 1526028:1526733
    why: 'Closes the argument: British liberal self-image was contested by contemporaries, and the government treated Ward''s conduct as unremarkable.'
- nn: 41
  unit_id: ch08-the-second-wave
  note_id: clark-revolutionary-spring-ch08-the-second-wave
  span: 1526735:1581515
  chunks:
  - id: clark-revolutionary-spring#u41-c1
    heading: 'The myth of the liberal and national pope'
    span: 1530190:1530787
    why: 'Clark''s argument that the pope''s legitimacy in 1848 was a public mythic projection independent of his actions, which explains the collapse after the allocution.'
  - id: clark-revolutionary-spring#u41-c2
    heading: 'The Roman Republic''s humane, secular record'
    span: 1540365:1541608
    why: 'Catalogues the concrete institutional achievements of an improvised republic and the counter-propaganda that obscured them.'
  - id: clark-revolutionary-spring#u41-c3
    heading: 'Liberals as a saturated power'
    span: 1552027:1553078
    why: 'States why liberals refused to bind political authority to social demands, the root of the coalition''s fissure.'
  - id: clark-revolutionary-spring#u41-c4
    heading: 'The withering of the middle and bourgeois panic'
    span: 1557069:1558471
    why: 'Explains the liberals'' drift toward order out of fear of instability, with Stern''s later account of bourgeois terror after the June Days.'
  - id: clark-revolutionary-spring#u41-c5
    heading: 'Why radicals rallied to the imperial constitution'
    span: 1563926:1564970
    why: 'Shows how a liberal document became an integrative symbol for a popular-sovereignty campaign once princes dissolved parliaments.'
  - id: clark-revolutionary-spring#u41-c6
    heading: 'Democ-socs and the spectre of communism'
    span: 1579808:1581513
    why: 'Clark''s closing thesis that the second-wave left was ameliorative and that the communist label functioned as a way of not understanding it.'
- nn: 42
  unit_id: ch08-geopolitics
  note_id: clark-revolutionary-spring-ch08-geopolitics
  span: 1581515:1622107
  chunks:
  - id: clark-revolutionary-spring#u42-c1
    heading: 'Revolutions are not only domestic'
    span: 1581528:1582162
    why: 'States the section''s thesis that inter-state relations shaped the inception, course and consequences of the revolutions.'
  - id: clark-revolutionary-spring#u42-c2
    heading: 'Vienna settlement and constitutions as European questions'
    span: 1582546:1583368
    why: 'Gives the structural mechanism by which domestic constitutional challenges became grounds for great-power intervention.'
  - id: clark-revolutionary-spring#u42-c3
    heading: 'The papal restoration as unmaking'
    span: 1595853:1597131
    why: 'Shows the French intervention producing a reactionary rather than liberal restoration, contrasted with pragmatic settlements elsewhere.'
  - id: clark-revolutionary-spring#u42-c4
    heading: 'The St Petersburg Manifesto and Wallachia'
    span: 1605035:1606314
    why: 'Illustrates how an empire defines which entities count as states and justifies suppressing a national revolution.'
  - id: clark-revolutionary-spring#u42-c5
    heading: 'Görgey, Kossuth and two views of revolution'
    span: 1616513:1617925
    why: 'Contains Clark''s distinction between revolution as an event to safeguard and as an open-ended process, within the Hungarian leadership conflict.'
  - id: clark-revolutionary-spring#u42-c6
    heading: 'The bargains behind Russian intervention'
    span: 1619678:1621433
    why: 'Shows how Russian, French and British interests interlocked to permit the defeat of Hungary and how cosmopolitan the Hungarian cause was.'
- nn: 43
  unit_id: ch08-realism-and-the-dead
  note_id: clark-revolutionary-spring-ch08-realism-and-the-dead
  span: 1622107:1641349
  chunks:
  - id: clark-revolutionary-spring#u43-c1
    heading: 'Towers prevailed over squares'
    span: 1623550:1624457
    why: 'States Clark''s core insight that horizontal revolutionary networks lacked the vertical force to withstand the counter-revolutionary armies.'
  - id: clark-revolutionary-spring#u43-c2
    heading: 'Marx and Engels on force over ideology'
    span: 1624459:1626068
    why: 'Presents Marx and Engels''s 1850 reading that words and ideology carried little weight against forces, as the first instance of the realist turn.'
  - id: clark-revolutionary-spring#u43-c3
    heading: 'Olmütz, Bismarck, Droysen, d''Azeglio and Rochau'
    span: 1628597:1631944
    why: 'Shows realism as a converging reaction across German and Italian commentary and links Rochau''s Realpolitik to the 1848 experience.'
  - id: clark-revolutionary-spring#u43-c4
    heading: 'The realist temperament on the move'
    span: 1632996:1634146
    why: 'Clark''s argument that an ideologically disenchanted science of forces migrated from far left to right and centre, with an explicit caveat against a genealogy of influence.'
  - id: clark-revolutionary-spring#u43-c5
    heading: 'Manara and the serious conclusion of 1848'
    span: 1635337:1636380
    why: 'Interprets revolutionary martyrdom as narrative completion and revolution as melodrama with real deaths.'
  - id: clark-revolutionary-spring#u43-c6
    heading: 'The anonymous dead and cholera'
    span: 1640202:1641347
    why: 'Closes the counter-revolution narrative with the scale of anonymous deaths and evidence that counter-revolutionary armies spread cholera.'
- nn: 44
  unit_id: ch09-present-is-a-foreign-country
  note_id: clark-revolutionary-spring-ch09-present-is-a-foreign-country
  span: 1641349:1673942
  chunks:
  - id: clark-revolutionary-spring#u44-c1
    heading: 'Ottoman refuge and reputation'
    span: 1643747:1645140
    why: 'Shows refugee policy as reputational geopolitics with a concrete payoff in 1853.'
  - id: clark-revolutionary-spring#u44-c2
    heading: 'The scale and management of exile'
    span: 1646669:1648597
    why: 'Gives the continental scale of post-revolutionary displacement and the states'' managed-emigration practices.'
  - id: clark-revolutionary-spring#u44-c3
    heading: 'Exile as collective punishment'
    span: 1648599:1650454
    why: 'Documents the gap between legal theory and practice and the gendered burden of exile.'
  - id: clark-revolutionary-spring#u44-c4
    heading: 'Belgioioso: one politics for another'
    span: 1662762:1663350
    why: 'States Clark''s argument that withdrawal from institutional politics can be a substitution of politics.'
  - id: clark-revolutionary-spring#u44-c5
    heading: 'Füster and the German fatherland'
    span: 1666480:1667131
    why: 'Vivid contemporary testimony of a radical finding no home in German Europe.'
  - id: clark-revolutionary-spring#u44-c6
    heading: 'Pusztafi and the foreign country of the present'
    span: 1673482:1673940
    why: 'Clark''s closing interpretation of post-revolutionary homelessness through Jókai.'
- nn: 45
  unit_id: ch09-global-1848
  note_id: clark-revolutionary-spring-ch09-global-1848
  span: 1673942:1703139
  chunks:
  - id: clark-revolutionary-spring#u45-c1
    heading: 'News delays and the compressed chronology'
    span: 1673955:1675479
    why: 'Sets the unit''s core question about time-lags, rumour and how distance changed the texture of revolutionary news.'
  - id: clark-revolutionary-spring#u45-c2
    heading: 'Emancipation cascades in the Caribbean and Latin America'
    span: 1678068:1679402
    why: 'Shows centre signals, local self-organization and inter-island contagion interacting, with Spain as a contrast case.'
  - id: clark-revolutionary-spring#u45-c3
    heading: 'Local claims and the US Senate debate'
    span: 1679404:1680837
    why: 'States the thesis that distant reception vindicated pre-existing claims and shows it in the Allen, Hale and Calhoun exchange.'
  - id: clark-revolutionary-spring#u45-c4
    heading: 'Ceylon and the British periphery'
    span: 1688886:1689699
    why: 'Argues colonial turbulence was rooted in pressures generated by Britain''s efforts to avert revolution at home, not just echoing Europe.'
  - id: clark-revolutionary-spring#u45-c5
    heading: 'Lamartine''s Girondins in Chile'
    span: 1694466:1695694
    why: 'Illustrates a book as an interpretive template and how 1848 was read as history in the making.'
  - id: clark-revolutionary-spring#u45-c6
    heading: 'No central nervous system: the limits of a global 1848'
    span: 1700625:1703137
    why: 'Contrasts 1848 with the war-driven revolutions of 1770s-1815, denies a Taiping link, and gives Clark''s verdict on subtle, network-borne change.'
- nn: 46
  unit_id: ch09-constellations-circulation
  note_id: clark-revolutionary-spring-ch09-constellations-circulation
  span: 1703139:1733730
  chunks:
  - id: clark-revolutionary-spring#u46-c1
    heading: 'No return to the status quo ante'
    span: 1703774:1705295
    why: 'States the unit''s thesis that repression coexisted with irreversible constitutional change and lists the evidence across states.'
  - id: clark-revolutionary-spring#u46-c2
    heading: 'The connubio and conflictual stability'
    span: 1708064:1709531
    why: 'Shows how a flexible centre coalition and a culture-war cleavage stabilized Piedmont and the Netherlands.'
  - id: clark-revolutionary-spring#u46-c3
    heading: 'The new middle ground marginalizes left and old right'
    span: 1714727:1715720
    why: 'Clark''s synthesis of the post-revolutionary rapprochement and its effect on both political extremes.'
  - id: clark-revolutionary-spring#u46-c4
    heading: 'Louis Napoleon on progress, government and revolution'
    span: 1722507:1724995
    why: 'Presents the ideology of progress mediated by government and revolution absorbed into a general fusion, the intellectual core of the modernizing counter-revolution.'
  - id: clark-revolutionary-spring#u46-c5
    heading: 'Uniform administration and the unified railway network'
    span: 1728915:1730867
    why: 'Documents the shift to overarching plans, standardized forms and state-coordinated networks.'
  - id: clark-revolutionary-spring#u46-c6
    heading: 'Policy, programme and the revolutionary origin of state capacity'
    span: 1731500:1733728
    why: 'Argues that the state-as-distinct-from-society, the political programme and new fiscal capacity were direct consequences of the revolutions.'
- nn: 47
  unit_id: ch09-material-progress-city
  note_id: clark-revolutionary-spring-ch09-material-progress-city
  span: 1733730:1757309
  chunks:
  - id: clark-revolutionary-spring#u47-c1
    heading: 'Progress will end confrontational politics'
    span: 1736892:1738179
    why: 'States the post-1848 conviction, in officials'' own words, that material progress would displace ideologized politics and that ''the economy'' could bridge the social divide.'
  - id: clark-revolutionary-spring#u47-c2
    heading: 'Political peace valued for the sake of prosperity'
    span: 1738778:1740480
    why: 'Clark''s own claim that the post-revolutionary settlement inverted the relation between peace and progress, with infrastructure and economization as the new public good.'
  - id: clark-revolutionary-spring#u47-c3
    heading: 'Statistics and the co-option of reformist civil society'
    span: 1740482:1742279
    why: 'Shows national statistics as the technology through which reformist civil-society forces were folded into state administration.'
  - id: clark-revolutionary-spring#u47-c4
    heading: 'Hinckeldey: counter-revolution and urban reform'
    span: 1747506:1751622
    why: 'The fullest case study of the intimacy between counter-revolutionary policing and modernizing reform, and of the difference between reaction and post-revolutionary politics.'
  - id: clark-revolutionary-spring#u47-c5
    heading: 'The Social Question absorbed into administrative practice'
    span: 1754126:1755872
    why: 'Documents how the mapping and statistics of the Social Question became tools of urban policing and housing law.'
  - id: clark-revolutionary-spring#u47-c6
    heading: 'Co-option or victory?'
    span: 1756187:1757307
    why: 'Clark''s explicit weighing of co-option against victory of the reformers, and his comparison of 1850s experts with Napoleonic savants as agents of stabilization.'
- nn: 48
  unit_id: ch09-censorship-to-public-relations
  note_id: clark-revolutionary-spring-ch09-censorship-to-public-relations
  span: 1757309:1783431
  chunks:
  - id: clark-revolutionary-spring#u48-c1
    heading: 'From pre-censorship to confiscation'
    span: 1758044:1758699
    why: 'States the shift from prior vetting to after-the-fact confiscation and why it made repression visible and contestable.'
  - id: clark-revolutionary-spring#u48-c2
    heading: 'Press offices and the management of opinion'
    span: 1760049:1760853
    why: 'Clark''s clearest statement of the post-1848 transition from censorship to news and information management, with the Prussian agency as the institutional case.'
  - id: clark-revolutionary-spring#u48-c3
    heading: 'Russia''s Epoch of Censorship Terror'
    span: 1769419:1770468
    why: 'Gives the Russian counter-case in which fear of the revolutions produced hyper-censorship rather than press management.'
  - id: clark-revolutionary-spring#u48-c4
    heading: 'Bagehot''s Peel and the shift from what to how'
    span: 1773080:1774087
    why: 'Names the managerial, administrative politics that Clark takes as the signature of the post-revolutionary era.'
  - id: clark-revolutionary-spring#u48-c5
    heading: 'Peels everywhere after 1848'
    span: 1776184:1776705
    why: 'Generalizes the Peel type into Clark''s claim about the leaders who inherited power after 1848.'
  - id: clark-revolutionary-spring#u48-c6
    heading: 'The 1850s synthesis and its echoes'
    span: 1781915:1783429
    why: 'Clark''s closing judgement on the post-revolutionary synthesis, its erosion, and its recurrence after 1945 and 1989.'
- nn: 49
  unit_id: conclusion
  note_id: clark-revolutionary-spring-conclusion
  span: 1783431:1807780
  chunks:
  - id: clark-revolutionary-spring#u49-c1
    heading: 'Mimicry as felt historicity'
    span: 1786103:1787327
    why: 'Clark''s answer to Tocqueville and Marx: imitation of 1789 was reflexive awareness, not proof of emptiness.'
  - id: clark-revolutionary-spring#u49-c2
    heading: 'Revolutions are not storms nor unified intentions'
    span: 1790041:1791147
    why: 'Dismantles the success/failure verdict by showing revolutions are sums of dissonant intentions.'
  - id: clark-revolutionary-spring#u49-c3
    heading: 'The collision chamber of 1848'
    span: 1791149:1792729
    why: 'Catalogues how every political camp and the state itself were transformed, the evidence for consequence despite chaos.'
  - id: clark-revolutionary-spring#u49-c4
    heading: 'The post-revolutionary synthesis'
    span: 1792731:1793743
    why: 'States Clark''s thesis that the order that followed excluded the popular classes yet modernized the state by absorbing part of the revolution.'
  - id: clark-revolutionary-spring#u49-c5
    heading: 'Why 1848 speaks now: modernity in flux'
    span: 1803609:1804749
    why: 'Explains Clark''s claim that the waning of high modernity makes 1848 newly legible and the left-right axis obsolete.'
  - id: clark-revolutionary-spring#u49-c6
    heading: 'If a revolution is coming'
    span: 1806846:1807779
    why: 'The book''s closing hedged forecast and its final reversal of the historian''s gaze.'
