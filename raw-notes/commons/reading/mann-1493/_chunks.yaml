    why: 'Mann''s hedged argument that known deforestation drove lethal floods, strained imperial legitimacy and went unaddressed.'
  - id: mann-1493#u20-c4
    heading: 'Mao clears the last slopes: the vicious circle'
    span: 422406:423778
