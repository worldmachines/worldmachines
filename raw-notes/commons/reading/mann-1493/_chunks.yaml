source: mann-1493
units:
- nn: 1
  unit_id: prologue
  note_id: mann-1493-prologue
  span: 0:18855
  chunks:
  - id: mann-1493#u01-c1
    heading: 'Crosby''s ecological imperialism thesis'
    span: 4580:5862
    why: 'States the Columbian Exchange and ecological imperialism, the intellectual frame of the whole book, with its caveat that participants neither controlled nor understood the process.'
  - id: mann-1493#u01-c2
    heading: 'A new picture: exchange and the creation of a New World'
    span: 6242:6880
    why: 'Mann''s thesis statement that Columbus created rather than discovered a New World, and that the history of kings is supplemented by ecological and economic exchange.'
  - id: mann-1493#u01-c3
    heading: 'Two or three old worlds become one ecological system'
    span: 7811:8520
    why: 'The most concentrated statement of globalization as a single world system arising from ecological and economic exchange, with its consequence for European political power.'
  - id: mann-1493#u01-c4
    heading: 'Both sides of the globalization debate; the template'
    span: 9601:10683
    why: 'Mann''s stance on the globalization controversy and his claim that the sixteenth-century world market prefigures present-day disputes.'
  - id: mann-1493#u01-c5
    heading: 'The human exchange previewed'
    span: 14116:14746
    why: 'Frames the slave trade as the largest part of the migration and announces the Afro-Indian societies the final section will recover.'
  - id: mann-1493#u01-c6
    heading: 'Transculturation and the home condition of connection'
    span: 17842:18853
    why: 'Introduces Ortiz''s transculturation and Mann''s claim that convulsive connection has been the world''s normal condition since 1492.'
- nn: 2
  unit_id: ch01-seams-of-pangaea
  note_id: mann-1493-ch01-seams-of-pangaea
  span: 18855:40554
  chunks:
  - id: mann-1493#u02-c1
    heading: 'The era of globalization begins'
    span: 25168:25961
    why: 'States Mann''s thesis that founding La Isabela began permanent, two-hemisphere globalization, and distinguishes it from earlier long-distance trade.'
  - id: mann-1493#u02-c2
    heading: 'Globalization as biology: Pangaea and the Columbian Exchange'
    span: 25963:27356
    why: 'The book''s core conceptual claim, borrowing Crosby: Colón reknit the seams of Pangaea and the Columbian Exchange reshaped the planet''s ecology.'
  - id: mann-1493#u02-c3
    heading: 'The menagerie that made the modern Caribbean'
    span: 33655:34511
    why: 'Introduces the biological invasion of the Americas, with crops, livestock and hitchhiking species arriving with the first colonists.'
  - id: mann-1493#u02-c4
    heading: 'Scale insects, fire ants and the 1518 plague'
    span: 35618:37475
    why: 'A concrete, hedged case of unintended ecological consequences that colonists perceived only as a plague, mixing E. O. Wilson''s speculation with Las Casas''s eyewitness testimony.'
  - id: mann-1493#u02-c5
    heading: 'Disease as the larger cause of Taino collapse'
    span: 39027:39876
    why: 'Argues that Old World epidemics, not only Spanish violence, drove the demographic collapse, foundational for the book''s later treatment of labor, slavery and colonial institutions.'
  - id: mann-1493#u02-c6
    heading: 'A demographic catastrophe without parallel'
    span: 39878:40552
    why: 'Generalizes the Hispaniola collapse to the hemisphere (three-quarters or more dead) and closes with the surviving genetic trace of the Taino.'
- nn: 3
  unit_id: ch01-to-the-lighthouse
  note_id: mann-1493-ch01-to-the-lighthouse
  span: 40554:54467
  chunks:
  - id: mann-1493#u03-c1
    heading: 'Colón''s ambition and Joachimite faith'
    span: 45334:46491
    why: 'Gives Mann''s account of Colón''s dynastic and millenarian motives, including Colón''s own prediction that Chinese trade would fund a new crusade.'
  - id: mann-1493#u03-c2
    heading: 'The round-earth myth inverted'
    span: 46578:47206
    why: 'Debunks the schoolbook myth that Columbus proved the earth round, reframing the dispute as one about size.'
  - id: mann-1493#u03-c3
    heading: 'Asian luxuries and the middlemen problem'
    span: 48217:49373
    why: 'Explains the commercial and geopolitical demand (Islamic and Venetian/Genoese middlemen, Portugal''s African route) that made a western route attractive to Spain.'
  - id: mann-1493#u03-c4
    heading: 'Colón versus Eratosthenes and the expert committee'
    span: 50119:51695
    why: 'Shows the miscalculation of the earth''s circumference and the monarchs'' decision to gamble against expert opinion.'
  - id: mann-1493#u03-c5
    heading: 'Colón''s bitter death and the troubled monument'
    span: 51697:53745
    why: 'Parallels Colón''s messianic disappointment with the contested construction and 1992 inauguration of the lighthouse, setting up the thesis that answers the critics.'
  - id: mann-1493#u03-c6
    heading: 'The Homogenocene thesis'
    span: 53747:54465
    why: 'States Mann''s central thesis and defines the Homogenocene as the homogenizing outcome of the Columbian Exchange.'
- nn: 4
  unit_id: ch01-shiploads-of-silver
  note_id: mann-1493-ch01-shiploads-of-silver
  span: 54467:70416
  chunks:
  - id: mann-1493#u04-c1
    heading: 'Legazpi and Urdaneta as economics'' Colón'
    span: 55387:55764
    why: 'Mann''s thesis-framing of the monument: an economic counterpart to Colón''s ecological unification.'
  - id: mann-1493#u04-c2
    heading: 'The 1572 junks and a single network'
    span: 63014:64198
    why: 'Establishes the silk-for-silver exchange and Mann''s dating of a single world network with modern-era onset.'
  - id: mann-1493#u04-c3
    heading: 'China''s suspicion of the galleon trade'
    span: 64200:65406
    why: 'Explains why silver made China dependent and why the Ming court feared uncontrolled exchange.'
  - id: mann-1493#u04-c4
    heading: 'American crops and Ming destabilization'
    span: 65408:66301
    why: 'Mann''s argument linking the silver trade to sweet potatoes, maize, upland deforestation and regime strain.'
  - id: mann-1493#u04-c5
    heading: 'Spanish unease, Frank''s train, Homogenocene in Asia'
    span: 66303:67300
    why: 'Shows Spain''s own restrictions and Mann''s claim that Europe came out stronger, tying the trade to the Homogenocene.'
  - id: mann-1493#u04-c6
    heading: 'Rajah Sulayman and the first antiglobalization martyrs'
    span: 68725:69769
    why: 'Counter-narrative: the violence and dispossession under which Manila was founded.'
- nn: 5
  unit_id: ch01-reversals-of-fortune
  note_id: mann-1493-ch01-reversals-of-fortune
  span: 70416:97276
  chunks:
  - id: mann-1493#u05-c1
    heading: 'Potosí: the extraction machine and the silver route'
    span: 71782:72930
    why: 'Lays out the full silver supply chain from Andean mine to global convoy, and the peso as proto-world currency.'
  - id: mann-1493#u05-c2
    heading: 'Silver floods Europe: the price revolution'
    span: 79445:80169
    why: 'Mann''s qualified causal claim that American silver was an essential part of European inflation and crisis.'
  - id: mann-1493#u05-c3
    heading: 'Ruddiman''s hypothesis: epidemics, reforestation and the Little Ice Age'
    span: 86945:87875
    why: 'Presents the unit''s boldest argument that the Columbian Exchange altered the global carbon budget and climate.'
  - id: mann-1493#u05-c4
    heading: 'Malaria, slavery and the ecological corridor'
    span: 89545:90093
    why: 'Links disease ecology to the origin of the slave market and to the crops and pathogens that rode the slave ships.'
  - id: mann-1493#u05-c5
    heading: 'Ming collapse: silver, weather and American crops'
    span: 94051:94822
    why: 'Shows the same converging forces (silver, climate, crops) undoing the Ming, the Chinese counterpart of Spain''s crisis.'
  - id: mann-1493#u05-c6
    heading: 'From a tropical to a temperate world'
    span: 94824:96714
    why: 'States the unit''s title claim: the centuries-old geography of wealth and urban power flipped from south to north.'
- nn: 6
  unit_id: ch02-lowly-creatures-strange-land
  note_id: mann-1493-ch02-lowly-creatures-strange-land
  span: 97276:118160
  chunks:
  - id: mann-1493#u06-c1
    heading: 'Ballast, earthworms and Darwin'
    span: 99757:100779
    why: 'Introduces the earthworm as ecological engineer and supplies the chapter''s central image of small organisms reshaping history.'
  - id: mann-1493#u06-c2
    heading: 'Worms in wormless woodlands'
    span: 101562:102488
    why: 'Lays out the ecological cascade from introduced worms and the researcher''s admission that the long-term outcome is unknown.'
  - id: mann-1493#u06-c3
    heading: 'Jamestown as a case study in unintended consequences'
    span: 102490:104158
    why: 'States Mann''s thesis that Jamestown began the Columbian Exchange and the Homogenocene in English America despite its founders'' globalizing, commercial intentions.'
  - id: mann-1493#u06-c4
    heading: 'Few domesticated animals in the Americas'
    span: 107944:109639
    why: 'Explains how the lack of domestic animals shaped transport, labor, warfare and the effective scale of Tsenacomoco.'
  - id: mann-1493#u06-c5
    heading: 'Fences, fallow land and English blindness'
    span: 111874:113008
    why: 'Shows how English assumptions about property, fences and improvement made a used landscape look unused.'
  - id: mann-1493#u06-c6
    heading: 'Native fire and the artificial forest'
    span: 116242:117447
    why: 'Argues that the apparently pristine Virginia forest was a fire-managed, humanized landscape.'
- nn: 7
  unit_id: ch02-risk-pool
  note_id: mann-1493-ch02-risk-pool
  span: 118160:149378
  chunks:
  - id: mann-1493#u07-c1
    heading: 'Joint-stock company as risk pooling'
    span: 129724:130464
    why: 'States the mechanism by which private investors pooled risk to fund colonization the crown could not afford.'
  - id: mann-1493#u07-c2
    heading: 'North and Landes on institutions and Europe''s rise'
    span: 130466:131893
    why: 'Reports the institutional-economics explanation of European ascendancy that Mann sets against the Jamestown record.'
  - id: mann-1493#u07-c3
    heading: 'Jamestown''s bad site and bad water'
    span: 134416:135949
    why: 'Gives the ecological explanation for the colony''s early collapse that anchors the chapter''s argument.'
  - id: mann-1493#u07-c4
    heading: 'Powhatan''s calculated bet'
    span: 135951:136967
    why: 'Shows Powhatan''s strategic reasoning and the trade-for-grain logic that let the colony survive.'
  - id: mann-1493#u07-c5
    heading: 'Starving amid plenty'
    span: 142968:144122
    why: 'Explains the starving time through fear, gentry class habits and unfamiliarity with the local environment.'
  - id: mann-1493#u07-c6
    heading: 'Eight out of ten died'
    span: 145928:146542
    why: 'Supplies the mortality figure showing the human cost borne by colonists while investors pooled their losses.'
- nn: 8
  unit_id: ch02-english-flies
  note_id: mann-1493-ch02-english-flies
  span: 149378:176500
  chunks:
  - id: mann-1493#u08-c1
    heading: 'Pocahontas''s marriage as de facto cease-fire'
    span: 153952:154494
    why: 'Shows how the war paused on terms both sides could ignore culturally, creating the peace in which tobacco and Opechancanough''s infiltration both grew.'
  - id: mann-1493#u08-c2
    heading: '1619: representative democracy and chattel slavery arrive together'
    span: 157560:158428
    why: 'Ties the tobacco labor hunger to the origin of two long-lasting American institutions, with Mann''s caveat about the Africans'' unclear legal status.'
  - id: mann-1493#u08-c3
    heading: 'The 22 March 1622 attack'
    span: 160571:161297
    why: 'The core event that ended the Virginia Company, showing Opechancanough''s planning and the scale of the assault.'
  - id: mann-1493#u08-c4
    heading: 'Tobacco exhausts soil and displaces the fallow-cycle commons'
    span: 164268:165055
    why: 'States the concrete ecological mechanism by which English monoculture eroded Powhatan land-use, with a modern agronomist''s testimony.'
  - id: mann-1493#u08-c5
    heading: 'Remaking Tsenacomoco into a European landscape (nascent Homogenocene)'
    span: 170038:170996
    why: 'Mann''s compressed thesis for the section: ecological transformation made the land hostile to Indians and familiar to Europeans, and names the Homogenocene.'
  - id: mann-1493#u08-c6
    heading: 'Tobacco as the leading edge of the Columbian Exchange'
    span: 174286:174860
    why: 'Reframes the Virginia Company''s supposed failure as integrating Virginia into the global marketplace via the first American species to spread on every continent.'
- nn: 9
  unit_id: ch03-extractive-states-seasoning
  note_id: mann-1493-ch03-extractive-states-seasoning
  span: 176500:204279
  chunks:
  - id: mann-1493#u09-c1
    heading: 'What çiçiones meant'
    span: 180572:181426
    why: 'The dictionary evidence behind the hedged claim that Colón recorded malaria at La Isabela.'
  - id: mann-1493#u09-c2
    heading: 'Endemic malaria and extractive states'
    span: 183694:185486
    why: 'States Mann''s claim that malaria differs from epidemics by becoming endemic, and reports the Acemoglu-Johnson-Robinson extractive-states thesis.'
  - id: mann-1493#u09-c3
    heading: 'From tobacco and sugar to slavery, with caveats'
    span: 185488:186631
    why: 'Mann''s causal chain from ecological introductions to the African slave trade and his explicit limit on it.'
  - id: mann-1493#u09-c4
    heading: 'Falciparum from Africa, vivax from Europe'
    span: 192421:192904
    why: 'Explains the geography of the two malarias that underlies later differential settlement and slavery arguments.'
  - id: mann-1493#u09-c5
    heading: 'Draining the fens made an inferno of vivax'
    span: 194030:195133
    why: 'Concrete evidence that a land-improvement policy created a mortality catastrophe, and the source of the English malaria belt.'
  - id: mann-1493#u09-c6
    heading: 'Seasoning in Virginia'
    span: 201811:202974
    why: 'Defines seasoning as a colonial institution and gives its mortality trajectory.'
- nn: 10
  unit_id: ch03-about-face
  note_id: mann-1493-ch03-about-face
  span: 204279:221889
  chunks:
  - id: mann-1493#u10-c1
    heading: 'Slaves cost more than servants'
    span: 207231:208014
    why: 'Gives Menard''s price evidence that the switch to slavery ran against simple economics, establishing the puzzle.'
  - id: mann-1493#u10-c2
    heading: 'Adam Smith on why free labor should win'
    span: 208016:209479
    why: 'Reports Smith''s argument that slavery was economically inferior, the baseline Mann then shows was ignored.'
  - id: mann-1493#u10-c3
    heading: 'American slavery as lifelong brutality'
    span: 210323:210816
    why: 'States the puzzle at full strength: chattel slavery lacked every historical incentive and workaround yet arose anyway.'
  - id: mann-1493#u10-c4
    heading: 'The 1680-1700 pivot'
    span: 213659:214072
    why: 'Gives the chapter''s central empirical fact and Mann''s framing of it as a turning point in world history.'
  - id: mann-1493#u10-c5
    heading: 'Disease destroys New Edinburgh'
    span: 220344:220757
    why: 'Mann''s key evidence that disease, not supply, hostility or terrain, killed the Scottish Panama colony.'
  - id: mann-1493#u10-c6
    heading: 'Why Europeans could not be the forced labor'
    span: 221501:221887
    why: 'Delivers Mann''s causal claim linking malarial mortality among Europeans to the search for enslaved African labor.'
- nn: 11
  unit_id: ch03-no-distempers-villa-plasmodia
  note_id: mann-1493-ch03-no-distempers-villa-plasmodia
  span: 221889:248476
  chunks:
  - id: mann-1493#u11-c1
    heading: 'Indian slaves were cheap and amortizable'
    span: 227272:228489
    why: 'Gives the economic logic and census figures behind Carolina''s early preference for Indian slaves over European servants.'
  - id: mann-1493#u11-c2
    heading: 'A speculative native-cultural divide at the Chesapeake'
    span: 229402:230349
    why: 'Mann''s hedged hypothesis linking indigenous slave-trading societies to the later slave/non-slave boundary.'
  - id: mann-1493#u11-c3
    heading: 'Inherited immunity becomes a wellspring for enslavement'
    span: 236294:237487
    why: 'States the core argument that biological advantage was converted into social disadvantage, and rebuts racial-superiority reasoning.'
  - id: mann-1493#u11-c4
    heading: 'Curtin''s mortality comparisons'
    span: 239038:240170
    why: 'The main quantitative evidence for the European-African mortality gap in malarial zones, tied to the Homogenocene.'
  - id: mann-1493#u11-c5
    heading: 'Villa Plasmodia and the plantation'
    span: 242361:243561
    why: 'Proposes, with hedging, that plantation geography and architecture track malaria ecology.'
  - id: mann-1493#u11-c6
    heading: 'Malaria did not cause slavery'
    span: 245148:246159
    why: 'Mann''s precise causal claim: differential survival and competitive imitation among planters, not intentional exploitation of immunity.'
- nn: 12
  unit_id: ch03-yellow-jack-war-mosquitoes
  note_id: mann-1493-ch03-yellow-jack-war-mosquitoes
  span: 248476:271143
  chunks:
  - id: mann-1493#u12-c1
    heading: 'Yellow fever arrives on the slave ships'
    span: 250750:252144
    why: 'Establishes the differential-immunity mechanism (African childhood disease, Caribbean plague for non-immunes) that underlies the shift to slavery and the rest of the unit.'
  - id: mann-1493#u12-c2
    heading: 'Sugar plantations as yellow fever factories'
    span: 256000:256765
    why: 'A concrete case of an economic system unintentionally engineering its own disease ecology, via McNeill''s analysis of sugar pots.'
  - id: mann-1493#u12-c3
    heading: 'Sugar despotism and offshore ownership'
    span: 260701:261268
    why: 'States the causal chain from disease zones to absentee ownership and coercive plantation rule.'
  - id: mann-1493#u12-c4
    heading: 'Extractive states and the denial of institutions'
    span: 262033:263448
    why: 'Mann''s report of the Acemoglu-Johnson-Robinson argument about why extractive institutions block local competition and industrialization, with the Booker example.'
  - id: mann-1493#u12-c5
    heading: 'Malaria and the Union army'
    span: 266102:266935
    why: 'Gives the quantitative basis for the claim that entering the Plasmodium zone shaped the Civil War''s course.'
  - id: mann-1493#u12-c6
    heading: 'Revolutionary mosquitoes at Yorktown'
    span: 270320:271141
    why: 'The unit''s most pointed claim about the mosquito as a contingent actor in the founding of the United States, with McNeill''s quotations and Mann''s hedged credit to human leadership.'
- nn: 13
  unit_id: ch04-extra-effort-merchants-pirates
  note_id: mann-1493-ch04-extra-effort-merchants-pirates
  span: 271143:293339
  chunks:
  - id: mann-1493#u13-c1
    heading: 'The insularity thesis: Landes, Jones and Hall'
    span: 274598:275853
    why: 'States the cultural-deficiency explanation of China''s retreat from the sea, which Mann reports in order to complicate it.'
  - id: mann-1493#u13-c2
    heading: 'Goldstone''s counter: nothing there to justify the cost'
    span: 275855:276696
    why: 'Gives the rival economic reading of the shutdown of Zheng He''s voyages, with the moon-landing analogy.'
  - id: mann-1493#u13-c3
    heading: 'Why China let in the flood'
    span: 278442:279549
    why: 'Mann''s thesis statement: the political failure of the trade ban and the silver shortage pushed China into the galleon trade.'
  - id: mann-1493#u13-c4
    heading: 'Ban-and-tribute and the delirium of smuggling'
    span: 280116:281050
    why: 'Shows the ban as a state-control device for profit whose enforcement gap created the smuggling economy.'
  - id: mann-1493#u13-c5
    heading: 'Wokou: merchants were pirates, pirates were merchants'
    span: 281052:282057
    why: 'Corrects the image of wokou as Japanese pirates and presents them as a merchant-smuggler underclass created by the ban.'
  - id: mann-1493#u13-c6
    heading: 'Capitulation and the turn to silver (1567)'
    span: 292549:293337
    why: 'Culminates the argument: the Ming lost control of its coast, rescinded the ban in 1567, and needed silver, opening the silk-for-silver trade.'
- nn: 14
  unit_id: ch04-out-of-money
  note_id: mann-1493-ch04-out-of-money
  span: 293339:307476
  chunks:
  - id: mann-1493#u14-c1
    heading: 'Commodity money at the mercy of shocks'
    span: 296105:296634
    why: 'Mann''s core conceptual contrast between commodity and fiat money, with the cowry-shell example of external shock.'
  - id: mann-1493#u14-c2
    heading: 'Song and Yuan paper money to hyperinflation'
    span: 296962:298001
    why: 'Compresses the history of Chinese fiat money from Song printing to Yuan hyperinflation and dynastic collapse.'
  - id: mann-1493#u14-c3
    heading: 'Ming coin bans and a currency-less empire'
    span: 299472:300485
    why: 'States Mann''s diagnosis that Ming policy failure, driven by court intrigue, left the empire without functioning money by the wokou era.'
  - id: mann-1493#u14-c4
    heading: 'Coins voided with each reign'
    span: 300487:300990
    why: 'Shows the concrete mechanism of monetary instability, with Mann''s hedge and an official-history quotation.'
  - id: mann-1493#u14-c5
    heading: 'Silver ingots and privatized money'
    span: 304159:305298
    why: 'Documents the bottom-up shift to privately certified silver as money when state currencies lost trust.'
  - id: mann-1493#u14-c6
    heading: 'Silverization and war with its own money supply'
    span: 305874:306801
    why: 'The hinge argument: taxation in silver created enormous demand for a metal China could not mine, forcing reliance on wokou and, ultimately, Manila.'
- nn: 15
  unit_id: ch04-treasure-of-the-world
  note_id: mann-1493-ch04-treasure-of-the-world
  span: 307476:328636
  chunks:
  - id: mann-1493#u15-c1
    heading: 'Potosí''s ledge and the highest, richest city'
    span: 308402:309253
    why: 'Establishes the scale of the strike, Andean metallurgical skill, and Potosí''s population as a world-class city.'
  - id: mann-1493#u15-c2
    heading: 'Mercury amalgamation and the Huancavelica-Potosí marriage'
    span: 310727:311985
    why: 'Explains the technology that made mass silver production possible and the state''s seizure of the mercury supply.'
  - id: mann-1493#u15-c3
    heading: 'Toledo''s labor quotas and the end of Indian technology'
    span: 311987:312766
    why: 'Shows how the new technology redefined natives as pure labor and how Mann hedges the mortality claims.'
  - id: mann-1493#u15-c4
    heading: 'Conditions in the Potosí mines'
    span: 314421:315314
    why: 'Documents the human cost of the silver system with contemporary testimony.'
  - id: mann-1493#u15-c5
    heading: 'A river of silver and the universal peso'
    span: 325742:327063
    why: 'Gives Flynn and Giráldez''s headline quantities and the monetary-shock argument in Flynn''s own words.'
  - id: mann-1493#u15-c6
    heading: 'Price collapse, European upheaval, and silver to Yuegang'
    span: 327065:328634
    why: 'States the causal chain from silver glut to Spanish fiscal crisis and European revolts, with Mann''s hedge, and the pivot to China.'
- nn: 16
  unit_id: ch04-wooden-noses
  note_id: mann-1493-ch04-wooden-noses
  span: 328636:346320
  chunks:
  - id: mann-1493#u16-c1
    heading: 'Junks, petty merchants and debt bondage'
    span: 329468:330739
    why: 'Shows the scale of the Yuegang trade and its foundation in debt and small merchants, via historian Li Jinming.'
  - id: mann-1493#u16-c2
    heading: 'The Parián: a Chinese quarter built by the silver trade'
    span: 333120:334779
    why: 'Describes the creation of the Parián as a mirrored quarantine and the Chinese city that grew inside it.'
