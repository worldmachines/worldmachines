  chunks:
  - id: mann-1493#u32-c1
    heading: 'Catarina''s odyssey from Mughal court to Puebla'
    span: 708725:710491
    why: 'Compresses the trans-Asian slave circuit, Portuguese piracy and Manila entrepot that delivered one Asian girl to New Spain, with Mann''s sourcing hedges intact.'
  - id: mann-1493#u32-c2
    heading: 'Asians via the galleon trade'
    span: 712259:713488
    why: 'Gives Slack''s population estimates and the crew evidence that make the Asian presence in New Spain a structural feature of the galleon trade.'
  - id: mann-1493#u32-c3
    heading: 'Chinos, samurai and mixed militias'
    span: 714152:715492
    why: 'Shows colonial authorities improvising around racial rules to guard the silver road and coast, an example of mixed societies.'
  - id: mann-1493#u32-c4
    heading: 'The Chinese barbers of the Plaza Mayor'
    span: 718369:719226
    why: 'A concrete case of economic competition and guild protectionism against Asian migrants, with Mann''s reading of the petition''s real motive.'
  - id: mann-1493#u32-c5
    heading: 'The world''s first truly global city'
    span: 722339:722758
    why: 'States Mann''s thesis that Mexico City was the Homogenocene for Homo sapiens and the human branch of the Columbian Exchange.'
  - id: mann-1493#u32-c6
    heading: 'The first twenty-first-century city'
    span: 723351:725195
    why: 'Mann''s claim that colonial Mexico City was the first globalized megalopolis, with his qualification that modernity is patchy.'
- nn: 33
  unit_id: ch09-in-calabar
  note_id: mann-1493-ch09-in-calabar
  span: 725197:732808
  chunks:
  - id: mann-1493#u33-c1
    heading: 'Calabar, the secret city on the Bay of All Saints'
    span: 725241:726578
    why: 'Introduces quilombos, their Indian-African composition, terrain defenses, and the scale of Calabar and Liberdade against the backdrop of the Salvador slave harbor.'
  - id: mann-1493#u33-c2
    heading: 'Hunted yet traded with: quilombos and the weak state'
    span: 726580:727660
    why: 'Shows the ambivalent relation between colonial port and fugitive ring, including trade in goods and the persistence of illegal status after abolition.'
  - id: mann-1493#u33-c3
    heading: 'Maroons across the hemisphere'
    span: 728967:729753
    why: 'Generalizes from one Brazilian site to thousands of fugitive communities and supplies Reis''s phrase "inventing liberty" and the terminology.'
  - id: mann-1493#u33-c4
    heading: 'A meeting of Africans and Indians'
    span: 729755:730383
    why: 'States Mann''s reframing thesis that the great encounter was largely between Africans and Indians, out of European sight.'
  - id: mann-1493#u33-c5
    heading: 'Agency against the victim narrative'
    span: 730385:731326
    why: 'Pairs the mortality and misery of slavery with Mann''s argument that Africans and Indians exercised will and allied in complex ways.'
  - id: mann-1493#u33-c6
    heading: 'Maroon victories from Suriname to Haiti'
    span: 731328:732358
    why: 'Gives the concrete cases in which maroons won recognition, treaties or a nation, which underpin the claim that freedom was often achieved.'
- nn: 34
  unit_id: ch09-africans-in-charge
  note_id: mann-1493-ch09-africans-in-charge
  span: 732808:765616
  chunks:
  - id: mann-1493#u34-c1
    heading: 'The myth of African helplessness'
    span: 736622:737184
    why: 'States Mann''s thesis that Africans controlled the supply of slaves and negotiated as equals.'
  - id: mann-1493#u34-c2
    heading: 'Labor, not land, as property in West Africa'
    span: 738018:739030
    why: 'Gives the property-law explanation, via Thornton, for why African rulers traded in people.'
  - id: mann-1493#u34-c3
    heading: 'From known captives to anonymous pieces'
    span: 746991:748418
    why: 'Core analytic claim about how plantation chattel slavery anonymized labor and severed the owner-slave bond.'
  - id: mann-1493#u34-c4
    heading: 'Importing one''s own destroyers'
    span: 753229:754035
    why: 'Ties Hispaniola maroons to Palmares and names the colonial fear of Afro-Indian states.'
  - id: mann-1493#u34-c5
    heading: 'Palmares as a mixed society'
    span: 754037:755194
    why: 'Clearest description of the creole African-Indian-European makeup of a maroon state.'
  - id: mann-1493#u34-c6
    heading: 'The fall of Macaco'
    span: 764005:765614
    why: 'Narrates Palmares''s destruction and Zumbi''s death and closes on the persistence of maroon communities.'
- nn: 35
  unit_id: ch09-in-the-isthmus
  note_id: mann-1493-ch09-in-the-isthmus
  span: 765616:792471
  chunks:
  - id: mann-1493#u35-c1
    heading: 'Africans in the isthmus before the Spanish'
    span: 772418:773531
    why: 'Mann''s own inference that Africans were probably the first transatlantic settlers on the mainland and that the isthmus sheltered escaped slaves, which sets up the chapter''s maroon theme.'
  - id: mann-1493#u35-c2
    heading: 'The road as chokepoint for the empire''s silver'
    span: 774719:776442
    why: 'States the strategic role of the Panamá to Nombre de Dios road for Potosí silver and the environmental and technological limits on controlling it.'
  - id: mann-1493#u35-c3
    heading: 'Africans outnumber Europeans; the maroon problem'
    span: 778333:778835
    why: 'Compact statement of how slave labor demand produced multiethnic fugitive communities that threatened the silver road.'
  - id: mann-1493#u35-c4
    heading: 'Bayano''s maroon kingdom and the betrayal'
    span: 780034:782950
    why: 'Concrete portrait of a mixed African and Indian maroon polity (via Tardieu) and of the Spanish response by deception.'
  - id: mann-1493#u35-c5
    heading: 'Disease, cost, and the principal-agent stalemate'
    span: 782952:785454
    why: 'Ties malaria and yellow fever to colonial capacity and explains, via the principal-agent problem, why Spain could not fund a campaign against the maroons.'
  - id: mann-1493#u35-c6
    heading: 'Drake''s raids as a triumph for the maroons'
    span: 791811:792469
    why: 'Mann''s reinterpretation of Drake''s Panama expedition, placing maroon agency at the center of the Anglo-Franco-Afro-Indian raids on Spanish silver.'
- nn: 36
  unit_id: ch09-capitulations
  note_id: mann-1493-ch09-capitulations
  span: 792471:822035
  chunks:
  - id: mann-1493#u36-c1
    heading: 'Why ''capitulation'' meant freedom'
    span: 795886:796653
    why: 'Mann''s thesis that maroons won real autonomy through negotiation, with the Crown''s word for it inverted.'
  - id: mann-1493#u36-c2
    heading: 'Yanga and San Lorenzo de los Negros'
    span: 798515:799703
    why: 'Concrete case of a maroon confederation forcing eleven demands and a legally recognized free town, ending in anonymity.'
  - id: mann-1493#u36-c3
    heading: 'Seminole strategy and disease'
    span: 808656:810011
    why: 'Shows disease ecology used deliberately as a weapon and how a liberty offer broke an Indian-maroon alliance.'
  - id: mann-1493#u36-c4
    heading: 'Toussaint, yellow fever and the Louisiana Purchase'
    span: 811810:813005
    why: 'The chapter''s clearest claim that mosquito-borne disease, part of the Columbian Exchange, undid slavery and reshaped North American geopolitics.'
  - id: mann-1493#u36-c5
    heading: 'Suriname: absentee planters and missing institutions'
    span: 818206:818998
    why: 'Mann''s institutional argument linking absentee colonial extraction to lasting poverty.'
  - id: mann-1493#u36-c6
    heading: 'Saramaka rights and the ongoing dispute'
    span: 820460:821741
    why: 'Ties the colonial maroon treaties to a present legal fight over land, logging and the tropical forest.'
- nn: 37
  unit_id: ch09-shake-it-ox-dona-rosario
  note_id: mann-1493-ch09-shake-it-ox-dona-rosario
  span: 822035:847591
  chunks:
  - id: mann-1493#u37-c1
    heading: 'Free while pretending: Mazagão maroons and the tended forest'
    span: 827362:828258
    why: 'Shows the mutual fiction that let Mazagão''s maroons stay left alone and Mann''s claim that their tending produced forest mistaken for wilderness.'
  - id: mann-1493#u37-c2
    heading: 'Bumba-meu-boi as the tale of the quilombo'
    span: 830146:831451
    why: 'Mann''s reading of a quilombo folk drama as a memory of African-Indian alliance and the chapter''s title image.'
  - id: mann-1493#u37-c3
    heading: 'After abolition: hidden quilombos and the generals'' blank map'
    span: 833004:834045
    why: 'Illustrates how a state that could not see maroon and Indian settlements treated them as emptiness to be filled.'
  - id: mann-1493#u37-c4
    heading: 'The 1988 constitution and the unforeseen scale of quilombo land'
    span: 835543:836407
    why: 'Gives the constitutional recognition of quilombos and the estimate of their surviving number and territory, with Mann''s hedges.'
  - id: mann-1493#u37-c5
    heading: 'Phone, freezer and title: Dona Rosario stops the surveyors'
    span: 845194:845615
    why: 'The concrete case of how small infrastructure and capital reversed a centuries-old pattern of land seizure.'
  - id: mann-1493#u37-c6
    heading: 'The world''s richest garden'
    span: 847163:847589
    why: 'Mann''s closing thesis that the Amazon''s valued areas are the product of maroon tending.'
- nn: 38
  unit_id: ch10-fractured-cerebration-staircases
  note_id: mann-1493-ch10-fractured-cerebration-staircases
  span: 847591:867681
  chunks:
  - id: mann-1493#u38-c1
    heading: 'Every plant in ''Bahay Kubo'' is an introduced species'
    span: 849040:849485
    why: 'States the Coda''s opening paradox that the Philippines'' most ''traditional'' garden is a product of the Columbian Exchange.'
  - id: mann-1493#u38-c2
    heading: 'Mann''s own fractured cerebration'
    span: 851641:852379
    why: 'Names the chapter''s central ambivalence by implicating Mann himself in both promoting and denouncing globalization.'
  - id: mann-1493#u38-c3
    heading: 'The worms were native: mahogany demand, not invasives'
    span: 858882:859413
    why: 'Reverses the invasive-species narrative by tracing the terrace-destroying worms to logging driven by global demand.'
  - id: mann-1493#u38-c4
    heading: 'Radiocarbon dates: terraces as a galleon-trade monument'
    span: 862045:863188
    why: 'Presents the archaeological evidence that most of the ''age-old'' terraces are a few centuries old and arose from the galleon-trade era.'
  - id: mann-1493#u38-c5
    heading: 'Eighth Wonder and the global-market dilemma'
    span: 866303:867623
    why: 'Lays out the opposing activist arguments over whether integration into global markets is the problem or the remedy.'
- nn: 39
  unit_id: ch10-on-the-boat
  note_id: mann-1493-ch10-on-the-boat
  span: 867681:880812
  chunks:
  - id: mann-1493#u39-c1
    heading: 'Bulalacao waiting for the world'
    span: 871255:872021
    why: 'Shows the peripheral site of the Spain-China encounter now hoping to be pulled into global commerce.'
  - id: mann-1493#u39-c2
    heading: 'Rudmar and the stripped hills'
    span: 874265:874910
    why: 'The local ecological cost of global demand for timber, told through a resident.'
  - id: mann-1493#u39-c3
    heading: 'Externalities and their distribution'
    span: 875901:876891
    why: 'Mann''s clearest argument that the distribution of globalization''s costs and benefits matters more than their magnitude.'
  - id: mann-1493#u39-c4
    heading: 'Wanting the world and resisting it'
    span: 877646:878659
    why: 'The chapter''s central reflection on Homogenocene, identity and fragmentation, posed as an open question.'
  - id: mann-1493#u39-c5
    heading: 'Gardens as owned change'
    span: 879554:880173
    why: 'Mann''s constructive counter-model: change whose consequences the actor experiences avoids externalities.'
  - id: mann-1493#u39-c6
    heading: 'The Columbian Exchange remade at home'
    span: 880279:880810
    why: 'Closes the chapter by showing the exchange appropriated and adapted by a family rather than merely imposed.'
- nn: 40
  unit_id: appendix-a-fighting-words
  note_id: mann-1493-appendix-a-fighting-words
  span: 880812:892514
  chunks:
  - id: mann-1493#u40-c1
    heading: 'Three terminological problems'
    span: 880840:881457
    why: 'States Mann''s threefold framing of why historical naming is fraught, which governs his whole scheme.'
  - id: mann-1493#u40-c2
    heading: 'Chino and sangley in the Parián'
    span: 882250:883350
    why: 'Concrete case of a period label (chino) that was pejorative-adjacent, inaccurate and locally specific, tied to the Manila silver trade.'
  - id: mann-1493#u40-c3
    heading: 'Mann''s rule: geographic origin, modern terms'
    span: 886043:887106
    why: 'Gives the operative naming convention of the book, with its admitted anachronism and examples.'
  - id: mann-1493#u40-c4
    heading: 'Race did not exist at the dawn of globalization'
    span: 887108:887861
    why: 'Mann''s claim that early Iberian enslavement rested on religion and status rather than modern racial concepts.'
  - id: mann-1493#u40-c5
    heading: 'Genetic race versus social race'
    span: 889553:890583
    why: 'Distinguishes genetic from social definitions of race and explains why Mann uses geographic labels.'
  - id: mann-1493#u40-c6
    heading: 'Why “Indian” stays'
    span: 891966:892512
    why: 'Justifies his most consequential terminology choice for the Americas'' original inhabitants.'
- nn: 41
  unit_id: appendix-b-globalization-in-beta
  note_id: mann-1493-appendix-b-globalization-in-beta
  span: 892514:901360
  chunks:
  - id: mann-1493#u41-c1
    heading: 'A first pass at globalization and what Fujian actually traded'
    span: 892839:894129
    why: 'States Mann''s framing of a fourteenth-century Eurasian exchange system with its overland and maritime routes, and corrects Polo on the bulk goods that made Fujian rich.'
  - id: mann-1493#u41-c2
    heading: 'Zaytun as the world''s biggest port'
    span: 894131:895455
    why: 'Gives the concrete portrait of a multi-ethnic, multi-religious, engineered trading metropolis and links it to Colón''s motive for sailing.'
  - id: mann-1493#u41-c3
    heading: 'The Pu family and the 1276 handover to the Mongols'
    span: 896130:897044
    why: 'Shows how merchant control of port, militia and navy shaped a dynastic transition and how ''foreign'' status became a privilege that Chinese could acquire by converting.'
  - id: mann-1493#u41-c4
    heading: 'Fujian''s hybrid Islam and factional split'
    span: 897046:897930
    why: 'Illustrates religious syncretism and the sectarian divisions that later fed the militia war.'
  - id: mann-1493#u41-c5
    heading: 'Militia war, destruction of Zaytun and the move to Yuegang'
    span: 899541:900982
    why: 'Narrates how private militias and dynastic collapse destroyed the port, and how the Ming let it silt up while its families moved to Yuegang.'
  - id: mann-1493#u41-c6
    heading: 'Continuity between the two passes at globalization'
    span: 900984:901359
    why: 'Mann''s closing claim that the sixteenth-century silver trade rested on inherited merchant lineages and an older, unintended globalizing drive.'
