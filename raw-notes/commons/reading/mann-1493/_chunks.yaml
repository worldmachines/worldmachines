    heading: 'Spain''s conquest dream gives way to accommodation'
    span: 334781:336094
    why: 'Shows Spain''s imperial mission collapsing into fear of China and concession to a Chinese enclave.'
  - id: mann-1493#u16-c4
    heading: 'Chinese competition and the boatload of wooden noses'
    span: 336096:337281
    why: 'Bishop Salazar''s testimony that Chinese tradesmen displaced Spanish ones, with the failed wooden-nose anecdote that gives the chapter its title.'
  - id: mann-1493#u16-c5
    heading: 'Silver flowing to China, and the smuggled surplus'
    span: 340203:341445
    why: 'Gives the estimate of how much American silver went to China and Madrid''s failed attempt to limit it.'
  - id: mann-1493#u16-c6
    heading: 'Mulberry landscapes and Chinese silk undercutting Spain'
    span: 342953:343966
    why: 'Ties silver demand to Ming decrees and the transformation of Chinese farmland into single-species mulberry landscapes.'
- nn: 17
  unit_id: ch04-magic-mountain
  note_id: mann-1493-ch04-magic-mountain
  span: 346320:363157
  chunks:
  - id: mann-1493#u17-c1
    heading: 'Conscription, hair-cutting, and the 1593 mutiny'
    span: 347128:348007
    why: 'Shows the coercive labor relation between Manila''s governor and its Chinese traders that seeds the later cycle of violence.'
  - id: mann-1493#u17-c2
    heading: 'Three mandarins and the magic mountain'
    span: 348663:349597
    why: 'The Ming embassy in search of a mountain of silver captures the mutual misreading and the mythic pull of American silver on China.'
  - id: mann-1493#u17-c3
