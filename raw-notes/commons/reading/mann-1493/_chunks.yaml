  - id: mann-1493#u20-c5
    heading: 'Smil on the waste of human labor'
    span: 423780:424265
    why: 'States the human cost (mass migration, depopulated villages) and quotes Smil''s blunt verdict.'
  - id: mann-1493#u20-c6
    heading: 'Dead trees in fish-scale pits and the silver-trade legacy'
    span: 427332:428408
