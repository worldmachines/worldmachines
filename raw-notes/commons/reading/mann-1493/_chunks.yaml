    span: 351178:352779
    why: 'The Chinese counter-narrative to the Spanish official version, reported by Mann with attention to what Spanish officials left out.'
  - id: mann-1493#u17-c4
    heading: 'Trade as market and trade as statecraft'
    span: 356552:357298
    why: 'States Mann''s central conceptual claim, drawn from Findlay and O''Rourke, that trade has a political role in which both sides usually do not win.'
  - id: mann-1493#u17-c5
    heading: 'Manila''s fractured imperatives'
    span: 357930:358956
    why: 'Applies the two-roles argument to Spain''s Manila, explaining why the massacre cycle repeated.'
  - id: mann-1493#u17-c6
    heading: 'Silver-weight taxes and the Ming revenue collapse'
    span: 360399:361374
    why: 'Gives the mechanism, and Atwell''s contested thesis, by which silver dependence helped bring down the Ming.'
  - id: mann-1493#u17-c7
    heading: 'Flynn on the production cost of silver'
    span: 362372:363082
    why: 'Flynn''s own words on the real cost to China of securing commodity money, which qualifies the picture of silver as pure windfall.'
- nn: 18
  unit_id: ch05-hidden-passengers
  note_id: mann-1493-ch05-hidden-passengers
  span: 363157:391851
  chunks:
  - id: mann-1493#u18-c1
    heading: 'Tobacco takes over Chinese elite life'
    span: 365198:366001
    why: 'Shows how quickly and thoroughly a New World plant was absorbed into Chinese elite culture, through Mann''s reading of Brook.'
  - id: mann-1493#u18-c2
    heading: 'Snuff in England versus tobacco in China'
    span: 368679:369024
    why: 'Mann''s thesis sentence: identical commodities have different impacts depending on the receiving ecological and social context.'
  - id: mann-1493#u18-c3
    heading: 'Chen Zhenlong smuggles the sweet potato'
    span: 372760:374078
    why: 'The emblematic story of American crops entering China, with Mann''s caveat about the partisan family source.'
  - id: mann-1493#u18-c4
    heading: 'Mu Tianyan and the frozen money supply'
    span: 380282:381014
    why: 'Ties the Qing coastal ban to deflation and China''s dependence on imported silver.'
  - id: mann-1493#u18-c5
    heading: 'Marginal highlands and jade rice'
    span: 382982:383970
    why: 'Explains the agronomic logic by which American crops opened unfarmed uplands to poor migrants.'
  - id: mann-1493#u18-c6
    heading: 'Weighing the causes of China''s population boom'
    span: 389939:391849
    why: 'Mann''s hedged causal conclusion, combining Qing policy with the effect of American crops.'
- nn: 19
  unit_id: ch05-malthusian-interlude-mountains
  note_id: mann-1493-ch05-malthusian-interlude-mountains
  span: 391851:416139
  chunks:
  - id: mann-1493#u19-c1
    heading: 'Hong Liangji''s household arithmetic and the answer of Heaven-and-earth'
    span: 393585:395168
    why: 'Hong''s own words set out the population-versus-farmland squeeze that Mann treats as a precursor to Malthus.'
  - id: mann-1493#u19-c2
    heading: 'Hong captured the trap better than Malthus'
    span: 398432:399430
    why: 'This is Mann''s central conceptual claim that the Malthusian trap is an ecological-then-social collapse and not a food-versus-mouths race.'
  - id: mann-1493#u19-c3
    heading: 'Tobacco drains the land and pushes farmers into the hills'
    span: 402101:403076
    why: 'It explains how a cash crop, and not just population, drove the shift off rice and the move toward upland cultivation.'
  - id: mann-1493#u19-c4
    heading: 'Maize and sweet potatoes in every crevice'
    span: 404197:404670
    why: 'It gives the scale of the Columbian-crop expansion and the deforestation-depletion cycle it created.'
  - id: mann-1493#u19-c5
    heading: 'Rising flood frequency from Song to Qing'
    span: 409385:410731
    why: 'The quantified flood record links highland deforestation to repeated disasters in China''s agricultural core.'
  - id: mann-1493#u19-c6
    heading: 'Why officials could not stop it: a collective-action problem'
    span: 414428:415118
    why: 'It supplies the institutional mechanism (a tax loophole and diffuse risk) behind the state''s failure to act on a disaster it could see.'
- nn: 20
  unit_id: ch05-unlearning-from-dazhai
  note_id: mann-1493-ch05-unlearning-from-dazhai
  span: 416139:428410
  chunks:
