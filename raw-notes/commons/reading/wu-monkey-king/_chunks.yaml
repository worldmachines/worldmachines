    heading: What the young women of Western Liang would have done
    char_start: 501229
    char_end: 501524
    why: This is the one moment the Land of Women's gender inversion is stated as genuine danger rather
      than played purely for laughs.
  - id: wu-monkey-king#u29-c5
    label: c5
    heading: The diversion-and-theft plan at Dissolving-Maleness Mountain
    char_start: 502067
    char_end: 502783
    why: 'Shows the pilgrims'' recurring two-part tactic for guarded magical resources: Monkey draws off
      the guardian while a companion seizes the prize.'
- nn: 30
  unit_id: chapter-30
  note_id: wu-monkey-king-chapter-30
  span: 504982:516510
  chunks:
  - id: wu-monkey-king#u30-c1
    label: c1
    heading: Arrival in the Land of Women
    char_start: 504998
    char_end: 506137
    why: Establishes the chapter's comic gender-inverted premise through the crowd's reaction to the male
      travelers and Pigsy's panicked defense.
  - id: wu-monkey-king#u30-c2
    label: c2
    heading: The queen's council decides to keep Tripitaka
    char_start: 506980
    char_end: 507993
    why: Reveals the court's real calculus—an heir is needed, the disciples are hideous—making explicit
      that isolating Tripitaka is a deliberate strategy, not romance.
  - id: wu-monkey-king#u30-c3
    label: c3
    heading: Monkey's sham-marriage stratagem
    char_start: 510880
    char_end: 511667
    why: The chapter's central trick, spelled out step by step, showing Monkey working within a hostile
      system's own procedures to free Tripitaka.
  - id: wu-monkey-king#u30-c4
    label: c4
    heading: Escape and abduction
    char_start: 515478
    char_end: 516508
    why: The plan's success is immediately undercut by a new supernatural threat, the chapter's cliffhanger
      turn.
- nn: 31
  unit_id: chapter-31
  note_id: wu-monkey-king-chapter-31
  span: 516510:530245
  chunks:
  - id: wu-monkey-king#u31-c1
    label: c1
    heading: Monkey the bee finds Tripitaka's captors mid-celebration
    char_start: 517410
    char_end: 518114
    why: Establishes the infiltration method and the cave's grotesque hospitality (human-flesh buns) that
      defines the episode's horror-comedy register.
  - id: wu-monkey-king#u31-c2
    label: c2
    heading: The fiend's wooing of the captive Tripitaka
    char_start: 518116
    char_end: 518923
    why: The fiend's forced-marriage pitch to the terrified Tripitaka is the chapter's central image of
      captivity disguised as domestic comfort.
  - id: wu-monkey-king#u31-c3
    label: c3
    heading: Monkey's mock-epic invulnerability, defeated by mystery
    char_start: 520559
    char_end: 521093
    why: Sets up the chapter's comic mystery by cataloguing Monkey's legendary invulnerability only to
      have it fail against an unnamed weapon.
  - id: wu-monkey-king#u31-c4
    label: c4
    heading: Guanyin identifies the scorpion-spirit
    char_start: 526514
    char_end: 526958
    why: The plot-turning revelation that explains the mystery weapon and names the only power capable
      of defeating it, showing the pilgrimage's layered cosmic hierarchy.
  - id: wu-monkey-king#u31-c5
    label: c5
    heading: Orionis reveals his true form and kills the scorpion
    char_start: 528685
    char_end: 529495
    why: The climactic resolution, where the specialist deity's true form dispatches the demon and Pigsy's
      comic vengeance closes the episode.
- nn: 32
  unit_id: chapter-32
  note_id: wu-monkey-king-chapter-32
  span: 530245:566965
  chunks:
  - id: wu-monkey-king#u32-c1
    label: c1
    heading: The mountain that blocks the way
    char_start: 532219
    char_end: 532511
    why: States the chapter's central obstacle and stakes in the old man's own words.
  - id: wu-monkey-king#u32-c2
    label: c2
    heading: The fan that makes the land livable
    char_start: 533062
    char_end: 533294
    why: Establishes the fan as indispensable climate-controlling infrastructure, motivating the entire
      quest.
  - id: wu-monkey-king#u32-c3
    label: c3
    heading: Monkey inside the princess's stomach
    char_start: 541288
    char_end: 542568
    why: The episode's most iconic scene, showing Monkey's trickster method of coercion from inside his
      opponent's own body.
  - id: wu-monkey-king#u32-c4
    label: c4
    heading: The seduction that extracts the fan's secret
    char_start: 556414
    char_end: 557655
    why: Shows the deception plot's climax and the exact activation words later needed to resolve the
      story.
  - id: wu-monkey-king#u32-c5
    label: c5
    heading: The transformation duel
    char_start: 564096
    char_end: 564598
    why: Distills the chapter's arms-race structure of matched shapeshifting into a single compressed
      sequence.
  - id: wu-monkey-king#u32-c6
    label: c6
    heading: Extinguishing the fire for good
    char_start: 565948
    char_end: 566963
    why: 'Delivers the resolution: the fan''s proper use, the fixed ritual count, and the pilgrimage resuming.'
- nn: 33
  unit_id: chapter-33
  note_id: wu-monkey-king-chapter-33
  span: 566965:592972
  chunks:
  - id: wu-monkey-king#u33-c1
    label: c1
    heading: The stationmaster's whispered confession
    char_start: 570179
    char_end: 571428
    why: Names the crime (1,111 children slated for slaughter to feed a demon's longevity potion) and
      the population's only recourse, quiet satire rather than open refusal.
  - id: wu-monkey-king#u33-c2
    label: c2
    heading: Taoism is the greatest
    char_start: 576319
    char_end: 576974
    why: The court's unison echo of the Taoist's boast dramatizes institutional legitimacy manufactured
      by repetition and proximity to power rather than argument.
  - id: wu-monkey-king#u33-c3
    label: c3
    heading: Monkey's vow to save the children
    char_start: 572162
    char_end: 572550
    why: Pivots the chapter from investigation to decisive action, and Monkey follows through on every
      clause of it within hours.
  - id: wu-monkey-king#u33-c4
    label: c4
    heading: The mud mask
    char_start: 579991
    char_end: 580540
    why: The chapter's clearest disguise set piece, a grotesque identity swap that literalizes the story's
      obsession with appearance versus substance.
  - id: wu-monkey-king#u33-c5
    label: c5
    heading: Sorting the hearts
    char_start: 581419
    char_end: 582594
    why: The story's central image, turning an abstract accusation about moral corruption into an absurdly
      literal physical proof before the whole court.
  - id: wu-monkey-king#u33-c6
    label: c6
    heading: The children restored
    char_start: 592691
    char_end: 592970
    why: Closes the loop opened by the stationmaster's account, converting the chapter's central horror
      into restoration.
- nn: 34
  unit_id: chapter-34
  note_id: wu-monkey-king-chapter-34
  span: 592972:604455
  chunks:
  - id: wu-monkey-king#u34-c1
    label: c1
    heading: The prefect's notice
    char_start: 593696
    char_end: 594181
    why: Introduces the drought and its human cost in the flat language of an official notice, setting
      the stakes before any magic appears.
  - id: wu-monkey-king#u34-c2
    label: c2
    heading: Monkey's résumé of weather magic
    char_start: 594238
    char_end: 594479
    why: Monkey's boastful catalogue of powers comically understates the scale of what the chapter will
      actually demand of him.
  - id: wu-monkey-king#u34-c3
    label: c3
    heading: The dragon king's excuse
    char_start: 595526
    char_end: 596036
    why: Reveals that rainmaking is gated by Heavenly permitting rather than raw power, launching the
      chapter's bureaucratic plot and its legibility resonance.
  - id: wu-monkey-king#u34-c4
    label: c4
    heading: The Three Impossible Challenges
    char_start: 597552
    char_end: 598201
    why: The absurd, glacially-paced punishment is the concrete form the prefect's disproportionate sentence
      takes, and the obstacle the rest of the chapter must resolve.
  - id: wu-monkey-king#u34-c5
    label: c5
    heading: Piety, not brute force
    char_start: 599203
    char_end: 599672
    why: Monkey's explicit rejection of Pigsy's violent shortcut in favor of collective ritual devotion
      is the chapter's clearest statement of theme.
  - id: wu-monkey-king#u34-c6
    label: c6
    heading: Quantified grace
    char_start: 601863
    char_end: 602263
    why: The rain arrives as an exact, departmentally-administered quantity, the chapter's sharpest image
      of Heaven as a measuring, permitting machine.
- nn: 35
  unit_id: chapter-35
  note_id: wu-monkey-king-chapter-35
  span: 604455:619495
  chunks:
  - id: wu-monkey-king#u35-c1
    label: c1
    heading: Arrival at the Western Heaven
    char_start: 604764
    char_end: 605013
    why: The comic deflation of the pilgrimage's climactic arrival sets the unit's ironic register before
      the sacred episodes that follow.
  - id: wu-monkey-king#u35-c2
    label: c2
    heading: The bottomless boat and the corpse
    char_start: 607123
    char_end: 609331
    why: This is the unit's central image of literal apotheosis, staging Buddhist transcendence as the
      pilgrim watching his own mortal corpse float away.
  - id: wu-monkey-king#u35-c3
    label: c3
    heading: The Buddha's indictment of China
    char_start: 610792
    char_end: 612348
    why: The Buddha's damning catalogue of the very people the scriptures are meant to save exposes the
      contempt embedded in the mission's own sacred justification.
  - id: wu-monkey-king#u35-c4
    label: c4
    heading: The bribe and the blank scrolls
    char_start: 612997
    char_end: 615637
    why: This is the unit's core comic-theological episode, dramatizing scripture as a good that must
      be purchased even in paradise, and the wordless canon as doctrine mistaken for fraud.
  - id: wu-monkey-king#u35-c5
    label: c5
    heading: The Buddha defends the shakedown
    char_start: 616401
    char_end: 617214
    why: The Buddha's own justification of the bribe as cosmic law is the unit's most explicit statement
      of its theme that grace is never free.
  - id: wu-monkey-king#u35-c6
    label: c6
    heading: Guanyin's audit of the pilgrimage
    char_start: 618782
    char_end: 619493
    why: The closing numerology reveals the entire fourteen-year quest as a preordained, correctable schedule
      rather than open trial, reframing the whole narrative in retrospect.
- nn: 36
  unit_id: chapter-36
  note_id: wu-monkey-king-chapter-36
  span: 619495:636005
  chunks:
  - id: wu-monkey-king#u36-c1
    label: c1
    heading: The ordeal audit and the manufactured calamity
    char_start: 620383
    char_end: 621010
    why: Shows sanctity treated as a countable, auditable quota that can be manufactured to spec, the
      chapter's sharpest legibility resonance.
  - id: wu-monkey-king#u36-c2
    label: c2
    heading: The turtle's revenge
    char_start: 623234
    char_end: 624020
    why: A broken promise is punished instantly and without appeal, an informal reciprocity ledger running
      alongside the chapter's formal one.
  - id: wu-monkey-king#u36-c3
    label: c3
    heading: The torn sutra's origin story
    char_start: 624187
    char_end: 624627
    why: Turns an accidental textual gap into a founding myth of cosmic imperfection rather than a defect
      to be fixed.
  - id: wu-monkey-king#u36-c4
    label: c4
    heading: The Buddha's apotheosis of Tripitaka and Monkey
    char_start: 632420
    char_end: 633135
    why: The novel's culminating promotions, reframing the whole pilgrimage as a debt of exile and conflict
      now settled.
  - id: wu-monkey-king#u36-c5
    label: c5
    heading: Pigsy's unequal reward
    char_start: 633574
    char_end: 633856
    why: Undercuts the ending's solemnity and shows redemption distributed unevenly according to character
      flaws that persist to the end.
  - id: wu-monkey-king#u36-c6
    label: c6
    heading: The hoop vanishes
    char_start: 634986
    char_end: 635407
    why: 'Closes Monkey''s entire disciplinary arc: the coercive device disappears the moment external
      constraint becomes unnecessary.'
