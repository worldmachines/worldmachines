source: wu-monkey-king
units:
- nn: 1
  unit_id: foreword-introduction
  note_id: wu-monkey-king-foreword-introduction
  span: 0:46811
  chunks:
  - id: wu-monkey-king#u01-c1
    label: c1
    heading: Sun Wukong's powers, as first heard from Yang's mother
    char_start: 443
    char_end: 899
    why: Establishes the personal, oral-transmission frame through which Yang encountered Monkey King
      before ever reading the novel.
  - id: wu-monkey-king#u01-c2
    label: c2
    heading: Why the translation matters
    char_start: 3433
    char_end: 4046
    why: The foreword's thesis statement, directly equating this new translation with the act of preserving
      memory that structures the whole piece.
  - id: wu-monkey-king#u01-c3
    label: c3
    heading: The thin evidence for Wu Cheng'en's authorship
    char_start: 11189
    char_end: 12145
    why: Shows the authorship attribution now attached to the novel rests on circumstantial local evidence,
      not certainty.
  - id: wu-monkey-king#u01-c4
    label: c4
    heading: The 'Mind Monkey' allegorical preface
    char_start: 30543
    char_end: 31138
    why: Primary-source evidence for the religious/allegorical reading of the novel as being about disciplining
      the mind, quoted in full by Lovell.
  - id: wu-monkey-king#u01-c5
    label: c5
    heading: Mao's invocation of Monkey to incite the Cultural Revolution
    char_start: 42385
    char_end: 42804
    why: The clearest instance of Monkey's political weaponization, turning a comic-fantasy rebel into
      literal incitement to Red Guard violence.
  - id: wu-monkey-king#u01-c6
    label: c6
    heading: Monkey's banter with the woodcutter about being eaten
    char_start: 19626
    char_end: 20469
    why: Lovell's chosen textual sample of the novel's verbal comedy, offered as direct evidence for the
      farcical reading of the book.
- nn: 2
  unit_id: note-translation-chapter-01
  note_id: wu-monkey-king-note-translation-chapter-01
  span: 46811:66106
  chunks:
  - id: wu-monkey-king#u02-c1
    label: c1
    heading: 'Lovell''s abridgement principle: preserve themes, cut episodes'
    char_start: 48829
    char_end: 49091
    why: 'States the governing rule of this abridged translation: entire episodes can be dropped as long
      as their underlying themes survive elsewhere in the text.'
  - id: wu-monkey-king#u02-c2
    label: c2
    heading: The translator's two responsibilities
    char_start: 49858
    char_end: 50373
    why: Names the central trade-off of the translation itself — fidelity to the source language versus
      fidelity to the reading experience — which shapes everything that follows in the unit.
  - id: wu-monkey-king#u02-c3
    label: c3
    heading: Birth of the stone monkey
    char_start: 52201
    char_end: 52512
    why: The novel's cosmological origin point for its protagonist, establishing his parentless, elemental
      birth that recurs as a plot fact later in the unit.
  - id: wu-monkey-king#u02-c4
    label: c4
    heading: The waterfall wager for kingship
    char_start: 54442
    char_end: 54805
    why: 'Establishes the novel''s pattern of merit-through-ordeal: kingship is won by a dare, not inherited,
      and immediately accepted by the troop.'
  - id: wu-monkey-king#u02-c5
    label: c5
    heading: Fear of death ends four centuries of paradise
    char_start: 56957
    char_end: 58175
    why: 'The turning point of the chapter: mortality-awareness, not want or conflict, is what drives
      Monkey to abandon paradise and begin the quest structure the whole saga depends on.'
  - id: wu-monkey-king#u02-c6
    label: c6
    heading: Naming and emptiness
    char_start: 65854
    char_end: 66035
    why: The narrator's direct philosophical gloss on Monkey's naming scene, tying his relationally-conferred
      identity to a claim about emptiness underlying all names.
- nn: 3
  unit_id: chapter-02
  note_id: wu-monkey-king-chapter-02
  span: 66106:86839
  chunks:
  - id: wu-monkey-king#u03-c1
    label: c1
    heading: Reading the riddle of concealment
    char_start: 70422
    char_end: 70787
    why: Shows secrecy itself functioning as a language Monkey must learn to decode before he can receive
      real instruction.
  - id: wu-monkey-king#u03-c2
    label: c2
    heading: Fishing the moon out of the water
    char_start: 69204
    char_end: 69895
    why: Crystallizes the unit's satire of elaborate doctrines and alchemical practice as illusory shortcuts
      to immortality.
  - id: wu-monkey-king#u03-c3
    label: c3
    heading: The scolding for showing off
    char_start: 79234
    char_end: 79623
    why: 'States outright the unit''s logic of capture: visible power invites envy and coercion, so it
      must stay hidden.'
  - id: wu-monkey-king#u03-c4
    label: c4
    heading: The oath of erasure
    char_start: 80293
    char_end: 80728
    why: The origin of Monkey's power is forcibly severed from its source, replaced by a fiction of self-teaching.
  - id: wu-monkey-king#u03-c5
    label: c5
    heading: The Body Beyond the Body Magic
    char_start: 84452
    char_end: 84966
    why: 'Turns the abstract seventy-two transformations into a concrete tactic: proliferation of clones
      overwhelms a single powerful adversary.'
- nn: 4
  unit_id: chapter-03
  note_id: wu-monkey-king-chapter-03
  span: 86839:111674
  chunks:
  - id: wu-monkey-king#u04-c1
    label: c1
    heading: Preparing for War
    char_start: 86854
    char_end: 87997
    why: Establishes Monkey's shift from play to organized militarization, the pretext for everything
      that follows in the unit.
  - id: wu-monkey-king#u04-c2
    label: c2
    heading: Theft by Sorcery and Self-Multiplication
    char_start: 88193
    char_end: 89175
    why: 'Shows Monkey''s method of power: illusion and self-cloning magic substituting for legitimate
      acquisition or diplomacy.'
  - id: wu-monkey-king#u04-c3
    label: c3
    heading: The Obedient Golden-Hooped Staff
    char_start: 94408
    char_end: 95178
    why: Introduces Monkey's iconic weapon, a shape-shifting artifact that answers only to him, the unit's
      central emblem of untamable will.
  - id: wu-monkey-king#u04-c4
    label: c4
    heading: Extorting Armor from the Dragon King
    char_start: 95906
    char_end: 96509
    why: Comic-menacing negotiation shows how Monkey converts an overstaying nuisance into coerced tribute
      from a legitimate ruler.
  - id: wu-monkey-king#u04-c5
    label: c5
    heading: Striking His Name from the Register of Death
    char_start: 104241
    char_end: 105733
    why: Monkey's classification-defying nature and erasure of his own mortality is the unit's clearest
      act of resistance against cosmic bureaucracy.
  - id: wu-monkey-king#u04-c6
    label: c6
    heading: Heaven's Strategy of Co-optation
    char_start: 109713
    char_end: 110292
    why: The celestial court chooses bureaucratic absorption over war, revealing Heaven's own reliance
      on capture-through-inclusion rather than force.
- nn: 5
  unit_id: chapter-04
  note_id: wu-monkey-king-chapter-04
  span: 111674:132083
  chunks:
  - id: wu-monkey-king#u05-c1
    label: c1
    heading: The stables and the civil-service grade
    char_start: 116045
    char_end: 116992
    why: Marks the moment Monkey's outrage at Heaven's caste system converts status humiliation into open
      rebellion, the hinge that turns the episode from comedy into conflict.
  - id: wu-monkey-king#u05-c2
    label: c2
    heading: Self-proclaiming the Great Sage
    char_start: 118697
    char_end: 119268
    why: Shows Monkey converting a demon king's flattery into a self-authored title, dramatizing how status
      in this world is proclaimed rather than earned.
  - id: wu-monkey-king#u05-c3
    label: c3
    heading: The shapeshifting duel with Nezha
    char_start: 125321
    char_end: 126508
    why: The escalating transformation contest resolves not through brute force but Monkey's signature
      trick, the hair-clone decoy, establishing cunning as his defining power.
  - id: wu-monkey-king#u05-c4
    label: c4
    heading: Gold Star's strategy of co-optation
    char_start: 128456
    char_end: 129075
    why: Gold Star's private rationale exposes the throne's strategy of pacifying an ungovernable force
      with an honorific instead of contesting it, the chapter's clearest statement of co-optation as control.
  - id: wu-monkey-king#u05-c5
    label: c5
    heading: An ironic settling
    char_start: 131757
    char_end: 132081
    why: The narrator's ironic aside undercuts the truce just granted, signaling that the peace is a fragile
      placation rather than a resolution.
- nn: 6
  unit_id: chapter-05
  note_id: wu-monkey-king-chapter-05
  span: 132083:152142
  chunks:
  - id: wu-monkey-king#u06-c1
    label: c1
    heading: Heaven prescribes a job to contain Monkey
    char_start: 132629
    char_end: 133047
    why: Names the court's containment strategy — administrative rank as a fix for disorder — that the
      rest of the unit shows failing.
  - id: wu-monkey-king#u06-c2
    label: c2
    heading: The sinecure becomes the crime
    char_start: 134912
    char_end: 135595
    why: Shows the caretaker post itself enabling the theft it was meant to prevent, the seed of the chapter's
      escalation.
  - id: wu-monkey-king#u06-c3
    label: c3
    heading: Disguise and hair-magic crash the Peach Festival
    char_start: 140374
    char_end: 141545
    why: The unit's central set piece of trickster shapeshifting, showing disguise and minor magic as
      Monkey's real weapon.
  - id: wu-monkey-king#u06-c4
    label: c4
    heading: Wine and verse against the brewing storm
    char_start: 148721
    char_end: 149181
    why: Captures the chapter's comic nonchalance, escalating cosmic threat answered with couplets rather
      than alarm.
  - id: wu-monkey-king#u06-c5
    label: c5
    heading: Monkey's speech to his battered troops
    char_start: 151545
    char_end: 152072
    why: Closing philosophical pep talk that reveals Monkey's self-image as a general and sets up the
      next round of conflict.
- nn: 7
  unit_id: chapter-06
  note_id: wu-monkey-king-chapter-06
  span: 152142:166387
  chunks:
  - id: wu-monkey-king#u07-c1
    label: c1
    heading: The Jade Emperor's charge sheet against Monkey
    char_start: 153073
    char_end: 154382
    why: Compresses Monkey's entire prior career into the Jade Emperor's aggrieved recap, establishing
      the stakes and institutional response before Erlang is even summoned.
  - id: wu-monkey-king#u07-c2
    label: c2
    heading: Erlang's entrance and the taunting exchange
    char_start: 159021
    char_end: 159933
    why: Frames the duel as a contest of status and wit as much as strength, with Monkey's insouciance
      intact even facing a superior opponent.
  - id: wu-monkey-king#u07-c3
    label: c3
    heading: The shapeshifting chase
    char_start: 161119
    char_end: 162500
    why: The episode's signature set piece, staging Monkey's proliferating disguises against Erlang's
      discerning third eye as the real terms of the contest.
  - id: wu-monkey-king#u07-c4
    label: c4
    heading: Monkey disguised as a roadside temple
    char_start: 162501
    char_end: 163204
    why: The chase's comic peak, showing Monkey's trickster ingenuity undone by one telltale detail—his
      own tail as a flagpole.
  - id: wu-monkey-king#u07-c5
    label: c5
    heading: The diamond circlet ends the chase
    char_start: 165279
    char_end: 165752
    why: The moment an outside artifact, not combat, finally arrests Monkey's capture-resistant shapeshifting,
      directly setting up his sentencing.
- nn: 8
  unit_id: chapter-07
  note_id: wu-monkey-king-chapter-07
  span: 166387:176029
  chunks:
  - id: wu-monkey-king#u08-c1
    label: c1
    heading: Heaven's Instruments of Execution Fail
    char_start: 166402
    char_end: 167030
    why: Establishes the totality of imperial Heaven's coercive apparatus and its complete failure against
      Monkey, framing the chapter's central problem of capture.
  - id: wu-monkey-king#u08-c2
    label: c2
    heading: Laozi's Brazier and the Alchemy of Containment
    char_start: 167078
    char_end: 167475
    why: Laozi's diagnosis and planned remedy represent Heaven's most sophisticated theory of how to neutralize
      Monkey, setting up the ironic reversal that follows.
  - id: wu-monkey-king#u08-c3
    label: c3
    heading: Refined, Not Destroyed
    char_start: 168279
    char_end: 168683
    why: The forty-nine-day ordeal meant to destroy Monkey instead sharpens his power, crystallizing the
      chapter's verdict on his nature in one aphoristic line.
  - id: wu-monkey-king#u08-c4
    label: c4
    heading: The Buddha's Wager
    char_start: 171483
    char_end: 171823
    why: The wager reframes an unwinnable fight as a game of scale and perception, the mechanism by which
      Monkey is ultimately defeated without force.
  - id: wu-monkey-king#u08-c5
    label: c5
    heading: Sealed Beneath the Mountain, Release Deferred
    char_start: 175399
    char_end: 176027
    why: Shows containment as incomplete and open-ended rather than final, deferring resolution to an
      unnamed future liberator and setting up the pilgrimage narrative.
- nn: 9
  unit_id: chapter-08
  note_id: wu-monkey-king-chapter-08
  span: 176029:190502
  chunks:
  - id: wu-monkey-king#u09-c1
    label: c1
    heading: The Buddha commissions the scripture mission
    char_start: 176292
    char_end: 177384
    why: Establishes the chapter's inciting premise and the Buddha's moral geography that justifies the
      entire pilgrimage.
  - id: wu-monkey-king#u09-c2
    label: c2
    heading: The tightening hoops
    char_start: 178446
    char_end: 178972
    why: Introduces the coercive device that will govern Monkey's obedience for the rest of the saga,
      revealing the mission's disciplinary logic beneath its language of conversion.
  - id: wu-monkey-king#u09-c3
    label: c3
    heading: The river monster's confession
    char_start: 180542
    char_end: 181964
    why: Gives Sandy's origin its full, grim weight — disproportionate celestial punishment followed by
      cannibalistic despair — before his conversion.
  - id: wu-monkey-king#u09-c4
    label: c4
    heading: The pig-monster's defiance and relent
    char_start: 184263
    char_end: 185624
    why: Contains the chapter's sharpest articulation of survival overriding doctrine, and the pivot from
      defiance to willingness to atone that defines Pigsy's recruitment.
  - id: wu-monkey-king#u09-c5
    label: c5
    heading: The dragon prince's plea
    char_start: 186308
    char_end: 186955
    why: The most compressed instance of the crime-punishment-redemption pattern, showing Guanyin's intercession
      securing a disciple through direct negotiation with the Jade Emperor.
  - id: wu-monkey-king#u09-c6
    label: c6
    heading: Monkey beneath the mountain
    char_start: 187721
    char_end: 188572
    why: Reopens the story's central unresolved thread — Monkey's imprisonment — and frames his eventual
      release as pedagogical rather than final.
- nn: 10
  unit_id: chapter-09
  note_id: wu-monkey-king-chapter-09
  span: 190502:211286
  chunks:
  - id: wu-monkey-king#u10-c1
    label: c1
    heading: The Embroidered Ball
    char_start: 192172
    char_end: 193303
    why: Shows marriage and status arriving instantaneously and fatalistically the moment Guangrui becomes
      examination laureate.
  - id: wu-monkey-king#u10-c2
    label: c2
    heading: Betrayal on the River Hong
    char_start: 195075
    char_end: 196089
    why: The central crime of the unit — murder, impersonation, and abduction — compressed into a single
      decisive passage.
  - id: wu-monkey-king#u10-c3
    label: c3
    heading: The Dragon King's Debt
    char_start: 196090
    char_end: 197025
    why: Reveals the karmic mechanism (the spared carp is the dragon king) that drives the entire plot's
      resolution.
  - id: wu-monkey-king#u10-c4
    label: c4
    heading: Wenjiao Sets the Baby Adrift
    char_start: 198232
    char_end: 199126
    why: The foundling scene establishes the identity tokens (letter, bitten toe) that structure every
      later recognition.
  - id: wu-monkey-king#u10-c5
    label: c5
    heading: Mother and Son Reunited
    char_start: 200764
    char_end: 202161
    why: The unit's emotional payoff, verifying identity through the preserved letter after eighteen years
      apart.
  - id: wu-monkey-king#u10-c6
    label: c6
    heading: Wenjiao's Suicide
    char_start: 210933
    char_end: 211284
    why: The unit's final, undercutting reversal — full restitution for everyone except Wenjiao, delivered
      in the same flat register as the rest of the resolution.
- nn: 11
  unit_id: chapter-10
  note_id: wu-monkey-king-chapter-10
  span: 211286:223835
  chunks:
  - id: wu-monkey-king#u11-c1
    label: c1
    heading: The riverbanks have ears
    char_start: 212518
    char_end: 212902
    why: Establishes the chapter's core mechanism—perfect information about the natural world (fish locations)
      triggering an escalation to violence—that the rest of the chapter replays with rain and fate.
  - id: wu-monkey-king#u11-c2
    label: c2
    heading: The forecast and the wager
    char_start: 214623
    char_end: 215382
    why: The fortune-teller's absurdly exact prediction and the dragon king's bet frame the chapter's
      central test of whether nature can be perfectly known and administered in advance.
  - id: wu-monkey-king#u11-c3
    label: c3
    heading: Heaven confirms the forecast
    char_start: 216011
    char_end: 216494
    why: The Jade Emperor's decree matching the fortune-teller's numbers exactly reveals that the dragon
      king, not the diviner, is the one out of step with a fully legible cosmic order.
  - id: wu-monkey-king#u11-c4
    label: c4
    heading: A joke becomes a capital crime
    char_start: 217925
    char_end: 218114
    why: 'The pivot of the plot: a face-saving deception is instantly reclassified as a violation of Heavenly
      law punishable by death, with no allowance for intent or scale.'
  - id: wu-monkey-king#u11-c5
    label: c5
    heading: Execution by way of a nap
    char_start: 220150
    char_end: 220751
    why: The chapter's strangest image—a dream-state execution with a real, bloody physical result—shows
      dream and waking causality treated as continuous, not separate.
  - id: wu-monkey-king#u11-c6
    label: c6
    heading: The debt that kills the emperor
    char_start: 220965
    char_end: 221698
    why: Shows the broken promise operating as a force independent of Taizong's formal power, driving
      his guilt, illness, and death and setting up his coming journey to the underworld.
- nn: 12
  unit_id: chapter-11
  note_id: wu-monkey-king-chapter-11
  span: 223835:239243
  chunks:
  - id: wu-monkey-king#u12-c1
    label: c1
    heading: Wei Zheng's letter to his dead sworn brother
    char_start: 225580
    char_end: 226519
    why: The personal favor this letter calls in is the actual mechanism that saves Taizong's life, showing
      the underworld bureaucracy running on loyalty rather than judgment.
  - id: wu-monkey-king#u12-c2
    label: c2
    heading: '"Process is process": the dragon''s case and Taizong''s sentence'
    char_start: 228286
    char_end: 229485
    why: Renders Hell's justice as pure administrative process — case review, precedent, and an edited
      ledger entry — rather than moral reckoning.
  - id: wu-monkey-king#u12-c3
    label: c3
    heading: The Bridge of No Alternative
    char_start: 231661
    char_end: 232230
    why: The chapter's most vivid and quotable image of Hell's terrain, condensing its folk-moral cosmology
      into a single gothic set piece.
  - id: wu-monkey-king#u12-c4
    label: c4
    heading: Borrowing against a stranger's merit in Hell
    char_start: 232529
    char_end: 233125
    why: Demonstrates the underworld's economy of quantified merit-as-currency, where a living stranger's
      alms fund a literal bankable account in Hell.
  - id: wu-monkey-king#u12-c5
    label: c5
    heading: 'An administrative error corrected: Liu Quan and Li Cuilian restored'
    char_start: 238458
    char_end: 239241
    why: Closes the chapter's central conceit that death itself is a correctable clerical matter, resolved
      here by a literal bureaucratic fix.
- nn: 13
  unit_id: chapter-12
  note_id: wu-monkey-king-chapter-12
  span: 239243:252867
  chunks:
  - id: wu-monkey-king#u13-c1
    label: c1
    heading: Wrong Soul, Wrong Body
    char_start: 240008
    char_end: 240523
    why: Shows the novel's comic, bureaucratic treatment of resurrection—an administrative soul-swap error
      rather than a solemn miracle.
  - id: wu-monkey-king#u13-c2
    label: c2
    heading: The Court Debates Buddhism's Legitimacy
    char_start: 242665
    char_end: 243397
    why: Stages the ideological contest over Buddhism's threat to Confucian hierarchy and its forcible,
      decree-imposed resolution, setting the political stakes for the pilgrimage.
  - id: wu-monkey-king#u13-c3
    label: c3
    heading: Guanyin Reveals Herself and the Mission's Terms
    char_start: 249026
    char_end: 249765
    why: The miraculous unveiling and written mandate are the chapter's actual hinge, converting a court
      religious debate into a concrete, sanctioned mission.
  - id: wu-monkey-king#u13-c4
    label: c4
    heading: Xuanzang's Vow
    char_start: 249939
    char_end: 250372
    why: Establishes the vow's damnation-stakes that frame the entire pilgrimage narrative to follow.
  - id: wu-monkey-king#u13-c5
    label: c5
    heading: A Pinch of Native Earth
    char_start: 252288
    char_end: 252865
    why: The closing gesture crystallizes the pilgrimage's emotional core—homeland attachment as what
      the traveler must carry through foreign trials—closing the Chang'an frame.
- nn: 14
  unit_id: chapter-13
  note_id: wu-monkey-king-chapter-13
  span: 252867:261770
  chunks:
  - id: wu-monkey-king#u14-c1
    label: c1
    heading: A Demon King's Dinner Party
    char_start: 254189
    char_end: 254901
    why: Establishes the casual, conversational horror of the demons who kill and eat Tripitaka's attendants,
      setting the chapter's tonal register and stakes.
  - id: wu-monkey-king#u14-c2
    label: c2
    heading: The Planet Venus's Promise
    char_start: 255735
    char_end: 256273
    why: The divine rescuer's explanation and note explicitly foreshadow the arrival of the 'magic disciples'
      who will become Tripitaka's companions.
  - id: wu-monkey-king#u14-c3
    label: c3
    heading: A Hunter's Hospitality
    char_start: 259317
    char_end: 259892
    why: Shows the household's care in accommodating Tripitaka's vegetarianism, the chapter's counterweight
      of ordinary human kindness against the earlier demon violence.
  - id: wu-monkey-king#u14-c4
    label: c4
    heading: The Ghost's Gratitude
    char_start: 260320
    char_end: 260788
    why: Confirms within the story's own logic that Tripitaka's recited sutras have real ritual efficacy,
      validating the religious premise of his mission.
