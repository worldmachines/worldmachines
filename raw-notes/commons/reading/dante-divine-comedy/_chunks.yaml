source: dante-divine-comedy
units:
- nn: 1
  unit_id: hell-cantos-01-05
  note_id: dante-divine-comedy-hell-cantos-01-05
  span: 2108:31880
  chunks:
  - id: dante-divine-comedy#u01-c1
    label: c1
    heading: The dark wood
    char_start: 2108
    char_end: 2386
    start_quote: In the midway of this our mortal life,
    end_quote: Renews, in bitterness not far from death.
    why: 'Opens the entire Comedy with its central allegorical premise: the pilgrim lost at midlife in
      a savage wood.'
  - id: dante-divine-comedy#u01-c2
    label: c2
    heading: Beatrice's account of her descent
    char_start: 10077
    char_end: 10871
    start_quote: I was among the tribe,
    end_quote: Am Beatrice; from a place I come.
    why: Shows the chain of heavenly intercession (Beatrice, moved by an unnamed lady) in Beatrice's own
      reported words, the mechanism that sets the whole journey in motion.
  - id: dante-divine-comedy#u01-c3
    label: c3
    heading: The gate of Hell
    char_start: 14050
    char_end: 14406
    start_quote: 'Through me you pass into the city of woe:'
    end_quote: All hope abandon ye who enter here.
    why: The poem's most famous and most compressed statement of Hell's nature as an artifact of justice,
      power, wisdom, and love.
  - id: dante-divine-comedy#u01-c4
    label: c4
    heading: 'Limbo: virtuous without grace'
    char_start: 20866
    char_end: 21241
    start_quote: Inquir’st thou not what spirits
    end_quote: And for no other evil, we are lost;
    why: 'States the poem''s harshest doctrinal edge: moral blamelessness is not sufficient for salvation
      absent baptism and faith.'
  - id: dante-divine-comedy#u01-c5
    label: c5
    heading: The whirlwind of the lustful
    char_start: 27419
    char_end: 27675
    start_quote: I understood that to this torment sad
    end_quote: So bears the tyrannous gust those evil souls.
    why: Establishes the governing contrapasso image of the second circle — reason overmastered by lust,
      rendered as an unceasing storm — before Francesca speaks.
  - id: dante-divine-comedy#u01-c6
    label: c6
    heading: Francesca da Rimini's confession
    char_start: 30094
    char_end: 31864
    start_quote: Love, that in gentle heart is quickly learnt,
    end_quote: From death, and like a corpse fell to the ground.
    why: 'The unit''s climactic and most cited episode: Francesca''s account of the love that damned her,
      ending in the pilgrim''s own compassionate collapse.'
- nn: 2
  unit_id: hell-cantos-06-11
  note_id: dante-divine-comedy-hell-cantos-06-11
  span: 31880:65592
  chunks:
  - id: dante-divine-comedy#u02-c1
    label: c1
    heading: Ciacco's prophecy of Florentine strife
    char_start: 34657
    char_end: 35182
    start_quote: 'He then: “After long striving they will come'
    end_quote: Three fatal sparks, have set the hearts of all
    why: Ciacco's diagnosis of avarice, envy, and pride as the root of Florence's civic violence is the
      unit's central political prophecy.
  - id: dante-divine-comedy#u02-c2
    label: c2
    heading: Virgil's account of Fortune
    char_start: 40351
    char_end: 41465
    start_quote: He, whose transcendent wisdom passes all,
    end_quote: Rolls on her sphere, and in her bliss exults.
    why: Casts historical rise and fall as governed by an impersonal, divinely-appointed minister beyond
      human control, closely echoing the WMP concept of an infrastructural world machine.
  - id: dante-divine-comedy#u02-c3
    label: c3
    heading: Contempt for Filippo Argenti
    char_start: 44592
    char_end: 45711
    start_quote: 'To which I thus: “In mourning and in woe,'
    end_quote: Turn’d his avenging fangs. Him here we left,
    why: Marks a hardening in the pilgrim's moral stance from pity toward righteous contempt, and shows
      the poem endorsing that anger via Virgil's approving embrace.
  - id: dante-divine-comedy#u02-c4
    label: c4
    heading: The Medusa threat and the allegory warning
    char_start: 50842
    char_end: 51356
    start_quote: '“Hasten Medusa: so to adamant'
    end_quote: Under close texture of the mystic strain!
    why: The poem's most explicit self-aware moment, directly instructing the reader to look for hidden
      allegorical meaning beneath the narrative surface.
  - id: dante-divine-comedy#u02-c5
    label: c5
    heading: Farinata on the damned's foreknowledge
    char_start: 58611
    char_end: 59028
    start_quote: “We view, as one who hath an evil sight,”
    end_quote: When on futurity the portals close.”
    why: Articulates the damned's paradoxical epistemology — clear long-range foresight paired with blindness
      to the present — an inverted oracle logic central to the canto's meaning.
  - id: dante-divine-comedy#u02-c6
    label: c6
    heading: Virgil's taxonomy of violence and fraud
    char_start: 61333
    char_end: 63336
    start_quote: “Of all malicious act abhorr’d in heaven,
    end_quote: The traitor is eternally consum’d.”
    why: The systematic classification of sin by force versus fraud is the structural key to the rest
      of Hell and the unit's clearest instance of moral legibility as an ordering machine.
- nn: 3
  unit_id: hell-cantos-12-17
  note_id: dante-divine-comedy-hell-cantos-12-17
  span: 65592:101730
  chunks:
  - id: dante-divine-comedy#u03-c1
    label: c1
    heading: The river of blood and the ring's thesis
    char_start: 67491
    char_end: 67742
    start_quote: 'But fix thine eyes beneath: the river of blood'
    end_quote: Thus miserably o’erwhelm us.
    why: States outright the organizing logic of the first ring of violence and the poem's moral judgment
      on it.
  - id: dante-divine-comedy#u03-c2
    label: c2
    heading: The betrayed courtier's confession
    char_start: 74347
    char_end: 74987
    start_quote: I it was, who held
    end_quote: unjust toward myself.
    why: The wood's central first-person testimony of loyal service destroyed by court envy, ending in
      self-inflicted death.
  - id: dante-divine-comedy#u03-c3
    label: c3
    heading: The Old Man of Crete
    char_start: 82263
    char_end: 83447
    start_quote: In midst of ocean,” forthwith he began,
    end_quote: I here give thee no account.”
    why: A statue of degrading materials weeping the source-rivers of Hell — an allegory of history and
      infrastructure decaying by stages.
  - id: dante-divine-comedy#u03-c4
    label: c4
    heading: Brunetto Latini's prophecy
    char_start: 86823
    char_end: 87255
    start_quote: If thou,” he answer’d, “follow but thy star,
    end_quote: Will for thy good deeds shew thee enmity.
    why: The teacher's warning and blessing to his former pupil, foretelling exile and fame from within
      damnation.
  - id: dante-divine-comedy#u03-c5
    label: c5
    heading: Florence's decline and the plea to be remembered
    char_start: 93083
    char_end: 93695
    start_quote: An upstart multitude and sudden gains,
    end_quote: See that of us thou speak among mankind.”
    why: The unit's clearest civic lament, pairing a diagnosis of Florence's corruption with the damned's
      demand for memory among the living.
  - id: dante-divine-comedy#u03-c6
    label: c6
    heading: Geryon, the image of Fraud
    char_start: 96153
    char_end: 96671
    start_quote: Forthwith that image vile of fraud appear’d,
    end_quote: Nor spread Arachne o’er her curious loom.
    why: The monster's just-man face over a venomous serpent body literalizes fraud as a legible surface
      masking illegible danger.
- nn: 4
  unit_id: hell-cantos-18-23
  note_id: dante-divine-comedy-hell-cantos-18-23
  span: 101730:137732
  chunks:
  - id: dante-divine-comedy#u04-c1
    label: c1
    heading: Malebolge as fortified architecture
    char_start: 101730
    char_end: 102160
    start_quote: There is a place within the depths of hell
    end_quote: Ten trenches, in its hollow bottom sunk.
    why: Establishes hell's fraud-region as an engineered, legible system of graduated, countable compartments
      rather than undifferentiated chaos.
  - id: dante-divine-comedy#u04-c2
    label: c2
    heading: Venedico Caccianemico's forced confession
    char_start: 103796
    char_end: 104492
    start_quote: Thou who dost cast thy eye upon the ground,
    end_quote: Remember but our craving thirst for gold.”
    why: Shows the poem's method of extracting shamed testimony from the damned, and the pandering-for-gold
      logic contrapasso will punish throughout.
  - id: dante-divine-comedy#u04-c3
    label: c3
    heading: Invective against Simon Magus
    char_start: 107505
    char_end: 108034
    start_quote: Woe to thee, Simon Magus! woe to you,
    end_quote: Allotting by thy virtue unto all!
    why: Opens the simony canto with a direct curse on clerical avarice, framed as cosmic justice rather
      than mere personal grievance.
  - id: dante-divine-comedy#u04-c4
    label: c4
    heading: Dante's indictment of papal avarice
    char_start: 111875
    char_end: 112613
    start_quote: If reverence of the keys restrain’d me not,
    end_quote: Which the first wealthy Father gain’d from thee!”
    why: The poem's most explicit political charge, tracing institutional corruption of the Church to
      the wealth of Constantine's donation.
  - id: dante-divine-comedy#u04-c5
    label: c5
    heading: The Venetian arsenal simile
    char_start: 119050
    char_end: 119552
    start_quote: In the Venetians’ arsenal as boils
    end_quote: that round Lim’d all the shore beneath.
    why: A hallmark Dantean move grounding infernal torment in concrete workaday craft imagery, opening
      the barrators' canto.
  - id: dante-divine-comedy#u04-c6
    label: c6
    heading: The hypocrites' gilded lead and Caiaphas
    char_start: 135567
    char_end: 136648
    start_quote: Our bonnets gleaming bright with orange hue,
    end_quote: seed of ill And sorrow to the Jews.”
    why: The unit's clearest image of institutional appearance decoupled from substance, culminating in
      Caiaphas crucified underfoot as the literalized logic of expedient sacrifice.
- nn: 5
  unit_id: hell-cantos-24-27
  note_id: dante-divine-comedy-hell-cantos-24-27
  span: 137732:161849
  chunks:
  - id: dante-divine-comedy#u05-c1
    label: c1
    heading: Virgil's exhortation to effort
    char_start: 139632
    char_end: 140172
    start_quote: '“Now needs thy best of man;” so spake my guide:'
    end_quote: If well thou note me, profit by my words.”
    why: A meta-poetic aside framing struggle and earned fame as the poem's own ethic, spoken just before
      the thieves' bolgia.
  - id: dante-divine-comedy#u05-c2
    label: c2
    heading: The phoenix-thief's incineration and rebirth
    char_start: 142142
    char_end: 142725
    start_quote: So mighty sages tell, The Arabian Phoenix, when five hundred years
    end_quote: So stood aghast the sinner when he rose.
    why: 'Establishes the seventh bolgia''s central conceit: theft punished by cyclical loss and forced
      reconstitution of one''s own body.'
  - id: dante-divine-comedy#u05-c3
    label: c3
    heading: Vanni Fucci's blasphemy
    char_start: 144193
    char_end: 144546
    start_quote: When he had spoke, the sinner rais’d his hands
    end_quote: So close, it took from them the power to move.
    why: The obscene gesture at God and the serpents' immediate reprisal crystallize the bolgia's fusion
      of defiance and degradation.
  - id: dante-divine-comedy#u05-c4
    label: c4
    heading: Ulysses' restless zeal
    char_start: 154176
    char_end: 154546
    start_quote: “When I escap’d From Circe, who beyond a circling year
    end_quote: T’ explore the world, and search the ways of life, Man’s evil and his virtue.
    why: States the drive that overrides family duty, the poem's clearest expression of striving-beyond-bounds
      prior to its punishment as fraud.
  - id: dante-divine-comedy#u05-c5
    label: c5
    heading: The 'O brothers' speech and shipwreck
    char_start: 155007
    char_end: 156176
    start_quote: “O brothers!” I began, “who to the west
    end_quote: And over us the booming billow clos’d.”
    why: The poem's most famous speech on knowledge and virtue, immediately followed by the wreck that
      seals it as damnable transgression.
  - id: dante-divine-comedy#u05-c6
    label: c6
    heading: The pope's advance absolution and the devil's logic
    char_start: 159995
    char_end: 161543
    start_quote: As in Socrate, Constantine besought To cure his leprosy Sylvester’s aid,
    end_quote: A prey to rankling sorrow in this garb.”
    why: Dramatizes corrupted authority issuing pre-cleared absolution for sin, refuted point-blank by
      the devil's logic that intent and repentance cannot coexist.
- nn: 6
  unit_id: hell-cantos-28-31
  note_id: dante-divine-comedy-hell-cantos-28-31
  span: 161849:186054
  chunks:
  - id: dante-divine-comedy#u06-c1
    label: c1
    heading: Mohammed's contrapasso for the sowers of discord
    char_start: 163144
    char_end: 163359
    start_quote: How is Mohammed mangled! before me
    end_quote: Scandal and schism, and therefore thus are rent.
    why: 'States outright the chasm''s governing logic: those who sowed division in life are correspondingly
      torn apart in death.'
  - id: dante-divine-comedy#u06-c2
    label: c2
    heading: The headless trunk of Bertrand de Born
    char_start: 166804
    char_end: 167802
    start_quote: A headless trunk, that even as the rest
    end_quote: Of retribution fiercely works in me.
    why: The unit's most vivid image of literalized punishment, closing with the poem's own explicit statement
      of the law of retribution.
  - id: dante-divine-comedy#u06-c3
    label: c3
    heading: Justice's ledger of the falsifiers
    char_start: 169979
    char_end: 170224
    start_quote: We on the utmost shore of the long rock
    end_quote: The forgers noted on her dread record.
    why: Frames the tenth chasm's punishments as a divine audit of falsification, the thematic hinge for
      the whole falsifiers sequence.
  - id: dante-divine-comedy#u06-c4
    label: c4
    heading: Virgil's rebuke of Dante's fascination
    char_start: 179329
    char_end: 180068
    start_quote: I was all fix’d to listen, when my guide
    end_quote: Such wrangling is a joy for vulgar minds.
    why: A rare self-critical moment where the poem flags the pilgrim's (and reader's) voyeuristic pull
      toward the spectacle of the damned.
  - id: dante-divine-comedy#u06-c5
    label: c5
    heading: Nimrod and the confusion of tongues
    char_start: 182703
    char_end: 183311
    start_quote: Raphel bai ameth sabi almi,
    end_quote: As his to others, understood by none.
    why: Nimrod's nonsense speech and Virgil's gloss render Babel as a giant guarding the descent into
      treachery, a figure for collapsed shared language.
  - id: dante-divine-comedy#u06-c6
    label: c6
    heading: Antaeus lowers the pilgrims to the pit's floor
    char_start: 185396
    char_end: 186035
    start_quote: He in haste forth stretch’d his hands,
    end_quote: But rose as in a bark the stately mast.
    why: Closes the unit with the physical transition into Cocytus, the frozen floor reserved for traitors,
      marking the descent's next threshold.
- nn: 7
  unit_id: hell-cantos-32-34
  note_id: dante-divine-comedy-hell-cantos-32-34
  span: 186054:204584
  chunks:
  - id: dante-divine-comedy#u07-c1
    label: c1
    heading: Invocation before Cocytus
    char_start: 186054
    char_end: 186738
    start_quote: Could I command rough rhimes and hoarse, to suit
    end_quote: Been flocks or mountain goats.
    why: Opens the unit by marking Cocytus as linguistically and morally extreme, framing treachery as
      the lowest, coldest sin.
  - id: dante-divine-comedy#u07-c2
    label: c2
    heading: Ugolino's sons offer their own flesh
    char_start: 194062
    char_end: 194654
    start_quote: 'They wept: and one, my little Anslem, cried:'
    end_quote: And do thou strip them off from us again.
    why: The emotional peak of the Ugolino episode, the passage most responsible for the canto's enduring
      fame.
  - id: dante-divine-comedy#u07-c3
    label: c3
    heading: Apostrophe to Pisa
    char_start: 195336
    char_end: 195917
    start_quote: Oh thou Pisa! shame
    end_quote: Uncapable of guilt.
    why: Dante breaks narrative frame to indict a living city, converting the Ugolino story into direct
      political accusation.
  - id: dante-divine-comedy#u07-c4
    label: c4
    heading: Branca Doria's soul falls before his body dies
    char_start: 197873
    char_end: 198671
    start_quote: “Now,” answer’d I, “methinks thou mockest me,
    end_quote: In body still alive upon the earth.
    why: States the unit's theological twist that Ptolomea's traitors are damned in soul while their demon-piloted
      bodies still walk the earth, and names a living contemporary.
  - id: dante-divine-comedy#u07-c5
    label: c5
    heading: The sight of Lucifer
    char_start: 199652
    char_end: 201541
    start_quote: How frozen and how faint I then became,
    end_quote: All is seen.
    why: 'The unit''s central icon: three-faced Lucifer eternally chewing Judas, Brutus, and Cassius,
      described and identified in Virgil''s own words.'
  - id: dante-divine-comedy#u07-c6
    label: c6
    heading: Emergence to the stars
    char_start: 204298
    char_end: 204555
    start_quote: My guide and I did enter, to return
    end_quote: Thus issuing we again beheld the stars.
    why: The closing line of Inferno, marking the physical and structural hinge out of Hell into the next
      canticle.
- nn: 8
  unit_id: purgatory-cantos-01-04
  note_id: dante-divine-comedy-purgatory-cantos-01-04
  span: 204584:227968
  chunks:
  - id: dante-divine-comedy#u08-c1
    label: c1
    heading: Cato's appearance on the shore
    char_start: 205895
    char_end: 206279
    start_quote: I saw an old man standing by my side
    end_quote: Deck’d it, that I beheld him as the sun.
    why: Introduces Cato, guardian of Purgatory's shore, in solar/reverential imagery before any dialogue
      establishes his authority.
  - id: dante-divine-comedy#u08-c2
    label: c2
    heading: The self-renewing reed
    char_start: 210156
    char_end: 210479
    start_quote: Then on the solitary shore arriv’d,
    end_quote: Resembling, straightway in its place arose.
    why: The marvel of the instantly-regrowing reed marks the shore as governed by a distinct, self-renewing
      natural order at the ritual close of Canto I.
  - id: dante-divine-comedy#u08-c3
    label: c3
    heading: The angel-pilot and the psalm-singing souls
    char_start: 212077
    char_end: 212540
    start_quote: As more and more toward us came, more bright
    end_quote: In the remainder of that hymn is writ.
    why: 'The unit''s central set-piece: souls ferried to Purgatory by a wingless-oared angel singing
      the Exodus psalm, staging arrival as liturgical event.'
  - id: dante-divine-comedy#u08-c4
    label: c4
    heading: Virgil disowns reason's competence
    char_start: 217517
    char_end: 217812
    start_quote: Seek not the wherefore, race of human kind;
    end_quote: I speak of Plato, and the Stagyrite,
    why: Virgil, the poem's emblem of unaided reason, explicitly limits its reach before mystery, naming
      Plato and Aristotle as reason's frustrated exemplars.
  - id: dante-divine-comedy#u08-c5
    label: c5
    heading: Manfred's plea for grace
    char_start: 220979
    char_end: 221187
    start_quote: When by two mortal blows
    end_quote: Hath goodness infinite, that it receives All who turn to it.
    why: The excommunicate King Manfred's testimony that even churchly curse cannot outrun infinite grace
      is the unit's theological crux.
  - id: dante-divine-comedy#u08-c6
    label: c6
    heading: Belacqua's elastic sentence of delay
    char_start: 227393
    char_end: 227780
    start_quote: 'Then he: “My brother, of what use to mount,'
    end_quote: What other kind avails, not heard in heaven?”
    why: Belacqua's indolence-mirroring purgatorial wait, shortenable only by prayer, exemplifies Purgatory's
      time as negotiable rather than fixed.
- nn: 9
  unit_id: purgatory-cantos-05-09
  note_id: dante-divine-comedy-purgatory-cantos-05-09
  span: 227968:258023
  chunks:
  - id: dante-divine-comedy#u09-c1
    label: c1
    heading: Virgil's counsel against distraction
    char_start: 228491
    char_end: 228767
    start_quote: Come after me, and to their babblings leave
    end_quote: Sicklies and wastes to nought the other’s strength.
    why: States the poem's ethic of undivided attention against the crowd's chatter, the guiding discipline
      for the whole unit's procession of souls.
  - id: dante-divine-comedy#u09-c2
    label: c2
    heading: Buonconte's contested soul
    char_start: 231906
    char_end: 232511
    start_quote: answer’d he, “at Casentino’s foot
    end_quote: For one poor tear that he deprives me of.
    why: Dramatizes grace overriding a devil's legalistic claim on the soul, the unit's clearest instance
      of an excess judgment cannot fully absorb.
  - id: dante-divine-comedy#u09-c3
    label: c3
    heading: La Pia's epitaph
    char_start: 233470
    char_end: 233722
    start_quote: Ah! when thou to the world shalt be return’d,
    end_quote: Who me with jewell’d ring had first espous’d.
    why: The unit's most compressed and famous passage, a whole marriage and death sketched in four lines.
  - id: dante-divine-comedy#u09-c4
    label: c4
    heading: Apostrophe to a leaderless Italy
    char_start: 236903
    char_end: 238228
    start_quote: Ah slavish Italy! thou inn of grief,
    end_quote: The garden of the empire to run waste.
    why: Dante's direct political indictment of an Italy without functioning imperial authority, a lived
      interregnum resonant with the gramsci-gap.
  - id: dante-divine-comedy#u09-c5
    label: c5
    heading: The three steps of the gate
    char_start: 255740
    char_end: 256052
    start_quote: The lowest stair was marble white so smooth
    end_quote: Red as the life-blood spouting from a vein.
    why: The gate's colored steps render the interior process of confession as a legible, physically staged
      sequence.
  - id: dante-divine-comedy#u09-c6
    label: c6
    heading: Inscription of the seven P's and the warning
    char_start: 256380
    char_end: 257453
    start_quote: Thrice on my bosom prostrate. Seven times
    end_quote: He forth again departs who looks behind.
    why: Completes the gate's procedural machinery — mark, keys, irrevocable threshold — as the price
      and structure of admission to Purgatory proper.
- nn: 10
  unit_id: purgatory-cantos-10-14
  note_id: dante-divine-comedy-purgatory-cantos-10-14
  span: 258023:288178
  chunks:
  - id: dante-divine-comedy#u10-c1
    label: c1
    heading: The Annunciation carved as visible speech
    char_start: 259336
    char_end: 259776
    start_quote: The angel who came down to earth
    end_quote: As figure seal’d on wax.
    why: States the terrace's central conceit that sculpted art can out-speak living nature, making virtue
      directly legible.
  - id: dante-divine-comedy#u10-c2
    label: c2
    heading: Trajan and the widow, justice answering pity
    char_start: 261004
    char_end: 261661
    start_quote: A widow at his bridle stood, attir’d
    end_quote: So justice wills; and pity bids me stay.”
    why: The second carved exemplum dramatizes humility as a ruler's justice yielding to a supplicant's
      grief, in fully sculpted dialogue.
  - id: dante-divine-comedy#u10-c3
    label: c3
    heading: 'Address to the proud: worms destined for angel-wings'
    char_start: 262782
    char_end: 263590
    start_quote: Christians and proud! O poor and wretched ones!
    end_quote: I can endure no more.”
    why: The poem's direct thesis on pride as arrested metamorphosis, and the terrace's clearest statement
      of Purgatory's corrective logic.
  - id: dante-divine-comedy#u10-c4
    label: c4
    heading: Oderisi on fame as a shifting wind
    char_start: 267468
    char_end: 268638
    start_quote: O powers of man! how vain your glory, nipp’d
    end_quote: Crude from the lap of earth.”
    why: Names the succession of Cimabue by Giotto and one Guido by another — a paradigm silently displaced
      by the next, echoing the history-machine pattern.
  - id: dante-divine-comedy#u10-c5
    label: c5
    heading: The envious with eyelids sewn shut
    char_start: 277452
    char_end: 278144
    start_quote: Mine eyes a load of sorrow teemed, when now
    end_quote: As for the taming of a haggard hawk.
    why: The unit's most visceral punishment-image, binding the vice of envious sight to its literal organ.
  - id: dante-divine-comedy#u10-c6
    label: c6
    heading: Guido del Duca's lament for the vanished houses of Romagna
    char_start: 285655
    char_end: 286108
    start_quote: Nor his the only blood, that hath been stript
    end_quote: A gentle cyon from ignoble stem.
    why: 'A genealogical decay sequence: once-functioning noble houses reduced to bare names or extinguished
      entirely, courtesy''s infrastructure hollowed out.'
- nn: 11
  unit_id: purgatory-cantos-15-19
  note_id: dante-divine-comedy-purgatory-cantos-15-19
  span: 288178:319342
  chunks:
  - id: dante-divine-comedy#u11-c1
    label: c1
    heading: Marco Lombardo on free will
    char_start: 297296
    char_end: 298123
    start_quote: he thus began, “the world is blind;
    end_quote: Seek in yourselves the cause, and find it there.
    why: States the poem's explicit rejection of astral determinism and locates moral responsibility in
      human free will, the pivot of Marco's whole speech.
  - id: dante-divine-comedy#u11-c2
    label: c2
    heading: Rome's two suns and the sword grafted on the crook
    char_start: 299188
    char_end: 300232
    start_quote: Rome, that turn’d it unto good,
    end_quote: And there herself and burden much defil’d.”
    why: 'The unit''s central political indictment: the fusion of temporal and spiritual authority corrupts
      both, diagnosed through the image of two suns collapsed into one.'
  - id: dante-divine-comedy#u11-c3
    label: c3
    heading: Love as the germ of every virtue and vice
    char_start: 304720
    char_end: 305355
    start_quote: Creator, nor created being, ne’er,
    end_quote: And of each act no less, that merits pain.
    why: Virgil's foundational claim that all created and creaturely acts spring from love, well or ill
      directed — the organizing principle for the whole upper Purgatorio.
  - id: dante-divine-comedy#u11-c4
    label: c4
    heading: The stoned youth's forgiveness
    char_start: 292667
    char_end: 293011
    start_quote: A multitude, in fury burning, slay
    end_quote: With looks, that With compassion to their aim.
    why: The wrath terrace's culminating exemplum of meekness, showing the pedagogical vision-device that
      structures each terrace's penance.
  - id: dante-divine-comedy#u11-c5
    label: c5
    heading: The Siren's dream-transformation
    char_start: 313307
    char_end: 314408
    start_quote: There came, with lips that stammer’d, eyes aslant,
    end_quote: Exhaling loathsome, wak’d me.
    why: The threshold allegory of desire's object as beautiful illusion concealing corruption, staged
      just before the terraces of disordered love proper.
  - id: dante-divine-comedy#u11-c6
    label: c6
    heading: Pope Adrian V's confession of avarice
    char_start: 317474
    char_end: 318553
    start_quote: A month and little more by proof I learnt,
    end_quote: So long to tarry motionless outstretch’d.
    why: Grounds the unit's political critique of corrupted authority in a single confessing voice, the
      pope himself admitting avarice at the height of power.
- nn: 12
  unit_id: purgatory-cantos-20-24
  note_id: dante-divine-comedy-purgatory-cantos-20-24
  span: 319342:350439
  chunks:
  - id: dante-divine-comedy#u12-c1
    label: c1
    heading: Hugh Capet's curse on avarice
    char_start: 322858
    char_end: 323389
    start_quote: O avarice! What canst thou more, who hast subdued our blood
    end_quote: Into the temple his yet eager sails!
    why: Hugh Capet's dynastic indictment culminates here, naming avarice as the force that dissolves
      natural bonds (even a father selling his daughter) and desecrates the papacy at Anagni.
  - id: dante-divine-comedy#u12-c2
    label: c2
    heading: The mountain trembles and the Gloria sounds
    char_start: 324841
    char_end: 325364
    start_quote: Forthwith from every side a shout arose
    end_quote: Their custom’d mourning.
    why: This is the terrace's central ritual event — the liturgical shout that marks a soul's will finally
      turning toward ascent, later explained by Statius as the mechanism of purgatorial release.
  - id: dante-divine-comedy#u12-c3
    label: c3
    heading: Statius on Virgil's unwitting prophecy
    char_start: 334348
    char_end: 334803
    start_quote: By thee conducted first, I enter’d the Parnassian grots, and quaff’d
    end_quote: Poet and Christian both to thee I owed.
    why: Statius's confession that Virgil's Fourth Eclogue converted him without Virgil's own knowledge
      is the unit's clearest case of meaning becoming legible only in retrospect, a history-machine-shaped
      moment.
  - id: dante-divine-comedy#u12-c4
    label: c4
    heading: Bonagiunta names the dolce stil novo
    char_start: 345983
    char_end: 346429
    start_quote: Count of me but as one Who am the scribe of love
    end_quote: Sees not the distance parts one style from other.
    why: Dante's self-definition as poetic amanuensis and Bonagiunta's admission that the older school
      never grasped what separated the new style is the unit's key statement on literary succession recognized
      from outside.
  - id: dante-divine-comedy#u12-c5
    label: c5
    heading: Forese on his widow Nella's prayers
    char_start: 341456
    char_end: 341852
    start_quote: To drink up the sweet wormwood of affliction
    end_quote: More singly eminent for virtuous deeds.
    why: Grounds the terrace's abstract penance in a specific, tender account of marital devotion pulling
      a soul through Ante-purgatory early.
  - id: dante-divine-comedy#u12-c6
    label: c6
    heading: The angel's beatitude on temperance
    char_start: 349994
    char_end: 350422
    start_quote: As when, to harbinger the dawn, springs up
    end_quote: Still hung’ring as the rule of temperance wills.”
    why: Closes the terrace with the defining formula of temperance as calibrated rather than eliminated
      appetite, marking the transition point in the ascent.
- nn: 13
  unit_id: purgatory-cantos-25-28
  note_id: dante-divine-comedy-purgatory-cantos-25-28
  span: 350439:375053
  chunks:
  - id: dante-divine-comedy#u13-c1
    label: c1
    heading: Statius on the soul's ensoulment
    char_start: 353338
    char_end: 353715
    start_quote: Open thy bosom to the truth that comes.
    end_quote: And feels, and bends reflective on itself.
    why: This is the doctrinal core of Statius's discourse, explaining how an individual, self-aware soul
      is breathed into being — the theory that resolves Dante's question about shades feeling hunger.
  - id: dante-divine-comedy#u13-c2
    label: c2
    heading: The terrace's paired cries of lust and chastity
    char_start: 355460
    char_end: 356034
    start_quote: Then from the bosom of the burning mass,
    end_quote: Of wedded love.
    why: 'Shows the terrace''s purgative method directly: penitents purify themselves by crying out both
      an excess and its chaste counter-example within the same flame.'
  - id: dante-divine-comedy#u13-c3
    label: c3
    heading: Guinizelli names himself and the two processions
    char_start: 359085
    char_end: 359879
    start_quote: O blessed, who, for death preparing, tak’st
    end_quote: Already cleanse me.”
    why: The spirit's self-identification as Guinicelli, alongside his explanation of the two groups'
      distinct sins, is the terrace's key moment of literary and moral disclosure.
  - id: dante-divine-comedy#u13-c4
    label: c4
    heading: Arnaut Daniel's farewell
    char_start: 361955
    char_end: 362211
    start_quote: I am Arnault; and with songs,
    end_quote: Remember ye my suff’rings.”
    why: Arnaut Daniel's self-naming and plea to be remembered close the terrace's poetic sequence, marking
      the last named soul the pilgrim meets in Purgatory proper.
  - id: dante-divine-comedy#u13-c5
    label: c5
    heading: Virgil crowns Dante sovereign over himself
    char_start: 367704
    char_end: 368481
    start_quote: Both fires, my son,
    end_quote: With crown and mitre, sovereign o’er thyself.”
    why: Virgil's formal discharge of his guiding role, declaring Dante's will now sufficient authority,
      is the structural pivot from guided ascent to autonomous entry into Eden.
  - id: dante-divine-comedy#u13-c6
    label: c6
    heading: The dream of Leah and Rachel
    char_start: 366449
    char_end: 366976
    start_quote: A lady young and beautiful, I dream’d,
    end_quote: In contemplation, as in labour mine.”
    why: The prophetic dream stages the active/contemplative pairing on the threshold of the Earthly Paradise,
      prefiguring the Matelda/Beatrice figures to come.
- nn: 14
  unit_id: purgatory-cantos-29-33
  note_id: dante-divine-comedy-purgatory-cantos-29-33
  span: 375053:407472
  chunks:
  - id: dante-divine-comedy#u14-c1
    label: c1
    heading: Virgil's disappearance
    char_start: 383656
    char_end: 383863
    start_quote: But Virgil had bereav’d us of himself,
    end_quote: My undew’d cheeks from blur of soiling tears.
    why: Marks the abrupt withdrawal of reason's guidance at the precise moment revelation arrives, the
      poem's central liminal turn.
  - id: dante-divine-comedy#u14-c2
    label: c2
    heading: Beatrice names herself
    char_start: 384646
    char_end: 384796
    start_quote: Observe me well. I am, in sooth, I am
    end_quote: Thy happiness is whole?
    why: Beatrice's stern self-identification sets the register of judgment, not reunion, that governs
      the confession to follow.
  - id: dante-divine-comedy#u14-c3
    label: c3
    heading: The forced confession
    char_start: 389148
    char_end: 389648
    start_quote: A bitter sigh I drew, then scarce found voice
    end_quote: Of justice doth run counter to the edge.
    why: The poem's explicit statement that self-accusation, not concealment, is what satisfies justice
      in this court.
  - id: dante-divine-comedy#u14-c4
    label: c4
    heading: The whore and the giant
    char_start: 400671
    char_end: 401199
    start_quote: O’er it methought there sat, secure as rock
    end_quote: Shielded the harlot and the new-form’d brute.
    why: The pageant's climactic allegory of ecclesiastical corruption and capture, the unit's most historically
      charged image.
  - id: dante-divine-comedy#u14-c5
    label: c5
    heading: The charge to write
    char_start: 398557
    char_end: 398820
    start_quote: 'A little while thou shalt be forester here:'
    end_quote: Take heed thou write, returning to that place.
    why: Beatrice explicitly commissions Dante's vision as testimony for the living world, framing the
      poem as instructive record.
  - id: dante-divine-comedy#u14-c6
    label: c6
    heading: Regeneration and the poem's close
    char_start: 407087
    char_end: 407444
    start_quote: Then, Reader, might I sing, though but in part,
    end_quote: Pure and made apt for mounting to the stars.
    why: The closing lines of the Purgatorio, marking completed purification and the threshold into Paradise.
- nn: 15
  unit_id: paradise-cantos-01-05
  note_id: dante-divine-comedy-paradise-cantos-01-05
  span: 407472:437336
  chunks:
  - id: dante-divine-comedy#u15-c1
    label: c1
    heading: The unsayability of paradise
    char_start: 407656
    char_end: 407954
    start_quote: Witness of things, which to relate again
    end_quote: Could store, shall now be matter of my song.
    why: States the poem's foundational problem — that memory and language fail before what paradise shows
      — framing everything that follows as a partial, effortful record.
  - id: dante-divine-comedy#u15-c2
    label: c2
    heading: Transhumanizing beyond words
    char_start: 410085
    char_end: 410468
    start_quote: Her eyes fast fix’d on the eternal wheels,
    end_quote: For those whom grace hath better proof in store
    why: The pivotal moment where Dante names his own transformation 'transhuman' and explicitly refuses
      to describe it, reaching for myth instead of direct statement.
  - id: dante-divine-comedy#u15-c3
    label: c3
    heading: The order that makes the universe resemble God
    char_start: 411744
    char_end: 412361
    start_quote: 'Then thus began: “Among themselves all things'
    end_quote: This the brute earth together knits, and binds.
    why: Lays out the totalizing hierarchical order underlying the whole cosmos, the theological analogue
      to a world machine's deep organizing infrastructure.
  - id: dante-divine-comedy#u15-c4
    label: c4
    heading: 'Piccarda: peace as willing one''s place'
    char_start: 422884
    char_end: 423614
    start_quote: Is in composure settled by the power
    end_quote: Whatever it creates and nature makes.
    why: Piccarda's doctrine that blessedness means wanting nothing beyond one's assigned rank is the
      poem's clearest statement of contentment within a fixed hierarchical order.
  - id: dante-divine-comedy#u15-c5
    label: c5
    heading: Free will as God's supreme gift, and the vow as covenant
    char_start: 432285
    char_end: 432798
    start_quote: Supreme of gifts, which God creating gave
    end_quote: What compensation therefore may he find?
    why: 'Grounds Beatrice''s entire vow argument: because free will is the highest gift, a vow given
      away cannot simply be reclaimed or substituted at will.'
  - id: dante-divine-comedy#u15-c6
    label: c6
    heading: The mirror experiment
    char_start: 417425
    char_end: 418200
    start_quote: From this perplexity will free thee soon
    end_quote: Shall quiver where it falls.
    why: A rare moment of proposed empirical demonstration inside the vision poem, showing Beatrice arguing
      by controlled experiment rather than authority alone.
- nn: 16
  unit_id: paradise-cantos-06-10
  note_id: dante-divine-comedy-paradise-cantos-06-10
  span: 437336:468309
  chunks:
  - id: dante-divine-comedy#u16-c1
    label: c1
    heading: Justinian's verdict on Guelphs and Ghibellines
    char_start: 441376
    char_end: 442406
    start_quote: Hear now and wonder at what next I tell.
    end_quote: Will truck its armour for his lilied shield.
    why: Justinian's closing judgment reduces the eagle-standard's millennium of legitimacy to a symbol
      both factions have emptied and misused, the unit's clearest case of decayed institutional authority.
  - id: dante-divine-comedy#u16-c2
    label: c2
    heading: Beatrice on why God chose the Incarnation
    char_start: 447351
    char_end: 448478
    start_quote: Fix now thine eye, intently as thou canst,
    end_quote: Humbled himself to put on mortal flesh.
    why: This is the core of Beatrice's scholastic argument that the Incarnation was the maximal possible
      act of both justice and bounty, the theological spine of Canto VII.
  - id: dante-divine-comedy#u16-c3
    label: c3
    heading: Charles Martel on nature's necessary diversity
    char_start: 455005
    char_end: 456211
    start_quote: Thus did he come, deducing to this point,
    end_quote: Therefore your steps have wander’d from the paths.”
    why: States the unit's clearest claim about differentiated human vocations rooted in nature and betrayed
      by institutions that force people into the wrong roles.
  - id: dante-divine-comedy#u16-c4
    label: c4
    heading: 'The cursed flower: Florence''s corruption of Rome'
    char_start: 461478
    char_end: 462122
    start_quote: The Pope recks little now. Thy city, plant
    end_quote: Shall be deliver’d from the adult’rous bond.”
    why: Dante's sharpest indictment of papal corruption by Florentine gold, a vivid image of a monetary
      order overtaking a sacred one at the dawn of the money economy.
  - id: dante-divine-comedy#u16-c5
    label: c5
    heading: Aquinas opens the circle of the wise
    char_start: 466051
    char_end: 466294
    start_quote: I then was of the lambs, that Dominic
    end_quote: 'Is this: and of Aquinum, Thomas I.'
    why: Marks the start of the Sun's canon of theologians and philosophers, the passage that inaugurates
      the roll call structuring the rest of the unit's close.
- nn: 17
  unit_id: paradise-cantos-11-14
  note_id: dante-divine-comedy-paradise-cantos-11-14
  span: 468309:491195
  chunks:
  - id: dante-divine-comedy#u17-c1
    label: c1
    heading: The vanity of mortal pursuits
    char_start: 468309
    char_end: 468827
    start_quote: O fond anxiety of mortal men!
    end_quote: Was rais’d aloft, and made the guest of heav’n.
    why: Frames the whole unit's viewpoint from paradise by cataloguing the worldly ambitions Dante has
      been lifted above.
  - id: dante-divine-comedy#u17-c2
    label: c2
    heading: Francis's marriage to Lady Poverty
    char_start: 470566
    char_end: 471282
    start_quote: A dame to whom none openeth pleasure’s gate
    end_quote: take at large The rovers’ titles—Poverty and Francis.
    why: The central allegorical image of Aquinas's eulogy, casting Francis's founding of his order as
      a marriage.
  - id: dante-divine-comedy#u17-c3
    label: c3
    heading: Aquinas laments the Dominicans' decline
    char_start: 473284
    char_end: 473649
    start_quote: But hunger of new viands tempts his flock,
    end_quote: A little stuff may furnish out their cloaks.
    why: A Dominican's own confession that his order has strayed from its founder, the first half of the
      unit's chiastic decay structure.
  - id: dante-divine-comedy#u17-c4
    label: c4
    heading: Bonaventura laments the Franciscans' decline
    char_start: 478380
    char_end: 478709
    start_quote: So courteously unto thee. But the track,
    end_quote: When the rejected tares in vain shall ask Admittance to the barn.
    why: The mirror-image lament from a Franciscan about his own order, completing the unit's structural
      chiasmus of mutual praise and self-criticism.
  - id: dante-divine-comedy#u17-c5
    label: c5
    heading: The wax and the seal
    char_start: 482582
    char_end: 482872
    start_quote: Are in your talents various. Were the wax
    end_quote: Resembling thus the artist in her work, Whose faultering hand is faithless to his skill.
    why: The unit's key philosophical image explaining why created things imperfectly embody divine ideas,
      grounding the later warning against hasty judgment.
  - id: dante-divine-comedy#u17-c6
    label: c6
    heading: Warning against premature judgment
    char_start: 485068
    char_end: 485581
    start_quote: Let not the people be too swift to judge,
    end_quote: For one of these may rise, the other fall.”
    why: Aquinas's closing parables (the thorn that later blooms, the ship that sinks in harbor) crystallize
      the unit's epistemic-humility theme.
- nn: 18
  unit_id: paradise-cantos-15-18
  note_id: dante-divine-comedy-paradise-cantos-15-18
  span: 491195:515108
  chunks:
  - id: dante-divine-comedy#u18-c1
    label: c1
    heading: 'The falling star: Cacciaguida''s approach'
    char_start: 491643
    char_end: 492153
    start_quote: As oft along the still and pure serene,
    end_quote: Like flame in alabaster, glow’d its course.
    why: The extended simile that introduces Cacciaguida frames ancestral memory as a bright, non-depleting
      appearance within a stable order — the episode's key formal gesture.
  - id: dante-divine-comedy#u18-c2
    label: c2
    heading: 'Old Florence: a bounded, legible city'
    char_start: 495113
    char_end: 496066
    start_quote: Florence, within her ancient limit-mark,
    end_quote: And none left desolate a-bed for France!
    why: Cacciaguida's portrait of austere, self-consistent old Florence is the unit's central image of
      a legible civic order later lost to mixture and excess.
  - id: dante-divine-comedy#u18-c3
    label: c3
    heading: Nobility as a quickly-shortened cloak
    char_start: 497136
    char_end: 497503
    start_quote: O slight respect of man’s nobility!
    end_quote: Goes round thee with his shears.
    why: This self-undermining aphorism critiques the very ancestral pride the episode otherwise celebrates,
      giving the genealogical praise real argumentative tension.
  - id: dante-divine-comedy#u18-c4
    label: c4
    heading: Prophecy of exile
    char_start: 505829
    char_end: 506188
    start_quote: A faithful witness. Thou shall leave each thing
    end_quote: With whom thou must be thrown into these straits.
    why: Cacciaguida's unflinching forecast of bitter bread, others' stairs, and betrayal is the dramatic
      hinge of Cantos XV–XVIII and the poem's own claim to costly, untimely truth-telling.
  - id: dante-divine-comedy#u18-c5
    label: c5
    heading: The eagle-letters of Jupiter
    char_start: 512232
    char_end: 513199
    start_quote: Our language. And as birds, from river banks
    end_quote: Making the star seem silver streak’d with gold.
    why: The souls spelling out a call for justice letter by letter stages legibility as self-organizing
      collective spectacle rather than imposed order.
- nn: 19
  unit_id: paradise-cantos-19-22
  note_id: dante-divine-comedy-paradise-cantos-19-22
  span: 515108:539559
  chunks:
  - id: dante-divine-comedy#u19-c1
    label: c1
    heading: Human justice as an eye that cannot see the sea's bottom
    char_start: 517329
    char_end: 517738
    start_quote: The ken, your world is gifted with, descends
    end_quote: ’Tis darkness all, or shadow of the flesh, Or else its poison.
    why: States the eagle's core argument that divine Justice is structurally illegible to finite mortal
      vision, the unit's central epistemic claim.
  - id: dante-divine-comedy#u19-c2
    label: c2
    heading: The virtuous man born on the Indus
    char_start: 517894
    char_end: 518372
    start_quote: A man Is born on Indus’ banks, and none is there
    end_quote: With the short-sighted vision of a span?
    why: The pilgrim's own formulation of the virtuous-pagan problem, answered by the eagle with a rebuke
      of presumptuous human judgment.
  - id: dante-divine-comedy#u19-c3
    label: c3
    heading: Ripheus the Trojan among the saved
    char_start: 523872
    char_end: 524116
    start_quote: Who in the erring world beneath would deem,
    end_quote: Reach not its utmost depth.”
    why: 'The eagle''s most startling reversal: a pagan from Virgil''s Aeneid is revealed saved, dramatizing
      predestination''s inscrutability.'
  - id: dante-divine-comedy#u19-c4
    label: c4
    heading: Peter Damian on bloated modern prelates
    char_start: 532340
    char_end: 532766
    start_quote: Cephas came; He came, who was the Holy Spirit’s vessel,
    end_quote: O patience! thou That lookst on this and doth endure so long.”
    why: Contrasts apostolic austerity with the physical and moral bloat of contemporary church leadership,
      the unit's sharpest institutional-decay image.
  - id: dante-divine-comedy#u19-c5
    label: c5
    heading: 'Benedict: the white grown murky'
    char_start: 536776
    char_end: 537124
    start_quote: His convent Peter founded without gold Or silver; I with pray’rs and fasting mine;
    end_quote: May at God’s pleasure work amendment here.”
    why: Benedict's own statement of the decay arc from a founding order's poverty and discipline to its
      later corruption, closely tracking a founding-to-ornamental decay pattern.
  - id: dante-divine-comedy#u19-c6
    label: c6
    heading: Looking back down at the shrunken earth
    char_start: 538577
    char_end: 539493
    start_quote: I straight obey’d; and with mine eye return’d
    end_quote: Forth from the havens stretch’d unto the hills.
    why: The unit's cosmic capstone, in which the pilgrim's telescopic view of the whole earth relativizes
      the political and ecclesiastical invective that precedes it.
- nn: 20
  unit_id: paradise-cantos-23-28
  note_id: dante-divine-comedy-paradise-cantos-23-28
  span: 539559:575559
  chunks:
  - id: dante-divine-comedy#u20-c1
    label: c1
    heading: The ineffability of Beatrice's smile
    char_start: 541780
    char_end: 542473
    start_quote: Which never may be cancel’d from the book,
    end_quote: No unribb’d pinnace, no self-sparing pilot.
    why: States the poem's recurring formal admission that language cannot bear the weight of what it
      depicts, framed as a vessel needing unusual strength for the voyage.
  - id: dante-divine-comedy#u20-c2
    label: c2
    heading: 'Peter''s catechism: the definition of faith'
    char_start: 547678
    char_end: 548781
    start_quote: Declare thee, What is faith?” Whereat I rais’d
    end_quote: 'Th’ intention is deriv’d.” Forthwith I heard:'
    why: The unit's central staging of theology as oral disputation, with Dante formally examined and
      passing the test of orthodox definition.
  - id: dante-divine-comedy#u20-c3
    label: c3
    heading: Hope for the poet's laurel at the baptismal font
    char_start: 551972
    char_end: 552563
    start_quote: If e’er the sacred poem that hath made
    end_quote: Peter had then circled my forehead thus.
    why: Dante's famous autobiographical wish to return from exile and be crowned poet in Florence, fusing
      personal hope with the canto's theme of theological Hope.
  - id: dante-divine-comedy#u20-c4
    label: c4
    heading: Adam on the true cause of the Fall and the lost first language
    char_start: 562830
    char_end: 563696
    start_quote: Whence truly sprang the wrath that banish’d me;
    end_quote: She leaves to you, as ye do most affect it.
    why: Adam corrects the popular account of the Fall and reveals that humanity's first language had
      already vanished before Babel, a compressed image of convention decaying and being replaced.
  - id: dante-divine-comedy#u20-c5
    label: c5
    heading: Peter's wrathful denunciation of the corrupted papacy
    char_start: 564949
    char_end: 566485
    start_quote: He who usurps on earth (my place, ay, mine,
    end_quote: To what a vile conclusion must thou stoop!
    why: The unit's most explicit statement of an institution's apostolic founding hollowed out by its
      present custodians, Peter's own color changing as he speaks.
  - id: dante-divine-comedy#u20-c6
    label: c6
    heading: The Point and the nine circles; the inverted hierarchy resolved
    char_start: 570667
    char_end: 573031
    start_quote: On mine; a point I saw, that darted light
    end_quote: Suited in strict and wondrous harmony.”
    why: 'The unit''s central cosmological vision and its resolution: rings nearest the Point are smallest
      yet swiftest and purest, ordered by virtue and love rather than physical extension.'
- nn: 21
  unit_id: paradise-cantos-29-33
  note_id: dante-divine-comedy-paradise-cantos-29-33
  span: 575559:605559
  chunks:
  - id: dante-divine-comedy#u21-c1
    label: c1
    heading: Entering the Empyrean
    char_start: 583644
    char_end: 583975
    start_quote: Forth from the last corporeal are we come
    end_quote: Which in the final judgment thou shalt see.
    why: Beatrice's precise naming of the Empyrean as unbodied light coincident with intellect, love,
      and joy sets the register for the rest of the unit.
  - id: dante-divine-comedy#u21-c2
    label: c2
    heading: Beatrice's polemic against corrupt preachers
    char_start: 579765
    char_end: 581018
    start_quote: 'The aim of all Is how to shine: e’en they, whose office is'
    end_quote: They scarce would wait to hear the blessing said.
    why: A pointed historical critique of preaching hollowed into spectacle, the poem's clearest instance
      of institutional form outliving its function.
  - id: dante-divine-comedy#u21-c3
    label: c3
    heading: The river of light resolves into the rose
    char_start: 584523
    char_end: 586134
    start_quote: And in the likeness of a river saw
    end_quote: Before me either court of heav’n displac’d.
    why: The pivotal transformation scene in which Dante's vision is remade so he can perceive the celestial
      rose, staging the poem's core theme of vision earning its own object.
  - id: dante-divine-comedy#u21-c4
    label: c4
    heading: The empty throne and the doomed pope
    char_start: 587444
    char_end: 588245
    start_quote: This fair assemblage! stoles of snowy white
    end_quote: 'Will sink beneath him: such will be his meed.'
    why: Dante's sharpest topical intrusion, prophesying both an emperor's failed redemption of Italy
      and a pope's damnation, fusing cosmic vision with contemporary politics.
  - id: dante-divine-comedy#u21-c5
    label: c5
    heading: Bernard's prayer to the Virgin
    char_start: 599820
    char_end: 601411
    start_quote: O virgin mother, daughter of thy Son,
    end_quote: Stretch their clasp’d hands, in furtherance of my suit!
    why: The poem's set-piece Marian prayer, the mechanism by which Dante is finally granted the vision
      of God that closes the Comedy.
  - id: dante-divine-comedy#u21-c6
    label: c6
    heading: The vision of the Trinity and the poem's final line
    char_start: 604335
    char_end: 605558
    start_quote: In that abyss Of radiance, clear and lofty, seem’d methought,
    end_quote: That moves the sun in heav’n and all the stars.
    why: The Comedy's culminating vision of the three-circled Godhead and human likeness within it, ending
      on the poem's single most famous line.
