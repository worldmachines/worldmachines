source: grove-green-imperialism
units:
- nn: 1
  unit_id: introduction
  note_id: grove-green-imperialism-introduction
  span: 0:39477
  chunks:
  - id: grove-green-imperialism#u01-c1
    heading: 'The current ‘crisis’ has an eighteenth-century policy history'
    span: 1043:2309
    why: 'States the book''s core revisionist claim that scientifically informed state forest and climate policy, not just popular concern, existed by the mid-eighteenth century and was already global in scope by 1850.'
  - id: grove-green-imperialism#u01-c2
    heading: 'Displacing the Anglo-American conservationist pantheon'
    span: 4261:5047
    why: 'Names Grove''s explicit historiographical target: the elevation of Marsh, Thoreau, and Roosevelt has obscured the colonial and Indian roots of Western environmental thought.'
  - id: grove-green-imperialism#u01-c3
    heading: 'Island Edens turned ecological crisis zones'
    span: 11309:12402
    why: 'Names the specific islands (Canary Islands, Madeira, West Indies, St Helena, Mauritius) where Edenic literary imagination collided with visible ecological collapse, the empirical seedbed of the book''s whole argument.'
  - id: grove-green-imperialism#u01-c4
    heading: 'Colonial state as ambivalent, interventionist actor'
    span: 15553:17222
    why: 'Grove''s sharpest rebuttal of a monolithic ''ecological imperialism'' thesis, arguing the colonial state was heterogeneous, open to scientific lobbying, and more capable of environmental intervention than the metropole.'
  - id: grove-green-imperialism#u01-c5
    heading: 'Mauritius: physiocrats, Rousseau, and the first conservation programme'
    span: 21171:22738
    why: 'Introduces Poivre, Commerson, and Bernardin de Saint-Pierre''s 1768–1810 Mauritius programme as the first systematic case of state conservation, framed by Rousseauian and physiocratic reform politics.'
  - id: grove-green-imperialism#u01-c6
    heading: 'Humboldt, Scottish EIC surgeons, and the globalised critique'
    span: 25810:27788
    why: 'Traces the chain from Humboldt''s Hindu-inflected ecological holism to Scottish-trained East India Company surgeons (Gibson, Balfour, Cleghorn) who converted desiccation theory into Indian state forest policy.'
- nn: 2
  unit_id: ch01-s1-early-conservation
  note_id: grove-green-imperialism-ch01-s1-early-conservation
  span: 39477:58392
  chunks:
  - id: grove-green-imperialism#u02-c1
    heading: 'Grove''s methodological framing'
    span: 41545:42168
    why: 'States Grove''s guiding method — tracing the construction of Western discourse about nature rather than hunting for an origin point — which frames the whole book''s argument.'
  - id: grove-green-imperialism#u02-c2
    heading: 'Humbaba as guardian of the cedar forest'
    span: 47325:47635
    why: 'Grove''s earliest textual evidence that an ancient literate society explicitly linked deforestation to drought and mythologized forest protection against the demands of civilization.'
  - id: grove-green-imperialism#u02-c3
    heading: 'Theophrastus''s deforestation-rainfall theory'
    span: 50811:51392
    why: 'Identifies the classical-world origin of the deforestation-causes-drought theory that becomes desiccationism, and explains why it lay dormant for over a millennium before mattering to policy.'
  - id: grove-green-imperialism#u02-c4
    heading: 'Naming the ''search for Eden'''
    span: 57792:58238
    why: 'Grove''s own naming of the deep cross-cultural motivational thread that connects ancient environmental degradation to the coming era of European maritime and colonial expansion.'
  - id: grove-green-imperialism#u02-c5
    heading: 'The botanical garden as Paradise-institution'
    span: 54491:54978
    why: 'States the thesis that the botanical garden functions as a symbolic re-creation of Paradise and an organizing device for natural knowledge, foreshadowing the book''s colonial garden institutions.'
  - id: grove-green-imperialism#u02-c6
    heading: 'Sanskrit medico-botanical texts enter Arabic learning'
    span: 54980:55508
    why: 'Documents the concrete route by which Indic (Sanskrit) botanical and medical knowledge entered the Arab tradition that would later feed European botanical science — the pre-history of the book''s indigenous-knowledge theme.'
- nn: 3
  unit_id: ch01-s2-island-environments-1400-1660
  note_id: grove-green-imperialism-ch01-s2-island-environments-1400-1660
  span: 58392:78599
  chunks:
  - id: grove-green-imperialism#u03-c1
    heading: 'The opening thesis: two new ways of perceiving nature'
    span: 58502:59319
    why: 'States the unit''s opening thesis that overseas expansion after 1400 produced both a new awareness of human power to alter environments and a new symbolic weight attached to nature, including the botanical garden and the island.'
  - id: grove-green-imperialism#u03-c2
    heading: 'Man as geographical agent, realized through colonial encounter'
    span: 62342:62882
    why: 'Dates the maturation of the ''man as geographical agent'' idea to the colonial encounter with tropical environments, the pivot on which Grove''s larger argument turns.'
  - id: grove-green-imperialism#u03-c3
    heading: 'Venice''s Council of Ten and the failure of oak conservation'
    span: 67250:68287
    why: 'Grove''s paradigm case of a premodern state conservation effort that failed against economic pressure and peasant sabotage, foreshadowing later colonial conservation struggles.'
  - id: grove-green-imperialism#u03-c4
    heading: 'The slow diffusion of Venetian environmental knowledge'
    span: 70214:70711
    why: 'Shows Grove''s claim that environmental knowledge diffused extremely slowly through weak scientific institutions, resurfacing only via an 1851 Indian conservation precedent.'
  - id: grove-green-imperialism#u03-c5
    heading: 'Columbus''s deforestation-rainfall connection'
    span: 75382:76189
    why: 'Identifies Columbus as the first post-classical figure to consciously link deforestation to rainfall decline, the seed of the desiccation theory Grove traces through the rest of the book.'
  - id: grove-green-imperialism#u03-c6
    heading: 'The island as a bounded, knowable microcosm'
    span: 77986:78597
    why: 'Names the island''s essential quality for colonizers, a bounded, mentally graspable unit of nature, the perceptual precondition for the island-Eden idea explored later in the book.'
- nn: 4
  unit_id: ch01-s3-discourse-of-islands
  note_id: grove-green-imperialism-ch01-s3-discourse-of-islands
  span: 78599:102745
  chunks:
  - id: grove-green-imperialism#u04-c1
    heading: 'Columbus''s Eden as motive for discovery'
    span: 79315:79712
    why: 'Grove locates the Eden-island fantasy at the origin of discovery itself, treating it as a psychological motive rather than after-the-fact decoration.'
  - id: grove-green-imperialism#u04-c2
    heading: 'Prospero''s books: knowledge as instrument of dispossession'
    span: 84526:84776
    why: 'Names the mechanism, of written/empirical knowledge enabling material control over land and people, that Grove will later trace into the colonial botanical-scientific apparatus.'
  - id: grove-green-imperialism#u04-c3
    heading: 'Gonzalo and Sebastian dispute the island''s nature'
    span: 85639:86223
    why: 'Grove''s key primary-text evidence for the period''s inability to hold the island''s contradictory, heterogeneous reality without collapsing it into stereotype.'
  - id: grove-green-imperialism#u04-c4
    heading: 'Rarity as proto-classificatory category'
    span: 87917:88252
    why: 'Grove''s own argumentative bridge from literary fascination with the singular and exotic to the eighteenth-century empirical science of botanical classification.'
  - id: grove-green-imperialism#u04-c5
    heading: 'A chapbook''s Eden: Brooksby''s Cape Verdes'
    span: 97137:97550
    why: 'Primary evidence of how popular travel literature translated the literary Eden-island trope onto concrete, nameable geography for a mass English readership.'
- nn: 5
  unit_id: ch01-s4-st-helena-mauritius-insular
  note_id: grove-green-imperialism-ch01-s4-st-helena-mauritius-insular
  span: 102745:116647
  chunks:
  - id: grove-green-imperialism#u05-c1
    heading: 'Mandelslo''s 1647 St Helena: paradise as provisioning station'
    span: 104808:107015
    why: 'The primary archival voice Grove builds his argument on: a block quotation showing paradise-imagery organized around the practical calculus of water, food, and safe revictualling.'
  - id: grove-green-imperialism#u05-c2
    heading: 'Water as paramount; man''s presence as improving, not degrading'
    span: 107017:107867
    why: 'Grove''s own framing argument: the Edenic imagery is structured by water supply, and man''s role is read here as constructive, the inverse of the later deforestation-desiccation story.'
  - id: grove-green-imperialism#u05-c3
    heading: 'St Thomas Island: tree cover and rainfall observed, not yet theorized'
    span: 107869:108438
    why: 'An embryonic observation linking forest cover to precipitation, the seed of the desiccation theory Grove traces through Poivre and later colonial scientists.'
  - id: grove-green-imperialism#u05-c4
    heading: 'Mauritius: tame birds, the dodo, and the shipwreck that fed Robinson Crusoe'
    span: 109378:110125
    why: 'Links the extinction-foreshadowing vulnerability of unspoiled island nature to the literary afterlife of the isolated-European-castaway narrative.'
  - id: grove-green-imperialism#u05-c5
    heading: 'Le Guat''s Rodriguez: refuge as earthly paradise'
    span: 112684:113416
    why: 'The Huguenot refugees'' own paradisal voice, curated directly rather than only through Grove''s paraphrase, showing exile trauma transmuted into Edenic language.'
  - id: grove-green-imperialism#u05-c6
    heading: 'Disconnecting the Fall of Man from the Fall of Nature'
    span: 114375:116645
    why: 'Grove''s capstone claim for the unit: a Calvinist-inflected aesthetic turn toward valuing wilderness undisturbed by man, positioned as a precocious forerunner of Romanticism.'
- nn: 6
  unit_id: ch01-s5-aesthetic-transitions
  note_id: grove-green-imperialism-ch01-s5-aesthetic-transitions
  span: 116647:131920
  chunks:
  - id: grove-green-imperialism#u06-c1
    heading: 'Periodizing against Enlightenment and Romanticism'
    span: 117686:119281
    why: 'States Grove''s core historiographical claim for the unit: the decisive transition in European attitudes to nature predates and is obscured by the standard Enlightenment/Romanticism periodization.'
  - id: grove-green-imperialism#u06-c2
    heading: 'Mechanistic science as both destroyer and enabler'
    span: 121060:122091
    why: 'Carries Grove''s key dialectical move: reductionist science objectified nature but also supplied the measurement tools that made ecological critique possible, prefiguring his treatment of Hales later in the book.'
  - id: grove-green-imperialism#u06-c3
    heading: 'Shakespeare, the decline of magic, and Paradise made geographical'
    span: 122545:123596
    why: 'Links the book''s central Edenic-island trope to a specific European literary and intellectual moment, showing paradise shifting from a spiritual hope to a geographical expectation.'
  - id: grove-green-imperialism#u06-c4
    heading: 'Floating capital and unprecedented tropical deforestation'
    span: 125093:125615
    why: 'States the material-economic hinge of the unit''s argument: European capital accumulation, not ideas alone, scaled colonial deforestation beyond anything seen in Europe.'
  - id: grove-green-imperialism#u06-c5
    heading: 'Dutch land control, literacy, and the Cape as planned Eden'
    span: 129977:131918
    why: 'Closes the unit by tracing Dutch environmental control and literacy directly to the founding logic of the colonial botanical garden, the book''s key institutional thread.'
- nn: 7
  unit_id: ch01-s6-ecological-pressures
  note_id: grove-green-imperialism-ch01-s6-ecological-pressures
  span: 131920:172061
  chunks:
  - id: grove-green-imperialism#u07-c1
    heading: 'Braudel: a shattered ''biological Ancien Régime'''
    span: 132932:133320
    why: 'Sets the deep-time, world-historical frame (a primary theoretical voice, Fernand Braudel) that Grove spends the rest of the unit qualifying and complicating.'
  - id: grove-green-imperialism#u07-c2
    heading: 'Colbert''s 1669 Forest Ordinance: legibility over posterity'
    span: 144261:145029
    why: 'Grove''s clearest statement of the France/England institutional divergence: centralized state regulation of a natural resource versus common-rights political deadlock.'
  - id: grove-green-imperialism#u07-c3
    heading: 'Evelyn''s Arcadian America: an inexhaustible frontier'
    span: 140895:141521
    why: 'Shows the ideological logic (colony as boundless Eden/Arcadia) that let England treat its own deforestation as a non-problem.'
  - id: grove-green-imperialism#u07-c4
    heading: 'The centre-periphery thesis, stated directly'
    span: 147307:147855
    why: 'The unit''s organizing claim in Grove''s own words: peripheral ecological damage was faster and more catastrophic than gradual metropolitan pressure.'
  - id: grove-green-imperialism#u07-c5
    heading: 'Tokugawa Japan and the island-consciousness argument'
    span: 149958:150837
    why: 'Grove''s key evidence against Eurocentric world-system diffusionism and his most explicit claim that insularity itself drives conservationist thinking.'
  - id: grove-green-imperialism#u07-c6
    heading: 'Barbados: soil loss and landslides documented in real time'
    span: 159895:160239
    why: 'The empirical anchor for catastrophic, officially-witnessed peripheral ecological collapse, contrasted with the slower metropolitan pattern.'
- nn: 8
  unit_id: ch02-s1-south-west-india
  note_id: grove-green-imperialism-ch02-s1-south-west-india
  span: 172061:189139
  chunks:
  - id: grove-green-imperialism#u08-c1
    heading: 'Botanical gardens as instruments of imperial science'
    span: 172672:173381
    why: 'States Grove''s framing claim that the rise of the botanical garden is a direct, traceable index of Europe''s expanding grip on global nature.'
  - id: grove-green-imperialism#u08-c2
    heading: 'The garden as re-creation of Paradise'
    span: 178711:179211
    why: 'Names the Edenic/religious symbolism Grove attaches to the botanical garden, a motif that recurs across the book''s island and garden case studies.'
  - id: grove-green-imperialism#u08-c3
    heading: 'Orta and van Reede as indigenous texts'
    span: 183406:185147
    why: 'This is the chapter''s central claim: the two founding texts of European tropical botany are themselves compilations of Malayali/Ayurvedic knowledge, not European impositions on it.'
  - id: grove-green-imperialism#u08-c4
    heading: 'Caste, Brahminical knowledge, and the direction of diffusion'
    span: 186738:187236
    why: 'Grove distinguishes medico-botanical diffusion, which privileged non-Brahminical/indigenous technical knowledge, from the usual colonial-discourse story of Brahminical texts shaping European perception.'
  - id: grove-green-imperialism#u08-c5
    heading: 'Reversing the direction of epistemic influence'
    span: 188628:189003
    why: 'States outright Grove''s revisionist thesis: print and botanical compilation diffused indigenous South Asian classification into Europe, not the reverse.'
- nn: 9
  unit_id: ch02-s2-low-caste-epistemologies
  note_id: grove-green-imperialism-ch02-s2-low-caste-epistemologies
  span: 189139:214684
  chunks:
  - id: grove-green-imperialism#u09-c1
    heading: 'Orta''s indictment of Portuguese incuriosity'
    span: 193848:194319
    why: 'Orta''s own polemic against Portuguese incuriosity is the evidentiary core of his subversive, empiricist argument for local over inherited knowledge.'
  - id: grove-green-imperialism#u09-c2
    heading: 'Van Reede dispatches Ezhava collectors and painters'
    span: 208103:208681
    why: 'Van Reede''s first-person account of the Hortus''s actual production process shows Ezhava expertise, not European training, generating the book''s material.'
  - id: grove-green-imperialism#u09-c3
    heading: 'Van Reede''s palace simile for the Malabar forest'
    span: 203089:203481
    why: 'Shows the architectural, aesthetic imagination that Grove argues preceded and shaped van Reede''s scientific and later conservationist thinking.'
  - id: grove-green-imperialism#u09-c4
    heading: 'Itti Achuden''s attested certificate'
    span: 210418:211039
    why: 'The rare surviving instance of the low-caste Ezhava physician Itti Achuden describing his own authorship of the Hortus''s botanical content.'
  - id: grove-green-imperialism#u09-c5
    heading: 'The Ezhava classification''s afterlife in Linnaeus'
    span: 211624:212645
    why: 'Grove''s own argument for the unit''s central claim: Ezhava plant-naming knowledge, fixed in print, materially shaped later European and colonial Indian taxonomy.'
- nn: 10
  unit_id: ch02-s3-botanical-networks
  note_id: grove-green-imperialism-ch02-s3-botanical-networks
  span: 214684:221590
  chunks:
  - id: grove-green-imperialism#u10-c1
    heading: 'The Dutch template diffuses to French and British botany'
    span: 214799:216402
    why: 'States the unit''s core diffusion thesis and the ambivalent survival of indigenous (Ezhava) knowledge inside a commercialising colonial science.'
  - id: grove-green-imperialism#u10-c2
    heading: 'Leiden as the exportable institutional model'
    span: 216404:217183
    why: 'Shows Grove crediting Leiden''s religious tolerance, not just its science, for making its garden model the one Paris, Oxford, Edinburgh, and Chelsea copied.'
  - id: grove-green-imperialism#u10-c3
    heading: 'State patronage and the Jardin du Roi'
    span: 217185:217977
    why: 'Identifies the mechanism by which state-sponsored botanical science converts into political authority, a pattern Grove revisits with the later East India Company surgeons.'
  - id: grove-green-imperialism#u10-c4
    heading: 'The Cape Company Garden as a technology of control'
    span: 217979:220070
    why: 'Grove''s most explicit statement equating comprehensive botanical inventory with acquired colonial control over the global environment, plus the body/botany and island-as-whole-world analogies.'
  - id: grove-green-imperialism#u10-c5
    heading: 'The Cape ahead of St Helena in ecological awareness'
    span: 220072:221588
    why: 'Makes the unit''s causal claim — global botanical knowledge enabled recognition of ecological damage — and sets up the Cape/St Helena contrast the book develops further.'
- nn: 11
  unit_id: ch03-s1-st-helena-1
  note_id: grove-green-imperialism-ch03-s1-st-helena-1
  span: 221590:252102
  chunks:
  - id: grove-green-imperialism#u11-c1
    heading: 'Grove''s chapter thesis: periphery over metropole, island as method and metaphor'
    span: 221710:222737
    why: 'States the chapter''s core comparative claim and frames the tropical island as simultaneously an ecological case study and a literary/Utopian device.'
  - id: grove-green-imperialism#u11-c2
    heading: 'St Helena''s disproportionate historical importance and idiosyncratic response'
    span: 222815:224233
    why: 'Establishes that St Helena was the Company''s first encounter with land degradation, anticipating India, and that its conservationism arose without metropolitan scientific input.'
  - id: grove-green-imperialism#u11-c3
    heading: 'Goats as the primary agent of deforestation, 1533–1816'
    span: 224470:225662
    why: 'Traces the central causal chain from Lopez''s introduced livestock through Cavendish''s 1582 count to Beatson''s retrospective verdict blaming goats for the forests'' total ruin.'
  - id: grove-green-imperialism#u11-c4
    heading: 'Godwin''s Man in the Moone: St Helena as Utopian and cosmological laboratory'
    span: 230520:232906
    why: 'Shows the island functioning as a literary device for dramatising Copernican astronomy and a new consciousness of the earth''s limits, seeding the later island-Utopia genre.'
  - id: grove-green-imperialism#u11-c5
    heading: 'The Company''s own science ignored: Halley''s 1676 hydrological data on St Helena'
    span: 237720:239576
    why: 'Grove''s clearest irony — the Company funded exactly the environmental science (Halley''s hydrological-cycle study, plus known Royal Society reports) it then failed to act on.'
  - id: grove-green-imperialism#u11-c6
    heading: 'Mapping, enclosure, and the failure of company control at a distance'
    span: 244103:246140
    why: 'Documents the Company''s cadastral mapping and 1683 anti-commons letter, and the practical failure of enclosure against colonists'' customary land use — a legibility attempt undone by distance.'
- nn: 12
  unit_id: ch03-s1-st-helena-2
  note_id: grove-green-imperialism-ch03-s1-st-helena-2
  span: 252102:270630
  chunks:
  - id: grove-green-imperialism#u12-c1
    heading: 'Arrack distilling and the 1701 duty on wood grounds'
    span: 253179:253746
    why: 'Primary evidence that arrack distilling was identified as a specific driver of deforestation and that the Council took a deliberate fiscal countermeasure against it in 1701.'
  - id: grove-green-imperialism#u12-c2
    heading: 'An ignored rotational reafforestation proposal'
    span: 254403:254968
    why: 'Shows a considered, quota-based planting scheme proposed and ignored well before the crisis forced Roberts to act, establishing that diagnosis long preceded institutional will.'
  - id: grove-green-imperialism#u12-c3
    heading: 'Roberts''s 1709 order: one acre in ten'
    span: 256767:257253
    why: 'The concrete administrative rule at the centre of the unit: a quantified, land-proportional conservation quota replacing the Company''s unworkable blanket enclosure order.'
  - id: grove-green-imperialism#u12-c4
    heading: 'The islanders'' own petition accepting the quota'
    span: 258301:259453
    why: 'Rare direct evidence of colonial landholders co-authoring the conservation rule that will bind them, rather than simply receiving an imposed order.'
  - id: grove-green-imperialism#u12-c5
    heading: 'Roberts''s 1710 warning of a twenty-year die-off'
    span: 261250:261537
    why: 'Roberts''s starkest, most quantitatively precise warning, later shown by the 1712-14 drought to be essentially accurate.'
  - id: grove-green-imperialism#u12-c6
    heading: 'The 1712-14 drought vindicates Roberts'
    span: 269501:270628
    why: 'The unit''s empirical payoff: Roberts''s predictions borne out under a successor never briefed on the crisis, with the drought reviving the same arrack problem that opened the unit.'
- nn: 13
  unit_id: ch03-s1-st-helena-3
  note_id: grove-green-imperialism-ch03-s1-st-helena-3
  span: 270630:298157
  chunks:
  - id: grove-green-imperialism#u13-c1
    heading: 'Pyke''s letter proposing a Mauritius resettlement'
    span: 272783:273506
    why: 'Pyke''s own 1715 voice comparing a ruined St Helena to an untouched Mauritian paradise carries the book''s Eden/decline argument in primary-source form.'
  - id: grove-green-imperialism#u13-c2
    heading: 'The 1716 ''old ship'' letter'
    span: 277442:278347
    why: 'The governors'' extended ship metaphor is their own theory of ecological crisis, marking the 1715 shift from profit-seeking to environmental triage.'
  - id: grove-green-imperialism#u13-c3
    heading: 'Byfield''s redwood rescue'
    span: 280797:281499
    why: 'Byfield''s rescue of two seedling redwoods is the primary evidence for an explicit, early awareness of island endemism and extinction risk.'
  - id: grove-green-imperialism#u13-c4
    heading: 'The St Helena Forest Act of 1731'
    span: 283984:284923
    why: 'This paragraph names the 1731 Forest Act as one of the first pieces of colonial conservation legislation and shows it originating from an islander petition, not a Company directive.'
  - id: grove-green-imperialism#u13-c5
    heading: 'The Greentree fines overturned by the Directors'
    span: 290495:290954
    why: 'The Directors'' own words overturning a conservation fine because the goats were ''of more use than Ebony'' are the clearest primary evidence of metropolitan indifference to colonial ecological argument.'
  - id: grove-green-imperialism#u13-c6
    heading: 'The Court of Directors adopts desiccation theory, 1794'
    span: 294883:295631
    why: 'This 1794 letter is the primary-source moment where the Company itself adopts the desiccation theory that trees ''have an attractive power on the clouds,'' the belated capstone of the unit''s argument.'
- nn: 14
  unit_id: ch03-s2-dutch-cape-mauritius
  note_id: grove-green-imperialism-ch03-s2-dutch-cape-mauritius
  span: 298157:316165
  chunks:
  - id: grove-green-imperialism#u14-c1
    heading: 'Banks''s 1771 comparison of St Helena and the Cape'
    span: 299270:300515
    why: 'Banks''s own words are the unit''s outside-observer benchmark for judging Dutch versus English colonial land management, the comparison Grove uses to introduce Dutch conservationism as anomalous.'
  - id: grove-green-imperialism#u14-c2
    heading: 'The walled garden as Dutch heraldic and colonial symbol'
    span: 302706:303415
    why: 'Grove''s own claim that the walled-garden crest and secularised paradise imagery, not administrative accident, organized Dutch colonial environmental practice.'
  - id: grove-green-imperialism#u14-c3
    heading: 'Indigenous Malabar knowledge underlying Dutch environmentalism'
    span: 304478:305028
    why: 'States in Grove''s own voice that indigenous Malabar knowledge underlay almost the whole structure of Dutch tropical environmentalism, one of the book''s central epistemological claims.'
  - id: grove-green-imperialism#u14-c4
    heading: 'Van Reede''s Malabar forests transferred to Cape policy'
    span: 305349:305615
    why: 'Identifies the precise biographical mechanism—van Reede''s emotional response to the Malabar forests—by which indigenous forest experience was translated into Cape conservation policy.'
  - id: grove-green-imperialism#u14-c5
    heading: 'The VOC''s deliberate strip-mining of Mauritius ebony'
    span: 313792:314563
    why: 'Primary-source evidence, quoted by Grove, that Dutch practice on Mauritius was a deliberate strip-mining strategy driven by European market demand and inter-imperial competition, not conservation.'
  - id: grove-green-imperialism#u14-c6
    heading: 'The Cape foresees and resents Mauritius''s ebony depletion'
    span: 315619:316163
    why: 'Shows Grove''s contrast working in real time: the interventionist Cape administration recognized and condemned Mauritius''s ebony depletion as a foreseeable resource crisis.'
- nn: 15
  unit_id: ch03-s4-het-paradijs
  note_id: grove-green-imperialism-ch03-s4-het-paradijs
  span: 316165:345188
  chunks:
  - id: grove-green-imperialism#u15-c1
    heading: 'Van Riebeeck''s 1657–58 forest placaats'
    span: 320154:321653
    why: 'This is Grove''s documentary anchor for the earliest Cape forest legislation — licensed woodcutters, felling bans, and protection of yellow-wood — issued within five months of the first Free Burgher settlement.'
  - id: grove-green-imperialism#u15-c2
    heading: 'The almond hedge as administrative island and colour line'
    span: 321878:322907
    why: 'Shows enclosure, timber conservation, and racial boundary-making executed by the same planted hedge, condensing the unit''s legibility argument into one act.'
  - id: grove-green-imperialism#u15-c3
    heading: 'Placaats fail to prevent denudation'
    span: 322910:324204
    why: 'Documents that the Cape''s full regulatory apparatus did not itself prevent deforestation, forcing timber imports — the descriptive/causal gap in colonial legibility.'
  - id: grove-green-imperialism#u15-c4
    heading: 'Huydecoper institutionalizes Cape natural history'
    span: 325584:326290
    why: 'Marks the Cape garden''s precocious institutionalization of medical/scientific expertise, decades ahead of comparable French and British colonial developments.'
  - id: grove-green-imperialism#u15-c5
    heading: 'Het Paradijs reverts, and Malabar-trained naming'
    span: 336268:336803
    why: 'The unit''s title-bearing passage: the ironically named plantation''s reversion, and van Reede''s Malabar-derived objection to VOC woodmen renaming indigenous trees after European species.'
  - id: grove-green-imperialism#u15-c6
    heading: 'The Cape garden''s outsized institutional legacy'
    span: 344633:345186
    why: 'States Grove''s closing claim that the Cape botanical garden model, unlike the VOC''s self-contained forest-management systems, directly shaped later French and British colonial environmental policy.'
- nn: 16
  unit_id: ch03-s5-mauritius-importance
  note_id: grove-green-imperialism-ch03-s5-mauritius-importance
  span: 345188:360509
  chunks:
  - id: grove-green-imperialism#u16-c1
    heading: 'The dodo''s disappearance by 1681'
    span: 346870:347199
    why: 'Marks the dodo''s actual extinction and its link to lowland forest felling, the book''s founding extinction case.'
  - id: grove-green-imperialism#u16-c2
    heading: 'Lamotius proposes a fee to curb ebony extraction'
    span: 350046:350726
    why: 'States Grove''s recurring argument that colonial administrators without commercial stakes became early critics of extractive land use.'
  - id: grove-green-imperialism#u16-c3
    heading: 'Deodati''s 1696 account of the water-retaining ''wet forest'''
    span: 352733:353174
    why: 'Preserves the earliest hydrological observation that Grove treats as a forerunner of later desiccation theory.'
  - id: grove-green-imperialism#u16-c4
    heading: 'Leguat records vanished wildlife on Mauritius, 1691'
    span: 356773:357385
    why: 'The primary Huguenot eyewitness account of extinction that Grove treats as the most acute observation of the period.'
  - id: grove-green-imperialism#u16-c5
    heading: 'Extinction as a fall from a ''God-given Eden'''
    span: 357621:357983
    why: 'Grove''s own interpretive claim that Calvinist Huguenot cosmology moralized species loss as sin, a key hinge in the book''s religious-to-scientific argument.'
  - id: grove-green-imperialism#u16-c6
    heading: 'From Dutch empiricism to French Newtonian climatic ideology'
    span: 359880:360507
    why: 'Closes the unit by stating the chapter''s thesis: Mauritius becomes the site where Newtonian science turns Dutch observation into systematic French environmentalism.'
- nn: 17
  unit_id: ch04-s1-hales-newtonian
  note_id: grove-green-imperialism-ch04-s1-hales-newtonian
  span: 360509:382247
  chunks:
  - id: grove-green-imperialism#u17-c1
    heading: 'Esquivel''s 1579 account of deforestation in Mexico'
    span: 364704:365248
    why: 'Earliest primary voice in the unit linking colonial deforestation, depopulation, climate and health, though arguing for clearance rather than conservation.'
  - id: grove-green-imperialism#u17-c2
    heading: 'Woodward''s 1708 forest-rainfall claim'
    span: 369931:370269
    why: 'First clear published statement linking tree cover to rainfall, arguing deforestation improves climate -- the reverse of the desiccationist conclusion that follows.'
  - id: grove-green-imperialism#u17-c3
    heading: 'Woodward''s global instructions for observation'
    span: 371210:371813
    why: 'Identifies the standardized global data-gathering infrastructure Grove credits with turning colonial anecdote into theory-building evidence.'
  - id: grove-green-imperialism#u17-c4
    heading: 'Hales''s Newtonian synthesis and its 1770s Jamaican afterlife'
    span: 375586:376876
    why: 'States Grove''s central causal claim about Hales and then evidences its decades-long authority via Edward Long''s History of Jamaica.'
  - id: grove-green-imperialism#u17-c5
    heading: 'Buffon, Duhamel du Monceau and the Jardin du Roi'
    span: 379774:380548
    why: 'Traces the concrete institutional chain by which Hales''s Newtonian theory entered French state science ahead of Poivre-era conservation policy.'
- nn: 18
  unit_id: ch04-s2-climate-theories-france
  note_id: grove-green-imperialism-ch04-s2-climate-theories-france
  span: 382247:395923
  chunks:
  - id: grove-green-imperialism#u18-c1
    heading: 'D''Alembert''s gloss on Montesquieu: law must follow or combat climate'
    span: 385660:386238
    why: 'Shows climatic-social theory at its most consequential, translated directly into a doctrine about what law must do in response to climate.'
  - id: grove-green-imperialism#u18-c2
    heading: 'Buffon''s monogenism and the seed of ''degeneration'' theory'
    span: 386494:386977
    why: 'Buffon''s own words are the theoretical root of the climate-driven ''degeneration'' concept that structures the rest of the chapter''s argument.'
  - id: grove-green-imperialism#u18-c3
    heading: 'The Academie des Sciences and Society of Arts as a ''centre of calculation'''
    span: 388711:389128
    why: 'Grove''s own analytic claim that Hales''s appointment fused English and French science into a single network organized around the climate debate.'
  - id: grove-green-imperialism#u18-c4
    heading: 'From passive climatic fatalism to man''s control of forest cover'
    span: 389698:390539
    why: 'States the pivotal theoretical shift—from man as climate''s victim to man as potential controller of atmospheric moisture via forests—that makes conservation policy conceivable.'
  - id: grove-green-imperialism#u18-c5
    heading: 'Earthquakes, Voltaire, and the ironic opening toward climatic activism'
    span: 391674:392920
    why: 'Explains, in Grove''s own argument, why catastrophic proof of human vulnerability paradoxically preceded the rise of activist climatic conservationism rather than reinforcing fatalism.'
  - id: grove-green-imperialism#u18-c6
    heading: 'Poivre''s 1763 Lyons speech and its French and British policy consequences'
    span: 393782:395921
    why: 'The chapter''s culminating evidence: Grove''s account of the exact speech that turned metropolitan climate theory into colonial forest-conservation policy in both Mauritius and the British Caribbean.'
- nn: 19
  unit_id: ch05-s1-french-mauritius
  note_id: grove-green-imperialism-ch05-s1-french-mauritius
  span: 395923:412878
  chunks:
  - id: grove-green-imperialism#u19-c1
    heading: 'Poivre''s heterodox, non-Newtonian roots'
    span: 397547:398013
    why: 'States Grove''s revisionist thesis that Poivre''s environmentalism drew on Indian, Zoroastrian and Chinese knowledge, not only Newtonian/physiocratic argument.'
  - id: grove-green-imperialism#u19-c2
    heading: 'Strategic motive for annexing Mauritius'
    span: 399014:399669
    why: 'Establishes that Mauritius was colonised for geopolitical and commercial rivalry with Britain and the Dutch, the economic frame for everything that follows.'
  - id: grove-green-imperialism#u19-c3
    heading: 'The 1726 Game Law and the finite island'
    span: 408388:409429
    why: 'Grove''s key interpretive claim: perception of the island''s finite resources generated a regulatory mentality decades before climatic theory arrived.'
  - id: grove-green-imperialism#u19-c4
    heading: 'Council of Government''s 1730 soil report'
    span: 409793:410444
    why: 'Primary-source voice documenting empirical, skeptical recognition of tropical soil fragility (laterisation) years before Poivre''s conservation programme.'
  - id: grove-green-imperialism#u19-c5
    heading: 'Land-forfeiture rule backfires'
    span: 410961:411450
    why: 'Shows an unintended ecological consequence of company policy and contrasts the Compagnie des Indes'' relatively unchecked authority with St Helena''s.'
  - id: grove-green-imperialism#u19-c6
    heading: 'Labourdonnais, dearth, and the Rodriguez tortoises'
    span: 411929:412876
    why: 'Ties subsistence crisis directly to extinction and to Labourdonnais''s turn toward ''improvement'', foreshadowing Poivre''s later conservation programme.'
- nn: 20
  unit_id: ch05-s2-labourdonnais-anxieties
  note_id: grove-green-imperialism-ch05-s2-labourdonnais-anxieties
  span: 412878:432429
  chunks:
  - id: grove-green-imperialism#u20-c1
    heading: 'Labourdonnais''s trial garden and the timber that took Madras'
    span: 412977:414130
    why: 'Shows the same governor who founded the crop-trial garden that became Pamplemousses also drove deforestation by using island timber to build the fleet that captured Madras in 1746.'
  - id: grove-green-imperialism#u20-c2
    heading: 'The botanical garden as re-created Garden of Eden'
    span: 415418:416177
    why: 'States Grove''s argument that Enlightenment botanical gardens (Jardin du Roi, Chelsea, the Cape) were motivated by recreating an earthly paradise, tying directly to the book''s island-as-Eden thesis.'
  - id: grove-green-imperialism#u20-c3
    heading: 'Aublet, Banks, and the urgency St Helena lacked'
    span: 419200:420084
    why: 'Grove''s own framing claim: Aublet''s documentation fed Banks''s idea of resident colonial botanists and gave Mauritius''s deforestation a metropolitan visibility that St Helena''s identical crisis lacked.'
  - id: grove-green-imperialism#u20-c4
    heading: 'La Caille''s forest, 1753: impassable and a Maroon refuge'
    span: 424077:424623
    why: 'Primary-source description (via the governor''s report) of the still-substantial 1753 forest, evidencing both its scale and its social role as refuge for escaped slaves before extensive clearance.'
  - id: grove-green-imperialism#u20-c5
    heading: 'Linking water and forest controls, 1762'
    span: 429335:429960
    why: 'Desforges-Boucher''s letter is the earliest sign in this unit of forest and water controls being yoked together administratively, anticipating the desiccationist logic Poivre would later formalise.'
  - id: grove-green-imperialism#u20-c6
    heading: 'The English East India Company''s first interest in forests, 1761'
    span: 427252:427651
    why: 'A secret EIC intelligence report on French Mauritius shows the Company noticing forests for defensive reasons only — Grove calls this its earliest recorded interest in forest matters, years before its India conservation programme.'
- nn: 21
  unit_id: ch05-s4-poivre-origins
  note_id: grove-green-imperialism-ch05-s4-poivre-origins
  span: 432429:471215
  chunks:
  - id: grove-green-imperialism#u21-c1
    heading: 'Praslin''s 1766 instructions to Poivre'
    span: 433306:434661
    why: 'This is the founding policy document: it makes rainfall fear, spice ambition and forest licensing into official French colonial policy for the first time.'
  - id: grove-green-imperialism#u21-c2
    heading: 'Poivre''s 1763 Lyons speech on fire-clearing and rainfall'
    span: 435793:436986
    why: 'States the desiccation mechanism in Poivre''s own words and supplies the Cape-versus-Mauritius comparison that structures his whole argument.'
  - id: grove-green-imperialism#u21-c3
    heading: 'Cantillon''s organic image of the state as a tree'
    span: 450480:451021
    why: 'Gives the physiocratic root-metaphor, state as tree with agriculture its roots, that underwrites Poivre''s fusion of political economy and forest conservation.'
  - id: grove-green-imperialism#u21-c4
    heading: 'Poivre against degeneracy theory: ''enemies of virtue'''
    span: 453715:454088
    why: 'Poivre''s explicit rejection of Buffon''s degeneracy theory is the premise that lets him treat Chinese and Malabari environmental knowledge as authoritative.'
  - id: grove-green-imperialism#u21-c5
    heading: 'The Cape VOC garden as adaptive, experimental institution'
    span: 461190:461770
    why: 'Describes the Cape botanical garden''s experimental and redistributive function, the direct institutional model for Poivre''s later Jardin du Roi on Mauritius.'
  - id: grove-green-imperialism#u21-c6
    heading: 'Why desiccation theory hit harder in the tropics'
    span: 470194:470588
    why: 'Grove''s key comparative claim: the same desiccation theory carried urgent practical stakes in the seasonally arid tropics that it lacked in contemporary Europe or North America.'
- nn: 22
  unit_id: ch05-s5-poivre-programmes
  note_id: grove-green-imperialism-ch05-s5-poivre-programmes
  span: 471215:509847
  chunks:
  - id: grove-green-imperialism#u22-c1
    heading: 'The island as ''perpetual spring'': Edenic rhetoric in the inaugural speech'
    span: 476017:476336
    why: 'Grove''s own gloss shows Poivre''s colonial rhetoric drawing directly on the Dante-derived Edenic-island literary discourse that structures the book''s argument about tropical utopianism.'
  - id: grove-green-imperialism#u22-c2
    heading: 'Deforestation as sacrilege: Poivre''s moral indictment of the colonists'
    span: 477744:478206
    why: 'Poivre''s own words fuse a causal claim about deforestation and aridity with a moral-religious register of sacrilege and just deserts, the rhetorical core of his conservation programme.'
  - id: grove-green-imperialism#u22-c3
    heading: 'Windbreaks and small plots: Poivre''s concrete conservation instructions'
    span: 481884:482367
    why: 'A verbatim policy instruction showing desiccation theory translated directly into a land-clearing ordinance.'
  - id: grove-green-imperialism#u22-c4
    heading: 'Land-use planning as state rationalisation'
    span: 493713:494229
    why: 'Grove''s clearest statement that Poivre''s conservation project was, at bottom, an exercise in comprehensive state land-use planning.'
  - id: grove-green-imperialism#u22-c5
    heading: '''Land in servitude'': pairing environmental and human restoration'
    span: 486865:487439
    why: 'States explicitly Grove''s thesis that Poivre''s environmental and anti-slavery commitments formed a single moral economy.'
- nn: 23
  unit_id: ch05-s6-poivre-commerson
  note_id: grove-green-imperialism-ch05-s6-poivre-commerson
  span: 509847:524039
  chunks:
  - id: grove-green-imperialism#u23-c1
    heading: 'The medicinal-survey pretext'
    span: 512101:512675
    why: 'Shows Poivre and Bougainville constructing a respectable medicinal cover story that concealed Poivre''s real agenda for Commerson, exposing how colonial science borrowed legitimacy for political ends.'
  - id: grove-green-imperialism#u23-c2
    heading: 'The grand Mascarene natural-history survey'
    span: 512912:513304
    why: 'States the true scale of Poivre''s ambition for Commerson''s survey, on a scale comparable to Joseph Banks''s, that the medicinal pretext concealed.'
  - id: grove-green-imperialism#u23-c3
    heading: 'Survey report as legitimating device for the 1769 ordinance'
    span: 517295:518601
    why: 'Grove''s central causal claim: the scientifically documented Commerson–Cossigny survey gave Poivre authority to pass conservation law he had already wanted but had feared to impose.'
  - id: grove-green-imperialism#u23-c4
    heading: 'The three key articles of the Réglement économique'
    span: 519611:520400
    why: 'States the concrete legislative payload of the chapter section: mountain reserves, replanting requirements, and river reserves, and their later imperial afterlife.'
  - id: grove-green-imperialism#u23-c5
    heading: 'Physiocratic grounding of the conservation logic'
    span: 520777:521399
    why: 'Grounds the ordinance''s reasoning in physiocratic economic theory (Cantillon''s ''state as a tree''), Grove''s argument for conservation''s intellectual sources beyond empirical observation alone.'
  - id: grove-green-imperialism#u23-c6
    heading: 'Poivre''s Garden of Eden and moral economy'
    span: 523323:524037
    why: 'Reveals the Edenic, moral-economy vision animating Poivre''s conservation programme, framing regulation as virtue as much as technocracy.'
- nn: 24
  unit_id: ch05-s7-defoe-rousseau-commerson
  note_id: grove-green-imperialism-ch05-s7-defoe-rousseau-commerson
  span: 524039:547792
  chunks:
  - id: grove-green-imperialism#u24-c1
    heading: 'Environmentalism born of physiocracy and the island cult'
    span: 526721:527447
    why: 'States Grove''s central thesis for this section: environmentalism emerged from a marriage between physiocracy and the French Utopian obsession with tropical islands.'
  - id: grove-green-imperialism#u24-c2
    heading: 'Godwin''s Man in the Moone and the St Helena castaways'
    span: 533443:534256
    why: 'Anchors the desert-island Utopia genealogy at Godwin''s 1638 Man in the Moone, the first to combine social dissent with explicit ecological resource-limits, set on St Helena.'
  - id: grove-green-imperialism#u24-c3
    heading: 'Defoe''s Destruction of the Isle of St Vincent'
    span: 540162:541031
    why: 'Shows Defoe, writing alongside Crusoe, treating a real Caribbean island''s catastrophic destruction and an indigenous society''s extinction as a single Providential natural process.'
  - id: grove-green-imperialism#u24-c4
    heading: 'Crusoe''s Tobago model and the commoditised environment'
    span: 538932:539774
    why: 'Grove''s evidence that Crusoe''s setting was modelled on a real colonial real-estate promotional tract, tying the novel''s ecological detail to the commercial colonisation it depicts.'
  - id: grove-green-imperialism#u24-c5
    heading: 'Revising LaFreniere: Rousseau, Commerson and the 1769 Mercure letter'
    span: 529814:530681
    why: 'Grove''s explicit historiographical intervention, crediting Commerson with converting Rousseau''s abstract tropical Utopianism into fashionable, practically-oriented environmentalism.'
  - id: grove-green-imperialism#u24-c6
    heading: 'Natural law as the condition of island Utopia'
    span: 545017:546156
    why: 'States most concisely how, for Commerson and Saint-Pierre, safeguarding nature and building an ideal society became a single, inseparable undertaking.'
- nn: 25
  unit_id: ch05-s8-crusoe-rousseau
  note_id: grove-green-imperialism-ch05-s8-crusoe-rousseau
  span: 547792:563663
  chunks:
  - id: grove-green-imperialism#u25-c1
    heading: 'Calvin, Weber, and Crusoe''s isolation'
    span: 547813:548898
    why: 'States Grove''s founding claim that Calvinist religious individualism is the psychological root shared by Crusoe''s isolation and Rousseau''s identification with him.'
  - id: grove-green-imperialism#u25-c2
    heading: 'Detachment, journey, and the town/country split on the island itself'
    span: 550694:551762
    why: 'Lays out the structural elements (detachment, journey, urban/rural division replicated in miniature) that Rousseau would inherit and redeploy.'
  - id: grove-green-imperialism#u25-c3
    heading: 'Rousseau''s island as botanical garden'
    span: 558884:559411
    why: 'Rousseau''s own voice, quoted at length, showing the island literally functioning as a private botanical garden for classifying nature before it is ''denatured'' by cultivation.'
  - id: grove-green-imperialism#u25-c4
    heading: 'The Bienne island erosion parable'
    span: 562245:562712
    why: 'Rousseau''s own description of one island being eroded to shore up another is the literary parable Grove reads as anticipating real colonial-ecological damage.'
  - id: grove-green-imperialism#u25-c5
    heading: 'Grove''s bridge from Rousseau to Poivre'
    span: 562715:563235
    why: 'Grove''s own framing sentence explicitly links Rousseau''s erosion metaphor to Poivre''s real ''moral economy of the state'' argument, the book''s actual subject.'
  - id: grove-green-imperialism#u25-c6
    heading: 'Anson''s islands and the project of Commerson'
    span: 555353:556165
    why: 'Names the direct line from Rousseau''s literary desire to reintroduce island ''wildness'' into a garden to the real botanical-colonial project of Commerson and his circle.'
- nn: 26
  unit_id: ch05-s9-commerson-utopian-science
  note_id: grove-green-imperialism-ch05-s9-commerson-utopian-science
  span: 563663:590772
  chunks:
  - id: grove-green-imperialism#u26-c1
    heading: 'Commerson renames Cythera as Utopia'
    span: 564559:565371
    why: 'Marks Commerson''s deliberate break from Bougainville''s classical Aphrodite framing of Tahiti in favour of an explicitly Utopian, Thomas More-derived idiom.'
  - id: grove-green-imperialism#u26-c2
    heading: 'Tahiti as a Utopia without kings, vices, or property'
    span: 566038:566607
    why: 'Commerson''s own Mercure letter is the primary-source description of an Edenic, patriarchal, unashamedly sexual Tahitian Utopia that shaped his and Poivre''s Mauritius project.'
  - id: grove-green-imperialism#u26-c3
    heading: 'From Tahitian tree-planting to the Mauritius Conservation Ordinance'
    span: 568424:568736
    why: 'Grove''s direct causal claim that Commerson''s idealised Tahitian horticulture inspired the tree-planting provisions of Mauritius''s first Conservation Ordinance.'
  - id: grove-green-imperialism#u26-c4
    heading: '''I am a missionary naturalist'': botany as redemptive refuge'
    span: 570695:572174
    why: 'Captures Commerson''s fusion of religiosity and empirical natural history, extending the botanical-Eden idea from a single garden to the whole tropical world as a refuge from French corruption.'
  - id: grove-green-imperialism#u26-c5
    heading: 'Commerson''s migration hypothesis for the diversity of races'
    span: 576728:578132
    why: 'Commerson''s own naturalist reasoning about migration versus spontaneous generation of ''races'' anticipates, by Grove''s account, the migration-based species concept usually credited to Cuvier decades later.'
  - id: grove-green-imperialism#u26-c6
    heading: 'Not a Utopia: slavery on Mauritius and Poivre''s disillusionment'
    span: 580580:581652
    why: 'Confronts the Tahitian-Utopia discourse with the reality of an 18,000-strong slave population, and traces how Poivre''s disillusionment over slavery hardened his conservation resolve while Bernardin de Saint-Pierre substituted natural ''harmony'' for social utopia.'
- nn: 27
  unit_id: ch05-s10-bernardin
  note_id: grove-green-imperialism-ch05-s10-bernardin
  span: 590772:608929
  chunks:
  - id: grove-green-imperialism#u27-c1
    heading: 'Saint-Pierre''s four environmentalist texts'
    span: 590835:591555
    why: 'States the unit''s thesis: Saint-Pierre converted Poivre''s defeated physiocratic policy into a holistic environmentalist philosophy across four named texts.'
  - id: grove-green-imperialism#u27-c2
    heading: 'The island as ''motto'': the Samos frontispiece'
    span: 595222:595995
    why: 'Saint-Pierre''s own account of the hydrological-cycle frontispiece that grounds his concept of natural ''harmonies''.'
  - id: grove-green-imperialism#u27-c3
    heading: 'Niche interdependence as divine harmony'
    span: 596410:597278
    why: 'The clearest proto-ecological passage, fusing niche theory with natural theology, central to Grove''s claim about Saint-Pierre''s originality.'
  - id: grove-green-imperialism#u27-c4
    heading: 'Colonial deforestation as ''villainage'''
    span: 597576:598782
    why: 'Saint-Pierre''s most direct indictment of colonial land-clearing, going further than physiocratic reformism to blame agriculture, commerce, and capital together.'
  - id: grove-green-imperialism#u27-c5
    heading: 'Cod, fire, and universal ecological alliance'
    span: 602108:602750
    why: 'Saint-Pierre generalises a single colonial extinction anecdote into a law of ecological interdependence, the unit''s key causal claim.'
  - id: grove-green-imperialism#u27-c6
    heading: 'The 1781 Ministère de Marine memoir on desiccation'
    span: 608107:608490
    why: 'Shows desiccation theory institutionalised in ordinary naval/colonial administration years after Poivre and Saint-Pierre had left the island.'
- nn: 28
  unit_id: ch05-s11-revolution-global-context
  note_id: grove-green-imperialism-ch05-s11-revolution-global-context
  span: 608929:627195
  chunks:
  - id: grove-green-imperialism#u28-c1
    heading: 'The 1792 bird-control arrêtés'
    span: 609762:610076
    why: 'Shows the Colonial Assembly legislating ecological risk at the level of individual species, an early and granular instance of state environmental control.'
  - id: grove-green-imperialism#u28-c2
    heading: 'Decaen''s 1804 river-bank and enforcement rules'
    span: 613416:614035
    why: 'Captures the institutional culmination of Poivrean conservation law under Decaen, with named enforcement offices and a codified river-bank easement.'
  - id: grove-green-imperialism#u28-c3
    heading: 'Flinders''s diary on the mountain wood-cutting ban'
    span: 616421:616880
    why: 'First-hand outside testimony that desiccation reasoning behind Decaen''s forest law was legible and persuasive to a foreign observer, and a route by which it reached British naturalists.'
  - id: grove-green-imperialism#u28-c4
    heading: 'Chambers on denudation and the turn back to reforestation'
    span: 622671:623577
    why: 'The pivot narrative Grove uses to connect the Mauritius forest-reserve experience directly to nineteenth-century Indian forest-conservation policy.'
  - id: grove-green-imperialism#u28-c5
    heading: 'Jefferson''s debt to Poivre'
    span: 619749:620420
    why: 'Documents the transatlantic reach of Poivre''s conservationist and physiocratic ideas into Jefferson''s own agricultural science.'
  - id: grove-green-imperialism#u28-c6
    heading: 'Grove''s thesis on the origins of environmentalism'
    span: 625046:626464
    why: 'Grove''s own analytical synthesis arguing that Newtonian science and Rousseauist nature-language were fused, not opposed, in producing a new environmental discourse.'
- nn: 29
  unit_id: ch06-s1-caribbean-forests
  note_id: grove-green-imperialism-ch06-s1-caribbean-forests
  span: 627195:646297
  chunks:
  - id: grove-green-imperialism#u29-c1
    heading: 'Jenyns and Anderson as the Caribbean''s Poivre-analogues'
    span: 628956:629950
    why: 'Establishes the chapter''s comparative frame and its two seminal figures, distinguishing the British Caribbean case from the French Mauritian one Grove has just finished.'
  - id: grove-green-imperialism#u29-c2
    heading: 'Carib resistance and Vattel''s cultivation doctrine'
    span: 633023:634264
    why: 'The chapter''s central disanalogy with Mauritius and its key legal-ideological mechanism: forest clearance as the test of sovereign right, licensing dispossession of the Carib population.'
  - id: grove-green-imperialism#u29-c3
    heading: 'The 1764 Tobago proclamation on forest reservation'
    span: 642995:643394
    why: 'Primary legal text showing desiccationist rationale (''preserve the seasons'') written directly into the founding land-settlement proclamation for the Ceded Islands.'
  - id: grove-green-imperialism#u29-c4
    heading: 'Barbados ordinance vs. Young''s contrary belief on the ground'
    span: 643572:645159
    why: 'Shows the explicit anti-drought legal rationale for forest reserves set directly against the private miasmatic views of the official implementing it, dramatizing theory-versus-practice in colonial science.'
  - id: grove-green-imperialism#u29-c5
    heading: 'The Society of Arts'' Baconian lineage and the first American botanical garden'
    span: 636490:638633
    why: 'Traces the institutional relay — Baconian/Hartlib lineage, prize incentives, colonial societies — through which desiccationist ideas and plant-transfer practice reached the Caribbean and produced the St Vincent garden.'
- nn: 30
  unit_id: ch06-s2-soame-jenyns
  note_id: grove-green-imperialism-ch06-s2-soame-jenyns
  span: 646297:671140
  chunks:
  - id: grove-green-imperialism#u30-c1
    heading: 'Jenyns inherits desiccation theory from Hales'
    span: 646949:648203
    why: 'States directly how desiccation theory passed from the dead Stephen Hales through Duhamel du Monceau to Jenyns and from there into colonial statute.'
  - id: grove-green-imperialism#u30-c2
    heading: 'Barbados deforested, Tobago untouched, Crusoe born'
    span: 652151:652977
    why: 'Supplies the ecological-crisis evidence (Barbados) and literary-Eden evidence (Tobago/Crusoe) that together motivate the Ceded Islands forest policy.'
  - id: grove-green-imperialism#u30-c3
    heading: 'The estate-improver''s colony'
    span: 650676:651040
    why: 'Grove''s clearest statement that Jenyns''s colonial land policy was an extension of his domestic estate-improvement and fen-drainage practice.'
  - id: grove-green-imperialism#u30-c4
    heading: 'Mapmaking as omission'
    span: 668406:668996
    why: 'Grove''s key argument that cartographic exclusion of the Caribs was itself a mechanism of dispossession, not incidental to the survey.'
  - id: grove-green-imperialism#u30-c5
    heading: 'The noble savage''s violent death'
    span: 667279:667680
    why: 'Marks the collapse of Edenic/noble-savage discourse under the weight of the land-use regime and rising Black Carib resistance.'
  - id: grove-green-imperialism#u30-c6
    heading: 'St Vincent and Pamplemousses as one network'
    span: 665252:665576
    why: 'Documents the transoceanic botanical-garden network linking the Caribbean and Indian Ocean colonial science establishments.'
- nn: 31
  unit_id: ch06-s3-carib-resistance
  note_id: grove-green-imperialism-ch06-s3-carib-resistance
  span: 671140:688872
  chunks:
  - id: grove-green-imperialism#u31-c1
    heading: 'The cultivation test for legitimate land right'
    span: 675072:675827
    why: 'States the British ideological justification for expropriation — only settled cultivators hold legitimate land title — that Grove reads as an antecedent of the later critique of shifting cultivation.'
  - id: grove-green-imperialism#u31-c2
    heading: 'Carib legal memory versus Young''s condescension'
    span: 676600:677435
    why: 'Carries Grove''s own corrective argument against a colonial actor''s voice, showing Carib use of European legal forms and durable institutional memory.'
  - id: grove-green-imperialism#u31-c3
    heading: 'Burning the surveyors out of the forest'
    span: 682915:683962
    why: 'The key primary evidence of armed Carib resistance directly targeting the survey apparatus itself, not just settlement.'
  - id: grove-green-imperialism#u31-c4
    heading: 'Settlers break with the Commissioners for Trade'
    span: 684723:685928
    why: 'Shows the split within the colonial power between metropolitan forest-reservation policy and a self-protective, deforestation-minded settler population.'
  - id: grove-green-imperialism#u31-c5
    heading: 'The commissioners concede a common right of nature'
    span: 687533:688627
    why: 'The colonial state''s own admission that Carib communal woodland claims could not be legally dislodged — the clinching evidence of the survey scheme''s practical defeat.'
- nn: 32
  unit_id: ch06-s4-anderson-advocacy
  note_id: grove-green-imperialism-ch06-s4-anderson-advocacy
  span: 688872:702587
  chunks:
  - id: grove-green-imperialism#u32-c1
    heading: 'The pre-Anderson ''centre of calculation'' sat in Europe'
    span: 689799:691130
    why: 'States Grove''s Latourian framing that Caribbean desiccationism before Anderson was steered entirely from metropolitan scientific institutions, the baseline his arrival changes.'
  - id: grove-green-imperialism#u32-c2
    heading: 'Carib resistance forces a more autonomous, local calculation centre'
    span: 691132:692112
    why: 'Grove''s clearest statement that indigenous political resistance, not metropolitan science alone, reshaped St Vincent''s environmental policy-making into something locally autonomous.'
  - id: grove-green-imperialism#u32-c3
    heading: 'The King''s Hill Forest Act''s enacted wording'
    span: 699307:699650
    why: 'The concrete legal text of the 1791 Act, an early instance of state forest reservation framed explicitly as climate engineering.'
  - id: grove-green-imperialism#u32-c4
    heading: 'Planter fears and the Carib boundary in the Assembly debate'
    span: 696754:698059
    why: 'Shows forest reservation as politically contested: planters feared their land being ''sterilised,'' while others feared reserved forest would give the Caribs cover for insurrection, so clearance rather than conservation served social control.'
  - id: grove-green-imperialism#u32-c5
    heading: 'Anderson''s manuscript alongside Poivre and Bernardin de Saint-Pierre'
    span: 701785:702585
    why: 'Grove explicitly places Anderson''s unpublished ''Geography and History of St Vincent'' in a lineage with Poivre''s Mauritius speeches and Bernardin de Saint-Pierre, the cross-fertilisation the unit argues for.'
- nn: 33
  unit_id: ch06-s5-anderson-critique
  note_id: grove-green-imperialism-ch06-s5-anderson-critique
  span: 702587:730903
  chunks:
  - id: grove-green-imperialism#u33-c1
    heading: 'The 1784 Forsyth letter: woodland, cloud cover, and the wish for instruments'
    span: 705215:706109
    why: 'The earliest dated evidence of Anderson''s environmental thinking, directly linking his own volcano-ascent observations to atmospheric science.'
  - id: grove-green-imperialism#u33-c2
    heading: 'The ''Turn all into cane'' credo: timber, rain and climate'
    span: 713504:714757
    why: 'Anderson''s own comprehensive statement of desiccationist and conservationist reasoning, which Grove quotes as the credo underlying his public advocacy.'
  - id: grove-green-imperialism#u33-c3
    heading: 'St Vincent as a second Tahiti'
    span: 709229:709677
    why: 'Shows the Utopian/Tahitian imaginary shaping Anderson''s attachment to the island and his sensitivity to Carib dispossession.'
  - id: grove-green-imperialism#u33-c4
    heading: 'The morality of Carib removal'
    span: 726840:727249
    why: 'Anderson''s own moral reckoning with forced Carib removal, which Grove ties directly to his environmental guilt.'
  - id: grove-green-imperialism#u33-c5
    heading: 'Pringle and Priestley, via Long: providential atmospheric purification'
    span: 723560:724564
    why: 'The inherited theological-scientific framework, transmitted through Edward Long, that let Anderson universalise his island observations into a claim about vegetation and climate everywhere.'
  - id: grove-green-imperialism#u33-c6
    heading: 'Volcano, Deluge, and Anderson''s crisis of chronology'
    span: 729680:730699
    why: 'States the unit''s thesis: Anderson''s forest conservation as a psychological strategy for restoring agency amid a personal crisis of geological, religious and colonial chronology.'
- nn: 34
  unit_id: ch07-s1-banks-professionalisation
  note_id: grove-green-imperialism-ch07-s1-banks-professionalisation
  span: 730903:742830
  chunks:
  - id: grove-green-imperialism#u34-c1
    heading: 'Thesis: globalisation of environmentalism through professional science'
    span: 731238:731803
    why: 'States Grove''s organising claim for the chapter: environmentalism globalised via professional science rather than a single traceable idea.'
  - id: grove-green-imperialism#u34-c2
    heading: 'Why continental colonies lagged islands institutionally'
    span: 732810:733250
    why: 'Grove''s causal argument that islands forced state action while continental scale left environmentalism dependent on persuasion and scientific patronage.'
  - id: grove-green-imperialism#u34-c3
    heading: 'Genealogy: physiocrats, Cook expeditions, Forster/Banks, Humboldt'
    span: 734777:735932
    why: 'The chapter''s central lineage claim, naming the individuals whose careers carried environmentalism from islands to continents and to Humboldt.'
  - id: grove-green-imperialism#u34-c4
    heading: 'Banks''s network: training over nationality'
    span: 737175:737741
    why: 'Identifies the defining, consequential feature of Banks''s patronage network: reliance on Scottish and Central European rather than English expertise.'
  - id: grove-green-imperialism#u34-c5
    heading: 'Linnaeus''s classification as a map of nature'
    span: 739747:740370
    why: 'Ties Linnaean global classification to cartographic legibility and to the Renaissance Paradise-garden project, the unit''s sharpest world-machines resonance.'
  - id: grove-green-imperialism#u34-c6
    heading: 'Samuel Johnson on the disinterested naturalist'
    span: 742487:742828
    why: 'A period voice articulating the ideal of autonomous, disinterested science that Grove treats as historically formative for the professional naturalist.'
- nn: 35
  unit_id: ch07-s2-forsters-resolution
  note_id: grove-green-imperialism-ch07-s2-forsters-resolution
  span: 742830:770611
  chunks:
  - id: grove-green-imperialism#u35-c1
    heading: 'The Forsters grasp the Cook voyages'' long-term stakes'
    span: 742870:743715
    why: 'States the unit''s opening claim that the Forsters uniquely recognised the lasting significance of the Cook voyages'' empirical study, and frames the voyages as the first major opening for German naturalists into British colonial science.'
  - id: grove-green-imperialism#u35-c2
    heading: 'Tahiti''s idyll against Europe''s misery, and a warning to the discoverers'
    span: 749339:750421
    why: 'Shows the Forsters'' anthropological turn hardening into doubt about European ''modernity'' itself, via Georg Forster''s Tahiti/Europe contrast, his Diderot-like warning about the cost of discovery, and Cook''s parallel admiration for indigenous self-sufficiency.'
  - id: grove-green-imperialism#u35-c3
    heading: 'Forster''s apprenticeship in state science: the Volga German colonies survey'
    span: 755376:757220
    why: 'Establishes, before Cook, the precedent of an independently employed naturalist commissioned by an expansionist state to survey territory and people — the pattern Grove traces forward to British and French colonial science.'
  - id: grove-green-imperialism#u35-c4
    heading: 'From Buffon''s ''beneficent man'' to empirical critique of European impact'
    span: 763897:764776
    why: 'Names the unit''s central intellectual transition: Forster''s move from doctrinaire Buffonian environmentalism to a privately critical, empirically grounded view of European ecological impact, especially on islands.'
  - id: grove-green-imperialism#u35-c5
    heading: 'Tahiti as a paradisal ''flourishing and well-kept garden'''
    span: 765226:766277
    why: 'Captures Forster''s initial Cytherian, Edenic framing of Tahiti, set up by his Bougainville translation, against which his later causal observations of the same island will be measured.'
  - id: grove-green-imperialism#u35-c6
    heading: 'Mountains, clouds and trees: the mechanics of an island''s rainfall'
    span: 766281:766752
    why: 'Forster''s own causal account of how forested mountains generate an island''s moisture — the empirical seed of the desiccation-theory reasoning Grove later traces to St Helena and Ascension.'
- nn: 36
  unit_id: ch07-s3-forster-st-helena
  note_id: grove-green-imperialism-ch07-s3-forster-st-helena
  span: 770611:784837
  chunks:
  - id: grove-green-imperialism#u36-c1
    heading: 'St Helena: hills, clouds, and shaded rivulets'
    span: 770634:771111
    why: 'Forster''s first-hand St Helena field notes establish the hill-cloud-moisture relationship that later resolves into desiccationist reasoning.'
  - id: grove-green-imperialism#u36-c2
    heading: 'Ascension: the vegetation-moisture-soil feedback model'
    span: 772105:773098
    why: 'Forster''s own inductive causal chain — vegetation retains moisture, builds soil, and perpetuates springs — is the empirical core of proto-desiccation theory.'
  - id: grove-green-imperialism#u36-c3
    heading: 'The Bermuda sloop''s turtle slaughter'
    span: 773578:774074
    why: 'Shows the moral register accompanying Forster''s ecological attentiveness: human destructive capacity on a fragile island, reported almost as evidence alongside soil and moisture.'
  - id: grove-green-imperialism#u36-c4
    heading: 'Grove''s genealogy: Forster to Humboldt, Pappe, and the Cape'
    span: 775864:776527
    why: 'Grove''s own framing sentence naming the downstream inheritors of Forster''s desiccationism is the argumentative hinge connecting island observation to later colonial environmental policy.'
  - id: grove-green-imperialism#u36-c5
    heading: 'Forster''s case for a professional naturalist in India'
    span: 779456:780573
    why: 'Forster''s own quoted argument for stationing a scientific observer in India, framed patriotically as well as scientifically, is what Banks acted on to secure Koenig''s 1778 EIC appointment.'
- nn: 37
  unit_id: ch07-s4-famine-calcutta-garden
  note_id: grove-green-imperialism-ch07-s4-famine-calcutta-garden
  span: 784837:822396
  chunks:
  - id: grove-green-imperialism#u37-c1
    heading: 'Kyd''s famine letter to the Board'
    span: 787097:787584
    why: 'Kyd''s own words ground the Calcutta garden proposal in a moral-accounting argument that British rule owes famine relief, the founding rationale the rest of the unit traces through to institutional compromise.'
  - id: grove-green-imperialism#u37-c2
    heading: 'Kyd''s drought-resistant crop distribution plan'
    span: 789007:789537
    why: 'Specifies the concrete famine-mitigation technology (sago-tree stocks reaching every village) that the garden was meant to be, distinct from Hastings''s grain-depot model.'
  - id: grove-green-imperialism#u37-c3
    heading: 'The Calcutta-St Vincent-St Helena axis as information network'
    span: 800424:801340
    why: 'Grove''s own analytical formulation of the garden network as an information infrastructure, the passage most directly legible against World Machines'' legibility framework.'
  - id: grove-green-imperialism#u37-c4
    heading: 'The 1794 Court of Directors letter on trees and rainfall'
    span: 815209:815933
    why: 'Primary-source evidence that desiccation theory had become explicit, operational East India Company policy by 1794, not merely a naturalist''s hypothesis.'
  - id: grove-green-imperialism#u37-c5
    heading: 'The global drought of 1791-92 and Beatson''s famine testimony'
    span: 813954:814829
    why: 'Supplies the empirical, human-scale evidence (mass famine deaths in the Northern Circars) that forced desiccationist theory onto the Company''s institutional agenda.'
- nn: 38
  unit_id: ch07-s5-burchell-beatson
  note_id: grove-green-imperialism-ch07-s5-burchell-beatson
  span: 822396:857054
  chunks:
  - id: grove-green-imperialism#u38-c1
    heading: 'Burchell''s diary and the discovery of St Helena endemism'
    span: 822460:823191
    why: 'Grove''s opening frame establishes Burchell''s diary as the dated evidentiary source for the emergence of endemism-consciousness, extinction anxiety, and deforestation anxiety.'
  - id: grove-green-imperialism#u38-c2
    heading: 'Burchell''s own account of deforestation on St Helena'
    span: 824322:824838
    why: 'Primary-source diary quotation in Burchell''s own voice, the direct evidence underlying Grove''s argument about deforestation and neglected reafforestation.'
  - id: grove-green-imperialism#u38-c3
    heading: 'Romantic sublime, geological time, and species anxiety'
    span: 829578:830916
    why: 'Grove''s own analytical argument linking Romantic landscape aesthetics and new anxieties about deep time and mortality to the reframing of species rarity as an object of feeling.'
  - id: grove-green-imperialism#u38-c4
    heading: 'Beatson''s desiccationist programme: prizes, rainfall records, irrigation'
    span: 840111:841494
    why: 'Shows desiccation theory translated directly into administrative technique, the mechanism by which climatic environmentalism became colonial state policy.'
  - id: grove-green-imperialism#u38-c5
    heading: 'Hooker''s 1843 report: Beatson''s plantations doubling rainfall'
    span: 856072:856438
    why: 'Marks the chain of transmission from Beatson''s local experiment through Hooker''s official Admiralty report toward the Indian forest-conservation lobbying that followed with Dalhousie.'
  - id: grove-green-imperialism#u38-c6
    heading: 'Darwin''s ''little world within itself'' and its Malthusian premonition'
    span: 852919:853994
    why: 'Captures how St Helena''s bounded, already-degraded ecology fed directly into Darwin''s island biogeography and anticipated a Malthusian anxiety about human pressure on limited insular resources.'
- nn: 39
  unit_id: ch07-s6-humboldtian-diffusion
  note_id: grove-green-imperialism-ch07-s6-humboldtian-diffusion
  span: 857054:890407
  chunks:
  - id: grove-green-imperialism#u39-c1
    heading: 'Desiccation theory''s pre-1820s parochialism'
    span: 858107:858402
    why: 'States the unit''s organizing problem: island-based desiccation observation had not yet become a rigorous, global scientific law before Humboldt.'
  - id: grove-green-imperialism#u39-c2
    heading: 'Herder''s indictment of European wealth and plunder'
    span: 867728:868086
    why: 'Preserves Herder''s own moral-economic voice, the humanitarian register Grove treats as inseparable from the environmental critique that shaped Humboldt.'
  - id: grove-green-imperialism#u39-c3
    heading: 'Humboldt''s Lake Valencia deforestation law'
    span: 862820:864296
    why: 'The primary scientific text—Humboldt''s own generalisable causal account linking deforestation, desiccation, and flash flooding—that the whole diffusion story concerns.'
  - id: grove-green-imperialism#u39-c4
    heading: 'Humboldt''s own account of what inspired him'
    span: 880691:881318
    why: 'Humboldt''s autobiographical testimony naming Forster''s writing, Hodges'' paintings, and a botanical-garden dragon tree as the images that first drew him to the tropics.'
  - id: grove-green-imperialism#u39-c5
    heading: 'The East India Company refuses Humboldt entry to India'
    span: 883049:883399
    why: 'Grove''s evidence that Humboldt''s radical anti-colonial politics, not scientific merit, delayed his ideas'' colonial reception.'
  - id: grove-green-imperialism#u39-c6
    heading: 'Bouton''s Mauritius lectures and the conservation press'
    span: 886852:888074
    why: 'Marks, in Grove''s account, the first use of a colonial newspaper as a conservationist advocacy tool, the institutional vector that carried Boussingault''s paper into policy debate.'
- nn: 40
  unit_id: ch08-s1-company-forests-1
  note_id: grove-green-imperialism-ch08-s1-company-forests-1
  span: 890407:913297
  chunks:
  - id: grove-green-imperialism#u40-c1
    heading: 'The chapter''s actual thesis: tracing desiccationist argument and professionalisation'
    span: 892804:893987
    why: 'States Grove''s real scope for the chapter — desiccationist argument-formation and scientific professionalisation via botanical gardens and societies — against the broader ecological-history question he explicitly declines to answer.'
  - id: grove-green-imperialism#u40-c2
    heading: 'Indigenous epistemology as the primary driver of Company environmental policy'
    span: 894414:895279
    why: 'Grove''s strongest claim in the unit: indigenous Hindu, Muslim, Zoroastrian and Ezhava knowledge, not imported European theory (even Humboldtian ideology), was the more important source of Company forest policy.'
  - id: grove-green-imperialism#u40-c3
    heading: 'Against the Orientalist ''Merrie India'' golden-age myth'
    span: 902439:903392
    why: 'Grove''s explicit historiographical intervention, naming and rejecting a Saidian-Orientalist romanticisation of pre-colonial India as an ecological golden age.'
  - id: grove-green-imperialism#u40-c4
    heading: 'The Amirs of Sind''s shikargah reserves as pre-colonial forest-revenue infrastructure'
    span: 904421:905722
    why: 'Primary evidence, with the Eastwick quotation and hard revenue figures, for Grove''s claim that pre-colonial Indian states already ran extensive forest-management-for-revenue systems the Company simply inherited.'
  - id: grove-green-imperialism#u40-c5
    heading: 'Timber shortage driving Company territorial expansion; Hastings vs. Bombay over teak'
    span: 909554:910414
    why: 'Shows concretely how strategic timber access, not just ecological diagnosis, motivated Company military and territorial decisions, dramatized by the Bombay agent''s own words to Hastings.'
  - id: grove-green-imperialism#u40-c6
    heading: 'The 1810 Napoleonic-era global timber ''crisis'''
    span: 912152:913062
    why: 'Marks the chapter''s pivot point: a global, war-driven raw-material crisis that Grove treats as the point of departure for the sharpening of Indian environmental concern in the following decades.'
- nn: 41
  unit_id: ch08-s1-company-forests-2
  note_id: grove-green-imperialism-ch08-s1-company-forests-2
  span: 913297:933880
  chunks:
  - id: grove-green-imperialism#u41-c1
    heading: 'Political unification makes the forests vulnerable'
    span: 914192:914759
    why: 'States Grove''s causal claim that political consolidation after Tipu Sultan''s defeat, not demand alone, exposed Malabar''s forests to accelerated exploitation.'
  - id: grove-green-imperialism#u41-c2
    heading: 'Wrede''s memoir: ''we are now brought to a crisis'''
    span: 922430:922880
    why: 'Primary-source evidence, in the Company official''s own words, of how Malabar teak moved from commercial afterthought to a matter of general strategic concern by 1805.'
  - id: grove-green-imperialism#u41-c3
    heading: 'Sovereignty as proprietary right: the onus probandi argument'
    span: 924408:925058
    why: 'Wrede''s explicit legal reasoning for how the Company converted a sovereignty claim into a forest monopoly, placing an unmeetable burden of proof on customary claimants.'
  - id: grove-green-imperialism#u41-c4
    heading: 'Munro''s free-market case against regulation'
    span: 928454:929006
    why: 'The laissez-faire argument Munro used to dismantle the 1805–23 conservancy, which Grove explicitly judges ''romanticist'' and factually wrong about forest limits.'
  - id: grove-green-imperialism#u41-c5
    heading: 'Munro''s Romantic communion with the Mysore landscape'
    span: 929766:930506
    why: 'Grove''s chosen irony: the administrator who later destroyed the region''s conservancy had earlier described a personal, near-Romantic attachment to that same landscape.'
- nn: 42
  unit_id: ch08-s2-roxburgh-1
  note_id: grove-green-imperialism-ch08-s2-roxburgh-1
  span: 933880:959422
  chunks:
  - id: grove-green-imperialism#u42-c1
    heading: 'Priestleyite atmospheric ‘virtue’ and social virtue'
    span: 935351:935858
    why: 'States the ideological core of Roxburgh''s programme: atmosphere and society share a moral ''virtue'', inherited from Priestley via Pringle and from Hales via Hope.'
  - id: grove-green-imperialism#u42-c2
    heading: 'The Royal Society''s meteorological ''centre of calculation'''
    span: 937341:937910
    why: 'Establishes the international data-collection network (Jurin, Newton''s circle) that Roxburgh''s own Coromandel records would later join, evidencing climate data as legibility infrastructure.'
  - id: grove-green-imperialism#u42-c3
    heading: 'Roxburgh''s eyewitness testimony on the Circars drought'
    span: 945174:945825
    why: 'Primary-source evidence in Roxburgh''s own voice, the empirical basis for his famine and land-tenure diagnosis.'
  - id: grove-green-imperialism#u42-c4
    heading: 'Indigenous oral testimony on the 1685-8 famine'
    span: 947119:947583
    why: 'Shows Roxburgh''s historical method relying on indigenous informants and family records, key evidence for his claim that drought was recurring rather than novel.'
  - id: grove-green-imperialism#u42-c5
    heading: 'Heber on the Calcutta Botanic Garden as Paradise'
    span: 957844:958422
    why: 'Captures the Edenic/Miltonic register in which the botanical garden network was understood, fusing Mughal and European paradise discourses.'
  - id: grove-green-imperialism#u42-c6
    heading: 'The limits of point measurement and Humboldt''s isotherm'
    span: 953062:953704
    why: 'Grove''s own assessment of the conceptual ceiling of Roxburgh''s meteorology, marking the transition point to Humboldtian regional climatology.'
- nn: 43
  unit_id: ch08-s2-roxburgh-2
  note_id: grove-green-imperialism-ch08-s2-roxburgh-2
  span: 959422:998590
  chunks:
  - id: grove-green-imperialism#u43-c1
    heading: 'Wallich institutionalises Roxburgh''s plantations: the 1823 Plantation Committee'
    span: 959422:961515
    why: 'Establishes how Wallich converted Roxburgh''s plantation work into a standing government committee and a social-forestry argument grounded in indigenous precedent.'
  - id: grove-green-imperialism#u43-c2
    heading: 'The Oudh recommendations, and their failure'
    span: 963859:964592
    why: 'Grove''s clearest statement of Wallich''s interventionist forest argument and its political defeat.'
  - id: grove-green-imperialism#u43-c3
    heading: 'Wallich before the House of Commons, 1831–32'
    span: 968424:969632
    why: 'Shows Wallich carrying the Indian forest question, via his Mauritius comparison, into a metropolitan political forum, where it was heard but not acted on.'
  - id: grove-green-imperialism#u43-c4
    heading: 'Sleeman on the East India Company as the true cause of Doab deforestation'
    span: 973743:974286
    why: 'The unit''s sharpest institutional indictment: Company revenue policy, not disorder or nature, as the documented cause of Doab deforestation and rural immiseration.'
  - id: grove-green-imperialism#u43-c5
    heading: 'The Nilumbur rajah''s warning lost in the ''institutional sand'''
    span: 975915:976995
    why: 'The clearest image of bureaucratic gridlock: sound conservationist advice endorsed by one arm of the colonial state and stonewalled by another.'
  - id: grove-green-imperialism#u43-c6
    heading: 'The Humboldtian turn in the medical service'
    span: 995781:998565
    why: 'States the unit''s pivot from timber-economics to Humboldtian desiccationism, set directly against the Court of Directors'' 1840 property-rights conservatism.'
- nn: 44
  unit_id: ch08-s3-lobbying
  note_id: grove-green-imperialism-ch08-s3-lobbying
  span: 998590:1017570
  chunks:
  - id: grove-green-imperialism#u44-c1
    heading: 'Boussingault''s science reaches India via the Scottish medical pipeline'
    span: 999798:1000433
    why: 'Establishes the transnational channel — Paris to Edinburgh to Scottish-trained Company surgeons — through which desiccation science entered India before Gibson used it in lobbying.'
  - id: grove-green-imperialism#u44-c2
    heading: 'Butter''s desiccationist forecast for Oudh'
    span: 1002949:1003524
    why: 'Gives the fullest desiccationist argument in the unit, in a historical actor''s own words, years before Gibson deployed the same logic against government.'
  - id: grove-green-imperialism#u44-c3
    heading: 'Gibson to Hooker: a botanist''s regret at the Deccan''s bare hills'
    span: 1005186:1005610
    why: 'Gibson''s private letter to Kew shows his earliest motive was naturalist and economist regret, distinct from the public-health/famine argument he later weaponized.'
  - id: grove-green-imperialism#u44-c4
    heading: 'Indigenous testimony on drying streams and declining rainfall'
    span: 1014432:1014738
    why: 'The observation that finally moved Gibson to argue regional climate change came from Konkani and Parsi testimony, not European science.'
  - id: grove-green-imperialism#u44-c5
    heading: 'Gibson''s gamble: bypassing the chain of command'
    span: 1016454:1017253
    why: 'Names the decisive bureaucratic act — appealing straight to London and into print over two levels of government — that broke the stalemate and produced the funded Conservancy.'
- nn: 45
  unit_id: ch08-s4-bombay-department
  note_id: grove-green-imperialism-ch08-s4-bombay-department
  span: 1017570:1029618
  chunks:
  - id: grove-green-imperialism#u45-c1
    heading: 'A new environmental rationale for the 1847 conservancy'
    span: 1017660:1019214
    why: 'States Grove''s core claim: the conservancy''s significance lay in wider long-term environmental reasoning replacing simple timber-depletion panic.'
  - id: grove-green-imperialism#u45-c2
    heading: 'Sir George Arthur on sacrificing short-term revenue for a permanent supply'
    span: 1019383:1019695
    why: 'Primary-source articulation, in the administrator''s own words, of the long-termist rationale underlying the conservancy decision.'
  - id: grove-green-imperialism#u45-c3
    heading: 'Despatch No. 21: the Court of Directors demands empire-wide evidence'
    span: 1020343:1020992
    why: 'The Company''s own words show a conservative metropolitan body launching an empire-wide inquiry into deforestation and climate.'
  - id: grove-green-imperialism#u45-c4
    heading: 'Grove''s thesis: desiccation becomes a global, not local, problem'
    span: 1023245:1024340
    why: 'Grove''s own analytical voice states the chapter''s central argument about the globalisation of the desiccation critique via Humboldt.'
  - id: grove-green-imperialism#u45-c5
    heading: 'Famine and 1848 political unrest as context for scientific credibility'
    span: 1024628:1026153
    why: 'Grove''s materialist explanation linking the Directors'' urgency to Chartism, the Irish famine, and memories of Indian famine.'
  - id: grove-green-imperialism#u45-c6
    heading: 'Madras answers the despatch with circulars and newspaper advertisements'
    span: 1026452:1027050
    why: 'Shows the colonial state''s information-gathering apparatus in concrete operation, converting scientific anxiety into administrative practice.'
- nn: 46
  unit_id: ch08-s5-balfour
  note_id: grove-green-imperialism-ch08-s5-balfour
  span: 1029618:1056922
  chunks:
  - id: grove-green-imperialism#u46-c1
    heading: 'Balfour’s origins: Priestley and the 1840 memorandum'
    span: 1030277:1031083
    why: 'Establishes that Balfour''s 1849 intervention grew out of a decade-old private research programme, not an opportunistic reaction.'
  - id: grove-green-imperialism#u46-c2
    heading: 'The Government of India’s property-rights rebuff, May 1849'
    span: 1031085:1031901
    why: 'Shows the institutional resistance — private-property orthodoxy at the level above the presidency — that forced Madras into a propaganda strategy.'
  - id: grove-green-imperialism#u46-c3
    heading: 'Physiocracy, Bentham, and the Hume–Balfour radical kinship'
    span: 1035535:1036388
    why: 'Grove''s core explanatory move: the same physiocrat-Benthamite radical formation produced free-trade liberalism in Hume and statist environmentalism in Balfour.'
  - id: grove-green-imperialism#u46-c4
    heading: 'A strongly statist solution: arboriculture as state duty'
    span: 1039340:1040059
    why: 'Shows desiccation theory converted directly into a statist plantation programme, borrowing Poivre''s Mauritian rhetoric.'
  - id: grove-green-imperialism#u46-c5
    heading: 'Balfour’s “relative misery” calculus: famine deaths against imagined disease risk'
    span: 1042840:1043755
    why: 'Primary-source evidence of the comparative-mortality argument Balfour used to defeat miasma objections to afforestation, and of the colonial calculus underwriting it.'
  - id: grove-green-imperialism#u46-c6
    heading: 'Chadwick and Cleghorn: extending the state at core and periphery'
    span: 1053936:1055549
    why: 'Grove''s explicit thesis statement: metropolitan and colonial state interventionism shared structure and timing despite differing ideological roots.'
- nn: 47
  unit_id: ch08-s6-dalhousie
  note_id: grove-green-imperialism-ch08-s6-dalhousie
  span: 1056922:1078036
  chunks:
  - id: grove-green-imperialism#u47-c1
    heading: 'Hooker, Banks and Balfour prime Dalhousie'
    span: 1057996:1059213
    why: 'Establishes the concrete chain of desiccationist evidence and persuasion (Hooker, Banks, Balfour) that shaped Dalhousie''s thinking before he reached India.'
  - id: grove-green-imperialism#u47-c2
    heading: 'Dalhousie''s Punjab minute: the treeless plains'
    span: 1059838:1060537
    why: 'Dalhousie''s own first-hand, quoted observation of Punjab deforestation, the empirical trigger for his state arboriculture project.'
  - id: grove-green-imperialism#u47-c3
    heading: '‘An heritage for which posterity will be grateful’'
    span: 1060680:1061670
    why: 'Dalhousie''s own words state the multi-generational, paternalist-utilitarian ethic behind the forestry project.'
  - id: grove-green-imperialism#u47-c4
    heading: 'Models, not just legitimation: the Sind shikargahs'
    span: 1062438:1063574
    why: 'States Grove''s central historiographical claim and grounds it in Napier''s own 1843 discovery of the amirs'' shikargah revenue system.'
  - id: grove-green-imperialism#u47-c5
    heading: 'Stocks''s 1852 report: reverting to the amirs'' methods'
    span: 1068836:1069681
    why: 'Primary evidence that colonial forest policy in the Punjab consciously reverted to the amirs'' stricter, more exclusionary enclosure methods.'
  - id: grove-green-imperialism#u47-c6
    heading: 'Brandis''s testament to pre-colonial forestry'
    span: 1071610:1072030
    why: 'An admission from inside the colonial forestry establishment itself, crediting the Sind amirs and Punjab rukh-holders with the forests'' survival.'
- nn: 48
  unit_id: ch08-s7-wider-perspective
  note_id: grove-green-imperialism-ch08-s7-wider-perspective
  span: 1078036:1097480
  chunks:
  - id: grove-green-imperialism#u48-c1
    heading: 'Britain''s aesthetic environmentalism vs. India''s ecological crisis'
    span: 1078271:1078876
    why: 'States Grove''s core comparative claim that Britain''s environmental sensibility was real but differently motivated and politically ineffective, unlike India''s state-engaged response to visible ecological collapse.'
  - id: grove-green-imperialism#u48-c2
    heading: 'Colonial extinction-consciousness reaching Darwin'
    span: 1081190:1081958
    why: 'Key evidentiary claim that island-and-India colonial botanists grasped extinction a generation before Europe and directly shaped Darwin''s thinking on the Beagle voyage.'
  - id: grove-green-imperialism#u48-c3
    heading: 'Balfour''s cross-colonial evidence at the Royal Geographical Society'
    span: 1090311:1091269
    why: 'Primary-source evidence of the desiccation debate''s globalization, with Balfour citing concrete colonial-state tree-protection interventions in Trinidad, India, and Mauritius as proof and remedy.'
  - id: grove-green-imperialism#u48-c4
    heading: 'The 1858 proto-greenhouse paper and its extinction prophecy'
    span: 1091516:1092789
    why: 'Preserves the earliest non-canonical anticipation of greenhouse-effect thinking within desiccationist discourse, ending in a stark forecast of humanity''s own climatic extinction.'
  - id: grove-green-imperialism#u48-c5
    heading: 'Decentering Marsh: colonial priority over Man and Nature'
    span: 1093427:1094530
    why: 'Grove''s explicit historiographical correction that Marsh reinforced rather than founded the colonial desiccationist consensus, which predated American conservation.'
  - id: grove-green-imperialism#u48-c6
    heading: 'The 1862 state letter and the shift to imperial centre stage'
    span: 1096260:1097477
    why: 'Pairs Grove''s framing of the letter as the conservation lobby''s culminating political success with the state''s own primary-source rejection of private capital, and Grove''s closing thesis sentence.'
- nn: 49
  unit_id: conclusion
  note_id: grove-green-imperialism-conclusion
  span: 1097480:1128287
  chunks:
  - id: grove-green-imperialism#u49-c1
    heading: 'The book''s thesis restated'
    span: 1126783:1128286
    why: 'This is Grove''s final, most general statement of the book''s central claim: modern environmentalism originated in colonial ecological crisis, not metropolitan philosophy.'
  - id: grove-green-imperialism#u49-c2
    heading: 'The colonial botanical garden as institution'
    span: 1100013:1100480
    why: 'States plainly that the botanical garden network, not individual theorists, was the institutional basis on which environmentalist ideas emerged.'
  - id: grove-green-imperialism#u49-c3
    heading: 'Desiccation theory and the Newtonian connection'
    span: 1109059:1109955
    why: 'Identifies desiccation theory''s Royal Society/Académie des Sciences and Newtonian scientific lineage, the mechanism that gave climatic environmentalism its authority.'
  - id: grove-green-imperialism#u49-c4
    heading: 'The paradox of the persuadable colonial state'
    span: 1111887:1112495
    why: 'Names the book''s central paradox directly and notes that conservation-minded scientists were sometimes opposed to the colonial project they worked within.'
  - id: grove-green-imperialism#u49-c5
    heading: 'Unfamiliar ecology, unfamiliar people, and risk'
    span: 1112497:1113247
    why: 'Gives Grove''s structural explanation — via Mary Douglas and The Tempest — for why colonial scientists gained authority over environmental risk.'
  - id: grove-green-imperialism#u49-c6
    heading: 'St Helena, Utopian islands, and the Rousseauist cult'
    span: 1102335:1102980
    why: 'Traces the literary Utopian-island lineage (Godwin, Defoe, Rousseau, Bernardin de Saint-Pierre) that Grove treats as co-constitutive with the scientific environmentalist discourse.'
