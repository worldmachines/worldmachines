# sha256 55e6e60b46256aad5a311af4e2763f5a1695e1eff2e1645764bafe21a7a4dc51
# (1128287 chars; tesseract re-OCR of the two-page-spread scan -- Introduction,
# Chapters 1-8 and Conclusion; front matter, running heads, plates and captions, one table,
