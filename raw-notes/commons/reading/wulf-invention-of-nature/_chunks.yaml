units:
- nn: 1
  unit_id: prologue
  note_id: wulf-invention-of-nature-prologue
  span: 3242:23441
  chunks:
  - id: wulf-invention-of-nature#u01-c1
    label: c1
    heading: Crawling the ridge on Chimborazo
    char_start: 4179
    char_end: 4669
    why: Opens the book with the physical extremity that produces Humboldt's intellectual breakthrough, establishing
      the mountain as both setting and structuring metaphor.
  - id: wulf-invention-of-nature#u01-c2
    label: c2
    heading: The summit and the new vision of nature
    char_start: 7228
    char_end: 7635
    why: 'The exact hinge moment where physical ascent converts into the book''s core intellectual claim: nature
      as one connected living organism.'
  - id: wulf-invention-of-nature#u01-c3
    label: c3
    heading: A man of contradictions
    char_start: 8579
    char_end: 9580
    why: Establishes Humboldt's defining paradoxes, warning against a flattened reading and setting up the biography's
      central tensions.
  - id: wulf-invention-of-nature#u01-c4
    label: c4
    heading: The invention of the web of life
    char_start: 12182
    char_end: 12884
    why: 'The thesis statement of the entire book: Humboldt as originator of the interconnected concept of nature,
      stated in Wulf''s own analytic voice and Humboldt''s own words.'
  - id: wulf-invention-of-nature#u01-c5
    label: c5
    heading: First warning of human-induced climate change
    char_start: 12886
    char_end: 13777
    why: Frames Humboldt as the first scientist to describe anthropogenic climate change, the environmental-warning
      stakes the whole book will trace.
  - id: wulf-invention-of-nature#u01-c6
    label: c6
    heading: The 1869 centennial celebrations
    char_start: 14863
    char_end: 15844
    why: Quantifies the scale of Humboldt's lost global fame, motivating Wulf's recovery project and the irony theme
      of a man forgotten despite ideas everywhere.
- nn: 2
  unit_id: ch01-beginnings
  note_id: wulf-invention-of-nature-ch01-beginnings
  span: 23441:50198
  chunks:
  - id: wulf-invention-of-nature#u02-c1
    label: c1
    heading: A childhood without warmth
    char_start: 26555
    char_end: 27264
    why: States directly, in Humboldt's own words, the emotional deprivation that Wulf treats as the root of his
      restless, driven personality.
  - id: wulf-invention-of-nature#u02-c2
    label: c2
    heading: The little apothecary
    char_start: 25926
    char_end: 26553
    why: The chapter's defining anecdote of boyhood ambition, foreshadowing his later scientific conquest of the
      natural world.
  - id: wulf-invention-of-nature#u02-c3
    label: c3
    heading: London and the drive that felt like madness
    char_start: 36787
    char_end: 37657
    why: Peak expression of Humboldt's Fernweh and near-breakdown, the emotional core of his pre-expedition years.
  - id: wulf-invention-of-nature#u02-c4
    label: c4
    heading: 'Freiberg: child of the Enlightenment'
    char_start: 40687
    char_end: 41701
    why: Captures the disciplined, quantifying empiricism of Humboldt's early method, the legibility-driven science
      he will later transcend.
  - id: wulf-invention-of-nature#u02-c5
    label: c5
    heading: Self-experiments in animal electricity
    char_start: 46827
    char_end: 48222
    why: Vivid, load-bearing evidence of Humboldt's manic empiricism and his direct engagement with the era's mechanism-versus-vitalism
      debate.
  - id: wulf-invention-of-nature#u02-c6
    label: c6
    heading: Cracks in the mechanistic worldview
    char_start: 48800
    char_end: 49989
    why: Documents the distributed, Europe-wide vitalist turn against Cartesian mechanism, the intellectual-historical
      hinge the chapter closes on.
- nn: 3
  unit_id: ch02-imagination-and-nature
  note_id: wulf-invention-of-nature-ch02-imagination-and-nature
  span: 50198:83224
  chunks:
  - id: wulf-invention-of-nature#u03-c1
    label: c1
    heading: 'Goethe''s urform: unity behind variety'
    char_start: 59702
    char_end: 60148
    why: States Goethe's archetypal-form theory that structures the whole unit's account of his science and its
      later influence on Humboldt.
  - id: wulf-invention-of-nature#u03-c2
    label: c2
    heading: Kant's transcendental revolution
    char_start: 73036
    char_end: 73814
    why: Summarizes the Kantian idea—mind orders nature rather than nature ordering mind—that reshapes the whole
      Jena circle's epistemology, including Humboldt's.
  - id: wulf-invention-of-nature#u03-c3
    label: c3
    heading: Organism versus machine
    char_start: 66196
    char_end: 66635
    why: Gives Goethe's explicit anti-Cartesian, anti-reductive claim that organisms are wholes shaping their parts,
      the unit's clearest statement of organicism against mechanism.
  - id: wulf-invention-of-nature#u03-c4
    label: c4
    heading: The frog's leg and 'breathing life into it'
    char_start: 65081
    char_end: 65568
    why: The pivotal (if scientifically mistaken) experiment that gives Humboldt his generative metaphor for a living,
      force-animated nature.
  - id: wulf-invention-of-nature#u03-c5
    label: c5
    heading: Humboldt turns toward feeling
    char_start: 76784
    char_end: 77706
    why: Marks the explicit turning point where Humboldt begins incorporating imagination and feeling into his empirical
      method, the unit's central intellectual claim.
  - id: wulf-invention-of-nature#u03-c6
    label: c6
    heading: New organs for South America
    char_start: 82298
    char_end: 82558
    why: The unit's closing thesis statement, framing the whole Jena period as the direct precondition for Humboldt's
      later fieldwork.
- nn: 4
  unit_id: ch03-in-search-of-a-destination
  note_id: wulf-invention-of-nature-ch03-in-search-of-a-destination
  span: 83224:102554
  chunks:
  - id: wulf-invention-of-nature#u04-c1
    label: c1
    heading: Strangers to each other
    char_start: 85025
    char_end: 85387
    why: 'Establishes the emotional key of the chapter: the mother''s death as liberation rather than loss, framing
      everything that follows as unshackled will.'
  - id: wulf-invention-of-nature#u04-c2
    label: c2
    heading: Money and no fixed destination
    char_start: 85729
    char_end: 86458
    why: Shows that the inheritance bought freedom to prepare before any destination was chosen, the core dynamic
      named in the chapter's title.
  - id: wulf-invention-of-nature#u04-c3
    label: c3
    heading: War closes the continent
    char_start: 88142
    char_end: 89190
    why: Demonstrates the geopolitical contingency (French Revolutionary Wars) that repeatedly overrides Humboldt's
      private will and readiness.
  - id: wulf-invention-of-nature#u04-c4
    label: c4
    heading: The Spanish colonial control apparatus
    char_start: 100387
    char_end: 101146
    why: Lays out the empire's absolutist, restriction-based administrative machine, a legibility-through-closure
      system Humboldt's science will implicitly work against.
  - id: wulf-invention-of-nature#u04-c5
    label: c5
    heading: All forces of nature interlaced
    char_start: 96501
    char_end: 97067
    why: States Humboldt's holistic research thesis in his own words before the voyage even begins, the intellectual
      program the rest of the book will track.
  - id: wulf-invention-of-nature#u04-c6
    label: c6
    heading: Head and heart at Cumaná
    char_start: 102044
    char_end: 102498
    why: Marks the chapter's closing threshold moment, framing the New World arrival as the start of Humboldt's
      personal transformation.
- nn: 5
  unit_id: ch04-south-america
  note_id: wulf-invention-of-nature-ch04-south-america
  span: 102554:125753
  chunks:
  - id: wulf-invention-of-nature#u05-c1
    label: c1
    heading: Collecting Ideas, Not Specimens
    char_start: 103604
    char_end: 103859
    why: States Humboldt's founding methodological commitment to holistic 'impression of the whole' over taxonomic
      cataloguing.
  - id: wulf-invention-of-nature#u05-c2
    label: c2
    heading: Everything Seemed Somehow Connected
    char_start: 103861
    char_end: 104620
    why: Names the interconnectedness insight that Wulf identifies as organizing Humboldt's entire worldview.
  - id: wulf-invention-of-nature#u05-c3
    label: c3
    heading: 'The Ground Betrays Him: 1799 Earthquake'
    char_start: 106902
    char_end: 107366
    why: The earthquake's shattering of Humboldt's faith in nature's stability is the emotional turning point of
      the unit.
  - id: wulf-invention-of-nature#u05-c4
    label: c4
    heading: Humboldt's Deforestation Warning
    char_start: 116689
    char_end: 117390
    why: Humboldt's own published words are the unit's core scientific claim, credited as founding anthropogenic
      climate change theory.
  - id: wulf-invention-of-nature#u05-c5
    label: c5
    heading: Everything Is Interaction and Reciprocal
    char_start: 120393
    char_end: 121246
    why: Generalizes deforestation into a broader ecological-chain-reaction principle via turtle and oyster depletion
      examples.
  - id: wulf-invention-of-nature#u05-c6
    label: c6
    heading: Comprehending Nature's Laws
    char_start: 125090
    char_end: 125552
    why: Closing thesis contrasting Humboldt's caution with the era's dominant 'improvement' ideology of subduing
      wilderness.
- nn: 6
  unit_id: ch05-the-llanos-and-the-orinoco
  note_id: wulf-invention-of-nature-ch05-the-llanos-and-the-orinoco
  span: 125753:155999
  chunks:
  - id: wulf-invention-of-nature#u06-c1
    label: c1
    heading: Horses and electric eels at Calabozo
    char_start: 128640
    char_end: 129309
    why: The chapter's central set-piece experiment, showing Humboldt's hands-on, dangerous empiricism and his career-long
      fascination with electricity.
  - id: wulf-invention-of-nature#u06-c2
    label: c2
    heading: A web of life, not a harmonious machine
    char_start: 139844
    char_end: 140868
    why: States explicitly the paradigm shift from Linnaeus's divinely-balanced food chain to Humboldt's conflict-and-mutual-pressure
      model of nature, the chapter's core intellectual claim.
  - id: wulf-invention-of-nature#u06-c3
    label: c3
    heading: What speaks to the soul escapes measurement
    char_start: 149498
    char_end: 150325
    why: 'Captures the Romantic-scientific synthesis at the heart of Humboldt''s method: relentless instrumentation
      held alongside an insistence that the deepest truths of nature exceed measurement.'
  - id: wulf-invention-of-nature#u06-c4
    label: c4
    heading: The Mauritia palm as keystone species
    char_start: 155208
    char_end: 155976
    why: Wulf's explicit claim that Humboldt anticipated the ecological keystone-species concept nearly two centuries
      before it was named, and the chapter's summary image of nature as one interconnected organism.
  - id: wulf-invention-of-nature#u06-c5
    label: c5
    heading: Barbarism of civilised man
    char_start: 147812
    char_end: 148205
    why: Establishes Humboldt's counter-colonial stance toward indigenous peoples, a recurring thread that shapes
      his later political writing on slavery and exploitation.
  - id: wulf-invention-of-nature#u06-c6
    label: c6
    heading: Mapping the Casiquiare against maps 'invented in Madrid'
    char_start: 151246
    char_end: 152297
    why: 'Shows legibility-making as scientific-colonial practice: converting orally-known geography into an instrument-verified,
      authoritative map.'
- nn: 7
  unit_id: ch06-across-the-andes
  note_id: wulf-invention-of-nature-ch06-across-the-andes
  span: 155999:179921
  chunks:
  - id: wulf-invention-of-nature#u07-c1
    label: c1
    heading: 'Obstacles as fuel: chasing a rumor of Baudin'
    char_start: 156983
    char_end: 157644
    why: Shows Humboldt reorganizing a continent-spanning itinerary on a mere guess and treating obstruction as
      acceleration, the chapter's defining trait of restless persistence.
  - id: wulf-invention-of-nature#u07-c2
    label: c2
    heading: 'The Quindío Pass: instruments on an eight-inch ledge'
    char_start: 165209
    char_end: 166022
    why: The unit's most physical passage, showing that scientific data collection and bodily survival are inseparable
      on the most dangerous trail in the Andes.
  - id: wulf-invention-of-nature#u07-c3
    label: c3
    heading: Collapse over a broken barometer
    char_start: 168893
    char_end: 169453
    why: Dramatizes the fragility of the material instruments underwriting Humboldt's project of making the earth
      measurable and comparable.
  - id: wulf-invention-of-nature#u07-c4
    label: c4
    heading: Neptunists, Vulcanists, and the volcano campaign's stakes
    char_start: 169993
    char_end: 171627
    why: States the systems-level scientific question (are volcanoes locally isolated or globally connected) driving
      five months of climbing, plus the era's live debate on the earth's origin.
  - id: wulf-invention-of-nature#u07-c5
    label: c5
    heading: Male friendships and the arrival of Carlos Montúfar
    char_start: 172228
    char_end: 172970
    why: Central to Wulf's biographical argument about Humboldt's emotional life and the pattern of intense male
      attachments that recurs throughout his career.
  - id: wulf-invention-of-nature#u07-c6
    label: c6
    heading: Imagination soothing the wounds of reason
    char_start: 178826
    char_end: 179194
    why: Crystallizes the book's thesis that Humboldt fused Enlightenment measurement with Romantic feeling, closing
      the unit on his own words about their relation.
- nn: 8
  unit_id: ch07-chimborazo
  note_id: wulf-invention-of-nature-ch07-chimborazo
  span: 179921:197562
  chunks:
  - id: wulf-invention-of-nature#u08-c1
    label: c1
    heading: The knife-edge ridge
    char_start: 182227
    char_end: 183204
    why: Conveys the physical extremity of the failed summit attempt that sets up the conceptual breakthrough.
  - id: wulf-invention-of-nature#u08-c2
    label: c2
    heading: Everything came together
    char_start: 184727
    char_end: 185542
    why: 'The chapter''s hinge moment: Humboldt''s synthesis of years of scattered observation into a unified vision
      of nature, the ''thousand threads'' image.'
  - id: wulf-invention-of-nature#u08-c3
    label: c3
    heading: Living whole, not dead aggregate
    char_start: 187421
    char_end: 188018
    why: States Humboldt's core theoretical claim in his own words, the relational conception of nature that displaces
      taxonomy.
  - id: wulf-invention-of-nature#u08-c4
    label: c4
    heading: Unity in variety
    char_start: 189419
    char_end: 189939
    why: Describes the Naturgemälde's unprecedented visual grammar and its lasting influence on ecological thinking.
  - id: wulf-invention-of-nature#u08-c5
    label: c5
    heading: Crediting the fishing boys
    char_start: 193045
    char_end: 193658
    why: Humboldt's own refusal to claim discovery over existing local knowledge complicates the chapter's great-man
      framing.
- nn: 9
  unit_id: ch08-politics-and-nature
  note_id: wulf-invention-of-nature-ch08-politics-and-nature
  span: 197562:233613
  chunks:
  - id: wulf-invention-of-nature#u09-c1
    label: c1
    heading: Politics and nature belonged together
    char_start: 201987
    char_end: 202356
    why: States the chapter's organizing thesis in Humboldt's own words to Jefferson's closest political ally.
  - id: wulf-invention-of-nature#u09-c2
    label: c2
    heading: Jefferson the farmer-president
    char_start: 210103
    char_end: 211026
    why: Establishes Jefferson's self-conception as scientist-farmer that makes his rapport with Humboldt possible.
  - id: wulf-invention-of-nature#u09-c3
    label: c3
    heading: Indigo and the exhausted soil
    char_start: 222251
    char_end: 222739
    why: Concrete case for Humboldt's core claim that cash-crop monoculture, not just violence, is colonialism's
      environmental weapon.
  - id: wulf-invention-of-nature#u09-c4
    label: c4
    heading: The human machine of the mines
    char_start: 220589
    char_end: 221614
    why: Shows Humboldt tying resource extraction directly to forced labor, grounding his colonialism critique in
      eyewitness detail.
  - id: wulf-invention-of-nature#u09-c5
    label: c5
    heading: One root, no superior race
    char_start: 231889
    char_end: 233120
    why: Humboldt's clearest, most consequential statement of human equality, marking the exact point where he diverges
      from Jefferson.
  - id: wulf-invention-of-nature#u09-c6
    label: c6
    heading: Jefferson's abandoned scheme
    char_start: 228629
    char_end: 229648
    why: Documents the hypocrisy underlying Jefferson's agrarian idealism, the necessary counterweight to c2 and
      c5.
- nn: 10
  unit_id: ch09-europe
  note_id: wulf-invention-of-nature-ch09-europe
  span: 233613:263212
  chunks:
  - id: wulf-invention-of-nature#u10-c1
    label: c1
    heading: Napoleon's Paris under construction
    char_start: 234489
    char_end: 235370
    why: Shows the Modernity Machine's centralizing, legibility-building infrastructure (police, bank, boulevards)
      rising even as political liberty contracts.
  - id: wulf-invention-of-nature#u10-c2
    label: c2
    heading: Why Paris, why science
    char_start: 235861
    char_end: 236949
    why: 'States directly why Humboldt roots himself in Paris: unmatched freedom of inquiry despite the political
      regime''s authoritarian turn.'
  - id: wulf-invention-of-nature#u10-c3
    label: c3
    heading: Humboldt's diagnosis of colonial racial mistrust
    char_start: 249409
    char_end: 249896
    why: Humboldt's structural account of why the colonies, though ripe for revolution in principle, remain blocked
      by engineered racial division.
  - id: wulf-invention-of-nature#u10-c4
    label: c4
    heading: Bolívar's oath at Monte Sacro
    char_start: 260664
    char_end: 261177
    why: The turning point where Bolívar converts from dilettante to revolutionary, an old identity dying before
      the new one is fully formed.
  - id: wulf-invention-of-nature#u10-c5
    label: c5
    heading: Austerlitz ends an era
    char_start: 261888
    char_end: 262322
    why: The chapter's explicit historical marker of an old order's abrupt end, framing the unit's close against
      Bolívar's parallel personal rupture.
- nn: 11
  unit_id: ch10-berlin
  note_id: wulf-invention-of-nature-ch10-berlin
  span: 263212:289702
  chunks:
  - id: wulf-invention-of-nature#u11-c1
    label: c1
    heading: The clock-and-uniform king
    char_start: 265389
    char_end: 265879
    why: Compact character sketch of the king whose patronage traps Humboldt, and a vivid emblem of legibility-obsessed
      rule (clocks, exact measurement) rather than vision or brilliance.
  - id: wulf-invention-of-nature#u11-c2
    label: c2
    heading: 'Organism versus clock: Schelling''s revolution'
    char_start: 277320
    char_end: 277973
    why: 'States the unit''s central intellectual argument: nature as an indivisible living organism rather than
      a disassemblable mechanism, the philosophical core of Humboldt''s post-1805 shift.'
  - id: wulf-invention-of-nature#u11-c3
    label: c3
    heading: Plants as historical witnesses
    char_start: 273745
    char_end: 274839
    why: Demonstrates Humboldt's signature method of reading vegetation as evidence of deep continental and civilizational
      history, including his anticipation of continental drift.
  - id: wulf-invention-of-nature#u11-c4
    label: c4
    heading: Views of Nature's invitation into the wild
    char_start: 285019
    char_end: 285457
    why: Captures the seductive, escapist prose style that made Views of Nature a new genre, and ties the book explicitly
      to Humboldt's personal and political misery in occupied Prussia.
  - id: wulf-invention-of-nature#u11-c5
    label: c5
    heading: Prussia's collapse at Jena-Auerstedt
    char_start: 280293
    char_end: 280888
    why: Supplies the political catastrophe — Prussia halved in a single day, then stripped of territory and universities
      at Tilsit — that frames Humboldt's despair and eventual flight to Paris.
- nn: 12
  unit_id: ch11-paris
  note_id: wulf-invention-of-nature-ch11-paris
  span: 289702:310775
  chunks:
  - id: wulf-invention-of-nature#u12-c1
    label: c1
    heading: Napoleon's contempt for an unbendable mind
    char_start: 296653
    char_end: 297108
    why: Shows the state's suspicion and hostility toward a scientific reputation it cannot control or coopt.
  - id: wulf-invention-of-nature#u12-c2
    label: c2
    heading: The friendship with Arago
    char_start: 294106
    char_end: 294952
    why: The clearest evidence of Humboldt's emotional interior and his closest personal bond during these years.
  - id: wulf-invention-of-nature#u12-c3
    label: c3
    heading: Wilhelm's charge of national betrayal
    char_start: 296017
    char_end: 296533
    why: Captures the brothers' opposing responses to national duty and the cost of Humboldt's cosmopolitan choice.
  - id: wulf-invention-of-nature#u12-c4
    label: c4
    heading: 'Rival encyclopedic projects: Voyage versus Description de l''Égypte'
    char_start: 297668
    char_end: 298514
    why: Frames Humboldt's publishing as direct competition with an imperial cataloguing project, illuminating science
      as an instrument of state legibility.
  - id: wulf-invention-of-nature#u12-c5
    label: c5
    heading: The Allies enter Paris
    char_start: 305019
    char_end: 305876
    why: Vivid staging of the Napoleonic order's collapse and the occupying forces' arrival, the chapter's historical
      climax.
  - id: wulf-invention-of-nature#u12-c6
    label: c6
    heading: Saving the Jardin des Plantes
    char_start: 307855
    char_end: 308600
    why: Shows Humboldt converting personal fame into concrete protection of a scientific space amid military occupation.
- nn: 13
  unit_id: ch12-revolutions-and-nature
  note_id: wulf-invention-of-nature-ch12-revolutions-and-nature
  span: 310775:356668
  chunks:
  - id: wulf-invention-of-nature#u13-c1
    label: c1
    heading: Bolívar's Chimborazo epigraph
    char_start: 310775
    char_end: 311983
    why: Bolívar's own poem stages his relationship to Humboldt as one of following then surpassing, the chapter's
      central image.
  - id: wulf-invention-of-nature#u13-c2
    label: c2
    heading: Humboldt's pen awakens South America
    char_start: 312782
    char_end: 313721
    why: States directly the chapter's thesis that Humboldt's writing fed the liberation movement's self-conception.
  - id: wulf-invention-of-nature#u13-c3
    label: c3
    heading: The Caracas earthquake as political omen
    char_start: 318347
    char_end: 319114
    why: Shows nature functioning as an active political actor in the revolution, not mere setting, and Bolívar's
      defiant response to it.
  - id: wulf-invention-of-nature#u13-c4
    label: c4
    heading: Buffon's degeneracy thesis
    char_start: 350255
    char_end: 350892
    why: States the European theory that made American nature a proxy battleground for civilizational rank, which
      the rest of the passage refutes.
  - id: wulf-invention-of-nature#u13-c5
    label: c5
    heading: Humboldt's rebuttal of Buffon
    char_start: 353062
    char_end: 353756
    why: Humboldt's firsthand-observation rebuttal of degeneracy theory, the evidentiary core that Bolívar and Jefferson
      both leaned on.
  - id: wulf-invention-of-nature#u13-c6
    label: c6
    heading: Nature as infallible teacher
    char_start: 355459
    char_end: 356002
    why: Bolívar's own closing formulation of the chapter's organizing claim, that political wisdom is read directly
      off the land.
- nn: 14
  unit_id: ch13-london
  note_id: wulf-invention-of-nature-ch13-london
  span: 356668:379234
  chunks:
  - id: wulf-invention-of-nature#u14-c1
    label: c1
    heading: The East India Company's silent refusal
    char_start: 368661
    char_end: 369231
    why: States the chapter's central diplomatic failure and its likely political cause—a liberal critic of empire
      barred by the very colonial monopoly he had criticized.
  - id: wulf-invention-of-nature#u14-c2
    label: c2
    heading: Herschel's evolving, living universe
    char_start: 365782
    char_end: 366338
    why: Shows the direct scientific source of Humboldt's organicist imagery, later reused verbatim in his own writing
      on the 'great garden of the universe.'
  - id: wulf-invention-of-nature#u14-c3
    label: c3
    heading: Coleridge and Wordsworth against the 'philosophy of mechanism'
    char_start: 375880
    char_end: 376865
    why: The chapter's clearest articulation of the Romantic-Humboldtian alliance against classificatory, mechanistic
      science—an early instance of the divergence-versus-legibility tension.
  - id: wulf-invention-of-nature#u14-c4
    label: c4
    heading: Wordsworth's Orinoco borrowing
    char_start: 372635
    char_end: 373492
    why: Concrete textual proof of direct transmission from Humboldt's field notes into English Romantic poetry,
      nearly word for word.
  - id: wulf-invention-of-nature#u14-c5
    label: c5
    heading: Humboldt reaches Frankenstein and Byron
    char_start: 371114
    char_end: 371630
    why: Marks how fast and widely Humboldt's imagery permeated British culture, reaching gothic fiction and satire
      alike within just a few years.
- nn: 15
  unit_id: ch14-going-in-circles
  note_id: wulf-invention-of-nature-ch14-going-in-circles
  span: 379234:412268
  chunks:
  - id: wulf-invention-of-nature#u15-c1
    label: c1
    heading: The "maladie centrifuge"
    char_start: 389970
    char_end: 390853
    why: 'Names and diagnoses the chapter''s central condition: fame and patronage without motion, the stalled decade
      after India was refused.'
  - id: wulf-invention-of-nature#u15-c2
    label: c2
    heading: Isotherms replace incomparable tables
    char_start: 394499
    char_end: 395361
    why: Documents Humboldt's invention of a still-used legibility technology — converting scattered climate data
      into comparable global pattern, and its direct influence on Lyell's geology.
  - id: wulf-invention-of-nature#u15-c3
    label: c3
    heading: Bonpland kidnapped in Paraguay
    char_start: 388557
    char_end: 389317
    why: Shows the collision of science-as-diplomacy idealism with authoritarian power, undercutting the chapter's
      earlier claim that science is 'a nation without borders'.
  - id: wulf-invention-of-nature#u15-c4
    label: c4
    heading: The king's order to return
    char_start: 403439
    char_end: 403977
    why: The formal instrument ending Humboldt's twenty-year Paris residence, forcing the pivot to Berlin that structures
      the rest of the book's next part.
  - id: wulf-invention-of-nature#u15-c5
    label: c5
    heading: Diving bell under the Thames
    char_start: 409323
    char_end: 410416
    why: Vivid, self-contained scene showing Humboldt's undiminished embodied risk-taking even while political and
      institutional doors remained closed to him.
- nn: 16
  unit_id: ch15-return-to-berlin
  note_id: wulf-invention-of-nature-ch15-return-to-berlin
  span: 412268:439272
  chunks:
  - id: wulf-invention-of-nature#u16-c1
    label: c1
    heading: Court life as gilded captivity
    char_start: 412854
    char_end: 413412
    why: 'Establishes the chapter''s central irony: Humboldt''s political powerlessness at court is the very condition
      he must instrumentalize to fund and champion science.'
  - id: wulf-invention-of-nature#u16-c2
    label: c2
    heading: The spirit of 1789 has ceased to exist
    char_start: 419420
    char_end: 419806
    why: Names the era's reactionary interregnum directly, the political Dusk against which Humboldt's turn to science
      is staged.
  - id: wulf-invention-of-nature#u16-c3
    label: c3
    heading: Withdrawal into science
    char_start: 422467
    char_end: 423015
    why: 'The pivot line of the chapter: disillusionment with global politics converted explicitly into a program
      of knowledge as the surviving form of power.'
  - id: wulf-invention-of-nature#u16-c4
    label: c4
    heading: Democratizing the lecture hall
    char_start: 423017
    char_end: 423688
    why: Documents the concrete mechanism of Humboldt's democratization of science — free, universal-audience public
      lectures cutting across class and gender lines.
  - id: wulf-invention-of-nature#u16-c5
    label: c5
    heading: The bricolage of a connective mind
    char_start: 426044
    char_end: 426796
    why: Physically renders the distributed, accretive method behind Humboldt's associative thinking, the same structure
      that shapes both his notes and his Naturgemälde lectures.
  - id: wulf-invention-of-nature#u16-c6
    label: c6
    heading: Diversity of opinion as method
    char_start: 428170
    char_end: 428933
    why: Captures Humboldt's deliberate redesign of scientific institutions around networked exchange rather than
      hierarchical presentation.
- nn: 17
  unit_id: ch16-russia
  note_id: wulf-invention-of-nature-ch16-russia
  span: 439272:476995
  chunks:
  - id: wulf-invention-of-nature#u17-c1
    label: c1
    heading: The diamond prediction vindicated
    char_start: 446323
    char_end: 447179
    why: Shows Humboldt's comparative geological method delivering a spectacular, verified prediction, read by contemporaries
      as magic rather than science.
  - id: wulf-invention-of-nature#u17-c2
    label: c2
    heading: The gag order on political commentary
    char_start: 447514
    char_end: 448328
    why: Contrasts Humboldt's outspoken Latin American critique with his enforced silence in Russia, the clearest
      statement of the state's constraint on his science.
  - id: wulf-invention-of-nature#u17-c3
    label: c3
    heading: The Tsarist surveillance state
    char_start: 448330
    char_end: 449038
    why: A concise portrait of the legibility-and-control apparatus Humboldt was operating within, directly relevant
      to world-machine framing of coercive legibility.
  - id: wulf-invention-of-nature#u17-c4
    label: c4
    heading: Liberated from the controlling hand
    char_start: 454775
    char_end: 455343
    why: Marks the turn once Humboldt exceeds his sanctioned itinerary, capturing the emotional payoff of evading
      state supervision.
  - id: wulf-invention-of-nature#u17-c5
    label: c5
    heading: Founding the Magnetic Crusade
    char_start: 471845
    char_end: 473347
    why: The founding rhetoric of a genuinely global, distributed scientific infrastructure project, the seed of
      the worldwide geomagnetic observation network.
  - id: wulf-invention-of-nature#u17-c6
    label: c6
    heading: Three ways humankind affects climate
    char_start: 469076
    char_end: 469801
    why: States Humboldt's prescient triad of human climate impacts, the unit's most consequential single scientific
      claim.
- nn: 18
  unit_id: ch17-evolution-and-nature
  note_id: wulf-invention-of-nature-ch17-evolution-and-nature
  span: 476995:521459
  chunks:
  - id: wulf-invention-of-nature#u18-c1
    label: c1
    heading: Personal Narrative as the cause of the voyage
    char_start: 478495
    char_end: 479271
    why: Establishes in Darwin's own words that Humboldt's book was the direct cause of the Beagle voyage, the chapter's
      organizing claim.
  - id: wulf-invention-of-nature#u18-c2
    label: c2
    heading: Telescopic and microscopic perception
    char_start: 498531
    char_end: 499162
    why: States the shared cognitive method — zooming between smallest detail and global pattern — that the chapter
      treats as the real mechanism of Humboldtian science.
  - id: wulf-invention-of-nature#u18-c3
    label: c3
    heading: Struggle for existence before Malthus
    char_start: 515930
    char_end: 517156
    why: Shows Darwin's own marginalia locating the germ of natural selection in Humboldt's descriptions of predation
      and population checks, prior to reading Malthus.
  - id: wulf-invention-of-nature#u18-c4
    label: c4
    heading: Kelp as keystone species
    char_start: 497149
    char_end: 497944
    why: Demonstrates the direct transfer of Humboldt's ecological-systems thinking (keystone species, web of interdependence)
      into Darwin's own analysis.
  - id: wulf-invention-of-nature#u18-c5
    label: c5
    heading: The entangled bank
    char_start: 517847
    char_end: 518453
    why: The chapter's culminating textual proof and thesis statement, tracing the Origin of Species' final paragraph
      back to Humboldt and stating the debt outright.
- nn: 19
  unit_id: ch18-humboldts-cosmos
  note_id: wulf-invention-of-nature-ch18-humboldts-cosmos
  span: 521459:557753
  chunks:
  - id: wulf-invention-of-nature#u19-c1
    label: c1
    heading: The mad frenzy of Cosmos
    char_start: 521460
    char_end: 521895
    why: States the book's totalizing ambition in Humboldt's own words, framing the entire chapter's project.
  - id: wulf-invention-of-nature#u19-c2
    label: c2
    heading: The box-and-envelope method
    char_start: 525503
    char_end: 526613
    why: Documents the distributed correspondence-and-filing system that let one author synthesize an army of specialist
      contributions.
  - id: wulf-invention-of-nature#u19-c3
    label: c3
    heading: Nature as living whole
    char_start: 547752
    char_end: 548105
    why: Gives Cosmos's central thesis in Humboldt's own imagery of an interconnected, animated nature rather than
      a catalogue of facts.
  - id: wulf-invention-of-nature#u19-c4
    label: c4
    heading: Darwin misses the Siberian river
    char_start: 540237
    char_end: 541100
    why: The pivotal, almost accidental transmission of a biogeographical observation from Humboldt to Darwin, later
      chased down through Hooker.
  - id: wulf-invention-of-nature#u19-c5
    label: c5
    heading: A godless cosmos
    char_start: 549133
    char_end: 549888
    why: Marks Cosmos's explicit substitution of an immanent, irreligious web of life for divine agency, a defining
      and controversial move.
  - id: wulf-invention-of-nature#u19-c6
    label: c6
    heading: 'American reception: Emerson, Poe, Whitman'
    char_start: 555059
    char_end: 556178
    why: Shows Cosmos's reach into American letters, setting up the following chapter on Thoreau and situating the
      book's cultural afterlife.
- nn: 20
  unit_id: ch19-poetry-science-and-nature
  note_id: wulf-invention-of-nature-ch19-poetry-science-and-nature
  span: 557753:589535
  chunks:
  - id: wulf-invention-of-nature#u20-c1
    label: c1
    heading: Walden as Thoreau's answer to Cosmos
    char_start: 559430
    char_end: 559994
    why: 'States the chapter''s central causal claim: Walden only became itself through Thoreau''s encounter with
      Humboldt''s Cosmos.'
  - id: wulf-invention-of-nature#u20-c2
    label: c2
    heading: Kant, Locke, and the Transcendentalist impasse
    char_start: 572982
    char_end: 573996
    why: Explains the philosophical fork between Emerson's intuitionism and Thoreau's growing empiricism that Humboldt
      would resolve.
  - id: wulf-invention-of-nature#u20-c3
    label: c3
    heading: The bond between knowledge and poetry
    char_start: 579318
    char_end: 579967
    why: The chapter's clearest statement of Humboldt's science-poetry synthesis and its effect on Thoreau's method.
  - id: wulf-invention-of-nature#u20-c4
    label: c4
    heading: Naturgemälde on a New England mountaintop
    char_start: 585259
    char_end: 585918
    why: Shows Thoreau directly applying Humboldt's Naturgemälde concept of unity-through-relation to local landscape.
  - id: wulf-invention-of-nature#u20-c5
    label: c5
    heading: Earth is all alive
    char_start: 587680
    char_end: 588516
    why: Culminating vitalist passage where the sand-foliage phenomenon becomes a cosmological, living-earth statement.
  - id: wulf-invention-of-nature#u20-c6
    label: c6
    heading: Walden as mini-Cosmos
    char_start: 588518
    char_end: 588979
    why: Closing synthesis naming Walden itself as a localized Humboldtian Cosmos grounded in observation.
- nn: 21
  unit_id: ch20-greatest-man-since-the-deluge
  note_id: wulf-invention-of-nature-ch20-greatest-man-since-the-deluge
  span: 589535:630631
  chunks:
  - id: wulf-invention-of-nature#u21-c1
    label: c1
    heading: Barricade night in Berlin
    char_start: 592775
    char_end: 593604
    why: Depicts the 1848 Berlin uprising as a moment when the old absolutist order's legitimacy visibly cracks,
      with Humboldt caught at home listening — the chapter's clearest interregnum scene.
  - id: wulf-invention-of-nature#u21-c2
    label: c2
    heading: Always in the antechamber of the palace
    char_start: 596410
    char_end: 596927
    why: Names the exact structural position Humboldt occupies between two political worlds, in his own words and
      in the King of Hanover's summary judgment.
  - id: wulf-invention-of-nature#u21-c3
    label: c3
    heading: Worn-out hope after failed revolutions
    char_start: 599567
    char_end: 600662
    why: Humboldt's retrospective survey of every revolution he lived through, ending in the durable image of dormant-but-eternal
      reformist desire.
  - id: wulf-invention-of-nature#u21-c4
    label: c4
    heading: The cluttered apartment at Oranienburger Straße
    char_start: 615279
    char_end: 616414
    why: The densest physical description of Humboldt's private world, showing a life of global reach compressed
      into one overstuffed, modest apartment.
  - id: wulf-invention-of-nature#u21-c5
    label: c5
    heading: Death and the sunbeams
    char_start: 622701
    char_end: 623360
    why: The chapter's climactic death scene, combining the era's new instant-communication infrastructure with
      Humboldt's final, characteristically cosmic last words.
  - id: wulf-invention-of-nature#u21-c6
    label: c6
    heading: The Heart of the Andes
    char_start: 624746
    char_end: 625799
    why: Shows Humboldt's ideal of uniting art and science realized in Church's painting at the exact moment of
      his death, marking the start of his afterlife as cultural touchstone.
- nn: 22
  unit_id: ch21-man-and-nature
  note_id: wulf-invention-of-nature-ch21-man-and-nature
  span: 630631:666433
  chunks:
  - id: wulf-invention-of-nature#u22-c1
    label: c1
    heading: Landscape as human record (Egypt/Nile)
    char_start: 639691
    char_end: 640313
    why: Captures Marsh's core epiphany — that worn landscapes are a legible record of accumulated human action
      across millennia — which becomes the organizing idea of Man and Nature.
  - id: wulf-invention-of-nature#u22-c2
    label: c2
    heading: Humboldt's warnings made real
    char_start: 640941
    char_end: 641620
    why: Shows the direct causal chain from Humboldt's scattered observations to Marsh's firsthand conviction, establishing
      the intellectual debt the whole book is built on.
  - id: wulf-invention-of-nature#u22-c3
    label: c3
    heading: Invisible bonds of nature
    char_start: 655832
    char_end: 656787
    why: The book's clearest statement of systemic, unintended-consequence causality (beavers, wolves, birds, aqueduct
      microbes), the closest thing to a thesis sentence for ecological interdependence.
  - id: wulf-invention-of-nature#u22-c4
    label: c4
    heading: Bleak planetary vision and Rome's fall
    char_start: 657308
    char_end: 658001
    why: Scales the argument from local observation to civilizational collapse, making environmental degradation
      a candidate explanation for the fall of an entire world-order.
  - id: wulf-invention-of-nature#u22-c5
    label: c5
    heading: The book's slow-burn global afterlife
    char_start: 663659
    char_end: 664418
    why: Documents the multi-decade, distributed diffusion of the book's influence into concrete institutions and
      laws, the payoff of the entire chapter's narrative arc.
- nn: 23
  unit_id: ch22-art-ecology-and-nature
  note_id: wulf-invention-of-nature-ch22-art-ecology-and-nature
  span: 666433:705863
  chunks:
  - id: wulf-invention-of-nature#u23-c1
    label: c1
    heading: 'Two souls: the Faustian crisis'
    char_start: 666556
    char_end: 667118
    why: Establishes the chapter's central tension (art vs. science) as literally triggered by Humboldt's death,
      framing everything that follows.
  - id: wulf-invention-of-nature#u23-c2
    label: c2
    heading: The radiolarian discoveries
    char_start: 680793
    char_end: 681498
    why: Shows the empirical discovery that lets Haeckel reconcile his 'two souls' through scientific illustration,
      in his own ecstatic terms.
  - id: wulf-invention-of-nature#u23-c3
    label: c3
    heading: Naming ecology
    char_start: 687510
    char_end: 688285
    why: 'The chapter''s key conceptual event: Haeckel explicitly credits Humboldt''s language while coining ''ecology''
      as a term, a paradigmatic case of a concept assembling before being named.'
  - id: wulf-invention-of-nature#u23-c4
    label: c4
    heading: Monism as ersatz religion
    char_start: 700932
    char_end: 701558
    why: Names the fragmentation/unity tension driving Haeckel's philosophical turn and its bestseller-scale cultural
      impact.
  - id: wulf-invention-of-nature#u23-c5
    label: c5
    heading: Radiolarians into Art Nouveau
    char_start: 698271
    char_end: 699397
    why: Documents the direct downstream influence of Haeckel's scientific illustrations on Gaudí, Sullivan, and
      Tiffany, showing the chapter's argument for science-as-ornament made concrete.
- nn: 24
  unit_id: ch23-preservation-and-nature
  note_id: wulf-invention-of-nature-ch23-preservation-and-nature
  span: 705863:752716
  chunks:
  - id: wulf-invention-of-nature#u24-c1
    label: c1
    heading: '"How intensely I desire to be a Humboldt"'
    char_start: 706201
    char_end: 706879
    why: States outright the imitative, discipleship logic that structures Muir's entire biography in this unit.
  - id: wulf-invention-of-nature#u24-c2
    label: c2
    heading: Hitched to everything else in the universe
    char_start: 721363
    char_end: 721992
    why: Muir's signature articulation of Humboldtian holism, the formula that later underwrites his political arguments
      for Yosemite's protection.
  - id: wulf-invention-of-nature#u24-c3
    label: c3
    heading: Preservation versus conservation
    char_start: 744998
    char_end: 745672
    why: 'The chapter''s key historiographical claim: Humboldt''s ideas fork into Marsh''s economic conservation
      and Muir''s moral preservation.'
  - id: wulf-invention-of-nature#u24-c4
    label: c4
    heading: Hetch Hetchy lost, a movement born
    char_start: 746771
    char_end: 747718
    why: The founding defeat of American wilderness politics, and the moment preservation learns to organize nationally
      despite losing.
  - id: wulf-invention-of-nature#u24-c5
    label: c5
    heading: Railway time and the closing frontier
    char_start: 733073
    char_end: 733829
    why: Names the legibility-driven industrial acceleration (standardized time, land-claiming, rail expansion)
      that Muir's preservationism is reacting against.
- nn: 25
  unit_id: epilogue
  note_id: wulf-invention-of-nature-epilogue
  span: 752716:758466
  chunks:
  - id: wulf-invention-of-nature#u25-c1
    label: c1
    heading: Disciplinary fracture and the loss of holism
    char_start: 752716
    char_end: 753414
    why: 'States the epilogue''s core diagnosis: specialization, not refutation, erased Humboldt''s holistic method.'
  - id: wulf-invention-of-nature#u25-c2
    label: c2
    heading: Ideas surviving the man's name
    char_start: 753947
    char_end: 754197
    why: Captures the paradox of a paradigm succeeding so fully it becomes invisible infrastructure, the decay-sequence
      dynamic.
  - id: wulf-invention-of-nature#u25-c3
    label: c3
    heading: Anti-German erasure of a global reputation
    char_start: 754375
    char_end: 755260
    why: Concrete evidence that political contingency, not scientific merit, drove Humboldt's disappearance from
      Anglophone memory.
  - id: wulf-invention-of-nature#u25-c4
    label: c4
    heading: Humboldt and the climate present
    char_start: 756587
    char_end: 757626
    why: The passage that directly ties Humboldt's holistic method to the book's argument for present-day relevance,
      citing the IPCC, Wendell Berry, and Naomi Klein.
  - id: wulf-invention-of-nature#u25-c5
    label: c5
    heading: Humboldt's 1801 planetary warning
    char_start: 757701
    char_end: 758104
    why: The book's most striking oracular quotation, an early articulation of humanity as a destructive planetary
      force.
  - id: wulf-invention-of-nature#u25-c6
    label: c6
    heading: Goethe's fountain
    char_start: 758259
    char_end: 758465
    why: The book's closing image, crystallizing the epilogue's thesis of influence without attribution.
