    heading: Maupertuis, the Law of Thrift and the unity of nature
    char_start: 394743
    char_end: 395965
    start_quote: Maupertuis had in 1751, under the assumed name of Baumann
    end_quote: of which the _Pensées Philosophiques_ of 1746 were the cruder prelude.
    why: Morley's setting of the Interpretation of Nature against Maupertuis's unity of the universe and
      the line from the Law of Thrift to Holbach.
  - id: morley-diderot-v2#u19-c2
    label: c2
    heading: Geometry's decline and the geometer's politics
    char_start: 396839
    char_end: 398549
    start_quote: In the region of science itself, again, Diderot foresees as great a
    end_quote: The repulse of geometry to its proper rank came too late.
    why: Diderot's prediction about geometry plus Morley's own argument that geometrical method distorted
      French social and political thought.
  - id: morley-diderot-v2#u19-c3
    label: c3
    heading: The tower of Shinar and the limits of knowledge
    char_start: 398762
    char_end: 401741
    start_quote: When we compare the infinite multitude of the phenomena of nature
    end_quote: it is without contradiction the base of our real knowledge."
    why: Diderot's central statement of human cognitive limits and utility as the bound on inquiry, offered
      by Morley as the germ of Comte's subjective synthesis.
  - id: morley-diderot-v2#u19-c4
    label: c4
    heading: 'Against final causes: the How, not the Why'
    char_start: 404575
    char_end: 405943
    start_quote: The physicist, whose profession is to instruct and not to edify,
    end_quote: accepts the silly praise and smiles at man's vanity" (§ 56).
    why: Diderot's methodological rejection of teleological explanation in natural science.
  - id: morley-diderot-v2#u19-c5
    label: c5
    heading: Nature's single act and the idea of a Whole
    char_start: 406311
    char_end: 407032
    start_quote: '"Astonishment often comes from our supposing several'
    end_quote: without the idea of a Whole, there can be no Philosophy_" (§ 11).
    why: Diderot's unity-of-nature aphorism, the philosophical core connecting him to Maupertuis and onward
      to Holbach's system.
  - id: morley-diderot-v2#u19-c6
    label: c6
    heading: The world is old, the earth only inhabited yesterday
    char_start: 407719
    char_end: 408637
    start_quote: '"When I turn my'
    end_quote: they would never deign to answer them at all."
    why: Diderot's closing reflection on the gap between human achievement and ignorance, which Morley
      takes as a model of the wise use of intelligence.
- nn: 20
  unit_id: ch09-conclusion-2
  note_id: morley-diderot-v2-ch09-conclusion-2
  span: 408640:428699
  chunks:
  - id: morley-diderot-v2#u20-c1
    label: c1
    heading: The clavecin, one substance, and the egg
    char_start: 411863
    char_end: 413273
    start_quote: '"The thinking man is like a musical instrument.'
    end_quote: the flesh, the beak, and so forth."
    why: 'The unit''s concentrated statement of Diderot''s materialism: sensibility as an organised instrument,
      a single substance, and life from matter by heat and movement.'
  - id: morley-diderot-v2#u20-c2
    label: c2
    heading: Bordeu on vice, virtue, and punishment
    char_start: 413544
    char_end: 414367
    start_quote: But doctor, cries Mdlle. Lespinasse, what becomes of vice and
    end_quote: encouraging the other that we call good.
    why: 'Draws the moral consequence of necessity: virtue as beneficence and punishment as correction
      of a modifiable being.'
  - id: morley-diderot-v2#u20-c3
    label: c3
    heading: Science before letters in the Russian curriculum
    char_start: 415515
    char_end: 416304
    start_quote: The one strongly marked idea of the plan is what might have been
    end_quote: took their place among the objects or instruments of education.
    why: Morley's summary of the Plan of a University's inverted curriculum, putting mathematics and natural
      science ahead of Greek, Latin and poetry.
  - id: morley-diderot-v2#u20-c4
    label: c4
    heading: Catherine and Diderot's flattery
    char_start: 417198
    char_end: 418001
    start_quote: There is a story that one evening at St. Petersburg, Diderot was
    end_quote: still further in the same sulphureous track.
    why: A vivid anecdote of the philosopher's accommodation to power and Morley's verdict on his concessions
      to the Empress.
  - id: morley-diderot-v2#u20-c5
    label: c5
    heading: The parable of the young Mexican
    char_start: 420440
    char_end: 423904
    start_quote: A young Mexican, tired of his work, was sauntering one day on the
    end_quote: besought forgiveness.
    why: The best-known literary passage of the Maréchale conversation, an allegory of honest unbelief
      and divine forgiveness of sincere error.
  - id: morley-diderot-v2#u20-c6
    label: c6
    heading: Posterity for the philosopher as the other world for the devout
    char_start: 427622
    char_end: 428696
    start_quote: No, cries Diderot, with redoubled eloquence, rising to his noblest
    end_quote: Posterity is for the philosopher what the other world is for the devout!"
    why: Diderot's eloquent reply to Falconet, recasting immortality as the verdict of posterity on tyrants
      and persecutors.
- nn: 21
  unit_id: appendix-rameaus-nephew-1
  note_id: morley-diderot-v2-appendix-rameaus-nephew-1
  span: 428699:453894
  chunks:
  - id: morley-diderot-v2#u21-c1
    label: c1
    heading: The narrator at the Palais Royal
    char_start: 429124
    char_end: 429885
    start_quote: In all weathers, wet or fine, it is my practice to go
    end_quote: My thoughts,--these are the wantons for me.
    why: Establishes the narrator's voice and the free-associating, libertine mode of thought in which
      the dialogue unfolds.
  - id: morley-diderot-v2#u21-c2
    label: c2
    heading: The eccentric as leaven
    char_start: 433302
    char_end: 434144
    start_quote: I do not rate these originals very highly.
    end_quote: this is the time when a man of sense listens, and distinguishes his company.
    why: The narrator's argument that an original character breaks social uniformity and reveals the truth
      about a company.
  - id: morley-diderot-v2#u21-c3
    label: c3
    heading: Against men of genius
    char_start: 438752
    char_end: 440961
    start_quote: If he has done anything for anybody, it is without knowing
    end_quote: or else thrown to the ducks.
    why: He's comic case against genius and truth, the dialogue's opening provocation to which I replies.
  - id: morley-diderot-v2#u21-c4
    label: c4
    heading: Racine, Voltaire and the tree that shades the world
    char_start: 447307
    char_end: 449237
    start_quote: _I._--Granted, but weigh the good and bad.
    end_quote: will never stir a single emotion in you more.
    why: I's long-horizon defence of great talent despite personal vice, using the tree image and the
      appeal to posterity.
  - id: morley-diderot-v2#u21-c5
    label: c5
    heading: The best order of things includes me
    char_start: 449540
    char_end: 450472
    start_quote: _He._--You are right. The important point is that you and I should
    end_quote: as so many good folk suppose.
    why: A compact comic-philosophical exchange on existence, the order of things and necessity.
  - id: morley-diderot-v2#u21-c6
    label: c6
    heading: Envy and mediocrity
    char_start: 450800
    char_end: 451564
    start_quote: I never in my life heard a
    end_quote: So I was jealous of my uncle.
    why: He's frank confession of envy and resentment of greatness, which drives the rest of the dialogue's
      psychology of reputation.
- nn: 22
  unit_id: appendix-rameaus-nephew-2
  note_id: morley-diderot-v2-appendix-rameaus-nephew-2
  span: 453894:481880
  chunks:
  - id: morley-diderot-v2#u22-c1
    label: c1
    heading: Lost for having common sense once
    char_start: 454888
    char_end: 456946
    start_quote: You know that I am an ignoramus, a fool, a madman, an impertinent,
    end_quote: Ah! if that ever chances again!
    why: He explains that his protectors valued him for his vices and cast him out for a single act of
      reason, the core of the patronage satire.
  - id: morley-diderot-v2#u22-c2
    label: c2
    heading: Dignity and a halfpenny
    char_start: 459836
    char_end: 460833
    start_quote: Yes, you are right; I see it is the best. Yet to go and
    end_quote: for a halfpenny there is nothing too dirty for me to do.
    why: He refuses to grovel on grounds of an inexplicable human dignity and in the same breath admits
      it is intermittent.
  - id: morley-diderot-v2#u22-c3
    label: c3
    heading: The soliloquy of self-contempt
    char_start: 461190
    char_end: 463761
    start_quote: 'How many times have I said to myself: What, Rameau,'
    end_quote: A man might almost as well never have been born.
    why: He imagines the panderer's career he could have had and names the torment of unused, merely useful
      talent.
  - id: morley-diderot-v2#u22-c4
    label: c4
    heading: I's plan for a daughter's education
    char_start: 473886
    char_end: 475165
    start_quote: To reason justly, if I can; a thing so uncommon among men,
    end_quote: and a great deal of morality.
    why: I states his own educational aims (reason, courage, morality), the position against which He's
      satire of teaching is set.
  - id: morley-diderot-v2#u22-c5
    label: c5
    heading: Why those who know the elements will not teach them
    char_start: 475817
    char_end: 477435
    start_quote: Because they would have spent all their lives in studying
    end_quote: and that was exactly my doctrine when I gave myself out for a
    why: He argues that mastery and elementary teaching are at odds and that physics is a drop from an
      ocean, mixing real insight with extravagance.
  - id: morley-diderot-v2#u22-c6
    label: c6
    heading: A music lesson as comedy of flattery
    char_start: 478137
    char_end: 481873
    start_quote: What they all do! I got there, I threw myself into a chair.
    end_quote: and behold, that was what they call a music lesson.
    why: A complete comic reconstruction of how paid instruction works as gossip, flattery and fee, including
      the joke about Voltaire's habitual death.
- nn: 23
  unit_id: appendix-rameaus-nephew-3
  note_id: morley-diderot-v2-appendix-rameaus-nephew-3
  span: 481880:508454
  chunks:
  - id: morley-diderot-v2#u23-c1
    label: c1
    heading: General conscience and idioms of vocation
    char_start: 483055
    char_end: 483449
    start_quote: But, my philosopher, there is a general conscience, just as there is a general grammar
    end_quote: title of idioms of vocation.
    why: The Nephew's theory that each trade carries its own exceptions to a general conscience frames
      the whole dispute over morality.
  - id: morley-diderot-v2#u23-c2
    label: c2
    heading: All ranks devour one another
    char_start: 486751
    char_end: 487518
    start_quote: In nature, all species devour one another; so all ranks devour one another in society.
    end_quote: you only need to take a clear survey of the whole.
    why: He's naturalistic justification of theft and social predation, the dialogue's bluntest rationalisation
      of vice.
  - id: morley-diderot-v2#u23-c3
    label: c3
    heading: 'Vanity: country, friends, position, children'
    char_start: 490782
    char_end: 491711
    start_quote: _I._--What, to defend one's native land?
    end_quote: serve their vices, praise their injustice--there is the secret.
    why: A rapid-fire exchange in which the Nephew dismisses every traditional duty and names the court's
      real secret of success.
  - id: morley-diderot-v2#u23-c4
    label: c4
    heading: The philosopher's happiness and the Calas
    char_start: 493908
    char_end: 495591
    start_quote: But I will not dissemble from you that it is infinitely pleasanter to me to have succoured
      the unfortunate
    end_quote: my tongue falter for sympathy.
    why: I's fullest statement of an ethic of good actions and sympathy, with the Calas and Carthagena
      examples.
  - id: morley-diderot-v2#u23-c5
    label: c5
    heading: Vice suited to the nature and the patrons
    char_start: 496826
    char_end: 499514
    start_quote: _He._--And since I can secure my happiness by vices which are
    end_quote: the happiness of a few visionaries like yourself.
    why: The Nephew's longest defence of his way of life, linking temperament, patronage and the hypocrisy
      of virtue.
  - id: morley-diderot-v2#u23-c6
    label: c6
    heading: The worm that turns
    char_start: 500331
    char_end: 500717
    start_quote: _He._--Everybody has his own dignity.
    end_quote: but we turn when they tread on our tails.
    why: Compact image of the dependent man's residual pride, qualifying his professed abjection.
- nn: 24
  unit_id: appendix-rameaus-nephew-4
  note_id: morley-diderot-v2-appendix-rameaus-nephew-4
  span: 508454:535639
  chunks:
  - id: morley-diderot-v2#u24-c1
    label: c1
    heading: Society swallows flattering lies
    char_start: 512088
    char_end: 512745
    start_quote: What do you mean by anybody? It is the sentiment and
    end_quote: And then we have the air of being so profoundly penetrated, so true.
    why: He's compact statement of why the flatterer's trade works, and of the social consensus behind
      it.
  - id: morley-diderot-v2#u24-c2
    label: c2
    heading: 'The school of humanity: a household of parasites'
    char_start: 513828
    char_end: 515446
    start_quote: What would you have? It is a mishap, an unlucky moment, such
    end_quote: Nobody can have any parts if he is not as stupid as ourselves.
    why: Gives the beast-like parasite household and its abuse of Buffon, Montesquieu, Rousseau, Voltaire,
      D'Alembert and Diderot, tied to Palissot's play.
  - id: morley-diderot-v2#u24-c3
    label: c3
    heading: Reading Moliere to avoid the tone of vice
    char_start: 519414
    char_end: 521393
    start_quote: For my part, I gather from them all that one ought to do,
    end_quote: which is in this kind wondrous fertile.
    why: 'He''s inversion of moral reading: keep the useful vices but avoid their tone, against I''s conventional
      view of instruction.'
  - id: morley-diderot-v2#u24-c4
    label: c4
    heading: The fool, the sage, and interest as the measure of virtue
    char_start: 521536
    char_end: 522988
    start_quote: I am not so in the least, for against a single time when one
    end_quote: and virtue what I call vice.
    why: The unit's central ethical claim, that manners are relative to interest, framed by the king's-fool
      paradox.
  - id: morley-diderot-v2#u24-c5
    label: c5
    heading: The quarrel and the expulsion
    char_start: 525440
    char_end: 525791
    start_quote: '"Rameau, you are an impertinent."'
    end_quote: '"I recommend you to go."'
    why: Dramatises He's self-knowing role as impertinent beggar in the patron's house.
  - id: morley-diderot-v2#u24-c6
    label: c6
    heading: The tacit compact and nature's public prosecutor
    char_start: 533132
    char_end: 535134
    start_quote: But if the personages were not ridiculous in themselves they
    end_quote: Nature knows all the vices that escape the laws.
    why: He's justification of parasitism as a mutual compact, with nature enforcing the penalties that
      law misses.
- nn: 25
  unit_id: appendix-rameaus-nephew-5
  note_id: morley-diderot-v2-appendix-rameaus-nephew-5
  span: 535639:564184
  chunks:
  - id: morley-diderot-v2#u25-c1
    label: c1
    heading: Sublimity in evil and unity of character
    char_start: 536243
    char_end: 536565
    start_quote: It is important in some lines of business to reach sublimity; it is especially so in
      evil.
    end_quote: In all things, what people prize is unity of character.
    why: 'He''s compact justification of confessing his turpitude: great criminals earn a respect that
      small rogues cannot, and consistency is what people value.'
  - id: morley-diderot-v2#u25-c2
    label: c2
    heading: The Renegade's double betrayal
    char_start: 542229
    char_end: 542640
    start_quote: The sublimity of his wickedness is this, that he was himself the informer
    end_quote: descendant of those who crucified our Lord.
    why: The twist of the Avignon story, which He offers as the model of great crime and which draws I's
      horror and the 'tone' rebuke.
  - id: morley-diderot-v2#u25-c3
    label: c3
    heading: Moral deafness and the paternal molecule
    char_start: 543547
    char_end: 544230
    start_quote: It must be because there is for the one a sense that I have not got
    end_quote: that accursed first molecule has assimilated to itself all the rest.
    why: He's materialist-flavoured account (fibre, blood, molecule) of why a fine musical ear coexists
      with a deaf heart.
  - id: morley-diderot-v2#u25-c4
    label: c4
    heading: 'A Paris education: the louis lesson'
    char_start: 546594
    char_end: 547505
    start_quote: No doubt, gold and gold; gold is everything, and all the
    end_quote: that it is the louis in it that gives me all this assurance.
    why: A vivid, concrete image of education as instruction in the sacred value of money in a corrupt
      society.
  - id: morley-diderot-v2#u25-c5
    label: c5
    heading: Appetite, the epicycle, and the postures of need
    char_start: 559128
    char_end: 560514
    start_quote: She makes mighty blunders. For my part, I do not look down
    end_quote: taking and executing artificial postures.
    why: He's refusal of the system-builder's vantage point and his grounding of the 'pantomime' in appetite
      and want.
  - id: morley-diderot-v2#u25-c6
    label: c6
    heading: The universal pantomime of dependence
    char_start: 562673
    char_end: 563483
    start_quote: The sovereign? There is something to be said on that.
    end_quote: is only the whole huge bustle of the earth
    why: I's own generalisation that all ranks, from king to abbe, perform the beggar's pantomime before
      someone, turning He's cynicism into a social analysis.
