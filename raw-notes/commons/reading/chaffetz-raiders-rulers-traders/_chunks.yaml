# Curated chunk sidecar for source `chaffetz-raiders-rulers-traders`
# (Raiders, Rulers, and Traders: The Horse and the Rise of Empires, David Chaffetz,
# W. W. Norton, 2024).
#
# license_class: private (in-copyright 2024 Norton edition) -> verbatim quote text is
# REDACTED from this committed copy per CURATOR.md sec.5 / INGEST-LOCAL.md sec.14.
# start_quote/end_quote are deliberately absent; what remains is text-free provenance:
# chunk id, label, heading, resolved character span into source.txt, and why the passage
# is load-bearing. The full-verbatim sidecars live only in the gated ingest bucket and the
# personal lake -- never in this repo.
#
# Spans are character offsets into the extraction pinned by MANIFEST.json
# sha256 11b24a02eda693dc5d8f56d7f55248e18a65607ec0c54d06576d8d732517cd54
# (632074 chars; inline photo captions and footnote paragraphs removed before offsets were
# resolved). Per-chunk spans were resolved by locating each start_quote/end_quote within
# its unit's span; all 81 chunks resolved to a single unambiguous span.
# Chunk ids match each reading note's `cites:` field.
source: chaffetz-raiders-rulers-traders
units:
- nn: 1
  unit_id: prologue
  note_id: chaffetz-raiders-rulers-traders-prologue
  span: 10:17388
  chunks:
  - id: chaffetz-raiders-rulers-traders#u01-c1
    label: c1
    heading: 'Thesis: domestication and the origin of horse culture'
    span: 2772:3479
    why: States the book's governing claim and traces the domestication-to-riding arc that the rest of
      the book expands on.
  - id: chaffetz-raiders-rulers-traders#u01-c2
    label: c2
    heading: Riding as a strategic asset, the petroleum analogy
    span: 3481:4646
    why: The central analogy (horse power as pre-modern petroleum) that frames the book's causal argument
      about steppe dominance.
  - id: chaffetz-raiders-rulers-traders#u01-c3
    label: c3
    heading: Western Europe as the negative case
    span: 8240:9118
    why: Establishes the comparative method by which the book isolates what was distinctive about steppe
      horse ecology.
  - id: chaffetz-raiders-rulers-traders#u01-c4
    label: c4
    heading: Ma Yuan and Firuz Jang on horses and sovereignty
    span: 11475:12108
    why: Two primary-source quotations, centuries and continents apart, used as direct evidence that the
      horse's political centrality was widely and explicitly understood.
  - id: chaffetz-raiders-rulers-traders#u01-c5
    label: c5
    heading: 'Closing chain of causation: mare''s milk to empire'
    span: 16741:17297
    why: Compresses the book's entire causal chain into one paragraph and ends on the contingency that
      domestication almost never happened.
- nn: 2
  unit_id: ch01-domesticated-for-milk
  note_id: chaffetz-raiders-rulers-traders-ch01-domesticated-for-milk
  span: 17388:62918
  chunks:
  - id: chaffetz-raiders-rulers-traders#u02-c1
    label: c1
    heading: The Przewalski experiment and skin-deep domestication
    span: 25378:26307
    why: States directly, and demonstrates with a modern experiment, the chapter's central claim that
      horse domestication is uniquely superficial and reversible compared to other livestock.
  - id: chaffetz-raiders-rulers-traders#u02-c2
    label: c2
    heading: Mare's milk as staple, not supplement
    span: 27175:28445
    why: Identifies milking, not meat or riding, as the decisive escalation in human dependence on horses,
      with the nutritional and cultural evidence supporting the claim.
  - id: chaffetz-raiders-rulers-traders#u02-c3
    label: c3
    heading: Riding as violent, involuntary intrusion
    span: 39403:40302
    why: Conveys the physical and emotional violence of early riding, framing it as an even greater imposition
      on the horse than milking.
  - id: chaffetz-raiders-rulers-traders#u02-c4
    label: c4
    heading: Herders driven from farmers into the deep steppe
    span: 35742:36886
    why: Marks the origin of the enduring steppe-versus-settled divide that structures the rest of the
      book, as expanding herds pushed pastoralists away from cultivated land.
  - id: chaffetz-raiders-rulers-traders#u02-c5
    label: c5
    heading: The steppe as an inland sea of grass
    span: 53003:54014
    why: The chapter's key geographic framing device, explaining how the steppe's sheer scale shaped the
      divergent histories of the civilizations around it.
  - id: chaffetz-raiders-rulers-traders#u02-c6
    label: c6
    heading: 'Horses in death: ovoo, vaults, and secret graves'
    span: 59548:60362
    why: Shows how completely steppe funerary practice mirrored the living human-horse bond, culminating
      in the era's most prestigious burials.
- nn: 3
  unit_id: ch02-horses-for-heroes
  note_id: chaffetz-raiders-rulers-traders-ch02-horses-for-heroes
  span: 62918:113881
  chunks:
  - id: chaffetz-raiders-rulers-traders#u03-c1
    label: c1
    heading: 'The vizier''s advice: horse riding beneath a king'
    span: 62919:63594
    why: Establishes the chapter's starting condition -- horse riding as low-status and unremarkable --
      against which the entire rise to military supremacy is measured.
  - id: chaffetz-raiders-rulers-traders#u03-c2
    label: c2
    heading: 'Harnessing the horse: an act of aggression'
    span: 67826:68500
    why: Captures the violent, traumatic first moment of putting horses in harness and how herd sociality,
      not just coercion, made chariot-driving possible.
  - id: chaffetz-raiders-rulers-traders#u03-c3
    label: c3
    heading: Sintashta funerary chariot races and the Rig Veda
    span: 76208:76885
    why: The key passage linking Sintashta archaeology to Vedic scripture, the book's evidentiary basis
      for reconstructing the earliest chariot-driving culture.
  - id: chaffetz-raiders-rulers-traders#u03-c4
    label: c4
    heading: The composite bow as weapon of mass destruction
    span: 102554:103630
    why: States the chapter's strongest military-technology claim and backs it with forensic trauma evidence
      from steppe burials.
  - id: chaffetz-raiders-rulers-traders#u03-c5
    label: c5
    heading: Scythian self-naming as 'shooters'
    span: 103632:104929
    why: Shows mounted archery becoming a self-identification (Scudra/Saka/Scythian) that later diffused
      across the steppe to the Huns, Turks, and Mongols.
  - id: chaffetz-raiders-rulers-traders#u03-c6
    label: c6
    heading: Cavalry flips the steppe-settled power equilibrium
    span: 113177:113789
    why: The chapter's thesis statement, directly setting up the following chapter on imperial horse mobilization.
- nn: 4
  unit_id: ch03-engines-of-empire
  note_id: chaffetz-raiders-rulers-traders-ch03-engines-of-empire
  span: 113881:161062
  chunks:
  - id: chaffetz-raiders-rulers-traders#u04-c1
    label: c1
    heading: The Assyrian cavalry dependency template
    span: 114823:115534
    why: 'States the chapter''s core structural pattern: settled empires borrowing cavalry power from
      frontier horse breeders, a dependency that repeats across Assyria, Persia, India, and China.'
  - id: chaffetz-raiders-rulers-traders#u04-c2
    label: c2
    heading: Persian self-sufficiency as ideological imperative
    span: 118622:119872
    why: Shows Persia converting the lesson of Assyrian and Median collapse into a doctrine of self-sufficient,
      state-controlled horse breeding backed by cosmic dualism.
  - id: chaffetz-raiders-rulers-traders#u04-c3
    label: c3
    heading: 'Scythian breeding strategy: quantity over quality'
    span: 134247:135309
    why: Lays out the steppe's alternative breeding logic, the counterpart to Persian stud-farm investment,
      framing the chapter's central Persian-Scythian 'arms race.'
  - id: chaffetz-raiders-rulers-traders#u04-c4
    label: c4
    heading: The Scythian trooper who refuses a kingdom
    span: 128480:129061
    why: Dramatizes steppe independence and incorruptibility even under direct royal enticement, foreshadowing
      Cyrus's death at Scythian hands.
  - id: chaffetz-raiders-rulers-traders#u04-c5
    label: c5
    heading: Cyrus's death and the skull goblet
    span: 141114:141895
    why: The chapter's climactic proof that the steppe can be raided but not conquered, a template the
      text says recurs two thousand years later.
  - id: chaffetz-raiders-rulers-traders#u04-c6
    label: c6
    heading: The elephant's ecological logic versus the horse
    span: 147279:148552
    why: Explains the geographic/ecological basis for India's rival military technology, grounding the
      horse-versus-elephant chess metaphor in material fact.
- nn: 5
  unit_id: ch04-heavenly-horses
  note_id: chaffetz-raiders-rulers-traders-ch04-heavenly-horses
  span: 161062:216742
  chunks:
  - id: chaffetz-raiders-rulers-traders#u05-c1
    label: c1
    heading: The Dog Rong sack the Zhou capital
    span: 161062:161985
    why: 'Founding instance of the chapter''s recurring pattern: a settled power hires steppe horse power
      and cannot then control or dislodge it.'
  - id: chaffetz-raiders-rulers-traders#u05-c2
    label: c2
    heading: China's structural horse deficit (Ricci and rong ma)
    span: 176398:176996
    why: States plainly, across a thousand-year span from the Han to Matteo Ricci, that China's cavalry
      inferiority to steppe horses was chronic and structural, not incidental.
  - id: chaffetz-raiders-rulers-traders#u05-c3
    label: c3
    heading: The khans' non-accumulative gift economy
    span: 188476:189787
    why: Reframes steppe 'greed' as a coherent alternative political logic built on redistribution rather
      than accumulation, a mode of legitimacy illegible to Chinese court accounting.
  - id: chaffetz-raiders-rulers-traders#u05-c4
    label: c4
    heading: Modun's rise and the monopsony insight
    span: 191370:192282
    why: Origin of the first steppe empire, explicitly tied to Modun's recognition that China's own market-control
      mechanism could be inverted into a Hun monopoly.
  - id: chaffetz-raiders-rulers-traders#u05-c5
    label: c5
    heading: The Heavenly Horses refrain
    span: 212006:212818
    why: The chapter's title refrain in its full ceremonial context, showing how deeply horse acquisition
      was bound up with cosmological and imperial legitimacy.
  - id: chaffetz-raiders-rulers-traders#u05-c6
    label: c6
    heading: Ferghana's indirect strategic payoff
    span: 214719:215525
    why: 'The chapter''s final assessment: a militarily absurd expedition nonetheless produced durable
      diplomatic infrastructure that broke the Hun monopoly, pivoting into the next unit''s Silk Road
      theme.'
- nn: 6
  unit_id: ch05-silk-road-or-horse-road
  note_id: chaffetz-raiders-rulers-traders-ch05-silk-road-or-horse-road
  span: 216742:257044
  chunks:
  - id: chaffetz-raiders-rulers-traders#u06-c1
    label: c1
    heading: The Hun Letter and the Yuezhi's Flight
    span: 217537:217874
    why: The chanyu's own boastful letter and its grisly aftermath establish the brutal stakes of horse-monopoly
      rivalry that set the Yuezhi's flight and eventual rise in motion.
  - id: chaffetz-raiders-rulers-traders#u06-c2
    label: c2
    heading: 'The Kushan Gambit: Federating the Horse Trade'
    span: 221261:221905
    why: States the precise strategic calculation by which a defeated refugee people's leader converts
      fragmented tribes into an empire, reusing the Huns' own monopoly playbook.
  - id: chaffetz-raiders-rulers-traders#u06-c3
    label: c3
    heading: 'Breeding the Modern Horse: Color, Beauty, and Genetics'
    span: 227078:228599
    why: Grounds the chapter's claim that modern horse breeds and equine beauty standards emerged from
      Kushan-era market logic, tying commercial branding directly to a genetic signature still detectable
      today.
  - id: chaffetz-raiders-rulers-traders#u06-c4
    label: c4
    heading: The Caravan as a Moving Army
    span: 233690:234563
    why: Makes explicit the chapter's argument that caravans functioned as quasi-sovereign, self-armed
      institutions whose military discipline had lasting political consequences.
  - id: chaffetz-raiders-rulers-traders#u06-c5
    label: c5
    heading: Horse Fairs Remake India's Sacred Geography
    span: 242408:243347
    why: Concrete evidence for the unusual causal claim that commercial horse infrastructure generated
      durable religious institutions like the Kumbh Mela.
  - id: chaffetz-raiders-rulers-traders#u06-c6
    label: c6
    heading: Silk Road or Horse Road
    span: 246672:247398
    why: This is the chapter's thesis statement, directly renaming the Silk Road as the Horse Road and
      reframing the entire unit's preceding narrative as evidence.
- nn: 7
  unit_id: ch06-equine-mania
  note_id: chaffetz-raiders-rulers-traders-ch06-equine-mania
  span: 257044:306781
  chunks:
  - id: chaffetz-raiders-rulers-traders#u07-c1
    label: c1
    heading: Horses as weapons of the state
    span: 259328:260016
    why: States the chapter's core doctrine that Tang cavalry was a deliberate, unprecedented act of state
      capacity-building on an industrial scale.
  - id: chaffetz-raiders-rulers-traders#u07-c2
    label: c2
    heading: The stud-farm bureaucracy
    span: 262853:263664
    why: Shows the concrete administrative machinery -- quotas, registration, branding, penalties -- that
      made the Tang cavalry a legible state resource.
  - id: chaffetz-raiders-rulers-traders#u07-c3
    label: c3
    heading: Soft power's limit
    span: 302974:303836
    why: The chapter's explicit thesis that aestheticizing the horse as soft power could not substitute
      for hard military power when crisis came.
  - id: chaffetz-raiders-rulers-traders#u07-c4
    label: c4
    heading: The horse as the soul
    span: 291164:292107
    why: Captures the chapter's central spiritual claim, via Milarepa's Buddhist metaphor, that mastering
      a horse mirrors mastering the anxious self.
  - id: chaffetz-raiders-rulers-traders#u07-c5
    label: c5
    heading: Steppe riding as ecological logic
    span: 281603:282882
    why: Grounds the comparative-riding-schools theme in the hard economic and ecological precarity that
      shaped steppe horsemanship.
  - id: chaffetz-raiders-rulers-traders#u07-c6
    label: c6
    heading: The An Lushan collapse
    span: 304727:306149
    why: 'Narrates the chapter''s turning point: the rebellion and bureaucratic bankruptcy that destroyed
      the stud-farm system and the dynasty together.'
- nn: 8
  unit_id: ch07-hunting-for-supremacy
  note_id: chaffetz-raiders-rulers-traders-ch07-hunting-for-supremacy
  span: 306781:363170
  chunks:
  - id: chaffetz-raiders-rulers-traders#u08-c1
    label: c1
    heading: Hunting as the steppe's deepest bond
    span: 307523:308667
    why: Establishes the chapter's foundational claim that shared danger in the hunt forged the horse-rider
      and horseman-horseman bonds that later scale into political loyalty.
  - id: chaffetz-raiders-rulers-traders#u08-c2
    label: c2
    heading: 'The nerge: encirclement as discipline'
    span: 318927:321358
    why: The chapter's technical centerpiece, showing the exact mechanics of the encirclement tactic and
      its direct application to routing enemy armies.
  - id: chaffetz-raiders-rulers-traders#u08-c3
    label: c3
    heading: War as hunting's dual use
    span: 322046:323132
    why: States outright the chapter's thesis, via period voices (Taizong, Farrokhi) that hunting and
      warfare shared method and purpose.
  - id: chaffetz-raiders-rulers-traders#u08-c4
    label: c4
    heading: Abaoji's hunt-born empire
    span: 317493:318389
    why: Shows the mechanism by which a customary steppe hunt-celebration is converted directly into imperial
      founding, the chapter's template case.
  - id: chaffetz-raiders-rulers-traders#u08-c5
    label: c5
    heading: The Great Wall against the forgotten Wall of Gorgan
    span: 331998:332699
    why: Frames the chapter's comparative argument about why China's frontier held while Iran's did not,
      setting up the divergent fates of the two civilizations.
  - id: chaffetz-raiders-rulers-traders#u08-c6
    label: c6
    heading: The hunter becomes prey
    span: 362104:363041
    why: The chapter's closing synthesis and pivot, naming the structural fragility of every conquest
      regime described and setting up the Mongol conquest to follow.
- nn: 9
  unit_id: ch08-genghis-khan-empire
  note_id: chaffetz-raiders-rulers-traders-ch08-genghis-khan-empire
  span: 363170:426021
  chunks:
  - id: chaffetz-raiders-rulers-traders#u09-c1
    label: c1
    heading: The 1215 Beijing siege as a false start
    span: 363170:364196
    why: Stages the raid-and-return pattern of prior steppe invasions that the rest of the chapter argues
      Genghis Khan would decisively break from.
  - id: chaffetz-raiders-rulers-traders#u09-c2
    label: c2
    heading: '"Our geldings are fat"'
    span: 373833:374796
    why: The chapter's most compressed statement of its ecological-materialist thesis about horse surplus
      driving conquest.
  - id: chaffetz-raiders-rulers-traders#u09-c3
    label: c3
    heading: Resettlement and pasture control as an apparatus of loyalty
    span: 392066:392881
    why: 'Shows Genghis Khan''s core statecraft innovation: rendering a dispersed, kin-based steppe population
      legible and controllable via forced resettlement and pasture allocation.'
  - id: chaffetz-raiders-rulers-traders#u09-c4
    label: c4
    heading: An empire dreamed by horses
    span: 394479:395352
    why: Sets up the chapter's framing device that imperial ambition and ecological carrying capacity
      for horses were inseparable, later confirmed by Hülegü's defeat for lack of pasture in Syria.
  - id: chaffetz-raiders-rulers-traders#u09-c5
    label: c5
    heading: Yuan China's horse power drains away
    span: 413455:415516
    why: Traces the decay sequence by which Mongol rule in China lost the very horse power that had built
      it, once its rulers stopped living as pastoralists.
  - id: chaffetz-raiders-rulers-traders#u09-c6
    label: c6
    heading: The Golden Horde's institutional afterlife in Moscow
    span: 423898:425211
    why: Shows Mongol administrative infrastructure (yam, tamgha, denga) surviving as loanwords and institutions
      long after the Golden Horde's political power faded.
- nn: 10
  unit_id: ch09-riding-the-whirlwind
  note_id: chaffetz-raiders-rulers-traders-ch09-riding-the-whirlwind
  span: 426021:490710
  chunks:
  - id: chaffetz-raiders-rulers-traders#u10-c1
    label: c1
    heading: The rider who announces Timur's death
    span: 447524:448316
    why: Dramatizes how instantly a conquest-empire's momentum stops once its irreplaceable rider does,
      aborting the planned invasion of Ming China.
  - id: chaffetz-raiders-rulers-traders#u10-c2
    label: c2
    heading: Horse power compels war, not just enables it
    span: 440756:441993
    why: 'States the chapter''s core economic argument: professionalized, fodder-fed cavalry became too
      expensive not to keep conquering.'
  - id: chaffetz-raiders-rulers-traders#u10-c3
    label: c3
    heading: A land of no good horses
    span: 452025:452809
    why: Crystallizes the paradox that India's horse poverty was simultaneously its vulnerability and
      the reason it could be conquered at all.
  - id: chaffetz-raiders-rulers-traders#u10-c4
    label: c4
    heading: Akbar's supernatural means of greatness
    span: 457739:458200
    why: Abul Fazl's formulation is the chapter's clearest statement of horsemanship as literal mechanism
      and master metaphor of Mughal rule.
  - id: chaffetz-raiders-rulers-traders#u10-c5
    label: c5
    heading: Whoever holds a Persian horse governs the Deccan
    span: 479594:480696
    why: Shows the horse trade itself functioning as independent geopolitical leverage, wielded by a maritime
      outsider rather than a steppe power.
  - id: chaffetz-raiders-rulers-traders#u10-c6
    label: c6
    heading: Nader Shah rides the whirlwind
    span: 487823:488954
    why: 'Delivers the chapter''s summary judgment on the whole cycle: even history''s largest indemnity
      could not outrun the cost of maintaining conquest cavalry.'
- nn: 11
  unit_id: ch10-empires-strike-back
  note_id: chaffetz-raiders-rulers-traders-ch10-empires-strike-back
  span: 490710:539548
  chunks:
  - id: chaffetz-raiders-rulers-traders#u11-c1
    label: c1
    heading: The Oirat genocide
    span: 508845:509495
    why: States the campaign's outcome and the book's explicit genocide framing, the chapter's most consequential
      and morally weighted claim.
  - id: chaffetz-raiders-rulers-traders#u11-c2
    label: c2
    heading: Qing famine-relief bureaucracy
    span: 494748:495136
    why: Shows the administrative legibility and resource capacity that let the Qing succeed where earlier
      dynasties failed to hold steppe loyalty.
  - id: chaffetz-raiders-rulers-traders#u11-c3
    label: c3
    heading: The contingent loyalty of horse-breeders
    span: 531313:531791
    why: The chapter's connective thesis explaining why no steppe polity could match a patient, resource-rich
      rival over the long run.
  - id: chaffetz-raiders-rulers-traders#u11-c4
    label: c4
    heading: The Kalmyk flight and the end of steppe khanates
    span: 536251:536889
    why: Marks, in the author's own words, the historical closing of independent steppe political agency.
  - id: chaffetz-raiders-rulers-traders#u11-c5
    label: c5
    heading: Qianlong rebuffs George III
    span: 513792:514733
    why: Signals the pivot from horse power to maritime power as the coming axis of imperial contest,
      immediately after the chapter's culminating land victory.
- nn: 12
  unit_id: ch11-the-great-game
  note_id: chaffetz-raiders-rulers-traders-ch11-the-great-game
  span: 539548:582409
  chunks:
  - id: chaffetz-raiders-rulers-traders#u12-c1
    label: c1
    heading: 'Panipat: the chase that decided a maharaja''s fate'
    span: 540397:541557
    why: Dramatizes the book's core thesis -- that breed quality (stamina over speed) determined battlefield
      and even personal survival -- through a single vivid chase narrative.
  - id: chaffetz-raiders-rulers-traders#u12-c2
    label: c2
    heading: Naming the Great Game
    span: 552580:553705
    why: Establishes the chapter's organizing concept and its origin in early-1800s Russian ambitions
      toward India, anchoring the term itself.
  - id: chaffetz-raiders-rulers-traders#u12-c3
    label: c3
    heading: 'Ranjit Singh: the last state founded in the saddle'
    span: 545286:546468
    why: Ranjit Singh's own words and the jeweled-stable description crystallize the Sikh Empire as a
      consciously cavalry-identified state, explicitly framed by the author as the last of its kind in
      world history.
  - id: chaffetz-raiders-rulers-traders#u12-c4
    label: c4
    heading: 'Moorcroft''s Kabul epiphany: forage as the secret weapon'
    span: 563622:564264
    why: The chapter's explicit causal claim -- cheap natural forage, not martial superiority alone, explains
      Central Asian cavalry dominance and the Afghan victory at Panipat.
  - id: chaffetz-raiders-rulers-traders#u12-c5
    label: c5
    heading: First English description of buzkashi
    span: 565740:566121
    why: A concrete, quotable ethnographic first embedded in Moorcroft's failed procurement diary, illustrating
      how horse culture and horse trade intertwined.
  - id: chaffetz-raiders-rulers-traders#u12-c6
    label: c6
    heading: 'The Turkmen: a raiding economy built on the Akhal-Teke'
    span: 577780:578644
    why: Describes a deliberately tax-evading, capture-resistant nomadic political economy organized entirely
      around a horse breed -- the society Russia would annihilate in 1881, closing the chapter's arc.
- nn: 13
  unit_id: ch12-last-horse-powers
  note_id: chaffetz-raiders-rulers-traders-ch12-last-horse-powers
  span: 582409:619362
  chunks:
  - id: chaffetz-raiders-rulers-traders#u13-c1
    label: c1
    heading: Pacification kills the breed it conquered
    span: 583466:584101
    why: 'States the structural paradox driving the whole chapter: conquest that pacifies a raiding people
      removes the very economic rationale for the superior warhorse the empire wanted to capture.'
  - id: chaffetz-raiders-rulers-traders#u13-c2
    label: c2
    heading: Kipling's Mahbub Ali on horses and their country
    span: 598180:598516
    why: The chapter's own chosen epigraph for why colonial standardization of horse breeding (and colonialism
      itself) fails against local ecological and cultural specificity.
  - id: chaffetz-raiders-rulers-traders#u13-c3
    label: c3
    heading: The 1911 Delhi durbar as imperial theater
    span: 600683:601443
    why: Captures the peak of imperial cavalry pageantry staged as continuity with Mughal legitimacy,
      precisely as the strategic logic behind it was quietly dissolving.
  - id: chaffetz-raiders-rulers-traders#u13-c4
    label: c4
    heading: Lawrence pivots from cavalry to airpower
    span: 609875:610767
    why: Identifies the real hinge of the Palestine campaign — not the last cavalry charge at Megiddo
      but Lawrence's fusion of cavalry with airpower into what became Blitzkrieg.
  - id: chaffetz-raiders-rulers-traders#u13-c5
    label: c5
    heading: Petroleum replaces the horse as strategic resource
    span: 617166:618183
    why: 'States the chapter''s central world-historical claim in explicit terms: the strategic resource
      base of empire shifts from grasslands and horses to petroleum, discovered ironically beneath the
      same steppe lands.'
  - id: chaffetz-raiders-rulers-traders#u13-c6
    label: c6
    heading: The dissolution of the horse's world order
    span: 618185:619295
    why: The chapter's closing inventory of what disappears with the horse — Central Asia's prosperity,
      multiple horse aristocracies — framing the scale of the world-machine transition just completed.
