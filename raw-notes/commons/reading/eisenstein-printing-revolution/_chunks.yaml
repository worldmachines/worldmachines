source: eisenstein-printing-revolution
units:
- nn: 1
  unit_id: introduction
  note_id: eisenstein-printing-revolution-introduction
  span: 0:14237
  chunks:
  - id: eisenstein-printing-revolution#u01-c1
    heading: 'Bridenbaugh''s lament diagnosed as symptom'
    span: 544:980
    why: 'Her framing sentence turns Bridenbaugh''s alarm from a diagnosis into a symptom, setting up her own counter-explanation.'
  - id: eisenstein-printing-revolution#u01-c2
    heading: 'Recall, not amnesia: overload as the real threat'
    span: 2068:2613
    why: 'States her own thesis in direct opposition to Bridenbaugh''s: the profession''s crisis is data volume, not forgetting.'
  - id: eisenstein-printing-revolution#u01-c3
    heading: 'McLuhan as a second symptom, and the gap in the literature'
    span: 3282:4471
    why: 'Identifies the exact evidentiary gap that licenses her decade-long study, in her own words.'
  - id: eisenstein-printing-revolution#u01-c4
    heading: 'Scope: a literate-to-literate shift, not oral to literate'
    span: 10025:10339
    why: 'Explicitly bounds the book''s claims to elite Latin literate culture, distinguishing her project from history-from-below.'
  - id: eisenstein-printing-revolution#u01-c5
    heading: 'Printing as an agent, not the agent, of change'
    span: 11544:13291
    why: 'The book''s central methodological disclaimer against monocausal or technologically determinist readings of her argument.'
- nn: 2
  unit_id: ch01-unacknowledged-revolution
  note_id: eisenstein-printing-revolution-ch01-unacknowledged-revolution
  span: 14237:33642
  chunks:
  - id: eisenstein-printing-revolution#u02-c1
    heading: 'Historians'' silence and Clio at the workshop door'
    span: 14332:15222
    why: 'States the book''s founding paradox: historians depend on print yet have not examined what its arrival changed.'
  - id: eisenstein-printing-revolution#u02-c2
    heading: 'Effects aroused little controversy because none were stated'
    span: 17835:18150
    why: 'Sharpest one-line statement of the gap between claimed significance and actual explicit argument in the literature.'
  - id: eisenstein-printing-revolution#u02-c3
    heading: 'The veil of print'
    span: 21166:21757
    why: 'Names the core methodological obstacle: reconstructing scribal culture requires the print-derived tools that obscure it.'
  - id: eisenstein-printing-revolution#u02-c4
    heading: 'Quantifying incunabula versus scribal output'
    span: 26651:27380
    why: 'Shows concretely how print''s uniformity makes it measurable where scribal culture defeats quantification entirely.'
  - id: eisenstein-printing-revolution#u02-c5
    heading: 'Cumulative and irreversible: answering the stationers''-shop critic'
    span: 33124:33640
    why: 'Her direct rebuttal establishing the criterion, cumulative and irreversible change, that makes the print revolution distinct from the earlier stationers'' shift.'
  - id: eisenstein-printing-revolution#u02-c6
    heading: 'Trithemius: praising scribes in print'
    span: 31171:32465
    why: 'Vivid, load-bearing anecdote showing script and print coexisting in outright contradiction rather than one cleanly replacing the other.'
- nn: 3
  unit_id: ch02-defining-initial-shift-1
  note_id: eisenstein-printing-revolution-ch02-defining-initial-shift-1
  span: 33642:62868
  chunks:
  - id: eisenstein-printing-revolution#u03-c1
    heading: 'Defining "the advent of printing"'
    span: 36442:37188
    why: 'This is Eisenstein''s own methodological definition of the shift she studies, fixing the chapter''s point of departure and unit of analysis.'
  - id: eisenstein-printing-revolution#u03-c2
    heading: 'Revolutionary, not evolutionary, output'
    span: 37190:37844
    why: 'States the chapter''s core quantitative claim and the revolutionary-vs-evolutionary framing that organizes the rest of the argument.'
  - id: eisenstein-printing-revolution#u03-c3
    heading: 'The Ripoli Press / Ficino cost comparison'
    span: 39161:39602
    why: 'Concrete economic evidence Eisenstein uses to argue print did not merely intensify pre-existing copying but changed its kind.'
  - id: eisenstein-printing-revolution#u03-c4
    heading: 'Continuity in product, radical change in process'
    span: 48429:49250
    why: 'States the paradox that lets Eisenstein reconcile manuscript-like appearance with a revolutionary claim about production.'
  - id: eisenstein-printing-revolution#u03-c5
    heading: 'The master printer bridges town and gown'
    span: 56588:57399
    why: 'Names the printer''s workshop as a genuinely new institution, the chapter''s second defining feature alongside output.'
  - id: eisenstein-printing-revolution#u03-c6
    heading: 'Printers as self-serving publicists'
    span: 60976:61889
    why: 'Documents the reversal of scribal colophon convention and the birth of a publicity apparatus around printers and authors alike.'
- nn: 4
  unit_id: ch02-defining-initial-shift-2
  note_id: eisenstein-printing-revolution-ch02-defining-initial-shift-2
  span: 62868:82183
  chunks:
  - id: eisenstein-printing-revolution#u04-c1
    heading: 'Cipolla on the impossibility of precise literacy rates'
    span: 63252:64108
    why: 'Eisenstein endorses this admission of uncertainty as grounds for redirecting attention from literacy-rate estimates to the already-literate reading public.'
  - id: eisenstein-printing-revolution#u04-c2
    heading: 'The reading public resists a class label'
    span: 64959:66572
    why: 'This is Eisenstein''s own argument that print''s early audience cannot be mapped onto a rich/poor or high/low social division.'
  - id: eisenstein-printing-revolution#u04-c3
    heading: 'Titles mislead about actual readership: the Biblia pauperum case'
    span: 69001:69952
    why: 'Her clearest case that a book''s title or declared genre is not trustworthy evidence of who actually read it.'
  - id: eisenstein-printing-revolution#u04-c4
    heading: 'Learning by reading: Tycho Brahe reaches beyond his tutors'
    span: 72672:73880
    why: 'Shows print enabling self-directed learning that bypassed apprenticeship and mnemonic training, epitomized by Tycho Brahe.'
  - id: eisenstein-printing-revolution#u04-c5
    heading: 'Rebutting the ''image to word'' formula via technical illustration'
    span: 78582:79319
    why: 'Her strongest counter-evidence that print increased rather than reduced reliance on images in scientific and technical fields.'
  - id: eisenstein-printing-revolution#u04-c6
    heading: 'No single formula, but something did change'
    span: 81766:82181
    why: 'Her closing methodological statement, the signature move against reductive single-formula readings of the shift from script to print.'
- nn: 5
  unit_id: ch03-s1-wide-dissemination
  note_id: eisenstein-printing-revolution-ch03-s1-wide-dissemination
  span: 82183:98827
  chunks:
  - id: eisenstein-printing-revolution#u05-c1
    heading: 'Spread versus altered intake'
    span: 84478:85710
    why: 'States the section''s thesis: dissemination altered what already-literate readers held together, not just how far texts spread to new readers.'
  - id: eisenstein-printing-revolution#u05-c2
    heading: 'Montaigne''s tower study'
    span: 86321:87253
    why: 'Her worked counter-example against historians who credit Montaigne''s sense of crisis to events rather than to sheer access to more books.'
  - id: eisenstein-printing-revolution#u05-c3
    heading: 'Combinatory activity and new systems of thought'
    span: 87255:88679
    why: 'Generalizes the mechanism by which contradiction between traditions, once texts sit side by side, drives intellectual invention.'
  - id: eisenstein-printing-revolution#u05-c4
    heading: 'The printers'' workshop as first site of interchange'
    span: 88681:89682
    why: 'Locates wide dissemination''s first, most concentrated effects inside the printer''s own workshop, explaining extramural innovation.'
  - id: eisenstein-printing-revolution#u05-c5
    heading: 'Enlightenment and mystification together'
    span: 93004:93915
    why: 'Her central caution: increased output spread confusion and occult lore as readily as accurate knowledge, refusing a clean-progress narrative.'
  - id: eisenstein-printing-revolution#u05-c6
    heading: 'Disagreeing with Sarton'
    span: 98253:98825
    why: 'Explicit disagreement with another historian, distinguishing dissemination (this section''s topic) from standardization as separate analytic categories.'
- nn: 6
  unit_id: ch03-s2-standardization
  note_id: eisenstein-printing-revolution-ch03-s2-standardization
  span: 98827:114823
  chunks:
  - id: eisenstein-printing-revolution#u06-c1
    heading: 'Errata and the “wicked” Bible'
    span: 99540:100311
    why: 'Her sharpest evidence that standardization is a genuinely new capacity, not just an illusion of scale, grounded in the errata sheet and a standardized printing error.'
  - id: eisenstein-printing-revolution#u06-c2
    heading: 'Sarton''s formula and “sufficiently uniform”'
    span: 100313:100876
    why: 'States the section''s governing standard for standardization: sufficient uniformity for scholarly cross-reference, not perfect identity.'
  - id: eisenstein-printing-revolution#u06-c3
    heading: 'Standardization breeding individualism: Montaigne'
    span: 105406:106739
    why: 'The section''s most striking and WMP-relevant claim: standardized typing of persons in print made the singular, idiosyncratic self in Montaigne''s Essays perceptible for the first time.'
  - id: eisenstein-printing-revolution#u06-c4
    heading: 'A new rhetoric for scattered readers'
    span: 106741:107895
    why: 'Extends the individualism argument into genre history: the informal essay as a technology for intimate address to a dispersed, solitary readership.'
  - id: eisenstein-printing-revolution#u06-c5
    heading: 'Repeatable images and Louis XVI at Varennes'
    span: 108270:109338
    why: 'Shows standardization operating visually and politically: printed royal portraiture, unlike coinage, made a monarch''s face public, replicable, recognizable information.'
  - id: eisenstein-printing-revolution#u06-c6
    heading: 'Esprit de système and Ortelius''s shop'
    span: 113493:114821
    why: 'Ties the printer''s compiling routines to a new systematized cognition, linking reference-guide production directly to rationalized, capitalist habits of mind.'
- nn: 7
  unit_id: ch03-s3-reorganizing-texts
  note_id: eisenstein-printing-revolution-ch03-s3-reorganizing-texts
  span: 114823:134338
  chunks:
  - id: eisenstein-printing-revolution#u07-c1
    heading: 'Editorial format reorganizes readers'' thinking'
    span: 114937:115400
    why: 'States the unit''s thesis up front, framing McLuhan''s format-shapes-thought claim as something Eisenstein will substantiate concretely.'
  - id: eisenstein-printing-revolution#u07-c2
    heading: 'Alphabetical order was rare before print'
    span: 115402:116019
    why: 'The Genoese encyclopedist''s self-congratulatory invention of alphabetizing shows how recent and non-automatic full alphabetical order was before print standardized it.'
  - id: eisenstein-printing-revolution#u07-c3
    heading: 'Organization as an end in itself: Ramist method'
    span: 127451:128042
    why: 'Shows rationalized layout becoming a marketable virtue in itself, with Ramus''s method spreading through print because it suited publishers'' incentives, not just pedagogy.'
  - id: eisenstein-printing-revolution#u07-c4
    heading: 'Restoring the Corpus Juris drains its living authority'
    span: 130203:131067
    why: 'Captures Eisenstein''s paradox that perfecting an ancient legal text''s internal coherence through print-enabled correction and indexing could hasten its irrelevance to living practice.'
  - id: eisenstein-printing-revolution#u07-c5
    heading: 'Rationalized statute books reorganize the body politic'
    span: 132350:133370
    why: 'Extends the rationalization argument beyond scholarship into English public law, where competing printers'' indexed, alphabetized abridgments gave ordinary readers their first systematic view of statute history.'
  - id: eisenstein-printing-revolution#u07-c6
    heading: 'The most consequential changes were the least conspicuous'
    span: 133372:134336
    why: 'Closes the unit by naming pagination, running heads, and title pages as the era''s real, underrated cognitive infrastructure, cashing out the opening McLuhan claim.'
- nn: 8
  unit_id: ch03-s4-data-collection
  note_id: eisenstein-printing-revolution-ch03-s4-data-collection
  span: 134338:146577
  chunks:
  - id: eisenstein-printing-revolution#u08-c1
    heading: 'Printers improving on themselves: reversing scribal drift'
    span: 134423:134842
    why: 'States the unit''s core thesis: successive print editions could reverse, not just arrest, the corruption scribal copying inevitably produced.'
  - id: eisenstein-printing-revolution#u08-c2
    heading: 'Herbals grew more distorted — until skilled oversight changed that'
    span: 135630:136764
    why: 'Eisenstein''s crucial hedge: print could accelerate corruption under bad management, and only became self-correcting under technically proficient control.'
  - id: eisenstein-printing-revolution#u08-c3
    heading: 'Ortelius''s Theatrum as a cooperative, feedback-built enterprise'
    span: 136766:137944
    why: 'Her paradigm case of the new data-collection process: soliciting and crediting reader corrections across dozens of editions.'
  - id: eisenstein-printing-revolution#u08-c4
    heading: 'An open-ended sequence, and the word “feedback”'
    span: 140182:141398
    why: 'Names the structural difference from scribal culture directly, contrasting the unlimited print sequence with the finite ancient libraries that could be destroyed outright.'
  - id: eisenstein-printing-revolution#u08-c5
    heading: 'Mixed motives, not new virtue, explain honest citation'
    span: 141400:142837
    why: 'Shows Eisenstein resisting a moralized history of print, insisting the incentive structure of the medium — not improved character — explains the new practice of crediting sources.'
  - id: eisenstein-printing-revolution#u08-c6
    heading: 'Against Kuhn: the data available to all readers, not just astronomers'
    span: 145064:146404
    why: 'The unit''s clearest instance of Eisenstein arguing with a named historian, extending Kuhn''s astronomy-specific claim into her general thesis about fixity.'
- nn: 9
  unit_id: ch03-s5-preservative-powers
  note_id: eisenstein-printing-revolution-ch03-s5-preservative-powers
  span: 146577:171557
  chunks:
  - id: eisenstein-printing-revolution#u09-c1
    heading: 'Preservation as print''s master feature'
    span: 146653:147572
    why: 'Opens the chapter''s argument that among all of print''s effects, preservation is the master feature, by cataloguing exactly how scribal transmission failed to preserve texts.'
  - id: eisenstein-printing-revolution#u09-c2
    heading: 'Reversing the scribal durability rule'
    span: 148125:148602
    why: 'States and then reverses the scribal-era durability rule, showing print''s advantage is multiplied quantity, not a tougher writing material.'
  - id: eisenstein-printing-revolution#u09-c3
    heading: 'Jefferson on preservation through publicity'
    span: 150489:151888
    why: 'Jefferson''s own testimony is Eisenstein''s prime evidence that preservation-through-publicity replaced preservation-through-lock-and-key.'
  - id: eisenstein-printing-revolution#u09-c4
    heading: 'Print fixing vernaculars into national languages'
    span: 154641:155731
    why: 'Steinberg''s paraphrase, endorsed by Eisenstein, is the unit''s clearest causal claim that print fixed which vernaculars survived into national literary languages.'
  - id: eisenstein-printing-revolution#u09-c5
    heading: 'Fixity and the invention of the modern author'
    span: 159556:160376
    why: 'States the mechanism by which fixity produces modern authorship, priority disputes, and copyright out of a medieval scheme with no category for pure invention.'
  - id: eisenstein-printing-revolution#u09-c6
    heading: 'Permanence as the precondition for progress'
    span: 167030:168047
    why: 'The chapter''s thesis statement: permanent, cumulative record-keeping, not literacy or output alone, is the precondition for an idea of progress.'
- nn: 10
  unit_id: ch03-s6-amplification-reinforcement
  note_id: eisenstein-printing-revolution-ch03-s6-amplification-reinforcement
  span: 171557:176788
  chunks:
  - id: eisenstein-printing-revolution#u10-c1
    heading: 'Archetypes converted into stereotypes'
    span: 171655:172080
    why: 'States the unit''s governing reframe: print culture converted scribal archetypes into typographically-named stereotypes and clichés.'
  - id: eisenstein-printing-revolution#u10-c2
    heading: 'The Thermopylae feedback effect'
    span: 172848:173506
    why: 'Gives the unit''s core analytic mechanism: repeated passages strike readers with disproportionate, self-reinforcing impact compared to novel ones.'
  - id: eisenstein-printing-revolution#u10-c3
    heading: 'Tacitus''s Germania as a stereotype engine'
    span: 173710:173997
    why: 'Concrete case of a single scribal source amplified into a stereotype shared, and diverged, across several proto-national contexts.'
  - id: eisenstein-printing-revolution#u10-c4
    heading: 'Amplification channeled by linguistic frontiers'
    span: 173999:174320
    why: 'Names the section''s titular claim: reinforcement was not uniform but structured by fixed linguistic frontiers, producing divergent national memories.'
  - id: eisenstein-printing-revolution#u10-c5
    heading: 'Confessional frontiers widen the Protestant-Catholic divide'
    span: 175983:176459
    why: 'Extends the amplification argument from linguistic to religious frontiers, linking differential Bible-reading frequency to divergent church-state outcomes.'
- nn: 11
  unit_id: ch04-s1-reading-public
  note_id: eisenstein-printing-revolution-ch04-s1-reading-public
  span: 176788:189283
  chunks:
  - id: eisenstein-printing-revolution#u11-c1
    heading: 'Correcting McLuhan''s typographical man'
    span: 176869:177699
    why: 'States Eisenstein''s governing method for the chapter: credit McLuhan''s insight while replacing his abstraction with concrete, group-specific history.'
  - id: eisenstein-printing-revolution#u11-c2
    heading: 'Saenger and the institutionalization of silent reading'
    span: 177762:178679
    why: 'Precisely delimits print''s role: not the origin of silent reading but the mechanism that made a pre-existing scribal-era habit pervasive.'
  - id: eisenstein-printing-revolution#u11-c3
    heading: 'Rural villagers and the transformed hearing public'
    span: 179970:180794
    why: 'Shows print reshaping even those who remained a hearing public, as the literate villager reading ballad-sheets aloud replaces the oral storyteller centuries before mass literacy.'
  - id: eisenstein-printing-revolution#u11-c4
    heading: 'One reading public, opposite effects'
    span: 180938:181672
    why: 'Her clearest statement that identical print innovations bifurcated outcomes within one public: Bible printing feeding both modernism and fundamentalism, silent devotion equally available to piety and to salacious reading.'
  - id: eisenstein-printing-revolution#u11-c5
    heading: 'Malesherbes, Ong, and the dispersed public'
    span: 183354:184098
    why: 'Names the mechanism behind print-driven individualism: identical duplicated messages forge an impersonal link among strangers rather than requiring physical assembly.'
  - id: eisenstein-printing-revolution#u11-c6
    heading: 'Print''s duplicative power and provincial uniformity'
    span: 188222:188862
    why: 'Shows print as legibility infrastructure cutting both ways: extending bureaucratic reach for rulers while standardizing provincial grievances into model petitions for their opponents.'
- nn: 12
  unit_id: ch04-s2-men-of-letters
  note_id: eisenstein-printing-revolution-ch04-s2-men-of-letters
  span: 189283:210267
  chunks:
  - id: eisenstein-printing-revolution#u12-c1
    heading: 'A neglected social class'
    span: 189582:190026
    why: 'States Eisenstein''s opening claim that print produced a distinct, historically neglected social class of men of letters, the frame the rest of the unit fills in.'
  - id: eisenstein-printing-revolution#u12-c2
    heading: 'The Republic of Letters behind its fictive geography'
    span: 192619:194018
    why: 'Shows her method of grounding the Republic of Letters'' self-mythologizing pseudonymity and placelessness in concrete institutional and economic reality.'
  - id: eisenstein-printing-revolution#u12-c3
    heading: 'Disagreeing with Mannheim on the intelligentsia'
    span: 197381:198170
    why: 'A clear instance of Eisenstein quoting a historian in order to argue with him: she preserves Mannheim''s claim intact before reversing it with evidence about printers'' workshops.'
  - id: eisenstein-printing-revolution#u12-c4
    heading: 'Divine art or mercenary métier'
    span: 201120:202020
    why: 'Names the structural status ambivalence of the commercialized author that Eisenstein argues predates, rather than results from, industrial society.'
  - id: eisenstein-printing-revolution#u12-c5
    heading: 'The alienated professional author'
    span: 204659:205507
    why: 'The essay''s clearest portrait of the isolated, market-dependent author figure, load-bearing for her later claim that print culture produced this figure rather than industrialization alone.'
  - id: eisenstein-printing-revolution#u12-c6
    heading: 'Print''s cumulative, unfinished effects'
    span: 208343:208873
    why: 'Eisenstein''s own closing methodological thesis, rejecting claims that print culture has ended and asserting continuous cumulative change since the fifteenth century.'
- nn: 13
  unit_id: ch05-permanent-renaissance-1
  note_id: eisenstein-printing-revolution-ch05-permanent-renaissance-1
  span: 210267:239662
  chunks:
  - id: eisenstein-printing-revolution#u13-c1
    heading: 'Butler''s paradox: technology and culture that merely coincide'
    span: 210387:210837
    why: 'States the puzzle the whole chapter exists to answer: script-to-print and medieval-to-modern share a century but resist any demonstrated connection.'
  - id: eisenstein-printing-revolution#u13-c2
    heading: 'Her pivot: put printing first, bypass the periodization debate'
    span: 216874:217464
    why: 'Her explicit methodological move: instead of adjudicating unoperationalizable labels like ‘medieval’/‘modern,’ anchor the inquiry in printing’s advent, a dateable, traceable event.'
  - id: eisenstein-printing-revolution#u13-c3
    heading: 'Why the revolution hides: reproducing the old, not just adding the new'
    span: 220998:222222
    why: 'Explains the paradox of an admittedly radical transformation invisible to periodization schemes: print multiplied old texts as much as new ones, so counting ‘new titles’ cannot detect it.'
  - id: eisenstein-printing-revolution#u13-c4
    heading: 'Panofsky''s permanent Renaissance, reattributed to print'
    span: 225028:225813
    why: 'Names the chapter''s target: Panofsky''s permanence claim is treated as an inherent Renaissance virtue when it should be traced to typographical fixity instead.'
  - id: eisenstein-printing-revolution#u13-c5
    heading: 'A rationalized view of antiquity required a century of print, not Petrarch''s lifetime'
    span: 230257:231126
    why: 'Her sharpest evidentiary rebuttal: the fixed historical distance Panofsky credits to quattrocento humanism actually needed a century of printed maps and chronologies to sort scribal disorder into a shared reference frame.'
  - id: eisenstein-printing-revolution#u13-c6
    heading: 'Permanence belongs to type, not to one cultural revival'
    span: 238789:239660
    why: 'Closing rebuttal: Gothic type proved just as durable as Roman/Italic, so what endures is a property of print technology itself, not evidence of the Italian Renaissance''s cultural superiority.'
- nn: 14
  unit_id: ch05-permanent-renaissance-2
  note_id: eisenstein-printing-revolution-ch05-permanent-renaissance-2
  span: 239662:263161
  chunks:
  - id: eisenstein-printing-revolution#u14-c1
    heading: 'The Constantinople myth debunked'
    span: 242167:242957
    why: 'States in her own voice the reversal of historical pattern that anchors the chapter''s cumulative-recovery argument.'
  - id: eisenstein-printing-revolution#u14-c2
    heading: 'Fixity enables cumulative scholarship'
    span: 244299:244683
    why: 'Her clearest statement that print''s permanent registration, not humanist ethos, converts intermittent discovery into cumulative change.'
  - id: eisenstein-printing-revolution#u14-c3
    heading: 'Burckhardt''s veil passage (the view under contest)'
    span: 247383:248100
    why: 'The block quotation she is arguing with, attributing the rise of the individual to Italian politics rather than print.'
  - id: eisenstein-printing-revolution#u14-c4
    heading: 'Eisenstein''s counter-thesis'
    span: 248871:249588
    why: 'Her own framing sentences relocate the cause of the consciousness shift from Italian politics to the advent of printing.'
  - id: eisenstein-printing-revolution#u14-c5
    heading: 'Ortelius, atlases, and data collection'
    span: 251006:251976
    why: 'Extends her anti-Burckhardt argument to the ''objective'' side of consciousness via print-enabled cartographic data collection.'
  - id: eisenstein-printing-revolution#u14-c6
    heading: 'Standardization and individuality rise together'
    span: 259591:260100
    why: 'Names the paradox that mass-reproduced standardized portraiture is what made individual identity permanently recognizable.'
- nn: 15
  unit_id: ch05-permanent-renaissance-3
  note_id: eisenstein-printing-revolution-ch05-permanent-renaissance-3
  span: 263161:284362
  chunks:
  - id: eisenstein-printing-revolution#u15-c1
    heading: 'Print, not the Renaissance in the abstract, achieves the fusion'
    span: 263777:264119
    why: 'States Eisenstein''s specific rebuttal to Panofsky: durable fusion of manual and intellectual labor is print''s achievement, not an abstraction called the Renaissance.'
  - id: eisenstein-printing-revolution#u15-c2
    heading: 'The master printer''s workshop as the real site of cross-fertilization'
    span: 265538:265925
    why: 'Names the master printer''s workshop, not the artist''s studio, as the new institution that physically fused scholarly and artisanal labor.'
  - id: eisenstein-printing-revolution#u15-c3
    heading: 'Secrecy as scribal culture''s defense, not medieval idiosyncrasy'
    span: 268445:269348
    why: 'Eisenstein''s core reframing: esoteric secrecy was a functional adaptation to the fragility of hand-copied transmission, not a medieval mental quirk as Panofsky suggests.'
  - id: eisenstein-printing-revolution#u15-c4
    heading: 'Technology and the occult go to press together'
    span: 271986:272799
    why: 'The unit''s clearest description of print-driven information overload: real and occult knowledge flooding out together with no way for readers to discriminate for over a century.'
  - id: eisenstein-printing-revolution#u15-c5
    heading: 'The paradox of a permanent Renaissance'
    span: 281534:282379
    why: 'Delivers the unit''s title concept: collapsing the Renaissance with print''s own effects creates the self-contradictory idea of a permanent rebirth.'
  - id: eisenstein-printing-revolution#u15-c6
    heading: 'Same infrastructure, divergent local outcomes'
    span: 283927:284360
    why: 'Eisenstein''s explicit refusal of a uniform-effects reading of print, and the bridge to the Reformation chapter that follows.'
- nn: 16
  unit_id: ch06-christendom-disrupted-1
  note_id: eisenstein-printing-revolution-ch06-christendom-disrupted-1
  span: 284362:306817
  chunks:
  - id: eisenstein-printing-revolution#u16-c1
    heading: 'Print made the Reformation a mass movement'
    span: 284447:285196
    why: 'States Eisenstein''s central claim in one stroke: print, not disputation, made Lutheranism the first heresy judged by a mass reading public.'
  - id: eisenstein-printing-revolution#u16-c2
    heading: 'The theses'' spread: printers and translators as agents of change'
    span: 292089:292694
    why: 'Her key methodological move -- the Theses'' viral spread is not a mystery once printers, translators and distributors are treated as agents of change.'
  - id: eisenstein-printing-revolution#u16-c3
    heading: 'Precondition and precipitant, not either/or'
    span: 296318:296680
    why: 'The precondition/precipitant formula is the chapter''s causal thesis, refusing to pick one over the other.'
  - id: eisenstein-printing-revolution#u16-c4
    heading: 'Print fossilizes Catholic liturgy into uniformity'
    span: 300070:300789
    why: 'The single clearest legibility passage in the unit: print standardizes Catholic liturgy for the first time in Christian history.'
  - id: eisenstein-printing-revolution#u16-c5
    heading: 'Printing as a providential gift to the German nation'
    span: 287955:288303
    why: 'Primary evidence for the providential-nation theme that links Gutenberg, Luther, and German identity before nationalism proper.'
  - id: eisenstein-printing-revolution#u16-c6
    heading: 'From preacher to publicist: reaching every country in the world'
    span: 303828:304448
    why: 'Shows print completing an older scribal ambition (the ''apostolate of the pen'') rather than inventing it from nothing.'
- nn: 17
  unit_id: ch06-christendom-disrupted-2
  note_id: eisenstein-printing-revolution-ch06-christendom-disrupted-2
  span: 306817:327402
  chunks:
  - id: eisenstein-printing-revolution#u17-c1
    heading: 'The irony of a "peaceful art"'
    span: 306817:307585
    why: 'States the chapter''s founding irony: a technology hailed as peaceful is what made a textually transmitted faith vulnerable to fracture.'
  - id: eisenstein-printing-revolution#u17-c2
    heading: '"Printing, not Protestantism"'
    span: 309286:309965
    why: 'Eisenstein''s boldest causal claim, that print forced a reckoning with the Vulgate regardless of which reformer triggered it.'
  - id: eisenstein-printing-revolution#u17-c3
    heading: 'Trent''s containment machinery'
    span: 311232:311742
    why: 'Her own framing sentence (not a quoted rival) identifying the Index and Imprimatur as rear-guard responses to print''s new functions.'
  - id: eisenstein-printing-revolution#u17-c4
    heading: 'The two-pronged attack on the Vulgate'
    span: 312652:313424
    why: 'Lays out the chapter''s organizing structure of elite philological versus popular vernacular assaults on Vulgate authority.'
  - id: eisenstein-printing-revolution#u17-c5
    heading: 'The Bible "nationalized"'
    span: 318208:319422
    why: 'Carries the argument, via and beyond Kohn, that vernacular Bible translation dignified national languages while undercutting cosmopolitan Latin scholarship.'
  - id: eisenstein-printing-revolution#u17-c6
    heading: 'Nationalism and mass literacy together'
    span: 323802:324917
    why: 'States the chapter''s central paradox in its most quotable form: universalizing Scripture through print required fragmenting it along national lines.'
- nn: 18
  unit_id: ch06-christendom-disrupted-3
  note_id: eisenstein-printing-revolution-ch06-christendom-disrupted-3
  span: 327402:359508
  chunks:
  - id: eisenstein-printing-revolution#u18-c1
    heading: 'Household priesthood: the Protestant home as church'
    span: 327633:328145
    why: 'Marks the concrete social difference — cheap printed manuals, not doctrine alone — that gave Protestant householders a religious office Catholic tradesmen structurally lacked.'
  - id: eisenstein-printing-revolution#u18-c2
    heading: 'The silent voice within: pulpit versus page'
    span: 331037:332381
    why: 'Eisenstein''s own specification of Weber''s abstract claim about new Reformation-era controls, hedged in the same breath she makes it.'
  - id: eisenstein-printing-revolution#u18-c3
    heading: 'Sola scriptura''s double edge'
    span: 332383:333179
    why: 'Compresses the unit''s recurring claim that print pushed toward both Erasmian toleration and rigid literalism from the same technology.'
  - id: eisenstein-printing-revolution#u18-c4
    heading: 'Geneva''s refugee-built print industry'
    span: 339617:340572
    why: 'Eisenstein''s strongest empirical case that the printing trade followed refugee capital and craft skill, not religious cause alone, in relocating from Lyons to Geneva.'
  - id: eisenstein-printing-revolution#u18-c5
    heading: 'The Index as free publicity'
    span: 343387:344997
    why: 'Shows Catholic censorship manufacturing the Protestant/heterodox market it meant to suppress, Eisenstein''s clearest case for printers as independent causal agents.'
  - id: eisenstein-printing-revolution#u18-c6
    heading: 'Putting printing ahead of the Protestant Revolt'
    span: 358515:359506
    why: 'States Eisenstein''s central historiographical instruction: reorder causation so print''s disruption of the scriptural tradition precedes, rather than merely accompanies, the Reformation.'
- nn: 19
  unit_id: ch07-s1-great-book-of-nature
  note_id: eisenstein-printing-revolution-ch07-s1-great-book-of-nature
  span: 359508:396012
  chunks:
  - id: eisenstein-printing-revolution#u19-c1
    heading: 'The little books of men vs. the great book of Nature'
    span: 362637:363480
    why: 'States the section''s central puzzle (an unnamed authority''s claim) and Eisenstein''s own rebuttal question in the same breath, making clear which is her position.'
  - id: eisenstein-printing-revolution#u19-c2
    heading: 'Print, not new zeal, explains better scientific illustration'
    span: 378480:379096
    why: 'Her own analytic claim that print''s fixity, not a new appetite for observation, explains the sixteenth-century jump in illustration quality.'
  - id: eisenstein-printing-revolution#u19-c3
    heading: 'Away from books, yet known only from books'
    span: 379886:380519
    why: 'Deploys Olschki''s observation to expose the irony that anti-bookish empiricist rhetoric was itself circulated and consumed as print.'
  - id: eisenstein-printing-revolution#u19-c4
    heading: 'Feedback loops give printed maps their authority'
    span: 384252:384724
    why: 'Shows Eisenstein adopting Boulding''s feedback concept as evidence for print''s data-collection function, even while she elsewhere corrects his history of manuscript maps.'
  - id: eisenstein-printing-revolution#u19-c5
    heading: 'Same words, different books'
    span: 365330:365709
    why: 'Her direct methodological statement answering the Curtius/Burckhardt debate: metaphor continuity can mask real historical rupture.'
  - id: eisenstein-printing-revolution#u19-c6
    heading: 'The library as a scientific instrument'
    span: 395380:395763
    why: 'Caps the section''s argument that expanding, duplicated libraries were the era''s real research apparatus, not a byproduct of science.'
- nn: 20
  unit_id: ch07-s2-copernican-revolution
  note_id: eisenstein-printing-revolution-ch07-s2-copernican-revolution
  span: 396012:425711
  chunks:
  - id: eisenstein-printing-revolution#u20-c1
    heading: 'Archival access reframes the Copernican revolution'
    span: 396063:397137
    why: 'States Eisenstein''s central reframing move: printing''s expansion of archival access, not rival textual traditions, as the real enabling condition for Copernicus''s work.'
  - id: eisenstein-printing-revolution#u20-c2
    heading: 'Cracow 1480s versus Copenhagen 1560s: revolution in transmission, not data'
    span: 401489:402955
    why: 'Her sharpest rebuttal of Kuhn''s "no new data" claim: the interval before Copernicus''s death saw no new observations but a transformation in access to old ones.'
  - id: eisenstein-printing-revolution#u20-c3
    heading: 'Tycho''s star: print fixing a transient event into permanent attribution'
    span: 407629:408366
    why: 'Shows print''s fixative power at its most concrete: a one-off celestial event could only be permanently pinpointed and attributed to one observer once scribal transmission ended.'
  - id: eisenstein-printing-revolution#u20-c4
    heading: 'Kepler as print-production overseer'
    span: 417098:418051
    why: 'Documents Kepler''s literal role as a print-shop manager, the material labor Eisenstein insists belongs in his intellectual biography.'
  - id: eisenstein-printing-revolution#u20-c5
    heading: 'A rival text, not the right answer; the great book of Nature'
    span: 420629:421651
    why: 'States her thesis that Copernicus''s achievement was forcing a choice between rival printed systems, linked explicitly to her book-of-nature-versus-little-books-of-men theme.'
  - id: eisenstein-printing-revolution#u20-c6
    heading: 'From Kepler''s open letter to Newton''s annotated almanac'
    span: 423848:425709
    why: 'Traces a concrete print-coordinated verification chain (open letter, pamphlet, almanac publishers) carrying the unit''s argument forward to Newton.'
- nn: 21
  unit_id: ch07-s3-galileos-trial-1
  note_id: eisenstein-printing-revolution-ch07-s3-galileos-trial-1
  span: 425711:450494
  chunks:
  - id: eisenstein-printing-revolution#u21-c1
    heading: 'The geography of the book as missing variable'
    span: 426757:428153
    why: 'States Eisenstein''s central methodological claim: publication and its confessional/political geography, not just doctrine, must be weighed in explaining the Scientific Revolution.'
  - id: eisenstein-printing-revolution#u21-c2
    heading: 'Copernicus published under Protestant auspices'
    span: 436332:436569
    why: 'The unit''s sharpest evidence for the patronage/production paradox: Catholic patronage did not translate into Catholic printing of Copernican astronomy.'
  - id: eisenstein-printing-revolution#u21-c3
    heading: 'Sidereus Nuncius and the 1616 crackdown'
    span: 437557:439803
    why: 'Narrates the one Catholic publishing sensation (Galileo''s 1610 Starry Messenger) and its reversal by the Index in 1616, the unit''s key causal turning point.'
  - id: eisenstein-printing-revolution#u21-c4
    heading: 'The book of Nature is written in mathematics'
    span: 444648:445669
    why: 'Galileo''s own words puncture the ''everyman his own scientist'' analogy Eisenstein has just been testing, and her gloss on Newton names the new mathematical priesthood that replaces the Latin one.'
  - id: eisenstein-printing-revolution#u21-c5
    heading: 'Readers as data-suppliers for atlases and herbals'
    span: 446282:447127
    why: 'Concrete instance of print''s data-collection feedback loop between publishers and lay readers, one of the ''features of print culture'' the source repeatedly returns to.'
- nn: 22
  unit_id: ch07-s3-galileos-trial-2
  note_id: eisenstein-printing-revolution-ch07-s3-galileos-trial-2
  span: 450494:475774
  chunks:
  - id: eisenstein-printing-revolution#u22-c1
    heading: 'Beyond utility versus curiosity'
    span: 451753:452347
    why: 'Eisenstein''s own synthesis of the utility/curiosity debate over the Scientific Revolution, using Kepler''s tables to show neither side is sufficient alone.'
  - id: eisenstein-printing-revolution#u22-c2
    heading: 'Print-given leisure and the pleasure principle'
    span: 452845:453866
    why: 'Credits print with freeing scholars'' time for playful, curiosity-driven science, an implicit corrective to a purely Weberian work-ethic account.'
  - id: eisenstein-printing-revolution#u22-c3
    heading: 'Oldenburg''s thesis: print serves the learned community'
    span: 459047:459560
    why: 'The closest the unit comes to an explicit statement of the book''s argument, voiced through Oldenburg''s own letter about why publishing Malpighi mattered.'
  - id: eisenstein-printing-revolution#u22-c4
    heading: 'Signed credit versus anonymity as scientific incentive'
    span: 461270:462213
    why: 'Contrasts the Royal Society''s fame-generating publication policy with the Cimento''s fatal anonymity, showing publication infrastructure as science''s reward structure.'
  - id: eisenstein-printing-revolution#u22-c5
    heading: 'The edicts of 1616 and 1633 really did inhibit science'
    span: 465437:466107
    why: 'Eisenstein''s direct rebuttal of historians who minimize Galileo''s trial, asserting the condemnations genuinely blocked Copernican thought experiments.'
  - id: eisenstein-printing-revolution#u22-c6
    heading: 'Wittenberg and Geneva versus Venice and Lyons'
    span: 474759:475772
    why: 'Closing passage generalizing Galileo''s case into the book''s argument that the press''s confessional geography determined who in Europe could publish science at all.'
- nn: 23
  unit_id: ch08-conclusion-1
  note_id: eisenstein-printing-revolution-ch08-conclusion-1
  span: 475774:498517
  chunks:
  - id: eisenstein-printing-revolution#u23-c1
    heading: 'Reprising the book''s opening citation on ‘modernity’'
    span: 475835:476736
    why: 'This is the conventional Renaissance/Reformation/Scientific-Revolution account of modernity that Eisenstein explicitly names as the target her whole strategy is built to answer.'
  - id: eisenstein-printing-revolution#u23-c2
    heading: 'Communications shift replaces the quest for modernity'
    span: 477725:478750
    why: 'States her core methodological move in one sentence: trade debates over an ill-defined modernity for the traceable effects of print.'
  - id: eisenstein-printing-revolution#u23-c3
    heading: 'Print, not new thinking caps, explains the paradox of timing'
    span: 480004:481188
    why: 'Her key evidentiary argument: major breakthroughs preceded new instruments, so a change in technical literature (print), not mentality, must explain the timing.'
  - id: eisenstein-printing-revolution#u23-c4
    heading: 'Printed maps arrest and reverse scribal corruption'
    span: 483025:484181
    why: 'Concrete application of print''s fixity/preservative powers to cartography and astronomy, and an explicit warning against a misleading inertial-motion analogy for that reversal.'
  - id: eisenstein-printing-revolution#u23-c5
    heading: 'Against Marxist class-struggle historiography of printing'
    span: 491063:491620
    why: 'Her sharpest historiographical polemic, directly rebutting a base/superstructure account by insisting printers belonged with clerics and professors as much as with merchants.'
  - id: eisenstein-printing-revolution#u23-c6
    heading: 'Copernicus as the ‘second Ptolemy’, paired with Erasmus'
    span: 498001:498515
    why: 'The closing synthesis that pairs astronomical and scriptural textual restoration, seeding the chapter''s Scripture-and-Nature theme and the paradox that traditional goals produced unconventional outcomes.'
- nn: 24
  unit_id: ch08-conclusion-2
  note_id: eisenstein-printing-revolution-ch08-conclusion-2
  span: 498517:524137
  chunks:
  - id: eisenstein-printing-revolution#u24-c1
    heading: 'The “word to image” reversal'
    span: 517845:518719
    why: 'States Eisenstein''s governing formula for the whole unit: religion moves image-to-word under print while science moves word-to-image.'
  - id: eisenstein-printing-revolution#u24-c2
    heading: 'Scripture and science come to a parting of the ways'
    span: 505924:506925
    why: 'Names the thesis directly and grounds it in the concrete pre-print unity of astronomy and Easter-reckoning that print then split apart.'
  - id: eisenstein-printing-revolution#u24-c3
    heading: 'Printing''s triumph as overdetermined convergence'
    span: 520089:521320
    why: 'Her explicit rejection of single-cause explanation in favor of converging capitalist, evangelical, and political motives producing an irreversible shift.'
  - id: eisenstein-printing-revolution#u24-c4
    heading: 'Against “just a tool”: the unit''s closing rebuttal'
    span: 522805:524135
    why: 'Stages and then refutes an instrumentalist humanist critique of print technology, ending on the book''s signature claim about fundamentalism and modern science.'
  - id: eisenstein-printing-revolution#u24-c5
    heading: 'Silent instructors: pictures replacing words in science'
    span: 508468:509888
    why: 'Concrete evidence — Vesalius, Galileo, Fontenelle, Elyot — for how standardized pictorial/mathematical notation displaced verbal instruction in early modern science.'
- nn: 25
  unit_id: ch08-final-remarks
  note_id: eisenstein-printing-revolution-ch08-final-remarks
  span: 524137:529095
  chunks:
  - id: eisenstein-printing-revolution#u25-c1
    heading: 'Irreversible, cumulative momentum'
    span: 524722:525059
    why: 'States the chapter''s central thesis, that the print revolution''s cumulative processes are irreversible and still gathering momentum, directly answering critics of the book''s continuity claim.'
  - id: eisenstein-printing-revolution#u25-c2
    heading: 'Duplicative powers and the chaos of modern culture'
    span: 526076:526596
    why: 'Argues that print''s own ''duplicative powers'' rather than newer technologies chiefly explain the overload and chaos of modern culture, the unit''s clearest information-overload claim.'
  - id: eisenstein-printing-revolution#u25-c3
    heading: 'Chronos and premature obituaries'
    span: 527327:527906
    why: 'Personifies accumulated print records as a threat while crediting scannable records with exposing a pattern of premature obituaries for recurring problems, a historiographical caution relevant to WMP''s own forecasting stance.'
  - id: eisenstein-printing-revolution#u25-c4
    heading: 'Against Hegelian and Marxist grand designs'
    span: 527908:528659
    why: 'Rejects teleological Hegelian/Marxist historiography and states print''s central unresolved contradiction, simultaneously fixing national divisions and building a cosmopolitan Commonwealth of Learning.'
- nn: 26
  unit_id: afterword-1
  note_id: eisenstein-printing-revolution-afterword-1
  span: 529095:555174
  chunks:
  - id: eisenstein-printing-revolution#u26-c1
    heading: 'From unacknowledged revolution to established field'
    span: 532266:532578
    why: 'Marks the historiographical pivot the Afterword is written from: the field her book helped found has grown enough to make her original title feel dated.'
  - id: eisenstein-printing-revolution#u26-c2
    heading: 'The McLuhanesque charge, corrected'
    span: 533002:533444
    why: 'Shows Eisenstein distinguishing a misattributed criticism from legitimate ones, a distinction that structures the rest of the unit''s response to critics.'
  - id: eisenstein-printing-revolution#u26-c3
    heading: 'A stunning novelty, not just a hybrid trade'
    span: 540598:540899
    why: 'Her concession-and-rebuttal pattern in miniature: grants the cartolai continuity thesis its due, then insists it cannot absorb the scale shift contemporaries themselves called stunning.'
  - id: eisenstein-printing-revolution#u26-c4
    heading: 'Maufer 1477 and Darnton''s printers of 1788'
    span: 544027:544869
    why: 'The unit''s hardest economic evidence that the master printer''s shop, not the book''s format, is where a genuine institutional metamorphosis appears.'
  - id: eisenstein-printing-revolution#u26-c5
    heading: 'Reorganization of texts and readers'' mental habits'
    span: 548387:548873
    why: 'Her most legibility-adjacent claim in the unit, deliberately kept modest: repetition, not invention, is what she credits print with.'
  - id: eisenstein-printing-revolution#u26-c6
    heading: 'Narrowing the claim against the communicative-spectrum critics'
    span: 553694:554045
    why: 'Shows her characteristic reply to the orality critique: concede persistence and even facilitation of speech, while holding a narrower claim about how print changed the spectrum.'
- nn: 27
  unit_id: afterword-2
  note_id: eisenstein-printing-revolution-afterword-2
  span: 555174:576249
  chunks:
  - id: eisenstein-printing-revolution#u27-c1
    heading: 'The communicative spectrum, not an impact model'
    span: 555369:556092
    why: 'States Eisenstein''s core correction to critics: print altered the balance among speech, writing and print rather than displacing them, illustrated by the pasquillade and Mr. Spectator''s Club.'
  - id: eisenstein-printing-revolution#u27-c2
    heading: 'Dumb preachers, silent instructors, mute orators'
    span: 557519:558221
    why: 'Her clearest statement of print substituting a written channel of authority for denied pulpits, classrooms, and political oratory.'
  - id: eisenstein-printing-revolution#u27-c3
    heading: 'From “impact” to “cooperative transition”'
    span: 560245:561159
    why: 'The chapter''s key methodological move, discarding the billiard-ball “impact” model for a phase-change metaphor, and the basis for her non sequitur reply to John Barnard.'
  - id: eisenstein-printing-revolution#u27-c4
    heading: 'Gesner''s bibliography and the reversal of scarcity'
    span: 564814:566240
    why: 'Grounds the long-range-process sense of “revolution” in a concrete case: the 1545 universal bibliography that became the last of its kind before specialization and overload took over.'
  - id: eisenstein-printing-revolution#u27-c5
    heading: 'Political fragmentation, not nation-building, powered print''s spread'
    span: 569481:571071
    why: 'Complicates the standard print-and-nationalism narrative by arguing printing''s early explosion depended on the absence of consolidated central authority, not its presence.'
  - id: eisenstein-printing-revolution#u27-c6
    heading: 'Preconditions and precipitants of a multivariable revolution'
    span: 572863:573554
    why: 'Her clearest statement of multivariable historical causation: long-incubating preconditions converging into a rapid, continent-wide effect.'
- nn: 28
  unit_id: afterword-3
  note_id: eisenstein-printing-revolution-afterword-3
  span: 576249:607236
  chunks:
  - id: eisenstein-printing-revolution#u28-c1
    heading: 'The textus receptus: fixity as engine of cumulative correction'
    span: 592603:593578
    why: 'States the mechanism — a frozen first edition as shared reference point — by which print''s fixity enabled cumulative, feedback-driven scholarship rather than mere accuracy.'
  - id: eisenstein-printing-revolution#u28-c2
    heading: 'Relative, not absolute: the rebuttal to Adrian Johns on standardization'
    span: 584218:585320
    why: 'The load-bearing methodological move of the whole unit: Eisenstein reframes Johns''s multiformity evidence as consistent with, not a refutation of, her comparative (not absolute) standardization claim.'
  - id: eisenstein-printing-revolution#u28-c3
    heading: 'Agent of change, not technological determinism: the reply to Michael Warner'
    span: 603022:604253
    why: 'Her most explicit statement of the hedge World Machines needs when treating print as infrastructure: the tool shaped labor and skill in a restricted sense, never that technology single-handedly authored culture.'
  - id: eisenstein-printing-revolution#u28-c4
    heading: 'Closing passage: printing as a transgenerational business of time'
    span: 606282:607235
    why: 'The book''s final passage, casting the printing revolution as a distributed, multigenerational enterprise no single human agent could have completed — a genuine rhyme with the history-machine idea.'
  - id: eisenstein-printing-revolution#u28-c5
    heading: 'The master printer''s shop as the true protagonist'
    span: 598659:600019
    why: 'Names the concrete institution — collaborating authors, printers, illustrators, correctors — that Eisenstein defends as the real engine of change against critics who fault her emphasis on exceptional master printers.'
  - id: eisenstein-printing-revolution#u28-c6
    heading: 'Self-critique: print and the old, worsening problem of information overload'
    span: 580808:581335
    why: 'A rare moment of authorial self-correction naming print''s preservative capacity, not just its distributive reach, as a driver of information overload — directly relevant to WMP''s information-overload thread.'
