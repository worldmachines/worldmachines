    end_quote: crossing a chasm on a slack-rope, and commonly breaking his neck.
    why: Restates the Unity/Multiplicity problem as a fact about consciousness itself, via the chapter's
      most vivid image of psychological precarity.
  - id: adams-education#u31-c6
    label: c6
