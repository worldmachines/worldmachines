    char_end: 548777
    start_quote: Grant avowed from the start a policy of drift; and a policy of drift attaches only barnacles.
    end_quote: Luck went dead against him. For once, he was fifty years in advance of his time.
    why: 'The chapter''s closing diagnosis: Grant''s administration offers no program to attach to, and
      Adams''s admission that he was straightforwardly ''for sale'' with no buyer closes off his reforming
      ambitions.'
- nn: 20
  unit_id: ch-18-free-fight
  note_id: adams-education-ch-18-free-fight
  span: 548781:580345
  chunks:
  - id: adams-education#u20-c1
    label: c1
    heading: Washington's sensual spring, against Boston's chill
    char_start: 548822
    char_end: 550129
    start_quote: THE old New Englander was apt to be a solitary animal, but the
    end_quote: Few Americans were so poor as to question them.
    why: Establishes the chapter's one unclouded pleasure — Washington's spring — as the emotional baseline
      against which the ensuing political collapse reads as loss.
  - id: adams-education#u20-c2
    label: c2
    heading: The Gold Conspiracy's impenetrable mystery
    char_start: 552442
    char_end: 553253
    start_quote: The mystery that shrouded the famous, classical attempt of Jay Gould to corner gold
    end_quote: The plea was professionally inadmissible.
    why: Introduces the Erie/Gold Conspiracy investigation that drives the chapter's first half and shows
      Adams's method as an amateur journalist-investigator.
  - id: adams-education#u20-c3
    label: c3
    heading: 'Free fight: four friends matched in pairs'
    char_start: 571660
    char_end: 572881
    start_quote: That Sumner and Hoar, the two New Englanders in great position
    end_quote: What value had the fight in education?
    why: States the chapter's organizing structure explicitly — Sumner-Fish and Chase-Hoar as paired duels
      — and gives the title 'Free Fight' its literal referent.
  - id: adams-education#u20-c4
    label: c4
    heading: The system of 1789 had broken down
    char_start: 575540
    char_end: 576211
    start_quote: The political dilemma was as clear in 1870 as it was likely to be in 1970.
    end_quote: the poorest in the world--the clumsiest--the most inefficient.
    why: 'The chapter''s thesis statement: the constitutional order has died in substance while its forms
      are patched along, the passage''s clearest resonance with World Machines'' decay/interregnum vocabulary.'
  - id: adams-education#u20-c5
    label: c5
    heading: Becoming a pirate of the press
    char_start: 579210
    char_end: 580341
    start_quote: Yet he shortened his spring, for he needed to get back to
    end_quote: Under the excitement of chase he was becoming a pirate himself, and liked it.
    why: Closes the chapter on Adams's own transformation from earnest reformer to a journalist who exploits
      publicity mechanics for effect, the personal cost of the environment just described.
- nn: 21
  unit_id: ch-19-chaos
  note_id: adams-education-ch-19-chaos
  span: 580345:610793
  chunks:
  - id: adams-education#u21-c1
    label: c1
    heading: 'The sister''s death: "the last lesson"'
    char_start: 587456
    char_end: 588298
    start_quote: The last lesson--the sum and term of education--began then.
    end_quote: until after ten days of fiendish torture she died in convulsion.
    why: Adams marks his sister's death as the point where experience stopped teaching gently and Nature
      first appeared as raw, uncatalogued force.
  - id: adams-education#u21-c2
    label: c2
    heading: 'Nature''s gesture: a phantasm of force'
    char_start: 589892
    char_end: 590959
    start_quote: The first serious consciousness of Nature's gesture--her attitude towards life
    end_quote: but He could not be a Person.
    why: 'States the chapter''s central philosophical claim in full: that Nature''s violence is unreasoned
      and unreasoning, incompatible with a personal God.'
  - id: adams-education#u21-c3
    label: c3
    heading: Mont Blanc as chaos of anarchic forces
    char_start: 591489
    char_end: 592062
    start_quote: For the first time in his life, Mont Blanc for a moment looked to him what it was
    end_quote: leaving a new world to learn.
    why: 'The book''s title concept becomes literal: even the sublime Alpine landscape briefly shows itself
      as purposeless chaos before its usual illusions are restored.'
  - id: adams-education#u21-c4
    label: c4
    heading: Ten days from peace to war
    char_start: 592066
    char_end: 592422
    start_quote: On July 4, all Europe had been in peace; on July 14, Europe was
    end_quote: 'Bismarck: himself hardly knew how he did it.'
    why: 'The Franco-Prussian War''s outbreak is the chapter''s public-history counterpart to the private
      catastrophe: sudden, ungoverned, and opaque even to its principal actors.'
  - id: adams-education#u21-c5
    label: c5
    heading: Eliot's unanswerable logic
    char_start: 601093
    char_end: 601494
    start_quote: '"But, Mr. President," urged Adams, "I know nothing about Mediaeval History."'
    end_quote: could not meet it without overstepping his privileges.
    why: Adams's induction into teaching hinges on a single piece of airtight non-reasoning, capturing
      the chapter's theme that institutional reward follows no logic tied to genuine competence.
  - id: adams-education#u21-c6
    label: c6
    heading: 'The begonia: showy but not useful'
    char_start: 598501
    char_end: 598836
    start_quote: Here was a tour de force he had never dreamed himself equal to performing
    end_quote: except to call him a begonia.
    why: Adams's bitterest joke about his own unrewarded journalism crystallizes the chapter's running
      irony that achievement and recognition never coincide.
- nn: 22
  unit_id: ch-20-failure
  note_id: adams-education-ch-20-failure
  span: 610793:642074
  chunks:
  - id: adams-education#u22-c1
    label: c1
    heading: A teacher affects eternity
    char_start: 614005
    char_end: 614866
    start_quote: A parent gives life, but as parent, gives no more.
    end_quote: history had either to be taught as such--or falsified.
    why: 'States the moral crux of Adams''s professorship: that teaching history forces an unwanted metaphysical
      choice with ethical consequences he cannot escape.'
  - id: adams-education#u22-c2
    label: c2
    heading: Cultivating the tenth mind
    char_start: 617317
    char_end: 617861
    start_quote: The number of students whose minds were
    end_quote: though necessarily at the expense of the other nine.
    why: Describes the concrete, elitist pedagogical experiment Adams ran and explicitly whom he sacrificed
      to run it.
  - id: adams-education#u22-c3
    label: c3
    heading: Self-assessed failure at 1877
    char_start: 622600
    char_end: 623275
    start_quote: The uses of adversity are beyond measure strange.
    end_quote: he should be sore at his failure.
    why: Adams's own dated verdict on the professorship, the passage the chapter's title and argument
      hinge on.
  - id: adams-education#u22-c4
    label: c4
    heading: Meeting Clarence King at Estes Park
    char_start: 636188
    char_end: 636790
    start_quote: One of these men was Clarence King on his way up to the camp.
    end_quote: and talked till far towards dawn.
    why: The chance encounter that introduces Clarence King, a figure who recurs through the rest of the
      book, framed by Adams as an instant, unchosen friendship.
  - id: adams-education#u22-c5
    label: c5
    heading: King as the fulfilled American type
    char_start: 637905
    char_end: 638591
    start_quote: A new friend is always a miracle, but at thirty-three years
    end_quote: the same obstacles to overcome.
    why: Adams's retrospective elevation of King into a symbolic counterpart, converging the American
      west and the European east in one friendship.
  - id: adams-education#u22-c6
    label: c6
    heading: Closing the first movement
    char_start: 641717
    char_end: 642070
    start_quote: No more education was possible for either man.
    end_quote: Henceforth, he went on, submissive.
    why: The chapter's final lines, marking the deliberate close of the book's opening movement before
      the twenty-year narrative gap.
- nn: 23
  unit_id: ch-21-twenty-years-after
  note_id: adams-education-ch-21-twenty-years-after
  span: 642074:677739
  chunks:
  - id: adams-education#u23-c1
    label: c1
    heading: The book's thesis on education, restated
    char_start: 642127
    char_end: 643715
    start_quote: this is a story of education, not of adventure!
    end_quote: compelled to waste three-fourths of their energy in doing it.
    why: States the book's operating thesis -- that education is about training a mind to react well,
      not accumulating facts -- right before the narrative jumps twenty years forward to test that claim
      against Adams's own life.
  - id: adams-education#u23-c2
    label: c2
    heading: Refusing a new education
    char_start: 647439
    char_end: 648465
    start_quote: The future attracted him less. Lying there for a week he reflected
    end_quote: leaving no stock to graft on.
    why: Marks Adams's explicit refusal of further education on his return voyage, framing the rest of
      the chapter as denouement rather than discovery.
  - id: adams-education#u23-c3
    label: c3
    heading: The Teutonic and the next term
    char_start: 651881
    char_end: 652995
    start_quote: He had not crossed the Atlantic for a dozen years
    end_quote: one might double scale and speed indefinitely without passing bounds.
    why: Adams turns the Atlantic crossing into a proto-quantitative extrapolation of technological acceleration,
      previewing the 'law of acceleration' the book's closing chapters develop explicitly.
  - id: adams-education#u23-c4
    label: c4
    heading: Kipling and the old conundrum
    char_start: 653476
    char_end: 654802
    start_quote: Kipling and the American were not one, but two, and could not be glued together.
    end_quote: Genius has to pay itself that unwilling self-respect.
    why: Names the persistent, unresolved split between American and European identity that recurs throughout
      Adams's memoir, here triggered by his shipboard encounter with Kipling.
  - id: adams-education#u23-c5
    label: c5
    heading: An election nobody wanted to win
    char_start: 656128
    char_end: 656637
    start_quote: The two candidates were singular persons, of whom it was the common saying
    end_quote: I prefer to look on at his proceedings from the safe summit of some neighboring hill.
    why: Captures the affectless, low-stakes character of Gilded Age presidential politics as Adams experienced
      it -- an election neither side particularly wanted to win.
  - id: adams-education#u23-c6
    label: c6
    heading: The Rock Creek memorial as mirror
    char_start: 674653
    char_end: 675566
    start_quote: The interest of the figure was not in its meaning, but in the response of the observer.
    end_quote: The American layman had lost sight of ideals; the American priest had lost sight of faith.
    why: Adams's meditation on the Rock Creek memorial shows the statue functioning as a pure mirror for
      the viewer's own belief or its absence, becoming the chapter's central image of a society that has
      lost a shared symbolic language.
- nn: 24
  unit_id: ch-22-chicago
  note_id: adams-education-ch-22-chicago
  span: 677739:707710
  chunks:
  - id: adams-education#u24-c1
    label: c1
    heading: The Panic as force without an author
    char_start: 692708
    char_end: 693460
    start_quote: When Adams went to his bank to draw a hundred dollars of his own money on deposit,
    end_quote: an emotion--a panic--that meant nothing.
    why: States the chapter's core diagnostic move -- reading the 1893 Panic as an anonymous mechanical
      force rather than anyone's decision, the same lens Adams then turns on Chicago.
  - id: adams-education#u24-c2
    label: c2
    heading: 'Brooks Adams''s law of history: civilization follows the exchanges'
    char_start: 694526
    char_end: 695414
    start_quote: Brooks had discovered or developed a law of history that civilization followed the
    end_quote: and Henry made note of it for study.
    why: Brooks Adams's exchange-driven theory of historical instability gives Henry a systemic, non-biographical
      account of causation that anticipates the chapter's reading of Chicago and the gold-standard vote
      alike.
  - id: adams-education#u24-c3
    label: c3
    heading: 'The Exposition as Babel: a rupture in historical continuity'
    char_start: 696171
    char_end: 696861
    start_quote: The Exposition itself defied philosophy.
    end_quote: had ever ruffled the surface of the Lakes.
    why: Captures Adams's first reaction to the Fair -- that its bare existence, not any exhibit, was
      the astonishing fact -- and frames the Exposition as an open question about whether American civilization
      is still capable of choosing form.
  - id: adams-education#u24-c4
    label: c4
    heading: 'The dynamo: did it pull or did it push?'
    char_start: 701249
    char_end: 701704
    start_quote: One lingered long among the dynamos, for they were
    end_quote: expected answers and was astonished to get none.
    why: 'The chapter''s center of gravity: the historian''s vocabulary fails before the dynamo, the direct
      seed of the book''s later Dynamo-and-Virgin meditation on where technological force comes from and
      where it is going.'
  - id: adams-education#u24-c5
    label: c5
    heading: Mourning the eighteenth century
    char_start: 704720
    char_end: 705193
    start_quote: He had stood up for his eighteenth century, his Constitution
    end_quote: become little better than a crank.
    why: Adams's personal elegy for eighteenth-century republicanism, admitted to be obsolete even as
      he keeps defending it out of habit rather than conviction.
  - id: adams-education#u24-c6
    label: c6
    heading: Crossing the chasm into the capitalistic machine
    char_start: 706889
    char_end: 707516
    start_quote: Such great revolutions commonly
    end_quote: controlling the new energies that America adored.
    why: Names the 1893 transition explicitly as the triumph of 'the capitalistic system with all its
      necessary machinery,' the chapter's closing image of one infrastructural order replacing another.
- nn: 25
  unit_id: ch-23-silence
  note_id: adams-education-ch-23-silence
  span: 707710:739368
  chunks:
  - id: adams-education#u25-c1
    label: c1
    heading: 'Education without capital: King versus Whitney'
    char_start: 711790
    char_end: 713261
    start_quote: Barely forty years had passed since all these men started in a bunch to race for power
    end_quote: Whitney, who was no better educated than Adams, had achieved phenomenal success.
    why: 'States the chapter''s opening paradox directly: neither King''s ideal scientific education nor
      Whitney''s ordinary one reliably predicted success.'
  - id: adams-education#u25-c2
    label: c2
    heading: Statistics and the failure of positivist certainty
    char_start: 718547
    char_end: 719442
    start_quote: Taking for granted that the alternative to art was arithmetic, he plunged deep into statistics
    end_quote: The method did not result in faith.
    why: Adams's attempt to find a firmer ground than history in quantification collapses when even the
      statisticians lack confidence in their own figures.
  - id: adams-education#u25-c3
    label: c3
    heading: 'The human factor: Pteraspis and the persistence of massacre'
    char_start: 720370
    char_end: 721617
    start_quote: The human factor was worse still.
    end_quote: The robbery might be natural and inevitable, but the murder seemed altogether archaic.
    why: 'The chapter''s bleakest claim: continuous massacre and war show that human conduct beneath the
      surface of ''progress'' is unchanged since antiquity.'
  - id: adams-education#u25-c4
    label: c4
    heading: Normandy through Mrs. Lodge's eyes
    char_start: 725257
    char_end: 725753
    start_quote: Where Mrs. Lodge summoned, one followed with gratitude
    end_quote: through the medium of younger eyes and fresher minds.
    why: The pivotal, almost accidental moment that breaks Adams's German-lecture-room historiography
      and seeds the later medieval study.
  - id: adams-education#u25-c5
    label: c5
    heading: The Pursuit of Ignorance in Silence
    char_start: 735394
    char_end: 736157
    start_quote: Although none of these great geniuses had shown faith in silence as a cure for their
      own ills or ignorance
    end_quote: and so the pilgrimage began anew!
    why: Adams's own coinage for the chapter's governing irony -- silence as society's method for shelving
      its old men -- and the hinge into the chapter's second half of travel.
  - id: adams-education#u25-c6
    label: c6
    heading: News of the Maine at Karnak
    char_start: 738053
    char_end: 738799
    start_quote: Adams cared little to see Egypt again, but he was glad to see Hay
    end_quote: One lay in the sands and watched the expression of the Sphinx.
    why: Closes the chapter and the unit on the news that triggers the Spanish-American War, framed through
      Adams's studied silence and deep time.
- nn: 26
  unit_id: ch-24-indian-summer
  note_id: adams-education-ch-24-indian-summer
  span: 739368:773121
  chunks:
  - id: adams-education#u26-c1
    label: c1
    heading: Indian summer of a diplomatic life
    char_start: 739411
    char_end: 739984
    start_quote: The summer of the Spanish War began the Indian summer of life
    end_quote: singularly interesting to the last survivor of the Legation of 1861.
    why: 'Establishes the chapter''s title and elegiac frame: Adams at sixty savoring a hard-won historical
      vantage point as the last living witness of the 1861 Legation.'
  - id: adams-education#u26-c2
    label: c2
    heading: Chaos cannot be taught
    char_start: 742639
    char_end: 743065
    start_quote: Never before had Adams been able to discern the working of law
    end_quote: left him a little cold towards the other diplomatic results of the war.
    why: States the chapter's epistemological hinge — that Adams's sense of historical 'law' is a personal
      proof, not a teachable method, since chaos cannot be taught.
  - id: adams-education#u26-c3
    label: c3
    heading: Hay on a Senate that dishes every treaty
    char_start: 765304
    char_end: 766591
    start_quote: A treaty of peace, in any normal state of things," said Hay, "ought to be ratified
    end_quote: Is it worth while--for me--to keep up this useless labor?
    why: Hay's own first-hand account, in dialogue, of why the Senate had made treaty-making nearly impossible
      — the book's most concrete political complaint in the unit.
  - id: adams-education#u26-c4
    label: c4
    heading: 'La Farge: ''Adams, you reason too much!'''
    char_start: 756287
    char_end: 757088
    start_quote: One was never quite sure of his whole meaning until too late
    end_quote: Adams had never met a perfectly trained mind.
    why: Characterizes La Farge's indirect, nuance-driven mind against Adams's Bostonian reasoning, a
      dialectic that recurs across the book.
  - id: adams-education#u26-c5
    label: c5
    heading: The Boer War as inherited family grievance
    char_start: 761231
    char_end: 761678
    start_quote: He had been taught from childhood, even in England, that his forbears
    end_quote: whatever might be the case with George III.
    why: Shows Adams's politics as inseparable from ancestral identity — the Boer War reopens an argument
      he feels his great-grandfather already settled in 1776.
  - id: adams-education#u26-c6
    label: c6
    heading: Kepler, Newton, and a formula for Congress
    char_start: 769674
    char_end: 770237
    start_quote: If Kepler and Newton could take liberties with the sun and moon
    end_quote: he could look only for derision at best.
    why: 'The unit''s pivotal turn: Adams resolves to seek a mathematical law of historical attraction,
      the germ of the dynamic theory of history that dominates the book''s later chapters.'
- nn: 27
  unit_id: ch-25-the-dynamo-and-the-virgin
  note_id: adams-education-ch-25-the-dynamo-and-the-virgin
  span: 773121:796277
  chunks:
  - id: adams-education#u27-c1
    label: c1
    heading: The dynamo becomes a symbol of infinity
    char_start: 775609
    char_end: 776915
    start_quote: Then he showed his scholar the great hall of dynamos, and
    end_quote: the dynamo was not so human as some, but it was the most expressive.
    why: 'The chapter''s most famous move: the dynamo displaces the Cross as the object of quasi-religious
      awe, given by "inherited instinct".'
  - id: adams-education#u27-c2
    label: c2
    heading: Langley and the anarchical new rays
    char_start: 777339
    char_end: 777972
    start_quote: The forces were interchangeable if not reversible, but
    end_quote: his Science. The force was wholly new.
    why: Shows even the era's master physicist disowning the new forces as parricidal and occult, framing
      radium as a rupture with all prior science.
  - id: adams-education#u27-c3
    label: c3
    heading: Translating rays into faith
    char_start: 781893
    char_end: 782769
    start_quote: The historian was thus reduced to his last resources.
    end_quote: though the rays were unborn and the women were dead.
    why: 'States Adams''s governing method: after every causal history fails, force felt as attraction
      becomes the one measure that lets Cross, dynamo, and Virgin be compared.'
  - id: adams-education#u27-c4
    label: c4
    heading: The Virgin as animated dynamo, lost to America
    char_start: 783377
    char_end: 784388
    start_quote: This problem in dynamics gravely perplexed an American
    end_quote: all she needed was to be fecund.
    why: Names the chapter's central thesis — the Woman as supreme generative force — and America's Puritan-driven
      amnesia toward it, fig-leaves and all.
  - id: adams-education#u27-c5
    label: c5
    heading: 'St. Gaudens: channel of taste, not force'
    char_start: 790663
    char_end: 791616
    start_quote: Yet in mind and person St. Gaudens was a survival of the 1500s
    end_quote: to St. Gaudens she remained as before a channel of taste.
    why: The Amiens set-piece where two sympathetic men before the same cathedral split force from taste,
      dramatizing how thoroughly the old energy has drained out of American-trained perception.
  - id: adams-education#u27-c6
    label: c6
    heading: The Virgin as the greatest force the Western world ever felt
    char_start: 792907
    char_end: 793944
    start_quote: Yet in mechanics, whatever the mechanicians might think, both
    end_quote: its complex source and shifting channels; its values, equivalents, conversions.
    why: The chapter's closing thesis statement, explicitly defining the historian's task as tracing force's
      "source and shifting channels" rather than narrating cause and effect.
- nn: 28
  unit_id: ch-26-twilight
  note_id: adams-education-ch-26-twilight
  span: 796277:820679
  chunks:
  - id: adams-education#u28-c1
    label: c1
    heading: Society prices Ming vases above the fate of China
    char_start: 796694
    char_end: 798138
    start_quote: Of all branches of education, the science of gauging people and events by their relative
      importance defies study most insolently
    end_quote: The value of a Ming vase was more serious than universal war.
    why: 'States the chapter''s opening paradox: society''s price mechanism inverts real historical significance,
      dwarfing the Boxer Rebellion crisis beneath the market value of royal curios.'
  - id: adams-education#u28-c2
    label: c2
    heading: Hay saves China alone and "History broke in halves"
    char_start: 798860
    char_end: 799889
    start_quote: When Hay suddenly ignored European leadership, took the lead himself, rescued the Legations
      and saved China
    end_quote: the American blushed to be told of his submissions in the past. History broke in halves.
    why: The chapter's central diplomatic event — Hay's unilateral rescue of the Legations, which Adams
      frames as an epochal rupture in American standing.
  - id: adams-education#u28-c3
    label: c3
    heading: The historian's twilight wilderness
    char_start: 805845
    char_end: 806274
    start_quote: To the practical man, such an attempt is idiotic, and probably the practical man is in
      the right to-day
    end_quote: leading further and further into a wilderness where twilight is short and the shadows are
      dense.
    why: 'Names the chapter''s title image directly: the historian''s solitary, decades-ahead triangulation
      as against the practical man''s short horizon.'
  - id: adams-education#u28-c4
    label: c4
    heading: King drops out; the three friends near the end
    char_start: 806275
    char_end: 806822
    start_quote: Already Hay literally staggered in his tracks for weariness. More worn than he, Clarence
      King dropped.
    end_quote: Non doles, Paete! One is ashamed of it even in the acting.
    why: 'The chapter''s emotional pivot: Clarence King''s collapse and the shared, unspoken recognition
      among Adams, Hay, and King that death is near.'
  - id: adams-education#u28-c5
    label: c5
    heading: Unity always wins, yet complexity keeps deepening
    char_start: 811049
    char_end: 812061
    start_quote: All one's life, one had struggled for unity, and unity had always won.
    end_quote: science itself warned him to begin it again from the beginning.
    why: States the chapter's governing paradox in Adams's own terms — the seed of his later dynamic theory
      of history, and the clearest World-Machines resonance in the unit.
  - id: adams-education#u28-c6
    label: c6
    heading: '"Larger synthesis is suicide"'
    char_start: 818790
    char_end: 819504
    start_quote: Yet the admission seemed close at hand.
    end_quote: a point must always be soon reached where larger synthesis is suicide.
    why: Adams's explicit epistemological verdict against forcing scientific or historical multiplicity
      into a single unifying theory.
- nn: 29
  unit_id: ch-27-teufelsdrockh
  note_id: adams-education-ch-27-teufelsdrockh
  span: 820679:847772
  chunks:
  - id: adams-education#u29-c1
    label: c1
    heading: Paris as chaos to be kept pace with
    char_start: 820718
    char_end: 822484
    start_quote: INEVITABLE Paris beckoned, and resistance became more and more
    end_quote: Only the young have time to linger in the rear.
    why: 'Opens the chapter by establishing Adams''s method for 1901: not mastering Paris''s multiplicity
      but racing to stay in front of it.'
  - id: adams-education#u29-c2
    label: c2
    heading: The larger synthesis of order and anarchy
    char_start: 828263
    char_end: 829026
