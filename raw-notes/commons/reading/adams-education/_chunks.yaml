- nn: 3
  unit_id: ch-01-quincy
  note_id: adams-education-ch-01-quincy
  span: 9536:50616
  chunks:
  - id: adams-education#u03-c1
    label: c1
    heading: Born already branded
    char_start: 10047
    char_end: 11298
    start_quote: Had he been born in Jerusalem under the shadow of the Temple
    end_quote: was so queer as to offer a subject of curious speculation to the baby long after he had
      witnessed the solution.
    why: 'States the book''s founding conceit: a child born already over-determined by inherited historical
      identity, before any possibility of consent.'
  - id: adams-education#u03-c2
    label: c2
    heading: The old world thrown into the ash-heap
    char_start: 13392
    char_end: 14423
    start_quote: This problem of education, started in 1838, went on for three
    end_quote: his new world was ready for use, and only fragments of the old met his eyes.
    why: Dates with technological precision (railroad, Cunard steamers, telegraph) the moment Adams's
      inherited eighteenth-century world became obsolete within his own early childhood.
  - id: adams-education#u03-c3
    label: c3
    heading: Town versus country
    char_start: 19597
    char_end: 20226
    start_quote: Town was winter confinement, school, rule, discipline
    end_quote: and breathed by boys without knowing it.
    why: Lays out the Boston/Quincy, winter/summer, restraint/liberty dualism Adams treats as the single
      most decisive force in his own education.
  - id: adams-education#u03-c4
    label: c4
    heading: 'Order through chaos: the thesis sentence'
    char_start: 28318
    char_end: 28733
    start_quote: From cradle to grave this problem of running order through chaos
    end_quote: taking a new nature in becoming tame.
    why: Generalizes the chapter's town/country dualism into a stated thesis about education as the perpetual
      task of imposing order on multiplicity.
  - id: adams-education#u03-c5
    label: c5
    heading: Silent authority
    char_start: 31668
    char_end: 32726
    start_quote: He had shown no temper, no irritation, no personal feeling, and had made no display of
      force.
    end_quote: the stoniest glacial and tidal drift known in any Puritan land.
    why: Defines Adams's criterion for legitimate authority — force exercised without moralizing cant
      — via the anecdote of his grandfather walking him to school.
  - id: adams-education#u03-c6
    label: c6
    heading: The ancestral chapter ends
    char_start: 45916
    char_end: 46420
    start_quote: The end of this first, or ancestral and Revolutionary, chapter
    end_quote: its effect on a ten-year-old boy, whose boy-life was fading away with the life of his grandfather,
      could not be slight.
    why: Marks the periodization Adams imposes on his own life, closing the 'ancestral and Revolutionary'
      stage of his education with his grandfather's death.
