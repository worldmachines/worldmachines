  - id: adams-education#u30-c4
    label: c4
    heading: Modern politics as a struggle of forces
    char_start: 859326
    char_end: 860447
    start_quote: The work of domestic progress is done by masses of mechanical power--steam, electric,
    end_quote: the men tend to succumb to their own motive forces.
    why: Adams's clearest statement here of politics as impersonal mechanical infrastructure rather than
