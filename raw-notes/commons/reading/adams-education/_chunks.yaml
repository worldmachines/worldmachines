    end_quote: give it Form, Unity, and Motive.
    why: Supplies the chapter's clearest formal statement of the Unity/Multiplicity division that Adams
      will later map onto his own century.
  - id: adams-education#u31-c4
    label: c4
    heading: 'The kinetic theory of gases: Unity is Multiplicity'
    char_start: 878491
    char_end: 878961
