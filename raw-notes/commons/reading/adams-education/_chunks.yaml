    char_start: 871426
    char_end: 871882
    start_quote: My dear outcast, what is it you seek?
    end_quote: you see how I am surrounded by the masters of the schools! Ask them!
    why: The Virgin's own voice stakes her claim to Force as simple, personal Love and hands off the rest
      to the Schools, setting up the Unity/Multiplicity split that structures the chapter.
  - id: adams-education#u31-c3
    label: c3
    heading: 'St. Thomas: Love as Unity, the Schools as Multiplicity'
    char_start: 872377
    char_end: 872900
