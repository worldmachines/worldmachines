      future.
    end_quote: American woman had interest infinitely greater than that of any race whatever, Russian
      or Chinese, Asiatic or African.
    why: 'Adams''s own statement of the chapter''s real stakes: he ranks the inertia of sex above the
      inertia of race as the more vital American problem.'
  - id: adams-education#u32-c4
    label: c4
