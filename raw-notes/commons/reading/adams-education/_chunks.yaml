    end_quote: Why was one to be forced to affirm it?
    why: The argument's hinge and the source of the chapter's title image — science's own "final synthesis"
      collapses Unity into Multiplicity.
  - id: adams-education#u31-c5
    label: c5
    heading: The mind as an acrobat over the abyss
    char_start: 884529
    char_end: 885177
