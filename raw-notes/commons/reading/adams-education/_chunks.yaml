  - id: adams-education#u30-c5
    label: c5
    heading: The height of knowledge is the depth of ignorance
    char_start: 866525
    char_end: 867332
    start_quote: Never had the proportions of his ignorance looked so appalling.
    end_quote: Only by comparison of their ignorance could the student measure his own.
    why: Delivers the chapter's titular irony and its closing epistemological verdict.
  - id: adams-education#u30-c6
    label: c6
