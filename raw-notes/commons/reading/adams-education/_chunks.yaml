    heading: 'The two-book scheme: measuring "man as a force"'
    char_start: 2574
    char_end: 3624
    start_quote: Any schoolboy could see that man as a force must be measured
    end_quote: subject to correction from any one who should know better.
    why: This is Adams's own explanation (quoted from Chapter XXIX) of why Chartres and the Education
      exist as a matched pair, and the historical method -- fixed reference points to measure motion --
      that generated both.
  - id: adams-education#u01-c2
    label: c2
    heading: 'Reversing Augustine: from unity to multiplicity'
    char_start: 3873
    char_end: 4188
    start_quote: Probably he saw it in advance, for he used to say, half in jest
    end_quote: reverse the method and work back from unity to multiplicity.
    why: Adams's self-deprecating comparison to Augustine's Confessions is the preface's clearest diagnosis
      of why the Education's literary form defeated him.
  - id: adams-education#u01-c3
    label: c3
    heading: 'Practicing his own theory: silence as the mark of sense'
    char_start: 5437
    char_end: 5813
    start_quote: In the end, he preferred to leave the "Education" unpublished, avowedly incomplete
    end_quote: After midsummer, 1914, the rule was made absolute.
    why: Ties Adams's personal choice to withhold publication directly to his own theory of history, dated
      to the eve of World War I -- the preface's emotional turning point.
  - id: adams-education#u01-c4
    label: c4
    heading: Why the Massachusetts Historical Society publishes it now
    char_start: 5817
    char_end: 6125
    start_quote: The Massachusetts Historical Society now publishes the
    end_quote: reach of students who have occasion to consult them.
    why: States the editorial rationale for this posthumous edition, framing it as access for students
      rather than an override of Adams's own judgment.
