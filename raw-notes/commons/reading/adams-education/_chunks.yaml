- nn: 31
  unit_id: ch-29-the-abyss-of-ignorance
  note_id: adams-education-ch-29-the-abyss-of-ignorance
  span: 867336:887062
  chunks:
  - id: adams-education#u31-c1
    label: c1
    heading: 'Force through history: occult attraction to Pascal''s ennui'
