# Curated chunk sidecar for source `manuel-prophets-of-paris`
# (The Prophets of Paris: Turgot, Condorcet, Saint-Simon, Fourier, and Comte,
# Frank E. Manuel, Harvard University Press 1962; Harper Torchbooks reprint 1965).
#
# license_class: private (in-copyright 1962 Harvard edition) -> verbatim quote text is
# REDACTED from this committed copy per CURATOR.md sec.5 / INGEST-LOCAL.md sec.14.
# start_quote/end_quote are deliberately absent; what remains is text-free provenance:
# chunk id, label, heading, resolved character span into source.txt, and why the passage
# is load-bearing. The full-verbatim sidecars live only in the gated ingest bucket and the
# personal lake -- never in this repo.
#
# Spans are character offsets into the extraction pinned by MANIFEST.json
# sha256 2c857a401a40b267737705b8b55ce5ca65f1a4db816d7cdd725d2fc0f80e675f
# (721201 chars). The source is an OCR text layer over a 500 ppi scan; it keeps the
# PDF's hard line wraps and ~0.1% residual OCR junk, deliberately left uncorrected.
# Each chunk was resolved by locating its start_quote/end_quote (whitespace-tolerant)
# inside its own unit's span; all 82 resolve to a single span. Chunk ids match each
# reading note's `cites:` field.
source: manuel-prophets-of-paris
units:
- nn: 1
  unit_id: preface-prolegomenon
  note_id: manuel-prophets-of-paris-preface-prolegomenon
  span: 2938:27456
  chunks:
  - id: manuel-prophets-of-paris#u01-c1
    label: c1
    heading: Prophets, not sociologists
    char_start: 6942
    char_end: 7201
    why: States the book's organizing category — prophecy over professional discipline — that justifies treating
      five otherwise incompatible thinkers as one lineage.
  - id: manuel-prophets-of-paris#u01-c2
    label: c2
    heading: Crisis philosophers at the great divide
    char_start: 16615
    char_end: 17185
    why: 'Names the shared psychological engine of all five prophets: the conviction that their moment was history''s
      unique hinge-point.'
  - id: manuel-prophets-of-paris#u01-c3
    label: c3
    heading: Intoxicated with the future
    char_start: 17927
    char_end: 18764
    why: Manuel's Montaigne/Pascal-anchored diagnosis of the prophets' devaluation of the present, central to his
      psychological reading of the type.
  - id: manuel-prophets-of-paris#u01-c4
    label: c4
    heading: The state as mere scaffolding
    char_start: 21364
    char_end: 21913
    why: 'States the sociological thesis of the Prolegomenon: all five prophets relocate authentic human problems
      away from the state and toward social/religious life.'
  - id: manuel-prophets-of-paris#u01-c5
    label: c5
    heading: Bearers of good cheer
    char_start: 26425
    char_end: 27447
    why: The closing chorus of prophetic optimism (Saint-Simon, Fourier, Enfantin), immediately undercut by Manuel's
      own skeptical aside, capturing the book's ambivalent tone toward its subjects.
- nn: 2
  unit_id: turgot-01
  note_id: manuel-prophets-of-paris-turgot-01
  span: 27456:93549
  chunks:
  - id: manuel-prophets-of-paris#u02-c1
    label: c1
    heading: The Sorbonne discourses found the ideology of progress
    char_start: 28283
    char_end: 28718
    why: States Manuel's central claim that Turgot's 1750 orations are the founding text of the modern secular ideology
      of progress.
  - id: manuel-prophets-of-paris#u02-c2
    label: c2
    heading: A new religion born inside the old
    char_start: 29960
    char_end: 30255
    why: 'Manuel''s key thesis line: the ideology of progress emerges as a transposed eschatology from within Christian
      institutions themselves.'
  - id: manuel-prophets-of-paris#u02-c3
    label: c3
    heading: The innate drive to novelty
    char_start: 40296
    char_end: 40862
    why: Identifies the near-innate psychological drive to innovate that Turgot makes the axiomatic bedrock of his
      whole system, comparable to a proto-conatus.
  - id: manuel-prophets-of-paris#u02-c4
    label: c4
    heading: The war between novelty and routine
    char_start: 40863
    char_end: 41172
    why: 'States the core dialectic organizing Turgot''s philosophy of history: institutionalized routine versus
      the spirit of innovation.'
  - id: manuel-prophets-of-paris#u02-c5
    label: c5
    heading: Genius as a natural constant
    char_start: 63640
    char_end: 63974
    why: Turgot's own vivid formulation of genius as a mineable natural resource, the mechanism directly inherited
      by Condorcet's and Saint-Simon's genius-subsidy schemes.
  - id: manuel-prophets-of-paris#u02-c6
    label: c6
    heading: 'Theological, metaphysical, positive: proto-Comte'
    char_start: 74849
    char_end: 75525
    why: The passage Manuel flags as containing Comte's later law of the three states already in embryo, linking
      this unit forward to the volume's later chapters.
- nn: 3
  unit_id: turgot-02
  note_id: manuel-prophets-of-paris-turgot-02
  span: 93549:119900
  chunks:
  - id: manuel-prophets-of-paris#u03-c1
    label: c1
    heading: The civilizing mission as insurance against retrogression
    char_start: 98138
    char_end: 98579
    why: 'States Turgot''s extensive-progress doctrine in its starkest form: civilization is safe only once it has
      annexed the entire globe, a totalizing convergence logic central to the unit''s argument.'
  - id: manuel-prophets-of-paris#u03-c2
    label: c2
    heading: Mathematics as the final security of knowledge
    char_start: 101361
    char_end: 101958
    why: Shows Turgot's belief that mathematization would armor moral knowledge against passion and depoliticize
      social conflict, anticipating Condorcet's probabilistic social science.
  - id: manuel-prophets-of-paris#u03-c3
    label: c3
    heading: The immense army directed by a great genius
    char_start: 108978
    char_end: 109919
    why: 'Turgot''s own words giving the theodicy its central image: blind passions unknowingly executing a providential
      design invisible to the actors themselves.'
  - id: manuel-prophets-of-paris#u03-c4
    label: c4
    heading: Progress as vindication of providential design
    char_start: 113083
    char_end: 113403
    why: The direct theological payoff of the progress doctrine, in Turgot's own words as preserved by Condorcet,
      tying the essay's theodicy argument to its source.
  - id: manuel-prophets-of-paris#u03-c5
    label: c5
    heading: The philosophes give way to the men of action
    char_start: 119468
    char_end: 119896
    why: Closes the unit on the generational hinge from Enlightenment philosophy to revolutionary action that structures
      Manuel's larger narrative across Turgot, Condorcet, Saint-Simon, and Comte.
- nn: 4
  unit_id: condorcet-01
  note_id: manuel-prophets-of-paris-condorcet-01
  span: 119900:183456
  chunks:
  - id: manuel-prophets-of-paris#u04-c1
    label: c1
    heading: The snow-capped volcano
    char_start: 122476
    char_end: 122790
    why: Establishes Manuel's central psychological thesis that Condorcet's public rationalist calm concealed a
      suffering, volcanic emotional interior.
  - id: manuel-prophets-of-paris#u04-c2
    label: c2
    heading: History as a science to tame the future
    char_start: 145785
    char_end: 146538
    why: 'States the chapter''s thesis: Condorcet''s secularized history aims at genuine prediction and control
      of the future, the Esquisse''s most psychohistory-like ambition.'
  - id: manuel-prophets-of-paris#u04-c3
    label: c3
    heading: Bookkeeping as the mechanism of moral progress
    char_start: 150191
    char_end: 150648
    why: Shows the utilitarian, calculative mechanism Condorcet imputes to historical change, reducing moral advance
      to accounting logic.
  - id: manuel-prophets-of-paris#u04-c4
    label: c4
    heading: Genius as statistical probability
    char_start: 169531
    char_end: 170181
    why: 'Marks Condorcet''s key revision of Turgot: progress relocated from rare individual genius to a statistical
      function of mass education.'
  - id: manuel-prophets-of-paris#u04-c5
    label: c5
    heading: Universal science, unquestioned
    char_start: 182437
    char_end: 183315
    why: Manuel's culminating critique of the Eurocentric universalism latent in Condorcet's egalitarian optimism,
      foreshadowing Saint-Simon's civilizing mission.
- nn: 5
  unit_id: condorcet-02
  note_id: manuel-prophets-of-paris-condorcet-02
  span: 183456:235184
  chunks:
  - id: manuel-prophets-of-paris#u05-c1
    label: c1
    heading: Progress as a moral absolute
    char_start: 184116
    char_end: 185314
    why: States the unit's foundational claim that Condorcet converts progress from description into a moral duty
      whose deceleration is treated as sin.
  - id: manuel-prophets-of-paris#u05-c2
    label: c2
    heading: The love of truth as recruiting force
    char_start: 199335
    char_end: 199611
    why: Condorcet's own words on why scientists would voluntarily join his planned world society, the key move
      that reconciles organization with liberty.
  - id: manuel-prophets-of-paris#u05-c3
    label: c3
    heading: A state run by social mathematics
    char_start: 219182
    char_end: 219542
    why: Manuel's sharpest formulation of the technocratic endpoint implicit in Condorcet's quantification project,
      explicitly framed as a leap past parliamentary politics.
  - id: manuel-prophets-of-paris#u05-c4
    label: c4
    heading: The vanguard pulling humanity forward
    char_start: 232119
    char_end: 232846
    why: Manuel's central image of progress as a scientific elite dragging the rest of mankind along an open plain,
      capturing the vanguardist logic of the doctrine.
  - id: manuel-prophets-of-paris#u05-c5
    label: c5
    heading: Progress as the new god
    char_start: 234119
    char_end: 235111
    why: The Esquisse's closing apotheosis of progress into a substitute religion, quoted at length as the chapter's
      culminating statement.
- nn: 6
  unit_id: saint-simon-01
  note_id: manuel-prophets-of-paris-saint-simon-01
  span: 235184:294716
  chunks:
  - id: manuel-prophets-of-paris#u06-c1
    label: c1
    heading: The picaresque prophet
    char_start: 236399
    char_end: 237073
    why: 'Establishes Manuel''s central framing device: Saint-Simon as an improbable, Gil-Blas-like figure possessed
      by the spirit of prophecy despite his character.'
  - id: manuel-prophets-of-paris#u06-c2
    label: c2
    heading: Scientists as the floating elite
    char_start: 260318
    char_end: 261286
    why: States Saint-Simon's earliest, Condorcet-derived theory that scientists as a classless elite could arbitrate
      the war between propertied and propertyless.
  - id: manuel-prophets-of-paris#u06-c3
    label: c3
    heading: Anarchist scientists denounced
    char_start: 267339
    char_end: 267784
    why: Captures the frenzied, personally wounded register of Saint-Simon's mid-career turn against the official
      scientific establishment.
  - id: manuel-prophets-of-paris#u06-c4
    label: c4
    heading: Genius bound by the law of circumstances
    char_start: 266541
    char_end: 266835
    why: His theory that even a Lagrange or Laplace is a product of historical circumstance rather than pure genius,
      an early version of impersonal, distributed historical determinism.
  - id: manuel-prophets-of-paris#u06-c5
    label: c5
    heading: Not equality but self-expression
    char_start: 286074
    char_end: 286987
    why: States the pivot from Enlightenment egalitarianism to Saint-Simon's organicist doctrine of natural, unequal
      functional types, explicitly borrowed from counter-revolutionary theocrats.
  - id: manuel-prophets-of-paris#u06-c6
    label: c6
    heading: The organism versus the clockwork
    char_start: 290322
    char_end: 290900
    why: Defines the organic/mechanical opposition at the heart of Saint-Simon's mature social theory, with love
      as the vitalizing force binding functionally differentiated classes.
- nn: 7
  unit_id: saint-simon-02
  note_id: manuel-prophets-of-paris-saint-simon-02
  span: 294716:339652
  chunks:
  - id: manuel-prophets-of-paris#u07-c1
    label: c1
    heading: The universality of the power drive
    char_start: 294878
    char_end: 295395
    why: States the anthropological problem—an apparently indestructible will to dominate—that Saint-Simon's entire
      industrial-society theory must dissolve or redirect.
  - id: manuel-prophets-of-paris#u07-c2
    label: c2
    heading: Redirecting aggression from man onto nature
    char_start: 297027
    char_end: 297338
    why: Saint-Simon's own formulation of the mechanism—power lust rechanneled from human domination to the exploitation
      of nature—that Manuel says anticipates both Marx and Freud.
  - id: manuel-prophets-of-paris#u07-c3
    label: c3
    heading: The state reduced to nothing
    char_start: 312936
    char_end: 313483
    why: The clearest statement of Saint-Simon's de facto withering-away-of-the-state thesis, grounding his vision
      of a purely administered industrial society.
  - id: manuel-prophets-of-paris#u07-c4
    label: c4
    heading: Recasting Christianity for the poorest class
    char_start: 320226
    char_end: 320552
    why: Introduces the watchword phrase 'the poorest and most numerous class' that defines the New Christianity's
      moral content and would become the Saint-Simonian movement's rallying cry.
  - id: manuel-prophets-of-paris#u07-c5
    label: c5
    heading: Christianity reduced to the Golden Rule
    char_start: 318285
    char_end: 318681
    why: The core doctrinal reduction of the New Christianity to a single monist commandment, the pivot on which
      Saint-Simon's religious manifesto turns.
  - id: manuel-prophets-of-paris#u07-c6
    label: c6
    heading: The deathbed prophecy of a new belief filling the void
    char_start: 338674
    char_end: 339644
    why: Saint-Simon's last testimony explicitly frames the Catholic order's collapse as opening a void that a new
      belief must fill—an almost literal description of a Gramsci-gap interregnum.
- nn: 8
  unit_id: children-01
  note_id: manuel-prophets-of-paris-children-01
  span: 339652:397865
  chunks:
  - id: manuel-prophets-of-paris#u08-c1
    label: c1
    heading: Enfantin's three faces of love
    char_start: 351453
    char_end: 352311
    why: Manuel's fullest statement of Enfantin's typology of love, the doctrinal core over which the Saint-Simonian
      church split into schisms.
  - id: manuel-prophets-of-paris#u08-c2
    label: c2
    heading: The malady of the age and the renunciation of war machines
    char_start: 359015
    char_end: 360723
    why: States the Saint-Simonians' own diagnosis of a civilizational interregnum, then quotes their inaugural
      renunciation of antagonism as the ruling principle of history.
  - id: manuel-prophets-of-paris#u08-c3
    label: c3
    heading: Man as tripartite being
    char_start: 375889
    char_end: 377037
    why: The clearest statement of the Saint-Simonian redefinition of man as irreducibly tripartite (reason, action,
      feeling), the anthropology underlying their whole social theory.
  - id: manuel-prophets-of-paris#u08-c4
    label: c4
    heading: Kant's Antagonism converted into a law of progress
    char_start: 384318
    char_end: 385440
    why: Traces the direct line from Kant's 1784 concept of Antagonism into Saint-Simonian philosophy of history,
      showing how they converted a dialectical mechanism into a doctrine of guaranteed progress.
  - id: manuel-prophets-of-paris#u08-c5
    label: c5
    heading: Organic and critical epochs
    char_start: 391447
    char_end: 392467
    why: States the organic/critical alternation, the Saint-Simonians' most systematic model of historical rhythm
      and a direct ancestor of Comte's and Marx's stage theories.
- nn: 9
  unit_id: children-02
  note_id: manuel-prophets-of-paris-children-02
  span: 397865:441732
  chunks:
  - id: manuel-prophets-of-paris#u09-c1
    label: c1
    heading: Each according to his capacity
    char_start: 399549
    char_end: 400125
    why: States the Saint-Simonian motto and its presupposition of an expert hierarchy that renders every capacity
      legible and assignable, the doctrine's technocratic core.
  - id: manuel-prophets-of-paris#u09-c2
    label: c2
    heading: The unitary directing bank
    char_start: 403140
    char_end: 404878
    why: Lays out the central-bank utopia of total credit allocation, Manuel's key evidence for reading Saint-Simonism
      as a technocratic/legibility project anticipating modern planning.
  - id: manuel-prophets-of-paris#u09-c3
    label: c3
    heading: Hierarchy versus totalitarianism
    char_start: 404879
    char_end: 405884
    why: Manuel's explicit editorial argument distinguishing hierarchical order from totalitarianism while conceding
      its affinity with modern bureaucratic and welfare-state structures.
  - id: manuel-prophets-of-paris#u09-c4
    label: c4
    heading: Enfantin on the rehabilitation of the flesh
    char_start: 427510
    char_end: 428173
    why: The direct courtroom quotation is the movement's most vivid self-articulation of its sexual doctrine, delivered
      as theater during the 1832 trial.
  - id: manuel-prophets-of-paris#u09-c5
    label: c5
    heading: The Menilmontant costume
    char_start: 422176
    char_end: 422685
    why: A concrete, symbolic image of the cult's embodied cosmology (color-coded virtues, individually inscribed
      names) that anchors the abstract doctrine in lived ritual.
- nn: 10
  unit_id: fourier-01
  note_id: manuel-prophets-of-paris-fourier-01
  span: 441732:500026
  chunks:
  - id: manuel-prophets-of-paris#u10-c1
    label: c1
    heading: The apple of Fevrier's Restaurant
    char_start: 444204
    char_end: 445107
    why: Manuel's chosen origin-myth for the whole system, explicitly paralleling Fourier's revelation with Newton's
      apple to dramatize his self-conception as discoverer of a law of passionate attraction.
  - id: manuel-prophets-of-paris#u10-c2
    label: c2
    heading: Ecart absolu — the methodological rupture
    char_start: 473754
    char_end: 474165
    why: Fourier's own statement of ecart absolu, the deliberate total break from prior philosophy that Manuel identifies
      as the doctrine's methodological keystone.
  - id: manuel-prophets-of-paris#u10-c3
    label: c3
    heading: Human nature accepted, not reformed
    char_start: 467720
    char_end: 468179
    why: 'Fourier''s letter to Considerant states the core divergence from the Saint-Simonians: passions are fixed
      drives to be gratified, not raw material for moral reformation.'
  - id: manuel-prophets-of-paris#u10-c4
    label: c4
    heading: Venus over the philosophes
    char_start: 484253
    char_end: 484670
    why: Fourier's refusal to soften his doctrine of love shows why he treated the erotic reorganization of society,
      not labor, as harmony's non-negotiable core.
  - id: manuel-prophets-of-paris#u10-c5
    label: c5
    heading: Civilization as a prison
    char_start: 476631
    char_end: 477060
    why: States plainly Fourier's rejection of ameliorative progress in favor of total abolition, distinguishing
      his radicalism from Turgot's, Condorcet's, and Saint-Simon's melioristic narratives.
  - id: manuel-prophets-of-paris#u10-c6
    label: c6
    heading: Civilization as reign of violence and cunning
    char_start: 488162
    char_end: 488587
    why: Fourier's own words indict civilized order as coercion sustained by executioners and prisons, the strongest
      statement of his view that political science and morality are themselves unnatural.
- nn: 11
  unit_id: fourier-02
  note_id: manuel-prophets-of-paris-fourier-02
  span: 500026:535768
  chunks:
  - id: manuel-prophets-of-paris#u11-c1
    label: c1
    heading: The tree of the twelve passions
    char_start: 500833
    char_end: 501658
    why: Lays out the core taxonomic structure of Fourier's whole psychological system — trunk and three branches.
  - id: manuel-prophets-of-paris#u11-c2
    label: c2
    heading: Passions as the invariant foundation of morality
    char_start: 514595
    char_end: 515142
    why: Fourier's own words showing why he grounds ethics in fixed passions rather than reason or custom, the key
      move behind his relativism.
  - id: manuel-prophets-of-paris#u11-c3
    label: c3
    heading: Repression produces the counterpassion, not the absence of passion
    char_start: 523026
    char_end: 524154
    why: States Fourier's central psychological thesis — that repression only deforms passion into a malignant double,
      never eliminates it.
  - id: manuel-prophets-of-paris#u11-c4
    label: c4
    heading: The Lady Strogonoff case history
    char_start: 527093
    char_end: 528408
    why: Fourier's concrete illustrative case for how suffocated love turns into cruelty, his clearest proto-psychoanalytic
      vignette.
  - id: manuel-prophets-of-paris#u11-c5
    label: c5
    heading: Theodicy of the bloodthirsty passion
    char_start: 534635
    char_end: 535683
    why: 'Shows Fourier pushing providential design to its limit: every destructive passion is divinely purposeful
      and repressing any of them is insurrection against God.'
  - id: manuel-prophets-of-paris#u11-c6
    label: c6
    heading: Happiness as permanent frenzy
    char_start: 518695
    char_end: 519129
    why: Early 1799 manifesto passage capturing Fourier's vision of harmony as literally unending gratification,
      foundational to his whole later system.
- nn: 12
  unit_id: fourier-03
  note_id: manuel-prophets-of-paris-fourier-03
  span: 535768:566614
  chunks:
  - id: manuel-prophets-of-paris#u12-c1
    label: c1
    heading: Abundance dissolves the sting of inequality
    char_start: 539129
    char_end: 539668
    why: 'States Fourier''s central economic move: hierarchy is retained in form but stripped of psychological stakes
      by universal luxury.'
  - id: manuel-prophets-of-paris#u12-c2
    label: c2
    heading: Thirty-seven million Homers
    char_start: 540836
    char_end: 541327
    why: Fourier's own hyperbolic arithmetic argument that talent-scarcity is civilization's artifact, not nature's
      law.
  - id: manuel-prophets-of-paris#u12-c3
    label: c3
    heading: Composite refusal and the psychology of multiplicity
    char_start: 545261
    char_end: 545925
    why: Shows Fourier's foundational axiom — plurality and complexity as the source of freedom, exclusivity as
      the source of disaster — enacted as social ritual.
  - id: manuel-prophets-of-paris#u12-c4
    label: c4
    heading: The deliberate mask of Harlequin
    char_start: 555510
    char_end: 557537
    why: Fourier's own retrospective account of using cosmological absurdity as calculated camouflage for his radical
      doctrines — the interpretive crux of the psychobiographical turn.
  - id: manuel-prophets-of-paris#u12-c5
    label: c5
    heading: France punished for mocking the calculus of attraction
    char_start: 562133
    char_end: 562613
    why: The clearest textual evidence for Manuel's reading of Fourier's paranoid, vengeful megalomania beneath
      the utopia of love.
  - id: manuel-prophets-of-paris#u12-c6
    label: c6
    heading: Love born of fantasies of hate
    char_start: 566042
    char_end: 566610
    why: Manuel's closing psychoanalytic thesis, tying the entire unit's material together into a single interpretive
      claim about Fourier's psyche.
- nn: 13
  unit_id: comte-01
  note_id: manuel-prophets-of-paris-comte-01
  span: 566614:623930
  chunks:
  - id: manuel-prophets-of-paris#u13-c1
    label: c1
    heading: Mill's epigraph on Comte's systematizing
    char_start: 566843
    char_end: 567332
    why: Mill's epigraph names the totalizing, legibility-obsessed drive the whole chapter goes on to document in
      Comte's life and system.
  - id: manuel-prophets-of-paris#u13-c2
    label: c2
    heading: The psychology of the break with Saint-Simon
    char_start: 572773
    char_end: 573059
    why: Comte's own retrospective diagnosis of the rupture shows him reading his master's psychology as historical
      process, before their conflict had even fully played out.
  - id: manuel-prophets-of-paris#u13-c3
    label: c3
    heading: The disputed publication of the Système
    char_start: 576295
    char_end: 577591
    why: The concrete mechanics of the authorship dispute (whose name, how many copies, whose introduction) show
      the material stakes behind decades of mutual recrimination.
  - id: manuel-prophets-of-paris#u13-c4
    label: c4
    heading: Meeting Clothilde de Vaux
    char_start: 593859
    char_end: 594382
    why: Introduces the relationship that Manuel treats as the generative emotional source of the later Religion
      of Humanity.
  - id: manuel-prophets-of-paris#u13-c5
    label: c5
    heading: Clothilde's death
    char_start: 595362
    char_end: 595998
    why: The scene of Comte excluding her family to die alone with her sets up his decades of ritual mourning and
      the cult built on her memory.
  - id: manuel-prophets-of-paris#u13-c6
    label: c6
    heading: Grand Prêtre de l'Humanité
    char_start: 605335
    char_end: 605815
    why: Comte's explicit self-declaration as more sacred than the Pope is the chapter's culminating claim to embody
      the Great Being, tying private mania to public religious system-building.
- nn: 14
  unit_id: comte-02
  note_id: manuel-prophets-of-paris-comte-02
  span: 623930:675446
  chunks:
  - id: manuel-prophets-of-paris#u14-c1
    label: c1
    heading: High Priest of Humanity
    char_start: 624662
    char_end: 624888
    why: 'States Manuel''s central framing device for the whole chapter: Comte as the priest who closes the prophetic
      era and institutes sacerdotal system-building.'
  - id: manuel-prophets-of-paris#u14-c2
    label: c2
    heading: Three ages of humanity
    char_start: 633663
    char_end: 634223
    why: Comte's own summary formula for the law of the three states correlated with modes of activity and ages
      of humanity, the core mechanism of his historical legibility project.
  - id: manuel-prophets-of-paris#u14-c3
    label: c3
    heading: Madness as historical psychology
    char_start: 639490
    char_end: 639975
    why: Grounds the law of three states in Comte's lived psychological regression, Manuel's key evidence that the
      system is autobiography elevated to cosmic law.
  - id: manuel-prophets-of-paris#u14-c4
    label: c4
    heading: Letter to Clothilde de Vaux
    char_start: 664527
    char_end: 665346
    why: Primary-source hinge document marking Comte's turn from intellectualist system-building to a religion organized
      around love.
  - id: manuel-prophets-of-paris#u14-c5
    label: c5
    heading: Games and the gaie science
    char_start: 673942
    char_end: 674675
    why: Comte's final utopian vision dissolving labor and science into aesthetic play, the endpoint Manuel likens
      to both Nietzsche's Gay Science and Marx's post-labor utopia.
- nn: 15
  unit_id: epilogue
  note_id: manuel-prophets-of-paris-epilogue
  span: 675446:721201
  chunks:
  - id: manuel-prophets-of-paris#u15-c1
    label: c1
    heading: 'Turgot: a system as a tomb'
    char_start: 676223
    char_end: 676564
    why: Turgot's image of closed philosophical systems as death-monuments frames the epilogue's opening contrast
      between eighteenth-century tentativeness and nineteenth-century dogmatic system-building.
  - id: manuel-prophets-of-paris#u15-c2
    label: c2
    heading: Hegel's twilight versus the prophets' dawn
    char_start: 680388
    char_end: 680783
    why: The Hegel quotation and Manuel's rejoinder is the epilogue's central structural contrast, distinguishing
      retrospective German philosophy from the French prophets' future-facing, activist commitment.
  - id: manuel-prophets-of-paris#u15-c3
    label: c3
    heading: 'Saint-Simon: the philosopher as actor'
    char_start: 682363
    char_end: 682658
    why: Saint-Simon's self-definition of the philosopher-historian as an actor whose opinions govern society exemplifies
      the determinism-plus-activism thesis Manuel attributes to all five prophets.
  - id: manuel-prophets-of-paris#u15-c4
    label: c4
    heading: Marx's Gotha Programme formula
    char_start: 716747
    char_end: 717354
    why: Manuel's proof-text that Marx's canonical communist formula is a direct syncretism of Saint-Simonian and
      Fourierist phrasing, establishing the prophets' concrete influence on later political thought.
  - id: manuel-prophets-of-paris#u15-c5
    label: c5
    heading: The absent tragic sense
    char_start: 719887
    char_end: 721201
    why: 'This closing judgment delivers the epilogue''s — and the book''s — final verdict on the prophets'' shared
      blind spot: their historical optimism foreclosed any confrontation with meaningless fate.'
