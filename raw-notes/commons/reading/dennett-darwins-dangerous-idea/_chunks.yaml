source: dennett-darwins-dangerous-idea
units:
- nn: 1
  unit_id: preface
  note_id: dennett-darwins-dangerous-idea-preface
  span: 5521:15085
  chunks:
  - id: dennett-darwins-dangerous-idea#u01-c1
    heading: Darwin's idea and the resistance to it
    span: 5530:6118
    why: 'States the book''s central thesis: Darwin''s idea is powerful and offers a new foundation for
      meaning rather than a threat to it.'
  - id: dennett-darwins-dangerous-idea#u01-c2
    heading: Persuasion, not proof
    span: 6218:6794
    why: Dennett's explicit admission that the book operates by rhetoric and persuasion rather than scientific
      or formal proof.
  - id: dennett-darwins-dangerous-idea#u01-c3
    heading: Why I tell a story instead of arguing
    span: 9180:10272
    why: 'The preface''s centerpiece: a philosopher conceding that rigorous arguments are ignored, so
      he substitutes narrative to change what readers will actually consider.'
  - id: dennett-darwins-dangerous-idea#u01-c4
    heading: Navigating dismissal and infighting
    span: 10769:11007
    why: Names the methodological balance Dennett strikes between glossing over controversies and getting
      lost in them, and his commitment to flagging shortcuts.
- nn: 2
  unit_id: ch01-tell-me-why
  note_id: dennett-darwins-dangerous-idea-ch01-tell-me-why
  span: 15085:61098
  chunks:
  - id: dennett-darwins-dangerous-idea#u02-c1
    heading: 'The thesis: a dangerous idea that cannot be quarantined'
    span: 17522:17912
    why: 'States the book''s central claim baldly: Darwin''s idea threatens fundamental beliefs more deeply
      than its own defenders usually concede, setting up the whole book''s argumentative stance.'
  - id: dennett-darwins-dangerous-idea#u02-c2
    heading: Dennett's stance and method
    span: 28465:29553
    why: Dennett's personal ranking of Darwin's idea above Newton's and Einstein's, and his explicit commitment
      to confront rather than soften its implications, frames the book's method.
  - id: dennett-darwins-dangerous-idea#u02-c3
    heading: Teleology and the regress of "why"
    span: 34717:35632
    why: Defines teleological explanation and dramatizes, via the sawing-a-board dialogue, the infinite-regress
      problem that Aristotle's telos and later Locke and Hume all try and fail to close off.
  - id: dennett-darwins-dangerous-idea#u02-c4
    heading: Locke's proof that Mind must be eternal
    span: 44365:44910
    why: The core deductive step of Locke's "proof" of Mind-first cosmogony — the premise that Darwin's
      mindless mechanism would later make obsolete.
  - id: dennett-darwins-dangerous-idea#u02-c5
    heading: Philo's near-miss on natural selection
    span: 51968:52472
    why: Hume's Philo imagines a blind, iterative, trial-and-error process producing apparent design a
      century before Darwin — the clearest textual anticipation in the chapter, immediately followed by
      Hume's failure to take it seriously.
- nn: 3
  unit_id: ch02-an-idea-is-born
  note_id: dennett-darwins-dangerous-idea-ch02-an-idea-is-born
  span: 61098:132012
  chunks:
  - id: dennett-darwins-dangerous-idea#u03-c1
    heading: Aristotelian essentialism
    span: 63826:64369
    why: Defines the essentialist metaphysics — species as fixed, timeless kinds — that Darwin's idea
      of evolving species had to overturn.
  - id: dennett-darwins-dangerous-idea#u03-c2
    heading: Naming Darwin's dangerous idea
    span: 79384:80019
    why: The passage where Dennett names the book's title concept directly and ties it to the logical
      core of natural selection.
  - id: dennett-darwins-dangerous-idea#u03-c3
    heading: Adaptation explained, diversity only assumed
    span: 82051:83427
    why: Following Gould, marks the gap between what Darwin's argument actually proves (adaptation) and
      what the book's title promises (origin of species).
  - id: dennett-darwins-dangerous-idea#u03-c4
    heading: Three properties of an algorithm
    span: 103851:105332
    why: Defines the algorithm concept — substrate neutrality, mindlessness, guaranteed results — that
      reframes natural selection for the rest of the book.
  - id: dennett-darwins-dangerous-idea#u03-c5
    heading: Not designed to produce us
    span: 118148:119748
    why: 'States the chapter''s anti-teleological punchline: evolution can be algorithmic and have produced
      us without being an algorithm for producing us.'
- nn: 4
  unit_id: ch03-universal-acid
  note_id: dennett-darwins-dangerous-idea-ch03-universal-acid
  span: 132012:193268
  chunks:
  - id: dennett-darwins-dangerous-idea#u04-c1
    heading: The Universal Acid Metaphor
    span: 136500:137531
    why: 'Names the chapter''s title image and states the book''s central claim: Darwin''s idea corrodes
      every traditional concept it touches while leaving the world recognizable but transformed.'
  - id: dennett-darwins-dangerous-idea#u04-c2
    heading: 'Order Versus Design: Darwin''s Inversion'
    span: 142430:142884
    why: Dennett's most compact statement of Darwin's core inversion — trading a First Mind for mere Order
      plus time — and why Marx read it as a death blow to teleology.
  - id: dennett-darwins-dangerous-idea#u04-c3
    heading: Defining Skyhooks and Cranes
    span: 172284:172939
    why: 'The chapter''s load-bearing terminology: a skyhook is a miraculous mind-first exception, a crane
      an evolved, explicable subprocess — the pair against which every later case is measured.'
  - id: dennett-darwins-dangerous-idea#u04-c4
    heading: The Baldwin Effect as a Crane
    span: 182898:183964
    why: Shows a worked example of a crane in detail — individual learning speeding evolutionary discovery
      without any skyhook-grade Mind — and states the chapter's recurring pattern of skyhook-hunts ending
      in crane-finds.
  - id: dennett-darwins-dangerous-idea#u04-c5
    heading: Good Reductionism vs. Greedy Reductionism
    span: 192166:192890
    why: Dennett's own compressed chapter summary and citable definition of the good-versus-greedy-reductionism
      distinction that organizes the whole chapter.
- nn: 5
  unit_id: ch04-the-tree-of-life
  note_id: dennett-darwins-dangerous-idea-ch04-the-tree-of-life
  span: 193268:236567
  chunks:
  - id: dennett-darwins-dangerous-idea#u05-c1
    heading: The Tree of Life as a formal graph
    span: 194572:195692
    why: This is Dennett's formal definition of the Tree of Life as a graph of birth-to-death time lines
      and offspring branches, the object the rest of the chapter and book reason about.
  - id: dennett-darwins-dangerous-idea#u05-c2
    heading: The eukaryotic revolution
    span: 196014:197083
    why: Marks the first of the Tree's two biggest forks and links it to the Design Space vocabulary the
      book is building.
  - id: dennett-darwins-dangerous-idea#u05-c3
    heading: Species as branches, not essences
    span: 208683:209871
    why: States plainly that species boundaries are pragmatic choices with no hidden essence to discover,
      the chapter's central anti-essentialist claim.
  - id: dennett-darwins-dangerous-idea#u05-c4
    heading: Speciation can only be crowned retrospectively
    span: 215216:215918
    why: The chapter's key epistemic claim, that speciation is unwitnessable at the time it occurs and
      identifiable only after the fact, which is the passage that resonates with WMP's history-machine
      idea.
  - id: dennett-darwins-dangerous-idea#u05-c5
    heading: Giraffe necks and contrastive explanation
    span: 234272:234886
    why: A compact worked example of Dennett's contrastive, level-appropriate explanation, the method
      the chapter's closing argument defends.
  - id: dennett-darwins-dangerous-idea#u05-c6
    heading: Jokes have no author, like species
    span: 223531:224884
    why: Dennett's own analogy for authorless, distributed emergence, directly parallel to the history-machine's
      silent, distributed assembly against great-men narratives.
- nn: 6
  unit_id: ch05-the-possible-and-the-actual
  note_id: dennett-darwins-dangerous-idea-ch05-the-possible-and-the-actual
  span: 236567:285444
  chunks:
  - id: dennett-darwins-dangerous-idea#u06-c1
    heading: Four grades of possibility
    span: 237583:238819
    why: States the chapter's foundational taxonomy (logical/physical/biological/historical possibility)
      that the rest of the chapter works to naturalize.
  - id: dennett-darwins-dangerous-idea#u06-c2
    heading: 'Vast and Vanishingly: sizing the Library'
    span: 247891:249010
    why: Coins the technical vocabulary ("Vast", "Vanishingly") Dennett relies on throughout the book
      to describe design-space scale without resorting to inadequate hyperbole.
  - id: dennett-darwins-dangerous-idea#u06-c3
    heading: A genome is a recipe that needs a reader
    span: 259246:259868
    why: Establishes that DNA cannot specify anything in isolation, which grounds Dennett's later claim
      that complete dinosaur DNA without a dinosaur-DNA-reader could never yield Jurassic Park's dinosaurs.
  - id: dennett-darwins-dangerous-idea#u06-c4
    heading: Dawkins's gene-for-reading argument
    span: 265496:266774
    why: Defends gene-talk against the charge of naive determinism by showing a gene's phenotypic effect,
      and its identity as "the gene for X", is always relative to an environment.
  - id: dennett-darwins-dangerous-idea#u06-c5
    heading: The QWERTY phenomenon
    span: 282931:283717
    why: Supplies Dennett's model for how apparent biological laws (no horned birds, Dollo's Law) may
      really be locked-in historical accidents rather than universal constraints.
  - id: dennett-darwins-dangerous-idea#u06-c6
    heading: Biological possibility redefined as accessibility
    span: 270643:271126
    why: States the chapter's positive thesis, converting the all-or-nothing question of biological possibility
      into a measurable question of distance and accessibility in the Library of Mendel.
- nn: 7
  unit_id: ch06-threads-of-actuality-in-design-space
  note_id: dennett-darwins-dangerous-idea-ch06-threads-of-actuality-in-design-space
  span: 285444:343009
  chunks:
  - id: dennett-darwins-dangerous-idea#u07-c1
    heading: Drift vs. lifting in Design Space
    span: 289397:290592
    why: 'States the core mechanical distinction of the chapter: selection is what converts random drift
      into cumulative design (''lifting'').'
  - id: dennett-darwins-dangerous-idea#u07-c2
    heading: Defining the forced move
    span: 297099:297868
    why: Gives Dennett's chess analogy for a 'forced move,' the key concept used throughout the rest of
      the book to separate necessity from contingency.
  - id: dennett-darwins-dangerous-idea#u07-c3
    heading: Deep reasons vs. shallow (QWERTY) reasons
    span: 298766:299530
    why: Introduces the deep-vs-shallow distinction underlying the QWERTY phenomenon, Dennett's model
      for historically contingent 'virtual necessities.'
  - id: dennett-darwins-dangerous-idea#u07-c4
    heading: 'The Central Salvo: one Design Space'
    span: 315643:316228
    why: States the chapter's explicit thesis that biological and human design occupy a single unified
      Design Space.
  - id: dennett-darwins-dangerous-idea#u07-c5
    heading: Homology as evidence of copying
    span: 318700:319700
    why: 'Gives the argument-from-homology in its clearest form: idiosyncratic imperfection, not perfection,
      is the signature of shared history.'
  - id: dennett-darwins-dangerous-idea#u07-c6
    heading: Intelligence distributed with no skyhooks
    span: 310943:311333
    why: Names the book's anti-skyhook thesis directly and is the strongest resonance point with WMP's
      history-machine model of distributed paradigm-formation.
- nn: 8
  unit_id: ch07-back-beyond-darwins-frontier
  note_id: dennett-darwins-dangerous-idea-ch07-back-beyond-darwins-frontier
  span: 343009:382183
  chunks:
  - id: dennett-darwins-dangerous-idea#u08-c1
    heading: Skyhooks postponed, cranes resumed
    span: 358847:359668
    why: 'States the chapter''s organizing thesis: crane-style Darwinian explanation must be pushed recursively
      below Darwin''s own starting point rather than resorting to a skyhook.'
  - id: dennett-darwins-dangerous-idea#u08-c2
    heading: Dawkins' regress argument against a designer of replication
    span: 352572:353499
    why: The key rebuttal Dennett relies on for why invoking God to explain the origin of replicating
      machinery is self-defeating rather than explanatory.
  - id: dennett-darwins-dangerous-idea#u08-c3
    heading: 'Naming the first replicators: "macros"'
    span: 364050:364836
    why: Resolves the paradox of a 'first' living thing by naming the pre-cellular, non-parasitic self-replicators
      that predate life proper.
  - id: dennett-darwins-dangerous-idea#u08-c4
    heading: Cairns-Smith's clay scaffold and "naked genes"
    span: 367260:368095
    why: Gives the chapter's most concrete image of a disposable, non-miraculous scaffold (clay crystals)
      bootstrapping the earliest replicators.
  - id: dennett-darwins-dangerous-idea#u08-c5
    heading: 'Eigen''s hypercycle: the vicious circle turned friendly'
    span: 372739:373413
    why: The mechanism that breaks Maynard Smith's chicken-and-egg RNA/protein paradox, and the unit's
      strongest resonance with distributed, non-teleological emergence.
  - id: dennett-darwins-dangerous-idea#u08-c6
    heading: Tournament of luck becomes tournament of skill
    span: 374198:375150
    why: Explains how purely syntactic, meaningless replicator competition generates the biased populations
      that semantic, code-bearing fitness later builds on.
- nn: 9
  unit_id: ch07-laws-of-the-game-of-life
  note_id: dennett-darwins-dangerous-idea-ch07-laws-of-the-game-of-life
  span: 382183:437772
  chunks:
  - id: dennett-darwins-dangerous-idea#u09-c1
    heading: The Life Physics rule
    span: 391714:392228
    why: This is the single, exceptionless law that generates the entire Life world, and the chapter's
      whole argument about Order vs. Design depends on its simplicity and completeness.
  - id: dennett-darwins-dangerous-idea#u09-c2
    heading: Ontology shifts between the physical and design levels
    span: 397216:397793
    why: States Dennett's clearest claim that moving from physical-level cells to design-level objects
      like gliders changes what exists, even though the design level adds nothing not already implied
      by the physics.
  - id: dennett-darwins-dangerous-idea#u09-c3
    heading: God the Artificer becomes God the Lawfinder
    span: 412480:413493
    why: This is the chapter's theological payoff, where the Conway thought experiment is cashed out as
      an argument that discovering elegant laws requires a less and less personal, less and less intelligent
      Lawgiver.
  - id: dennett-darwins-dangerous-idea#u09-c4
    heading: Smolin's cosmological natural selection
    span: 415311:415717
    why: Presents the strongest candidate Dennett offers for a genuinely selection-based Darwinian explanation
      of fine-tuned physical constants, as opposed to a merely eternity-based one.
  - id: dennett-darwins-dangerous-idea#u09-c5
    heading: Nietzsche's demon of eternal recurrence
    span: 428971:429603
    why: The passage that makes vivid, rather than merely argued, why eternal recurrence was received
      as either horrifying or transfiguring, framing the chapter's turn to existentialism.
  - id: dennett-darwins-dangerous-idea#u09-c6
    heading: Self-created meaning against the Robbins parody
    span: 431494:432396
    why: 'Extracts the existentialist thesis Dennett is building toward: meaning that survives repetition
      must be created by the participants themselves, not handed down from a Creator.'
- nn: 10
  unit_id: ch08-engineering-and-meaning
  note_id: dennett-darwins-dangerous-idea-ch08-engineering-and-meaning
  span: 437772:490470
  chunks:
  - id: dennett-darwins-dangerous-idea#u10-c1
    heading: The engineering perspective as "obligatory organizer"
    span: 438626:439526
    why: 'States the chapter''s central thesis: engineering is not an optional lens on biology but the
      obligatory organizing principle of all Darwinian thinking.'
  - id: dennett-darwins-dangerous-idea#u10-c2
    heading: The wild type as abstraction
    span: 450762:451430
    why: 'Shows Dennett''s anti-essentialism at the molecular level: there is no individual organism that
      is intrinsically the canonical genome of a species.'
  - id: dennett-darwins-dangerous-idea#u10-c3
    heading: The reader that DNA presupposes
    span: 464594:466596
    why: Extends the deconstructionist reader/text relation to genetics, arguing meaning/function is jointly
      authored by code and environment, not the code alone.
  - id: dennett-darwins-dangerous-idea#u10-c4
    heading: Retroactive endorsement, not advance design
    span: 471556:472206
    why: 'The chapter''s clearest statement of its non-teleological explanatory schema: evolution discovers
      reasons for a trait only after the trait already exists.'
  - id: dennett-darwins-dangerous-idea#u10-c5
    heading: 'Original Sin: the birth of error'
    span: 479903:481683
    why: 'Names the pivot from mere mechanism to normativity: the first copying error creates the first
      objective distinction between right and wrong.'
  - id: dennett-darwins-dangerous-idea#u10-c6
    heading: Intentionality percolates up from below
    span: 485603:486458
    why: 'Delivers the chapter''s culminating claim, inverting Locke''s Mind-first cosmology: meaning
      arises bottom-up from mindless algorithmic process, not top-down from a Creator-Mind.'
- nn: 11
  unit_id: ch08-reverse-engineering-kauffman
  note_id: dennett-darwins-dangerous-idea-ch08-reverse-engineering-kauffman
  span: 490470:545572
  chunks:
  - id: dennett-darwins-dangerous-idea#u11-c1
    heading: Samuel's program transcends its creator
    span: 493064:493630
    why: Names the exact process by which Samuel's checkers program bettered its own creator, giving Dennett's
      core rebuttal to the myth that a computer can only do what it is programmed to do, just before the
      chapter pivots from AI to biological reverse engineering.
  - id: dennett-darwins-dangerous-idea#u11-c2
    heading: Reverse engineering and the optimality default
    span: 503285:504041
    why: States reverse engineering's founding assumption -- that every feature has a reason -- which
      Dennett carries over wholesale from artifacts to organisms for the rest of the chapter.
  - id: dennett-darwins-dangerous-idea#u11-c3
    heading: 'Bait-and-switch: discard and replace, never redesign'
    span: 506826:507551
    why: Defines bait-and-switch, Dennett's name for evolution's inability to redesign in place, one of
      the chapter's two core disanalogies between natural selection and human engineering.
  - id: dennett-darwins-dangerous-idea#u11-c4
    heading: Cathedrals and the building path
    span: 519064:520108
    why: The Gothic-cathedral case study shows features invisible to end-state analysis that were load-bearing
      only during construction, grounding Dennett's argument that reverse engineering must reconstruct
      the building process, not just the finished product.
  - id: dennett-darwins-dangerous-idea#u11-c5
    heading: Order shining through in spite of selection
    span: 525050:525860
    why: States the apparent crisis Kauffman's simulations pose for Darwinism -- order shining through
      in spite of, not because of, selection -- that the rest of the section works to defuse.
  - id: dennett-darwins-dangerous-idea#u11-c6
    heading: Local rules generate global order
    span: 531779:532989
    why: Names Kauffman's local-rules-generate-global-order principle and contrasts it with the top-down,
      autocrat-directed logic of human engineering, the clearest statement of what Dennett means by meta-engineering.
- nn: 12
  unit_id: ch09-adaptationist-thinking-and-leibniz
  note_id: dennett-darwins-dangerous-idea-ch09-adaptationist-thinking-and-leibniz
  span: 545572:601196
  chunks:
  - id: dennett-darwins-dangerous-idea#u12-c1
    heading: 'The three stances: physical, design, intentional'
    span: 546053:547322
    why: Defines Dennett's core methodological triad that the rest of the chapter uses to reverse-engineer
      both artifacts and organisms.
  - id: dennett-darwins-dangerous-idea#u12-c2
    heading: 'Adaptationism defined: not optional, the heart of evolutionary biology'
    span: 567726:569197
    why: States Dennett's central thesis and Lewontin's own definition of the target concept, setting
      up the chapter's disagreement with Gould and Lewontin.
  - id: dennett-darwins-dangerous-idea#u12-c3
    heading: 'Renaming adaptationism: from Pangloss''s caricature to the Leibnizian Paradigm'
    span: 572378:572845
    why: 'The chapter''s title move: Dennett''s proposed rename that gives the unit its argument and its
      label.'
  - id: dennett-darwins-dangerous-idea#u12-c4
    heading: Williams' rules of thumb for disciplined adaptationism
    span: 591217:592474
    why: Gives the chapter's practical answer to 'how to tell Leibniz from Pangloss' — the disciplined
      side of adaptationist reasoning.
  - id: dennett-darwins-dangerous-idea#u12-c5
    heading: 'Maple leaves: how new adaptations get their start'
    span: 592477:593841
    why: Shows the rules of thumb are provisional — a purely physical trait can become a real adaptation
      once selection pressure shifts, illustrating the paradigm's self-correcting character.
  - id: dennett-darwins-dangerous-idea#u12-c6
    heading: Climbing levels of abstraction in the Game of Life
    span: 562247:563166
    why: Dennett's clearest illustration of stacking interpretive levels for computational compression,
      resonating with the Prime Radiant's hierarchical-magnification method for reading patterns out of
      noise.
- nn: 13
  unit_id: ch09-playing-with-constraints
  note_id: dennett-darwins-dangerous-idea-ch09-playing-with-constraints
  span: 601196:627368
  chunks:
  - id: dennett-darwins-dangerous-idea#u13-c1
    heading: Von Neumann and Morgenstern on multi-agent rationality
    span: 603802:604523
    why: States the founding game-theoretic insight — that rational strategy cannot be reduced to single-agent
      maximization once other maximizing agents are present — that Dennett imports wholesale into evolutionary
      theory.
  - id: dennett-darwins-dangerous-idea#u13-c2
    heading: The Prisoner's Dilemma, set out
    span: 605316:605913
    why: Gives the canonical Prisoner's Dilemma setup Dennett uses to explain why cooperation is "evolutionarily
      unenforceable" by default.
  - id: dennett-darwins-dangerous-idea#u13-c3
    heading: Dawkins' economical definition of an ESS
    span: 608737:609340
    why: Supplies the working definition of an evolutionarily stable strategy — 'does well against copies
      of itself' — that underwrites every subsequent game-theoretic claim in the section.
  - id: dennett-darwins-dangerous-idea#u13-c4
    heading: The weaker player's epistemic strategy
    span: 618950:619405
    why: Names the correct method for detecting Gould and Lewontin's hidden constraints, converting their
      critique into a research problem rather than a refutation of adaptationism.
  - id: dennett-darwins-dangerous-idea#u13-c5
    heading: Gould's hidden constraints as railroad tracks
    span: 616894:617124
    why: Is Gould's own formulation of the 'railroad tracks' objection that the rest of the section is
      built to answer.
  - id: dennett-darwins-dangerous-idea#u13-c6
    heading: Adaptationism as Darwinism's core, and Gould's skyhooks
    span: 626268:627366
    why: Delivers the chapter's verdict on the Gould/Lewontin critique and pivots directly into Chapter
      10's frame of Gould as a serial searcher for skyhooks.
- nn: 14
  unit_id: ch10-spandrels-and-crying-wolf
  note_id: dennett-darwins-dangerous-idea-ch10-spandrels-and-crying-wolf
  span: 627368:675420
  chunks:
  - id: dennett-darwins-dangerous-idea#u14-c1
    heading: The myth of Gould, Refuter of Orthodox Darwinism
    span: 628979:629946
    why: 'States the chapter''s real subject up front: not a scientific dispute but a widely believed
      myth about what Gould has shown.'
  - id: dennett-darwins-dangerous-idea#u14-c2
    heading: 'Crying wolf: the pattern of false revolutions'
    span: 634739:635792
    why: Names the chapter's governing metaphor (Aesop's boy who cried wolf) and cites Robert Wright's
      warning about Gould's public influence.
  - id: dennett-darwins-dangerous-idea#u14-c3
    heading: 'Gould''s real target: Darwin''s dangerous idea'
    span: 638164:638564
    why: 'The chapter''s interpretive thesis: Gould''s serial failed revolutions are read as symptoms
      of discomfort with Darwinism''s algorithmic core.'
  - id: dennett-darwins-dangerous-idea#u14-c4
    heading: Gould and Lewontin's definition of a spandrel
    span: 645228:645859
    why: The primary source passage from the 1979 paper that Dennett spends the rest of the section refuting;
      anchors the whole architectural debate.
  - id: dennett-darwins-dangerous-idea#u14-c5
    heading: 'Verdict: the spandrels are adaptations'
    span: 652421:653357
    why: 'Delivers Dennett''s central rebuttal in his own words: the supposed non-adaptation is in fact
      an adaptation chosen for aesthetic function.'
  - id: dennett-darwins-dangerous-idea#u14-c6
    heading: The left-hinged door as a genuine don't-care
    span: 657946:658662
    why: Dennett's own steelmanned candidate for a true spandrel, clarifying by contrast how little is
      left of Gould's anti-adaptationist alternative.
- nn: 15
  unit_id: ch10-punctuated-equilibrium-burgess-shale
  note_id: dennett-darwins-dangerous-idea-ch10-punctuated-equilibrium-burgess-shale
  span: 675420:749794
  chunks:
  - id: dennett-darwins-dangerous-idea#u15-c1
    heading: Geologically instantaneous, not literally instantaneous
    span: 681905:682331
    why: States precisely why punctuated equilibrium's tempo claim is compatible with ordinary gradualism
      once time is rescaled, the crux of Dennett's deflationary reading of PE.
  - id: dennett-darwins-dangerous-idea#u15-c2
    heading: Goldschmidt's hopeful monsters
    span: 688158:688389
    why: Names the saltationist doctrine directly and states its notorious central claim, which Dennett
      treats as the closest Gould came to a genuine skyhook.
  - id: dennett-darwins-dangerous-idea#u15-c3
    heading: 'Species selection: a crane, not a skyhook'
    span: 714199:714854
    why: Dennett's explicit application of his crane/skyhook framework to species selection, the section's
      clearest thesis statement.
  - id: dennett-darwins-dangerous-idea#u15-c4
    heading: Wonderful Life's central conclusion
    span: 717925:718864
    why: States the Burgess Shale contingency thesis Dennett spends the rest of the unit interrogating
      and lays out his three-question analytic plan.
  - id: dennett-darwins-dangerous-idea#u15-c5
    heading: The kiwi against contingency
    span: 733491:734313
    why: The concrete convergent-evolution counter-example Dennett uses to undercut Gould's radical contingency
      thesis.
  - id: dennett-darwins-dangerous-idea#u15-c6
    heading: Turning Nietzsche upside down
    span: 748198:749152
    why: The chapter's rhetorical capstone, tying the contingency debate to the book's master theme and
      its baseball-pun chapter title.
- nn: 16
  unit_id: ch11-controversies-contained
  note_id: dennett-darwins-dangerous-idea-ch11-controversies-contained
  span: 749794:798705
  chunks:
  - id: dennett-darwins-dangerous-idea#u16-c1
    heading: Panspermia as a harmless heresy
    span: 751675:752197
    why: 'States the chapter''s core method: a wild-sounding heresy (life seeded from space) that would
      not overthrow Darwinism even if confirmed.'
  - id: dennett-darwins-dangerous-idea#u16-c2
    heading: The intergalactic gene-splicers thought experiment
    span: 757744:758293
    why: Sets up Dennett's thought experiment testing whether any imaginable analysis could distinguish
      natural from artificial selection after the fact.
  - id: dennett-darwins-dangerous-idea#u16-c3
    heading: NovaGene's DNA branding
    span: 758706:759226
    why: The real-world NovaGene trademark-in-junk-DNA example anchors the intergalactic thought experiment
      in an actual, verifiable case.
  - id: dennett-darwins-dangerous-idea#u16-c4
    heading: Teilhard's betrayal of mindless evolution
    span: 771228:772089
    why: States the one non-negotiable commitment of Dennett's Darwinism — that evolution is mindless
      and purposeless — that Teilhard's Omega-point violates.
  - id: dennett-darwins-dangerous-idea#u16-c5
    heading: Natural selection as bookkeeping, not a single-level force
    span: 786398:787544
    why: The clearest statement of what gene-centrism actually claims and the legitimate 'bookkeeping'
      objection to it.
  - id: dennett-darwins-dangerous-idea#u16-c6
    heading: The moth's ruthless design versus 'Number One'
    span: 795480:796610
    why: 'Illustrates the gene''s-eye stakes concretely and sets up the book''s next move: why humans,
      uniquely, can override their genes'' interests.'
- nn: 17
  unit_id: ch12-meme-concept-body-snatchers
  note_id: dennett-darwins-dangerous-idea-ch12-meme-concept-body-snatchers
  span: 798705:846004
  chunks:
  - id: dennett-darwins-dangerous-idea#u17-c1
    heading: The Wilberforce-Huxley debate as 'a phylum of memes'
    span: 801803:802945
    why: Shows Dennett applying memetic framing to the ape-ancestry controversy before formally defining
      the term, and preserves the famous Huxley riposte itself.
  - id: dennett-darwins-dangerous-idea#u17-c2
    heading: From eukaryotic invasion to the birth of a person
    span: 815167:816318
    why: 'The chapter''s structural hinge: memes are introduced via direct analogy to Margulis'' endosymbiosis
      story, giving ''person'' a Darwinian rather than miraculous origin.'
  - id: dennett-darwins-dangerous-idea#u17-c3
    heading: Three conditions for evolution by natural selection
    span: 821033:821562
    why: States, in maximally abstract form, the criteria (variation, heredity, differential fitness)
      that let any process, genetic or memetic, count as Darwinian.
  - id: dennett-darwins-dangerous-idea#u17-c4
    heading: Dawkins defines and names the meme
    span: 824494:825344
    why: The primary-source definition and etymology of 'meme' that the rest of the chapter presupposes
      and builds on.
  - id: dennett-darwins-dangerous-idea#u17-c5
    heading: A scholar is just a library's way of making another library
    span: 828629:829059
    why: The unit's central provocation about authorship and agency, and its strongest resonance with
      WMP's anti-'great man' historiography.
  - id: dennett-darwins-dangerous-idea#u17-c6
    heading: Minds as scarce real estate in the infosphere
    span: 835870:836627
    why: Introduces the competitive, filter-driven ecology of memes that the rest of the chapter's examples
      (linked loci, misfiltering, arms races) all illustrate.
- nn: 18
  unit_id: ch12-science-and-philosophy-of-memetics
  note_id: dennett-darwins-dangerous-idea-ch12-science-and-philosophy-of-memetics
  span: 846004:892114
  chunks:
  - id: dennett-darwins-dangerous-idea#u18-c1
    heading: Cultural lineages recombine; biological ones only ever split (Gould)
    span: 853755:854284
    why: 'States the sharpest formal obstacle to a cladistic science of memes: cultural anastomosis has
      no clean biological analogue.'
  - id: dennett-darwins-dangerous-idea#u18-c2
    heading: 'Romeo and Juliet / West Side Story: meme identity is semantic, not syntactic'
    span: 856398:856847
    why: The clearest demonstration that what makes something the same meme is semantic sameness, which
      is exactly what makes homology vs. convergent reinvention so hard to adjudicate.
  - id: dennett-darwins-dangerous-idea#u18-c3
    heading: 'Sperber: abstract representations are not themselves causes'
    span: 861141:861866
    why: The strongest anti-memetics argument in the unit, quoted verbatim, and the objection Dennett's
      whole defense of a substrate-neutral science must answer.
  - id: dennett-darwins-dangerous-idea#u18-c4
    heading: 'Dawkins: a suicidal meme can spread via martyrdom'
    span: 872552:873135
    why: Establishes that meme fitness and organism fitness can radically diverge, the premise needed
      before asking what should ground our values instead.
  - id: dennett-darwins-dangerous-idea#u18-c5
    heading: The mind as an artifact built by memes
    span: 880270:880749
    why: 'The unit''s philosophical center of gravity: minds are themselves meme-built habitats, which
      is what forces the subsequent redefinition of autonomy.'
  - id: dennett-darwins-dangerous-idea#u18-c6
    heading: Autonomy redefined via the Viking spacecraft
    span: 884913:885401
    why: 'Supplies Dennett''s positive answer to the free-will worry: autonomy as local self-control over
      installed goals, not freedom from having been programmed.'
- nn: 19
  unit_id: ch13-losing-our-minds-to-darwin
  note_id: dennett-darwins-dangerous-idea-ch13-losing-our-minds-to-darwin
  span: 892114:972935
  chunks:
  - id: dennett-darwins-dangerous-idea#u19-c1
    heading: 'Darwinian creatures: the ground floor of the Tower'
    span: 902658:903062
    why: Defines the base tier of the Tower of Generate-and-Test, the framework the whole chapter's account
      of mind and language is built on.
  - id: dennett-darwins-dangerous-idea#u19-c2
    heading: 'The Tower recapped: Skinnerian, Popperian, Gregorian creatures'
    span: 912517:913157
    why: Names all four tiers of the Tower together and shows language producing unbounded recursive self-reflection,
      the chapter's central positive claim.
  - id: dennett-darwins-dangerous-idea#u19-c3
    heading: Cognitive closure reversed by cultural transmission
    span: 925697:926532
    why: Delivers the chapter's rebuttal to Chomsky/Fodor/McGinn's cognitive-closure argument, the chapter's
      main polemical payoff of the language-and-mind account.
  - id: dennett-darwins-dangerous-idea#u19-c4
    heading: 'Chomsky: the language organ as physics, not biology'
    span: 942102:942516
    why: Chomsky's own words showing he attributes the language organ to unknown physical law rather than
      natural selection, the crux of the chapter's disagreement with him.
  - id: dennett-darwins-dangerous-idea#u19-c5
    heading: 'Gould''s spandrel and Dennett''s rebuttal: exaptations are adaptations'
    span: 946455:947091
    why: 'States Dennett''s key counter-move against the Chomsky-Gould alliance: granting the spandrel
      premise does not defeat the adaptationist conclusion.'
  - id: dennett-darwins-dangerous-idea#u19-c6
    heading: Searle's Original Intentionality as pure skyhook
    span: 971023:971319
    why: Gives the chapter's most explicit one-line definition of a skyhook, naming the belief the whole
      book argues against.
- nn: 20
  unit_id: ch14-the-evolution-of-meanings
  note_id: dennett-darwins-dangerous-idea-ch14-the-evolution-of-meanings
  span: 972935:1046914
  chunks:
  - id: dennett-darwins-dangerous-idea#u20-c1
    heading: 'The two-bitser: meaning as functional history'
    span: 981134:982584
    why: Introduces Dennett's central intuition pump for the claim that meaning is conferred by selective/functional
      history rather than being intrinsic to a physical state.
  - id: dennett-darwins-dangerous-idea#u20-c2
    heading: The frog and the pellet zoo
    span: 992624:993961
    why: 'Extends the two-bitser''s logic to real natural selection: a sensory state''s ''meaning'' shifts
      as the environment that selects for it shifts.'
  - id: dennett-darwins-dangerous-idea#u20-c3
    heading: Meaning is not determinate at birth
    span: 994175:994794
    why: 'States the chapter''s thesis directly: indeterminacy is the raw material evolution needs, not
      a defect in Darwinian theories of meaning.'
  - id: dennett-darwins-dangerous-idea#u20-c4
    heading: Twin Earth restaged
    span: 995440:996897
    why: Gives Putnam's own thought experiment in enough detail to see how Dennett turns its intended
      conclusion against itself in the surrounding argument.
  - id: dennett-darwins-dangerous-idea#u20-c5
    heading: The point of the fable
    span: 1030317:1031121
    why: States outright why the intentional stance is explanatorily indispensable, linking the two-black-boxes
      fable back to Dewey's opening argument.
  - id: dennett-darwins-dangerous-idea#u20-c6
    heading: The Unmeant Meaners
    span: 1040872:1042017
    why: 'The chapter''s climactic argument: human intentionality is exposed as no less derived than an
      artifact''s, dissolving the derived/original distinction the whole chapter has been building toward.'
- nn: 21
  unit_id: ch15-emperors-new-mind
  note_id: dennett-darwins-dangerous-idea-ch15-emperors-new-mind
  span: 1046914:1110112
  chunks:
  - id: dennett-darwins-dangerous-idea#u21-c1
    heading: The sword-in-the-stone test
    span: 1047729:1048030
    why: 'Defines the chapter''s organizing standard: a decisive, lookalike-free feat that would prove
      a mind is not a mere mechanism.'
  - id: dennett-darwins-dangerous-idea#u21-c2
    heading: The Library of Toshiba and the scope of Godel's Theorem
    span: 1071570:1072485
    why: States precisely what Godel's Theorem does and does not constrain, the technical hinge the rest
      of the chapter's argument turns on.
  - id: dennett-darwins-dangerous-idea#u21-c3
    heading: The chess fallacy that undoes Penrose
    span: 1079628:1080289
    why: Dennett's clearest, self-contained demonstration of the exact logical error he attributes to
      Penrose, using a parallel case anyone can check.
  - id: dennett-darwins-dangerous-idea#u21-c4
    heading: Mathematics as a distributed mind-tool
    span: 1087182:1087937
    why: Shows how Dennett extends algorithmic explanation from individual brains to distributed social
      institutions, the passage most resonant with World Machines' history-machine idea.
  - id: dennett-darwins-dangerous-idea#u21-c5
    heading: 'Skyhook or crane: the Abisko verdict'
    span: 1092233:1092548
    why: Dennett's most direct, quotable verdict on Penrose's project, cast explicitly in the book's central
      skyhook/crane vocabulary.
  - id: dennett-darwins-dangerous-idea#u21-c6
    heading: Turning Darwin's burden of proof around
    span: 1108939:1109249
    why: The chapter's closing rhetorical payoff, tying the AI argument back to the book's title thesis
      and stating its final challenge to skeptics.
- nn: 22
  unit_id: ch16-group-selection-and-nietzsche
  note_id: dennett-darwins-dangerous-idea-ch16-group-selection-and-nietzsche
  span: 1110112:1149253
  chunks:
  - id: dennett-darwins-dangerous-idea#u22-c1
    heading: Hobbes's Artificial Man
    span: 1110176:1111183
    why: Hobbes's own frontispiece metaphor for the state as an artificial organism sets up the chapter's
      central move of reading society as a group-organism, later tested against real multicellular biology.
  - id: dennett-darwins-dangerous-idea#u22-c2
    heading: The state of nature and the birth of civilization
    span: 1113478:1114547
    why: Dennett's own compressed retelling of Hobbes's rational reconstruction, the clearest single statement
      of the Just-So-Story logic applied to the origin of morality.
  - id: dennett-darwins-dangerous-idea#u22-c3
    heading: Why don't your own genes rebel?
    span: 1122356:1123070
    why: States the genes-eye puzzle that organizes the rest of the chapter's account of cooperation as
      something that must be engineered, not assumed.
  - id: dennett-darwins-dangerous-idea#u22-c4
    heading: The Darwinian Veil of Ignorance
    span: 1128645:1129535
    why: Introduces Skyrms's mechanism explaining, via meiosis, why somatic-line cells cooperate where
      genuinely competing lineages would not.
  - id: dennett-darwins-dangerous-idea#u22-c5
    heading: Breeding an animal that can promise
    span: 1137808:1138063
    why: Nietzsche's own formulation of the problem his Genealogy sets out to solve, the hinge of his
      rival genealogy of morality.
  - id: dennett-darwins-dangerous-idea#u22-c6
    heading: Origin and function lie worlds apart
    span: 1145308:1145856
    why: Nietzsche's statement of the origin/function distinction that Dennett treats as an independent,
      pre-Gould articulation of exaptation, the strongest praise he gives Nietzsche in the chapter.
- nn: 23
  unit_id: ch16-greedy-ethical-reductionism
  note_id: dennett-darwins-dangerous-idea-ch16-greedy-ethical-reductionism
  span: 1149253:1189397
  chunks:
  - id: dennett-darwins-dangerous-idea#u23-c1
    heading: Greedy reductionism replaces the naturalistic fallacy
    span: 1153105:1154038
    why: 'Dennett''s central reframing of the chapter''s target: not naturalism itself but crude, single-step
      derivations of value from fact.'
  - id: dennett-darwins-dangerous-idea#u23-c2
    heading: Skinner's reinforcement account of goodness
    span: 1154476:1154951
    why: 'The reductio that shows greedy reductionism''s cost: Skinner''s ''reinforcing effects'' definition
      of good makes heroin good and elder care bad.'
  - id: dennett-darwins-dangerous-idea#u23-c3
    heading: 'Genes on a long leash: meme transcendence'
    span: 1159975:1161778
    why: Dennett turns E. O. Wilson's own leash metaphor against gene-primacy, arguing meme-built persons
      become new, independent beneficiaries.
  - id: dennett-darwins-dangerous-idea#u23-c4
    heading: The Hutterites and the value of opting out
    span: 1170984:1171321
    why: 'The chapter''s ethical payload: a real cultural experiment in greedy reductionism, and Dennett''s
      argument that exit, not solidarity, is what social engineering must protect.'
  - id: dennett-darwins-dangerous-idea#u23-c5
    heading: Cranes, not skyhooks, for the evolution of morality
    span: 1187925:1188778
    why: 'Closes the chapter''s positive program: Axelrod-style tournaments as a falsifiable, gradualist
      alternative to skyhook accounts of moral origin.'
- nn: 24
  unit_id: ch16-sociobiology-good-and-evil
  note_id: dennett-darwins-dangerous-idea-ch16-sociobiology-good-and-evil
  span: 1189397:1223272
  chunks:
  - id: dennett-darwins-dangerous-idea#u24-c1
    heading: Sociobiology's two faces
    span: 1189738:1190045
    why: 'Kitcher''s epigraph supplies the chapter''s organizing image: careful nonhuman science versus
      megaphone-amplified claims about human nature.'
  - id: dennett-darwins-dangerous-idea#u24-c2
    heading: The naked mole rat prediction
    span: 1196540:1197505
    why: 'Showcases sociobiology at its rigorous best: Alexander''s kin-selection-based prediction of
      a eusocial mammal was later confirmed by the naked mole rat''s discovery.'
  - id: dennett-darwins-dangerous-idea#u24-c3
    heading: Why 'if adaptive, then genetic' fails for humans
    span: 1201126:1201958
    why: 'States the chapter''s central methodological corrective: culture is always an alternative explanatory
      channel that blocks the leap from adaptive design to genetic cause in humans.'
  - id: dennett-darwins-dangerous-idea#u24-c4
    heading: 'The Maze War anecdote: a Good Trick, not a gene'
    span: 1203277:1204733
    why: Dennett's own autobiographical example operationalizes the culture-vs-gene argument, showing
      a convergently rediscovered Good Trick needs no genetic story.
  - id: dennett-darwins-dangerous-idea#u24-c5
    heading: Cheater detection and the Swiss-army-knife mind
    span: 1213191:1213888
    why: Presents Dennett's paradigm case of evolutionary psychology done well as a model for how Darwinian
      thinking about the mind should proceed.
  - id: dennett-darwins-dangerous-idea#u24-c6
    heading: Do ducks rape? Naming animal behavior with human moral terms
    span: 1217771:1218078
    why: Introduces Dennett's test case for whether sociobiology's use of loaded human-moral vocabulary
      is bad science, mere insensitivity, or overreached criticism.
- nn: 25
  unit_id: ch17-redesigning-morality
  note_id: dennett-darwins-dangerous-idea-ch17-redesigning-morality
  span: 1223272:1265603
  chunks:
  - id: dennett-darwins-dangerous-idea#u25-c1
    heading: The Nautical Almanac and the myth of ethical calculability
    span: 1230118:1230875
    why: This is the pivot where Dennett uses Mill's own analogy against him, showing ethics lacks astronomy's
      closed, orderly domain.
  - id: dennett-darwins-dangerous-idea#u25-c2
    heading: The Three Mile Island Effect
    span: 1232824:1233721
    why: 'States the chapter''s core impossibility result against consequentialism: no algorithm can fix
      even the sign of a remote outcome''s value.'
  - id: dennett-darwins-dangerous-idea#u25-c3
    heading: 'Judging the Competition: the fellowship thought experiment'
    span: 1238942:1239812
    why: Sets up the chapter's central thought experiment demonstrating that 'considering all things'
      is physically impossible even with all needed information at hand.
  - id: dennett-darwins-dangerous-idea#u25-c4
    heading: Satisficing as a fractal design pattern
    span: 1243639:1243983
    why: Names Herbert Simon's satisficing as the chapter's master concept and identifies its self-similar
      recurrence across biological, psychological, and institutional decision-making.
  - id: dennett-darwins-dangerous-idea#u25-c5
    heading: Conversation-stoppers and rights as good nonsense
    span: 1255651:1256760
    why: 'Gives Dennett''s positive proposal: workable ethics needs a-rational conversation-stoppers,
      exemplified by his rereading of Bentham''s jibe that rights-talk is ''nonsense upon stilts.'''
  - id: dennett-darwins-dangerous-idea#u25-c6
    heading: Wolf's Dilemma and reverberant doubt
    span: 1258016:1258908
    why: Hofstadter's thought experiment shows how mere awareness of others' possible doubt can unravel
      an obvious cooperative solution, illustrating why rule-following can't be secured by reflection
      alone.
- nn: 26
  unit_id: ch18-the-future-of-an-idea
  note_id: dennett-darwins-dangerous-idea-ch18-the-future-of-an-idea
  span: 1265603:1296756
  chunks:
  - id: dennett-darwins-dangerous-idea#u26-c1
    heading: Bach as cranes, not a skyhook
    span: 1268242:1269235
    why: The chapter's clearest restatement of the book's central cranes-versus-skyhooks argument, applied
      to individual genius rather than to biology.
  - id: dennett-darwins-dangerous-idea#u26-c2
    heading: Design work and the intuition pumps of value
    span: 1270222:1271084
    why: Sets up Dennett's core claim that our sense of value tracks irreplaceable design work, the chapter's
      answer to why biodiversity matters.
  - id: dennett-darwins-dangerous-idea#u26-c3
    heading: No natural line for a soul or a species
    span: 1272733:1273427
    why: Extends the book's anti-essentialism about species to bioethics, denying any principled line
      for when a human life begins.
  - id: dennett-darwins-dangerous-idea#u26-c4
    heading: Faiths as memes that must evolve or be caged
    span: 1281137:1281909
    why: 'States the chapter''s central bioethical-political move: treating religions as evolving meme
      populations subject to selective tolerance and quarantine.'
  - id: dennett-darwins-dangerous-idea#u26-c5
    heading: Churches becoming museums
    span: 1290028:1290787
    why: Concrete case of a tradition losing living function while its form persists, the passage's closest
      analogue to the World Machines decay sequence.
  - id: dennett-darwins-dangerous-idea#u26-c6
    heading: Universal solvent, sounder ideas left behind
    span: 1293906:1294395
    why: The chapter's thesis statement, restating the book's title metaphor in its most compressed and
      direct form.
