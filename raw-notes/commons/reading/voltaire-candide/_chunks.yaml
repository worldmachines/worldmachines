source: voltaire-candide
units:
- nn: 1
  unit_id: ch01-02-castle-and-bulgarians
  note_id: voltaire-candide-ch01-02-castle-and-bulgarians
  span: 0:9951
  chunks:
  - id: voltaire-candide#u01-c1
    heading: 'Pangloss''s demonstration of the best end'
    span: 2002:2707
    why: 'Pangloss''s own formulation of optimism from final causes, with spectacles, stockings, castles and pork as proofs.'
  - id: voltaire-candide#u01-c2
    heading: 'Cunégonde watches the experiment'
    span: 3170:3873
    why: 'Parodies cause-and-effect reasoning and sufficient reason by turning Pangloss''s lesson into the occasion for the expulsion.'
  - id: voltaire-candide#u01-c3
    heading: 'The baron''s cause and effect; the expulsion'
    span: 4429:4851
    why: 'The expulsion scene, ending on the ironic ''all possible castles'' consternation.'
  - id: voltaire-candide#u01-c4
    heading: 'Recruited by flattery and a toast'
    span: 6030:7927
    why: 'Shows how courteous talk and a toast manufacture a soldier, with Candide citing Pangloss in support of his own capture.'
  - id: voltaire-candide#u01-c5
    heading: 'Free will and the flogging'
    span: 8578:8805
    why: 'Ironic treatment of free choice between two punishments, with quantified violence following.'
  - id: voltaire-candide#u01-c6
    heading: 'The king''s clemency'
    span: 9286:9697
    why: 'Arbitrary pardon framed in ironic praise of the king, closing the unit''s treatment of war and rulers.'
- nn: 2
  unit_id: ch03-04-war-and-pangloss-found
  note_id: voltaire-candide-ch03-04-war-and-pangloss-found
  span: 9951:21253
  chunks:
  - id: voltaire-candide#u02-c1
    heading: 'The battle in the best of all possible worlds'
    span: 10042:10731
    why: 'The narrator''s ironic voice uses the vocabulary of optimism (best of all possible worlds, sufficient reason) to describe 30,000 deaths.'
  - id: voltaire-candide#u02-c2
    heading: 'The orator, the Pope question and the chamber-pot'
    span: 12483:13783
    why: 'Candide recites the doctrine to a preacher of charity who refuses him on a doctrinal test, a compact image of zeal replacing charity.'
  - id: voltaire-candide#u02-c3
    heading: 'Pangloss''s genealogy of the pox'
    span: 17603:18338
    why: 'Pangloss traces his syphilis through lovers, a Jesuit and Columbus''s crew, introducing the America-to-Europe disease route.'
  - id: voltaire-candide#u02-c4
    heading: 'A necessary ingredient in the best of worlds'
    span: 18340:19387
    why: 'Pangloss defends the disease as necessary because it brought chocolate and cochineal, the book''s clearest rationalization of harm in this unit.'
  - id: voltaire-candide#u02-c5
    heading: 'James and Pangloss on the voyage to Lisbon'
    span: 20255:21050
    why: 'The Anabaptist''s account of human destructiveness is set directly against Pangloss''s maxim that private misfortunes are public benefits.'
- nn: 3
  unit_id: ch05-06-lisbon-earthquake-auto-da-fe
  note_id: voltaire-candide-ch05-06-lisbon-earthquake-auto-da-fe
  span: 21253:29595
  chunks:
  - id: voltaire-candide#u03-c1
    heading: 'The Anabaptist drowns, and Pangloss proves it was meant'
    span: 22471:23079
    why: 'Shows Pangloss''s a priori reasoning replacing rescue, with the villain surviving and the benefactor lost.'
  - id: voltaire-candide#u03-c2
    heading: 'The earthquake, the looter and ''universal reason'''
    span: 23296:24701
    why: 'Pangloss''s ''sufficient reason'' and ''universal reason'' meet the Lisbon disaster and a looting sailor who rejects them.'
  - id: voltaire-candide#u03-c3
    heading: 'Comfort as necessity'
    span: 25424:26139
    why: 'Compact statement of Pangloss''s optimism as consolation to the bereaved.'
  - id: voltaire-candide#u03-c4
    heading: 'The Inquisition''s familiar and the interrupted proof'
    span: 26141:27059
    why: 'Optimism''s theological entanglements (original sin, free will) are probed by the Inquisition and cut off by power.'
  - id: voltaire-candide#u03-c5
    heading: 'The auto-da-fé to prevent earthquakes'
    span: 27190:28776
    why: 'The satirical core: a ceremonial burning justified as an infallible earthquake remedy, followed by another earthquake.'
  - id: voltaire-candide#u03-c6
    heading: 'Candide''s first doubt'
    span: 28778:29386
    why: 'Candide''s first questioning of ''the best of all possible worlds'' after being flogged and seeing Pangloss hanged.'
- nn: 4
  unit_id: ch07-08-cunegonde-found
  note_id: voltaire-candide-ch07-08-cunegonde-found
  span: 29595:39818
  chunks:
  - id: voltaire-candide#u04-c1
    heading: 'The reunion and the correction of Pangloss''s report'
    span: 32560:33381
    why: 'Cunégonde''s survival and her "these two accidents do not always prove mortal" overturn Pangloss''s report and open the exchange of stories.'
  - id: voltaire-candide#u04-c2
    heading: 'The Bulgarians at Thunder-ten-tronckh'
    span: 34032:34530
    why: 'Cunégonde''s ironic narration of the massacre and attempted rape sets the book''s register of atrocity told as routine.'
  - id: voltaire-candide#u04-c3
    heading: 'The captain and the sale to Don Issachar'
    span: 34831:35810
    why: 'Shows her second owner, the dig at Pangloss''s schooling, and her wry resilience.'
  - id: voltaire-candide#u04-c4
    heading: 'The Inquisitor and the Jew share Cunégonde'
    span: 36017:37129
    why: 'The weekly time-share and the old law/new law quarrel make the Inquisition''s religious authority look like a property bargain.'
  - id: voltaire-candide#u04-c5
    heading: 'The auto-da-fé seen from a good seat'
    span: 37131:38498
    why: 'Ritual violence staged as disaster policy ends with Cunégonde''s first-hand rejection of the optimist formula.'
- nn: 5
  unit_id: ch09-10-inquisitor-and-cadiz
  note_id: voltaire-candide-ch09-10-inquisitor-and-cadiz
  span: 39818:46664
  chunks:
  - id: voltaire-candide#u05-c1
    heading: 'Issachar attacks and is killed'
    span: 39902:40608
    why: 'The first killing: Candide, the narrator''s gentlest young man, runs a man through with the old woman''s sword.'
  - id: voltaire-candide#u05-c2
    heading: 'Candide reasons his way to killing the Inquisitor'
    span: 41352:42323
    why: 'The narrator''s ironic account of instantaneous self-interested reasoning, and Candide''s passion-based excuse for two killings.'
  - id: voltaire-candide#u05-c3
    heading: 'Stolen gold and Pangloss''s common goods'
    span: 43926:44498
    why: 'Candide cites Pangloss''s doctrine of shared goods to complain about the thieving friar, and the old woman supplies the practical fix.'
  - id: voltaire-candide#u05-c4
    heading: 'Flight, burial and the dunghill'
    span: 42754:43110
    why: 'Deadpan contrast between the Inquisitor''s magnificent burial and the Jew''s dunghill after the escape.'
  - id: voltaire-candide#u05-c5
    heading: 'Voyage: hope in the New World and the contest of misfortune'
    span: 44834:46556
    why: 'Hope for a better world is relocated across the ocean, Cunégonde lists her woes, and the old woman prepares her own tale.'
- nn: 6
  unit_id: ch11-old-womans-history
  note_id: voltaire-candide-ch11-old-womans-history
  span: 46664:53384
  chunks:
  - id: voltaire-candide#u06-c1
    heading: 'The pope''s daughter''s boast'
    span: 46706:47746
    why: 'The old woman''s vain catalogue of rank and beauty sets up the comic fall that follows and is the baseline against which her ruin is measured.'
  - id: voltaire-candide#u06-c2
    heading: 'The poisoned prince and the pirate raid'
    span: 47748:49010
    why: 'Shows her deadpan ''mere trifle'' register for a murder and the satirical image of the pope''s soldiers begging pirates for absolution.'
  - id: voltaire-candide#u06-c3
    heading: 'Stripped and searched'
    span: 49012:49849
    why: 'Satirises the pretended gap between ''civilised'' Europeans and pirates by making the Knights of Malta''s practice identical to the Moors''.'
  - id: voltaire-candide#u06-c4
    heading: 'Slavery, rape and ''common things'''
    span: 49851:50777
    why: 'Combines horror with flippancy to show captivity and rape narrated as trivia by the old woman.'
  - id: voltaire-candide#u06-c5
    heading: 'Morocco bathed in blood'
    span: 50779:52705
    why: 'The unit''s densest image of senseless war and its ironic pairing of massacre with continued ritual devotion, in the old woman''s own voice.'
  - id: voltaire-candide#u06-c6
    heading: 'Among the dead'
    span: 52707:53382
    why: 'Closes the unit''s installment with survival among corpses and a bawdy, deflating image that keeps the tragic and comic tones fused.'
- nn: 7
  unit_id: ch12-old-womans-adventures
  note_id: voltaire-candide-ch12-old-womans-adventures
  span: 53384:61133
  chunks:
  - id: voltaire-candide#u07-c1
    heading: 'The castrato and the Princess of Palestrina'
    span: 54126:54875
    why: 'The eunuch''s Naples aside and the recognition scene fuse mutilation-as-career with the old woman''s family catastrophe in the book''s characteristic flat tone.'
  - id: voltaire-candide#u07-c2
    heading: 'Plague as a greater trial than earthquake'
    span: 55810:56429
    why: 'She compares disasters by magnitude and lists her accumulated miseries, countering the claim that anyone''s suffering is unique.'
  - id: voltaire-candide#u07-c3
    heading: 'The imam''s sermon at Azov'
    span: 57687:58064
    why: 'The famine at Azov and the imam''s pious justification of cutting off buttocks is the satire''s sharpest example of religious rationalisation of harm.'
  - id: voltaire-candide#u07-c4
    heading: 'The surgeon and the laws of war'
    span: 58501:58897
    why: 'The surgeon''s assurance that assault is customary in sieges repeats the pattern of respectable language covering atrocity.'
  - id: voltaire-candide#u07-c5
    heading: 'One buttock and the will to live'
    span: 59441:59984
    why: 'The old woman''s argument that clinging to life is an absurd instinct is the chapter''s philosophical centre.'
  - id: voltaire-candide#u07-c6
    heading: 'The wager: ask every passenger'
    span: 59986:61131
    why: 'She counts the twelve suicides and proposes an empirical test (every passenger has cursed his existence), which frames the following episodes.'
- nn: 8
  unit_id: ch13-14-buenos-aires-and-paraguay
  note_id: voltaire-candide-ch13-14-buenos-aires-and-paraguay
  span: 61133:73040
  chunks:
  - id: voltaire-candide#u08-c1
    heading: 'The old woman advises Cunégonde to take the Governor'
    span: 63885:64500
    why: 'The old woman''s cynical, practical reckoning of Cunégonde''s worth shows rank, honour and misfortune treated as bargaining chips.'
  - id: voltaire-candide#u08-c2
    heading: 'Don Fernando''s haughtiness'
    span: 62224:62608
    why: 'The narrator''s mock-portrait of the Governor is the book''s compact satire of aristocratic pride.'
  - id: voltaire-candide#u08-c3
    heading: 'Cacambo praises the Jesuit kingdom'
    span: 67516:68528
    why: 'Cacambo''s enthusiastic account of Los Padres, who own everything and fight and absolve both sides, is the unit''s ironic image of the Jesuit state.'
  - id: voltaire-candide#u08-c4
    heading: 'Gold vessels in the arbour, corn in the sun'
    span: 70313:70566
    why: 'The unannounced contrast between the commandant''s luxury and the Paraguayans'' coarse corn undercuts Cacambo''s claim of justice and reason.'
  - id: voltaire-candide#u08-c5
    heading: 'Cacambo: fight for the Jesuits instead'
    span: 67056:67514
    why: 'Cacambo''s pragmatic pivot and his cheerful ''another world'' philosophy set his temperament against Candide''s grief and Pangloss''s system.'
  - id: voltaire-candide#u08-c6
    heading: 'Candide and the Jesuit commandant recognize each other'
    span: 71189:72140
    why: 'The recognition scene reveals the commandant as Cunégonde''s brother and shows Candide''s reflex of invoking Pangloss amid the improbable reunion.'
- nn: 9
  unit_id: ch15-16-baron-killed-and-oreillons
  note_id: voltaire-candide-ch15-16-baron-killed-and-oreillons
  span: 73040:84553
  chunks:
  - id: voltaire-candide#u09-c1
    heading: 'The baron''s survival and Jesuit career'
    span: 73641:74594
    why: 'The baron''s own account of how the massacre victim became a Jesuit officer in Paraguay, including the claim that Paraguay prefers more obedient non-Spanish Jesuits.'
  - id: voltaire-candide#u09-c2
    heading: 'Quarterings, equality, and the killing'
    span: 74973:76396
    why: 'Aristocratic pride meets Pangloss''s doctrine of natural equality, ending in Candide''s killing of the baron and his self-assessment as the best man in the world.'
  - id: voltaire-candide#u09-c3
    heading: 'The monkeys as lovers'
    span: 79544:80249
    why: 'A comic misreading episode in which Candide''s rescue turns out to be a killing and Pangloss''s authority is invoked for centaurs and satyrs.'
  - id: voltaire-candide#u09-c4
    heading: 'Candide before the cauldron'
    span: 81308:81761
    why: 'Candide recalls Pangloss''s ''Everything is right'' while facing the spit and hedges it with ''but I must confess it seems harsh''.'
  - id: voltaire-candide#u09-c5
    heading: 'Cacambo''s speech to the Oreillons'
    span: 82105:83603
    why: 'Cacambo argues from the law of nature, justice and shared enmity to win release, a piece of ironic reasoning about what natural law licenses.'
  - id: voltaire-candide#u09-c6
    heading: 'Pure nature is an excellent thing'
    span: 84141:84551
    why: 'Candide''s ironic conclusion about pure nature, tied to his killing of the baron, ends the episode and echoes the noble-savage theme.'
- nn: 10
  unit_id: ch17-arrival-in-el-dorado
  note_id: voltaire-candide-ch17-arrival-in-el-dorado
  span: 84553:92134
  chunks:
  - id: voltaire-candide#u10-c1
    heading: 'Both hemispheres closed: Candide''s inventory of dangers'
    span: 84646:85202
    why: 'Shows Candide and Cacambo''s situation before El Dorado, with every route dangerous and Cunégonde the only pull.'
  - id: voltaire-candide#u10-c2
    heading: 'The hidden plain beyond the rocks'
    span: 87017:87480
    why: 'Describes El Dorado''s setting, with its useful and agreeable combined and its sheep-drawn carriages.'
  - id: voltaire-candide#u10-c3
    heading: 'Children playing quoits with gems'
    span: 87482:88871
    why: 'The central comic image of the chapter: gold and jewels as toys, misread by the travellers as signs of royalty.'
  - id: voltaire-candide#u10-c4
    heading: 'Candide''s guess about the education of royal children'
    span: 88873:89762
    why: 'Candide''s inference of ''contempt for gold'' paired with the travellers'' habit of pocketing it, and Cacambo''s Peruvian language link.'
  - id: voltaire-candide#u10-c5
    heading: 'The landlord explains: no money, public inns'
    span: 90612:91600
    why: 'The landlord''s account of a moneyless, government-supported hospitality.'
  - id: voltaire-candide#u10-c6
    heading: 'Candide wonders if everything is right here'
    span: 91601:92132
    why: 'Candide''s own hypothesis about a place ''where everything is right'', set against his memory of Westphalia and Pangloss''s teaching.'
- nn: 11
  unit_id: ch18-el-dorado
  note_id: voltaire-candide-ch18-el-dorado
  span: 92134:103811
  chunks:
  - id: voltaire-candide#u11-c1
    heading: 'The old man on the Incas and the closed kingdom'
    span: 93190:94337
    why: 'The old man explains El Dorado''s origin as the surviving Inca kingdom, its rule against leaving, and Europeans'' fatal greed for its gold.'
  - id: voltaire-candide#u11-c2
    heading: 'No prayer, no priests, one opinion'
    span: 94603:96524
    why: 'The religion exchange sets El Dorado''s unpersecuting, priestless piety against monks and burnings and has Candide measure Pangloss''s castle against it.'
  - id: voltaire-candide#u11-c3
    heading: 'A city without courts or prisons'
    span: 98915:99317
    why: 'Concisely lists what the utopia lacks (courts, prisons) and what it has (a gallery of scientific instruments).'
  - id: voltaire-candide#u11-c4
    heading: 'Wanderers who resolve to be no longer happy'
    span: 100533:102438
    why: 'The decision to leave and the king''s reply on freedom, prudence and the Europeans'' yellow clay carry the chapter''s central irony.'
  - id: voltaire-candide#u11-c5
    heading: 'The hoisting machine and the plan to ransom Cunégonde'
    span: 102440:103809
    why: 'Shows the engineered departure, the scale of the carried wealth and Candide''s purely instrumental plan for it.'
- nn: 12
  unit_id: ch19-surinam-and-martin
  note_id: voltaire-candide-ch19-surinam-and-martin
  span: 103811:114259
  chunks:
  - id: voltaire-candide#u12-c1
    heading: 'The mutilated slave at Surinam'
    span: 105430:106554
    why: 'The slave''s own account of plantation mutilation, sugar, and the preachers'' doctrine of common descent is the unit''s moral center and the trigger for Candide''s break with optimism.'
  - id: voltaire-candide#u12-c2
    heading: 'Candide renounces optimism'
    span: 106557:106963
    why: 'Candide gives the book''s plainest definition of optimism, as an obstinacy, in direct response to witnessed slavery.'
  - id: voltaire-candide#u12-c3
    heading: 'Vanderdendur''s rising price and the swindle'
    span: 109451:110777
    why: 'A compact comic episode showing greed inferred from a victim''s easy compliance, culminating in the theft of Candide''s sheep and passage money.'
  - id: voltaire-candide#u12-c4
    heading: 'The magistrate and the contest for the unhappiest man'
    span: 110909:112239
    why: 'Shows institutional venality compounding private fraud and sets up Candide''s offer of a prize to the most miserable man.'
  - id: voltaire-candide#u12-c5
    heading: 'The twenty candidates and the chosen scholar'
    span: 112976:113621
    why: 'Candide weighs the stories against Pangloss''s system, conceding that if everything is for the best it is in El Dorado, and picks the scholar who will become his companion.'
- nn: 13
  unit_id: ch20-21-at-sea-with-martin
  note_id: voltaire-candide-ch20-21-at-sea-with-martin
  span: 114259:122395
  chunks:
  - id: voltaire-candide#u13-c1
    heading: 'Martin declares himself a Manichaean'
    span: 115267:116864
    why: 'Martin''s fullest statement of pessimism, set against Candide''s wavering optimism, and the unit''s main philosophical position.'
  - id: voltaire-candide#u13-c2
    heading: 'The sea-battle, the sheep, and the dueling verdicts'
    span: 116987:118685
    why: 'One concrete event is read as punished vice by Candide and as devilish slaughter by Martin, dramatizing how a doctrine absorbs any evidence.'
  - id: voltaire-candide#u13-c3
    heading: 'Fifteen days of disputing, no progress'
    span: 118687:119149
    why: 'States the stalemate between optimism and pessimism and the consolation of conversation, with Candide''s hope still tied to Cunégonde.'
  - id: voltaire-candide#u13-c4
    heading: 'Martin''s account of France and Paris'
    span: 119765:120441
    why: 'Gives Martin''s satirical picture of Paris, as chaos, robbery, imprisonment and scribblers, that frames the Paris episode that follows.'
  - id: voltaire-candide#u13-c5
    heading: 'Hawks and pigeons: has human nature changed?'
    span: 121702:122393
    why: 'Martin''s hawk analogy against Candide''s appeal to free will, left unresolved as the chapter breaks off.'
- nn: 14
  unit_id: ch22-paris-1
  note_id: voltaire-candide-ch22-paris-1
  span: 122395:131423
  chunks:
  - id: voltaire-candide#u14-c1
    heading: 'The Academy proves why the sheep is red'
    span: 122674:123069
    why: 'A compact parody of after-the-fact necessity proofs and academic prize culture, framing the unit''s satire of explanation.'
  - id: voltaire-candide#u14-c2
    heading: 'The swarm, the priest, and Martin'
    span: 123440:124826
    why: 'Shows Paris''s predatory reception of visible wealth and Martin''s contrast from his own poverty.'
  - id: voltaire-candide#u14-c3
    heading: 'The Abbé and the play-house wits'
    span: 125095:126385
    why: 'Introduces the fawning Abbé and the hostile critic, with the five-or-six-thousand plays joke.'
  - id: voltaire-candide#u14-c4
    heading: 'Queens on a dunghill; laughter with anger in the heart'
    span: 126387:128221
    why: 'Martin and the Abbé characterize Paris as a place of contradiction, cruelty and burial denied.'
  - id: voltaire-candide#u14-c5
    heading: 'The basset table'
    span: 129567:130885
    why: 'A precise satirical tableau of a gaming house, with Candide''s lament for the Baroness''s manners.'
  - id: voltaire-candide#u14-c6
    heading: 'Fifty thousand francs lost, taken for an English lord'
    span: 130887:131421
    why: 'Closes the episode with Candide''s wealth read as a social signal and his unmoved loss.'
- nn: 15
  unit_id: ch22-paris-2
  note_id: voltaire-candide-ch22-paris-2
  span: 131423:144374
  chunks:
  - id: voltaire-candide#u15-c1
    heading: 'The supper and the man of taste on tragedy'
    span: 131423:134275
    why: 'A compact satire of salon conversation and confident literary judgment, with the man of taste''s impossible standards for a good tragedy.'
  - id: voltaire-candide#u15-c2
    heading: 'Pangloss''s echo and Martin''s rebuttal'
    span: 134983:136265
    why: 'Candide tests the man of letters for optimism, gets a pessimist''s list of evils, and Martin shows that ''men cannot do otherwise'' dissolves responsibility.'
  - id: voltaire-candide#u15-c3
    heading: 'The Marchioness and the diamonds'
    span: 136506:137754
    why: 'Seduction and theft in one scene, with the Marchioness''s remark on how a Westphalian differs from a Frenchman.'
  - id: voltaire-candide#u15-c4
    heading: 'The Abbé gathers his script'
    span: 138777:139338
    why: 'Candide hands the Abbé every detail the forged letter and false Cunégonde will use.'
  - id: voltaire-candide#u15-c5
    heading: 'The false Cunégonde and the arrest'
    span: 141084:141936
    why: 'The con is sprung; Martin names it and calls himself more of a Manichaean than ever, while Candide recalls El Dorado.'
  - id: voltaire-candide#u15-c6
    heading: 'Bribery, the foreigners'' arrests, and the flight to England'
    span: 142653:144372
    why: 'The officer''s venality, the Abbé''s explanation of the arrests, Candide''s denunciation of the country, and the escape that he reads as release from hell.'
- nn: 16
  unit_id: ch23-24-portsmouth-paquette-giroflee
  note_id: voltaire-candide-ch23-24-portsmouth-paquette-giroflee
  span: 144374:155894
  chunks:
  - id: voltaire-candide#u16-c1
    heading: 'Admiral shot at Portsmouth'
    span: 145242:146428
    why: 'The deadpan execution of an admiral "to inspire the others to fight" is the unit''s satire of war and state ritual.'
  - id: voltaire-candide#u16-c2
    heading: 'Candide''s melancholy and Martin''s advice'
    span: 148100:148924
    why: 'Martin''s cynical advice about Cacambo and his insistence that virtue and happiness are rare set up the wager.'
  - id: voltaire-candide#u16-c3
    heading: 'Pacquette''s story'
    span: 150531:152750
    why: 'Pacquette''s first-person account of seduction, institutional exploitation and prostitution shows apparent cheer hiding misery.'
  - id: voltaire-candide#u16-c4
    heading: 'Friar Giroflée''s confession'
    span: 153941:154661
    why: 'The friar''s account of forced vows and convent discord is the second proof in Martin''s wager and a satire of monastic life.'
  - id: voltaire-candide#u16-c5
    heading: 'The money, the red sheep and the gondoliers'
    span: 154664:155826
    why: 'Candide and Martin debate whether money will help and whether the gondoliers are happy, sharpening the optimism-pessimism contrast with Martin''s "I have seen the world".'
- nn: 17
  unit_id: ch25-pococurante
  note_id: voltaire-candide-ch25-pococurante
  span: 155894:166606
  chunks:
  - id: voltaire-candide#u17-c1
    heading: 'The Raphaels he takes no delight in'
    span: 157152:157789
    why: 'Shows Pococuranté''s wealth and connoisseurship yielding no pleasure, the first full instance of his joyless fault-finding.'
  - id: voltaire-candide#u17-c2
    heading: 'Homer as a rusty medal'
    span: 159355:160197
    why: 'Pococuranté''s attack on Homer and on the social habit of keeping canonical books unread, with Candide invoking Pangloss.'
  - id: voltaire-candide#u17-c3
    heading: 'Horace, and reading only to please himself'
    span: 161367:161804
    why: 'States the senator''s principle of private taste and sets Candide''s deference against Martin''s agreement.'
  - id: voltaire-candide#u17-c4
    heading: 'Cicero, the Academy, and pin-making'
    span: 161806:162627
    why: 'Pococuranté''s utilitarian contempt for doubt and for learned systems, rhyming with the book''s suspicion of system-building.'
  - id: voltaire-candide#u17-c5
    heading: 'English liberty and Italian censorship'
    span: 163043:163680
    why: 'The chapter''s one political passage, on thought control by the Church and on partisanship spoiling freedom.'
  - id: voltaire-candide#u17-c6
    heading: 'A pleasure in having no pleasure'
    span: 165636:166403
    why: 'Martin''s diagnosis of Pococuranté against Candide''s hope for happiness through Cunégonde.'
- nn: 18
  unit_id: ch26-six-kings
  note_id: voltaire-candide-ch26-six-kings
  span: 166606:173215
  chunks:
  - id: voltaire-candide#u18-c1
    heading: 'Cacambo reappears as a slave'
    span: 166682:167726
    why: 'The reunion with Cacambo, who reveals Cunégonde is at Constantinople and that he is himself a slave, drives the plot toward the final act.'
  - id: voltaire-candide#u18-c2
    heading: 'The servants whisper to their masters'
    span: 168093:169542
    why: 'Six servants staging a coordinated reveal of their masters'' fallen status, ending with the sixth servant''s frank note that credit has run out.'
  - id: voltaire-candide#u18-c3
    heading: 'Achmet, Ivan and Charles-Edward'
    span: 169874:171104
    why: 'Three first-person accounts of dynastic overthrow, imprisonment and killing, each closed by the same Carnival formula.'
  - id: voltaire-candide#u18-c4
    heading: 'The two kings of Poland resign to Providence'
    span: 171106:171803
    why: 'The deposed kings voice providential resignation, the vocabulary of optimism in the mouths of the dispossessed.'
  - id: voltaire-candide#u18-c5
    heading: 'Theodore of Corsica and Candide''s diamond'
    span: 171805:172844
    why: 'Theodore''s list of reversals and the kings'' astonishment at Candide''s diamond make the scene''s point about majesty, money and fortune.'
- nn: 19
  unit_id: ch27-voyage-to-constantinople
  note_id: voltaire-candide-ch27-voyage-to-constantinople
  span: 173215:180722
  chunks:
  - id: voltaire-candide#u19-c1
    heading: 'Six dethroned kings as proof that all is for the best'
    span: 173590:174402
    why: 'Shows Candide drawing optimism from others'' ruin and Martin''s deflating reply.'
  - id: voltaire-candide#u19-c2
    heading: 'Cacambo reports Cunégonde enslaved and ugly'
    span: 174752:176151
    why: 'Gives the chain of losses behind Cunégonde''s slavery and Candide''s honour-bound, ironic response.'
  - id: voltaire-candide#u19-c3
    heading: 'Martin on weighing misfortunes'
    span: 176153:176902
    why: 'Martin''s refusal to rank suffering and his question about Pangloss''s scales is the unit''s main philosophical exchange.'
  - id: voltaire-candide#u19-c4
    heading: 'Recognizing Pangloss and the Baron at the oars'
    span: 177182:178548
    why: 'The recognition of the supposedly dead Pangloss and Baron as galley slaves under the bullwhip.'
  - id: voltaire-candide#u19-c5
    heading: 'Reunion and ransom with diamonds'
    span: 179411:180720
    why: 'Shows the reunion, the diamond sale at half value, the ransom, and the departure for Cunégonde.'
- nn: 20
  unit_id: ch28-29-reunion
  note_id: voltaire-candide-ch28-29-reunion
  span: 180722:188170
  chunks:
  - id: voltaire-candide#u20-c1
    heading: 'The Baron''s road to the galleys'
    span: 181022:181979
    why: 'The Baron''s own account of his survival and punishment, ending in his claim of injustice.'
  - id: voltaire-candide#u20-c2
    heading: 'Pangloss hanged and nearly dissected'
    span: 182198:183854
    why: 'The comic account of the failed burning and hanging that exposes Inquisition incompetence and superstition.'
  - id: voltaire-candide#u20-c3
    heading: 'Pangloss keeps his first opinion'
    span: 184984:185907
    why: 'Candide''s question and Pangloss''s answer that he will not retract, shown as loyalty to Leibniz over experience.'
  - id: voltaire-candide#u20-c4
    heading: 'Arrival at the Propontis and the faded Cunégonde'
    span: 185993:186511
    why: 'Sets up the reunion with a list of idle philosophical topics and finds Cunégonde reduced to laundry.'
  - id: voltaire-candide#u20-c5
    heading: 'The Baron refuses the marriage'
    span: 187079:187675
    why: 'Shows Candide bound by his promise and the Baron''s rank-pride blocking the match.'
- nn: 21
  unit_id: ch30-conclusion-garden
  note_id: voltaire-candide-ch30-conclusion-garden
  span: 188170:197591
  chunks:
  - id: voltaire-candide#u21-c1
    heading: 'Boredom and the old woman''s question'
    span: 190066:191105
    why: 'It shifts the book''s test from suffering to idleness through the old woman''s list of every misery they have endured.'
  - id: voltaire-candide#u21-c2
    heading: 'Martin''s verdict and Pangloss''s unbelieving optimism'
    span: 191107:191543
    why: 'It states Martin''s two-sided view of human life and shows Pangloss clinging to his doctrine without belief.'
  - id: voltaire-candide#u21-c3
    heading: 'The dervish shuts the door'
    span: 192629:193593
    why: 'The dervish''s "Be quiet" and the rats-in-the-ship image refuse the party''s metaphysical questions about evil.'
  - id: voltaire-candide#u21-c4
    heading: 'The old Turk and his twenty acres'
    span: 194150:195285
    why: 'The Turk''s ignorance of public affairs and his account of labour against boredom, vice and want supply the practical alternative.'
  - id: voltaire-candide#u21-c5
    heading: 'We must cultivate our garden'
    span: 196254:196605
    why: 'It holds the book''s best-known line and the differing readings of it by Pangloss and Martin.'
  - id: voltaire-candide#u21-c6
    heading: 'Work in the garden, and Pangloss''s last chain'
    span: 197012:197590
    why: 'The ending sets Pangloss''s chain of events beside Candide''s reply, with the household at productive work.'
