    char_start: 51990
    char_end: 52380
    start_quote: In Diderot were splendid talents. It was the art of prudent stewardship
    end_quote: but no one fine work.
    why: 'Morley''s central verdict on Diderot as a writer: talent without economy, eminent yet never
      producing a masterpiece.'
  - id: morley-diderot-v1#u04-c2
    label: c2
    heading: The munificent prodigal
    char_start: 55314
    char_end: 56356
    start_quote: He is the munificent prodigal of letters, always believing his substance inexhaustible
    end_quote: did not take himself seriously enough.
    why: Diderot's own defence of giving his time to others, and Morley's judgement on it.
  - id: morley-diderot-v1#u04-c3
    label: c3
