    char_end: 353112
    start_quote: What is really interesting in this long article is its anticipation of
    end_quote: the generosity, the nobleness of manners."
    why: The unit's most forward-looking passage, on commerce as a bond among nations, declining patriotism,
      and the moral cost of commerce, framed by Morley as Cobdenic.
  - id: morley-diderot-v1#u18-c6
    label: c6
    heading: What the Encyclopædia lacked, and the monumental ruin
    char_start: 353454
    char_end: 356140
    start_quote: And so our sketch of the great book must at length end.
    end_quote: to strike a blow for humanity and truth.
    why: 'Morley''s concluding judgement of the Encyclopædia: its missing unifying idea of the unity of
      intellectual history and its elegiac assessment of the work''s achievement.'
- nn: 19
  unit_id: ch6-social-life-1
  note_id: morley-diderot-v1-ch6-social-life-1
  span: 356145:382225
  chunks:
  - id: morley-diderot-v1#u19-c1
    label: c1
    heading: Authenticity and provenance of the Voland letters
    char_start: 358423
    char_end: 359928
    start_quote: One of the most interesting of all the documentary memorials of the century is to be
      found in the letters
    end_quote: than even his letters to Mademoiselle Voland.
    why: Morley's own account of what the Voland letters are, how they reached print, and why their transmission
      remains uncertain.
  - id: morley-diderot-v1#u19-c2
    label: c2
    heading: Regrets on My Old Dressing-gown
    char_start: 362530
    char_end: 366604
    start_quote: What induced me to part with it? It was made for me; I was made for it.
    end_quote: Thus I too am insulting the national misery.
    why: The best-known domestic text in the unit, in which one piece of luxury forces the philosopher's
      whole room into a new and compromised order.
  - id: morley-diderot-v1#u19-c3
    label: c3
    heading: The divided house
    char_start: 367230
    char_end: 368610
    start_quote: Yet the interior of Socrates-Diderot was as little blessed by domestic
    end_quote: But the pity of it, O the pity of it!
    why: Morley's picture of Diderot's unhappy marriage, mixing Diderot's letter-reported scenes with
      Morley's own pathos and blame-weighing.
  - id: morley-diderot-v1#u19-c4
    label: c4
    heading: Indomitable industry and the burnt papers
    char_start: 371712
    char_end: 373136
    start_quote: In the midst of distractions great and small, was an indomitable
    end_quote: would have robbed my wife of sleep for the rest of her life."
    why: 'Gives the concrete labour behind the Encyclopædia: ten-hour proof-reading, eye strain, and the
      fire that Diderot concealed.'
  - id: morley-diderot-v1#u19-c5
    label: c5
    heading: A day at Grandval
    char_start: 373138
    char_end: 376140
    start_quote: His favourite form of holiday was a visit to Holbach's country house at
    end_quote: among the fields and woods of Grandval.
    why: 'The fullest portrait in the unit of the circle''s sociable life: schedule, guests, topics of
      talk, and Morley''s affectionate verdict.'
  - id: morley-diderot-v1#u19-c6
    label: c6
    heading: The paradox of equal conditions
    char_start: 379782
    char_end: 380364
    start_quote: This paradox comes of the equality that I discover among various conditions of life
    end_quote: the rest is nothing.
    why: Diderot's own reflective claim that moral worth and knowledge, not rank or wealth, distinguish
      men, as Morley quotes it from the Grandval letters.
- nn: 20
  unit_id: ch6-social-life-2
  note_id: morley-diderot-v1-ch6-social-life-2
  span: 382225:406812
  chunks:
  - id: morley-diderot-v1#u20-c1
    label: c1
    heading: The comedy of the world seen from afar
    char_start: 382353
    char_end: 383248
    start_quote: '"Ah, what a fine comedy this world would be, if only one had not to play'
    end_quote: How our senses affect our morality. There is a fine text for philosophising!"
    why: Diderot's own sombre meditation on scale and moral outrage, which Morley sets up as an unrepresentative
      reaction.
  - id: morley-diderot-v1#u20-c2
    label: c2
    heading: Morley on Diderot the sentimentalist
    char_start: 383986
    char_end: 385914
    start_quote: These sombre meditations hardly represent Diderot's habitual vein; they
    end_quote: natural tenderness of life as it comes and passes.
    why: Morley's central verdict on Diderot's temperament and his casuistry of feeling, set against Balzac,
      Goethe and Rousseau.
  - id: morley-diderot-v1#u20-c3
    label: c3
    heading: Holbach's impressions of England
    char_start: 391788
    char_end: 394500
    start_quote: '"The Baron has returned from England. He started with the pleasantest anticipations'
    end_quote: I think it would have done still better if it had been brandy.'"
    why: A French philosophe's catalogue of English faults, with Hume's story of the Huron convert, as
      relayed by Diderot.
  - id: morley-diderot-v1#u20-c4
    label: c4
    heading: Two cases of conscience
    char_start: 394528
    char_end: 398194
    start_quote: '"The curé said that unhappy lovers always'
    end_quote: and Grimm insisted on having his portrait taken."
    why: Worked examples of feeling and pity set against rigid rule, the casuistry Morley says Diderot
      loved.
  - id: morley-diderot-v1#u20-c5
    label: c5
    heading: A prosecution over a prohibited book
    char_start: 399226
    char_end: 401639
    start_quote: '"A little adventure has just happened here that proves that all our fine'
    end_quote: worse than the capital punishment that takes away his life."
    why: Diderot's eyewitness account of censorship's human cost and its link to the authorities' anger
      at Voltaire.
  - id: morley-diderot-v1#u20-c6
    label: c6
    heading: 'Method and genius: the Nightingale, Cuckoo and Ass'
    char_start: 401675
    char_end: 406457
    start_quote: There was a question between Grimm and M. Le Roy of creative genius and co-ordinating
      method.
    end_quote: and I am the ass, who decide in your favour. Good-night.
    why: Galiani's fable, relayed by Diderot, dramatises the quarrel between spontaneous genius and ordering
      method.
- nn: 21
  unit_id: ch6-social-life-3
  note_id: morley-diderot-v1-ch6-social-life-3
  span: 406812:424820
  chunks:
  - id: morley-diderot-v1#u21-c1
    label: c1
    heading: The dilemma of evil and why optimism fails
    char_start: 410043
    char_end: 411065
    start_quote: Among these difficulties is one that has been proposed ever since the world has been
      a world
    end_quote: by way of answer to a clear, precise, and definite fact.
    why: Diderot's reported statement of the problem of evil and his sweeping dismissal of the doctrines
      built to answer it.
  - id: morley-diderot-v1#u21-c2
    label: c2
    heading: The pyramid of possible worlds
    char_start: 411638
    char_end: 412199
    start_quote: Leibnitz, the founder of optimism, tells somewhere how there was in the
    end_quote: was Tarquin outraging Lucretia
    why: A compact comic refutation of Leibnitzian optimism, showing Diderot's wit as argument.
  - id: morley-diderot-v1#u21-c3
    label: c3
    heading: The disputing, rationalistic century
    char_start: 412203
    char_end: 413755
    start_quote: Almost every letter reminds us that we are in the very height of the
    end_quote: right and necessary to be honest and good with all the world without distinction.
    why: Morley's verdict that Diderot typifies the age's passion for moral argument, with vignettes of
      salon ethics.
  - id: morley-diderot-v1#u21-c4
    label: c4
    heading: Lespinasse's judgement and Morley's qualification
    char_start: 415854
    char_end: 416991
    start_quote: Alas, all these endless debates and dialogues lacked the inspiration and
    end_quote: an honest anxiety to serve.
    why: Morley weighs the airlessness of the discussions against the society's unsurpassed kindliness.
  - id: morley-diderot-v1#u21-c5
    label: c5
    heading: Diderot's idea of friendship
    char_start: 417412
    char_end: 418523
    start_quote: Diderot was content to take friendship as the right, the duty, or the
    end_quote: Ah, God would never have given such an order to his mother!
    why: States what friendship meant to Diderot (service without return) with Morley's first illustrations.
  - id: morley-diderot-v1#u21-c6
    label: c6
    heading: Landois and the philosophy of commiseration
    char_start: 423163
    char_end: 423934
    start_quote: He insists that man, with all his high-flying freedom of will, is but a little link
    end_quote: this is the philosophy that reconciles us with the human race and with life.
    why: Diderot's determinist ethics of pity, in Morley's summary, drawn from a quarrel over a dangerous
      manuscript.
- nn: 22
  unit_id: ch6-social-life-4
  note_id: morley-diderot-v1-ch6-social-life-4
  span: 424820:452410
  chunks:
  - id: morley-diderot-v1#u22-c1
    label: c1
    heading: Rousseau's rupture with Diderot
    char_start: 424820
    char_end: 428695
    start_quote: There was one man, and only one man, for whose perverse and intractable
    end_quote: Too many honest people would be in the wrong, he most truly said, if Jean Jacques were
      in the right.
    why: Morley's account of the Rousseau quarrel through Diderot's letters, with his verdict on sentimentalism
      and on who was at fault.
  - id: morley-diderot-v1#u22-c2
    label: c2
    heading: Grimm and the literary correspondence
    char_start: 431055
    char_end: 432103
    start_quote: While Grimm was amusing himself at Madame d'Epinay's country house,
    end_quote: exists of any other remarkable literary epoch.
    why: Contrasts Grimm's pension-hunting with Diderot's drudgery and claims the circular letters diffused
      Paris's intelligence abroad.
  - id: morley-diderot-v1#u22-c3
    label: c3
    heading: Catherine of Russia buys the library
    char_start: 435113
    char_end: 436725
    start_quote: When it became his duty to provide for his daughter, between 1763 and 1765,
    end_quote: declined to tax the king's strained finances.
    why: Morley's detailed account of royal patronage and his defence of Diderot against the charge of
      lost independence by comparison with Voltaire, D'Alembert and Rousseau.
  - id: morley-diderot-v1#u22-c4
    label: c4
    heading: Hawkers, contraband and the printing of Bayle
    char_start: 438961
    char_end: 442042
    start_quote: Contraband was here, as always, the natural substitute for free trade.
    end_quote: much to the contentment of the French printers, binders, and booksellers.
    why: Shows how prohibition fuelled the clandestine book trade and how the state adapted by printing
      Bayle at home.
  - id: morley-diderot-v1#u22-c5
    label: c5
    heading: Diderot on copyright and books as wares
    char_start: 443184
    char_end: 444468
    start_quote: M. de Sartine invited Diderot to write him a memorandum on the subject,
    end_quote: as those who deal in any other wares.
    why: Morley's account of Diderot's 1767 defence of literary property and his commercial realism about
      books.
  - id: morley-diderot-v1#u22-c6
    label: c6
    heading: Diderot rebukes D'Alembert over the booksellers
    char_start: 444470
    char_end: 447491
    start_quote: There is a vivid illustration of this unexpected business-like quality
    end_quote: After all this show of pride, confess now that you are cutting a very sorry figure?
    why: A reported dialogue showing Diderot's business integrity and his bluntness with D'Alembert in
      1759.
- nn: 23
  unit_id: ch7-the-stage-1
  note_id: morley-diderot-v1-ch7-the-stage-1
  span: 452410:480233
  chunks:
  - id: morley-diderot-v1#u23-c1
    label: c1
    heading: Diderot's drama theory as glorification of domestic virtue
    char_start: 453133
    char_end: 454691
    start_quote: Diderot is in a thousand respects one of the most unsatisfactory of men
    end_quote: passed for nearly half a century to the country of Lessing and Goethe.
    why: Morley's own framing of Diderot's dramatic theory as one side of the same movement that raised
      civil justice and industry over feudal privilege.
  - id: morley-diderot-v1#u23-c2
    label: c2
    heading: Lessing and the invention of German criticism
    char_start: 455610
    char_end: 456712
    start_quote: Since Aristotle, said Lessing, no more philosophical mind than Diderot's
    end_quote: Still more true is it that Diderot invented German criticism.
    why: Records Lessing's debt to Diderot and Morley's distinction between Diderot as philosophic critic
      and as failed dramatist.
  - id: morley-diderot-v1#u23-c3
    label: c3
    heading: Writing out the pantomime
    char_start: 463501
    char_end: 465216
    start_quote: What adds to the flatness of the play is a device which Diderot
    end_quote: he will soon see what follies he commits.
    why: Presents Diderot's reasoning for gesture and stage business on the principle of consulting nature,
      and Morley's reaction.
  - id: morley-diderot-v1#u23-c4
    label: c4
    heading: Stopped ears and the poverty of language
    char_start: 466435
    char_end: 468258
    start_quote: We have already seen that even when he wrote the Letter on the Deaf
    end_quote: if only we did not employ words in making them.
    why: Diderot's playgoing experiment and the deep conviction, in Morley's words, that language is an
      inadequate instrument.
  - id: morley-diderot-v1#u23-c5
    label: c5
    heading: Sympathy, not homily
    char_start: 476667
    char_end: 478880
    start_quote: In other words, you must win us by kindling our sympathy
    end_quote: tearful dummy labelled the Father of the Family.
    why: Morley's central objection to Diderot's moralising stage and his own account of how virtue is
      made attractive.
  - id: morley-diderot-v1#u23-c6
    label: c6
    heading: Serious comedy without a smile
    char_start: 472167
    char_end: 473347
    start_quote: Again, though he may be right in contending that there is a serious kind
    end_quote: the very end that Diderot most anxiously sought.
    why: Morley's critique of the genre sérieux's monotony, with laughter as a moral agency Diderot overlooked.
- nn: 24
  unit_id: ch7-the-stage-2
  note_id: morley-diderot-v1-ch7-the-stage-2
  span: 480233:506165
  chunks:
  - id: morley-diderot-v1#u24-c1
    label: c1
    heading: Shakespeare as Saint Christopher
    char_start: 483345
    char_end: 483993
    start_quote: It was not to be expected that Diderot should indulge in those
    end_quote: better than Voltaire's drunken savage.
    why: Shows Diderot's measured but admiring reception of Shakespeare and Morley's jab at Voltaire.
  - id: morley-diderot-v1#u24-c2
    label: c2
    heading: The Paradox on the Player stated
    char_start: 486382
    char_end: 488043
    start_quote: What is the Paradox? That a player of the first rank must have much
    end_quote: the absolute want of sensibility that prepares actors who shall be sublime.
    why: Morley's concise statement of Diderot's central claim that great acting rests on judgment and
      not on feeling.
  - id: morley-diderot-v1#u24-c3
    label: c3
    heading: Garrick and the folding doors
    char_start: 488313
    char_end: 489233
    start_quote: He says that he saw Garrick pass his head between two folding doors,
    end_quote: to follow the path of the dagger in the air."
    why: The vivid illustration of the Paradox, with Diderot's own words on Garrick.
  - id: morley-diderot-v1#u24-c4
    label: c4
    heading: Against the French classic stage
    char_start: 491388
    char_end: 492803
    start_quote: Diderot had perceived very early that the complacency with which his
    end_quote: Of all kinds of literature it is the most imperfect.
    why: Diderot's attack on the declamatory national theatre in favour of truth and nature, as Morley
      reports it.
  - id: morley-diderot-v1#u24-c5
    label: c5
    heading: The genre sérieux defined
    char_start: 498385
    char_end: 499550
    start_quote: What Diderot conceived himself really to have done, was to have sketched
    end_quote: is the truly ridiculous thing in men and in life.
    why: Morley's account of Diderot's proposed third dramatic kind, the core of his bourgeois drama theory.
  - id: morley-diderot-v1#u24-c6
    label: c6
    heading: Morley's verdict on illusion and Duty
    char_start: 501798
    char_end: 503044
    start_quote: 'No, we answer: reproduction of reality does not move us as a powerful work'
    end_quote: repel the faculties of dramatic genius.
    why: Morley's own critique of the genre sérieux, with Burke's argument against copying nature.
- nn: 25
  unit_id: ch8-rameaus-nephew
  note_id: morley-diderot-v1-ch8-rameaus-nephew
  span: 506165:533276
  chunks:
  - id: morley-diderot-v1#u25-c1
    label: c1
    heading: The adventures of the manuscript
    char_start: 508755
    char_end: 511879
    start_quote: In the year 1804 Schiller handed to Goethe the manuscript of a piece by Diderot
    end_quote: rested on a single manuscript, and that a manuscript of disputed authenticity.
    why: Morley's account of the text's transmission, forgery and doubtful authentication via Goethe and
      Brière.
  - id: morley-diderot-v1#u25-c2
    label: c2
    heading: Critics' readings and Morley's answer
    char_start: 511881
    char_end: 512977
    start_quote: Critics differ extremely in their answers to the question of the subject
    end_quote: society with a free unblinking vision, and to meditate upon them deeply and searchingly.
    why: States Morley's thesis that the dialogue is a portrait of an original and not any single-purpose
      satire.
  - id: morley-diderot-v1#u25-c3
    label: c3
    heading: Juvenal's Trebius and Diderot's Rameau
    char_start: 514855
    char_end: 516469
    start_quote: But the distance is immeasurable between Juvenal's scorching truculence
    end_quote: one of the countless moulds of the huge social foundry.
    why: Contrasts the denunciatory ancient satirist with Diderot's anatomising curiosity and the claim
      that Rameau is a brother to us all.
  - id: morley-diderot-v1#u25-c4
    label: c4
    heading: The scientific attitude and Lucian
    char_start: 516471
    char_end: 518656
    start_quote: Such is the scientific attitude of mind towards character
    end_quote: which a hunter has for the object of his chase.
    why: Morley names the shift from execration to scrutiny as a mark of the modern spirit and compares
      Lucian's parasite.
  - id: morley-diderot-v1#u25-c5
    label: c5
    heading: Social significance of the dialogue
    char_start: 526390
    char_end: 527996
    start_quote: As I have already said, it must be judged as something more than a literary diversion.
    end_quote: indispensable for the transformation of the Roman Empire.
    why: Morley's central historical judgement tying Rameau to the depravity that prepared the Revolution.
  - id: morley-diderot-v1#u25-c6
    label: c6
    heading: The French and Italian music quarrel
    char_start: 530263
    char_end: 532135
    start_quote: Another subject is handled in Rameau's Nephew, which is interesting in
    end_quote: Pamphlets, broadsheets, sarcasms flew over Paris from every side.
    why: Explains the musical controversy in which the dialogue was composed and its place in Parisian
      intellectual life.
