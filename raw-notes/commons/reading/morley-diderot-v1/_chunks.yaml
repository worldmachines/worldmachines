    char_start: 66803
    char_end: 68627
    start_quote: Nor was it accident that drew Diderot's attention to Shaftesbury, rather
    end_quote: the great points which the universal church claims to have decided.
    why: Explains, via Jansenist convulsions and Unigenitus, the social conditions that shaped Diderot's
