  - id: morley-diderot-v1#u01-c1
    label: c1
    heading: The Church's false dawn at mid-century
    char_start: 2668
    char_end: 4280
    start_quote: There was a moment in the last century when the Gallican church hoped
    end_quote: most triumphant days that they had known since the Reformation.
    why: 'Sets up the retrospective irony: the Church at its apparent zenith just before the assault.'
  - id: morley-diderot-v1#u01-c2
    label: c2
    heading: Scientific idea without the social idea
    char_start: 6310
    char_end: 7397
    start_quote: They had the scientific idea, but they lacked the social
    end_quote: was the decisive expression of that rejection.
    why: Morley's diagnosis of why earlier heretics failed and why the Church's directing role held for
      centuries.
  - id: morley-diderot-v1#u01-c3
    label: c3
    heading: The new phase and the Encyclopædia as symbol
    char_start: 7399
    char_end: 8775
    start_quote: After the middle of the last century the insurrection against the pretensions of the
      Church
    end_quote: The great symbol of this new comprehensiveness in the insurrection was the Encyclopædia.
    why: States Morley's thesis that the movement joined scientific and social ideas, with the Encyclopædia
      as its symbol.
  - id: morley-diderot-v1#u01-c4
    label: c4
    heading: The cheerful doctrine of human plasticity
    char_start: 8777
    char_end: 10495
    start_quote: The Encyclopædia was virtually a protest against the old organisation,
    end_quote: what intense interest it lent to every detail of economics and legislation and government.
    why: Morley's account of the core moral of the Encyclopædia and why it drove every later social improvement.
  - id: morley-diderot-v1#u01-c5
    label: c5
    heading: Churchly chagrin and the new spiritual power
    char_start: 10497
    char_end: 11653
    start_quote: The deadly chagrin with which churchmen saw the encyclopedic fabric
    end_quote: for the means of satisfying them.
    why: Explains the structural clash between secular knowledge and the Church, and frames the Encyclopædia
      as a provisional new spiritual power.
  - id: morley-diderot-v1#u01-c6
    label: c6
    heading: Diderot as the one real thinker
    char_start: 14771
    char_end: 16471
    start_quote: Whether we accept or question Comte's strong description of Diderot as
    end_quote: apart from the important place that he holds in the history of literature and opinion.
    why: Morley's case for Diderot's distinctive place among Voltaire, Rousseau and himself.
- nn: 2
  unit_id: ch2-youth-1
  note_id: morley-diderot-v1-ch2-youth-1
  span: 16476:33799
  chunks:
  - id: morley-diderot-v1#u02-c1
    label: c1
    heading: The man of Langres as weathercock
    char_start: 17349
    char_end: 17777
    start_quote: Thus they learn from earliest infancy to turn to every wind.
    end_quote: For myself, I belong to my country side.
    why: Diderot's own account of the Langres temperament, which Morley adopts to explain his versatility
      and clumsy expression.
  - id: morley-diderot-v1#u02-c2
    label: c2
    heading: The father and the school prizes
    char_start: 18385
    char_end: 18919
    start_quote: One of the sweetest moments of my life," he once said
    end_quote: a grave and sterling man melted to tears.
    why: Diderot's memory of his father's tears, the book's key evidence for the affection behind his
      family portrait.
  - id: morley-diderot-v1#u02-c3
    label: c3
    heading: Men of letters as successors of the Jesuits
    char_start: 24255
    char_end: 25759
    start_quote: The all-important fact about the men of letters in France was
    end_quote: which made the world and its daily interests so real to them.
    why: Morley's thesis that the men of letters were a new order inheriting spiritual power from the
      Jesuits, with his hedged credit to the Order.
  - id: morley-diderot-v1#u02-c4
    label: c4
    heading: What the man of letters is
    char_start: 26684
    char_end: 27443
    start_quote: He is borne on the wings neither of a broad philosophic conception
    end_quote: each case of conduct, of policy, or of new opinion as it arises.
    why: Morley's definition of the man of letters as dispersive, popularising and empirical, in contrast
      to Jesuit and systematic thinker.
  - id: morley-diderot-v1#u02-c5
    label: c5
    heading: Shrove Tuesday and the vow
    char_start: 31248
    char_end: 31508
    start_quote: That day," Diderot used to tell his children in later years
    end_quote: to the misery of such a day as that.
    why: The central anecdote of Diderot's penury and the vow Morley says he faithfully kept.
  - id: morley-diderot-v1#u02-c6
    label: c6
    heading: Judging people by what they were
    char_start: 32708
    char_end: 33797
    start_quote: He was absolutely uncramped by any of the formal mannerisms of the spirit.
    end_quote: but wholly to what they were.
    why: Morley's own verdict on Diderot's temperament, set against Goethean self-cultivation.
- nn: 3
  unit_id: ch2-youth-2
  note_id: morley-diderot-v1-ch2-youth-2
  span: 33799:50866
  chunks:
  - id: morley-diderot-v1#u03-c1
    label: c1
    heading: Divine gift of pity and the snuff-box
    char_start: 35477
    char_end: 37133
    start_quote: Throughout his life Diderot was blessed with that divine gift of pity,
    end_quote: nor more careless of his own ease.
    why: Morley's core claim that Diderot's sympathy was practical, delicate and acted on, with Diderot's
      own snuff-box anecdote.
  - id: morley-diderot-v1#u03-c2
    label: c2
    heading: 'The Formica leo: generosity abused'
    char_start: 39742
    char_end: 41122
    start_quote: It is needless to say that such a temper was constantly abused.
    end_quote: '''M. Diderot, I have the honour to wish you good day.'''
    why: Shows how Diderot's generosity was exploited and that he did not mind, via the family's testimony
      and the ant-lion anecdote.
  - id: morley-diderot-v1#u03-c3
    label: c3
    heading: Against public prosecutors for the universe
    char_start: 41125
    char_end: 42968
    start_quote: Yet insolence and ingratitude made no difference to Diderot.
    end_quote: that is all I remember; the rest is as good as forgotten."
    why: Diderot's reasoned leniency toward reprobates and his focus on the good, with Morley's hedged
      evaluation of it.
  - id: morley-diderot-v1#u03-c4
    label: c4
    heading: 'Not a man of books: truth in the service of doing good'
    char_start: 45199
    char_end: 46308
    start_quote: Yet Diderot was not essentially a man of books.
    end_quote: in the midst of incessant theorising.
    why: Morley's statement that Diderot subordinated knowledge to practical life, anticipating the social-practical
      emphasis of the Encyclopædia.
  - id: morley-diderot-v1#u03-c5
    label: c5
    heading: Courtship and marriage to Antoinette Champion (1743)
    char_start: 46352
    char_end: 48022
    start_quote: At the moment when he had most difficulty in procuring a little bread
    end_quote: In Diderot's case destiny was hostile.
    why: Narrates how the penniless Diderot won his marriage against his father's refusal.
  - id: morley-diderot-v1#u03-c6
    label: c6
    heading: Domestic disorder and Morley's refusal to judge
    char_start: 48024
    char_end: 50861
    start_quote: His wife was over thirty.
    end_quote: or the Cardinal de Rohan to the old opinions.
    why: Morley's account of the mismatch, the Puisieux and Voland liaisons, and his argument that irregular
      manners are not an effect of new religious opinions.
