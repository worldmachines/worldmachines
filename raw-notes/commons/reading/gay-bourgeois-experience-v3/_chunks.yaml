source: gay-bourgeois-experience-v3
units:
- nn: 1
  unit_id: front-introduction
  note_id: gay-bourgeois-experience-v3-front-introduction
  span: 0:14501
  chunks:
  - id: gay-bourgeois-experience-v3#u01-c1
    heading: 'Aggression as history''s fuel'
    span: 14:972
    why: 'States the book''s organizing thesis — that aggression is history''s central fuel and the Victorian bourgeoisie''s particular problem — in the volume''s opening lines.'
  - id: gay-bourgeois-experience-v3#u01-c2
    heading: 'Post-Darwinian license for enmity'
    span: 2394:2872
    why: 'Shows how post-Darwinian science was marshaled to naturalize aggression and names the persecuted ''convenient Others'' (Jews, dissenting sects, Mormons, Armenians) the era''s bigotry targeted.'
  - id: gay-bourgeois-experience-v3#u01-c3
    heading: 'Frustration as trigger: Seneca Falls and Impressionism'
    span: 5144:5672
    why: 'Gives Gay''s two concrete illustrations of the frustration-aggression thesis, grounding the abstract theory in bourgeois reaction to feminism and modern art.'
  - id: gay-bourgeois-experience-v3#u01-c4
    heading: 'Coining ''alibis for aggression'''
    span: 8132:8777
    why: 'Introduces Gay''s key analytic term, ''alibis for aggression,'' the rhetorical device the rest of the volume traces across politics, religion, and science.'
  - id: gay-bourgeois-experience-v3#u01-c5
    heading: 'Mastery over time, space, and scarcity'
    span: 8778:9117
    why: 'Names the volume''s revisionist claim that bourgeois aggression was also directed at mastering time, space, and scarcity — the passage most legible to a World Machines reading.'
  - id: gay-bourgeois-experience-v3#u01-c6
    heading: 'Eros and aggression as civilizational rivals'
    span: 12955:13531
    why: 'States the Freudian drive-theoretic frame — Eros versus aggression as civilization''s ''interminable contest'' — that organizes the whole book, illustrated by Freud''s own working habits.'
- nn: 2
  unit_id: front-mensur-1-jerome-fraternities
  note_id: gay-bourgeois-experience-v3-front-mensur-1-jerome-fraternities
  span: 14501:49729
  chunks:
  - id: gay-bourgeois-experience-v3#u02-c1
    heading: 'The two meanings of cultivation'
    span: 14925:15520
    why: 'States the book''s controlling thesis — aggression as pleasure vs. aggression as socially restrained — through the Mensur itself, orienting the whole unit.'
  - id: gay-bourgeois-experience-v3#u02-c2
    heading: 'Jerome''s confession: ‘I wanted more’'
    span: 23080:23725
    why: 'Jerome''s own escalating relish in the bloodshed is Gay''s key evidentiary passage for the claim that civilized restraint only thinly covers aggressive drives.'
  - id: gay-bourgeois-experience-v3#u02-c3
    heading: 'Wendel: the bourgeoisie feudalized itself'
    span: 32363:33771
    why: 'Wendel''s Reichstag jibe is the chapter''s sharpest sociological verdict that the German bourgeoisie had feudalized itself rather than the duel surviving as authentic aristocratic custom.'
  - id: gay-bourgeois-experience-v3#u02-c4
    heading: 'Weber: fraternities as insurance companies'
    span: 33773:34580
    why: 'Weber''s coinage gives the chapter''s cynical-insider reading of what duelling fraternities actually did: broker advancement, not preserve honor.'
  - id: gay-bourgeois-experience-v3#u02-c5
    heading: 'A forged pedigree'
    span: 44702:45892
    why: 'Shows the Mensur''s aristocratic pedigree to be contested and likely fabricated, undercutting the legitimacy claims built on it.'
  - id: gay-bourgeois-experience-v3#u02-c6
    heading: 'Scrupulously unpolitical'
    span: 48579:49727
    why: 'Demonstrates that the duelling fraternities functioned as cross-ideological elite-reproduction machinery, independent of members'' political convictions.'
- nn: 3
  unit_id: front-mensur-2-politics-adolescence
  note_id: gay-bourgeois-experience-v3-front-mensur-2-politics-adolescence
  span: 49729:86525
  chunks:
  - id: gay-bourgeois-experience-v3#u03-c1
    heading: '“Freedom, Honor, Fatherland”'
    span: 51302:52006
    why: 'States the fraternity''s founding slogan and Gay''s claim that it is the clearest proof of a “rising bourgeoisie” asserting itself politically.'
  - id: gay-bourgeois-experience-v3#u03-c2
    heading: 'Honor''s alibi for aggression'
    span: 53333:54282
    why: 'Names the mechanism — a seductive alibi for aggression licensed by professorial rhetoric — that Gay uses to explain how abstract conviction converted directly into real violence.'
  - id: gay-bourgeois-experience-v3#u03-c3
    heading: 'Aggression repressed by counteraggression'
    span: 56509:57650
    why: 'Compresses the Wartburg-Sand-Karlsbad escalation into the unit''s clearest statement of the repression cycle and the state''s control infrastructure against student radicalism.'
  - id: gay-bourgeois-experience-v3#u03-c4
    heading: 'Satisfaktionsunfähig and Jewish imitation'
    span: 62092:63225
    why: 'Shows the honor economy weaponized as anti-Semitic exclusion, and the paradox of Jewish students and fraternities adopting the very ritual used to mark them as Other.'
  - id: gay-bourgeois-experience-v3#u03-c5
    heading: 'The scar as passport'
    span: 77600:79102
    why: 'Gay''s own thesis sentence fusing aggression and love through the Mensur''s scar, the passage that most directly earns this unit''s focus on the psychology of the scar.'
  - id: gay-bourgeois-experience-v3#u03-c6
    heading: 'A living paradox'
    span: 85208:86523
    why: 'The unit''s psychoanalytic payoff, casting the Mensur as a compromise formation that let bourgeois sons defy and reproduce paternal authority at once.'
- nn: 4
  unit_id: p1-apotheosis-conflict-spencer-darwin
  note_id: gay-bourgeois-experience-v3-p1-apotheosis-conflict-spencer-darwin
  span: 86525:133411
  chunks:
  - id: gay-bourgeois-experience-v3#u04-c1
    heading: 'Alibis cultivate hatred in both senses'
    span: 87408:88683
    why: 'States the book''s governing pun—alibis for aggression both license and restrain hatred—and frames competition as the first of three parallel cases.'
  - id: gay-bourgeois-experience-v3#u04-c2
    heading: 'Spencer''s ''purifying process'''
    span: 103617:104894
    why: 'Gives Spencer''s doctrine in his own words—the clearest primary statement of competition-as-natural-law in the unit.'
  - id: gay-bourgeois-experience-v3#u04-c3
    heading: 'Spencer misnamed a Social Darwinist'
    span: 105821:106545
    why: 'The unit''s central historiographical claim: the label ''Social Darwinism'' retroactively credits Darwin for an independent, pre-existing doctrine.'
  - id: gay-bourgeois-experience-v3#u04-c4
    heading: 'Spencer disavows aggression'
    span: 114514:114815
    why: 'Shows the doctrine''s own author refusing its harshest implications, the tension Gay treats as most characteristic of Spencer.'
  - id: gay-bourgeois-experience-v3#u04-c5
    heading: 'Darwin''s text mined for anti-welfare argument'
    span: 120570:121581
    why: 'Documents the mechanism of selective appropriation by which Darwin''s careful science became a blunt social-policy weapon.'
  - id: gay-bourgeois-experience-v3#u04-c6
    heading: 'Zola''s Mouret as Darwinian fighter'
    span: 132471:133409
    why: 'Shows the alibi migrating into popular French fiction, where competition-as-natural-law becomes the unremarked common sense of a department-store plot.'
- nn: 5
  unit_id: p1-apotheosis-conflict-nietzsche-sumner
  note_id: gay-bourgeois-experience-v3-p1-apotheosis-conflict-nietzsche-sumner
  span: 133411:183521
  chunks:
  - id: gay-bourgeois-experience-v3#u05-c1
    heading: 'Nietzsche: life as appropriation and will to power'
    span: 137714:138848
    why: 'Isolates Nietzsche''s most-quoted formulation making aggression and domination definitional to life itself, the unit''s philosophical center of gravity.'
  - id: gay-bourgeois-experience-v3#u05-c2
    heading: 'Sumner: nature as niggardly tribunal'
    span: 152617:154259
    why: 'The starkest statement of Sumner''s Social Darwinist first principles, including the deliberate omission of altruism from human motives.'
  - id: gay-bourgeois-experience-v3#u05-c3
    heading: 'Darwin distances himself from ''Darwinism'''
    span: 143711:144514
    why: 'Gay''s own methodological aside plus Darwin''s Lyell letter mark the pivot from cataloguing the doctrine to questioning its coherence.'
  - id: gay-bourgeois-experience-v3#u05-c4
    heading: 'Carnegie and Rockefeller''s monopoly paradox'
    span: 166037:167055
    why: 'Shows the alibi''s central self-contradiction: champions of competition who built monopolies precisely to escape competing.'
  - id: gay-bourgeois-experience-v3#u05-c5
    heading: 'Sumner against imperialism and ''earth hunger'''
    span: 157027:157814
    why: 'Necessary counterweight showing Sumner''s alibi for aggression was deliberately self-limiting, licensing economic but not martial conflict.'
  - id: gay-bourgeois-experience-v3#u05-c6
    heading: 'Holmes''s Lochner dissent'
    span: 181432:182698
    why: 'Traces the alibi''s furthest reach, from rhetoric into constitutional doctrine, and its naming as ideology by a dissenting justice.'
- nn: 6
  unit_id: p1-convenient-other-race-theory
  note_id: gay-bourgeois-experience-v3-p1-convenient-other-race-theory
  span: 183521:227582
  chunks:
  - id: gay-bourgeois-experience-v3#u06-c1
    heading: 'Defining the convenient Other'
    span: 183546:184297
    why: 'States Gay''s organizing thesis with its paradigm case — hating a collective Other is a serviceable, ancient alibi for aggression, as shown by French anti-Semites'' persistence against evidence in the Dreyfus Affair.'
  - id: gay-bourgeois-experience-v3#u06-c2
    heading: 'From classification to racism'
    span: 194350:195437
    why: 'Marks the hinge the whole unit turns on: Enlightenment racial taxonomy (Linné, Buffon, Blumenbach) was not yet racism, which nineteenth-century thinkers add on top of it.'
  - id: gay-bourgeois-experience-v3#u06-c3
    heading: 'Freud''s theory of projection'
    span: 187993:189667
    why: 'Gay''s explanatory key for the entire chapter — Freud''s projection mechanism explains why aggression requires a convenient Other to land on.'
  - id: gay-bourgeois-experience-v3#u06-c4
    heading: 'Chekhov diagnoses projection without the word'
    span: 191632:192654
    why: 'Shows the projection mechanism recognized in real time, outside psychoanalysis, applied to the very Dreyfus Affair that opens the unit.'
  - id: gay-bourgeois-experience-v3#u06-c5
    heading: 'Broca''s craniometry, immune to its own evidence'
    span: 203229:204470
    why: 'The pseudoscience''s method in miniature: measurement that keeps producing embarrassing results yet never revises its racial ranking, only its criteria.'
- nn: 7
  unit_id: p1-convenient-other-colonial-violence
  note_id: gay-bourgeois-experience-v3-p1-convenient-other-colonial-violence
  span: 227582:265594
  chunks:
  - id: gay-bourgeois-experience-v3#u07-c1
    heading: 'The Eyre Affair''s Ironic Resolution'
    span: 232688:233741
    why: 'Shows that even Eyre''s prosecutors shared his racial premises, exposing how deep the racial alibi ran beneath a controversy that looked like a clean moral divide.'
  - id: gay-bourgeois-experience-v3#u07-c2
    heading: 'Carl Peters and Colonial Narcissistic Injury'
    span: 239441:240001
    why: 'Gay''s clearest statement that colonial violence answered the colonizer''s own psychological need for reassurance, not only economic or strategic aims.'
  - id: gay-bourgeois-experience-v3#u07-c3
    heading: 'Congo Free State: Denial as Enabling Condition'
    span: 241690:242714
    why: 'Demonstrates that mass atrocity depended on ordinary bystanders'' willed ignorance as much as on the perpetrators'' cruelty.'
  - id: gay-bourgeois-experience-v3#u07-c4
    heading: 'Von Trotha''s Extermination of the Hereros'
    span: 245711:246846
    why: 'The unit''s starkest casualty account and its clearest case of a colonial power adopting explicit extermination as policy, then having that policy ratified at the ballot box.'
  - id: gay-bourgeois-experience-v3#u07-c5
    heading: 'Sumner on the Two Codes of Morals'
    span: 254754:255930
    why: 'States the mechanism underlying the whole unit: group cohesion is manufactured through hostility to outsiders, with religion intensifying rather than restraining it.'
  - id: gay-bourgeois-experience-v3#u07-c6
    heading: 'Finot Names the Alibi'
    span: 255934:256598
    why: 'The passage that states the unit''s thesis outright, using Gay''s own key term for racist pseudo-science''s social function.'
- nn: 8
  unit_id: p1-manliness-ideal-ambiguity
  note_id: gay-bourgeois-experience-v3-p1-manliness-ideal-ambiguity
  span: 265594:290321
  chunks:
  - id: gay-bourgeois-experience-v3#u08-c1
    heading: 'Manliness as a Bourgeois Substitute for Battlefield Heroism'
    span: 266004:266493
    why: 'States the chapter''s founding move: an aristocratic chivalric ideal, democratized, becomes the bourgeoisie''s alibi for channeling aggression into commerce, industry, and politics instead of war.'
  - id: gay-bourgeois-experience-v3#u08-c2
    heading: '“An Uncertain Mechanism”: Kingsley and the Fear of Comfort'
    span: 266884:267728
    why: 'Gay''s own thesis sentence, illustrated by Kingsley''s fear that policed, comfortable modernity was reducing men to cowardly “lap-dog” effeminacy.'
  - id: gay-bourgeois-experience-v3#u08-c3
    heading: '“Incurable Imprecision”: The Term''s Central Instability'
    span: 275821:276336
    why: 'The chapter''s interpretive crux: manliness meant so many contradictory things (Oscar Wilde called both manly and unmanly) that it could not function as a stable alibi.'
  - id: gay-bourgeois-experience-v3#u08-c4
    heading: 'Heine''s Mockery: “Manly Wrath” as Reflexive Obedience'
    span: 282815:283503
    why: 'Heine''s satire of German anti-Napoleonic “manly wrath” as mere princely-ordered conformity caps Gay''s case that the ideal''s elasticity undercut its own aggression-licensing function.'
  - id: gay-bourgeois-experience-v3#u08-c5
    heading: 'The Resolution: Manliness as Self-Assertion Disciplined by Self-Control'
    span: 287047:288605
    why: 'Gives the era''s own settlement of the ambiguity: Gurlitt, Foerster, and even G. Stanley Hall define true manliness as aggression bound by self-control, sidelining the pure virility extremists.'
  - id: gay-bourgeois-experience-v3#u08-c6
    heading: 'Room for Tenderness, and Ruskin''s Wishful Portrait'
    span: 288607:290211
    why: 'Shows the ideal''s practical flexibility (manly tears, husbands at childbirth, strenuous but still “womanly” women) and closes by naming Ruskin''s separate-spheres image as aspiration rather than social reality.'
- nn: 9
  unit_id: p1-manliness-hughes-honor-code
  note_id: gay-bourgeois-experience-v3-p1-manliness-hughes-honor-code
  span: 290321:325778
  chunks:
  - id: gay-bourgeois-experience-v3#u09-c1
    heading: 'Tom Brown''s fighting family and the Rugby ideal'
    span: 291354:292114
    why: 'Establishes the unreflective, pugilistic baseline of Hughes''s manly ideal before he complicates it.'
  - id: gay-bourgeois-experience-v3#u09-c2
    heading: 'Greg on Kingsley: aggression licensed as religion'
    span: 303399:304117
    why: 'The clearest statement in the unit of manliness functioning as an alibi for aggression.'
  - id: gay-bourgeois-experience-v3#u09-c3
    heading: 'The cult of honor defined'
    span: 313847:315294
    why: 'The unit''s pivot: defines the rigidly legible, rule-bound honor code against which bourgeois manliness looks comparatively civilized.'
  - id: gay-bourgeois-experience-v3#u09-c4
    heading: 'Lamar invokes honor to justify the Civil War'
    span: 315350:316457
    why: 'Concrete case of honor-code logic operating as a causal force in real political violence, not just private manners.'
  - id: gay-bourgeois-experience-v3#u09-c5
    heading: 'The Manliness of Christ: manliness above courage'
    span: 299736:300641
    why: 'Shows Hughes''s own mature redefinition of manliness as a spiritual quality that subordinates mere physical courage.'
- nn: 10
  unit_id: p1-tr-extremist-of-the-center
  note_id: gay-bourgeois-experience-v3-p1-tr-extremist-of-the-center
  span: 325778:358668
  chunks:
  - id: gay-bourgeois-experience-v3#u10-c1
    heading: 'Alibis for aggression incarnated in one man'
    span: 325812:326555
    why: 'States Gay''s method explicitly: reading a collective cultural phenomenon through one exemplary biography.'
  - id: gay-bourgeois-experience-v3#u10-c2
    heading: 'Counterphobic behavior and the strenuous life'
    span: 329530:330445
    why: 'Gives the psychoanalytic mechanism Gay uses to explain manliness as reaction to childhood helplessness rather than pure ideology.'
  - id: gay-bourgeois-experience-v3#u10-c3
    heading: 'Manliness of fibre, University of Berlin'
    span: 342040:342935
    why: 'T.R.''s own words make manliness-as-alibi explicit and public, naming softness/comfort as civilizational danger.'
  - id: gay-bourgeois-experience-v3#u10-c4
    heading: 'Race suicide and the convenient Other'
    span: 350864:352242
    why: 'The chapter''s clearest instance of the convenient-Other alibi (race and nation), including the race-suicide panic central to Gay''s argument.'
  - id: gay-bourgeois-experience-v3#u10-c5
    heading: 'Extremist of the center'
    span: 356050:356957
    why: 'Names the chapter''s title-phrase and shows aggression converted into a stabilizing rather than revolutionary political posture.'
  - id: gay-bourgeois-experience-v3#u10-c6
    heading: 'Prudent rather than rash aggression'
    span: 357576:358666
    why: 'Gay''s closing verdict on the chapter: T.R.''s career as the taming of aggression into workable political achievement.'
- nn: 11
  unit_id: p2-civilized-rationales
  note_id: gay-bourgeois-experience-v3-p2-civilized-rationales
  span: 358668:397492
  chunks:
  - id: gay-bourgeois-experience-v3#u11-c1
    heading: 'Holmes''s letter: hatred taking the wheel'
    span: 360189:360539
    why: 'The volume''s opening case study of ordinary bourgeois self-control giving way to violent fantasy under moral license, the emotional data point Gay''s whole argument about aggression''s respectability begins from.'
  - id: gay-bourgeois-experience-v3#u11-c2
    heading: 'Gay''s diagnosis: conviction as license for punitiveness'
    span: 363220:363682
    why: 'States, in Gay''s own analytic voice, the mechanism (moral certainty converting into license for extreme aggression) that the rest of the unit traces through nineteenth-century penal theory.'
  - id: gay-bourgeois-experience-v3#u11-c3
    heading: 'Punishment as alibi for vengeance'
    span: 367311:368855
    why: 'The section''s thesis sentence, naming punishment explicitly as an alibi that legitimizes an urge for revenge no one could fully repudiate.'
  - id: gay-bourgeois-experience-v3#u11-c4
    heading: 'Freud''s Totem and Taboo as founding myth of guilt'
    span: 371213:372679
    why: 'Gay''s most explicit statement that punishment and self-restraint narratives (Genesis, Greek myth, Freud) share one structure and that civilization is built on this cycle of crime, guilt, and restraint.'
  - id: gay-bourgeois-experience-v3#u11-c5
    heading: 'Manliness deployed against penal reform'
    span: 379888:380496
    why: 'Shows the gendered rhetoric — effeminate reformers versus manly toughness — that let hostility toward criminals pass as virtue rather than aggression, a direct instance of Gay''s manliness-as-alibi theme.'
  - id: gay-bourgeois-experience-v3#u11-c6
    heading: 'Stephen: punishment should express hatred'
    span: 394731:395969
    why: 'The century''s most candid admission that punishment functions to gratify collective hatred, the clearest statement of legalized aggression the unit produces.'
- nn: 12
  unit_id: p2-prisons-pathos-reform-disillusionment
  note_id: gay-bourgeois-experience-v3-p2-prisons-pathos-reform-disillusionment
  span: 397492:429042
  chunks:
  - id: gay-bourgeois-experience-v3#u12-c1
    heading: 'The reluctant judge, dry-eyed in fact'
    span: 399202:400156
    why: 'Greg''s 1855 plea for compassionate judges captures Victorian reformist rhetoric at its highest pitch, which Gay immediately punctures as sentiment outrunning practice.'
  - id: gay-bourgeois-experience-v3#u12-c2
    heading: 'He had become a machine'
    span: 408748:409419
    why: 'The chapter''s starkest image of a person absorbed into disciplinary apparatus until he is no longer a feeling being but a mechanism.'
  - id: gay-bourgeois-experience-v3#u12-c3
    heading: 'Bentham on the psychology of punishment'
    span: 411264:412192
    why: 'Bentham''s aphorisms on vengefulness are Gay''s clearest statement that punitive law is aggression given a rationalized alibi.'
  - id: gay-bourgeois-experience-v3#u12-c4
    heading: 'Bourgeois values behind bars'
    span: 423638:424403
    why: 'States directly what the penitentiary regime was meant to manufacture in convicts: bourgeois self-discipline, not merely repentance.'
  - id: gay-bourgeois-experience-v3#u12-c5
    heading: 'Recidivism and the collapse of confidence'
    span: 425978:426921
    why: 'Marks the chapter''s pivot from reformist confidence to disillusionment, setting up the turn toward medical-legal criminology.'
- nn: 13
  unit_id: p2-mnaghten-insanity-plea
  note_id: gay-bourgeois-experience-v3-p2-mnaghten-insanity-plea
  span: 429042:454778
  chunks:
  - id: gay-bourgeois-experience-v3#u13-c1
    heading: 'Defining the M’Naghten and ‘irresistible impulse’ rules'
    span: 430381:431379
    why: 'This is the exact legal-doctrinal content the whole unit''s argument depends on: what the M''Naghten and irresistible-impulse rules actually excused.'
  - id: gay-bourgeois-experience-v3#u13-c2
    heading: 'Lombroso''s theory of the born criminal'
    span: 437188:438558
    why: 'States Lombroso''s central, most consequential claim — that criminality is inborn and biologically legible — in his own programmatic terms.'
  - id: gay-bourgeois-experience-v3#u13-c3
    heading: 'Stigmata of the born criminal and Lombroso''s ''dazzling moment'''
    span: 438560:439110
    why: 'Shows the theory''s operative content (a checklist of bodily signs) and its self-mythologized origin, which Gay immediately undercuts.'
  - id: gay-bourgeois-experience-v3#u13-c4
    heading: 'Rival receptions: Ellis and Taine versus Tarde and Nacke'
    span: 442213:443118
    why: 'Captures the ideological split the theory provoked, including Taine''s dehumanizing language, without which Lombroso''s cultural impact can''t be judged.'
  - id: gay-bourgeois-experience-v3#u13-c5
    heading: 'The distributed institutional apparatus of reform'
    span: 447330:448147
    why: 'Documents the reform movement as an accretion of journals, congresses, and organizations rather than one theorist''s triumph.'
  - id: gay-bourgeois-experience-v3#u13-c6
    heading: 'From vengeance to refined pleasure'
    span: 453893:454776
    why: 'States the volume''s larger thesis in miniature: the cultivation of aggression as its channelling into more refined forms, not its abolition.'
- nn: 14
  unit_id: p2-bourgeois-conscience-capital-punishment
  note_id: gay-bourgeois-experience-v3-p2-bourgeois-conscience-capital-punishment
  span: 454778:497406
  chunks:
  - id: gay-bourgeois-experience-v3#u14-c1
    heading: 'Redescribing vindictiveness as pathology'
    span: 454815:455786
    why: 'States the unit''s thesis directly: the abolitionist project as a reclassification of retributive pleasure into pathology.'
  - id: gay-bourgeois-experience-v3#u14-c2
    heading: 'Kant and Goethe''s alibis for retaining the death penalty'
    span: 455934:456441
    why: 'Shows the era''s most respected moral thinkers supplying dignity- and order-based alibis for continued state killing.'
  - id: gay-bourgeois-experience-v3#u14-c3
    heading: 'Guiteau: insanity diagnosed, vengeance demanded'
    span: 464547:465164
    why: 'Dramatizes the gap between psychiatric findings and the public''s need for a sacrificial death, the unit''s central case study.'
  - id: gay-bourgeois-experience-v3#u14-c4
    heading: 'Neate on judges'' pleasure in sentencing death'
    span: 484926:485793
    why: 'The unit''s most explicit statement of Gay''s Freudian argument that punishment gratifies aggression, not only enforces order.'
  - id: gay-bourgeois-experience-v3#u14-c5
    heading: 'Livingston on soldiers versus criminals'
    span: 491884:492147
    why: 'The sharpest piece of deterrence psychology in the unit, undercutting the rational-actor assumption behind pro-execution arguments.'
  - id: gay-bourgeois-experience-v3#u14-c6
    heading: 'Law outrunning practice'
    span: 470874:471727
    why: 'Closing statistical evidence that capital punishment survived mainly as formal law while its actual application withered.'
- nn: 15
  unit_id: p2-spectacle-execution-victor-hugo
  note_id: gay-bourgeois-experience-v3-p2-spectacle-execution-victor-hugo
  span: 497406:517117
  chunks:
  - id: gay-bourgeois-experience-v3#u15-c1
    heading: 'Hangings degenerate into carnival'
    span: 497595:498347
    why: 'States the unit''s opening thesis: the ritual purpose of execution collapsed into disorderly mass entertainment.'
  - id: gay-bourgeois-experience-v3#u15-c2
    heading: 'Holtei: erotic fixation and grotesque calm amid the killing'
    span: 501046:501521
    why: 'The unit''s clearest evidence for Gay''s thesis that aggression and eros intermingle in the spectator''s experience of execution.'
  - id: gay-bourgeois-experience-v3#u15-c3
    heading: 'Dickens on the Newgate crowd'
    span: 503807:504054
    why: 'The most quoted contemporary indictment of the crowd, and the moral seed of the journalistic case against public execution.'
  - id: gay-bourgeois-experience-v3#u15-c4
    heading: 'Hugo''s origin memory: the branding'
    span: 508435:508775
    why: 'Hugo''s own account of the childhood scene he credited as the origin of his fifty-year abolitionist crusade.'
  - id: gay-bourgeois-experience-v3#u15-c5
    heading: 'Hugo''s manifesto: priest, king, hangman'
    span: 512893:513166
    why: 'Hugo''s most compressed political formulation of abolition as the last stage of the revolt against the Old Regime.'
  - id: gay-bourgeois-experience-v3#u15-c6
    heading: 'The state''s anxious monopoly on aggression'
    span: 513698:514740
    why: 'The unit''s structural argument: the death-penalty debate was underwritten by the state''s insecure grip on its own monopoly on violence.'
- nn: 16
  unit_id: p2-pleasures-pain-flogging-sadism-masochism
  note_id: gay-bourgeois-experience-v3-p2-pleasures-pain-flogging-sadism-masochism
  span: 517117:566260
  chunks:
  - id: gay-bourgeois-experience-v3#u16-c1
    heading: 'The Boston School Committee''s utilitarian alibi'
    span: 529575:530513
    why: 'The clearest institutional example of an alibi converting aggression into a duty justified by calculated public good.'
  - id: gay-bourgeois-experience-v3#u16-c2
    heading: 'Montaigne''s dissent from flogging'
    span: 523256:523765
    why: 'Gives the centuries-old counter-tradition against flogging and its psychological diagnosis of cruelty as cowardice, cited via the wiki-linked Montaigne.'
  - id: gay-bourgeois-experience-v3#u16-c3
    heading: 'Sneyd-Kynnersley''s flogging ritual, per Roger Fry'
    span: 553347:554599
    why: 'The chapter''s most vivid eyewitness account of flogging as ritualized institution, establishing the erotic ambiguity the chapter goes on to theorize.'
  - id: gay-bourgeois-experience-v3#u16-c4
    heading: 'Krafft-Ebing names sadism and masochism'
    span: 555596:556108
    why: 'The pivot from flogging-as-practice to sadism/masochism-as-diagnosis, naming the two writers whose lives supplied the clinical vocabulary.'
  - id: gay-bourgeois-experience-v3#u16-c5
    heading: 'Freud: the sadist is always a masochist too'
    span: 564115:564865
    why: 'States Gay''s theoretical payoff, via Freud 1905, that sadism and masochism are one drive turned outward or inward rather than two separate pathologies.'
  - id: gay-bourgeois-experience-v3#u16-c6
    heading: 'Rousseau''s originary case of masochism'
    span: 559385:559673
    why: 'Gay''s canonical historical instance of punishment becoming desired rather than feared, which he treats as the template later English schoolboys relived.'
- nn: 17
  unit_id: p2-domestic-violence-rape-suicide
  note_id: gay-bourgeois-experience-v3-p2-domestic-violence-rape-suicide
  span: 566260:609088
  chunks:
  - id: gay-bourgeois-experience-v3#u17-c1
    heading: 'Krafft-Ebing, Freud, and the framing of pathological aggression'
    span: 568378:569752
    why: 'States the unit''s organizing claim that violence against women and violence against the self are two expressions of one sadistic/masochistic economy.'
  - id: gay-bourgeois-experience-v3#u17-c2
    heading: 'Statistical refutation of bourgeois self-acquittal'
    span: 571090:572193
    why: 'Supplies the execution, prison, and Jack the Ripper evidence that dismantles the middle class''s claim that only aristocrats and laborers committed violence against women.'
  - id: gay-bourgeois-experience-v3#u17-c3
    heading: 'Rape as power''s instrument, not desire''s overflow'
    span: 577615:578022
    why: 'Gay''s sharpest thesis sentence on rape, the analytic claim the rest of the unit''s rape material is built to support.'
  - id: gay-bourgeois-experience-v3#u17-c4
    heading: 'Suicide as sin and crime under the old regime'
    span: 593118:594513
    why: 'Establishes the punitive theological/legal baseline against which the century''s reclassification of suicide is measured.'
  - id: gay-bourgeois-experience-v3#u17-c5
    heading: 'Durkheim''s declaration of scientific faith'
    span: 607282:607734
    why: 'Completes suicide''s reclassification as a sociological object while its evangelical tone shows the ''scientific'' turn still carries a moral charge.'
- nn: 18
  unit_id: p3-redefinitions
  note_id: gay-bourgeois-experience-v3-p3-redefinitions
  span: 609088:626868
  chunks:
  - id: gay-bourgeois-experience-v3#u18-c1
    heading: 'Thesis: politics as the great beneficiary of Victorian redefinition'
    span: 609144:609870
    why: 'States the chapter''s and Part Three''s opening thesis: politics as the prime site of a century-long redefinition of legitimate aggression.'
  - id: gay-bourgeois-experience-v3#u18-c2
    heading: 'Politics defined as sublimated aggression'
    span: 609872:610605
    why: 'Gay''s core definition of politics as channeled, sublimated aggression, sharply distinguished from raw hostility ("a pogrom... is not politics").'
  - id: gay-bourgeois-experience-v3#u18-c3
    heading: 'The infrastructural precondition for modern politics'
    span: 612012:612381
    why: 'Names the concrete institutional/technological infrastructure legitimate politics depends on, the passage most resonant with WMP''s legibility frame.'
  - id: gay-bourgeois-experience-v3#u18-c4
    heading: 'Ancient politics as unsublimated violence'
    span: 612415:613908
    why: 'Supplies the historical contrast case (ancient/absolutist politics as acted-out rather than sublimated aggression) against which the chapter''s modern development is measured.'
  - id: gay-bourgeois-experience-v3#u18-c5
    heading: 'The fiction of evil advisers and Richelieu''s cultivated hatred'
    span: 615486:616724
    why: 'Shows the absolutist mechanism for displacing and legitimating hostility, with a line that directly echoes the volume''s title theme of cultivated hatred.'
  - id: gay-bourgeois-experience-v3#u18-c6
    heading: 'Tocqueville''s uncertainty and the warning of the new Caesars'
    span: 625470:625946
    why: 'Closes the chapter by pivoting into Part Three''s other pole: the risk that the newly legitimated machinery of political aggression is captured by a demagogue.'
- nn: 19
  unit_id: p3-long-birth-political-culture
  note_id: gay-bourgeois-experience-v3-p3-long-birth-political-culture
  span: 626868:675337
  chunks:
  - id: gay-bourgeois-experience-v3#u19-c1
    heading: 'Politics as aggression sublimated'
    span: 626908:627992
    why: 'States the chapter''s organizing thesis directly, using Palmerston''s own parliamentary courtesy as the exhibit.'
  - id: gay-bourgeois-experience-v3#u19-c2
    heading: 'Burke''s definition of party'
    span: 630147:630909
    why: 'Burke''s ''no proscriptions'' clause is the conceptual hinge that converts faction into legitimate party.'
  - id: gay-bourgeois-experience-v3#u19-c3
    heading: 'Revolutionary denunciation as civic education gone wrong'
    span: 641799:642648
    why: 'Shows the Revolution''s ''hypertrophy of politics,'' where the right to aggression it broadened was instead monopolized and turned into a loyalty test.'
  - id: gay-bourgeois-experience-v3#u19-c4
    heading: 'Napoleon''s antipolitics'
    span: 648383:649144
    why: 'The chapter''s clearest negative case: legitimate opposition defined by contrast with its total suppression.'
  - id: gay-bourgeois-experience-v3#u19-c5
    heading: 'Britain''s accidental two-party system'
    span: 654585:655137
    why: 'Captures the chapter''s claim that Britain, unlike America or France, backed into stable party politics without an ideological crisis.'
  - id: gay-bourgeois-experience-v3#u19-c6
    heading: 'France''s constitutional instability'
    span: 674828:675335
    why: 'The chapter''s closing ledger of how fragile legitimate opposition remained even where it had been most deliberately pursued.'
- nn: 20
  unit_id: p3-modern-caesars-napoleon
  note_id: gay-bourgeois-experience-v3-p3-modern-caesars-napoleon
  span: 675337:726471
  chunks:
  - id: gay-bourgeois-experience-v3#u20-c1
    heading: 'Great men vs. larger forces'
    span: 675356:676597
    why: 'Sets up the unit''s opening tension between Carlyle''s hero worship and Tocqueville/Marx''s structural causation, the frame the rest of the section argues against and through.'
  - id: gay-bourgeois-experience-v3#u20-c2
    heading: 'Erotic democracy: the dual amorous bond'
    span: 680007:680739
    why: 'This is Gay''s most explicit statement of Caesarism as an alibi for aggression: love for the leader purchases license to hate the excluded.'
  - id: gay-bourgeois-experience-v3#u20-c3
    heading: 'De Quincey''s beneficient rape of Rome'
    span: 683662:684110
    why: 'The starkest textual evidence in the unit that nineteenth-century hero-worship of Caesar carried an eroticized, gendered charge of domination.'
  - id: gay-bourgeois-experience-v3#u20-c4
    heading: 'Marx: he could signify everything save himself'
    span: 702617:703024
    why: 'Crystallizes, in one quoted line, the mechanism by which Louis Napoleon''s emptiness let him serve as a screen for mass hopes.'
  - id: gay-bourgeois-experience-v3#u20-c5
    heading: 'Haussmann''s Paris: beauty and crowd control'
    span: 719699:720725
    why: 'Shows civic modernization and counterinsurgent control as the same physical act, the unit''s clearest legibility-as-instrument passage.'
  - id: gay-bourgeois-experience-v3#u20-c6
    heading: 'Bismarck outplays Bonapartism'
    span: 726067:726469
    why: 'The unit''s closing verdict, framing Caesarism as a reusable political technology that outlives any one practitioner, including its own namesake.'
- nn: 21
  unit_id: p3-modern-caesars-bismarck
  note_id: gay-bourgeois-experience-v3-p3-modern-caesars-bismarck
  span: 726471:765498
  chunks:
  - id: gay-bourgeois-experience-v3#u21-c1
    heading: 'Bismarck as the historian''s ideal case of aggression'
    span: 726471:727506
    why: 'States the chapter''s method up front: Bismarck is chosen as the case study because his shrewdness and visibility make his aggression legible, framing everything that follows.'
  - id: gay-bourgeois-experience-v3#u21-c2
    heading: 'Ruthlessness as law of life: enmity as alibi'
    span: 734685:735514
    why: 'Gives Gay''s core psychological claim in his own words — that dividing the world into allies and enemies functioned as an alibi for Bismarck''s own pugnacity — the volume''s alibi-for-aggression thesis stated in miniature.'
  - id: gay-bourgeois-experience-v3#u21-c3
    heading: 'Childhood roots: an idealized father, an unforgiven mother'
    span: 743889:745013
    why: 'The chapter''s explanatory backbone: Gay derives Bismarck''s adult need for enemies from an unresolved, asymmetric relationship to his two parents.'
  - id: gay-bourgeois-experience-v3#u21-c4
    heading: 'Universal suffrage as a weapon against liberal parliamentarism'
    span: 754635:755573
    why: 'Supplies the concrete Bonapartist mechanism behind the scout''s “modern Caesar” label — suffrage as a device to outflank liberals, in Bismarck''s own confessed words.'
  - id: gay-bourgeois-experience-v3#u21-c5
    heading: 'Weber''s verdict: a nation without political will'
    span: 762758:763426
    why: 'Delivers the chapter''s closing judgment, converting the preceding character study into an assessment of Bismarck''s institutional legacy for German political culture.'
- nn: 22
  unit_id: p3-human-nature-suffrage-debate
  note_id: gay-bourgeois-experience-v3-p3-human-nature-suffrage-debate
  span: 765498:790640
  chunks:
  - id: gay-bourgeois-experience-v3#u22-c1
    heading: 'The franchise as a question about human nature'
    span: 765527:766613
    why: 'States the unit''s organizing claim: for serious Victorian thinkers, debates over the vote were really debates about human nature''s capacity for reason versus aggression.'
  - id: gay-bourgeois-experience-v3#u22-c2
    heading: 'Liberals versus democrats: the rational-citizen test'
    span: 782167:782989
    why: 'Gay''s sharpest formulation of the real dividing line in the century''s suffrage debates, and the empirical doubt (illiteracy, exhaustion, habit) it turned on.'
  - id: gay-bourgeois-experience-v3#u22-c3
    heading: 'Prussia''s three-class electoral law'
    span: 779533:779947
    why: 'Concrete case of a formally neutral rule engineered to entrench aristocratic power, the unit''s clearest institutional ''alibi'' for exclusion.'
  - id: gay-bourgeois-experience-v3#u22-c4
    heading: 'Guizot: democracy as the unleashing of human nature'
    span: 785904:786204
    why: 'Guizot''s psychological argument against democracy states in miniature the Freudian instinct-management frame Gay applies to the whole volume.'
  - id: gay-bourgeois-experience-v3#u22-c5
    heading: 'The Belgian paradox of lowered property tests'
    span: 778132:778321
    why: 'Crisp statement of the paradox running through the unit: broadening formal eligibility without broadening real independence just shifts power to whoever controls the newly enfranchised.'
  - id: gay-bourgeois-experience-v3#u22-c6
    heading: 'Sybel: equality as folly until education catches up'
    span: 789968:790511
    why: 'Closes the unit in 1862 with the liberal case for exclusion still fully intact on the eve of Bismarck''s empire, showing the debate as unresolved after a century.'
- nn: 23
  unit_id: p3-human-nature-britain-reform
  note_id: gay-bourgeois-experience-v3-p3-human-nature-britain-reform
  span: 790640:830402
  chunks:
  - id: gay-bourgeois-experience-v3#u23-c1
    heading: 'Reform as political theater, not fated progress'
    span: 790640:791567
    why: 'States the unit''s counter-thesis up front: reform looked inevitable in retrospect but was contingent melodrama, exemplified by the Conservatives carrying the more radical act.'
  - id: gay-bourgeois-experience-v3#u23-c2
    heading: 'Self-command as the franchise''s real qualification'
    span: 803359:803855
    why: 'Gladstone''s own criterion for enfranchisement makes explicit Gay''s thesis that mass politics required sublimating, not eliminating, aggressive impulse.'
  - id: gay-bourgeois-experience-v3#u23-c3
    heading: 'Competitive examination replaces patronage in the civil service'
    span: 801383:802656
    why: 'The clearest instance in the unit of political legibility-building: merit measured by impersonal examination rather than birth or connection.'
  - id: gay-bourgeois-experience-v3#u23-c4
    heading: 'Beatrice Potter watches Chamberlain seduce Birmingham'
    span: 821515:822300
    why: 'Shows the erotic substrate of British oratory itself, undercutting any clean line between Britain''s rational politics and Continental Caesarism.'
  - id: gay-bourgeois-experience-v3#u23-c5
    heading: 'Boulanger''s failed plebiscitary bid'
    span: 817785:819374
    why: 'Gay''s fullest Continental counter-case: Caesarism as the road mass politics takes when charisma, not procedure, channels aggression.'
  - id: gay-bourgeois-experience-v3#u23-c6
    heading: 'Gladstone at Midlothian: sublimation, not exception'
    span: 825870:826277
    why: 'Gay''s closing synthesis: Gladstone''s rational campaign is not the absence of the erotic-aggressive current but its successful sublimation.'
- nn: 24
  unit_id: p4-domesticity-alibis-power-paradox
  note_id: gay-bourgeois-experience-v3-p4-domesticity-alibis-power-paradox
  span: 830402:876741
  chunks:
  - id: gay-bourgeois-experience-v3#u24-c1
    heading: 'The two alibis for the male monopoly on aggression'
    span: 843362:844666
    why: 'Names the unit''s organizing claim outright and shows naturalized gender difference (Tennyson''s hunter/game, nature as ''legible'') foreclosing reasoned argument except from a rare dissenter like Mill.'
  - id: gay-bourgeois-experience-v3#u24-c2
    heading: 'Hegel: woman thrones in the family, man alone earns aggression'
    span: 841467:842455
    why: 'Gives the doctrine its philosophical seal, tying feminine domesticity directly to the claim that only men have earned the right to aggression.'
  - id: gay-bourgeois-experience-v3#u24-c3
    heading: 'The paradox of the powerful, weaker sex'
    span: 847410:848396
    why: 'Captures the second alibi in its most quotable form (the cradle-rocking couplet) and Hegel''s harsher reading of domestic influence as a subversive ''eternal irony.'''
  - id: gay-bourgeois-experience-v3#u24-c4
    heading: 'Ruskin''s "Of Queens'' Gardens": rule without contest'
    span: 866538:867791
    why: 'The era''s fullest, most popular statement of the separate-spheres doctrine, assigning man all agency, conflict, and error, and woman rule without contest.'
  - id: gay-bourgeois-experience-v3#u24-c5
    heading: 'Omnipotent mother or perpetual child'
    span: 865728:866536
    why: 'Gay''s own synthesis showing both idealizing myths served the identical purpose of keeping women out of public aggression.'
  - id: gay-bourgeois-experience-v3#u24-c6
    heading: 'Wollstonecraft''s rebuttal: no sex in souls'
    span: 871191:871942
    why: 'The unit''s clearest statement of the dissenting position, anchoring the counter-current running through the century.'
- nn: 25
  unit_id: p4-domesticity-education-womens-magazines
  note_id: gay-bourgeois-experience-v3-p4-domesticity-education-womens-magazines
  span: 876741:902173
  chunks:
  - id: gay-bourgeois-experience-v3#u25-c1
    heading: 'Anna Wheeler''s 1830 admission of double hostility'
    span: 877299:877781
    why: 'Names the psychological price of domestic training and shows an early feminist voice diagnosing women''s own internalized self-abasement, not just men''s hostility.'
  - id: gay-bourgeois-experience-v3#u25-c2
    heading: 'The genre of conscious self-denigration'
    span: 881559:882208
    why: 'Establishes self-abasement as a widespread, cross-national literary genre and gives its starkest instance (Child''s race analogy).'
  - id: gay-bourgeois-experience-v3#u25-c3
    heading: 'From trickle to torrent: the rise of the women''s magazine'
    span: 883860:885080
    why: 'Traces the institutional history of the women''s magazine as a mass-diffusion technology for domestic ideology, the pivot to the unit''s second half.'
  - id: gay-bourgeois-experience-v3#u25-c4
    heading: 'Sarah Hale as a living paradox'
    span: 888045:888662
    why: 'States the unit''s central irony directly: an aggressively capable editor building a career on preaching women''s submission.'
  - id: gay-bourgeois-experience-v3#u25-c5
    heading: 'The Wumenheyter satire and its punchline'
    span: 899587:900444
    why: 'Hale''s own satire on the women''s-rights movement lets slip a barely-suppressed rage against men, and its closing line is the unit''s bluntest statement of the doctrine being enforced.'
- nn: 26
  unit_id: p4-time-for-tentativeness
  note_id: gay-bourgeois-experience-v3-p4-time-for-tentativeness
  span: 902173:946510
  chunks:
  - id: gay-bourgeois-experience-v3#u26-c1
    heading: 'Mary Brown Talks Back'
    span: 904129:905419
    why: 'Hughes''s fictional wife voices the emergent ''competent woman, her husband''s partner'' ideal against the doctrine of shielding women from the world, showing the woman question already unsettling popular fiction by 1861.'
  - id: gay-bourgeois-experience-v3#u26-c2
    heading: 'Love as Warfare'
    span: 906617:907169
    why: 'Elizabeth Barrett''s private correspondence recasts courtship as an asymmetric power struggle, the unit''s sharpest statement of gender relations as a site of structured aggression.'
  - id: gay-bourgeois-experience-v3#u26-c3
    heading: 'The Woman Who Leaves the Home Destroys It'
    span: 914567:915056
    why: 'Simon''s approving citation of Michelet shows the ''nature'' alibi doing double duty, dressed as both statesmanship and poetry, to declare wage work incompatible with womanhood itself.'
  - id: gay-bourgeois-experience-v3#u26-c4
    heading: 'Moebius and the Alibi of Anatomy'
    span: 943124:943502
    why: 'Moebius''s bestselling 1900 pamphlet pushes the nature-alibi to its most literal, pseudo-scientific extreme, and its commercial success shows the doctrine''s continuing market.'
  - id: gay-bourgeois-experience-v3#u26-c5
    heading: 'Every Woman Knows That'
    span: 934782:935158
    why: 'Barrie''s comedy dramatizes the compensatory myth of woman''s backstage power, an alibi that let inequality feel survivable without conceding formal ground.'
  - id: gay-bourgeois-experience-v3#u26-c6
    heading: 'Anti-Feminism on the Left'
    span: 939900:941649
    why: 'French Radicals and Socialists opposed women''s suffrage on anticlerical grounds, showing resistance to women''s rights recruited progressive as well as conservative alibis.'
- nn: 27
  unit_id: p4-scribbling-women-market-anxiety
  note_id: gay-bourgeois-experience-v3-p4-scribbling-women-market-anxiety
  span: 946510:987140
  chunks:
  - id: gay-bourgeois-experience-v3#u27-c1
    heading: 'Hawthorne''s “scribbling women”'
    span: 969314:969764
    why: 'Gives the chapter its title and is Gay''s paradigm case of an eminent male author converting a woman''s commercial success into a personal grievance.'
  - id: gay-bourgeois-experience-v3#u27-c2
    heading: 'Identification with the aggressor and the pseudonym'
    span: 947764:948400
    why: 'States the chapter''s psychoanalytic thesis in Gay''s own terms and lists the pseudonyms that recur as the chapter''s evidence.'
  - id: gay-bourgeois-experience-v3#u27-c3
    heading: 'George Sand''s sword and pen'
    span: 955229:956182
    why: 'Gay''s closest reading in the unit, treating Sand''s own metaphor as proof that women''s literary ambition had to be smuggled in through a borrowed masculine instrument.'
  - id: gay-bourgeois-experience-v3#u27-c4
    heading: 'George Eliot''s “Silly Novels”'
    span: 961365:962529
    why: 'Eliot''s essay is Gay''s central proof that women as well as men participated in aggression against female authorship, and the closing line is Gay''s own thesis statement.'
  - id: gay-bourgeois-experience-v3#u27-c5
    heading: 'Oliphant and the discrete reading publics'
    span: 971334:972293
    why: 'Reframes the male complaint about “invasion” as a market genuinely dividing into new, class-segmented reading publics rather than a zero-sum contest for one audience.'
  - id: gay-bourgeois-experience-v3#u27-c6
    heading: 'Marlitt''s bourgeois Cinderella'
    span: 984932:985379
    why: 'Extends the chapter''s argument to Germany and ties female authorship directly to bourgeois class ideology, the volume''s overarching subject.'
- nn: 28
  unit_id: p4-scribbling-women-motives-reputation
  note_id: gay-bourgeois-experience-v3-p4-scribbling-women-motives-reputation
  span: 987140:1021039
  chunks:
  - id: gay-bourgeois-experience-v3#u28-c1
    heading: 'Money was rarely the dominant motive'
    span: 989155:989909
    why: 'States the unit''s central claim that money and genuine vocation were inseparable, overdetermined motives for women''s authorship.'
  - id: gay-bourgeois-experience-v3#u28-c2
    heading: 'Alcott: aggression through self-sacrifice'
    span: 995338:996681
    why: 'Gay''s densest psychological case for aggression channeled into dutiful self-sacrifice, including Alcott''s own cross-gender self-description.'
  - id: gay-bourgeois-experience-v3#u28-c3
    heading: 'Sand''s rage converted into pride'
    span: 990702:992130
    why: 'Shows Sand explicitly converting professional rage at exclusion into declared, unapologetic pride — the unit''s clearest sublimation case.'
  - id: gay-bourgeois-experience-v3#u28-c4
    heading: 'Lewald: aggression or self-realization'
    span: 1000565:1001276
    why: 'The single sentence that crystallizes the unit''s double-reading of women''s authorship as either aggression or self-realization depending on the viewer.'
  - id: gay-bourgeois-experience-v3#u28-c5
    heading: 'The mind has no sex, gaining ground'
    span: 1017912:1019273
    why: 'Documents the persistent masculine/feminine vocabulary of criticism alongside the countervailing ''mind has no sex'' claim gaining support.'
  - id: gay-bourgeois-experience-v3#u28-c6
    heading: 'James, 1887: ''their cause is already gained'''
    span: 1020154:1021037
    why: 'Gay''s closing evidence that by 1887 informed opinion considered women''s claim to literary authorship substantially won.'
- nn: 29
  unit_id: p4-competence-womanliness-redefined
  note_id: gay-bourgeois-experience-v3-p4-competence-womanliness-redefined
  span: 1021039:1065430
  chunks:
  - id: gay-bourgeois-experience-v3#u29-c1
    heading: 'Competence as the cage dressed up as a pedestal'
    span: 1021077:1022157
    why: 'States the subsection''s organizing irony and its Freudian claim that competence licensed constructive aggression and mastery.'
  - id: gay-bourgeois-experience-v3#u29-c2
    heading: 'Mrs. Beeton''s mistress-as-commander'
    span: 1036088:1037704
    why: 'Shows domestic competence recast as a rigorous, quasi-military management discipline, the era''s clearest image of sublimated mastery.'
  - id: gay-bourgeois-experience-v3#u29-c3
    heading: 'Professional ceilings dressed as natural extensions'
    span: 1051499:1052408
    why: 'Names precisely how even sympathetic men licensed women''s professional competence only as an extension of domestic/maternal roles.'
  - id: gay-bourgeois-experience-v3#u29-c4
    heading: 'The halting gait of legal progress'
    span: 1054360:1055359
    why: 'Gay''s explicit framing of legal ''progress'' as slow and grudging rather than a steady march of triumph.'
  - id: gay-bourgeois-experience-v3#u29-c5
    heading: 'The 1896 Reichstag debate as licensed aggression'
    span: 1063456:1064847
    why: 'A late-century instance of backlash treated by Gay as naked aggression rationalized as natural difference and defused as humor.'
- nn: 30
  unit_id: p5-varieties-of-laughter
  note_id: gay-bourgeois-experience-v3-p5-varieties-of-laughter
  span: 1065430:1104707
  chunks:
  - id: gay-bourgeois-experience-v3#u30-c1
    heading: 'Humor as licensed aggression'
    span: 1065484:1065941
    why: 'States the chapter''s opening thesis: humor, whatever its psychological variety, is fundamentally an exercise and regulation of aggression.'
  - id: gay-bourgeois-experience-v3#u30-c2
    heading: 'Hobbes''s sudden glory and Baudelaire''s satanic pride'
    span: 1066092:1067157
    why: 'Traces the boasting/superiority theory of laughter from Hobbes through Baudelaire''s quasi-religious framing of laughter as satanic rebellion.'
  - id: gay-bourgeois-experience-v3#u30-c3
    heading: 'Laughter as the laughter of a group'
    span: 1068336:1069481
    why: 'Shows Gay using Bergson''s in-group/out-group theory of laughter to explain why humor is culturally bounded except for rare universal humorists like Twain.'
  - id: gay-bourgeois-experience-v3#u30-c4
    heading: 'Freud''s tendentious jokes and the drive theory to come'
    span: 1099909:1100602
    why: 'Links Freud''s 1905 joke book directly to the later structural drive theory of Eros and aggression that organizes the whole volume.'
  - id: gay-bourgeois-experience-v3#u30-c5
    heading: 'Gilbert''s Bab Ballads and self-portrait'
    span: 1086851:1087948
    why: 'Gay''s most concrete case study: a celebrated comic writer''s own scribbled self-confessions of misanthropy confirm that his ballads'' violence was not merely stylistic.'
  - id: gay-bourgeois-experience-v3#u30-c6
    heading: 'Bergson: laughter as society''s corrective punishment'
    span: 1095852:1096708
    why: 'Gives the chapter''s clearest statement of humor as a social-control mechanism that disciplines through humiliation rather than argument.'
- nn: 31
  unit_id: p5-physicians-to-society
  note_id: gay-bourgeois-experience-v3-p5-physicians-to-society
  span: 1104707:1145953
  chunks:
  - id: gay-bourgeois-experience-v3#u31-c1
    heading: 'Sternheim''s Molière as physician to the bourgeoisie'
    span: 1107226:1107630
    why: 'Supplies the chapter''s organizing image of the satirist as surgeon whose aggression is justified as therapeutic necessity.'
  - id: gay-bourgeois-experience-v3#u31-c2
    heading: 'Heine''s attack on Platen'
    span: 1118216:1118678
    why: 'Shows aggressive wit deployed as personal vendetta against a rival, exploiting Platen''s homosexuality rather than his ideas.'
  - id: gay-bourgeois-experience-v3#u31-c3
    heading: 'Heine''s confession: ''I only chastised him'''
    span: 1119419:1119833
    why: 'Heine''s own retrospective admission exposes the gap between satire''s claimed diagnostic purpose and its actual motive of reprisal.'
  - id: gay-bourgeois-experience-v3#u31-c4
    heading: 'Physicians turned panders: Punch and Puck'
    span: 1125980:1126728
    why: 'States the unit''s thesis directly: licensed aggression aimed at safe, powerless targets (the Irish, Jewish immigrants) betrays the physician''s mission.'
  - id: gay-bourgeois-experience-v3#u31-c5
    heading: 'Podsnap as clinical narcissist'
    span: 1141952:1142934
    why: 'Demonstrates Gay''s explicitly psychoanalytic reading of a satirized social type as a diagnosable pathology, not just a comic butt.'
  - id: gay-bourgeois-experience-v3#u31-c6
    heading: 'The Circumlocution Office as institutionalized paralysis'
    span: 1140310:1141383
    why: 'Extends the aggression-as-diagnosis frame from individuals to institutions, personifying bureaucratic inaction as a pathology in its own right.'
- nn: 32
  unit_id: p5-victim-as-executioner
  note_id: gay-bourgeois-experience-v3-p5-victim-as-executioner
  span: 1145953:1182304
  chunks:
  - id: gay-bourgeois-experience-v3#u32-c1
    heading: 'Gargantua and the limits of early tolerance'
    span: 1145983:1147129
    why: 'Establishes Daumier''s caricature and the regime''s initial permissiveness that the rest of the unit shows narrowing.'
  - id: gay-bourgeois-experience-v3#u32-c2
    heading: 'The executioner behind the judge'
    span: 1154319:1155002
    why: 'Stages the unit''s central irony of nominal free speech under real state violence, and literalizes the victim/executioner imagery of the title.'
  - id: gay-bourgeois-experience-v3#u32-c3
    heading: 'Daumier turns his aggression on women'
    span: 1158448:1159349
    why: 'The unit''s clearest statement of a repressed satirist displacing aggression onto weaker, safer targets.'
  - id: gay-bourgeois-experience-v3#u32-c4
    heading: 'Britain''s vaguer, gentler machinery of control'
    span: 1163652:1164623
    why: 'Shows how Britain''s comparatively secure elite still built censorship infrastructure, just calibrated to a lighter threshold than France''s.'
  - id: gay-bourgeois-experience-v3#u32-c5
    heading: 'Germany''s harshest threshold: the irrefutable joke'
    span: 1173102:1174338
    why: 'Gives the comparative extreme case, where officials treat any joke as inherently dangerous regardless of content.'
  - id: gay-bourgeois-experience-v3#u32-c6
    heading: 'The bitten bite back'
    span: 1181285:1182302
    why: 'Delivers the unit''s title thesis verbatim: satirists who had been victims of repression became executioners in turn, and paid for it.'
- nn: 33
  unit_id: p5-laughing-cruel-sage
  note_id: gay-bourgeois-experience-v3-p5-laughing-cruel-sage
  span: 1182304:1227885
  chunks:
  - id: gay-bourgeois-experience-v3#u33-c1
    heading: 'The catalogue of licensed cruelty'
    span: 1182331:1183770
    why: 'Gay opens the chapter with an unbroken summary of Busch''s plots to establish, before any argument, the sheer density of decapitation, mutilation, and domestic violence played for laughs in his popular work.'
  - id: gay-bourgeois-experience-v3#u33-c2
    heading: 'Humor as socially acceptable outlet'
    span: 1184694:1185112
    why: 'This is Gay''s direct thesis statement for the chapter: humor secures a socially acceptable outlet for wishes to maim and murder by reassuring both artist and audience that fantasy is not reality.'
  - id: gay-bourgeois-experience-v3#u33-c3
    heading: 'The Schmulchen Schiefelbeiner caricature'
    span: 1217495:1218546
    why: 'Shows the convenient Other in action: personal friendship with individual Jews coexisting with casual deployment of the antisemitic stereotype for the reader''s self-flattering laughter.'
  - id: gay-bourgeois-experience-v3#u33-c4
    heading: 'Monsieur Jacques a Paris and wartime Schadenfreude'
    span: 1202237:1203701
    why: 'Busch''s one lapse into political aggression, gloating over the starvation of besieged Paris, is Gay''s clearest evidence that ordinary bourgeois humor could flare into national hostility under specific historical pressure.'
  - id: gay-bourgeois-experience-v3#u33-c5
    heading: 'Vischer''s defense: cruelty is funny because impossible'
    span: 1203975:1204477
    why: 'Records the period''s own theory of why Busch''s violence read as harmless comedy rather than cruelty, a defense Gay partially accepts and partially undercuts elsewhere in the unit.'
  - id: gay-bourgeois-experience-v3#u33-c6
    heading: 'The reality principle as the moral of the work'
    span: 1225554:1226746
    why: 'Gay''s summary verdict reframes Busch''s entire aggressive comic output as a mechanism for managing rather than denying aggression, tying the chapter back to the volume''s title theme of cultivation.'
- nn: 34
  unit_id: p6-moral-equivalents-safety-valves
  note_id: gay-bourgeois-experience-v3-p6-moral-equivalents-safety-valves
  span: 1227885:1257358
  chunks:
  - id: gay-bourgeois-experience-v3#u34-c1
    heading: 'Mastery simply gives pleasure'
    span: 1230107:1230898
    why: 'Establishes the unit''s foundational claim that mastery is intrinsically pleasurable and ethically neutral, which licenses treating disciplined aggression as constructive rather than merely destructive.'
  - id: gay-bourgeois-experience-v3#u34-c2
    heading: 'James''s conscription against Nature'
    span: 1240470:1241649
    why: 'This is James''s own conscription proposal, the concrete substance of ''the moral equivalent of violence'' and the unit''s central case study.'
  - id: gay-bourgeois-experience-v3#u34-c3
    heading: 'The safety valve as governing metaphor'
    span: 1242978:1244081
    why: 'Gives the exact mechanistic metaphor, and its earliest proponents, that organizes the chapter''s account of channelling aggression through institutions.'
  - id: gay-bourgeois-experience-v3#u34-c4
    heading: 'Marx and Engels unmask the reformers'
    span: 1246115:1247571
    why: 'States the radical counter-thesis, in Marx and Engels''s own words, that bourgeois reform is self-interested cover rather than genuine philanthropy.'
  - id: gay-bourgeois-experience-v3#u34-c5
    heading: 'Gay defends the reformers'' sincerity'
    span: 1250135:1251830
    why: 'Gay''s own resolution of the sincerity debate, arguing reformers'' revulsion at poverty and punishment was authentic even where it also served bourgeois interests.'
  - id: gay-bourgeois-experience-v3#u34-c6
    heading: 'Involuntary allies'
    span: 1256354:1257356
    why: 'The unit''s concluding synthesis: workers were active co-participants in, and sometimes resisters of, bourgeois self-mastery projects, not passive objects of manipulation.'
- nn: 35
  unit_id: p6-sport-referee-olympics
  note_id: gay-bourgeois-experience-v3-p6-sport-referee-olympics
  span: 1257358:1295189
  chunks:
  - id: gay-bourgeois-experience-v3#u35-c1
    heading: 'The Moral-Equivalent Thesis and Its Skeptics'
    span: 1259873:1261105
    why: 'States the chapter''s central hypothesis (James''s moral-equivalent-of-war thesis for sport) and immediately contrasts it with contemporary working-class suspicion that sport was pacification rather than catharsis.'
  - id: gay-bourgeois-experience-v3#u35-c2
    heading: 'Turnvater Jahn: Gymnastics as War by Other Means'
    span: 1268200:1268923
    why: 'Gay''s sharpest counter-case: a sporting movement built explicitly to manufacture soldiers and nationalist hatred rather than to drain aggression, inverting James''s whole project.'
  - id: gay-bourgeois-experience-v3#u35-c3
    heading: 'Desgrange''s August 1914: The Moral Equivalent Becomes the Real Thing'
    span: 1270650:1271383
    why: 'The unit''s most consequential passage — sport''s own vocabulary repurposed on the eve of war, directly anticipating the volume''s Epilogue reading of August 1914 as the collapse of a century''s cultivation of aggression.'
  - id: gay-bourgeois-experience-v3#u35-c4
    heading: 'Cricket''s False Fraternity: The Limit of Class Leveling'
    span: 1277221:1278278
    why: 'Gives Gay''s explicit thesis statement in his own words: sport''s promise to dissolve class conflict as it dissolved (some) national and personal aggression specifically failed.'
  - id: gay-bourgeois-experience-v3#u35-c5
    heading: 'The Referee: A Thoroughly Modern Institution'
    span: 1290153:1291912
    why: 'Identifies the referee as a newly invented, near-absolute authority created specifically to make the boundary of legitimate aggression adjudicable in real time.'
  - id: gay-bourgeois-experience-v3#u35-c6
    heading: 'Coubertin''s Contradictions: Aristocrat, Democrat, Pacifist'
    span: 1282257:1283180
    why: 'Condenses the chapter''s whole tangle of contradictions — aristocratic prowess versus a democratic ''republic of muscles,'' patriotism without nationalism — into the figure Gay treats as emblematic of the era''s wishful thinking.'
- nn: 36
  unit_id: p6-empire-of-fact-bacon-science
  note_id: gay-bourgeois-experience-v3-p6-empire-of-fact-bacon-science
  span: 1295189:1337139
  chunks:
  - id: gay-bourgeois-experience-v3#u36-c1
    heading: 'Bacon''s Program: Empire over Nature'
    span: 1301180:1302350
    why: 'States Bacon''s own formulation of the mastery program — ‘Human Empire’ and ‘idols’ — that the Victorians revived as their guiding ideology.'
  - id: gay-bourgeois-experience-v3#u36-c2
    heading: 'Macaulay''s Ledger of Baconian Progress'
    span: 1302776:1303581
    why: 'Macaulay''s cumulative catalogue of Baconian science''s material benefits captures the Victorian faith that empirical mastery is itself endless, self-justifying progress.'
  - id: gay-bourgeois-experience-v3#u36-c3
    heading: 'Huxley''s Religion of Fact'
    span: 1308685:1309585
    why: 'Huxley''s grief-stricken refusal of consoling belief shows the cult of fact functioning as a substitute religion, demanding the same submission Christianity once asked.'
  - id: gay-bourgeois-experience-v3#u36-c4
    heading: 'Semmelweis and the Cadaveric-Particles Hypothesis'
    span: 1323785:1324632
    why: 'The climactic moment of the chapter''s model case: disciplined hypothesis-testing turned into a life-saving practice, Gay''s paradigm of constructive aggression as mastery.'
  - id: gay-bourgeois-experience-v3#u36-c5
    heading: 'Quetelet: Statistical Law and the Promise of Freedom'
    span: 1331979:1333087
    why: 'Quetelet''s social physics claims that lawlike statistical regularity, once known, expands rather than shrinks human freedom — the legibility project''s own self-justification.'
  - id: gay-bourgeois-experience-v3#u36-c6
    heading: 'Industrialization as Constructive Aggression'
    span: 1295212:1295595
    why: 'States the chapter''s frame thesis directly: the nineteenth century''s drive to master nature through industry and science is aggression turned constructive.'
- nn: 37
  unit_id: p6-brentano-booth-social-science
  note_id: gay-bourgeois-experience-v3-p6-brentano-booth-social-science
  span: 1337139:1371467
  chunks:
  - id: gay-bourgeois-experience-v3#u37-c1
    heading: 'Brentano''s German inheritance'
    span: 1337401:1338824
    why: 'Establishes that Brentano''s empirical social liberalism was forged against the trauma of Bismarckian unification and Catholic marginalization, the counterpoint to Booth''s easier path.'
  - id: gay-bourgeois-experience-v3#u37-c2
    heading: 'Booth''s religious crisis and turn to science'
    span: 1339534:1340031
    why: 'Marks the exact biographical pivot where Booth''s lost faith is replaced by social science as a substitute creed, setting up his lifelong ''obsession'' with the poor.'
  - id: gay-bourgeois-experience-v3#u37-c3
    heading: 'German academic Streit: aggression not sublimated'
    span: 1356851:1357358
    why: 'The unit''s sharpest link to the book''s title theme: fact-gathering social science relocated aggression into scholarly combat rather than eliminating it.'
  - id: gay-bourgeois-experience-v3#u37-c4
    heading: 'The sense of helplessness and the quest for mastery'
    span: 1366293:1367820
    why: 'States the chapter''s thesis in Booth''s own words and Gay''s own gloss: disciplined fact-gathering is offered as the antidote to political and social helplessness.'
  - id: gay-bourgeois-experience-v3#u37-c5
    heading: 'Mapping terra incognita, photographing all London'
    span: 1367822:1369065
    why: 'Describes Booth''s survey method in explicitly cartographic, legibility-making terms, the unit''s clearest resonance with the World Machines legibility concept.'
  - id: gay-bourgeois-experience-v3#u37-c6
    heading: 'The empire of fact'
    span: 1370382:1371465
    why: 'Gay''s closing judgment names the chapter''s governing concept directly and is the unit''s most quotable summary line.'
- nn: 38
  unit_id: p6-end-of-renaissance-man
  note_id: gay-bourgeois-experience-v3-p6-end-of-renaissance-man
  span: 1371467:1426564
  chunks:
  - id: gay-bourgeois-experience-v3#u38-c1
    heading: 'Specialization as an ambiguous blessing'
    span: 1371498:1372143
    why: 'States the chapter''s governing thesis: division of labor mastered the world while shattering the Renaissance generalist ideal.'
  - id: gay-bourgeois-experience-v3#u38-c2
    heading: 'Burckhardt''s elegy for l''huomo universale'
    span: 1374166:1374984
    why: 'Gives the vivid historical exemplar (Alberti, Leonardo) of the universal-man ideal the chapter says specialization foreclosed.'
  - id: gay-bourgeois-experience-v3#u38-c3
    heading: 'The fight to control the educational machine'
    span: 1385005:1385624
    why: 'Names the classical-vs-technical curriculum fight as a bid for political mastery via an explicit ''educational machine'' metaphor.'
  - id: gay-bourgeois-experience-v3#u38-c4
    heading: 'Humboldt''s examinations as accidental meritocracy'
    span: 1390136:1390734
    why: 'Shows an anti-utilitarian classicist building a legible, impersonal sorting device that served bourgeois interests against inherited privilege.'
  - id: gay-bourgeois-experience-v3#u38-c5
    heading: 'Mastery unevenly distributed across class'
    span: 1425031:1425713
    why: 'Gay''s own corrective: professional/medical mastery is real but tracks class lines, qualifying the chapter''s triumphalist material.'
  - id: gay-bourgeois-experience-v3#u38-c6
    heading: 'Mastery as harnessed aggression'
    span: 1425717:1426562
    why: 'States explicitly that the century''s professionalized mastery was sublimated aggression, and hands off to the book''s next chapter on advice literature.'
- nn: 39
  unit_id: p6-age-of-advice-self-control-thrift
  note_id: gay-bourgeois-experience-v3-p6-age-of-advice-self-control-thrift
  span: 1426564:1462332
  chunks:
  - id: gay-bourgeois-experience-v3#u39-c1
    heading: 'The Age of Advice'
    span: 1426598:1427436
    why: 'Names the genre at civilizational scale and frames the whole unit''s subject: a household industry of self-improvement literature.'
  - id: gay-bourgeois-experience-v3#u39-c2
    heading: 'Self-control defined, and tied to Freud'
    span: 1434992:1435879
    why: 'States the chapter''s master concept and explicitly links it to Freud''s pleasure/reality principle, the volume''s psychoanalytic frame.'
  - id: gay-bourgeois-experience-v3#u39-c3
    heading: 'Temperance as the discipline of rage'
    span: 1448133:1449441
    why: 'Connects the advice literature directly to the volume''s central theme of managing aggression, treating anger as the hardest test of self-control.'
  - id: gay-bourgeois-experience-v3#u39-c4
    heading: 'Thrift as sexual and aggressive economy'
    span: 1452468:1454068
    why: 'Gay''s clearest statement that a mundane bourgeois virtue encodes displaced management of both sexual and aggressive drives.'
  - id: gay-bourgeois-experience-v3#u39-c5
    heading: 'The love of power, in embryo'
    span: 1460206:1461003
    why: 'The chapter''s intellectual climax: a mid-century advice book anticipating Nietzsche and Freud on the primal drive for mastery.'
- nn: 40
  unit_id: p6-character-obsessional-neurosis-freud
  note_id: gay-bourgeois-experience-v3-p6-character-obsessional-neurosis-freud
  span: 1462332:1496453
  chunks:
  - id: gay-bourgeois-experience-v3#u40-c1
    heading: 'Character defined as aggression disciplined and sublimated'
    span: 1462332:1462937
    why: 'States the chapter''s governing definition: bourgeois “character” is aggression channeled into self-control rather than its opposite.'
  - id: gay-bourgeois-experience-v3#u40-c2
    heading: 'Whipple: character as a calculable, predictable force'
    span: 1468735:1469175
    why: 'Shows advice literature''s scientistic ambition to render inner character measurable and predictable, a legibility project turned on the self.'
  - id: gay-bourgeois-experience-v3#u40-c3
    heading: 'Obsessional-compulsive neurosis as the bourgeoisie''s preferred style'
    span: 1482825:1483150
    why: 'The chapter''s thesis sentence: obsessional neurosis is not incidental to the bourgeoisie but its class-specific neurotic signature.'
  - id: gay-bourgeois-experience-v3#u40-c4
    heading: 'Hysteria defies self-control, obsession mimics it'
    span: 1484075:1484869
    why: 'Lays out the structural contrast Gay builds his argument on: two neuroses as mirror-image failures of the same bourgeois discipline.'
  - id: gay-bourgeois-experience-v3#u40-c5
    heading: 'Weber''s obsessive capitalist in the iron cage'
    span: 1487900:1489000
    why: 'Extends Freud''s clinical diagnosis of obsessional character to Weber''s economic sociology, tying private pathology to capitalist rationality.'
  - id: gay-bourgeois-experience-v3#u40-c6
    heading: 'Gay''s qualification: sublimation also built civilization'
    span: 1495299:1496451
    why: 'Gay''s own authorial verdict, correcting Freud''s sardonic reading and setting up the volume''s larger argument about the achievements of mastery.'
- nn: 41
  unit_id: epilogue-august-4-1914
  note_id: gay-bourgeois-experience-v3-epilogue-august-4-1914
  span: 1496453:1535792
  chunks:
  - id: gay-bourgeois-experience-v3#u41-c1
    heading: 'August 4 dooms the great compromises'
    span: 1496479:1497022
    why: 'States the epilogue''s thesis: the war''s outbreak as the collapse of a century-long structure of restraint.'
  - id: gay-bourgeois-experience-v3#u41-c2
    heading: 'Nationalism as the alibi of alibis'
    span: 1509814:1510163
    why: 'Names nationalism as the master rationale for aggression that overrode every competing loyalty in 1914.'
  - id: gay-bourgeois-experience-v3#u41-c3
    heading: 'Perfidious Albion and the narcissism of small differences'
    span: 1500694:1501327
    why: 'Shows the convenient Other turned against the most admired neighbor, Gay''s clearest case of Freud''s narcissism-of-small-differences logic.'
  - id: gay-bourgeois-experience-v3#u41-c4
    heading: 'Freud''s circle succumbs to war euphoria'
    span: 1502362:1503236
    why: 'Load-bearing because it is Gay''s own evidence, from Freud''s circle, that even the theorist of aggression could not escape it.'
  - id: gay-bourgeois-experience-v3#u41-c5
    heading: 'Defining the liberal temper'
    span: 1532602:1533526
    why: 'The volume''s clearest positive counter-thesis: the fragile bourgeois disposition capable of checking aggression.'
  - id: gay-bourgeois-experience-v3#u41-c6
    heading: 'Contingency, not fate'
    span: 1534757:1535200
    why: 'Gay''s historiographical signature move, refusing an inevitabilist reading of the war''s outbreak.'
- nn: 42
  unit_id: appendix-theories-of-aggression
  note_id: gay-bourgeois-experience-v3-appendix-theories-of-aggression
  span: 1535792:1557554
  chunks:
  - id: gay-bourgeois-experience-v3#u42-c1
    heading: 'Ethologists vs. the oversocialized conception of man'
    span: 1536752:1537829
    why: 'States the innate-drive pole of the appendix''s central nature/nurture debate, anchored in Lorenz and Eibl-Eibesfeldt.'
  - id: gay-bourgeois-experience-v3#u42-c2
    heading: 'Freud''s aggression as danger to civilization'
    span: 1541166:1541499
    why: 'Marks Gay''s key contrast between Freud and the ethologists: aggression as existential threat rather than adaptive trait.'
  - id: gay-bourgeois-experience-v3#u42-c3
    heading: 'The 1920 turn to Eros and Thanatos'
    span: 1544186:1544570
    why: 'The appendix''s clearest statement of Freud''s late dualism, which Gay treats with visible skepticism despite its influence.'
  - id: gay-bourgeois-experience-v3#u42-c4
    heading: 'Leo Stone''s pluralist account of aggression'
    span: 1546423:1547613
    why: 'Presents the third theoretical school Gay ultimately endorses methodologically: aggression as heterogeneous rather than a single drive.'
  - id: gay-bourgeois-experience-v3#u42-c5
    heading: 'Mastery as civilization-building aggression'
    span: 1553589:1554159
    why: 'The appendix''s payload passage: aggression redirected into mastery is the psychic fuel for building tools, trade, and institutions, directly resonant with world-machine infrastructure.'
  - id: gay-bourgeois-experience-v3#u42-c6
    heading: 'The volume''s thesis stated directly'
    span: 1556839:1557069
    why: 'Gay''s own one-sentence statement of the whole book''s argument, placed deliberately at the appendix''s close.'
