- nn: 4
  unit_id: front-essay-don-quixote
  note_id: cervantes-don-quixote-front-essay-don-quixote
  span: 80118:109035
  chunks:
  - id: cervantes-don-quixote#u04-c1
    label: c1
    heading: The cosmopolitan-yet-national paradox
    char_start: 81118
    char_end: 82321
    start_quote: Still more remarkable is the character of this wide diffusion.
    end_quote: the grown men understand it, the old folk praise it.”
    why: 'States the essay''s opening puzzle about Don Quixote''s reception: simultaneously the most cosmopolitan
      and most intensely national of books.'
  - id: cervantes-don-quixote#u04-c2
    label: c2
    heading: Chivalry was already dead
    char_start: 87571
    char_end: 87962
    start_quote: In the first place there was no chivalry for him to smile away.
    end_quote: What he did smile away was not chivalry but a degrading mockery of it.
    why: 'The essay''s central historical claim: Cervantes attacked a dead institution''s ornamental afterlife,
      not chivalry itself, directly resonant with the decay-sequence of a machine''s institutional husk.'
  - id: cervantes-don-quixote#u04-c3
    label: c3
    heading: 'Pacheco''s testimony: ridicule ends the costume-culture'
    char_start: 88297
    char_end: 89104
    start_quote: Before the appearance in the world of that labour of Cervantes,” he said, “it was next
      to an impossibility
    end_quote: so little agreeable to those nobler actions of our famous ancestors.”
    why: Contemporary Spanish testimony that the book's mockery, not any assault on chivalry proper, killed
      off the public performance of chivalric costume and gesture.
  - id: cervantes-don-quixote#u04-c4
    label: c4
    heading: Sancho and Cid Hamete as afterthoughts
    char_start: 90910
    char_end: 91768
    start_quote: It is plain, for one thing, that Sancho Panza did not enter into the original scheme
    end_quote: first suggested it to him that his idea was capable of development.
    why: Documents the novel's unplanned, accretive composition — Sancho and the fictive-manuscript device
      were both grafted on mid-course rather than designed from the outset.
  - id: cervantes-don-quixote#u04-c5
    label: c5
    heading: Against the pessimist reading
    char_start: 89106
    char_end: 89709
    start_quote: To call “Don Quixote” a sad book, preaching a pessimist view of life
    end_quote: is mischievous to its owner, and a very considerable nuisance to the community at large.
    why: 'States the essay''s thesis on the book''s moral: it punishes spurious, vanity-born enthusiasm,
      not enthusiasm as such.'
  - id: cervantes-don-quixote#u04-c6
    label: c6
    heading: Doré's fountain and the point of incongruity
    char_start: 102908
    char_end: 103732
    start_quote: Take, for instance, Gustave Doré’s drawing of Don Quixote watching his armour
    end_quote: gives a significance to Don Quixote’s vigil and the ceremony that follows.
    why: Concrete test case for Ormsby's theory that Cervantic humor depends on the mean, prosaic ordinariness
      of the setting against which Don Quixote's ideal plays out.
- nn: 5
  unit_id: front-preface-commendatory-dedication
  note_id: cervantes-don-quixote-front-preface-commendatory-dedication
  span: 109035:132446
  chunks:
  - id: cervantes-don-quixote#u05-c1
    label: c1
    heading: 'Idle reader: the freed reader'
    char_start: 109057
    char_end: 110874
    start_quote: 'Idle reader: thou mayest believe me without any oath that I would this'
    end_quote: without fear of being abused for any ill or rewarded for any good thou mayest say of it.
    why: Opens the whole work by inverting the author-reader contract and setting the ironic, self-aware
      register of the Preface.
  - id: cervantes-don-quixote#u05-c2
    label: c2
    heading: The friend's recipe for borrowed authority
    char_start: 119380
    char_end: 119809
    start_quote: 'The remedy for this is very simple: You have only to look out for some book'
    end_quote: made use of them all in this plain, artless story of yours.
    why: The clearest satire of scholarly apparatus as pure performance -- erudition faked purely to look
      authoritative, unverified by any reader.
  - id: cervantes-don-quixote#u05-c3
    label: c3
    heading: 'The stated purpose: an attack on chivalric romance'
    char_start: 120192
    char_end: 121913
    start_quote: for it is, from beginning to end, an attack upon the books of chivalry, of which Aristotle
      never dreamt
    end_quote: for if you succeed in this you will have achieved no small success.
    why: The one place in the front matter where the book's actual programmatic aim is stated without
      irony.
  - id: cervantes-don-quixote#u05-c4
    label: c4
    heading: Urganda's warning against borrowed erudition
    char_start: 124171
    char_end: 124447
    start_quote: Since Heaven it hath not pleased on thee
    end_quote: “Why offer flowers to me, my friend?”
    why: The commendatory verse echoes the Preface's satire of false Latin erudition, showing the joke
      sustained into the poems themselves.
  - id: cervantes-don-quixote#u05-c5
    label: c5
    heading: Dedication to the Duke of Béjar
    char_start: 131464
    char_end: 132418
    start_quote: In belief of the good reception and honours that Your Excellency
    end_quote: will not disdain the littleness of so humble a service.
    why: The unironized specimen of patronage convention that the preceding satire has just been mocking,
      closing the unit in unresolved tension.
