  - id: cervantes-don-quixote#u03-c5
    label: c5
    heading: No monument needed
    char_start: 79406
    char_end: 80113
    start_quote: It has been also made a reproach to Spain that she has erected no
    end_quote: The nearest bookseller’s shop will show what bathos there would be in a monument to the
