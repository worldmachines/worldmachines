- nn: 3
  unit_id: front-cervantes-life-2
  note_id: cervantes-don-quixote-front-cervantes-life-2
  span: 54857:80118
  chunks:
  - id: cervantes-don-quixote#u03-c1
    label: c1
    heading: The tax collector's unintended research
    char_start: 59515
    char_end: 61067
    start_quote: It was as he journeyed from town to town collecting the king’s taxes,
    end_quote: the germ, in more ways than one, of “Don Quixote.”
    why: Establishes that the novel's inn-and-road texture, and possibly its central figure, was gathered
      incidentally during Cervantes's tax-collecting years rather than designed as literary material.
  - id: cervantes-don-quixote#u03-c2
    label: c2
    heading: Avellaneda's forged sequel arrives
    char_start: 70196
    char_end: 71301
    start_quote: Nemesis was coming, however.
    end_quote: he made no sign until eight years and a half had gone by; by which time Avellaneda’s volume
      was no doubt written.
    why: Marks the contingent, external shock — a rival's plagiarism and abuse — that the essay credits
      with finally forcing Cervantes to complete the book.
  - id: cervantes-don-quixote#u03-c3
    label: c3
    heading: A stepfather to his own masterpiece
    char_start: 68207
    char_end: 69043
    start_quote: He shows plainly enough, too, that “Don Quixote” and the demolition of
    end_quote: to divert the melancholy moody heart at any time or season.”
    why: Cervantes's own reported view of Don Quixote as a minor amusement, not his true ambition, explaining
