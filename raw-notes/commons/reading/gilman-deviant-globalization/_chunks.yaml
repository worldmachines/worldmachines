units:
- nn: 1
  unit_id: intro-1-globalization
  note_id: gilman-deviant-globalization-intro-1-globalization
  span: 0:25375
  chunks:
  - id: gilman-deviant-globalization#u01-c1
    heading: 'Deviant globalization is bound up with mainstream globalization'
    span: 4326:5817
    why: 'States the first claim and the dual-use, value-neutral infrastructure argument that underlies the whole volume.'
  - id: gilman-deviant-globalization#u01-c2
    heading: 'Moral arbitrage on a morally lumpy field'
    span: 5819:7349
    why: 'Gives the editors'' mechanism of how prohibition and ethical difference create profit opportunities.'
  - id: gilman-deviant-globalization#u01-c3
    heading: 'The global poor, development and Mexico'
    span: 7939:9154
    why: 'Presents the development-versus-harm duality and the Mexican drug economy as the book''s emblematic case.'
  - id: gilman-deviant-globalization#u01-c4
    heading: 'A permanent phenomenon, not a removable cancer'
    span: 12054:12825
    why: 'States the central normative claim that deviant globalization is permanent and developmentally significant.'
  - id: gilman-deviant-globalization#u01-c5
    heading: 'Globalization is not inevitable: politics lags technology'
    span: 19681:20434
    why: 'Gives the editors'' historical caution that integration can reverse, countering inevitability narratives.'
  - id: gilman-deviant-globalization#u01-c6
    heading: 'Deviant entrepreneurs as a third nonstate actor'
    span: 24022:25373
    why: 'Introduces the deviant entrepreneur as the category both globalization enthusiasts and critics overlook.'
- nn: 2
  unit_id: intro-2-deviant-globalization
  note_id: gilman-deviant-globalization-intro-2-deviant-globalization
  span: 25375:56579
  chunks:
  - id: gilman-deviant-globalization#u02-c1
    heading: 'Deviant globalization as a distinct category of economic action'
    span: 25407:26075
    why: 'States the editors'' core definition: deviance consists in violating noneconomic Western norms, not in being a nuisance or ordinary exploitation.'
  - id: gilman-deviant-globalization#u02-c2
    heading: 'Every mainstream industry has a deviant doppelgänger'
    span: 36238:36935
    why: 'Gives the inseparability thesis: the same infrastructure and industries enable both mainstream and deviant flows.'
  - id: gilman-deviant-globalization#u02-c3
    heading: 'The yuck factor as a conventional lens'
    span: 37700:38578
    why: 'Defines the affective lens and the editors'' stance that disgust is a signal of deviance but not a basis for analysis.'
  - id: gilman-deviant-globalization#u02-c4
    heading: 'Why coercion is too broad and too narrow a lens'
    span: 42739:43357
    why: 'Rejects the contract-law coercion criterion as a way of identifying or judging deviant transactions.'
  - id: gilman-deviant-globalization#u02-c5
    heading: 'The return of the repressed'
    span: 45088:45743
    why: 'Supplies the demand-side alternative lens: deviant supply is driven by repressed demand and is a permanent, adaptive mechanism.'
  - id: gilman-deviant-globalization#u02-c6
    heading: 'Regulatory economics and regulatory arbitrage'
    span: 46352:47194
    why: 'Introduces regulatory capture and regulatory arbitrage, the supply-side core of the editors'' analytic frame.'
- nn: 3
  unit_id: ch01-keefe-snakeheads-1
  note_id: gilman-deviant-globalization-ch01-keefe-snakeheads-1
  span: 56579:73836
  chunks:
  - id: gilman-deviant-globalization#u03-c1
    heading: 'Changle and the remittance economy'
    span: 57572:58739
    why: 'Shows how smuggled emigrants'' remittances underwrite local development in Fujian, the unit''s opening empirical claim.'
  - id: gilman-deviant-globalization#u03-c2
    heading: 'Snakeheads: brokers seen as a social good'
    span: 61987:63168
    why: 'Defines snakeheads and the gap between their legal status and their community standing.'
  - id: gilman-deviant-globalization#u03-c3
    heading: 'No reliable numbers on illegal Fujianese entry'
    span: 66869:67662
    why: 'Documents the evidentiary limits and hedged estimates of clandestine migration.'
  - id: gilman-deviant-globalization#u03-c4
    heading: 'Development drives emigration'
    span: 69679:70705
    why: 'Keefe''s causal mechanism for why growth and remittances fuel further emigration.'
  - id: gilman-deviant-globalization#u03-c5
    heading: 'Smuggling is not trafficking'
    span: 72064:72721
    why: 'Draws the analytic distinction between consensual smuggling and coercive trafficking.'
  - id: gilman-deviant-globalization#u03-c6
    heading: 'A decentralized, atomized trade'
    span: 72723:73834
    why: 'States the network structure of the snakehead business against the mafia-hierarchy assumption.'
- nn: 4
  unit_id: ch01-keefe-snakeheads-2
  note_id: gilman-deviant-globalization-ch01-keefe-snakeheads-2
  span: 73836:95125
  chunks:
  - id: gilman-deviant-globalization#u04-c1
    heading: 'Big snakeheads, little snakeheads and the guarantor'
    span: 75088:76233
    why: 'Lays out the division of labor and the trust mechanism that makes deferred-payment smuggling work.'
  - id: gilman-deviant-globalization#u04-c2
    heading: 'From planes to ships: human cargo and economies of scale'
    span: 77360:78567
    why: 'Shows the commodity and economies-of-scale logic behind the shift from retail to wholesale smuggling.'
  - id: gilman-deviant-globalization#u04-c3
    heading: 'Debt, grace periods and the contract view'
    span: 80791:81804
    why: 'Corrects the indenture misconception and distinguishes official charges from customers'' own understanding of the deal.'
  - id: gilman-deviant-globalization#u04-c4
    heading: 'Globalization as the enabling condition'
    span: 82371:83545
    why: 'Keefe''s core argument that licit global infrastructure and capital flows enabled the snakehead business.'
  - id: gilman-deviant-globalization#u04-c5
    heading: 'The weakest-link problem and the illicit back door'
    span: 83989:84677
    why: 'States the weakest-link logic of international regulation, the chapter''s most analytic claim.'
  - id: gilman-deviant-globalization#u04-c6
    heading: 'Market saturation as the explanation for decline'
    span: 91271:91779
    why: 'Reports informants'' alternative to the prosperity explanation for the trade''s slowdown.'
- nn: 5
  unit_id: ch02-flynn-sex-trade-1
  note_id: gilman-deviant-globalization-ch02-flynn-sex-trade-1
  span: 95125:116348
  chunks:
  - id: gilman-deviant-globalization#u05-c1
    heading: 'The sex trade cannot be counted'
    span: 102041:103277
    why: 'Flynn''s argument that the trade is unmeasurable, with the Thailand 75,000 versus nearly 2 million example.'
  - id: gilman-deviant-globalization#u05-c2
    heading: 'Willing sale, relative oppression, industrialized supply and demand'
    span: 104357:105083
    why: 'Flynn''s central interpretive claim about choice, coercion and the industrialization of the trade.'
  - id: gilman-deviant-globalization#u05-c3
    heading: 'Two opposing streams and the demand norm'
    span: 105085:107222
    why: 'The global-flow picture of women moving to rich cities and male sex tourists to poor ones, plus cultural demand in Thailand and the Philippines.'
  - id: gilman-deviant-globalization#u05-c4
    heading: 'The bar fine as legal fiction'
    span: 108973:109559
    why: 'Shows how a legal euphemism lets an illegal trade operate with official deference.'
  - id: gilman-deviant-globalization#u05-c5
    heading: 'Why enforcement has no incentive'
    span: 110096:111722
    why: 'Ties the bar economy to tourism revenue, overseas-worker remittances and poverty.'
- nn: 6
  unit_id: ch02-flynn-sex-trade-2
  note_id: gilman-deviant-globalization-ch02-flynn-sex-trade-2
  span: 116348:135869
  chunks:
  - id: gilman-deviant-globalization#u06-c1
    heading: 'Wine''s best night: the arithmetic of a hostess shift'
    span: 116348:117242
    why: 'Gives the concrete income arithmetic of a hostess, anchoring the chapter''s picture of the economics of the trade.'
  - id: gilman-deviant-globalization#u06-c2
    heading: 'Training, tests and credit for a Japan entertainer visa'
    span: 117899:118623
    why: 'Shows how debt financing and a legal visa channel work together in labour migration into the entertainment trade.'
  - id: gilman-deviant-globalization#u06-c3
    heading: 'After the US bases: a self-sustaining industry'
    span: 125611:126503
    why: 'Flynn''s central analytic claim that the trade outlived its original demand and now generates its own, internationally.'
  - id: gilman-deviant-globalization#u06-c4
    heading: 'Why arrests change nothing'
    span: 132949:133564
    why: 'States the chapter''s verdict that laws on paper are breached in practice and enforcement does not dent the business.'
  - id: gilman-deviant-globalization#u06-c5
    heading: 'Agnew freed and thanked by the police'
    span: 135367:135867
    why: 'Flynn''s capstone evidence of the gap between prosecution and practice, with a police plaque for an alleged club owner.'
- nn: 7
  unit_id: ch02-flynn-sex-trade-3
  note_id: gilman-deviant-globalization-ch02-flynn-sex-trade-3
  span: 135869:153199
  chunks:
  - id: gilman-deviant-globalization#u07-c1
    heading: 'Competing official estimates of trafficking'
    span: 142852:143583
    why: 'Collects the headline State Department, UNICEF, ILO and FBI figures on trafficking volume and profits that Flynn then problematizes.'
  - id: gilman-deviant-globalization#u07-c2
    heading: 'Why the numbers cannot be verified'
    span: 143585:144341
    why: 'Flynn''s argument, with an official''s concession, that trafficking statistics are guesstimates serving media and policy audiences.'
  - id: gilman-deviant-globalization#u07-c3
    heading: 'Victims who cannot be counted'
    span: 141755:142850
    why: 'Explains the mechanism of victim invisibility and silence that makes the trade hard to see, count or police.'
  - id: gilman-deviant-globalization#u07-c4
    heading: 'Moldova as petri dish: IOM counts'
    span: 145338:146524
    why: 'Gives Moldova''s scale, its post-Soviet context, and the IOM case count described as only a fraction of victims.'
  - id: gilman-deviant-globalization#u07-c5
    heading: 'The Soviet collapse and Moldova''s impoverishment'
    span: 151533:153197
    why: 'The structural account, through Bejan, of state collapse, kleptocratic privatization and mass unemployment that underlies the supply of trafficked women.'
- nn: 8
  unit_id: ch02-flynn-sex-trade-4
  note_id: gilman-deviant-globalization-ch02-flynn-sex-trade-4
  span: 153199:173289
  chunks:
  - id: gilman-deviant-globalization#u08-c1
    heading: 'Official statistics versus actual cases'
    span: 156448:156976
    why: 'Gives the arrest and conviction figures that Flynn then contrasts with the real cases.'
  - id: gilman-deviant-globalization#u08-c2
    heading: 'Earnest but ineffectual: corruption and a starved unit'
    span: 158120:159867
    why: 'States Flynn''s institutional diagnosis: flunkies caught, higher officials protected, and a tiny underequipped unit.'
  - id: gilman-deviant-globalization#u08-c3
    heading: 'Convictions collapse into pimping'
    span: 160075:160837
    why: 'Quantifies the gap between harsh sentencing law and the convictions actually obtained.'
  - id: gilman-deviant-globalization#u08-c4
    heading: 'Demographic and economic collapse feeding the trade'
    span: 162491:164024
    why: 'Links trafficking to emigration, unemployment, abandoned children and ineffective remittances as a self-reinforcing national crisis.'
  - id: gilman-deviant-globalization#u08-c5
    heading: 'Why international sex trafficking cannot be counted'
    span: 168673:169482
    why: 'Flynn''s argument that cross-border legal differences mask slavery as nuisance or legal business, defeating quantification.'
- nn: 9
  unit_id: ch03-seager-sex-trafficking
  note_id: gilman-deviant-globalization-ch03-seager-sex-trafficking
  span: 173289:175291
  chunks:
  - id: gilman-deviant-globalization#u09-c1
    heading: 'Disparity drives the trade and shifts its regions'
    span: 173427:173914
    why: 'States Seager''s core argument that globalization-heightened economic disparity shapes source and demand regions.'
  - id: gilman-deviant-globalization#u09-c2
    heading: 'Recruitment, coercion and kidnapping'
    span: 174165:174496
    why: 'Summarizes Seager''s account of how women and girls are drawn or forced into the trade.'
  - id: gilman-deviant-globalization#u09-c3
    heading: 'Customer voice from a marriage-introduction site'
    span: 174627:174969
    why: 'Quoted site text illustrating gendered demand in the global market for women, cited by Seager rather than argued by her.'
- nn: 10
  unit_id: ch04-ambagtsheer-organs
  note_id: gilman-deviant-globalization-ch04-ambagtsheer-organs
  span: 175291:199177
  chunks:
  - id: gilman-deviant-globalization#u10-c1
    heading: 'Legal professionals are indispensable to the illegal organ trade'
    span: 180900:181937
    why: 'States the chapter''s key structural point that unlike narcotics the organ trade depends on legitimate medical infrastructure and personnel.'
  - id: gilman-deviant-globalization#u10-c2
    heading: 'Open versus underground trade depends on state capacity'
    span: 182513:183930
    why: 'Gives the author''s institutional argument that the visibility and form of the trade vary with regulation, corruption and enforcement.'
  - id: gilman-deviant-globalization#u10-c3
    heading: 'Criminogenic asymmetries and the 2003 Brazil-Israel-South Africa case'
    span: 186866:189545
    why: 'Presents the chapter''s explanatory framework and its central worked example with price differentials.'
  - id: gilman-deviant-globalization#u10-c4
    heading: 'Third asymmetry: weak or permissive state control'
    span: 191532:192663
    why: 'Shows how state incapacity or tolerance, including Israeli insurer ''transplant packages'', sustains the trade.'
  - id: gilman-deviant-globalization#u10-c5
    heading: 'Transplant tourism and the geography of flows'
    span: 196841:197940
    why: 'Summarizes the direction of organ flows along lines of wealth, region and gender, and the breadth of both supply and demand countries.'
- nn: 11
  unit_id: ch05-hari-dubai-1
  note_id: gilman-deviant-globalization-ch05-hari-dubai-1
  span: 199177:223336
  chunks:
  - id: gilman-deviant-globalization#u11-c1
    heading: 'The secrets seeping out: Dubai as neo-liberal metaphor'
    span: 200547:200892
    why: 'States Hari''s thesis that Dubai was built on credit, ecocide, suppression and slavery and stands for the wider globalised order.'
  - id: gilman-deviant-globalization#u11-c2
    heading: 'No bankruptcy: debt as a criminal trap for expats'
    span: 202854:203508
    why: 'Describes the legal mechanism by which debt, resignation and frozen accounts bind even wealthy foreigners to Dubai.'
  - id: gilman-deviant-globalization#u11-c3
    heading: 'Three Dubais, hidden in plain view'
    span: 207522:208028
    why: 'Hari''s compact statement of the city''s tripartite class structure and the habit of not looking at the labour underclass.'
  - id: gilman-deviant-globalization#u11-c4
    heading: 'Sahinal''s recruitment: fees, passport and wage substitution'
    span: 208976:210474
    why: 'Shows concretely how fees, debt and confiscated documents turn migrant recruitment into bonded labour.'
  - id: gilman-deviant-globalization#u11-c5
    heading: 'Illegal on paper, complicit in practice, deaths uncounted'
    span: 213212:214082
    why: 'Carries Hari''s claim of official complicity and the reported suppression of death and suicide figures.'
  - id: gilman-deviant-globalization#u11-c6
    heading: 'The Santa Claus state'
    span: 217848:218809
    why: 'Explains the Emirati welfare bargain, where the state''s income comes from, and a local defence of importing foreign labour.'
  - id: gilman-deviant-globalization#u11-c7
    heading: 'Sultan on strikes: leave or be quiet'
    span: 221020:221649
    why: 'Records an Emirati liberal''s defence of banning strikes while workers are denied exit by held passports, showing the system''s closure of both voice and exit.'
- nn: 12
  unit_id: ch05-hari-dubai-2
  note_id: gilman-deviant-globalization-ch05-hari-dubai-2
  span: 223336:248046
  chunks:
  - id: gilman-deviant-globalization#u12-c1
    heading: 'Al-Mansoori is silenced'
    span: 224583:225439
    why: 'Documents how a rights-lawyer was blacklisted and gives his claim that state-owned firms profit from the labour regime.'
  - id: gilman-deviant-globalization#u12-c2
    heading: 'The maid and the confiscated passport'
    span: 233866:234802
    why: 'States the mechanism of domestic-worker control and shows institutional failure of the consulate.'
  - id: gilman-deviant-globalization#u12-c3
    heading: 'The expat hierarchy'
    span: 231072:231438
    why: 'Primary testimony of the nationality-based ranking that structures expatriate life and attitudes.'
  - id: gilman-deviant-globalization#u12-c4
    heading: 'A city with no water'
    span: 241441:242593
    why: 'Lays out Dubai''s dependence on desalination, its carbon footprint and the expert''s warning about reserves.'
  - id: gilman-deviant-globalization#u12-c5
    heading: 'Sewage in the sea'
    span: 244324:245169
    why: 'A concrete case of infrastructure failing under rapid growth and the authorities'' non-response.'
  - id: gilman-deviant-globalization#u12-c6
    heading: 'Globalization in one city'
    span: 246822:247197
    why: 'Hari''s single explicit analytic claim linking Dubai''s labour regime to ordinary global supply chains.'
- nn: 13
  unit_id: ch06-guevara-paraguay-tobacco
  note_id: gilman-deviant-globalization-ch06-guevara-paraguay-tobacco
  span: 248046:275226
  chunks:
  - id: gilman-deviant-globalization#u13-c1
    heading: '68 billion cigarettes: production far beyond domestic demand'
    span: 252111:252690
    why: 'Gives the chapter''s core quantitative claim that Paraguayan output vastly exceeds domestic consumption and is overwhelmingly smuggled.'
  - id: gilman-deviant-globalization#u13-c2
    heading: 'Smuggling made easy: no regulation and insulated traffickers'
    span: 255312:256054
    why: 'States the chapter''s institutional explanation: weak regulation, elite complicity and fragile reform efforts.'
  - id: gilman-deviant-globalization#u13-c3
    heading: 'Ciudad del Este as money-laundering centre'
    span: 257779:258437
    why: 'Documents the opacity of the financial layer, linking cigarette factories to exchange houses and defeating US investigators.'
  - id: gilman-deviant-globalization#u13-c4
    heading: 'Lake Itaipú piers and the limits of enforcement'
    span: 259554:260219
    why: 'Shows the enforcement asymmetry and the scale of the flow into Brazil against zero legal exports.'
  - id: gilman-deviant-globalization#u13-c5
    heading: 'Filling Big Tobacco''s shoes'
    span: 265585:266419
    why: 'Supplies the tax-arbitrage history linking multinational smuggling in the 1990s to the post-1999 Paraguayan factory boom.'
  - id: gilman-deviant-globalization#u13-c6
    heading: 'The manufacturer''s view: not our problem'
    span: 268129:268711
    why: 'Primary-source statement of how a top producer disclaims responsibility for downstream smuggling.'
- nn: 14
  unit_id: ch07-ellis-west-africa-drugs-1
  note_id: gilman-deviant-globalization-ch07-ellis-west-africa-drugs-1
  span: 275226:308288
  chunks:
  - id: gilman-deviant-globalization#u14-c1
    heading: 'Why West Africa: a permissive political environment'
    span: 279573:280635
    why: 'Ellis''s central explanatory claim that political and social conditions, drawing on Bayart, make West Africa suited to the drug trade.'
  - id: gilman-deviant-globalization#u14-c2
    heading: 'Latin American traders shift to Europe and relocate'
    span: 276572:277310
    why: 'Gives the displacement mechanism (saturation, Mexican gangs, interdiction) behind the shift of cocaine routes toward West Africa and Europe.'
  - id: gilman-deviant-globalization#u14-c3
    heading: 'Legitimacy of the trade in Nigerian eyes'
    span: 291324:291730
    why: 'Reports the moral and economic self-justification of traffickers as a redistribution route, a key deviant-globalization theme.'
  - id: gilman-deviant-globalization#u14-c4
    heading: 'Economic crisis and structural adjustment'
    span: 291733:292671
    why: 'Ellis''s causal account linking structural adjustment and budget cuts to the push into illicit trade, and who took part.'
  - id: gilman-deviant-globalization#u14-c5
    heading: 'Charles Taylor''s views on drugs and laundering'
    span: 301663:302373
    why: 'Second-hand testimony of a future head of state arguing for drug export and laundering as a source of capital for African governments.'
  - id: gilman-deviant-globalization#u14-c6
    heading: 'A fully global trade by the mid-1990s'
    span: 307346:308055
    why: 'Summarizes how West African traders became global and drew external syndicates to the region.'
- nn: 15
  unit_id: ch07-ellis-west-africa-drugs-2
  note_id: gilman-deviant-globalization-ch07-ellis-west-africa-drugs-2
  span: 308288:334419
  chunks:
  - id: gilman-deviant-globalization#u15-c1
    heading: 'Adhocracy versus the mafia model'
    span: 308885:309610
    why: 'States Ellis''s thesis that Nigerian trafficking is a flexible network of ad hoc teams rather than a hierarchical mafia.'
  - id: gilman-deviant-globalization#u15-c2
    heading: 'Strikers, cut-outs and couriers'
    span: 312380:315074
    why: 'Explains the middle layer and the insulation from couriers that make police detection hard.'
  - id: gilman-deviant-globalization#u15-c3
    heading: 'Igbo prominence and the quest for status'
    span: 318877:320417
    why: 'Gives Ellis''s historical and social explanation of the ethnic concentration and motivations of Nigerian drug traders.'
  - id: gilman-deviant-globalization#u15-c4
    heading: 'Guinea-Bissau''s immersion in the cocaine trade'
    span: 324478:325879
    why: 'The fullest reported case of army and state involvement with Latin American traffickers.'
  - id: gilman-deviant-globalization#u15-c5
    heading: 'Weak institutions as the competitive advantage'
    span: 329086:330590
    why: 'Carries the analytical argument that the location of the illegal trade is explained by weak rule of law rather than price.'
  - id: gilman-deviant-globalization#u15-c6
    heading: 'Shadow states, liberalization and indirect rule'
    span: 331757:333602
    why: 'Ellis''s long-term argument linking the drug trade to globalization, 1980s liberalization and older hidden governance traditions.'
- nn: 16
  unit_id: ch08-reding-inland-empire
  note_id: gilman-deviant-globalization-ch08-reding-inland-empire
  span: 334419:365048
  chunks:
  - id: gilman-deviant-globalization#u16-c1
    heading: 'Meth as metaphor for globalization'
    span: 334462:335592
    why: 'States Reding''s central thesis linking the meth economy to farm, food, pharmaceutical and global-economy change.'
  - id: gilman-deviant-globalization#u16-c2
    heading: 'The Amezcua insight: legal precursors and migrant networks'
    span: 345939:346935
    why: 'Gives the mechanism by which legal ingredients and immigrant and out-migrant labor routes created the trafficking pipeline.'
  - id: gilman-deviant-globalization#u16-c3
    heading: 'Meth as a vocational drug'
    span: 347586:348588
    why: 'Explains the demand side: purity, price and availability meeting rural economic collapse.'
  - id: gilman-deviant-globalization#u16-c4
    heading: 'The superlab and DEA ambivalence'
    span: 350610:351584
    why: 'Shows vertical integration by a deviant entrepreneur outside California.'
  - id: gilman-deviant-globalization#u16-c5
    heading: 'How the ephedrine bill was rewritten'
