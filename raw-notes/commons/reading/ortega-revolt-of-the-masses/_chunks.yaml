#  meaningless against any other extraction). Chunk ids match each reading note's `cites:` field.
source: ortega-revolt-of-the-masses
units:
- nn: 1
  unit_id: essays-introduction
  note_id: ortega-revolt-of-the-masses-essays-introduction
  span: 1153:11038
  chunks:
  - id: ortega-revolt-of-the-masses#u01-c1
    heading: 'Guerrero on Ortega''s style: "clarity is courtesy"'
    span: 2867:3776
    why: 'States Ortega''s own stylistic maxim, which Guerrero also treats as his translation''s guiding principle.'
  - id: ortega-revolt-of-the-masses#u01-c2
    heading: 'Guerrero''s translator''s apologetic'
    span: 5846:6411
    why: 'Guerrero''s explicit claim to translation fidelity, the two-voices caution''s clearest example of Guerrero speaking in his own editorial voice.'
  - id: ortega-revolt-of-the-masses#u01-c3
    heading: 'Three influences: Schopenhauer, Nietzsche, Mill'
    span: 7391:7796
    why: 'Guerrero''s compressed genealogy that frames how the rest of the essay, and by extension the book, is read.'
  - id: ortega-revolt-of-the-masses#u01-c4
    heading: 'Europe no longer rules the world'
    span: 7798:8349
    why: 'Guerrero''s framing plus Ortega''s own directly quoted opening diagnosis of civilizational succession, the unit''s strongest resonance with world-machine transition and the gramsci-gap.'
  - id: ortega-revolt-of-the-masses#u01-c5
    heading: 'The mass-man as a flattening force'
    span: 8697:9107
    why: 'Guerrero''s summary of the book''s central mechanism, previewing the mass-man concept central to the rest of the source.'
  - id: ortega-revolt-of-the-masses#u01-c6
    heading: 'Aristocracy of the mind, not of title'
    span: 9922:10311
    why: 'Clarifies that Ortega''s elitism is meritocratic rather than hereditary, a distinction needed to correctly read the select-minority concept downstream.'
- nn: 2
  unit_id: ch01-the-reality-of-the-masses
  note_id: ortega-revolt-of-the-masses-ch01-the-reality-of-the-masses
  span: 11038:25817
  chunks:
  - id: ortega-revolt-of-the-masses#u02-c1
    heading: 'The rebellion of the masses named'
    span: 11077:11695
    why: 'States the book''s central thesis and gives the phenomenon its name in Ortega''s own words.'
  - id: ortega-revolt-of-the-masses#u02-c2
    heading: 'Agglomeration: everything is full'
    span: 12395:12760
    why: 'The concrete visual observation Ortega uses as his empirical entry point into the sociological argument.'
  - id: ortega-revolt-of-the-masses#u02-c3
    heading: 'Defining the mass-man'
    span: 18259:19027
    why: 'Gives Ortega''s precise psychological definition of the mass-man, distinct from any class marker.'
  - id: ortega-revolt-of-the-masses#u02-c4
    heading: 'Defining the select man'
    span: 19029:19753
    why: 'Pairs with the mass-man definition to complete the chapter''s core mass/elite distinction as self-demand versus self-contentment.'
  - id: ortega-revolt-of-the-masses#u02-c5
    heading: 'From liberal democracy to hyper-democracy'
    span: 23445:24291
    why: 'Shows the political stakes of the mass/elite argument: law-mediated democracy giving way to direct mass pressure.'
  - id: ortega-revolt-of-the-masses#u02-c6
    heading: 'Vulgarity proclaimed as a right'
    span: 25155:25511
    why: 'The chapter''s sharpest formulation of the mass''s new self-assertion against everything select or distinct.'
- nn: 3
  unit_id: ch02-the-rising-of-the-historic-level
  note_id: ortega-revolt-of-the-masses-ch02-the-rising-of-the-historic-level
  span: 25817:40938
  chunks:
  - id: ortega-revolt-of-the-masses#u03-c1
    heading: 'Rome and the epoch of the colossal'
    span: 26376:26802
    why: 'Opens the chapter by framing the mass phenomenon as unprecedented within modern history, with Rome''s decline (via Spengler) as the only accepted analogue.'
  - id: ortega-revolt-of-the-masses#u03-c2
    heading: 'A radical and aristocratic reading of history, not a politics'
    span: 27715:28129
    why: 'Ortega''s key clarification that "aristocratic" names a structural feature of any society (a directing minority) rather than a political program he is prescribing.'
  - id: ortega-revolt-of-the-masses#u03-c3
    heading: 'The two-part diagnosis of the mass phenomenon'
    span: 30972:31396
    why: 'States the chapter''s operative thesis in its sharpest form: masses now occupy elite functions and pleasures while simultaneously refusing to obey the elites they have displaced.'
  - id: ortega-revolt-of-the-masses#u03-c4
    heading: 'Rights of man: from juridical ideal to unconscious psychology'
    span: 33637:34229
    why: 'Explains the psychological mechanism behind the mass-man''s self-satisfaction: an achieved ideal loses its "authorizing magic" and hardens into an unreflective appetite.'
  - id: ortega-revolt-of-the-masses#u03-c5
    heading: 'Sea-level history: the sudden rise'
    span: 35402:35781
    why: 'Gives Ortega''s governing metaphor for the chapter''s title concept: the average man as history''s "sea-level," whose sudden rise after long invisible preparation names the "rising of the historic level" itself.'
  - id: ortega-revolt-of-the-masses#u03-c6
    heading: 'Not Americanization but leveling'
    span: 38696:40102
    why: 'Ortega reframes "Europe becoming Americanized" as a convergence of vital levels between continents, arguing the mass ascent signals rising European vitality rather than decline.'
- nn: 4
  unit_id: ch03-the-altitude-of-the-times
  note_id: ortega-revolt-of-the-masses-ch03-the-altitude-of-the-times
  span: 40938:57177
  chunks:
  - id: ortega-revolt-of-the-masses#u04-c1
    heading: 'Vital altitude vs. chronological time'
    span: 41720:42486
    why: 'States the chapter''s core distinction between abstract chronological time and felt vital altitude, the concept the whole chapter elaborates.'
  - id: ortega-revolt-of-the-masses#u04-c2
    heading: 'The golden-age reflex and Rome''s decline'
    span: 43387:45014
    why: 'Grounds the golden-age posture toward the past in Horace''s lament and concrete symptoms of Roman demographic and military collapse.'
  - id: ortega-revolt-of-the-masses#u04-c3
    heading: 'Plenitude as exhausted desire'
    span: 47648:48620
    why: 'Defines Ortega''s ''plenitude of time'' and, via Cervantes, argues self-satisfied arrival signals dying vitality rather than fulfillment.'
  - id: ortega-revolt-of-the-masses#u04-c4
    heading: 'Cut loose from the dead'
    span: 56023:56532
    why: 'Names the present''s felt rupture from inherited models and precedents, the vitalist counterpart to an interregnum with no living authority left to lean on.'
  - id: ortega-revolt-of-the-masses#u04-c5
    heading: 'The height of our times, defined'
    span: 56638:57175
    why: 'The chapter''s own closing formula for ''the height of our times,'' the thesis the whole argument builds toward.'
- nn: 5
  unit_id: ch04-the-growth-of-life
  note_id: ortega-revolt-of-the-masses-ch04-the-growth-of-life
  span: 57177:72553
  chunks:
  - id: ortega-revolt-of-the-masses#u05-c1
    heading: 'The world has become globalized'
    span: 57617:58470
    why: 'Establishes the chapter''s founding claim, with Ortega''s concrete Seville/Arctic example, that space and time have collapsed as barriers to individual awareness.'
  - id: ortega-revolt-of-the-masses#u05-c2
    heading: 'The world as the repertory of our vital possibilities'
    span: 62240:62940
    why: 'Gives Ortega''s technical philosophical definition of ''world'' as the range of vital possibility, the concept the rest of the chapter measures growth against.'
  - id: ortega-revolt-of-the-masses#u05-c3
    heading: 'Einstein, Newton, and subjective potency'
    span: 64472:65508
    why: 'Shows Ortega using a scientific example not to claim greater truth but greater ''potency'' of spirit, the chapter''s real unit of measurement for growth.'
  - id: ortega-revolt-of-the-masses#u05-c4
    heading: 'Lord of all things, not lord of himself'
    span: 68718:69099
    why: 'The chapter''s most quotable diagnosis: an age with unprecedented capability but no direction for it, reframing ''decadence'' as a problem of drift rather than decline.'
  - id: ortega-revolt-of-the-masses#u05-c5
    heading: 'The duality of power and insecurity'
    span: 69101:70412
    why: 'States the chapter''s psychological thesis directly and reframes insecurity as essential to serious life rather than a symptom, the pivot into the following chapters on the masses.'
  - id: ortega-revolt-of-the-masses#u05-c6
    heading: 'Progress guaranteed, and the rudder abandoned'
    span: 71161:71642
    why: 'Ortega''s sharpest political claim in the unit: both liberal and Marxist progress-narratives abdicated historical agency by assuming the future was guaranteed.'
- nn: 6
  unit_id: ch05-a-statistical-datum
  note_id: ortega-revolt-of-the-masses-ch05-a-statistical-datum
  span: 72553:83641
  chunks:
  - id: ortega-revolt-of-the-masses#u06-c1
    heading: 'Life as choice: character decides, not circumstance'
    span: 73196:74631
    why: 'States the chapter''s philosophical premise — that character, not circumstance, decides — which Ortega then extends from the individual to collective life to justify diagnosing Europe through its dominant human type.'
  - id: ortega-revolt-of-the-masses#u06-c2
    heading: 'Collective life: the mass-man now decides directly'
    span: 74633:75437
    why: 'Extends the character-decides premise to society and draws the key contrast between the old democratic masses, who merely backed a minority''s forward-looking program, and today''s mass-man, who rules directly.'
  - id: ortega-revolt-of-the-masses#u06-c3
    heading: 'Government by the masses: omnipotent and ephemeral'
    span: 76052:77371
    why: 'Names the concrete political symptom — mass rule with no future-oriented program, reactive and self-justifying only by appeal to the present moment — the passage most legible against the WMP gramsci-gap frame.'
  - id: ortega-revolt-of-the-masses#u06-c4
    heading: 'Sombart''s statistical datum: Europe''s population, 1800–1914'
    span: 77686:78831
    why: 'The chapter''s title fact and evidentiary core — the population statistic Ortega uses to explain the material origin of the masses'' historical triumph.'
  - id: ortega-revolt-of-the-masses#u06-c5
    heading: 'Technique without spirit: instructed but not educated'
    span: 80101:81016
    why: 'Explains the psychological consequence of the population surge — mass schooling that transmitted technique but not cultural or historical formation — central to Ortega''s account of the mass-man''s character.'
  - id: ortega-revolt-of-the-masses#u06-c6
    heading: 'Revolt against the 19th century: the vertical invasion of the barbarians'
    span: 82454:83636
    why: 'The chapter''s climax and closing judgment — crediting the 19th century''s formula while warning that the mass-man it produced threatens to dissolve it into barbarism within a generation, ending on Ortega''s deliberate ambivalence.'
- nn: 7
  unit_id: ch06-the-dissection-of-the-mass-man-begins
  note_id: ortega-revolt-of-the-masses-ch06-the-dissection-of-the-mass-man-begins
  span: 83641:95086
  chunks:
  - id: ortega-revolt-of-the-masses#u07-c1
    heading: 'History as prophecy: Hegel, Comte, Nietzsche foresaw the masses'
    span: 84339:85286
    why: 'States Ortega''s historiographic method — that only the ''general structure'' of the future is foreseeable, illustrated by three named prophetic thinkers.'
  - id: ortega-revolt-of-the-masses#u07-c2
    heading: '"Wide is Castile": the 19th century''s freedom from restriction'
    span: 86533:87346
    why: 'Names the chapter''s governing motto for 19th-century emancipation and contrasts it with the ''burdensome destiny'' of every prior common man.'
  - id: ortega-revolt-of-the-masses#u07-c3
    heading: 'The psychology of the spoilt child'
    span: 91606:92878
    why: 'Gives Ortega''s core psychological diagnosis of the mass-man in his own terms: free-expanding desire plus radical ingratitude, modeled on an undisciplined child.'
  - id: ortega-revolt-of-the-masses#u07-c4
    heading: 'The motorcar and the sunrise: naturalizing civilization'
    span: 90427:91604
    why: 'Makes the naturalization thesis concrete: the mass-man expects progress and abundance the way he expects sunrise, oblivious to the effort sustaining either.'
  - id: ortega-revolt-of-the-masses#u07-c5
    heading: 'Thesis: organization mistaken for nature, and the bakery riot'
    span: 94067:94914
    why: 'The chapter''s explicit thesis statement plus its closing image — the single most load-bearing passage in the unit.'
- nn: 8
  unit_id: ch07-noble-life-and-vulgar-life
  note_id: ortega-revolt-of-the-masses-ch07-noble-life-and-vulgar-life
  span: 95086:107299
  chunks:
  - id: ortega-revolt-of-the-masses#u08-c1
    heading: 'The world as a mold for the soul'
    span: 95141:95867
    why: 'States Ortega''s generalizing premise that a generation''s psychology is formed by the world it inherits as given, contrasting scarcity-formed and abundance-formed minds.'
  - id: ortega-revolt-of-the-masses#u08-c2
    heading: 'The noble life as self-imposed discipline'
    span: 98747:99899
    why: 'Defines the noble life as self-appeal to a demanding standard rather than self-satisfaction, the chapter''s central ethical inversion, capped by the Goethe epigram.'
  - id: ortega-revolt-of-the-masses#u08-c3
    heading: 'Nobility''s etymology: earned fame, not inherited blood'
    span: 101015:101592
    why: 'Grounds the noble/mass distinction in word-history rather than class, showing hereditary nobility as a degenerate, passive copy of the earned original.'
  - id: ortega-revolt-of-the-masses#u08-c4
    heading: 'Mass redefined as inertia, not multitude'
    span: 102948:103264
    why: 'The book''s single clearest definitional sentence for "mass": a psychological condition of inertia, applicable across any class, not a headcount.'
  - id: ortega-revolt-of-the-masses#u08-c5
    heading: 'The nineteenth century''s abandoned, self-sufficient mass'
    span: 104434:105355
    why: 'Ortega''s causal "psychological equation": unprecedented powers without external constraint produced a hermetically self-enclosed, indocile mass type.'
  - id: ortega-revolt-of-the-masses#u08-c6
    heading: 'Even goodwill cannot restore followership'
    span: 105797:106158
    why: 'Predicts that structural indocility will defeat the mass''s own good intentions in a coming crisis, the chapter''s starkest forward-looking claim.'
- nn: 9
  unit_id: ch08-why-the-masses-intervene-in-everything
  note_id: ortega-revolt-of-the-masses-ch08-why-the-masses-intervene-in-everything
  span: 107299:123225
  chunks:
  - id: ortega-revolt-of-the-masses#u09-c1
    heading: 'The mass-man''s paradisiacal self-satisfaction'
    span: 108812:109899
    why: 'States the psychological root of the whole chapter: unlike vanity, the mass-man''s self-satisfaction needs no external confirmation and so never confronts its own insufficiency.'
  - id: ortega-revolt-of-the-masses#u09-c2
    heading: 'The fool versus the man of sense'
    span: 109901:110842
    why: 'Sharpens the self-satisfaction theme into a claim that intelligence is self-correction, which the mass-man''s hermetism forecloses regardless of his cleverness.'
  - id: ortega-revolt-of-the-masses#u09-c3
    heading: 'Culture as standards, barbarism as their absence'
    span: 114083:115139
    why: 'Ortega''s most explicit, quotable definition of culture as a procedural rather than substantive achievement, and the chapter''s pivot to "barbarism" as its own name for the mass revolt.'
  - id: ortega-revolt-of-the-masses#u09-c4
    heading: 'Direct action as the Magna Carta of barbarism'
    span: 118576:119731
    why: 'Names the specific political mechanism (Syndicalism, Fascism, "direct action") by which hermetic self-satisfaction becomes historical violence, inverting force from ultima to prima ratio.'
  - id: ortega-revolt-of-the-masses#u09-c5
    heading: 'Civilization as the will to live in common'
    span: 120496:121442
    why: 'Gives the positive definition of civilization (civis, common life, taking others into account) against which the chapter''s barbarism is measured.'
  - id: ortega-revolt-of-the-masses#u09-c6
    heading: 'Liberalism''s generosity and the mass''s hatred of opposition'
    span: 122010:123223
    why: 'Ortega''s own worked political example — liberal democracy as the hardest achievement of indirect, standards-based common life — and the chapter''s closing diagnosis of the mass turning against it.'
- nn: 10
  unit_id: ch09-primitivism-and-the-technical
  note_id: ortega-revolt-of-the-masses-ch09-primitivism-and-the-technical
  span: 123225:139711
  chunks:
  - id: ortega-revolt-of-the-masses#u10-c1
    heading: 'History as open drama, not determined progress'
    span: 123901:125293
    why: 'Opens Ortega''s non-deterministic philosophy of history, framing the rebellion of the masses as genuinely open between triumph and catastrophe.'
  - id: ortega-revolt-of-the-masses#u10-c2
    heading: 'The mass-man defined as Naturmensch'
    span: 129864:130598
    why: 'States the chapter''s central thesis: the mass-man is a primitive who occupies civilization without understanding or seeing it.'
  - id: ortega-revolt-of-the-masses#u10-c3
    heading: 'Vertical invasion of the barbarians, glossed'
    span: 130600:131127
    why: 'Glosses Ortega''s ''vertical invasion of the barbarians'' as the mass-man slipping onto an already-built civilizational stage from within, not from outside.'
  - id: ortega-revolt-of-the-masses#u10-c4
    heading: 'Against Spengler: technicism is not causae sui'
    span: 132135:132746
    why: 'Rebuts Spengler by arguing technicism is not self-sustaining but a precipitate of pure science that survives only on the inertia of a dying cultural enthusiasm.'
  - id: ortega-revolt-of-the-masses#u10-c5
    heading: 'Experimental science rarer than the unicorn'
    span: 134049:134694
    why: 'Shows experimental science as a rare, geographically and historically contingent achievement, not a permanent endowment of modernity.'
  - id: ortega-revolt-of-the-masses#u10-c6
    heading: 'Science''s new social pariah'
    span: 136208:136768
    why: 'Names the mass-man''s ingratitude toward science—benefiting without sacrifice—as a quieter but more terrifying barbarism than any louder symptom.'
- nn: 11
  unit_id: ch10-primitivism-and-history
  note_id: ortega-revolt-of-the-masses-ch10-primitivism-and-history
  span: 139711:154897
  chunks:
  - id: ortega-revolt-of-the-masses#u11-c1
    heading: 'Civilization as artifice bordering the jungle'
    span: 140341:140932
    why: 'States the chapter''s governing premise that civilization is artificial and requires active maintenance, or it reverts to primitive Nature.'
  - id: ortega-revolt-of-the-masses#u11-c2
    heading: 'The mass-man''s category error: civilization mistaken for Nature'
    span: 142678:142969
    why: 'Applies the civilization-as-artifice premise directly to the mass-man, explaining why his relation to civilization is functionally primitive.'
  - id: ortega-revolt-of-the-masses#u11-c3
    heading: 'History as technique, and Europe''s amnesia'
    span: 146040:147630
    why: 'Defines historical knowledge as a technique against repeating past error and diagnoses Europe''s loss of that knowledge as a slow, hidden retrogression towards barbarism.'
  - id: ortega-revolt-of-the-masses#u11-c4
    heading: 'Revolutions as monotonous repetition'
    span: 148414:149656
    why: 'Applies the amnesia thesis to the 1917 revolution, arguing its real anachronism is repeating past revolutionary errors without correction.'
  - id: ortega-revolt-of-the-masses#u11-c5
    heading: 'False dawns and the chronology of liberalism'
    span: 150596:151619
    why: 'Ortega''s sharpest argument that Bolshevism and Fascism are primitivism, not novelty, because anti-liberalism cannot legitimately outrank the liberalism that historically superseded it.'
  - id: ortega-revolt-of-the-masses#u11-c6
    heading: 'The past as revenant'
    span: 152648:153092
    why: 'Resolves the chapter''s argument into method: the past cannot be defeated, only accepted and digested, which is what it means to live at the height of one''s time.'
- nn: 12
  unit_id: ch11-the-age-of-the-self-satisfied-dandy
  note_id: ortega-revolt-of-the-masses-ch11-the-age-of-the-self-satisfied-dandy
  span: 154897:171929
  chunks:
  - id: ortega-revolt-of-the-masses#u12-c1
    heading: 'The mass-man''s three-part psychology, restated'
    span: 154947:156389
    why: 'Condenses the chapter''s opening program: ease breeds self-satisfaction breeds direct action, and announces the essay as only a preliminary skirmish.'
  - id: ortega-revolt-of-the-masses#u12-c2
    heading: 'The spoiled child of human history'
    span: 157370:158444
    why: 'Names the mass-man as heir-who-behaves-only-as-heir and pivots into the hereditary-aristocracy analogy that structures the chapter''s middle section.'
  - id: ortega-revolt-of-the-masses#u12-c3
    heading: 'The aristocrat''s atrophied, inauthentic life'
    span: 159052:160310
    why: 'Argues that inheriting conditions one did not struggle to create destroys authenticity, the chapter''s most philosophically loaded claim.'
  - id: ortega-revolt-of-the-masses#u12-c4
    heading: 'Negative freedom and the inescapability of destiny'
    span: 164930:165397
    why: 'States Ortega''s voluntas/destiny distinction: one can refuse one''s destiny but never escape it, only be imprisoned by it differently.'
  - id: ortega-revolt-of-the-masses#u12-c5
    heading: 'Liberalism as Europe''s known destiny'
    span: 166247:167649
    why: 'Ortega''s central political claim: both Fascist and Communist secretly know liberalism is Europe''s inexorable destiny beneath their disputed opinions.'
  - id: ortega-revolt-of-the-masses#u12-c6
    heading: 'The hurricane of farcicality'
    span: 168974:169882
    why: 'Diagnoses interwar Europe''s politics as insincere comic performance rather than genuine confrontation with destiny, the chapter''s closing political charge.'
- nn: 13
  unit_id: ch12-the-barbarism-of-specialization
  note_id: ortega-revolt-of-the-masses-ch12-the-barbarism-of-specialization
  span: 171929:185449
  chunks:
  - id: ortega-revolt-of-the-masses#u13-c1
    heading: 'Technicism produces mass-man, quantitatively and qualitatively'
    span: 173142:173871
    why: 'States the chapter''s pivot: the same technicism behind Europe''s population surge is now argued to be the mechanism producing mass-man''s qualitative, degraded character.'
  - id: ortega-revolt-of-the-masses#u13-c2
    heading: 'Specialization dislodges encyclopedic culture across three generations'
    span: 177338:178293
    why: 'Ortega''s precise historical periodization of specialization as a rupture from integral culture, naming the mechanism by which curiosity itself becomes stigmatized.'
  - id: ortega-revolt-of-the-masses#u13-c3
    heading: 'Scientific labor mechanized into narrow, disarticulated cells'
    span: 178295:180055
    why: 'Ortega''s core mechanism for how mediocre specialists still advance science: knowledge divided into machine-workable sections that require no grasp of the whole.'
  - id: ortega-revolt-of-the-masses#u13-c4
    heading: 'The specialist defined as a learned ignoramus'
    span: 180711:181702
    why: 'The chapter''s conceptual center: the specialist breaks the old learned/ignorant binary and is named as a genuinely new anthropological type.'
  - id: ortega-revolt-of-the-masses#u13-c5
    heading: 'Specialist barbarism as the cause of European demoralization'
    span: 182478:183346
    why: 'Escalates the specialist from an intellectual curiosity to the chapter''s civilizational stakes, naming him as mass-man''s clearest, most striking embodiment.'
- nn: 14
  unit_id: ch13-the-greatest-danger-the-state
  note_id: ortega-revolt-of-the-masses-ch13-the-greatest-danger-the-state
  span: 185449:201302
  chunks:
  - id: ortega-revolt-of-the-masses#u14-c1
    heading: 'The State named as civilization''s own danger'
    span: 188837:189323
    why: 'Names the State as the chapter''s central threat and ties it explicitly to the previous chapter''s diagnosis of specialization strangling what it grows from.'
  - id: ortega-revolt-of-the-masses#u14-c2
    heading: 'Statism defined, and the L''Etat c''est moi fallacy'
    span: 193998:195083
    why: 'Defines Statism precisely as State intervention absorbing spontaneous social effort, and diagnoses mass-man''s false identification with the anonymous State.'
  - id: ortega-revolt-of-the-masses#u14-c3
    heading: 'The machine consumes its host'
    span: 195085:195624
    why: 'States the mechanism in its starkest form: the State as a machine that survives only by sucking the vital marrow out of the society that built it.'
  - id: ortega-revolt-of-the-masses#u14-c4
    heading: 'Rome as the exemplum of Statism'
    span: 196978:197784
    why: 'Cashes out the abstract mechanism in Rome''s concrete decline -- bureaucratization, militarization, and eventual foreign takeover of a State that had outgrown its own society.'
  - id: ortega-revolt-of-the-masses#u14-c5
    heading: 'Mussolini and Fascism as mass-man''s Statism'
    span: 197786:198719
    why: 'Ortega''s contemporary (1930) case study: Fascism''s ''all for the State'' formula convicted as a typical mass-man movement parasitic on a liberal-democratic State it did not build.'
  - id: ortega-revolt-of-the-masses#u14-c6
    heading: 'France and England: two ideas of the State'
    span: 200112:201300
    why: 'Closes the chapter with a concrete comparative illustration -- France''s police force versus England''s tolerance of disorder -- of a State empowered without limit against one that is kept bounded.'
- nn: 15
  unit_id: ch14a-who-commands-in-the-world-1-3
  note_id: ortega-revolt-of-the-masses-ch14a-who-commands-in-the-world-1-3
  span: 201302:228910
  chunks:
  - id: ortega-revolt-of-the-masses#u15-c1
    heading: 'Rule Rests on Force''s Absence: Napoleon in Spain'
    span: 203449:204584
    why: 'States Ortega''s foundational redefinition of "rule" as resting on public opinion rather than force, using Napoleon''s occupation of Spain as proof that force without consent is not rule.'
  - id: ortega-revolt-of-the-masses#u15-c2
    heading: 'Public Opinion as the Gravitation of History'
    span: 204586:205574
    why: 'Gives the chapter''s central theoretical claim in its most quotable form — public opinion as "the universal law of gravitation in political history" — the mechanism behind any displacement of power.'
  - id: ortega-revolt-of-the-masses#u15-c3
    heading: 'The Vacuum Left by Absent Opinion'
    span: 206120:206814
    why: 'Describes what happens when public opinion collapses — brute force fills the vacuum as a substitute — the clearest statement of the interregnum Ortega diagnoses for his own moment.'
  - id: ortega-revolt-of-the-masses#u15-c4
    heading: 'Mass-Peoples as Unruly Schoolchildren'
    span: 216308:217364
    why: 'Extends the book''s mass-man psychology from individuals to whole nations: smaller states celebrate Europe''s apparent decline like children once the teacher leaves the room, with nothing to replace the old order.'
  - id: ortega-revolt-of-the-masses#u15-c5
    heading: 'An "Unemployed" Existence'
    span: 221072:222725
    why: 'Ortega''s existential diagnosis of the interwar spirit: freed from commandments, humanity feels not liberated but "unemployed," and command is what supplies life a mission.'
  - id: ortega-revolt-of-the-masses#u15-c6
    heading: 'Moscow and New York as Historical Camouflage'
    span: 222727:223862
    why: 'Names Moscow and New York as the era''s apparent candidates to succeed Europe and dismisses both as camouflage — borrowed European forms, not genuine new commanding civilizations.'
- nn: 16
  unit_id: ch14b-who-commands-in-the-world-4-6
  note_id: ortega-revolt-of-the-masses-ch14b-who-commands-in-the-world-4-6
  span: 228910:258872
  chunks:
  - id: ortega-revolt-of-the-masses#u16-c1
    heading: 'Command and obedience as the decisive social function'
    span: 228913:229765
    why: 'Opens Ortega''s method for the chapter: a society''s, and an individual''s, health is set entirely by whether the question of who commands is settled.'
  - id: ortega-revolt-of-the-masses#u16-c2
    heading: 'The illusion of rule as Europe''s tonic'
    span: 236885:237390
    why: 'States the chapter''s central warning explicitly: losing the habit of ruling would degrade Western minds within a generation and a half.'
  - id: ortega-revolt-of-the-masses#u16-c3
    heading: 'Trammeled in tiny cages: the nation-state outgrown'
    span: 240578:241680
    why: 'Gives Ortega''s central diagnosis of "European decadence" as capacity outstripping an obsolete political container, the passage most legible as a Gramsci-gap image.'
  - id: ortega-revolt-of-the-masses#u16-c4
    heading: 'Parliament''s crisis is a crisis of purpose, not of the instrument'
    span: 243228:243681
    why: 'Shows Ortega defending institutions themselves while indicting the missing program for them, key to his argument that reform beats abolition.'
  - id: ortega-revolt-of-the-masses#u16-c5
    heading: 'The polis as an invention of legible civic space'
    span: 250370:250674
    why: 'Defines the founding act of the Greco-Roman state as walling off an empty civic space from the countryside, Ortega''s origin story for the state as political technology.'
  - id: ortega-revolt-of-the-masses#u16-c6
    heading: 'The State begins as a work of imagination'
    span: 257733:258186
    why: 'States Ortega''s thesis that political form is built, not given, and that a people''s capacity for statehood is bounded by its capacity to imagine.'
- nn: 17
  unit_id: ch14c-who-commands-in-the-world-7
  note_id: ortega-revolt-of-the-masses-ch14c-who-commands-in-the-world-7
  span: 258872:288214
  chunks:
  - id: ortega-revolt-of-the-masses#u17-c1
    heading: 'Clear heads: Themistocles and Caesar'
    span: 258875:259818
    why: 'Defines Ortega''s ideal of political clairvoyance amid chaos, the standard against which Caesar is about to be measured.'
  - id: ortega-revolt-of-the-masses#u17-c2
    heading: 'The ideas of the shipwrecked'
    span: 260948:261267
    why: 'States Ortega''s core epistemological claim — genuine ideas begin only from admitting oneself lost — that grounds the whole clear-head/Caesar argument.'
  - id: ortega-revolt-of-the-masses#u17-c3
    heading: 'Electoral procedure and the death of the Republic'
    span: 263594:264515
    why: 'Ortega''s concrete causal diagnosis of Rome''s institutional collapse, pinned on a specific mechanism rather than moral or civilizational decline in the abstract.'
  - id: ortega-revolt-of-the-masses#u17-c4
    heading: 'Caesar''s anticipation of the modern State'
    span: 269430:269956
    why: 'Names Caesar''s ambition for a decentered, participatory State-form that Ortega treats as a genuine prefiguration of the modern national State.'
  - id: ortega-revolt-of-the-masses#u17-c5
    heading: 'The State as pure dynamism, not a fixed thing'
    span: 271235:271880
    why: 'Ortega''s central constructive claim about the State''s nature, the theoretical hinge the rest of the chapter''s argument depends on.'
  - id: ortega-revolt-of-the-masses#u17-c6
    heading: 'Nations as retrospective illusion'
    span: 275466:276376
    why: 'Ortega''s sharpest statement against reading modern nations backward into antiquity, closing the unit''s argument that nations are made, not found.'
- nn: 18
  unit_id: ch14d-who-commands-in-the-world-8-9
  note_id: ortega-revolt-of-the-masses-ch14d-who-commands-in-the-world-8-9
  span: 288214:313781
  chunks:
  - id: ortega-revolt-of-the-masses#u18-c1
    heading: 'Renan''s daily plebiscite, reframed as future not past'
    span: 288218:288601
    why: 'States the essay''s organizing move: the nation is a willed future program, not an inherited fact of blood, language, or past.'
  - id: ortega-revolt-of-the-masses#u18-c2
    heading: 'Life as constant preoccupation with the future'
    span: 289182:289927
    why: 'Generalizes the plebiscite argument into a claim about human temporality that undergirds everything that follows.'
  - id: ortega-revolt-of-the-masses#u18-c3
    heading: 'The three-movement rhythm of nation-formation'
    span: 296655:298288
    why: 'Ortega''s closest approach to a general law of how nations form, later reused to explain why entrenched nationalism is regressive.'
  - id: ortega-revolt-of-the-masses#u18-c4
    heading: 'Background-Europe assembling beneath the nations'' wars'
    span: 300424:302049
    why: 'The structural core of the essay''s case for European unity: a supranational formation already forming unnoticed through ordinary national friction.'
  - id: ortega-revolt-of-the-masses#u18-c5
    heading: 'Interregnum: no one knows who is going to rule'
    span: 304950:306820
    why: 'The essay''s central diagnosis of the present as a dispersed, provisional interregnum between a spent order and an unborn one, its closest resonance with the gramsci-gap.'
  - id: ortega-revolt-of-the-masses#u18-c6
    heading: 'Communism as rival enterprise; the call to build Europe'
    span: 313097:313779
    why: 'The essay''s payoff: names Soviet Communism as competing for the same great-enterprise role and makes the explicit case for a united Europe as counter-enterprise.'
- nn: 19
  unit_id: ch15-arriving-at-the-real-issue
  note_id: ortega-revolt-of-the-masses-ch15-arriving-at-the-real-issue
  span: 313781:319598
  chunks:
  - id: ortega-revolt-of-the-masses#u19-c1
    heading: 'No New Morality, Only Its Absence'
    span: 313822:314447
    why: 'States the chapter''s thesis: Europe''s crisis is a moral vacuum, not a contest between a dying and a dawning morality.'
  - id: ortega-revolt-of-the-masses#u19-c2
    heading: 'All Rights, No Obligations'
    span: 314688:315241
    why: 'Establishes that reactionary and revolutionary postures are interchangeable disguises for the same entitled refusal of obligation.'
  - id: ortega-revolt-of-the-masses#u19-c3
    heading: 'Youth Turned Blackmail'
    span: 316203:317108
    why: 'Shows how the rights-without-obligations logic converts a modest social convention into a standing entitlement claimed at any age.'
  - id: ortega-revolt-of-the-masses#u19-c4
    heading: 'Universal Blackmail and the Empty Hole of Immorality'
    span: 317110:318290
    why: 'Delivers Ortega''s central conceptual claim: refusing all morality is not amorality but an immorality that hollows out morality''s form.'
  - id: ortega-revolt-of-the-masses#u19-c5
    heading: 'Parasitism on an Inherited Civilization'
    span: 318635:319332
    why: 'Reframes the mass-man as pure negation, parasitic on a civilization he did not build, and defers the deeper question of modern culture''s defects.'
- nn: 20
  unit_id: endnotes
  note_id: ortega-revolt-of-the-masses-endnotes
  span: 319598:339545
  chunks:
  - id: ortega-revolt-of-the-masses#u20-c1
    heading: 'The self-satisfaction of the "height of time"'
    span: 320364:320964
    why: 'Names the psychological mechanism behind the main text''s ''altitude of the times'' and self-satisfied mass-man, by way of the etymology of ''modern'' itself.'
  - id: ortega-revolt-of-the-masses#u20-c2
    heading: 'Hermann Weyl on how fast a civilization forgets'
    span: 322632:323207
    why: 'Makes concrete the danger of specialist barbarism: an achievement resting on centuries of preparation but held alive by a handful of minds, one accident from being lost.'
  - id: ortega-revolt-of-the-masses#u20-c3
    heading: 'The mass-man defined at the level of a single thought'
    span: 323723:324075
    why: 'Ortega''s sharpest one-paragraph statement of the mass-man/excellent-man split, isolated from the body text''s surrounding social description.'
  - id: ortega-revolt-of-the-masses#u20-c4
    heading: 'The thirty-year clock of a generation'
    span: 329111:329939
    why: 'Lays out Ortega''s mechanism of historical change as alternating generations, the closest the endnotes come to a periodizing theory of history.'
  - id: ortega-revolt-of-the-masses#u20-c5
    heading: 'Why absolute states were weak states'
    span: 334085:334836
    why: 'Direct argument for the State-as-danger theme, distinguishing an ''intelligent'' modern State from one that instinctively respects society.'
  - id: ortega-revolt-of-the-masses#u20-c6
    heading: 'England''s empire as an experiment in common life'
    span: 339055:339333
    why: 'States the nation-as-project-of-common-life thesis as a live, uncertain wager rather than settled doctrine.'
