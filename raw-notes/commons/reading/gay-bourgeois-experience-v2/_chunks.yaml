source: gay-bourgeois-experience-v2
units:
- nn: 1
  unit_id: counterpoint-1-real-thing
  note_id: gay-bourgeois-experience-v2-counterpoint-1-real-thing
  span: 0:45892
  chunks:
  - id: gay-bourgeois-experience-v2#u01-c1
    heading: 'Freedom and control, privacy, and what bourgeois did not discuss'
    span: 1231:2618
    why: 'States the volume''s central thesis on shifting erotic boundaries, the drive to privacy, and the denial of the loveless-Victorian legend.'
  - id: gay-bourgeois-experience-v2#u01-c2
    heading: 'Disguised love and the psychoanalytic historian''s method'
    span: 2620:4104
    why: 'Justifies reading bourgeois love through Freudian suspicion of surfaces and explains how individual portraits illuminate a class.'
  - id: gay-bourgeois-experience-v2#u01-c3
    heading: 'Beneke''s Chessplayer: manifest moral versus unacknowledged sympathies'
    span: 20737:21619
    why: 'Shows in miniature how Gay reads a lover''s edifying text as sublimated sensuality.'
  - id: gay-bourgeois-experience-v2#u01-c4
    heading: 'Neurotic roots, cultural implications: delayed marriage and Freud''s engagement'
    span: 21621:22547
    why: 'Links Beneke''s individual frustration to the class-wide structure of postponed marriage, with Freud as parallel.'
  - id: gay-bourgeois-experience-v2#u01-c5
    heading: 'Bagehot''s grief, guilt and ambivalence toward his mother'
    span: 33696:34903
    why: 'Gives Gay''s psychoanalytic account of what held Bagehot back from marriage and how it surfaced in his writing.'
  - id: gay-bourgeois-experience-v2#u01-c6
    heading: 'Bagehot''s deliberate courtship and engagement'
    span: 43864:45890
    why: 'Provides the concrete counterpoint to Beneke: a decorous, candid courtship that reaches an engagement in ten months.'
- nn: 2
  unit_id: counterpoint-2-new-objects-old
  note_id: gay-bourgeois-experience-v2-counterpoint-2-new-objects-old
  span: 45892:79318
  chunks:
  - id: gay-bourgeois-experience-v2#u02-c1
    heading: 'Love as refinding: the parent behind every new object'
    span: 45916:47739
    why: 'States the unit''s Freudian thesis that every love object is a refinding and every spouse partly a proxy, extended by Gay to wives.'
  - id: gay-bourgeois-experience-v2#u02-c2
    heading: 'Marietta''s note on the journal and the engagement that followed'
    span: 48845:49711
    why: 'Supplies the outcome the diary withholds, and Marietta''s own account of why the journal survived.'
  - id: gay-bourgeois-experience-v2#u02-c3
    heading: 'The boat-and-machinery dream'
    span: 54018:58009
    why: 'Gay''s showpiece reading of an erotic, wish-and-fear dream, with the full dream narrative quoted from Beneke''s diary.'
  - id: gay-bourgeois-experience-v2#u02-c4
    heading: 'Limits of dream evidence: secondary revision and missing associations'
    span: 59433:60560
    why: 'Shows Gay''s own hedges on using diary-recorded dreams as historical evidence.'
  - id: gay-bourgeois-experience-v2#u02-c5
    heading: 'The infantile wish and the oedipal resolution'
    span: 67369:69196
    why: 'Gay''s central interpretation: Beneke''s dreams express both the wish to stay his mother''s child and the wish for Marietta, with marriage as escape to maturity.'
  - id: gay-bourgeois-experience-v2#u02-c6
    heading: 'Bagehot''s ''delicious'' and ''nervous'' letters'
    span: 71775:73515
    why: 'Gay''s reading of the restrained, avowed sensuality of a bourgeois engagement correspondence, contrasting with Beneke''s tormented dreams.'
- nn: 3
  unit_id: counterpoint-3-love-work
  note_id: gay-bourgeois-experience-v2-counterpoint-3-love-work
  span: 79318:102761
  chunks:
  - id: gay-bourgeois-experience-v2#u03-c1
    heading: 'Libido''s imperialism and the anti-reductionist caveat'
    span: 79336:80156
    why: 'States the section''s thesis that erotic style marks work, while hedging against reductionism and defining sublimation as layered compromise.'
  - id: gay-bourgeois-experience-v2#u03-c2
    heading: 'Two courting styles: Beneke defensive, Bagehot decisive'
    span: 80158:82315
    why: 'Sets up the paired contrast of temperaments that the rest of the section correlates with work and politics.'
  - id: gay-bourgeois-experience-v2#u03-c3
    heading: 'Beneke''s anniversaries and the energy of love and hate'
    span: 90187:90934
    why: 'Shows bourgeois domestic devotion in a diarist''s own words and states Gay''s link between Beneke''s loyalty and his political hostility.'
  - id: gay-bourgeois-experience-v2#u03-c4
    heading: 'Bagehot on productive stupidity and politics as psychology'
    span: 97156:98647
    why: 'Presents Bagehot''s view that habit, symbol and stabilizing conservatism sustain social order, and that politics rests on psychology.'
  - id: gay-bourgeois-experience-v2#u03-c5
    heading: 'Where loving and thinking merge'
    span: 98649:100358
    why: 'Gay''s methodological statement on how private passion shapes public work, with Bagehot''s own rule of interpretation.'
  - id: gay-bourgeois-experience-v2#u03-c6
    heading: 'Eliza Wilson and the case for common marital happiness'
    span: 102355:102759
    why: 'Ties the portrait to the volume''s thesis that happy bourgeois marriages were far from rare, against the legend of the loveless Victorian.'
- nn: 4
  unit_id: ch1-1-conflicting-legacies
  note_id: gay-bourgeois-experience-v2-ch1-1-conflicting-legacies
  span: 102761:141913
  chunks:
  - id: gay-bourgeois-experience-v2#u04-c1
    heading: 'The consensus: concupiscence joined to affection'
    span: 105240:105825
    why: 'States Gay''s thesis of the near-universal ideal of the two currents and Freud''s account of its failure.'
  - id: gay-bourgeois-experience-v2#u04-c2
    heading: 'Hebrews and Hellenes: two conflicting legacies'
    span: 110256:111527
    why: 'Frames the section''s central claim that consensus on love''s definition concealed a conflict over the place of the sensual.'
  - id: gay-bourgeois-experience-v2#u04-c3
    heading: 'Protestant accommodations and Pfister''s remark'
    span: 116191:117803
    why: 'Shows Gay''s revisionist view of Puritan and Protestant attitudes to married sexuality against the legend of prudery.'
  - id: gay-bourgeois-experience-v2#u04-c4
    heading: 'Diderot and the Enlightenment''s praise of passion'
    span: 121892:122618
    why: 'Presents the Enlightenment''s erotic valorization and Gay''s Freudian reading of it as proto-sublimation.'
  - id: gay-bourgeois-experience-v2#u04-c5
    heading: 'Romantic love as applied religion'
    span: 130472:131002
    why: 'Captures the romantic claim for love and imagination that contrasts with the philosophes'' physiology.'
  - id: gay-bourgeois-experience-v2#u04-c6
    heading: 'Coleridge, Schlegel and the reproach to bourgeois marriage'
    span: 136578:137877
    why: 'Gives the romantic indictment of middle-class marriage and ties it back to Gay''s opening concept of the literature of reproach.'
- nn: 5
  unit_id: ch1-2-cynics-enthusiasts
  note_id: gay-bourgeois-experience-v2-ch1-2-cynics-enthusiasts
  span: 141913:187760
  chunks:
  - id: gay-bourgeois-experience-v2#u05-c1
    heading: 'Crystallization: the bough in the salt mine'
    span: 154720:155771
    why: 'Stendhal''s central concept, in his own metaphor, stated in the passage that Gay builds his analysis on.'
  - id: gay-bourgeois-experience-v2#u05-c2
    heading: 'Crystallization as process, not blindness'
    span: 157592:158708
    why: 'Gay''s psychoanalytic defense of crystallization as adaptive misperception serving the pleasure principle.'
  - id: gay-bourgeois-experience-v2#u05-c3
    heading: 'The aristocrat of experience against the bourgeois'
    span: 146455:148423
    why: 'Stendhal''s indictment of the bourgeois and Americans as incapable of love, a key document of the literature of reproach.'
  - id: gay-bourgeois-experience-v2#u05-c4
    heading: 'The physiologies turn cynical and elite'
    span: 163040:165159
    why: 'Gay''s account of how the genre decayed from enthusiasm to cynicism and addressed only the top of the bourgeoisie, not ordinary middle-class ideals.'
  - id: gay-bourgeois-experience-v2#u05-c5
    heading: 'Balzac''s double bed and marital surveillance'
    span: 176931:177600
    why: 'Shows the anxiety and defensiveness beneath Balzac''s worldly tone, with love as a fragile plant.'
  - id: gay-bourgeois-experience-v2#u05-c6
    heading: 'Bourget: knowledge that augments misery'
    span: 186709:187598
    why: 'The bleak endpoint of the physiological genre, and Gay''s bridge to Proust and to the critique of scientific approaches to love.'
- nn: 6
  unit_id: ch1-3-physiology-psychology
  note_id: gay-bourgeois-experience-v2-ch1-3-physiology-psychology
  span: 187760:230293
  chunks:
  - id: gay-bourgeois-experience-v2#u06-c1
    heading: 'Schopenhauer''s sexual will and its reception'
    span: 199741:202407
    why: 'Presents Schopenhauer''s metaphysics of sexual love, its 1850s vogue, and Gay''s Diderot and Freud parallels.'
  - id: gay-bourgeois-experience-v2#u06-c2
    heading: 'Nietzsche: passion, sublimation and love'
    span: 208547:209901
    why: 'States Nietzsche''s thesis that love is sublimated sexual passion and situates it against Christian and bourgeois pity ethics.'
  - id: gay-bourgeois-experience-v2#u06-c3
    heading: 'Nietzsche on bourgeois marriage'
    span: 210842:211975
    why: 'Gives a contemporary critic''s indictment of middle-class marriage as unloving yet reproductively functional.'
  - id: gay-bourgeois-experience-v2#u06-c4
    heading: 'Freud''s two currents and the Don Juan diagnosis'
    span: 216570:217697
    why: 'Gay''s concise statement of the tender and sensual currents and of what counts as a mature love.'
  - id: gay-bourgeois-experience-v2#u06-c5
    heading: 'Development of the currents and transfer of objects'
    span: 219383:220296
    why: 'Explains that tenderness is older than sensuality and how puberty releases the latent sensual current.'
  - id: gay-bourgeois-experience-v2#u06-c6
    heading: 'Unconscious memory as Freud''s contribution to love theory'
    span: 221542:222692
    why: 'Identifies what Gay thinks is new in Freud beyond earlier claims that love is irrational.'
- nn: 7
  unit_id: ch2-1-sober-realities
  note_id: gay-bourgeois-experience-v2-ch2-1-sober-realities
  span: 230293:280340
  chunks:
  - id: gay-bourgeois-experience-v2#u07-c1
    heading: 'Experience, not books, as the teacher of love'
    span: 231405:231688
    why: 'States the chapter''s premise that family-transmitted experience, not the vast print literature, shaped bourgeois love.'
  - id: gay-bourgeois-experience-v2#u07-c2
    heading: 'The passage to marriage as a battlefield of mixed motives'
    span: 233453:235260
    why: 'Gay''s central picture of marriage-making as conflict between parental calculation, filial desire and unconscious feeling, against the myth that love conquers all.'
  - id: gay-bourgeois-experience-v2#u07-c3
    heading: 'Dowry, trousseau and the marriage market'
    span: 243830:246030
    why: 'Concrete evidence of the marriage market as institution, its commercialization, and why the dowry became a target of the love ideology.'
  - id: gay-bourgeois-experience-v2#u07-c4
    heading: 'Power concealed in Victorian love'
    span: 254327:255279
    why: 'Gay''s psychoanalytic claim that affection was entangled with aggression and defensive self-deception, qualifying his generally sympathetic view of bourgeois love.'
  - id: gay-bourgeois-experience-v2#u07-c5
    heading: 'Beatrice Potter and Chamberlain: the end of an option'
    span: 268762:270135
    why: 'A primary-source scene showing male power in courtship and a woman''s diary-based diagnosis of it.'
  - id: gay-bourgeois-experience-v2#u07-c6
    heading: 'Work and Love: what Beatrice Webb shows'
    span: 278270:280338
    why: 'Gay''s generalization from the Webb case: work as defense and outlet, love need not usurp a woman''s place, and the two currents of love could be joined.'
- nn: 8
  unit_id: ch2-2-desire-holy-pure
  note_id: gay-bourgeois-experience-v2-ch2-2-desire-holy-pure
  span: 280340:323308
  chunks:
  - id: gay-bourgeois-experience-v2#u08-c1
    heading: 'Pathology mistaken for the ideal'
    span: 283288:284881
    why: 'States Gay''s rebuttal of the hypocrisy legend: the critics documented real symptoms but mistook them for the rule.'
  - id: gay-bourgeois-experience-v2#u08-c2
    heading: 'The two currents as shared ideal'
    span: 289718:291471
    why: 'Presents the synthesis of tenderness and passion as the bourgeois ideal, cultivated through self-discipline and sometimes attained.'
  - id: gay-bourgeois-experience-v2#u08-c3
    heading: 'Holtei: the angel and the animal'
    span: 294758:295247
    why: 'A contemporary''s own statement of the split between adoration and appetite, which Gay treats as the ideal''s clearest formulation.'
  - id: gay-bourgeois-experience-v2#u08-c4
    heading: 'Mill''s dreams and unappeased sensuality'
    span: 298507:299866
    why: 'Gay''s hedged psychoanalytic reading of a failed synthesis in the Mill marriage, involving the repressed and the superego.'
  - id: gay-bourgeois-experience-v2#u08-c5
    heading: 'Alfred Roe: desire holy and pure'
    span: 315312:317025
    why: 'Source of the section title: explicit marital fantasy defended as sanctified, with the apologetic doubt Gay reads beneath it.'
  - id: gay-bourgeois-experience-v2#u08-c6
    heading: 'Ordinary candor and the tepid record'
    span: 322310:323306
    why: 'Gay''s methodological conclusion: the Roes'' commonplaces make their candor representative, and lost letters mean the record understates the experience.'
- nn: 9
  unit_id: ch3-1-community-fantasies
  note_id: gay-bourgeois-experience-v2-ch3-1-community-fantasies
  span: 323308:355748
  chunks:
  - id: gay-bourgeois-experience-v2#u09-c1
    heading: 'Love the governing preoccupation of the novel'
    span: 324081:324622
    why: 'States the chapter''s opening thesis that love was the novelist''s inescapable subject, even for those who tried to avoid it.'
  - id: gay-bourgeois-experience-v2#u09-c2
    heading: 'Fantasies as scenarios of desire'
    span: 334088:334885
    why: 'Gives the Freudian core definition of fantasy as wish-fulfilment that the section builds on, with Lewes as a pre-analytic witness.'
  - id: gay-bourgeois-experience-v2#u09-c3
    heading: 'Fantasies bridge the personal and the collective; classes organize communities of fantasies'
    span: 335468:336723
    why: 'Gay''s central methodological claim that a social class shapes and circulates fantasies, making fiction usable as historical evidence.'
  - id: gay-bourgeois-experience-v2#u09-c4
    heading: 'The mirror of fiction is cracked'
    span: 338827:340967
    why: 'Qualifies the fiction-as-social-mirror theory and states what the novel is actually good evidence for.'
  - id: gay-bourgeois-experience-v2#u09-c5
    heading: 'Jane Carlyle and regressive pleasure in sentimental fiction'
    span: 342193:342977
    why: 'A concrete case of how even sophisticated bourgeois readers used love fiction for self-aware regressive gratification.'
  - id: gay-bourgeois-experience-v2#u09-c6
    heading: 'Middle-class taste: simple pleasures and what readers avoided'
    span: 348622:351310
    why: 'Describes the institutions and appetites of the bourgeois reading market and states what popular fiction reveals to the historian.'
- nn: 10
  unit_id: ch3-2-hearts-undisciplined-others
  note_id: gay-bourgeois-experience-v2-ch3-2-hearts-undisciplined-others
  span: 355748:408173
  chunks:
  - id: gay-bourgeois-experience-v2#u10-c1
    heading: 'David Copperfield as a morality tale of the undisciplined heart'
    span: 361414:362379
    why: 'States Gay''s central claim that bourgeois fiction contrasts the penalties of impulse with the rewards of disciplined love.'
  - id: gay-bourgeois-experience-v2#u10-c2
    heading: 'The double profit of tantalizing fiction'
    span: 364005:364766
    why: 'Explains how respectable novels let readers enjoy erotic suggestion and then the relief of innocence preserved.'
  - id: gay-bourgeois-experience-v2#u10-c3
    heading: 'The Saturday Review''s confusion from conflict'
    span: 391024:392088
    why: 'Gay''s diagnosis of the review''s incoherence on law, opinion and obscenity as a sign of buried conflict.'
  - id: gay-bourgeois-experience-v2#u10-c4
    heading: 'Reading as playful regression and economic activity'
    span: 397740:399648
    why: 'Gay''s psychoanalytic model of what reading does, set against the censors'' seduction model.'
  - id: gay-bourgeois-experience-v2#u10-c5
    heading: 'The work of fiction and its anxious guardians'
    span: 399650:401455
    why: 'Shows the censors'' misreading of fiction''s effects and defines what it means for a work to work in its readers.'
  - id: gay-bourgeois-experience-v2#u10-c6
    heading: 'Proal''s reform program as symptom'
    span: 406589:408171
    why: 'Closes the unit by placing Proal''s repressive proposals in a century of anxiety about sexual and moral order.'
- nn: 11
  unit_id: ch3-3-beyond-good-evil-part-1
  note_id: gay-bourgeois-experience-v2-ch3-3-beyond-good-evil-part-1
  span: 408173:439513
  chunks:
  - id: gay-bourgeois-experience-v2#u11-c1
    heading: 'The age of privacy and the garrulous lover'
    span: 408767:409273
    why: 'States the paradox that fiction became the licensed outlet for feelings that social discussion withheld.'
  - id: gay-bourgeois-experience-v2#u11-c2
    heading: 'Love as contagion, beyond good and evil'
    span: 411948:412367
    why: 'Gay''s compact thesis that the psychological novel treats love as infection rather than as policy or sin.'
  - id: gay-bourgeois-experience-v2#u11-c3
    heading: 'Fromentin''s Dominique: overcoming memory'
    span: 415645:416455
    why: 'Shows fiction as a psychological work of mourning, resignation and healing rather than moral instruction.'
  - id: gay-bourgeois-experience-v2#u11-c4
    heading: 'Punishing the unloving, not the unwise'
    span: 417332:417986
    why: 'Documents the shift in the moral logic of serious fiction while sentimental romance remained the staple.'
  - id: gay-bourgeois-experience-v2#u11-c5
    heading: 'Gautier''s impunity and Flaubert''s consequences'
    span: 423980:425892
    why: 'Explains why consequence-free sensuality escaped prosecution while Flaubert''s consequential eroticism drew it.'
  - id: gay-bourgeois-experience-v2#u11-c6
    heading: 'Incest as perennial theme and the return of the repressed'
    span: 435911:437158
    why: 'Gay''s explicit Freudian argument for reading incest in literature and for psychoanalysis as a historian''s tool.'
  - id: gay-bourgeois-experience-v2#u11-c7
    heading: 'Victorian reticence and unconscious disclosure'
    span: 438534:439511
    why: 'Applies the return-of-the-repressed thesis to the Victorian gap between official reticence and persistent unconscious content.'
- nn: 12
  unit_id: ch3-3-beyond-good-evil-part-2
  note_id: gay-bourgeois-experience-v2-ch3-3-beyond-good-evil-part-2
  span: 439513:485551
  chunks:
  - id: gay-bourgeois-experience-v2#u12-c1
    heading: 'The triangle and delayed gratification'
    span: 446756:447681
    why: 'Gay''s compact account of why writers needed triangles and how narrative delay mimics the rhythm of erotic satisfaction.'
  - id: gay-bourgeois-experience-v2#u12-c2
    heading: 'David Copperfield as Victorian Oedipus'
    span: 447801:448856
    why: 'States the central oedipal reading of Dora, Clara and Murdstone that anchors Gay''s case for the novel.'
  - id: gay-bourgeois-experience-v2#u12-c3
    heading: 'Innocent, ignorant knowledge'
    span: 452146:452553
    why: 'Gay''s method in miniature: novelists register unconscious truths without a vocabulary, so fiction becomes evidence of collective psychic life.'
  - id: gay-bourgeois-experience-v2#u12-c4
    heading: 'Henry Esmond and readers'' misperception'
    span: 456594:457928
    why: 'Uses Charlotte Bronte and George Eliot''s reactions to show contemporary readers defending against oedipal material.'
  - id: gay-bourgeois-experience-v2#u12-c5
    heading: 'Security did not breed tolerance'
    span: 473110:473558
    why: 'Gay''s counterintuitive claim that mid-century bourgeois consolidation coincided with tightened literary decorum, complicating any linear repression-to-candor story.'
  - id: gay-bourgeois-experience-v2#u12-c6
    heading: 'The bourgeois enemy was anxious, not mendacious'
    span: 483055:483878
    why: 'Gay''s rebuttal of the avant-garde caricature of the philistine bourgeois and his thesis about shifting reading conventions.'
- nn: 13
  unit_id: ch4-1-dividends-denial
  note_id: gay-bourgeois-experience-v2-ch4-1-dividends-denial
  span: 485551:541286
  chunks:
  - id: gay-bourgeois-experience-v2#u13-c1
    heading: 'Why Proust could safely show Mademoiselle Vinteuil'
    span: 491571:492402
    why: 'Gay''s explanation that homosexuality could be published in 1913 only when portrayed as joyless doom, with the erotic scene read as compulsive and stereotyped.'
  - id: gay-bourgeois-experience-v2#u13-c2
    heading: 'Denial versus candor as a bourgeois dilemma'
    span: 495757:496526
    why: 'States the section''s thesis that reticence was a cultural defense and an unresolved dilemma, not mere hypocrisy.'
  - id: gay-bourgeois-experience-v2#u13-c3
    heading: 'The New Tolerance and the wish for forgetfulness after Wilde'
    span: 500582:502517
    why: 'Primary press voices from 1895 demanding intolerance and oblivion, showing the Wilde backlash as defense of reticence.'
  - id: gay-bourgeois-experience-v2#u13-c4
    heading: 'The bourgeois style complicates the deviance thesis'
    span: 503162:505542
    why: 'Gay''s most direct argument that denial created a privileged space of impunity, against the sociological labeling thesis.'
  - id: gay-bourgeois-experience-v2#u13-c5
    heading: 'Albert Dodd''s impunity and its unknown cost'
    span: 521141:522624
    why: 'Summation of the Dodd case: unashamed bisexual attachment sheltered by preserved appearances, with Gay''s hedge about the psychic price.'
  - id: gay-bourgeois-experience-v2#u13-c6
    heading: 'Vaughan''s compromise and the irony of exposure'
    span: 540030:541284
    why: 'Closes the section with the bargain imposed on sexual heretics and the claim that the late-century move toward openness worsened their situation.'
- nn: 14
  unit_id: ch4-2-return-repressed
  note_id: gay-bourgeois-experience-v2-ch4-2-return-repressed
  span: 541286:586559
  chunks:
  - id: gay-bourgeois-experience-v2#u14-c1
    heading: 'Freud''s return of the repressed applied to law'
    span: 544994:545450
    why: 'States the section''s governing thesis: contradictory sexual legislation is a distorted compromise formation, the repressed returning in culture.'
  - id: gay-bourgeois-experience-v2#u14-c2
    heading: 'Why the new candor arrived'
    span: 559347:561158
    why: 'Gives Gay''s multi-causal account of how discussion of homosexuality became possible in the 1870s to 1890s and the hedged claim that the era invented it.'
  - id: gay-bourgeois-experience-v2#u14-c3
    heading: 'Sexual innuendo against feminists as unmastered anxiety'
    span: 561745:563168
    why: 'Shows how anxiety over shifting sex roles was displaced into sexual insult, preparing the public for but not accepting the idea of inversion.'
  - id: gay-bourgeois-experience-v2#u14-c4
    heading: 'Symonds asks Whitman; Whitman denies'
    span: 565129:566963
    why: 'A concrete case of prudent concealment even among advocates, with private practice contradicting public statement.'
  - id: gay-bourgeois-experience-v2#u14-c5
    heading: 'Ellis on what inversion is'
    span: 579053:580550
    why: 'Sets out the range of contemporary readings of inversion and Ellis''s moderate, then subversive, position.'
  - id: gay-bourgeois-experience-v2#u14-c6
    heading: 'Medicine hides behind Latin'
    span: 569341:570731
    why: 'Illustrates concretely how medical candor was shielded by technical language and shame.'
- nn: 15
  unit_id: ch4-3-antique-persuasion
  note_id: gay-bourgeois-experience-v2-ch4-3-antique-persuasion
  span: 586559:629158
  chunks:
  - id: gay-bourgeois-experience-v2#u15-c1
    heading: 'Spirituality of the classics and the Higginson dissent'
    span: 588479:589500
    why: 'States the alibi function of Greece (borrowing dignity and historic rightness) and shows a contemporary rejecting it.'
  - id: gay-bourgeois-experience-v2#u15-c2
    heading: 'Scholarly evasion: Sappho, Jowett, bowdlerizing'
    span: 589502:590614
    why: 'Documents the official respectable-scholarship strategy of denying homoerotic content in the classics.'
  - id: gay-bourgeois-experience-v2#u15-c3
    heading: 'Pater''s coded advocacy in the Winckelmann essay'
    span: 594864:596822
    why: 'Gay''s clearest analysis of how deniable, allusive prose let homoerotic sentiment circulate in polite print.'
  - id: gay-bourgeois-experience-v2#u15-c4
    heading: 'Symonds, Angelo and late-Victorian tolerance'
    span: 599588:600909
    why: 'Contrasts Symonds''s cautious scholarship with his open life and draws a conclusion about private flexibility among the bourgeoisie.'
  - id: gay-bourgeois-experience-v2#u15-c5
    heading: 'Kuzmin''s unapologetic Hellenism and the bourgeois dilemma'
    span: 615440:617309
    why: 'Gay''s thesis on why advocacy exacerbated the problem and why the bourgeoisie could not evade it.'
  - id: gay-bourgeois-experience-v2#u15-c6
    heading: 'Freud''s integration of homosexuality into a theory of mind'
    span: 619070:621380
    why: 'Presents the bisexuality and unconscious argument that reframes exclusive heterosexuality as a problem to be explained.'
- nn: 16
  unit_id: ch5-1-food-love
  note_id: gay-bourgeois-experience-v2-ch5-1-food-love
  span: 629158:667606
  chunks:
  - id: gay-bourgeois-experience-v2#u16-c1
    heading: 'Stratagems: reaction formation, displacement, sublimation'
    span: 630578:631836
    why: 'States Gay''s frame for the chapter: defenses transform erotic drives into prudery or culturally valuable objects, and sublimation is the productive form.'
  - id: gay-bourgeois-experience-v2#u16-c2
    heading: 'Sublimation versus projection, and the limits of abstinence'
    span: 632951:634790
    why: 'Complicates the Freudian economic model by separating sublimation from projection and rejecting the idea that stricter abstinence yields better cultural work.'
  - id: gay-bourgeois-experience-v2#u16-c3
    heading: 'The democratization of music''s erotic work'
    span: 645764:647348
    why: 'Ties music''s role as a displacement of eros to bourgeois institutions such as household education, orchestras, conservatories and the virtuoso cult.'
  - id: gay-bourgeois-experience-v2#u16-c4
    heading: 'Sensuality in higher pretensions: ballet, Wagner worship, Bayreuth'
    span: 652196:653229
    why: 'Gives the principle that the more sensual the work, the more exalted the accompanying rhetoric, with the Wagner cult as its example.'
  - id: gay-bourgeois-experience-v2#u16-c5
    heading: 'The doctrine of distance and the Wagner audience'
    span: 654830:655746
    why: 'Compresses Gay''s claim that mythological and religious drapery let bourgeois audiences enjoy arousal while keeping it under control.'
  - id: gay-bourgeois-experience-v2#u16-c6
    heading: 'Gay''s verdict on Herzogenberg and the Wagner cult'
    span: 665643:667604
    why: 'Gay''s own concluding interpretation: a candid contemporary critic, psychoanalytic hedging of her vehemence, and Wagner''s art as a device for self-deceiving erotic indulgence.'
- nn: 17
  unit_id: ch5-2-budget-displacements
  note_id: gay-bourgeois-experience-v2-ch5-2-budget-displacements
  span: 667606:702811
  chunks:
  - id: gay-bourgeois-experience-v2#u17-c1
    heading: 'Sensuality''s masterpieces of indirection: the love of nature'
    span: 670255:671219
    why: 'States the section''s thesis that love of nature became a conspicuous Victorian tactic for both escaping and intensifying sensuality.'
  - id: gay-bourgeois-experience-v2#u17-c2
    heading: 'Eating as overdetermined: sublimation, fuel, substitute'
    span: 669642:670253
    why: 'Shows Gay''s hedged, multi-causal psychoanalytic reading of eating as an erotic displacement.'
  - id: gay-bourgeois-experience-v2#u17-c3
    heading: 'Nature as oceanic regressive reunion'
    span: 682077:682514
    why: 'Gives Gay''s core interpretation of nature-love as regressive reunion with the first loved object in a decent vocabulary.'
  - id: gay-bourgeois-experience-v2#u17-c4
    heading: 'The Matrimonial Garden and genteel women''s erotic investment'
    span: 686129:686734
    why: 'Illustrates how gardening manuals gave respectable women a sanctioned displacement for erotic and anxious feeling.'
  - id: gay-bourgeois-experience-v2#u17-c5
    heading: 'Nature across the sensual life course; Kingsley'
    span: 686736:686931
    why: 'Argues that nature served adolescent longing and then heightened married satisfaction, so displacement intensifies rather than merely defends.'
  - id: gay-bourgeois-experience-v2#u17-c6
    heading: 'Mabel Loomis''s menu of pleasures'
    span: 696045:697218
    why: 'Shows sensual feeling transferable across objects in a single young diarist and Gay''s mixed skepticism and sympathy.'
  - id: gay-bourgeois-experience-v2#u17-c7
    heading: 'Disaster, undoing, and persistent stratagems'
    span: 702449:702809
    why: 'Closes the section by naming undoing as a defense mobilized by loss and asserting the persistence of sensual stratagems.'
- nn: 18
  unit_id: ch5-3-glandular-christianity-part-1
  note_id: gay-bourgeois-experience-v2-ch5-3-glandular-christianity-part-1
  span: 702811:731745
  chunks:
  - id: gay-bourgeois-experience-v2#u18-c1
    heading: 'Clinicians on the love-religion link and its generalization'
    span: 706490:708389
    why: 'States that displacement into religion is ancient but was generalized and studied in the bourgeois century, with religion as refuge and excuse for sensuality.'
  - id: gay-bourgeois-experience-v2#u18-c2
    heading: 'The Goncourts and the gendered diagnosis of devotion'
    span: 710256:711192
    why: 'Captures the period''s gendered theory of religious feeling (menopause, Schwarmerei, licensed exaltation) as reported by Gay.'
  - id: gay-bourgeois-experience-v2#u18-c3
    heading: 'Annie Besant''s self-analysis'
    span: 714255:716034
    why: 'A first-person case of erotic longing transferred to Christ and then to the clergyman she married.'
  - id: gay-bourgeois-experience-v2#u18-c4
    heading: 'Displacement as a dubious but efficacious defense'
    span: 716036:716986
    why: 'Gay''s own evaluative statement of what displacement does as a defense mechanism.'
  - id: gay-bourgeois-experience-v2#u18-c5
    heading: 'Patmore''s conversion and Love is God'
    span: 725229:726043
    why: 'Gay''s central claim that Patmore''s sensuality produced his Catholicism and that his erotic theology was already assembled.'
  - id: gay-bourgeois-experience-v2#u18-c6
    heading: 'Patmore''s libidinal religion'
    span: 730150:731743
    why: 'Summarizes Patmore''s aphorisms on passion and divine desire and Gay''s judgment that this is not simple sublimation or displacement.'
- nn: 19
  unit_id: ch5-3-glandular-christianity-part-2
  note_id: gay-bourgeois-experience-v2-ch5-3-glandular-christianity-part-2
  span: 731745:769776
  chunks:
  - id: gay-bourgeois-experience-v2#u19-c1
    heading: 'Greg on Kingsley: frankness and its dangerous ally'
    span: 733247:734866
    why: 'A contemporary critic''s ideal of love as desire joined to affection, and his view of Kingsley as a risky champion of candor in an age of restraint.'
  - id: gay-bourgeois-experience-v2#u19-c2
    heading: 'The widow''s memorial as unwitting informant; muscular Christianity'
    span: 735953:738294
    why: 'States Gay''s method of reading censored public texts against private truth and sketches Kingsley''s sexualized theology of marriage and nature.'
  - id: gay-bourgeois-experience-v2#u19-c3
    heading: 'Struggle, reaction formation, and homosexual panic behind manliness'
    span: 744778:746426
    why: 'Gay''s psychoanalytic reading of Kingsley''s defenses: fear, pain and effeminacy anxieties beneath sanctified sensuality.'
  - id: gay-bourgeois-experience-v2#u19-c4
    heading: 'Fanny''s protest against the scourging'
    span: 747513:748898
    why: 'Shows Fanny''s own appetite and her theological pushback against eroticized asceticism.'
  - id: gay-bourgeois-experience-v2#u19-c5
    heading: 'Fanny''s step-by-step clearing of the way'
    span: 755101:755832
    why: 'Gay''s assessment of Fanny as less conflicted than Charles and as an agent constructing her own scriptural licence.'
  - id: gay-bourgeois-experience-v2#u19-c6
    heading: 'Healthy materialism and animal enjoyments as religious ceremonies'
    span: 759005:759376
    why: 'The sharpest statement of Kingsley''s doctrine, with Gay''s reading of its unconscious effect.'
  - id: gay-bourgeois-experience-v2#u19-c7
    heading: 'Displacement''s versatility: the religion of the sensual was sensuality'
    span: 768559:769774
    why: 'Gay''s closing generalization about religion as a refuge for sensuality across personal styles and denominations.'
- nn: 20
  unit_id: ch5-4-sexualizing-modernity
  note_id: gay-bourgeois-experience-v2-ch5-4-sexualizing-modernity
  span: 769776:812088
  chunks:
  - id: gay-bourgeois-experience-v2#u20-c1
    heading: 'Modernity as a target for love'
    span: 769802:770756
    why: 'States the chapter''s thesis that time-bound modern innovations are taken up by universal psychological mechanisms as erotic objects.'
  - id: gay-bourgeois-experience-v2#u20-c2
    heading: 'The store''s name and Mouret''s ''I have the woman'''
    span: 784319:784891
    why: 'Gay''s core reading of the department store as a rational commercial apparatus resting on sexual and aggressive drives.'
  - id: gay-bourgeois-experience-v2#u20-c3
    heading: 'Consumption as devouring appetite'
    span: 788787:789992
    why: 'Shows sexuality, aggression, competition and consumption fused into one vocabulary of appetite, with Mouret''s success experienced bodily.'
  - id: gay-bourgeois-experience-v2#u20-c4
    heading: 'Railway travel and Freud''s erotic symbolism'
    span: 797201:798179
    why: 'Supplies the psychoanalytic mechanism (infantile sensations of motion) that links the railroad to sexuality.'
  - id: gay-bourgeois-experience-v2#u20-c5
    heading: 'Why extremists illuminate ordinary minds'
    span: 808300:809226
    why: 'Gay''s methodological hedge and argument that extravagant writers reveal the concealed tensions of middle-class responses to the machine.'
  - id: gay-bourgeois-experience-v2#u20-c6
    heading: 'Erotic stratagems that enrich and police'
    span: 811605:812086
    why: 'Closes the chapter by naming the double function of these outlets, expanding and policing bourgeois sensual love without resolving its tensions.'
- nn: 21
  unit_id: ch6-1-modern-malady-love
  note_id: gay-bourgeois-experience-v2-ch6-1-modern-malady-love
  span: 812088:871253
  chunks:
  - id: gay-bourgeois-experience-v2#u21-c1
    heading: 'The chapter''s thesis: nervousness and prostitution as the price of repression'
    span: 812126:812856
    why: 'States the contemporary theory that bourgeois life extracted a psychological tribute, which the chapter then goes on to contest.'
  - id: gay-bourgeois-experience-v2#u21-c2
    heading: 'Women, feminists and anti-feminists on nervousness'
    span: 825859:827526
    why: 'Shows one diagnosis serving opposed camps in the politics of gender and Gay''s side in the dispute.'
  - id: gay-bourgeois-experience-v2#u21-c3
    heading: 'Beard''s list of the causes of modern nervousness'
    span: 852028:853164
    why: 'Gives the era''s own inventory of what modern civilization consisted of (steam, press, telegraph, clocks, speculation) and names repression of emotion as a cause.'
  - id: gay-bourgeois-experience-v2#u21-c4
    heading: 'Nervousness as the diagnosticians'' auto-intoxication'
    span: 859839:861598
    why: 'Gay''s methodological critique: no statistics, alternative readings of urban life, and the diagnosis as an expression of expert anxiety.'
  - id: gay-bourgeois-experience-v2#u21-c5
    heading: 'Freud: nervousness as the price of bourgeois sexual repression'
    span: 864435:867304
    why: 'Presents Freud''s three-stage account of sexual morality and the tender and sensual currents, and Gay''s summary of the thesis he is about to qualify.'
  - id: gay-bourgeois-experience-v2#u21-c6
    heading: 'Gay''s verdict on Freud''s theory of nervousness'
    span: 867843:871251
    why: 'Gay credits Freud''s originality but faults his uncritical acceptance of the premise and his generalizing from clinical casualties, revising the picture of bourgeois prudery.'
- nn: 22
  unit_id: ch6-2-hysteria-remorse-part-1
  note_id: gay-bourgeois-experience-v2-ch6-2-hysteria-remorse-part-1
  span: 871253:905105
  chunks:
  - id: gay-bourgeois-experience-v2#u22-c1
    heading: 'Estimates as reaction formation'
    span: 885122:886454
    why: 'Gay''s central psychoanalytic reading: inflated head-counts as fear plus buried wish, i.e. reaction formation.'
  - id: gay-bourgeois-experience-v2#u22-c2
    heading: 'Cynicism, fear and hysteria'
    span: 881630:883339
    why: 'Links the anti-vice campaigns to self-control and to fear of the proletariat and immorality, via the 1846 Berlin author.'
  - id: gay-bourgeois-experience-v2#u22-c3
    heading: 'The convention of the unspeakable'
    span: 891116:891499
    why: 'Gay''s formula for how Victorian writers on prostitution spoke while claiming they could not.'
  - id: gay-bourgeois-experience-v2#u22-c4
    heading: 'The safety valve and its critics'
    span: 896945:898900
    why: 'The Mandeville-style paradox that prostitution safeguards respectable homes, and Gay''s verdict on the price of repression.'
  - id: gay-bourgeois-experience-v2#u22-c5
    heading: 'Ill-assorted alliances in the licensing debate'
    span: 902288:903668
    why: 'Shows the licensing versus abolition controversy as a dispute over means, with the institutions (police, medicine, committees) involved.'
  - id: gay-bourgeois-experience-v2#u22-c6
    heading: 'Resignation as complacency'
    span: 878839:879791
    why: 'Documents the unreformed bourgeois attitude of fatalism, with Acton''s ''ineradicable''.'
- nn: 23
  unit_id: ch6-2-hysteria-remorse-part-2
  note_id: gay-bourgeois-experience-v2-ch6-2-hysteria-remorse-part-2
  span: 905105:937757
  chunks:
  - id: gay-bourgeois-experience-v2#u23-c1
    heading: 'The courtesan with a heart of gold'
    span: 913240:913871
    why: 'Shows how French fiction let bourgeois readers indulge and sentimentalize prostitution without critique.'
  - id: gay-bourgeois-experience-v2#u23-c2
    heading: 'What distinguished 1900 from 1840'
    span: 919792:920153
    why: 'States Gay''s thesis of the move from hysteria to remorse and reform.'
  - id: gay-bourgeois-experience-v2#u23-c3
    heading: 'Conservative intentions, subversive implications'
    span: 922130:923287
    why: 'Explains the vice commissions and their radical implicit logic about poverty and sex education.'
  - id: gay-bourgeois-experience-v2#u23-c4
    heading: 'The whore and the bourgeois superego'
    span: 925469:925926
    why: 'Gay''s psychoanalytic reading of why reform attention to prostitutes arose late.'
  - id: gay-bourgeois-experience-v2#u23-c5
    heading: 'Dickens and Urania Cottage'
    span: 931897:933107
    why: 'Concrete example of humane rehabilitation practice and its modest measurable results.'
  - id: gay-bourgeois-experience-v2#u23-c6
    heading: 'Rehabilitation and the erotic economy'
    span: 937423:937755
    why: 'Gay''s concluding judgment on the place of the rescue campaign in bourgeois erotic life.'
- nn: 24
  unit_id: ch6-2-hysteria-remorse-part-3
  note_id: gay-bourgeois-experience-v2-ch6-2-hysteria-remorse-part-3
  span: 937757:966014
  chunks:
  - id: gay-bourgeois-experience-v2#u24-c1
    heading: 'Rescue and reparation fantasies as defenses against guilt'
    span: 939115:940617
    why: 'Defines the rescue and reparation fantasy as a way of managing sexuality, aggression and guilt, enacted in the world or in the mind, and ties it to the fallen woman and childhood memory.'
  - id: gay-bourgeois-experience-v2#u24-c2
    heading: 'Childhood template and the acceptable place for sensuality'
    span: 940619:942796
    why: 'Gives the analytic account of the degrade-and-rescue fantasy, the angel in the house, and Gay''s claim that the crusade was not hypocrisy but a search for a sanctioned place for eros.'
  - id: gay-bourgeois-experience-v2#u24-c3
    heading: 'Jane Addams and the rescuers'' own need for action'
    span: 947394:948397
    why: 'Shows the rescue crusade as an outlet for educated bourgeois women denied other public action, a concrete link between social position and psychological motive.'
  - id: gay-bourgeois-experience-v2#u24-c4
    heading: 'How the world invades the mind'
    span: 950449:952066
    why: 'Gay''s causal account of why economic surplus, political assertiveness and women''s exclusion from work made the mid-century bourgeoisie especially able to institutionalize remorseful fantasies.'
  - id: gay-bourgeois-experience-v2#u24-c5
    heading: 'Gladstone''s balance sheet and impure labor'
    span: 954147:955282
    why: 'The central case study: Gladstone''s diary tally of reclaimed women and the revelation that his rescue work was entangled with erotic arousal and shame.'
  - id: gay-bourgeois-experience-v2#u24-c6
    heading: 'Prostitution as a sign of repression''s failure'
    span: 962577:963220
    why: 'States Gay''s verdict against the safety-valve theory and links prostitution to Freud''s split between tenderness and sensuality.'
- nn: 25
  unit_id: epilogue-1-between-condescension-envy
  note_id: gay-bourgeois-experience-v2-epilogue-1-between-condescension-envy
  span: 966014:1022088
  chunks:
  - id: gay-bourgeois-experience-v2#u25-c1
    heading: 'Projective tests between condescension and envy'
    span: 975239:976037
    why: 'States Gay''s thesis that bourgeois reports on lower-class love are cultural autobiography rather than neutral description.'
  - id: gay-bourgeois-experience-v2#u25-c2
    heading: 'Freud''s 1917 parable of the two little girls'
    span: 985258:987531
    why: 'Contrasts Freud''s fable with Michelet''s and gives Gay''s reading of neurosis as the price of bourgeois refinement.'
  - id: gay-bourgeois-experience-v2#u25-c3
    heading: 'Freud to his fiancee: we deprive ourselves to maintain integrity'
    span: 987533:988799
    why: 'Freud''s own account of the costs and rewards of bourgeois self-control, which Gay then reads as a self-portrait.'
  - id: gay-bourgeois-experience-v2#u25-c4
    heading: 'Three views of lower-class love as commentary on the middle class'
    span: 980663:981261
    why: 'Names the leading conflicting bourgeois views of the poor and their function as a mirror for the observers.'
  - id: gay-bourgeois-experience-v2#u25-c5
    heading: 'Employers as sexual educators: Kidd, Holek and Marie'
    span: 1005721:1007977
    why: 'Shows the power relations and exploitation shaping lower-class sexual experience, from working-class testimony.'
  - id: gay-bourgeois-experience-v2#u25-c6
    heading: 'Envy, pride and the ground tone of two kinds of love'
    span: 1020771:1022086
    why: 'Gay''s closing comparison of Holek and Kingsley love, naming envy as anxiety and resignation versus exuberance as the class-specific tone.'
- nn: 26
  unit_id: epilogue-2-lion-love-last-thoughts
  note_id: gay-bourgeois-experience-v2-epilogue-2-lion-love-last-thoughts
  span: 1022088:1046317
  chunks:
  - id: gay-bourgeois-experience-v2#u26-c1
    heading: 'The sculpture as a dream in plaster'
    span: 1029192:1030068
    why: 'States Gay''s interpretive program: the sculpture as an overdetermined wish that condenses the themes of the first two volumes.'
  - id: gay-bourgeois-experience-v2#u26-c2
    heading: 'The doctrine of distance'
    span: 1030070:1031056
    why: 'Explains how allegory licensed the nude and conveyed sensual knowledge while claiming elevated aims.'
  - id: gay-bourgeois-experience-v2#u26-c3
    heading: 'The fatal woman and the contours of liberal culture'
    span: 1033186:1034571
    why: 'Gay''s argument that the devouring-female motif shows liberal culture''s capacity to air and rethink its anxieties rather than a mere backlash against feminism.'
  - id: gay-bourgeois-experience-v2#u26-c4
    heading: 'Napheys''s definition and the bourgeois ideal'
    span: 1038225:1038609
    why: 'Ties the sculpture to the union of physical and moral love in marriage as the respectable ideal.'
  - id: gay-bourgeois-experience-v2#u26-c5
    heading: 'An earnest age and the need to read past surfaces'
    span: 1043359:1044704
    why: 'Links the private/public divide to the abundance of frankly erotic evidence and the method of interpretation it demands.'
  - id: gay-bourgeois-experience-v2#u26-c6
    heading: 'The emotional fortress and the smile of the lion'
    span: 1044706:1046316
    why: 'The volume''s concluding verdict: bourgeois defensiveness as tribute to passion, and marriage as an often successful resolution of conflicts.'
