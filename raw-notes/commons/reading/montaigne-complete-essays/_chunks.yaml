  - id: montaigne-complete-essays#u94-c4
    label: c4
    heading: Poetic progress by leaps and skips
    char_start: 2293247
    char_end: 2293880
    start_quote: I love a poetic progress, by leaps and skips
    end_quote: there will always be found some word or other in a corner that is to the purpose, though
