    end_quote: we go and enjoin them continency for their particular share, and upon the last and extreme
      penalties.
    why: 'States the contradiction at the core of the double standard: men credit women with greater appetite
      and then punish them for it.'
  - id: montaigne-complete-essays#u81-c3
    label: c3
    heading: Training for love and the word 'fouteau'
    char_start: 1967014
    char_end: 1968305
