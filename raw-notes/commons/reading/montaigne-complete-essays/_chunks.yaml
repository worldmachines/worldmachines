    end_quote: this pleases and heals at once.”
    why: Seneca's letter, adopted by Montaigne, turns counterfeit and real blindness into a statement
      about not seeing one's own vices and about philosophy as cure.
- nn: 65
  unit_id: b2-ch27-28-cowardice-mother-cruelty
  note_id: montaigne-complete-essays-b2-ch27-28-cowardice-mother-cruelty
  span: 1588337:1614782
  chunks:
  - id: montaigne-complete-essays#u65-c1
    label: c1
    heading: Cowardice as the mother of cruelty
    char_start: 1588385
    char_end: 1590135
    start_quote: I have often heard it said that cowardice is the mother of cruelty
    end_quote: What is this but cowardice?
    why: States the essay's thesis from experience and applies it to massacre and to the lethal quarrels
      of Montaigne's own day.
  - id: montaigne-complete-essays#u65-c2
    label: c2
    heading: Why killing defeats revenge
    char_start: 1591818
    char_end: 1592270
    start_quote: Killing is good to frustrate an offence to come, not to revenge one that is already past
    end_quote: but care of thyself, that thou gettest rid of him.
    why: Montaigne's analysis of what revenge actually seeks and why killing is an act of fear rather
      than courage.
  - id: montaigne-complete-essays#u65-c3
    label: c3
