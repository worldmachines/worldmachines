  - id: montaigne-complete-essays#u31-c7
    label: c7
    heading: Souls are adult at twenty; decline since thirty
    char_start: 732925
    char_end: 734080
    start_quote: For my part, I believe our souls are adult at twenty as much as they are
    end_quote: have rather decayed than improved, and retired rather than advanced.
