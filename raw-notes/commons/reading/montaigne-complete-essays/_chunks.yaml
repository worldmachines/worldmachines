  - id: montaigne-complete-essays#u37-c3
    label: c3
    heading: Money pays vice too; honour lives on rarity
    char_start: 844717
    char_end: 845405
    start_quote: For, in truth, other gifts have not so great a dignity of usage
    end_quote: from rarity; and so virtue itself
    why: Explains why money is a poor payment for virtue and states the thesis that honour's essence is
      rarity.
  - id: montaigne-complete-essays#u37-c4
    label: c4
    heading: The great tree in a forest of the same
    char_start: 845466
    char_end: 846066
    start_quote: We do not intend it for a commendation when we say that such a one is
    end_quote: whether we can ever call it great, being common.
    why: Montaigne's clearest statement that customary or universal virtue ceases to be rewarded or counted
      great, with the Spartan example.
  - id: montaigne-complete-essays#u37-c5
    label: c5
    heading: Valour as one ray of virtue, made common by custom
    char_start: 846553
    char_end: 847303
    start_quote: There is another virtue, true, perfect, and philosophical
    end_quote: we should again make our ancient military reputation flourish.
    why: Separates common valour from philosophical virtue, credits custom and education with spreading
      it, and refers to the civil wars and a possible Catholic-Huguenot union.
  - id: montaigne-complete-essays#u37-c6
    label: c6
    heading: Vaillance, valeur and the chastity of women
    char_start: 849432
    char_end: 850693
    start_quote: 'But this is worth considering: that our nation places valour'
    end_quote: to compound for that one of incontinence.
    why: Uses etymology to show how a society's dominant value narrows the meaning of virtue, paralleled
      by the reduction of a woman's virtue to chastity.
- nn: 38
  unit_id: b2-ch08-affection-fathers-children-1
  note_id: montaigne-complete-essays-b2-ch08-affection-fathers-children-1
  span: 850696:874506
  chunks:
  - id: montaigne-complete-essays#u38-c1
    label: c1
    heading: The book as melancholy self-portrait
    char_start: 851063
    char_end: 851442
    start_quote: ‘Tis a melancholic humour, and consequently a humour very much an enemy to my
    end_quote: I presented myself to myself for argument and subject.
    why: Montaigne's own account of why he began writing and that his subject is himself.
  - id: montaigne-complete-essays#u38-c2
    label: c2
    heading: Natural affection and Aristotle on benefactors
    char_start: 853791
    char_end: 855347
    start_quote: If there be any law truly natural, that is to say, any instinct that is
    end_quote: and giving is more chargeable than receiving.
    why: States the hedged claim about natural parental instinct and the Aristotelian reason why givers
      love more than receivers.
  - id: montaigne-complete-essays#u38-c3
    label: c3
    heading: Reason must govern the inclinations of nature
    char_start: 855349
    char_end: 856606
    start_quote: Since it has pleased God to endue us with some capacity of reason
    end_quote: rendering ourselves to reason, notwithstanding the inclination of nature.
    why: The essay's central principle that love should follow judgment, not instinct, with Montaigne's
      own disgust at doting on infants.
  - id: montaigne-complete-essays#u38-c4
    label: c4
    heading: Hoarding fathers make thieves
    char_start: 857507
    char_end: 860023
    start_quote: For my part, I think it cruelty and injustice not to receive them into
    end_quote: I fear this vice is, in some sort, to be attributed to the fore-mentioned vice of the fathers.
    why: Argues that fathers must share goods with capable children and gives anecdotes of habit hardening
      into theft.
  - id: montaigne-complete-essays#u38-c5
    label: c5
    heading: Against violence in educating the young
    char_start: 861508
    char_end: 862743
    start_quote: I condemn all violence in the education of a tender soul that is designed
    end_quote: to render boys more cowardly, or more wilfully obstinate.
    why: Montaigne's own pedagogy of gentleness and liberty, with his report of his upbringing and of
      Leonora.
  - id: montaigne-complete-essays#u38-c6
    label: c6
    heading: Better beloved than feared
    char_start: 871141
    char_end: 872419
    start_quote: I am angry at the custom of forbidding children to call their father by
    end_quote: command and fear are no longer his weapons.
    why: Argues that an ageing father's real authority is affection, not fear, against the custom of austere
      distance.
- nn: 39
  unit_id: b2-ch08-affection-fathers-children-2
  note_id: montaigne-complete-essays-b2-ch08-affection-fathers-children-2
  span: 874506:898723
  chunks:
  - id: montaigne-complete-essays#u39-c1
    label: c1
    heading: Montluc's regret at a stern fatherhood
    char_start: 878622
    char_end: 879876
    start_quote: The late Mareschal de Montluc having lost his son
    end_quote: nor felt other than a tyrannical manner of proceeding.
    why: 'The essay''s emotional centre: a father laments that paternal gravity hid his love from his
      son until it was too late.'
  - id: montaigne-complete-essays#u39-c2
    label: c2
    heading: Consolation of having kept no secret from a friend
    char_start: 879880
    char_end: 880481
    start_quote: I find this complaint to be rational and rightly apprehended
    end_quote: Can there be any joy equal to this privation?
    why: Montaigne's own self-report that full communication with the dead friend is his consolation,
      and his turn toward openness with family.
  - id: montaigne-complete-essays#u39-c3
    label: c3
    heading: 'Plato''s legislator: you and your goods belong to the public'
    char_start: 886707
    char_end: 887852
    start_quote: My friends, who are now, without question, very soon to die
    end_quote: have a care as to what you leave behind you.
    why: A reported Platonic argument against private testamentary will, in line with Montaigne's preference
      for custom and law over fancy.
  - id: montaigne-complete-essays#u39-c4
    label: c4
    heading: 'Natural affection formed by custom: nurses and goats'
    char_start: 889341
    char_end: 890150
    start_quote: it is easy by experience to be discerned that this natural affection
    end_quote: a greater solicitude for the preservation of those they have taken charge of, than of their
      own.
    why: Montaigne argues that parental affection is weakly rooted and made by habit, with the wet-nurse
      evidence.
  - id: montaigne-complete-essays#u39-c5
    label: c5
    heading: 'Children of the soul: books as offspring'
    char_start: 891346
    char_end: 897147
    start_quote: Now, to consider this simple reason for loving our children
    end_quote: If I am wiser than my book, it is richer than I.
    why: The unit's central claim that works of the mind are a man's more truly own children, including
      Montaigne's statement about his own book.
  - id: montaigne-complete-essays#u39-c6
    label: c6
    heading: 'Epicurus and Augustine: book or child'
    char_start: 895714
    char_end: 896605
    start_quote: Can we believe that Epicurus who, as he says himself
    end_quote: had he not rather chosen to bury his children.
    why: Posed as rhetorical questions, this makes the book-over-child preference concrete with two authorities.
- nn: 40
  unit_id: b2-ch09-arms-parthians
  note_id: montaigne-complete-essays-b2-ch09-arms-parthians
  span: 898723:905408
  chunks:
  - id: montaigne-complete-essays#u40-c1
    label: c1
    heading: The ill custom of arming too late
    char_start: 898765
    char_end: 899502
    start_quote: ‘Tis an ill custom and unmanly that the gentlemen of our time have got,
    end_quote: who cannot be from their masters, by reason they carry their arms.
    why: States the essay's opening complaint about how his contemporaries wear and carry arms, in Montaigne's
      own voice.
  - id: montaigne-complete-essays#u40-c2
    label: c2
    heading: Loaded rather than secured
    char_start: 900168
    char_end: 901220
    start_quote: For, in plain truth, to observe the weight and thickness
    end_quote: such as those the ancients loaded their elephants withal.
    why: Montaigne's own judgment that modern heavy armour defeats its purpose, with the Gaul and Lucullus
      exempla.
  - id: montaigne-complete-essays#u40-c3
    label: c3
    heading: Scipio on caltrops and the buckler
    char_start: 901222
    char_end: 901868
    start_quote: This humour is far differing from that of the younger Scipio,
    end_quote: ought to repose greater confidence in his right hand than in his left.
    why: Reported exemplum that trust in defences breeds slackness and that a soldier should rely on his
      own arm.
  - id: montaigne-complete-essays#u40-c4
    label: c4
    heading: Only unfamiliarity makes armour heavy
    char_start: 901871
    char_end: 903546
    start_quote: Now ‘tis nothing but the not being used to wear it that makes the weight
    end_quote: We should not march our people very far at that rate.
    why: The habit thesis and the contrast between Roman hardening and modern softness, the essay's core
      argument.
  - id: montaigne-complete-essays#u40-c5
    label: c5
    heading: Marcellinus on Parthian armour
    char_start: 903548
    char_end: 905156
    start_quote: As to what remains, Marcellinus,
    end_quote: with their barded horses.
    why: 'The titular passage: the Parthian jointed armour, reported from Marcellinus and compared by
      Montaigne to French men-at-arms.'
- nn: 41
  unit_id: b2-ch10-books
  note_id: montaigne-complete-essays-b2-ch10-books
  span: 905408:937886
  chunks:
  - id: montaigne-complete-essays#u41-c1
    label: c1
    heading: Method, not matter; borrowing weighed not counted
    char_start: 906458
    char_end: 906826
    start_quote: Therefore, let none lay stress upon the matter I write, but upon my method in writing
      it.
    end_quote: what, either for want of language or want of sense, I cannot myself so well express.
    why: Montaigne's own statement that the book is to be judged by method and by his choice of borrowings,
      with the invention always his.
  - id: montaigne-complete-essays#u41-c2
    label: c2
    heading: Reading to know himself and to live and die well
    char_start: 909485
    char_end: 909700
    start_quote: I seek, in the reading of books, only to please myself by an honest
    end_quote: of the knowledge of myself, and instructs me how to die and how to live well.
    why: States the purpose of his reading and study as pleasure and self-knowledge rather than learning.
  - id: montaigne-complete-essays#u41-c3
    label: c3
    heading: 'Against Cicero''s preparations: wisdom, not learning'
    char_start: 920993
    char_end: 922500
    start_quote: For me, who only desire to become more wise, not more learned or eloquent,
    end_quote: I eat the meat raw, so that, instead of whetting my appetite by these preparatives, they
      tire and pall it.
    why: Shows his preference for judgment and direct argument over scholastic apparatus, offered as a
      bold personal confession.
  - id: montaigne-complete-essays#u41-c4
    label: c4
    heading: Judging the man behind the writings
    char_start: 923549
    char_end: 924299
    start_quote: A man may indeed judge of their parts, but not of their manners nor of
    end_quote: than what he did in the public square and in the senate.
    why: Argues that writings reveal parts but not the person, so he prefers private conduct to public
      performance.
  - id: montaigne-complete-essays#u41-c5
    label: c5
    heading: Three kinds of historians
    char_start: 928813
    char_end: 931028
    start_quote: I love historians, whether of the simple sort, or of the higher order.
    end_quote: but deliver it to us pure and entire in all its dimensions.
    why: 'His fullest argument on what historians owe readers: transparency of sources and leaving the
      judgment to the reader.'
  - id: montaigne-complete-essays#u41-c6
    label: c6
    heading: Marginal notes against a failing memory
    char_start: 933183
    char_end: 933779
    start_quote: A little to aid the weakness of my memory (so
    end_quote: and I will here transcribe some of those annotations.
    why: Describes his practice of writing a dated verdict at the end of each book, a reading and writing
      process.
- nn: 42
  unit_id: b2-ch11-cruelty
  note_id: montaigne-complete-essays-b2-ch11-cruelty
  span: 937886:972864
  chunks:
  - id: montaigne-complete-essays#u42-c1
    label: c1
    heading: Virtue is more than good nature
    char_start: 937910
    char_end: 938997
    start_quote: I fancy virtue to be something else, and something more noble, than good
    end_quote: presupposes difficulty and contention, and cannot be exercised without an opponent.
    why: States the essay's opening thesis separating effortless goodness from struggling virtue, which
      the rest of the unit tests.
  - id: montaigne-complete-essays#u42-c2
    label: c2
    heading: Virtue turned into complexion
    char_start: 949042
    char_end: 949705
    start_quote: A man discerns in the soul of these two great men and their imitators
    end_quote: the force and vigour of their soul stifle and extinguish irregular desires, so soon as
      they begin to move.
    why: Resolves the Socrates and Cato problem by making the highest virtue a settled habit, a key statement
      about habit and character.
  - id: montaigne-complete-essays#u42-c3
    label: c3
    heading: My virtue is casual and accidental
    char_start: 953017
    char_end: 953659
    start_quote: My virtue is a virtue, or rather an innocence, casual and accidental.
    end_quote: I owe it rather to my fortune than my reason.
    why: Montaigne's frank self-assessment of his moral character, crediting fortune over reason.
  - id: montaigne-complete-essays#u42-c4
    label: c4
    heading: Cruelty the extreme of vices
    char_start: 958160
    char_end: 958474
    start_quote: Amongst other vices, I mortally hate cruelty, both by nature and judgment
    end_quote: though the chase be a violent pleasure.
    why: His direct declaration against cruelty, with the physical evidence of his own squeamishness.
  - id: montaigne-complete-essays#u42-c5
    label: c5
    heading: Cruelty in the civil wars
    char_start: 965403
    char_end: 966113
    start_quote: I live in a time wherein we abound in incredible examples of this vice,
    end_quote: the lamentable groans and cries of a man dying in anguish.
    why: Ties the essay's theme to the Wars of Religion and defines cruelty at its utmost as killing for
      spectacle.
  - id: montaigne-complete-essays#u42-c6
    label: c6
    heading: A duty of humanity to beasts and plants
    char_start: 971021
    char_end: 971372
    start_quote: But supposing all this were not true, there is nevertheless a certain
    end_quote: there is a certain commerce and mutual obligation betwixt them and us.
    why: Grounds a duty toward animals and plants independent of any claim of kinship between them and
      humans.
- nn: 43
  unit_id: b2-ch12-apology-raimond-sebond-1
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-1
  span: 972864:1001271
  chunks:
  - id: montaigne-complete-essays#u43-c1
    label: c1
    heading: Learning respected, not adored; the father and the learned guests
    char_start: 972907
    char_end: 974201
    start_quote: Learning is, indeed, a very great and a very material accomplishment;
    end_quote: For my part I love them well, but I do not adore them.
    why: Sets Montaigne's measured stance on learning and shows his father's uncritical reverence for
      scholars.
  - id: montaigne-complete-essays#u43-c2
    label: c2
    heading: 'Why the book was given: Luther and the cascade of doubt'
    char_start: 974841
    char_end: 975838
    start_quote: which was when the novel doctrines of Luther began to be in vogue
    end_quote: 'or the reverence of the ancient customs, as a tyrannical yoke:'
    why: Gives the stated occasion of Sebond's book and an account of how doubt in one article spreads
      to all belief and to custom.
  - id: montaigne-complete-essays#u43-c3
    label: c3
    heading: Religion as instrument of faction in the French civil wars
    char_start: 983981
    char_end: 985357
    start_quote: Justice, which is in one party, is only there for ornament and palliation
    end_quote: as fortune has shifted our places in these intestine storms.
    why: Montaigne's direct charge that both parties in the Wars of Religion bend faith to their passions.
  - id: montaigne-complete-essays#u43-c4
    label: c4
    heading: We receive our religion as we receive any other
    char_start: 989913
    char_end: 990635
    start_quote: All this is a most evident sign that we only receive our religion
    end_quote: We are Christians by the same title that we are Perigordians or Germans.
    why: Core statement that belief is shaped by place, custom, authority and fear, with its qualification
      that these are only human supports.
  - id: montaigne-complete-essays#u43-c5
    label: c5
    heading: Reason as formless matter, grace as form; Sebond defended
    char_start: 995794
    char_end: 996686
    start_quote: Now our prayers and human discourses are but as sterile and undigested
    end_quote: by which means he afterwards completes and perfects himself in the true belief.
    why: Compact account of how natural arguments relate to faith, which is the positive defence of Sebond
      in this slice.
  - id: montaigne-complete-essays#u43-c6
    label: c6
    heading: 'Programme: humble the pride of reason'
    char_start: 998339
    char_end: 998707
    start_quote: The means that I shall use, and that I think most proper to subdue this frenzy
    end_quote: bow down and bite the ground under the authority and reverence of the Divine Majesty.
    why: 'Announces the method of the whole Apology: answer Sebond''s critics by attacking human reason''s
      claims.'
- nn: 44
  unit_id: b2-ch12-apology-raimond-sebond-2
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-2
  span: 1001271:1030027
  chunks:
  - id: montaigne-complete-essays#u44-c1
    label: c1
    heading: Man alone, without his patent
    char_start: 1001271
    char_end: 1002284
    start_quote: Let us then, for once, consider a man alone, without foreign assistance,
    end_quote: much less to command the whole?
    why: States the Apology's experiment of stripping man of grace and challenges his claim to be master
      of a world made for him.
  - id: montaigne-complete-essays#u44-c2
    label: c2
    heading: Presumption and the cat
    char_start: 1006862
    char_end: 1008031
    start_quote: Presumption is our natural and original disease.
    end_quote: We mutually divert one another with our play.
    why: Names presumption as the root human disease and delivers the famous reversal of observer and
      observed with the cat.
  - id: montaigne-complete-essays#u44-c3
    label: c3
    heading: Swallows, spiders and animal judgment
    char_start: 1013016
    char_end: 1014404
    start_quote: The swallows that we see at the return of the spring,
    end_quote: why do we not conclude the same of them?
    why: Main argument from animal craft that beasts deliberate and reason as we do.
  - id: montaigne-complete-essays#u44-c4
    label: c4
    heading: Neither above nor below the rest
    char_start: 1022939
    char_end: 1025732
    start_quote: All this I have said to prove the resemblance there is in human things,
    end_quote: to be favoured of God and nature.
    why: Montaigne's own statement of the levelling thesis and of imagination as the dearly bought source
      of human misery.
  - id: montaigne-complete-essays#u44-c5
    label: c5
    heading: The fox on the ice
    char_start: 1025734
    char_end: 1026849
    start_quote: For instance, take the fox, the people of Thrace make use of
    end_quote: enterprizes we plot against them.
    why: Compact exemplum rendering animal inference as an explicit syllogism.
  - id: montaigne-complete-essays#u44-c6
    label: c6
    heading: Human servitude and who serves whom
    char_start: 1026851
    char_end: 1029246
    start_quote: And if we will make an advantage even of this, that it is in our power
    end_quote: in reality serves me.
    why: Turns the animal argument into a critique of human mastery, showing men enslaved to each other
      more abjectly than beasts to us.
- nn: 45
  unit_id: b2-ch12-apology-raimond-sebond-3
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-3
  span: 1030027:1058799
  chunks:
  - id: montaigne-complete-essays#u45-c1
    label: c1
    heading: The dog at the crossroads and Chrysippus
    char_start: 1032613
    char_end: 1033730
    start_quote: Chrysippus, though in other things as scornful a judge of the condition
    end_quote: as well as from Trapezuntius?
    why: A canonical exemplum of animal reasoning, with the reported concession of a philosopher hostile
      to animals, and Montaigne's jab at scholastic logic.
  - id: montaigne-complete-essays#u45-c2
    label: c2
    heading: The blind man's dog
    char_start: 1034416
    char_end: 1035212
    start_quote: But I observe this effect with the greatest admiration
    end_quote: Can all this be apprehended without ratiocination!
    why: Montaigne's own first-hand observation, the clearest case in the slice of judgment and service
      beyond training.
  - id: montaigne-complete-essays#u45-c3
    label: c3
    heading: 'We condemn what is strange: men from far countries and beasts'
    char_start: 1043075
    char_end: 1044432
    start_quote: We more admire and value things that are unusual and strange than those
    end_quote: what know we what to make of them!
    why: States the sceptical and relativist hinge that links animal judgment to the judgment of foreign
      peoples.
  - id: montaigne-complete-essays#u45-c4
    label: c4
    heading: Elephants at prayer, ants in negotiation
    char_start: 1044926
    char_end: 1046518
    start_quote: We may also say that the elephants have some
    end_quote: foolishly take upon us to pass our censure.
    why: Shows Montaigne's hedge that absence of observed signs does not prove absence, and attributes
      our blindness to our own defect.
  - id: montaigne-complete-essays#u45-c5
    label: c5
    heading: Natural, necessary and artificial desires
    char_start: 1053680
    char_end: 1054820
    start_quote: Desires are either natural and necessary, as to eat and drink
    end_quote: introduce new laws and customs of their own.
    why: The slice's account of artifice versus nature, with the strangers-in-the-city image for false
      opinion crowding out natural desire.
  - id: montaigne-complete-essays#u45-c6
    label: c6
    heading: War as testimony of weakness
    char_start: 1058176
    char_end: 1058599
    start_quote: As to what concerns war, which is the greatest and most magnificent of
    end_quote: coveted by beasts who have it not.
    why: Turns the animal comparison against the human pride in war, the greatest of our activities.
- nn: 46
  unit_id: b2-ch12-apology-raimond-sebond-4
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-4
  span: 1058799:1087722
  chunks:
  - id: montaigne-complete-essays#u46-c1
    label: c1
    heading: Emperors and cobblers, gnat and elephant
    char_start: 1064457
    char_end: 1065122
    start_quote: The souls of emperors and cobblers are cast in the same mould
    end_quote: In a gnat and an elephant the passion is the same.
    why: Montaigne's levelling thesis that princes' great actions spring from the same petty motives as
      ours.
  - id: montaigne-complete-essays#u46-c2
    label: c2
    heading: The furious monster is an ant-hill
    char_start: 1062591
    char_end: 1063270
    start_quote: this furious monster, with so many heads and arms, is yet man--feeble,
    end_quote: are routed and crushed to pieces
    why: Vivid image of armies as fragile, undone by a sunbeam or a little dust.
  - id: montaigne-complete-essays#u46-c3
    label: c3
    heading: Faithful dogs, treacherous man
    char_start: 1065124
    char_end: 1066990
    start_quote: As to fidelity, there is no animal in the world so treacherous as man.
    end_quote: that it happened in the age wherein he lived.
    why: Opens the animal-virtue catalogue with a barbed human comparison and a Plutarchan source claim.
  - id: montaigne-complete-essays#u46-c4
    label: c4
    heading: The halcyon's nest and the vanity of contempt
    char_start: 1078888
    char_end: 1079220
    start_quote: This is a very dear description of this building
    end_quote: effects that we can neither imitate nor comprehend?
    why: A sceptical argument that we cannot despise animal art we neither understand nor can reproduce.
  - id: montaigne-complete-essays#u46-c5
    label: c5
    heading: Dreaming beasts conceive without bodies
    char_start: 1079222
    char_end: 1080417
    start_quote: To pursue a little further this equality and correspondence betwixt us
    end_quote: an army without arms and without body
    why: Denies that abstract imagination is man's soul-privilege by pointing to dreaming horses and hounds.
  - id: montaigne-complete-essays#u46-c6
    label: c6
    heading: Beauty is custom, and man is not privileged
    char_start: 1082488
    char_end: 1084725
    start_quote: ‘Tis likely we do not well know what beauty is in nature and in general
    end_quote: nature has no more privileged us in this from her common laws than in the rest
    why: Cultural relativism about beauty, leading to the claim that man has no natural superiority in
      form.
- nn: 47
  unit_id: b2-ch12-apology-raimond-sebond-5
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-5
  span: 1087722:1115789
  chunks:
  - id: montaigne-complete-essays#u47-c1
    label: c1
    heading: The goods we leave the beasts
    char_start: 1089104
    char_end: 1091484
    start_quote: We attribute to ourselves imaginary and fantastic good, future and absent
    end_quote: and separate ourselves from their society and condition.
    why: 'States the beasts'' ledger: we claim illusory goods (reason, knowledge, honour) and leave animals
      the real ones, so our superiority rests on pride and opinion.'
  - id: montaigne-complete-essays#u47-c2
    label: c2
    heading: Artisans wiser than rectors; against private judgment
    char_start: 1094714
    char_end: 1096414
    start_quote: I have known in my time a hundred artisans, a hundred labourers, wiser
    end_quote: enjoin us to eat one another.
    why: Montaigne's own judgment on the limited value of learning and his warning that unrestrained private
      reason forges monstrous duties.
  - id: montaigne-complete-essays#u47-c3
    label: c3
    heading: Obedience first, knowledge the first temptation
    char_start: 1096416
    char_end: 1097564
    start_quote: The first law that ever God gave to man was a law of pure obedience
    end_quote: after the tradition of men, and the rudiments of the world.”
    why: 'The fideist hinge of the passage: self-opinion as origin of sin and ignorance as proper to faith,
      with Scripture as the cited authority.'
  - id: montaigne-complete-essays#u47-c4
    label: c4
    heading: The stone in his soul
    char_start: 1104486
    char_end: 1104966
    start_quote: Compare the life of a man subjected to such imaginations,
    end_quote: he must anticipate it by fancy, and run to meet it.
    why: Compact image of knowledge and imagination producing suffering before the evil arrives, versus
      the labourer who suffers only when really ill.
  - id: montaigne-complete-essays#u47-c5
    label: c5
    heading: Brazilians, simplicity and the muleteer
    char_start: 1105851
    char_end: 1106294
    start_quote: That which is told us of those of Brazil, that they never die
    end_quote: without letters, without law, without king, or any manner of religion.
    why: Montaigne's early primitivist-health claim about a reported people, in his own explanation of
      their longevity as tranquillity of soul.
  - id: montaigne-complete-essays#u47-c6
    label: c6
    heading: Folly is made of subtle wisdom
    char_start: 1106705
    char_end: 1107188
    start_quote: What puts the soul beside itself, and more usually throws it into madness
    end_quote: but half a turn of the toe from the one to the other.
    why: States the thesis that madness and vigorous wisdom are adjacent, the basis for the Ferrara poet
      example that follows.
  - id: montaigne-complete-essays#u47-c7
    label: c7
    heading: Well-being is the absence of ill, but not insensibility
    char_start: 1109835
    char_end: 1111801
    start_quote: Our well-being is nothing but the not being ill.
    end_quote: Neither is pain always to be avoided, nor pleasure always pursued.
    why: The hedge that keeps the praise of ignorance from becoming a praise of stupor, citing Crantor
      against Epicurus.
- nn: 48
  unit_id: b2-ch12-apology-raimond-sebond-6
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-6
  span: 1115789:1145257
  chunks:
  - id: montaigne-complete-essays#u48-c1
    label: c1
    heading: New World peoples, lawyers, and the companions of innocence
    char_start: 1121073
    char_end: 1122817
    start_quote: Such as return from the new world discovered by the Spaniards
    end_quote: require an empty and docile soul, and little presuming upon itself.
    why: Montaigne sets reported New World societies without law against lawyer-ridden Europe and links
      learning to malice and simplicity to innocence.
  - id: montaigne-complete-essays#u48-c2
    label: c2
    heading: Socrates and the doctrine of ignorance
    char_start: 1123624
    char_end: 1124620
    start_quote: After that Socrates was told that the god of wisdom had assigned to him
    end_quote: Man is a thing of nothing.
    why: The Socratic discovery that wisdom is not thinking oneself wise anchors the Apology's treatment
      of human self-regard.
  - id: montaigne-complete-essays#u48-c3
    label: c3
    heading: All that long inquiry taught was our weakness
    char_start: 1128545
    char_end: 1129984
    start_quote: Finally, should I examine whether it be in the power of man
    end_quote: I rather open than discover things.”
    why: Montaigne's summary verdict on the history of philosophy, with the corn-ear image and the Pherecydes
      letter.
  - id: montaigne-complete-essays#u48-c4
    label: c4
    heading: Three kinds of philosophy and the Pyrrhonian reply to the Academics
    char_start: 1132869
    char_end: 1136084
    start_quote: Whoever goes in search of any thing must come to this,
    end_quote: to engender doubt and suspense of judgment, which is their end.
    why: It maps dogmatists, Academics and Pyrrhonians and gives the Pyrrhonian claim that the denial
      of knowledge is itself a knowledge-claim.
  - id: montaigne-complete-essays#u48-c5
    label: c5
    heading: The sceptic lives by laws, customs and appearances
    char_start: 1141255
    char_end: 1143392
    start_quote: As to what concerns the actions of life, they are in this of the
    end_quote: carrying on the offices of his life with great liberty and convenience.
    why: 'It answers the charge that scepticism makes life impossible: the sceptic follows custom, nature
      and probable appearances without claiming knowledge.'
  - id: montaigne-complete-essays#u48-c6
    label: c6
    heading: The sceptic as blank paper for faith
    char_start: 1143929
    char_end: 1144858
    start_quote: How much more docile and easy to be governed, both by the laws of
    end_quote: as he shall please to write upon it.
    why: It states the fideist payoff of the argument, with the emptied, docile mind as the best preparation
      for religion and civil order.
- nn: 49
  unit_id: b2-ch12-apology-raimond-sebond-7
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-7
  span: 1145257:1173621
  chunks:
  - id: montaigne-complete-essays#u49-c1
    label: c1
    heading: Difficulty is a coin the learned use
    char_start: 1149279
    char_end: 1149433
    start_quote: Difficulty is a coin the learned make use
    end_quote: human sottishness easily takes for current pay.
    why: Montaigne's own image of philosophical obscurity as a juggler's trick that hides the vanity of
      the art.
  - id: montaigne-complete-essays#u49-c2
    label: c2
    heading: Socrates as midwife
    char_start: 1151933
    char_end: 1152519
    start_quote: Socrates said that midwives, in taking upon them the trade of helping
    end_quote: exercising and employing his understanding in the perils and fortunes of others.
    why: Presents Socratic philosophy as assisting others to bring forth rather than asserting doctrine.
  - id: montaigne-complete-essays#u49-c3
    label: c3
    heading: Democritus and the honeyed figs
    char_start: 1155337
    char_end: 1156148
    start_quote: Democritus having eaten figs at his table that tasted of honey
    end_quote: some true reason for a false and imaginary effect.
    why: Vivid exemplum of the passion for inquiry that persists without hope of an answer.
  - id: montaigne-complete-essays#u49-c4
    label: c4
    heading: Plato, deception and the civil law
    char_start: 1159332
    char_end: 1160260
    start_quote: Plato treats of this mystery with a raillery manifest enough
    end_quote: “That it is often necessary, for the benefit of men, to deceive them.”
    why: Shows philosophers shaping public belief for utility, and links doctrine to the demands of custom
      and law.
  - id: montaigne-complete-essays#u49-c5
    label: c5
    heading: Contrary opinions instruct and humble
    char_start: 1170875
    char_end: 1171371
    start_quote: Trust to your philosophy, my masters; and brag that you have found
    end_quote: seems to me a choice of very little privilege.
    why: Montaigne's first-person reaction to the catalogue of divine opinions, and a statement of his
      attitude to conflicting beliefs.
  - id: montaigne-complete-essays#u49-c6
    label: c6
    heading: Gods made in human likeness
    char_start: 1171761
    char_end: 1172381
    start_quote: I would much rather have gone along with those who adored the serpent
    end_quote: marvellous inebriety of the human understanding
    why: Pointed critique of anthropomorphic theology, arguing the unknown suits divinity better than
      projections of our condition.
- nn: 50
  unit_id: b2-ch12-apology-raimond-sebond-8
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-8
  span: 1173621:1202215
  chunks:
  - id: montaigne-complete-essays#u50-c1
    label: c1
    heading: Divine justice, Epicurus's objection, and reason's labyrinth
    char_start: 1180624
    char_end: 1182024
    start_quote: Moreover, upon what foundation of their justice can the gods take notice
    end_quote: she enters into a labyrinth of a thousand several paths.
    why: States the Apology's central claim that reason errs most when she meddles with divine things,
      even when guided by revelation.
  - id: montaigne-complete-essays#u50-c2
    label: c2
    heading: Antiquity made its gods in man's image
    char_start: 1182495
    char_end: 1183684
    start_quote: Antiquity, I believe, thought to put a compliment upon, and to add something to, the
      divine
    end_quote: I believe there is no nation under the sun that has not done the same
    why: Montaigne's diagnosis of anthropomorphic religion and its link to sacrificial cruelty across
      nations.
  - id: montaigne-complete-essays#u50-c3
    label: c3
    heading: Municipal law and the plurality of worlds
    char_start: 1191254
    char_end: 1192475
    start_quote: ‘Tis a municipal law that thou allegest, thou knowest not what is
    end_quote: persuades thee that there is a plurality of worlds
    why: Argues that human rules of nature are local, and that God is not bound by them, opening the many-worlds
      argument.
  - id: montaigne-complete-essays#u50-c4
    label: c4
    heading: '''According to nature'' means ''according to our understanding'''
    char_start: 1195946
    char_end: 1196589
    start_quote: Moreover, how many things are there in our own knowledge that oppose
    end_quote: all beyond that is, forsooth, monstrous and irregular.
    why: A compact statement of the relativity of the concept of nature and the miraculous to the observer's
      ignorance.
  - id: montaigne-complete-essays#u50-c5
    label: c5
    heading: Grammatical disputes, the liar, and the Pyrrhonist's language
    char_start: 1198841
    char_end: 1200734
    start_quote: Our speaking has its failings and defects, as well as all the rest.
    end_quote: as I bear it with the emblem of a balance.
    why: Shows language and logic failing, and ties Pyrrhonist doubt to Montaigne's own 'What do I know?'
      and its balance emblem.
  - id: montaigne-complete-essays#u50-c6
    label: c6
    heading: Against limiting God by the laws of men's mouths
    char_start: 1198472
    char_end: 1201866
    start_quote: This way of speaking in a Christian man has ever seemed to me very
    end_quote: reduce God to their own measure
    why: Montaigne's own fideist rebuke of 'God cannot...' formulas and the scoffer's use of them.
- nn: 51
  unit_id: b2-ch12-apology-raimond-sebond-9
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-9
  span: 1202215:1229070
  chunks:
  - id: montaigne-complete-essays#u51-c1
    label: c1
    heading: Honouring what we have made
    char_start: 1206833
    char_end: 1207430
    start_quote: ‘Tis far from honouring him who made us, to honour
    end_quote: he cannot make a worm, and yet he will be making gods by dozens.
    why: Montaigne's compressed statement that deification is human invention, with the Agesilaus anecdote
      as proof.
  - id: montaigne-complete-essays#u51-c2
    label: c2
    heading: Xenophanes and the goose
    char_start: 1213990
    char_end: 1215017
    start_quote: Therefore it was that Xenophanes pleasantly said
    end_quote: “So flattering and wheedling a bawd is nature to herself.”
    why: The clearest image of how every kind of creature reads the universe as made for itself, undermining
      human claims about divine nature.
  - id: montaigne-complete-essays#u51-c3
    label: c3
    heading: Scævola and Varro on useful falsehood
    char_start: 1219272
    char_end: 1219721
    start_quote: And this is the excuse that, upon consideration of this subject,
    end_quote: ‘tis fit he should be deceived.”
    why: States reported ancient authority for the view that peoples need false beliefs, a pointed pairing
      with the surrounding mockery of invented gods.
  - id: montaigne-complete-essays#u51-c4
    label: c4
    heading: Coachmakers in the heavens
    char_start: 1222769
    char_end: 1223986
    start_quote: You would say that we had had coachmakers, carpenters, and painters,
    end_quote: than my own ignorance.
    why: Montaigne's own verdict that cosmological mechanisms are dreams, and his wish that nature would
      reveal herself, ending in the ignorance-of-ignorance confession.
  - id: montaigne-complete-essays#u51-c5
    label: c5
    heading: Philosophy as sophisticated poetry
    char_start: 1224542
    char_end: 1226098
    start_quote: And certainly philosophy is no other than sophisticated poetry.
    end_quote: is the most likely to be true of any thing I could say.”
    why: The core claim that theories (epicycles included) are admitted inventions presented as current
      pay, with Plato conceding only likelihood.
  - id: montaigne-complete-essays#u51-c6
    label: c6
    heading: Thales and the Milesian girl
    char_start: 1227922
    char_end: 1229068
    start_quote: I am very well pleased with the Milesian girl, who observing the
    end_quote: whether beasts or men.”
    why: Closes the slice by turning the sceptical gaze from heaven to what we hold in hand, our neighbours
      and ourselves.
- nn: 52
  unit_id: b2-ch12-apology-raimond-sebond-10
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-10
  span: 1229070:1259029
  chunks:
  - id: montaigne-complete-essays#u52-c1
    label: c1
    heading: Opinions received on trust; Aristotle as the god of the schools
    char_start: 1231633
    char_end: 1233708
    start_quote: The reason that men doubt of divers things is that they never examine common impressions;
    end_quote: his authority is the non-ultra, beyond which it is not permitted to inquire.
    why: States that doubt stops at the branches, that authority replaces inquiry, and that Aristotle's
      doctrine is no better grounded than the rival schools.
  - id: montaigne-complete-essays#u52-c2
    label: c2
    heading: Every science rests on a presupposition
    char_start: 1233710
    char_end: 1235867
    start_quote: It is very easy, upon approved foundations, to build whatever we please;
    end_quote: is a certain testimony of folly and extreme incertainty;
    why: Compact argument that systems are built from granted principles, that all presuppositions deserve
      weighing, and that certainty signals folly.
  - id: montaigne-complete-essays#u52-c3
    label: c3
    heading: Philosophers made reason a judge; cannibals and animals without it
    char_start: 1236712
    char_end: 1238054
    start_quote: ‘tis from them we have learned to make ourselves judges of the world;
    end_quote: ‘tis a test full of falsity, error, weakness, and defect.
    why: Turns the demand for reasons on the philosophers, setting the cannibals and animals beside the
      schools and calling reason a faulty test.
  - id: montaigne-complete-essays#u52-c4
    label: c4
    heading: The extremities of inquiry are marshes
    char_start: 1244426
    char_end: 1244994
    start_quote: The extremities of our perquisition do all fall into astonishment
    end_quote: The beginning and end of knowledge are equally foolish;
    why: Image of the map's edge for the limits of knowledge, and the claim that the loftiest subjects
      breed the most childish ravings.
  - id: montaigne-complete-essays#u52-c5
    label: c5
    heading: Philosophy has every face; the accidental philosopher
    char_start: 1249441
    char_end: 1250623
    start_quote: I say the same of Philosophy; she has so many faces
    end_quote: a new figure--an unpremeditated and accidental philosopher.
    why: Montaigne applies the point about philosophical variety to his own self-portrait, which he found
      matched ancient opinions without design.
  - id: montaigne-complete-essays#u52-c6
    label: c6
    heading: Irresolution as tacit confession of ignorance
    char_start: 1247614
    char_end: 1248916
    start_quote: For my part, I am apt to believe that they have treated of knowledge
    end_quote: under the appearance of a troubled and inconstant science.
    why: Gives his reading of why the philosophers disagree, that their variety quietly admits the weakness
      of human reason.
- nn: 53
  unit_id: b2-ch12-apology-raimond-sebond-11
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-11
  span: 1259029:1288981
  chunks:
  - id: montaigne-complete-essays#u53-c1
    label: c1
    heading: Philosophy has no armour against a madman's soul
    char_start: 1261472
    char_end: 1262233
    start_quote: Now, as to this particular, philosophy has sufficiently armed man
    end_quote: may stupefy the understanding and turn the brain.
    why: States Montaigne's own point that philosophy's remedies presuppose a sound mind and fail where
      the soul itself is overturned.
  - id: montaigne-complete-essays#u53-c2
    label: c2
    heading: Immortality, human reason and Babel
    char_start: 1265191
    char_end: 1269585
    start_quote: The sight of our judgment is, to truth, the same that the owl’s eyes
    end_quote: an exercise of humility or a quelling of presumption.”
    why: 'Core fideist argument: immortality''s defenders are wishers not teachers, and diversity of opinion
      is divine chastisement of pride.'
  - id: montaigne-complete-essays#u53-c3
    label: c3
    heading: Man knows neither his soul nor his body
    char_start: 1279468
    char_end: 1280596
    start_quote: Here is enough to verify that man is no better instructed in the
    end_quote: all other knowledge is impossible.
    why: 'Concludes the case against reason: self-ignorance means man cannot be the measure of anything.'
  - id: montaigne-complete-essays#u53-c4
    label: c4
    heading: Wit is a dangerous weapon that needs a bridle
    char_start: 1283221
    char_end: 1284784
    start_quote: Our wit is a wandering, dangerous, and temerarious utensil
    end_quote: tracks which custom and the laws have laid before him.
    why: Montaigne's argument for limiting human wit by laws and custom, with his observation that few
      minds can be trusted to judge for themselves.
  - id: montaigne-complete-essays#u53-c5
    label: c5
    heading: Knowledge as current coin
    char_start: 1285307
    char_end: 1287198
    start_quote: The liberty, then, and frolic forwardness of these ancient wits
    end_quote: pass with reputation and esteem in all companies.
    why: Shows received knowledge circulating by civil authority and common estimate rather than assay,
      with palmistry and alchemy passing as sound.
  - id: montaigne-complete-essays#u53-c6
    label: c6
    heading: Working the wax for those who follow
    char_start: 1287200
    char_end: 1288979
    start_quote: Theophrastus said that human knowledge, guided by the senses
    end_quote: my own incapacity as little; for ‘tis nothing but my own.
    why: Montaigne's constructive turn, rejecting despair and describing inquiry as cumulative handling
      that makes the matter more supple for successors.
- nn: 54
  unit_id: b2-ch12-apology-raimond-sebond-12
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-12
  span: 1288981:1318681
  chunks:
  - id: montaigne-complete-essays#u54-c1
    label: c1
    heading: We may know truth only by chance
    char_start: 1289588
    char_end: 1290447
    start_quote: Now ‘tis very likely that, if the soul knew any thing, it would in the first place
    end_quote: nor wherewithal to choose the truth from falsehood.
    why: Compact statement that errors and truths enter the soul by the same channel, so it cannot tell
      them apart.
  - id: montaigne-complete-essays#u54-c2
    label: c2
    heading: Always certain, always deceived
    char_start: 1294918
    char_end: 1296212
    start_quote: How variously do we judge of things?--How often
    end_quote: for this we must abandon goods, honour, life, health, and all.
    why: Montaigne's first-person account of how the present opinion always feels infallible however often
      past ones failed.
  - id: montaigne-complete-essays#u54-c3
    label: c3
    heading: I, that watch myself
    char_start: 1301366
    char_end: 1303208
    start_quote: I, that watch myself as narrowly as I can, and that have my eyes
    end_quote: my judgment does not always advance--it floats and roams:--
    why: Self-portrait of mood, reading and revision that grounds his scepticism in self-observation.
  - id: montaigne-complete-essays#u54-c4
    label: c4
    heading: Fury, sleep and the worst place in ourselves
    char_start: 1308055
    char_end: 1309507
    start_quote: Is it not a great boldness in philosophy to believe that men perform the
    end_quote: a voice not to be trusted and believed?
    why: Satirical reductio of philosophy's praise of passion and madness as routes to the divine.
  - id: montaigne-complete-essays#u54-c5
    label: c5
    heading: Constancy born of volubility
    char_start: 1311793
    char_end: 1312272
    start_quote: Now, from the knowledge of this volubility of mine, I have accidentally
    end_quote: I could not otherwise keep myself from perpetual rolling.
    why: Shows how self-knowledge of instability yields conservatism and adherence to inherited faith.
  - id: montaigne-complete-essays#u54-c6
    label: c6
    heading: Distrust new doctrines
    char_start: 1314162
    char_end: 1314464
    start_quote: So that when any new doctrine presents itself to us, we have great
    end_quote: may start up which may damn the second.
    why: States the rule that novelty should be mistrusted because every received doctrine displaced an
      earlier one.
  - id: montaigne-complete-essays#u54-c7
    label: c7
    heading: Ptolemy and the new world
    char_start: 1317593
    char_end: 1318679
    start_quote: Ptolemy, who was a great man, had established the bounds
    end_quote: is not quite another thing than what we imagine.
    why: 'Closing exemplum: the discovery of a new half of the world shows that confident cosmography
      was mistaken.'
- nn: 55
  unit_id: b2-ch12-apology-raimond-sebond-13
  note_id: montaigne-complete-essays-b2-ch12-apology-raimond-sebond-13
  span: 1318681:1345719
  chunks:
  - id: montaigne-complete-essays#u55-c1
    label: c1
    heading: Strange concurrences between New World and Old World beliefs
    char_start: 1321489
    char_end: 1321871
    start_quote: In earnest, considering what is come to our knowledge from the course
    end_quote: The human mind is a great worker of miracles!
    why: States Montaigne's wonder at the cross-cultural concurrence of savage opinions that cannot come
      from natural meditation, the hinge of the New World material in this slice.
  - id: montaigne-complete-essays#u55-c2
    label: c2
    heading: Opinions have seasons like cabbages; climate shapes the soul
    char_start: 1326963
    char_end: 1329564
    start_quote: If nature enclose within the bounds of her ordinary progress the
    end_quote: that in this very age of ours she is not so?
    why: Argues that beliefs and even faculties of the soul depend on air, soil and age, undermining any
      claim of permanent authority for human opinion.
  - id: montaigne-complete-essays#u55-c3
    label: c3
    heading: 'We cannot know what to wish for: Midas and the prayer to God'
    char_start: 1329566
    char_end: 1331235
    start_quote: Methinks that amongst other testimonies of our imbecility, this ought
    end_quote: was fain to unpray his prayers.
    why: 'Shows the sceptical argument turning into fideist deference: even desire is unreliable, so choice
      should be left to providence.'
  - id: montaigne-complete-essays#u55-c4
    label: c4
    heading: Laws as accidental; a virtue a river can make a crime
    char_start: 1336176
    char_end: 1339066
    start_quote: As to what remains, if it be from ourselves that we are to extract the
    end_quote: make a lie to all the world beyond them?
    why: Montaigne's central statement that custom-derived law gives duty no rule but the accidental,
      paired with his pious reassertion of revelation.
  - id: montaigne-complete-essays#u55-c5
    label: c5
    heading: The natural laws that no nation universally accepts
    char_start: 1339068
    char_end: 1341464
    start_quote: But they are pleasant, when, to give some certainty to the laws, they
    end_quote: is not allowed by the custom of some nation or other.
