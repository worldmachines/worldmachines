    char_start: 2463034
    char_end: 2463280
    start_quote: There is more ado to interpret interpretations than to interpret things,
    end_quote: of authors there is great scarcity.
    why: Compact critique of commentary culture and learned authority that Montaigne turns on the book-making
      tradition itself.
  - id: montaigne-complete-essays#u101-c4
    label: c4
    heading: Men hanged by the forms of justice
    char_start: 2467564
    char_end: 2468977
    start_quote: 'This happened in my time: certain men were condemned to die'
    end_quote: How many condemnations have I seen more criminal than the crimes themselves?
    why: A concrete anecdote of procedural justice defeating truth, contrasted with Philip's compensation
      of a wrongly fined man.
  - id: montaigne-complete-essays#u101-c5
    label: c5
    heading: Laws obeyed because they are laws; the turn to oneself
    char_start: 2472077
    char_end: 2473216
    start_quote: Now, the laws keep up their credit, not for being just, but because they are laws;
    end_quote: and, doubtless, sufficient to instruct us in that whereof we have need.
    why: Gives the 'mystic foundation of authority' thesis and the pivot from foreign examples to one's
      own experience.
  - id: montaigne-complete-essays#u101-c6
    label: c6
    heading: Learning wisdom from one's own errors
    char_start: 2475126
    char_end: 2476854
    start_quote: I had rather understand myself well in myself, than in Cicero.
    end_quote: a much more ample, and important instruction.
    why: Montaigne's clearest statement of self-study as practical wisdom, generalising from single errors
      to distrust of his own understanding.
- nn: 102
  unit_id: b3-ch13-experience-2
  note_id: montaigne-complete-essays-b3-ch13-experience-2
  span: 2478267:2505404
  chunks:
  - id: montaigne-complete-essays#u102-c1
    label: c1
    heading: The depth of self-knowledge and the enemy of truth
    char_start: 2479334
    char_end: 2479828
    start_quote: I, who profess nothing else, therein find so infinite a depth and variety
    end_quote: the capital enemy of discipline and truth.
    why: Montaigne's own statement that self-study produces modesty and ignorance rather than certainty,
      and that dogmatic assertion is the enemy of truth.
  - id: montaigne-complete-essays#u102-c2
    label: c2
    heading: Opinions by disjointed articles
    char_start: 2482678
    char_end: 2482975
    start_quote: I, who see no further into things than as use informs me, present mine generally without
      rule and experimentally
    end_quote: relation and conformity are not to be found in such low and common souls as ours.
    why: A direct statement of the essayist's unsystematic method and its self-effacing justification.
  - id: montaigne-complete-essays#u102-c3
    label: c3
    heading: The register of the essays of my own life
    char_start: 2488399
    char_end: 2488757
    start_quote: In fine, all this hodge-podge which I scribble here, is nothing but a
    end_quote: who present it pure, and no way corrupted and changed by art or opinion.
    why: Montaigne's self-description of the book as a register of his own life, and the claim to special
      authority on bodily health.
  - id: montaigne-complete-essays#u102-c4
    label: c4
    heading: Custom as the potion of Circe
    char_start: 2491180
    char_end: 2491972
    start_quote: My form of life is the same in sickness as in health
    end_quote: that varies our nature as she best pleases.
    why: States the core claim about custom's power over the body and sets up the cross-national comparisons
      that follow.
  - id: montaigne-complete-essays#u102-c5
    label: c5
    heading: Against print and scholastic examples
    char_start: 2494137
    char_end: 2494902
    start_quote: What should we do with those people who admit of no evidence that is not
    end_quote: that for being older it is none the wiser.
    why: Montaigne's critique of deference to print and age, and his preference for observation of one's
      own surroundings.
  - id: montaigne-complete-essays#u102-c6
    label: c6
    heading: Custom moulds us, and change is its best lesson
    char_start: 2498940
    char_end: 2499229
    start_quote: These are the effects of custom; she can mould us, not only into what form she pleases
    end_quote: the most noble and most useful instruction of all she teaches us.
    why: Turns the argument about custom into a positive ideal of flexibility, drawn from the example
      of the beggar and his own temperament.
- nn: 103
  unit_id: b3-ch13-experience-3
  note_id: montaigne-complete-essays-b3-ch13-experience-3
  span: 2505404:2531939
  chunks:
  - id: montaigne-complete-essays#u103-c1
    label: c1
    heading: Do not hasten the course of illness
    char_start: 2512247
    char_end: 2514314
    start_quote: Experience has, moreover, taught me this, that we ruin ourselves by impatience.
    end_quote: 'to endure: endure, suffer, and say nothing.'
    why: States Montaigne's policy of giving diseases free passage and letting nature proceed, with the
      Crantor and Mexican exempla for accepting the condition of mortals.
  - id: montaigne-complete-essays#u103-c2
    label: c2
    heading: Life as a mixture of contrary tones
    char_start: 2515559
    char_end: 2516081
    start_quote: We must learn to suffer what we cannot evade; our life, like the harmony
    end_quote: no less necessary to it than the other.
    why: The musical image that makes good and evil consubstantial with being, a core statement of Montaigne's
      acceptance of natural necessity.
  - id: montaigne-complete-essays#u103-c3
    label: c3
    heading: Persuading the imagination that the stone is bearable
    char_start: 2516766
    char_end: 2518508
    start_quote: Now, I use my imagination as gently as I can
    end_quote: as long as any man in health.
    why: Opens the self-administered consolation in which Montaigne's mind argues his imagination into
      accepting the stone as a common, noble and mild disease.
  - id: montaigne-complete-essays#u103-c4
    label: c4
    heading: Death, not sickness, kills
    char_start: 2520703
    char_end: 2522458
    start_quote: But thou dost not die because thou art sick; thou diest because thou art living
    end_quote: thou shakest hands with it once a month;
    why: Reframes the stone as a gentle teacher of mortality, the memento-mori core of the consolation
      speech.
  - id: montaigne-complete-essays#u103-c5
    label: c5
    heading: A memory made of paper
    char_start: 2523044
    char_end: 2523435
    start_quote: For want of natural memory, I make one of paper
    end_quote: favourable prognostic in my past experience.
    why: Montaigne's own account of experience as a written log of symptoms that yields consolation and
      expectation through custom.
  - id: montaigne-complete-essays#u103-c6
    label: c6
    heading: Fear compounds pain; prognosis is vain
    char_start: 2530367
    char_end: 2530675
    start_quote: Now if I feel anything stirring, do not fancy that I trouble myself
    end_quote: already suffers what he fears.
    why: Montaigne's refusal to anticipate illness by consulting signs, with the maxim on fear that anchors
      the slice's anti-prognostic scepticism.
- nn: 104
  unit_id: b3-ch13-experience-4
  note_id: montaigne-complete-essays-b3-ch13-experience-4
  span: 2531939:2558343
  chunks:
  - id: montaigne-complete-essays#u104-c1
    label: c1
    heading: Death mixes with life; the portraits
    char_start: 2548618
    char_end: 2549285
    start_quote: Death mixes and confounds itself throughout with life; decay anticipates
    end_quote: being weary of following us herself.
    why: Montaigne's clearest statement that ageing is a gradual death inside life, with the portrait
      comparison as evidence and a complaint against forcing nature into the hands of art.
  - id: montaigne-complete-essays#u104-c2
    label: c2
    heading: God is favourable to those who die by degrees
    char_start: 2546826
    char_end: 2547331
    start_quote: God is favourable to those whom He makes to die by degrees
    end_quote: ‘tis so I melt and steal away from myself.
    why: He treats bodily decay as the one benefit of age, since the last death will kill only part of
      a man.
  - id: montaigne-complete-essays#u104-c3
    label: c3
    heading: Against invariable rules of regimen
    char_start: 2551925
    char_end: 2553247
    start_quote: I avoid the invariable in these laws of fasting
    end_quote: they must add something more, and something more after that
    why: A compact argument that fixed regimens harden into dependence, with the escalating cap-and-hat
      example.
  - id: montaigne-complete-essays#u104-c4
    label: c4
    heading: His father's plain upbringing
    char_start: 2542062
    char_end: 2543176
    start_quote: If I had any sons, I should willingly wish them my fortune.
    end_quote: to oblige and attach me to them.
    why: Ties Montaigne's tastes and his sympathy for the poor to his father's educational design, and
      states his view that formation is best left to fortune, custom and nature.
  - id: montaigne-complete-essays#u104-c5
    label: c5
    heading: Mind steadies the body
    char_start: 2537870
    char_end: 2538435
    start_quote: I am of the opinion that this temperature of my soul has often raised my
    end_quote: than a thousand passions and agitations of the mind that I see about me.
    why: His account of how a calm mind carried him through a quartan ague, and which afflictions he actually
      fears.
  - id: montaigne-complete-essays#u104-c6
    label: c6
    heading: Failing sight and the unnoticed decline
    char_start: 2555986
    char_end: 2556823
    start_quote: I am to this hour--to the age of fifty-four--Ignorant of the
    end_quote: to make it sensible how it ebbs away.
    why: A precise observation that gradual loss of sight and hearing escapes the person suffering it.
- nn: 105
  unit_id: b3-ch13-experience-5
  note_id: montaigne-complete-essays-b3-ch13-experience-5
  span: 2558343:2584629
  chunks:
  - id: montaigne-complete-essays#u105-c1
    label: c1
    heading: 'Against inhuman wisdom: receive pleasures'
    char_start: 2559568
    char_end: 2560064
    start_quote: I, who but crawl upon the earth, hate this inhuman
    end_quote: A man should neither pursue nor avoid them, but receive them.
    why: States Montaigne's rejection of body-despising wisdom and his rule of receiving rather than pursuing
      or avoiding pleasures.
  - id: montaigne-complete-essays#u105-c2
    label: c2
    heading: When I dance, I dance
    char_start: 2563017
    char_end: 2563310
    start_quote: When I dance, I dance; when I sleep, I sleep.
    end_quote: to the sweetness of that solitude, and to myself.
    why: Compact statement of attentive presence in ordinary activity, with Socrates preferred over Pythagoras.
  - id: montaigne-complete-essays#u105-c3
    label: c3
    heading: Have you not lived? The masterpiece of man
    char_start: 2564043
    char_end: 2565399
    start_quote: What? have you not lived?
    end_quote: not to know how to lay them aside and take them up again
    why: 'Reverses the hierarchy of great deeds: living, regulating conduct and taking repose outweigh
      books, empires and public affairs.'
  - id: montaigne-complete-essays#u105-c4
    label: c4
    heading: 'Tasting time: extend life in weight'
    char_start: 2572380
    char_end: 2574075
    start_quote: I have a special vocabulary of my own;
    end_quote: In proportion as the possession of life is more short, I must make it so much deeper and
      fuller.
    why: Montaigne's most personal account of attending to time and enjoyment, including his stance toward
      death.
  - id: montaigne-complete-essays#u105-c5
    label: c5
    heading: The most human philosophies; Socrates as master
    char_start: 2577673
    char_end: 2578955
    start_quote: Of philosophical opinions, I preferably embrace those that are most
    end_quote: Nature is a gentle guide, but not more sweet and gentle than prudent and just.
    why: 'The doctrinal centre: philosophy should marry the divine to the earthly, and Socrates shows
      temperance as moderatrix of pleasure.'
  - id: montaigne-complete-essays#u105-c6
    label: c6
    heading: 'Not angels but men: the common and human model'
    char_start: 2582062
    char_end: 2584262
    start_quote: AEsop, that great man, saw his master piss as he walked
    end_quote: without miracle, without extravagance.
    why: The closing rejection of transcendental aspiration, with Alexander's divinity deflated, in favour
      of knowing how to enjoy one's own being.
