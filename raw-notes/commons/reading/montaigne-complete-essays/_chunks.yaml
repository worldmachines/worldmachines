  - id: montaigne-complete-essays#u31-c4
    label: c4
    heading: Scripture is not a story to tell
    char_start: 717366
    char_end: 717978
    start_quote: ‘Tis, not a story to tell, but a history to revere, fear, and adore.
    end_quote: which has only temerity and presumption.
    why: His restrictive view of lay reading and vernacular translation of Scripture, set against the
      religious conflicts of his day.
  - id: montaigne-complete-essays#u31-c5
    label: c5
    heading: Human fancies, matter of opinion not of faith
    char_start: 723181
    char_end: 723663
    start_quote: I for my part propose fancies merely human
    end_quote: not to instruct but to be instructed.
    why: Self-description of the essays as lay, provisional, learner's exercises.
