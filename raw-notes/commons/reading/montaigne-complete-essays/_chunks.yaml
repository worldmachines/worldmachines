  - id: montaigne-complete-essays#u80-c6
    label: c6
    heading: Men do not marry for themselves
    char_start: 1950959
    char_end: 1952452
    start_quote: Men do not marry for themselves, let them say what they will;
    end_quote: this furious ardour is worth nothing.
    why: Montaigne's argument that marriage serves family and prudence rather than passion.
- nn: 81
  unit_id: b3-ch05-some-verses-virgil-2
  note_id: montaigne-complete-essays-b3-ch05-some-verses-virgil-2
  span: 1956727:1983842
  chunks:
  - id: montaigne-complete-essays#u81-c1
    label: c1
    heading: Marriage taken by custom, kept by duty
