    end_quote: Let us go further into this matter since here we are.
    why: A rare personal self-report that also shows the digressive method of the chapter.
  - id: montaigne-complete-essays#u29-c2
    label: c2
    heading: Staking honour on the horse
    char_start: 653891
    char_end: 654216
    start_quote: You stake (whatever Chrysanthes in Xenophon says to the contrary) your valour and your
      fortune upon that of your horse
    end_quote: your honour must answer for it.
    why: Montaigne's own argument that mounted fighting hands one's honour to something outside one's
      control.
  - id: montaigne-complete-essays#u29-c3
    label: c3
    heading: Weapons we can give an account of
    char_start: 654605
    char_end: 655669
    start_quote: And the means we choose to make use of in so great a hazard should be as much as possible
      at our own command
    end_quote: hope we shall one day lay it aside.
    why: His reasoning on weapon choice and his early scepticism about firearms.
  - id: montaigne-complete-essays#u29-c4
    label: c4
    heading: The Indians and the Spanish horses
    char_start: 662062
    char_end: 662566
    start_quote: when the Spaniards first landed amongst them, had so great an opinion
    end_quote: interpreting their neighing for a language of truce and friendship.
