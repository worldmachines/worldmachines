  - id: montaigne-complete-essays#u81-c6
    label: c6
    heading: Reputation, constancy, and the vice of boasting
    char_start: 1982951
    char_end: 1983840
    start_quote: Somebody told Plato that all the world spoke ill of him.
    end_quote: to persecute, forage, and rifle those tender and charming favours.
    why: Ends the slice on reputation, the decline of discretion in 'table-talk', and Montaigne's contempt
      for men who boast of favours.
- nn: 82
  unit_id: b3-ch05-some-verses-virgil-3
  note_id: montaigne-complete-essays-b3-ch05-some-verses-virgil-3
  span: 1983842:2009130
  chunks:
  - id: montaigne-complete-essays#u82-c1
    label: c1
