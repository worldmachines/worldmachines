  - id: montaigne-complete-essays#u82-c4
    label: c4
    heading: Does severity of obligation produce the opposite effect?
    char_start: 2001400
    char_end: 2002047
    start_quote: Let us also consider whether the great and violent severity of obligation
    end_quote: ‘tis all swine’s flesh, varied by sauces, as Flaminius’ host said.
    why: 'Reverses the moralist''s logic: prohibition raises the value and desire of the conquest.'
  - id: montaigne-complete-essays#u82-c5
    label: c5
    heading: Montaigne's own bashfulness and 'sedition and discrepancy'
    char_start: 1989280
    char_end: 1989866
    start_quote: I was always superstitiously afraid of giving offence, and have ever had a great respect
    end_quote: what are we but sedition and discrepancy?
    why: A self-portrait of timidity in love that generalises into Montaigne's view of the divided self.
  - id: montaigne-complete-essays#u82-c6
    label: c6
    heading: Language that is well thought, not merely well said
    char_start: 2005483
    char_end: 2007386
    start_quote: ‘Tis not a soft eloquence, and without offence only;
    end_quote: but withal ingeniously and discreetly.
    why: 'His theory of style: expression as the vividness of conception, and fine wits enriching their
      own language rather than inventing.'
- nn: 83
  unit_id: b3-ch05-some-verses-virgil-4
  note_id: montaigne-complete-essays-b3-ch05-some-verses-virgil-4
  span: 2009130:2035633
  chunks:
  - id: montaigne-complete-essays#u83-c1
    label: c1
