  - id: montaigne-complete-essays#u94-c6
    label: c6
    heading: Bred up among the dead; Rome
    char_start: 2297445
    char_end: 2299168
    start_quote: I have been bred up from my infancy with these dead
    end_quote: I throw myself back upon that other, and am so enamoured of it
    why: Shows his bond with the ancient dead as a substitute for a present age he finds himself of no
      use to.
  - id: montaigne-complete-essays#u94-c7
    label: c7
    heading: 'The Delphic command: look into yourself'
    char_start: 2305936
    char_end: 2306826
    start_quote: It was a paradoxical command anciently given
    end_quote: the magistrate without jurisdiction, and, after all, the fool of the farce.
    why: Closes the essay on vanity as outward-turned emptiness and the turn to self-study.
- nn: 95
  unit_id: b3-ch10-managing-will-1
  note_id: montaigne-complete-essays-b3-ch10-managing-will-1
  span: 2306830:2333982
  chunks:
