    char_start: 2284955
    char_end: 2286258
    start_quote: The virtue that is assigned to the affairs of the world is a virtue of many wavings
    end_quote: according to the time, according to the men, according to the occasions.
    why: Montaigne's account of why his private rules proved unfit for public service.
  - id: montaigne-complete-essays#u94-c3
    label: c3
    heading: Civil innocence is measured by times and places
    char_start: 2290042
    char_end: 2290334
    start_quote: The most just party is at best but a member of a decayed
    end_quote: civil innocence is measured according to times and places.
