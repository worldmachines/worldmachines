    char_end: 1987315
    start_quote: ‘Tis, of all the diseases of the mind, that which the most things serve for aliment
    end_quote: that rebounds them to an extremity quite contrary to its cause.
    why: Montaigne's diagnosis of jealousy as a self-feeding passion that turns every good into fuel.
