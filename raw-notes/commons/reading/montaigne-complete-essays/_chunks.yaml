  - id: montaigne-complete-essays#u78-c4
    label: c4
    heading: Love without comedy
    char_start: 1894303
    char_end: 1894735
    start_quote: ‘Tis folly to fix all a man’s thoughts upon it,
    end_quote: for fear of danger.
