      submission to Catholic authority.
  - id: montaigne-complete-essays#u31-c2
    label: c2
    heading: Power and justice; the soul at prayer
    char_start: 711304
    char_end: 711793
    start_quote: God’s justice and His power are inseparable; ‘tis in vain we invoke His
    end_quote: an affection full of irreverence and hatred.
    why: Core argument that prayer from an unamended soul compounds the offence.
  - id: montaigne-complete-essays#u31-c3
    label: c3
    heading: One hour to God, the rest to the devil
    char_start: 712413
    char_end: 713345
    start_quote: We pray only by custom and for fashion’s sake; or rather, we read or pronounce
    end_quote: both the crime and the judge?
