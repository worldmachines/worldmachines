    char_end: 1762043
    start_quote: Let it alone a little; the general order of things that takes care of fleas and moles
    end_quote: both their fury and physic together.
    why: 'His positive counsel: patience before nature''s order, which leads those who follow and drags
      those who do not.'
- nn: 74
  unit_id: b2-ch37-resemblance-children-fathers-2
  note_id: montaigne-complete-essays-b2-ch37-resemblance-children-fathers-2
  span: 1762138:1785827
  chunks:
  - id: montaigne-complete-essays#u74-c1
    label: c1
    heading: Aesop's sick man and the physician who says everything is good
    char_start: 1764465
    char_end: 1765378
    start_quote: AEsop, a most excellent author, and of whom few men discover all the graces
    end_quote: with being too well I am about to die.
    why: A compact parable of how medical authority can read any symptom, even approaching death, as confirmation
      of itself.
  - id: montaigne-complete-essays#u74-c2
    label: c2
    heading: Mystery, belief and physicians' quarrels
    char_start: 1766180
    char_end: 1769525
    start_quote: As to what remains, had I been of their counsel, I would have rendered my discipline
      more sacred and mysterious
    end_quote: the controversies and various judgments which they still nourish and continue amongst themselves.
    why: Montaigne's analysis of how an art sustains trust through strangeness and secrecy, and how disagreement
      among practitioners betrays self-interest.
  - id: montaigne-complete-essays#u74-c3
    label: c3
    heading: The ancient controversy in physic
    char_start: 1769527
    char_end: 1770625
    start_quote: Will you have one example of the ancient controversy in physic?
    end_quote: ‘tis not wisdom to abandon ourselves to the mercy of the agitation of so many contrary
      winds.
    why: A sceptical argument from rival doctrines about the causes of disease, with the contrast between
      astronomy's stakes and our own body's.
  - id: montaigne-complete-essays#u74-c4
    label: c4
    heading: 'Never three of one opinion: the stone and the bishop'
    char_start: 1776664
    char_end: 1777727
    start_quote: In the diseases I have had, though there were ever so little difficulty in the case
    end_quote: by which to examine our brains, lungs, and liver.
    why: Montaigne's firsthand evidence of physicians' misdiagnoses and his comparison of surgery, which
      sees what it does, with conjectural physic.
  - id: montaigne-complete-essays#u74-c5
    label: c5
    heading: Contradictory counsels on the stone
    char_start: 1781528
    char_end: 1783470
    start_quote: They have the like uniformity in the counsels they give us for the regimen of life
    end_quote: and commit themselves to the common fortune.
    why: A worked demonstration that for each medical precept an equally plausible contrary can be raised,
      justifying trust in appetite and nature.
  - id: montaigne-complete-essays#u74-c6
    label: c6
    heading: 'Baths: wholesome, not miraculous'
    char_start: 1783472
    char_end: 1785155
    start_quote: I have seen in my travels almost all the famous baths of Christendom
    end_quote: they may help some light indisposition, or prevent some threatening alteration.
    why: Montaigne's own measured verdict on a remedy he tests by experience, denying its miracles while
      granting modest benefit.
- nn: 75
  unit_id: b2-ch37-resemblance-children-fathers-3
  note_id: montaigne-complete-essays-b2-ch37-resemblance-children-fathers-3
  span: 1785827:1808280
  chunks:
  - id: montaigne-complete-essays#u75-c1
    label: c1
    heading: The Lahontan villagers, the notary and the physician
    char_start: 1787845
    char_end: 1790669
    start_quote: The Baron de Caupene in Chalosse and I have betwixt us the advowson of a
    end_quote: This is the first of my stories.
    why: Montaigne's exemplum of a custom-governed community corrupted by lawyers' and doctors' learning,
      naming physic as an introduced source of disease.
  - id: montaigne-complete-essays#u75-c2
    label: c2
    heading: The he-goat's stones
    char_start: 1790671
    char_end: 1793297
    start_quote: The other is, that before I was afflicted with the stone, hearing that
    end_quote: and yet triumph when they happen to be successful.
    why: A first-person anecdote of testing a fashionable remedy and finding a reason to doubt it, with
      his argument that the body works as a whole.
  - id: montaigne-complete-essays#u75-c3
    label: c3
    heading: How could a cure by chance ever be known?
    char_start: 1798402
    char_end: 1800591
    start_quote: Suppose man looking round about him upon the infinite number of things, plants, animals,
      metals;
    end_quote: 'were declared our comptrollers by express procuration:'
    why: 'The sceptical core of the slice: a stepwise case that empirical medical knowledge cannot be
      built from fortune and a handful of recorders.'
  - id: montaigne-complete-essays#u75-c4
    label: c4
    heading: 'Letter to Madame de Duras: I am less a writer of books than anything else'
    char_start: 1802718
    char_end: 1804226
    start_quote: I have made it my whole business to frame my life
    end_quote: I am towards the bottom of the barrel, which begins to taste of the lees.
    why: Montaigne's most explicit statement here that life, not writing, is his work, and that the book
      is a faded likeness.
  - id: montaigne-complete-essays#u75-c5
    label: c5
    heading: Pericles' scrolls and the six drachms of opium
    char_start: 1805592
    char_end: 1806544
    start_quote: It was, I think, Pericles, who being asked how he did
    end_quote: there is a dreadful fever in my mind.
    why: A short anecdote used to hedge his own resolve, admitting he cannot answer for his future constancy.
  - id: montaigne-complete-essays#u75-c6
    label: c6
    heading: Diversity of opinions as nature's way
    char_start: 1807633
    char_end: 1808277
    start_quote: I do not hate opinions contrary to my own
    end_quote: their most universal quality is diversity.
    why: A closing statement of tolerance grounded in nature's variety, which also tempers his own polemic
      against physic.
- nn: 76
  unit_id: b3-ch01-profit-honesty
  note_id: montaigne-complete-essays-b3-ch01-profit-honesty
  span: 1808280:1844256
  chunks:
  - id: montaigne-complete-essays#u76-c1
    label: c1
    heading: Necessary vices and who should perform them
    char_start: 1809983
    char_end: 1811326
    start_quote: Our being is cemented with sickly qualities
    end_quote: men who are more obedient and more supple.
    why: States the premise that vice is woven into human nature and government, and Montaigne's decision
      to leave its performance to others.
  - id: montaigne-complete-essays#u76-c2
    label: c2
    heading: Montaigne's way of dealing between the parties
    char_start: 1819225
    char_end: 1821617
    start_quote: I say nothing to one party that I may not
    end_quote: but actions must receive commission from the public appointment.
    why: 'His self-report on mediating in the civil wars: openness, limited trust, limited service, and
      a free will within public obedience.'
  - id: montaigne-complete-essays#u76-c3
    label: c3
    heading: The way of truth is one and simple
    char_start: 1823412
    char_end: 1823940
    start_quote: The way of truth is one and simple; that of particular
    end_quote: 'had the poor ass for his compliment:'
    why: Answers the charge that his sincerity is a subtle art by contrasting truth with the double and
      casual way of profit.
  - id: montaigne-complete-essays#u76-c4
    label: c4
    heading: What Montaigne would and would not do for the public
    char_start: 1826379
    char_end: 1827068
    start_quote: Let who will be Pomponius Flaccus, and there are enough who would
    end_quote: send me rather to the galleys.
    why: 'Draws his line: he will not lie, betray or forswear himself even for the public service.'
  - id: montaigne-complete-essays#u76-c5
    label: c5
    heading: The prince forced to break his word
    char_start: 1834052
    char_end: 1835891
    start_quote: A prince, when by some urgent circumstance
    end_quote: the public may be, when very manifest and of very great concern.
    why: 'The hedged treatment of necessity: breaking faith is a misfortune, felt as such, and an exception
      that endangers the example.'
  - id: montaigne-complete-essays#u76-c6
    label: c6
    heading: Epaminondas and the limits on the common good
    char_start: 1839649
    char_end: 1841172
    start_quote: I have formerly placed Epaminondas in the first rank
    end_quote: purest innocence.
    why: The positive model of justice and gentleness kept inside violence, against the claim that war
      silences law.
- nn: 77
  unit_id: b3-ch02-repentance
  note_id: montaigne-complete-essays-b3-ch02-repentance
  span: 1844256:1878029
  chunks:
  - id: montaigne-complete-essays#u77-c1
    label: c1
    heading: I do not paint its being, I paint its passage
    char_start: 1844283
    char_end: 1845708
    start_quote: 'Others form man; I only report him: and represent a particular one'
    end_quote: but it is always learning and making trial.
    why: 'Montaigne''s statement of method: the self is a moving, inconstant subject that can only be
      reported as passage, never fixed.'
  - id: montaigne-complete-essays#u77-c2
    label: c2
    heading: Conscience of a man, and the disclaimer
    char_start: 1848596
    char_end: 1849044
    start_quote: Be pleased here to excuse what I often repeat, that I very rarely repent
    end_quote: I do not teach; I only relate.
    why: Gives his claim of rarely repenting together with the hedge that he speaks doubting and merely
      relates.
  - id: montaigne-complete-essays#u77-c3
    label: c3
    heading: Socrates against Alexander
    char_start: 1856963
    char_end: 1857477
    start_quote: and the virtue of Alexander appears to me of much less vigour in his great theatre
    end_quote: a much more general, weighty, and legitimate science than the other.
    why: Argues that the ordinary conduct of private life is a harder and more legitimate virtue than
      public glory.
  - id: montaigne-complete-essays#u77-c4
    label: c4
    heading: What repentance is not
    char_start: 1865912
    char_end: 1867536
    start_quote: For my own part, I may desire in general to be other than I am
    end_quote: as deeply and universally as God sees into me.
    why: 'Defines real repentance narrowly: it concerns what is in our power and must pierce the whole
      person, not mere wishing to be better.'
  - id: montaigne-complete-essays#u77-c5
    label: c5
    heading: I accuse my fortune, and not my work
    char_start: 1867782
    char_end: 1868842
    start_quote: I find that, in my former resolves, I have proceeded with discretion
    end_quote: I do not blame myself, I accuse my fortune, and not my work; this cannot be called repentance.
    why: Judges past decisions by the occasion they answered and separates error of judgment from bad
      luck.
  - id: montaigne-complete-essays#u77-c6
    label: c6
    heading: An enchanted convalescence
    char_start: 1871774
    char_end: 1873462
    start_quote: Our appetites are rare in old age; a profound satiety seizes us after the act
    end_quote: Miserable kind of remedy, to owe one’s health to one’s disease!
    why: Rejects the repentance and temperance imposed by age's decay, insisting virtue must come from
      judgment, not bodily failure.
- nn: 78
  unit_id: b3-ch03-three-commerces
  note_id: montaigne-complete-essays-b3-ch03-three-commerces
  span: 1878029:1906842
  chunks:
  - id: montaigne-complete-essays#u78-c1
    label: c1
    heading: The soul's chief study is itself
    char_start: 1879688
    char_end: 1880266
    start_quote: for its chiefest and hardest study is to study itself.
    end_quote: where it may either invent or judge.
    why: 'States the self-regarding temperament that organizes the whole essay: the mind has its own matter
      and needs no foreign employment.'
  - id: montaigne-complete-essays#u78-c2
    label: c2
    heading: Against pedantic display
    char_start: 1887095
    char_end: 1887812
    start_quote: The learned often stumble at this stone;
    end_quote: the learning that cannot penetrate their souls hangs still upon the tongue.
