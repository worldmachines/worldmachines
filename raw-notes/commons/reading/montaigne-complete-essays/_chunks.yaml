  - id: montaigne-complete-essays#u65-c6
    label: c6
    heading: The year-long horizon of old age
    char_start: 1612752
    char_end: 1613396
    start_quote: The longest of my designs is not of above a year
    end_quote: of knowledge, of health, of myself.
    why: Self-report of ageing as the gradual shedding of cares and designs, the core of ch. 28's seasonal
      argument.
  - id: montaigne-complete-essays#u65-c7
    label: c7
