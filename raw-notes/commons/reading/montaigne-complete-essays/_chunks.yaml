- nn: 29
  unit_id: b1-ch48-49-war-horses-destriers
  note_id: montaigne-complete-essays-b1-ch48-49-war-horses-destriers
  span: 648498:676575
  chunks:
  - id: montaigne-complete-essays#u29-c1
    label: c1
    heading: Most at ease on horseback
    char_start: 652052
    char_end: 652333
