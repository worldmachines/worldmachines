    char_start: 1607848
    char_end: 1608340
    start_quote: All that exceeds a simple death appears to me absolute cruelty.
    end_quote: or after the old way, nailed to a cross?
    why: Montaigne's own judgment against judicial torture, questioning whether it deters or merely drives
