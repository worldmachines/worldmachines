  - id: montaigne-complete-essays#u79-c4
    label: c4
    heading: Love as diversion from a violent displeasure
    char_start: 1920021
    char_end: 1920642
    start_quote: I was once wounded with a vehement displeasure, and withal, more just
    end_quote: Variation ever relieves, dissolves, and dissipates.
    why: A self-report of managing a passion by substitution, summed in a general principle of variation.
  - id: montaigne-complete-essays#u79-c5
    label: c5
    heading: 'A little thing holds us: rinds, names and word-complaints'
    char_start: 1922555
    char_end: 1923855
    start_quote: A little thing will turn and divert us, because a little thing holds us.
    end_quote: These are the foundations of our mourning.
    why: Montaigne's account of grief as attached to superficial images and sounds, examined in himself.
  - id: montaigne-complete-essays#u79-c6
    label: c6
    heading: The stone, the atoms of regret, and death in detail
    char_start: 1924826
    char_end: 1925103
    start_quote: I look upon death carelessly when I look upon it universally as the end of life.
    end_quote: a common consolation, discourages and softens me.
    why: A candid self-report that death is bearable in gross but overwhelming in its small particulars.
