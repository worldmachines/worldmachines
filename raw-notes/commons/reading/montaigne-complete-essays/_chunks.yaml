  - id: montaigne-complete-essays#u95-c6
    label: c6
    heading: Equanimity amid the civil broils
    char_start: 2329390
    char_end: 2332543
    start_quote: I cannot engage myself so deep and so entire; when my will gives me to
    end_quote: should subserve not truth, but to the project of our desires.
