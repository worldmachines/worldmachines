    heading: Sentinels in our own houses
    char_start: 2233005
    char_end: 2233740
    start_quote: I have a thousand times gone to bed in my own house with an apprehension
    end_quote: A civil war has this with it worse than other wars have, to make us stand sentinels in
      our own houses.
    why: Personal testimony of civil-war insecurity, with custom as a numbing 'bounty of nature'.
  - id: montaigne-complete-essays#u92-c3
    label: c3
    heading: All men as compatriots
    char_start: 2238224
    char_end: 2239161
    start_quote: Not because Socrates has said so, but because it is in truth my own humour
    end_quote: dried up all the other rivers of the world.
    why: His cosmopolitan preference for chosen ties over those of native air and blood, with the Persian-river
      image of self-imposed limits.
  - id: montaigne-complete-essays#u92-c4
    label: c4
    heading: Walking for the walk's sake
    char_start: 2249930
    char_end: 2250396
    start_quote: What care I for that? I neither undertake it to return, nor to finish it
    end_quote: the journey of my life is carried on after the same manner.
    why: A purposeless, divisible conception of travel and of life itself.
  - id: montaigne-complete-essays#u92-c5
    label: c5
    heading: Absence as nourishment for marriage and friendship
    char_start: 2244196
    char_end: 2244751
    start_quote: As to the duties of conjugal friendship, that some think to be impaired
    end_quote: Change warms my appetite to the one and then to the other.
    why: Argues that interruption renews affection and that fruition belongs to the imagination, setting
      up the later remarks on friendship.
  - id: montaigne-complete-essays#u92-c6
    label: c6
    heading: A quiet, solitary death
    char_start: 2250929
    char_end: 2253717
    start_quote: If I feared to die in any other place than that of my birth
    end_quote: ‘tis the act of one single person.
    why: Montaigne's wish for an unceremonious, private death without performance of constancy, contrasted
      with Roman custom.
- nn: 93
  unit_id: b3-ch09-vanity-4
  note_id: montaigne-complete-essays-b3-ch09-vanity-4
  span: 2254076:2279260
  chunks:
  - id: montaigne-complete-essays#u93-c1
    label: c1
    heading: Publication as rule and as defence against slander
    char_start: 2256144
    char_end: 2256961
    start_quote: I find this unexpected advantage in the publication of my manners
    end_quote: that he may that way satisfy his ill-nature without fighting with the wind.
    why: 'Montaigne''s own account of what publishing his character does for him: it holds him to consistency
      and disarms slander through open confession.'
  - id: montaigne-complete-essays#u93-c2
    label: c2
    heading: Bion and the disarming confession
    char_start: 2257489
    char_end: 2258261
    start_quote: I should willingly follow the example of the philosopher Bion
    end_quote: A free and generous confession enervates reproach and disarms slander.
    why: A borrowed exemplum (Bion) that Montaigne adopts as the model for his self-portrait's candour.
  - id: montaigne-complete-essays#u93-c3
    label: c3
    heading: A book for few men and few years
    char_start: 2263332
    char_end: 2265038
    start_quote: I write my book for few men and for few years.
    end_quote: I leave nothing to be desired or to be guessed at concerning me.
    why: States the audience and shelf-life of the Essays, the instability of French, and the aim of leaving
      no gaps for posthumous invention.
  - id: montaigne-complete-essays#u93-c4
    label: c4
    heading: Wanting a death that shares the ease of life
    char_start: 2266040
    char_end: 2266976
    start_quote: I would have my death share in the ease and conveniences of my life
    end_quote: so idly does our fear more concern itself in the means than the effect.
    why: Montaigne's personal, un-heroic preferences about dying, and his observation that imagination,
      not the event, creates the differences in dread.
  - id: montaigne-complete-essays#u93-c5
    label: c5
    heading: Indifference to foreign custom
    char_start: 2270836
    char_end: 2273384
    start_quote: I have a constitution of body as free, and a palate as indifferent
    end_quote: scarce out of the sight of the vanes of my own house.
    why: A compact statement of his custom-relativism as lived practice, with the hedge that he has not
      travelled far.
  - id: montaigne-complete-essays#u93-c6
    label: c6
    heading: '"Be wise" is no advice; all wisdom is vanity'
    char_start: 2276482
    char_end: 2278945
    start_quote: I see the reason of this advice, and see it perfectly well
    end_quote: 'I make it my business to serve it according to itself:'
    why: 'The turn of the essay: Montaigne answers the exhortation to reform himself with the physician
      analogy, admits irresolution, and declares even wisdom vanity.'
- nn: 94
  unit_id: b3-ch09-vanity-5
  note_id: montaigne-complete-essays-b3-ch09-vanity-5
  span: 2279260:2306830
  chunks:
  - id: montaigne-complete-essays#u94-c1
    label: c1
