  - id: montaigne-complete-essays#u33-c5
    label: c5
    heading: The wise man is only a man
    char_start: 765360
    char_end: 766400
    start_quote: To what vanity does the good opinion we have of ourselves push us?
    end_quote: than that what is there more frail, more miserable, or more nothing?
    why: 'The hinge of the essay: Montaigne''s argument that even the most perfect soul cannot guarantee
