  - id: montaigne-complete-essays#u78-c3
    label: c3
    heading: Solitude as withdrawal inward
    char_start: 1889943
    char_end: 1891822
    start_quote: 'There are some particular natures that are private and retired:'
    end_quote: shut up in my closet, without any offence to my guests.
