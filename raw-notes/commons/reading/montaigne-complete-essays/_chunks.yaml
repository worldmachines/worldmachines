    end_quote: both in external and internal sight to be insensibly blinded.
    why: The central argument of the second chapter on custom as an unnoticed force on belief.
  - id: montaigne-complete-essays#u29-c6
    label: c6
    heading: Stronger souls, greater vice and virtue
    char_start: 673778
    char_end: 674323
    start_quote: But in all sorts of magnificence, debauchery, and voluptuous inventions
    end_quote: have they less power to do either very well or very ill.
    why: Montaigne's own verdict on ancients versus moderns after the catalogue of Roman customs.
- nn: 30
  unit_id: b1-ch50-55-democritus-heraclitus
  note_id: montaigne-complete-essays-b1-ch50-55-democritus-heraclitus
  span: 676575:708078
  chunks:
  - id: montaigne-complete-essays#u30-c1
    label: c1
