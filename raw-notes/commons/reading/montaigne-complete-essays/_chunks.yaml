      strikes much more home than he who only feigns.
    end_quote: I think I know him even into his soul
    why: Montaigne's reading practice of asking what kind of man an author was, contrasting Cicero, Brutus
      and Seneca.
  - id: montaigne-complete-essays#u67-c3
    label: c3
