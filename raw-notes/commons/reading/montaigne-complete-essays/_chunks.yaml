  - id: montaigne-complete-essays#u79-c3
    label: c3
    heading: Zeno's syllogisms and the humanity of great souls
    char_start: 1918047
    char_end: 1918697
    start_quote: Even the arguments of philosophy are always edging and glancing on the matter
    end_quote: they are yet simply men.
