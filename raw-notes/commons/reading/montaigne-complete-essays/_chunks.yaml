- nn: 31
  unit_id: b1-ch56-57-prayers
  note_id: montaigne-complete-essays-b1-ch56-57-prayers
  span: 708078:735157
  chunks:
  - id: montaigne-complete-essays#u31-c1
    label: c1
    heading: Submitting his fancies to the Church
