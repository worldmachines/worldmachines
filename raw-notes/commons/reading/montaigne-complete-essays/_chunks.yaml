  - id: montaigne-complete-essays#u78-c5
    label: c5
    heading: Books, the third commerce
    char_start: 1899954
    char_end: 1901649
    start_quote: That of books, which is the third, is much more certain, and much more our own.
    end_quote: my mind is satisfied with this right of possession.
    why: 'The core statement of what books are for him: constant, available, enjoyed as a right of possession.'
  - id: montaigne-complete-essays#u78-c6
    label: c6
    heading: The tower library and his kingdom
    char_start: 1902414
    char_end: 1904810
    start_quote: When at home, I a little more frequent my library,
    end_quote: elsewhere I have but verbal authority only, and of a confused essence.
    why: Concrete description of the round study where the Essays are dictated, and his claim to sovereignty
      over one private corner.
- nn: 79
  unit_id: b3-ch04-diversion
  note_id: montaigne-complete-essays-b3-ch04-diversion
  span: 1906842:1930430
  chunks:
  - id: montaigne-complete-essays#u79-c1
    label: c1
    heading: Consoling the afflicted lady by diversion
    char_start: 1906869
    char_end: 1909545
    start_quote: I was once employed in consoling a lady truly afflicted.
    end_quote: for I had not gone to the root.
    why: Montaigne's own first-person case for diversion over argument, with his honest admission that
      it only palliates.
  - id: montaigne-complete-essays#u79-c2
    label: c2
    heading: Physicians divert a catarrh; the mind likewise
    char_start: 1912493
    char_end: 1913032
    start_quote: When physicians cannot stop a catarrh, they divert and turn it into some
    end_quote: we only make him decline and evade it.
