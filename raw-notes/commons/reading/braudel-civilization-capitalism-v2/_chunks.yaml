source: braudel-civilization-capitalism-v2
units:
- nn: 1
  unit_id: foreword
  note_id: braudel-civilization-capitalism-v2-foreword
  span: 0:8579
  chunks:
  - id: braudel-civilization-capitalism-v2#u01-c1
    heading: 'The three-storey house'
    span: 10:520
    why: 'States the governing three-storey metaphor (material life / economic life / capitalism) that organizes the entire volume.'
  - id: braudel-civilization-capitalism-v2#u01-c2
    heading: 'The threshold of exchange value'
    span: 521:1079
    why: 'Defines the boundary between material life and economic life as discrete contact points, not a continuum.'
  - id: braudel-civilization-capitalism-v2#u01-c3
    heading: 'Capitalism as accumulation of power'
    span: 3945:4527
    why: 'Braudel''s core working definition of capitalism as an opaque, power-based anti-market, plus the claim that the storeys depend on each other.'
  - id: braudel-civilization-capitalism-v2#u01-c4
    heading: 'Justifying an anachronism'
    span: 4922:5692
    why: 'Braudel''s explicit, self-aware defense of applying a twentieth-century word to a 1400-1800 phenomenon.'
  - id: braudel-civilization-capitalism-v2#u01-c5
    heading: 'The comparative, longue-durée method'
    span: 2317:2879
    why: 'Lays out the comparative method (after Marc Bloch) and the longue durée perspective that structure the whole book.'
  - id: braudel-civilization-capitalism-v2#u01-c6
    heading: 'From circulation to the set of sets'
    span: 6398:7197
    why: 'Previews the book''s chapter plan and names its holistic destination, the closing ''society as a set of sets'' chapter.'
- nn: 2
  unit_id: ch01-elementary-markets-and-town-intervention
  note_id: braudel-civilization-capitalism-v2-ch01-elementary-markets-and-town-intervention
  span: 8579:50777
  chunks:
  - id: braudel-civilization-capitalism-v2#u02-c1
    heading: 'The market as liberation, and the three worlds'
    span: 11585:12351
    why: 'States Braudel''s framing of the market economy as the transparent middle tier between production and capitalism, and his strongest claim for its social force.'
  - id: braudel-civilization-capitalism-v2#u02-c2
    heading: 'Hand-in-Hand, Auge-in-Auge Handel'
    span: 16613:17665
    why: 'Defines the elementary market''s core property -- immediate, supervised, credit-free, face-to-face exchange -- that the rest of the unit complicates.'
  - id: braudel-civilization-capitalism-v2#u02-c3
    heading: 'Ancient and world-wide markets'
    span: 17669:18346
    why: 'Shows Braudel gesturing toward longue-duree, cross-civilizational comparison of the elementary market form.'
  - id: braudel-civilization-capitalism-v2#u02-c4
    heading: 'Town punishment for cheating vendors'
    span: 19276:19753
    why: 'Concrete evidence of towns'' severe regulatory intervention in market pricing, the unit''s town-intervention theme.'
  - id: braudel-civilization-capitalism-v2#u02-c5
    heading: 'London eating up England'
    span: 47665:48271
    why: 'Captures the scale London''s supply zone reached and the ambivalence Braudel attaches to that growth.'
  - id: braudel-civilization-capitalism-v2#u02-c6
    heading: 'Dislocation of the face-to-face market'
    span: 49800:50644
    why: 'Shows the unit''s payoff: growth in scale breaks the elementary market''s face-to-face transparency and installs merchant intermediary chains.'
- nn: 3
  unit_id: ch01-market-statistics-labour-market-beneath-market
  note_id: braudel-civilization-capitalism-v2-ch01-market-statistics-labour-market-beneath-market
  span: 50777:89697
  chunks:
  - id: braudel-civilization-capitalism-v2#u03-c1
    heading: 'Private trading as social revolution: Hugh Peter''s 1647 exclamation'
    span: 58774:59506
    why: 'Braudel (via Everitt) frames the rise of private trading as a social and political revolution, not just an economic workaround, capped by a vivid contemporary voice on the reopening of England''s roads.'
  - id: braudel-civilization-capitalism-v2#u03-c2
    heading: 'Counting England''s market towns'
    span: 51409:52038
    why: 'Gives the unit''s core statistical claim — market density and the ratio of a market town''s trading reach to its own population — that grounds the opening ''Some statistics'' section.'
  - id: braudel-civilization-capitalism-v2#u03-c3
    heading: 'Labour becomes a commodity: Hobbes and the Genoa consul'
    span: 69569:70410
    why: 'States the unit''s central claim directly and marks the labour market as its focal case, using Hobbes''s proposition and a contemporary''s astonishment to show the novelty of treating labour as a market commodity.'
  - id: braudel-civilization-capitalism-v2#u03-c4
    heading: 'The Joachimstal miners'' formula'
    span: 71072:71771
    why: 'A concrete case of independent artisans forced into wage-earning, ending in the aldermen''s own blunt formula that Braudel reads as an early statement of the Capital/Labour relation.'
  - id: braudel-civilization-capitalism-v2#u03-c5
    heading: 'The Zaragoza soldier: access to the market''s plenty'
    span: 79817:80237
    why: 'Illustrates the ''markets as watersheds'' theme with a concrete, human-scale image of how much of the market''s abundance a person could actually draw on.'
  - id: braudel-civilization-capitalism-v2#u03-c6
    heading: 'The methodological thesis: history beneath the market'
    span: 89277:89695
    why: 'The unit''s closing thesis statement, making explicit the argument that rural history is incomplete without reconstructing the self-sufficient economy beneath the visible market.'
- nn: 4
  unit_id: ch01-shops-and-pedlars
  note_id: braudel-civilization-capitalism-v2-ch01-shops-and-pedlars
  span: 89697:136702
  chunks:
  - id: braudel-civilization-capitalism-v2#u04-c1
    heading: 'Shops without markets: the world-scale exceptions'
    span: 91653:92332
    why: 'Braudel''s clearest world-scale move in this unit: the shop/market line dissolves across Chinese and Ceylonese exchange too, showing the pair is a taxonomic habit rather than a universal grid.'
  - id: braudel-civilization-capitalism-v2#u04-c2
    heading: 'Why authorities preferred the market: supervision'
    span: 93215:94081
    why: 'States the urban authorities'' own reason for privileging the market over the shop — visibility enables control, an early instance of a supervisory logic later generalized as legibility.'
  - id: braudel-civilization-capitalism-v2#u04-c3
    heading: 'The capitalist merchant''s M-G-M against the peasant''s G-M-G'
    span: 95861:96197
    why: 'Braudel borrows Marx''s formula to mark exactly where the ordinary seller crosses into the capitalist logic that Vol. II''s anti-market storey is built on.'
  - id: braudel-civilization-capitalism-v2#u04-c4
    heading: 'The shopkeeper as capitalist in miniature'
    span: 116314:116690
    why: 'Compresses the unit''s credit-and-precarity thesis into one sentence: it is credit, not scale, that makes even the pettiest shopkeeper structurally capitalist.'
  - id: braudel-civilization-capitalism-v2#u04-c5
    heading: 'Peddling as evasion of the market'
    span: 136404:136700
    why: 'The unit''s closing generalization: peddling''s whole historical function, across two millennia and every attempted ban, is to circumvent whatever formal apparatus of exchange authority erects.'
- nn: 5
  unit_id: ch01-fairs-and-warehouses
  note_id: braudel-civilization-capitalism-v2-ch01-fairs-and-warehouses
  span: 136702:176019
  chunks:
  - id: braudel-civilization-capitalism-v2#u05-c1
    heading: 'Chambers of commerce as vehicles of concentration'
    span: 138199:138748
    why: 'Shows chambers of commerce, though nominally serving all merchants, functioning to entrench a handful of wholesalers, in a contemporary merchant''s own words rather than Braudel''s gloss.'
  - id: braudel-civilization-capitalism-v2#u05-c2
    heading: 'Bartholomew fair and the proverb of reversal'
    span: 152503:152944
    why: 'Names, in a folk proverb, the experiential line between ordinary market exchange and the fair''s licensed carnival that runs under Braudel''s own market/anti-market vocabulary.'
  - id: braudel-civilization-capitalism-v2#u05-c3
    heading: 'Medina del Campo: town swallowed by its fair'
    span: 145420:146173
    why: 'The starkest image in the unit of an institution''s function draining away long before it vanished outright — a decay-sequence in miniature.'
  - id: braudel-civilization-capitalism-v2#u05-c4
    heading: 'The fair as pyramid: commodities at the base, credit at the tip'
    span: 157631:158165
    why: 'States outright the structural claim organizing the whole unit: ordinary goods and high finance operating in the same institution but at different levels.'
  - id: braudel-civilization-capitalism-v2#u05-c5
    heading: 'Piacenza: the anti-market inner circle'
    span: 159046:160264
    why: 'The purest empirical case of Braudel''s anti-market: a closed club of roughly 200 initiates settling tens of millions of ecus in secret with almost no goods or cash present.'
  - id: braudel-civilization-capitalism-v2#u05-c6
    heading: 'Turgot against the fairs: privilege, not nature'
    span: 164070:165084
    why: 'Turgot''s Enlightenment critique states explicitly that fairs run on privilege rather than buyers'' and sellers'' natural interest — the primary source for Braudel''s own market/anti-market distinction.'
- nn: 6
  unit_id: ch01-the-exchanges
  note_id: braudel-civilization-capitalism-v2-ch01-the-exchanges
  span: 176019:219241
  chunks:
  - id: braudel-civilization-capitalism-v2#u06-c1
    heading: 'The name Bourse, from a coat of arms in Bruges'
    span: 176105:176598
    why: 'Establishes Braudel''s opening move: the Exchange''s name is a contingent, local accident even though the institution itself is universal.'
  - id: braudel-civilization-capitalism-v2#u06-c2
    heading: 'Amsterdam was not the first stock market'
    span: 186419:187293
    why: 'States directly the chapter''s revisionist claim that negotiable state debt and forward markets predate Amsterdam by centuries.'
  - id: braudel-civilization-capitalism-v2#u06-c3
    heading: 'Blank buying: speculation without possession'
    span: 190126:190629
    why: 'Isolates the characteristic abstraction of Amsterdam speculation -- selling what one does not own -- as capitalism''s anti-market signature.'
  - id: braudel-civilization-capitalism-v2#u06-c4
    heading: 'China invented paper money; the West made it an accelerator of capitalism'
    span: 215096:215382
    why: 'Braudel''s explicit world-scale comparison: priority of invention is not the same as historical effect, which depends on institutional context.'
  - id: braudel-civilization-capitalism-v2#u06-c5
    heading: 'Kite-flying: extraction through absent price quotation'
    span: 193547:194383
    why: 'Shows the absence of a public, legible price signal functioning as the mechanism by which insiders extract value from small savers.'
- nn: 7
  unit_id: ch01-world-outside-europe-markets-and-bankers
  note_id: braudel-civilization-capitalism-v2-ch01-world-outside-europe-markets-and-bankers
  span: 219241:245543
  chunks:
  - id: braudel-civilization-capitalism-v2#u07-c1
    heading: 'Markets dotted the whole inhabited planet'
    span: 220045:221120
    why: 'States the unit''s opening thesis that markets are a universal, pre-civilizational layer, illustrated with concrete Latin American detail.'
  - id: braudel-civilization-capitalism-v2#u07-c2
    heading: 'The market hierarchy described a social hierarchy'
    span: 227100:228133
    why: 'Delivers Skinner''s key finding, as read by Braudel, that China''s nested market geography mapped directly onto social and civilizational structure.'
  - id: braudel-civilization-capitalism-v2#u07-c3
    heading: 'The Bantam scene Van Leur read as unchanging pedlar trade'
    span: 231784:232612
    why: 'The primary scene Van Leur''s pedlar thesis rests on, which Braudel goes on to reinterpret as evidence of higher-status, capital-backed trade.'
  - id: braudel-civilization-capitalism-v2#u07-c4
    heading: 'Hovhannes''s eleven-year Isfahan-to-Lhasa circuit'
    span: 236791:237728
    why: 'Braudel''s concrete counter-example: a documented, credit-financed long-distance trading career that contradicts the pedlar model.'
  - id: braudel-civilization-capitalism-v2#u07-c5
    heading: 'The saraf system: India''s own bankers'
    span: 241406:242053
    why: 'Defines the Indian banking system and its structural parallel to Western finance, central to the chapter''s world-scale comparison.'
  - id: braudel-civilization-capitalism-v2#u07-c6
    heading: 'Tavernier on ''paying the old with new'''
    span: 244191:245128
    why: 'First-hand merchant testimony on India''s credit-transfer mechanics and compounding interest rates, the chapter''s most concrete proof of a functioning capital market.'
- nn: 8
  unit_id: ch01-few-exchanges-many-fairs-concluding-hypotheses
  note_id: braudel-civilization-capitalism-v2-ch01-few-exchanges-many-fairs-concluding-hypotheses
  span: 245543:274858
  chunks:
  - id: braudel-civilization-capitalism-v2#u08-c1
    heading: 'No Exchanges, but merchant meetings and fairs'
    span: 245572:246034
    why: 'Opens the unit''s frame: the East lacked formal Exchanges but had functionally equivalent, informally discreet merchant gatherings and fairs.'
  - id: braudel-civilization-capitalism-v2#u08-c2
    heading: 'The monsoon-timed fair at Mocha'
    span: 247045:248496
    why: 'A single detailed 1621 account shows how strictly the monsoon calendar governed the Mocha rendezvous, since one ship''s lateness could void the entire fair.'
  - id: braudel-civilization-capitalism-v2#u08-c3
    heading: 'Bantam''s Chinese-run fair, ''like a Stock Exchange'''
    span: 256268:257563
    why: 'A traveller''s own words liken Bantam''s merchant square to a Stock Exchange, and Braudel credits resident Chinese commission agents with a long-distance trade rivalling Europe''s.'
  - id: braudel-civilization-capitalism-v2#u08-c4
    heading: 'The historiographical inequality behind ''why the West'''
    span: 265592:266586
    why: 'Braudel refuses to credit Europe''s early lead to market ''rationalization'' alone, naming the asymmetry in who wrote history first as a confound that distorts the comparison.'
  - id: braudel-civilization-capitalism-v2#u08-c5
    heading: 'The eighteenth-century split: market against anti-market'
    span: 271171:272198
    why: 'States the volume''s central late-development thesis in Braudel''s own terms: an anti-market elite consolidating at the summit against a simultaneously proliferating base of pedlars.'
  - id: braudel-civilization-capitalism-v2#u08-c6
    heading: 'The Western model''s limits outside the West: China, Islam, Japan'
    span: 273989:274856
    why: 'Braudel closes by explicitly limiting his own periodization to the West and naming China as the ''most aberrant case'', ranking Islam and Japan closest to the European pattern.'
- nn: 9
  unit_id: ch02-merchants-trade-circuits-return-journeys
  note_id: braudel-civilization-capitalism-v2-ch02-merchants-trade-circuits-return-journeys
  span: 274858:312413
  chunks:
  - id: braudel-civilization-capitalism-v2#u09-c1
    heading: 'Trade circuits must close like an electrical circuit'
    span: 277098:277553
    why: 'States the unit''s organizing concept — reciprocity as the definition of a trade circuit — via the electrical-circuit metaphor and the merchant maxim ''sale governs purchase''.'
  - id: braudel-civilization-capitalism-v2#u09-c2
    heading: 'The Dutch East India Company''s rolling monopoly circuit'
    span: 283027:283863
    why: 'Shows how real circuits chained many legs together through exclusive buying rights and monopoly exchange currencies, edging from market exchange toward capitalism proper.'
  - id: braudel-civilization-capitalism-v2#u09-c3
    heading: 'Simon Ruiz''s bill-of-exchange arbitrage'
    span: 284913:286285
    why: 'The paradigm case of bills of exchange functioning as disguised, lawful credit closing a circuit that goods alone could not close.'
  - id: braudel-civilization-capitalism-v2#u09-c4
    heading: 'A thirty-year circuit ended by the French Revolution'
    span: 291334:292101
    why: 'Demonstrates the unit''s ''no closure, no deal'' thesis: a routine, decades-long circuit collapses the instant the underlying bill-of-exchange channel is politically severed.'
  - id: braudel-civilization-capitalism-v2#u09-c5
    heading: 'Competing forms for acting through others'
    span: 306498:307207
    why: 'Lays out the institutional menu merchants used to extend reach — factors, subsidiaries, branches, commission agency — the unit''s key answer to how collaboration was organized.'
  - id: braudel-civilization-capitalism-v2#u09-c6
    heading: 'Merchant solidarity as an informal court'
    span: 307820:309066
    why: 'Shows the normative glue — trust and reputational discipline rather than formal law — that made the collaboration described in c5 actually work in practice.'
- nn: 10
  unit_id: ch02-merchant-networks-trading-empires
  note_id: braudel-civilization-capitalism-v2-ch02-merchant-networks-trading-empires
  span: 312413:350882
  chunks:
  - id: braudel-civilization-capitalism-v2#u10-c1
    heading: 'Merchant ''nations'': rivalry within solidarity'
    span: 312450:313071
    why: 'States the unit''s opening thesis -- merchant solidarity was class solidarity coexisting with fierce inter-''nation'' rivalry -- via the Italian colonies at Lyons.'
  - id: braudel-civilization-capitalism-v2#u10-c2
    heading: 'A homeland network versus a dispersed one'
    span: 324811:325107
    why: 'Names the unit''s central structural contrast between the two great diaspora networks: Armenian centralization around Julfa versus Jewish dispersal with no fixed base.'
  - id: braudel-civilization-capitalism-v2#u10-c3
    heading: 'Against Sombart: capitalism was nobody''s invention'
    span: 329405:329668
    why: 'Braudel''s explicit rejection of religiously-essentialist explanations of capitalism, the argumentative hinge for the unit''s controlling-minorities thesis.'
  - id: braudel-civilization-capitalism-v2#u10-c4
    heading: 'Social machinery assigns outsiders the necessary but disreputable work'
    span: 346745:347387
    why: 'Gives Braudel''s own preferred structural explanation for controlling minorities, capped by Sanudo''s line that crystallizes the whole argument.'
  - id: braudel-civilization-capitalism-v2#u10-c5
    heading: 'A minority as a ready-made network'
    span: 349613:350134
    why: 'The unit''s culminating thesis statement: minority status itself functioned as instant commercial infrastructure, illustrated by the Lyons anecdote.'
  - id: braudel-civilization-capitalism-v2#u10-c6
    heading: 'A frustrated network relocates rather than dies'
    span: 341608:342567
    why: 'States the substitution rule Braudel uses to explain how networks survive being pushed out of a region, via the Genoese Black Sea-to-West case.'
- nn: 11
  unit_id: ch02-trading-profits-supply-demand
  note_id: braudel-civilization-capitalism-v2-ch02-trading-profits-supply-demand
  span: 350882:394286
  chunks:
  - id: braudel-civilization-capitalism-v2#u11-c1
    heading: '''Royal merchandise'' and guaranteed profit'
    span: 354660:355125
    why: 'Defines the privileged category of trade goods whose profit is structurally assured, the commercial precondition for what Braudel elsewhere frames as capitalism''s monopoly zone.'
  - id: braudel-civilization-capitalism-v2#u11-c2
    heading: 'High prices as a sign of wealth'
    span: 362721:363435
    why: 'Stacks three period authorities to make the counterintuitive claim that expensive countries are commercially ascendant, not merely burdened.'
  - id: braudel-civilization-capitalism-v2#u11-c3
    heading: 'Turgot''s quadruple schema'
    span: 365205:365956
    why: 'The formal statement that supply and demand are mutually constitutive rather than sequential, the theoretical hinge of the whole unit.'
  - id: braudel-civilization-capitalism-v2#u11-c4
    heading: 'Power over price: the Manila galleon'
    span: 374539:375276
    why: 'Shows Braudel extending the analysis past pure economics into domination, where ''supply and demand'' cease to describe a neutral exchange.'
  - id: braudel-civilization-capitalism-v2#u11-c5
    heading: 'Fisher''s formula for the ancien régime economy'
    span: 391660:392409
    why: 'Braudel''s own preferred synthesis of the supply/demand asymmetry between agriculture and industry, the chapter''s closest thing to a conclusion.'
  - id: braudel-civilization-capitalism-v2#u11-c6
    heading: 'Michelet''s 1842 cotton crisis'
    span: 393030:394285
    why: 'Vivid closing case used to argue that the industrial revolution was fundamentally a revolution in demand, not supply.'
- nn: 12
  unit_id: ch02-markets-and-their-geography
  note_id: braudel-civilization-capitalism-v2-ch02-markets-and-their-geography
  span: 394286:446225
  chunks:
  - id: braudel-civilization-capitalism-v2#u12-c1
    heading: 'Firm catchment areas: Gianfigliazzi to Saminiati'
    span: 395188:397109
    why: 'Establishes the unit''s core method - mapping a merchant firm''s correspondents to read its geographic reach - anchored in four dated, named firms.'
  - id: braudel-civilization-capitalism-v2#u12-c2
    heading: 'Cotrugli''s aphorism and the Fugger founding story'
    span: 398263:399122
    why: 'The unit''s clearest statement that a merchant''s fortune scales with the city he is tied to, illustrated by a dated origin story.'
  - id: braudel-civilization-capitalism-v2#u12-c3
    heading: 'Von Thünen''s rings applied to Caen'
    span: 408877:409185
    why: 'Shows Braudel testing a general spatial model of urban catchment areas against a specific case, and where it holds versus breaks down.'
  - id: braudel-civilization-capitalism-v2#u12-c4
    heading: 'The ''high point'' of a capitalist chain'
    span: 416779:417144
    why: 'States explicitly that a commodity chain has one structurally most profitable link, and that it sits away from production - the unit''s clearest anti-market argument.'
  - id: braudel-civilization-capitalism-v2#u12-c5
    heading: 'China and India as reservoirs for precious metals'
    span: 430406:430799
    why: 'Names the world-scale asymmetry between circulating and hoarding economies using Braudel''s own sponge/graveyard metaphor.'
  - id: braudel-civilization-capitalism-v2#u12-c6
    heading: 'Europe ''bombarding'' closed economies with silver'
    span: 436174:436587
    why: 'Braudel''s own reframing of the silver outflow as an instrument of European commercial power - the unit''s most explicit world-scale comparative claim.'
- nn: 13
  unit_id: ch02-national-economies-balance-of-trade
  note_id: braudel-civilization-capitalism-v2-ch02-national-economies-balance-of-trade
  span: 446225:495927
  chunks:
  - id: braudel-civilization-capitalism-v2#u13-c1
    heading: 'Balance of trade as a map of domination'
    span: 446869:447249
    why: 'States Braudel''s method for the whole chapter: an admittedly crude instrument used because it is the only available map of economic domination and subjection.'
  - id: braudel-civilization-capitalism-v2#u13-c2
    heading: 'The mercantilist maxim (1549)'
    span: 447427:447805
    why: 'Gives the founding mercantilist maxim behind the balance-of-trade doctrine, which Braudel says required no further theoretical refinement.'
  - id: braudel-civilization-capitalism-v2#u13-c3
    heading: 'Anisson''s 1713 revelation'
    span: 459461:459781
    why: 'The sharpest case study of official trade belief diverging from archival fact, undercutting confidence in bilateral balance figures generally.'
  - id: braudel-civilization-capitalism-v2#u13-c4
    heading: 'Lyons fairs as a vacuum pump'
    span: 478515:479188
    why: 'Shows credit and monopoly, not the visible balance sheet, as the real mechanism moving wealth between economies — Braudel''s anti-market capitalism at work.'
  - id: braudel-civilization-capitalism-v2#u13-c5
    heading: 'Bengal and primitive accumulation'
    span: 491119:491482
    why: 'Names the mechanism by which a shift in India''s trade balance became outright colonial plunder, producing the Clive-era ''nabobs.'''
  - id: braudel-civilization-capitalism-v2#u13-c6
    heading: 'Europe upsets the ancient balances'
    span: 495428:495925
    why: 'Braudel''s closing refusal of a single-cause account of India and China''s subjection, and the chapter''s final verdict.'
- nn: 14
  unit_id: ch02-locating-the-market
  note_id: braudel-civilization-capitalism-v2-ch02-locating-the-market
  span: 495927:514144
  chunks:
  - id: braudel-civilization-capitalism-v2#u14-c1
    heading: 'Locating the market''s equivocation'
    span: 495947:497033
    why: 'States the definitional problem the whole unit exists to solve: ''market'' names both loose exchange and a specific historical system.'
  - id: braudel-civilization-capitalism-v2#u14-c2
    heading: 'The self-regulating market as theory'
    span: 497361:498386
    why: 'Lays out the economists'' image of the market as an autonomous mechanism (Smith, Lange''s ''first computer'', D''Avenel) that Braudel will go on to qualify historically.'
  - id: braudel-civilization-capitalism-v2#u14-c3
    heading: 'Against Polanyi''s great transformation'
    span: 503986:505296
    why: 'Braudel''s sharpest methodological objection to Polanyi: the substantivist thesis rests on scattered ethnographic exceptions, not price-history evidence.'
  - id: braudel-civilization-capitalism-v2#u14-c4
    heading: 'Synchronized prices as the test for a market economy'
    span: 506837:507755
    why: 'Braudel''s own empirical, non-theological definition of ''market economy'', dated to well before the Industrial Revolution.'
  - id: braudel-civilization-capitalism-v2#u14-c5
    heading: 'Non-economy, market economy, anti-market'
    span: 513116:514142
    why: 'The chapter''s culminating statement of Braudel''s three-tier model, naming capitalism outright as the anti-market zone.'
- nn: 15
  unit_id: ch03-capital-capitalist-capitalism
  note_id: braudel-civilization-capitalism-v2-ch03-capital-capitalist-capitalism
  span: 514144:563713
  chunks:
  - id: braudel-civilization-capitalism-v2#u15-c1
    heading: 'Why Braudel keeps the word ''capitalism'''
    span: 514699:515352
    why: 'States Braudel''s core methodological justification for using a contested, anachronism-prone word — the argument the whole chapter''s vocabulary study exists to support.'
  - id: braudel-civilization-capitalism-v2#u15-c2
    heading: 'The word ''capital'' in Datini''s Prato and St Bernardino''s Siena'
    span: 519375:519889
    why: 'Grounds the etymology in verbatim primary sources, showing ''capital'' acquiring its economic sense a full four centuries before Turgot and Marx.'
  - id: braudel-civilization-capitalism-v2#u15-c3
    heading: 'Capitalism defined against a surrounding non-capitalism'
    span: 536768:537134
    why: 'The chapter''s real thesis and its clearest resonance with the three-storey-house framework: capitalism as a narrow zone defined by contrast with, not identity to, the surrounding economy.'
  - id: braudel-civilization-capitalism-v2#u15-c4
    heading: 'Capitalism''s native ground: the sphere of circulation'
    span: 516500:516968
    why: 'Names the specific sector — trade, marketing, circulation — that pre-industrial capitalism occupied, setting up the sector-by-sector analysis that structures the rest of the chapter.'
  - id: braudel-civilization-capitalism-v2#u15-c5
    heading: 'Van Storch''s barbarians: fixed vs. circulating capital'
    span: 544723:545838
    why: 'The chapter''s concrete illustration of why circulating capital, not fixed capital, is the immediately decisive constraint on continued production.'
  - id: braudel-civilization-capitalism-v2#u15-c6
    heading: 'Kuznets on the ceiling of durable capital formation'
    span: 557355:558217
    why: 'Supplies the quantitative-historiographic backbone for Braudel''s claim that pre-modern economies structurally could not accumulate durable fixed capital — a limits-of-the-possible-style ceiling.'
- nn: 16
  unit_id: ch03-land-money-seigniorial-regime
  note_id: braudel-civilization-capitalism-v2-ch03-land-money-seigniorial-regime
  span: 563713:607879
  chunks:
  - id: braudel-civilization-capitalism-v2#u16-c1
    heading: 'Land never tells lies: a merchant''s case for buying estates'
    span: 565066:565480
    why: 'Gives the merchant''s own economic rationale for land purchase as a safe haven against maritime, mercantile and credit risk, prior to any question of capitalist agriculture.'
  - id: braudel-civilization-capitalism-v2#u16-c2
    heading: 'The preconditions of capitalist land management'
    span: 568489:569625
    why: 'States outright the unit''s central claim that owning land is not the same as organizing it by capitalism''s rules, and lists the specific conditions that made the difference.'
  - id: braudel-civilization-capitalism-v2#u16-c3
    heading: 'Montaldeo''s fines multiply as other dues decay'
    span: 601137:601431
    why: 'Shows seigniorial power adapting and intensifying through the justice system even as fixed money dues elsewhere eroded to symbolic amounts.'
  - id: braudel-civilization-capitalism-v2#u16-c4
    heading: 'A seigneurie''s afterlife in the landscape'
    span: 587064:588152
    why: 'Braudel''s own village example makes the seigniorial regime''s long survival tangible through disused mills and a place-name outliving the obligation it named.'
  - id: braudel-civilization-capitalism-v2#u16-c5
    heading: 'Freed from serfdom, still bound to serve'
    span: 595879:596259
    why: 'Captures in one anecdote and Braudel''s own ironic gloss how legal emancipation from serfdom left the peasant''s material bondage largely intact.'
  - id: braudel-civilization-capitalism-v2#u16-c6
    heading: 'The capitalist chain of command in Bordeaux and Burgundy vineyards'
    span: 605242:606185
    why: 'The unit''s clearest positive case of land being reorganized by an actual capitalist division of labor, connected to and driven by a distant market.'
- nn: 17
  unit_id: ch03-second-serfdom-american-plantations
  note_id: braudel-civilization-capitalism-v2-ch03-second-serfdom-american-plantations
  span: 607879:644966
  chunks:
  - id: braudel-civilization-capitalism-v2#u17-c1
    heading: 'Compulsory labour as an ever-tightening machine'
    span: 612177:612678
    why: 'States the second serfdom''s coercive mechanics in Braudel''s own terms before he supplies the capitalist reading of them.'
  - id: braudel-civilization-capitalism-v2#u17-c2
    heading: 'The landlord as tool and collaborator of capitalism'
    span: 619253:619674
    why: 'The unit''s thesis sentence: the landlord is not a capitalist but is nonetheless capitalism''s instrument, via the Segovia sheep-breeder analogy.'
  - id: braudel-civilization-capitalism-v2#u17-c3
    heading: 'Neither feudalism nor capitalist agriculture: a monopoly economy'
    span: 622579:623078
    why: 'Braudel''s explicit adjudication of the section''s title question, naming the third category the second serfdom actually occupies.'
  - id: braudel-civilization-capitalism-v2#u17-c4
    heading: 'The Brazilian engenho: touching only the market economy'
    span: 626331:627259
    why: 'A near-programmatic statement of the market-economy/capitalism split, transplanted to the plantation case.'
  - id: braudel-civilization-capitalism-v2#u17-c5
    heading: 'Bordeaux merchants as masters of the machine'
    span: 635222:635547
    why: 'Names the merchant chain, not the planter, as the actual seat of capitalist control over the plantation.'
  - id: braudel-civilization-capitalism-v2#u17-c6
    heading: 'Jamaica as a wealth-creating machine'
    span: 641081:642002
    why: 'Braudel''s most explicit machine-language for the plantation system, paired with Burke''s own account of the colony as captive home trade.'
- nn: 18
  unit_id: ch03-heart-of-europe-capitalist-agriculture
  note_id: braudel-civilization-capitalism-v2-ch03-heart-of-europe-capitalist-agriculture
  span: 644966:687194
  chunks:
  - id: braudel-civilization-capitalism-v2#u18-c1
    heading: 'The four criteria of capitalist agriculture (Norfolk model)'
    span: 647616:648700
    why: 'Establishes Braudel''s own working definition of capitalist agriculture, the yardstick every later regional case in the unit is measured against.'
  - id: braudel-civilization-capitalism-v2#u18-c2
    heading: 'Brie: capitalist hierarchy, frozen technology'
    span: 651578:652128
    why: 'Shows a genuine capitalist tenant-and-wage-labour hierarchy coexisting with static technology, Braudel''s key decoupling of social organization from technical change.'
  - id: braudel-civilization-capitalism-v2#u18-c3
    heading: 'Venice: contemporaries already say ''capitalisti'''
    span: 656893:657390
    why: 'Direct contemporary testimony that ''capitalist'' is not an anachronistic label imposed on eighteenth-century Venetian estate agriculture.'
  - id: braudel-civilization-capitalism-v2#u18-c4
    heading: 'Sismondi on the Roman Campagna''s migrant labour system'
    span: 663519:665294
    why: 'An eyewitness account of finely divided migrant labour that Braudel uses to complicate Adam Smith''s claim that division of labour does not apply to agriculture.'
  - id: braudel-civilization-capitalism-v2#u18-c5
    heading: 'The Tuscan podere: rational but not proletarian'
    span: 673399:674235
    why: 'States the unit''s crucial qualification: capitalist rationality and profit orientation on the podere coexist with a sharecropper who is not a wage-labourer.'
  - id: braudel-civilization-capitalism-v2#u18-c6
    heading: 'Doria on baronial power in the kingdom of Naples'
    span: 676868:677384
    why: 'Grounds the unit''s counter-current: vast regions of Europe''s periphery remained gripped by intensified, near-sovereign feudal power even as capitalist agriculture advanced elsewhere.'
- nn: 19
  unit_id: ch03-fourfold-classification-pre-industry
  note_id: braudel-civilization-capitalism-v2-ch03-fourfold-classification-pre-industry
  span: 687194:722103
  chunks:
  - id: braudel-civilization-capitalism-v2#u19-c1
    heading: 'Category A: the family workshop'
    span: 688595:689750
    why: 'Defines Bourgin''s baseline category and states directly that these units sat half outside the market economy, the passage the rest of the unit''s classification builds on.'
  - id: braudel-civilization-capitalism-v2#u19-c2
    heading: 'Category B: the merchant-entrepreneur''s dispersed manufacture'
    span: 691132:692143
    why: 'Shows the merchant-entrepreneur coordinating dispersed artisan labor and capturing the profit, a miniature portrait of capitalism as coordination-and-credit rather than production.'
  - id: braudel-civilization-capitalism-v2#u19-c3
    heading: 'Skilled workforce, simple tools in China and India'
    span: 700661:701113
    why: 'Carries the unit''s limits-of-the-possible argument: China and India''s rich craft skill coexisted with minimal tooling because labor, not capital, was the cheap factor.'
  - id: braudel-civilization-capitalism-v2#u19-c4
    heading: 'The calendar dictates the trade'
    span: 706454:706942
    why: 'States plainly that agricultural seasons, not industrial logic, governed when pre-industrial work happened, the unit''s key claim against a clean industry/agriculture boundary.'
  - id: braudel-civilization-capitalism-v2#u19-c5
    heading: 'Industry as necessity''s child'
    span: 710172:710739
    why: 'Savary des Bruslons''s aphorism is the unit''s thesis on industry''s origins condensed into one quotable line, used to reframe Colbert''s supposed achievement as economic necessity.'
  - id: braudel-civilization-capitalism-v2#u19-c6
    heading: 'Rootless men'
    span: 712742:713001
    why: 'Mirabeau''s phrase captures the structural precarity of the artisan workforce that the unit''s closing sections document with migration and state-policy evidence.'
- nn: 20
  unit_id: ch03-merchants-guilds-verlagssystem
  note_id: braudel-civilization-capitalism-v2-ch03-merchants-guilds-verlagssystem
  span: 722103:759889
  chunks:
  - id: braudel-civilization-capitalism-v2#u20-c1
    heading: 'Nicholas Barbon on fashion as ''the life and soul of commerce'''
    span: 724212:724822
    why: 'Gives the strongest primary-source case for textiles as the pre-industrial economy''s closest thing to a key industry, via a contemporary (1690) voice rather than Braudel''s own summary.'
  - id: braudel-civilization-capitalism-v2#u20-c2
    heading: 'The Zunftrevolution ends in merchant victory'
    span: 733115:733878
    why: 'States outright that the guild-versus-merchant conflict was a real class struggle resolved by merchant domination, the load-bearing claim behind the whole guild-capture argument.'
  - id: braudel-civilization-capitalism-v2#u20-c3
    heading: 'Defining the Verleger, and its 1275 first trace'
    span: 737119:737669
    why: 'The unit''s operational definition of the Verlagssystem plus its earliest documentary evidence, establishing both the mechanism and its much-earlier-than-assumed origin.'
  - id: braudel-civilization-capitalism-v2#u20-c4
    heading: 'The spider''s web that did not catch everything'
    span: 743166:743708
    why: 'The unit''s central image for merchant capital''s reach into cottage industry, immediately self-qualified to flag the uneven, incomplete nature of that capture.'
  - id: braudel-civilization-capitalism-v2#u20-c5
    heading: 'The Gevaudan: cash markets resisting the putter-out'
    span: 744641:745190
    why: 'The concrete case study of a region whose local cash-payment custom kept merchant capital''s Verlagssystem out, the clearest counter-example to the spider''s-web claim.'
  - id: braudel-civilization-capitalism-v2#u20-c6
    heading: 'Mining and the emergence of a genuine proletariat'
    span: 758275:758654
    why: 'Braudel''s most direct claim that mining, not textiles or guild crafts, is where a real wage-dependent working class first forms under merchant capital.'
- nn: 21
  unit_id: ch03-mining-manufactories-finance
  note_id: braudel-civilization-capitalism-v2-ch03-mining-manufactories-finance
  span: 759889:798053
  chunks:
  - id: braudel-civilization-capitalism-v2#u21-c1
    heading: 'Mining''s retreat to the periphery'
    span: 759913:760850
    why: 'States the unit''s opening thesis: capital exited European extraction under ecological and cost pressure and relocated it to dependent peripheries worldwide.'
  - id: braudel-civilization-capitalism-v2#u21-c2
    heading: 'Profit lives in the trading chain, not the mine'
    span: 764276:764867
    why: 'Names the market-economy/capitalism split explicitly: extraction stayed thin-margin while the long-distance supply chain captured the real profit.'
  - id: braudel-civilization-capitalism-v2#u21-c3
    heading: 'Iron stayed in landowners'' hands, not merchants'''
    span: 765405:765953
    why: 'Documents merchant capital''s near-total absence from iron production, sharpening the contrast between extraction''s market character and capitalism''s commercial concentration.'
  - id: braudel-civilization-capitalism-v2#u21-c4
    heading: 'The mercantilist state manufactures manufactories'
    span: 777695:778694
    why: 'Establishes that manufactory growth depended on state ''bullionist'' policy and royal privilege rather than organic market expansion.'
  - id: braudel-civilization-capitalism-v2#u21-c5
    heading: 'Van Robais: the manufactory is not there for them'
    span: 789208:789663
    why: 'Captures the labor-discipline logic of the capitalist manufactory in the subdelegue''s own inverted formula, and shows the state''s armed force backing it.'
  - id: braudel-civilization-capitalism-v2#u21-c6
    heading: 'Saint-Gobain''s capital passes from financiers to rentiers'
    span: 797417:798050
    why: 'Documents the shift from active entrepreneurial financing to passive noble rentier ownership as the enterprise matured, a structural pattern beyond this single case.'
- nn: 22
  unit_id: ch03-industrial-profits-overland-transport
  note_id: braudel-civilization-capitalism-v2-ch03-industrial-profits-overland-transport
  span: 798053:830452
  chunks:
  - id: braudel-civilization-capitalism-v2#u22-c1
    heading: 'Commerce dwarfing industrial gain'
    span: 798933:799996
    why: 'States the unit''s central claim — commerce structurally dwarfed industrial profit — and immediately tests it against the concrete Caen lace case.'
  - id: braudel-civilization-capitalism-v2#u22-c2
    heading: 'Call for a methodical model of profit'
    span: 801550:801965
    why: 'Braudel''s explicit methodological program for measuring historical profit rates, framed as a successor to Simiand and Labrousse''s price history.'
  - id: braudel-civilization-capitalism-v2#u22-c3
    heading: 'Hoffmann''s three-stage law'
    span: 808589:809001
    why: 'The clearest theoretical statement of the industrial ''parabola'' pattern, generalized from Caen to two centuries of British industry.'
  - id: braudel-civilization-capitalism-v2#u22-c4
    heading: 'Sombart''s tonnage calculation'
    span: 816000:816873
    why: 'The empirical core of the transport argument, inverting the assumed primacy of inland waterways over roads.'
  - id: braudel-civilization-capitalism-v2#u22-c5
    heading: 'Merchants swimming with the current'
    span: 830064:830450
    why: 'Names the reason transport stayed unrationalized: fragmented competition among hauliers let merchants, not carriers, set the price.'
- nn: 23
  unit_id: ch03-river-sea-transport-balance-sheet
  note_id: braudel-civilization-capitalism-v2-ch03-river-sea-transport-balance-sheet
  span: 830452:870116
  chunks:
  - id: braudel-civilization-capitalism-v2#u23-c1
    heading: 'River traffic''s real pace'
    span: 830700:832106
    why: 'Shows the material friction behind pre-industrial river transport — slowness, tolls, and hazards — that undercuts any easy story of a cheap, efficient inland waterway network.'
  - id: braudel-civilization-capitalism-v2#u23-c2
    heading: 'The ship as a joint venture'
    span: 843258:843461
    why: 'Gives Braudel''s medieval sources (Bergen, Oleron, Olonne) for the archaic communal ownership form — a ship sailed communiter, as a joint venture among several companions — that later gives way to divisible capital shares.'
  - id: braudel-civilization-capitalism-v2#u23-c3
    heading: 'A miniature republic with no book-keeping'
    span: 844410:845916
    why: 'Details the self-governing, bookkeeping-free miniature republic of the medieval ship''s crew, the clearest picture in the unit of a pre-capitalist, custom-bound economic form.'
  - id: braudel-civilization-capitalism-v2#u23-c4
    heading: 'From per loca to per partes'
    span: 847086:848442
    why: 'Documents the shift from per loca joint ownership to per partes carat-shares once hulls outgrew what venturer-crews could finance — the birth of tradable, absentee-held maritime capital.'
  - id: braudel-civilization-capitalism-v2#u23-c5
    heading: 'The grosse aventure loan'
    span: 849021:850253
    why: 'Explains the grosse aventure loan, an insured maritime loan at 30-50% interest that let the lender profit whichever way the voyage went — Braudel''s clearest example of maritime credit operating independently of the voyage''s real risk.'
  - id: braudel-civilization-capitalism-v2#u23-c6
    heading: 'A rather negative balance sheet'
    span: 866823:867960
    why: 'States the chapter''s thesis directly: pre-industrial capitalism''s balance sheet in production was negative because the important merchant stayed a creature of distribution and market position, not production.'
- nn: 24
  unit_id: ch04-trade-hierarchy-and-success
  note_id: braudel-civilization-capitalism-v2-ch04-trade-hierarchy-and-success
  span: 870116:898219
  chunks:
  - id: braudel-civilization-capitalism-v2#u24-c1
    heading: 'Capitalism''s commanding heights'
    span: 871257:871805
    why: 'States capitalism''s defining feature (monopoly, price manipulation, commanding position) that the unit''s argument about hierarchy and non-specialization goes on to elaborate.'
  - id: braudel-civilization-capitalism-v2#u24-c2
    heading: 'A hierarchy inscribed in vocabulary'
    span: 875000:876502
    why: 'Braudel''s clearest world-scale comparative move in this unit, showing the merchant/shopkeeper divide encoded in the vocabulary of every major trading civilization.'
  - id: braudel-civilization-capitalism-v2#u24-c3
    heading: 'The wholesaler''s paradox: refusing to specialize'
    span: 881602:882847
    why: 'States and defends the unit''s most counterintuitive claim, that the wholesaler alone resists the specialization overtaking every other rung of the trade hierarchy.'
  - id: braudel-civilization-capitalism-v2#u24-c4
    heading: 'Eclecticism as the top''s true advantage'
    span: 885477:886277
    why: 'Extends the non-specialization thesis across centuries and gives Braudel''s own explanation: eclecticism, not caution, is the privilege of the commanding heights.'
  - id: braudel-civilization-capitalism-v2#u24-c5
    heading: 'Success starts with capital'
    span: 890566:891745
    why: 'Grounds the ''success in trade'' section''s central claim that capital begets capital, illustrated with concrete cases of young merchants launched by paternal money.'
  - id: braudel-civilization-capitalism-v2#u24-c6
    heading: 'The credit line that defines capitalism'
    span: 896630:897684
    why: 'Names explicitly the credit-access line that separates ordinary commerce from capitalism proper, the unit''s most direct statement of the market/anti-market divide.'
- nn: 25
  unit_id: ch04-credit-banking-and-money
  note_id: braudel-civilization-capitalism-v2-ch04-credit-banking-and-money
  span: 898219:936340
  chunks:
  - id: braudel-civilization-capitalism-v2#u25-c1
    heading: 'Accumulate, accumulate — capitalism as capital-utilization'
    span: 898241:899561
    why: 'States Braudel''s core thesis that capitalism is measured by capital-utilization, and ties the pan-European fall in interest rates to over-accumulated capital rather than scarcity.'
  - id: braudel-civilization-capitalism-v2#u25-c2
    heading: 'The money of the innocent: small savers and micro-investors'
    span: 900737:901275
    why: 'Concrete evidence for who put up the money — valets and domestic servants investing modest sums alongside merchants, extending capital-supply down to society''s humblest ranks.'
  - id: braudel-civilization-capitalism-v2#u25-c3
    heading: 'Louvet''s rounds: credit as a personal, reputational favor'
    span: 906386:907607
    why: 'Dramatizes how, despite abundant Parisian capital, credit remained a fragile, personalized, socially-suspect relationship rather than an institutionalized market.'
  - id: braudel-civilization-capitalism-v2#u25-c4
    heading: 'Three occasions in the West: Florence, Genoa, Amsterdam'
    span: 912105:913019
    why: 'Frames Braudel''s comparative thesis that Western banking took off three times and collapsed each time short of institutionalizing financial capitalism, which structures the entire section.'
  - id: braudel-civilization-capitalism-v2#u25-c5
    heading: 'The mill-wheel submerged: why the Genoese system collapsed'
    span: 920697:921644
    why: 'Gives Braudel''s own preferred mechanism — a glut of specie erasing the discount-rate differentials bills of exchange depended on — for why the Genoese credit system collapsed around 1622.'
  - id: braudel-civilization-capitalism-v2#u25-c6
    heading: 'Hoarded piastres: a 1708 informant''s letter from Rennes'
    span: 926349:927067
    why: 'A primary-source letter capturing hoarding in real time, grounding the section''s closing argument about circulation-versus-hiding in lived contemporary testimony.'
- nn: 26
  unit_id: ch04-capitalist-mentality-and-long-distance-trade
  note_id: braudel-civilization-capitalism-v2-ch04-capitalist-mentality-and-long-distance-trade
  span: 936340:981821
  chunks:
  - id: braudel-civilization-capitalism-v2#u26-c1
    heading: 'Capitalism as strategic choice, not mere market response'
    span: 936374:936929
    why: 'States Braudel''s thesis for the volume: capitalist superiority is the strategic freedom to choose and revise its field of action, not a fixed set of practices or traits.'
  - id: braudel-civilization-capitalism-v2#u26-c2
    heading: 'Rejecting single-factor explanations of capitalism'
    span: 941589:942305
    why: 'Braudel''s explicit rejection of Sombart''s and Weber''s mentality-based explanations, insisting capitalism emerged from an irreducible mix of economic, political, social, and cultural causes.'
  - id: braudel-civilization-capitalism-v2#u26-c3
    heading: 'Distance and mutual ignorance as the source of super-profits'
    span: 948792:949459
    why: 'Gives the concrete mechanism of long-distance-trade super-profits: price multiplication across mutually ignorant, distant markets bridged only by the middleman.'
  - id: braudel-civilization-capitalism-v2#u26-c4
    heading: 'Information as capital, from 1360 to 1973'
    span: 964941:966577
    why: 'Braudel''s longue-duree move, showing the same informational advantage operating identically in a 1360 merchant manual, 1777 Amsterdam speculation, and a 1973 financial newsletter.'
  - id: braudel-civilization-capitalism-v2#u26-c5
    heading: 'Merchant schooling and the numerate infrastructure of trade'
    span: 957031:958047
    why: 'Documents the literate and numerate infrastructure -- schooling, arithmetic, double-entry bookkeeping -- that had to exist before capitalist informational advantage could be exercised.'
  - id: braudel-civilization-capitalism-v2#u26-c6
    heading: 'The Dunkerque quay rule: monopoly built into market machinery'
    span: 980347:981243
    why: 'A concrete case of a market''s own procedural rules engineered to create a captive, non-competitive segment for the wealthy -- the anti-market operating inside a nominally open market.'
- nn: 27
  unit_id: ch04-monopolies-currency-and-profits
  note_id: braudel-civilization-capitalism-v2-ch04-monopolies-currency-and-profits
  span: 981821:1026312
  chunks:
  - id: braudel-civilization-capitalism-v2#u27-c1
    heading: 'Entry requirements for international monopoly'
    span: 982232:982814
    why: 'Defines the entry barriers - capital, information, and complicit associates - that make international monopoly capitalism''s structural default rather than an occasional abuse of free trade.'
  - id: braudel-civilization-capitalism-v2#u27-c2
    heading: 'The Hope & Co. cochineal plan and its failure'
    span: 997237:998255
    why: 'The Hope & Co. cochineal fiasco is Braudel''s own counter-example, showing that even the best-capitalized monopolist could misjudge the market and lose.'
  - id: braudel-civilization-capitalism-v2#u27-c3
    heading: 'Braudel against Klein: domination, not security'
    span: 999864:1001176
    why: 'Braudel''s direct rebuttal of Klein''s Schumpeterian defense of monopoly states his central thesis in the sharpest terms: monopoly serves domination, not economic security.'
  - id: braudel-civilization-capitalism-v2#u27-c4
    heading: 'Gold and silver as a hidden currency privilege'
    span: 1001361:1002338
    why: 'Shows that ordinary bimetallic and base/high coinage circulation was itself a structural, near-invisible transfer of wealth to those who held gold and silver.'
  - id: braudel-civilization-capitalism-v2#u27-c5
    heading: 'Mathon de la Cour on inflation as class weapon'
    span: 1011299:1012272
    why: 'Mathon de la Cour''s 1788 verdict, quoted at length by Braudel, is the unit''s clearest statement that inflation redistributes from wage-earners to the rich rather than enriching nations as a whole.'
  - id: braudel-civilization-capitalism-v2#u27-c6
    heading: 'Capitalism''s unlimited flexibility'
    span: 1025070:1026310
    why: 'States Braudel''s overarching thesis for the whole book: capitalism''s defining trait across centuries is its capacity to shift between trade, industry, and land whenever profit rates decline.'
- nn: 28
  unit_id: ch04-individual-firms-and-joint-stock
  note_id: braudel-civilization-capitalism-v2-ch04-individual-firms-and-joint-stock
  span: 1026312:1053600
  chunks:
  - id: braudel-civilization-capitalism-v2#u28-c1
    heading: 'Firms versus companies: market economy and capitalism distinguished'
    span: 1026563:1027125
    why: 'States the chapter''s organizing distinction between the individual firm (market economy) and the state-entangled trading company (capitalism proper).'
  - id: braudel-civilization-capitalism-v2#u28-c2
    heading: 'The societas maris / commenda'
    span: 1028180:1029153
    why: 'Describes the earliest Western partnership form and Braudel''s caution against reading it as a clean capital/labour split.'
  - id: braudel-civilization-capitalism-v2#u28-c3
    heading: 'The compagnia as family firm and capitalist instrument'
    span: 1032068:1032984
    why: 'Defines the compagnia''s kinship structure and joint liability, and shows how family firms like the Bardi achieved continent-spanning power.'
  - id: braudel-civilization-capitalism-v2#u28-c4
    heading: 'Limited liability made operational'
    span: 1041374:1042174
    why: 'Pairs the 1673 ordinance''s abstract liability-capping language with a concrete 1786 contract, showing the commandite doctrine in practice.'
  - id: braudel-civilization-capitalism-v2#u28-c5
    heading: 'The joint stock company defined, with medieval antecedents'
    span: 1043277:1043985
    why: 'Gives Braudel''s definition of the joint stock form and pushes its ancestry back centuries before the Muscovy Company, the usual textbook starting point.'
  - id: braudel-civilization-capitalism-v2#u28-c6
    heading: 'The family-patriarchal firm persists beneath formal progress'
    span: 1052388:1053598
    why: 'Delivers Braudel''s real thesis: despite the formal legal evolution just traced, most firms remained small family households until the state drove scale.'
- nn: 29
  unit_id: ch04-great-merchant-companies
  note_id: braudel-civilization-capitalism-v2-ch04-great-merchant-companies
  span: 1053600:1084685
  chunks:
  - id: braudel-civilization-capitalism-v2#u29-c1
    heading: 'Forerunners of the great companies'
    span: 1054151:1055021
    why: 'States the unit''s core thesis: state-privileged, capital-intensive monopoly trade predates the seventeenth-century companies by centuries.'
  - id: braudel-civilization-capitalism-v2#u29-c2
    heading: 'The rule of three'
    span: 1057362:1057777
    why: 'Gives Braudel''s explicit analytic framework (state, capital, trading zone) for explaining why companies succeeded or failed.'
  - id: braudel-civilization-capitalism-v2#u29-c3
    heading: 'The Merchant Adventurers as a regulated company'
    span: 1069168:1069670
    why: 'Illustrates the older guild-like ''regulated company'' form Braudel contrasts with true joint-stock capitalism.'
  - id: braudel-civilization-capitalism-v2#u29-c4
    heading: 'The French companies'' mistimed failure'
    span: 1074027:1074557
    why: 'Shows Braudel''s chronology-driven explanation for why French companies collapsed while Dutch and English ones thrived.'
  - id: braudel-civilization-capitalism-v2#u29-c5
    heading: 'Against the minimizers'
    span: 1080712:1081346
    why: 'Braudel''s direct rebuttal to historians who use the companies'' small share of national income to dismiss their historical importance.'
  - id: braudel-civilization-capitalism-v2#u29-c6
    heading: 'The eighteenth-century case for free trade'
    span: 1081347:1082553
    why: 'Documents the shift from tolerated to ''intolerable and scandalous'' monopoly, through the deputies'' own free-trade arguments.'
- nn: 30
  unit_id: ch04-threefold-division
  note_id: braudel-civilization-capitalism-v2-ch04-threefold-division
  span: 1084685:1093391
  chunks:
  - id: braudel-civilization-capitalism-v2#u30-c1
    heading: 'Restating the threefold division'
    span: 1084714:1085443
    why: 'States Braudel''s foundational three-tier model (material life / market economy / capitalism) that the whole unit works to locate and complicate.'
  - id: braudel-civilization-capitalism-v2#u30-c2
    heading: 'Grain in the Amsterdam warehouse: market good becomes capitalist counter'
    span: 1086822:1087403
    why: 'The Baltic grain example is Braudel''s clearest empirical demonstration that the same physical commodity crosses from market economy to capitalism the moment it is hoarded and redirected by rich merchants rather than sold on the open market.'
  - id: braudel-civilization-capitalism-v2#u30-c3
    heading: 'Luther, Ricard, Busch, Zola: contemporaries sensing the frontier'
    span: 1087998:1089623
    why: 'Four historical witnesses across three centuries show that contemporaries themselves felt a moral line between market exchange and speculation, corroborating Braudel''s frontier as lived experience rather than a retrospective category.'
  - id: braudel-civilization-capitalism-v2#u30-c4
    heading: 'Galiani: regular oil and wine versus risky, monopolized grain'
    span: 1090689:1092027
    why: 'Galiani''s oil/wine-versus-grain comparison supplies Braudel''s clearest mechanism for why capitalism forms where it does: risk sorts commodities into small-trader ''routine'' and monopolist ''speculation'' tiers.'
  - id: braudel-civilization-capitalism-v2#u30-c5
    heading: 'Grain across all three levels at once'
    span: 1092686:1093389
    why: 'Braudel''s closing move shows the threefold schema classifies the conditions of an exchange rather than the kind of good traded — grain itself passes through every level depending on distance and crisis.'
- nn: 31
  unit_id: ch05-opening-hierarchies-vertical-elevation
  note_id: braudel-civilization-capitalism-v2-ch05-opening-hierarchies-vertical-elevation
  span: 1093391:1130609
  chunks:
  - id: braudel-civilization-capitalism-v2#u31-c1
    heading: 'Society as a ''set of sets'''
    span: 1095883:1097091
    why: 'Braudel''s own definition of society as a superordinate ''set of sets'' (economy, hierarchy, state, culture) is the chapter''s governing method and the unit''s central concept.'
  - id: braudel-civilization-capitalism-v2#u31-c2
    heading: 'No society without hierarchy'
    span: 1106379:1107187
    why: 'The ''no King'' anecdotes are Braudel''s evidence that hierarchy is a cross-cultural constant, even where observers initially perceived its absence.'
  - id: braudel-civilization-capitalism-v2#u31-c3
    heading: 'Not one society but several'
    span: 1112919:1113282
    why: 'This aphoristic summary is the chapter''s clearest statement of the pluralism thesis, capping the five-societies analysis of feudal Europe.'
  - id: braudel-civilization-capitalism-v2#u31-c4
    heading: 'Vertical elevation: the privileged few'
    span: 1115725:1117521
    why: 'This opens the chapter''s second major thesis, that a tiny elite invariably captures ''the commanding heights of society'' regardless of political form.'
  - id: braudel-civilization-capitalism-v2#u31-c5
    heading: 'Venice and Genoa: the elite quantified'
    span: 1119607:1120836
    why: 'The first concrete data points (Venetian Nobili, Genoese nobility) in Braudel''s comparative statistical run, turning the ''law'' of elite concentration from assertion into demonstration.'
- nn: 32
  unit_id: ch05-social-mobility-pirenne
  note_id: braudel-civilization-capitalism-v2-ch05-social-mobility-pirenne
  span: 1130609:1156338
  chunks:
  - id: braudel-civilization-capitalism-v2#u32-c1
    heading: 'Crisis-driven elite replacement: the Wars of the Roses'
    span: 1132959:1134021
    why: 'Braudel''s clearest worked case of crisis compressing normally invisible elite turnover into a single legible event.'
  - id: braudel-civilization-capitalism-v2#u32-c2
    heading: 'Bourdieu, reproduction, and the persistence of hierarchy'
    span: 1135999:1136635
    why: 'States Braudel''s governing assumption that social change mostly reproduces the prior hierarchy rather than displacing it.'
  - id: braudel-civilization-capitalism-v2#u32-c3
    heading: 'A synchronized European rhythm of mobility, 1470-1580'
    span: 1144067:1144888
    why: 'Names the unit''s actually surprising claim: mobility ran on a loosely shared European timetable despite national time-lags.'
  - id: braudel-civilization-capitalism-v2#u32-c4
    heading: 'Pirenne: no such thing as a capitalist dynasty'
    span: 1147437:1148327
    why: 'States the thesis the whole second half of the unit tests and ultimately qualifies.'
  - id: braudel-civilization-capitalism-v2#u32-c5
    heading: 'Braudel''s rebuttal: capital advances by stages within capitalism'
    span: 1151064:1151865
    why: 'Braudel''s central objection to Pirenne, distinguishing the merchant from the capitalist and anticipating the market/capitalism distinction.'
  - id: braudel-civilization-capitalism-v2#u32-c6
    heading: 'Not individuals but groups: the Languedoc financiers'
    span: 1154101:1154901
    why: 'Braudel''s concrete resolution of the Pirenne debate, relocating the cycle from family biography to collective, long-term structure.'
- nn: 33
  unit_id: ch05-gentry-noblesse-de-robe-luxury
  note_id: braudel-civilization-capitalism-v2-ch05-gentry-noblesse-de-robe-luxury
  span: 1156338:1188689
  chunks:
  - id: braudel-civilization-capitalism-v2#u33-c1
    heading: 'Longue durée as method'
    span: 1156377:1156886
    why: 'States Braudel''s structural-historical method up front, framing the French gentry case study that follows as a test of that premise.'
  - id: braudel-civilization-capitalism-v2#u33-c2
    heading: 'Defining the ''gentry'''
    span: 1157376:1158449
    why: 'Braudel''s working definition of Huppert''s contested term, distinguishing the gentry from both court aristocracy and rural nobility.'
  - id: braudel-civilization-capitalism-v2#u33-c3
    heading: 'A no-man''s-land of ennoblement'
    span: 1162846:1163731
    why: 'Documents the pre-1600 informal, witness-based route into nobility that the post-1600 documentary regime would foreclose.'
  - id: braudel-civilization-capitalism-v2#u33-c4
    heading: 'Post-1600 genealogical scrutiny'
    span: 1169673:1170015
    why: 'Marks the hardening into documentary, legible proof of noble status that produces the noblesse de robe proper.'
  - id: braudel-civilization-capitalism-v2#u33-c5
    heading: 'A bourgeois indictment of the nobility'
    span: 1165145:1166130
    why: 'Coquault''s 1650 diary entry is the clearest first-person statement of bourgeois self-regard set against a nobility it judged morally inferior.'
  - id: braudel-civilization-capitalism-v2#u33-c6
    heading: 'Venice''s discreet nobility'
    span: 1177382:1178676
    why: 'Concrete evidence for the city-state logic of deliberate modesty, including the mask as a device of social leveling.'
- nn: 34
  unit_id: ch05-revolutions-workers-revolts-order
  note_id: braudel-civilization-capitalism-v2-ch05-revolutions-workers-revolts-order
  span: 1188689:1217728
  chunks:
  - id: braudel-civilization-capitalism-v2#u34-c1
    heading: 'Quantifying five centuries of revolt'
    span: 1190569:1191202
    why: 'Establishes Braudel''s core empirical claim that popular unrest was a continuous baseline condition of the social order, not an aberration, framing the chapter''s central puzzle.'
  - id: braudel-civilization-capitalism-v2#u34-c2
    heading: 'The Lyons printers strike'
    span: 1200914:1202113
    why: 'The unit''s fullest concrete account of organized worker resistance (the Griffarins, the Printer''s Devil), immediately undercut by defeat, illustrating the pattern of sophisticated but losing revolt.'
  - id: braudel-civilization-capitalism-v2#u34-c3
    heading: 'Master-printers did not represent capital'
    span: 1199288:1199913
    why: 'States Braudel''s market/capitalism distinction in miniature: capital-owning masters are themselves dependent on merchant financiers, directly resonant with the three-storey-house framework.'
  - id: braudel-civilization-capitalism-v2#u34-c4
    heading: 'Employer cartel versus enforced worker silence'
    span: 1208508:1209181
    why: 'Shows an organized employer cartel far outpacing prohibited worker organization, with Braudel''s explicit argument that enforced silence is not evidence of acceptance.'
  - id: braudel-civilization-capitalism-v2#u34-c5
    heading: 'Revolutionary ideology and the invisibility of capital''s privilege'
    span: 1214598:1215701
    why: 'The unit''s payoff argument: Enlightenment revolutionary language dismantled aristocratic privilege while leaving capitalist privilege unnamed and unexamined.'
  - id: braudel-civilization-capitalism-v2#u34-c6
    heading: 'The Clothier''s Delight'
    span: 1210421:1211820
    why: 'A rare direct trace of class-conflict ideology in workers'' own popular culture, voicing the clothiers'' exploitative logic and closing the unit''s argument about an entrenched class barrier.'
- nn: 35
  unit_id: ch05-below-subsistence-climbing-out-of-hell
  note_id: braudel-civilization-capitalism-v2-ch05-below-subsistence-climbing-out-of-hell
  span: 1217728:1242401
  chunks:
  - id: braudel-civilization-capitalism-v2#u35-c1
    heading: 'The sub-proletariat, worldwide and in "free" Europe'
    span: 1217752:1219031
    why: 'Sets the unit''s comparative frame and immediately qualifies European ''freedom'' with serfdom and life-bound labour.'
  - id: braudel-civilization-capitalism-v2#u35-c2
    heading: 'An economy powerless to create full employment'
    span: 1219032:1219800
    why: 'States the unit''s core causal claim: the permanent sub-proletariat is a structural product of the economy, not just of social evils.'
  - id: braudel-civilization-capitalism-v2#u35-c3
    heading: 'The ''worthy poor'' and the ''unworthy poor'''
    span: 1220902:1221407
    why: 'A first-hand 1652 account showing the pauper/beggar moral distinction as it was actually applied, not just categorized.'
  - id: braudel-civilization-capitalism-v2#u35-c4
    heading: 'Imprisonment and forced labour as forms of slavery'
    span: 1227526:1228061
    why: 'Braudel''s own rhetorical claim that seventeenth-century carceral institutions across Europe were slavery under another name.'
  - id: braudel-civilization-capitalism-v2#u35-c5
    heading: 'The floating population as an anti-society'
    span: 1234035:1235366
    why: 'Describes a population that deliberately evades re-capture into dependency, the unit''s clearest capture-resistance resonance, qualified as a rabble rather than an organized class.'
  - id: braudel-civilization-capitalism-v2#u35-c6
    heading: 'Climbing out of hell: crime, army, domestic service'
    span: 1237537:1238748
    why: 'Lays out the only three escape routes from destitution, each one a substitute hierarchy rather than an escape from hierarchy.'
- nn: 36
  unit_id: ch05-all-pervasive-state-borrowing-castile
  note_id: braudel-civilization-capitalism-v2-ch05-all-pervasive-state-borrowing-castile
  span: 1242401:1269413
  chunks:
  - id: braudel-civilization-capitalism-v2#u36-c1
    heading: 'The three tasks of the state'
    span: 1245489:1246915
    why: 'States Braudel''s explicit, civilization-general definition of what a state permanently does: monopolize legitimate violence, control economic circulation, and manage spiritual/cultural authority.'
  - id: braudel-civilization-capitalism-v2#u36-c2
    heading: 'Law and order as class settlement'
    span: 1247141:1247781
    why: 'Makes explicit that state-enforced order favors the social hierarchy and disciplines the masses, not a neutral arbitration between equals.'
  - id: braudel-civilization-capitalism-v2#u36-c3
    heading: 'Punishment as legitimate spectacle'
    span: 1247782:1248206
    why: 'Shows the ideological legitimation of state violence that grounds the catalogue of executions filling the rest of the section.'
  - id: braudel-civilization-capitalism-v2#u36-c4
    heading: 'State and capitalism as parallel hierarchies'
    span: 1254553:1255132
    why: 'Names the structural resemblance (hierarchy, monopoly) between state-building and capitalism that motivates the turn to state finance.'
  - id: braudel-civilization-capitalism-v2#u36-c5
    heading: 'Forms and rates of the Castilian juro'
    span: 1262820:1263236
    why: 'Gives the concrete financial mechanics of the juro instrument that the rest of the unit''s Castile case study depends on.'
  - id: braudel-civilization-capitalism-v2#u36-c6
    heading: 'Spain outwitted, capitalism triumphant'
    span: 1268912:1269411
    why: 'Braudel''s closing verdict: the Genoese and other creditors, not the crown, held the real power once the asientos system matured.'
- nn: 37
  unit_id: ch05-english-financial-revolution-financiers
  note_id: braudel-civilization-capitalism-v2-ch05-english-financial-revolution-financiers
  span: 1269413:1298848
  chunks:
  - id: braudel-civilization-capitalism-v2#u37-c1
    heading: 'The perpetual, transferable national debt'
    span: 1273667:1275118
    why: 'States the structural mechanism of the financial revolution: debt that never has to be repaid because the creditor''s claim on it is transferable and liquid.'
  - id: braudel-civilization-capitalism-v2#u37-c2
    heading: '''Tout est ici en regie'' - the French envoys on English bureaucracy'
    span: 1272239:1272912
    why: 'First-hand French testimony that England''s fiscal administration had become a recognizable bureaucracy, strong enough that bribery no longer registered as corruption to the bribers.'
  - id: braudel-civilization-capitalism-v2#u37-c3
    heading: 'Taxpayers versus the ''moneyed men'''
    span: 1275552:1276182
    why: 'Shows the social conflict the funding system generated between taxed producers and an untaxed rentier class accused of profiting from war.'
  - id: braudel-civilization-capitalism-v2#u37-c4
    heading: 'Estimating national product from Venice''s budget'
    span: 1286954:1287437
    why: 'Braudel''s rare, explicit attempt to convert fiscal data into a national-product estimate, the quantitative move this section is building toward.'
  - id: braudel-civilization-capitalism-v2#u37-c5
    heading: 'Defining the financier as a sector of capitalism'
    span: 1289079:1289511
    why: 'Braudel''s explicit definitional claim that financiers form a distinct capitalist sector defined by their tie to the state, setting up the whole section.'
  - id: braudel-civilization-capitalism-v2#u37-c6
    heading: 'The migrating hegemony of dominant creditor powers'
    span: 1295805:1296481
    why: 'Frames England''s episode within a longer European pattern of one dominant financial group after another holding states financially captive.'
- nn: 38
  unit_id: ch05-ferme-generale-mercantilism
  note_id: braudel-civilization-capitalism-v2-ch05-ferme-generale-mercantilism
  span: 1298848:1329360
  chunks:
  - id: braudel-civilization-capitalism-v2#u38-c1
    heading: 'Privatized state finance'
    span: 1299603:1301182
    why: 'States the structural claim underlying the whole unit: the Crown never controlled its own revenue, which is what let private tax-farmers colonize state finance.'
  - id: braudel-civilization-capitalism-v2#u38-c2
    heading: 'Aristocratic capital behind the traitants'
    span: 1303666:1304532
    why: 'Shows the nobility as financial backers, not bystanders, of the tax-farming system exposed by the Fouquet inquiry.'
  - id: braudel-civilization-capitalism-v2#u38-c3
    heading: 'Consolidation into the Ferme generale'
    span: 1305841:1306576
    why: 'Traces the institutional steps by which tax-farming became a permanent monopoly: the 1669 syndicates, the 1680 Fauconnet lease, and the 1726/1730 Ferme generale.'
  - id: braudel-civilization-capitalism-v2#u38-c4
    heading: 'The iron law of minority control'
    span: 1308490:1308999
    why: 'Braudel''s own theoretical label for the Ferme''s forty intermarried families, naming the concentration mechanism explicitly.'
  - id: braudel-civilization-capitalism-v2#u38-c5
    heading: 'Mercantilism as each for himself'
    span: 1317246:1317543
    why: 'Braudel''s chosen one-line definition of mercantilism, framed through Montaigne and Voltaire rather than an economist''s doctrine.'
  - id: braudel-civilization-capitalism-v2#u38-c6
    heading: 'Specie below, paper above'
    span: 1325610:1326077
    why: 'States the two-tier economy, cash below and credit/paper above, that explains why bullionism was a real constraint and not mere superstition.'
- nn: 39
  unit_id: ch05-state-culture-incomplete-entity-islamic-model
  note_id: braudel-civilization-capitalism-v2-ch05-state-culture-incomplete-entity-islamic-model
  span: 1329360:1359032
  chunks:
  - id: braudel-civilization-capitalism-v2#u39-c1
    heading: 'The state''s administrative headcount'
    span: 1330737:1331635
    why: 'Gives Braudel''s ''incomplete state'' claim concrete administrative headcounts rather than leaving it as rhetoric.'
  - id: braudel-civilization-capitalism-v2#u39-c2
    heading: 'Society and culture as the state''s substitute apparatus'
    span: 1332781:1333159
    why: 'States directly the mechanism — society and culture as substitute apparatus — that the whole unit argues for.'
  - id: braudel-civilization-capitalism-v2#u39-c3
    heading: 'State and capitalism: encouraged, discouraged, and on a wider plane'
    span: 1343048:1344752
    why: 'Refuses a monocausal state/capitalism relationship and locates capitalism''s distinctiveness in its wider geographic scale.'
  - id: braudel-civilization-capitalism-v2#u39-c4
    heading: 'The power apparatus is more than the state'
    span: 1345665:1346230
    why: 'Braudel''s clearest formulation that the real power apparatus exceeds the state, a self-reconstituting composite of hierarchies.'
  - id: braudel-civilization-capitalism-v2#u39-c5
    heading: 'Capitalism as a travelling cultural good: bookkeeping'
    span: 1348038:1348707
    why: 'Grounds the claim that capitalism''s own instruments are borrowed cultural goods in a concrete, traceable transmission chain.'
  - id: braudel-civilization-capitalism-v2#u39-c6
    heading: 'Against the West as pioneering genius'
    span: 1351566:1352022
    why: 'The historiographical payoff of the Islamic-model excursus: an explicit rejection of the West-as-sole-inventor narrative.'
- nn: 40
  unit_id: ch05-christendom-usury-puritanism
  note_id: braudel-civilization-capitalism-v2-ch05-christendom-usury-puritanism
  span: 1359032:1385004
  chunks:
  - id: braudel-civilization-capitalism-v2#u40-c1
    heading: 'Christendom''s disadvantage against Islam'
    span: 1359084:1359542
    why: 'States Braudel''s opening civilizational contrast that frames the whole usury quarrel as a structural clash between religion and economy.'
  - id: braudel-civilization-capitalism-v2#u40-c2
    heading: 'Aristotle against usury'
    span: 1362612:1362964
    why: 'Gives the doctrinal root, via Aristotle and Aquinas, of the ''money is barren'' principle that scholastic theology spent centuries circumventing.'
  - id: braudel-civilization-capitalism-v2#u40-c3
    heading: 'The scholastic loopholes'
    span: 1365869:1366976
    why: 'Shows concretely how scholastic categories of risk and partnership became the legal technology that let interest-bearing credit expand while nominally honoring the usury ban.'
  - id: braudel-civilization-capitalism-v2#u40-c4
    heading: 'Universal practice, official disapproval'
    span: 1368163:1368758
    why: 'Documents the gap between official prohibition and universal practice, and the scapegoating of Jewish moneylenders despite identical Christian practice.'
  - id: braudel-civilization-capitalism-v2#u40-c5
    heading: 'Baxter''s doctrine of the calling'
    span: 1380693:1381743
    why: 'Braudel''s own summary of Weber''s core mechanism, linking calling, election, and ascetic profit-seeking, that the note''s Weber critique responds to.'
  - id: braudel-civilization-capitalism-v2#u40-c6
    heading: 'Genoa''s counter-example'
    span: 1384584:1385002
    why: 'Braudel''s closing rebuttal to a strong Weber thesis, using Catholic Genoa''s low interest rates to suggest causation may run the other way.'
- nn: 41
  unit_id: ch05-retrospective-geography-rationalism-florence
  note_id: braudel-civilization-capitalism-v2-ch05-retrospective-geography-rationalism-florence
  span: 1385004:1417175
  chunks:
  - id: braudel-civilization-capitalism-v2#u41-c1
    heading: 'The North''s cost-competitive, not confessional, victory'
    span: 1388662:1389705
    why: 'States Braudel''s own preferred, non-Weberian explanation for the North overtaking the Mediterranean South: cost competition and the timing of a shared economic crisis, not superior Protestant ethics.'
  - id: braudel-civilization-capitalism-v2#u41-c2
    heading: 'Melis''s archives undercut the Pacioli-invention story'
    span: 1397927:1398951
    why: 'The archival evidence (Cotrugli, Melis) that dismantles Sombart''s rationalism thesis by showing double-entry book-keeping accumulated slowly and unevenly among obscure Florentine firms two centuries before Pacioli''s celebrated codification.'
  - id: braudel-civilization-capitalism-v2#u41-c3
    heading: 'Two logics within one economy'
    span: 1404376:1404987
    why: 'Braudel''s sharpest formulation of the market-economy/capitalism split, rejecting the equation of capitalist rationality with the market''s own impersonal rationality.'
  - id: braudel-civilization-capitalism-v2#u41-c4
    heading: 'Certaldo''s evidence answers Weber on Alberti'
    span: 1413504:1414492
    why: 'Braudel''s decisive counter-evidence for dating a genuine bourgeois mentality to Quattrocento Florence rather than sixteenth-century Protestantism.'
  - id: braudel-civilization-capitalism-v2#u41-c5
    heading: 'The Chinese-junks counterfactual'
    span: 1415850:1416607
    why: 'Braudel''s explicit world-scale counterfactual against Eurocentric inevitability, naming the accident-driven contingency behind Western ''structural superiority''.'
  - id: braudel-civilization-capitalism-v2#u41-c6
    heading: 'Capitalism not the last word'
    span: 1416608:1417173
    why: 'Closes the unit by naming and rejecting the debate''s shared teleological assumption that capitalism was history''s destined culmination.'
- nn: 42
  unit_id: ch05-capitalism-outside-europe-norman-jacobs-politics
  note_id: braudel-civilization-capitalism-v2-ch05-capitalism-outside-europe-norman-jacobs-politics
  span: 1417175:1464226
  chunks:
  - id: braudel-civilization-capitalism-v2#u42-c1
    heading: 'A spectre haunting every form of society'
    span: 1417468:1417886
    why: 'States Braudel''s organizing puzzle for the whole unit: capitalism as a universal potential that nonetheless completed itself only in Europe and partly in Japan.'
  - id: braudel-civilization-capitalism-v2#u42-c2
    heading: 'The Fukien/Hunan coastal-inland contrast'
    span: 1418746:1419286
    why: 'Gives the concrete empirical pattern, coastal trade zones thriving against poor inland hinterlands, that Braudel treats as evidence for circulation as capitalism''s necessary but not sufficient precondition.'
  - id: braudel-civilization-capitalism-v2#u42-c3
    heading: 'China''s market economy without capitalism'
    span: 1436489:1437021
    why: 'The passage where Braudel explicitly tests his market-economy/capitalism distinction against the Chinese case, confirming a market economy can flourish while capitalism proper is blocked from above.'
  - id: braudel-civilization-capitalism-v2#u42-c4
    heading: 'Japan''s merchant dynasties'
    span: 1445089:1445309
    why: 'Marks the structural contrast with China: Japan''s guild- and town-based pluralism let merchant capital survive across generations, the condition Braudel treats as decisive.'
  - id: braudel-civilization-capitalism-v2#u42-c5
    heading: 'Bernier''s perpetual New Deal'
    span: 1458518:1458863
    why: 'Bernier''s eyewitness account is Braudel''s clinching illustration that non-heritable land tenure, not culture, prevented dynastic capital formation in Mogul India.'
  - id: braudel-civilization-capitalism-v2#u42-c6
    heading: 'Europe''s two accumulating classes'
    span: 1463248:1463704
    why: 'States Braudel''s own answer to the whole comparative problem: capitalism requires competing classes able to accumulate and transmit wealth across generations, a condition only Europe, and partly Japan, supplied.'
- nn: 43
  unit_id: conclusion
  note_id: braudel-civilization-capitalism-v2-conclusion
  span: 1464226:1468217
  chunks:
  - id: braudel-civilization-capitalism-v2#u43-c1
    heading: 'Market economy: necessary condition, not sufficient (China)'
    span: 1464507:1465828
    why: 'States Braudel''s core market-economy/capitalism distinction and clinches it with the China counter-example, the load-bearing methodological claim of the whole conclusion.'
  - id: braudel-civilization-capitalism-v2#u43-c2
    heading: 'The second condition: a hierarchical, dynasty-sustaining society'
    span: 1465869:1467071
    why: 'Specifies the social prerequisites (dynasty, inheritance, rank, mobility) for capitalism and grounds Braudel''s comparative Japan/Europe method.'
  - id: braudel-civilization-capitalism-v2#u43-c3
    heading: 'World trade as liberating third condition, pivot to the world-economies'
    span: 1467074:1468216
    why: 'Names the third and decisive condition and is the direct textual hinge into Volume III''s world-economies, the culmination of the book''s argument.'
