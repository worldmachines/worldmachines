units:
- nn: 1
  unit_id: intro-mirabeau-letter
  note_id: douglass-rousseau-and-hobbes-intro-mirabeau-letter
  span: 0:7414
  chunks:
  - id: douglass-rousseau-and-hobbes#u01-c1
    heading: 'Mirabeau''s request and the Physiocrats'' legal despotism'
    span: 154:1005
    why: 'Sets out the historical occasion and the Physiocrat doctrine of legal despotism that Rousseau''s letter rejects.'
  - id: douglass-rousseau-and-hobbes#u01-c2
    heading: 'Rousseau''s reply: no tolerable middle between democracy and Hobbism'
    span: 1007:2464
    why: 'States the problem of politics (law above man) and the two extremes that frame the entire book.'
  - id: douglass-rousseau-and-hobbes#u01-c3
    heading: 'Law as the resolution: the Discours sur l''économie politique'
    span: 2946:3392
    why: 'Rousseau''s own optimistic formulation of how the rule of law reconciles obedience and freedom.'
  - id: douglass-rousseau-and-hobbes#u01-c4
    heading: 'Republican law versus Hobbes''s sovereignty'
    span: 4036:5436
    why: 'Contrasts Rousseau''s republic of law with Hobbes''s rejection of the rule of laws and names the dichotomy as the book''s starting point.'
  - id: douglass-rousseau-and-hobbes#u01-c5
    heading: 'Purpose of the study: Hobbes versus Hobbism'
    span: 5438:6265
    why: 'Douglass''s statement of method and the Hobbes/Hobbism distinction that governs the whole book.'
- nn: 2
  unit_id: intro-hobbes-and-rousseau
  note_id: douglass-rousseau-and-hobbes-intro-hobbes-and-rousseau
  span: 7414:23536
  chunks:
  - id: douglass-rousseau-and-hobbes#u02-c1
    heading: 'The mid-century Hobbesian readings of Rousseau'
    span: 8211:9884
    why: 'Reports Strauss, Derathé, Davy, and Jouvenel on Rousseau''s debt to Hobbes, the interpretive baseline Douglass argues against.'
  - id: douglass-rousseau-and-hobbes#u02-c2
    heading: 'Ahistorical scholarship, Tuck, and the reversal of method'
    span: 11417:13410
    why: 'States the gap in the literature and Douglass''s method, which is the reverse of Tuck''s Hobbesianism of Rousseau.'
  - id: douglass-rousseau-and-hobbes#u02-c3
    heading: 'Thesis: a polemic against Hobbes and his critics'
    span: 14195:15289
    why: 'The book''s central historical claim, that the Discours targeted both Hobbes and the natural-law and doux commerce theorists who rested on Hobbesian premises.'
  - id: douglass-rousseau-and-hobbes#u02-c4
    heading: 'Neither Hobbesian nor anti-Hobbesian'
    span: 15291:16278
    why: 'Douglass''s hedge that disagreeing with Hobbes''s critics is not agreeing with Hobbes, and his refusal of a simple anti-Hobbesian reading.'
  - id: douglass-rousseau-and-hobbes#u02-c5
    heading: 'Chapter 3: inverting Hobbesian sovereignty'
    span: 19421:20961
    why: 'Summarizes the argument that Rousseau inverted Hobbesian sovereignty toward republican law while keeping nature as a normative standard against conventionalism.'
  - id: douglass-rousseau-and-hobbes#u02-c6
    heading: 'Chapter 4: natural goodness, the passions, fear versus love'
    span: 20963:22786
    why: 'Gives the passions thesis, including the neo-Augustinian context, the repudiation of Original Sin, and the contrast between Hobbesian fear and Rousseauian love.'
- nn: 3
  unit_id: intro-nature-free-will-passions
  note_id: douglass-rousseau-and-hobbes-intro-nature-free-will-passions
  span: 23536:36116
  chunks:
  - id: douglass-rousseau-and-hobbes#u03-c1
    heading: 'The three-theme thesis'
    span: 23573:24456
    why: 'States the book''s dual aim and the three-theme interpretation that organizes everything else.'
  - id: douglass-rousseau-and-hobbes#u03-c2
    heading: 'Nature as normative standard against Strauss, Melzer, Cooper'
    span: 24458:26030
    why: 'Gives Douglass''s central claim about nature and positions it against rival scholarly readings.'
  - id: douglass-rousseau-and-hobbes#u03-c3
    heading: 'Natural goodness and an indeterminate standard'
    span: 26373:27244
    why: 'Explains natural goodness against Augustine and Hobbes and what accordance with nature requires.'
  - id: douglass-rousseau-and-hobbes#u03-c4
    heading: 'Free will: Hobbes the materialist, Rousseau the dualist'
    span: 28027:28919
    why: 'Sets up the free will opposition to Hobbes and the scholarly neglect the book corrects.'
  - id: douglass-rousseau-and-hobbes#u03-c5
    heading: 'Reason and the passions: affinity with Hobbes, not Kant'
    span: 33416:34256
    why: 'States the reason-passion relation and where Rousseau is close to and far from Hobbes.'
  - id: douglass-rousseau-and-hobbes#u03-c6
    heading: 'Amour-propre and the secularized Augustinian fall'
    span: 34995:36114
    why: 'Summarizes the passions theme and the republican vision that ties all three themes together.'
- nn: 4
  unit_id: intro-methodological-problems
  note_id: douglass-rousseau-and-hobbes-intro-methodological-problems
  span: 36116:48614
  chunks:
  - id: douglass-rousseau-and-hobbes#u04-c1
    heading: 'Coherence without a mythology of coherence'
    span: 36141:37301
    why: 'States Douglass''s stance on the unity and development of Rousseau''s political philosophy.'
  - id: douglass-rousseau-and-hobbes#u04-c2
    heading: 'Which themes are stable and which shifted'
    span: 37303:38691
    why: 'Separates the settled themes (free will, natural goodness) from the evolving theory of the passions and justifies the reading.'
  - id: douglass-rousseau-and-hobbes#u04-c3
    heading: 'Reception and comparison, not derivation'
    span: 39686:41105
    why: 'Gives the book''s core method on influence: why Rousseau engaged Hobbes, and resemblance is not derivation.'
  - id: douglass-rousseau-and-hobbes#u04-c4
    heading: 'No definitive evidence Rousseau read Hobbes'
    span: 41632:42061
    why: 'Frames the central evidentiary problem and Douglass''s provisional answer that De cive is the likely source.'
  - id: douglass-rousseau-and-hobbes#u04-c5
    heading: 'The ''enfant robuste'' evidence'
    span: 45173:46860
    why: 'Presents the one textual clue that Rousseau knew De cive and the Diderot and Wokler dispute over its direction.'
  - id: douglass-rousseau-and-hobbes#u04-c6
    heading: 'Rousseau''s changing opinion of Hobbes'
    span: 46862:47715
    why: 'Traces Rousseau''s shift on Hobbes and civil religion while stating what it cannot establish about his reading.'
- nn: 5
  unit_id: ch1-french-reception-opening
  note_id: douglass-rousseau-and-hobbes-ch1-french-reception-opening
  span: 48614:56610
  chunks:
  - id: douglass-rousseau-and-hobbes#u05-c1
    heading: 'The ahistorical state of Hobbes–Rousseau scholarship'
    span: 48849:49692
    why: 'States the problem the chapter answers: Rousseau''s engagement with Hobbes has been studied without the French reception context.'
  - id: douglass-rousseau-and-hobbes#u05-c2
    heading: 'Hobbism as a rhetorical charge'
    span: 50306:51212
    why: 'Establishes that Hobbes and Spinoza were paired as subversives, that Hobbism was dismissed rather than analysed, and that denials concealed real affinities.'
  - id: douglass-rousseau-and-hobbes#u05-c3
    heading: 'Rousseau as sophisticated commentator on the French Hobbes'
    span: 51214:51692
    why: 'Douglass''s central reframing: Rousseau''s Hobbes is the Hobbes of Bayle, Barbeyrac, Montesquieu and Diderot.'
  - id: douglass-rousseau-and-hobbes#u05-c4
    heading: 'The earlier scientific reception in France'
    span: 51993:53737
    why: 'Summarizes the Mersenne-circle, mechanistic reception (Skinner, Sorbière, Verdus, Malcolm) that contrasts with the later political Hobbism.'
  - id: douglass-rousseau-and-hobbes#u05-c5
    heading: 'Purpose and selection criteria'
    span: 53988:54383
    why: 'States the chapter''s aim and the selection principle (works Rousseau cited, evidently knew, or that were widely disseminated).'
  - id: douglass-rousseau-and-hobbes#u05-c6
    heading: 'No grand narrative: threads leading to Rousseau'
    span: 55139:55624
    why: 'Fixes the method: eclectic threads rather than a grand narrative, with claims restricted to probable context.'
- nn: 6
  unit_id: ch1-nicole-bayle
  note_id: douglass-rousseau-and-hobbes-ch1-nicole-bayle
  span: 56610:78076
  chunks:
  - id: douglass-rousseau-and-hobbes#u06-c1
    heading: 'Nicole: regulated amour-propre and the Hobbesian remedy'
    span: 60614:61769
    why: 'Shows Nicole reproducing Hobbes''s theory of society''s origin, fear of death, and non-resistance within an Augustinian account of amour-propre.'
  - id: douglass-rousseau-and-hobbes#u06-c2
    heading: 'Augustinian pessimism embraces Hobbes; Bayle follows'
    span: 61771:62494
    why: 'Compresses the route from Hobbes through Nicole to Bayle and the shared view of human nature.'
  - id: douglass-rousseau-and-hobbes#u06-c3
    heading: 'Bayle on a society of atheists'
    span: 68248:68966
    why: 'States Bayle''s argument that amour-propre and civil law, not religion, sustain social order, pushing beyond Nicole.'
  - id: douglass-rousseau-and-hobbes#u06-c4
    heading: 'Bayle''s summary of Leviathan and the ''one person'' misreading'
    span: 73268:74348
    why: 'Explains Bayle''s role as the channel for Leviathan in France and the origin of the monarchical misreading of Hobbes''s sovereign.'
  - id: douglass-rousseau-and-hobbes#u06-c5
    heading: 'Church power, peace, and Rousseau''s irony'
    span: 74350:75069
    why: 'Links Bayle''s Hobbesian anti-clericalism to Rousseau''s later invocation of Hobbes on civil religion.'
  - id: douglass-rousseau-and-hobbes#u06-c6
    heading: 'Why the political emphasis prevailed'
    span: 77247:78074
    why: 'Gives Douglass''s own conclusion on the causes and limits of the political emphasis in Hobbes''s French reception.'
- nn: 7
  unit_id: ch1-malebranche
  note_id: douglass-rousseau-and-hobbes-ch1-malebranche
  span: 78076:89615
  chunks:
  - id: douglass-rousseau-and-hobbes#u07-c1
    heading: 'Malebranche against Hobbes and Locke on ideas and perceptions'
    span: 79399:80513
    why: 'States Malebranche''s core epistemological objection that Hobbes and Locke collapse eternal ideas into subjective perceptions, with sceptical and moral consequences.'
  - id: douglass-rousseau-and-hobbes#u07-c2
    heading: 'Dualism as the condition of freedom and morality'
    span: 80515:81792
    why: 'Links Malebranche''s dualism to freedom and to Rousseau''s later attacks on materialism.'
  - id: douglass-rousseau-and-hobbes#u07-c3
    heading: 'Leibniz''s qualified opposition to Hobbes'
    span: 84356:84829
    why: 'Shows that the anti-Hobbes front was not uniform and that Leibniz, unlike Malebranche, respected Hobbes.'
  - id: douglass-rousseau-and-hobbes#u07-c4
    heading: 'From metaphysics to eternal laws of justice'
    span: 85451:86555
    why: 'Shows how Malebranche derived political and moral implications from his theological premises and how the debate fed later natural law quarrels.'
  - id: douglass-rousseau-and-hobbes#u07-c5
    heading: 'Malebranche''s attack on amour-propre as the basis of justice'
    span: 87084:88241
    why: 'The key primary text in which Malebranche describes a Hobbesian view of law and right as grounded in amour-propre and force.'
  - id: douglass-rousseau-and-hobbes#u07-c6
    heading: 'Douglass''s gloss: amour-propre and Rousseau''s revival of the critique'
    span: 88876:89613
    why: 'Douglass''s own thesis about the significance of Malebranche''s amour-propre charge for French thought and for Rousseau.'
- nn: 8
  unit_id: ch1-barbeyrac-burlamaqui-natural-law
  note_id: douglass-rousseau-and-hobbes-ch1-barbeyrac-burlamaqui-natural-law
  span: 89615:111152
  chunks:
  - id: douglass-rousseau-and-hobbes#u08-c1
    heading: 'Barbeyrac''s four charges against Hobbes'
    span: 92324:93199
    why: 'Sets out the four specific accusations that defined Hobbism for the French natural law tradition and compares Barbeyrac''s tone with Bayle''s.'
  - id: douglass-rousseau-and-hobbes#u08-c2
    heading: 'A French natural law tradition with Hobbes as bête noire'
    span: 94738:95071
    why: 'States Douglass''s central claim that a self-identifying French tradition existed and that it excluded Hobbes as an opponent.'
  - id: douglass-rousseau-and-hobbes#u08-c3
    heading: 'Barbeyrac breaks with Pufendorf on the state of nature'
    span: 98797:100335
    why: 'Shows Pufendorf''s residual Hobbesianism about the origin of society and Barbeyrac''s anticipation of Rousseau''s Discours sur l’inégalité.'
  - id: douglass-rousseau-and-hobbes#u08-c4
    heading: 'Conflating Hobbes''s justice with the laws of nature'
    span: 101642:102930
    why: 'Identifies the misreading of Hobbes shared by both authors and ties it to their assertion of conscience over sovereign and to Leibniz''s Hobbism charge.'
  - id: douglass-rousseau-and-hobbes#u08-c5
    heading: 'Burlamaqui: reason, conscience and compassion prior to civil law'
    span: 105085:106386
    why: 'Shows Burlamaqui''s claim that obligation precedes civil law and the compassion definition Rousseau would reuse against Hobbes.'
  - id: douglass-rousseau-and-hobbes#u08-c6
    heading: 'Assessment of the tradition and Rousseau''s strategy'
    span: 110274:111150
    why: 'Gives Douglass''s verdict on the tradition''s distortions and previews how Rousseau would subvert the Hobbes versus natural law opposition.'
- nn: 9
  unit_id: ch1-montesquieu-against-hobbes
  note_id: douglass-rousseau-and-hobbes-ch1-montesquieu-against-hobbes
  span: 111152:123269
  chunks:
  - id: douglass-rousseau-and-hobbes#u09-c1
    heading: 'Montesquieu''s opening move against Hobbes''s state of nature'
    span: 115376:116218
    why: 'Shows Montesquieu explicitly setting out to refute Hobbes in De l''esprit des lois by denying that natural man is driven to fight.'
  - id: douglass-rousseau-and-hobbes#u09-c2
    heading: 'Primitive condition, the historicized motives, and the limits of the anticipation of Rousseau'
    span: 116220:118093
    why: 'Gives Douglass''s precise account of what Montesquieu shares with and withholds from Rousseau''s critique of Hobbes''s state of nature.'
  - id: douglass-rousseau-and-hobbes#u09-c3
    heading: 'Montesquieu''s own summary of his anti-Hobbes aim'
    span: 118095:118416
    why: 'Primary statement of Montesquieu''s target, and an instance of the ''Hobbism'' reading in which Hobbes is a subverter of all morality.'
  - id: douglass-rousseau-and-hobbes#u09-c4
    heading: 'Justice founded on the nature of things, with Malebranche and Leibniz'
    span: 119247:120296
    why: 'Identifies Montesquieu''s intellectual allies against Hobbes and marks his departure from Pufendorf and Barbeyrac.'
  - id: douglass-rousseau-and-hobbes#u09-c5
    heading: 'Rejection of contract theory and Hobbesian authorization'
    span: 120298:121668
    why: 'Shows Montesquieu rejecting genetic accounts of political right and Hobbes''s doctrine of authorization, a theme central to Rousseau''s later inversion of sovereignty.'
  - id: douglass-rousseau-and-hobbes#u09-c6
    heading: 'The Troglodytes tale reconsidered'
    span: 113116:114043
    why: 'Douglass corrects the common reading of the Troglodytes as an anti-Hobbesian tale, arguing it reinforces Hobbes and targets Mandeville.'
- nn: 10
  unit_id: ch1-diderot-encyclopedie
  note_id: douglass-rousseau-and-hobbes-ch1-diderot-encyclopedie
  span: 123269:145005
  chunks:
  - id: douglass-rousseau-and-hobbes#u10-c1
    heading: 'Boucher d''Argis rehearses Barbeyrac''s four charges'
    span: 127271:128197
    why: 'Sets out the four standard charges against Hobbes that the Encyclopédie transmitted from Barbeyrac, and the promotion of Burlamaqui over Pufendorf.'
  - id: douglass-rousseau-and-hobbes#u10-c2
    heading: 'How the philosophes simplified Hobbes'
    span: 129890:130845
    why: 'Douglass''s own diagnosis of what the Encyclopédie criticisms of Hobbes got wrong and what problem they bypassed.'
  - id: douglass-rousseau-and-hobbes#u10-c3
    heading: 'Diderot''s general will in ''Droit naturel'''
    span: 135414:135910
    why: 'States Diderot''s universal general will, introduced to refute the violent interlocutor taken to be Hobbes.'
  - id: douglass-rousseau-and-hobbes#u10-c4
    heading: 'Rousseau''s early, narrower general will'
    span: 135912:136872
    why: 'Shows how Rousseau''s general will diverges from Diderot''s from the start, by belonging to particular societies rather than the species.'
  - id: douglass-rousseau-and-hobbes#u10-c5
    heading: 'Why Diderot''s article matters for Rousseau against Hobbes'
    span: 137828:138751
    why: 'Douglass''s summary thesis that Diderot introduced the general will in response to Hobbes and that Rousseau found both it and the refutation deficient.'
  - id: douglass-rousseau-and-hobbes#u10-c6
    heading: 'Barbeyrac and the deteriorating reputation of Hobbes'
    span: 144321:145003
    why: 'Closes the reception chapter with Douglass''s claim about the diminished Hobbes Rousseau actually met.'
- nn: 11
  unit_id: ch2-state-of-nature-opening
  note_id: douglass-rousseau-and-hobbes-ch2-state-of-nature-opening
  span: 145005:160311
  chunks:
  - id: douglass-rousseau-and-hobbes#u11-c1
    heading: 'Three arguments about Hobbes and the natural law tradition'
    span: 149152:150012
    why: 'Douglass''s first argument: Rousseau collapses the Pufendorf/Hobbes distinction, making Hobbes a negative marker for the whole tradition.'
  - id: douglass-rousseau-and-hobbes#u11-c2
    heading: 'Natural goodness and nature as normative standard'
    span: 150947:152485
    why: 'States the natural goodness argument, its link to the luxury debate, and nature as the normative standard of the good life.'
  - id: douglass-rousseau-and-hobbes#u11-c3
    heading: 'A hypothetical history that still discovers the nature of man'
    span: 154192:155750
    why: 'Explains how Douglass reads the status of the state of nature: conjectural history serving to separate the original from the artificial in man.'
  - id: douglass-rousseau-and-hobbes#u11-c4
    heading: 'Nature of man is not man in the state of nature; Burlamaqui'
    span: 156584:158718
    why: 'Key clarification that nature persists as a normative standard after the state of nature is lost, grounded in Rousseau''s use of Burlamaqui.'
  - id: douglass-rousseau-and-hobbes#u11-c5
    heading: 'Rousseau''s critique of natural law is internal, not a rejection'
    span: 159390:160309
    why: 'Summarizes Rousseau''s real objection to predecessors (they failed to reach natural man; reason is dormant) and Douglass''s rejection of the Vaughan reading.'
- nn: 12
  unit_id: ch2-state-of-nature-state-of-war
  note_id: douglass-rousseau-and-hobbes-ch2-state-of-nature-state-of-war
  span: 160311:179097
  chunks:
  - id: douglass-rousseau-and-hobbes#u12-c1
    heading: 'Two principles: Hobbesian self-preservation, anti-Hobbesian pity'
    span: 161016:162848
    why: 'States Douglass''s thesis that Rousseau''s first principle was strictly Hobbesian while pity was formulated in opposition to Hobbes.'
  - id: douglass-rousseau-and-hobbes#u12-c2
    heading: 'Rejecting sociability, and Douglass against Tuck'
    span: 162850:164141
    why: 'Douglass disputes Tuck''s reading that dropping sociability makes Rousseau Hobbesian, showing pity was aimed at both Hobbes and Pufendorf.'
  - id: douglass-rousseau-and-hobbes#u12-c3
    heading: 'Epicureanism, the Hobbism charge, and Pufendorf''s affinity with Hobbes'
    span: 169101:170275
    why: 'Argues Rousseau did not endorse Hobbes but treated Pufendorf''s natural weakness and Hobbes''s natural war as equally erroneous.'
  - id: douglass-rousseau-and-hobbes#u12-c4
    heading: 'l’Etat de guerre: denying natural war'
    span: 175056:176730
    why: 'Gives Rousseau''s definition of war and his reply to Hobbes''s argument from the competition of the right of each to all things.'
  - id: douglass-rousseau-and-hobbes#u12-c5
    heading: 'Why the state of nature must not entail the rights of war'
    span: 176732:178008
    why: 'Explains the stakes: political rights founded on nature must not entail rights of war, which Grotius and Hobbes used to justify slavery.'
  - id: douglass-rousseau-and-hobbes#u12-c6
    heading: 'Purpose of the critique for sovereignty theories'
    span: 178010:178815
    why: 'Sums up how rejecting the wretched state of nature undermines Hobbesian and Pufendorfian justifications of sovereignty.'
- nn: 13
  unit_id: ch2-free-will-moral-nature
  note_id: douglass-rousseau-and-hobbes-ch2-free-will-moral-nature
  span: 179097:193493
  chunks:
  - id: douglass-rousseau-and-hobbes#u13-c1
    heading: 'Physical and moral sides of natural man'
    span: 179131:180262
    why: 'Introduces the physical/moral distinction and clarifies that natural man''s dormant moral capacities do not make him amoral.'
  - id: douglass-rousseau-and-hobbes#u13-c2
    heading: 'Pufendorf on spontaneity and freedom of the will'
    span: 181397:182076
    why: 'The natural law definition of the will that Douglass says closely foreshadows Rousseau''s account of free will.'
  - id: douglass-rousseau-and-hobbes#u13-c3
    heading: 'Rousseau: man as free agent, not mechanism'
    span: 184222:185013
    why: 'Presents Rousseau''s own claim that free will is spiritual and irreducible to physics or mechanics.'
  - id: douglass-rousseau-and-hobbes#u13-c4
    heading: 'Cautious conclusion: an anti-Hobbesian natural law context'
    span: 187524:188616
    why: 'Douglass''s hedged thesis about the source and target of Rousseau''s first discussion of free will.'
  - id: douglass-rousseau-and-hobbes#u13-c5
    heading: 'Freedom as inalienable gift of nature'
    span: 190132:191184
    why: 'Shows free will underwriting the inalienability of freedom and the illegitimacy of renouncing it.'
  - id: douglass-rousseau-and-hobbes#u13-c6
    heading: 'One principle versus two: Hobbes and Rousseau'
    span: 192354:193491
    why: 'Summarizes why free will and the inalienable gifts of life and freedom separate Rousseau''s foundation of civil association from Hobbes''s.'
- nn: 14
  unit_id: ch2-natural-goodness-golden-age
  note_id: douglass-rousseau-and-hobbes-ch2-natural-goodness-golden-age
  span: 193493:218917
  chunks:
  - id: douglass-rousseau-and-hobbes#u14-c1
    heading: 'Melon and the doux commerce defence of luxury'
    span: 194428:195531
    why: 'Sets out the doux commerce position (misery before commerce, benefit of inequality) that Rousseau''s natural goodness opposes.'
  - id: douglass-rousseau-and-hobbes#u14-c2
    heading: 'Natural evil as the shared premise of critics and natural law'
    span: 198848:200040
    why: 'States Douglass''s central thesis that natural law theorists and luxury defenders both rest on a Hobbesian picture of natural man.'
  - id: douglass-rousseau-and-hobbes#u14-c3
    heading: 'The maxim of natural goodness'
    span: 201395:201894
    why: 'Rousseau''s own formulation of natural goodness grounded in pity rather than reason, answering Lecat.'
  - id: douglass-rousseau-and-hobbes#u14-c4
    heading: 'Pity, Mandeville and the repudiation of Original Sin'
    span: 201896:203407
    why: 'Explains Rousseau''s debt to Mandeville and why pity can be a natural virtue once Original Sin is rejected.'
  - id: douglass-rousseau-and-hobbes#u14-c5
    heading: 'Amour-propre and amour de soi-même distinguished against Hobbes'
    span: 209462:210117
    why: 'The first statement of the pivotal distinction, made specifically to refute Hobbes.'
  - id: douglass-rousseau-and-hobbes#u14-c6
    heading: 'Pity tempers early amour-propre and the golden age'
    span: 216530:217376
    why: 'Shows why the golden age needs amour-propre already active yet assuaged by pity, and so is no Hobbesian war.'
  - id: douglass-rousseau-and-hobbes#u14-c7
    heading: 'Rousseau''s golden age as genealogy, not fiction'
    span: 218213:218915
    why: 'Douglass''s claim that Rousseau alone made the golden age a genealogical argument, unlike Fénelon''s fictional Bétique.'
- nn: 15
  unit_id: ch2-harmony-contradiction-hobbesian-moment
  note_id: douglass-rousseau-and-hobbes-ch2-harmony-contradiction-hobbesian-moment
  span: 218917:232391
  chunks:
  - id: douglass-rousseau-and-hobbes#u15-c1
    heading: 'The fragment on the contradiction that causes misery'
    span: 221039:221413
    why: 'Rousseau''s most explicit formulation of contradiction as the root of unhappiness and unity as the remedy, on which Douglass builds his reading of natural goodness.'
  - id: douglass-rousseau-and-hobbes#u15-c2
    heading: 'Natural goodness as pre-moral harmony'
    span: 221415:222771
    why: 'Douglass''s definition of what Rousseau means by natural goodness (absence of inherent conflict), which resolves the apparent inconsistency between parts one and two of the Discours.'
  - id: douglass-rousseau-and-hobbes#u15-c3
    heading: 'Nature as a normative standard'
    span: 223594:224791
    why: 'Distinguishes descriptive from normative uses of nature and ties the normative one to the requirement that a legitimate body politic not alienate life and freedom.'
  - id: douglass-rousseau-and-hobbes#u15-c4
    heading: 'Commercial society, amour-propre and divided existence'
    span: 227710:228653
    why: 'States Douglass''s account of when amour-propre is evil and what restoring unity would require.'
  - id: douglass-rousseau-and-hobbes#u15-c5
    heading: 'The Hobbesian moment and how it differs from Hobbes'
    span: 228655:230254
    why: 'The core comparison with Hobbes: the state of war is Hobbesian in form but arises only after equality is destroyed.'
  - id: douglass-rousseau-and-hobbes#u15-c6
    heading: 'Genealogy as critique of Hobbesian justifications'
    span: 230256:232389
    why: 'Douglass''s thesis that Rousseau''s genealogy uses the Hobbesian moment to expose the illegitimacy of society justified by preservation and peace, with the golden age as the standard.'
- nn: 16
  unit_id: ch2-rousseaus-critique-reappraised
  note_id: douglass-rousseau-and-hobbes-ch2-rousseaus-critique-reappraised
  span: 232391:244226
  chunks:
  - id: douglass-rousseau-and-hobbes#u16-c1
    heading: 'Amour-propre, pity and the golden age against Hobbes’s passions'
    span: 235663:237351
    why: 'States the substantive core of Rousseau’s critique: Hobbes’s passions are true of civil man but not natural, and pity tempering amour-propre yields a golden age rather than war.'
  - id: douglass-rousseau-and-hobbes#u16-c2
    heading: 'Negative versus positive standard: raising the bar'
    span: 237353:239069
    why: 'Douglass’s first reason the critique matters: the state of nature functions as the standard by which sovereignty is justified, so the golden age supplies a positive test of legitimacy.'
  - id: douglass-rousseau-and-hobbes#u16-c3
    heading: 'Hobbes studied men but not man'
    span: 239071:239838
    why: 'Douglass’s second reason, with Rousseau’s own words on the parochialism of European philosophers of origins.'
  - id: douglass-rousseau-and-hobbes#u16-c4
    heading: 'Contingency undermines Hobbes’s science of civil philosophy'
    span: 240672:241152
    why: 'Draws the consequence of the contingency charge for Hobbes’s own ambition to ground civil science on general principles of human nature.'
  - id: douglass-rousseau-and-hobbes#u16-c5
    heading: 'Free will and the moral/physical distinction'
    span: 241154:242737
    why: 'Adds free will as the second axis of the critique, contrasting Rousseau’s moral/physical distinction with Hobbes’s rejection of moral determination in the Bramhall controversy.'
  - id: douglass-rousseau-and-hobbes#u16-c6
    heading: 'Collapsing the Hobbes/Pufendorf bifurcation'
    span: 243752:244224
    why: 'Places Rousseau in the French and Genevan reception of Hobbes and states his strategic move against both natural law and doux commerce theorists.'
- nn: 17
  unit_id: ch3-sovereignty-and-law-opening
  note_id: douglass-rousseau-and-hobbes-ch3-sovereignty-and-law-opening
  span: 244226:253254
  chunks:
  - id: douglass-rousseau-and-hobbes#u17-c1
    heading: 'Placing law above man: the two inherited problems'
    span: 244427:246248
    why: 'States Douglass''s framing thesis for the chapter, the Du contrat social project and the freedom and nature problems it inherits from the Discours.'
  - id: douglass-rousseau-and-hobbes#u17-c2
    heading: 'First strand: Hobbesian problems, absolute sovereignty, unity'
    span: 247790:248873
    why: 'Shows that Douglass sees Rousseau as sharing Hobbes''s problems and conclusions about incontestable sovereignty and unity, including civil religion.'
  - id: douglass-rousseau-and-hobbes#u17-c3
    heading: 'Second strand: natural law, free will and the inversion of sovereignty'
    span: 248875:250498
    why: 'Gives Douglass''s central claim that Rousseau inverted earlier theories of sovereignty by making it inalienable, on the basis of free will.'
  - id: douglass-rousseau-and-hobbes#u17-c4
    heading: 'Third strand: nature as a norm and the charge of Hobbism'
    span: 250500:252078
    why: 'Distinguishes Rousseau from the Hobbism caricature and the Straussian reading, and links the general will to the restoration of natural unity.'
  - id: douglass-rousseau-and-hobbes#u17-c5
    heading: 'Scope: an incomplete text and a selective reading'
    span: 252080:253252
    why: 'Sets the limits of the chapter and the handoff to the next chapter''s treatment of the passions.'
- nn: 18
  unit_id: ch3-state-of-nature-to-political-society
  note_id: douglass-rousseau-and-hobbes-ch3-state-of-nature-to-political-society
  span: 253254:269735
  chunks:
  - id: douglass-rousseau-and-hobbes#u18-c1
    heading: 'The Manuscrit''s starting point is not the golden age'
    span: 256398:257412
    why: 'States Douglass''s reading that Diderot and Pufendorf, not Hobbes, are Rousseau''s targets and that the Manuscrit starts from a late, already-miserable state of independence.'
  - id: douglass-rousseau-and-hobbes#u18-c2
    heading: 'Rousseau''s Hobbesian rejoinder to Diderot'
    span: 259057:260296
    why: 'Shows Rousseau restating Hobbes''s assurance problem: the independent man has no reason to be just unless others will be, so Diderot fails to show him his interest.'
  - id: douglass-rousseau-and-hobbes#u18-c3
    heading: 'Right without interest: why the general will as reason fails'
    span: 262782:265026
    why: 'Carries the core argument that a general will known by reason alone is neither motivating nor accessible, tying it to the opening problem of Du contrat social (justice and utility).'
  - id: douglass-rousseau-and-hobbes#u18-c4
    heading: 'What Hobbes actually held about natural law'
    span: 260298:261663
    why: 'Distinguishes Hobbes''s real view (laws of nature operative but binding in foro interno) from the reception in the natural law tradition.'
  - id: douglass-rousseau-and-hobbes#u18-c5
    heading: 'Accepting Hobbes''s problematic: the violent speaker and the remedy'
    span: 265028:266193
    why: 'Shows Rousseau, while blaming Hobbes for naturalizing the state of war, adopting Hobbes''s starting problem and setting the violent interlocutor as the test of any social order.'
  - id: douglass-rousseau-and-hobbes#u18-c6
    heading: 'The coherence problem and Douglass''s verdict'
    span: 267741:269733
    why: 'Sets out the tension with the Discours and the Du contrat social starting-point debate, and gives Douglass''s conclusion.'
- nn: 19
  unit_id: ch3-free-will-slavery-obligation
  note_id: douglass-rousseau-and-hobbes-ch3-free-will-slavery-obligation
  span: 269735:286550
  chunks:
  - id: douglass-rousseau-and-hobbes#u19-c1
    heading: 'Hobbes did not face the free-will problem'
    span: 269771:271014
    why: 'Sets the contrast between Hobbes''s implied-consent account of obligation and Rousseau''s commitment to free will.'
  - id: douglass-rousseau-and-hobbes#u19-c2
    heading: 'Force is a physical power; renouncing freedom renounces morality'
    span: 275664:276807
    why: 'Carries Rousseau''s argument that force does not make right, resting on the moral/physical distinction and free will, with his own words on renunciation.'
  - id: douglass-rousseau-and-hobbes#u19-c3
    heading: 'Free will and dualism as the basis of the response to Hobbes'
    span: 276809:277244
    why: 'States Douglass''s thesis that Rousseau''s anti-Hobbes arguments depend on dualism and free will, and situates them in the natural law tradition.'
  - id: douglass-rousseau-and-hobbes#u19-c4
    heading: 'Pufendorf: compulsion versus obligation'
    span: 278606:279576
    why: 'Gives the natural-law precedent for Rousseau''s distinction, including the claim that Hobbes offers coercion rather than obligation.'
  - id: douglass-rousseau-and-hobbes#u19-c5
    heading: 'The second pact and the Genevan patriciate'
    span: 283435:284695
    why: 'Explains why Rousseau saw Pufendorf''s and Burlamaqui''s sovereignty as no better than Hobbes''s, and links it to the Genevan controversies.'
  - id: douglass-rousseau-and-hobbes#u19-c6
    heading: 'Hobbes''s critics equally inimical to freedom; the problem restated'
    span: 285504:286548
    why: 'Draws the section''s conclusion and states the problem of the social contract that Rousseau''s later account of sovereignty must solve.'
- nn: 20
  unit_id: ch3-sovereignty-inverted
  note_id: douglass-rousseau-and-hobbes-ch3-sovereignty-inverted
  span: 286550:299126
  chunks:
  - id: douglass-rousseau-and-hobbes#u20-c1
    heading: 'Inverting the Hobbesian solution'
    span: 286572:287511
    why: 'States Douglass''s core thesis of inversion and that Rousseau extends Hobbes by denying even self-preservation as a right against the sovereign.'
  - id: douglass-rousseau-and-hobbes#u20-c2
    heading: 'Judgment, conscience and the absolute sovereign'
    span: 288549:289539
    why: 'Shows why Rousseau shares Hobbes''s rejection of rights against the sovereign, and flags that liberal critics overlook the real differences.'
  - id: douglass-rousseau-and-hobbes#u20-c3
    heading: 'Sovereignty as inalienable exercise of the general will'
    span: 291602:292175
    why: 'Gives the central inalienability argument and its restriction to the collective freedom of the people.'
  - id: douglass-rousseau-and-hobbes#u20-c4
    heading: 'Will cannot be transferred: Rousseau against Hobbes and natural law'
    span: 294395:295308
    why: 'Explains the theory of will underlying inalienability and the limited scope of Rousseau''s denial of contract.'
  - id: douglass-rousseau-and-hobbes#u20-c5
    heading: 'Absolute in power, limited in form: indivisibility and division of powers'
    span: 296724:297255
    why: 'Summarizes how Rousseau combines a division of powers with Hobbesian absolute sovereignty by definition.'
  - id: douglass-rousseau-and-hobbes#u20-c6
    heading: 'Republican and natural-law traditions used together'
    span: 298264:298518
    why: 'Douglass''s methodological conclusion about how Rousseau blends republican aims with natural-law tools in a Genevan context.'
- nn: 21
  unit_id: ch3-freedom-preserved
  note_id: douglass-rousseau-and-hobbes-ch3-freedom-preserved
  span: 299126:325767
  chunks:
  - id: douglass-rousseau-and-hobbes#u21-c1
    heading: 'Equal legislative right and freedom'
    span: 300112:301344
    why: 'States Douglass''s account of how the contract avoids dependence on a superior will and why representative sovereignty would breach moral equality.'
  - id: douglass-rousseau-and-hobbes#u21-c2
    heading: 'Emile on the two sorts of dependence'
    span: 305254:306276
    why: 'The block quotation that Douglass calls Rousseau''s clearest explanation of freedom and dependence and the source of ''substitute law for man''.'
  - id: douglass-rousseau-and-hobbes#u21-c3
    heading: 'Dependence on law as dependence on one''s own will'
    span: 306278:306964
    why: 'Douglass''s compact explanation of why law in accordance with the general will is compatible with freedom.'
  - id: douglass-rousseau-and-hobbes#u21-c4
    heading: 'The minority citizen must recognize the general will as his own'
    span: 310046:311776
    why: 'Douglass''s thesis that subjective recognition, not only objective content, is required for the general will to accord with free will.'
  - id: douglass-rousseau-and-hobbes#u21-c5
    heading: 'Overcoming the opposition of private and general wills'
    span: 322273:323359
    why: 'Douglass''s own position against the pluralistic reading, in dialogue with Cohen: private wills are permitted only where they do not oppose the general will.'
  - id: douglass-rousseau-and-hobbes#u21-c6
    heading: 'What freedom requires and what remains unsolved'
    span: 324977:325570
    why: 'Closing statement of the unit''s conclusion and the hand-off to the legislator and will-formation in later chapters.'
- nn: 22
  unit_id: ch3-law-nature-denaturing
  note_id: douglass-rousseau-and-hobbes-ch3-law-nature-denaturing
  span: 325767:341729
  chunks:
  - id: douglass-rousseau-and-hobbes#u22-c1
    heading: 'Williams versus Strauss on nature and justice in the Social Contract'
    span: 326795:328360
    why: 'Frames the scholarly dispute over whether nature is a transcendent standard in Rousseau and whether he follows Hobbesian positivism.'
  - id: douglass-rousseau-and-hobbes#u22-c2
    heading: 'Leibniz, Barbeyrac and the charge of Hobbism'
    span: 329354:330507
    why: 'Reconstructs how the accusation of Hobbism became a crude either-or between positivism and justice grounded in the nature of things.'
  - id: douglass-rousseau-and-hobbes#u22-c3
    heading: '''Law comes before justice'': a Ciceronian reading'
    span: 332664:333783
    why: 'Douglass''s central interpretive move, reading Rousseau''s law-before-justice against Hobbesian positivism via Cicero and legitimate law.'
  - id: douglass-rousseau-and-hobbes#u22-c4
    heading: 'Conventions must accord with nature: Rousseau and Hobbes on natural sanction'
    span: 335439:336760
    why: 'Shows Rousseau opposing a straw Hobbes while sharing with the real Hobbes the problem that natural law alone is insufficient.'
  - id: douglass-rousseau-and-hobbes#u22-c5
    heading: 'Denaturing as consistent with perfectible nature'
    span: 338061:339078
    why: 'Resolves the apparent contradiction of denaturing by distinguishing the descriptive independence of natural man from his inalienable God-given gifts.'
  - id: douglass-rousseau-and-hobbes#u22-c6
    heading: 'The legislator, freedom, and law as celestial voice'
    span: 340650:341727
    why: 'Concludes that the legislator serves freedom and the order of nature, ending the chapter on Rousseau''s claim to reassert the rights of nature.'
- nn: 23
  unit_id: ch3-unity-civil-religion
  note_id: douglass-rousseau-and-hobbes-ch3-unity-civil-religion
  span: 341729:354176
  chunks:
  - id: douglass-rousseau-and-hobbes#u23-c1
    heading: 'The Hobbesian problematic Rousseau accepts'
    span: 342424:343458
    why: 'States Douglass''s thesis that Rousseau shared Hobbes''s problem of mutual assurance and of uniting right with interest.'
  - id: douglass-rousseau-and-hobbes#u23-c2
    heading: 'Law above man, the general will, and political unity'
    span: 344299:345189
    why: 'Condenses Rousseau''s answer to the problem of politics and ties it to his concern for unity shared with Hobbes.'
  - id: douglass-rousseau-and-hobbes#u23-c3
    heading: 'Sovereign absolute in power but limited in form'
    span: 345191:346143
    why: 'Explains how Rousseau reconciles natural law as a normative standard with Hobbesian absoluteness of the sovereign.'
  - id: douglass-rousseau-and-hobbes#u23-c4
    heading: 'Rousseau''s praise of Hobbes on the two heads of the eagle'
    span: 346778:347231
    why: 'Presents Rousseau''s striking endorsement of Hobbes on religion and political unity, the passage the section turns on.'
  - id: douglass-rousseau-and-hobbes#u23-c5
    heading: 'Why the passage is audacious and marks a change of mind'
    span: 348722:349549
    why: 'Links Rousseau''s Christianity-versus-citizen argument to the Hobbism controversy and to Douglass''s claim about Rousseau''s shifting view of Hobbes.'
  - id: douglass-rousseau-and-hobbes#u23-c6
    heading: 'Civil religion as cultivation of citizenship, not merely removal of rivals'
    span: 353180:354174
    why: 'Contrasts Hobbes''s negative aim with Rousseau''s aim of ordering the citizens'' passions toward love of fatherland, setting up Chapter 4.'
- nn: 24
  unit_id: ch4-ordering-the-passions-opening
  note_id: douglass-rousseau-and-hobbes-ch4-ordering-the-passions-opening
  span: 354176:363030
  chunks:
  - id: douglass-rousseau-and-hobbes#u24-c1
    heading: 'Making men what one needs them to be'
    span: 354348:355185
    why: 'States the chapter''s core thesis that Rousseau''s project required ordering passions and forming the will through a well-ordered republic that makes love of fatherland dominant.'
  - id: douglass-rousseau-and-hobbes#u24-c2
    heading: 'Ordering the passions as a shared Hobbes-Rousseau problem'
    span: 357197:358165
    why: 'Douglass''s claim that both thinkers treated ordering the passions to secure political unity as central, grounding the comparison the chapter will draw.'
  - id: douglass-rousseau-and-hobbes#u24-c3
    heading: 'Will-formation and the rejection of proto-Kantian readings'
    span: 359009:360416
    why: 'Poses the problem of will-formation against nature and free will and announces the polemic against Kantian readings of autonomy and virtue.'
  - id: douglass-rousseau-and-hobbes#u24-c4
    heading: 'Contradiction as the source of human misery'
    span: 360948:361322
    why: 'Rousseau''s own statement of the contradiction and the unity it demands, which the ordering of the passions is meant to resolve.'
  - id: douglass-rousseau-and-hobbes#u24-c5
    heading: 'Amour-propre, virtue, and the neo-Augustinian context'
    span: 362064:363028
    why: 'Links recovering harmony to the positive potential of amour-propre and explains why the neo-Augustinian context frames Rousseau''s objection to Hobbes.'
- nn: 25
  unit_id: ch4-neutralizing-amour-propre
  note_id: douglass-rousseau-and-hobbes-ch4-neutralizing-amour-propre
  span: 363030:380727
  chunks:
  - id: douglass-rousseau-and-hobbes#u25-c1
    heading: 'Augustine: the right love and the two cities'
    span: 363991:364907
    why: 'States the Augustinian framing (good will as good love, self-love as the cause of the Fall) that the French tradition inherited and Rousseau opposed.'
  - id: douglass-rousseau-and-hobbes#u25-c2
    heading: 'Senault and Pascal: amour-propre evil only through Original Sin'
    span: 366848:368032
    why: 'Gives the characteristic Augustinian thesis that amour-propre became evil only through the Fall, the structure Rousseau later secularizes.'
  - id: douglass-rousseau-and-hobbes#u25-c3
    heading: 'Malebranche neutralizes amour-propre'
    span: 371622:372651
    why: 'Marks the decisive move from an evil to a morally neutral amour-propre in French thought before Rousseau.'
  - id: douglass-rousseau-and-hobbes#u25-c4
    heading: 'Rousseau''s distinction is set against Hobbes and Augustine'
    span: 376947:378023
    why: 'Douglass''s central claim that Rousseau reads Hobbes as sharing an Augustinian account of man, and why that matters for the purpose of political institutions.'
  - id: douglass-rousseau-and-hobbes#u25-c5
    heading: 'Original Sin recast as inequality and luxury'
    span: 378025:379133
    why: 'Presents Douglass''s reading of the Discours sur l''inégalité as a secularized Fall and the route to amour-propre turned toward political virtue.'
  - id: douglass-rousseau-and-hobbes#u25-c6
    heading: 'Emile: amour-propre as the extension of amour de soi-même'
    span: 379135:380725
    why: 'Gives the positive account of how the two loves are related and links Rousseau''s republicanism to natural goodness.'
- nn: 26
  unit_id: ch4-love-of-fatherland
  note_id: douglass-rousseau-and-hobbes-ch4-love-of-fatherland
  span: 380727:397240
  chunks:
  - id: douglass-rousseau-and-hobbes#u26-c1
    heading: 'Making a man or a citizen: why Emile is domestic education'
    span: 381836:382538
    why: 'It sets out the three educations and the man-or-citizen choice, which explains why the republican account of the passions must be drawn from Rousseau''s political writings.'
  - id: douglass-rousseau-and-hobbes#u26-c2
    heading: 'Patriots by inclination, by passion, by necessity'
    span: 385872:387010
    why: 'It gives Rousseau''s own words on public education identifying the citizen with the fatherland and converting a dangerous disposition into a sublime virtue.'
  - id: douglass-rousseau-and-hobbes#u26-c3
    heading: 'Activating amour-propre: public esteem, festivals, pride versus vanity'
    span: 388681:390563
    why: 'It shows that republican education cultivates amour-propre, through public esteem, festivals and the pride/vanity distinction, and makes love of fatherland derive from both passions.'
  - id: douglass-rousseau-and-hobbes#u26-c4
    heading: 'Overcoming the contradictions: one object for both passions, private will conforming to general will'
    span: 391112:392437
    why: 'It is Douglass''s central synthesis, linking the harmony of amour de soi-même and amour-propre to the conformity of private and general will.'
  - id: douglass-rousseau-and-hobbes#u26-c5
    heading: 'Nature as normative standard: the dispute with Cooper'
    span: 393443:394380
    why: 'It states Douglass''s thesis that the citizen''s life conforms to nature as a norm and marks his disagreement with Cooper''s reading.'
  - id: douglass-rousseau-and-hobbes#u26-c6
    heading: 'Montesquieu, the Augustinian context and Rousseau''s innovation'
    span: 395896:397238
    why: 'It places Rousseau against Montesquieu and other French writers, and against Hobbes and the neo-Augustinians, on the positive branch of amour-propre.'
- nn: 27
  unit_id: ch4-free-will-and-virtue
  note_id: douglass-rousseau-and-hobbes-ch4-free-will-and-virtue
  span: 397240:411420
  chunks:
  - id: douglass-rousseau-and-hobbes#u27-c1
    heading: 'The governor''s maxim: the appearance of freedom'
    span: 398956:399250
    why: 'This is the most forceful passage cited for the claim that Emile''s freedom is illusory, which the chapter sets out to rebut.'
  - id: douglass-rousseau-and-hobbes#u27-c2
    heading: 'Why Emile remains free despite the governor'
    span: 402357:404012
    why: 'It states Douglass''s central argument that freedom for Rousseau is non-dependence on other men''s wills and is compatible with planned circumstances.'
  - id: douglass-rousseau-and-hobbes#u27-c3
    heading: 'Moral freedom against proto-Kantian autonomy'
    span: 405030:405866
    why: 'It gives Douglass''s deflationary account of free will as conscious acquiescence or resistance, consistent with socially determined will-formation.'
  - id: douglass-rousseau-and-hobbes#u27-c4
    heading: 'Two conceptions of virtue'
    span: 409069:409968
    why: 'It resolves the duty-versus-inclination reading of virtue by distinguishing corrupt societies from a well-ordered republic where virtue is love of fatherland.'
  - id: douglass-rousseau-and-hobbes#u27-c5
    heading: 'Institutions master the will; life in accordance with nature'
    span: 410283:411418
    why: 'It concludes the argument, showing the republic''s citizens freely acquiesce in virtue while nature''s inalienable gifts are preserved.'
- nn: 28
  unit_id: ch4-reason-and-the-passions
  note_id: douglass-rousseau-and-hobbes-ch4-reason-and-the-passions
  span: 411420:425167
  chunks:
  - id: douglass-rousseau-and-hobbes#u28-c1
    heading: 'Passions in themselves are not evil'
    span: 416439:416919
    why: 'States Douglass''s core claim that reason orders passions and that conflict is between passions, aligning Rousseau with the Augustinian critique of Stoicism.'
  - id: douglass-rousseau-and-hobbes#u28-c2
    heading: 'Destroying the passions would contradict God'
    span: 416103:416437
    why: 'Rousseau''s own argument that annihilating the passions is contrary to the order of nature.'
  - id: douglass-rousseau-and-hobbes#u28-c3
    heading: 'Active judgement against Helvétius'
    span: 417695:418888
    why: 'Connects Rousseau''s account of reason as judgement to free will and to the rejection of reductive materialism.'
  - id: douglass-rousseau-and-hobbes#u28-c4
    heading: 'Conscience as innate sentiment'
    span: 419438:420199
    why: 'Shows how Rousseau answers empiricist scepticism about morals with conscience as sentiment rather than reason or innate ideas.'
  - id: douglass-rousseau-and-hobbes#u28-c5
    heading: 'Instrumental reason and the refutation of Kantian readings'
    span: 420201:421541
    why: 'Douglass''s fullest statement that reason cannot master the passions, aimed at Stoic and proto-Kantian interpretations.'
  - id: douglass-rousseau-and-hobbes#u28-c6
    heading: 'Politics must speak to the heart'
    span: 423771:424655
    why: 'Draws the political consequence: citizens are formed by cultivating passion, not by appeal to perfected reason.'
- nn: 29
  unit_id: ch4-hobbes-and-fear
  note_id: douglass-rousseau-and-hobbes-ch4-hobbes-and-fear
  span: 425167:440531
  chunks:
  - id: douglass-rousseau-and-hobbes#u29-c1
    heading: 'Reason as reckoning, passions as the source of ends'
    span: 427892:429191
    why: 'Douglass''s core argument that Hobbes''s right of self-preservation is deduced from the passions, so reason and passion are not opposed.'
  - id: douglass-rousseau-and-hobbes#u29-c2
    heading: 'Fear and the generation of the commonwealth'
    span: 431445:432549
    why: 'States that both institution and acquisition rest on fear of death and that Hobbes''s problem was ordering fear towards its rightful object.'
  - id: douglass-rousseau-and-hobbes#u29-c3
    heading: 'Dispelling superstitious fear'
    span: 432551:434261
    why: 'Explains how Leviathan''s last books redirect fear from invisible spirits to death and the state of nature, with Bramhall''s contemporary verdict.'
  - id: douglass-rousseau-and-hobbes#u29-c4
    heading: 'Pride, glory and equality'
    span: 436169:437125
    why: 'Presents pride as central to Hobbes''s account of war and shows the law of equality as the commonwealth''s remedy, the natural point of contact with Rousseau''s amour-propre.'
  - id: douglass-rousseau-and-hobbes#u29-c5
    heading: 'Education, imagination and the primacy of fear'
    span: 438101:439431
    why: 'Douglass qualifies the reading of Hobbes as transforming the human psyche by stressing that political education works through the imagination and fear.'
  - id: douglass-rousseau-and-hobbes#u29-c6
    heading: 'Fear for Hobbes, love for Rousseau'
    span: 439433:440529
    why: 'Concluding comparison that names the shared problem of ordering the passions and the contrast between Hobbesian fear and Rousseauian love.'
- nn: 30
  unit_id: ch4-of-love-and-fear
  note_id: douglass-rousseau-and-hobbes-ch4-of-love-and-fear
  span: 440531:448702
  chunks:
  - id: douglass-rousseau-and-hobbes#u30-c1
    heading: 'Completing the interpretation: love, amour-propre and the well-ordered republic'
    span: 440549:441793
    why: 'Douglass''s own summary thesis: Rousseau answers the Augustinian problem by ordering both forms of love toward love of fatherland.'
  - id: douglass-rousseau-and-hobbes#u30-c2
    heading: 'Natural goodness against Augustine and Hobbes'
    span: 442077:443035
    why: 'Carefully separates Hobbes''s actual view (passions are no sin, man not naturally evil) from Rousseau''s Augustinian reading of him.'
  - id: douglass-rousseau-and-hobbes#u30-c3
    heading: 'Nicole: fear of death as the first brake on amour-propre'
    span: 443596:443955
    why: 'Shows how Hobbesian ideas entered the Augustinian French tradition Rousseau knew, via Nicole''s enlightened amour-propre.'
  - id: douglass-rousseau-and-hobbes#u30-c4
    heading: 'Hobbes''s passion is fear'
    span: 445487:445924
    why: 'States the core contrast: fear restrains evil but cannot inspire good, so it is inadequate for Rousseau.'
  - id: douglass-rousseau-and-hobbes#u30-c5
    heading: 'Channelling amour-propre toward love of fatherland'
    span: 446848:447817
    why: 'Gives the positive programme: pride redirected to political virtue, harmonizing amour de soi-même and amour-propre.'
  - id: douglass-rousseau-and-hobbes#u30-c6
    heading: 'Fear for the fallen, love for the good; the secular fall'
    span: 448083:448700
    why: 'Closes the argument and states its limiting condition: the republic is for the naturally good, before luxury and inequality corrupt.'
- nn: 31
  unit_id: conclusion-engagement-in-context
  note_id: douglass-rousseau-and-hobbes-conclusion-engagement-in-context
  span: 448702:458643
  chunks:
  - id: douglass-rousseau-and-hobbes#u31-c1
    heading: 'Neither Hobbesian nor anti-Hobbesian'
    span: 448929:449943
    why: 'States Douglass''s thesis against Strauss-style Hobbesian readings while refusing a simply anti-Hobbesian one.'
  - id: douglass-rousseau-and-hobbes#u31-c2
    heading: 'How little direct evidence there is of Rousseau reading Hobbes'
    span: 452403:453548
    why: 'Sets the evidential limits: Discours sur l''inégalité and probably De cive only, with Leviathan not to be assumed.'
  - id: douglass-rousseau-and-hobbes#u31-c3
    heading: 'Modern natural law as the context and target'
    span: 454502:455450
    why: 'Explains why Rousseau''s invocations of Hobbes were polemical and aimed at Hobbes''s natural-law critics.'
  - id: douglass-rousseau-and-hobbes#u31-c4
    heading: 'Doux commerce as implicit Hobbism'
    span: 455452:456434
    why: 'Connects the luxury and commerce debate to Rousseau''s charge that its defenders assumed a Hobbesian state of nature.'
  - id: douglass-rousseau-and-hobbes#u31-c5
    heading: 'Rousseau''s polemic and the charge of misreading Hobbes'
    span: 456436:457327
    why: 'Douglass claims novelty and answers the objection that Rousseau missed the nuances of Hobbes.'
  - id: douglass-rousseau-and-hobbes#u31-c6
    heading: 'Answering Tuck: what Rousseau thought he was doing'
    span: 457710:458300
    why: 'Gives the book''s short answer and names human nature and free will as the fundamental disagreements.'
- nn: 32
  unit_id: conclusion-oppositions-and-affinities
  note_id: douglass-rousseau-and-hobbes-conclusion-oppositions-and-affinities
  span: 458643:472849
  chunks:
  - id: douglass-rousseau-and-hobbes#u32-c1
    heading: 'Denying sociability does not make Rousseau a Hobbesian'
    span: 458685:459455
    why: 'It states the closet-Hobbesian charge and Douglass''s reply that a shared denial of natural sociability rests on different principles.'
  - id: douglass-rousseau-and-hobbes#u32-c2
    heading: 'Shared diagnosis: disordered passions, unified will, civil religion'
    span: 460411:462167
    why: 'It lays out the points on which Douglass grants that Hobbes and Rousseau agreed about the problems of politics.'
  - id: douglass-rousseau-and-hobbes#u32-c3
    heading: 'Sovereignty: force and alienation versus freedom'
    span: 462169:463468
    why: 'It explains Rousseau''s opposition to Hobbes''s sovereignty through the moral/physical distinction and the illegitimacy of alienated or representative sovereignty.'
  - id: douglass-rousseau-and-hobbes#u32-c4
    heading: 'Free will explains the opposition'
    span: 463470:464305
    why: 'It names competing metaphysics of free will (self-preservation versus life and freedom) as the explanation for the political divergence.'
  - id: douglass-rousseau-and-hobbes#u32-c5
    heading: 'Douglass''s non-Kantian account of freedom and the cultivation of the passions'
    span: 466069:468049
    why: 'It gives Douglass''s own definition of Rousseauian freedom as choice among inclinations and shows why education of the passions is compatible with it.'
  - id: douglass-rousseau-and-hobbes#u32-c6
    heading: 'Natural goodness and the republic for the naturally good'
    span: 470896:472847
    why: 'It identifies natural goodness as the deepest difference from Hobbes and states both the possibility and the limit it creates for Rousseau''s republicanism.'
- nn: 33
  unit_id: conclusion-republics-naturally-good
  note_id: douglass-rousseau-and-hobbes-conclusion-republics-naturally-good
  span: 472849:482465
  chunks:
  - id: douglass-rousseau-and-hobbes#u33-c1
    heading: 'The Mirabeau dilemma and the verdict on the children of Adam'
    span: 472883:474505
    why: 'States Douglass''s overall conclusion by returning to the Lettre à Mirabeau dilemma between utopianism and Hobbism.'
  - id: douglass-rousseau-and-hobbes#u33-c2
    heading: 'Republic for the naturally good; against Hanley''s moderate Rousseau'
    span: 474507:476561
    why: 'Links the conclusion to the rejection of Hobbes''s state of nature and disputes the reading of Rousseau as moderate and modern.'
  - id: douglass-rousseau-and-hobbes#u33-c3
    heading: 'Criteria for good laws, Corsica, and agriculture against commerce'
    span: 476563:478139
    why: 'Shows the concrete conditions (common bond, self-sufficiency, agriculture) under which Rousseau thought republican institutions possible.'
  - id: douglass-rousseau-and-hobbes#u33-c4
    heading: 'Small republics, Geneva, and irreversible corruption'
    span: 479145:481295
    why: 'Explains why size and economic development both limit the republic, and why luxury makes love of fatherland unattainable.'
  - id: douglass-rousseau-and-hobbes#u33-c5
    heading: 'Obsolete vision, enduring critique of commercial society'
    span: 481297:482464
    why: 'Closes the book by distinguishing the obsolete republican vision from the critique that Adam Smith had to answer.'
