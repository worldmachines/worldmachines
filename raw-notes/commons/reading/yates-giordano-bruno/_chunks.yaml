source: yates-giordano-bruno
units:
- nn: 1
  unit_id: preface
  note_id: yates-giordano-bruno-preface
  span: 0:6017
  chunks:
  - id: yates-giordano-bruno#u01-c1
    heading: 'The Bruno problem and the missing clue'
    span: 9:767
    why: 'States the problem that drives the whole book: doubt about the Copernican reading of Bruno''s Supper and the sense that a clue was absent.'
  - id: yates-giordano-bruno#u01-c2
    heading: 'Recent scholarship on Renaissance Hermetism'
    span: 769:1870
    why: 'Maps the scholarly lineage (Kristeller, Garin, Walker) on which Yates builds and notes Walker''s distinctions among Renaissance attitudes to magic.'
  - id: yates-giordano-bruno#u01-c3
    heading: 'The sudden realisation: Hermetism as the key'
    span: 2334:2599
    why: 'Gives Yates''s central claim in compressed form: Bruno''s magic belongs with his philosophy as part of a Hermetic philosophy.'
  - id: yates-giordano-bruno#u01-c4
    heading: 'Scope of the book and the three strands'
    span: 2600:3664
    why: 'Defines what the book is and is not, and names the memory and Lullist strands left for other studies.'
  - id: yates-giordano-bruno#u01-c5
    heading: 'Plan: Hermetism, Bruno, Campanella, and the weakening of the tradition'
    span: 4391:5344
    why: 'Lays out the structure of the argument, including the dating of the Hermetica and the setting of seventeenth-century thought.'
- nn: 2
  unit_id: ch01-hermes-trismegistus
  note_id: yates-giordano-bruno-ch01-hermes-trismegistus
  span: 6017:42571
  chunks:
  - id: yates-giordano-bruno#u02-c1
    heading: 'The Renaissance return to a golden age of magic rested on an error in dating'
    span: 7497:8435
    why: 'States Yates''s central thesis: the Magus''s golden age was a misdated second-to-third-century gnostic pagan world, not Egyptian antiquity.'
  - id: yates-giordano-bruno#u02-c2
    heading: 'What the Hermetica actually are'
    span: 9455:10275
    why: 'Gives Yates''s hedged scholarly dating and characterisation of the Asclepius and Corpus Hermeticum against the Renaissance belief.'
  - id: yates-giordano-bruno#u02-c3
    heading: 'Lactantius''s Hermes as Gentile prophet'
    span: 22016:22966
    why: 'Shows how patristic authority made Hermes a safe Christian ally, the basis for the Magus''s Christian standing.'
  - id: yates-giordano-bruno#u02-c4
    heading: 'Augustine''s difficulty and three Hermetist responses'
    span: 27137:28108
    why: 'Sets out the options open to Renaissance Hermetists and contrasts Ficino''s timid evasion with Bruno''s bold reversal.'
  - id: yates-giordano-bruno#u02-c5
    heading: 'Cosimo orders Hermes before Plato, 1463'
    span: 31010:32024
    why: 'Documents the striking priority given to the Hermetica, the concrete event embodying the misdating''s consequences.'
  - id: yates-giordano-bruno#u02-c6
    heading: 'Ficino''s genealogy of wisdom in the Pimander argumentum'
    span: 33703:35348
    why: 'Presents Ficino''s prisca theologia chain from Mercurius to Plato and Yates''s judgment of Hermes''s importance in it.'
- nn: 3
  unit_id: ch02-pimander-asclepius-1
  note_id: yates-giordano-bruno-ch02-pimander-asclepius-1
  span: 42571:66341
  chunks:
  - id: yates-giordano-bruno#u03-c1
    heading: 'Approaching the Hermetica as Ficino did'
    span: 44386:45216
    why: 'States Yates''s method of suspending the modern dating in order to recover the Renaissance reader''s experience of a vast Egyptian antiquity.'
  - id: yates-giordano-bruno#u03-c2
    heading: 'Optimist and pessimist gnosis'
    span: 46470:47384
    why: 'Gives Festugiere''s two-way classification of Hermetic attitudes to the star-ruled world, which underlies the later magical use of the texts.'
  - id: yates-giordano-bruno#u03-c3
    heading: 'Ficino''s commentary: an Egyptian Moses'
    span: 54328:55674
    why: 'Records Ficino''s reading of the Pimander as Mosaic and Christian prophecy, the source of the aura of sanctity around Hermes.'
  - id: yates-giordano-bruno#u03-c4
    heading: 'The Egyptian Adam versus the Mosaic Adam'
    span: 57431:58870
    why: 'Yates''s own argument that the Egyptian Genesis makes Man a divine, creative being related to the star demons, unlike Moses''s disobedient Adam.'
  - id: yates-giordano-bruno#u03-c5
    heading: 'Man as Magus and the magnum miraculum'
    span: 60261:60979
    why: 'Names the Magus theme and links the Genesis to the Asclepius passage on human dignity that Pico would echo.'
  - id: yates-giordano-bruno#u03-c6
    heading: 'Regeneration and the twelve Punishments'
    span: 63547:64243
    why: 'Explains the Hermetic regeneration as a substitution of divine Powers for astral influences, the soteriological core of Corpus Hermeticum XIII.'
- nn: 4
  unit_id: ch02-pimander-asclepius-2
  note_id: yates-giordano-bruno-ch02-pimander-asclepius-2
  span: 66341:93484
  chunks:
  - id: yates-giordano-bruno#u04-c1
    heading: 'Optimist versus pessimist gnosis'
    span: 69785:70333
    why: 'Yates''s own distinction between the Hermetic gnosis that flees a bad matter and the one that reflects a good, divine world in the mind.'
  - id: yates-giordano-bruno#u04-c2
    heading: 'The making of gods (Asclepius)'
    span: 80140:81381
    why: 'The key Hermetic text for god-making statues and sympathetic magic, which Yates treats as the charter for Renaissance magic.'
  - id: yates-giordano-bruno#u04-c3
    heading: 'The Lament: old age and rebirth of the world'
    span: 85241:86269
    why: 'The Asclepius''s decline-and-restoration eschatology, the passage Augustine and Renaissance readers interpreted so differently.'
  - id: yates-giordano-bruno#u04-c4
    heading: 'Rehabilitation of the Asclepius and astral magic'
    span: 88562:89443
    why: 'Yates''s central hypothesis that the Asclepius''s rehabilitation via the Corpus Hermeticum was a chief factor in the Renaissance revival of magic.'
  - id: yates-giordano-bruno#u04-c5
    heading: 'Rereading the Lament'
    span: 89445:90236
    why: 'Yates''s argument that the Lament shifts from Augustine''s demonic prophecy to a call to reform a decayed Christianity with Egyptian piety.'
  - id: yates-giordano-bruno#u04-c6
    heading: 'Hermes Trismegistus on the Siena pavement'
    span: 90238:91233
    why: 'Visual evidence of Hermes as revered Gentile prophet, dated even earlier than Lactantius and Augustine had done.'
- nn: 5
  unit_id: ch03-hermes-and-magic
  note_id: yates-giordano-bruno-ch03-hermes-and-magic
  span: 93484:127596
  chunks:
  - id: yates-giordano-bruno#u05-c1
    heading: 'Mechanics of sympathetic and astral magic'
    span: 94737:96626
    why: 'Yates''s compact account of how talismanic magic works (occult sympathies, images capturing star-spirit, chains of influence) and of its unity across material and religious uses.'
  - id: yates-giordano-bruno#u05-c2
    heading: 'Picatrix: spiritus, materia and the art of talismans'
    span: 107259:108081
    why: 'States the metaphysics behind talismanic magic in Picatrix (descent of spiritus into materia) that Yates presents as close to Hermetic philosophy and to Ficino''s own concerns.'
  - id: yates-giordano-bruno#u05-c3
    heading: 'Hermes and the city of Adocentyn (Picatrix, book IV)'
    span: 112275:113846
    why: 'The key primary text in which Hermes founds an animated, astrally regulated city, on which Yates builds her reading of Hermetic magic as social and religious ordering.'
  - id: yates-giordano-bruno#u05-c4
    heading: 'Yates on Adocentyn and the restored Egyptian religion'
    span: 114915:116571
    why: 'Yates''s own interpretation linking Adocentyn to Plato''s Republic, to the Asclepius''s Lament and to the prophecy of Egyptian religion''s restoration.'
  - id: yates-giordano-bruno#u05-c5
    heading: 'Ficino, Walker and the Picatrix as bridge to practice'
    span: 118589:119278
    why: 'Yates''s hedged argument for how Ficino moved from Hermetic philosophy to talismanic practice, attributing the exemplar to Walker.'
  - id: yates-giordano-bruno#u05-c6
    heading: 'Ficino''s misdated return to Julian''s gnosis; astral magic defined'
    span: 125733:127193
    why: 'The thesis passage: Ficino''s return to Hermes is really to the pagan Egyptianising gnosis of Julian, and the magic at issue is defined as astral rather than astrological, a way of escaping determinism.'
- nn: 6
  unit_id: ch04-ficino-natural-magic-1
  note_id: yates-giordano-bruno-ch04-ficino-natural-magic-1
  span: 127596:143975
  chunks:
  - id: yates-giordano-bruno#u06-c1
    heading: 'Ficino the physician: medicine with talismans inside'
    span: 127632:128554
    why: 'States Yates''s framing of the Libri de Vita as normal astrological medicine that nonetheless carries a nervous, imaginative talismanic magic.'
  - id: yates-giordano-bruno#u06-c2
    heading: 'The Plotinus commentary as justification of Asclepius magic'
    span: 136325:137275
    why: 'Yates''s core thesis for the chapter: the De vita coelitus comparanda defends Hermetic talismanic magic on Neoplatonic grounds and is primarily a commentary on Trismegistus.'
  - id: yates-giordano-bruno#u06-c3
    heading: 'The Magus, the circuit of images, and ancient images (Garin, Gombrich)'
    span: 135339:136323
    why: 'Explains the Magus''s semi-divine role and the Renaissance Neoplatonist''s belief that ancient images literally contain an echo of an Idea.'
  - id: yates-giordano-bruno#u06-c4
    heading: 'From Aquinas''s demons to a magic that draws on the world'
    span: 139056:139965
    why: 'Yates''s reconstruction of how Ficino cleared Hermes of demonic magic, making celestial images intermediaries in a Neoplatonic hierarchy.'
  - id: yates-giordano-bruno#u06-c5
    heading: 'Spiritus mundi as the channel of stellar influence'
    span: 141404:142569
    why: 'Defines the spiritus theory (spiritus mundi between world soul and body, drunk by man''s spirit) on which Ficino''s method of drawing down the life of heaven rests.'
  - id: yates-giordano-bruno#u06-c6
    heading: 'Picatrix as the likely source of the pneumatic theory'
    span: 142571:143973
    why: 'Yates''s hedged source-argument: the clear-cut spiritus theory and talisman practice is in the Picatrix, not Plotinus, linking Ficino to medieval Arabic astral magic.'
- nn: 7
  unit_id: ch04-ficino-natural-magic-2
  note_id: yates-giordano-bruno-ch04-ficino-natural-magic-2
  span: 143975:172664
  chunks:
  - id: yates-giordano-bruno#u07-c1
    heading: 'Picatrix resemblances and Ficino''s preference for planet images'
    span: 147883:149464
    why: 'Yates weighs Ficino''s dependence on the Picatrix and proposes that choosing planet over decan images was a way of keeping his magic natural rather than demonic.'
  - id: yates-giordano-bruno#u07-c2
    heading: 'Figures of the world as functional art and memory images'
    span: 155381:157253
    why: 'States that Ficino''s world-figures are functional magical objects that regulate astral influences and prefigure Bruno''s memory system built on celestial images.'
  - id: yates-giordano-bruno#u07-c3
    heading: 'The Primavera as complex talisman'
    span: 159329:160321
    why: 'Yates''s hedged proposal that Botticelli''s Primavera is a practical application of Ficino''s natural magic and stores the spiritus mundi.'
  - id: yates-giordano-bruno#u07-c4
    heading: 'Orphic singing as aural talismanic magic'
    span: 161973:162987
    why: 'Explains Ficino''s Orphic singing as the vocal parallel of talismans, both working through the spiritus and planetary harmony.'
  - id: yates-giordano-bruno#u07-c5
    heading: 'Continuity between medieval and Renaissance magic'
    span: 167258:169384
    why: 'Yates''s thesis that Ficino''s elegant natural magic is continuous with the Picatrix tradition and parallels Warburg and Saxl''s account of the classical return of the gods.'
  - id: yates-giordano-bruno#u07-c6
    heading: 'Ficino''s magic as religion, the Asclepius and Hermes in the Church'
    span: 171135:172662
    why: 'Ties Ficino''s magic to the Egyptian magical religion of the Asclepius, Lactantius''s Hermes and the Siena Duomo, which merges the histories of magic and religion.'
- nn: 8
  unit_id: ch05-pico-cabalist-magic-1
  note_id: yates-giordano-bruno-ch05-pico-cabalist-magic-1
  span: 172664:188094
  chunks:
  - id: yates-giordano-bruno#u08-c1
    heading: 'Practical Cabala as an added, more ambitious magic'
    span: 172976:173911
    why: 'Defines Pico''s key innovation, practical Cabala, and contrasts it with Ficino''s natural magic.'
  - id: yates-giordano-bruno#u08-c2
    heading: 'Hermetism and Cabalism united through the Word'
    span: 175832:177585
    why: 'States Yates''s thesis that Pico founded the Hermetic-Cabalist tradition and why the two traditions fit together.'
  - id: yates-giordano-bruno#u08-c3
    heading: 'Marrying the world: Pico''s natural magic'
    span: 180969:181582
    why: 'Yates''s interpretation of Conclusions 3, 5 and 13 as sympathetic, talismanic magic linking heaven and earth.'
  - id: yates-giordano-bruno#u08-c4
    heading: 'Characters and figures over material qualities'
    span: 181891:182688
    why: 'Shows that Pico''s natural magic includes operative magical signs, as in Picatrix and Ficino''s talismans.'
  - id: yates-giordano-bruno#u08-c5
    heading: 'The Oration and the Asclepius'
    span: 185146:186048
    why: 'Links Pico''s Magus, and the marriage of earth to heaven, directly to the Hermetic Asclepius and the magnum miraculum.'
  - id: yates-giordano-bruno#u08-c6
    heading: 'Natural magic is weak without Cabala'
    span: 186428:188092
    why: 'Presents the 15th, 21st and 22nd Conclusions and Yates''s verdict that Ficino''s magic was harmless but weak.'
- nn: 9
  unit_id: ch05-pico-cabalist-magic-2
  note_id: yates-giordano-bruno-ch05-pico-cabalist-magic-2
  span: 188094:212591
  chunks:
  - id: yates-giordano-bruno#u09-c1
    heading: 'Spanish Cabala: the Sephiroth, the Names and the cosmos'
    span: 188094:189650
    why: 'Gives Yates''s baseline account of the Sephiroth as creative Names, their link to the cosmic spheres and angelic hierarchies, which the rest of the unit presupposes.'
  - id: yates-giordano-bruno#u09-c2
    heading: 'Practical Cabala and Pico''s Christian Hebrew studies'
    span: 190654:194294
    why: 'Lists the techniques of practical Cabala (angel names, Notarikon, Temurah, Gematria) and shows Pico''s motive of confirming Christianity through Cabala.'
  - id: yates-giordano-bruno#u09-c3
    heading: 'Pico''s two Cabalas and the supreme part of natural magic'
    span: 197045:198042
    why: 'Yates''s central interpretation: Pico''s relevant Cabala is a magic above natural magic, reaching beyond the stars, with her hedged reading stated openly.'
  - id: yates-giordano-bruno#u09-c4
    heading: 'Twenty-sixth magical conclusion: pure Cabala reaches the first cause'
    span: 201916:202211
    why: 'States the decisive contrast between natural magic (intermediary causes, stars) and pure Cabala (immediate operation through God).'
  - id: yates-giordano-bruno#u09-c5
    heading: 'Sephiroth and spheres: Cabala as completion of natural magic'
    span: 206111:206472
    why: 'Explains why the Sephiroth-sphere correspondence lets Cabalist magic be a higher form of Ficinian astral magic rather than a separate thing.'
  - id: yates-giordano-bruno#u09-c6
    heading: 'The complete Magus, subjective practice, and the artists'
    span: 210996:212589
    why: 'Concludes that Pico''s Magus practised both Magia and practical Cabala, probably subjectively, and extends the operative Magus to Renaissance artists.'
- nn: 10
  unit_id: ch05-pico-cabalist-magic-3
  note_id: yates-giordano-bruno-ch05-pico-cabalist-magic-3
  span: 212591:240217
  chunks:
  - id: yates-giordano-bruno#u10-c1
    heading: 'Pico''s magic enters religion: Psalms as incantations'
    span: 212591:213510
    why: 'States Yates''s claim that Pico''s Magia-plus-Cabala made religious cult itself a magical operation.'
  - id: yates-giordano-bruno#u10-c2
    heading: 'The changed status of the magician'
    span: 219614:220947
    why: 'Yates''s account of the necromancer and conjuror transformed into the Renaissance Magus, with continuity of technique.'
  - id: yates-giordano-bruno#u10-c3
    heading: 'Hermetic Powers and Cabalist Sephiroth as one experience'
    span: 224686:225391
    why: 'Her hedged interpretation that Pico married Hermetism and Cabalism at the level of religious experience, not just magic.'
  - id: yates-giordano-bruno#u10-c4
    heading: 'Man the Magus as divine man on a gnostic basis'
    span: 227875:228526
    why: 'Argues the Dignity of Man as operator rests on the gnostic Asclepius rather than orthodox patristic ideas.'
  - id: yates-giordano-bruno#u10-c5
    heading: 'Garcia''s refutation of Pico and of ecclesiastical magic'
    span: 231384:232740
    why: 'Gives the theological case against magic that framed the sixteenth-century controversy over magic and religious practice.'
  - id: yates-giordano-bruno#u10-c6
    heading: 'The Borgia frescoes and Pico''s significance'
    span: 239389:240215
    why: 'Yates''s thesis that Alexander VI adopted Pico''s Magia-Cabala programme, and her closing verdict on man as Magus acting by science.'
- nn: 11
  unit_id: ch06-pseudo-dionysius
  note_id: yates-giordano-bruno-ch06-pseudo-dionysius
  span: 240217:264497
  chunks:
  - id: yates-giordano-bruno#u11-c1
    heading: 'Ficino''s magic with an angelic continuation'
    span: 246815:247221
    why: 'Yates states, with hedging, that Ficino''s Spiritus magic continues into angelic orders but does not operate with angels.'
  - id: yates-giordano-bruno#u11-c2
    heading: 'Pico''s practical Cabala reaches the angels'
    span: 253299:253716
    why: 'This is Yates''s central distinction between Ficino''s contemplative and Pico''s operative relation to the angelic world.'
  - id: yates-giordano-bruno#u11-c3
    heading: 'Pico astrologises the hierarchies'
    span: 250772:251369
    why: 'It shows Pico mapping angelic hierarchies to three worlds with special influences, and Yates separates this from Dionysius himself.'
  - id: yates-giordano-bruno#u11-c4
    heading: 'Negative theology and Hermes confirming Dionysius'
    span: 255756:256828
    why: 'It presents Dionysius''s God of no name and all names, Ficino''s commentary tying it to the Asclepius, and the Hermetic text itself.'
  - id: yates-giordano-bruno#u11-c5
    heading: 'Astrologising mysticism, mysticising astrology'
    span: 258333:259136
    why: 'Yates''s own statement of the chapter''s thesis on the blurred boundary between religion and magic.'
  - id: yates-giordano-bruno#u11-c6
    heading: 'Comparative religion and the optimist gnosis'
    span: 262178:263960
    why: 'It sums up her argument that Ficino and Pico linked Hermetic, Dionysian and Cabalist schemes on a wrong chronology, and how they misread dualism.'
- nn: 12
  unit_id: ch07-agrippa-survey
  note_id: yates-giordano-bruno-ch07-agrippa-survey
  span: 264497:291699
  chunks:
  - id: yates-giordano-bruno#u12-c1
    heading: 'Agrippa''s place and the safety-device of the vanity book'
    span: 264559:266386
    why: 'Yates states why Agrippa matters (a clear survey, and Bruno''s source) and how his anti-magic book functions as a protective device.'
  - id: yates-giordano-bruno#u12-c2
    heading: 'Beyond Ficino: the demonic magic of the Asclepius'
    span: 270243:270775
    why: 'Shows Yates''s argument that Agrippa abandons Ficino''s care to avoid demons and revives the Asclepius''s god-making magic.'
  - id: yates-giordano-bruno#u12-c3
    heading: 'Who can give soul to an image: the Agrippan Magus'
    span: 276199:278267
    why: 'Agrippa''s own words on vivifying images plus Yates''s gloss on the Magus mounting through three worlds to the Creator''s power, the high point of the celestial-magic survey.'
  - id: yates-giordano-bruno#u12-c4
    heading: 'Magia and Cabala as the direct result of prisca theologia'
    span: 286264:287555
    why: 'Yates''s structural thesis that Agrippa carries Ficino and Pico to their logical conclusion and that prisca theologia was always a prisca magia.'
  - id: yates-giordano-bruno#u12-c5
    heading: 'The Magus as priest and the pseudo-Egyptian theocracy'
    span: 288228:289967
    why: 'Argues that Agrippa''s conjuring is Renaissance and not medieval, and that its logic points to the priestly theocracy of the Hermetic Asclepius.'
  - id: yates-giordano-bruno#u12-c6
    heading: 'Magic, religion, reform and the handoff to Bruno'
    span: 289969:291697
    why: 'Poses the hedged questions about magic and religious reform and names Agrippa''s two-kinds-of-religious-magic scheme as Bruno''s source.'
- nn: 13
  unit_id: ch08-magic-and-science
  note_id: yates-giordano-bruno-ch08-magic-and-science
  span: 291699:316624
  chunks:
  - id: yates-giordano-bruno#u13-c1
    heading: 'Man the operator and the ape of nature'
    span: 292313:293537
    why: 'States Yates''s image of the Magus as clever ape of nature who gains power by imitating nature''s working, the chapter''s opening premise.'
  - id: yates-giordano-bruno#u13-c2
    heading: 'Number as master-key and the place of mathematics in Agrippa''s scheme'
    span: 296811:297595
    why: 'Her measured claim that number is a master-key to operations, with the caveat that mystical number will not by itself produce working mathematics.'
  - id: yates-giordano-bruno#u13-c3
    heading: 'John Dee as exemplar of the will to operate'
    span: 302849:303292
    why: 'Yates''s direct statement of how the will to operate in religious magic could pass into applied science.'
  - id: yates-giordano-bruno#u13-c4
    heading: 'Copernicus in the framework of the Hermetic sun'
    span: 311452:312466
    why: 'Her argument that Copernicus''s mathematics came wrapped in Ficinian and Hermetic sun-religion, with her own alternative hedged explanations.'
  - id: yates-giordano-bruno#u13-c5
    heading: 'Bruno turns Copernicus back into Hermetism'
    span: 313520:313812
    why: 'Distinguishes Copernicus''s science from Bruno''s Hermetic reading and anticipates the book''s Bruno thesis.'
  - id: yates-giordano-bruno#u13-c6
    heading: 'The Magus changed the will'
    span: 314492:315521
    why: 'The chapter''s central thesis: Greek and mediaeval attitudes against operating versus the Magus''s dignifying of operation.'
- nn: 14
  unit_id: ch09-against-magic
  note_id: yates-giordano-bruno-ch09-against-magic
  span: 316624:338766
  chunks:
  - id: yates-giordano-bruno#u14-c1
    heading: 'The growing outcry against Renaissance magic'
    span: 316735:317602
    why: 'States the thesis of the theological section: magic''s religious pretensions made it a target for both Catholic and Protestant opinion.'
  - id: yates-giordano-bruno#u14-c2
    heading: 'Del Rio and the Counter-Reformation verdict'
    span: 319637:320328
    why: 'Shows that Ficino''s talismans, Pico''s practical Cabala and Agrippa were all rejected by authoritative Catholic opinion.'
  - id: yates-giordano-bruno#u14-c3
    heading: 'The Latin humanist''s correct chronology versus Ficino''s gullibility'
    span: 321595:322932
    why: 'Contrasts humanist historical and philological realism with the false chronology of the prisca theologia, Yates''s central dating argument.'
  - id: yates-giordano-bruno#u14-c4
    heading: 'Pico to Barbaro: the difference in aim between the traditions'
    span: 325537:326302
    why: 'Yates''s gloss on Pico''s letter makes explicit the trivium-versus-quadrivium divide and the ironic point about philology undoing the Magi.'
  - id: yates-giordano-bruno#u14-c5
    heading: 'Erasmus: religious humanism against the Magus'
    span: 329120:330777
    why: 'Presents Erasmus''s alternative return to Christian sources through printing as the anti-Hermetic prisca theologia.'
  - id: yates-giordano-bruno#u14-c6
    heading: 'Bruno as Ficinian Magus at Erasmian Oxford'
    span: 335584:337641
    why: 'Connects the humanist opposition to Bruno''s 1583 Oxford debate and the McNulty discovery, previewing the book''s Bruno thesis.'
- nn: 15
  unit_id: ch10-religious-hermetism
  note_id: yates-giordano-bruno-ch10-religious-hermetism
  span: 338766:377582
  chunks:
  - id: yates-giordano-bruno#u15-c1
    heading: 'Hermetism without the magic'
    span: 338823:340020
    why: 'States Yates''s definition of religious Hermetism: magic removed, Christian parallels (Genesis, the Word, regeneration) freed for enthusiastic development.'
  - id: yates-giordano-bruno#u15-c2
    heading: 'Casaubon and the Christian penetration of the Hermetica'
    span: 340022:340839
    why: 'Sets Casaubon''s 1614 dating against the Christian reading, showing that the first critical attack assumed Christian forgery.'
  - id: yates-giordano-bruno#u15-c3
    heading: 'Mornay, Antwerp and the Erasmian tradition'
    span: 354920:355703
    why: 'Yates''s argument that Hermetism and Erasmian tolerance converge in the longing to escape religious dissension.'
  - id: yates-giordano-bruno#u15-c4
    heading: 'Patrizi''s petition to Gregory XIV'
    span: 363534:365472
    why: 'Shows the Hermetic Counter Reformation programme (Hermetica instead of Aristotle to win Protestants) in Patrizi''s own words and Yates''s reading.'
  - id: yates-giordano-bruno#u15-c5
    heading: 'Bruno abandons the Christian Hermes'
    span: 368373:368946
    why: 'Hinge sentence placing Bruno against pious Hermetism and explaining his worse fate.'
  - id: yates-giordano-bruno#u15-c6
    heading: 'More''s Utopian toleration as the anticipated palliative'
    span: 372550:373316
    why: 'Yates''s claim that More, before the disasters, prefigured religious Hermetism as the answer to religious violence.'
- nn: 16
  unit_id: ch11-bruno-first-paris
  note_id: yates-giordano-bruno-ch11-bruno-first-paris
  span: 377582:404721
  chunks:
  - id: yates-giordano-bruno#u16-c1
    heading: 'Renaissance magic memory: the cosmos as place system'
    span: 379814:381140
    why: 'States Yates''s thesis that the classical art of memory was reinterpreted by Neoplatonists and Hermetists as a magical method of reflecting the universe in the mind.'
  - id: yates-giordano-bruno#u16-c2
    heading: 'The Hermes dialogue in De umbris idearum'
    span: 385886:387077
    why: 'Shows Bruno''s book as written by Hermes and reads the Asclepius Lament as an anti-Christian claim for the Egyptian religion.'
  - id: yates-giordano-bruno#u16-c3
    heading: 'Talismans, Egyptian gnosis and the Magus''s memory'
    span: 390234:393994
    why: 'Carries Yates''s core reading of the shadows of ideas as celestial magic images and their link to the Hermetic experience of becoming Aion, quoting Corpus Hermeticum XI.'
  - id: yates-giordano-bruno#u16-c4
    heading: 'Circe''s incantations and Ficinian versus barbaric magic'
    span: 397579:398555
    why: 'Yates''s tentative explanation of why the Cantus Circaeus pairs planetary incantations with an art of memory, and her contrast between Ficinian and Brunian magic.'
  - id: yates-giordano-bruno#u16-c5
    heading: 'Henri III and the question of magic'
    span: 401002:402663
    why: 'Places Bruno''s openly magical Hermetism against French Catholic Hermetism and weighs his testimony about the king.'
  - id: yates-giordano-bruno#u16-c6
    heading: 'Diplomatic protection and the mission to England'
    span: 402665:403899
    why: 'Gives Yates''s hedged argument that French royal protection explains Bruno''s immunity in England and reframes him as a sub rosa missionary.'
- nn: 17
  unit_id: ch12-hermetic-reform-1
  note_id: yates-giordano-bruno-ch12-hermetic-reform-1
  span: 404721:417774
  chunks:
  - id: yates-giordano-bruno#u17-c1
    heading: 'The Thirty Seals volume and the formation of a Magus'
    span: 404782:405352
    why: 'Yates identifies the English volume as a further step in Bruno''s magical memory work aimed at forming a Magus.'
  - id: yates-giordano-bruno#u17-c2
    heading: 'What the Oxford doctors would have found: Magia, Cabala, Lullism, memory'
    span: 406733:407335
    why: 'States plainly that the book is extremely obscure magic combining Magia, Cabala, Lullism and memory.'
  - id: yates-giordano-bruno#u17-c3
    heading: 'Abbot''s report of Bruno lecturing Copernicus out of Ficino'
    span: 410814:413333
    why: 'The new Oxford evidence, with Yates''s reading, that Bruno delivered Copernicanism within Ficino''s astral magic.'
  - id: yates-giordano-bruno#u17-c4
    heading: 'Why Abbot dragged Bruno in'
    span: 413335:414132
    why: 'Yates argues Abbot knew the Explicatio''s defence of good magical religion, so the Bruno episode has religious as well as polemical meaning.'
  - id: yates-giordano-bruno#u17-c5
    heading: 'Ficinian Copernicanism as religious'
    span: 416443:416989
    why: 'Yates''s own judgement on the evidence, the thesis link between Copernicus and Hermetic magic.'
  - id: yates-giordano-bruno#u17-c6
    heading: 'The Hermetic programme for the English dialogues'
    span: 416991:417772
    why: 'States the chapter''s thesis that Bruno''s moral and philosophical dialogues serve a restoration of the Asclepius''s Egyptian religion.'
- nn: 18
  unit_id: ch12-hermetic-reform-2
  note_id: yates-giordano-bruno-ch12-hermetic-reform-2
  span: 417774:448040
  chunks:
  - id: yates-giordano-bruno#u18-c1
    heading: 'What Bruno is doing: full Egyptian'
    span: 424293:424956
    why: 'Yates''s concise thesis on Bruno''s move: magic back to its pagan Egyptian source, against Ficino''s caution and the religious Hermetists.'
  - id: yates-giordano-bruno#u18-c2
    heading: 'The Lament fulfilled: Egyptian religion returns'
    span: 426351:426675
    why: 'States that Bruno reads the Asclepius Lament as prophecy, with the Copernican sun as the sign of return.'
  - id: yates-giordano-bruno#u18-c3
    heading: 'Bruno the complete Modern Magus; reform begins in the heavens'
    span: 426677:428311
    why: 'Locates Bruno''s Egyptianism in the Ficino-to-Agrippa lineage and describes the Spaccio''s distinctive celestial reform.'
  - id: yates-giordano-bruno#u18-c4
    heading: 'The reform of the heavens as the formation of a personality'
    span: 438491:439316
    why: 'Yates''s key reading: the celestial reform is interior, the production of a personality.'
  - id: yates-giordano-bruno#u18-c5
    heading: 'Astral influences and the double meaning of the Triumphant Beast'
    span: 440605:443579
    why: 'Gives Yates''s hedged interpretation of the virtue and vice lists as astral influences and explains the ambivalence of the animal forms.'
  - id: yates-giordano-bruno#u18-c6
    heading: 'Egypt older than Moses: Bruno resolves the dating dispute'
    span: 444245:445009
    why: 'Shows Bruno''s radical reordering of the prisca theologia chronology in favour of Egypt over the Hebrews.'
- nn: 19
  unit_id: ch12-hermetic-reform-3
  note_id: yates-giordano-bruno-ch12-hermetic-reform-3
  span: 448040:466980
  chunks:
  - id: yates-giordano-bruno#u19-c1
    heading: 'The pedants, good works and the English past'
    span: 450778:451480
    why: 'Yates''s reading of the good-works polemic as a double reference to pre-Reformation England and the Lament of the Asclepius.'
  - id: yates-giordano-bruno#u19-c2
    heading: 'Henri III and the offer to England'
    span: 456389:457670
    why: 'Yates''s political reading of the Spaccio as a French-backed message of peace, and her placing of it in religious Hermetism.'
  - id: yates-giordano-bruno#u19-c3
    heading: 'Bruno''s radical step outside Christian Hermetism'
    span: 458637:459297
    why: 'States the distinctive claim that Bruno makes the Asclepius''s magic the basis of religious and moral reform.'
  - id: yates-giordano-bruno#u19-c4
    heading: 'Reform begins in heaven: the magician''s operation'
    span: 462004:463045
    why: 'Yates''s central hypothesis that the celestial reform is a magical means of bringing about the earthly reform.'
  - id: yates-giordano-bruno#u19-c5
    heading: 'Adocentyn, the City of the Sun and shared social ethic'
    span: 463047:465341
    why: 'Connects Bruno''s reform to Hermes as magician and lawgiver, magical cities of the sun, and Campanella''s social ethic.'
  - id: yates-giordano-bruno#u19-c6
    heading: 'The Spaccio as an operative work in Elizabethan society'
    span: 466339:466978
    why: 'Concluding statement of the chapter''s claim about the Spaccio''s function and its explosive Hermetic content.'
- nn: 20
  unit_id: ch13-hermetic-philosophy-1
  note_id: yates-giordano-bruno-ch13-hermetic-philosophy-1
  span: 466980:490450
  chunks:
  - id: yates-giordano-bruno#u20-c1
    heading: 'The Copernican clue: Hermes on the sun, an expanded gnosis'
    span: 472511:473186
    why: 'States Yates''s central thesis that Bruno''s Copernicanism is Hermetic rather than astronomical, anchored in Copernicus''s own citation of the Asclepius.'
  - id: yates-giordano-bruno#u20-c2
    heading: 'Bruno''s ascent through the spheres and Agrippa''s magician'
    span: 476317:478055
    why: 'Parallels Bruno''s self-description with the Pimander ascent and Agrippa''s prerequisite for magical power, tying the prophet''s authority to Hermetic experience.'
  - id: yates-giordano-bruno#u20-c3
    heading: 'The Copernican diagram as Hermetic hieroglyph'
    span: 480077:480781
    why: 'Uses Kepler''s contrast between mathematical and Hermetic diagrams to argue that Bruno reads Copernicus more Hermetico.'
  - id: yates-giordano-bruno#u20-c4
    heading: 'Corpus Hermeticum XII behind Bruno''s earth-movement'
    span: 484228:484604
    why: 'States Yates''s textual argument that Bruno derived the earth''s motion from the Hermetic treatise rather than mathematics.'
  - id: yates-giordano-bruno#u20-c5
    heading: 'Vitalist, magical infinite worlds'
    span: 486947:487988
    why: 'Qualifies the standard modernizing story about infinity by insisting the innumerable worlds are animated beings, with Bruno''s own Cena statement.'
  - id: yates-giordano-bruno#u20-c6
    heading: 'From man the great miracle to the infinite'
    span: 489815:490448
    why: 'Shows Bruno adapting the Hermetic magnum miraculum passage to a power to know an infinite god and universe, which is Yates''s closing account of infinity.'
- nn: 21
  unit_id: ch13-hermetic-philosophy-2
  note_id: yates-giordano-bruno-ch13-hermetic-philosophy-2
  span: 490450:512295
  chunks:
  - id: yates-giordano-bruno#u21-c1
    heading: 'Lucretius transformed into a Hermetic vision'
    span: 490450:491522
    why: 'Yates''s core claim that Bruno turned Lucretius''s godless infinite universe into an extension of Hermetic gnosis.'
  - id: yates-giordano-bruno#u21-c2
    heading: 'Bruno''s genealogy of the Wise and the Lucretian universe'
    span: 491524:492610
    why: 'Bruno''s own lineage of the Temple of Wisdom, with Yates''s reading that Lucretian infinity counted as extended Egyptian wisdom.'
  - id: yates-giordano-bruno#u21-c3
    heading: 'The All is One: the philosophy conducive to magic'
    span: 494597:495529
    why: 'States the ladder of nature and intellect and identifies the All-in-One as the philosophy underlying Hermetic magic and religion.'
  - id: yates-giordano-bruno#u21-c4
    heading: 'Religious Hermetism without the Trinity'
    span: 496478:498724
    why: 'Shows which Hermetic treatises and doctrines Bruno chose or dropped, and how his pantheist Hermetism differs from Ficino, Patrizi and Agrippa.'
  - id: yates-giordano-bruno#u21-c5
    heading: 'Bruno''s anti-Aristotelianism as anti-pedantry'
    span: 500360:501815
    why: 'Revises the picture of Bruno as an enlightened anti-scholastic by showing Aristotle and mathematics as pedantry before occult truth.'
  - id: yates-giordano-bruno#u21-c6
    heading: 'The grammarian pedant and Bruno''s hatred of humanism'
    span: 501817:504387
    why: 'Yates''s argument that Bruno inverted Erasmus, seeing humanism as destroyer of philosophy and pedant language as lacking magical power.'
- nn: 22
  unit_id: ch14-bruno-cabala
  note_id: yates-giordano-bruno-ch14-bruno-cabala
  span: 512295:546449
  chunks:
  - id: yates-giordano-bruno#u22-c1
    heading: 'Pico''s Magus versus Bruno''s abnormal Egyptianism'
    span: 512339:513773
    why: 'States Yates''s thesis for the chapter: Bruno remains in the Hermetic-Cabalist tradition though he ranks Egyptians best and retains Cabala only in subordination.'
  - id: yates-giordano-bruno#u22-c2
    heading: 'The Egyptian Ass and the sweeping away of metaphysics'
    span: 518175:519350
    why: 'Explains how Bruno discards the Cabalist and Pseudo-Dionysian superstructure for a natural Egyptian religion, with the Apuleius link to the Asclepius.'
  - id: yates-giordano-bruno#u22-c3
    heading: 'Bruno''s new cabala: departure from the Christian Magus'
    span: 519896:521332
    why: 'Yates''s clearest statement of Bruno''s conscious departure from the Christian Renaissance Magus, with Bruno''s own definition of his cabala.'
  - id: yates-giordano-bruno#u22-c4
    heading: 'Egyptian hieroglyphs, Hermetic language and the war on pedants'
    span: 524239:525372
    why: 'Ties Bruno''s praise of hieroglyphs to Corpus Hermeticum XVI and shows his magical-versus-pedantic use of language as a general opposition.'
  - id: yates-giordano-bruno#u22-c5
    heading: 'Linking with demons and the imagination as link of links'
    span: 527132:529616
    why: 'Presents Bruno''s frankly demonic practical magic, its centring on the imagination and memory, and his place as logical outcome of Renaissance Hermetism.'
  - id: yates-giordano-bruno#u22-c6
    heading: 'Egyptian Counter Reformation, toleration and the Freemasonry conjecture'
    span: 544456:546447
    why: 'Yates''s hedged historical hypothesis placing Bruno''s Egyptian religion, toleration and ethic of good works as a possible antecedent of Freemasonry.'
- nn: 23
  unit_id: ch15-heroic-enthusiast
  note_id: yates-giordano-bruno-ch15-heroic-enthusiast
  span: 546449:579302
  chunks:
  - id: yates-giordano-bruno#u23-c1
    heading: 'The Eroici furori aim at Hermetic gnosis'
    span: 558211:558482
    why: 'Yates''s compact thesis statement about what the mystical love poetry is really for.'
  - id: yates-giordano-bruno#u23-c2
    heading: 'The great year and the prophesied return of Egyptian light'
    span: 553545:555102
    why: 'Bruno''s cyclical prophecy that the nadir of the Lament will turn into a return to Hermetic Egypt, with Yates''s gloss.'
  - id: yates-giordano-bruno#u23-c3
    heading: 'Agrippa''s fourth furor and the magnum miraculum'
    span: 560963:561661
    why: 'Yates''s key interpretive move linking the furor of Venus, Agrippa, the Asclepius and Cabala to the Eroici furori.'
  - id: yates-giordano-bruno#u23-c4
    heading: 'Petrarchan emblems as magical images'
    span: 562912:563971
    why: 'Connects the emblem structure of the poems to Bruno''s memory-art magic of talismanic images and hieroglyphs.'
  - id: yates-giordano-bruno#u23-c5
    heading: 'Bruno as Magus and the Egyptian Reformation'
    span: 568629:570357
    why: 'Yates''s summary of Bruno''s position relative to Christian religious Hermetism, magic, toleration and the Spaccio''s reform.'
  - id: yates-giordano-bruno#u23-c6
    heading: 'Elizabeth as the One in the vision of the nine'
    span: 576073:577228
    why: 'Shows Yates''s argument that the book''s climax encodes Elizabeth as the unifying Amphitrite, justifying the chapter''s title.'
- nn: 24
  unit_id: ch16-bruno-second-paris
  note_id: yates-giordano-bruno-ch16-bruno-second-paris
  span: 579302:605392
  chunks:
  - id: yates-giordano-bruno#u24-c1
    heading: 'Mordente''s compass and the Copernican analogy'
    span: 585207:587434
    why: 'Sets out the Mordente episode and Yates''s argument that Bruno read the compass diagram as a hieroglyph, as he did Copernicus''s in the Cena.'
  - id: yates-giordano-bruno#u24-c2
    heading: 'Mathesis and Pythagorean intentions'
    span: 587436:589653
    why: 'Yates''s core interpretation of mathesis as a religious guide and of the compass as Hermetics in Kepler''s sense.'
  - id: yates-giordano-bruno#u24-c3
    heading: 'The Cambrai opening oration'
    span: 593534:594597
    why: 'Gives the infinite-universe message Bruno brought to the Paris doctors, which repeats the Cena''s themes in Latin.'
  - id: yates-giordano-bruno#u24-c4
    heading: 'Cailler, Du Perron and the King''s disowning of Bruno'
    span: 598026:598909
    why: 'Yates''s argument that the intervention against Bruno came from Henri III''s Hermetic circle, not the Guise or the League.'
  - id: yates-giordano-bruno#u24-c5
    heading: 'Why Bruno provoked the debate'
    span: 598911:600308
    why: 'Yates weighs Bruno''s motives and character, and reads the debate as an act of mission on behalf of the religion of the world.'
  - id: yates-giordano-bruno#u24-c6
    heading: 'Navarre, and the attempt to return to the Church'
    span: 603474:604986
    why: 'Ties Bruno''s fatal return to Italy to Navarre''s accession and states her view that his bid for absolution was sincere and consistent with his reform.'
- nn: 25
  unit_id: ch17-bruno-germany
  note_id: yates-giordano-bruno-ch17-bruno-germany
  span: 605392:641986
  chunks:
  - id: yates-giordano-bruno#u25-c1
    heading: 'Thirty Statues as inner Asclepius statues'
    span: 609226:610213
    why: 'Yates''s core interpretive claim that Bruno''s memory statues are imaginative links with demons forming a Magus personality.'
  - id: yates-giordano-bruno#u25-c2
    heading: 'The inner cult and the infinite universe'
    span: 615223:616155
    why: 'States that Bruno''s Egyptian religion was interiorised and that his infinite universe is used Hermetically.'
  - id: yates-giordano-bruno#u25-c3
    heading: 'Hermetic triad, Ficino and the rejected Christian reading'
    span: 613024:613615
    why: 'Locates Bruno against Ficino''s Christian Neoplatonic reading of the Hermetica.'
  - id: yates-giordano-bruno#u25-c4
    heading: 'Dedication to Rudolph II and the law of love'
    span: 622904:623996
    why: 'Yates''s summary of Bruno''s themes and his anti-sectarian religion of love.'
  - id: yates-giordano-bruno#u25-c5
    heading: 'Bruno''s numerology between Agrippa and Fludd'
    span: 637620:637977
    why: 'Explains Bruno''s eccentricity as a Magus through non-acceptance of the Christian interpretation of the Hermetica.'
  - id: yates-giordano-bruno#u25-c6
    heading: 'Mathesis, reaction against science, and a possible sect'
    span: 641332:641984
    why: 'Yates''s verdict that Bruno is not in the line of mathematical science and that the new philosophy was a religious message.'
- nn: 26
  unit_id: ch18-last-published-work
  note_id: yates-giordano-bruno-ch18-last-published-work
  span: 641986:667586
  chunks:
  - id: yates-giordano-bruno#u26-c1
    heading: 'The real purpose: composing talismanic images to form a Magus'
    span: 654222:655580
    why: 'States Yates''s central reading that the book''s purpose is to capture only the good planetary powers through images and so form a Solar, Jovial and Venereal Magus.'
  - id: yates-giordano-bruno#u26-c2
    heading: 'From Ficino''s astral cult to Bruno''s inner Magus'
    span: 655582:657303
    why: 'Yates''s argument for Bruno as radicaliser of Ficino and of Christian Hermetism, accepting the Asclepius religion inwardly.'
  - id: yates-giordano-bruno#u26-c3
    heading: 'The same magical reformation offered to Hainzell as to Sidney'
    span: 653706:654220
    why: 'Compactly links the memory treatise to the Spaccio''s reform, presenting the 1591 work as the same programme.'
  - id: yates-giordano-bruno#u26-c4
    heading: 'Classical and barbarous images: a door ajar on Renaissance imagery'
    span: 658659:659405
    why: 'Yates poses the hypothesis that Bruno''s reversal toward barbarous forms is Egyptianism seeking magical power and may reveal general Renaissance practice.'
  - id: yates-giordano-bruno#u26-c5
    heading: 'Aristotle versus Synesius: memory made magical and religious'
    span: 664629:665936
    why: 'Explains how Bruno turns a rational Aristotelian mnemonic tradition into a technique for contact with divine powers via a Hermetic-Cabalist justification.'
  - id: yates-giordano-bruno#u26-c6
    heading: 'The infinite universe as hieroglyph of the divine'
    span: 666913:667584
    why: 'Yates''s closing reinterpretation of Bruno''s infinite universe and innumerable worlds as religious-magical hieroglyphs, not scientific philosophy.'
- nn: 27
  unit_id: ch19-return-to-italy
  note_id: yates-giordano-bruno-ch19-return-to-italy
  span: 667586:707406
  chunks:
  - id: yates-giordano-bruno#u27-c1
    heading: 'Mocenigo''s report: the prophet of the return'
    span: 672420:673990
    why: 'Reports Bruno''s reformist prophecy via Mocenigo and Yates''s reading of it as the Hermetic theme of the world at its lowest ebb before a return.'
  - id: yates-giordano-bruno#u27-c2
    heading: 'The real reason for Bruno''s return'
    span: 682643:683480
    why: 'States Yates''s central thesis about why Bruno returned: hope in Navarre and Patrizi''s success, not Mocenigo''s memory lessons.'
  - id: yates-giordano-bruno#u27-c3
    heading: 'Bruno''s non-Christian Hermetic theology'
    span: 691405:692696
    why: 'Locates the root theological reason Bruno''s Hermetism becomes purely Egyptian rather than a prisca theologia foreshadowing Christianity.'
  - id: yates-giordano-bruno#u27-c4
    heading: 'The Egyptian cross and Ficino''s source'
    span: 694477:695316
    why: 'Shows how a small inversion of Ficino''s argument yields Bruno''s claim that Christians stole the true Egyptian sign, hedged as a suggestion.'
  - id: yates-giordano-bruno#u27-c5
    heading: 'Bruno versus Galileo: philosophy inseparable from mission'
    span: 699039:700975
    why: 'Yates''s verdict that Copernicanism served Bruno''s religious mission and that the martyr-of-philosophy legend can no longer stand.'
  - id: yates-giordano-bruno#u27-c6
    heading: 'Boccalini''s Parnassus as possible echo of the Spaccio'
    span: 704765:705810
    why: 'Example of Yates''s tentative tracing of Bruno''s Spaccio themes and the Navarre hope into later Venetian liberal satire.'
- nn: 28
  unit_id: ch20-campanella-1
  note_id: yates-giordano-bruno-ch20-campanella-1
  span: 707406:735665
  chunks:
  - id: yates-giordano-bruno#u28-c1
    heading: 'Campanella as Bruno''s counterpart'
    span: 707457:708623
    why: 'States Yates''s comparative method and the shared Ficinian Magus-with-a-mission identity of the two men.'
  - id: yates-giordano-bruno#u28-c2
    heading: 'The Calabrian revolt as Bruno''s programme in action'
    span: 719158:719697
    why: 'Yates''s central claim that the Calabrian revolt enacted a Brunian reform programme, with her later caveats following.'
  - id: yates-giordano-bruno#u28-c3
    heading: 'Bruno''s death in 1600 and the fate of Renaissance forces'
    span: 721292:722417
    why: 'Links Bruno''s execution to the suppression of the revolt and frames both as the end of Italy''s Renaissance magic.'
  - id: yates-giordano-bruno#u28-c4
    heading: 'The Sun priest and the astrological rule of the City'
    span: 726688:728958
    why: 'Describes the City''s government and insists it is an astral-magical, not modern, model of a state.'
  - id: yates-giordano-bruno#u28-c5
    heading: 'Adocentyn in Picatrix as the model'
    span: 730019:730976
    why: 'The point-by-point Picatrix parallel that grounds Yates''s claim of a Hermetic source for the City.'
  - id: yates-giordano-bruno#u28-c6
    heading: 'The Egyptian layer behind the City'
    span: 731830:733109
    why: 'States her thesis that the deepest layer behind the City is Hermetic and Egyptian, not Platonic or Hebrew.'
  - id: yates-giordano-bruno#u28-c7
    heading: 'Solarian Copernicanism and Bruno''s Cena'
    span: 734985:735663
    why: 'Ties the City''s ambivalent heliocentrism back to Bruno''s Copernicanism as portent of a Ficinian reform.'
- nn: 29
  unit_id: ch20-campanella-2
  note_id: yates-giordano-bruno-ch20-campanella-2
  span: 735665:759393
  chunks:
  - id: yates-giordano-bruno#u29-c1
    heading: 'Spaccio and City of the Sun compared'
    span: 735665:736756
    why: 'States the structural parallel between Bruno''s and Campanella''s Hermetic reform of the heavens and society.'
  - id: yates-giordano-bruno#u29-c2
    heading: 'Urban VIII''s magic and the City as permanent Adocentyn'
    span: 740486:742627
    why: 'Shows Campanella''s actual practice of Ficinian magic and Yates''s reading of the City of the Sun as a state built on continuous astral magic.'
  - id: yates-giordano-bruno#u29-c3
    heading: 'Campanella''s new Summa and Renaissance Thomism'
    span: 746549:750049
    why: 'Yates''s account of how Campanella tried to give Renaissance magic a Catholic theological basis through religious Hermetism and a revised Thomism.'
  - id: yates-giordano-bruno#u29-c4
    heading: 'Campanella''s animism is Hermetic first'
    span: 751200:752199
    why: 'Carries her argument that Renaissance animism, and so magic, derives ultimately from the Hermetica, not just Telesio.'
  - id: yates-giordano-bruno#u29-c5
    heading: 'Asclepius, theurgy and the ladder of magic'
    span: 752850:754143
    why: 'Ties Campanella''s magia naturale/divina to the Asclepius''s man-as-miracle and god-making and compares it with Bruno''s Egyptians.'
  - id: yates-giordano-bruno#u29-c6
    heading: 'A modified Hermetism and the plausibility of Bruno''s mission'
    span: 757472:759391
    why: 'Yates''s conclusion that Campanella softened an earlier Brunian programme and that his efforts make Bruno''s papal hopes intelligible.'
- nn: 30
  unit_id: ch20-campanella-3
  note_id: yates-giordano-bruno-ch20-campanella-3
  span: 759393:784926
  chunks:
  - id: yates-giordano-bruno#u30-c1
    heading: 'The Egyptian ideal: the Sun ruler as Hermes, and a priest-regulated science'
    span: 764568:765654
    why: 'Yates''s own thesis that the City of the Sun adds an Egyptian priest-king theocracy to the Roman and Platonic ideals, with science under priestly control.'
  - id: yates-giordano-bruno#u30-c2
    heading: 'Mediaeval mystical monarchy: how the rebel became a prophet of universal empire'
    span: 761451:762822
    why: 'Yates explains the switch from the Calabrian revolt to Spanish, papal and French universal monarchy as one Dantesque imperial ideal seeking a channel for the City of the Sun.'
  - id: yates-giordano-bruno#u30-c3
    heading: 'Coelum Britannicum and Bruno''s Spaccio in the Caroline court'
    span: 776243:776695
    why: 'Documents the afterlife of Bruno''s reform of the heavens in a 1634 English court masque and ties it to Shakespeare''s Love''s Labour''s Lost.'
  - id: yates-giordano-bruno#u30-c4
    heading: 'Twenty years apart: Hermetism at its crescendo and at its wane'
    span: 780315:781599
    why: 'States the chapter''s historical verdict: the redating of the Hermetica cut away the foundation of Renaissance Hermetism, so Bruno and Campanella stand at different phases of its decline.'
  - id: yates-giordano-bruno#u30-c5
    heading: 'Mersenne and Descartes reject Campanella'
    span: 782067:783890
    why: 'Shows the new science''s dismissal of the last Magus, with Mersenne''s own verdict quoted, and Yates''s reading that science and orthodoxy now join hands against magic and natural theology.'
  - id: yates-giordano-bruno#u30-c6
    heading: 'Campanella''s sonnet: the world as the book of God'
    span: 784292:784924
    why: 'Campanella''s own dungeon sonnet stating the natural-religion view that nature is the living text of God, the primary source with which Yates ends the chapter.'
- nn: 31
  unit_id: ch21-after-dating-1
  note_id: yates-giordano-bruno-ch21-after-dating-1
  span: 784926:804438
  chunks:
  - id: yates-giordano-bruno#u31-c1
    heading: 'The Casaubon watershed'
    span: 784976:786701
    why: 'States Yates''s thesis that the 1614 dating separates the Renaissance from the modern world, with her hedge that it was one important factor among others.'
  - id: yates-giordano-bruno#u31-c2
    heading: 'Casaubon''s case that the Hermetica are late and Christian-influenced'
    span: 788758:790318
    why: 'Summarises Casaubon''s arguments from parallels, anachronisms and late Greek style against the supposed antiquity of the Hermetica.'
  - id: yates-giordano-bruno#u31-c3
    heading: 'Why so late? Textual criticism and the fall of the Asclepius'
    span: 791954:792888
    why: 'Yates''s reflection that ordinary humanist tools were applied only after a century of developments built on the misdating, and that the Asclepius and magic''s justification fell with it.'
  - id: yates-giordano-bruno#u31-c4
    heading: 'Fludd ignores Casaubon and lives in Ficino''s Hermes'
    span: 795472:796572
    why: 'Contrasts Casaubon and Fludd, both dedicated to James I, and shows Fludd treating Hermes as quasi-canonical prisca theologia.'
  - id: yates-giordano-bruno#u31-c5
    heading: 'Fludd as delayed-action Renaissance Magus'
    span: 800616:801665
    why: 'Yates''s own placement of Fludd as a late reconstruction of the Ficino-Pico outlook, with her hedged judgements about his Cabala and magical practice.'
  - id: yates-giordano-bruno#u31-c6
    heading: 'Rosicrucians and the Magus going underground'
    span: 803803:804436
    why: 'Frames the Rosicrucian connection as the shift of Renaissance Hermetism from dominant philosophy to secret-society preoccupation.'
- nn: 32
  unit_id: ch21-after-dating-2
  note_id: yates-giordano-bruno-ch21-after-dating-2
  span: 804438:832972
  chunks:
  - id: yates-giordano-bruno#u32-c1
    heading: 'The Fama''s general reformation and the Giordanisti question'
    span: 810633:811357
    why: 'Yates''s hedged core suggestion that the Rosicrucian general reformation is a mystical-magical development connected to Bruno''s reform mission.'
  - id: yates-giordano-bruno#u32-c2
    heading: 'Bruno and the Rosicrucians: resemblances and differences'
    span: 814533:815108
    why: 'States exactly where Rosicrucianism (via Fludd) departs from Bruno and where it continues his reform motive.'
  - id: yates-giordano-bruno#u32-c3
    heading: 'Rosicrucians as Renaissance Hermetism, with Campanella and perhaps Bruno'
    span: 816651:817601
    why: 'Yates''s summary verdict on what the Rosicrucians are and how Campanella and Bruno may have fed their reform aspirations.'
  - id: yates-giordano-bruno#u32-c4
    heading: 'Kircher''s hieroglyphs depend on belief in Hermes'
    span: 821953:822465
    why: 'Yates''s argument that the hieroglyph tradition required an ancient Hermes and so is doomed once the dating and decipherment come.'
  - id: yates-giordano-bruno#u32-c5
    heading: 'Kircher and the Asclepius idol-making test'
    span: 829325:830737
    why: 'Shows how a pious Jesuit Hermetist handles the god-making passage: condemnation of demonic magic but archaeological and admiring engagement.'
  - id: yates-giordano-bruno#u32-c6
    heading: 'Kircher''s Egyptianism versus Bruno''s'
    span: 831712:832454
    why: 'Yates''s comparative judgment placing Kircher''s Christian-supreme Egyptianism against Bruno''s demonic, revolutionary one.'
- nn: 33
  unit_id: ch21-after-dating-3
  note_id: yates-giordano-bruno-ch21-after-dating-3
  span: 832972:852381
  chunks:
  - id: yates-giordano-bruno#u33-c1
    heading: 'Casaubon deprives the Cambridge Platonists of Hermes'
    span: 833272:833521
    why: 'States Yates''s central claim for the unit: acceptance of the dating removed Hermes as priscus theologus from More and Cudworth.'
  - id: yates-giordano-bruno#u33-c2
    heading: 'More''s enormous omission: no Hermes in the Conjectura Cabbalistica'
    span: 837761:839989
    why: 'Yates''s core evidence and contrast with Fludd and Kircher that More is a Cabalist but no longer a Hermetist.'
  - id: yates-giordano-bruno#u33-c3
    heading: 'What More''s Platonism may then mean'
    span: 840213:840533
    why: 'Hedged interpretive claim that without Hermes, More''s Platonism lacks the magical theory and practice of Ficinian Platonism.'
  - id: yates-giordano-bruno#u33-c4
    heading: 'Cudworth on Christian forgers of the Hermetica'
    span: 844155:844968
    why: 'Cudworth''s own voice on pious forgery, the ground on which he abandons Hermes Trismegistus as an authority.'
  - id: yates-giordano-bruno#u33-c5
    heading: 'Yates on the irony of ''rankly Christian'' forgery'
    span: 846817:847677
    why: 'Yates''s interpretation that the early critics of the Hermetica were themselves products of the Christian Hermetist tradition.'
  - id: yates-giordano-bruno#u33-c6
    heading: 'The cost of rescue, and Cudworth''s Egypt as Bruno''s'
    span: 850745:851370
    why: 'Yates''s summary judgment on Casaubon''s jolt and her link between Cudworth''s salvaged Egyptian material and Bruno''s Egyptianism.'
- nn: 34
  unit_id: ch22-fludd-controversies-1
  note_id: yates-giordano-bruno-ch22-fludd-controversies-1
  span: 852381:882221
  chunks:
  - id: yates-giordano-bruno#u34-c1
    heading: 'The attack on Renaissance magic led by Mersenne'
    span: 853682:856596
    why: 'States Yates''s framing: Mersenne''s campaign against Renaissance naturalism and magic as the birth struggle of the mechanical philosophy, with scientific weapons still slight.'
  - id: yates-giordano-bruno#u34-c2
    heading: 'Mersenne the modern rejects astral magic and anima mundi'
    span: 859353:859902
    why: 'Shows that Mersenne''s objection is that magic images are meaningless, and that he discards astrology and the whole basis of magia naturalis.'
  - id: yates-giordano-bruno#u34-c3
    heading: 'Gassendi and Mersenne''s Casaubon weapon'
    span: 867312:867770
    why: 'Documents Casaubon''s redating of the Hermetica being used in the Fludd controversy to strip Fludd''s Hermes of scriptural authority.'
  - id: yates-giordano-bruno#u34-c4
    heading: 'Garin: Hermetism sinks underground'
    span: 868355:868746
    why: 'Yates''s summary of the consequence of the controversy: Renaissance Hermetism loses its dominant position and retreats to esoteric channels.'
  - id: yates-giordano-bruno#u34-c5
    heading: 'Kepler separates mathematics from Hermetic numerology'
    span: 869160:870234
    why: 'Gives Yates''s judgment that Kepler, despite Renaissance survivals, clearly distinguished quantitative mathematics from the Pythagorean-Hermetic approach to number.'
  - id: yates-giordano-bruno#u34-c6
    heading: 'Mersenne on Bruno''s religious mission'
    span: 879037:879777
    why: 'Yates''s reading of why Mersenne saw Bruno''s Hermetic-Egyptian reform as a danger to orthodox Christianity, tying Bruno to the losing side of the controversy.'
- nn: 35
  unit_id: ch22-fludd-controversies-2
  note_id: yates-giordano-bruno-ch22-fludd-controversies-2
  span: 882221:901316
  chunks:
  - id: yates-giordano-bruno#u35-c1
    heading: 'A movement of the will, and what Hermes Trismegistus stands for'
    span: 884544:886116
    why: 'States Yates''s central thesis on motives behind modern science and enumerates the Hermetic components she includes under the name.'
  - id: yates-giordano-bruno#u35-c2
    heading: 'The reign of Hermes dated'
    span: 886118:886509
    why: 'Gives the exact bounds (Ficino to Casaubon) of the Hermetic period she credits with the new attitudes.'
  - id: yates-giordano-bruno#u35-c3
    heading: 'The very long view: retreat from reason and its reversal'
    span: 887579:888566
    why: 'Her hedged grand narrative linking late-antique Hermetism to the Renaissance return, with the concession that it may be too beautiful to be true.'
  - id: yates-giordano-bruno#u35-c4
    heading: 'What Bruno really was'
    span: 890199:891626
    why: 'Her final, compact statement of the book''s revised picture of Bruno against the martyr-for-science tradition.'
  - id: yates-giordano-bruno#u35-c5
    heading: 'Drained of animism: Newton, two phases, and gnosis'
    span: 891628:893526
    why: 'Argues Bruno''s misreading is evidence of Hermes''s role, that Casaubon''s dating freed the century, and proposes the two-phase model of the scientific revolution.'
  - id: yates-giordano-bruno#u35-c6
    heading: 'The magician internalises, the scientist externalises'
    span: 898401:898957
    why: 'Yates''s explanation of why Cartesian mechanism sidelined the mind, resting on the contrast between Hermetic internalisation and scientific externalisation.'
