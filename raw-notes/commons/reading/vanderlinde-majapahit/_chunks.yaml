source: vanderlinde-majapahit
units:
- nn: 1
  unit_id: preface
  note_id: vanderlinde-majapahit-preface
  span: 0:5519
  chunks:
  - id: vanderlinde-majapahit#u01-c1
    label: c1
    heading: The nose-cutting incident
    span: 1098:1554
    why: This is the preface's dramatic centerpiece, staging the Singasari-Mongol collision that triggers
      Kublai Khan's invasion and frames Majapahit's origin story.
  - id: vanderlinde-majapahit#u01-c2
    label: c2
    heading: The book's mission statement
    span: 2457:2799
    why: 'States the author''s explicit thesis and historiographical complaint: an empire as significant
      as Angkor Wat''s Khmer contemporaries but almost unknown to Anglophone readers.'
  - id: vanderlinde-majapahit#u01-c3
    label: c3
    heading: Pluralism against a European foil
    span: 3383:3786
    why: 'Establishes the comparative-historiography move central to the book: Majapahit''s religious
      and gender pluralism set against contemporaneous European sectarian conflict.'
  - id: vanderlinde-majapahit#u01-c4
    label: c4
    heading: Methodological candor on thin sources
    span: 3788:4260
    why: A rare direct statement of evidentiary limits and interpretive method that any downstream user
      of this book as a source needs to weigh.
  - id: vanderlinde-majapahit#u01-c5
    label: c5
    heading: Rise, decline, and jungle reclamation
    span: 5132:5480
    why: Compresses Majapahit's full rise-dominance-collapse-rediscovery arc into two sentences, the structural
      core the rest of the book will expand, and a close analogue to a compressed world-machine lifecycle.
- nn: 2
  unit_id: introduction
  note_id: vanderlinde-majapahit-introduction
  span: 5519:43042
  chunks:
  - id: vanderlinde-majapahit#u02-c1
    label: c1
    heading: Raffles anticipates a lost empire
    span: 7588:8411
    why: Frames the whole introduction as a hunt for a vanished civilization, explicitly likening Majapahit
      to Angkor and setting up Raffles's motive.
  - id: vanderlinde-majapahit#u02-c2
    label: c2
    heading: The buffalo and the tigers
    span: 14118:14677
    why: A staged court spectacle read by the author as covert Javanese political allegory about colonizers,
      missed entirely by the English audience.
  - id: vanderlinde-majapahit#u02-c3
    label: c3
    heading: Engelhard's self-serving preservation
    span: 26643:27188
    why: Exposes the logic by which colonial looting of antiquities was rationalized as protection, undercut
      by his own later admissions.
  - id: vanderlinde-majapahit#u02-c4
    label: c4
    heading: Wardenaar's map disappoints Raffles
    span: 29881:30262
    why: Shows legibility (a precise survey) being produced and then suppressed because it contradicted
      the discoverer's desired narrative.
  - id: vanderlinde-majapahit#u02-c5
    label: c5
    heading: Brandes salvages the Nagarakertagama
    span: 38485:38999
    why: The single act that converts Majapahit from anonymous ruins into a documented civilization, snatched
      from a colonial massacre's flames.
  - id: vanderlinde-majapahit#u02-c6
    label: c6
    heading: Stutterheim's suppressed reconstruction
    span: 41512:41923
    why: Shows the history machine's silent reassembly lurching into visibility at the precise moment
      of colonial collapse, too dangerous to publish.
- nn: 3
  unit_id: ch01
  note_id: vanderlinde-majapahit-ch01
  span: 43042:74529
  chunks:
  - id: vanderlinde-majapahit#u03-c1
    label: c1
    heading: Introducing Prapanca
    span: 43216:43995
    why: Establishes the narrator's ironic, unheroic character and the near-loss of the manuscript that
      makes him the primary source for Majapahit.
  - id: vanderlinde-majapahit#u03-c2
    label: c2
    heading: The Nagarakertagama's delayed vindication
    span: 53376:54217
    why: 'The clearest history-machine moment: a text mocked by contemporaries becomes, generations later,
      the indispensable primary source.'
  - id: vanderlinde-majapahit#u03-c3
    label: c3
    heading: Landowners and bondsmen along the road
    span: 60046:60997
    why: Concrete social-history detail on Javanese petty landowners and debt bondage, the texture of
      the empire's periphery.
  - id: vanderlinde-majapahit#u03-c4
    label: c4
    heading: The fragile chronicle
    span: 66749:67246
    why: Shows the literal physical fragility and recopying required to preserve dynastic memory, mirroring
      the near-loss of Prapanca's own text.
  - id: vanderlinde-majapahit#u03-c5
    label: c5
    heading: Airlangga's division of the realm
    span: 73273:74431
    why: The founding legend explaining both Majapahit's future site and the two centuries of Kediri-Singasari
      rivalry that precede it.
- nn: 4
  unit_id: ch02
  note_id: vanderlinde-majapahit-ch02
  span: 74529:101285
  chunks:
  - id: vanderlinde-majapahit#u04-c1
    label: c1
    heading: The abbot's bombshell
    span: 75412:75807
    why: 'States the legend''s core tension in one breath: divine founder of the dynasty versus admitted
      criminal, the engine of the whole chapter''s legitimation myth.'
  - id: vanderlinde-majapahit#u04-c2
    label: c2
    heading: Brahma's impregnation of Ken Endok
    span: 77169:77591
    why: The founding divine-birth episode that grounds Ken Arok's legitimacy claim, and shows the legend's
      mode of narrating brutal consequences (the husband's death) as divine will.
  - id: vanderlinde-majapahit#u04-c3
    label: c3
    heading: Mpu Gandring's dying curse
    span: 87464:87635
    why: The prophetic curse on the keris that structures all the dynasty's subsequent violence, including
      Ken Arok's own assassination later in the chapter.
  - id: vanderlinde-majapahit#u04-c4
    label: c4
    heading: Ken Dedes's self-immolation
    span: 98473:99420
    why: The tragic culmination of Ken Dedes's arc and the ritual closing of Ken Arok's reign, rendering
      the human cost behind the legitimation myth.
  - id: vanderlinde-majapahit#u04-c5
    label: c5
    heading: Official history versus the secret legend
    span: 100329:100911
    why: Reveals the chapter's frame-level stakes — a sanctioned genealogy contradicted by the hidden
      legend Prapanca just heard — and pivots into the coming conflict with the Mongols.
- nn: 5
  unit_id: ch03
  note_id: vanderlinde-majapahit-ch03
  span: 101285:124742
  chunks:
  - id: vanderlinde-majapahit#u05-c1
    label: c1
    heading: Prapanca ratifies the king's divine origin
    span: 103224:103540
    why: Shows dynastic legitimacy being actively assembled and confirmed through narrative and ritual
      rather than simply asserted, a small history-machine in miniature.
  - id: vanderlinde-majapahit#u05-c2
    label: c2
    heading: Zhao Rugua's fascination with 'barbarous peoples'
    span: 105875:107775
    why: Establishes the outsider-ethnographer frame that supplies the chapter's entire portrait of cosmopolitan
      Singasari and its trade economy.
  - id: vanderlinde-majapahit#u05-c3
    label: c3
    heading: A Chinese merchant describes the Javanese king
    span: 112311:112777
    why: The chapter's most vivid first-person eyewitness anchor for royal ceremony and power, possibly
      describing Ken Arok himself.
  - id: vanderlinde-majapahit#u05-c4
    label: c4
    heading: Pranaraja's boil aphorism
    span: 120440:120774
    why: Names the dynasty's core contradiction—the family that legitimizes a reign is also its mortal
      threat—moments before it is fulfilled.
  - id: vanderlinde-majapahit#u05-c5
    label: c5
    heading: The curse of Mpu Gandring fulfilled
    span: 124497:124740
    why: Closes the succession-violence arc by retroactively framing thirty years of court murders as
      the completion of a single supernatural curse.
- nn: 6
  unit_id: ch04
  note_id: vanderlinde-majapahit-ch04
  span: 124742:146806
  chunks:
  - id: vanderlinde-majapahit#u06-c1
    label: c1
    heading: The realm about to shatter
    span: 126156:126633
    why: States the succession crisis that drives the whole chapter's political engineering.
  - id: vanderlinde-majapahit#u06-c2
    label: c2
    heading: Engineering a compromise succession
    span: 127458:128084
    why: Shows legitimacy being manufactured through marriage and a novel co-kingship rather than inherited
      by right.
  - id: vanderlinde-majapahit#u06-c3
    label: c3
    heading: Kublai Khan founds the Yuan
    span: 131479:132056
    why: Introduces the Mongol world-power whose southward expansion frames the chapter's external threat.
  - id: vanderlinde-majapahit#u06-c4
    label: c4
    heading: Annihilating the Linggapati clan
    span: 136694:137056
    why: Demonstrates the violent consolidation of royal authority underlying the new dynasty's legitimacy.
  - id: vanderlinde-majapahit#u06-c5
    label: c5
    heading: The banyan-tree guru
    span: 139366:139993
    why: Captures the mystic charisma shaping young Kertanegara's worldview, setting up his later fascination
      with magic as statecraft.
  - id: vanderlinde-majapahit#u06-c6
    label: c6
    heading: Apocalypse and the domain of magic
    span: 145727:146804
    why: Fuses the Mongol geopolitical threat with omens and mysticism, framing Kertanegara's coming reign
      as a contest fought in both registers at once.
- nn: 7
  unit_id: ch05
  note_id: vanderlinde-majapahit-ch05
  span: 146806:176837
  chunks:
  - id: vanderlinde-majapahit#u07-c1
    label: c1
    heading: The tantric cemetery ritual
    span: 148435:149271
    why: 'Establishes Kertanegara''s central mode of rule: political legitimacy fused with tantric ritual
      performed at the palace cemetery.'
  - id: vanderlinde-majapahit#u07-c2
    label: c2
    heading: Aragani made patih, Raganata sidelined
    span: 160252:160655
    why: Captures the personal, patronage-driven reshuffling of power that displaces the veteran statesman
      Raganata.
  - id: vanderlinde-majapahit#u07-c3
    label: c3
    heading: Building the Pamalayu fleet
    span: 163528:164426
    why: Concrete technological detail on jong construction underlying the archipelago-wide expansion
      that unifies proto-Indonesia.
  - id: vanderlinde-majapahit#u07-c4
    label: c4
    heading: The mutilation of the Chinese envoy
    span: 175135:175614
    why: The chapter's dramatic turning point, where diplomatic stalling with the Yuan court collapses
      into open provocation.
  - id: vanderlinde-majapahit#u07-c5
    label: c5
    heading: Kublai Khan mobilizes for war
    span: 176346:176787
    why: Closes the chapter on the scale of the Mongol response, setting up the coming invasion of Java.
- nn: 8
  unit_id: ch06
  note_id: vanderlinde-majapahit-ch06
  span: 176837:207001
  chunks:
  - id: vanderlinde-majapahit#u08-c1
    label: c1
    heading: Wiraraja's coded letter
    span: 182566:183300
    why: The cryptic hunting metaphor is the single act of private betrayal that triggers the fall of
      Singasari, and its decoding shows the personal-grievance logic driving the whole plot.
  - id: vanderlinde-majapahit#u08-c2
    label: c2
    heading: Kertanegara's assassination
    span: 187596:188543
    why: The failure of Kertanegara's ritual sakti alongside his earlier dismissal of intelligence warnings
      is the chapter's central image of overconfident rule collapsing.
  - id: vanderlinde-majapahit#u08-c3
    label: c3
    heading: Gayatri's disguise
    span: 188545:188991
    why: Quietly establishes that the royal line survives incognito, a detail load-bearing for the dynasty's
      eventual restoration.
  - id: vanderlinde-majapahit#u08-c4
    label: c4
    heading: Widjaya's rash promise to Wiraraja
    span: 194831:195224
    why: Explicit narrative foreshadowing that frames Wiraraja's loyalty as provisional and sets up future
      betrayal, capturing the chapter's theme of duplicity as the normal medium of politics.
  - id: vanderlinde-majapahit#u08-c5
    label: c5
    heading: The naming of Majapahit
    span: 202278:202859
    why: The founding etymology of the settlement that gives the book its title, marking the precise moment
      the new order begins to be built in secret.
  - id: vanderlinde-majapahit#u08-c6
    label: c6
    heading: Turning to Kublai Khan
    span: 206387:206999
    why: Closes the chapter on the pivot toward external Mongol intervention, the strategic move that
      will resolve the interregnum in the following chapter.
- nn: 9
  unit_id: ch07
  note_id: vanderlinde-majapahit-ch07
  span: 207001:235353
  chunks:
  - id: vanderlinde-majapahit#u09-c1
    label: c1
    heading: The armada's turbulent crossing
    span: 207586:208156
    why: Establishes the physical hardship and scale of Kublai Khan's expedition through the admiral's
      own logbook, grounding the campaign before the political intrigue begins.
  - id: vanderlinde-majapahit#u09-c2
    label: c2
    heading: The night of the ambush
    span: 222890:223432
    why: 'The chapter''s central act of betrayal: Widjaya''s sober troops massacre the drunken Chinese
      garrison, the founding atrocity of Majapahit''s independence from its Mongol allies.'
  - id: vanderlinde-majapahit#u09-c3
    label: c3
    heading: Reneging on the princess deal
    span: 219749:220352
    why: Shows the precise diplomatic sleight-of-hand by which Widjaya breaks his bargain with the Mongols
      while maintaining plausible deniability, setting up the ambush.
  - id: vanderlinde-majapahit#u09-c4
    label: c4
    heading: Coronation proclamation
    span: 230916:231555
    why: The explicit act of legitimation-making that resolves the succession crisis into dynastic continuity,
      the clearest textual instance of order proclaimed out of chaos.
  - id: vanderlinde-majapahit#u09-c5
    label: c5
    heading: Santamurti's marriage solution
    span: 228483:229063
    why: Captures the calculated dynastic engineering behind the coronation-wedding, foreclosing rival
      claims to the throne through mass marriage rather than mere ceremony.
- nn: 10
  unit_id: ch08
  note_id: vanderlinde-majapahit-ch08
  span: 235353:267205
  chunks:
  - id: vanderlinde-majapahit#u10-c1
    label: c1
    heading: Gajah Mada's obscure origins and portentous name
    span: 236062:236349
    why: Establishes the low-born-outsider premise that structures Gajah Mada's entire arc against the
      palace-raised princes.
  - id: vanderlinde-majapahit#u10-c2
    label: c2
    heading: Lawe's tirade against Nambi's appointment
    span: 240287:241119
    why: The paradigm case of a patronage slight escalating into open rebellion, the pattern that repeats
      through the whole chapter.
  - id: vanderlinde-majapahit#u10-c3
    label: c3
    heading: Lawe's fatalistic reply to Wiraraja
    span: 243446:243870
    why: Reveals the honor-code fatalism that drives the founding generation to mutual destruction even
      when reconciliation is offered.
  - id: vanderlinde-majapahit#u10-c4
    label: c4
    heading: Sora's defiance and unmasking of Mahapati
    span: 255205:255640
    why: Sora names the manipulator to his face even as he refuses to save himself, the clearest statement
      of the loyalist code being extinguished.
  - id: vanderlinde-majapahit#u10-c5
    label: c5
    heading: Gayatri and Gajah Mada's calculated alliance
    span: 264336:264977
    why: Lays out the transactional, mutually-calculated nature of the dyarchy that will replace the collapsed
      founding order.
  - id: vanderlinde-majapahit#u10-c6
    label: c6
    heading: The assassination of Jayanegara
    span: 265884:266737
    why: The chapter's climactic act, the regicide that closes the interregnum and installs the Gajah
      Mada-Gayatri power that opens the golden age.
- nn: 11
  unit_id: ch09
  note_id: vanderlinde-majapahit-ch09
  span: 267205:294328
  chunks:
  - id: vanderlinde-majapahit#u11-c1
    label: c1
    heading: The Palapa Oath and the conquest plan
    span: 273762:275580
    why: 'This is the chapter''s ideological keystone: Gajah Mada''s founding vow and the concrete three-stage
      plan (negara agung, mancanegara, nusantara) for uniting the archipelago.'
  - id: vanderlinde-majapahit#u11-c2
    label: c2
    heading: Humiliation and the murder of Kembar
    span: 275733:276534
    why: Shows how the plan's legitimacy is secured through elimination of rivals rather than persuasion,
      with court violence narrated as casual gallows humor.
  - id: vanderlinde-majapahit#u11-c3
    label: c3
    heading: Prapanca and the buried Ken Arok revelation
    span: 281883:282962
    why: 'The chapter''s clearest illustration of controlled historiography: the empire''s future chronicler
      deliberately suppressing an inconvenient founding truth.'
  - id: vanderlinde-majapahit#u11-c4
    label: c4
    heading: Queen Gayatri's life and death
    span: 283185:283881
    why: Establishes the matriarchal patronage structure underwriting Gajah Mada's entire career and the
      Nusantara project.
  - id: vanderlinde-majapahit#u11-c5
    label: c5
    heading: Caitra festival policy address
    span: 291963:293015
    why: Fuses ritual spectacle with concrete state administration (land surveys, taxation, infrastructure),
      showing statecraft embedded in festival form.
  - id: vanderlinde-majapahit#u11-c6
    label: c6
    heading: Foreshadowing the wedding massacre
    span: 293780:294326
    why: The chapter's closing turn, retroactively framing the entire golden-age narrative as shadowed
      by the coming Bubat catastrophe.
- nn: 12
  unit_id: ch10
  note_id: vanderlinde-majapahit-ch10
  span: 294328:315704
  chunks:
  - id: vanderlinde-majapahit#u12-c1
    label: c1
    heading: Gajah Mada's real scheme behind the marriage
    span: 296318:296989
    why: States plainly that the marriage proposal was cover for annexation and nusantara unification,
      the engine of the whole chapter's conflict.
  - id: vanderlinde-majapahit#u12-c2
    label: c2
    heading: The insult exchange that breaks diplomacy
    span: 303116:304168
    why: The verbatim exchange is the exact moment protocol collapses and Majapahit's true intent to subordinate
      rather than marry as equals is revealed.
  - id: vanderlinde-majapahit#u12-c3
    label: c3
    heading: The massacre, the princess's suicide, and the lasting schism
    span: 307131:308612
    why: Carries the chapter's climax and its explicit claim that the battle produced a permanent regional
      and cultural fracture still felt in the present.
  - id: vanderlinde-majapahit#u12-c4
    label: c4
    heading: The court discovers it cannot govern without Gajah Mada
    span: 312424:312833
    why: Shows that Gajah Mada functioned as the kingdom's actual administrative infrastructure, explaining
      his rapid, if constrained, reinstatement despite the disaster he caused.
- nn: 13
  unit_id: ch11
  note_id: vanderlinde-majapahit-ch11
  span: 315704:340092
  chunks:
  - id: vanderlinde-majapahit#u13-c1
    label: c1
    heading: The progress as personal theater and infrastructure policy
    span: 315772:316343
    why: 'States the chapter''s core reading of the royal progress: ceremonial display of kingship fused
      with practical infrastructure investment.'
  - id: vanderlinde-majapahit#u13-c2
    label: c2
    heading: Gajah Mada's logistical mastery
    span: 316345:316777
    why: Shows the administrative apparatus underlying the king's charismatic display, credited entirely
      to one irreplaceable administrator.
  - id: vanderlinde-majapahit#u13-c3
    label: c3
    heading: The salt oligarchs
    span: 323681:324884
    why: Documents how a natural-resource windfall was absorbed into court patronage, producing a named
      oligarch class inside the tribute economy.
  - id: vanderlinde-majapahit#u13-c4
    label: c4
    heading: The irreplaceable strongman's death
    span: 334393:334947
    why: Names explicitly the factional tensions Gajah Mada's rule had suppressed, framing his death as
      an interregnum moment for the kingdom.
  - id: vanderlinde-majapahit#u13-c5
    label: c5
    heading: The founding of Malacca
    span: 339264:340090
    why: Marks the origin of the Islamic polity that will come to symbolize the decline of Majapahit's
      regional dominance, seeded by its own punitive campaign.
- nn: 14
  unit_id: ch12
  note_id: vanderlinde-majapahit-ch12
  span: 340092:363685
  chunks:
  - id: vanderlinde-majapahit#u14-c1
    label: c1
    heading: The king's death announced
    span: 340197:341078
    why: Establishes the funerary register and public mourning that frame the entire unit's opening scene.
  - id: vanderlinde-majapahit#u14-c2
    label: c2
    heading: The fatal succession decision
    span: 344081:344742
    why: 'This is the structural hinge of the whole unit: Hayam Wuruk''s split of the realm between Wikramawardhana
      and Wirabumi that directly causes the civil war.'
  - id: vanderlinde-majapahit#u14-c3
    label: c3
    heading: Patih Enggon's warning of repeating history
    span: 344744:345415
    why: The text's own self-aware historiography, naming Airlangga's 1042 division as the precedent being
      repeated through 'amnesia' — a cyclical-decline reading in the characters' own mouths.
  - id: vanderlinde-majapahit#u14-c4
    label: c4
    heading: The concubines' pyre and Suhita's vow
    span: 348688:349640
    why: The unit's most visceral passage, and the origin of Suhita's later resolve as the eventual heir
      who must clean up the succession crisis.
  - id: vanderlinde-majapahit#u14-c5
    label: c5
    heading: The massacre of Zheng's envoys
    span: 357599:358289
    why: The single event that converts an internal succession war into a costly, lasting diplomatic crisis
      with Ming China.
  - id: vanderlinde-majapahit#u14-c6
    label: c6
    heading: Earthquakes, silting, and famine
    span: 362086:363601
    why: Shows decline as the accumulation of infrastructural failure (irrigation, river access) and natural
      disaster compounding the war's damage, closing the unit.
- nn: 15
  unit_id: ch13
  note_id: vanderlinde-majapahit-ch13
  span: 363685:390576
  chunks:
  - id: vanderlinde-majapahit#u15-c1
    label: c1
    heading: 'The keris: a knife from age three to a hundred'
    span: 368795:369152
    why: Ma Huan's most detailed material-culture observation, showing the keris as a near-universal marker
      of male identity across the social scale.
  - id: vanderlinde-majapahit#u15-c2
    label: c2
    heading: The taboo of the head
    span: 369407:369589
    why: Records a specific social taboo backed by lethal force, illustrating how bodily custom functioned
      as enforceable law.
  - id: vanderlinde-majapahit#u15-c3
    label: c3
    heading: A capital without walls
    span: 370948:371228
    why: The chapter's clearest claim that Majapahit projected authority through confidence and ritual
      space rather than fortified legibility.
  - id: vanderlinde-majapahit#u15-c4
    label: c4
    heading: Piping holiness to the royal paddies
    span: 380530:380943
    why: Shows royal legitimacy engineered directly into hydraulic infrastructure, an unusually literal
      instance of infrastructure encoding sacred-political authority.
  - id: vanderlinde-majapahit#u15-c5
    label: c5
    heading: Witnessing a sati
    span: 383895:384547
    why: Ma Huan's own verbatim account of a widow-burning is the chapter's most morally charged and directly-quoted
      eyewitness passage.
  - id: vanderlinde-majapahit#u15-c6
    label: c6
    heading: A glimpse of the king
    span: 388948:389397
    why: The only surviving close physical description of a Majapahit monarch, recorded firsthand rather
      than through tradition or inscription.
- nn: 16
  unit_id: ch14
  note_id: vanderlinde-majapahit-ch14
  span: 390576:412149
  chunks:
  - id: vanderlinde-majapahit#u16-c1
    label: c1
    heading: A queen resized to fit the throne
    span: 390643:391174
    why: Establishes Suhita's characterization as a ruler who reshapes inherited institutions to fit herself,
      the chapter's governing motif.
  - id: vanderlinde-majapahit#u16-c2
    label: c2
    heading: The Damar Wulan legend
    span: 394125:396412
    why: Preserves the folkloric courtship legend that mythologizes Suhita's marriage, showing how popular
      memory processed a female ruler's politics.
  - id: vanderlinde-majapahit#u16-c3
    label: c3
    heading: Famine relief through infrastructure
    span: 399751:400252
    why: Documents her technocratic response to agrarian collapse, the clearest instance of infrastructure-as-legitimacy
      in the chapter.
  - id: vanderlinde-majapahit#u16-c4
    label: c4
    heading: The Ming Gap
    span: 401007:402257
    why: Names and explains the external trade shock that reshaped Majapahit's diplomatic options during
      her reign.
  - id: vanderlinde-majapahit#u16-c5
    label: c5
    heading: Retribution through temple design
    span: 409643:409988
    why: Supplies the interpretive key linking her childhood trauma directly to the erotic temple campaign
      against priestly authority.
  - id: vanderlinde-majapahit#u16-c6
    label: c6
    heading: Framing the terminal decline
    span: 411744:412147
    why: The chapter's own periodization of this reign as the hinge into Majapahit's irreversible Dusk,
      directly relevant to the world-machine decline arc.
- nn: 17
  unit_id: ch15
  note_id: vanderlinde-majapahit-ch15
  span: 412149:434549
  chunks:
  - id: vanderlinde-majapahit#u17-c1
    label: c1
    heading: Decline behind a ceremonial facade
    span: 417530:418424
    why: 'States the unit''s core diagnosis directly: Majapahit''s institutions had hollowed out while
      its ceremonial forms (tribute, diplomacy) persisted, a textbook decay-sequence pattern.'
  - id: vanderlinde-majapahit#u17-c2
    label: c2
    heading: Bujangga Manik renounces the court
    span: 419863:420322
    why: Introduces the unit's sole eyewitness-narrator figure and the personal, ascetic counter-voice
      whose travel account becomes the last inside record of Majapahit.
  - id: vanderlinde-majapahit#u17-c3
    label: c3
    heading: Tome Pires on the throat of Venice
    span: 425036:425458
    why: Captures the new mercantile order's chokepoint logic in its own words, marking the arrival of
      a rival world-machine's operating grammar.
  - id: vanderlinde-majapahit#u17-c4
    label: c4
    heading: The sack of Majapahit
    span: 432300:432983
    why: 'The unit''s climax: the single violent day in which the slow decline resolves into total destruction
      of the capital.'
  - id: vanderlinde-majapahit#u17-c5
    label: c5
    heading: From Jayakarta to Jakarta
    span: 433428:434547
    why: Delivers the chapter's closing irony, linking Majapahit's destroyers directly to the founding
      of the city that becomes modern Jakarta.
- nn: 18
  unit_id: ch16
  note_id: vanderlinde-majapahit-ch16
  span: 434549:446426
  chunks:
  - id: vanderlinde-majapahit#u18-c1
    label: c1
    heading: Mother Nature as the new ruler
    span: 434653:435144
    why: Establishes the physical collapse of the capital that the rest of the epilogue's legend-building
      and rediscovery narrative responds to.
  - id: vanderlinde-majapahit#u18-c2
    label: c2
    heading: Legends inflate as the ruins crumble
    span: 435146:435901
    why: Names the mechanism by which dynastic legitimacy claims multiplied in inverse proportion to verifiable
      memory, the chapter's key move on legend versus fact.
  - id: vanderlinde-majapahit#u18-c3
    label: c3
    heading: Majapahit relocates to Bali
    span: 435903:436586
    why: 'The chapter''s central reframing: the empire persisted by physically migrating its elite, texts,
      and religious culture rather than simply dying in place.'
  - id: vanderlinde-majapahit#u18-c4
    label: c4
    heading: A manuscript snatched from fire
    span: 438677:439211
    why: Shows how contingent and fragile the entire historical record of Majapahit's peak actually is,
      resting on one philologist's split-second decision.
  - id: vanderlinde-majapahit#u18-c5
    label: c5
    heading: Majapahit as Indonesia's founding myth
    span: 441507:441995
    why: Documents concretely how the modern Indonesian state built its symbolic infrastructure (flag
      colors) directly out of Majapahit-era material.
  - id: vanderlinde-majapahit#u18-c6
    label: c6
    heading: A contested hero
    span: 444078:444613
    why: Complicates the triumphalist nation-building narrative by showing Gajah Mada and the empire are
      read as oppressor rather than hero from some regional vantage points.
