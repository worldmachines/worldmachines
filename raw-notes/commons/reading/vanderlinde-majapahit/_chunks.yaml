# sha256 0577ce1d5a71e239051658de9065e6248e494683abefed1902aa792dd96d0906
# (446426 chars). Per-chunk spans were resolved by locating each start_quote/end_quote
# within its unit's span; all 98 chunks resolved to a single unambiguous span.
