source: braudel-civilization-capitalism-v1
units:
- nn: 1
  unit_id: introduction
  note_id: braudel-civilization-capitalism-v1-introduction
  span: 0:11206
  chunks:
  - id: braudel-civilization-capitalism-v1#u01-c1
    heading: 'The 1952 commission and the break with classical economic history'
    span: 14:1515
    why: 'States the book''s origin and Braudel''s founding grievance against a single, statistics-ready notion of "the economy" culminating in the Industrial Revolution, which motivates the tripartite schema that follows.'
  - id: braudel-civilization-capitalism-v1#u01-c2
    heading: 'Material life as the infra-economy'
    span: 2382:3014
    why: 'Introduces material life / material civilization as the vast, undocumented substrate beneath the market economy, the book''s foundational third term and the subject of this volume.'
  - id: braudel-civilization-capitalism-v1#u01-c3
    heading: 'Capitalism as the shadowy zone above the market'
    span: 3167:4379
    why: 'Defines capitalism, against convention, as a separate upper zone of privileged, semi-invisible actors distinct from ordinary market exchange, grounding Braudel''s most controversial claim.'
  - id: braudel-civilization-capitalism-v1#u01-c4
    heading: 'Comparative history through time and across the whole world'
    span: 7121:7390
    why: 'States Braudel''s method and ambition explicitly: comparison through the long term and the past/present dialectic, and through as wide a geographic space as possible.'
  - id: braudel-civilization-capitalism-v1#u01-c5
    heading: 'The trilogy''s titles and the limits of the possible'
    span: 7809:8453
    why: 'Ties the tripartite schema to the trilogy''s actual volume titles and names "the limits of the possible" as this volume''s organizing question.'
  - id: braudel-civilization-capitalism-v1#u01-c6
    heading: 'The 1973-4 crisis as proof the infra-economy persists'
    span: 6211:6881
    why: 'Uses a strikingly modern parallel to argue material life is a permanent substrate of any market economy rather than a pre-industrial relic.'
- nn: 2
  unit_id: preface
  note_id: braudel-civilization-capitalism-v1-preface
  span: 11206:20666
  chunks:
  - id: braudel-civilization-capitalism-v1#u02-c1
    heading: 'The limits of the possible'
    span: 11824:12673
    why: 'States the book''s central organizing concept — a slow-moving frontier between the possible and impossible that defines the historical problem the whole volume investigates.'
  - id: braudel-civilization-capitalism-v1#u02-c2
    heading: 'Material civilization as the other half of production'
    span: 14740:15573
    why: 'Defines material civilization as the routine-bound, exchange-resistant substratum of pre-industrial economies, comprising 80–90% of the world''s population.'
  - id: braudel-civilization-capitalism-v1#u02-c3
    heading: 'A journey to another planet'
    span: 13607:14442
    why: 'The Voltaire-at-Ferney anecdote frames the whole volume as an imaginative journey into a materially alien past.'
  - id: braudel-civilization-capitalism-v1#u02-c4
    heading: 'Structure versus event'
    span: 18155:19060
    why: 'Braudel''s explicit methodological argument that reducing the scale of historical observation turns a repeated happening into structure — the core justification for taking everyday life seriously as history.'
  - id: braudel-civilization-capitalism-v1#u02-c5
    heading: 'Anecdotes as signals of a way of life'
    span: 19061:19930
    why: 'Illustrates Braudel''s method in miniature: table manners and costume across centuries and continents used as compressed evidence for broader social structure.'
- nn: 3
  unit_id: ch01-guessing-world-population
  note_id: braudel-civilization-capitalism-v1-ch01-guessing-world-population
  span: 20666:68848
  chunks:
  - id: braudel-civilization-capitalism-v1#u03-c1
    heading: 'Numbers as a first-class pointer'
    span: 21442:22538
    why: 'States the chapter''s premise: population figures are read as a diagnostic index, and the deep shift is from cyclical ebb-and-flow to modern continuous growth.'
  - id: braudel-civilization-capitalism-v1#u03-c2
    heading: 'The scarcity of usable population data'
    span: 28602:29221
    why: 'Sets the epistemic baseline for the whole chapter: only Europe and China offer ground solid enough to build estimates on.'
  - id: braudel-civilization-capitalism-v1#u03-c3
    heading: 'Europe and China as the anchor for world estimates'
    span: 41509:42103
    why: 'Identifies the single load-bearing ratio - the rough equivalence of Europe and China - on which every subsequent world-population extrapolation depends.'
  - id: braudel-civilization-capitalism-v1#u03-c4
    heading: 'World population doubled, 1300-1800'
    span: 43359:44488
    why: 'States the chapter''s headline finding, which Braudel calls the basic fact of world history for the period.'
  - id: braudel-civilization-capitalism-v1#u03-c5
    heading: 'Climate and the physical coherence of the world'
    span: 64947:65589
    why: 'Proposes Braudel''s candidate unifying mechanism - synchronized climate - as prior to and independent of economic or political integration between regions.'
  - id: braudel-civilization-capitalism-v1#u03-c6
    heading: 'Simultaneity is the problem'
    span: 61728:62639
    why: 'Braudel''s own diagnosis of why space-and-colonization explanations fail: they account for where growth could occur, not why it occurred everywhere at once.'
- nn: 4
  unit_id: ch01-scale-of-reference
  note_id: braudel-civilization-capitalism-v1-ch01-scale-of-reference
  span: 68848:114256
  chunks:
  - id: braudel-civilization-capitalism-v1#u04-c1
    heading: 'The scale-of-reference method'
    span: 68869:69550
    why: 'States Braudel''s governing method for the unit: using population growth ratios to make pre-industrial numbers legible without treating them as exact equivalents.'
  - id: braudel-civilization-capitalism-v1#u04-c2
    heading: 'Istanbul as an urban monster'
    span: 70498:71167
    why: 'Shows what a single pre-modern megacity''s continent-spanning provisioning and slave-market network actually required to sustain 400,000-700,000 people.'
  - id: braudel-civilization-capitalism-v1#u04-c3
    heading: 'Lepanto and Wallenstein at the limits of the possible'
    span: 73616:74065
    why: 'Demonstrates Braudel''s translation of raw troop counts into felt magnitude and ties army/fleet size directly to logistical capacity rather than manpower alone.'
  - id: braudel-civilization-capitalism-v1#u04-c4
    heading: 'France, "full as an egg"'
    span: 76748:77492
    why: 'Defines overpopulation as relative to a country''s economic capacity rather than absolute density, grounding the unit''s account of emigration and later birth control.'
  - id: braudel-civilization-capitalism-v1#u04-c5
    heading: 'The narrow, persistent belt of civilization'
    span: 85486:86182
    why: 'States the Hewes-map argument that the sites of dense civilization in 1400-1800 are the same sites today, Braudel''s longue duree made cartographic.'
  - id: braudel-civilization-capitalism-v1#u04-c6
    heading: 'Wolves as an index of the countryside''s health'
    span: 104322:104636
    why: 'A vivid instance of reading wildlife density as a real-time proxy for rural well-being, underscoring how thin the settled belt was against the wild world around it.'
- nn: 5
  unit_id: ch01-eighteenth-century-biological-watershed
  note_id: braudel-civilization-capitalism-v1-ch01-eighteenth-century-biological-watershed
  span: 114256:167664
  chunks:
  - id: braudel-civilization-capitalism-v1#u05-c1
    heading: 'The mechanics of demographic equilibrium'
    span: 114559:115672
    why: 'States the unit''s core mechanism — births and deaths held near-equal and restored by short-term compensation — with the Cologne plague/marriages example as concrete proof.'
  - id: braudel-civilization-capitalism-v1#u05-c2
    heading: 'Famine as chronic condition, and the China/Muscovy/India comparison'
    span: 119094:120115
    why: 'Establishes famine as structural rather than exceptional and does the unit''s key world-scale comparative work on why some regions absorbed bad harvests better than others.'
  - id: braudel-civilization-capitalism-v1#u05-c3
    heading: 'The 1630–31 Indian famine'
    span: 126869:127971
    why: 'The unit''s most visceral evidence, and the passage Braudel uses to relativize Europe''s own famines rather than exempt them.'
  - id: braudel-civilization-capitalism-v1#u05-c4
    heading: 'Plague as class instrument'
    span: 148538:148909
    why: 'Compact, quotable statement of plague''s social selectivity, capped by Braudel''s own invocation of Sartre.'
  - id: braudel-civilization-capitalism-v1#u05-c5
    heading: 'McNeill''s macroparasitism and microparasitism'
    span: 155093:156480
    why: 'The unit''s clearest theoretical move: disease given its own history, entangled with but independent of human intention, and tied to a concrete mechanism (Mongol expansion, the silk routes).'
  - id: braudel-civilization-capitalism-v1#u05-c6
    heading: 'Closing thesis: the triumph of the force of numbers'
    span: 167141:167662
    why: 'The unit''s explicit thesis statement, naming resilience/compensation rather than the absence of catastrophe as the defining trait of the biological ancien regime.'
- nn: 6
  unit_id: ch01-many-against-the-few
  note_id: braudel-civilization-capitalism-v1-ch01-many-against-the-few
  span: 167664:192724
  chunks:
  - id: braudel-civilization-capitalism-v1#u06-c1
    heading: 'Numbers as material-life fact'
    span: 167690:168126
    why: 'States the unit''s opening claim -- that population density is a structural determinant of disease, technology and social hierarchy -- in Braudel''s own voice.'
  - id: braudel-civilization-capitalism-v1#u06-c2
    heading: 'Barbarian conquest as absorption'
    span: 170463:172305
    why: 'Gives Braudel''s core mechanism for why ''barbarian'' victories don''t overturn civilizations: the conqueror was already acculturated, and is reabsorbed within a generation.'
  - id: braudel-civilization-capitalism-v1#u06-c3
    heading: 'The nomads'' career ends'
    span: 178733:179311
    why: 'Marks, in Braudel''s own summary language, the structural (gunpowder-driven) termination of a millennia-long Eurasian constant -- the clearest single sentence for citing the nomad-to-settled-state transition.'
  - id: braudel-civilization-capitalism-v1#u06-c4
    heading: 'Culture as immature civilization'
    span: 187942:188386
    why: 'Supplies Braudel''s working definition distinguishing ''culture'' from ''civilization,'' the concept that unifies the unit''s otherwise disparate colonial examples.'
  - id: braudel-civilization-capitalism-v1#u06-c5
    heading: 'Numbers as constraint, not determinism'
    span: 191116:192722
    why: 'The unit''s thesis statement: numbers matter as one durable constraint of material life without determining history outright, and it explicitly hands off to the volume''s coming material life / economic life / capitalism distinction.'
- nn: 7
  unit_id: ch02-wheat-cultivation-and-yields
  note_id: braudel-civilization-capitalism-v1-ch02-wheat-cultivation-and-yields
  span: 192724:241120
  chunks:
  - id: braudel-civilization-capitalism-v1#u07-c1
    heading: 'Diet as the mark of civilization'
    span: 193781:194145
    why: 'States Braudel''s opening thesis that diet is a function of population density and functions as a marker of social and civilizational identity.'
  - id: braudel-civilization-capitalism-v1#u07-c2
    heading: 'The ''plants of civilization'''
    span: 199459:200173
    why: 'Names wheat, rice, and maize as founding, near-irreversible civilizational choices, the material-determinist claim the rest of the chapter unpacks.'
  - id: braudel-civilization-capitalism-v1#u07-c3
    heading: 'The wheat-rotation-livestock complex (Ferdinand Lot)'
    span: 222833:223147
    why: 'Braudel''s own summary quote of the locked, self-reinforcing agrarian system that resonates with WMP''s world-machine concept of durable deep infrastructure.'
  - id: braudel-civilization-capitalism-v1#u07-c4
    heading: 'The ceiling: a five-to-one harvest'
    span: 231970:232471
    why: 'States the chapter''s central quantitative finding, wheat''s persistently low seed-to-harvest ratio, which is Braudel''s ''limits of the possible'' rendered as data.'
  - id: braudel-civilization-capitalism-v1#u07-c5
    heading: 'Maurizio''s longue duree claim'
    span: 197602:197913
    why: 'Gives the explicit longue duree framing anchoring the chapter''s treatment of diet as a near-static deep structure.'
  - id: braudel-civilization-capitalism-v1#u07-c6
    heading: 'Mulliez''s revisionist reading of ''backward'' livestock land'
    span: 230836:231625
    why: 'Braudel''s endorsed revision of the standard hierarchy of agricultural land, showing material-life determinism runs through grazing as much as grain.'
- nn: 8
  unit_id: ch02-wheat-trade-price-and-bread
  note_id: braudel-civilization-capitalism-v1-ch02-wheat-trade-price-and-bread
  span: 241120:282205
  chunks:
  - id: braudel-civilization-capitalism-v1#u08-c1
    heading: 'The grain trade was marginal'
    span: 247013:247584
    why: 'Braudel''s own arithmetic shows the long-distance grain trade at only about 1% of Mediterranean consumption, grounding his claim that the visible international trade mattered far less than the silent local economy.'
  - id: braudel-civilization-capitalism-v1#u08-c2
    heading: 'Calories, cereals, and class'
    span: 256104:256654
    why: 'The direct comparison of a rich household''s diet to a hospital''s shows Braudel''s monotony index of poverty in action: cereal share of calories, not calorie totals, marked class.'
  - id: braudel-civilization-capitalism-v1#u08-c3
    heading: 'The 100/200/300-hour threshold'
    span: 262547:262926
    why: 'Gives Braudel''s precise price-in-labor-hours ceiling, the book''s clearest statement of a structural limit governing the standard of living.'
  - id: braudel-civilization-capitalism-v1#u08-c4
    heading: 'Genoa 1673: the fight over who bakes'
    span: 276927:277723
    why: 'Documents nobles trying to convert a diffuse household right (home-baking) into a monopoly concession, and the popular backlash it provoked.'
  - id: braudel-civilization-capitalism-v1#u08-c5
    heading: 'Mangiate pietre: the Naples bread riot of 1585'
    span: 280657:281085
    why: 'Shows how a hoarding merchant''s contemptuous ''eat stones'' escalated instantly into lynching and mass reprisal, evidencing bread''s politically explosive status.'
- nn: 9
  unit_id: ch02-rice
  note_id: braudel-civilization-capitalism-v1-ch02-rice
  span: 282205:315034
  chunks:
  - id: braudel-civilization-capitalism-v1#u09-c1
    heading: 'Rice as a more tyrannical crop than wheat'
    span: 282211:283194
    why: 'States Braudel''s organizing comparison (rice vs. wheat) and the hydraulic logic that drives the whole chapter''s argument.'
  - id: braudel-civilization-capitalism-v1#u09-c2
    heading: 'The paddy-field as a caloric factory'
    span: 298139:298855
    why: 'Gives the quantitative caloric comparison (rice vs. wheat vs. meat) that grounds Braudel''s material explanation of Far Eastern vegetarianism.'
  - id: braudel-civilization-capitalism-v1#u09-c3
    heading: 'Irrigation, state control, and village concentration'
    span: 294219:294581
    why: 'Directly links rice-field expansion to state authority and settlement concentration, the passage most resonant with legibility-style infrastructure.'
  - id: braudel-civilization-capitalism-v1#u09-c4
    heading: 'The foregone highlands, against Europe''s mixed farming'
    span: 305914:306470
    why: 'States the explicit trade-off between rice monoculture and highland/pastoral economies, contrasted with Europe''s labourage et paturage.'
  - id: braudel-civilization-capitalism-v1#u09-c5
    heading: 'The Champa rice revolution and southern China''s demographic rise'
    span: 303627:304099
    why: 'Dates and narrates the slow, distributed diffusion of early-maturing rice that made the double harvest and southern China''s demographic expansion possible.'
- nn: 10
  unit_id: ch02-maize-and-dietary-revolutions
  note_id: braudel-civilization-capitalism-v1-ch02-maize-and-dietary-revolutions
  span: 315034:346466
  chunks:
  - id: braudel-civilization-capitalism-v1#u10-c1
    heading: 'Tehuacan and the archaeology of maize''s origin'
    span: 316673:317749
    why: 'Braudel''s showcase of longue-durée archaeological method — pollen and cave strata giving a demonstrable evolutionary sequence from small wild maize to the cultivated plant, grounding the whole unit''s argument in verifiable prehistory.'
  - id: braudel-civilization-capitalism-v1#u10-c2
    heading: 'Maize, monumental labor, and Braudel''s irony'
    span: 322062:322900
    why: 'States the unit''s central material-life claim in Braudel''s own rhetorical voice: pyramids and terraces were possible only because maize demanded little labor, freeing populations for coerced public works.'
  - id: braudel-civilization-capitalism-v1#u10-c3
    heading: 'Evading taxation by staying off the map (Balkans)'
    span: 330502:330774
    why: 'Shows peasants deliberately keeping a lucrative new crop invisible to seigneurial and tax authorities for two centuries, a genuine case of subsistence agriculture resisting institutional legibility.'
  - id: braudel-civilization-capitalism-v1#u10-c4
    heading: 'The potato''s accidental capture-resistance'
    span: 341437:342151
    why: 'Documents the potato''s structural immunity to two extraction regimes at once — armies that could trample fields without destroying underground tubers, and tithes it initially escaped — driving its adoption in nearly every eighteenth-century war.'
  - id: braudel-civilization-capitalism-v1#u10-c5
    heading: 'Maize eaten, wheat sold: material life underwrites the market'
    span: 333598:334287
    why: 'The clearest statement in the unit of Braudel''s three-storey house in miniature: peasants live on the subsistence crop while the market crop is freed for sale at double the price, quantified with Venetian export figures.'
  - id: braudel-civilization-capitalism-v1#u10-c6
    heading: '''Bread'' as color line in Mexico City, 1697'
    span: 345738:346464
    why: 'Closes the unit on the sharpest illustration of food as social and racial marker — Careri''s eyewitness account of a bread riot that Braudel reads as potentially encoding a ''white bread, white man'' equation against maize-eating mestizos, Indians, and slaves.'
- nn: 11
  unit_id: ch02-the-rest-of-the-world
  note_id: braudel-civilization-capitalism-v1-ch02-the-rest-of-the-world
  span: 346466:369427
  chunks:
  - id: braudel-civilization-capitalism-v1#u11-c1
    heading: 'Plants succeed because cultures make them succeed'
    span: 347562:348886
    why: 'States the chapter''s governing claim (plant success is cultural, not intrinsic) via the manioc counter-example and names the hoe-cultivators as a group.'
  - id: braudel-civilization-capitalism-v1#u11-c2
    heading: 'Boserup: the tool as result, not cause'
    span: 350639:351047
    why: 'The unit''s one explicit theoretical mechanism, and its clearest longue-durée/limits-of-the-possible argument: demographic pressure drives tool change, not invention.'
  - id: braudel-civilization-capitalism-v1#u11-c3
    heading: 'A homogeneous material culture across the hoe belt'
    span: 353466:354011
    why: 'Braudel''s concrete inventory of shared material life (house form, craft, animals, diet) across an enormous, geographically dispersed belt.'
  - id: braudel-civilization-capitalism-v1#u11-c4
    heading: 'Hoe cultivators are not the lowest rung'
    span: 359248:359994
    why: 'Does the unit''s classificatory work, placing gatherer-hunter-fisher ''predators'' below hoe cultivators and defining primitiveness by lack of environmental control.'
  - id: braudel-civilization-capitalism-v1#u11-c5
    heading: 'Tahiti: welcome and barter as evidence of civilization'
    span: 363506:363935
    why: 'Shows Braudel applying his cultivation test against eyewitness voyage accounts (Bougainville, Cook) to overturn the ''primitive Tahitian'' myth.'
  - id: braudel-civilization-capitalism-v1#u11-c6
    heading: 'Fur trade: capitalism reaches the hunting margin'
    span: 367828:368660
    why: 'Closes the unit by showing the market economy/capitalism reorganizing even the non-agricultural margin, naming the agent explicitly as European capitalism.'
- nn: 12
  unit_id: ch03-luxury-and-meat
  note_id: braudel-civilization-capitalism-v1-ch03-luxury-and-meat
  span: 369427:413427
  chunks:
  - id: braudel-civilization-capitalism-v1#u12-c1
    heading: 'The catalogue of yesterday''s luxuries'
    span: 370503:371786
    why: 'Establishes Braudel''s core definitional claim that luxury is not a fixed set of goods but a historically shifting relation, illustrated through a concrete succession of once-rare items.'
  - id: braudel-civilization-capitalism-v1#u12-c2
    heading: 'A conflict waged by classes and civilizations'
    span: 375694:376423
    why: 'The unit''s most explicit theoretical claim: luxury-driven desire, not bare production, is what sets both classes and whole civilizations into motion against each other.'
  - id: braudel-civilization-capitalism-v1#u12-c3
    heading: 'The peasant who never ate his best produce'
    span: 379939:380260
    why: 'Concrete evidence of the structural gap between elite culinary culture and the actual diet of the majority, who sold their best food rather than eating it.'
  - id: braudel-civilization-capitalism-v1#u12-c4
    heading: 'Montaigne''s seven-dish inns'
    span: 388751:389016
    why: 'Eyewitness evidence for the unit''s surprising claim that ordinary Europeans, not just the rich, ate meat lavishly in the fifteenth-sixteenth centuries.'
  - id: braudel-civilization-capitalism-v1#u12-c5
    heading: 'Heinrich Müller''s 1550 Swabian testimony'
    span: 395650:396096
    why: 'First-person testimony marking the turning point Braudel reconstructs from scattered witnesses: meat abundance curdling into scarcity after 1550.'
  - id: braudel-civilization-capitalism-v1#u12-c6
    heading: 'China''s population-pressure explanation'
    span: 408294:408843
    why: 'The clearest statement in the unit of material constraint determining diet across civilizations: population pressure on a fixed land base explains China''s near-meatless cuisine.'
- nn: 13
  unit_id: ch03-table-manners-and-everyday-foods
  note_id: braudel-civilization-capitalism-v1-ch03-table-manners-and-everyday-foods
  span: 413427:477156
  chunks:
  - id: braudel-civilization-capitalism-v1#u13-c1
    heading: 'The thousand-ecu turtle and the whims of princes'
    span: 413726:414342
    why: 'Opens the chapter''s argument about elite extravagance and ends on Braudel''s own editorializing judgment of it.'
  - id: braudel-civilization-capitalism-v1#u13-c2
    heading: 'The fork''s two-century crawl into common use'
    span: 421632:423514
    why: 'Traces one utensil''s slow diffusion across named eyewitnesses (Montaigne, Louis XIV''s court, the Princess Palatine) — the unit''s clearest longue durée case study.'
  - id: braudel-civilization-capitalism-v1#u13-c3
    heading: 'Reading table settings out of Last Supper paintings'
    span: 427083:428694
    why: 'States Braudel''s method of using devotional iconography as a dataset for material-culture history, anchored to avoid straddling the interleaved figure caption.'
  - id: braudel-civilization-capitalism-v1#u13-c4
    heading: 'Salt''s trade crosses the confessional map'
    span: 428898:429813
    why: 'Shows the market economy''s logic overriding the Catholic/Protestant political map, a clean instance of trade''s autonomy from politics.'
  - id: braudel-civilization-capitalism-v1#u13-c5
    heading: 'Spice as antidote to dietary monotony, compared world-wide'
    span: 458618:459091
    why: 'States Braudel''s explicit world-scale comparison of spice-craving across Islam, China, and India via a quoted Hindu writer.'
  - id: braudel-civilization-capitalism-v1#u13-c6
    heading: 'Sugar: from apothecary''s medicine to gluttony''s food'
    span: 471301:471727
    why: 'Ortelius''s 1572 line is the chapter''s sharpest statement of sugar''s transformation from rare medicine into a mass commodity, the pivot into the sugar-and-slavery argument.'
- nn: 14
  unit_id: ch03-drinks-wine-beer-alcohol
  note_id: braudel-civilization-capitalism-v1-ch03-drinks-wine-beer-alcohol
  span: 477156:525202
  chunks:
  - id: braudel-civilization-capitalism-v1#u14-c1
    heading: 'Drinks as drugs, not just foodstuffs'
    span: 477354:477802
    why: 'States the unit''s own frame — drink as drug and means of escape — that organizes everything that follows, from water to alcohol.'
  - id: braudel-civilization-capitalism-v1#u14-c2
    heading: 'Venice rations its rainwater'
    span: 478771:479658
    why: 'The unit''s sharpest material-life example: a wealthy maritime capital dependent on sand-filtered cisterns and daily boatloads of river water.'
  - id: braudel-civilization-capitalism-v1#u14-c3
    heading: 'The vine''s climatic boundary'
    span: 487711:488485
    why: 'Gives Braudel''s longue-durée, limits-of-the-possible boundary for commercial viticulture and frames wine''s spread as world-scale civilizational imprinting.'
  - id: braudel-civilization-capitalism-v1#u14-c4
    heading: 'Alcohol''s three-stage arrival'
    span: 510922:511364
    why: 'Braudel''s own periodization of alcohol''s rise (created, consolidated, popularized across three centuries), plus the word''s Arabic/Greek etymology.'
  - id: braudel-civilization-capitalism-v1#u14-c5
    heading: 'Alcohol on the Amsterdam Exchange'
    span: 523958:524285
    why: 'The clearest moment a drink is shown functioning as a ranked, quoted capitalist financial instrument rather than a consumed good.'
  - id: braudel-civilization-capitalism-v1#u14-c6
    heading: 'Stills capped by their own technology'
    span: 518780:519199
    why: 'A direct instance of Braudel''s limits of the possible: consumption could not expand until the distilling apparatus itself was reinvented.'
- nn: 15
  unit_id: ch03-stimulants-chocolate-tea-coffee-tobacco
  note_id: braudel-civilization-capitalism-v1-ch03-stimulants-chocolate-tea-coffee-tobacco
  span: 525202:568051
  chunks:
  - id: braudel-civilization-capitalism-v1#u15-c1
    heading: 'Creating ''a new need'': alcohol as colonial policy'
    span: 530240:530802
    why: 'Names deliberate colonial policy for manufacturing native dependency through alcohol, not accidental vice.'
  - id: braudel-civilization-capitalism-v1#u15-c2
    heading: 'No single origin for the still: Persia, China, or the West?'
    span: 528257:529463
    why: 'A clean instance of Braudel''s world-scale, non-Eurocentric comparative method, refusing to grant Europe priority over China or Persia.'
  - id: braudel-civilization-capitalism-v1#u15-c3
    heading: 'Tea as a ''plant of civilization'': cultivation''s strict bondage'
    span: 541314:542047
    why: 'States Braudel''s recurring thesis that commodity crops discipline the societies that grow them, paralleled explicitly with viticulture.'
  - id: braudel-civilization-capitalism-v1#u15-c4
    heading: 'Della Valle''s Constantinople: coffee as ritual of conversation'
    span: 546782:547710
    why: 'A first-person European account of coffee''s original social function in Islam, before its reinvention as a Parisian fashion good.'
  - id: braudel-civilization-capitalism-v1#u15-c5
    heading: 'Coffee becomes a ''national commodity'': capitalism organizes a stimulant'
    span: 557267:557651
    why: 'Braudel names an active capitalist sector behind coffee''s production and distribution, marking its passage into his top storey of capitalism.'
  - id: braudel-civilization-capitalism-v1#u15-c6
    heading: 'Prohibitions that ''encircled the world'' and were everywhere ignored'
    span: 565771:566304
    why: 'Shows tobacco spreading as a distributed, ungovernable practice that outran every state''s attempt to prohibit it, with no single center of control.'
- nn: 16
  unit_id: ch04-houses-throughout-the-world
  note_id: braudel-civilization-capitalism-v1-ch04-houses-throughout-the-world
  span: 568051:605823
  chunks:
  - id: braudel-civilization-capitalism-v1#u16-c1
    heading: 'Houses as an enduring, world-spanning testimony to tradition'
    span: 569398:570902
    why: 'States Braudel''s longue-durée framing of housing directly, using Muslim-influenced Valladolid, Persia, Brazil, and the nomad''s tent as world-scale evidence that houses change almost imperceptibly.'
  - id: braudel-civilization-capitalism-v1#u16-c2
    heading: 'Material limits, human choice, and a world-scale hierarchy of building materials'
    span: 570945:572558
    why: 'Gives Braudel''s core ''limits of the possible'' move — geography constrains but does not fully determine building material — and immediately tests it against Persia, Rome/Byzantium, the Inca, the Maya, and the Indian Deccan.'
  - id: braudel-civilization-capitalism-v1#u16-c3
    heading: 'Coercion and subsidy: authorities standardizing roofing against fire risk'
    span: 574841:575379
    why: 'The clearest instance of communal/seigneurial authority actively overriding vernacular practice to standardize building material, a material-scale precursor to legibility-style regulation.'
  - id: braudel-civilization-capitalism-v1#u16-c4
    heading: 'Villages as mobile, deserted, and rediscovered'
    span: 590572:591196
    why: 'Shows that the village, not just the individual house, is a historically mobile unit that can be abandoned wholesale (the Wustungen) or relocated, which is what later resurfaces as museum and excavation sites.'
  - id: braudel-civilization-capitalism-v1#u16-c5
    heading: 'The eighteenth-century split between home and workplace'
    span: 598672:599379
    why: 'Marks the historical hinge where domestic and productive space separate for the urban rich, reorganizing gender roles and household structure across Europe and, Braudel notes, China too.'
- nn: 17
  unit_id: ch04-interiors
  note_id: braudel-civilization-capitalism-v1-ch04-interiors
  span: 605823:671561
  chunks:
  - id: braudel-civilization-capitalism-v1#u17-c1
    heading: 'Interiors and the privilege of change'
    span: 605833:606427
    why: 'States the unit''s organizing thesis: interiors are nearly static almost everywhere except the West, which alone claims continuous change as a privilege.'
  - id: braudel-civilization-capitalism-v1#u17-c2
    heading: 'A Burgundian peasant inventory'
    span: 607420:607762
    why: 'A verbatim probate-inventory list that makes the poverty of ordinary furniture concrete rather than abstract.'
  - id: braudel-civilization-capitalism-v1#u17-c3
    heading: 'Chairs as a claim to superiority'
    span: 611747:612175
    why: 'Shows furniture doing cultural-hierarchy work: the presence or absence of chairs becomes a Christian claim to superiority over Muslims.'
  - id: braudel-civilization-capitalism-v1#u17-c4
    heading: 'The kang: China''s double furniture system'
    span: 621477:622010
    why: 'The clearest concrete description of China''s unique combination of seated and squatting furniture traditions in a single household.'
  - id: braudel-civilization-capitalism-v1#u17-c5
    heading: 'Privacy as an eighteenth-century invention'
    span: 664576:666151
    why: 'Argues that domestic privacy is a datable historical invention (c. 1720s), not a human constant, tied to urban land costs and the subdivision of apartments.'
  - id: braudel-civilization-capitalism-v1#u17-c6
    heading: 'Luxury is not comfort'
    span: 671319:671560
    why: 'The unit''s closing statement of its luxury-versus-comfort thesis, warning against reading past material abundance through present standards.'
- nn: 18
  unit_id: ch04-costume-and-fashion
  note_id: braudel-civilization-capitalism-v1-ch04-costume-and-fashion
  span: 671561:725444
  chunks:
  - id: braudel-civilization-capitalism-v1#u18-c1
    heading: 'Sumptuary laws and the passion to rise'
    span: 671581:672554
    why: 'States the chapter''s thesis in miniature: dress as social signal, sumptuary law as elite defense of it, and its persistent failure against imitation and ambition.'
  - id: braudel-civilization-capitalism-v1#u18-c2
    heading: 'Political conquest as the only agent of costume change'
    span: 675745:676044
    why: 'Braudel''s clearest statement that stable societies keep stable costume and only political rupture, here Mughal conquest, resets it — dress as a case of the limits of the possible.'
  - id: braudel-civilization-capitalism-v1#u18-c3
    heading: '1700: fashion becomes all-powerful'
    span: 684846:685354
    why: 'Names the exact historical hinge at which ''fashion'' acquires its modern sense of perpetual, obligatory change.'
  - id: braudel-civilization-capitalism-v1#u18-c4
    heading: 'Fashion as index of civilizational energy'
    span: 698790:700251
    why: 'Braudel''s own interpretive verdict on fashion, staged against a Japanese secretary''s boast of a thousand years'' costume-changelessness.'
  - id: braudel-civilization-capitalism-v1#u18-c5
    heading: 'Silk''s centuries-long migration to Byzantium'
    span: 706926:707604
    why: 'Exemplifies the slow-moving textile geography that underlies fashion''s apparent caprice, central to Braudel''s longue-duree method.'
  - id: braudel-civilization-capitalism-v1#u18-c6
    heading: 'Fashion as a barrier the privileged keep rebuilding'
    span: 701639:702768
    why: 'Ties fashion''s acceleration directly to social mobility and material prosperity, Braudel''s synthesis linking costume to economic dynamism.'
- nn: 19
  unit_id: ch05-human-and-animal-energy
  note_id: braudel-civilization-capitalism-v1-ch05-human-and-animal-energy
  span: 725444:771138
  chunks:
  - id: braudel-civilization-capitalism-v1#u19-c1
    heading: 'The ''ceiling'' of technological readiness'
    span: 729881:730762
    why: 'States Braudel''s governing theory of this unit — that a society''s readiness, not the mere existence of an invention, decides when technology is actually used.'
  - id: braudel-civilization-capitalism-v1#u19-c2
    heading: 'Man as a weak but flexible engine'
    span: 731753:732651
    why: 'Gives the unit''s core quantitative comparison of human to animal power and explains why human labor was priced well above its raw mechanical output.'
  - id: braudel-civilization-capitalism-v1#u19-c3
    heading: 'Poinsot''s case for the spade over the plough'
    span: 733659:734758
    why: 'A primary-source block quote Braudel uses to show human hand-labor''s real productive ceiling and the social resistance to exploiting it.'
  - id: braudel-civilization-capitalism-v1#u19-c4
    heading: 'Cheap labor as an anti-mechanization force'
    span: 739470:739942
    why: 'The unit''s sharpest thesis sentence: mechanization requires human labor to become costly, not merely for machines to exist.'
  - id: braudel-civilization-capitalism-v1#u19-c5
    heading: 'Islam''s camel monopoly and ''ancient capitalism'''
    span: 746951:747583
    why: 'Ties animal power directly to Braudel''s capitalism framing, crediting the camel network with building an early commercial infrastructure across the Old World.'
  - id: braudel-civilization-capitalism-v1#u19-c6
    heading: 'The horse-collar multiplies a horse fourfold'
    span: 752122:752602
    why: 'A concrete case study of the unit''s opening ''ceiling'' theory: one invention, adopted only once society was ready to exploit it.'
- nn: 20
  unit_id: ch05-wind-water-wood-coal
  note_id: braudel-civilization-capitalism-v1-ch05-wind-water-wood-coal
  span: 771138:816663
  chunks:
  - id: braudel-civilization-capitalism-v1#u20-c1
    heading: 'The first mechanical revolution, downgraded'
    span: 771169:771582
    why: 'States the unit''s opening thesis that medieval mechanization was gradual accretion, not a single revolutionary rupture, and gives the horse-power scale involved.'
  - id: braudel-civilization-capitalism-v1#u20-c2
    heading: 'Civilizations of wood and charcoal'
    span: 790332:790737
    why: 'Braudel''s signature formulation naming wood as the defining material-energy regime of the period, the organizing claim for the whole wood section.'
  - id: braudel-civilization-capitalism-v1#u20-c3
    heading: 'Coke reaches brewing before ironworks'
    span: 810019:810637
    why: 'Concrete case of a new energy technology diffusing through an unexpected channel (brewing) well before its eventual industrial application, illustrating the unit''s point about non-obvious technology adoption paths.'
  - id: braudel-civilization-capitalism-v1#u20-c4
    heading: 'China''s coal precocity and the limits of technology'
    span: 811778:812421
    why: 'Braudel''s most explicit statement of the world-scale comparative puzzle (why China''s early technical lead did not yield an industrial revolution) and his thesis that social readiness, not invention, is the bottleneck.'
  - id: braudel-civilization-capitalism-v1#u20-c5
    heading: 'Ranking pre-industrial energy sources'
    span: 812641:814035
    why: 'The unit''s quantitative payoff: a ranked energy budget (animals, wood, water, manpower, sails) concluding that transportable-energy scarcity, not machinery, capped pre-industrial growth.'
  - id: braudel-civilization-capitalism-v1#u20-c6
    heading: 'The European fleet''s fivefold growth'
    span: 789039:789532
    why: 'Represents the sails subsection with Braudel''s characteristic move of grounding an argument in a large, self-flagged-as-shaky statistic about merchant tonnage.'
- nn: 21
  unit_id: ch05-iron-a-poor-relation
  note_id: braudel-civilization-capitalism-v1-ch05-iron-a-poor-relation
  span: 816663:842466
  chunks:
  - id: braudel-civilization-capitalism-v1#u21-c1
    heading: 'The difference in scale'
    span: 817021:817727
    why: 'Opens the chapter''s thesis that pre-industrial iron production was orders of magnitude smaller than modern output, the quantitative baseline for everything Braudel says about iron''s marginality.'
  - id: braudel-civilization-capitalism-v1#u21-c2
    heading: 'China''s unexplained stagnation'
    span: 827658:828063
    why: 'States the still-unresolved puzzle of China''s early metallurgical lead followed by three centuries of stagnation, the chapter''s central world-scale comparison.'
  - id: braudel-civilization-capitalism-v1#u21-c3
    heading: 'Local secrets, general technique'
    span: 833920:834227
    why: 'Shows technique spreading not by central design but through itinerant craftsmen carrying local know-how into general use, the quiet, distributed diffusion pattern behind Europe''s slow catch-up.'
  - id: braudel-civilization-capitalism-v1#u21-c4
    heading: 'Water power and the limits of the possible'
    span: 830019:830778
    why: 'Identifies the water-wheel and blast furnace as the decisive technical advance while tying its uneven, centuries-long spread to natural constraints of forest and river, Braudel''s limits of the possible at work in iron.'
  - id: braudel-civilization-capitalism-v1#u21-c5
    heading: 'Dispersion versus concentration'
    span: 837832:838501
    why: 'States directly why iron production stayed dispersed rather than industrially concentrated: transport, fuel, and water power pinned it to river- and sea-accessible sites.'
  - id: braudel-civilization-capitalism-v1#u21-c6
    heading: 'Proletarian iron'
    span: 839971:841146
    why: 'Names the historiographical bias toward high-value metals and states the structural contrast at the heart of the unit: proletarian iron sat outside the speculative capital that silver and gold attracted.'
- nn: 22
  unit_id: ch06-gunpowder-and-artillery
  note_id: braudel-civilization-capitalism-v1-ch06-gunpowder-and-artillery
  span: 842466:869998
  chunks:
  - id: braudel-civilization-capitalism-v1#u22-c1
    heading: 'No innovation stays captured'
    span: 843023:843464
    why: 'States the chapter''s governing thesis — technology diffuses and is never permanently monopolized — that the rest of the unit tests against artillery.'
  - id: braudel-civilization-capitalism-v1#u22-c2
    heading: 'Against ''Western nationalism'' on Chinese priority'
    span: 844224:844486
    why: 'Braudel explicitly correcting Eurocentric historiography of invention, central to his world-scale comparative method.'
  - id: braudel-civilization-capitalism-v1#u22-c3
    heading: 'Artillery and the capitalist arms industry'
    span: 859568:860148
    why: 'Names artillery''s transformation of war into a matter of capitalist production and state finance — his capitalism storey visibly intruding on military technology.'
  - id: braudel-civilization-capitalism-v1#u22-c4
    heading: 'Venice''s gunpowder bookkeeping'
    span: 863051:863389
    why: 'A concrete case of Braudel''s characteristic move from narrative to quantified account-book evidence, showing war''s fiscal weight even absent combat.'
  - id: braudel-civilization-capitalism-v1#u22-c5
    heading: 'European gunners as world mercenaries'
    span: 866792:867413
    why: 'Extends the diffusion thesis from objects to expertise, documenting how itinerant European gunners carried the technology worldwide.'
  - id: braudel-civilization-capitalism-v1#u22-c6
    heading: 'No permanent imbalance of power'
    span: 867792:868225
    why: 'Braudel''s closing judgment that artillery, unlike ocean navigation, spread everywhere without creating lasting civilizational asymmetry.'
- nn: 23
  unit_id: ch06-printing-and-ocean-navigation
  note_id: braudel-civilization-capitalism-v1-ch06-printing-and-ocean-navigation
  span: 869998:908408
  chunks:
  - id: braudel-civilization-capitalism-v1#u23-c1
    heading: 'Paper''s only advantage was price'
    span: 871419:871811
    why: 'States the pure economic logic — cheapness over quality — that made paper, not parchment, the material substrate that let printing scale.'
  - id: braudel-civilization-capitalism-v1#u23-c2
    heading: 'Doubts about a European origin for movable type'
    span: 875788:876492
    why: 'Braudel''s clearest statement that the press may be a transmitted Chinese/Korean technique rather than an independent European breakthrough.'
  - id: braudel-civilization-capitalism-v1#u23-c3
    heading: 'Printing recovers Archimedes for the mathematical revolution'
    span: 882306:883165
    why: 'Names the specific, unplanned intellectual payoff Braudel credits to printing: making ancient mathematics available just before the seventeenth-century revolution that depended on it.'
  - id: braudel-civilization-capitalism-v1#u23-c4
    heading: 'The central puzzle: why Europe alone'
    span: 883481:883981
    why: 'States the comparative-history question — every maritime civilization could theoretically have taken to the open ocean, yet only Europe did — that the rest of the ocean-navigation section exists to answer.'
  - id: braudel-civilization-capitalism-v1#u23-c5
    heading: 'Zheng He''s voyages and their sudden halt'
    span: 891707:893037
    why: 'The strongest counter-example against a technical explanation: China''s expeditions had superior ships and reached Arabia, then simply stopped for political reasons.'
  - id: braudel-civilization-capitalism-v1#u23-c6
    heading: 'Capitalist towns as the driving force'
    span: 907175:908406
    why: 'Braudel''s explicit, non-technical answer to the unit''s central puzzle: material life and capitalist towns, not hardware, explain why only Europe crossed onto the open sea.'
- nn: 24
  unit_id: ch06-transport-and-history-of-technology
  note_id: braudel-civilization-capitalism-v1-ch06-transport-and-history-of-technology
  span: 908408:958529
  chunks:
  - id: braudel-civilization-capitalism-v1#u24-c1
    heading: 'Nothing changed between Richelieu and Sung China'
    span: 910440:911016
    why: 'States Braudel''s longue-durée claim explicitly: land/sea transport barely differed across a millennium and across Europe/China/Rome until the 1875 intercontinental cable.'
  - id: braudel-civilization-capitalism-v1#u24-c2
    heading: 'Fixed itineraries'
    span: 911036:911835
    why: 'Introduces the chapter''s key paradox: roads that look unmarked and improvised were in fact rigid, dependency-bound routes travelers could not depart from.'
  - id: braudel-civilization-capitalism-v1#u24-c3
    heading: 'On not over-explaining the Champagne fairs'' decline'
    span: 919112:920449
    why: 'Braudel''s explicit methodological warning against mistaking transport friction for historical causation, illustrated with the Champagne fairs'' decline.'
  - id: braudel-civilization-capitalism-v1#u24-c4
    heading: 'China''s water civilization'
    span: 924576:925189
    why: 'The unit''s most vivid world-comparison passage, showing China''s canal/river traffic as a rival civilization built on water rather than roads.'
  - id: braudel-civilization-capitalism-v1#u24-c5
    heading: 'There is no technology in itself'
    span: 948253:948751
    why: 'States the chapter''s central thesis on technology directly: invention is never autonomous, only ever gated by the societies that take it up.'
  - id: braudel-civilization-capitalism-v1#u24-c6
    heading: 'The ceiling of the possible and technology the queen'
    span: 956260:958527
    why: 'The chapter''s culminating argument: technology breaks through only when society hits the ''ceiling of the possible'', extended into Braudel''s own 1970s oil-crisis present.'
- nn: 25
  unit_id: ch07-imperfect-currencies
  note_id: braudel-civilization-capitalism-v1-ch07-imperfect-currencies
  span: 958529:989348
  chunks:
  - id: braudel-civilization-capitalism-v1#u25-c1
    heading: 'Money as universal indicator'
    span: 958547:959190
    why: 'States Braudel''s rationale for the whole chapter: money is read as a diagnostic instrument for all economic and social activity, not as a topic in itself.'
  - id: braudel-civilization-capitalism-v1#u25-c2
    heading: 'The condemned man: monetization as inescapable drama'
    span: 961326:962681
    why: 'Generalizes money''s disruption of traditional economies into a universal, repeatable historical drama, using Ottoman Turkey, Tokugawa Japan, and contemporary Africa as parallel cases.'
  - id: braudel-civilization-capitalism-v1#u25-c3
    heading: 'Money as a function of economic complexity; currencies as languages'
    span: 966275:968758
    why: 'Braudel rejects prior economists'' metaphors for money and gives his own working definition, then coins the ''imperfect currencies'' vocabulary that governs the rest of the unit.'
  - id: braudel-civilization-capitalism-v1#u25-c4
    heading: 'China, Islam, Europe, Japan: money as an index of world position'
    span: 968759:970966
    why: 'The unit''s clearest world-scale comparison, arguing each civilization''s monetary sophistication reflects its power or need relative to neighbors, with long-distance trade as the real driver.'
  - id: braudel-civilization-capitalism-v1#u25-c5
    heading: '''A piece of India'': cloth-money as slave-price'
    span: 973591:974852
    why: 'The starkest instance in Braudel''s primitive-currencies catalog: a commodity-money unit whose value comes to designate, then simply mean, an enslaved person.'
  - id: braudel-civilization-capitalism-v1#u25-c6
    heading: 'Barter as internal colonies inside ''civilized'' Europe'
    span: 980542:981531
    why: 'Extends the imperfect-currencies argument to Europe itself, showing rudimentary barter surviving as ''internal colonies'' inside supposedly monetized economies rather than being erased by them.'
- nn: 26
  unit_id: ch07-outside-europe-metallic-money
  note_id: braudel-civilization-capitalism-v1-ch07-outside-europe-metallic-money
  span: 989348:1011971
  chunks:
  - id: braudel-civilization-capitalism-v1#u26-c1
    heading: 'Japan''s threefold monetary world'
    span: 989590:990552
    why: 'Shows monetization as partial and socially layered: coin recruits some peasant dues and daimio wealth while rice money and a samurai taboo on discussing money persist alongside it.'
  - id: braudel-civilization-capitalism-v1#u26-c2
    heading: 'Levant bullion re-melted toward Persia and India'
    span: 992811:993807
    why: 'Traces the mechanism by which Western coin entering the Ottoman Levant was melted, re-minted as larins, and pulled onward toward Persia and India rather than staying in circulation.'
  - id: braudel-civilization-capitalism-v1#u26-c3
    heading: 'The Great Mogul as bullion''s centre'
    span: 996551:997273
    why: 'A contemporary traveller''s 1695 testimony gives Braudel''s clearest image of world-scale bullion flow converging on India as its terminus.'
  - id: braudel-civilization-capitalism-v1#u26-c4
    heading: 'China''s paper-money precocity, and its paradox'
    span: 1001286:1002013
    why: 'Identifies China''s ninth-to-fourteenth-century paper currency as a genuine institutional innovation and names Braudel''s paradox that a silver-exporting country ran on paper internally.'
  - id: braudel-civilization-capitalism-v1#u26-c5
    heading: 'Braudel''s verdict: China primitive but coherent'
    span: 1011617:1011970
    why: 'Closes the unit with Braudel''s explicit comparative judgment: China''s system was less sophisticated than India''s but more internally coherent, and unlike India was not a world sink for coinage.'
- nn: 27
  unit_id: ch07-rules-of-the-currency-game
  note_id: braudel-civilization-capitalism-v1-ch07-rules-of-the-currency-game
  span: 1011971:1045914
  chunks:
  - id: braudel-civilization-capitalism-v1#u27-c1
    heading: 'Europe''s three-tier currency system'
    span: 1012003:1012584
    why: 'States the chapter''s organizing structure — barter, metal, credit — that everything else in the unit elaborates.'
  - id: braudel-civilization-capitalism-v1#u27-c2
    heading: 'Against the bullion-drain narrative'
    span: 1012759:1013437
    why: 'Braudel''s clearest polemical statement that bullion flowing east was the cost of Europe''s advantage, not a wound.'
  - id: braudel-civilization-capitalism-v1#u27-c3
    heading: 'Gresham''s Law explained'
    span: 1022616:1023314
    why: 'The precise statement of the mechanism driving the centuries-long gold/silver oscillation the unit traces.'
  - id: braudel-civilization-capitalism-v1#u27-c4
    heading: 'Money of account defined'
    span: 1031181:1032762
    why: 'The conceptual keystone: imaginary reckoning units versus real coin, the legibility layer the rest of the section depends on.'
  - id: braudel-civilization-capitalism-v1#u27-c5
    heading: 'Barter and subsistence beside the market'
    span: 1042784:1043806
    why: 'States directly that a barter/subsistence economy ran alongside the money economy at equal weight, not as its residue.'
  - id: braudel-civilization-capitalism-v1#u27-c6
    heading: 'Velocity of circulation: the Naples arithmetic'
    span: 1039627:1040958
    why: 'The unit''s sharpest quantitative move: concrete stock-vs-flow arithmetic formalized via Fisher''s MV=PQ.'
- nn: 28
  unit_id: ch07-paper-money-and-credit
  note_id: braudel-civilization-capitalism-v1-ch07-paper-money-and-credit
  span: 1045914:1067804
  chunks:
  - id: braudel-civilization-capitalism-v1#u28-c1
    heading: 'Defining credit against money'
    span: 1046472:1047051
    why: 'Braudel''s spare definition of credit, illustrated by pre-monetary everyday examples, establishes credit as older and more ''natural'' than the paper instruments discussed later in the unit.'
  - id: braudel-civilization-capitalism-v1#u28-c2
    heading: 'Credit instruments across Babylon, Rome, Islam, and China'
    span: 1050209:1051004
    why: 'Explicit world-scale comparison showing credit instruments as an ancient, multiply-invented inheritance rather than a Western innovation, paralleling Braudel''s corrective move elsewhere in the book.'
  - id: braudel-civilization-capitalism-v1#u28-c3
    heading: 'The banker as repairman of a broken engine'
    span: 1059468:1060621
    why: 'Braudel''s own machine metaphor for monetary infrastructure — metal money''s chronic failure literally creates the profession of banker to fix a ''mechanical breakdown.'''
  - id: braudel-civilization-capitalism-v1#u28-c4
    heading: 'Schumpeter: money is only ever a credit instrument'
    span: 1063262:1064191
    why: 'States the unresolved ''everything is credit'' position that Braudel sets against the mercantilist ''everything is money'' view, without adjudicating between them.'
  - id: braudel-civilization-capitalism-v1#u28-c5
    heading: 'Money and credit as a universal language'
    span: 1064221:1065052
    why: 'Braudel''s broadest theoretical claim in the unit — that money and credit are a self-elaborating, near-universal technique every society must learn — the strongest resonance with this project''s infrastructure vocabulary.'
  - id: braudel-civilization-capitalism-v1#u28-c6
    heading: 'The unity of injustice'
    span: 1067049:1067802
    why: 'Closes the unit by reframing money''s world-scale reach as a hierarchy-producing force rather than a neutral connective tissue, backed by two centuries-apart epigrams.'
- nn: 29
  unit_id: ch08-towns-problems-of-definition
  note_id: braudel-civilization-capitalism-v1-ch08-towns-problems-of-definition
  span: 1067804:1098624
  chunks:
  - id: braudel-civilization-capitalism-v1#u29-c1
    heading: 'Towns as electric transformers'
    span: 1067833:1068369
    why: 'Braudel''s opening metaphor and Marx epigraph establish the town/country division of labour as the engine driving the whole chapter''s argument.'
  - id: braudel-civilization-capitalism-v1#u29-c2
    heading: '''A town is always a town'''
    span: 1070924:1071869
    why: 'States Braudel''s thesis, against Philip Abrams, that towns share a structural common language across all times and places — the premise for his whole comparative method.'
  - id: braudel-civilization-capitalism-v1#u29-c3
    heading: 'No firm lower limit: France''s 2,000 vs Britain''s 5,000'
    span: 1073986:1074642
    why: 'Shows concretely how the measured urbanization rate swings with the classification threshold chosen, the chapter''s central methodological problem.'
  - id: braudel-civilization-capitalism-v1#u29-c4
    heading: 'Birkbeck: how a frontier town is founded'
    span: 1082546:1083437
    why: 'A first-hand, step-by-step account of a town being founded ahead of its countryside, Braudel''s clearest empirical support against assuming rural settlement always comes first.'
  - id: braudel-civilization-capitalism-v1#u29-c5
    heading: 'Reciprocity of perspectives'
    span: 1083592:1083941
    why: 'Names outright the mutual, non-sequential town/country co-creation organizing the whole section, in Braudel''s own term for a pattern this project would call configurancy.'
  - id: braudel-civilization-capitalism-v1#u29-c6
    heading: 'Common labourers, sorted by home province'
    span: 1094408:1095109
    why: 'Concrete, near-taxonomic evidence for the claim that towns exist only through constant immigration, stratified here by regional trade specialization.'
- nn: 30
  unit_id: ch08-self-consciousness-and-hierarchies
  note_id: braudel-civilization-capitalism-v1-ch08-self-consciousness-and-hierarchies
  span: 1098624:1135972
  chunks:
  - id: braudel-civilization-capitalism-v1#u30-c1
    heading: 'China''s walls turned inward: from defense to surveillance'
    span: 1102911:1103453
    why: 'States the unit''s sharpest thesis: Chinese town walls, built against external threat, became a system for supervising the townspeople themselves once the pax sinica removed the outside danger.'
  - id: braudel-civilization-capitalism-v1#u30-c2
    heading: 'Made-to-measure corsets: walls that moved with the town'
    span: 1105442:1105849
    why: 'Braudel''s counter-intuitive claim that Western walls, far from strangling urban growth, were repeatedly relocated outward like moved theatre sets.'
  - id: braudel-civilization-capitalism-v1#u30-c3
    heading: 'Grid versus maze: a civilizational fault line'
    span: 1109338:1110086
    why: 'The unit''s clearest world-comparative argument: chequerboard planning is the global default and only Islam and medieval Europe produced organically tangled street plans.'
  - id: braudel-civilization-capitalism-v1#u30-c4
    heading: 'No town without a market'
    span: 1119764:1120101
    why: 'Braudel''s structural definition of a town as necessarily market-rooted, which grounds the unit''s later argument about hinterlands and urban hierarchy.'
  - id: braudel-civilization-capitalism-v1#u30-c5
    heading: 'An archipelago of towns'
    span: 1127265:1127609
    why: 'Supplies the unit''s key vocabulary for urban hierarchy — towns as functionally specialized nodes in a dependent network, illustrated by Flanders'' fifteenth-century towns around Bruges and Antwerp.'
  - id: braudel-civilization-capitalism-v1#u30-c6
    heading: 'The Islamic town''s concentric moral order'
    span: 1134110:1134866
    why: 'Shows Braudel''s comparative method at its most detailed: an apparently chaotic Islamic street plan resolves into a rigorous order once read through categories of ritual purity.'
- nn: 31
  unit_id: ch08-originality-of-western-towns
  note_id: braudel-civilization-capitalism-v1-ch08-originality-of-western-towns
  span: 1135972:1172688
  chunks:
  - id: braudel-civilization-capitalism-v1#u31-c1
    heading: 'Towns outwitting the territorial state'
    span: 1136878:1137571
    why: 'States the chapter''s core thesis directly: Western towns as rival sovereigns that ran their own economic policy independent of, and prior to, the territorial state.'
  - id: braudel-civilization-capitalism-v1#u31-c2
    heading: 'Steam-engines and clocks: framing the comparative question'
    span: 1138110:1138502
    why: 'Supplies the chapter''s organizing comparative image and makes explicit that the unit is a civilizational comparison, not just a European institutional history.'
  - id: braudel-civilization-capitalism-v1#u31-c3
    heading: 'Money meant towns'
    span: 1139679:1140037
    why: 'Identifies remonetization, not legal charter, as the material cause of the eleventh-century urban renaissance that made free towns possible.'
  - id: braudel-civilization-capitalism-v1#u31-c4
    heading: 'Capitalism as the town''s cuckoo''s egg'
    span: 1147528:1148428
    why: 'Argues capitalism gestated inside town institutions before the absorbing territorial state inherited them, with Lisbon/Amsterdam/London as the payoff examples.'
  - id: braudel-civilization-capitalism-v1#u31-c5
    heading: 'Open, closed, subjugated: the ABC typology'
    span: 1150121:1150680
    why: 'Gives Braudel''s own analytic framework for the chapter, explicitly non-teleological, which he then applies to the rest of the world.'
  - id: braudel-civilization-capitalism-v1#u31-c6
    heading: 'Only the West swung completely over in favour of its towns'
    span: 1172283:1172687
    why: 'Closes the chapter''s global survey with its summary verdict and an open counterfactual, marking the causes as still unresolved.'
- nn: 32
  unit_id: ch08-big-cities-states-and-capitals
  note_id: braudel-civilization-capitalism-v1-ch08-big-cities-states-and-capitals
  span: 1172688:1207453
  chunks:
  - id: braudel-civilization-capitalism-v1#u32-c1
    heading: 'The East held the big cities first'
    span: 1172703:1173293
    why: 'States the chapter''s opening world-scale comparison between Eastern and Western urban growth that frames everything that follows.'
  - id: braudel-civilization-capitalism-v1#u32-c2
    heading: 'India''s wandering capitals'
    span: 1175994:1176551
    why: 'Shows capitals as fragile personal attachments to the ruler rather than accumulating institutions, the clearest contrast case to Europe''s pattern.'
  - id: braudel-civilization-capitalism-v1#u32-c3
    heading: 'The political arithmetic of capital cities'
    span: 1179817:1181335
    why: 'States the chapter''s central thesis: capitals grow from state centralization and in turn manufacture the national market the modern state depends on.'
  - id: braudel-civilization-capitalism-v1#u32-c4
    heading: 'London lives off the Crown, not trade'
    span: 1182859:1183891
    why: 'Sombart''s estimate demonstrates the chapter''s "unbalanced worlds" claim with a concrete number: London''s economy could not have been trade-driven at its actual size.'
  - id: braudel-civilization-capitalism-v1#u32-c5
    heading: 'Naples: the ragged poor'
    span: 1187560:1188857
    why: 'Load-bearing case-study passage on Naples'' underclass, including the era''s own stark diagnosis of a population outside the state''s reach.'
  - id: braudel-civilization-capitalism-v1#u32-c6
    heading: 'St Petersburg''s polyglot population'
    span: 1204117:1204696
    why: 'Contemporary eyewitness testimony capturing the human consequence of St Petersburg''s artificially assembled, immigrant-heavy population.'
- nn: 33
  unit_id: ch08-big-cities-peking-and-london
  note_id: braudel-civilization-capitalism-v1-ch08-big-cities-peking-and-london
  span: 1207453:1248297
  chunks:
  - id: braudel-civilization-capitalism-v1#u33-c1
    heading: 'Every capital is a parasite'
    span: 1207481:1208201
    why: 'States the book''s core parasitical-capital thesis in the unit''s own words, with concrete proof cases (Sixtus V, Mercier) before it is generalized to Peking and London.'
  - id: braudel-civilization-capitalism-v1#u33-c2
    heading: 'Peking against the Siberian winter'
    span: 1208937:1209453
    why: 'Shows Peking as the extreme case of the chapter''s survival-under-constraint theme — an enormous population kept alive through Siberian winters by coal and furs.'
  - id: braudel-civilization-capitalism-v1#u33-c3
    heading: 'Building bans breed clandestine London'
    span: 1224260:1225268
    why: 'The clearest legibility-vs-proliferation moment in the unit: repeated royal building bans produce exactly the clandestine sprawl they were meant to prevent.'
  - id: braudel-civilization-capitalism-v1#u33-c4
    heading: 'The palace is legible, the fish market is not'
    span: 1223203:1223510
    why: 'Braudel''s own aside on evidentiary bias — the sources document the palace richly and the everyday market almost not at all.'
  - id: braudel-civilization-capitalism-v1#u33-c5
    heading: 'Cities as a yardstick of material life'
    span: 1243429:1243999
    why: 'The unit''s methodological thesis statement: cities are a yardstick of the society that produced them, not autonomous agents to praise or blame.'
  - id: braudel-civilization-capitalism-v1#u33-c6
    heading: 'Capitals as spectators to the Industrial Revolution'
    span: 1246965:1247190
    why: 'Marks the pivot beyond the ancien régime: the old capitals are reduced to spectators of the Industrial Revolution, which starts instead in the provincial mill towns.'
- nn: 34
  unit_id: conclusion
  note_id: braudel-civilization-capitalism-v1-conclusion
  span: 1248297:1261355
  chunks:
  - id: braudel-civilization-capitalism-v1#u34-c1
    heading: 'The book''s stated aim: to locate, not exhaust'
    span: 1250012:1250693
    why: 'States the volume''s real ambition — world-scale location rather than exhaustive coverage — which frames every other claim in the Conclusion.'
  - id: braudel-civilization-capitalism-v1#u34-c2
    heading: 'The Lorraine village: material past as residue'
    span: 1249075:1250011
    why: 'The book''s only autobiographical passage, arguing that the material past survives as recoverable residue rather than clean rupture.'
  - id: braudel-civilization-capitalism-v1#u34-c3
    heading: 'The ''dust of history'' versus events'
    span: 1251428:1252259
    why: 'Defines Braudel''s anti-event historiography: anecdotes matter only as instances of an indefinitely repeated, aggregating pattern.'
  - id: braudel-civilization-capitalism-v1#u34-c4
    heading: 'History in the ''long term'': chains, series, constants'
    span: 1252260:1253007
    why: 'The unit''s most explicit statement of the longue durée as method, including the Lefebvre ''law is a constant'' quotation.'
  - id: braudel-civilization-capitalism-v1#u34-c5
    heading: 'Why ''Civilization and Capitalism'': non-convergent orders'
    span: 1253175:1253592
    why: 'Explains the book''s title and, via the Chinese anvil/bellows anecdote, argues civilizations are self-contained, non-transferable solutions.'
  - id: braudel-civilization-capitalism-v1#u34-c6
    heading: 'The three-storey house and capitalism''s mobility'
    span: 1258980:1260138
    why: 'Restates material life, ordinary economic life, and real capitalism as a stack and locates capitalism''s power in its comparative freedom of movement against inflexible lower floors.'
