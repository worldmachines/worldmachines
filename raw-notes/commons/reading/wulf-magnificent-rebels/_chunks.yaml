  chunks:
  - id: wulf-magnificent-rebels#u01-c1
    heading: 'The thin line between free will and selfishness'
    span: 4761:5056
    why: 'Wulf''s own statement of the book''s organising tension between individual freedom and community.'
  - id: wulf-magnificent-rebels#u01-c2
    heading: 'When did we begin to be this selfish?'
    span: 6850:7601
    why: 'Turns the autobiographical framing into the historical questions the book sets out to answer.'
  - id: wulf-magnificent-rebels#u01-c3
    heading: 'Jena and the self at centre stage'
    span: 7603:8742
    why: 'States Wulf''s core claim that Jena''s group, spurred by the Revolution, placed the free self at the centre, with Fichte''s line as the emblem.'
  - id: wulf-magnificent-rebels#u01-c4
    heading: 'Jena as nexus of the modern mind; Caroline introduced'
    span: 8744:9604
    why: 'Wulf''s claim about the lasting influence of the Jena decade and her introduction of Caroline as protagonist.'
  - id: wulf-magnificent-rebels#u01-c5
    heading: 'Caroline''s arrest on the road from Mainz'
    span: 9606:11233
    why: 'The opening scene of the narrative, tying Caroline to revolutionary Mainz and showing her defiance under arrest.'
  - id: wulf-magnificent-rebels#u01-c6
    heading: 'The Jena Set roll call'
    span: 21369:23068
    why: 'Names the cast, Wulf''s characterisation of each, Goethe''s central role, and the origin of the term ''Jena Set''.'
- nn: 2
  unit_id: prologue-2
  note_id: wulf-magnificent-rebels-prologue-2
  span: 23070:46380
  chunks:
  - id: wulf-magnificent-rebels#u02-c1
    heading: 'Fichte, free will and the Ich lit by the Revolution'
    span: 26258:26923
    why: 'Wulf''s core link between the Revolution, free will and the Ich, with Fichte''s and Schelling''s words.'
  - id: wulf-magnificent-rebels#u02-c2
    heading: 'Reason alone stripped reality; the friends look inwards'
    span: 28756:29518
    why: 'States the Romantic reaction against a mechanised Enlightenment, with Novalis''s millwheel image and the Locke contrast.'
  - id: wulf-magnificent-rebels#u02-c3
    heading: 'Fragmentation, censorship and universities'
    span: 35012:35541
    why: 'Wulf''s structural answer to why Germany: political patchwork weakened censorship and multiplied universities.'
  - id: wulf-magnificent-rebels#u02-c4
    heading: 'Why Jena: a university under no one''s control'
    span: 36749:37356
    why: 'Gives the specific institutional answer to why Jena, with Schiller''s view.'
  - id: wulf-magnificent-rebels#u02-c5
    heading: 'The Jena Set as the most important intellectual group'
    span: 40165:40908
    why: 'Wulf''s own claim of the group''s importance and its placing of the self at the centre, with Novalis''s mission statement.'
  - id: wulf-magnificent-rebels#u02-c6
    heading: 'The book''s tension: free will versus selfishness'
    span: 45556:46378
    why: 'Wulf''s statement of the book''s thesis and its claim that we have internalised the Ich.'
- nn: 3
  unit_id: ch01-happy-event-1
  note_id: wulf-magnificent-rebels-ch01-happy-event-1
  span: 46380:67775
  chunks:
  - id: wulf-magnificent-rebels#u03-c1
    heading: 'Werther: the book of a generation'
    span: 49129:49868
    why: 'Shows the inward, emotional self as a mass cultural phenomenon, with the ''I withdraw into myself and find a world there'' line.'
  - id: wulf-magnificent-rebels#u03-c2
    heading: 'Werther, Sturm und Drang and Goethe''s stardom'
    span: 49870:50499
    why: 'Wulf''s framing of Sturm und Drang as elevating feeling above Enlightenment rationalism.'
  - id: wulf-magnificent-rebels#u03-c3
    heading: 'Fichte and the Ich as the talk of Jena'
    span: 58562:59079
    why: 'First appearance of the book''s central idea, the self and free will, and its Goethe connection.'
  - id: wulf-magnificent-rebels#u03-c4
    heading: 'The Robbers and revolutionary mood'
    span: 61902:62234
    why: 'Schiller''s breakthrough play as a political text of freedom against tyranny.'
  - id: wulf-magnificent-rebels#u03-c5
    heading: 'Two celebrities who avoided each other'
    span: 63183:63930
    why: 'Sets up the coming partnership by showing Goethe''s coldness and egoism as seen by contemporaries.'
  - id: wulf-magnificent-rebels#u03-c6
    heading: 'Schiller''s fear that reason has killed his poetry'
    span: 67120:67773
    why: 'Closes the unit on Schiller''s creative crisis between philosophy and poetry, the state in which he meets Goethe.'
- nn: 4
  unit_id: ch01-happy-event-2
  note_id: wulf-magnificent-rebels-ch01-happy-event-2
  span: 67775:90612
  chunks:
  - id: wulf-magnificent-rebels#u04-c1
    heading: 'Goethe''s primordial leaf meets Schiller''s objection'
    span: 68628:69309
    why: 'The founding scene of the friendship: Goethe''s unity-behind-variety botany and Schiller''s charge that it is an idea rather than an observation.'
  - id: wulf-magnificent-rebels#u04-c2
    heading: 'Realist versus idealist'
    span: 69311:70151
    why: 'Wulf''s explicit statement of the empiricist/Kantian idealist divide that structures the friendship.'
  - id: wulf-magnificent-rebels#u04-c3
    heading: 'Goethe the Neptunist: reform, not revolution'
    span: 71948:72649
    why: 'Wulf''s argument that Goethe''s politics mirrored his science, giving the political backdrop to the period.'
  - id: wulf-magnificent-rebels#u04-c4
    heading: 'Mainz under bombardment'
    span: 72651:73742
    why: 'Shows Goethe''s response to war, ideas as refuge, which explains why the partnership arrived when it did.'
  - id: wulf-magnificent-rebels#u04-c5
    heading: 'Christiane, class and gossip'
    span: 80696:81163
    why: 'Wulf''s reading of the Weimar scandal as one of social standing, with Schiller''s own complicated past for contrast.'
  - id: wulf-magnificent-rebels#u04-c6
    heading: 'Particular and general: how each shaped the other'
    span: 88662:89969
    why: 'The clearest account of the complementary methods that made the collaboration productive.'
- nn: 5
  unit_id: ch02-priest-of-truth-1
  note_id: wulf-magnificent-rebels-ch02-priest-of-truth-1
  span: 90612:110062
  chunks:
  - id: wulf-magnificent-rebels#u05-c1
    heading: 'Kant makes the self a lawgiver of nature'
    span: 96347:97161
    why: 'Wulf''s core explanation of how Kant turned the self from a cog in a mechanistic universe into a creative, free agent, which is the platform for Fichte.'
  - id: wulf-magnificent-rebels#u05-c2
    heading: 'Ich and non-Ich replace the thing-in-itself'
    span: 105420:106556
    why: 'States Fichte''s Ich-philosophy in Wulf''s words, with its central claim that the self posits itself and thereby our knowledge of the world.'
  - id: wulf-magnificent-rebels#u05-c3
    heading: 'The Ich posits itself and is therefore free'
    span: 106558:107012
    why: 'Links self-positing to freedom and gives Fichte''s image of freedom as a spark that becomes a fire.'
  - id: wulf-magnificent-rebels#u05-c4
    heading: 'Anonymous book taken for Kant''s fourth Critique'
    span: 100934:103081
    why: 'Narrates the misattribution and Kant''s public correction that made Fichte instantly famous, showing the literary public sphere at work.'
  - id: wulf-magnificent-rebels#u05-c5
    heading: 'Freedom promised under petty German despotism'
    span: 107014:108263
    why: 'Wulf''s argument for why the Ich-philosophy felt revolutionary, set against the controlled world of the German states.'
  - id: wulf-magnificent-rebels#u05-c6
    heading: 'The Revolution as proof of philosophy''s power'
    span: 109607:110060
    why: 'Ties the Ich-philosophy explicitly to the French Revolution as an idea-driven event, ending on Fichte''s own summary of his system.'
- nn: 6
  unit_id: ch02-priest-of-truth-2
  note_id: wulf-magnificent-rebels-ch02-priest-of-truth-2
  span: 110062:127016
  chunks:
  - id: wulf-magnificent-rebels#u06-c1
    heading: 'Lecture drill: thinking the wall and the self'
    span: 110062:110657
    why: 'Concrete scene that introduces the Ich/non-Ich distinction as Fichte taught it.'
  - id: wulf-magnificent-rebels#u06-c2
    heading: 'Only the self: freedom and choice'
    span: 110982:111773
    why: 'Wulf''s own statement of the self-centred, free-will core of Fichte''s philosophy set against empiricism and Kant.'
  - id: wulf-magnificent-rebels#u06-c3
    heading: 'Kant''s burden of compliance versus Fichte''s free will'
    span: 111775:112618
    why: 'Distils the Kant-to-Fichte shift from duty to chosen freedom, a key step in the book''s invention-of-the-self argument.'
  - id: wulf-magnificent-rebels#u06-c4
    heading: 'Amusement and accusation: egotism and despotism'
    span: 116656:117202
    why: 'Records the contemporary charges of egotism and despotism that foreshadow the book''s dark-side theme.'
  - id: wulf-magnificent-rebels#u06-c5
    heading: 'Fichte and the French Revolution'
    span: 118154:118843
    why: 'Fichte''s own claims tie his self-philosophy to revolutionary politics and contrast him with Kant''s gradualism.'
  - id: wulf-magnificent-rebels#u06-c6
    heading: 'A philosophy made live before its listeners'
    span: 125701:126566
    why: 'Shows the philosophy as collectively generated, live and revised in front of an audience, the scene in which the Jena ideas took shape.'
- nn: 7
  unit_id: ch03-finest-minds-1
  note_id: wulf-magnificent-rebels-ch03-finest-minds-1
  span: 127016:139267
  chunks:
  - id: wulf-magnificent-rebels#u07-c1
    heading: 'Schiller decides the Revolution came too soon'
    span: 130534:131049
    why: 'Reports Schiller''s belief that freedom requires moral maturity and that the Revolution was premature, the motive behind his aesthetic turn.'
  - id: wulf-magnificent-rebels#u07-c2
    heading: 'Horen as a Kulturnation journal'
    span: 131051:131818
    why: 'States Horen''s apolitical purpose and Schiller''s idea of a cultural nation independent of state lines.'
  - id: wulf-magnificent-rebels#u07-c3
    heading: 'Herder''s linguistic nation'
    span: 132169:132646
    why: 'Gives Herder''s definition of a people by language and culture rather than by wars, empires or monarchs, the intellectual root of the Kulturnation.'
  - id: wulf-magnificent-rebels#u07-c4
    heading: 'Horen makes the Jena Set a group'
    span: 133071:133336
    why: 'Wulf''s claim that the journal is where the individual figures first became a collective.'
  - id: wulf-magnificent-rebels#u07-c5
    heading: 'Utility as idol, beauty as bulwark'
    span: 136266:136882
    why: 'Summarizes Schiller''s critique of a utility-driven, reason-only modernity and his claim that beauty grounds morality.'
  - id: wulf-magnificent-rebels#u07-c6
    heading: 'Art mediates between heart and head'
    span: 136884:137665
    why: 'Explains how Schiller, building on Kant''s Critique of Judgement, makes beauty the reconciler of sensual and rational sides, the route from which Romantic thought grows.'
- nn: 8
  unit_id: ch03-finest-minds-2
  note_id: wulf-magnificent-rebels-ch03-finest-minds-2
  span: 139267:158981
  chunks:
  - id: wulf-magnificent-rebels#u08-c1
    heading: 'Why Jena had a magnetic pull'
    span: 139267:139892
    why: 'Wulf''s structural explanation of Jena''s freedom: four ruling duchies, weak enforcement, lenient censorship, broad curriculum.'
  - id: wulf-magnificent-rebels#u08-c2
    heading: 'Jena against France, Oxford and Cambridge'
    span: 139894:141174
    why: 'Comparative frame showing what made Jena exceptional as a place for open philosophical discovery.'
  - id: wulf-magnificent-rebels#u08-c3
    heading: 'Humboldt as Schiller''s sparring partner'
    span: 145065:146092
    why: 'Shows collaborative thinking in conversation and the shared fascination with self-determination drawn from Kant.'
  - id: wulf-magnificent-rebels#u08-c4
    heading: 'Fichticising students and the near-incomprehensible Ich'
    span: 148046:149328
    why: 'Captures Fichte''s charisma, the difficulty of his written Ich/non-Ich argument, and the generational split in how it was received.'
  - id: wulf-magnificent-rebels#u08-c5
    heading: 'The night of the stones'
    span: 152675:154550
    why: 'Vivid scene of fraternity harassment and Fichte''s breaking point, ending with Goethe''s joke on the non-Ich.'
  - id: wulf-magnificent-rebels#u08-c6
    heading: 'Schiller''s misgivings about the Ich'
    span: 154925:155510
    why: 'Records Schiller''s objection that Fichte''s Ich swallows the external world, the intellectual root of their rupture.'
- nn: 9
  unit_id: ch04-intellectual-friction-1
  note_id: wulf-magnificent-rebels-ch04-intellectual-friction-1
  span: 158981:182849
  chunks:
  - id: wulf-magnificent-rebels#u09-c1
    heading: 'Caroline refuses security for freedom'
    span: 166940:167665
    why: 'States Caroline''s principle of freedom and responsibility for consequences, as she and her sister expressed it, which frames her later choices.'
  - id: wulf-magnificent-rebels#u09-c2
    heading: 'An outcast in her own country'
    span: 169762:170471
    why: 'Shows how German authorities and reputation barred a Revolution sympathiser and unmarried mother, and voices Caroline''s protest against the sexual double standard.'
  - id: wulf-magnificent-rebels#u09-c3
    heading: 'Marriage as the only rescue'
    span: 171488:172201
    why: 'Sets out why the freedom-loving Caroline agrees to marry, in tension with her stated dislike of the institution.'
  - id: wulf-magnificent-rebels#u09-c4
    heading: 'Grief and resilience'
    span: 174324:174947
    why: 'Gives the most intimate view of Caroline''s inner life and her determination not to be destroyed.'
  - id: wulf-magnificent-rebels#u09-c5
    heading: 'Schiller, Horen and its most reliable contributor'
    span: 177626:179086
    why: 'Depicts the strains on Schiller''s journal and the network of friends, and establishes why August Wilhelm Schlegel matters to Jena.'
  - id: wulf-magnificent-rebels#u09-c6
    heading: 'Getting Schlegel to Jena through Caroline'
    span: 182024:182847
    why: 'Links Schiller''s literary needs to Caroline as the personal key to bringing Schlegel into the Jena scene.'
- nn: 10
  unit_id: ch04-intellectual-friction-2
  note_id: wulf-magnificent-rebels-ch04-intellectual-friction-2
  span: 182849:203250
  chunks:
  - id: wulf-magnificent-rebels#u10-c1
    heading: 'The first German verse Shakespeare'
    span: 183619:185035
    why: 'Establishes the Schlegel-Caroline translation project, its aesthetic rationale and its long afterlife in German national culture.'
  - id: wulf-magnificent-rebels#u10-c2
    heading: 'Caroline as indispensable collaborator'
    span: 185037:186036
    why: 'Wulf''s clearest statement that Caroline''s critical mind shaped hundreds of reviews published under August Wilhelm''s name.'
  - id: wulf-magnificent-rebels#u10-c3
    heading: 'Schiller turns back to poetry'
    span: 187730:188471
    why: 'Shows Schiller''s tension between philosophical and poetic writing and his self-measurement against Goethe.'
  - id: wulf-magnificent-rebels#u10-c4
    heading: 'Rousseau and the new fatherhood'
    span: 196264:197041
    why: 'Wulf''s explicit link between Rousseau''s child-centred education and how Goethe and Schiller raised their sons.'
  - id: wulf-magnificent-rebels#u10-c5
    heading: 'The Xenien and concealed authorship'
    span: 198300:198860
    why: 'Describes the Goethe-Schiller collaborative satire, with authorship deliberately fused, as grief-driven work and weapon.'
  - id: wulf-magnificent-rebels#u10-c6
    heading: 'Marriage and arrival in Jena'
    span: 202857:203248
    why: 'Closes the unit on the marriage as a working partnership and the assembling of the Jena circle.'
- nn: 11
  unit_id: ch05-novalis-in-love
  note_id: wulf-magnificent-rebels-ch05-novalis-in-love
  span: 203250:230678
  chunks:
  - id: wulf-magnificent-rebels#u11-c1
    heading: 'Novalis''s five-hundred-page dialogue with Fichte'
    span: 211833:213095
    why: 'Shows how Novalis worked through Fichte''s Wissenschaftslehre and turned the Ich-philosophy into self-inquiry.'
  - id: wulf-magnificent-rebels#u11-c2
    heading: 'Circularity of the Ich and ''Philosophy is originally a feeling'''
    span: 213097:213669
    why: 'Gives Novalis''s objection to Fichte and the chapter''s titular claim that philosophy starts in feeling.'
  - id: wulf-magnificent-rebels#u11-c3
    heading: 'Love as synthesising force: the non-Ich becomes a You'
    span: 214091:214622
    why: 'States how Novalis adds love to Fichte''s system to unify self and world.'
  - id: wulf-magnificent-rebels#u11-c4
    heading: 'Philosophie as the soul of life; infinite reflection with Schlegel'
    span: 224512:226605
    why: 'Shows Novalis and Schlegel replacing Fichte''s closed self-reflection with an endless back-and-forth in which self and world are integrated halves.'
  - id: wulf-magnificent-rebels#u11-c5
    heading: 'Caroline, the Revolution, and the power of words'
    span: 228056:228635
    why: 'Carries the chapter''s political thread: the circle''s understanding of the Revolution as something enacted in words.'
- nn: 12
  unit_id: ch06-splendid-circle-1
  note_id: wulf-magnificent-rebels-ch06-splendid-circle-1
  span: 230678:250290
  chunks:
  - id: wulf-magnificent-rebels#u12-c1
    heading: 'Caroline''s education, independence and admirers'
    span: 232863:233517
    why: 'Establishes Caroline Schlegel''s intellectual confidence and charisma as reported by Friedrich and other admirers, central to how the Jena set is portrayed.'
  - id: wulf-magnificent-rebels#u12-c2
    heading: 'Jena trembles: the Revolution''s admirers and the war'
    span: 238489:238978
    why: 'States the dilemma the French advance posed for German admirers of the Revolution, the political backdrop of the Jena years.'
  - id: wulf-magnificent-rebels#u12-c3
    heading: 'French soldiers in Württemberg: politics comes home'
    span: 239812:240742
    why: 'Concrete account of how war disrupted Schiller''s family and the journal Horen, with Schiller''s remark on political matters returning home.'
  - id: wulf-magnificent-rebels#u12-c4
    heading: 'Goethe visits Caroline, and the plea he brushed off'
    span: 235209:236547
    why: 'Shows Goethe''s relationship to Caroline and the gap between his warm reception and his earlier refusal to help her, in Wulf''s hedged telling.'
  - id: wulf-magnificent-rebels#u12-c5
    heading: 'Friedrich Schlegel: reader, rebel and self-analyst'
    span: 242260:243762
    why: 'The main portrait of Friedrich Schlegel on arrival, covering his voracious reading, wish to live free, temperament and self-image.'
  - id: wulf-magnificent-rebels#u12-c6
    heading: 'The Humboldts'' open marriage'
    span: 247249:248208
    why: 'Documents the Humboldts'' consensual open marriage from their letters, an example of the circle''s unconventional approach to marriage and freedom.'
- nn: 13
  unit_id: ch06-splendid-circle-2
  note_id: wulf-magnificent-rebels-ch06-splendid-circle-2
  span: 250290:273877
  chunks:
  - id: wulf-magnificent-rebels#u13-c1
    heading: 'Women''s legal subordination and Rousseau'
    span: 251010:253411
    why: 'Wulf''s own account of the legal and ideological constraints, including Rousseau''s inconsistency, against which the two Carolines are defined.'
  - id: wulf-magnificent-rebels#u13-c2
    heading: 'Jena''s relaxed rules and Sophie Mereau'
    span: 253413:254441
    why: 'Shows the gossip economy and sexual freedom of Jena, including a female writer''s unusual place and Friedrich''s involvement.'
  - id: wulf-magnificent-rebels#u13-c3
    heading: 'Friedrich the Dictator-Critic'
    span: 264411:265434
    why: 'Introduces Friedrich''s ambitions, his link between poetry and national unity, and the divided verdicts of his peers.'
  - id: wulf-magnificent-rebels#u13-c4
    heading: 'The review of Schiller''s Musen-Almanach'
    span: 265436:266224
    why: 'Marks the opening of the Schiller-Schlegel hostility that shapes the Jena Set''s factions.'
  - id: wulf-magnificent-rebels#u13-c5
    heading: 'Shakespeare income and women''s anonymous authorship'
    span: 271353:272209
    why: 'Documents the collaborative labour behind the translations and the anonymity imposed on women writers, contrasted with Schiller''s ideal woman.'
  - id: wulf-magnificent-rebels#u13-c6
    heading: 'Caroline''s salon'
    span: 260866:261888
    why: 'Shows Caroline as the social and intellectual hub of the household, with conversation as the real fare.'
- nn: 14
  unit_id: ch07-little-academy-1
  note_id: wulf-magnificent-rebels-ch07-little-academy-1
  span: 273877:290032
  chunks:
  - id: wulf-magnificent-rebels#u14-c1
    heading: 'The frog leg that leapt'
    span: 275241:275974
    why: 'The founding scene of the chapter: an accidental galvanic effect that Alexander describes as breathing life into matter.'
  - id: wulf-magnificent-rebels#u14-c2
    heading: 'Organic matter and the mechanical model'
    span: 275976:276898
    why: 'Wulf states the intellectual stakes: challenging Newtonian and Cartesian mechanism and the origin of Humboldt''s web-of-life view.'
  - id: wulf-magnificent-rebels#u14-c3
    heading: 'Alexander''s fretful energy'
    span: 280732:281543
    why: 'Gives contemporaries'' and Alexander''s own accounts of his restless drive.'
  - id: wulf-magnificent-rebels#u14-c4
    heading: 'The planned great voyage'
    span: 282049:283021
    why: 'States Alexander''s real purpose of investigating how all forces of nature are interlaced, and the war constraints on his plans.'
  - id: wulf-magnificent-rebels#u14-c5
    heading: 'Goethe finds a scientific sparring partner'
    span: 285788:286431
    why: 'Shows science as dialogue and Schiller''s limits as Goethe''s interlocutor, with Alexander filling the gap.'
  - id: wulf-magnificent-rebels#u14-c6
    heading: 'Urform and adaptation'
    span: 288736:290030
    why: 'Sets out Goethe''s internal-force and external-force account of organisms and Wulf''s comparison with Lamarck and Darwin.'
- nn: 15
  unit_id: ch07-little-academy-2
  note_id: wulf-magnificent-rebels-ch07-little-academy-2
  span: 290032:316701
  chunks:
  - id: wulf-magnificent-rebels#u15-c1
    heading: 'The little academy in spring 1797'
    span: 290032:290845
    why: 'Compact portrait of the Jena Set''s simultaneous, interdisciplinary work and Wulf''s remark that this approach became a major theme.'
  - id: wulf-magnificent-rebels#u15-c2
    heading: 'Evenings in Schiller''s parlour'
    span: 291704:292383
    why: 'Shows Fichte, Romantic philology, translation and animal electricity circulating in one social scene, in Goethe''s own words.'
  - id: wulf-magnificent-rebels#u15-c3
    heading: 'Goethe and Humboldt: influence both ways'
    span: 295649:296498
    why: 'Wulf''s clearest interpretive claim in the unit, linking Jena to Humboldt''s fusion of empirical science with subjectivity and feeling.'
  - id: wulf-magnificent-rebels#u15-c4
    heading: 'Schiller''s jealousy of Humboldt'
    span: 297346:298146
    why: 'Reveals the poetry-versus-science tension and the private jealousy (Schiller''s own words, reported) that seeded the group''s fractures.'
  - id: wulf-magnificent-rebels#u15-c5
    heading: 'Schiller dismisses August Wilhelm Schlegel'
    span: 303057:303851
    why: 'The pivotal rupture of the unit: a review by Friedrich costs his brother his standing with Schiller.'
  - id: wulf-magnificent-rebels#u15-c6
    heading: 'Goethe shuttles between the warring parties'
    span: 307011:307689
    why: 'Shows Goethe''s mediating role and Schiller''s early judgment that the younger generation had over-applied the Ich-philosophy.'
- nn: 16
  unit_id: ch08-handful-of-darkness
  note_id: wulf-magnificent-rebels-ch08-handful-of-darkness
  span: 316701:347160
  chunks:
  - id: wulf-magnificent-rebels#u16-c1
    heading: 'Nachsterben: dying by willpower'
    span: 320315:321366
    why: 'States the death wish, the invented word Nachsterben, its grounding in Fichte''s Ich, and the chapter''s title line.'
  - id: wulf-magnificent-rebels#u16-c2
    heading: 'The mind''s power over the body'
    span: 321368:322143
    why: 'Lays out Novalis''s argument that if the Ich creates the world it can command the body, the seed of his Magical Idealism.'
  - id: wulf-magnificent-rebels#u16-c3
    heading: 'Idealised Sophie and death as self-conquest'
    span: 325516:326270
    why: 'Shows how the Ich-centred view turns suicide into an act of will and Sophie into a sacred figure.'
  - id: wulf-magnificent-rebels#u16-c4
    heading: 'Poeticising the sciences against the age of classification'
    span: 340957:343413
    why: 'Wulf''s clearest contrast between Enlightenment measurement and classification (Linnaeus, the metre) and Novalis''s call for poetic synthesis.'
  - id: wulf-magnificent-rebels#u16-c5
    heading: 'Darkness inverted and the inward path'
    span: 343698:344802
    why: 'Explains how the mines and Sophie''s death become the Hymns to the Night, with inward exploration paralleling Humboldt''s outward one.'
  - id: wulf-magnificent-rebels#u16-c6
    heading: 'Disenchantment and mechanical administration'
    span: 346328:347158
    why: 'Wulf''s framing of Novalis''s project as a reaction against a mechanised, materialist modern world.'
- nn: 17
  unit_id: ch09-sublime-impertinence-1
  note_id: wulf-magnificent-rebels-ch09-sublime-impertinence-1
  span: 347160:365805
  chunks:
  - id: wulf-magnificent-rebels#u17-c1
    heading: 'Friedrich as provocative guest calling for aesthetic anarchy'
    span: 347788:348448
    why: 'Wulf''s portrait of Friedrich''s temperament and his revolutionary hope for an ''aesthetic anarchy'' modelled on the French Revolution.'
  - id: wulf-magnificent-rebels#u17-c2
    heading: 'Jewish salons as spaces without rank'
    span: 351752:352826
    why: 'Describes the salon as a social setting where people were valued for mind rather than rank or gender, the scene where Friedrich and Dorothea meet.'
  - id: wulf-magnificent-rebels#u17-c3
    heading: 'The programme for a journal of ''sublime impertinence'''
    span: 355460:355960
    why: 'States the Schlegel brothers'' goals for the journal and sets them against a sister''s report of their vanity.'
  - id: wulf-magnificent-rebels#u17-c4
    heading: 'The deliberate fragment as a genre'
    span: 358732:359815
    why: 'Wulf''s claim that the friends made the intentional fragment a literary genre, with examples of their range and humour.'
  - id: wulf-magnificent-rebels#u17-c5
    heading: 'Why fragments: speed, censorship and symphonising'
    span: 359817:361216
    why: 'Sets out the practical and collective rationale for fragments, including evading censors and the ''giant symphonising'' behind the Athenaeum.'
  - id: wulf-magnificent-rebels#u17-c6
    heading: 'Caroline as editor and river'
    span: 364605:365803
    why: 'Wulf''s own assessment of Caroline''s editorial role and centrality to the group''s work.'
- nn: 18
  unit_id: ch09-sublime-impertinence-2
  note_id: wulf-magnificent-rebels-ch09-sublime-impertinence-2
  span: 365805:386066
  chunks:
  - id: wulf-magnificent-rebels#u18-c1
    heading: 'A revolution of words'
    span: 367397:368172
    why: 'Frames the Athenaeum as a political-linguistic weapon in the wake of the French Revolution.'
  - id: wulf-magnificent-rebels#u18-c2
    heading: 'What ''romantic'' meant in Jena'
    span: 370216:371329
    why: 'Wulf''s gloss of ''romantic'' as perceiving the world as an interconnected whole, plus Novalis''s own definition.'
  - id: wulf-magnificent-rebels#u18-c3
    heading: 'Unfinished, living, open-ended'
    span: 371331:371960
    why: 'Establishes incompleteness and organism-like becoming as the defining aesthetic and the rationale for the fragment form.'
  - id: wulf-magnificent-rebels#u18-c4
    heading: 'Imagination from Kant and Fichte to the Jena friends'
    span: 375696:376643
    why: 'Places the Romantic elevation of imagination in the philosophical genealogy from Kant and Fichte and notes where the Jena friends went further.'
  - id: wulf-magnificent-rebels#u18-c5
    heading: 'Symphilosophy as collective method'
    span: 379153:379709
    why: 'Names the group''s collaborative mode of thought, symphilosophy, and its ''sym'' coinage.'
  - id: wulf-magnificent-rebels#u18-c6
    heading: 'Goethe delighted, Schiller appalled'
    span: 380527:381653
    why: 'Shows through letters how the journal split the Weimar and Jena camps and set the brothers against the literary establishment.'
- nn: 19
  unit_id: ch10-symphilosophy
  note_id: wulf-magnificent-rebels-ch10-symphilosophy
  span: 386066:417030
  chunks:
  - id: wulf-magnificent-rebels#u19-c1
    heading: 'Novalis and the elixir to transcend the body'
    span: 388886:390040
    why: 'Shows Novalis pushing Fichtean mind-over-body to a literal experiment and Wulf''s interpretation of it as liberation of the mind.'
  - id: wulf-magnificent-rebels#u19-c2
    heading: 'Storming the Gemäldegalerie'
    span: 393090:393910
    why: 'Concrete picture of symphilosophy as loud, communal, embodied conversation about art.'
  - id: wulf-magnificent-rebels#u19-c3
    heading: 'Caroline and the Penitent Magdalene'
    span: 394990:395912
    why: 'Caroline leads the group and voices a defence of a woman judged for youthful sin, with Wulf''s hedged link to Caroline''s own life.'
  - id: wulf-magnificent-rebels#u19-c4
    heading: 'Napoleon as romantic genius'
    span: 400016:400861
    why: 'Gives the friends'' romantic view of Napoleon as self-propelled genius and force of nature amid the political backdrop.'
  - id: wulf-magnificent-rebels#u19-c5
    heading: 'The Tübingen manifesto and Schelling''s freedom'
    span: 406936:407817
    why: 'Distils the unifying, poeticising and Ich-centred programme that Schelling, Hölderlin and Hegel brought to what drove the Jena Set.'
  - id: wulf-magnificent-rebels#u19-c6
    heading: 'Goethe against Fichte on knowing nature'
    span: 410065:411840
    why: 'The central philosophical dispute of the unit, realism and observation of nature against the Ich positing the world, which Schelling was invited to help resolve.'
- nn: 20
  unit_id: ch11-naturphilosophie
  note_id: wulf-magnificent-rebels-ch11-naturphilosophie
  span: 417030:444466
  chunks:
  - id: wulf-magnificent-rebels#u20-c1
    heading: 'Schelling departs from Fichte: self and nature identical'
    span: 433962:434568
    why: 'States the core philosophical move of Naturphilosophie relative to Fichte''s Ich-philosophy and Cartesian dualism.'
  - id: wulf-magnificent-rebels#u20-c2
    heading: 'A living universe that is knowable from within'
    span: 435088:435958
    why: 'Gives the organism thesis and the claim that nature is intuitively knowable because mind and nature are one.'
  - id: wulf-magnificent-rebels#u20-c3
    heading: 'The Enlightenment''s distancing and Schelling''s reunion'
    span: 437161:438087
    why: 'Wulf''s own framing of Romanticism versus the scientific-rational Enlightenment, including Novalis on light.'
  - id: wulf-magnificent-rebels#u20-c4
    heading: 'From detached observers to being one with nature'
    span: 438170:439108
    why: 'Wulf''s evidence and argument that a new self-in-nature sensibility spread with Schelling''s ideas.'
  - id: wulf-magnificent-rebels#u20-c5
    heading: 'The lecture hall spell and the end of the clockwork universe'
    span: 439110:439872
    why: 'Shows the near-religious reception and Schelling''s own rejection of the dead mechanistic world.'
  - id: wulf-magnificent-rebels#u20-c6
    heading: 'Jena as a living encyclopaedia'
    span: 430759:431122
    why: 'Captures the circle''s collective, cross-disciplinary intellectual life as Wulf describes it.'
- nn: 21
  unit_id: ch12-atheism-dispute
  note_id: wulf-magnificent-rebels-ch12-atheism-dispute
  span: 444466:468126
  chunks:
  - id: wulf-magnificent-rebels#u21-c1
    heading: 'Fichte''s God is the moral order'
    span: 445231:445693
    why: 'It states the content of the article behind the atheism charge, tying God to the Ich and to moral choice.'
  - id: wulf-magnificent-rebels#u21-c2
    heading: 'Censorship across Europe and the German states'
    span: 447977:449240
    why: 'It sets the affair in the political geography of censorship and the fear of revolutionary ideas.'
  - id: wulf-magnificent-rebels#u21-c3
    heading: 'The Appeal to the Public'
    span: 450401:451302
    why: 'It shows Fichte turning a religious charge into a public fight over free speech and the philosophy of freedom.'
  - id: wulf-magnificent-rebels#u21-c4
    heading: 'Not about religion but revolution'
    span: 452223:452656
    why: 'It gives Wulf''s reading that the real worry of the duke was Fichte''s revolutionary leanings.'
  - id: wulf-magnificent-rebels#u21-c5
    heading: 'The resignation bluff that backfired'
    span: 454894:456451
    why: 'It narrates how Fichte''s threat, including the comparison with Herder, ended his Jena career.'
  - id: wulf-magnificent-rebels#u21-c6
    heading: 'The new generation wearing Kant''s crown'
    span: 467371:468124
    why: 'It is Wulf''s interpretive close on how Fichte and Schelling saw the self-made Ich as an agent of change.'
- nn: 22
  unit_id: ch13-divorce-women-sex
  note_id: wulf-magnificent-rebels-ch13-divorce-women-sex
  span: 468126:493082
  chunks:
  - id: wulf-magnificent-rebels#u22-c1
    heading: 'Divorce law and ostracism'
    span: 469006:469794
    why: 'Sets out the legal and social constraints Dorothea defied by seeking divorce in 1799.'
  - id: wulf-magnificent-rebels#u22-c2
    heading: 'Dorothea belonged to herself'
    span: 472628:473385
    why: 'Wulf''s interpretive link between the self-determining Ich of philosophy and Dorothea''s lived independence.'
  - id: wulf-magnificent-rebels#u22-c3
    heading: 'Lucinde and the equality of men and women'
    span: 479729:480661
    why: 'States Friedrich''s allegorical aim for Lucinde and his rejection of the prevailing image of women.'
  - id: wulf-magnificent-rebels#u22-c4
    heading: 'Fichte and the male-only Ich'
    span: 480663:481243
    why: 'Shows the gap between free-will philosophy and views of women, in Fichte''s own words.'
  - id: wulf-magnificent-rebels#u22-c5
    heading: 'Lucinde''s chaotic form and confession'
    span: 484011:484797
    why: 'Explains the fragmentary, genre-mixing structure that Friedrich defended as essential to the novel.'
  - id: wulf-magnificent-rebels#u22-c6
    heading: 'Friends read Lucinde'
    span: 484799:485621
    why: 'Records Friedrich''s theory of the confessional novel and Novalis''s and Caroline''s reaction within the circle.'
- nn: 23
  unit_id: ch14-schlegel-clique
  note_id: wulf-magnificent-rebels-ch14-schlegel-clique
  span: 493082:524112
  chunks:
  - id: wulf-magnificent-rebels#u23-c1
    heading: 'Caroline as conductor of the magic circle'
    span: 494856:496080
    why: 'Shows the Jena group as a hospitable, conversational scene organised around Caroline, with participants'' own testimonies of its pull.'
  - id: wulf-magnificent-rebels#u23-c2
    heading: 'Personal experience refracted into universal writing'
    span: 499266:500054
    why: 'Wulf''s own statement of why the friends made the self and their private lives the material of their writing.'
  - id: wulf-magnificent-rebels#u23-c3
    heading: 'Keeping the peace: Goethe between the factions'
    span: 511843:512500
    why: 'Shows how the circle''s network held together through Goethe''s neutrality and mutual concealment.'
  - id: wulf-magnificent-rebels#u23-c4
    heading: 'Goethe and Schelling on experience and nature'
    span: 513867:514974
    why: 'Contrasts Goethe''s empiricism with Fichte''s idealism and shows Schelling''s revised position that all knowledge originates in experience.'
  - id: wulf-magnificent-rebels#u23-c5
    heading: 'Schelling: art as the union of self and nature'
    span: 521073:522426
    why: 'Wulf''s exposition of the System of Transcendental Idealism, the core philosophical claim of the chapter.'
  - id: wulf-magnificent-rebels#u23-c6
    heading: 'Philosophy as activity in a time of flux'
    span: 523349:524110
    why: 'Captures the group''s attitude that revising and overturning ideas is a virtue in a revolutionary age.'
- nn: 24
  unit_id: ch15-new-confederation
  note_id: wulf-magnificent-rebels-ch15-new-confederation
  span: 524112:551867
  chunks:
  - id: wulf-magnificent-rebels#u24-c1
    heading: 'Four days in Leutragasse: the alliance complete'
    span: 525930:527456
    why: 'Shows the circle at its collaborative peak, with symphilosophising and the rejection of ''flat uniformity of opinion'' in the friends'' own words.'
  - id: wulf-magnificent-rebels#u24-c2
    heading: 'Notorious and combative: the Kotzebue satire'
    span: 532482:533620
    why: 'Shows how outside attack fed the group''s combative self-confidence rather than making them careful.'
  - id: wulf-magnificent-rebels#u24-c3
    heading: 'Novalis''s Europe: the millwheel and the new confederation of minds'
    span: 542011:543176
    why: 'Wulf''s summary of Novalis''s critique of the Enlightenment as a grinding materialistic machine and his call for a spiritual confederation.'
  - id: wulf-magnificent-rebels#u24-c4
    heading: 'Why religion? A search for themselves as part of the universe'
    span: 544197:544790
    why: 'Wulf''s own interpretive claim about what the Romantic turn to religion meant.'
  - id: wulf-magnificent-rebels#u24-c5
    heading: 'Schleiermacher''s religion of the infinite'
    span: 546695:547562
    why: 'Gives the intellectual source (unity, Spinoza, the Ich) of the group''s new religion of imagination.'
  - id: wulf-magnificent-rebels#u24-c6
    heading: 'Goethe as referee: thinking privately versus publishing'
    span: 550932:551663
    why: 'Shows Goethe restraining the group after the Fichte affair and distinguishing private thought from public statement.'
- nn: 25
  unit_id: ch16-republic-of-despots-1
  note_id: wulf-magnificent-rebels-ch16-republic-of-despots-1
  span: 551867:571119
  chunks:
  - id: wulf-magnificent-rebels#u25-c1
    heading: 'A household withdraws'
    span: 552207:552940
    why: 'Wulf''s own summary of why the circle withdrew, listing the four eroding causes.'
  - id: wulf-magnificent-rebels#u25-c2
    heading: 'Caroline''s rage at Huber'
    span: 556295:556993
    why: 'Shows the betrayal by an old friend, and the combative self-image of Caroline in the fight over the Athenaeum.'
  - id: wulf-magnificent-rebels#u25-c3
    heading: '''People hate us – good!'''
    span: 557610:558194
    why: 'Captures the group''s defiant, hostility-as-proof stance toward its public critics.'
  - id: wulf-magnificent-rebels#u25-c4
    heading: 'Schiller: the Schlegels sully the Ich'
    span: 560276:560759
    why: 'Schiller''s critique of the Schlegels'' self-absorption, the clearest link to the book''s egotism theme.'
  - id: wulf-magnificent-rebels#u25-c5
    heading: 'The end of the Jena Colony'
    span: 562793:563086
    why: 'States the pivot from symphilosophising to infighting.'
  - id: wulf-magnificent-rebels#u25-c6
    heading: 'Tieck''s gossip about Dorothea and Caroline'
    span: 564949:566026
    why: 'Reported gossip showing gendered hostility and the circle''s breakdown as seen by an insider turned critic.'
  - id: wulf-magnificent-rebels#u25-c7
    heading: 'Humboldt in the rainforest'
    span: 569634:570652
    why: 'Juxtaposes the fragmenting circle with Humboldt''s vision of nature as a connected living organism.'
- nn: 26
  unit_id: ch16-republic-of-despots-2
  note_id: wulf-magnificent-rebels-ch16-republic-of-despots-2
  span: 571119:587553
  chunks:
  - id: wulf-magnificent-rebels#u26-c1
    heading: 'Dorothea''s campaign against Caroline'
    span: 575618:576999
    why: 'Shows the circle''s internal hostility through Dorothea''s reported letters, including her admission of Caroline''s earlier kindness.'
  - id: wulf-magnificent-rebels#u26-c2
    heading: 'Gossip reaches Auguste'
    span: 578382:579419
    why: 'Records how the rumour mill extends to a fifteen-year-old and even to Friedrich, marking the moral cost of the group''s feuds.'
  - id: wulf-magnificent-rebels#u26-c3
    heading: 'Exodus from Jena and Goethe''s use of the Schlegels'
    span: 581042:582442
    why: 'Documents the dispersal of the circle, the phrase ''republic of despots'', and Wulf''s own reading of Goethe''s motives.'
  - id: wulf-magnificent-rebels#u26-c4
    heading: 'Brunonian medicine and the failing treatment'
    span: 585072:585984
    why: 'Explains the medical framework (organism kept in balance) behind Schelling''s objections and the stakes of the treatment dispute.'
  - id: wulf-magnificent-rebels#u26-c5
    heading: 'Auguste''s death'
    span: 586521:587551
    why: 'The unit''s turning point: Auguste''s death and the collapse of Caroline, Schelling and August Wilhelm, in their own words.'
- nn: 27
  unit_id: ch17-black-fog-1
  note_id: wulf-magnificent-rebels-ch17-black-fog-1
  span: 587553:604774
  chunks:
  - id: wulf-magnificent-rebels#u27-c1
    heading: 'August Wilhelm and Caroline at Auguste''s grave'
    span: 587894:588709
    why: 'Establishes the depth of the parents'' grief that frames the whole chapter.'
  - id: wulf-magnificent-rebels#u27-c2
    heading: 'Why Novalis turned against Caroline'
    span: 589988:591362
    why: 'Wulf explains Novalis''s conventional view of marriage and his blame of Caroline, showing a fault line in the circle.'
  - id: wulf-magnificent-rebels#u27-c3
    heading: 'Dorothea''s accusations against Schelling and Caroline'
    span: 593364:594431
    why: 'Shows grief turning into blame and the circle''s gossip economy, reported as Dorothea''s claims.'
  - id: wulf-magnificent-rebels#u27-c4
    heading: 'Friedrich''s flirtations and Dorothea''s retaliation'
    span: 595813:596748
    why: 'Contrasts Friedrich''s advocacy of women''s equality with his conduct and sketches the group''s entangled sexual politics.'
  - id: wulf-magnificent-rebels#u27-c5
    heading: 'Caroline''s core of steel'
    span: 601519:602039
    why: 'Wulf''s interpretive claim that Caroline embodied the Ich-philosophy in life.'
  - id: wulf-magnificent-rebels#u27-c6
    heading: 'Goethe takes Schelling to the New Year''s ball'
    span: 603292:604260
    why: 'Shows Goethe answering Caroline''s plea and the Weimar trio''s contrasting temperaments.'
- nn: 28
  unit_id: ch17-black-fog-2
  note_id: wulf-magnificent-rebels-ch17-black-fog-2
  span: 604774:625283
  chunks:
  - id: wulf-magnificent-rebels#u28-c1
    heading: 'Goethe''s fever-dreams of Naturphilosophie'
    span: 605493:606211
    why: 'Shows Naturphilosophie occupying Goethe''s unconscious and poses Wulf''s open question about the self and its dangers.'
  - id: wulf-magnificent-rebels#u28-c2
    heading: 'Faust: ''In the beginning was the Act'''
    span: 607695:608310
    why: 'Wulf''s reading of the Faust revision as Fichtean and Schellingian, tying Jena philosophy to Goethe''s poetry.'
  - id: wulf-magnificent-rebels#u28-c3
    heading: 'Schelling meets grief'
    span: 609509:610261
    why: 'Wulf''s explanatory portrait of Schelling''s breakdown after Auguste''s death and its effect on his relationship with Caroline.'
  - id: wulf-magnificent-rebels#u28-c4
