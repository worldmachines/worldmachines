    span: 613903:614265
    why: 'Marks the dispersal of the Jena circle at the moment Hegel arrives.'
  - id: wulf-magnificent-rebels#u28-c5
    heading: 'Novalis''s death and the group''s response'
    span: 621845:623416
    why: 'The central scene of the unit: Novalis dies at twenty-eight and his friends describe the loss in their own words.'
  - id: wulf-magnificent-rebels#u28-c6
    heading: 'The unfinished novel and Schlegel''s fury'
    span: 623418:625281
    why: 'Summarises Novalis''s legacy and the fragment ethos, and shows Friedrich Schlegel''s protective reverence in the dispute over completing Heinrich of Ofterdingen.'
- nn: 29
  unit_id: ch18-starving-rats-1
