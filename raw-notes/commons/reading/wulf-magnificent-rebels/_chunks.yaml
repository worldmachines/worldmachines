    span: 648775:649579
    why: 'States Schelling''s view that art expresses the Absolute and is the route to comprehending nature.'
  - id: wulf-magnificent-rebels#u30-c3
    heading: 'Poetry of the universe versus English utility'
    span: 649581:650319
    why: 'Contrasts Romantic poetic philosophy with English manufacturing and utility, in Schelling''s own words.'
  - id: wulf-magnificent-rebels#u30-c4
    heading: 'August Wilhelm Schlegel synthesises culture'
    span: 651114:651845
    why: 'Wulf''s framing of the Romantic method as historical, cross-disciplinary synthesis, set against Enlightenment progress and paired with Humboldt.'
  - id: wulf-magnificent-rebels#u30-c5
    heading: 'What ended Caroline and August Wilhelm''s marriage'
    span: 655922:656463
    why: 'Wulf''s hedged account of the breakdown, pivoting to Caroline''s own explanation.'
  - id: wulf-magnificent-rebels#u30-c6
    heading: 'They should only ever have been friends'
    span: 662950:663808
    why: 'Caroline''s retrospective verdict on her marriage and Schelling''s first disclosure of her to his parents.'
- nn: 31
  unit_id: ch19-current-exodus
  note_id: wulf-magnificent-rebels-ch19-current-exodus
  span: 670024:695901
  chunks:
  - id: wulf-magnificent-rebels#u31-c1
    heading: 'Jena empties: students, professors and the end of the ''Kingdom of Philosophy'''
    span: 670699:671585
    why: 'Gives the mechanism (students paying professors directly) and voices of decline behind Jena''s collapse as an intellectual scene.'
  - id: wulf-magnificent-rebels#u31-c2
    heading: 'Madame de Staël comes for the Ich'
    span: 678427:680173
    why: 'Records Staël''s outside view of German philosophy, her guess that Germans live in the ideal, and how the Jena ideas reached wider Europe.'
  - id: wulf-magnificent-rebels#u31-c3
    heading: 'Friedrich Schlegel in Napoleon''s Paris'
    span: 682527:683769
    why: 'Shows a leading Romantic''s disillusion with Revolution turned empire and his retreat toward German identity.'
  - id: wulf-magnificent-rebels#u31-c4
    heading: 'Humboldt carries the spirit of Jena to South America'
    span: 687987:688801
    why: 'Wulf''s claim that empirical exploration and imagination were joined in Humboldt through Goethe''s influence.'
  - id: wulf-magnificent-rebels#u31-c5
    heading: 'Reunited in Cotta''s catalogue'
    span: 689875:690651
    why: 'Wulf''s own synthesis of the movement''s spread and direction after the physical scene dissolved.'
  - id: wulf-magnificent-rebels#u31-c6
    heading: 'Goethe learns of Schiller''s death and cannot finish Demetrius'
    span: 693680:695899
    why: 'The emotional close of the Goethe–Schiller partnership, showing Goethe''s grief and his failed attempt to continue Schiller''s work.'
- nn: 32
  unit_id: ch20-french-in-town-1
  note_id: wulf-magnificent-rebels-ch20-french-in-town-1
  span: 695901:712967
  chunks:
  - id: wulf-magnificent-rebels#u32-c1
    heading: 'The Holy Roman Empire ends; Caroline and Schelling on Napoleon'
    span: 698883:699822
    why: 'Sets the political backdrop and shows two members of the circle reading the French advance as liberation from despotic monarchies.'
  - id: wulf-magnificent-rebels#u32-c2
    heading: 'Goethe''s last day in Jena'
    span: 702046:702971
    why: 'Elegy for the dispersed Jena circle, as Goethe looks at the crucible of so many ideas facing the French army.'
  - id: wulf-magnificent-rebels#u32-c3
    heading: 'Hegel''s Phenomenology: the mind watching itself construct reality'
    span: 707726:708619
    why: 'Wulf''s concise account of the Phenomenology''s argument about mind, self-consciousness and absolute knowing.'
  - id: wulf-magnificent-rebels#u32-c4
    heading: 'Hegel sees the world soul; Germans divided over Napoleon'
    span: 708992:710319
    why: 'Contains Hegel''s ''world soul'' letter and Wulf''s survey of contrasting German judgements of Napoleon, including Caroline and Goethe.'
  - id: wulf-magnificent-rebels#u32-c5
    heading: 'Why Hegel wanted the French to win'
    span: 710321:711136
    why: 'Ties Napoleon to Revolution, spirit and absolute knowledge, and explains why Hegel and others hoped for French victory despite personal loss.'
  - id: wulf-magnificent-rebels#u32-c6
    heading: 'The French arrive: looting of Jena'
    span: 704426:705010
    why: 'The vivid scene of the town''s fall, contrasting the ideals hoped for from France with the soldiers'' actual conduct.'
- nn: 33
  unit_id: ch20-french-in-town-2
  note_id: wulf-magnificent-rebels-ch20-french-in-town-2
  span: 712967:733254
  chunks:
  - id: wulf-magnificent-rebels#u33-c1
    heading: 'Circle''s sites become hospitals and camps; Napoleon in Goethe''s bed'
    span: 718200:719430
    why: 'Wulf''s clearest image of the Jena Set''s physical world being overwritten by war, tying the battle to the places of earlier chapters.'
  - id: wulf-magnificent-rebels#u33-c2
    heading: 'Goethe''s diary and the soldiers in his bedroom'
    span: 720400:721282
    why: 'Shows Goethe''s terror and dependence on Christiane, the personal core of the invasion narrative.'
  - id: wulf-magnificent-rebels#u33-c3
    heading: 'Goethe marries Christiane on the battle date'
    span: 722648:723159
    why: 'Reports Goethe''s own reasoning for honouring convention and Caroline''s reading of the marriage as tightening bonds amid collapse.'
  - id: wulf-magnificent-rebels#u33-c4
    heading: 'Caroline and Schelling welcome the French victory'
    span: 724548:725454
    why: 'Records the circle''s political attitude to Napoleon and the fall of despotic governments, in their own words.'
  - id: wulf-magnificent-rebels#u33-c5
    heading: 'Jena''s intellectual atmosphere disappears'
    span: 730853:731640
    why: 'Documents the concrete end of the scene: falling student numbers, ruined trades, and loss of scholarly exchange.'
  - id: wulf-magnificent-rebels#u33-c6
    heading: 'Hegel''s Phenomenology and the ''end of History'''
    span: 732542:733252
    why: 'Presents Hegel''s reading of Napoleon''s victory at Jena as the culmination of history, closing the unit on a philosophical note.'
- nn: 34
  unit_id: epilogue-after-jena-1
  note_id: wulf-magnificent-rebels-epilogue-after-jena-1
  span: 733254:751972
  chunks:
  - id: wulf-magnificent-rebels#u34-c1
    heading: 'Fichte''s Addresses and the ''national self'''
    span: 733548:734682
    why: 'Wulf''s own interpretive link from the Jena Ich-philosophy to a national Ich and its later political danger.'
  - id: wulf-magnificent-rebels#u34-c2
    heading: 'Caroline embraces transience in Munich'
    span: 736225:736920
    why: 'Shows Caroline''s late self-conception as a wanderer and sets up the nostalgia for Jena''s circle.'
  - id: wulf-magnificent-rebels#u34-c3
    heading: 'Wulf''s verdict on Caroline''s life'
    span: 739279:739797
    why: 'Wulf''s own summary of Caroline as an autonomous woman and the heart of the Jena Set.'
  - id: wulf-magnificent-rebels#u34-c4
    heading: 'August Wilhelm Schlegel and Madame de Staël'
    span: 741891:742572
    why: 'Shows how Jena ideas travelled to Staël through August Wilhelm, at the cost of his independence.'
  - id: wulf-magnificent-rebels#u34-c5
    heading: 'Friedrich''s conversion and repudiation of the Ich'
    span: 746435:747392
    why: 'Friedrich''s turn from Jena Romanticism to Catholicism, with his own critique of Fichte''s self-idolising.'
  - id: wulf-magnificent-rebels#u34-c6
    heading: 'Humboldt carries Naturphilosophie into nature writing'
    span: 750357:751554
    why: 'Wulf''s account of nature as a living whole passing from the Jena circle into Humboldt''s influential science.'
- nn: 35
  unit_id: epilogue-after-jena-2
  note_id: wulf-magnificent-rebels-epilogue-after-jena-2
  span: 751972:765312
  chunks:
  - id: wulf-magnificent-rebels#u35-c1
    heading: 'Humboldt''s university and self-emancipation'
    span: 751972:752826
    why: 'Wulf links the Jena concept of a self-determined Ich directly to the modern research university.'
  - id: wulf-magnificent-rebels#u35-c2
    heading: 'Humboldt on language and nation'
    span: 752828:753500
    why: 'Humboldt''s own claim that each language carries a world view and each nation is a mental whole, extending Herder and Fichte.'
  - id: wulf-magnificent-rebels#u35-c3
    heading: 'Hegel frees himself from Schelling'
    span: 754695:755677
    why: 'Shows Hegel''s rejection of Romantic enthusiasm and the elevation of art in favour of science and logic.'
  - id: wulf-magnificent-rebels#u35-c4
    heading: 'Novalis turned into a myth'
    span: 757009:757838
    why: 'Wulf''s account of how Schlegel and Tieck constructed the canonical image of the First Romantic.'
  - id: wulf-magnificent-rebels#u35-c5
    heading: 'Schiller: contemporaries into neighbours'
    span: 759944:760772
    why: 'Combines Schiller''s influence on Romantic beliefs with his own doubt that the group was a real intellectual alliance.'
  - id: wulf-magnificent-rebels#u35-c6
    heading: 'Goethe: my life''s work is that of a collective'
    span: 764904:765310
    why: 'Goethe''s late reframing of genius as collective, closing the unit and echoing the group-as-network theme.'
- nn: 36
  unit_id: epilogue-influence-selfish
  note_id: wulf-magnificent-rebels-epilogue-influence-selfish
  span: 765312:791172
  chunks:
  - id: wulf-magnificent-rebels#u36-c1
    heading: 'Staël''s Germany against French conformity'
    span: 765944:766703
    why: 'Wulf reports Staël''s contrast of French conformity with the German discovery of the free self, the book''s vehicle for spreading Jena''s ideas.'
  - id: wulf-magnificent-rebels#u36-c2
    heading: 'Coleridge translates Schelling'
    span: 772043:772708
    why: 'Shows the concrete mechanism of transmission from Naturphilosophie into English Romanticism, including the borrowing and De Quincey''s plagiarism charge.'
  - id: wulf-magnificent-rebels#u36-c3
    heading: 'Emerson''s Nature and the unity of self and world'
    span: 778967:779766
    why: 'Wulf''s account of how the unity of mind and nature reached America through Coleridge''s borrowings from Schelling.'
  - id: wulf-magnificent-rebels#u36-c4
    heading: 'Humboldt rescues Thoreau''s Walden'
    span: 777741:778357
    why: 'A specific instance of influence: Humboldt''s union of scientific accuracy and imagination reshapes a canonical American nature book.'
  - id: wulf-magnificent-rebels#u36-c5
    heading: 'Fichte''s freedom and its twin, moral duty'
    span: 786995:788163
    why: 'Wulf''s own thesis that the Jena Set''s placing of the self at the centre persists in us, with Fichte defended against charges of egotism.'
  - id: wulf-magnificent-rebels#u36-c6
    heading: 'What ''selfish'' originally meant'
    span: 788908:789547
    why: 'Wulf''s historical redefinition of selfishness as self-awareness and self-determination, the pivot of the whole Epilogue.'
  - id: wulf-magnificent-rebels#u36-c7
    heading: 'Novalis: self-understanding as the road to empathy'
    span: 790192:791094
    why: 'The closing argument that self-awareness is the moral prerequisite for empathy and community, ending the book''s thesis on the self.'
