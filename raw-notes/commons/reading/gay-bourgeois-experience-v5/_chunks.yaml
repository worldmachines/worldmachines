source: gay-bourgeois-experience-v5
units:
- nn: 1
  unit_id: intro-a
  note_id: gay-bourgeois-experience-v5-intro-a
  span: 0:20740
  chunks:
  - id: gay-bourgeois-experience-v5#u01-c1
    heading: 'Bourgeois as ideology: the "middling" self-image'
    span: 27:596
    why: 'States Gay''s central definitional thesis: bourgeois identity as a self-serving ideology moderating between aristocracy and working class, not a neutral sociological label.'
  - id: gay-bourgeois-experience-v5#u01-c2
    heading: 'Oxymorons of classification: Zola''s pyramid'
    span: 7305:8171
    why: 'Shows the proliferating, contested vocabulary contemporaries invented to render the bourgeoisie legible, and Gay''s own evidence (Zola) that it remained irreducibly heterogeneous.'
  - id: gay-bourgeois-experience-v5#u01-c3
    heading: 'The charcoal-sketch caveat'
    span: 6025:6544
    why: 'Gay''s explicit methodological warning against treating "the bourgeoisie" as a monolith, load-bearing for how the rest of the volume''s claims about bourgeois taste should be read.'
  - id: gay-bourgeois-experience-v5#u01-c4
    heading: 'The pivot to taste and modernism'
    span: 13397:13742
    why: 'The hinge sentence connecting the unit''s definitional throat-clearing to the volume''s real subject: taste, and the birth of modernism, as bourgeois phenomena.'
  - id: gay-bourgeois-experience-v5#u01-c5
    heading: 'Mill''s age of transition'
    span: 13744:14622
    why: 'Mill''s 1831 diagnosis of institutions outgrown but not replaced is the passage''s strongest resonance with the World Machines interregnum concept.'
  - id: gay-bourgeois-experience-v5#u01-c6
    heading: 'Burckhardt''s disapproval of novelty for its own sake'
    span: 16970:17630
    why: 'Supplies a contemporary conservative''s own verdict on the era''s restless appetite for novelty, the temperament Gay says made modernism possible.'
- nn: 2
  unit_id: intro-b
  note_id: gay-bourgeois-experience-v5-intro-b
  span: 20740:55198
  chunks:
  - id: gay-bourgeois-experience-v5#u02-c1
    heading: 'Anxiety as the tax on progress'
    span: 20740:21455
    why: 'States Gay''s opening thesis that Victorian progress bred a managed, often repressed anxiety that frames everything that follows in the chapter.'
  - id: gay-bourgeois-experience-v5#u02-c2
    heading: 'Neurasthenia and the iron cage'
    span: 23088:24133
    why: 'Names Weber''s “iron cage” as the disciplinary answer to the era''s accelerating nervous strain, Gay''s clearest bridge from psychology to regime.'
  - id: gay-bourgeois-experience-v5#u02-c3
    heading: 'The family as self-portrait'
    span: 39235:40320
    why: 'Lays out the sentimental self-image the bourgeois family was made to embody, which Gay spends the rest of the chapter testing against its critics.'
  - id: gay-bourgeois-experience-v5#u02-c4
    heading: 'The well-fashioned will'
    span: 42409:42899
    why: 'Maudsley''s formula of channeled rather than suppressed energy organizes Gay''s whole psychological account of bourgeois self-discipline.'
  - id: gay-bourgeois-experience-v5#u02-c5
    heading: 'Freud on renunciation and refinement'
    span: 44591:45720
    why: 'Freud''s own private letter contrasting bourgeois renunciation with the unrestrained “people” is Gay''s key first-person evidence for what bourgeois “refinement” actually cost.'
  - id: gay-bourgeois-experience-v5#u02-c6
    heading: 'Setting up the bourgeoisophobes'
    span: 54335:55196
    why: 'Names the cross-national roster of antibourgeois writers whose “single tune” of contempt the book''s next chapter will examine in depth.'
- nn: 3
  unit_id: bexp-s1-flaubertus
  note_id: gay-bourgeois-experience-v5-bexp-s1-flaubertus
  span: 55198:80578
  chunks:
  - id: gay-bourgeois-experience-v5#u03-c1
    heading: 'The modernist myth stated'
    span: 57010:57747
    why: 'States the chapter''s governing thesis - the avant-garde''s self-image as embattled defender of honest art against a philistine bourgeoisie is a partisan, oversimplified myth - that the rest of the unit tests against Flaubert and Rouen.'
  - id: gay-bourgeois-experience-v5#u03-c2
    heading: '“GUSTAVUS FLAUBERTUS, Bourgeoisophobus”'
    span: 58467:59051
    why: 'The private letter''s signature is Gay''s chosen emblem for Flaubert''s syndrome and gives the chapter, and the scout''s label for this unit, its name.'
  - id: gay-bourgeois-experience-v5#u03-c3
    heading: '“Bourgeois” as an all-purpose curse'
    span: 76365:77237
    why: 'Shows in Flaubert''s own words that “bourgeois” was elastic enough to cover workers and “all humanity,” the evidentiary crux of Gay''s argument that the bourgeoisophobe stance was rhetoric, not sociology.'
  - id: gay-bourgeois-experience-v5#u03-c4
    heading: 'Depeaux''s donation to Rouen'
    span: 69210:70161
    why: 'Gay''s counter-evidence: a real, stratified Rouen bourgeoisie that patronized and eventually collected Impressionism, directly contradicting Flaubert''s flattened caricature and previewing the volume''s political-economy-of-art and geography-of-taste themes.'
  - id: gay-bourgeois-experience-v5#u03-c5
    heading: 'Phobia as defense against self-recognition'
    span: 78153:78971
    why: 'Gay''s own Freudian diagnosis of Flaubert''s phobia as a defense against recognizing his own inescapable bourgeois nature - the psychoanalytic payoff the unit has been building toward.'
- nn: 4
  unit_id: bexp-s2-six-pack-philistines
  note_id: gay-bourgeois-experience-v5-bexp-s2-six-pack-philistines
  span: 80578:104563
  chunks:
  - id: gay-bourgeois-experience-v5#u04-c1
    heading: 'Werther and the Sturm-und-Drang origin'
    span: 80854:81679
    why: 'Establishes Gay''s genealogical claim that Victorian bourgeoisophobia descends from Sturm und Drang alienation and Goethe''s own late-life recycling of the martyred-genius myth.'
  - id: gay-bourgeois-experience-v5#u04-c2
    heading: 'Nietzsche''s Bildungsphilister and the six-pack philistine'
    span: 84150:85637
    why: 'Nietzsche''s coinages — “Bildungsphilister” and the vernacular “six-pack philistine” — give the unit its title and mark the terminological high-water mark of the tradition Gay is tracing.'
  - id: gay-bourgeois-experience-v5#u04-c3
    heading: 'Zola''s ‘Bourgeois! bourgeois!’ against Barbey d''Aurevilly'
    span: 88646:90071
    why: 'Zola''s chanted taunt is Gay''s prize specimen of ‘bourgeois’ used as a near-content-free insult, the rhetorical extreme the section is diagnosing.'
  - id: gay-bourgeois-experience-v5#u04-c4
    heading: 'Marx''s split judgment on the bourgeoisie'
    span: 93563:94342
    why: 'Gay''s account of Marx''s tension — epochal achievement versus moral caricature — shows how the polemical half of a serious argument outlived and flattened the analytical half.'
  - id: gay-bourgeois-experience-v5#u04-c5
    heading: 'From courtier to estranged genius: Gay''s counterargument'
    span: 95464:96527
    why: 'This is Gay''s own framing argument, not a subject''s quotation: the shift from courtier-artist to Enlightenment freelancer to romantic outsider is the historical mechanism behind the bourgeoisophobe pose.'
  - id: gay-bourgeois-experience-v5#u04-c6
    heading: 'The bourgeois piano: caricature versus evidence'
    span: 103844:104561
    why: 'The piano case lets Gay set the bourgeoisophobe caricature against contrary evidence (Gladstone''s diary, genuine domestic music-making), his characteristic move of using mixed evidence to complicate a stereotype.'
- nn: 5
  unit_id: bexp-s3-confusing-confrontations
  note_id: gay-bourgeois-experience-v5-bexp-s3-confusing-confrontations
  span: 104563:114925
  chunks:
  - id: gay-bourgeois-experience-v5#u05-c1
    heading: 'Crossed lines in the Victorian taste wars'
    span: 104592:105184
    why: 'Establishes Gay''s core claim that Victorian taste alliances crossed every expected line, undermining any clean rebel-vs-establishment reading of the era.'
  - id: gay-bourgeois-experience-v5#u05-c2
    heading: 'The bourgeoisie as a screen for economic survival'
    span: 105825:106830
    why: 'States Gay''s thesis directly: denouncing the bourgeoisie masked a fight over access to the dealers, critics, and museum directors who actually legitimized art.'
  - id: gay-bourgeois-experience-v5#u05-c3
    heading: 'The geography of taste across borders'
    span: 107884:108823
    why: 'Gay''s best evidence for taste as geographically contingent rather than fixed — reception of the same artist varied sharply by city and nation.'
  - id: gay-bourgeois-experience-v5#u05-c4
    heading: 'Tonio Kröger''s bourgeois-artist paradox'
    span: 111100:111831
    why: 'The passage Gay treats as more historically honest than Flaubert''s contempt: the artist''s ambivalent, not hostile, relationship to bourgeois origins.'
  - id: gay-bourgeois-experience-v5#u05-c5
    heading: 'Baudelaire''s dedication of the Salon to the bourgeoisie'
    span: 113496:114373
    why: 'The best direct evidence Gay marshals for the bourgeois-as-patron counter-narrative: Baudelaire''s own words defending the middle class as founders of museums and collections.'
  - id: gay-bourgeois-experience-v5#u05-c6
    heading: 'The bourgeois as backer, not just adversary, of modernist taste'
    span: 114375:114923
    why: 'Gay''s culminating thesis for the unit and the volume: against two centuries of avant-garde propaganda, the bourgeois could be modernism''s backer as much as its enemy.'
- nn: 6
  unit_id: ch01-s1-battles-of-the-budgets
  note_id: gay-bourgeois-experience-v5-ch01-s1-battles-of-the-budgets
  span: 114925:132595
  chunks:
  - id: gay-bourgeois-experience-v5#u06-c1
    heading: 'Caprice and diversity: the pleasure wars named'
    span: 116915:118716
    why: 'Pairs Musset''s 1836 verdict of ''caprice'' with Théoré''s 1845 embrace of the same phenomenon as ''diversity'' to name the two parties in Gay''s ''pleasure wars.'''
  - id: gay-bourgeois-experience-v5#u06-c2
    heading: 'Haack: the fall of the dictatorship over taste'
    span: 119175:119997
    why: 'Gay''s causal thesis: the French Revolution and bourgeois market entry broke the state/nobility/church monopoly on taste, tying the geography of taste to the geography of politics.'
  - id: gay-bourgeois-experience-v5#u06-c3
    heading: 'Baudelaire''s pluralism of beauty'
    span: 120401:121110
    why: 'Baudelaire''s Stendhal-derived pluralist aesthetic, which Gay credits as feeding into late-century modernism, against the neoclassical standard of uniform taste.'
  - id: gay-bourgeois-experience-v5#u06-c4
    heading: 'Ruskin''s political economy of art, priced'
    span: 121670:122621
    why: 'Introduces Ruskin''s controlling term and the first concrete price-versus-fortune case (Liebermann/Strousberg) that anchors the section''s economic method.'
  - id: gay-bourgeois-experience-v5#u06-c5
    heading: 'What price taste: Levi''s half-year salary'
    span: 131400:132593
    why: 'The section''s summarizing payoff, converting the whole income-versus-price ladder into a single vivid comparison and noting the buying elite''s narrow but expanding scope.'
- nn: 7
  unit_id: ch01-s2-affordable-masterpieces
  note_id: gay-bourgeois-experience-v5-ch01-s2-affordable-masterpieces
  span: 132595:166636
  chunks:
  - id: gay-bourgeois-experience-v5#u07-c1
    heading: 'A Civil Servant''s Culture Budget'
    span: 132897:133855
    why: 'Gay''s concrete household budget shows just how little disposable income even a comfortable civil-servant family had left for high culture, grounding the unit''s whole argument in economics before taste enters the picture.'
  - id: gay-bourgeois-experience-v5#u07-c2
    heading: 'Money Is Not Taste'
    span: 136614:137736
    why: 'States Gay''s governing thesis in the plainest terms — spending capacity and aesthetic discrimination are independent variables — against the stereotype that bourgeois equals philistine because bourgeois equals moneyed.'
  - id: gay-bourgeois-experience-v5#u07-c3
    heading: 'Photography as ‘Democracy of the Portrait’'
    span: 143592:144082
    why: 'Barbey d''Aurevilly''s attack on photography is the clearest statement in the unit of elite anxiety that reproduction technology was cheapening, in both senses, access to art.'
  - id: gay-bourgeois-experience-v5#u07-c4
    heading: 'Burning the Louvre: Copying and Its Discontents'
    span: 149789:150279
    why: 'Duranty''s and Pissarro''s fantasies of torching the Louvre show the bourgeoisophobe wing turning against the very practice that trained the Impressionists, dramatizing the tension between reverence and revolt in the art market.'
  - id: gay-bourgeois-experience-v5#u07-c5
    heading: 'Tiered Ticket Prices for Wagner in Munich'
    span: 156609:157337
    why: 'The Munich ticket ladder is Gay''s best concrete evidence of the political economy of art extending price discrimination down to students and clerks without erasing the class distinctions it encodes.'
  - id: gay-bourgeois-experience-v5#u07-c6
    heading: 'The ‘Gros Public’ and Its Crude Expectations'
    span: 164826:165841
    why: 'Berlioz''s and Joachim''s private contempt for the gros public is the seed of the modernist/middlebrow split that organizes the rest of the volume, and previews the bourgeoisophobe posture the brief flags as central to this book.'
- nn: 8
  unit_id: ch01-s3-limits-and-possibilities
  note_id: gay-bourgeois-experience-v5-ch01-s3-limits-and-possibilities
  span: 166636:191111
  chunks:
  - id: gay-bourgeois-experience-v5#u08-c1
    heading: 'The teapot and the logic of tiered pricing'
    span: 167282:167705
    why: 'States Gay''s organizing thesis—graduated prices for the same object or experience—in its most compact, concrete form.'
  - id: gay-bourgeois-experience-v5#u08-c2
    heading: 'Eastlake on reproductions and the engraving trade'
    span: 172624:173264
    why: 'Shows the reproduction market (photographs, engravings) as another rung of the price ladder extending high culture''s reach downward.'
  - id: gay-bourgeois-experience-v5#u08-c3
    heading: 'Morris''s paradox and the myth of the irreparable split'
    span: 178718:179891
    why: 'Gay''s own counterargument, not a subject''s quotation: Morris''s bourgeois-hating rhetoric coexisted with products priced out of ordinary bourgeois reach, evidence for the unit''s central claim that the avant-garde/bourgeois war is a legend.'
  - id: gay-bourgeois-experience-v5#u08-c4
    heading: 'Zola''s forecast and Durand-Ruel''s Impressionist gamble'
    span: 187404:188336
    why: 'Documents the Impressionists'' actual precarious market position and the dealer mechanics (Durand-Ruel, American collectors) that eventually inverted it, grounding Gay''s price-history argument in a concrete case.'
  - id: gay-bourgeois-experience-v5#u08-c5
    heading: 'Gérôme''s institutional dominance'
    span: 189014:189839
    why: 'Shows the academic painters the avant-garde scorned wielding real institutional power (juries, professorships, commissions) alongside their market dominance—the flip side of the Impressionists'' poverty.'
- nn: 9
  unit_id: ch02-s1-dividends-from-commerce
  note_id: gay-bourgeois-experience-v5-ch02-s1-dividends-from-commerce
  span: 191111:227725
  chunks:
  - id: gay-bourgeois-experience-v5#u09-c1
    heading: 'The geography-of-taste thesis'
    span: 191148:192131
    why: 'This is Gay''s own thesis statement opening the chapter, the argument every subsequent Manchester detail is offered to prove.'
  - id: gay-bourgeois-experience-v5#u09-c2
    heading: 'Leo recruits Hallé to Manchester'
    span: 193463:194164
    why: 'Shows commercial patronage actively soliciting an artist, the literal ''dividends from commerce'' the section is named for.'
  - id: gay-bourgeois-experience-v5#u09-c3
    heading: 'The orchestra as private venture, not charity'
    span: 200039:200893
    why: 'Gay''s clearest statement of the political economy of art in Manchester: profit-seeking and taste-cultivation pursued as one enterprise.'
  - id: gay-bourgeois-experience-v5#u09-c4
    heading: 'Cumberland''s 1905 attack on Hallé''s ''Philistinism'''
    span: 206065:207013
    why: 'Marks the precise moment a bourgeoisophobe critic recast fifty years of consensus-building as ossified philistinism, the volume''s central turn.'
  - id: gay-bourgeois-experience-v5#u09-c5
    heading: 'Fairbairn''s Alexandria-Florence-Venice speech'
    span: 219896:220648
    why: 'The richest primary quotation for bourgeois self-mythology: commerce claimed as culture''s oldest and truest patron.'
  - id: gay-bourgeois-experience-v5#u09-c6
    heading: 'Tocqueville on private, undirected institution-building'
    span: 217186:217893
    why: 'Names the mechanism by which Manchester''s whole cultural landscape accreted: private and autonomous, never centrally directed.'
- nn: 10
  unit_id: ch02-s2-majestic-dispensations
  note_id: gay-bourgeois-experience-v5-ch02-s2-majestic-dispensations
  span: 227725:268417
  chunks:
  - id: gay-bourgeois-experience-v5#u10-c1
    heading: 'Munich versus Manchester, stated at the outset'
    span: 227752:228738
    why: 'States the unit''s organizing thesis before any evidence is introduced: Munich as the polar opposite of Manchester''s bourgeois-built culture.'
  - id: gay-bourgeois-experience-v5#u10-c2
    heading: 'Ludwig I''s ambition for Munich'
    span: 230328:230647
    why: 'Traces the origin of Munich''s museum-building program to one king''s self-image, not to bourgeois demand.'
  - id: gay-bourgeois-experience-v5#u10-c3
    heading: 'The Kunstverein lowers the taste it was founded to raise'
    span: 245343:246682
    why: 'Gay''s sharpest irony: an association meant to cultivate bourgeois taste is corrupted by the market once its membership swells.'
  - id: gay-bourgeois-experience-v5#u10-c4
    heading: 'Hanslick''s bourgeois myth, checked against the facts'
    span: 264210:265031
    why: 'Gay''s method on display: testing a bourgeois institution''s proud self-description against its actual dependence on imperial and aristocratic patronage.'
  - id: gay-bourgeois-experience-v5#u10-c5
    heading: 'Ludwig II protects Levi from Wagner''s antisemitism'
    span: 258870:259624
    why: 'Shows royal caprice cutting both ways: the same king who indulged Wagner''s extravagance refused to indulge his bigotry, while the bourgeoisie remained mere spectators.'
  - id: gay-bourgeois-experience-v5#u10-c6
    heading: 'Two plaques, two theories of culture'
    span: 267775:268415
    why: 'Gay''s most economical statement of the whole chapter''s argument, compressed into two civic inscriptions crediting royal versus commercial patronage.'
- nn: 11
  unit_id: ch03-s1-guides-to-pleasure
  note_id: gay-bourgeois-experience-v5-ch03-s1-guides-to-pleasure
  span: 268417:311261
  chunks:
  - id: gay-bourgeois-experience-v5#u11-c1
    heading: 'Hazlitt on authority versus popular consent'
    span: 270865:271604
    why: 'States the section''s opening ambiguity: is deference to critics conformism or trust in expertise, and Gay lets Hazlitt''s authority-versus-consent framing carry the argument.'
  - id: gay-bourgeois-experience-v5#u11-c2
    heading: 'Shaw''s "great booby, the public"'
    span: 290509:290804
    why: 'The unit''s sharpest instance of a critic''s contempt for the bourgeois public he addresses, central to the bourgeoisophobe theme.'
  - id: gay-bourgeois-experience-v5#u11-c3
    heading: 'Freud on the unfreedom of taste'
    span: 275603:276677
    why: 'Gay''s own framing argument, stated directly rather than through a subject''s quotation, that aesthetic choice is shaped by unconscious and biographical forces.'
  - id: gay-bourgeois-experience-v5#u11-c4
    heading: 'Pissarro: "it reeks powerfully of bourgeois"'
    span: 291058:291666
    why: 'Best single evidence Gay marshals for the didactic, bourgeoisophobe posture of Victorian critics toward their own readership.'
  - id: gay-bourgeois-experience-v5#u11-c5
    heading: 'From Shelley''s unacknowledged legislators to acknowledged legislators of taste'
    span: 304275:305150
    why: 'Supplies the chapter''s title and thesis directly, tracing critics'' self-image to Shelley''s phrase for poets.'
  - id: gay-bourgeois-experience-v5#u11-c6
    heading: 'Bellicose critics and the Wagner wars'
    span: 306906:308143
    why: 'Shows how critics'' military rhetoric legitimated their vocation, exemplified by Hanslick''s campaign against Wagner that closes the unit.'
- nn: 12
  unit_id: ch03-s2-master-craftsmen
  note_id: gay-bourgeois-experience-v5-ch03-s2-master-craftsmen
  span: 311261:335832
  chunks:
  - id: gay-bourgeois-experience-v5#u12-c1
    heading: 'Sainte-Beuve asserts the critic''s independence (1857)'
    span: 312589:313578
    why: 'Gay''s key example of a measured, institutionally confident claim for the critic''s autonomous authority, framed against Wilde''s more flamboyant version.'
  - id: gay-bourgeois-experience-v5#u12-c2
    heading: 'Sainte-Beuve as ''naturalist of minds'''
    span: 314644:315466
    why: 'States Sainte-Beuve''s self-conception of criticism as disciplined, quasi-scientific craft rather than spontaneous taste-making.'
  - id: gay-bourgeois-experience-v5#u12-c3
    heading: '‘A good bourgeois in his own way’'
    span: 320751:321835
    why: 'Gay''s direct statement of the critic''s identification with bourgeois virtue, the passage that most explicitly makes the chapter''s argument.'
  - id: gay-bourgeois-experience-v5#u12-c4
    heading: 'Thoré''s democratic art-for-man creed'
    span: 324521:325454
    why: 'Shows Thoré fusing 1848 revolutionary politics with an explicitly anti-elitist vision of art''s audience, the counterpoint to Sainte-Beuve''s guardianship stance.'
  - id: gay-bourgeois-experience-v5#u12-c5
    heading: 'Thoré''s slow-built Vermeer market'
    span: 328979:329641
    why: 'Concrete evidence for the political economy of art: a critic''s decades of advocacy converting into rising prices and eventual canon status.'
  - id: gay-bourgeois-experience-v5#u12-c6
    heading: 'Criticism trails popular fiction in the marketplace'
    span: 332006:333092
    why: 'Undercuts the chapter''s survey of critical influence by showing that circulation, and likely readership attention, tracked serial novelists rather than critics.'
- nn: 13
  unit_id: ch03-s3-from-zola-to-wilde
  note_id: gay-bourgeois-experience-v5-ch03-s3-from-zola-to-wilde
  span: 335832:361574
  chunks:
  - id: gay-bourgeois-experience-v5#u13-c1
    heading: 'Academic "dead art" and imperial, not bourgeois, patronage'
    span: 335855:336715
    why: 'Gay''s framing irony that the academic art blamed on bourgeois taste was actually bought by the Emperor sets up the chapter''s central complication of the bourgeoisophobe myth.'
  - id: gay-bourgeois-experience-v5#u13-c2
    heading: 'The doctrine of distance for respectable nudes'
    span: 340435:340830
    why: 'Names the convention (mythological or allegorical ''dressing'') that made nude-viewing respectable and that Olympia''s contemporary, undisguised courtesan violated.'
  - id: gay-bourgeois-experience-v5#u13-c3
    heading: 'Ravenel: Olympia as ''armed insurrection in the camp of the bourgeois'''
    span: 342850:343913
    why: 'Gay explicitly names this ''the central issue of this book'' — the ambiguous bourgeois engagement with the avant-garde — making it the unit''s thesis statement.'
  - id: gay-bourgeois-experience-v5#u13-c4
    heading: 'Gay''s verdict: Zola''s formalist Manet was still a bourgeois'
    span: 345727:346420
    why: 'Gay''s own authorial judgment on his subjects'' criticism, generalizing the Manet case into the chapter''s broader claim about the incoherence of Victorian taste and its critics.'
  - id: gay-bourgeois-experience-v5#u13-c5
    heading: 'Wilde''s aestheticist doctrine in ''The Critic as Artist'''
    span: 347053:347601
    why: 'States the aestheticist claim — art answerable only to beauty, criticism equal or superior to creation — that later fused with his trial into a single scandal.'
  - id: gay-bourgeois-experience-v5#u13-c6
    heading: 'Wilde''s Jewish supporters as outsiders recognizing an outsider'
    span: 360261:360851
    why: 'Closes the unit on Gay''s point that bourgeois opinion of Wilde was never univocal, with some of the most respectable rescuers drawn from social outsiders.'
- nn: 14
  unit_id: ch04-s1-a-map-of-motives
  note_id: gay-bourgeois-experience-v5-ch04-s1-a-map-of-motives
  span: 361574:374721
  chunks:
  - id: gay-bourgeois-experience-v5#u14-c1
    heading: 'Buying as proof of taste; the Collector''s joy'
    span: 361633:362697
    why: 'Opens the chapter''s argument that taste has a practical, possessive dimension and that collectors'' own testimony frames collecting as heartfelt pleasure, not mere acquisition.'
  - id: gay-bourgeois-experience-v5#u14-c2
    heading: 'From childhood pebbles to adult rewards'
    span: 366150:367071
    why: 'Gay''s own taxonomy of collecting''s psychological rewards (control, memory, fraternity, competitive display) is the analytical core of the unit''s map of motives.'
  - id: gay-bourgeois-experience-v5#u14-c3
    heading: 'Not the plutocrats'' monopoly'
    span: 370271:371294
    why: 'Qualifies the money argument: American-millionaire prices reshaped the market, but Gay insists middling and petty bourgeois collectors were not shut out and needed no tutored taste.'
  - id: gay-bourgeois-experience-v5#u14-c4
    heading: 'Freer''s Damascus-road conversion to Whistler'
    span: 367568:368716
    why: 'Gay''s most vivid single case of the involuntary, overtaking force of the collecting impulse, used to dramatize the chapter''s psychological thesis.'
  - id: gay-bourgeois-experience-v5#u14-c5
    heading: 'Freud: surplus libido and the love of things'
    span: 374032:374719
    why: 'Delivers Gay''s Freudian payload directly in Freud''s own words, distinguishing collecting-as-sublimated-eros from Marxian commodity fetishism.'
- nn: 15
  unit_id: ch04-s2-collecting-as-autobiography
  note_id: gay-bourgeois-experience-v5-ch04-s2-collecting-as-autobiography
  span: 374721:410936
  chunks:
  - id: gay-bourgeois-experience-v5#u15-c1
    heading: 'Cézanne''s early buyers vindicated'
    span: 374753:375496
    why: 'States the chapter''s Freudian framing thesis and the evidentiary case (early defiance of dominant taste, later vindicated) that organizes everything that follows.'
  - id: gay-bourgeois-experience-v5#u15-c2
    heading: 'Degas: obsession beyond control'
    span: 384217:384682
    why: 'The chapter''s most direct first-person evidence that collecting is compulsive rather than calculated, in the collector''s own words.'
  - id: gay-bourgeois-experience-v5#u15-c3
    heading: 'Collecting as autobiography, via Liebermann'
    span: 385837:386311
    why: 'The chapter''s title thesis stated outright, immediately cashed out in a concrete case of taste formation through purchase.'
  - id: gay-bourgeois-experience-v5#u15-c4
    heading: 'The bourgeoisophobe indictment, at full strength'
    span: 390938:391495
    why: 'Assembles the anti-bourgeois case (Veblen''s conspicuous consumption) that Gay spends the rest of the chapter qualifying without dismissing.'
  - id: gay-bourgeois-experience-v5#u15-c5
    heading: 'Gay''s rebuttal: against dogmatic rejection'
    span: 399194:400015
    why: 'Gay''s explicit argumentative turn against the bourgeoisophobe caricature, naming Flaubert directly and setting up the chapter''s closing synthesis.'
  - id: gay-bourgeois-experience-v5#u15-c6
    heading: 'Simon and Arnhold: mixed motives, not reducible to status'
    span: 402169:402604
    why: 'Gay''s clearest statement of overdetermined motive—aesthetic delight and social anxiety combined rather than one masking the other—applied to his strongest counter-case.'
- nn: 16
  unit_id: ch04-s3-the-victorian-maecenas
  note_id: gay-bourgeois-experience-v5-ch04-s3-the-victorian-maecenas
  span: 410936:440034
  chunks:
  - id: gay-bourgeois-experience-v5#u16-c1
    heading: 'Constable and the ambivalence of the modern Maecenas relationship'
    span: 412939:414104
    why: 'States directly the artist''s mixed feelings about patronage versus the market that Gay treats as the psychological core of the modern Maecenas relationship.'
  - id: gay-bourgeois-experience-v5#u16-c2
    heading: 'Fiedler and Marées: patronage as tragicomedy'
    span: 415033:415899
    why: 'Gay''s fullest case study of a patron-artist bond collapsing under psychological strain, capped by Fiedler''s own tragicomic diagnosis of the relationship.'
  - id: gay-bourgeois-experience-v5#u16-c3
    heading: 'Willet''s mansion as a shrine to himself'
    span: 419192:420187
    why: 'Gay''s clearest evidence that a bourgeois collector''s ''disinterested'' sponsorship of art could double as vain self-display.'
  - id: gay-bourgeois-experience-v5#u16-c4
    heading: 'Louisine Havemeyer defends the Courbet nude'
    span: 425532:426856
    why: 'Shows the wife driving risk-taking avant-garde collecting inside a marriage where the husband holds nominal authority, in her own words from memoir.'
  - id: gay-bourgeois-experience-v5#u16-c5
    heading: 'Shchukin: the customer becomes a patron'
    span: 434376:435056
    why: 'Delivers the chapter''s title thesis in miniature: a collector''s commissions and correspondence turn him into a genuine Maecenas of a living modernist.'
  - id: gay-bourgeois-experience-v5#u16-c6
    heading: 'Gay''s summary verdict on bourgeois collectors'
    span: 439432:440032
    why: 'Gay''s own closing judgment on the chapter''s evidence, refusing to reduce bourgeois collectors to either philistines or heroes of taste.'
- nn: 17
  unit_id: ch05-s1-founders
  note_id: gay-bourgeois-experience-v5-ch05-s1-founders
  span: 440034:483246
  chunks:
  - id: gay-bourgeois-experience-v5#u17-c1
    heading: 'A taxonomy of motives'
    span: 441047:441699
    why: 'Gay''s own analytic taxonomy of founders'' private motives—the psychological substrate beneath civic philanthropy, including the guilt critics of capitalism read into giving.'
  - id: gay-bourgeois-experience-v5#u17-c2
    heading: 'Carnegie''s private guilt'
    span: 442574:443248
    why: 'Carnegie''s private 1868 memorandum and his 1891 public rationalization show the psychological work founding does for a philanthropist''s conscience—Gay''s Freudian reading of bourgeois motive in miniature.'
  - id: gay-bourgeois-experience-v5#u17-c3
    heading: 'The founder-public-manager triangle'
    span: 443553:444161
    why: 'States the structural model—donors, publics, managers—Gay uses to explain why founding could serve either tradition or innovation.'
  - id: gay-bourgeois-experience-v5#u17-c4
    heading: 'Higginson refuses the iron cage'
    span: 463945:464488
    why: 'Higginson''s self-justifying credo of musical autonomy, framed against Weber''s not-yet-coined iron cage, shows a founder explicitly refusing capitalist self-definition through cultural patronage.'
  - id: gay-bourgeois-experience-v5#u17-c5
    heading: 'State legislature vs. private Bürger money'
    span: 453143:453701
    why: 'Contrasts Prussian state art-funding with Leipzig''s private patronage, then Gay''s own synthesizing claim that the pattern recurred independently city to city—the geography-of-taste argument in miniature.'
  - id: gay-bourgeois-experience-v5#u17-c6
    heading: 'Jewish emancipation and the Städelsche Verein'
    span: 482586:483244
    why: 'Closes the section by tying Jewish bourgeois emancipation-era social climbing back to Gay''s opening taxonomy of motives, with an explicit nod to Freud that undercuts reductive readings of philanthropy.'
- nn: 18
  unit_id: ch05-s2-buttresses-for-the-establishment
  note_id: gay-bourgeois-experience-v5-ch05-s2-buttresses-for-the-establishment
  span: 483246:497372
  chunks:
  - id: gay-bourgeois-experience-v5#u18-c1
    heading: 'Movers were not shakers'
    span: 483283:483636
    why: 'States the section''s organizing contrast—donors who back established taste rather than challenge it—that the rest of the unit illustrates through three biographies.'
  - id: gay-bourgeois-experience-v5#u18-c2
    heading: 'Fodor''s Christus consolator: progressive content, conservative form'
    span: 484216:485283
    why: 'Gay''s closest reading of a single acquisition, showing how a painting can be simultaneously progressive in content and conservative in style—the unit''s core paradox in miniature.'
  - id: gay-bourgeois-experience-v5#u18-c3
    heading: 'Fodor''s riskless French purchases'
    span: 486068:486468
    why: 'States Fodor''s collecting logic plainly: competent and picturesque but deliberately excluding anything (Daumier, the real Delacroix) that would have been genuinely disruptive.'
  - id: gay-bourgeois-experience-v5#u18-c4
    heading: 'Schwabe: meant to entertain rather than shock'
    span: 487509:488414
    why: 'An inspector''s offhand remark about undraped figures becomes Gay''s shorthand for the entire genre of riskless, entertain-not-shock bourgeois collecting.'
  - id: gay-bourgeois-experience-v5#u18-c5
    heading: 'Wagener''s abasement before the Prussian crown'
    span: 495490:496463
    why: 'Shows the collector''s abrupt shift from exacting businessman to self-abasing subject before the Prussian crown—the unit''s clearest evidence of taste bound up with class deference and political calculation.'
  - id: gay-bourgeois-experience-v5#u18-c6
    heading: 'The founder''s name disappears; the closing verdict'
    span: 496827:497370
    why: 'Marks the deliberate erasure of Wagener''s name from the institution he founded and states Gay''s closing verdict on all three collectors: diligence rather than daring.'
- nn: 19
  unit_id: ch05-s3-the-perspiring-philistine-on-trial
  note_id: gay-bourgeois-experience-v5-ch05-s3-the-perspiring-philistine-on-trial
  span: 497372:515513
  chunks:
  - id: gay-bourgeois-experience-v5#u19-c1
    heading: 'Taste as national ethics: Lichtwark''s civic mission'
    span: 500492:501089
    why: 'States Lichtwark''s fused aesthetic-ethical nationalism, the engine of his whole campaign to reform German taste as unfinished national business.'
  - id: gay-bourgeois-experience-v5#u19-c2
    heading: 'Lichtwark damns the bourgeoisie in bourgeoisophobe terms'
    span: 502506:503156
    why: 'Lichtwark''s own indictment of the bourgeoisie followed immediately by Gay''s framing judgment, showing bourgeoisophobia was not exclusively a French avant-garde pose.'
  - id: gay-bourgeois-experience-v5#u19-c3
    heading: 'The Liebermann affair as intrabourgeois conflict'
    span: 506529:507109
    why: 'Gay''s central analytic claim for this episode: the scandal was driven by narcissism of minor differences within bourgeois society, not an avant-garde-versus-philistine clash.'
  - id: gay-bourgeois-experience-v5#u19-c4
    heading: 'Gérôme''s fury at the Caillebotte bequest'
    span: 512782:513284
    why: 'The era''s most vivid instance of establishment philistine panic at modern art entering a public collection, in the subject''s own escalating words.'
  - id: gay-bourgeois-experience-v5#u19-c5
    heading: 'Gay reframes the Caillebotte affair beyond progress vs. reaction'
    span: 514746:515511
    why: 'Gay''s own synthesizing argument, rejecting the simple heroic-modernist reading in favor of two educator factions disputing risk within a shared, fracturing bourgeois cultural compromise.'
- nn: 20
  unit_id: ch06-s1-a-profusion-of-alternatives
  note_id: gay-bourgeois-experience-v5-ch06-s1-a-profusion-of-alternatives
  span: 515513:531274
  chunks:
  - id: gay-bourgeois-experience-v5#u20-c1
    heading: 'A profusion of alternatives after 1880'
    span: 515569:516570
    why: 'States the section''s governing claim: a sudden, exhilarating and alarming multiplication of modernist alternatives that leaves the bourgeois public without a settled response.'
  - id: gay-bourgeois-experience-v5#u20-c2
    heading: 'Landmarks of 1907-1913 and the riots they caused'
    span: 516572:517716
    why: 'Anchors modernism to its canonical works and dates while showing that nearly all of them, not just the obscure ones, provoked open hostility.'
  - id: gay-bourgeois-experience-v5#u20-c3
    heading: 'Reluctant modernists: Voysey, Corot, Brahms'
    span: 522807:523312
    why: 'Gay''s generalization that transitional figures often advanced modernism without intending or believing in it, complicating a simple avant-garde-versus-tradition narrative.'
  - id: gay-bourgeois-experience-v5#u20-c4
    heading: 'Modernism as a call to authenticity'
    span: 523314:523946
    why: 'States directly modernism''s self-understanding as a crusade for sincerity and expressive freedom against academic formula, the section''s interpretive thesis.'
  - id: gay-bourgeois-experience-v5#u20-c5
    heading: 'Co-option by misreading: Degas, Brahms, Winslow Homer'
    span: 527651:529155
    why: 'Gay''s densest evidence for how conservative taste tamed modernist and difficult art by domesticating it into decoration, cliché, or moral comfort.'
  - id: gay-bourgeois-experience-v5#u20-c6
    heading: 'The middle classes nourished their sworn enemies'
    span: 530520:531272
    why: 'Delivers the section''s structural payoff: bourgeois patronage, not avant-garde self-sufficiency, was the precondition for modernism''s survival.'
- nn: 21
  unit_id: ch06-s2-modernists-vs-modernists
  note_id: gay-bourgeois-experience-v5-ch06-s2-modernists-vs-modernists
  span: 531274:552907
  chunks:
  - id: gay-bourgeois-experience-v5#u21-c1
    heading: 'The juste milieu: graduated compromise, not a binary choice'
    span: 531304:532691
    why: 'States the section''s opening thesis that bourgeois taste occupied a graded spectrum of compromise rather than a stark modernist/academic binary.'
  - id: gay-bourgeois-experience-v5#u21-c2
    heading: 'Mondrian on Cubism, Munch on the Impressionists as ''façade people'''
    span: 535497:536412
    why: 'Direct textual evidence for the section''s title thesis: modernists judging and dismissing other modernists as insufficiently radical.'
  - id: gay-bourgeois-experience-v5#u21-c3
    heading: 'Secessions splitting from secessions'
    span: 536414:537440
    why: 'Names the generational mechanism — ''one generation''s unconventionality was the next generation''s conformism'' — driving perpetual factional splits.'
  - id: gay-bourgeois-experience-v5#u21-c4
    heading: 'Verhaeren''s kaleidoscope: modernism''s permanent fragmentation'
    span: 540749:541405
    why: 'Gay''s chosen contemporary image for modernism as a shifting, non-convergent field, and his claim that this very incoherence was part of the provocation.'
  - id: gay-bourgeois-experience-v5#u21-c5
    heading: 'Liebermann: ''No one can leap over his shadow'''
    span: 546248:546982
    why: 'Case study crystallizing the ''moving frontier'' thesis: yesterday''s rebel becoming today''s boundary-setter, in Liebermann''s own memorable words.'
  - id: gay-bourgeois-experience-v5#u21-c6
    heading: 'Debussy and the ''mediocrity of the herd mind'''
    span: 544332:545293
    why: 'Shows contempt for mass audiences becoming a badge of authenticity even for a critically successful modernist, key evidence for the Carey resonance.'
- nn: 22
  unit_id: ch06-s3-causes-and-effects
  note_id: gay-bourgeois-experience-v5-ch06-s3-causes-and-effects
  span: 552907:575526
  chunks:
  - id: gay-bourgeois-experience-v5#u22-c1
    heading: 'Bourgeois Affluence by the Numbers'
    span: 553848:554916
    why: 'Gay''s clearest statement of the economic precondition for modernism''s rise, grounding the ''loose cash'' thesis in concrete per-capita-income data rather than assertion.'
  - id: gay-bourgeois-experience-v5#u22-c2
    heading: 'The City as Inspiration and Marketplace'
    span: 557036:558264
    why: 'States Gay''s claim that modernism was structurally an urban phenomenon, while naming the rural exceptions that prove the rule.'
  - id: gay-bourgeois-experience-v5#u22-c3
    heading: 'Theosophy and the Modernists Who Weren''t Moderns'
    span: 562751:563660
    why: 'Captures Gay''s central irony that some of modernism''s most fervent figures were anti-secular mystics, complicating any simple equation of modernism with Enlightenment secularism.'
  - id: gay-bourgeois-experience-v5#u22-c4
    heading: 'Avant-Garde Politics at the Extremes'
    span: 563662:564947
    why: 'Shows Gay''s argument that bourgeoisophobia pushed avant-gardes toward political extremes, using Chesterton''s and Theodore Roosevelt''s contemporary reactions as evidence.'
  - id: gay-bourgeois-experience-v5#u22-c5
    heading: 'Degas, Dreyfus, and a Fleeting Insight'
    span: 568077:569387
    why: 'The starkest single piece of evidence for how the Dreyfus affair fractured avant-garde solidarity along the fault line of prejudice, in Degas''s own words.'
  - id: gay-bourgeois-experience-v5#u22-c6
    heading: 'Gay''s Synthesis: Adjustment, Gratification, and Anxiety'
    span: 572868:573635
    why: 'Gay''s own summary thesis tying the chapter''s causes together and asserting that private psychic turmoil, not just public upheaval, drove the bourgeois response to modernism.'
- nn: 23
  unit_id: ch06-s4-against-the-need-for-probability
  note_id: gay-bourgeois-experience-v5-ch06-s4-against-the-need-for-probability
  span: 575526:619107
  chunks:
  - id: gay-bourgeois-experience-v5#u23-c1
    heading: 'Gauguin: “shackled by the need for probability”'
    span: 576560:577807
    why: 'States the chapter''s organizing opposition—probability/resemblance versus inner necessity—in Gauguin''s own compressed formula.'
  - id: gay-bourgeois-experience-v5#u23-c2
    heading: 'Franz Marc and the proliferation of styles'
    span: 579465:579933
    why: 'Gay''s correction of Marc—crisis as proliferation rather than collapse of style—is the passage''s clearest divergence-flavored claim.'
  - id: gay-bourgeois-experience-v5#u23-c3
    heading: 'Bourgeois collectors rescue Picasso'
    span: 589940:590738
    why: 'The hinge sentence of the political-economy-of-art argument: bourgeois money, not bohemian self-sufficiency, sustained the bourgeoisophobe''s career.'
  - id: gay-bourgeois-experience-v5#u23-c4
    heading: 'Gertrude Stein''s unrecanted bourgeois values'
    span: 591658:592916
    why: 'Shows a bourgeois patron of the avant-garde explicitly defending bourgeois family values, complicating any clean bourgeois/modernist split.'
  - id: gay-bourgeois-experience-v5#u23-c5
    heading: 'Ruskin: no law survives a new material'
    span: 601483:602256
    why: 'Ruskin''s own words license overturning inherited architectural rule for new materials—the clearest single sentence for the divergence-over-legibility resonance.'
  - id: gay-bourgeois-experience-v5#u23-c6
    heading: 'Gay''s revisionist thesis'
    span: 616661:617770
    why: 'States outright the chapter''s (and the volume''s) revisionist claim against the myth of a monolithic philistine bourgeoisie.'
- nn: 24
  unit_id: coda-a-bourgeois-experience
  note_id: gay-bourgeois-experience-v5-coda-a-bourgeois-experience
  span: 619107:657432
  chunks:
  - id: gay-bourgeois-experience-v5#u24-c1
    heading: 'The bourgeoisophobe genealogy'
    span: 652192:653149
    why: 'Gay''s central revisionist claim — that the philistine-bourgeois image is a polemical inheritance from Flaubert back through Goethe''s Werther and the romantics into modernism''s self-image, not a neutral finding.'
  - id: gay-bourgeois-experience-v5#u24-c2
    heading: 'The philistine caricature stated and rejected'
    span: 651418:652190
    why: 'States the received caricature Gay spends the coda dismantling, in his own summarizing voice rather than a quoted subject''s.'
  - id: gay-bourgeois-experience-v5#u24-c3
    heading: 'Geography of patronage: Manchester, Munich, Paris, Berlin'
    span: 653847:654775
    why: 'States in miniature the political-economy-of-art and geography-of-taste framework (self-funded vs. court-sponsored vs. mixed patronage) that structures Vol. V.'
  - id: gay-bourgeois-experience-v5#u24-c4
    heading: 'The Mabel Loomis Todd diary'
    span: 628368:628816
    why: 'The contingent archival discovery that made the whole series'' intimate, psychoanalytically-readable evidentiary base possible.'
  - id: gay-bourgeois-experience-v5#u24-c5
    heading: 'Historian informed by psychoanalysis, not a psychohistorian'
    span: 635853:636757
    why: 'Gay''s explicit self-positioning and methodological defense, citing Freud''s own claim that the Oedipus complex ''has a history, a social history.'''
  - id: gay-bourgeois-experience-v5#u24-c6
    heading: 'Social history''s turn away from the bourgeoisie'
    span: 623587:624199
    why: 'Explains the postwar historiographical shift that left the bourgeoisie understudied, setting up the disciplinary gap Gay''s project fills.'
