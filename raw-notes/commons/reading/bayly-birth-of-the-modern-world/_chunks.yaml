source: bayly-birth-of-the-modern-world
units:
- nn: 1
  unit_id: intro-thematic-problems-of-history
  note_id: bayly-birth-of-the-modern-world-intro-thematic-problems-of-history
  span: 0:27654
  chunks:
  - id: bayly-birth-of-the-modern-world#u01-c1
    heading: 'Global uniformity through ‘bodily practices’'
    span: 1024:1632
    why: 'States the book''s core thesis that nineteenth-century uniformity extended past institutions into everyday bodily practice.'
  - id: bayly-birth-of-the-modern-world#u01-c2
    heading: 'Hybrid polities and heightened difference'
    span: 1634:2481
    why: 'Names the central paradox that intensifying global connection also sharpened antagonism and identity, via Appadurai''s mutual ‘cannibalizing’ of global and local.'
  - id: bayly-birth-of-the-modern-world#u01-c3
    heading: 'The book''s dual chronological/thematic design'
    span: 7110:7436
    why: 'Explains the book''s two-track structure of crisis narrative versus institutional theme that organizes everything that follows.'
  - id: bayly-birth-of-the-modern-world#u01-c4
    heading: 'A parallelogram of forces, not a prime mover'
    span: 21091:21541
    why: 'States Bayly''s positive multi-causal alternative to economic- or state-determinist explanations of nineteenth-century change.'
  - id: bayly-birth-of-the-modern-world#u01-c5
    heading: 'Industrious revolutions before industrialization'
    span: 16315:16764
    why: 'Grounds the book''s causal argument in de Vries''s pre-industrial intensification of labor and consumption as a driver as important as industrial capital.'
  - id: bayly-birth-of-the-modern-world#u01-c6
    heading: 'Defending grand narrative against postmodernist critique'
    span: 26068:26440
    why: 'Answers Problem Two''s challenge by insisting fragment-focused and grand-narrative history are mutually constitutive rather than opposed.'
- nn: 2
  unit_id: intro-riddle-of-modernity-and-the-body
  note_id: bayly-birth-of-the-modern-world-intro-riddle-of-modernity-and-the-body
  span: 27654:61372
  chunks:
  - id: bayly-birth-of-the-modern-world#u02-c1
    heading: 'The riddle-of-the-modern debate'
    span: 30057:30515
    why: 'Names the two live poles of the modernity debate Bayly must answer — Latour''s dissolution of modern/non-modern versus the die-hard ''riddle of the modern'' camp of Gellner, Macfarlane, and Landes.'
  - id: bayly-birth-of-the-modern-world#u02-c2
    heading: 'Modernity as an aspiration'
    span: 30517:31587
    why: 'States Bayly''s own resolution of the riddle: modernity is constituted partly by historical actors'' self-conscious belief that they are modern, an aspiration as much as a measurable shift.'
  - id: bayly-birth-of-the-modern-world#u02-c3
    heading: 'Western dress spreads to non-Western elites, 1780-1914'
    span: 38553:39152
    why: 'The book''s paradigm case of contested global uniformity — elite male dress converging on a single Western template within little more than a century.'
  - id: bayly-birth-of-the-modern-world#u02-c4
    heading: 'Uniformity is not homogeneity'
    span: 39962:40756
    why: 'Bayly''s key conceptual distinction — convergent form coexists with preserved distinctiveness (Maori tattoos, Geronimo''s staged ''warrior'' persona) — that keeps uniformity from collapsing into sameness.'
  - id: bayly-birth-of-the-modern-world#u02-c5
    heading: 'Timekeeping as bodily discipline and state legibility'
    span: 46573:47992
    why: 'Traces watches, plantation bells, telegraph-linked synchronization, and municipal clock towers as one lineage of the body being disciplined into legible, standardized time.'
  - id: bayly-birth-of-the-modern-world#u02-c6
    heading: 'The second theme: internal complexity alongside outward uniformity'
    span: 57634:59186
    why: 'States the book''s second organizing claim directly — growing external uniformity between societies ran alongside growing internal specialization and complexity within them.'
- nn: 3
  unit_id: ch01-old-regime-society-and-difference
  note_id: bayly-birth-of-the-modern-world-ch01-old-regime-society-and-difference
  span: 61372:87958
  chunks:
  - id: bayly-birth-of-the-modern-world#u03-c1
    heading: 'The demographic weight of agrarian empires'
    span: 63166:64060
    why: 'States the demographic baseline -- agrarian empires holding roughly 70 percent of world population, peasants 80 percent within them -- against which the book''s story of nineteenth-century transformation is measured.'
  - id: bayly-birth-of-the-modern-world#u03-c2
    heading: 'Peasants were neither boors nor arcadian innocents nor born rebels'
    span: 67337:68720
    why: 'Bayly clears away three competing eighteenth/nineteenth-century caricatures of peasants and credits their entrepreneurial agency as a source of later economic dynamism.'
  - id: bayly-birth-of-the-modern-world#u03-c3
    heading: 'State power as “a trick of the light”'
    span: 76463:77895
    why: 'Bayly''s central image for old-regime statecraft: power performed selectively and left deliberately illegible rather than either absent or total, requiring only recognition of the ruler''s supremacy, not uniform belief.'
  - id: bayly-birth-of-the-modern-world#u03-c4
    heading: 'Bureaucrat, warrior, and priest blurred into one another'
    span: 79158:80348
    why: 'Shows Weber''s clean ideal types (military aristocracy vs. bureaucracy) dissolving in every real case Bayly cites, from France''s noblesse de robe to Qing scholar-gentry to Vietnamese mandarins.'
  - id: bayly-birth-of-the-modern-world#u03-c5
    heading: 'Developmental cycles and imperial overstretch'
    span: 82161:83591
    why: 'Supplies the chronology of Ottoman, Mughal, and Habsburg overstretch by the eighteenth century that primes the reader for the book''s later ''world crisis'' argument.'
  - id: bayly-birth-of-the-modern-world#u03-c6
    heading: 'Imperial ideology as manufactured, gloried-in difference'
    span: 84691:85862
    why: 'States the section''s thesis outright: Ottoman, Mughal, and other rulers performed religious and ethnic pluralism as a deliberate technique of rule, not a weakness to be cured.'
- nn: 4
  unit_id: ch01-fringes-and-archaic-globalization
  note_id: bayly-birth-of-the-modern-world-ch01-fringes-and-archaic-globalization
  span: 87958:119509
  chunks:
  - id: bayly-birth-of-the-modern-world#u04-c1
    heading: 'Pardeshis and outsider rule'
    span: 89086:89851
    why: 'Names the era''s decentered, personalized sovereignty — Bayly''s key empirical case that rule by outsiders was the global default around 1780, not an exception confined to Europe.'
  - id: bayly-birth-of-the-modern-world#u04-c2
    heading: 'Lineage, not landholding: stateless societies'
    span: 92346:93355
    why: 'States Bayly''s clearest claim that African, Native American, and Pacific societies organized hierarchy through kinship, age, and ritual rather than through ''the state'' as a landholding entity.'
  - id: bayly-birth-of-the-modern-world#u04-c3
    heading: 'Slave plantations as advanced capitalism'
    span: 98361:99063
    why: 'Bayly''s blunt thesis-sentence that the plantation complex, not only northwestern Europe''s peasant economy, was the period''s most financially sophisticated capital-and-labor market.'
  - id: bayly-birth-of-the-modern-world#u04-c4
    heading: 'The three engines of archaic globalization'
    span: 102952:103544
    why: 'States outright the section''s organizing thesis: universal kingship, cosmic religion, and humoral bodily practice as the three drivers of pre-1780 global connection.'
  - id: bayly-birth-of-the-modern-world#u04-c5
    heading: 'Caste as the era''s grid of embodied status'
    span: 115370:116438
    why: 'Shows how a Portuguese-derived caste idiom, not race or nationality, supplied a shared cross-cultural language for ranking people before the nation-state.'
  - id: bayly-birth-of-the-modern-world#u04-c6
    heading: 'The millenarian conjuncture'
    span: 117471:118854
    why: 'Ties Subrahmanyam''s shared Christian-Muslim apocalyptic anxiety to Asian millenarianism and the French Revolution, setting up the book''s ''world crisis'' argument that follows this unit.'
- nn: 5
  unit_id: ch02-old-regime-industrious-revolutions
  note_id: bayly-birth-of-the-modern-world-ch02-old-regime-industrious-revolutions
  span: 119509:145200
  chunks:
  - id: bayly-birth-of-the-modern-world#u05-c1
    heading: 'The last great domestication'
    span: 125302:125746
    why: 'Bayly''s own synthesis of the argument that a final, rapid wave of agrarian conquest and pastoral ''sedenterization'' — not industrialization — supplied the raw materials and labor of the nineteenth-century commercial economy.'
  - id: bayly-birth-of-the-modern-world#u05-c2
    heading: 'De Vries''s industrious revolution and the invention of breakfast'
    span: 126886:127646
    why: 'Defines the industrious-revolution concept central to the chapter: household reorganization of labor and new consumer ''packages'' driving demand-side growth independent of factory industrialization.'
  - id: bayly-birth-of-the-modern-world#u05-c3
    heading: 'China''s industrious revolution and the objectification of luxury'
    span: 133624:135363
    why: 'Shows the same household-consumption dynamic operating in China''s economy well before significant Western impact, undercutting narratives of pre-1800 Chinese stagnation.'
  - id: bayly-birth-of-the-modern-world#u05-c4
    heading: 'Favorable conditions and Parthasarathi on South Asian weavers'
    span: 136911:138063
    why: 'Cites revisionist economic history directly challenging the ''tribute economy'' and rigid-caste stereotypes of eighteenth-century South Asia and the Middle East.'
  - id: bayly-birth-of-the-modern-world#u05-c5
    heading: 'Rebalancing the ''decline of the rest'''
    span: 141302:141651
    why: 'States Bayly''s methodological corrective, refusing both an internalist-decline narrative and Gunder Frank''s inversion — the pivot behind the chapter''s multi-centred causal claim.'
  - id: bayly-birth-of-the-modern-world#u05-c6
    heading: 'Europe''s contingent, not essential, advantage'
    span: 144600:144902
    why: 'The chapter''s thesis statement: European dynamism came from social and state context giving ''staying power,'' not from inherent economic exceptionalism.'
- nn: 6
  unit_id: ch02-european-competitive-advantage-activist-state
  note_id: bayly-birth-of-the-modern-world-ch02-european-competitive-advantage-activist-state
  span: 145200:182233
  chunks:
  - id: bayly-birth-of-the-modern-world#u06-c1
    heading: 'Pomeranz''s ecological windfall thesis'
    span: 145488:145804
    why: 'States the ecological/resource-based explanation (Pomeranz) for European economic dynamism that anchors the unit''s opening argument.'
  - id: bayly-birth-of-the-modern-world#u06-c2
    heading: 'Property rights as a competitive advantage'
    span: 148630:149001
    why: 'Identifies secure property law, not superior enterprise, as Bayly''s first social/political explanation for Europe''s edge.'
  - id: bayly-birth-of-the-modern-world#u06-c3
    heading: 'War, finance, and the brute advantage'
    span: 154673:154999
    why: 'Bayly''s most direct statement of the war-finance thesis named in the chapter title.'
  - id: bayly-birth-of-the-modern-world#u06-c4
    heading: 'A temporary competitive advantage'
    span: 157874:158395
    why: 'Frames the activist patriotic state as a recent, contingent European development rather than a civilizational given — the thesis the rest of the section defends.'
  - id: bayly-birth-of-the-modern-world#u06-c5
    heading: 'Schooling, standardization, and print-culture nationalism'
    span: 169811:170354
    why: 'Ties state-sponsored education and language standardization directly to Benedict Anderson''s print-nationalism thesis, and resonates with the World Machines legibility frame.'
  - id: bayly-birth-of-the-modern-world#u06-c6
    heading: 'Against the diffusionist nationalism narrative'
    span: 171500:172241
    why: 'States in full the imperial ''nationalism exported from Europe'' narrative that Bayly spends the rest of the unit refuting with non-European counter-examples.'
- nn: 7
  unit_id: ch02-critical-publics-conclusion
  note_id: bayly-birth-of-the-modern-world-ch02-critical-publics-conclusion
  span: 182233:218211
  chunks:
  - id: bayly-birth-of-the-modern-world#u07-c1
    heading: 'Franklin and the Western urge to associate'
    span: 184130:185238
    why: 'Names the concrete, if partial, distinctiveness of Atlantic associational culture (via Franklin) that the rest of the chapter both credits and relativizes.'
  - id: bayly-birth-of-the-modern-world#u07-c2
    heading: 'Who the new public excluded'
    span: 188208:189759
    why: 'Bayly''s corrective to rosy public-sphere historiography: the civic public was bounded by gender, class, race, and empire, not universal.'
  - id: bayly-birth-of-the-modern-world#u07-c3
    heading: 'The Islamic public sphere'
    span: 197755:199122
    why: 'States the chapter''s core comparative claim in Bayly''s own terms: an ''Islamic public sphere'' as a parallel, not derivative, eighteenth-century modernity.'
  - id: bayly-birth-of-the-modern-world#u07-c4
    heading: 'Warfare, terrain, and the medium-term lag'
    span: 212372:213949
    why: 'Gives Bayly''s specific causal mechanism for Europe''s advantage — competitive fragmented terrain forcing military-fiscal innovation — rather than a civilizational explanation.'
  - id: bayly-birth-of-the-modern-world#u07-c5
    heading: 'Rejecting the backwardness verdict'
    span: 215125:216929
    why: 'Bayly''s explicit refusal of Victorian moral-backwardness framing, closing the chapter''s argument on a non-Eurocentric note via Yan Fu.'
  - id: bayly-birth-of-the-modern-world#u07-c6
    heading: 'Prospect: the patriotic state inflates'
    span: 216941:218008
    why: 'Bridges the chapter to the book''s next argument: the 1780-1820 widening of Europe''s lead came from the sudden inflation of the information-rich state, not yet from industrialization.'
- nn: 8
  unit_id: ch03-world-crisis-anatomy
  note_id: bayly-birth-of-the-modern-world-ch03-world-crisis-anatomy
  span: 218211:249802
  chunks:
  - id: bayly-birth-of-the-modern-world#u08-c1
    heading: 'The feedback loop: Waterloo lost in India'
    span: 218645:219384
    why: 'States the chapter''s central architectural claim — that European and extra-European crises fed each other in both directions — in Bayly''s own summary image.'
  - id: bayly-birth-of-the-modern-world#u08-c2
    heading: 'Self-evident rights, freestanding and portable'
    span: 220204:220652
    why: 'Captures the specific ideological mechanism — self-evident, freestanding rights — that let the doctrine travel to slaves, Bengalis, and Latin Americans without local warrant.'
  - id: bayly-birth-of-the-modern-world#u08-c3
    heading: 'Sikhs, Wahhabis, and Qing sectarians: parallel crises of legitimacy'
    span: 222738:223918
    why: 'Shows Bayly''s claim that non-European legitimacy crises (Sikh, Wahhabi, Qing) predate or run parallel to the Atlantic revolutions rather than merely reacting to them.'
  - id: bayly-birth-of-the-modern-world#u08-c4
    heading: 'Aurangzeb and the military-fiscal trap'
    span: 235897:236337
    why: 'Gives Bayly''s paradigm case of the ''military-fiscal'' conundrum that he argues trapped every major Asian and Ottoman regime.'
  - id: bayly-birth-of-the-modern-world#u08-c5
    heading: 'The Seven Years War as global hinge'
    span: 242189:242837
    why: 'Marks the moment Bayly identifies as when regional crises ''flowed together'' into a single global convulsion.'
  - id: bayly-birth-of-the-modern-world#u08-c6
    heading: 'Bengal, 1757-65: the tilt in the balance of power'
    span: 230325:230689
    why: 'Names the concrete event (EIC seizure of Bengal) Bayly credits with tilting the world balance of power before industrialization.'
- nn: 9
  unit_id: ch03-climacteric-sapping-legitimacy
  note_id: bayly-birth-of-the-modern-world-ch03-climacteric-sapping-legitimacy
  span: 249802:280458
  chunks:
  - id: bayly-birth-of-the-modern-world#u09-c1
    heading: 'Napoleonic extraction echoes Ottoman, Russian, and Mughal patrimonial finance'
    span: 253746:254209
    why: 'Shows Bayly''s comparative move: French revolutionary state-building reproduced the same fiscal-military patrimonialism it claimed to abolish, and he names the Ottoman/Russian/Mughal analogy explicitly.'
  - id: bayly-birth-of-the-modern-world#u09-c2
    heading: 'The butterfly effect: Spain, silver, and China'
    span: 256156:256860
    why: 'The clearest statement of Bayly''s global-connections method: the crisis ''bounced back'' to Europe and rippled through Spanish American independence into silver flows reaching China.'
  - id: bayly-birth-of-the-modern-world#u09-c3
    heading: 'Toussaint L''Ouverture and the defense of the Revolution'
    span: 255747:256155
    why: 'Establishes Haiti''s revolutionary army as an active shaper of the European war, not a passive periphery, and as the site of Napoleon''s first defeat on land.'
  - id: bayly-birth-of-the-modern-world#u09-c4
    heading: 'Gendered libel as delegitimization in France'
    span: 263769:264300
    why: 'Concrete evidence for the ''culture of opposition'' thesis: gendered scandal about Marie Antoinette is the mechanism by which the monarchy''s moral legitimacy, not just its finances, collapsed.'
  - id: bayly-birth-of-the-modern-world#u09-c5
    heading: 'Kuhn''s Soulstealers: apocalyptic rumor against the Confucian gentry'
    span: 269419:269911
    why: 'Bayly''s direct China/France comparison: popular millenarian rumor erodes scholar-gentry legitimacy the same way libelous print eroded the French court, but with a different target and pace.'
  - id: bayly-birth-of-the-modern-world#u09-c6
    heading: 'Wahhabism as the Islamic world''s revolution'
    span: 277471:277792
    why: 'Extends the ''age of revolutions'' frame explicitly to the Islamic world, positioning Wahhabism as a parallel legitimacy challenge that outlasted its military defeat.'
- nn: 10
  unit_id: ch03-ideological-origins-third-revolution
  note_id: bayly-birth-of-the-modern-world-ch03-ideological-origins-third-revolution
  span: 280458:321280
  chunks:
  - id: bayly-birth-of-the-modern-world#u10-c1
    heading: 'Napoleon''s confessional statecraft'
    span: 287269:287616
    why: 'Napoleon''s own words are Bayly''s clearest evidence that the post-revolutionary state''s power lay in performing whatever legitimating creed a population required, not in dynastic or confessional consistency.'
  - id: bayly-birth-of-the-modern-world#u10-c2
    heading: 'The globalized symbol of ‘the people’'
    span: 282726:283759
    why: 'Names the specific mechanism — a portable cultural template of popular rights — by which Bayly argues revolutionary ideology globalized faster than any formal political philosophy.'
  - id: bayly-birth-of-the-modern-world#u10-c3
    heading: 'Ranking humanity on a single civilizational ladder'
    span: 290261:291092
    why: 'Shows how Enlightenment universalism (Smith, Robertson) was operationalized as an administrative ladder ranking peoples, the ideological warrant for the improving interventions discussed later in the unit.'
  - id: bayly-birth-of-the-modern-world#u10-c4
    heading: 'Calcutta reasons its way to Indian nationhood'
    span: 302337:302950
    why: 'The concrete case behind Bayly''s claim that circulating news, not just conquest, forged new identities — Bengali intellectuals inferring a right to Indian nationhood from Irish and Genoese precedents.'
  - id: bayly-birth-of-the-modern-world#u10-c5
    heading: 'Defining the ‘third revolution’'
    span: 304144:305559
    why: 'States the unit''s most original claim in its own terms: a global, pre-industrial third revolution of commercial middle-class formation distinct from the industrial revolution proper.'
  - id: bayly-birth-of-the-modern-world#u10-c6
    heading: 'Post-1815 equipoise, not restoration'
    span: 320393:321177
    why: 'The chapter''s closing judgment against reading 1815 as a restoration — the balance of forces remained unresolved, setting up the next chapter.'
- nn: 11
  unit_id: ch04-wreck-of-nations-and-trade
  note_id: bayly-birth-of-the-modern-world-ch04-wreck-of-nations-and-trade
  span: 321280:348550
  chunks:
  - id: bayly-birth-of-the-modern-world#u11-c1
    heading: 'The fragile post-Napoleonic order'
    span: 321370:321706
    why: 'States the chapter''s own framing of 1815-1865 as an unconsolidated interregnum between old and new orders, the interpretive spine for the whole unit.'
  - id: bayly-birth-of-the-modern-world#u11-c2
    heading: 'A genuinely global wreck of nations'
    span: 323262:323608
    why: 'Bayly''s core evidentiary claim that the post-revolutionary crisis was worldwide in reach, anchored by Tilly''s tenfold death-toll statistic.'
  - id: bayly-birth-of-the-modern-world#u11-c3
    heading: 'Cotton, cash crops, and fragile stability: Egypt'
    span: 335525:336588
    why: 'The unit''s fullest worked case of the cash-crop-export-to-political-stability mechanism that structures the trade section.'
  - id: bayly-birth-of-the-modern-world#u11-c4
    heading: 'Indentured emigration as a new system of slavery'
    span: 346130:346616
    why: 'Names the coerced underside of the emigration safety valve and cites Bayly''s specific historiographical source for the Asian bazaar-economy argument.'
  - id: bayly-birth-of-the-modern-world#u11-c5
    heading: 'Stability''s dark corollary: settler-indigenous war'
    span: 347633:348548
    why: 'The section''s explicit thesis that the same emigration which stabilized metropolitan politics produced the settler-indigenous wars of the 1850s-60s.'
- nn: 12
  unit_id: ch04-losers-legitimacy-and-state
  note_id: bayly-birth-of-the-modern-world-ch04-losers-legitimacy-and-state
  span: 348550:391500
  chunks:
  - id: bayly-birth-of-the-modern-world#u12-c1
    heading: 'Losers of the New International Division of Labor'
    span: 348984:349628
    why: 'Names the concrete regions and trades left behind by early-nineteenth-century globalization, the unit''s opening claim.'
  - id: bayly-birth-of-the-modern-world#u12-c2
    heading: 'Friedrich List''s National Political Economy'
    span: 356614:357215
    why: 'The unit''s clearest example of ideological resistance to British free-trade uniformity, spreading from Germany to Hungary, Ireland, and India.'
  - id: bayly-birth-of-the-modern-world#u12-c3
    heading: 'The Opium War as Free-Trade Moralizing versus Chinese Sovereignty'
    span: 358703:359886
    why: 'Stages Bayly''s central irony about British free-trade self-interest colliding with Qing efforts to police silver outflow and opium''s military and social harms.'
  - id: bayly-birth-of-the-modern-world#u12-c4
    heading: 'Code Napoleon and the Rationalized State'
    span: 365403:365894
    why: 'Shows restoration monarchies inheriting a sharper, more rationalized administrative apparatus from Napoleon regardless of dynasty, the unit''s clearest state-as-technology moment.'
  - id: bayly-birth-of-the-modern-world#u12-c5
    heading: 'Hybrid Colonial Legitimacy: The Mughal Figurehead'
    span: 374541:375031
    why: 'Illustrates the pattern of retaining indigenous constitutional appearance while leaving real political reorganization in colonial hands.'
  - id: bayly-birth-of-the-modern-world#u12-c6
    heading: '1848, Taiping, Indian Rebellion, and Civil War as One Crisis'
    span: 390213:391052
    why: 'The unit''s closing synthesis, linking four apparently separate mid-century upheavals into a single global climacteric that the rest of the chapter will unpack.'
- nn: 13
  unit_id: ch04-asian-and-european-revolutions
  note_id: bayly-birth-of-the-modern-world-ch04-asian-and-european-revolutions
  span: 391500:424868
  chunks:
  - id: bayly-birth-of-the-modern-world#u13-c1
    heading: 'Asia''s linked wars of legitimacy'
    span: 391624:393013
    why: 'States the unit''s framing claim that Ottoman, Javanese, Persian, and Chinese upheavals form one escalating sequence of legitimacy crisis, not separate national events.'
  - id: bayly-birth-of-the-modern-world#u13-c2
    heading: 'Three causal threads across the Asian revolutions'
    span: 397642:398525
    why: 'Gives Bayly''s explicit tripartite causal model (colonial reaction, ideological/religious tension, population pressure) that structures the rest of the unit''s argument.'
  - id: bayly-birth-of-the-modern-world#u13-c3
    heading: 'Revising 1848 from proletarian myth to peasant jacquerie'
    span: 408176:408667
    why: 'Marks Bayly''s historiographical pivot: displacing the classic Marxist reading of 1848 with a revisionist emphasis on rural and religious unrest, narrowing the Europe/Asia contrast.'
  - id: bayly-birth-of-the-modern-world#u13-c4
    heading: 'Peasant invasions of forested commons'
    span: 410113:410725
    why: 'Concrete evidence for the revisionist claim that 1848''s rural unrest centered on enclosure and loss of common land, not urban proletarian class conflict.'
  - id: bayly-birth-of-the-modern-world#u13-c5
    heading: 'Moral economy across Indian and European weavers'
    span: 412765:413212
    why: 'Bayly''s most compressed comparative image, applying E. P. Thompson''s moral-economy concept across India and Europe in a single sentence.'
  - id: bayly-birth-of-the-modern-world#u13-c6
    heading: 'Direct causal chains, not mere comparison'
    span: 422721:423761
    why: 'States the unit''s thesis in miniature: Asian and European mid-century crises were bound by literal chains of imperial causation, exemplified by the Crimean War hinge.'
- nn: 14
  unit_id: ch04-civil-war-and-convergence
  note_id: bayly-birth-of-the-modern-world-ch04-civil-war-and-convergence
  span: 424868:450306
  chunks:
  - id: bayly-birth-of-the-modern-world#u14-c1
    heading: 'Cuba, Spain, and the Dominican Republic chain'
    span: 427451:428054
    why: 'Bayly''s clearest concrete chain of causation extending the Civil War''s effects to Cuba, Spain, and the Dominican Republic, the core evidence for calling the war a global event.'
  - id: bayly-birth-of-the-modern-world#u14-c2
    heading: 'The 1867 cotton crash radiates outward'
    span: 429483:430391
    why: 'Traces the same economic chain in reverse across four regions at once (Egypt, India, Russia), showing how one American shock produced multiple distinct political crises.'
  - id: bayly-birth-of-the-modern-world#u14-c3
    heading: 'State-building convergence: America, Italy, Germany, Japan'
    span: 432191:432503
    why: 'States explicitly the chapter''s convergence thesis: the war''s centralizing effect on the American state as one instance of a wider mid-century pattern of nation-building.'
  - id: bayly-birth-of-the-modern-world#u14-c4
    heading: 'Appadurai, localism, and the refusal to homogenize'
    span: 437362:437927
    why: 'Bayly''s most explicit statement of historiographical method, refusing to homogenize the era''s revolts and insisting on the primacy of local, particular experience.'
  - id: bayly-birth-of-the-modern-world#u14-c5
    heading: 'The myth of global rebellion as political artefact'
    span: 442953:444028
    why: 'Resolves the convergence-vs-fragment tension by arguing the myth of shared global struggle was itself a historical force, independent of how tenuous the real connections were.'
  - id: bayly-birth-of-the-modern-world#u14-c6
    heading: 'Reviewing the argument: the widening differential'
    span: 448215:448673
    why: 'The chapter''s summary verdict on the widening West/non-West power differential, the outcome the entire mid-century crisis sequence was building toward.'
- nn: 15
  unit_id: ch05-industrialization
  note_id: bayly-birth-of-the-modern-world-ch05-industrialization
  span: 450306:489503
  chunks:
  - id: bayly-birth-of-the-modern-world#u15-c1
    heading: 'Historians revise the industrial-worker narrative'
    span: 455336:456176
    why: 'Traces the historiographical shift from seeing industrial workers as a revolutionary vanguard to reading 1848, the Paris Commune, and 1905 as artisan or peasant events, grounding Bayly''s caution against assuming industrialization straightforwardly produced a new political class.'
  - id: bayly-birth-of-the-modern-world#u15-c2
    heading: 'Parthasarathi: British industrialization as a global response'
    span: 460670:461522
    why: 'States Bayly''s multi-centered-origins thesis directly: British industrialization is reframed as a defensive response to competitive Indian and French artisan textile production rather than an autonomous European breakthrough.'
  - id: bayly-birth-of-the-modern-world#u15-c3
    heading: 'Louis Napoleon''s rhetoric of productive empire'
    span: 469242:469745
    why: 'Louis Napoleon''s own words are Bayly''s evidence that French industrialization in the 1850s was consciously state-driven and politically self-legitimating, not a spontaneous market process.'
  - id: bayly-birth-of-the-modern-world#u15-c4
    heading: 'Qing opposition was about authority, not conservatism'
    span: 478502:478873
    why: 'Overturns the Orientalist "Confucian mind" explanation for China''s slow industrialization, relocating the cause in a specific anxiety about administrative and moral authority rather than blanket conservatism.'
  - id: bayly-birth-of-the-modern-world#u15-c5
    heading: 'Meiji Japan''s samurai-funded industrial push'
    span: 482393:482798
    why: 'Identifies the concrete fiscal mechanism (confiscated samurai pensions) and command of the countryside that let the Meiji state substitute for hesitant private investors, an activist-state case Bayly treats as decisive but historically contingent.'
  - id: bayly-birth-of-the-modern-world#u15-c6
    heading: 'The ''backward''/''advanced'' distinction is ''threadbare'''
    span: 487488:488361
    why: 'The chapter''s summary thesis: the artisan-versus-factory binary dissolves under scrutiny, and global inequality is best explained by regimes of money and military power rather than by a technological gap—the clearest statement of Bayly''s anti-teleological argument in this unit.'
- nn: 16
  unit_id: ch05-cities-and-urban-culture
  note_id: bayly-birth-of-the-modern-world-ch05-cities-and-urban-culture
  span: 489503:533599
  chunks:
  - id: bayly-birth-of-the-modern-world#u16-c1
    heading: 'The cosmological order of the pre-1780 city'
    span: 492961:493360
    why: 'Establishes the pre-1780 baseline of religiously and dynastically organized city space that the chapter''s later account of rupture and uniformization is measured against.'
  - id: bayly-birth-of-the-modern-world#u16-c2
    heading: 'Uniform cities, antagonistic identities'
    span: 525742:526674
    why: 'States Bayly''s ''contested uniformity'' thesis in miniature: disciplined, homogenized urban space produced by governments generated the very race and class antagonisms it was meant to contain.'
  - id: bayly-birth-of-the-modern-world#u16-c3
    heading: 'The city as a stage for state modernity'
    span: 528297:529847
    why: 'Shows non-European states (Ottoman, khedival Egypt) using boulevards and neoclassical architecture as a legible performance of modern statehood, the chapter''s clearest instance of the city as stagecraft.'
  - id: bayly-birth-of-the-modern-world#u16-c4
    heading: 'Colonial urban mortality below the peasantry'
    span: 505312:506275
    why: 'Gives the unit''s starkest empirical claim about colonial inequality — urban poverty could be more lethal than rural life — which Bayly attributes to institutional exclusion, not market forces alone.'
  - id: bayly-birth-of-the-modern-world#u16-c5
    heading: 'The ''myth'' of a rising working-class consciousness'
    span: 511327:512315
    why: 'Bayly''s central historiographical intervention: the assumed rise of a unified, revolutionary working-class consciousness is a myth retrojected by contemporaries and inherited uncritically by earlier social historians.'
  - id: bayly-birth-of-the-modern-world#u16-c6
    heading: 'A shared itinerary of anti-colonial cafés and clubs'
    span: 523029:524472
    why: 'Captures the global convergence of anti-colonial leadership through a shared institutional itinerary of Western cities'' associational spaces, naming Gandhi, Ho Chi Minh, Sun Yat-sen, and Ambedkar.'
- nn: 17
  unit_id: ch06a-theories-of-nationalism
  note_id: bayly-birth-of-the-modern-world-ch06a-theories-of-nationalism
  span: 533599:567058
  chunks:
  - id: bayly-birth-of-the-modern-world#u17-c1
    heading: 'The paradox of globalization'
    span: 534777:535009
    why: 'States the chapter''s central paradox — hardening national and imperial boundaries after 1860 driving, not blocking, cross-border linkage — the interpretive key to everything that follows.'
  - id: bayly-birth-of-the-modern-world#u17-c2
    heading: 'Gellner''s modernization theory and its limits'
    span: 540006:541101
    why: 'Lays out Gellner''s urbanization/industrialization thesis of nationalism and immediately flags its geographic limits, showing Bayly testing each theory''s fit rather than adopting one wholesale.'
  - id: bayly-birth-of-the-modern-world#u17-c3
    heading: 'Nationalism as a product of the state'
    span: 541103:542226
    why: 'States the Hobsbawm/Breuilly thesis that the state manufactures nationalism through concrete legibility technologies — census, passport, education, citizenship — bearing directly on the state-as-infrastructure theme.'
  - id: bayly-birth-of-the-modern-world#u17-c4
    heading: 'Anderson''s imagined communities'
    span: 542374:543158
    why: 'Gives Anderson''s imagined-communities/print-capitalism thesis in Bayly''s own words along with its distinctive explanatory advantage: accounting for nationalism absent prior capitalism or state strength.'
  - id: bayly-birth-of-the-modern-world#u17-c5
    heading: 'State-created nationalisms'
    span: 555099:556200
    why: 'Anchors Bayly''s spectrum of nationalism types at its state-created pole with concrete cases (Britain, Belgium, Latin America, USA), the load-bearing evidence for his claim that origins vary systematically by case.'
  - id: bayly-birth-of-the-modern-world#u17-c6
    heading: 'Print, telegraph, and the capture of communications'
    span: 565300:565854
    why: 'Names the paradox that communications infrastructure meant to build shared national publics was captured and filtered by governments and news syndicates, the clearest instance of the uniformity/difference dynamic applied to media.'
- nn: 18
  unit_id: ch06b-empires-to-peoples-without-states
  note_id: bayly-birth-of-the-modern-world-ch06b-empires-to-peoples-without-states
  span: 567058:613077
  chunks:
  - id: bayly-birth-of-the-modern-world#u18-c1
    heading: 'The three-stage proposition about nationalism''s emergence'
    span: 583755:584818
    why: 'States Bayly''s organizing typology for how nationalism spread across different empires and timelines, replacing a simple Europe/non-Europe divide.'
  - id: bayly-birth-of-the-modern-world#u18-c2
    heading: 'Gellner''s "navels": nations with and without prior patriotic roots'
    span: 587016:588160
    why: 'Bayly''s clearest statement on whether nations require continuity with older patriotisms, illustrated through the US constitution, English common law, and Zionism.'
  - id: bayly-birth-of-the-modern-world#u18-c3
    heading: 'The Ottoman millet system as difference-management'
    span: 590848:591430
    why: 'Describes the pre-national model of managing religious and ethnic difference through semi-autonomous communities under a universal monarch, the baseline against which the later "nationality problem" is measured.'
  - id: bayly-birth-of-the-modern-world#u18-c4
    heading: 'Colonial legibility technologies manufacture ethnic difference'
    span: 600391:601030
    why: 'Shows the census, law, and anthropology actively constructing (not merely recording) Hindu/Muslim/Sikh difference in colonial India, the unit''s sharpest legibility-as-machine passage.'
  - id: bayly-birth-of-the-modern-world#u18-c5
    heading: 'Nation-making and minority-making as a single process'
    span: 612132:613075
    why: 'The unit''s closing thesis: majority nation-building and minority formation are mirror images of one process, with minority leaderships as active participants rather than passive victims.'
  - id: bayly-birth-of-the-modern-world#u18-c6
    heading: 'Edward Blyden''s pan-African vision'
    span: 577317:577921
    why: 'The unit''s only sustained first-person nationalist voice, showing pan-Africanism built from the same borrowed vocabulary of race, progress, and religion found in every other case in the unit.'
- nn: 19
  unit_id: ch06c-new-imperialism-and-internationalism
  note_id: bayly-birth-of-the-modern-world-ch06c-new-imperialism-and-internationalism
  span: 613077:662962
  chunks:
  - id: bayly-birth-of-the-modern-world#u19-c1
    heading: 'Imperialism and nationalism as one phenomenon'
    span: 620463:621228
    why: 'States Bayly''s central corrective to monocausal (economic, diplomatic) theories of the new imperialism: imperialism and nationalism were the same phenomenon.'
  - id: bayly-birth-of-the-modern-world#u19-c2
    heading: 'The nation-state''s defining trait: existing among rivals'
    span: 632424:633273
    why: 'Relocates the nation-state''s essence to inter-state rivalry as the source of pressure toward global uniformity, directly naming the erosion of "archaic globalization" from chapter 1.'
  - id: bayly-birth-of-the-modern-world#u19-c3
    heading: 'Archaic globalization''s persistence beneath the new order'
    span: 635325:636658
    why: 'Shows the pre-1780 exotic-goods and status economy (gold, spices, curiosities) surviving intact underneath the new national-international order, the unit''s key complication of any clean rupture narrative.'
  - id: bayly-birth-of-the-modern-world#u19-c4
    heading: 'Contested uniformity of bodily practice'
    span: 647557:648732
    why: 'Bayly''s most explicit single-sentence statement of the paradox that international standardization of dress and manners coincided with hardening national antagonism.'
  - id: bayly-birth-of-the-modern-world#u19-c5
    heading: 'Vivekananda and the nationalization of Hinduism'
    span: 655582:656732
    why: 'Concrete case study of a universalist religious platform captured and redirected into an assertion of Indian nationhood, the unit''s clearest illustration of religion-as-nationalism.'
  - id: bayly-birth-of-the-modern-world#u19-c6
    heading: 'The paradox of the nation-state as rights-guarantor'
    span: 661786:662786
    why: 'Closes the unit''s argument: the gap between statesmen''s monolithic nation and popular expectations of rights drove the voluntary-association and internationalist upsurge of the era.'
- nn: 20
  unit_id: ch07a-defining-the-modern-state
  note_id: bayly-birth-of-the-modern-world-ch07a-defining-the-modern-state
  span: 662962:687940
  chunks:
  - id: bayly-birth-of-the-modern-world#u20-c1
    heading: 'The modern state as uniformizing technology'
    span: 664674:665382
    why: 'Bayly''s core operating definition of the modern state — legible territorial control plus a monopolistic claim on subjects'' loyalty — sets the terms for the whole chapter.'
  - id: bayly-birth-of-the-modern-world#u20-c2
    heading: 'Steamroller and idea: the state''s double nature'
    span: 666429:666790
    why: 'States the chapter''s title thesis directly: the modern state is simultaneously a technology and a myth with its own ideological force.'
  - id: bayly-birth-of-the-modern-world#u20-c3
    heading: 'Scott, Foucault, and the historiography of state power'
    span: 677413:678180
    why: 'Names the two theorists — Scott''s ordering/legibility urge and Foucault''s governmentality — whose frameworks most directly inform a WMP-style reading of the state as infrastructure.'
  - id: bayly-birth-of-the-modern-world#u20-c4
    heading: 'The state as a myth magicked into existence'
    span: 683012:684201
    why: 'Bayly''s clearest statement that outside strong-state Europe, ''statishness'' was an appropriable performance staged by companies, missionaries, and millenarian movements rather than a hard institutional fact.'
  - id: bayly-birth-of-the-modern-world#u20-c5
    heading: 'Five forms of statishness outside the centralized state'
    span: 686650:687938
    why: 'Closes the chapter''s opening argument with a typology showing sovereignty as diffused, contested, and unevenly realized rather than a single global convergence.'
- nn: 21
  unit_id: ch07b-typology-of-eurasian-states
  note_id: bayly-birth-of-the-modern-world-ch07b-typology-of-eurasian-states
  span: 687940:719867
  chunks:
  - id: bayly-birth-of-the-modern-world#u21-c1
    heading: 'Against the diffusionist model'
    span: 687994:688595
    why: 'States the unit''s revisionist thesis: the standard Europe-outward diffusion story of the modern state is ''only a partial picture.'''
  - id: bayly-birth-of-the-modern-world#u21-c2
    heading: 'Diffusion ran both ways'
    span: 692763:693315
    why: 'Shows colonial administrative techniques (civil service, fingerprinting) flowing back to reshape the metropole, reversing the diffusionist arrow.'
  - id: bayly-birth-of-the-modern-world#u21-c3
    heading: 'Hybrid Eurasian state-building under Company pressure'
    span: 701326:702518
    why: 'Names the second geographic sector — new buffer states forging hybrid bureaucracies partly in response to the East India Company''s own hybrid polity.'
  - id: bayly-birth-of-the-modern-world#u21-c4
    heading: 'Religion welded into the reformed Muslim state'
    span: 704588:705278
    why: 'Defines the third sector''s distinguishing feature: the ulama and Sufi lineages fused into state structure rather than kept apart from it.'
  - id: bayly-birth-of-the-modern-world#u21-c5
    heading: 'Foucault and the state''s monopoly of punishment'
    span: 715608:716621
    why: 'Names Foucault directly to frame the state''s new claim to define and punish ''anti-social'' behavior as intervention into previously local or religious jurisdiction.'
  - id: bayly-birth-of-the-modern-world#u21-c6
    heading: 'The paradox of state power'
    span: 718715:719865
    why: 'Closes the unit with its governing paradox: the state''s universal claim to authority is everywhere locally contestable and capturable.'
- nn: 22
  unit_id: ch07c-state-resources-and-obligations
  note_id: bayly-birth-of-the-modern-world-ch07c-state-resources-and-obligations
  span: 719867:745357
  chunks:
  - id: bayly-birth-of-the-modern-world#u22-c1
    heading: 'The 1780-1914 reversal of state power'
    span: 719952:720821
    why: 'States the unit''s thesis in miniature: the state''s dramatic 1780-1914 gain in coercive and administrative capacity, plus Bayly''s aside that states and nations mutually constituted each other.'
  - id: bayly-birth-of-the-modern-world#u22-c2
    heading: 'State-building as plunder'
    span: 723127:723760
    why: 'Bayly''s demystifying claim that state formation was fundamentally an act of plunder obscured by collaborators, cutting against myths of legitimate state-founding.'
  - id: bayly-birth-of-the-modern-world#u22-c3
    heading: 'Meiji Japan''s fiscal-military transformation'
    span: 731631:732540
    why: 'Shows military defeat forcing the concrete legibility operation of collapsing samurai, peasant, and daimyo status distinctions into uniform ''Japanese subjects.'''
  - id: bayly-birth-of-the-modern-world#u22-c4
    heading: 'The obligations thesis'
    span: 736199:736628
    why: 'States the second half of the unit''s argument: new state claims on resources generated matching, if erratic, obligations to society, continuous with older forms of state charity.'
  - id: bayly-birth-of-the-modern-world#u22-c5
    heading: 'Bismarck''s welfare state as political weapon'
    span: 742369:743823
    why: 'Demonstrates that the paradigm welfare-state reform was designed to out-compete socialist and Catholic rivals for working-class loyalty, not pure benevolence.'
  - id: bayly-birth-of-the-modern-world#u22-c6
    heading: 'Colonial exclusion from the welfare bargain'
    span: 743826:744133
    why: 'The sharpest statement of the unit''s central asymmetry: resources were extracted from colonial subjects while reciprocal obligations were withheld, justified by explicit racism.'
- nn: 23
  unit_id: ch07d-tools-economy-and-balance-sheet
  note_id: bayly-birth-of-the-modern-world-ch07d-tools-economy-and-balance-sheet
  span: 745357:773657
  chunks:
  - id: bayly-birth-of-the-modern-world#u23-c1
    heading: 'Warfare and the mapping of France, Britain, and India'
    span: 747455:749009
    why: 'Shows that the era''s signature cartographic achievements (Ecole Polytechnique, Ordnance Survey, Survey of India) grew directly out of artillery and naval requirements, not abstract scientific curiosity.'
  - id: bayly-birth-of-the-modern-world#u23-c2
    heading: 'Surveys as symbolic dominion'
    span: 749142:749696
    why: 'States plainly that mapping functioned as an act of conquest and renaming, not just measurement, linking India, Ireland, and the American West as one pattern.'
  - id: bayly-birth-of-the-modern-world#u23-c3
    heading: 'Governmentality outruns the state'
    span: 767592:768044
    why: 'The balance sheet''s key analytical distinction: administrative/bureaucratic capacity could grow independently of, even against, the ideology of a small central state.'
  - id: bayly-birth-of-the-modern-world#u23-c4
    heading: 'State, nation, and the manufacture of lineage'
    span: 764012:765480
    why: 'Bayly''s revision of Hobsbawm and his catalogue of the concrete bureaucratic instruments (textbooks, novels, rituals) used to construct national sentiment.'
  - id: bayly-birth-of-the-modern-world#u23-c5
    heading: 'Nationalism from below, not just from above'
    span: 765482:767162
    why: 'Bayly''s explicit argument against reading nationalism as purely elite-manufactured, using Meiji Japan''s samurai societies as the clinching case of sentiment driving statesmen.'
  - id: bayly-birth-of-the-modern-world#u23-c6
    heading: 'Global mimicry of statist pageantry and its critics'
    span: 772813:773655
    why: 'Closes the chapter by universalizing statist pageantry beyond the great powers and naming the anti-statist reaction (Ruskin, Tolstoy, Gandhi) it provoked.'
- nn: 24
  unit_id: ch08-righteous-republics
  note_id: bayly-birth-of-the-modern-world-ch08-righteous-republics
  span: 773657:793786
  chunks:
  - id: bayly-birth-of-the-modern-world#u24-c1
    heading: 'Chapter thesis: ideas recast, not simply diffused'
    span: 773744:774285
    why: 'States the chapter''s governing claim that liberalism, socialism, and science lost their revolutionary character in transit while competing religious systems shaped mentality more.'
  - id: bayly-birth-of-the-modern-world#u24-c2
    heading: 'Naming the righteous republic as a global theme'
    span: 778004:778961
    why: 'Introduces the unit''s organizing concept, the widespread pre-revolutionary ''righteous republic'' ideal spanning Eurasia, Africa, and the Americas.'
  - id: bayly-birth-of-the-modern-world#u24-c3
    heading: 'Civic republicanism against the market, not against the state'
    span: 781166:781949
    why: 'Specifies what civic republicanism actually valorized (household, virtue) and opposed (corruption, luxury, commerce), correcting the assumption that it anticipated free-market liberalism.'
  - id: bayly-birth-of-the-modern-world#u24-c4
    heading: 'Righteous rule as live legitimacy discourse in Japan'
    span: 788078:789014
    why: 'Shows the anti-corruption righteous-republic theme operating as active political legitimacy all the way into the 1868 Meiji restoration, not as mere antiquarian residue.'
  - id: bayly-birth-of-the-modern-world#u24-c5
    heading: 'Explicit connection to the Muslim world via Aristotle'
    span: 789784:791087
    why: 'The unit''s clearest claim of a direct (not merely analogous) intellectual link between Atlantic civic republicanism and non-European political ethics, via a shared Aristotelian inheritance.'
  - id: bayly-birth-of-the-modern-world#u24-c6
    heading: 'Rejecting the secular-Europe/religious-rest dichotomy'
    span: 792786:793304
    why: 'Delivers the unit''s methodological payoff: European liberal and socialist thought was itself steeped in religion, and non-European ''religion'' functioned as practical political ethics, not mere mentality.'
- nn: 25
  unit_id: ch08-liberalism-land-trade
  note_id: bayly-birth-of-the-modern-world-ch08-liberalism-land-trade
  span: 793786:830831
  chunks:
  - id: bayly-birth-of-the-modern-world#u25-c1
    heading: 'Hume and Kant erode the religious warrant for authority'
    span: 795802:797162
    why: 'Shows the specific mechanism of Western intellectual rupture Bayly wants to isolate: Humean skepticism eroding the religious warrant for political authority without any anti-religious intent.'
  - id: bayly-birth-of-the-modern-world#u25-c2
    heading: 'Ram Mohun Roy as the first Indian liberal'
    span: 803334:804590
    why: 'The unit''s central case of non-Western creative re-authorship of liberalism, fusing Mughal, Hindu-reformist and free-trade sources into an original politics rather than mere imitation.'
  - id: bayly-birth-of-the-modern-world#u25-c3
    heading: 'Anti-feudal liberalism founds a new hierarchy'
    span: 810590:811203
    why: 'States directly the unit''s key paradox: liberal anti-feudalism replacing embodied hierarchy with a new hierarchy of races and cultures ranked by enlightenment and commerce.'
  - id: bayly-birth-of-the-modern-world#u25-c4
    heading: 'The pact between liberal bureaucrats and landowners'
    span: 817177:817851
    why: 'Explains the practical mechanism, a landlord-bureaucrat pact, by which liberal land reform stalled almost everywhere despite ideological hostility to feudal estates.'
  - id: bayly-birth-of-the-modern-world#u25-c5
    heading: 'Terra nullius and the stages-of-history doctrine'
    span: 821548:822807
    why: 'The sharpest statement of how liberal property theory, applied only to legible, taxable forms of land use, licensed the dispossession of nomadic and hunter-gatherer peoples worldwide.'
  - id: bayly-birth-of-the-modern-world#u25-c6
    heading: 'Economic nationalism predates political nationalism'
    span: 828167:828953
    why: 'Makes the unit''s least obvious claim: that economic nationalism against free trade, rooted in older institutions like the Cohong and Mughal self-sufficiency ideals, often predated organized political nationalism.'
- nn: 26
  unit_id: ch08-representation-secularism-socialism
  note_id: bayly-birth-of-the-modern-world-ch08-representation-secularism-socialism
  span: 830831:864175
  chunks:
  - id: bayly-birth-of-the-modern-world#u26-c1
    heading: 'Popular sovereignty without popular government'
    span: 830857:832553
    why: 'States the chapter''s central paradox: the doctrine of popular sovereignty coexisted everywhere with deliberately narrow, elite-controlled franchises.'
  - id: bayly-birth-of-the-modern-world#u26-c2
    heading: 'Non-Western receptions of popular sovereignty'
    span: 839684:840921
    why: 'Shows existing consultative traditions (shura, gentry and Brahmin councils, veneration of the emperor) reshaping rather than simply importing Western representative theory, via Nakae Chomin and Kang Youwei.'
  - id: bayly-birth-of-the-modern-world#u26-c3
    heading: 'Women''s suffrage as contested political principle'
    span: 842978:844768
    why: 'Argues women''s exclusion from the franchise rested on articulated political theory, not just prejudice, and that frontier suffrage grants served patriarchal rather than rights-based logics.'
  - id: bayly-birth-of-the-modern-world#u26-c4
    heading: 'Comte''s positivism and its scientific successors'
    span: 848196:849801
    why: 'Defines positivism''s three-stage theory of history and traces its lineage into Durkheim''s sociology and Marx''s claim to scientific status, bridging into the socialism theme.'
  - id: bayly-birth-of-the-modern-world#u26-c5
    heading: 'Socialism as millenarian, not merely scientific'
    span: 853701:855092
    why: 'Undercuts socialism''s self-image as a science of history by tracing its debt to apocalyptic and Christian communitarian traditions, explaining its uneven, locally inflected reception.'
  - id: bayly-birth-of-the-modern-world#u26-c6
    heading: 'The shared rupture and its re-conjoining with older idioms'
    span: 863242:864173
    why: 'The unit''s thesis statement: liberalism, secularism, and socialism shared a post-1700 claim that the people alone constitute legitimacy, yet in popular translation everywhere fused with older millenarian religious languages.'
- nn: 27
  unit_id: ch08-science-professionalization
  note_id: bayly-birth-of-the-modern-world-ch08-science-professionalization
  span: 864175:900863
  chunks:
  - id: bayly-birth-of-the-modern-world#u27-c1
    heading: 'Indigenous knowledge expropriated into European science'
    span: 870390:871480
    why: 'Shows the great European taxonomic enterprise depended on, and often stole, indigenous data and expertise — the material basis for Bayly''s anti-diffusionist argument.'
  - id: bayly-birth-of-the-modern-world#u27-c2
    heading: 'Against the diffusion model: linked global networks'
    span: 889201:890139
    why: 'The unit''s central historiographical claim: professional science and medicine emerged in parallel, linked networks worldwide rather than diffusing outward from an exceptional West.'
  - id: bayly-birth-of-the-modern-world#u27-c3
    heading: 'Darwin''s shock and its non-Western uptake'
    span: 877060:877537
    why: 'Traces how Spencer''s social Darwinism was appropriated by Chinese, Indian, and Arab intellectuals worried about civilizational survival, with Japan as their proof of possibility.'
  - id: bayly-birth-of-the-modern-world#u27-c4
    heading: 'Japan''s parallel professionalization'
    span: 884623:886204
    why: 'Concrete case (print culture, bushido-to-professional-ethic conversion, world-class seismology) for the claim that non-Western scientific professionalization was independent achievement, not derivative imitation.'
  - id: bayly-birth-of-the-modern-world#u27-c5
    heading: 'Public health as state legibility'
    span: 894764:895084
    why: 'The unit''s sharpest image of professionalized medicine functioning as infrastructure for state legibility over populations, directly resonant with the world-machines legibility concept.'
  - id: bayly-birth-of-the-modern-world#u27-c6
    heading: 'Contested uniformity: race theory reappropriated locally'
    span: 899637:900330
    why: 'Closes the unit by showing a single globalizing scientific idiom (social Darwinism, race theory) producing divergent local meanings grafted onto pre-existing hierarchies — Bayly''s contested-uniformity thesis in miniature.'
- nn: 28
  unit_id: ch09-new-style-religion
  note_id: bayly-birth-of-the-modern-world-ch09-new-style-religion
  span: 900863:932876
  chunks:
  - id: bayly-birth-of-the-modern-world#u28-c1
    heading: 'The chapter''s counter-thesis: reemergence, not decline'
    span: 900895:901699
    why: 'States the chapter''s central counter-claim -- that the nineteenth century was an age of religious "reemergence," not decline -- which the rest of the unit exists to substantiate.'
  - id: bayly-birth-of-the-modern-world#u28-c2
    heading: 'The historians'' consensus: Weber, Chadwick, and the demystified world'
    span: 911718:912936
    why: 'Shows how Weber''s "demystification" thesis and Chadwick''s "secularisation of the European mind" hardened into an unexamined orthodoxy among historians, which is the very consensus Bayly is rebutting.'
  - id: bayly-birth-of-the-modern-world#u28-c3
    heading: 'Tactical retreat as the mechanism of revival'
    span: 915356:916766
    why: 'The "fly in the wheel, not the wheel itself" line is Bayly''s sharpest formulation of the idea that visible secularizing concessions masked a deeper program of religious standardization and expansion.'
  - id: bayly-birth-of-the-modern-world#u28-c4
    heading: 'Modes of religious dominion: down and outward'
    span: 924590:925339
    why: 'States directly the twin mechanism of religious "empire" -- disciplining heterodox practice internally while expanding geographically -- that gives the chapter''s next section its title.'
  - id: bayly-birth-of-the-modern-world#u28-c5
    heading: 'Conversion on the convert''s own terms'
    span: 929435:930459
    why: 'Establishes that world-religion "victory" depended on local intermediaries capturing and reinterpreting missionary charisma, not on simple imposition from colonial or missionary centers.'
  - id: bayly-birth-of-the-modern-world#u28-c6
    heading: 'Reversing the question: how Christianity was converted'
    span: 931871:932874
    why: 'The unit''s closing move -- asking how Christianity was converted by the peoples who received it -- crystallizes Bayly''s argument that uniformity-building was reciprocal and still incomplete by 1914.'
- nn: 29
  unit_id: ch09-imperial-religions
  note_id: bayly-birth-of-the-modern-world-ch09-imperial-religions
  span: 932876:977827
  chunks:
  - id: bayly-birth-of-the-modern-world#u29-c1
    heading: 'The ancien régime in religion'
    span: 933235:933999
    why: 'States Bayly''s premise that pre-1780 religious authority was as fragmented and overlapping as ancien-régime politics, setting up the chapter''s account of nineteenth-century formalization.'
  - id: bayly-birth-of-the-modern-world#u29-c2
    heading: 'Separation from the state strengthens the churches'
    span: 936237:936780
    why: 'Names the chapter''s central paradox: religion''s expulsion from state power freed priests and mullahs to become guardians of the poor and of ''true'' spiritual values.'
  - id: bayly-birth-of-the-modern-world#u29-c3
    heading: 'Papal Infallibility, 1870'
    span: 941465:941803
    why: 'The single most concrete instance of religious authority formalizing and centralizing in direct parallel with contemporary state bureaucratization.'
  - id: bayly-birth-of-the-modern-world#u29-c4
    heading: 'Inventing Confucianism as a religion'
    span: 949371:950120
    why: 'Shows Confucianism being consciously remade into a bounded ''religion'' on the Christian model by Kang Youwei and Sun Yatsen, evidence for Bayly''s constructivist claim about ''imperial religions''.'
  - id: bayly-birth-of-the-modern-world#u29-c5
    heading: '‘Hinduism’ before the nineteenth century'
    span: 950533:951149
    why: 'Bayly''s clearest constructivist claim: ''Hinduism'' as a homogeneous religion is a nineteenth-century artifact, not a pre-existing entity, central to his ''imperial religions'' argument.'
  - id: bayly-birth-of-the-modern-world#u29-c6
    heading: 'Empires of religion as parallel to nation-states'
    span: 976935:977544
    why: 'Explicit thesis statement: reformed world religions and nation-states shared the same organizational logic of centralized authority, bureaucracy, and uniformity.'
- nn: 30
  unit_id: ch09-pilgrimage-print-nation
  note_id: bayly-birth-of-the-modern-world-ch09-pilgrimage-print-nation
  span: 977827:1011216
  chunks:
  - id: bayly-birth-of-the-modern-world#u30-c1
    heading: 'Steamships and the middle-class Hajj'
    span: 981471:981970
    why: 'Shows concretely how nineteenth-century transport technology converted a rare, dangerous ordeal into a mass pilgrimage available to a new social class.'
  - id: bayly-birth-of-the-modern-world#u30-c2
    heading: 'Anderson''s thesis extended from nation to religion'
    span: 989089:989424
    why: 'States the unit''s central analytical move: print standardized religion the same way Anderson argued it imagined the nation.'
  - id: bayly-birth-of-the-modern-world#u30-c3
    heading: 'Print as the maker of Hindu doctrine'
    span: 993512:993845
    why: 'The unit''s most radical claim — that a canonical ''doctrine'' did not preexist print but was substantially created by it.'
  - id: bayly-birth-of-the-modern-world#u30-c4
    heading: 'Sacred architecture and the book''s central theme'
    span: 999527:999923
    why: 'Bayly''s own signal that this passage states the book''s core uniformity argument, generalized here to architecture across multiple religions.'
  - id: bayly-birth-of-the-modern-world#u30-c5
    heading: 'Nationalism''s popular religious register'
    span: 1001549:1001953
    why: 'Directly states that elite secular nationalist rhetoric diverged from a popular politics fused with religious solidarity.'
  - id: bayly-birth-of-the-modern-world#u30-c6
    heading: 'The chapter''s net verdict on standardization'
    span: 1009627:1010057
    why: 'The unit''s concluding claim: world religions reached far more people by 1914, and even dissenting movements now defined themselves relative to that new standard.'
- nn: 31
  unit_id: ch10-arts-politics-and-hybridity
  note_id: bayly-birth-of-the-modern-world-ch10-arts-politics-and-hybridity
  span: 1011216:1036967
  chunks:
  - id: bayly-birth-of-the-modern-world#u31-c1
    heading: 'Art as Nation-Building'
    span: 1012937:1013602
    why: 'States Bayly''s core claim that named nineteenth-century artists treated art as constitutive of the nation rather than a mere reflection of it, giving the theme its clearest documentary support.'
  - id: bayly-birth-of-the-modern-world#u31-c2
    heading: 'Hybridity Against the Extinction Thesis'
    span: 1016917:1017728
    why: 'Names and then explicitly rejects the contemporary prediction (Coomaraswamy) that non-European art was dying, asserting hybrid adaptation as the actual outcome — the pivot of Bayly''s contested-uniformity argument.'
  - id: bayly-birth-of-the-modern-world#u31-c3
    heading: 'The Reverse Flow: Non-European Motifs into European Art'
    span: 1017838:1018365
    why: 'Shows global uniformity was not one-directional — Japonisme, Gauguin, and Picasso demonstrate non-European aesthetics reshaping European art itself.'
  - id: bayly-birth-of-the-modern-world#u31-c4
    heading: 'The Global Destruction of Sacral and Royal Art'
    span: 1023611:1024433
    why: 'Catalogues the worldwide dismantling of courtly and sacral art traditions through conquest and looting (Benin, Burma, the Ottoman potteries), grounding uniformity''s mechanism in violence rather than gradual diffusion alone.'
  - id: bayly-birth-of-the-modern-world#u31-c5
    heading: 'Commodification and the Demystification of Art'
    span: 1029112:1030065
    why: 'Traces art''s shift away from religious devotion toward market production across Asia, Africa, and Europe alike, the commodification side of Bayly''s contested-uniformity argument, framed explicitly through Weber.'
  - id: bayly-birth-of-the-modern-world#u31-c6
    heading: 'Mechanization''s Janus Face: The Arts and Crafts Movement'
    span: 1031647:1032591
    why: 'Shows mechanization did not uniformly destroy craft traditions — the Arts and Crafts Movement used industrial dyes and glass to stage an anti-industrial revival for an industrial-age middle-class audience.'
- nn: 32
  unit_id: ch10-emerging-nation-arts-and-outside-west
  note_id: bayly-birth-of-the-modern-world-ch10-emerging-nation-arts-and-outside-west
  span: 1036967:1065647
  chunks:
  - id: bayly-birth-of-the-modern-world#u32-c1
    heading: 'Revolutionary art as a universal grammar: David, Girodet, and Belley'
    span: 1039465:1040508
    why: 'States the unit''s central claim that French revolutionary iconography (David, Girodet''s portrait of Belley) became a self-consciously universal visual grammar exported far beyond France.'
  - id: bayly-birth-of-the-modern-world#u32-c2
    heading: 'Othering and ambivalence in European depictions of non-Europeans'
    span: 1046354:1048286
    why: 'The unit''s explicit engagement with Said''s critique of Orientalist art, complicated by Bayly''s claim that European artists'' ''othering'' was entangled with nostalgia for their own vanishing past.'
  - id: bayly-birth-of-the-modern-world#u32-c3
    heading: 'Contested global uniformity in architecture'
    span: 1059998:1062059
    why: 'Opens with the book''s key phrase ''contested global uniformity'' applied to the worldwide export of neoclassical and neo-Gothic state architecture.'
  - id: bayly-birth-of-the-modern-world#u32-c4
    heading: 'Haussmann''s Paris and colonial urban re-ordering in Cairo and Alexandria'
    span: 1062989:1064815
    why: 'Extends the architecture-as-state-power argument to colonial urban planning as a technology of spatial and social segregation, citing Timothy Mitchell.'
  - id: bayly-birth-of-the-modern-world#u32-c5
    heading: 'Japan''s self-directed adaptation: Hokusai and ukiyo-e'
    span: 1056089:1058009
    why: 'The unit''s clearest counter-example of successful indigenous adaptation to global artistic modernity, contrasted with dependency elsewhere in the chapter.'
  - id: bayly-birth-of-the-modern-world#u32-c6
    heading: 'From state iconography to ''the people'': van Gogh, Gauguin, cubism'
    span: 1054793:1056039
    why: 'Marks the pivot the unit describes after 1850, from state- and nation-facing art to art of ordinary people and eventually radical formal critique.'
- nn: 33
  unit_id: ch10-world-literature-and-conclusion
  note_id: bayly-birth-of-the-modern-world-ch10-world-literature-and-conclusion
  span: 1065647:1085846
  chunks:
  - id: bayly-birth-of-the-modern-world#u33-c1
    heading: 'Genre variety before 1850, and its erosion'
    span: 1065674:1066153
    why: 'States Bayly''s baseline claim that pre-1850 genre diversity was tied to religious/ideological variety, against which the post-1850 turn to uniformity is measured.'
  - id: bayly-birth-of-the-modern-world#u33-c2
    heading: 'Imperial destruction of non-European literary heritage'
    span: 1071384:1072207
    why: 'Names the concrete losses (Delhi, Jogjakarta, Sulu, Cairo, Beijing, First Nations oral traditions) that made literary convergence partly a story of destruction, not only adaptation.'
  - id: bayly-birth-of-the-modern-world#u33-c3
    heading: 'The novel and the standardized national language'
    span: 1078031:1078799
    why: 'Directly links the realist novel and nationalist press to the deliberate standardization of a vernacular national language, the passage''s clearest evidence for the print/nationalism resonance.'
  - id: bayly-birth-of-the-modern-world#u33-c4
    heading: 'The vanishing of guild-and-patronage art'
    span: 1081030:1081400
    why: 'Marks the functional shift in art''s social basis, from ecclesiastical/aristocratic patronage to an impersonal market, that underlies the chapter''s conclusion.'
  - id: bayly-birth-of-the-modern-world#u33-c5
    heading: 'Uniformity worse than the great conquerors'
    span: 1081402:1081939
    why: 'Bayly''s most vivid single sentence in the unit, claiming that standardization and marketization did more damage to non-European high art than historical conquest.'
  - id: bayly-birth-of-the-modern-world#u33-c6
    heading: 'Against a unilinear art history'
    span: 1085032:1085759
    why: 'Bayly''s explicit methodological caution that the old order persisted visibly into 1900, resisting a straight-line reading toward modernism.'
- nn: 34
  unit_id: ch11-historiography-and-gender
  note_id: bayly-birth-of-the-modern-world-ch11-historiography-and-gender
  span: 1085846:1109318
  chunks:
  - id: bayly-birth-of-the-modern-world#u34-c1
    heading: 'Arno Mayer and the persistence of the old regime'
    span: 1088773:1089841
    why: 'Names the book and thesis (1914 Europe resembled 1789 more than 1945) that reorients the chapter''s whole historiographical framing away from liberal-triumph narratives.'
  - id: bayly-birth-of-the-modern-world#u34-c2
    heading: 'Defining ''hierarchies'''
    span: 1086830:1087382
    why: 'Gives the chapter''s operative definition of hierarchy, extending it beyond monarchy to oligarchic republics and non-European chiefly councils.'
  - id: bayly-birth-of-the-modern-world#u34-c3
    heading: 'Why hierarchies were selected for survival'
    span: 1098460:1098888
    why: 'States the chapter''s causal thesis directly: hierarchies persisted because they were useful amid uniformity-and-complexity, or simply because they were valued.'
  - id: bayly-birth-of-the-modern-world#u34-c4
    heading: 'Modernity re-empowering hierarchy'
    span: 1108728:1109316
    why: 'The gender section''s culminating claim, generalizing the paradox to other subordinated classes and tying gender to the survival of slavery and bondage.'
  - id: bayly-birth-of-the-modern-world#u34-c5
    heading: 'The Age of Consent Bill as imperial self-justification'
    span: 1106976:1107570
    why: 'Sharpest concrete evidence that colonial ''women''s issues'' reform functioned as discursive imperial legitimation rather than a sustained remedy.'
- nn: 35
  unit_id: ch11-slavery-and-bond-serfdom
  note_id: bayly-birth-of-the-modern-world-ch11-slavery-and-bond-serfdom
  span: 1109318:1148200
  chunks:
  - id: bayly-birth-of-the-modern-world#u35-c1
    heading: 'Global legal and religious legitimation of slavery'
    span: 1109466:1110220
    why: 'Establishes the unit''s opening claim that slavery''s nineteenth-century survival rested on near-universal legal and religious sanction, not just Atlantic economic inertia.'
  - id: bayly-birth-of-the-modern-world#u35-c2
    heading: 'The 1780s as the slave trade''s all-time peak'
    span: 1112147:1112814
    why: 'Undercuts any simple narrative of Enlightenment-driven decline by dating the slave trade''s numerical peak to the same decade as its supposed breakthrough into modernity.'
  - id: bayly-birth-of-the-modern-world#u35-c3
    heading: 'Planter ideology as anti-capitalist patriarchy'
    span: 1122371:1122854
    why: 'Carries Genovese''s argument that slaveholders defended bondage as a bulwark against capitalist modernity even as it fed capitalist markets.'
  - id: bayly-birth-of-the-modern-world#u35-c4
    heading: 'Metcalfe''s Jamaica/India comparison'
    span: 1132501:1132801
    why: 'The pivot passage that licenses treating the condition of the free Indian peasant as a form of bond-serfdom comparable to slavery.'
  - id: bayly-birth-of-the-modern-world#u35-c5
    heading: 'Dependency theory versus the dual economy'
    span: 1133988:1134465
    why: 'States the unit''s rival explanatory framework—Frank/Wallerstein dependency theory—for why peasant poverty deepened under nineteenth-century capitalism and empire.'
  - id: bayly-birth-of-the-modern-world#u35-c6
    heading: 'State power, not just markets, deepens hierarchy'
    span: 1144757:1145128
    why: 'Bayly''s clearest claim that administratively modernizing states, not only economic need, reconstitute hierarchy—explicitly paralleled with Genovese''s account of the American South.'
- nn: 36
  unit_id: ch11-peasant-mobility-and-gentry-adaptation
  note_id: bayly-birth-of-the-modern-world-ch11-peasant-mobility-and-gentry-adaptation
  span: 1148200:1176473
  chunks:
  - id: bayly-birth-of-the-modern-world#u36-c1
    heading: 'End-of-century convergence on stabilizing peasant landownership'
    span: 1153843:1154680
    why: 'Names Bayly''s turn-of-the-century convergence — Russia, the Ottoman Empire, British/French colonies, and southern Europe all choosing to stabilize peasant landownership rather than eliminate the peasantry — his signature comparative-global method in miniature.'
  - id: bayly-birth-of-the-modern-world#u36-c2
    heading: 'The "sack of potatoes": why peasants couldn''t bargain'
    span: 1155556:1156604
    why: 'States the unit''s central causal claim for why rural subordination outlived nineteenth-century reform: peasant political weakness rather than the absence of alternatives, reinforced by the forward glance to Stalin''s kulaks.'
  - id: bayly-birth-of-the-modern-world#u36-c3
    heading: 'Britain''s tributary peasantry and the global periphery'
    span: 1157220:1158212
    why: 'Makes Bayly''s global-versus-national argument concrete: ''peripheral'' tributary peasantries (Highland Scotland, Ireland, India, Java, the Congo) were structurally central, not marginal, to industrializing metropoles.'
  - id: bayly-birth-of-the-modern-world#u36-c4
    heading: 'The Chinese gentry rebuild the baojia militia'
    span: 1169193:1169747
    why: 'Shows the mechanism of gentry survival in action — the Chinese scholar-gentry converting the Taiping crisis into renewed local militia and taxation power rather than being destroyed by it.'
  - id: bayly-birth-of-the-modern-world#u36-c5
    heading: 'The Meiji settlement and the samurai''s conversion'
    span: 1173075:1173697
    why: 'The Japanese counterpart case: formal abolition of feudal privilege that nonetheless left the samurai''s social and economic position intact through conversion into bureaucratic and business careers.'
  - id: bayly-birth-of-the-modern-world#u36-c6
    heading: 'Colonial land law captured by landlords'
    span: 1175297:1175969
    why: 'Documents a colonial legibility reform (simple, saleable land titles replacing customary tenure) being captured by landed intermediaries for their own power rather than the state''s — a complication for any clean legibility-equals-control reading.'
- nn: 37
  unit_id: ch11-european-elites-and-conclusion
  note_id: bayly-birth-of-the-modern-world-ch11-european-elites-and-conclusion
  span: 1176473:1196075
  chunks:
  - id: bayly-birth-of-the-modern-world#u37-c1
    heading: 'Elite Conversion, Not Collapse'
    span: 1179042:1179662
    why: 'States the unit''s core mechanism for elite survival across three countries: converting inherited status into new-regime roles rather than resisting change.'
  - id: bayly-birth-of-the-modern-world#u37-c2
    heading: 'Britain''s Aristocracy Outlasts Democratization'
    span: 1180223:1180883
    why: 'Gives the unit''s sharpest quantitative evidence that formal democratization and actual elite land and power dominance proceeded on different timelines.'
  - id: bayly-birth-of-the-modern-world#u37-c3
    heading: 'Monarchy''s Functional Utility'
    span: 1186313:1186668
    why: 'The unit''s explicit rebuttal of the ''ancien-regime survival'' reading of nineteenth-century monarchy, recasting courts as functional political technology.'
  - id: bayly-birth-of-the-modern-world#u37-c4
    heading: 'Ritual Intensifies as Power Recedes: Queen Victoria'
    span: 1190826:1191910
    why: 'The unit''s fullest case of ritual and charismatic authority growing more elaborate precisely as constitutional power narrows, embodying the chapter''s continuity-through-change paradox.'
  - id: bayly-birth-of-the-modern-world#u37-c5
    heading: 'The Ottoman Empire Reconsidered as a ''Long Peace'''
    span: 1193563:1194288
    why: 'Extends the monarchy-as-functional-mediator argument outside Europe and shows Bayly weighing a revisionist historiography against its own limits.'
  - id: bayly-birth-of-the-modern-world#u37-c6
    heading: 'Continuity or Change? -- the Chapter''s Thesis'
    span: 1194636:1196073
    why: 'The chapter''s explicit synthesis statement and the unit''s culminating argument, reconciling the transformation and persistence historiographies.'
- nn: 38
  unit_id: ch12-native-peoples-context-and-hiatus
  note_id: bayly-birth-of-the-modern-world-ch12-native-peoples-context-and-hiatus
  span: 1196075:1224364
  chunks:
  - id: bayly-birth-of-the-modern-world#u38-c1
    heading: 'Defining "native peoples"'
    span: 1197855:1199474
    why: 'This is Bayly''s operative definition for the chapter''s central category, plus his own account of its porous, non-ethnic boundaries.'
  - id: bayly-birth-of-the-modern-world#u38-c2
    heading: 'The cultural terms of trade turn against small groups'
    span: 1200060:1200613
    why: 'States the chapter''s core diagnosis of why leverage was lost: a shift in "cultural terms of trade" favoring any surplus-producing settled society, not only Europeans.'
  - id: bayly-birth-of-the-modern-world#u38-c3
    heading: 'Warrior-nomads who became rulers'
    span: 1209727:1210165
    why: 'Illustrates the pre-1820 leverage native/tribal peoples held by naming cases where they seized state power outright, complicating a simple destruction narrative.'
  - id: bayly-birth-of-the-modern-world#u38-c4
    heading: 'The chapter''s three-phase periodization'
    span: 1211288:1212269
    why: 'Bayly''s own explicit periodization (1780-1820 first inroads, 1830-1890 deluge, post-1870 assimilation/reservation) that structures the rest of the chapter and this unit''s two named sections.'
  - id: bayly-birth-of-the-modern-world#u38-c5
    heading: 'Land hunger drives the White Deluge'
    span: 1219777:1220987
    why: 'Names land hunger, and specifically the imposition of private property in land, as the decisive mechanism converting 1840s settlement into systematic dispossession.'
  - id: bayly-birth-of-the-modern-world#u38-c6
    heading: 'US reservations and demographic collapse'
    span: 1223099:1223699
    why: 'Gives a concrete, citable demographic outcome of the White Deluge in the US case: reservation policy plus railroad expansion halved the Native American population 1850-1890.'
- nn: 39
  unit_id: ch12-deluge-in-practice-and-marginalization
  note_id: bayly-birth-of-the-modern-world-ch12-deluge-in-practice-and-marginalization
  span: 1224364:1250441
  chunks:
  - id: bayly-birth-of-the-modern-world#u39-c1
    heading: 'New Zealand''s demographic reversal, 1842-1896'
    span: 1225874:1226425
    why: 'The census figures anchor Bayly''s abstract ''deluge'' claim in a single, checkable numerical reversal of settler and Maori populations.'
  - id: bayly-birth-of-the-modern-world#u39-c2
    heading: 'Centralized polities resisted; decentralized ones eroded'
    span: 1229617:1229969
    why: 'States the unit''s organizing comparative thesis: a people''s political centralization, not the justice of their cause, set the tempo of dispossession.'
  - id: bayly-birth-of-the-modern-world#u39-c3
    heading: 'Trusteeship as counting, classifying, sectioning off'
    span: 1245414:1246161
    why: 'Names the state''s core administrative technique, enumeration and classification, applied to native peoples in the name of protection — the unit''s clearest legibility moment.'
  - id: bayly-birth-of-the-modern-world#u39-c4
    heading: 'Unchecked ecological depredation'
    span: 1248706:1249736
    why: 'Extends the deluge from human to natural populations, showing the same technologies of dispossession driving fur, whale, and forest stocks toward exhaustion.'
  - id: bayly-birth-of-the-modern-world#u39-c5
    heading: 'Anthropology''s ambivalent protection: ''living fossils'''
    span: 1244159:1244682
    why: 'Shows the paradox that the same scientific classification objectifying native peoples as specimens also became the legal basis for their protection.'
  - id: bayly-birth-of-the-modern-world#u39-c6
    heading: 'Hybrid mission communities and borrowed genealogies'
    span: 1238564:1239039
    why: 'Illustrates the syncretic, two-way character of early mission encounter before the unit shows it hardening into an instrument of assimilation.'
- nn: 40
  unit_id: ch13-predicting-crisis-and-new-imperialism
  note_id: bayly-birth-of-the-modern-world-ch13-predicting-crisis-and-new-imperialism
  span: 1250441:1279717
  chunks:
  - id: bayly-birth-of-the-modern-world#u40-c1
    heading: 'Bayly''s Own Table of Contents for the Conclusion'
    span: 1250502:1250809
    why: 'States in one sentence the four themes — multi-centric change, contested uniformity, connective velocity, and Western dominance and its challengers — that organize the whole concluding chapter.'
  - id: bayly-birth-of-the-modern-world#u40-c2
    heading: 'The Historiographical Swing Toward Continuity'
    span: 1254818:1255377
    why: 'Names the specific revisionist historians (Mayer, Robinson and Gallagher) whose work made ''new imperialism'' look like elite illusion rather than real rupture — the position Bayly''s chapter argues against.'
  - id: bayly-birth-of-the-modern-world#u40-c3
    heading: 'The Agricultural Depression Remakes the Elite'
    span: 1260646:1261198
    why: 'Gives Bayly''s concrete comparative evidence — British and German elites — for how the 1870s-80s grain-price collapse forced landed power into alliance with industrial and financial wealth.'
  - id: bayly-birth-of-the-modern-world#u40-c4
    heading: 'New Imperialism as Debt and Territory'
    span: 1264838:1265372
    why: 'Bayly''s clearest statement of what made post-1890 imperialism qualitatively new: Western creditors converting Ottoman and Egyptian debt directly into territorial control.'
  - id: bayly-birth-of-the-modern-world#u40-c5
    heading: 'Japan''s Victory as Global Psychological Rupture'
    span: 1270203:1270678
    why: 'Captures the chapter''s central causal claim: Japan''s defeat of Russia convinced colonized peoples worldwide, down to acts as intimate as naming newborns, that Western dominance was reversible.'
  - id: bayly-birth-of-the-modern-world#u40-c6
    heading: 'Two Ancient Monarchies Fall Together'
    span: 1278943:1279548
    why: 'Bayly frames the near-simultaneous 1908 Ottoman and 1911 Chinese revolutions as a single symbolic event proving that even the oldest ''stubbornly conservative'' empires could remake themselves as modern states.'
- nn: 41
  unit_id: ch13-liberalism-crisis-and-motors-of-change
  note_id: bayly-birth-of-the-modern-world-ch13-liberalism-crisis-and-motors-of-change
  span: 1279717:1324325
  chunks:
  - id: bayly-birth-of-the-modern-world#u41-c1
    heading: 'The liberal civilization of 1815 declared a failure'
    span: 1290923:1291443
    why: 'States the chapter''s central verdict on the ''strange death of liberalism'' and measures it against critics from Zola to Gandhi, framing the crisis as global rather than only European.'
  - id: bayly-birth-of-the-modern-world#u41-c2
    heading: 'Liberalism''s retreat in the colonial world'
    span: 1285725:1286400
    why: 'Shows liberalism''s collapse taking a distinct, more radical form outside the West, replacing individual rights with religious and racial claims.'
  - id: bayly-birth-of-the-modern-world#u41-c3
    heading: 'No prime mover: the book''s causal argument'
    span: 1309982:1311039
    why: 'The chapter''s explicit statement of multi-causal method, naming industrious revolutions, domestication, and seaborne commerce as the pre-1850 motors of change.'
  - id: bayly-birth-of-the-modern-world#u41-c4
    heading: 'Subordination, not collaboration'
    span: 1318112:1319072
    why: 'Bayly''s key methodological move on power: Western dominance worked by co-opting existing networks under necessity, illustrated by Afghan cavalry and Chinese merchants.'
  - id: bayly-birth-of-the-modern-world#u41-c5
    heading: 'Hybrid ideologies that subverted dominance'
    span: 1322606:1323189
    why: 'Names the specific hybrids (Gandhi, Afghani, Abduh) produced when colonized intellectuals turned co-optive networks and metropolitan ideological rifts to their own ends.'
  - id: bayly-birth-of-the-modern-world#u41-c6
    heading: 'Why global history rose as a discipline'
    span: 1291676:1292651
    why: 'Bayly''s own account of global history''s institutional emergence, motivating the book''s method and the chapter''s closing methodological reflections.'
- nn: 42
  unit_id: ch13-uniformity-complexity-and-the-road-to-1914
  note_id: bayly-birth-of-the-modern-world-ch13-uniformity-complexity-and-the-road-to-1914
  span: 1324325:1354150
  chunks:
  - id: bayly-birth-of-the-modern-world#u42-c1
    heading: 'The book''s thesis restated: uniformity and complexity together'
    span: 1324382:1324924
    why: 'States the chapter''s and the book''s central paradox in its own words: uniformity and complexity as simultaneous, linked outcomes of the same processes.'
  - id: bayly-birth-of-the-modern-world#u42-c2
    heading: 'Fifty million men: the modern state''s reach'
    span: 1327123:1328144
    why: 'Bayly''s clinching evidence for the modern state''s reach—wartime mobilization of fifty million men—set against the more negotiated, personalized resistance it replaced.'
  - id: bayly-birth-of-the-modern-world#u42-c3
    heading: 'Empires of religion, decentered worship'
    span: 1330796:1331846
    why: 'Names the ''empires of religion'' dynamic directly: institutional religion converging on a uniform template while everyday belief stays decentered and mystical.'
  - id: bayly-birth-of-the-modern-world#u42-c4
    heading: 'The destruction of the world''s native peoples'
    span: 1336048:1337026
    why: 'States plainly that global economic uniformity was built on the violent destruction of nomadic and hunter-gatherer alternatives, naming the last wave of native resistance.'
  - id: bayly-birth-of-the-modern-world#u42-c5
    heading: 'The fin-de-siècle break-up of the historicist consensus'
    span: 1347589:1348786
    why: 'Marks the fin-de-siècle collapse of the century''s historicist consensus—Nietzsche, Freud, modernist art—just before the war that would fully expose it.'
  - id: bayly-birth-of-the-modern-world#u42-c6
    heading: 'August 1914: the tragedy of thin internationalism'
    span: 1353210:1354149
    why: 'The book''s own verdict on why internationalism failed and how August 1914 both climaxes and radicalizes the uniformity/complexity dynamic it has traced.'
