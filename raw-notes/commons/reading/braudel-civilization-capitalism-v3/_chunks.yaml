source: braudel-civilization-capitalism-v3
units:
- nn: 1
  unit_id: foreword
  note_id: braudel-civilization-capitalism-v3-foreword
  span: 0:11495
  chunks:
  - id: braudel-civilization-capitalism-v3#u01-c1
    heading: 'The gamble and the presumption'
    span: 121:880
    why: 'States Braudel''s governing method for Vol. III: trusting the chronological unfolding of history itself as the test of the analytic model built in Vols I-II.'
  - id: braudel-civilization-capitalism-v3#u01-c2
    heading: 'The India quadrilateral and zones of silence'
    span: 3089:3981
    why: 'Introduces ''world time'' as a scale that links only some regions into world rhythms while leaving others as ''zones of silence'' - the seed of the volume''s core/periphery hierarchy.'
  - id: braudel-civilization-capitalism-v3#u01-c3
    heading: 'World time as superstructure'
    span: 4479:4987
    why: 'Casts world time in explicit base/superstructure terms, the structural image that will recur once the book turns to dominant centres and national markets.'
  - id: braudel-civilization-capitalism-v3#u01-c4
    heading: 'Against economism'
    span: 6561:6981
    why: 'Marshals authorities against treating economic history as self-contained, framing the volume''s deliberately interdisciplinary method.'
  - id: braudel-civilization-capitalism-v3#u01-c5
    heading: 'Schumpeter and the historian''s vantage'
    span: 10792:11445
    why: 'Closes the foreword by using Schumpeter to justify the historian''s trade as the superior vantage on economics and, implicitly, on the present.'
- nn: 2
  unit_id: ch01-world-economies-ground-rules
  note_id: braudel-civilization-capitalism-v3-ch01-world-economies-ground-rules
  span: 11495:67733
  chunks:
  - id: braudel-civilization-capitalism-v3#u02-c1
    heading: 'World-economy vs. world economy'
    span: 13275:13879
    why: 'Braudel''s foundational distinction between the world economy (Sismondi''s ''market of the universe'') and a world-economy (Weltwirtschaft, a self-sufficient fragment), the term the rest of the chapter and volume build on.'
  - id: braudel-civilization-capitalism-v3#u02-c2
    heading: 'Rule One: frontiers as quiet zones'
    span: 22608:23141
    why: 'States Rule One in Braudel''s own words and immediately grounds it in concrete geographic barriers (Sahara, Atlantic, Indian Ocean) rather than leaving the rule abstract.'
  - id: braudel-civilization-capitalism-v3#u02-c3
    heading: 'Rule Two: cities take turns to lead'
    span: 35324:35608
    why: 'Names the succession of dominant world-cities that structures Rule Two and calls each hand-off a massive historical shift of forces, the chapter''s clearest statement of centre-succession as a general pattern.'
  - id: braudel-civilization-capitalism-v3#u02-c4
    heading: 'Rule Three: the hierarchy of zones (Wallerstein)'
    span: 52560:53115
    why: 'States Rule Three, the core/middle-zone/periphery hierarchy, and explicitly names Wallerstein''s The Modern World-System as the theory Braudel is arguing with and building on.'
  - id: braudel-civilization-capitalism-v3#u02-c5
    heading: 'The marble block: envelope and infrastructure'
    span: 65394:66243
    why: 'Braudel''s own explanatory metaphor for how a world-economy''s centre dominates: an inert mass of ordinary economic activity, manoeuvred from above by modest levers of credit and price.'
- nn: 3
  unit_id: ch01-an-order-among-other-orders
  note_id: braudel-civilization-capitalism-v3-ch01-an-order-among-other-orders
  span: 67733:132274
  chunks:
  - id: braudel-civilization-capitalism-v3#u03-c1
    heading: 'Society as inextricable orders'
    span: 67780:69551
    why: 'States the chapter''s governing thesis: the world-economy is powerful but not sovereign over politics, society, and culture, each with its own autonomous spatial geography.'
  - id: braudel-civilization-capitalism-v3#u03-c2
    heading: 'Unequal exchange as inheritance, not nature'
    span: 74372:75131
    why: 'Braudel''s rebuttal of Ricardian comparative advantage: economic inequality between nations is accumulated historical subordination, not a natural, ahistorical equilibrium.'
  - id: braudel-civilization-capitalism-v3#u03-c3
    heading: 'The world-economy outran Charles V''s empire'
    span: 94084:94890
    why: 'Carries Braudel''s central argument against Wallerstein''s sixteenth-century dating: capitalism in Antwerp, Genoa, Lisbon, and Seville was already a structural fact no single emperor''s success or failure could have altered.'
  - id: braudel-civilization-capitalism-v3#u03-c4
    heading: 'Sieges at the core, guerrilla at the periphery'
    span: 102871:104190
    why: 'Shows how the same historical process, war, takes structurally different forms depending on a zone''s distance from the world-economy''s centre.'
  - id: braudel-civilization-capitalism-v3#u03-c5
    heading: 'Capitalism installs itself atop a hierarchy of coexisting modes'
    span: 117544:118198
    why: 'States Braudel''s Wallerstein- and Luxemburg-endorsing thesis that wage labour, serfdom, and slavery coexist synchronically across a world-economy''s zones, with capitalism entering peripheries through colluding local elites rather than replacing what it finds.'
  - id: braudel-civilization-capitalism-v3#u03-c6
    heading: 'Civilization outlasts the economic map'
    span: 119095:120399
    why: 'Establishes culture/civilization as the most durable and independent of the four orders, one whose boundaries (e.g. Christendom) constrained even core economic instruments like the bill of exchange.'
- nn: 4
  unit_id: ch01-divisions-of-time
  note_id: braudel-civilization-capitalism-v3-ch01-divisions-of-time
  span: 132274:178332
  chunks:
  - id: braudel-civilization-capitalism-v3#u04-c1
    heading: 'Cycle taxonomy: Kitchin to Kondratieff'
    span: 136349:137470
    why: 'Defines the named-cycle vocabulary (Kitchin, Juglar, Labrousse, Kuznets, Kondratieff) that the rest of the chapter and volume build on.'
  - id: braudel-civilization-capitalism-v3#u04-c2
    heading: 'Price unison as proof of a world-economy'
    span: 142768:143000
    why: 'States Braudel''s central empirical claim: synchronized price movements across huge distances are the evidence that a coherent world-economy exists.'
  - id: braudel-civilization-capitalism-v3#u04-c3
    heading: 'Four secular peaks as vantage points'
    span: 151802:152516
    why: 'Sets out the chapter''s narrative method: reading the world-economies'' history off four dated secular turning-points.'
  - id: braudel-civilization-capitalism-v3#u04-c4
    heading: 'The world-economy as a manufacturing vibrating surface'
    span: 165680:166387
    why: 'Braudel''s clearest theoretical statement that the world-economy actively generates the conjuncture rather than just transmitting it.'
  - id: braudel-civilization-capitalism-v3#u04-c5
    heading: 'Destructuration: one system dying, another being born'
    span: 170167:170397
    why: 'Braudel''s own compact definition of a secular crisis, structurally close to the interregnum WMP calls a gramsci gap.'
  - id: braudel-civilization-capitalism-v3#u04-c6
    heading: 'Secular decline and the fortunes of ordinary people'
    span: 174411:175780
    why: 'Carries the chapter''s most surprising empirical claim, that secular decline sometimes improved real wages for the many even as it damaged elites.'
- nn: 5
  unit_id: ch02-first-world-economy-bruges-hansa
  note_id: braudel-civilization-capitalism-v3-ch02-first-world-economy-bruges-hansa
  span: 178332:217904
  chunks:
  - id: braudel-civilization-capitalism-v3#u05-c1
    heading: 'Capital''s steady health beneath civic turmoil'
    span: 181178:181674
    why: 'States Braudel''s underlying claim that factional violence and class conflict inside the city-states never interrupted the accumulation of capital — the deep argument beneath the chapter''s survey of turbulent cities.'
  - id: braudel-civilization-capitalism-v3#u05-c2
    heading: 'Naming the first Weltwirtschaft'
    span: 193471:194039
    why: 'Shows historians (Melis, Bechtel, Rörig) independently trying to draw the boundary of Europe''s first world-economy, the concept the whole chapter is organized around.'
  - id: braudel-civilization-capitalism-v3#u05-c3
    heading: 'Two poles, not one'
    span: 195653:196270
    why: 'States the bipolarity thesis explicitly — the single most important structural claim of the unit.'
  - id: braudel-civilization-capitalism-v3#u05-c4
    heading: 'Bruges: world-market but not world-city'
    span: 205228:205518
    why: 'Braudel''s own verdict in the Pirenne/van Houtte dispute over whether Bruges (or Antwerp, or Venice) truly commanded the medieval world-economy.'
  - id: braudel-civilization-capitalism-v3#u05-c5
    heading: 'The Hansa assembles itself before it is named'
    span: 207174:207563
    why: 'Documents the Hansa''s decades-long informal existence as scattered merchant and shipping associations before the word ''Hansa'' was even recorded, let alone the League formally constituted.'
  - id: braudel-civilization-capitalism-v3#u05-c6
    heading: 'An elementary capitalism'
    span: 217202:217643
    why: 'Braudel''s diagnosis of why the Hansa, despite organizing a huge trading zone, remained a lesser form of capitalism than Venice or Bruges.'
- nn: 6
  unit_id: ch02-italian-cities-champagne-fairs
  note_id: braudel-civilization-capitalism-v3-ch02-italian-cities-champagne-fairs
  span: 217904:245400
  chunks:
  - id: braudel-civilization-capitalism-v3#u06-c1
    heading: 'Amalfi''s forced turn to the sea'
    span: 218325:218933
    why: 'Names the structural logic — land-poverty forcing total commercial specialization — that drives every Italian maritime city discussed in the unit, starting with the earliest and smallest.'
  - id: braudel-civilization-capitalism-v3#u06-c2
    heading: 'Venice as a city with no primary sector'
    span: 221005:222285
    why: 'Braudel''s sharpest statement of why a landless, foodless city was condemned to live entirely from trade — the material precondition for Venice becoming a Mediterranean pole.'
  - id: braudel-civilization-capitalism-v3#u06-c3
    heading: 'The Fourth Crusade turns Venice from parasite to owner'
    span: 227257:228173
    why: 'Marks the exact hinge where intra-Christian Crusading energy, not the Christendom-Islam contest, decides which Italian city will dominate the Mediterranean.'
  - id: braudel-civilization-capitalism-v3#u06-c4
    heading: 'The Champagne fairs as hinge between two core-zones'
    span: 230826:232245
    why: 'States explicitly that the fairs occupy the midpoint between two nascent core-zones rather than being a dominant centre themselves — an anomaly against Braudel''s own one-dominant-city rule.'
  - id: braudel-civilization-capitalism-v3#u06-c5
    heading: 'Italian money-changers run the fairs'
    span: 234113:234814
    why: 'Shows credit and finance, controlled by Italian firms, outweighing the commodity trade itself — capitalism as a layer distinct from and superior to ordinary market exchange.'
  - id: braudel-civilization-capitalism-v3#u06-c6
    heading: 'France''s territorial state bypassed by the circuit of capitalism'
    span: 244100:244538
    why: 'The unit''s thesis statement: despite hosting the fairs and Europe''s leading political-intellectual capital, France never became the economic centre, and the rising circuit of capitalism forms around her rather than through her.'
- nn: 7
  unit_id: ch02-venice
  note_id: braudel-civilization-capitalism-v3-ch02-venice
  span: 245400:302795
  chunks:
  - id: braudel-civilization-capitalism-v3#u07-c1
    heading: 'The war of Chioggia settles Genoa vs Venice'
    span: 248478:249177
    why: 'Names the specific 1378-81 conflict Braudel treats as the decisive, if poorly-understood, turning point of the Genoa-Venice rivalry.'
  - id: braudel-civilization-capitalism-v3#u07-c2
    heading: 'Doge Mocenigo''s 1423 deathbed speech'
    span: 256834:257290
    why: 'Braudel''s key primary-source evidence for Venice''s fabulous trading returns and self-conception as an economic empire.'
  - id: braudel-civilization-capitalism-v3#u07-c3
    heading: 'The Fondaco dei Tedeschi as engineered dependency'
    span: 266567:267512
    why: 'Shows the deliberate policy by which Venice forced the German trade to pass exclusively through her own hands, the core mechanism of her world-economy''s centrality.'
  - id: braudel-civilization-capitalism-v3#u07-c4
    heading: 'Against Cox: Genoa, not Venice, was the modern one'
    span: 250488:250944
    why: 'Braudel''s explicit methodological rejection of the thesis that Venice''s rise proves her capitalist superiority.'
  - id: braudel-civilization-capitalism-v3#u07-c5
    heading: 'Two worlds of Venetian labor'
    span: 288528:288934
    why: 'States the guild/unorganized-proletariat divide that structures Braudel''s account of Venetian social peace.'
  - id: braudel-civilization-capitalism-v3#u07-c6
    heading: 'Turkish pressure and Antwerp''s rise close the unit'
    span: 302092:302481
    why: 'Signals that Venice''s decline was not solely Ottoman pressure but coincided with the world-economy''s center quietly shifting to Antwerp.'
- nn: 8
  unit_id: ch02-portugal-and-antwerp
  note_id: braudel-civilization-capitalism-v3-ch02-portugal-and-antwerp
  span: 302795:347189
  chunks:
  - id: braudel-civilization-capitalism-v3#u08-c1
    heading: 'Portugal as detonator'
    span: 302854:303197
    why: 'States Braudel''s opening framing of Portugal''s discoveries as the trigger for a world-historical shift, setting up the chapter''s question of succession.'
  - id: braudel-civilization-capitalism-v3#u08-c2
    heading: 'Why Lisbon lost the succession'
    span: 315699:316547
    why: 'Braudel''s explicit statement of why triumph in trade did not confer centrality on Lisbon, the chapter''s core succession-of-centres argument.'
  - id: braudel-civilization-capitalism-v3#u08-c3
    heading: 'Antwerp as economic innocent'
    span: 319767:320196
    why: 'Braudel''s most vivid statement of Antwerp''s contingent, unsought rise to world-capital status, built entirely by outside agency.'
  - id: braudel-civilization-capitalism-v3#u08-c4
    heading: 'The letter obligatory'
    span: 342315:343379
    why: 'Concrete description of Antwerp''s home-grown credit instrument, the chapter''s clearest evidence of merchant-level financial innovation under institutional scarcity.'
  - id: braudel-civilization-capitalism-v3#u08-c5
    heading: 'Three successive Antwerps'
    span: 323181:324172
    why: 'Compresses Antwerp''s whole career into three externally-triggered phases, the structural skeleton the rest of the unit fills in.'
- nn: 9
  unit_id: ch02-age-of-the-genoese
  note_id: braudel-civilization-capitalism-v3-ch02-age-of-the-genoese
  span: 347189:387601
  chunks:
  - id: braudel-civilization-capitalism-v3#u09-c1
    heading: 'Not by ships, but by a handful of financiers'
    span: 363966:364742
    why: 'States the structural inversion at the heart of Genoese hegemony: it ran through a handful of financiers rather than through ships, colonies or captains of industry.'
  - id: braudel-civilization-capitalism-v3#u09-c2
    heading: 'An ultra-sensitive seismograph'
    span: 358330:359286
    why: 'Defines the adaptive, low-inertia disposition of the Genoese businessman that Braudel treats as the true engine of Genoese success and later survival.'
  - id: braudel-civilization-capitalism-v3#u09-c3
    heading: 'Gold as the lever of control'
    span: 372491:372873
    why: 'Shows the three-way silver/gold/bills-of-exchange mechanism in action, and the 1575–76 Antwerp mutiny that proved Genoese control was real leverage over Spain, not just profitable service.'
  - id: braudel-civilization-capitalism-v3#u09-c4
    heading: 'A sort of balancing act'
    span: 357390:358083
    why: 'Names the structural paradox — manufacturing, shipping and investing ''for other people'' — that both explains Genoese wealth and frames it as a permanent, precarious balancing act.'
  - id: braudel-civilization-capitalism-v3#u09-c5
    heading: 'Discreet rule, compared to the BIS'
    span: 363227:363965
    why: 'Braudel''s own thesis statement for the unit''s title: Genoese supremacy was real but so discreet it defies precise chronology, explicitly likened to the BIS.'
  - id: braudel-civilization-capitalism-v3#u09-c6
    heading: 'The 1627 withdrawal was voluntary'
    span: 376709:377249
    why: 'Braudel''s central argument about the end of the Genoese age: the 1627 bankruptcy did not cause collapse — disengagement and redeployment of capital were a choice, not a defeat.'
- nn: 10
  unit_id: ch03-united-provinces-at-home
  note_id: braudel-civilization-capitalism-v3-ch03-united-provinces-at-home
  span: 387601:430133
  chunks:
  - id: braudel-civilization-capitalism-v3#u10-c1
    heading: 'The last city-empire, before the territorial state'
    span: 387672:388668
    why: 'States Braudel''s central periodization move for the chapter: Amsterdam terminates city-centred hegemony before the modern territorial state (London) takes over.'
  - id: braudel-civilization-capitalism-v3#u10-c2
    heading: 'The ''Dutch miracle'' was no miracle'
    span: 391240:391729
    why: 'Braudel''s clearest statement that Dutch ascendancy only looked sudden because long preparatory processes were invisible to contemporaries.'
  - id: braudel-civilization-capitalism-v3#u10-c3
    heading: 'Toleration as structural necessity'
    span: 410937:411489
    why: 'Frames toleration not as an Enlightenment virtue but as a functional requirement of being a world-economy''s centre - a load-bearing analytic claim.'
  - id: braudel-civilization-capitalism-v3#u10-c4
    heading: 'Amsterdam as the new Venice'
    span: 402465:402860
    why: 'Draws the hierarchy of towns explicitly, making Amsterdam''s core-periphery relation to the United Provinces the direct successor of Venice''s relation to the Terraferma.'
  - id: braudel-civilization-capitalism-v3#u10-c5
    heading: 'The fluyt: a cheaper, thinner-crewed ship'
    span: 423594:424055
    why: 'Supplies the concrete technological-economic mechanism behind Dutch shipping''s cost advantage over French and English rivals.'
  - id: braudel-civilization-capitalism-v3#u10-c6
    heading: 'Capitalism grew out of the soil'
    span: 396139:396739
    why: 'Anchors the section''s title claim - ''the economy begins at home'' - in intensified domestic agriculture rather than overseas trade.'
- nn: 11
  unit_id: ch03-dutch-state-taxes-business
  note_id: braudel-civilization-capitalism-v3-ch03-dutch-state-taxes-business
  span: 430133:462758
  chunks:
  - id: braudel-civilization-capitalism-v3#u11-c1
    heading: 'Can the United Provinces be called a state?'
    span: 430179:431383
    why: 'Stages the historiographical consensus (Klein, Jeannin, a hostile envoy, Turgot) that the Dutch government was barely a state, which the rest of the unit works to complicate.'
  - id: braudel-civilization-capitalism-v3#u11-c2
    heading: 'The regent patriciate behind the throne'
    span: 440222:441461
    why: 'Quantifies the roughly 2,000-strong closed oligarchy that controlled every town, province, the States-General, the Council of State, and the VOC regardless of who held formal power.'
  - id: braudel-civilization-capitalism-v3#u11-c3
    heading: 'From Golden Age austerity to rentier withdrawal'
    span: 443536:444701
    why: 'Marks the hinge where the frugal Golden Age elite gives way to a rentier class withdrawing capital from trade into government stocks and closing its ranks off from society.'
  - id: braudel-civilization-capitalism-v3#u11-c4
    heading: 'A systematically unjust fiscal system'
    span: 448393:449131
    why: 'Carries Braudel''s bluntest editorial line — asking whether a more systematically unjust state could be imagined — over evidence that even a 50,000-strong customs service changed nothing.'
  - id: braudel-civilization-capitalism-v3#u11-c5
    heading: 'De Witt meets Pomponne as an equal'
    span: 456519:457129
    why: 'Braudel''s own analytic voice argues directly that Johan de Witt negotiated with Louis XIV''s ambassador without any inferiority complex — his positive case that Dutch statecraft matched a great power''s.'
  - id: braudel-civilization-capitalism-v3#u11-c6
    heading: 'Commerce effectively replaced raison d''état'
    span: 459458:460456
    why: 'Assembles the primary-source evidence — de la Court, La Thuillerie, the VOC directors'' 1644 claim that conquered strongholds were private property — for the claim that commercial interest, not the state, was sovereign in Holland.'
- nn: 12
  unit_id: ch03-traders-to-europe-and-the-world
  note_id: braudel-civilization-capitalism-v3-ch03-traders-to-europe-and-the-world
  span: 462758:499857
  chunks:
  - id: braudel-civilization-capitalism-v3#u12-c1
    heading: 'Europe first, the world as bonus'
    span: 462798:463199
    why: 'States the unit''s organizing thesis in Braudel''s own words: European and world supremacy are two stages of one method, not two separate stories.'
  - id: braudel-civilization-capitalism-v3#u12-c2
    heading: '''Complementary enemies'': trading through the war of independence'
    span: 465907:466329
    why: 'Names the paradox at the heart of Dutch power: the revolt against Spain (1572-1609) never broke the Baltic-Iberian trade axis both sides depended on.'
  - id: braudel-civilization-capitalism-v3#u12-c3
    heading: 'The VOC as a state within a state'
    span: 479819:480552
    why: 'Marks the institutional hinge where discreet, undisciplined Dutch trading voyages become a single chartered monopoly with sovereign ambitions.'
  - id: braudel-civilization-capitalism-v3#u12-c4
    heading: 'Merchant beats colonizer'
    span: 483470:484072
    why: 'Braudel states outright the rule that kept the VOC''s empire a scattered trading network rather than a territorial state: cost discipline overruled Coen''s colonial ambition.'
  - id: braudel-civilization-capitalism-v3#u12-c5
    heading: 'Monopoly enforced by uprooting'
    span: 495161:496753
    why: 'Shows the coercive machinery -- forced monoculture, uprooted clove trees, garrisoned islands -- by which the spice monopoly was actually made to hold.'
  - id: braudel-civilization-capitalism-v3#u12-c6
    heading: 'Living on a world scale'
    span: 498885:499855
    why: 'The chapter''s closing image -- Cape wheat, Ceylon cowries traded for slaves, Chinese sugar -- crystallizes the claim that Amsterdam had become the hub of a genuinely world-scale economy.'
- nn: 13
  unit_id: ch03-voc-asia-and-america
  note_id: braudel-civilization-capitalism-v3-ch03-voc-asia-and-america
  span: 499857:538209
  chunks:
  - id: braudel-civilization-capitalism-v3#u13-c1
    heading: 'The Asia-Europe price scale'
    span: 499901:501247
    why: 'States Braudel''s core world-economy image (Asia and Europe as two trays on a scale) and gives the concrete Pyrard de Laval / Banda price evidence for it.'
  - id: braudel-civilization-capitalism-v3#u13-c2
    heading: 'Monopoly enforced by coercion: Ceylon and Banda'
    span: 502365:503349
    why: 'Shows the spice monopoly as an administered regime of garrisons, deportation, and slave replacement rather than an ordinary market arrangement, and the cost that entailed.'
  - id: braudel-civilization-capitalism-v3#u13-c3
    heading: 'A machine that stops where monopoly profits begin'
    span: 525432:526150
    why: 'The unit''s thesis sentence: locates real capitalist capture in the top merchant syndicate rather than in the Company''s own corporate profits.'
  - id: braudel-civilization-capitalism-v3#u13-c4
    heading: 'Braudel doubts his own thesis'
    span: 517420:517970
    why: 'A rare first-person moment where Braudel weighs his own super-trade thesis against the modest V.O.C. profit figures before resolving it via the oligopoly-capture argument.'
  - id: braudel-civilization-capitalism-v3#u13-c5
    heading: 'Holland as a parasite plant'
    span: 527351:527771
    why: 'Frames, then complicates, the essentialist hypothesis for Dutch failure in America that the rest of the section argues against.'
  - id: braudel-civilization-capitalism-v3#u13-c6
    heading: 'A commercial superstructure without control of production'
    span: 531371:532048
    why: 'Braudel''s diagnosis of the Dutch failure in Brazil: trade-post extraction without territorial/production control, unlike the Asian model.'
- nn: 14
  unit_id: ch03-amsterdam-entrepot-and-credit
  note_id: braudel-civilization-capitalism-v3-ch03-amsterdam-entrepot-and-credit
  span: 538209:574477
  chunks:
  - id: braudel-civilization-capitalism-v3#u14-c1
    heading: 'The fair analogy and entrepot monopoly'
    span: 540896:541727
    why: 'Braudel''s core empirical claim about Amsterdam''s mode of dominance — hoarding and re-selling the world''s goods rather than producing them — stated through a contemporary''s fair analogy and the Antwerp/Venice precedent.'
  - id: braudel-civilization-capitalism-v3#u14-c2
    heading: 'Transfers, not notes: the Bank of Amsterdam'
    span: 547802:548684
    why: 'Melon''s Bank of Amsterdam/Bank of London contrast is Braudel''s clearest statement that credit-clearing, not note-issuing, was the technical basis of Dutch financial power.'
  - id: braudel-civilization-capitalism-v3#u14-c3
    heading: 'Defining the commission trade'
    span: 551311:551956
    why: 'The only place in the unit that formally defines the commission trade''s four types, the structure that everything Braudel says next about Dutch credit depends on.'
  - id: braudel-civilization-capitalism-v3#u14-c4
    heading: 'Kindleberger on the decline of entrepot monopoly'
    span: 556189:556893
    why: 'Kindleberger''s mechanism — information diffusion erodes entrepot monopolies, pushing capital from commodities into banking — is the causal hinge the whole acceptance-trade and loans-mania argument is built on.'
  - id: braudel-civilization-capitalism-v3#u14-c5
    heading: 'The sign of autumn'
    span: 566226:567275
    why: 'Braudel''s own interpretive thesis — the sign of autumn — turns Amsterdam''s loans mania into a general law of capitalist maturity, explicitly compared to Genoa and London.'
  - id: braudel-civilization-capitalism-v3#u14-c6
    heading: 'Credit power versus sovereign authority'
    span: 564531:565049
    why: 'The Leontief/Accarias de Serionne pairing is where Braudel makes explicit that Amsterdam''s credit power rivaling sovereigns prefigures modern multinational finance — his most forward-reaching claim in the unit.'
- nn: 15
  unit_id: ch03-away-from-amsterdam
  note_id: braudel-civilization-capitalism-v3-ch03-away-from-amsterdam
  span: 574477:616813
  chunks:
  - id: braudel-civilization-capitalism-v3#u15-c1
    heading: 'The exploitation mechanism: not soiling its own hands'
    span: 574522:575137
    why: 'States the unit''s organizing thesis: a dominant economy exploits subordinate ones without directly administering them, which the four case studies then test.'
  - id: braudel-civilization-capitalism-v3#u15-c2
    heading: 'Sweden''s moral: unable to shake off the heavy hand'
    span: 586862:587418
    why: 'Braudel''s own summary judgment that Sweden''s apparent diversification still ended in dependency on Amsterdam''s trade circuits.'
  - id: braudel-civilization-capitalism-v3#u15-c3
    heading: 'Gdansk, Poland, and refeudalization'
    span: 593675:594515
    why: 'Links a zone''s position in the world-economy to its internal social order, contrasting Poland''s re-serfed hinterland with free Swedish/Finnish peasants.'
  - id: braudel-civilization-capitalism-v3#u15-c4
    heading: 'France''s structural incapacity against the Dutch'
    span: 601343:602025
    why: 'Shows France''s failure to dislodge Dutch middlemen was structural (no independent merchant class, no ships), not a lack of political will under Colbert and Louis XIV.'
  - id: braudel-civilization-capitalism-v3#u15-c5
    heading: 'England''s joker card'
    span: 610636:611223
    why: 'The unit''s dramatic hinge: England''s abrupt 1782-3 reversal against Holland after decades as a Dutch trade client, marking the succession of dominant centres continuing past Amsterdam.'
  - id: braudel-civilization-capitalism-v3#u15-c6
    heading: 'Killing the goose: Dutch overreach in the East Indies'
    span: 614333:614865
    why: 'Braudel''s warning note that Dutch insistence on total control in Asia undermined the very trade it depended on, complicating the otherwise triumphalist account of Dutch expansion.'
- nn: 16
  unit_id: ch03-decline-of-amsterdam
  note_id: braudel-civilization-capitalism-v3-ch03-decline-of-amsterdam
  span: 616813:647616
  chunks:
  - id: braudel-civilization-capitalism-v3#u16-c1
    heading: 'Decline as withdrawal, not decadence'
    span: 616889:617370
    why: 'States Braudel''s decline-vs-decadence distinction and the Venice-Antwerp/Amsterdam-London/London-New York succession chain that frames the whole chapter.'
  - id: braudel-civilization-capitalism-v3#u16-c2
    heading: 'Financialization as dominant capitalism''s fate'
    span: 617980:619584
    why: 'Uses the Venice parallel to argue Amsterdam''s shift to rentier finance was destiny rather than failure, the chapter''s core theoretical claim.'
  - id: braudel-civilization-capitalism-v3#u16-c3
    heading: 'Three crises as one worsening conjuncture'
    span: 623999:624673
    why: 'Explicitly compares the 1763, 1772-3 and 1780-3 crises as an escalating sequence rather than isolated accidents, the conjuncture argument in miniature.'
  - id: braudel-civilization-capitalism-v3#u16-c4
    heading: 'The rule of first shock, first cure'
    span: 636570:637031
    why: 'Braudel''s clearest statement of the succession-of-centres mechanism, extended forward to 1929 Wall Street as a later instance.'
  - id: braudel-civilization-capitalism-v3#u16-c5
    heading: 'Political defeat, economic victory'
    span: 638619:639061
    why: 'Shows sovereignty and economic centrality decoupling: England loses the war politically but gains world economic leadership.'
  - id: braudel-civilization-capitalism-v3#u16-c6
    heading: 'The Batavian revolution as Europe''s first'
    span: 642340:642734
    why: 'Braudel''s own assessment of the revolution''s historical significance and its ferocity, anchoring the chapter''s closing section.'
- nn: 17
  unit_id: ch04-elements-and-compounds
  note_id: braudel-civilization-capitalism-v3-ch04-elements-and-compounds
  span: 647616:699305
  chunks:
  - id: braudel-civilization-capitalism-v3#u17-c1
    heading: 'National markets and the world-economy''s centre'
    span: 649636:649964
    why: 'States the chapter''s central geographic claim — national markets form near a world-economy''s centre — which frames everything that follows.'
  - id: braudel-civilization-capitalism-v3#u17-c2
    heading: 'The isolate: the smallest unit of settlement'
    span: 654674:655439
    why: 'Defines the base unit of Braudel''s nested hierarchy of economic scales that the whole chapter builds upward from.'
  - id: braudel-civilization-capitalism-v3#u17-c3
    heading: 'The province as a world-economy in miniature'
    span: 665996:666778
    why: 'Braudel''s explicit claim that the province replicates the world-economy''s core/periphery structure in miniature — the chapter''s clearest statement of scale-invariance.'
  - id: braudel-civilization-capitalism-v3#u17-c4
    heading: 'Carrière''s toll statistics against the customs-barrier thesis'
    span: 680890:681257
    why: 'The quantitative evidence Braudel uses to overturn the standard internal-customs explanation for the national market''s emergence.'
  - id: braudel-civilization-capitalism-v3#u17-c5
    heading: 'Territorialwirtschaft, Stadtwirtschaft, and mercantilism'
    span: 690197:690849
    why: 'Braudel''s own structural definition of the national/territorial economy via Bücher, and his claim that mercantilism was its first deliberate construction.'
  - id: braudel-civilization-capitalism-v3#u17-c6
    heading: 'The city-state''s outsourced primary sector'
    span: 693039:693845
    why: 'Explains why city-states achieved commercial dominance before territorial states could, by identifying what city-states externalized.'
- nn: 18
  unit_id: ch04-weights-and-measures
  note_id: braudel-civilization-capitalism-v3-ch04-weights-and-measures
  span: 699305:745030
  chunks:
  - id: braudel-civilization-capitalism-v3#u18-c1
    heading: 'Methodological disclaimer: orders of magnitude, not a new history'
    span: 701980:702823
    why: 'States the unit''s governing method — plausible orders of magnitude rather than precise data — that frames every calculation that follows.'
  - id: braudel-civilization-capitalism-v3#u18-c2
    heading: 'Three variables: patrimony, income, per capita income'
    span: 702867:703581
    why: 'Defines the three quantities the whole chapter works with and admits the field''s fundamental data gap — no audit of national wealth exists.'
  - id: braudel-civilization-capitalism-v3#u18-c3
    heading: 'Bairoch''s wage-multiplier coefficient'
    span: 709533:709938
    why: 'The unit''s one portable quantitative law (wage x196-200 = per capita income), later tested against Venice, Orleans, and Vauban''s France.'
  - id: braudel-civilization-capitalism-v3#u18-c4
    heading: 'Growth without development: Portugal and Kuwait'
    span: 717159:717626
    why: 'Shows Braudel''s key conceptual distinction — per capita income can rise without structural development — via a resource-windfall analogy spanning centuries.'
  - id: braudel-civilization-capitalism-v3#u18-c5
    heading: 'The national-debt-to-GNP ceiling'
    span: 724743:725188
    why: 'Establishes the debt:GNP rule of thumb (max ~2:1) that Braudel then applies to judge fiscal health across England, France, and Austria.'
  - id: braudel-civilization-capitalism-v3#u18-c6
    heading: 'The rise of the state as a centuries-long cycle'
    span: 743976:745028
    why: 'Braudel''s own multi-century collapse-and-reconstruction narrative of the state, offered as one of only two ''visible continuities'' the chapter''s quantification work reveals.'
- nn: 19
  unit_id: ch04-france-paris-and-lyon
  note_id: braudel-civilization-capitalism-v3-ch04-france-paris-and-lyon
  span: 745030:798005
  chunks:
  - id: braudel-civilization-capitalism-v3#u19-c1
    heading: 'The enclosed world of the Bonneville monastery'
    span: 749049:750630
    why: 'Braudel''s concrete illustration of a self-sufficient pays, the small-scale unit that made France a mosaic rather than a market.'
  - id: braudel-civilization-capitalism-v3#u19-c2
    heading: 'Was size itself the source of inertia?'
    span: 746550:747006
    why: 'States the chapter''s governing question directly: France''s scale, not political will, as the chief obstacle to a national market.'
  - id: braudel-civilization-capitalism-v3#u19-c3
    heading: 'The centre of the world-economy moved elsewhere'
    span: 767548:768137
    why: 'Names Braudel''s succession-of-dominant-centres thesis and pins France''s political setback to her failure to hold the world-economy''s centre.'
  - id: braudel-civilization-capitalism-v3#u19-c4
    heading: 'Two cities, one weakness'
    span: 773566:773874
    why: 'States outright that the Paris-Lyon bipolarity is a structural symptom of France''s failure to integrate, the chapter''s organizing claim for its second half.'
  - id: braudel-civilization-capitalism-v3#u19-c5
    heading: 'Lyon as an Italian implant, and a periphery'
    span: 774464:774916
    why: 'Explicit core-periphery reading of Lyon: its fairs were foreign-planted and its status a sign of French subordination, not autonomous strength.'
  - id: braudel-civilization-capitalism-v3#u19-c6
    heading: 'Paris''s supremacy, never complete'
    span: 797705:798003
    why: 'Closing thesis statement: even after Paris''s rise, France''s bipolar economic geography was never fully resolved into a single centre.'
- nn: 20
  unit_id: ch04-france-differential-history
  note_id: braudel-civilization-capitalism-v3-ch04-france-differential-history
  span: 798005:841262
  chunks:
  - id: braudel-civilization-capitalism-v3#u20-c1
    heading: 'A single line swivelling like a dial needle'
    span: 802364:803718
    why: 'States Braudel''s core methodological claim for the unit — that no single dividing line is permanent, only a series of shifting ones — and grounds the differential-history thesis in exogenous as well as endogenous causes.'
  - id: braudel-civilization-capitalism-v3#u20-c2
    heading: 'Rich margins, poor interior, and the refusal of ''periphery'''
    span: 808894:810288
    why: 'Braudel explicitly declines to call France''s rich border zones ''periphery,'' reserving that term for the backward zones of a world-economy, and backs the border/interior wealth inversion with a first-hand ancien-régime testimony.'
  - id: braudel-civilization-capitalism-v3#u20-c3
    heading: 'Morineau''s reversed trade balance'
    span: 805831:806757
    why: 'Shows Braudel testing the Rouen-Geneva line against Morineau''s trade-balance figures, which invert its usual reading (the south in surplus) — a model of quantitative contestation of a plausible historical narrative.'
  - id: braudel-civilization-capitalism-v3#u20-c4
    heading: 'Defining France I, II and III'
    span: 816148:816988
    why: 'Defines the tripartite spatial scheme — France I (western ports), France II (interior), France III (eastern border towns) — that organizes the rest of the unit''s argument.'
  - id: braudel-civilization-capitalism-v3#u20-c5
    heading: 'Toulouse satellized by its own periphery'
    span: 838694:839831
    why: 'Names the unit''s culminating claim: wealthy border-zone cities (Bordeaux, Lyon, Marseille) actively subordinated and ''satellized'' the landlocked interior (Toulouse), replaying the world-economy''s core-periphery dynamic inside France itself.'
- nn: 21
  unit_id: ch04-england-island-and-pound
  note_id: braudel-civilization-capitalism-v3-ch04-england-island-and-pound
  span: 841262:873864
  chunks:
  - id: braudel-civilization-capitalism-v3#u21-c1
    heading: 'England becomes an island, unrealized'
    span: 842352:843447
    why: 'States the chapter''s founding claim: England''s insularity was an accidental by-product of the end of continental entanglement, not a chosen strategy.'
  - id: braudel-civilization-capitalism-v3#u21-c2
    heading: 'The Channel as belatedly-recognized bulwark'
    span: 844811:845657
    why: 'Shows the Channel becoming boundary-infrastructure and, via two witnesses fifty years apart, an advantage only retroactively understood as such.'
  - id: braudel-civilization-capitalism-v3#u21-c3
    heading: 'Serial expulsion of continental rivals'
    span: 849117:849998
    why: 'Catalogues England''s reactive, one-rival-at-a-time institution-building (Italian bankers, Hanseatic League, Antwerp, Spain, Holland, France), the pattern the chapter later names explicitly.'
  - id: braudel-civilization-capitalism-v3#u21-c4
    heading: 'Fixed currency as the precondition for credit'
    span: 851522:851890
    why: 'Braudel''s most direct statement that the pound''s stability was the enabling infrastructure for English credit, contracts and financial power.'
  - id: braudel-civilization-capitalism-v3#u21-c5
    heading: 'Refusing the great-man explanation'
    span: 858646:859640
    why: 'Braudel explicitly rejects crediting one brilliant individual for the pound''s survival, pointing instead to a contingent Anglo-Spanish silver deal.'
  - id: braudel-civilization-capitalism-v3#u21-c6
    heading: 'Sterling''s stability as a weapon in serial rivalry'
    span: 873124:873862
    why: 'The chapter''s closing thesis: three centuries of monetary stability reframed not as foresight but as the accumulated product of insular, serially-directed aggression.'
- nn: 22
  unit_id: ch04-london-great-britain-national-debt
  note_id: braudel-civilization-capitalism-v3-ch04-london-great-britain-national-debt
  span: 873864:928967
  chunks:
  - id: braudel-civilization-capitalism-v3#u22-c1
    heading: 'London as the making of Britain'
    span: 873920:874894
    why: 'States the unit''s founding claim that England''s national market is London''s creation, framed against France''s divided capital allegiance.'
  - id: braudel-civilization-capitalism-v3#u22-c2
    heading: 'Scotland''s union and takeoff'
    span: 888095:888830
    why: 'Shows Braudel''s explanation for why the 1707 union did not become ''marginalization'' for Scotland, the counter-case to Ireland.'
  - id: braudel-civilization-capitalism-v3#u22-c3
    heading: 'Ireland as periphery'
    span: 893480:894412
    why: 'The unit''s explicit core/periphery framing of Ireland, borrowed from a colonial-Brazil analogy, applied inside the British Isles.'
  - id: braudel-civilization-capitalism-v3#u22-c4
    heading: 'The debt as the real weapon'
    span: 908240:909485
    why: 'The chapter''s pivot: inverts the pessimists'' reading of the national debt into the actual explanation for British victory.'
  - id: braudel-civilization-capitalism-v3#u22-c5
    heading: 'Eden Treaty floods French ports'
    span: 915793:916269
    why: 'Concrete evidence of the treaty''s disruptive effect on France, the empirical anchor for Braudel''s otherwise skeptical treatment of the treaty''s significance.'
  - id: braudel-civilization-capitalism-v3#u22-c6
    heading: 'Statistics as litmus test'
    span: 921687:922220
    why: 'Frames the closing methodological turn: statistics can sharpen but not resolve the puzzle of why smaller England beat larger France.'
- nn: 23
  unit_id: ch05-americas-spaces-and-slavery
  note_id: braudel-civilization-capitalism-v3-ch05-americas-spaces-and-slavery
  span: 928967:970578
  chunks:
  - id: braudel-civilization-capitalism-v3#u23-c1
    heading: 'A confessedly Eurocentric chapter opening'
    span: 929865:930919
    why: 'States the chapter''s self-aware Eurocentrism and the industrial-revolution question that motivates the whole survey of the non-European world.'
  - id: braudel-civilization-capitalism-v3#u23-c2
    heading: 'America as Europe''s own "doing"'
    span: 934127:934545
    why: 'Braudel''s boldest reframing of America not as Europe''s possession but as the deed that revealed Europe''s own nature.'
  - id: braudel-civilization-capitalism-v3#u23-c3
    heading: 'Open space as slavery''s necessity and the fugitive''s refuge'
    span: 938635:939635
    why: 'Shows the same vastness driving both the demand for bonded labour and the maroon communities (Palmares) that escaped it.'
  - id: braudel-civilization-capitalism-v3#u23-c4
    heading: 'Eric Williams and Marx: slavery as capitalism''s pedestal'
    span: 944756:945286
    why: 'Braudel''s clearest statement that Atlantic slavery was structurally essential to European capitalism, not incidental to it.'
  - id: braudel-civilization-capitalism-v3#u23-c5
    heading: '"The word genocide is not too strong"'
    span: 946187:946847
    why: 'Braudel''s explicit moral verdict on the New World''s demographic catastrophe, framed in his own core/periphery world-economy vocabulary.'
  - id: braudel-civilization-capitalism-v3#u23-c6
    heading: 'Dismissing climate determinism in tropical labour'
    span: 961698:962198
    why: 'Closes the labour-regime argument by refuting Adam Smith''s climate thesis with concrete cross-continental counter-examples, reinforcing that the labour sequence was economic, not racial or climatic.'
- nn: 24
  unit_id: ch05-colonies-against-europe
  note_id: braudel-civilization-capitalism-v3-ch05-colonies-against-europe
  span: 970578:1000820
  chunks:
  - id: braudel-civilization-capitalism-v3#u24-c1
    heading: 'The colonial pact: extraction and its overflow'
    span: 970883:971220
    why: 'States the mercantilist extraction relation in Jefferson''s own words and the currency-drain grievance that made the colonial pact structurally unstable.'
  - id: braudel-civilization-capitalism-v3#u24-c2
    heading: 'Industry blocked by policy, not capacity'
    span: 977399:977800
    why: 'Names explicitly that colonial industrial development was suppressed by European policy rather than any lack of colonial capacity or will.'
  - id: braudel-civilization-capitalism-v3#u24-c3
    heading: 'The Boston Tea Party as the break'
    span: 979034:979507
    why: 'Marks the narrative pivot from accumulated grievance to open rupture between the English colonies and the mother country.'
  - id: braudel-civilization-capitalism-v3#u24-c4
    heading: 'Adam Smith''s exception: foreign trade'
    span: 991776:992434
    why: 'Braudel credits this single Smith clause with locating the real economic mechanism behind colonial rebellion.'
  - id: braudel-civilization-capitalism-v3#u24-c5
    heading: 'Freedom for whites, silence on slavery'
    span: 989914:990347
    why: 'Braudel''s own aside naming a contradiction contemporaries largely declined to confront, aligned with the structural divide between the northern and southern colonies.'
  - id: braudel-civilization-capitalism-v3#u24-c6
    heading: 'Reading the succession in real time: England after Holland'
    span: 999641:1000815
    why: 'Gives Braudel''s climactic succession-of-centres claim in contemporaries'' own words, casting England as the next incumbent to be displaced as Holland once was.'
- nn: 25
  unit_id: ch05-spanish-portuguese-america
  note_id: braudel-civilization-capitalism-v3-ch05-spanish-portuguese-america
  span: 1000820:1043638
  chunks:
  - id: braudel-civilization-capitalism-v3#u25-c1
    heading: 'Marginalization within the world-economy'
    span: 1002233:1002607
    why: 'States Braudel''s core reframing of colonial America''s position as structural marginalization within a world-economy rather than simple exploitation.'
  - id: braudel-civilization-capitalism-v3#u25-c2
    heading: 'Spain as entrepot for foreigners'
    span: 1004902:1005338
    why: 'Explains why the rest of Europe, not Spain, captured most of the benefit of American silver.'
  - id: braudel-civilization-capitalism-v3#u25-c3
    heading: 'Smuggling as routine corruption'
    span: 1007088:1007523
    why: 'Vivid concrete evidence of smuggling and official corruption as a systemic, not incidental, feature of Spanish colonial trade.'
  - id: braudel-civilization-capitalism-v3#u25-c4
    heading: 'The treasure compared to India'
    span: 1024791:1025265
    why: 'Braudel''s key quantitative claim putting a figure on the ''treasure of treasures'' and comparing it to Europe''s extraction from India.'
  - id: braudel-civilization-capitalism-v3#u25-c5
    heading: 'Neither feudalism nor capitalism'
    span: 1041084:1041646
    why: 'The section''s methodological thesis: American colonial society resists both European categories and hosts capitalism only at its topmost commercial layer.'
- nn: 26
  unit_id: ch05-black-africa
  note_id: braudel-civilization-capitalism-v3-ch05-black-africa
  span: 1043638:1073163
  chunks:
  - id: braudel-civilization-capitalism-v3#u26-c1
    heading: 'East Africa as periphery of the Indian world-economy'
    span: 1044419:1044744
    why: 'States Braudel''s core/periphery framing explicitly: the East African coast as a peripheral zone of the Indian world-economy, not a unit of its own.'
  - id: braudel-civilization-capitalism-v3#u26-c2
    heading: 'No African Aztec or Inca to conquer'
    span: 1047877:1048206
    why: 'Gives Braudel''s structural explanation for why Europe never replicated territorial conquest in Africa as it did in the Americas.'
  - id: braudel-civilization-capitalism-v3#u26-c3
    heading: 'The interior protected by distance, density, and disease'
    span: 1048361:1049047
    why: 'Explains why powerful interior states escaped European control while coastal societies did not, grounding the coastal-trade-not-conquest pattern.'
  - id: braudel-civilization-capitalism-v3#u26-c4
    heading: 'African testimony on internal complicity'
    span: 1056693:1057391
    why: 'The direct testimonial evidence (Congo king, Resende, Cavazzi) underpinning the chapter''s collaborator-as-well-as-victim thesis.'
  - id: braudel-civilization-capitalism-v3#u26-c5
    heading: 'Senegambia''s terms of trade improve under pressure'
    span: 1068045:1069044
    why: 'Curtin''s price-index reconstruction is Braudel''s strongest empirical support for African economic agency rather than pure extraction.'
  - id: braudel-civilization-capitalism-v3#u26-c6
    heading: 'Braudel''s ambivalent closing aside'
    span: 1072444:1073160
    why: 'Braudel''s own hedge against letting demographic or exchange arguments soften European responsibility, a rare exposed authorial moment.'
- nn: 27
  unit_id: ch05-russia-state-serfdom-market
  note_id: braudel-civilization-capitalism-v3-ch05-russia-state-serfdom-market
  span: 1073163:1111900
  chunks:
  - id: braudel-civilization-capitalism-v3#u27-c1
    heading: 'Outside ''European Europe'''
    span: 1073205:1073850
    why: 'States the unit''s opening frame via Wallerstein, that Muscovy (like the Ottoman lands) sat outside the European world-economy proper.'
  - id: braudel-civilization-capitalism-v3#u27-c2
    heading: 'The state as ''a great rock in the middle of the sea'''
    span: 1080383:1081037
    why: 'Braudel''s clearest image of Tsarist omnipotence, contrasting Russian towns (no urban freedom) with the West and comparing pomestye grants to Spanish and Turkish analogues.'
  - id: braudel-civilization-capitalism-v3#u27-c3
    heading: 'The 1649 code: no way back'
    span: 1091143:1091959
    why: 'Traces serfdom''s legal closure step by step to the moment Braudel calls ''the point of no return.'''
  - id: braudel-civilization-capitalism-v3#u27-c4
    heading: 'Gratchev''s fortune and his cage'
    span: 1099246:1099878
    why: 'Concrete case of the section''s central paradox: immense serf wealth coexisting with continued legal bondage to a master.'
  - id: braudel-civilization-capitalism-v3#u27-c5
    heading: 'Moscow as Paris: an internal core-periphery map'
    span: 1108174:1108780
    why: 'Braudel''s most explicit statement that Russia is a world-economy with its own dominant center and zonal hierarchy, mapped directly onto France''s geography.'
  - id: braudel-civilization-capitalism-v3#u27-c6
    heading: 'Distance as the shape of the system'
    span: 1111317:1111625
    why: 'Names the single structural variable Braudel treats as doing the most explanatory work: distance as shaping force, defense, and divider of zones.'
- nn: 28
  unit_id: ch05-russia-siberia-european-intrusion
  note_id: braudel-civilization-capitalism-v3-ch05-russia-siberia-european-intrusion
  span: 1111900:1141557
  chunks:
  - id: braudel-civilization-capitalism-v3#u28-c1
    heading: 'Russia''s Siberia as an undercapitalized parallel to Europe''s America'
    span: 1111925:1112824
    why: 'Opens the unit with Braudel''s explicit comparative framing — Russia''s Siberian conquest as a structural analogue to Europe''s colonization of the Americas, under harsher resource constraints — which sets up the whole unit''s core/periphery argument.'
  - id: braudel-civilization-capitalism-v3#u28-c2
    heading: 'The promyslenniki: freelance conquest ahead of the state'
    span: 1114512:1114939
    why: 'Names the promyslenniki as the actual agents of Siberian conquest — individual freelance pioneers rather than state design — central to Braudel''s picture of how a world-economy''s frontier is settled from below before administration catches up.'
  - id: braudel-civilization-capitalism-v3#u28-c3
    heading: 'Gmelin on the Tunguses'
    span: 1116547:1117035
    why: 'The unit''s one passage of direct period voice, showing how Russia''s own periphery (Siberia''s native peoples) was rendered legible and ''other'' even as Russia itself was being othered by Europe — periphery within periphery.'
  - id: braudel-civilization-capitalism-v3#u28-c4
    heading: 'The Russian giant not firmly established'
    span: 1129553:1131142
    why: 'States Braudel''s thesis for this section outright: Russia''s frontiers were controlled from outside by foreign merchant networks in Peking, Istanbul, and the European capitals — the empirical basis for calling Russia''s world-economy structurally weak.'
  - id: braudel-civilization-capitalism-v3#u28-c5
    heading: 'The haemorrhage of specie'
    span: 1133158:1133557
    why: 'Names the mechanism — the ''haemorrhage of specie'' — by which European merchants captured peripheral markets (Russia, the Levant, the Indies alike) without conquest, the clearest statement of core/periphery extraction logic in this unit.'
  - id: braudel-civilization-capitalism-v3#u28-c6
    heading: 'The 1765 memorandum''s India-and-China model'
    span: 1134662:1134950
    why: 'The memorandum''s counter-model — imitate India and China''s closed-door trade — is Braudel''s chosen illustration of Russian awareness of, and failed resistance to, incorporation into the European world-economy.'
- nn: 29
  unit_id: ch05-turkish-empire
  note_id: braudel-civilization-capitalism-v3-ch05-turkish-empire
  span: 1141557:1185083
  chunks:
  - id: braudel-civilization-capitalism-v3#u29-c1
    heading: 'The Ottoman Empire as a world-economy from the start'
    span: 1141576:1142581
    why: 'States Braudel''s founding claim that the Ottoman polity was itself a rival world-economy, with the pax turcica as the stabilizing counterpart to the Grand Seigneur''s despotic authority.'
  - id: braudel-civilization-capitalism-v3#u29-c2
    heading: 'Political chronology versus economic chronology'
    span: 1148505:1149949
    why: 'Braudel''s core historiographical move: economic vitality (population growth, Balkan market integration) continued through supposedly decisive political dates, so decline cannot be read off political events.'
  - id: braudel-civilization-capitalism-v3#u29-c3
    heading: 'A migrating internal centre of gravity'
    span: 1151176:1151570
    why: 'Shows the Ottoman world-economy''s own succession of dominant trade centres (Bursa, Aleppo/Alexandria, Smyrna, Istanbul), a self-contained analogue of the volume''s larger dominant-city thesis.'
  - id: braudel-civilization-capitalism-v3#u29-c4
    heading: 'Caravans as an Islamic monopoly'
    span: 1162611:1163434
    why: 'Explains the structural mechanism behind Ottoman trade independence: silk stayed beyond Dutch and English capture because caravan routes, unlike sea lanes, were never open to Western control.'
  - id: braudel-civilization-capitalism-v3#u29-c5
    heading: 'Artisans of survival or rats leaving a sinking ship'
    span: 1179206:1179577
    why: 'States the chapter''s organizing question about the empire''s merchants and gives Braudel''s answer: no genuine decadence before the early nineteenth century.'
  - id: braudel-civilization-capitalism-v3#u29-c6
    heading: 'The industrial revolution as the true cause of collapse'
    span: 1183997:1184965
    why: 'Delivers the unit''s closing verdict, rejecting contemporary European bravado about Ottoman collapse and locating the real cause in nineteenth-century industrialization rather than earlier military or political failure.'
- nn: 30
  unit_id: ch05-far-east-european-assault
  note_id: braudel-civilization-capitalism-v3-ch05-far-east-european-assault
  span: 1185083:1221393
  chunks:
  - id: braudel-civilization-capitalism-v3#u30-c1
    heading: 'Three world-economies, one intermittent whole'
    span: 1185213:1186559
    why: 'States Braudel''s core spatial model for the whole chapter: three coexisting world-economies (Islam, India, China) that periodically fuse into a single Far Eastern super-world-economy via a pendulum swinging around India.'
  - id: braudel-civilization-capitalism-v3#u30-c2
    heading: 'The disproportion of numbers'
    span: 1194728:1196044
    why: 'Marshals the population data (10,000 Portuguese, 1,200 English in Calcutta, 31,000 English ruling all India) that grounds Braudel''s central puzzle of how so few Europeans came to dominate so much.'
  - id: braudel-civilization-capitalism-v3#u30-c3
    heading: 'Sepoys: Indian troops to conquer India'
    span: 1197425:1197847
    why: 'Crystallizes the chapter''s thesis that European military conquest was performed mainly by native soldiers recruited into company armies, not by Europeans themselves.'
  - id: braudel-civilization-capitalism-v3#u30-c4
    heading: 'Native brokers as indispensable collaborators'
    span: 1198014:1199194
    why: 'Shows commercial conquest mirrored military conquest: local merchant networks (Armenians, Banyans, Gujaratis) were courted, not displaced, because European trade could not function without them.'
  - id: braudel-civilization-capitalism-v3#u30-c5
    heading: 'Bullion as Asia''s one accepted currency'
    span: 1201521:1202706
    why: 'Lays out the reverse-trade-balance thesis — Asia would only sell for gold and especially silver — that Braudel reframes as European leverage rather than weakness.'
  - id: braudel-civilization-capitalism-v3#u30-c6
    heading: 'Command of the sea, not the land'
    span: 1206676:1207308
    why: 'Assembles the maxims of Almeida and Albuquerque that make explicit Europe''s deliberate strategy of maritime rather than territorial power in Asia before the eighteenth-century turn to conquest.'
- nn: 31
  unit_id: ch05-india-villages-artisans-mogul
  note_id: braudel-civilization-capitalism-v3-ch05-india-villages-artisans-mogul
  span: 1221393:1272898
  chunks:
  - id: braudel-civilization-capitalism-v3#u31-c1
    heading: 'The village was never self-sufficient'
    span: 1221415:1223579
    why: 'Braudel''s opening reframing — villages plural, structurally open to money and outside authority — sets up the extractive vertical logic the rest of the unit traces.'
  - id: braudel-civilization-capitalism-v3#u31-c2
    heading: 'The jagir and the ''great machine'''
    span: 1225477:1226099
    why: 'Braudel''s own machine metaphor for the tax-and-tenure apparatus converting peasant surplus into cash for court and aristocracy is the unit''s clearest statement of vertical extraction.'
  - id: braudel-civilization-capitalism-v3#u31-c3
    heading: 'Doubting the caste-rigidity thesis'
    span: 1236031:1236690
    why: 'Habib''s rebuttal, quoted at length, is the pivot of Braudel''s argument that caste did not freeze artisan labor and thus cannot alone explain the absence of an Indian industrial revolution.'
  - id: braudel-civilization-capitalism-v3#u31-c4
    heading: 'Deficiency of tools, richness of skill'
    span: 1237444:1238173
    why: 'The tools-versus-specialization paradox is where Braudel relocates the real constraint on Indian industry from culture to relative factor costs.'
  - id: braudel-civilization-capitalism-v3#u31-c5
    heading: 'A national market'
    span: 1251578:1251938
    why: 'Braudel''s own hedged claim that India possessed a money-economy-bound national market directly engages this volume''s world-economy/national-market distinction.'
  - id: braudel-civilization-capitalism-v3#u31-c6
    heading: 'An astonishing machine, rigid yet fragile'
    span: 1264471:1264886
    why: 'Braudel''s single-sentence diagnosis of Mogul power as a machine requiring constant maintenance frames the unit''s account of decline as internal fatigue rather than conquest.'
- nn: 32
  unit_id: ch05-india-decline-malacca-new-centres
  note_id: braudel-civilization-capitalism-v3-ch05-india-decline-malacca-new-centres
  span: 1272898:1317790
  chunks:
  - id: braudel-civilization-capitalism-v3#u32-c1
    heading: 'Caste as the mechanism of Indian merchant capital'
    span: 1274999:1275571
    why: 'States Braudel''s rebuttal to ''India lacked capitalism'': caste-based mercantile solidarity, not Western-style landed dynasties, let Indian merchant capital accumulate across generations.'
  - id: braudel-civilization-capitalism-v3#u32-c2
    heading: 'Low wages as a structural, not moral, feature'
    span: 1280243:1280759
    why: 'Gives Braudel''s structural explanation for India''s chronically low wages as the necessary counterpart of the ancient, sustained inflow of precious metals.'
  - id: braudel-civilization-capitalism-v3#u32-c3
    heading: 'India as instrument, then deindustrialized'
    span: 1283243:1283729
    why: 'States the external half of Braudel''s explanation for India''s decline: subordination to British imperial strategy, culminating in deliberate deindustrialization.'
  - id: braudel-civilization-capitalism-v3#u32-c4
    heading: 'Malacca''s geography as destiny'
    span: 1291826:1292420
    why: 'Shows Braudel''s geography-as-destiny argument for why the Far East''s super-world-economy centred specifically on Malacca.'
  - id: braudel-civilization-capitalism-v3#u32-c5
    heading: 'Legible Batavia loses to chaotic Calcutta'
    span: 1309950:1310605
    why: 'Captures the counter-intuitive engine of English ascendancy: unplanned, illegible urban growth eclipsed the Dutch V.O.C.''s engineered, legible Batavia.'
  - id: braudel-civilization-capitalism-v3#u32-c6
    heading: 'The machine revolution as a weapon of domination'
    span: 1316968:1317788
    why: 'Braudel''s closing thesis, backed by Bairoch''s GNP data: near-parity between Europe and the rest of the world lasted until the machine revolution, which functioned as a weapon of domination.'
- nn: 33
  unit_id: ch06-relevant-comparisons
  note_id: braudel-civilization-capitalism-v3-ch06-relevant-comparisons
  span: 1317790:1370846
  chunks:
  - id: braudel-civilization-capitalism-v3#u33-c1
    heading: 'Revolution as dialectic, not takeoff'
    span: 1321708:1322330
    why: 'States the unit''s governing method — rejecting Rostow''s single-moment ''takeoff'' for two simultaneous long- and short-term rhythms — before any of the case studies that follow it.'
  - id: braudel-civilization-capitalism-v3#u33-c2
    heading: 'England at the centre, the Third World on the periphery'
    span: 1334365:1335243
    why: 'Names the core/periphery world-economy hierarchy Braudel uses to explain why the same growth strategy succeeds at the centre and fails at the periphery.'
  - id: braudel-civilization-capitalism-v3#u33-c3
    heading: 'Alexandria''s steam toys and the closed world-economy'
    span: 1339401:1340922
    why: 'The first ''revolution that came to nothing'' — ancient steam power foreclosed by slavery and Rome''s closing of open trade routes — ending on the chapter''s organizing question about an open world-economy.'
  - id: braudel-civilization-capitalism-v3#u33-c4
    heading: 'The medieval mill revolution (fulling-mills)'
    span: 1342208:1342604
    why: 'Carus-Wilson''s judgment that fulling-mill mechanization was as decisive as eighteenth-century mechanized spinning is Braudel''s strongest evidence for a genuine industrial revolution centuries before England''s.'
  - id: braudel-civilization-capitalism-v3#u33-c5
    heading: 'Milan''s failure and Lynn White''s aphorism'
    span: 1355667:1356729
    why: 'States the unit''s central puzzle directly — why a technically ready revolution ''came to nothing'' — and answers it with Braudel''s anti-technological-determinist thesis.'
  - id: braudel-civilization-capitalism-v3#u33-c6
    heading: 'Coal, and ''Newcastle is Peru'''
    span: 1362347:1363075
    why: 'Grounds the abstract argument in the concrete mechanism (wood scarcity forcing coal) behind England''s own earlier, partial ''first industrial revolution'' of 1560-1640.'
- nn: 34
  unit_id: ch06-britain-agriculture-demography-technology-cotton
  note_id: braudel-civilization-capitalism-v3-ch06-britain-agriculture-demography-technology-cotton
  span: 1370846:1419327
  chunks:
  - id: braudel-civilization-capitalism-v3#u34-c1
    heading: 'The definitional impossibility of "industrialization"'
    span: 1372377:1372773
    why: 'Braudel''s reply to Bertin''s despair states outright that industrialization is a totalizing category rather than a technology or sector, which is the chapter''s methodological thesis in miniature.'
  - id: braudel-civilization-capitalism-v3#u34-c2
    heading: 'Against the "flight of steps" model'
    span: 1373147:1373845
    why: 'This is Braudel''s explicit statement of the chapter''s central tension: forced to use a sequential sector-by-sector exposition while insisting the underlying reality was synchronic and interdependent.'
  - id: braudel-civilization-capitalism-v3#u34-c3
    heading: 'The agricultural "virtuous circle"'
    span: 1381266:1382002
    why: 'The chapter''s clearest worked example of the synchronic, mutually-reinforcing causation Braudel argues the sector-by-sector model obscures.'
  - id: braudel-civilization-capitalism-v3#u34-c4
    heading: 'Tocqueville''s Manchester'
    span: 1392305:1393649
    why: 'Grounds the demographic and industrial-conurbation argument in eyewitness testimony of the human cost behind the labor-supply expansion Braudel otherwise analyzes statistically.'
  - id: braudel-civilization-capitalism-v3#u34-c5
    heading: 'Technology as cumulative process, not prime mover'
    span: 1408204:1408517
    why: 'States Braudel''s alternative to Marx''s technology-as-primum-mobile: the revolution as an open-ended accretion of innovations that only retrospectively cohere into a single "revolution."'
  - id: braudel-civilization-capitalism-v3#u34-c6
    heading: 'Cotton: an ancien-regime industry that succeeded'
    span: 1411324:1411764
    why: 'Captures Braudel''s rebuttal to revisionists downplaying cotton: its novelty lay not in technique but in being the first such textile boom to convert into sustained, continuous growth.'
- nn: 35
  unit_id: ch06-long-distance-trade-inland-transport
  note_id: braudel-civilization-capitalism-v3-ch06-long-distance-trade-inland-transport
  span: 1419327:1447218
  chunks:
  - id: braudel-civilization-capitalism-v3#u35-c1
    heading: 'The English commercial revolution, stated'
    span: 1419358:1420014
    why: 'Opens the unit''s central quantitative claim (export index 100 to 550) and frames the thesis that the commercial and industrial revolutions were reciprocal engines.'
  - id: braudel-civilization-capitalism-v3#u35-c2
    heading: 'The periphery as a reserve for the dominant world-economy'
    span: 1423759:1424362
    why: 'States Braudel''s core-periphery thesis in his own words: peripheral trading partners as an extractive reserve for a dominant world-economy, secured by naval mastery over distance.'
  - id: braudel-civilization-capitalism-v3#u35-c3
    heading: 'Guha''s surplus comparison: India against domestic investment'
    span: 1430987:1431882
    why: 'Gives Braudel''s own resolution of the domestic-versus-foreign-trade historiographical dispute via Guha''s surplus comparison, with concrete India-versus-domestic-investment figures.'
  - id: braudel-civilization-capitalism-v3#u35-c4
    heading: 'Canal fever and the Duke of Bridgewater''s credit'
    span: 1436646:1437420
    why: 'Captures the concrete mechanics and improvised financing of canal-building that Braudel treats as decisive, judiciously-run infrastructure rather than incidental to industrialization.'
  - id: braudel-civilization-capitalism-v3#u35-c5
    heading: 'Already there in embryo, yet slow to emerge'
    span: 1444251:1444884
    why: 'States Braudel''s central methodological claim of this section: deep economic transformation is slow, structural, and invisible in the short term.'
  - id: braudel-civilization-capitalism-v3#u35-c6
    heading: 'It encountered a goal, rather than pursuing one'
    span: 1446240:1447216
    why: 'Closes the unit with Braudel''s explicit rejection of a teleological narrative for the industrial revolution, the clearest single statement of his anti-progress-narrative historiography.'
- nn: 36
  unit_id: ch06-growth-and-division-of-labour
  note_id: braudel-civilization-capitalism-v3-ch06-growth-and-division-of-labour
  span: 1447218:1483718
  chunks:
  - id: braudel-civilization-capitalism-v3#u36-c1
    heading: 'Growth potential vs. conjoncture'
    span: 1455152:1456357
    why: 'States Braudel''s longue durée/conjoncture split applied directly to growth theory, the unit''s central methodological move.'
  - id: braudel-civilization-capitalism-v3#u36-c2
    heading: 'The putting-out system''s logic'
    span: 1460399:1461664
    why: 'Explains why the putting-out system persisted as rational demand-side elasticity rather than mere backwardness, before the factory disrupted it.'
  - id: braudel-civilization-capitalism-v3#u36-c3
    heading: 'The rise of the industrialist'
    span: 1468531:1469084
    why: 'Marks the emergence of the specialist industrialist from the all-purpose merchant-banker, the unit''s key social and economic type.'
  - id: braudel-civilization-capitalism-v3#u36-c4
    heading: 'The Fischer-Clark sector scheme'
    span: 1474583:1474926
    why: 'Shows Braudel adopting the primary/secondary/tertiary classification to track structural change in the British economy.'
  - id: braudel-civilization-capitalism-v3#u36-c5
    heading: 'Britain''s core-periphery reversal'
    span: 1480910:1481357
    why: 'States the unit''s most dramatic empirical claim — that industrialization inverted the country''s inherited south-over-north hierarchy.'
- nn: 37
  unit_id: ch06-finance-conjuncture-living-standards
  note_id: braudel-civilization-capitalism-v3-ch06-finance-conjuncture-living-standards
  span: 1483718:1527124
  chunks:
  - id: braudel-civilization-capitalism-v3#u37-c1
    heading: 'Finance capitalism as a recurring stage, not modernity''s invention'
    span: 1486811:1488161
    why: 'Braudel uses Hilferding''s ''unholy trinity'' to argue finance capitalism is a periodic culmination of accumulated commercial capital (Genoa, Amsterdam, and now London), not a unique 1900s phenomenon — the core move behind his succession-of-dominant-centres thesis.'
  - id: braudel-civilization-capitalism-v3#u37-c2
    heading: 'The Clearing House restates the medieval fairs, faster'
    span: 1493540:1494345
    why: 'Rubichon''s 1811 description of London''s daily netting mechanism, set against Braudel''s own comparison to the quarterly fairs of Lyon and Piacenza, shows financial infrastructure intensifying in tempo without changing in kind.'
  - id: braudel-civilization-capitalism-v3#u37-c3
    heading: 'French vs. British readings of the conjuncture'
    span: 1502456:1503008
    why: 'States the chapter''s central historiographic fork — exogenous world-economy causation (the French school) versus national/endogenous causation (Ashton and the British school) — with a concrete dueling example of 1778-91 price stagnation.'
  - id: braudel-civilization-capitalism-v3#u37-c4
    heading: 'Britain as the world-economy''s sounding-board'
    span: 1506012:1506818
    why: 'Names Braudel''s core claim explicitly: Britain''s price climate was ''world time'' with London as epicentre but not sole author — the world-economy concept in its most direct statement in this unit.'
  - id: braudel-civilization-capitalism-v3#u37-c5
    heading: 'Two generations sacrificed: the human cost of industrialization'
    span: 1516461:1518059
    why: 'Anchors Braudel''s real-wages argument in eyewitness testimony (Pillet, Simond) rather than statistics alone — the passage the whole living-standards argument is built to justify.'
  - id: braudel-civilization-capitalism-v3#u37-c6
    heading: 'Braudel''s own 1972-4 forecast: ordinary cycle or reversal of the secular trend?'
    span: 1525736:1526245
    why: 'Braudel steps out of historical description to make his own oracular reading of a live crisis from a deep, only partly-explained cyclical pattern — the closest this unit comes to WMP''s own forecasting posture.'
- nn: 38
  unit_id: conclusion-past-and-present
  note_id: braudel-civilization-capitalism-v3-conclusion-past-and-present
  span: 1527124:1570525
  chunks:
  - id: braudel-civilization-capitalism-v3#u38-c1
    heading: 'Testing the model against the present'
    span: 1528828:1529998
    why: 'States Braudel''s deliberate method for this final chapter: launching the book''s historical model onto the present as a live test rather than summarizing the past.'
  - id: braudel-civilization-capitalism-v3#u38-c2
    heading: 'Roadmap: the essential message of this long quest'
    span: 1530435:1531831
    why: 'Lays out the conclusion''s four-part structure and names the capitalism/market-economy distinction as the book''s central claim.'
  - id: braudel-civilization-capitalism-v3#u38-c3
    heading: 'Capitalism''s forms already deployed, not staged'
    span: 1534151:1535097
    why: 'Rejects the mercantile-to-industrial-to-finance stage narrative in favor of Braudel''s longue-duree view of capitalism as always-already multiform.'
  - id: braudel-civilization-capitalism-v3#u38-c4
    heading: 'The ability to choose'
    span: 1537655:1539305
    why: 'Braudel''s most compact definition of capitalism as a social position defined by freedom of choice rather than by sector or ownership.'
  - id: braudel-civilization-capitalism-v3#u38-c5
    heading: 'State and capital: collusion across centuries'
    span: 1542920:1544529
    why: 'Grounds the state-capital symbiosis thesis with a concrete historical claim spanning the sixteenth to the twentieth century.'
  - id: braudel-civilization-capitalism-v3#u38-c6
    heading: 'The country at the centre of a world-economy'
    span: 1568925:1570524
    why: 'Closes the unit by binding the domestic capitalism/market-economy distinction to the book''s dominant-centre world-economy hierarchy.'
