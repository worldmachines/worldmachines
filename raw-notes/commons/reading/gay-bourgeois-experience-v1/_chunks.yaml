source: gay-bourgeois-experience-v1
units:
- nn: 1
  unit_id: orientations-1-sketch-map
  note_id: gay-bourgeois-experience-v1-orientations-1-sketch-map
  span: 0:15862
  chunks:
  - id: gay-bourgeois-experience-v1#u01-c1
    heading: 'Victoria was not a Victorian'
    span: 1818:2167
    why: 'States the book''s periodizing thesis: Victoria and Freud are emblems for a mid-century cultural shift, not literal reference points.'
  - id: gay-bourgeois-experience-v1#u01-c2
    heading: 'Vienna was not a real city'
    span: 2767:3333
    why: 'Defines Gay''s anthropological, discontinuous concept of "culture" against the convenient fictions historians impose on it.'
  - id: gay-bourgeois-experience-v1#u01-c3
    heading: 'A family of desires and anxieties'
    span: 6539:7414
    why: 'Names Gay''s governing concept of the bourgeoisie as a "family of desires and anxieties" and stakes the book''s American evidentiary strategy.'
  - id: gay-bourgeois-experience-v1#u01-c4
    heading: 'Against the anesthetic-wife stereotype'
    span: 8742:9133
    why: 'Names precisely the repressive-Victorian stereotype the whole project is written to complicate, Gay''s natural foil to Foucault''s repressive hypothesis.'
  - id: gay-bourgeois-experience-v1#u01-c5
    heading: 'Three adversaries of the fin-de-siècle bourgeoisie'
    span: 11343:11805
    why: 'Previews the concluding volumes'' argument that bourgeois culture was squeezed between aristocracy, labor, and the avant-garde.'
  - id: gay-bourgeois-experience-v1#u01-c6
    heading: 'History informed by psychoanalysis, not psychohistory'
    span: 14688:15369
    why: 'States Gay''s explicit methodological self-definition, notably declining the label "psychohistory" that this project itself adopts for a different, forecasting-oriented purpose.'
- nn: 2
  unit_id: orientations-2-dimensions-experience
  note_id: gay-bourgeois-experience-v1-orientations-2-dimensions-experience
  span: 15862:36359
  chunks:
  - id: gay-bourgeois-experience-v1#u02-c1
    heading: 'The Fliess letter as exemplar of an experience'
    span: 18833:20320
    why: 'This is the book''s founding anecdote — Gay explicitly calls it ''the exemplar of an experience'' and says the whole book is ''an extended commentary on it.'''
  - id: gay-bourgeois-experience-v1#u02-c2
    heading: 'Defining experience: mind meets world'
    span: 22239:23353
    why: 'States the book''s operative definition of ''experience,'' the concept the whole methodological chapter is built to justify.'
  - id: gay-bourgeois-experience-v1#u02-c3
    heading: 'Against false-consciousness reductionism: the eighteenth-century map'
    span: 24928:25781
    why: 'Gay''s clearest statement against reducing bourgeois self-understanding to mere ideology or false consciousness, via the map analogy.'
  - id: gay-bourgeois-experience-v1#u02-c4
    heading: 'Not always the opposite of what they seem'
    span: 26225:26638
    why: 'Gay''s explicit guardrail against a naive surface/depth hermeneutics of suspicion, central to how he will read bourgeois reticence throughout the book.'
  - id: gay-bourgeois-experience-v1#u02-c5
    heading: 'Wishes objectified into institutions'
    span: 31605:32286
    why: 'Gay''s account of how private psychic material becomes autonomous public/cultural reality — the theoretical basis for treating technology and institutions as active forces later in the book.'
  - id: gay-bourgeois-experience-v1#u02-c6
    heading: 'No bourgeois experience, only bourgeois experiences'
    span: 33479:34251
    why: 'The sharpest statement of the book''s central methodological problem — individual experience versus collective/class-level historical narrative — that the rest of the volume must answer.'
- nn: 3
  unit_id: strain-1-names-things
  note_id: gay-bourgeois-experience-v1-strain-1-names-things
  span: 36359:71364
  chunks:
  - id: gay-bourgeois-experience-v1#u03-c1
    heading: 'A family of desires and anxieties'
    span: 37893:38357
    why: 'States Gay''s core definitional move for the whole book: the bourgeoisie held together by strain more than by shared interest, with naming disputes as the diagnostic symptom.'
  - id: gay-bourgeois-experience-v1#u03-c2
    heading: 'The falling career of Mittelstand'
    span: 39827:40937
    why: 'The chapter''s clearest worked example of a name''s semantic decline over the century functioning as direct evidence of real social and status anxiety.'
  - id: gay-bourgeois-experience-v1#u03-c3
    heading: 'English reluctance to be ''bourgeois'''
    span: 41678:42203
    why: 'Shows the specifically English symptom: applying ''bourgeois'' freely to other nations'' middle classes while resisting it as a self-description, with Wilde''s epigram and Beatrice Webb''s diary as evidence.'
  - id: gay-bourgeois-experience-v1#u03-c4
    heading: 'Inequality within the bourgeoisie itself'
    span: 55066:56532
    why: 'Grounds the definitional argument in hard census data (Bochum, Barmen), showing the ''middle class'' spanned near-poverty to wealth concentration too steep to support a single coherent identity.'
  - id: gay-bourgeois-experience-v1#u03-c5
    heading: 'No single bourgeois character'
    span: 69628:71362
    why: 'Delivers the chapter''s closing punchline by contrasting two incompatible caricatures of ''the bourgeois'' (boring rentier vs. arrogant exploiter) under the same word.'
- nn: 4
  unit_id: strain-2-tempting-simplicities
  note_id: gay-bourgeois-experience-v1-strain-2-tempting-simplicities
  span: 71364:81283
  chunks:
  - id: gay-bourgeois-experience-v1#u04-c1
    heading: 'The Psychology of Classification and Nietzsche''s Caricature'
    span: 71390:72792
    why: 'States Gay''s psychoanalytic premise — that class caricature answers a regressive craving for simplicity, illustrated by Nietzsche''s aphorism on societies degrading their adversaries — before the unit turns to how this played out for the bourgeoisie specifically.'
  - id: gay-bourgeois-experience-v1#u04-c2
    heading: 'One Label, Incompatible Realities'
    span: 72794:73633
    why: 'Supplies the concrete counter-evidence (Nonconformist vs. Catholic bourgeois, arranged vs. love marriages, industrialist as ideal vs. upstart) that the unified label "bourgeoisie" suppressed.'
  - id: gay-bourgeois-experience-v1#u04-c3
    heading: 'Garnier-Pages: Denying Class While Naming It'
    span: 73635:74340
    why: 'The anecdote of a deputy who denies that classes exist in France and then unthinkingly remarks on "many bourgeois" in the room is Gay''s sharpest illustration of how compulsory class vocabulary had become.'
  - id: gay-bourgeois-experience-v1#u04-c4
    heading: 'The Rising-Bourgeoisie Folk-Tale'
    span: 75781:76344
    why: 'Names and diagnoses the master historiographical device — the "rising bourgeoisie" story — that the rest of the unit goes on to interrogate and partly discredit.'
  - id: gay-bourgeois-experience-v1#u04-c5
    heading: 'Revisionists and Engels''s Own Reversal'
    span: 79785:81058
    why: 'Gay''s clinching evidence against the triumphalist narrative: Engels moved from declaring the bourgeoisie England''s undisputed ruling class (1845) to admitting it "never held undivided sway" (1892), conceding the aristocracy kept government offices throughout the supposed bourgeois century.'
- nn: 5
  unit_id: strain-3-battle-perceptions
  note_id: gay-bourgeois-experience-v1-strain-3-battle-perceptions
  span: 81283:103554
  chunks:
  - id: gay-bourgeois-experience-v1#u05-c1
    heading: 'Heine''s Salon of 1843: caricature at its most inventive'
    span: 82018:82683
    why: 'The unit''s clearest specimen of the hostile caricature''s imaginative reach, showing how bourgeois greed gets read into unrelated subject matter.'
  - id: gay-bourgeois-experience-v1#u05-c2
    heading: 'The charge that bourgeois cannot love'
    span: 84429:85538
    why: 'States the central bourgeoisophobe indictment (mechanical rationality substituting for sincere feeling) in its most quotable, near-Freudian formula.'
  - id: gay-bourgeois-experience-v1#u05-c3
    heading: 'Gay''s historiographical caution'
    span: 86894:88386
    why: 'The unit''s methodological pivot: it is the reasoning that lets Gay report the caricature without adopting it as fact.'
  - id: gay-bourgeois-experience-v1#u05-c4
    heading: 'Riehl''s self-interested defense of the Burger order'
    span: 91961:92610
    why: 'Anchors the counter-tradition of confident bourgeois self-praise and shows Gay flagging its self-interest just as he flags the critics'' projection.'
  - id: gay-bourgeois-experience-v1#u05-c5
    heading: 'Even the Manifesto concedes civilizational credit'
    span: 96331:97261
    why: 'Shows Gay''s central evidentiary move: citing Marx and Engels''s own praise to demonstrate that ambivalence, not clean contempt, was the honest position even for the bourgeoisie''s harshest critics.'
  - id: gay-bourgeois-experience-v1#u05-c6
    heading: 'Metternich''s ''one and many'': the unit''s closing figure'
    span: 102597:103552
    why: 'The unit''s resolution: rather than a definition, Gay offers a description of coalescence-under-pressure, using Metternich''s 1820 image of a protean ''intermediate class.'''
- nn: 6
  unit_id: architects-1-sway-new
  note_id: gay-bourgeois-experience-v1-architects-1-sway-new
  span: 103554:130367
  chunks:
  - id: gay-bourgeois-experience-v1#u06-c1
    heading: 'Heine: an age that has measured, weighed, and reckoned its own abundance'
    span: 107569:108084
    why: 'States the Saint-Simonian version of progress-as-quantification underlying the bourgeois century''s optimism, and directly resonates with legibility as a mode of apprehending the world.'
  - id: gay-bourgeois-experience-v1#u06-c2
    heading: 'The incantatory ''new'': Burckhardt to Durkheim'
    span: 120736:122237
    why: 'The unit''s central rhetorical evidence for the cult of the new, assembling contemporaries across decades and genres compulsively declaring their own moment unprecedented.'
  - id: gay-bourgeois-experience-v1#u06-c3
    heading: 'The new middle class expands unchecked'
    span: 126595:127158
    why: 'The hardest demographic evidence in the unit for the rise of a genuinely new social formation of clerks, distinct from the older commercial bourgeoisie.'
  - id: gay-bourgeois-experience-v1#u06-c4
    heading: 'Wilkie Collins''s conquering suburb-builders'
    span: 118597:119067
    why: 'Shows contemporaries reaching for martial, epochal language to describe ordinary suburban construction, capturing how thoroughly the rhetoric of dramatic change had saturated everyday description.'
  - id: gay-bourgeois-experience-v1#u06-c5
    heading: 'Bagehot: a new world of ideas as consequential as railways'
    span: 122239:122971
    why: 'An explicit contemporary argument that invisible ideological transformation reshaped society as irreversibly as visible infrastructure, the clearest single articulation of the unit''s thesis.'
  - id: gay-bourgeois-experience-v1#u06-c6
    heading: 'Architects who were also martyrs: constrained mobility and authoritarian office life'
    span: 128988:130365
    why: 'Gay''s pivot from celebrating the new middle class''s dynamism to showing its members were also disciplined and constrained, setting up the chapter''s ''architects and martyrs'' framing.'
- nn: 7
  unit_id: architects-2-age-express-trains
  note_id: gay-bourgeois-experience-v1-architects-2-age-express-trains
  span: 130367:160833
  chunks:
  - id: gay-bourgeois-experience-v1#u07-c1
    heading: 'Architects of change also become martyrs'
    span: 130396:131116
    why: 'States the chapter''s thesis: the bourgeoisie''s own dynamism exacts psychic and material casualties even as it drives nineteenth-century progress.'
  - id: gay-bourgeois-experience-v1#u07-c2
    heading: 'Nietzsche, Freud, Durkheim on the anxiety of change'
    span: 131118:132317
    why: 'Gives Gay''s theoretical spine: three near-contemporaries independently diagnosed anxiety/anomie as the price of change itself, not just of misfortune.'
  - id: gay-bourgeois-experience-v1#u07-c3
    heading: 'Gautier: the bourgeois unsure of his role'
    span: 134243:134669
    why: 'Shows bourgeois anxiety as diffuse class self-uncertainty about identity and conduct, not only a reaction to named political enemies.'
  - id: gay-bourgeois-experience-v1#u07-c4
    heading: 'The railway as metaphor for speed and dread'
    span: 148996:149513
    why: 'Names the chapter''s organizing image — the express train — and Gay''s claim that its anxious charge was inseparable from an erotic one.'
  - id: gay-bourgeois-experience-v1#u07-c5
    heading: 'Thackeray''s antediluvian nostalgia'
    span: 150411:151421
    why: 'Illustrates how contemporaries dramatized the railway''s speed as an epochal rupture separating a lost pre-railway world from the new one.'
  - id: gay-bourgeois-experience-v1#u07-c6
    heading: 'The self-made architect of his own fortune'
    span: 157811:159041
    why: 'Traces the countervailing bourgeois ideology of hope — the Enlightenment-descended myth of mobility that promised anxiety-free mastery of one''s fate.'
- nn: 8
  unit_id: erotic-record-1-mabel-loomis
  note_id: gay-bourgeois-experience-v1-erotic-record-1-mabel-loomis
  span: 160833:185927
  chunks:
  - id: gay-bourgeois-experience-v1#u08-c1
    heading: 'Justifying the source: an unrepressed diarist as historian''s gift'
    span: 160894:161414
    why: 'States Gay''s methodological premise for the whole book: private erotic documentation is rare, and Todd''s diary is exceptional for supplying it.'
  - id: gay-bourgeois-experience-v1#u08-c2
    heading: 'The diary entry reconstructing a conception'
    span: 162652:163189
    why: 'The concrete proof-of-concept for Gay''s thesis: a bourgeois wife retrospectively recording, in precise erotic detail, the moment her child was conceived.'
  - id: gay-bourgeois-experience-v1#u08-c3
    heading: 'Class disdain as the stable axis of her identity'
    span: 167963:169191
    why: 'Shows the fixed structure of breeding-based class anxiety inside which Todd''s sexual candor and flexibility operated without threatening her self-conception.'
  - id: gay-bourgeois-experience-v1#u08-c4
    heading: 'Impulse and defense: ''I wonder if I am a flirt?'''
    span: 177303:177964
    why: 'A miniature case study of Gay''s bourgeois defenses: conscious self-monitoring managing rather than suppressing erotic energy.'
  - id: gay-bourgeois-experience-v1#u08-c5
    heading: 'The engagement as a socially licensed erotic zone'
    span: 182275:183903
    why: 'Generalizes Todd''s own premarital intimacy into a documented class-wide convention, exposing the gap between official propriety and private practice.'
  - id: gay-bourgeois-experience-v1#u08-c6
    heading: 'Elastic innocence on the wedding day'
    span: 185330:185925
    why: 'Gay''s closing irony crystallizes the chapter''s thesis: appearances of purity coexisted comfortably with extensive private erotic experimentation.'
- nn: 9
  unit_id: erotic-record-2-mabel-loomis-todd
  note_id: gay-bourgeois-experience-v1-erotic-record-2-mabel-loomis-todd
  span: 185927:207114
  chunks:
  - id: gay-bourgeois-experience-v1#u09-c1
    heading: 'Marriage intensifies rather than domesticates desire'
    span: 185949:187036
    why: 'States the chapter''s inverting thesis in miniature, anchored directly in Mabel Todd''s own diary language and Shaw''s aphorism about marriage.'
  - id: gay-bourgeois-experience-v1#u09-c2
    heading: 'Hunger in separation, self-censored letters'
    span: 188370:190225
    why: 'Shows both partners'' erotic longing during separation and David Todd''s deliberate self-restraint in writing, the private candor-versus-reticence tension the chapter turns on.'
  - id: gay-bourgeois-experience-v1#u09-c3
    heading: 'A homemade fertility theory, disconfirmed'
    span: 194756:195738
    why: 'Documents a bourgeois woman''s confident private theorizing about her own body and its dramatic biological refutation, a small parable of pseudo-scientific self-management of fertility.'
  - id: gay-bourgeois-experience-v1#u09-c4
    heading: 'Wife-love ranked above mother-love'
    span: 202137:202598
    why: 'Mabel Todd''s frank ranking of erotic wife-love over anticipated maternal love complicates any simple ideology of automatic Victorian maternal devotion.'
  - id: gay-bourgeois-experience-v1#u09-c5
    heading: 'Neither angel nor whore'
    span: 205472:206660
    why: 'Gay''s explicit argument, backed by the couple''s own ''husbandlover'' language, that the Todds'' fusion of sexual enthusiasm and maternal sanctity contradicts the standard angel/whore reading of the bourgeois marriage.'
- nn: 10
  unit_id: erotic-record-3-mabel-loomis-dickinson
  note_id: gay-bourgeois-experience-v1-erotic-record-3-mabel-loomis-dickinson
  span: 207114:252545
  chunks:
  - id: gay-bourgeois-experience-v1#u10-c1
    heading: 'The affair as a bourgeois "test case"'
    span: 207437:208273
    why: 'States the chapter''s framing thesis: the affair matters as diagnostic evidence about bourgeois social style, not merely as biography.'
  - id: gay-bourgeois-experience-v1#u10-c2
    heading: 'Millicent''s studied non-wondering'
    span: 217677:218755
    why: 'Concrete embodiment of Gay''s ''learned ignorance'' defense mechanism, showing how shared knowledge was kept technically unspoken within the household.'
  - id: gay-bourgeois-experience-v1#u10-c3
    heading: 'Antinomian self-justification via George Eliot'
    span: 226715:228064
    why: 'Shows Gay tracing Todd''s self-justifying doctrine as narcissistic investment rather than mere rationalization, a key psychoanalytic move in the chapter.'
  - id: gay-bourgeois-experience-v1#u10-c4
    heading: 'Idealized father as "school for love"'
    span: 238287:239067
    why: 'Generalizes the case study into Gay''s broader claim about oedipal idealization as a double-edged but potentially enriching template for adult love.'
  - id: gay-bourgeois-experience-v1#u10-c5
    heading: 'Hypocrisy as an affordable price'
    span: 251575:252543
    why: 'The unit''s thesis statement, reframing bourgeois hypocrisy as a negotiated system of ''routes of evasion'' rather than pure repression or pure fraud.'
- nn: 11
  unit_id: communions-1-paradise-two
  note_id: gay-bourgeois-experience-v1-communions-1-paradise-two
  span: 252545:313003
  chunks:
  - id: gay-bourgeois-experience-v1#u11-c1
    heading: 'Freud''s charge of hypocrisy, and Todd''s exceptional candor'
    span: 252700:253907
    why: 'States the chapter''s founding evidentiary problem: whether Mabel Todd''s erotic candor is exceptional in kind, or only in having survived to be read.'
  - id: gay-bourgeois-experience-v1#u11-c2
    heading: '“Confession oozes from every pore”: Gay''s psychoanalytic method'
    span: 256369:257817
    why: 'Gay''s clearest statement of method: treating diaries and letters as sites where unconscious material surfaces despite the writer''s intentions.'
  - id: gay-bourgeois-experience-v1#u11-c3
    heading: 'Victoria Benedictsson''s self-hatred and penis envy'
    span: 271570:272976
    why: 'Shows Gay''s psychoanalytic reading of a single case — frigidity, penis envy, self-hatred — that ends in Benedictsson''s suicide after Brandes''s rejection.'
  - id: gay-bourgeois-experience-v1#u11-c4
    heading: 'Godfrey Cabot''s regressive fantasies and his post at the Watch and Ward Society'
    span: 289923:290938
    why: 'The sharpest instance of the gap between public moral policing and private erotic indulgence lodged in the same bourgeois individual.'
  - id: gay-bourgeois-experience-v1#u11-c5
    heading: 'Lester Ward''s private happiness becomes a public “philosophy of desire”'
    span: 306497:307608
    why: 'Traces the inverse movement: a courtship diary''s erotic satisfaction hardening into Ward''s published sociology of desire and modesty.'
  - id: gay-bourgeois-experience-v1#u11-c6
    heading: 'The passionless bourgeois wife as myth'
    span: 311960:313001
    why: 'The section''s closing thesis: apparent Victorian frigidity is really the gap between public conduct and private feeling, not the absence of desire.'
- nn: 12
  unit_id: communions-2-dubious-certainty-numbers
  note_id: gay-bourgeois-experience-v1-communions-2-dubious-certainty-numbers
  span: 313003:340419
  chunks:
  - id: gay-bourgeois-experience-v1#u12-c1
    heading: 'The problem: checking private testimony against the era''s numbers'
    span: 313040:313615
    why: 'States the section''s animating problem, framing quantification as a dubious but necessary check on whether the Todds, Lymans, and Wards were representative.'
  - id: gay-bourgeois-experience-v1#u12-c2
    heading: 'Duncan''s clinical vignette of the sensual wife'
    span: 317675:318381
    why: 'Gives the earliest statistical-clinical evidence in the chapter that an orgasmic, desiring married woman was medically unremarkable rather than exceptional.'
  - id: gay-bourgeois-experience-v1#u12-c3
    heading: 'The Mosher orgasm statistics and the No. 23 contradiction'
    span: 321374:322483
    why: 'Presents the survey''s central orgasm figures and the case of a respondent whose denial is contradicted by her own next answer, Gay''s clearest evidence that shame outran the absence of pleasure.'
  - id: gay-bourgeois-experience-v1#u12-c4
    heading: 'Spirituality as the sanctioned language of pleasure'
    span: 334232:336061
    why: 'Shows respondents'' near-uniform recourse to a vocabulary of spiritual union rather than physical enjoyment, the discursive cover under which their pleasure could be voiced.'
  - id: gay-bourgeois-experience-v1#u12-c5
    heading: 'Gay''s reflexive weighing of the evidence'
    span: 336966:338637
    why: 'Gay''s most explicit act of historiographical self-awareness, weighing bias and self-selection against his willingness to still generalize about autonomous female pleasure.'
  - id: gay-bourgeois-experience-v1#u12-c6
    heading: 'The payoff: Todd as representative, not exceptional'
    span: 338639:340417
    why: 'Converts the survey''s acknowledged limitations into the section''s closing claim, that Mabel Todd''s erotic candor typified her class and generation rather than setting her apart.'
- nn: 13
  unit_id: communions-3-problematic-sex
  note_id: gay-bourgeois-experience-v1-communions-3-problematic-sex
  span: 340419:402431
  chunks:
  - id: gay-bourgeois-experience-v1#u13-c1
    heading: 'The ancient consensus, inverted'
    span: 341136:342617
    why: 'Establishes the historical reversal at the chapter''s core: antiquity assumed women the lustier sex, making the nineteenth-century doubt a dated invention rather than a timeless view.'
  - id: gay-bourgeois-experience-v1#u13-c2
    heading: 'The bourgeois century made Woman problematic'
    span: 342619:343060
    why: 'States the chapter''s thesis sentence directly and links it to the contemporaneous masturbation panic, dating the anxiety to a specific historical moment.'
  - id: gay-bourgeois-experience-v1#u13-c3
    heading: 'Debay: refined sexuality as bourgeois class marker'
    span: 356816:357500
    why: 'Shows sexual doctrine being used to construct bourgeois class distinction against an imagined brutish/indifferent rural sexuality.'
  - id: gay-bourgeois-experience-v1#u13-c4
    heading: 'Acton''s gospel of female sexual anesthesia'
    span: 363981:364979
    why: 'The clearest, most quotable formulation of the anesthesia doctrine that dominates the chapter''s second half.'
  - id: gay-bourgeois-experience-v1#u13-c5
    heading: 'Case XIV: desire unreadable to its own doctrine'
    span: 385472:387255
    why: 'Gay''s evidentiary centerpiece for the gap between official ideology and private erotic experience: a patient whose real desire is intense but structurally unrecognizable to the anesthesia framework.'
  - id: gay-bourgeois-experience-v1#u13-c6
    heading: 'Freud as paradox: solution and symptom'
    span: 401350:402429
    why: 'Gay''s own analytic verdict on Freud, refusing to place him outside the culture he diagnosed and naming the bridge to the next chapter on men''s fear of women.'
- nn: 14
  unit_id: offensive-women-1-women-on-march
  note_id: gay-bourgeois-experience-v1-offensive-women-1-women-on-march
  span: 402431:451980
  chunks:
  - id: gay-bourgeois-experience-v1#u14-c1
    heading: 'Gay''s definition of experience via the mysterious-sex cliche'
    span: 407797:408517
    why: 'States Gay''s own analytic method (experience as conscious/unconscious struggle) and grounds the chapter''s psychological reading of gender anxiety.'
  - id: gay-bourgeois-experience-v1#u14-c2
    heading: 'The Hallam, Connecticut housewife''s 1880 diary'
    span: 410989:412377
    why: 'The chapter''s key private-document evidence of ordinary domestic exasperation beneath bourgeois respectability.'
  - id: gay-bourgeois-experience-v1#u14-c3
    heading: 'Mill''s Subjection of Women on coverture'
    span: 417759:419194
    why: 'Supplies the concrete legal content behind the chapter''s argument about women''s subjection.'
  - id: gay-bourgeois-experience-v1#u14-c4
    heading: 'Freud''s private conventionality about women'
    span: 420675:422417
    why: 'A striking public/private gap: Mill''s German translator privately rejected Mill''s feminism to his fiancee.'
  - id: gay-bourgeois-experience-v1#u14-c5
    heading: 'M. Carey Thomas''s childhood resolve against passivity'
    span: 442970:444664
    why: 'Origin point of the extended case study Gay uses to dramatize activity over passivity as the chapter''s psychological thesis.'
- nn: 15
  unit_id: offensive-women-2-manhood-danger
  note_id: gay-bourgeois-experience-v1-offensive-women-2-manhood-danger
  span: 451980:473827
  chunks:
  - id: gay-bourgeois-experience-v1#u15-c1
    heading: 'Feminism as a Delayed Response to Insult'
    span: 452002:453672
    why: 'States Gay''s reframing of the movement as reactive rather than aggressive, the thesis the whole unit builds on.'
  - id: gay-bourgeois-experience-v1#u15-c2
    heading: 'The New York Herald''s Ridicule of “Unsexed Women”'
    span: 457306:457816
    why: 'Exemplifies how American editorial ridicule converted anxiety about feminism into sexualized insult.'
  - id: gay-bourgeois-experience-v1#u15-c3
    heading: 'Stevenson Archer''s “Whirlwinds in Petticoats”'
    span: 460114:461215
    why: 'The unit''s clearest, most literal statement of manhood-in-danger panic, closed by Gay''s own psychoanalytic gloss.'
  - id: gay-bourgeois-experience-v1#u15-c4
    heading: 'Besant''s Revolt of Man: Reversal Rehearsed and Repaired'
    span: 466184:467001
    why: 'Shows fiction staging the full nightmare of gender role-reversal only to neutralize it through a restored marriage plot.'
  - id: gay-bourgeois-experience-v1#u15-c5
    heading: 'Woman as Vampire in French Anti-Feminism'
    span: 462146:462710
    why: 'Displays the most sexually explicit French version of the fear, culminating in Gay''s vampire/victim formula.'
  - id: gay-bourgeois-experience-v1#u15-c6
    heading: 'Reaction Formation and the Threat of Castration'
    span: 472497:473825
    why: 'Gay''s interpretive climax, tying the fear of feminism to the myth of the frigid woman via Freud''s reaction formation.'
- nn: 16
  unit_id: offensive-women-3-castrating-sisterhood
  note_id: gay-bourgeois-experience-v1-offensive-women-3-castrating-sisterhood
  span: 473827:512195
  chunks:
  - id: gay-bourgeois-experience-v1#u16-c1
    heading: 'Struwwelpeter and the castration of children''s literature'
    span: 474356:475841
    why: 'Shows castration and mutilation entering children''s culture as cheerful entertainment, Gay''s opening evidence that the fear ran deeper than surface humor.'
  - id: gay-bourgeois-experience-v1#u16-c2
    heading: 'Goncourt''s Bastille Day dream of the vagina dentata'
    span: 476076:476937
    why: 'The primary document — Goncourt''s own vagina-dentata dream — that anchors the chapter''s psychoanalytic argument.'
  - id: gay-bourgeois-experience-v1#u16-c3
    heading: 'Gay''s psychoanalytic reading: oedipal wish, maternal retaliation'
    span: 478496:479711
    why: 'Gay''s own psychoanalytic reading of the dream, the clearest statement of his interpretive method in the unit.'
  - id: gay-bourgeois-experience-v1#u16-c4
    heading: 'The mid-century turn from the fatal man to the fatal woman'
    span: 483337:484346
    why: 'States the chapter''s periodizing thesis: a post-1850 flood of femme-fatale imagery displacing the earlier Byronic fatal man.'
  - id: gay-bourgeois-experience-v1#u16-c5
    heading: 'Clubland: fear of growing up, not fear of castration'
    span: 501586:502362
    why: 'Gay''s key qualification that some apparent fear of women was really a fear of leaving homoerotic male adolescent bonds, not castration anxiety.'
  - id: gay-bourgeois-experience-v1#u16-c6
    heading: 'One psychological world: the closing synthesis'
    span: 511249:512193
    why: 'The unit''s closing synthesis, tying art and political anti-feminism together as symptoms of one shared anxiety.'
- nn: 17
  unit_id: offensive-women-4-sex-mind-body
  note_id: gay-bourgeois-experience-v1-offensive-women-4-sex-mind-body
  span: 512195:543572
  chunks:
  - id: gay-bourgeois-experience-v1#u17-c1
    heading: 'Maudsley: sex in mind as in body'
    span: 513302:513867
    why: 'States the era''s key axiom -- that mental capacities are sexed -- that licenses every subsequent argument against women''s higher education in the unit.'
  - id: gay-bourgeois-experience-v1#u17-c2
    heading: 'Clarke''s economics of vital force'
    span: 518753:519181
    why: 'Shows Clarke translating a social fear into pseudo-quantitative physiology, the clearest instance of ''science'' laundering anxiety as fact.'
  - id: gay-bourgeois-experience-v1#u17-c3
    heading: 'Carey Thomas: ''that gloomy little specter'''
    span: 519422:520500
    why: 'Gives the feminist target''s-eye view of the controversy''s real psychological weight, decades after publication.'
  - id: gay-bourgeois-experience-v1#u17-c4
    heading: 'Mary Putnam Jacobi''s rebuttal, and its own ambivalence'
    span: 528596:529490
    why: 'Carries Gay''s characteristic double move: the feminist rebuttal is factually vindicated yet still shows a ''measure of denial,'' the unit''s payoff line on the anxiety''s two-sidedness.'
  - id: gay-bourgeois-experience-v1#u17-c5
    heading: 'Gierke: ''that our men remain men'''
    span: 537210:538362
    why: 'The unit''s most naked statement of the underlying fear -- not women''s incapacity but men''s loss of masculine ground -- surfacing through Gay''s own interpolation.'
  - id: gay-bourgeois-experience-v1#u17-c6
    heading: 'Planck and the chapter''s thesis'
    span: 542702:543570
    why: 'Gay''s closing sentence ties the whole debate together as ''the fear of woman and the fear of change,'' the unit''s explicit thesis statement.'
- nn: 18
  unit_id: pressures-1-facts-life-death
  note_id: gay-bourgeois-experience-v1-pressures-1-facts-life-death
  span: 543572:586367
  chunks:
  - id: gay-bourgeois-experience-v1#u18-c1
    heading: 'The ego as reality''s negotiator'
    span: 544455:545415
    why: 'States the chapter''s theoretical premise: the ego is not the drives'' enemy but their ''great negotiator,'' bravely determining ''what is'' and ''what can be'' against the pressures of reality that the rest of the unit documents.'
  - id: gay-bourgeois-experience-v1#u18-c2
    heading: 'Eleanor Rogers''s demand for secrecy'
    span: 547517:548101
    why: 'Opens the section''s evidentiary method and dramatizes the privatization of experience: a miscarriage confided only under oath of destruction, ''the passion for privacy'' as its own kind of testimony.'
  - id: gay-bourgeois-experience-v1#u18-c3
    heading: 'Chloroform, projection, and ''underlying sadism'''
    span: 557624:559526
    why: 'Shows Gay''s characteristic move of reading a medical-theological controversy as displaced sexuality: opponents'' claims about anesthetized women''s ''lewd'' speech are unmasked by Simpson as the observers'' own projection, a defense mechanism Gay treats as pre-Freudian.'
  - id: gay-bourgeois-experience-v1#u18-c4
    heading: 'Farr''s mortality statistics and a mother''s grief'
    span: 561356:562697
    why: 'Captures the new demographic legibility (Quetelet, Farr) turning scattered deaths into comparable national rates, while Farr''s own words keep the moral weight of ''the grief of a mother'' inside the statistic rather than reducing it to pure administration.'
  - id: gay-bourgeois-experience-v1#u18-c5
    heading: 'Hannah Smith''s diary: resignation over rebellion'
    span: 573445:574932
    why: 'A rare direct confession of pregnancy dreaded rather than welcomed, silenced into ''patience and silence,'' that (via her niece M. Carey Thomas) becomes the germ of a life spent refusing marriage and childbearing altogether.'
  - id: gay-bourgeois-experience-v1#u18-c6
    heading: 'Anna O.''s phantom pregnancy'
    span: 584587:586365
    why: 'The chapter''s climactic case: Breuer''s patient''s wholly imaginary pregnancy and hysterical childbirth is offered as the purest symbolic distillation of everything the section has shown about pregnancy''s stakes for the ''economy of love.'''
- nn: 19
  unit_id: pressures-2-conscience-control
  note_id: gay-bourgeois-experience-v1-pressures-2-conscience-control
  span: 586367:617877
  chunks:
  - id: gay-bourgeois-experience-v1#u19-c1
    heading: 'Motherhood as English sky'
    span: 586398:587445
    why: 'States the unit''s governing ambivalence (dread and desire coexisting in pregnancy) and previews the shift from passivity toward active control.'
  - id: gay-bourgeois-experience-v1#u19-c2
    heading: 'Lyman''s terse diary line on Hattie''s death'
    span: 592362:592658
    why: 'A stark, private, almost unceremonious record of a child''s death that shows grief absorbed into ordinary life rather than performed.'
  - id: gay-bourgeois-experience-v1#u19-c3
    heading: 'Gladstone''s rebelling heart'
    span: 609404:610342
    why: 'The clearest textual instance of ambivalence: Gladstone''s own diary records his conscience failing to fully suppress his love for his dying child.'
  - id: gay-bourgeois-experience-v1#u19-c4
    heading: 'Bouvier''s report to Pius IX'
    span: 612925:613693
    why: 'Direct primary-source evidence that confessional practice was already registering the gap between procreative doctrine and contracepting couples by 1849.'
  - id: gay-bourgeois-experience-v1#u19-c5
    heading: 'Pomeroy on respectable trouble'
    span: 615621:616481
    why: 'A physician''s testimony that abortion-seeking clientele were disproportionately “highly respectable” bourgeois women, not the poor — key evidence for the doctrine/practice gap.'
  - id: gay-bourgeois-experience-v1#u19-c6
    heading: 'Conscience loses to control'
    span: 616810:617875
    why: 'States the unit''s thesis outright: by the century''s end, secular contraceptive control had substantially defeated religious reproductive conscience.'
- nn: 20
  unit_id: pressures-3-struggle-malthus
  note_id: gay-bourgeois-experience-v1-pressures-3-struggle-malthus
  span: 617877:672932
  chunks:
  - id: gay-bourgeois-experience-v1#u20-c1
    heading: 'Malthus''s checks, and the leagues'' inversion of them'
    span: 618048:619288
    why: 'States Malthus''s original doctrine of positive and preventive checks that the later birth-control movement will invert into hope and agency.'
  - id: gay-bourgeois-experience-v1#u20-c2
    heading: 'The Bradlaugh-Besant trial as unintended advertising'
    span: 628005:629044
    why: 'Gay''s clearest example of official prosecution manufacturing the very diffusion of birth-control knowledge it aimed to suppress.'
  - id: gay-bourgeois-experience-v1#u20-c3
    heading: 'Freud on contraceptive method and anxiety neurosis'
    span: 641409:642053
    why: 'Shows Freud''s early clinical theory tying specific contraceptive techniques, practiced inconsiderately, to anxiety neurosis in women.'
  - id: gay-bourgeois-experience-v1#u20-c4
    heading: 'Nadaillac''s German birth-rate comparison and national dread'
    span: 645994:647041
    why: 'Demonstrates comparative birth-rate statistics functioning as a legible instrument of nationalist and military anxiety.'
  - id: gay-bourgeois-experience-v1#u20-c5
    heading: 'Rosa Luxemburg: birth control as bourgeois evasion'
    span: 663174:663862
    why: 'Supplies the left''s rejection of contraception as class-marked evasion, the counter-voice to bourgeois and clerical opposition.'
  - id: gay-bourgeois-experience-v1#u20-c6
    heading: 'Contraception as the bourgeoisie''s response to the pressures of reality'
    span: 660796:661948
    why: 'Gay''s own thesis statement in his own vocabulary, naming the unit''s central concept of the pressures of reality.'
- nn: 21
  unit_id: learned-ignorance-1-age-factitious-innocence
  note_id: gay-bourgeois-experience-v1-learned-ignorance-1-age-factitious-innocence
  span: 672932:713284
  chunks:
  - id: gay-bourgeois-experience-v1#u21-c1
    heading: 'Learned ignorance defined'
    span: 679030:679663
    why: 'States Gay''s central diagnostic term for the chapter: bourgeois sexual reticence as an unconscious, unplanned cultural defense rather than a chosen policy.'
  - id: gay-bourgeois-experience-v1#u21-c2
    heading: 'Amnesia and the making of factitious innocence'
    span: 674567:676236
    why: 'Lays out the psychoanalytic mechanism (oedipal repression, latency, adolescent amnesia) that grounds Gay''s coinage ‘factitious innocence’ in ordinary development rather than mere social conditioning.'
  - id: gay-bourgeois-experience-v1#u21-c3
    heading: 'Emily Lytton indicts the ‘fictitious barrier’'
    span: 681613:682389
    why: 'A first-person primary source in which the subject herself names the gap between official ideology (protective ignorance) and lived vulnerability, anticipating Gay''s own thesis.'
  - id: gay-bourgeois-experience-v1#u21-c4
    heading: 'The ‘brute in the bedroom’ as wishful fantasy'
    span: 697599:698910
    why: 'The chapter''s pivot: Gay explicitly revises the standard victimized-bride narrative, arguing ignorance and vulnerability were shared by bridegrooms, not one-sided.'
  - id: gay-bourgeois-experience-v1#u21-c5
    heading: 'George Sand: ‘raised as saints…handed over like fillies’'
    span: 692522:692960
    why: 'Vivid continental evidence of the same pattern, and a rare instance of a woman explicitly warning a man against enacting the ignorant-bride/brutal-groom script.'
  - id: gay-bourgeois-experience-v1#u21-c6
    heading: 'Freud''s patient and the bridegroom''s red-ink fiasco'
    span: 703697:704805
    why: 'Gay''s clinching anecdote for the male side of wedding-night trauma, showing the victim of ignorance and shame could as easily be the groom as the bride.'
- nn: 22
  unit_id: learned-ignorance-2-profession-anxiety
  note_id: gay-bourgeois-experience-v1-learned-ignorance-2-profession-anxiety
  span: 713284:773351
  chunks:
  - id: gay-bourgeois-experience-v1#u22-c1
    heading: 'Physicians as "knights of learned ignorance"'
    span: 714541:715306
    why: 'States the chapter''s thesis: the anti-masturbation campaign as the era''s most revealing symptom of respected professionals functioning as accomplices of ignorance.'
  - id: gay-bourgeois-experience-v1#u22-c2
    heading: 'The 1894 Cleveland clitoridectomy'
    span: 737264:737955
    why: 'The campaign''s most extreme, and named, act of medical violence — the passage where the argument''s abstractions become a specific, documented atrocity.'
  - id: gay-bourgeois-experience-v1#u22-c3
    heading: 'Defining "learned ignorance"'
    span: 750392:750876
    why: 'Gay''s own coinage, defining the concept the whole chapter (and unit id) is built around: ignorance as defensive achievement, not informational gap.'
  - id: gay-bourgeois-experience-v1#u22-c4
    heading: 'Tissot''s spermatic economy'
    span: 751758:752360
    why: 'Supplies the pseudo-physiological "body as machine" logic of expenditure and loss that underwrote a century of prescription and dread.'
  - id: gay-bourgeois-experience-v1#u22-c5
    heading: 'Physician as manufactured deity'
    span: 763711:764030
    why: 'Captures the transference dynamic Gay uses to explain physicians'' professional anxiety: patients demanded an omnipotence doctors privately knew they lacked.'
  - id: gay-bourgeois-experience-v1#u22-c6
    heading: 'Loss of mastery, Pyrrhic victory'
    span: 772363:773349
    why: 'The chapter''s concluding thesis: the campaign was about control and mastery, not morality alone, and its defeat only produced a new anxious symptom.'
- nn: 23
  unit_id: learned-ignorance-3-flight-knowledge
  note_id: gay-bourgeois-experience-v1-learned-ignorance-3-flight-knowledge
  span: 773351:797099
  chunks:
  - id: gay-bourgeois-experience-v1#u23-c1
    heading: 'The literature diagnoses its culture, not sexuality'
    span: 773381:773751
    why: 'States Gay''s governing method for the chapter: reading the sex-education boom as a symptom of bourgeois anxiety rather than a transparent record about sex.'
  - id: gay-bourgeois-experience-v1#u23-c2
    heading: 'An international infrastructure of alarm'
    span: 775568:776301
    why: 'Catalogues the transnational societies and congresses and delivers the chapter''s title phrase, showing how manufactured and self-congratulatory the reform movement''s sense of urgency was.'
  - id: gay-bourgeois-experience-v1#u23-c3
    heading: 'Frankness that is itself reticent'
    span: 782247:782893
    why: 'The chapter''s sharpest statement of its central irony: reformist calls for candor are themselves compromised by evasion and euphemism.'
  - id: gay-bourgeois-experience-v1#u23-c4
    heading: 'Freud''s bluntness against the birds-and-bees evasion'
    span: 789117:790486
    why: 'Contrasts Freud''s declared directness with Mary Wood-Allen''s flower allegory, the concrete evidence for the chapter''s claim about reticent candor.'
  - id: gay-bourgeois-experience-v1#u23-c5
    heading: 'An alliance held together by fear'
    span: 796345:797097
    why: 'Names the incongruous coalition behind sex education and delivers the chapter''s closing verdict, echoing its title in reverse.'
- nn: 24
  unit_id: carnal-knowledge-1-platonic-libertinism
  note_id: gay-bourgeois-experience-v1-carnal-knowledge-1-platonic-libertinism
  span: 797099:815838
  chunks:
  - id: gay-bourgeois-experience-v1#u24-c1
    heading: 'Erotic Education Outside the Classroom'
    span: 797178:798776
    why: 'States the section''s thesis that sexual knowledge is acquired through observation and misinformation rather than instruction.'
  - id: gay-bourgeois-experience-v1#u24-c2
    heading: 'A Boy and Girl''s Chance Encounter'
    span: 804078:804960
    why: 'Gay''s paradigmatic case of ordinary childhood peer contact, not scandal, transmitting sexual difference and its emotional charge.'
  - id: gay-bourgeois-experience-v1#u24-c3
    heading: 'The Stork, the Bloody Basins, and Little Hans'
    span: 807775:809334
    why: 'Shows a child reasoning past the official cover story from direct sensory evidence, the clearest case of learned ignorance failing.'
  - id: gay-bourgeois-experience-v1#u24-c4
    heading: 'Amiel Names “Platonic Libertinism”'
    span: 811882:812435
    why: 'Supplies the section''s titular concept: erotic curiosity satisfied by looking rather than touching, Gay''s doctrine of distance in miniature.'
  - id: gay-bourgeois-experience-v1#u24-c5
    heading: 'Hiding French Novels Behind a Bible'
    span: 800255:801348
    why: 'Shows respectable fiction negotiating a graduated, status-coded boundary of the sayable rather than enforcing blanket prohibition.'
  - id: gay-bourgeois-experience-v1#u24-c6
    heading: 'Wanted to Know and Did Not Want to Know'
    span: 815103:815836
    why: 'States the chapter''s governing dynamic of ambivalence directly, in Gay''s own closing formulation.'
- nn: 25
  unit_id: carnal-knowledge-2-lessons-body
  note_id: gay-bourgeois-experience-v1-carnal-knowledge-2-lessons-body
  span: 815838:870071
  chunks:
  - id: gay-bourgeois-experience-v1#u25-c1
    heading: 'Kilvert and the lamb-castrating daughters'
    span: 815864:817814
    why: 'Gay''s opening anecdote is the chapter''s paradigm case: rural bourgeois candor about animal bodies set against a visiting observer''s projected, self-correcting shame.'
  - id: gay-bourgeois-experience-v1#u25-c2
    heading: 'Gladstone''s diary of nursing crises'
    span: 857461:859615
    why: 'These diary entries are Gay''s central evidentiary chain for the claim that bourgeois husbands were bodily involved and well-informed in their wives'' physical crises.'
  - id: gay-bourgeois-experience-v1#u25-c3
    heading: 'The Sombreuil painting and a haunted childhood'
    span: 837643:838651
    why: 'This passage shows atrocity-as-domestic-art entering a child''s imagination via a doting father, and contains an OCR line break that must be reproduced verbatim in direct quotation.'
  - id: gay-bourgeois-experience-v1#u25-c4
    heading: 'Carey Thomas''s traumatic reading'
    span: 867638:869100
    why: 'Carey Thomas''s reaction complicates the chapter''s thesis by showing that carnal knowledge acquired without guidance could traumatize rather than liberate.'
  - id: gay-bourgeois-experience-v1#u25-c5
    heading: 'Knowledge is abundant, happiness is not guaranteed'
    span: 869102:870069
    why: 'The closing paragraph states the chapter''s qualified thesis directly: carnal knowledge was abundant, but knowledge and erotic happiness are not the same thing.'
- nn: 26
  unit_id: carnal-knowledge-3-readers-conflict
  note_id: gay-bourgeois-experience-v1-carnal-knowledge-3-readers-conflict
  span: 870071:927751
  chunks:
  - id: gay-bourgeois-experience-v1#u26-c1
    heading: 'The scale of the trade'
    span: 870434:870779
    why: 'Establishes, with the Holywell Street raid tally and Comstock''s later seizure statistics, that the pornography trade''s material scale made suppression a losing battle from the outset.'
  - id: gay-bourgeois-experience-v1#u26-c2
    heading: 'Cockburn''s Hicklin test'
    span: 881655:882103
    why: 'Cockburn''s 1868 formula became the operative legal definition of obscenity for a century, and its vagueness is what let serious literature and trade smut be prosecuted under the same rubric.'
  - id: gay-bourgeois-experience-v1#u26-c3
    heading: 'Thomas Beer''s tough collection'
    span: 892259:893519
    why: 'A rare private document, in Gay''s signature evidentiary method, showing a young bourgeois bachelor''s unashamed pride in his erotic reading rather than the guilt that dominates Amiel''s and Gladstone''s diaries.'
  - id: gay-bourgeois-experience-v1#u26-c4
    heading: 'The madonna-whore split'
    span: 918686:920649
    why: 'The chapter''s psychoanalytic keystone: pornography''s degraded women are read as the small boy''s unintegrated split image of his mother, closing on Freud''s 1912 account of the ''debasement of the sexual object.'''
  - id: gay-bourgeois-experience-v1#u26-c5
    heading: 'The prurient prude'
    span: 923398:924327
    why: 'Sydney Smith''s aphorism and Reade''s coinage crystallize Gay''s ''extremes met'' thesis that anti-pornography crusaders shared the pornographer''s unconscious obsession, pre-dating Freud''s own vocabulary for it.'
  - id: gay-bourgeois-experience-v1#u26-c6
    heading: 'Readers in conflict'
    span: 926791:927749
    why: 'The chapter''s own closing formulation, naming the unresolved, self-contradictory bourgeois liberalism that gives the unit its title.'
- nn: 27
  unit_id: carnal-knowledge-4-doctrine-distance
  note_id: gay-bourgeois-experience-v1-carnal-knowledge-4-doctrine-distance
  span: 927751:984086
  chunks:
  - id: gay-bourgeois-experience-v1#u27-c1
    heading: 'Coining the doctrine of distance'
    span: 957181:958072
    why: 'This is Gay''s own naming and definition of the chapter''s central concept, the doctrine of distance.'
  - id: gay-bourgeois-experience-v1#u27-c2
    heading: 'The paradox of distance'
    span: 958507:959162
    why: 'States Gay''s key analytic claim that distance made art simultaneously less and more erotic, the mechanism''s real payload.'
  - id: gay-bourgeois-experience-v1#u27-c3
    heading: 'Manet breaks the compromise'
    span: 962482:964602
    why: 'Shows the doctrine failing under the pressure of a contemporary, recognizably French nude, and Gay''s reading of critics as unwitting diagnosticians.'
  - id: gay-bourgeois-experience-v1#u27-c4
    heading: 'Hiram Powers''s manufactured innocence'
    span: 969878:971451
    why: 'The Greek Slave is Gay''s fullest case study of the doctrine engineered deliberately and successfully by an artist.'
  - id: gay-bourgeois-experience-v1#u27-c5
    heading: 'Wharton''s mother and the limits of visual knowledge'
    span: 982510:983610
    why: 'Closes the chapter''s argument with the human cost of the doctrine: pervasive nudity in art did not translate into sexual knowledge for a genteel woman denied the words to ask.'
- nn: 28
  unit_id: fortifications-1-search-safety
  note_id: gay-bourgeois-experience-v1-fortifications-1-search-safety
  span: 984086:1033197
  chunks:
  - id: gay-bourgeois-experience-v1#u28-c1
    heading: 'Fortifications for the self'
    span: 985006:985824
    why: 'States the chapter''s controlling image and thesis directly, explaining the title and the pivot from public to private life.'
  - id: gay-bourgeois-experience-v1#u28-c2
    heading: 'Santayana and the Genteel Tradition'
    span: 986338:987791
    why: 'Introduces Santayana''s naming of bourgeois hypocrisy and frames it as itself an ''educator of the senses,'' echoing Gay''s book-wide theme.'
  - id: gay-bourgeois-experience-v1#u28-c3
    heading: 'Thackeray''s Pendennis preface'
    span: 1001293:1001702
    why: 'First-person evidence of literary self-censorship as a lived professional constraint, not just externally imposed prudery.'
  - id: gay-bourgeois-experience-v1#u28-c4
    heading: 'Freud on cultural hypocrisy'
    span: 1020024:1021118
    why: 'Freud''s 1898 and 1915 statements are the theoretical pivot that lets Gay convert a moral accusation into a historical-psychological diagnosis.'
  - id: gay-bourgeois-experience-v1#u28-c5
    heading: 'The limits of ''hypocrisy'' as a diagnostic term'
    span: 1021120:1022345
    why: 'Gay''s own methodological conclusion: once hypocrisy can be universal and unconscious, the historian must study its degree and function, not its bare existence.'
  - id: gay-bourgeois-experience-v1#u28-c6
    heading: 'The internalized voice and the search for safety'
    span: 1032539:1033195
    why: 'Delivers the section''s payoff, naming the search-for-safety title and grounding public conformity in an internalized, family-born superego voice.'
- nn: 29
  unit_id: fortifications-2-social-science-cultural-symptom
  note_id: gay-bourgeois-experience-v1-fortifications-2-social-science-cultural-symptom
  span: 1033197:1073207
  chunks:
  - id: gay-bourgeois-experience-v1#u29-c1
    heading: 'The family becomes a historical problem'
    span: 1033236:1034186
    why: 'States the unit''s governing premise: Victorian speculation is what first turns the presumptively timeless family into a debated, historicized object.'
  - id: gay-bourgeois-experience-v1#u29-c2
    heading: 'Le Play''s typology: patriarchal, stem, unstable'
    span: 1038180:1039521
    why: 'Gives Le Play''s evolutionary taxonomy of family types, the classificatory engine behind the whole decline narrative that casts the modern bourgeois nuclear family as pathological.'
  - id: gay-bourgeois-experience-v1#u29-c3
    heading: 'Family policy as fear of the new woman'
    span: 1065504:1066930
    why: 'States directly that Le Play''s and Riehl''s family science was driven by fear of feminine power — the sentence that gives the unit its “cultural symptom” thesis.'
  - id: gay-bourgeois-experience-v1#u29-c4
    heading: 'The oedipal constellation of family sociology'
    span: 1066932:1067745
    why: 'Gay''s own psychoanalytic diagnosis of the sociologists'' nostalgia as a defense against imagined emasculation, the unit''s clearest statement of “defenses” as an analytic category.'
  - id: gay-bourgeois-experience-v1#u29-c5
    heading: 'Mabel Loomis Todd on talent versus marriage'
    span: 1058214:1059323
    why: 'A first-person diary passage that shows the separate-spheres ideology''s psychic cost for an individual woman caught between talent and domestic destiny.'
  - id: gay-bourgeois-experience-v1#u29-c6
    heading: 'The family as an incoherent private school for love'
    span: 1072059:1073205
    why: 'Closing formulation, amending Tolstoy, that pivots from the argued case to the book''s larger claim that families are unsystematic, anxious sexual educators.'
- nn: 30
  unit_id: fortifications-3-democratization-comfort
  note_id: gay-bourgeois-experience-v1-fortifications-3-democratization-comfort
  span: 1073207:1090941
  chunks:
  - id: gay-bourgeois-experience-v1#u30-c1
    heading: 'The sofa as covert aphrodisiac'
    span: 1076546:1077389
    why: 'Gay''s clearest textual evidence that respectable domestic writing about furniture doubled as covert erotic description, grounding the claim that bourgeois sensuality inhered in ordinary objects.'
  - id: gay-bourgeois-experience-v1#u30-c2
    heading: 'Freud''s courtship inventory of a future home'
    span: 1080451:1082361
    why: 'Freud''s own unguarded letter shows, in the century''s most famous bourgeois voice, that household objects were felt as vehicles for love rather than mere possessions — offered by Gay as representative, not exceptional.'
  - id: gay-bourgeois-experience-v1#u30-c3
    heading: 'An anti-bourgeois doctrine becomes bourgeois property'
    span: 1084291:1086045
    why: 'States the section''s central historical irony: romantic love, launched by romantics as an assault on bourgeois conventionality, was absorbed by the spreading bourgeoisie as its own ideology of marital choice.'
  - id: gay-bourgeois-experience-v1#u30-c4
    heading: 'Disraeli''s counter-voice: Home as anti-social'
    span: 1088284:1088850
    why: 'Gives the era''s sharpest public objection to the cult of domesticity, the clearest statement of the tension between private comfort and public/religious obligation that troubled bourgeois conscience.'
  - id: gay-bourgeois-experience-v1#u30-c5
    heading: 'Intimacy''s shadow: rivalry moved into private minds'
    span: 1088851:1090002
    why: 'The section''s darkest turn, stating directly that concentrated family intimacy manufactured Oedipal ambivalence and rivalry, redirecting conflict from public/legal venues into private psychic life.'
- nn: 31
  unit_id: fortifications-4-private-experience
  note_id: gay-bourgeois-experience-v1-fortifications-4-private-experience
  span: 1090941:1128908
  chunks:
  - id: gay-bourgeois-experience-v1#u31-c1
    heading: 'Bagehot''s divided self and the bourgeois ideal of privacy'
    span: 1091601:1092184
    why: 'Establishes Gay''s opening image of the bourgeois ideal of an inner life shielded from company, the aspiration the rest of the section complicates.'
  - id: gay-bourgeois-experience-v1#u31-c2
    heading: 'Amiel''s diary as ideal confidant'
    span: 1100960:1101440
    why: 'Shows the diary''s personification into an ideal confidant, the era''s structural workaround for confiding what could not be said aloud.'
  - id: gay-bourgeois-experience-v1#u31-c3
    heading: 'The great bourgeois compromise: no conspiracy, no silence'
    span: 1106015:1107693
    why: 'States the section''s thesis in Gay''s own terms: reserve and disclosure were held in compromise, and the diary record disproves any ''conspiracy of silence.'''
  - id: gay-bourgeois-experience-v1#u31-c4
    heading: 'Sumner presses Jeannie Elliott to break down her reserve'
    span: 1112441:1112807
    why: 'Documents reserve as a live, gendered battleground in courtship rather than settled convention, with real costs once the couple married.'
  - id: gay-bourgeois-experience-v1#u31-c5
    heading: 'Sophia Hawthorne censors her husband''s diaries'
    span: 1122471:1123327
    why: 'The section''s central case for how one person could hold erotic candor and public reticence sequentially, the diary preserving what publication then erased.'
  - id: gay-bourgeois-experience-v1#u31-c6
    heading: 'Gay''s closing statement of the volume''s themes'
    span: 1126007:1127083
    why: 'Gay''s own retrospective table of contents for the volume, tying private reticence to Freud''s theory of civilization and naming the defenses the next volume will examine.'
- nn: 32
  unit_id: appendix-sexual-symbols-todd-diaries
  note_id: gay-bourgeois-experience-v1-appendix-sexual-symbols-todd-diaries
  span: 1128908:1132672
  chunks:
  - id: gay-bourgeois-experience-v1#u32-c1
    heading: 'The symbol system: x, #, f.m., o.'
    span: 1128979:1130420
    why: 'Establishes Gay''s decoding method and the paired 1881 entries he treats as corroborating evidence of Mabel''s orgasms.'
  - id: gay-bourgeois-experience-v1#u32-c2
    heading: 'The ‘Sem.’ conundrum and the virginity claim'
    span: 1130422:1131737
    why: 'Shows Gay using the diary''s shifting notation, including symbols recorded during David''s absences, to defend his earlier claim that Mabel went into marriage ‘technically’ a virgin.'
  - id: gay-bourgeois-experience-v1#u32-c3
    heading: 'David Todd''s masturbation log and the spermatic economy'
    span: 1131739:1132671
    why: 'States Gay''s payoff interpretation: David''s anxiety about semen ‘expenditure’ reflects a widely shared medical belief, exemplifying bourgeois anxiety beneath erotic candor.'
