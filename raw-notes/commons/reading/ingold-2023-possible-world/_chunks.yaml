    label: c5
    heading: Walking in the moon's company, and Rilke's astonishment
    char_start: 45087
    char_end: 45542
    why: 'The essay''s closing image and epigraph: companionship with the unknown (walking with the moon)
      over conquest of it (planting a flag), capped by Rilke''s astonishment and an open, uncanny final
