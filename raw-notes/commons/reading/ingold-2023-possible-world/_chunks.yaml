    label: c2
    heading: Real freedom as singular, attentive correspondence, not a menu of objectives
    char_start: 42587
    char_end: 43690
    why: 'The essay''s core argument: fake freedom offers predetermined objectives dressed as choice,
      while real freedom is attentive correspondence with how things and others want to go, collapsing
