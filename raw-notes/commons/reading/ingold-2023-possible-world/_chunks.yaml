  - id: ingold-2023-possible-world#u08-c4
    label: c4
    heading: Not-knowing reframed as wisdom rather than deficiency
    char_start: 44589
    char_end: 45086
    why: 'Names the positive counter-term to the ignorance-producing machines: not-knowing as wisdom,
