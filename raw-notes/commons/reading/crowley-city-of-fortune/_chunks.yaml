units:
- nn: 1
  unit_id: prologue
  note_id: crowley-city-of-fortune-prologue
  span: 0:8714
  chunks:
  - id: crowley-city-of-fortune#u01-c1
    label: c1
    heading: 'Petrarch''s letter: awe and unease at the departing galley'
    char_start: 403
    char_end: 1928
    why: This is the book's founding eyewitness image, establishing the prologue's central tension between
      the sublime scale of Venetian enterprise and its unsettling materialism.
  - id: crowley-city-of-fortune#u01-c2
    label: c2
    heading: The sea as protector, opportunity, and fate
    char_start: 3961
    char_end: 5401
    why: States Crowley's thesis directly and describes the Sposalizio del Mare, the ritual condensation
      of Venice's ambivalent, existential relationship to the sea.
  - id: crowley-city-of-fortune#u01-c3
    label: c3
    heading: The 1343 appeal to the pope
    char_start: 6911
    char_end: 7363
    why: Primary-source statement of Venice's self-understanding as a polity that exists only through
      trade, the evidentiary anchor for the chapter's virtual-economy argument.
  - id: crowley-city-of-fortune#u01-c4
    label: c4
    heading: Venice as the first virtual economy
    char_start: 7442
    char_end: 7924
    why: Crowley's own analytical claim that Venice's wealth was wholly relational rather than territorial,
      making the city's prosperity as fragile as it was spectacular.
  - id: crowley-city-of-fortune#u01-c5
    label: c5
    heading: From departure to the founding arrival
    char_start: 8489
    char_end: 8712
    why: The prologue's structural hinge, turning from the 1363 scene to the 1201 crusader arrival that
      the rest of the book will treat as the empire's true origin.
- nn: 2
  unit_id: ch01-lords-of-dalmatia
  note_id: crowley-city-of-fortune-ch01-lords-of-dalmatia
  span: 8714:40160
  chunks:
  - id: crowley-city-of-fortune#u02-c1
    label: c1
    heading: Cassiodorus on the sixth-century lagoon-dwellers
    char_start: 12335
    char_end: 13092
    why: The earliest outside description of Venice frames its classless, waterborne society and its single
      organizing commodity (salt), the seed of everything the chapter argues about Venetian exceptionalism.
  - id: crowley-city-of-fortune#u02-c2
    label: c2
    heading: The 'quintessence' that belongs to neither Church nor empire
    char_start: 15212
    char_end: 15842
    why: States outright the ideology of capture-resistance and pure commercial purpose that structures
      Venice's politics throughout the book.
  - id: crowley-city-of-fortune#u02-c3
    label: c3
    heading: 'Nostra chaxa: the Adriatic as Venetian house'
    char_start: 23786
    char_end: 24129
    why: Names the axiom — the Adriatic must be a Venetian sea — that Crowley treats as the founding strategic
      principle of the entire Republic.
  - id: crowley-city-of-fortune#u02-c4
    label: c4
    heading: The Golden Bull of 1082 and the word 'monopoly'
    char_start: 33815
    char_end: 34961
    why: The single legal instrument that converts Venice from tolerated subject into the dominant trading
      power of Byzantium, at the direct expense of Genoa, Pisa, and Amalfi.
  - id: crowley-city-of-fortune#u02-c5
    label: c5
    heading: 'Byzantine resentment: ''swarms and tribes'''
    char_start: 36675
    char_end: 37764
    why: Documents the xenophobic backlash that Venetian commercial success provoked, setting up the mutual
      mistrust that will detonate in the Fourth Crusade.
- nn: 3
  unit_id: ch02-the-blind-doge
  note_id: crowley-city-of-fortune-ch02-the-blind-doge
  span: 40160:68119
  chunks:
  - id: crowley-city-of-fortune#u03-c1
    label: c1
    heading: Innocent III's Crusading Call
    char_start: 40236
    char_end: 41005
    why: The papal bull's sacred register establishes the rhetorical baseline against which Venice's mercantile
      pragmatism is immediately contrasted.
  - id: crowley-city-of-fortune#u03-c2
    label: c2
    heading: Venetian Identity and the Trade Embargo
    char_start: 42968
    char_end: 43897
    why: Venice's legal case for exemption from the embargo, and the pope's lawyerly permission, dramatize
      the collision of faith and commercial necessity that structures the whole chapter.
  - id: crowley-city-of-fortune#u03-c3
    label: c3
    heading: The Blind Doge's Contested Reputation
    char_start: 45835
    char_end: 47222
    why: The sharply divergent contemporary judgments of Dandolo show him functioning as a projection
      screen for how Venice itself was perceived by allies and enemies.
  - id: crowley-city-of-fortune#u03-c4
    label: c4
    heading: The Contract of the Fourth Crusade
    char_start: 51423
    char_end: 52343
    why: The itemized quantities, prices, and terms are the clearest instance of Venice reducing a holy
      war to a priced, scheduled commercial contract.
  - id: crowley-city-of-fortune#u03-c5
    label: c5
    heading: Theater of Consent at St Mark's
    char_start: 56526
    char_end: 57097
    why: The staged emotional climax at St Mark's shows Venetian communal consent being manufactured through
      spectacle rather than debated.
  - id: crowley-city-of-fortune#u03-c6
    label: c6
    heading: The Secret Turn to Egypt
    char_start: 63752
    char_end: 63978
    why: Villehardouin's own confession exposes the gap between the crusade's public mandate and its planners'
      concealed commercial agenda, the fault line Crowley flags as the source of later disaster.
- nn: 4
  unit_id: ch03-thirty-four-thousand-marks
  note_id: crowley-city-of-fortune-ch03-thirty-four-thousand-marks
  span: 68119:91153
  chunks:
  - id: crowley-city-of-fortune#u04-c1
    label: c1
    heading: Provisioning by the numbers
    char_start: 71178
    char_end: 71982
    why: Shows Venetian state capacity for quantified, standardized logistics at civilizational scale,
      a vivid instance of legibility as governing technology.
  - id: crowley-city-of-fortune#u04-c2
    label: c2
    heading: Dandolo's ultimatum
    char_start: 76390
    char_end: 77085
    why: Captures Dandolo weaponizing the contract against the crusader lords, the moment mercantile logic
      overrides crusading solidarity.
  - id: crowley-city-of-fortune#u04-c3
    label: c3
    heading: Two options
    char_start: 81126
    char_end: 81773
    why: 'The pivotal decision point: Dandolo invents the deferred-debt formula that saves the crusade
      and sets its future course.'
  - id: crowley-city-of-fortune#u04-c4
    label: c4
    heading: The false drawers
    char_start: 84183
    char_end: 85845
    why: Crowley's explicit disclosure of the secret Zara deal hidden behind the public deferment agreement,
      defying papal warning.
  - id: crowley-city-of-fortune#u04-c5
    label: c5
    heading: Dandolo takes the cross
    char_start: 82579
    char_end: 83014
    why: The theatrical act of legitimation that reunites piety and Venetian commercial rescue at the
      moment of maximum crisis.
- nn: 5
  unit_id: ch04-dog-returning-to-its-vomit
  note_id: crowley-city-of-fortune-ch04-dog-returning-to-its-vomit
  span: 91153:116745
  chunks:
  - id: crowley-city-of-fortune#u05-c1
    label: c1
    heading: Dandolo defies the pope at Zara
    char_start: 94911
    char_end: 95365
    why: Shows Dandolo openly subordinating papal religious authority to Venice's contractual claim on
      Zara, the chapter's clearest statement of Venetian priorities.
  - id: crowley-city-of-fortune#u05-c2
    label: c2
    heading: The Angelus proposal's terms
    char_start: 102980
    char_end: 103582
    why: The exact bargain that redirects the crusade to Constantinople, combining religious, financial,
      and military inducements.
  - id: crowley-city-of-fortune#u05-c3
    label: c3
    heading: Innocent's 'dog returning to its vomit'
    char_start: 114897
    char_end: 115447
    why: The chapter's title line and the peak of papal condemnation, delivered even as papal control
      visibly fails.
  - id: crowley-city-of-fortune#u05-c4
    label: c4
    heading: Staged reconciliation at Corfu
    char_start: 112267
    char_end: 112926
    why: Illustrates elite emotional theater used to override rank-and-file dissent and hold the fracturing
      crusade together.
  - id: crowley-city-of-fortune#u05-c5
    label: c5
    heading: Robert of Clari's plain objection
    char_start: 111710
    char_end: 111935
    why: Gives the rank-and-file counter-voice to the leadership's Constantinople scheme in the crusaders'
      own idiom.
  - id: crowley-city-of-fortune#u05-c6
    label: c6
    heading: Innocent's admission of lost control
    char_start: 116496
    char_end: 116710
    why: The nominal supreme authority conceding that events have outrun any single actor's intent, closing
      the chapter's arc of collapsing control.
- nn: 6
  unit_id: ch05-at-the-walls
  note_id: crowley-city-of-fortune-ch05-at-the-walls
  span: 116745:155165
  chunks:
  - id: crowley-city-of-fortune#u06-c1
    label: c1
    heading: Walls unbreached, navy sold for scrap
    char_start: 118137
    char_end: 118834
    why: Shows the empire's formidable defensive facade concealing hollowed-out institutional competence,
      a decay-sequence dynamic at civilizational scale.
  - id: crowley-city-of-fortune#u06-c2
    label: c2
    heading: Dandolo orders his galley ashore
    char_start: 136144
    char_end: 137088
    why: 'The chapter''s dramatic and causal hinge: a single contingent act that Crowley flags as decisive
      for the whole assault.'
  - id: crowley-city-of-fortune#u06-c3
    label: c3
    heading: Contingency becomes legend
    char_start: 137093
    char_end: 138306
    why: Explicitly narrates how a near-failure was retrospectively mythologized into Venice's founding
      heroic image, bearing on history-machine style historiography.
  - id: crowley-city-of-fortune#u06-c4
    label: c4
    heading: The fire that gutted the city
    char_start: 139394
    char_end: 140641
    why: The pivotal act of destruction that both secures the crusader beachhead and turns the populace
      against Alexius III, driving the political collapse.
  - id: crowley-city-of-fortune#u06-c5
    label: c5
    heading: The throne falls vacant
    char_start: 146095
    char_end: 147305
    why: Captures the collapse of Alexius III's legitimacy and the improvised, unstable restoration that
      follows — the chapter's Gramsci-gap moment.
- nn: 7
  unit_id: ch06-four-emperors
  note_id: crowley-city-of-fortune-ch06-four-emperors
  span: 155165:182556
  chunks:
  - id: crowley-city-of-fortune#u07-c1
    label: c1
    heading: The Great Fire
    char_start: 157358
    char_end: 158113
    why: Establishes the fire as the irreversible turning point that poisons Greek-Latin relations beyond
      repair.
  - id: crowley-city-of-fortune#u07-c2
    label: c2
    heading: Dandolo's curse
    char_start: 167362
    char_end: 167920
    why: The doge's furious personal ultimatum marks the final rupture of the crusader-Byzantine alliance
      and opens formal war.
  - id: crowley-city-of-fortune#u07-c3
    label: c3
    heading: 'The coup: four emperors at once'
    char_start: 173768
    char_end: 174632
    why: 'The literal moment of the chapter''s title: legitimate imperial authority fragments into four
      rival claimants simultaneously.'
  - id: crowley-city-of-fortune#u07-c4
    label: c4
    heading: The murder of Alexius IV
    char_start: 178757
    char_end: 179549
    why: Shows regicide framed simultaneously as brute instrumental necessity and as moralized atrocity
      in the competing sources.
  - id: crowley-city-of-fortune#u07-c5
    label: c5
    heading: Constantinople becomes Jerusalem
    char_start: 181433
    char_end: 182554
    why: Captures the manufactured theological rationale that converts material desperation into a licensed
      holy war against fellow Christians.
- nn: 8
  unit_id: ch07-the-works-of-hell
  note_id: crowley-city-of-fortune-ch07-the-works-of-hell
  span: 182556:225769
  chunks:
  - id: crowley-city-of-fortune#u08-c1
    label: c1
    heading: Durboise's improbable breach
    char_start: 192941
    char_end: 193867
    why: The tactical turning point of the whole siege, hinging on one soldier's survival and nerve rather
      than strategy or numbers.
  - id: crowley-city-of-fortune#u08-c2
    label: c2
    heading: The tragic misunderstanding
    char_start: 201918
    char_end: 202332
    why: 'Names in one paragraph the chapter''s central analytic point: two civilizational sign-systems
      reading the same gesture as opposite meanings.'
  - id: crowley-city-of-fortune#u08-c3
    label: c3
    heading: Choniates's cry of pain
    char_start: 203284
    char_end: 203860
    why: The eyewitness pivot from siege chronicle to elegy that governs the tone of everything that follows.
  - id: crowley-city-of-fortune#u08-c4
    label: c4
    heading: The stripping of Hagia Sophia
    char_start: 205530
    char_end: 206616
    why: The most concrete inventory of the sack's violence, fusing precise material destruction with
      atrocity in a single sentence rhythm.
  - id: crowley-city-of-fortune#u08-c5
    label: c5
    heading: Innocent's verdict and Venice's silence
    char_start: 223243
    char_end: 224083
    why: Source of the chapter's title and the moment the sack becomes a permanent historical scandal,
      paired with Venice's telling refusal to leave a record of its own part.
  - id: crowley-city-of-fortune#u08-c6
    label: c6
    heading: An empire gained overnight
    char_start: 225382
    char_end: 225767
    why: 'States the chapter''s payoff for Venice directly: an unplanned empire acquired through opportunism,
      setting up the book''s next phase.'
- nn: 9
  unit_id: ch08-a-quarter-and-half-a-quarter
  note_id: crowley-city-of-fortune-ch08-a-quarter-and-half-a-quarter
  span: 225769:256687
  chunks:
  - id: crowley-city-of-fortune#u09-c1
    label: c1
    heading: A merchant's fraction of empire
    char_start: 228686
    char_end: 229308
    why: 'States the chapter''s key conceit: Venice reduces imperial conquest to a precise mercantile
      fraction rather than a feudal title, revealing quantification as the Republic''s governing instinct.'
  - id: crowley-city-of-fortune#u09-c2
    label: c2
    heading: Modon and Coron, the Eyes of the Republic
    char_start: 233419
    char_end: 234012
    why: Shows the Stato da Mar functioning as a compulsory information-and-logistics network, the infrastructural
      core of Venice's sea empire.
  - id: crowley-city-of-fortune#u09-c3
    label: c3
    heading: Where no Venetian writ ran
    char_start: 237959
    char_end: 238371
    why: Identifies the durable geographic limit of Venetian control on Crete, a refuge zone that centuries
      of repression never closed.
  - id: crowley-city-of-fortune#u09-c4
    label: c4
    heading: Sanudo's private conquest of Naxos
    char_start: 245168
    char_end: 245761
    why: Exemplifies the privatized, uncoordinated frontier expansion Venice tolerated in the Aegean rather
      than administer directly itself.
  - id: crowley-city-of-fortune#u09-c5
    label: c5
    heading: Venice morphing into Constantinople
    char_start: 252843
    char_end: 253797
    why: Captures the silent, cumulative process by which Venice absorbed Byzantine imperial identity
      and ceremony into its own self-image.
  - id: crowley-city-of-fortune#u09-c6
    label: c6
    heading: The Marriage of the Sea
    char_start: 254372
    char_end: 255346
    why: The Senza ceremony is Venice's ritual claim of dominion over the sea itself, the sacred counterpart
      to its commercial network of ports.
- nn: 10
  unit_id: ch09-demand-and-supply
  note_id: crowley-city-of-fortune-ch09-demand-and-supply
  span: 256687:289844
  chunks:
  - id: crowley-city-of-fortune#u10-c1
    label: c1
    heading: Sacchetti's donkeys and pigs
    char_start: 258217
    char_end: 258662
    why: The folk-fable Crowley uses to frame the whole chapter's contrast between Genoese individualism
      and Venetian collectivism.
  - id: crowley-city-of-fortune#u10-c2
    label: c2
    heading: Genoa's individualist genius
    char_start: 258756
    char_end: 260277
    why: States the chapter's core thesis that Genoa's decentralized, private-enterprise model drove its
      innovations, in contrast to Venice's communal state control.
  - id: crowley-city-of-fortune#u10-c3
    label: c3
    heading: The Treaty of Nymphaion
    char_start: 271295
    char_end: 272626
    why: The pivotal diplomatic deal by which Genoa traded naval support for Venetian trading rights,
      setting up the fall of Latin Constantinople and Byzantium's long-term naval dependency.
  - id: crowley-city-of-fortune#u10-c4
    label: c4
    heading: Venice's grain bureaucracy
    char_start: 280066
    char_end: 281232
    why: Documents Venice's state apparatus for quantifying and controlling grain supply, an early instance
      of legibility-driven governance underpinning survival and commerce.
  - id: crowley-city-of-fortune#u10-c5
    label: c5
    heading: Spices as the first world commodity
    char_start: 283308
    char_end: 283906
    why: Explains why spices became the paradigmatic long-distance trade good, framing the economic stakes
      underlying the Venice-Genoa contest for eastern ports.
  - id: crowley-city-of-fortune#u10-c6
    label: c6
    heading: The fall of Acre, 1291
    char_start: 286789
    char_end: 287397
    why: The climactic scene of the crusader states' extinction, the event that redirects the Venetian-Genoese
      rivalry toward the Bosphorus and Black Sea.
- nn: 11
  unit_id: ch10-in-the-jaws-of-our-enemies
  note_id: crowley-city-of-fortune-ch10-in-the-jaws-of-our-enemies
  span: 289844:330313
  chunks:
  - id: crowley-city-of-fortune#u11-c1
    label: c1
    heading: The Bosphorus as a two-sea lock
    char_start: 291041
    char_end: 291488
    why: States the chapter's controlling geographic metaphor — the strait as a lock whose 1204 opening
      reorganizes the whole medieval trading world.
  - id: crowley-city-of-fortune#u11-c2
    label: c2
    heading: The Pax Mongolica opens a highway to Asia
    char_start: 295169
    char_end: 296331
    why: Shows how Mongol conquest produced, as an unintended byproduct, a legible and safe trans-Eurasian
      trade corridor that both republics raced to exploit.
  - id: crowley-city-of-fortune#u11-c3
    label: c3
    heading: 'Tana: ‘in the jaws of our enemies’'
    char_start: 309602
    char_end: 310253
    why: The senate's own phrase captures the structural fragility of the forward trading post that later
      collapses catastrophically.
  - id: crowley-city-of-fortune#u11-c4
    label: c4
    heading: The Black Sea slave trade
    char_start: 312276
    char_end: 313449
    why: Documents the routine, bureaucratized slave trade as an ordinary component of Black Sea commercial
      infrastructure alongside grain and silk.
  - id: crowley-city-of-fortune#u11-c5
    label: c5
    heading: Plague catapulted into Caffa
    char_start: 323433
    char_end: 324302
    why: 'The chapter''s pivot: the contemporary account of the siege event credited with launching the
      Black Death''s westward transmission.'
  - id: crowley-city-of-fortune#u11-c6
    label: c6
    heading: 'Trade''s dark cargo: plague from the same routes as wealth'
    char_start: 327629
    char_end: 328149
    why: States explicitly the chapter's central irony — the connectivity and risk-taking that built Venetian
      wealth is what carried the plague home.
- nn: 12
  unit_id: ch11-the-flag-of-st-titus
  note_id: crowley-city-of-fortune-ch11-the-flag-of-st-titus
  span: 330313:374117
  chunks:
  - id: crowley-city-of-fortune#u12-c1
    label: c1
    heading: The Battle of the Bosphorus, 1352
    char_start: 336713
    char_end: 338317
    why: The chapter's central set-piece rendering naval war as pure unstrategized chaos decided by luck
      and weather, not command.
  - id: crowley-city-of-fortune#u12-c2
    label: c2
    heading: Plague-driven fraying of Venetian solidarity
    char_start: 333331
    char_end: 333993
    why: Identifies the Black Death as the trigger for a class rift that erodes the civic cohesion underwriting
      Venetian naval power.
  - id: crowley-city-of-fortune#u12-c3
    label: c3
    heading: The vocabulary of Venetian taxation
    char_start: 346058
    char_end: 347330
    why: Documents the granular, universalizing extractive apparatus applied to Crete that directly triggers
      the 1363 revolt.
  - id: crowley-city-of-fortune#u12-c4
    label: c4
    heading: 'St Mark or St Titus: the flag raised upside down'
    char_start: 353396
    char_end: 354088
    why: The symbolic pivot of the revolt, marking the old order's legitimacy visibly rupturing before
      any new order is settled.
  - id: crowley-city-of-fortune#u12-c5
    label: c5
    heading: Crete conquering the conquerors
    char_start: 352854
    char_end: 353193
    why: States directly the hybridization of Venetian colonial identity that makes this revolt unlike
      all prior Cretan uprisings.
  - id: crowley-city-of-fortune#u12-c6
    label: c6
    heading: Milletus kills his closest friend
    char_start: 363534
    char_end: 364170
    why: Vivid dialogue showing ideology (religion and liberty) overriding personal loyalty during the
      revolt's factional terror.
- nn: 13
  unit_id: ch12-bridling-st-mark
  note_id: crowley-city-of-fortune-ch12-bridling-st-mark
  span: 374117:414737
  chunks:
  - id: crowley-city-of-fortune#u13-c1
    label: c1
    heading: 'Doria''s ultimatum: bridle the horses of St Mark'
    char_start: 406917
    char_end: 407672
    why: Doria's rejection of Venice's blank peace offer reframes the war as a contest over Venice's civic
      symbol and survival itself, giving the chapter its title.
  - id: crowley-city-of-fortune#u13-c2
    label: c2
    heading: The forced battle at Pola
    char_start: 391661
    char_end: 392590
    why: Shows sound tactical judgment overridden by honor-shame social pressure, the proximate cause
      of the Venetian fleet's near-total destruction.
  - id: crowley-city-of-fortune#u13-c3
    label: c3
    heading: The bridge at Chioggia burns
    char_start: 404508
    char_end: 405383
    why: The pivotal tactical moment when Chioggia's defense collapses, bringing the Genoese-led coalition
      within twelve miles of St Mark's Square.
  - id: crowley-city-of-fortune#u13-c4
    label: c4
    heading: Erasing the lagoon's legibility
    char_start: 398860
    char_end: 399141
    why: A deliberate inversion of legibility as a defensive weapon, unmapping the very infrastructure
      that normally underwrote Venetian commercial and naval control.
  - id: crowley-city-of-fortune#u13-c5
    label: c5
    heading: The people demand Pisani
    char_start: 409039
    char_end: 410509
    why: Exposes the class tension beneath Venice's patriotic unity, as popular loyalty to a commander
      forces the aristocratic senate to reverse its own judicial sentence.
- nn: 14
  unit_id: ch13-fight-to-the-finish
  note_id: crowley-city-of-fortune-ch13-fight-to-the-finish
  span: 414737:446700
  chunks:
  - id: crowley-city-of-fortune#u14-c1
    label: c1
    heading: Pisani's counter-siege plan
    char_start: 421281
    char_end: 421852
    why: 'States the tactical reversal that turns the entire siege: Venice traps the besiegers by sealing
      Chioggia''s three exits.'
  - id: crowley-city-of-fortune#u14-c2
    label: c2
    heading: Opening the nobility under duress
    char_start: 418969
    char_end: 419476
    why: Shows Venice's institutions bending formally, via decree, to metabolize existential crisis rather
      than abandoning legibility.
  - id: crowley-city-of-fortune#u14-c3
    label: c3
    heading: Carlo Zeno's near-death
    char_start: 427979
    char_end: 428894
    why: The unit's centerpiece of individual heroism, later explicitly subordinated to the chapter's
      institutional thesis.
  - id: crowley-city-of-fortune#u14-c4
    label: c4
    heading: Horror at the Little Chioggia bridge
    char_start: 434678
    char_end: 435278
    why: The war's most graphic atrocity and the direct cause of Genoa's subsequent morale collapse at
      Brondolo.
  - id: crowley-city-of-fortune#u14-c5
    label: c5
    heading: Why Venice outlasted Genoa
    char_start: 445494
    char_end: 446266
    why: The chapter's explicit thesis sentence, crediting institutional durability and civic cohesion
      over battlefield superiority.
- nn: 15
  unit_id: ch14-stato-da-mar
  note_id: crowley-city-of-fortune-ch14-stato-da-mar
  span: 446700:486178
  chunks:
  - id: crowley-city-of-fortune#u15-c1
    label: c1
    heading: The senate's cost-benefit imperialism
    char_start: 448523
    char_end: 449612
    why: States in the Republic's own words the corporate, calculating logic driving the second wave of
      expansion.
  - id: crowley-city-of-fortune#u15-c2
    label: c2
    heading: Policing against 'going native'
    char_start: 463398
    char_end: 464703
    why: Shows the anxious racial and cultural boundary-maintenance underlying Venetian colonial rule.
  - id: crowley-city-of-fortune#u15-c3
    label: c3
    heading: The documentary audit state
    char_start: 465971
    char_end: 467054
    why: The clearest statement of Venice's obsessive, legibility-driven system of institutional oversight
      and accountability.
  - id: crowley-city-of-fortune#u15-c4
    label: c4
    heading: Arresting the Duke of Crete
    char_start: 469913
    char_end: 471174
    why: A vivid, verbatim operational order showing the audit state's reach and ruthlessness in practice,
      not just theory.
  - id: crowley-city-of-fortune#u15-c5
    label: c5
    heading: Profit, honour, and the imperial body
    char_start: 484369
    char_end: 485269
    why: Closing statement of the empire's ideology, figuring colonies as literal organs of the Venetian
      body politic.
- nn: 16
  unit_id: ch15-like-water-in-a-fountain
  note_id: crowley-city-of-fortune-ch15-like-water-in-a-fountain
  span: 486178:530491
  chunks:
  - id: crowley-city-of-fortune#u16-c1
    label: c1
    heading: The Portal to Alexandria
    char_start: 486904
    char_end: 487871
    why: Establishes the chapter's governing image of controlled, surveilled entry into foreign trade
      territory via signal flags, carrier pigeons, and searched cargo.
  - id: crowley-city-of-fortune#u16-c2
    label: c2
    heading: The City Was a Merchant Guild
    char_start: 491702
    char_end: 493133
    why: States the chapter's core claim that Venice was not a state with merchants but a state constituted
      as a commercial instrument.
  - id: crowley-city-of-fortune#u16-c3
    label: c3
    heading: 'Muda: The Meshing Mechanism of World Trade'
    char_start: 497177
    char_end: 498326
    why: The chapter's most explicit machine metaphor, describing decentralized seasonal cycles meshing
      into one functioning world-system.
  - id: crowley-city-of-fortune#u16-c4
    label: c4
    heading: Patience Over the Sword
    char_start: 510955
    char_end: 512302
    why: Documents the sultan's contempt for Venetian power alongside Venice's characteristic strategy
      of diplomatic patience rather than retaliation.
  - id: crowley-city-of-fortune#u16-c5
    label: c5
    heading: Wealth Flows Like Water in a Fountain
    char_start: 525725
    char_end: 526770
    why: Gives the chapter its title and summarizes the Rialto's function as the funnel-point of a trade
      network spanning Sweden to China.
  - id: crowley-city-of-fortune#u16-c6
    label: c6
    heading: Barbaro's Rubbish Tip
    char_start: 529479
    char_end: 530489
    why: Closing anecdote that ironically undercuts the chapter's portrait of Venetian calculation with
      a story of near-miss failure.
- nn: 17
  unit_id: ch16-city-of-neptune
  note_id: crowley-city-of-fortune-ch16-city-of-neptune
  span: 530491:575697
  chunks:
  - id: crowley-city-of-fortune#u17-c1
    label: c1
    heading: Mercury and Neptune preside over the map
    char_start: 533057
    char_end: 533702
    why: Names the map's propagandistic divine sanction of Venetian sea power, the chapter's central image
      later undercut by the closing revelation of hidden decline.
  - id: crowley-city-of-fortune#u17-c2
    label: c2
    heading: The arsenal's assembly-line discipline
    char_start: 535924
    char_end: 537541
    why: States directly the arsenal's proto-industrial standardization and quality control, the chapter's
      clearest instance of a pre-modern legibility machine.
  - id: crowley-city-of-fortune#u17-c3
    label: c3
    heading: Tafur watches galleys equipped in hours
    char_start: 540748
    char_end: 541355
    why: Eyewitness verification of the arsenal's assembly-line capacity, the chapter's most vivid demonstration
      of Venetian industrial legibility in action.
  - id: crowley-city-of-fortune#u17-c4
    label: c4
    heading: The wreck of the Magna
    char_start: 546390
    char_end: 547611
    why: Shows the sea overwhelming the regulatory machine's safeguards, reducing a regulated crew to
      starvation and the edge of cannibalism.
  - id: crowley-city-of-fortune#u17-c5
    label: c5
    heading: Felix Fabri on the galley slaves
    char_start: 551130
    char_end: 552265
    why: The chapter's starkest firsthand account of the human cost borne by the underclass powering the
      maritime machine the map celebrates.
  - id: crowley-city-of-fortune#u17-c6
    label: c6
    heading: Triumph coinciding with hidden decline
    char_start: 575056
    char_end: 575695
    why: 'The chapter''s thesis statement: the moment of Venice''s most confident self-image is simultaneously
      revealed as the onset of its maritime decline.'
- nn: 18
  unit_id: ch17-the-glass-ball
  note_id: crowley-city-of-fortune-ch17-the-glass-ball
  span: 575697:604504
  chunks:
  - id: crowley-city-of-fortune#u18-c1
    label: c1
    heading: Manpower denial as naval strategy
    char_start: 578942
    char_end: 579349
    why: States explicitly Venice's calculated strategy of butchering skilled sailors to cripple Ottoman
      naval capacity rather than mere battlefield brutality.
  - id: crowley-city-of-fortune#u18-c2
    label: c2
    heading: The glass ball metaphor
    char_start: 585367
    char_end: 585623
    why: The chapter's titular metaphor, encapsulating Venice's entire method of managing an ascendant,
      unpredictable power.
  - id: crowley-city-of-fortune#u18-c3
    label: c3
    heading: Two empires, polar opposites
    char_start: 582470
    char_end: 582846
    why: Crowley's clearest statement of the structural, civilizational contrast driving the whole Venetian-Ottoman
      relationship.
  - id: crowley-city-of-fortune#u18-c4
    label: c4
    heading: The news reaches Venice
    char_start: 603272
    char_end: 603851
    why: The emotional climax of the unit, an eyewitness scene of collective grief at the fall of Constantinople
      reaching the Rialto.
  - id: crowley-city-of-fortune#u18-c5
    label: c5
    heading: Pragmatism after the sack
    char_start: 604290
    char_end: 604502
    why: 'The closing sentence delivers the chapter''s thesis in miniature: commercial continuity trumps
      civilizational or religious loyalty.'
- nn: 19
  unit_id: ch18-the-shield-of-christendom
  note_id: crowley-city-of-fortune-ch18-the-shield-of-christendom
  span: 604504:628592
  chunks:
  - id: crowley-city-of-fortune#u19-c1
    label: c1
    heading: Languschi's portrait of Mehmet II
    char_start: 604807
    char_end: 606052
    why: The Venetian eyewitness character study that frames Mehmet's ambition and method for the whole
      chapter.
  - id: crowley-city-of-fortune#u19-c2
    label: c2
    heading: Peace never certain
    char_start: 607434
    char_end: 608211
    why: 'States the chapter''s operating premise: undeclared, permanent low-grade war beneath nominal
      peace.'
  - id: crowley-city-of-fortune#u19-c3
    label: c3
    heading: Fourteen attempts to poison the sultan
    char_start: 618575
    char_end: 619776
    why: Documents the covert assassination campaign that reveals Venetian statecraft beneath its diplomatic
      ritual.
  - id: crowley-city-of-fortune#u19-c4
    label: c4
    heading: The Florentine ambassador's accusation
    char_start: 625044
    char_end: 625340
    why: The rival Italian view that the crusade is cover for Venetian territorial ambition, puncturing
      its stated unity.
  - id: crowley-city-of-fortune#u19-c5
    label: c5
    heading: Pius's suppressed private verdict
    char_start: 626840
    char_end: 627227
    why: The pope's own censored cynicism about Venice shows the crusading rhetoric was not believed even
      by its chief sponsor.
  - id: crowley-city-of-fortune#u19-c6
    label: c6
    heading: Venice vindicated in retrospect
    char_start: 627296
    char_end: 627642
    why: Crowley's summary judgment that despite self-interest Venice's role as buffer was strategically
      correct, foreshadowing later disaster.
- nn: 20
  unit_id: ch19-if-negroponte-is-lost
  note_id: crowley-city-of-fortune-ch19-if-negroponte-is-lost
  span: 628592:667767
  chunks:
  - id: crowley-city-of-fortune#u20-c1
    label: c1
    heading: Mehmet's mastery of secrecy and disinformation
    char_start: 631124
    char_end: 632242
    why: Establishes Mehmet's information-warfare strategy against Venice's fragmented intelligence, the
      chapter's central asymmetry.
  - id: crowley-city-of-fortune#u20-c2
    label: c2
    heading: Longo's dispatch on the Ottoman armada
    char_start: 637318
    char_end: 638558
    why: Primary eyewitness testimony conveying the scale of the Ottoman fleet and Venice's urgent, unheeded
      plea for reinforcement.
  - id: crowley-city-of-fortune#u20-c3
    label: c3
    heading: The Schiavo conspiracy exposed and killed
    char_start: 644924
    char_end: 646230
    why: Shows the siege's internal front of betrayal and counter-espionage running alongside the bombardment.
  - id: crowley-city-of-fortune#u20-c4
    label: c4
    heading: Da Canal's fatal hesitation at the pontoon bridge
    char_start: 649087
    char_end: 650648
    why: 'The chapter''s dramatic and causal hinge: a single command failure that dooms Negroponte and
      is framed as the war''s decisive turning point.'
  - id: crowley-city-of-fortune#u20-c5
    label: c5
    heading: The massacre after Negroponte falls
    char_start: 652525
    char_end: 653645
    why: Conveys the human cost of the city's fall and Mehmet's deliberate, ritualized revenge, explaining
      the news's shattering impact in Venice.
  - id: crowley-city-of-fortune#u20-c6
    label: c6
    heading: Portuguese spies map the route around the Venetian monopoly
    char_start: 665791
    char_end: 666899
    why: 'The chapter''s closing pivot: an invisible, silently-assembling threat to Venice''s entire trading
      order, unfolding outside the frame Venice is watching.'
- nn: 21
  unit_id: ch20-pyramid-of-fire
  note_id: crowley-city-of-fortune-ch20-pyramid-of-fire
  span: 667767:696859
  chunks:
  - id: crowley-city-of-fortune#u21-c1
    label: c1
    heading: Gritti's coded intelligence from Constantinople
    char_start: 667795
    char_end: 668325
    why: Establishes the espionage apparatus through which Venice reads an otherwise opaque Ottoman buildup,
      the chapter's opening frame.
  - id: crowley-city-of-fortune#u21-c2
    label: c2
    heading: The hybrid carracks and the pivot in naval warfare
    char_start: 679215
    char_end: 680782
    why: Describes the quietly-assembled technological transition (galley to gunpowder carrack) that surfaces
      catastrophically at Zonchio, resonant with history-machine's silent-paradigm-assembly pattern.
  - id: crowley-city-of-fortune#u21-c3
    label: c3
    heading: The burning of Burak Reis's ship
    char_start: 690352
    char_end: 691365
    why: 'The chapter''s title image and emotional climax: the mid-battle explosion and immolation that
      defines Zonchio''s horror.'
  - id: crowley-city-of-fortune#u21-c4
    label: c4
    heading: Zonchio as systemic failure
    char_start: 692231
    char_end: 693096
    why: Crowley's explicit analytical verdict distinguishing a systemic institutional failure from a
      single commander's error.
  - id: crowley-city-of-fortune#u21-c5
    label: c5
    heading: Requisitioned galleys and fraying patriotism
    char_start: 676508
    char_end: 677577
    why: Shows the noble oligarchy's self-interest corroding collective defense before the battle, the
      root cause the postmortems later point to.
- nn: 22
  unit_id: ch21-hands-on-the-throat-of-venice
  note_id: crowley-city-of-fortune-ch21-hands-on-the-throat-of-venice
  span: 696859:724729
  chunks:
  - id: crowley-city-of-fortune#u22-c1
    label: c1
    heading: The show-trial of Antonio Grimani
    char_start: 698957
    char_end: 699676
    why: Captures the political theater of scapegoating a defeated admiral, including the new moral suspicion
      attached to wealth.
  - id: crowley-city-of-fortune#u22-c2
    label: c2
    heading: The fall of Modon
    char_start: 703543
    char_end: 704881
    why: Priuli's reaction frames Modon's loss not as a battle but as the severing of the Stato da Mar's
      logistical spine.
  - id: crowley-city-of-fortune#u22-c3
    label: c3
    heading: The vizier's verdict on the sea
    char_start: 707966
    char_end: 708304
    why: A single blunt exchange that crystallizes the transfer of Mediterranean naval dominance to the
      Ottomans.
  - id: crowley-city-of-fortune#u22-c4
    label: c4
    heading: Priuli's diary on the Cape route
    char_start: 712368
    char_end: 713377
    why: A contemporary eyewitness reasoning in real time toward the recognition that Venice's entire
      trading system has just been made obsolete.
  - id: crowley-city-of-fortune#u22-c5
    label: c5
    heading: Hand on the throat of Venice
    char_start: 716552
    char_end: 716990
    why: Supplies the chapter's title metaphor and states directly the slow strangulation thesis that
      organizes the whole unit.
  - id: crowley-city-of-fortune#u22-c6
    label: c6
    heading: Venice as the first virtual city
    char_start: 720163
    char_end: 721746
    why: The chapter's summary portrait of Venice's abstract, cash-based commercial machine, framing why
      its obsolescence mattered so much.
- nn: 23
  unit_id: epilogue
  note_id: crowley-city-of-fortune-epilogue
  span: 724729:730619
  chunks:
  - id: crowley-city-of-fortune#u23-c1
    label: c1
    heading: The long liquidation of the Stato da Mar
    char_start: 725457
    char_end: 726586
    why: 'States the epilogue''s core historical argument: empire ended not in one collapse but a two-century,
      colony-by-colony attrition, closing in Napoleon''s ritual conquest and public mourning.'
  - id: crowley-city-of-fortune#u23-c2
    label: c2
    heading: 'Smoke and shadows: an empire that knew its own impermanence'
    char_start: 726617
    char_end: 727845
    why: Crowley's clearest statement that Venice's maritime infrastructure was always provisional, physically
      surviving now mainly as decayed ruin rather than living function.
  - id: crowley-city-of-fortune#u23-c3
    label: c3
    heading: The magnetic pull of the city
    char_start: 728036
    char_end: 728588
    why: 'Articulates the epilogue''s psychological thesis: Venice as centrist empire held together not
      by administration but by the shared, potent fantasy of return.'
  - id: crowley-city-of-fortune#u23-c4
    label: c4
    heading: Arrivals as verdicts of fortune
    char_start: 728590
    char_end: 729520
    why: Compresses the book's recurring cast and theme of reversal-of-fortune into the single ritual
      moment of a ship's return to the quay.
  - id: crowley-city-of-fortune#u23-c5
    label: c5
    heading: Felix Fabri's homecoming, 1480
    char_start: 729521
    char_end: 730619
    why: 'The book''s closing passage: a single lived homecoming, bells and gilded campanile, ending on
      Fabri''s own words that even joyful return carries loss.'
